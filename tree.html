<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · lineage tree</title>
<style>
  :root {
    --bg: #0a0a0d; --panel: #111116; --ink: #e8e6df; --muted: #8a8a93;
    --line: #1f1f26; --accent: #c9a86a; --hot: #d76b5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 1rem 1.6rem 0.7rem;
    background: linear-gradient(180deg, rgba(10,10,13,0.95), rgba(10,10,13,0));
    z-index: 5;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  h1 { margin: 0; font-size: 1.0rem; font-weight: 600; letter-spacing: 0.04em; }
  header .meta {
    color: var(--muted); font-size: 0.82rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  header a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  header a:hover { color: var(--hot); border-color: var(--hot); }
  #stage { width: 100%; height: 100vh; display: block; }
  #tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: rgba(20, 20, 26, 0.96);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.7rem 0.9rem;
    max-width: 360px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.8rem;
    line-height: 1.5;
    display: none;
  }
  #tooltip .code { color: var(--accent); font-weight: 600; font-size: 0.95rem; }
  #tooltip .title { color: var(--ink); margin-top: 2px; }
  #tooltip .row   { margin-top: 6px; color: var(--muted); }
  #tooltip .row b { color: var(--ink); font-weight: 500; }
  #tooltip .tags  {
    margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px;
  }
  #tooltip .tag {
    background: rgba(201, 168, 106, 0.15); color: var(--accent);
    border: 1px solid rgba(201, 168, 106, 0.35);
    padding: 1px 6px; border-radius: 2px; font-size: 0.7rem;
  }
  #tooltip .influence {
    margin-top: 8px; padding-top: 6px;
    border-top: 1px dotted var(--line);
    color: #c9d2dc; font-style: italic; font-size: 0.78rem;
  }
  .legend {
    position: fixed; bottom: 0.8rem; left: 1.2rem; z-index: 5;
    color: var(--muted); font-size: 0.72rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: rgba(10,10,13,0.7);
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--line); border-radius: 3px;
  }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
  #ctx-menu {
    position: fixed; z-index: 20;
    background: rgba(17,17,22,0.97);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 0.25rem 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.8rem;
    display: none; min-width: 180px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.55);
  }
  #ctx-menu .ctx-title {
    padding: 0.35rem 0.9rem 0.3rem;
    color: var(--accent); font-weight: 600; font-size: 0.85rem;
    border-bottom: 1px solid var(--line);
  }
  #ctx-menu button {
    display: block; width: 100%;
    background: none; border: none; color: var(--ink);
    padding: 0.4rem 0.9rem; text-align: left;
    cursor: pointer; font-family: inherit; font-size: 0.8rem;
  }
  #ctx-menu button:hover { background: rgba(201,168,106,0.12); color: var(--accent); }
  #ctx-menu button.danger:hover { background: rgba(215,107,90,0.12); color: var(--hot); }
  #ctx-menu .sep { border-top: 1px solid var(--line); margin: 0.2rem 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · lineage tree</h1>
    <div class="meta"><span id="counts">…</span> · hover any node for details · click to open the piece</div>
  </div>
  <div class="meta"><a href="index.html">← gallery</a></div>
</header>
<svg id="stage"></svg>
<div id="tooltip"></div>
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-label">—</div>
  <button id="ctx-drop-node">Drop this node</button>
  <button id="ctx-drop-tree" class="danger">Drop entire subtree</button>
  <div class="sep"></div>
  <button id="ctx-restore">Restore subtree</button>
</div>
<div class="legend">
  <div class="row"><span class="swatch" style="background:#c9a86a"></span> seed (no parent)</div>
  <div class="row"><span class="swatch" style="background:#5b6e8f"></span> mutation</div>
  <div class="row"><span class="swatch" style="background:#48b09e"></span> user-directed</div>
  <div class="row"><span class="swatch" style="background:#aaaaaa; opacity:0.4"></span> dropped</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
/* ── subtree drop helpers ────────────────────────────────────────── */
const DISMISSED_KEY = 'particle_art_dismissed';

function getDismissed() {
  try { return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveDismissed(set) {
  localStorage.setItem(DISMISSED_KEY, JSON.stringify([...set]));
}

/** Return all descendant IDs of rootId (not including rootId itself). */
function getDescendants(rootId, allNodes) {
  const children = {};
  allNodes.forEach(n => {
    if (n.parent_id) {
      if (!children[n.parent_id]) children[n.parent_id] = [];
      children[n.parent_id].push(n.id);
    }
  });
  const result = [];
  const queue = [rootId];
  while (queue.length) {
    const cur = queue.shift();
    (children[cur] || []).forEach(child => { result.push(child); queue.push(child); });
  }
  return result;
}

/** Drop rootId and all its descendants into localStorage dismissed set. */
function dropSubtree(rootId, allNodes) {
  const dismissed = getDismissed();
  dismissed.add(rootId);
  getDescendants(rootId, allNodes).forEach(id => dismissed.add(id));
  saveDismissed(dismissed);
}

/** Drop only this single node (not descendants). */
function dropNode(id) {
  const dismissed = getDismissed();
  dismissed.add(id);
  saveDismissed(dismissed);
}

/** Restore rootId and all its descendants from the dismissed set. */
function restoreSubtree(rootId, allNodes) {
  const dismissed = getDismissed();
  dismissed.delete(rootId);
  getDescendants(rootId, allNodes).forEach(id => dismissed.delete(id));
  saveDismissed(dismissed);
}

async function load(){
  const [lineage, prefs] = await Promise.all([
    fetch('lineage.json',          { cache: 'no-cache' }).then(r => r.json()),
    fetch('scripts/preferences.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({marks:{}}))
  ]);

  const marks = prefs.marks || {};

  // hydrate per-piece meta to enrich tooltips (best-effort; fail silently if missing)
  const enrichments = {};
  await Promise.all(lineage.pieces.map(async p => {
    try {
      const m = await fetch(`pieces/${p.id}/meta.json`, { cache: 'no-cache' }).then(r => r.json());
      enrichments[p.id] = m;
    } catch(e) {}
  }));

  const stage = document.getElementById('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  const svg = d3.select(stage).attr('viewBox', `0 0 ${w} ${h}`);
  const g = svg.append('g');

  // pan + zoom
  svg.call(d3.zoom().scaleExtent([0.4, 4]).on('zoom', e => g.attr('transform', e.transform)));

  // build node + link arrays
  const dismissed = getDismissed();
  const nodes = lineage.pieces.map(p => ({
    ...p,
    enrich: enrichments[p.id] || {},
    mark: marks[p.id] || {},
    dropped: dismissed.has(p.id) || !!(marks[p.id] || {}).drop
  }));
  const links = (lineage.edges || []).map(e => ({
    source: e.from, target: e.to, directive: e.directive
  }));

  // descendant count (for size)
  const descCount = {};
  nodes.forEach(n => { descCount[n.id] = 0; });
  nodes.forEach(n => {
    let cur = n.parent_id;
    const seen = new Set();
    while (cur && !seen.has(cur)){
      if (cur in descCount) descCount[cur] += 1;
      seen.add(cur);
      const par = nodes.find(x => x.id === cur);
      cur = par ? par.parent_id : null;
    }
  });

  function nodeColor(n){
    if (n.dropped) return '#555';
    if ((n.enrich.mutation_directive_id || '').startsWith('user-')) return '#48b09e';
    if (!n.parent_id) return '#c9a86a';   // seed
    return '#5b6e8f';                       // mutation
  }
  function nodeRadius(n){
    if (n.dropped) return 7;
    return 9 + Math.min(18, Math.sqrt(descCount[n.id] || 0) * 5);
  }
  function nodeOpacity(n){
    return n.dropped ? 0.28 : 1.0;
  }

  function refreshNode(d) {
    const dismissed = getDismissed();
    d.dropped = dismissed.has(d.id) || !!d.mark.drop;
    d3.select(`[data-id="${d.id}"] circle`)
      .attr('fill', nodeColor(d))
      .attr('opacity', nodeOpacity(d))
      .attr('r', nodeRadius(d));
    d3.select(`[data-id="${d.id}"] text`)
      .attr('fill', d.dropped ? '#555' : '#0a0a0d')
      .style('text-decoration', d.dropped ? 'line-through' : 'none');
  }

  // force-directed layout
  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(110).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-220))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collide', d3.forceCollide().radius(d => nodeRadius(d) + 6));

  // arrow marker
  svg.append('defs').append('marker')
    .attr('id', 'arrow').attr('viewBox', '0 -4 8 8')
    .attr('refX', 12).attr('refY', 0)
    .attr('markerWidth', 6).attr('markerHeight', 6).attr('orient', 'auto')
    .append('path').attr('d', 'M0,-4L8,0L0,4').attr('fill', '#5b6e8f').attr('opacity', 0.6);

  const linkSel = g.append('g').selectAll('line').data(links).enter()
    .append('line')
    .attr('stroke', '#5b6e8f').attr('stroke-opacity', 0.45)
    .attr('stroke-width', 1.4)
    .attr('marker-end', 'url(#arrow)');

  const linkLabel = g.append('g').selectAll('text').data(links).enter()
    .append('text')
    .attr('font-size', '9px')
    .attr('fill', '#8a8a93')
    .attr('font-family', 'ui-monospace, monospace')
    .attr('text-anchor', 'middle')
    .attr('opacity', 0.75)
    .text(d => d.directive || '');

  const nodeSel = g.append('g').selectAll('g').data(nodes).enter().append('g')
    .attr('data-id', d => d.id)
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  nodeSel.append('circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => nodeColor(d))
    .attr('opacity', d => nodeOpacity(d))
    .attr('stroke', '#0a0a0d')
    .attr('stroke-width', 2);

  nodeSel.append('text')
    .text(d => d.id)
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('font-size', '11px')
    .attr('font-weight', '600')
    .attr('font-family', 'ui-monospace, monospace')
    .attr('fill', '#0a0a0d')
    .style('pointer-events', 'none');

  // tooltip
  const tip = document.getElementById('tooltip');
  function showTip(e, d){
    const enrich = d.enrich || {};
    const tags = (enrich.tags || []).slice(0, 6);
    const directives = (enrich.directives_in_lineage || []).slice(-3);
    const inputModality = enrich.input || d.input || '—';
    const stack = (enrich.stack || []).slice(0, 4).join(' · ');

    // best-effort artistic-influence extraction from tags / directive
    const channelTag = (tags.find(t => t.startsWith('channel:')) || '').replace('channel:', '');
    const conceptTag = (tags.find(t => t.startsWith('concept_')) || '');
    let influence = '';
    if (channelTag) influence = 'channels ' + channelTag.replace(/_/g, ' ');
    else if (conceptTag) influence = 'engages ' + conceptTag.replace('concept_', '').replace(/_/g, ' ');
    else if (d.mark.note) influence = d.mark.note;

    tip.innerHTML = `
      <div class="code">${d.id}</div>
      <div class="title">${d.title || ''}</div>
      <div class="row"><b>direction</b> · ${d.direction || '—'}</div>
      <div class="row"><b>input</b> · ${inputModality}</div>
      <div class="row"><b>generation</b> · ${d.generation ?? 0} · <b>desc</b> · ${descCount[d.id] || 0}</div>
      ${stack ? `<div class="row"><b>stack</b> · ${stack}</div>` : ''}
      ${directives.length ? `<div class="row"><b>directives</b> · ${directives.join(' → ')}</div>` : ''}
      ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
      ${influence ? `<div class="influence">${influence}</div>` : ''}
    `;
    tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - 380, e.clientX + 12) + 'px';
    tip.style.top  = Math.min(window.innerHeight - 250, e.clientY + 12) + 'px';
  }
  function hideTip(){ tip.style.display = 'none'; }

  /* ── context menu wiring ── */
  const ctxMenu = document.getElementById('ctx-menu');
  const ctxLabel = document.getElementById('ctx-label');
  let ctxTarget = null;

  function closeCtx() { ctxMenu.style.display = 'none'; ctxTarget = null; }
  document.addEventListener('click', closeCtx);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtx(); });

  document.getElementById('ctx-drop-node').addEventListener('click', () => {
    if (!ctxTarget) return;
    dropNode(ctxTarget.id);
    ctxTarget.dropped = true;
    refreshNode(ctxTarget);
    updateCount();
    closeCtx();
  });

  document.getElementById('ctx-drop-tree').addEventListener('click', () => {
    if (!ctxTarget) return;
    dropSubtree(ctxTarget.id, nodes);
    const toDrop = [ctxTarget.id, ...getDescendants(ctxTarget.id, nodes)];
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    toDrop.forEach(id => { if (byId[id]) { byId[id].dropped = true; refreshNode(byId[id]); } });
    updateCount();
    closeCtx();
  });

  document.getElementById('ctx-restore').addEventListener('click', () => {
    if (!ctxTarget) return;
    restoreSubtree(ctxTarget.id, nodes);
    const toRestore = [ctxTarget.id, ...getDescendants(ctxTarget.id, nodes)];
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    toRestore.forEach(id => { if (byId[id]) { byId[id].dropped = false; refreshNode(byId[id]); } });
    updateCount();
    closeCtx();
  });

  function updateCount() {
    const active = nodes.filter(n => !n.dropped).length;
    document.getElementById('counts').textContent =
      `${nodes.length} pieces · ${links.length} edges · ${active} active`;
  }

  nodeSel
    .on('mouseover', showTip)
    .on('mousemove', showTip)
    .on('mouseout', hideTip)
    .on('contextmenu', (e, d) => {
      e.preventDefault();
      e.stopPropagation();
      hideTip();
      ctxTarget = d;
      ctxLabel.textContent = d.id + ' · ' + (d.direction || d.title || '');
      ctxMenu.style.display = 'block';
      ctxMenu.style.left = Math.min(window.innerWidth - 200, e.clientX) + 'px';
      ctxMenu.style.top  = Math.min(window.innerHeight - 140, e.clientY) + 'px';
    })
    .on('click', (e, d) => {
      closeCtx();
      window.open(`pieces/${d.id}/`, '_blank');
    });

  updateCount();

  sim.on('tick', () => {
    linkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    linkLabel
      .attr('x', d => (d.source.x + d.target.x) / 2)
      .attr('y', d => (d.source.y + d.target.y) / 2 - 4);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}
load();
</script>
</body>
</html>
