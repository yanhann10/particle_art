<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · lineage tree</title>
<style>
  :root {
    --bg:#0a0a0d; --panel:#111116; --ink:#e8e6df; --muted:#8a8a93;
    --line:#1f1f26; --accent:#c9a86a; --hot:#d76b5a;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
    overflow-y:scroll; overflow-x:auto;
    padding-bottom:64px; /* room for sticky footer */ }
  header {
    position:sticky; top:0;
    padding:0.9rem 1.6rem 0.7rem;
    background:rgba(10,10,13,0.97);
    border-bottom:1px solid var(--line);
    z-index:10; display:flex; justify-content:space-between; align-items:baseline;
    backdrop-filter:blur(6px);
  }
  h1 { margin:0; font-size:1.0rem; font-weight:600; letter-spacing:0.04em; }
  header .meta { color:var(--muted); font-size:0.82rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  header a { color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); }
  header a:hover { color:var(--hot); border-color:var(--hot); }
  #legend {
    padding:0.35rem 1.6rem;
    background:rgba(10,10,13,0.95);
    border-bottom:1px solid var(--line);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.75rem;
    color:var(--muted); display:flex; gap:1.4rem; align-items:center; flex-wrap:wrap;
  }
  #legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #stage { display:block; }
  /* sticky footer toggle */
  #drop-footer {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(10,10,13,0.97); border-top:1px solid var(--line);
    padding:0.55rem 1.6rem;
    display:flex; align-items:center; gap:1rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    color:var(--muted); backdrop-filter:blur(6px);
  }
  #drop-footer button {
    background:rgba(30,30,40,0.9); color:var(--muted);
    border:1px solid var(--line); border-radius:4px;
    padding:4px 14px; cursor:pointer;
    font-family:inherit; font-size:0.78rem;
    transition:border-color 0.15s, color 0.15s;
  }
  #drop-footer button:hover, #drop-footer button.active {
    border-color:var(--accent); color:var(--accent);
  }
  #tooltip {
    position:fixed; pointer-events:none; z-index:20;
    background:rgba(20,20,26,0.96); border:1px solid var(--line);
    border-radius:4px; padding:0.7rem 0.9rem; max-width:360px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    line-height:1.5; display:none;
  }
  #tooltip .code  { color:var(--accent); font-weight:600; font-size:0.95rem; }
  #tooltip .title { color:var(--ink); margin-top:2px; }
  #tooltip .row   { margin-top:6px; color:var(--muted); }
  #tooltip .row b { color:var(--ink); font-weight:500; }
  #tooltip .tags  { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
  #tooltip .tag   { background:rgba(201,168,106,0.15); color:var(--accent);
    border:1px solid rgba(201,168,106,0.35); padding:1px 6px;
    border-radius:2px; font-size:0.7rem; }
  #ctx-menu {
    position:fixed; z-index:30; background:rgba(17,17,22,0.97);
    border:1px solid var(--line); border-radius:4px; padding:0.25rem 0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    display:none; min-width:180px; box-shadow:0 6px 20px rgba(0,0,0,.55);
  }
  #ctx-menu .ctx-title { padding:0.35rem 0.9rem 0.3rem; color:var(--accent);
    font-weight:600; font-size:0.85rem; border-bottom:1px solid var(--line); }
  #ctx-menu button { display:block; width:100%; background:none; border:none;
    color:var(--ink); padding:0.4rem 0.9rem; text-align:left; cursor:pointer;
    font-family:inherit; font-size:0.8rem; }
  #ctx-menu button:hover { background:rgba(201,168,106,0.12); color:var(--accent); }
  #ctx-menu button.danger:hover { background:rgba(215,107,90,0.12); color:var(--hot); }
  #ctx-menu .sep { border-top:1px solid var(--line); margin:0.2rem 0; }
  #ctx-menu button.primary { color:var(--accent); }
  #ctx-menu button.primary:hover { background:rgba(201,168,106,0.18); }
  #toast {
    position:fixed; bottom:5rem; left:50%; transform:translateX(-50%);
    background:rgba(30,35,45,0.97); border:1px solid var(--accent);
    color:var(--accent); border-radius:4px; padding:0.45rem 1.1rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    z-index:50; pointer-events:none; opacity:0; transition:opacity 0.2s;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · lineage tree</h1>
    <div class="meta"><span id="counts">…</span> · hover for tooltip · right-click to act</div>
  </div>
  <div class="meta">
    <a href="index.html" style="font-size:0.9rem; padding:3px 10px; border:1px solid var(--accent); border-radius:3px; border-bottom:none;">⊞ gallery</a>
    <span style="margin-left:0.8rem; opacity:0.4">·</span>
    <a href="all.html" style="margin-left:0.8rem;">all pieces</a>
  </div>
</header>
<div id="legend">
  <span><span class="dot" style="background:#c9a86a"></span><span style="color:#c9a86a">encouraged</span> — system favors these branches</span>
  <span><span class="dot" style="background:#2a3a5a"></span> active</span>
  <span style="color:rgba(201,168,106,0.4)">── dashed gold</span><span> = cross-lineage (hybrid)</span>
  <span><span style="display:inline-block;width:28px;height:10px;border:1px solid rgba(201,168,106,0.6);border-radius:5px;vertical-align:middle;margin-right:4px;"></span> style group — right-click to drop</span>
</div>
<svg id="stage"></svg>
<div id="tooltip"></div>
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-label">—</div>
  <div id="ctx-piece-buttons">
    <button id="ctx-make-more" class="primary">Make more like this</button>
    <div class="sep"></div>
    <button id="ctx-drop-node">Drop this node</button>
    <button id="ctx-drop-tree" class="danger">Drop entire subtree</button>
    <div class="sep"></div>
    <button id="ctx-restore">Restore subtree</button>
  </div>
  <div id="ctx-group-buttons">
    <button id="ctx-drop-group" class="danger">Drop entire group</button>
  </div>
</div>
<div id="toast"></div>
<div id="drop-footer">
  <button id="toggleDropped">show dropped nodes</button>
  <button id="toggleCompact">compact view</button>
  <span id="drop-count-label"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
/* ── persistence helpers ─────────────────────────────────────────── */
const DISMISSED_KEY = 'particle_art_dismissed';
const FAVORITES_KEY  = 'particle_art_favorites';
function getDismissed(){try{return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY)||'[]'))}catch{return new Set()}}
function saveDismissed(s){localStorage.setItem(DISMISSED_KEY,JSON.stringify([...s]))}
function getFavorites(){try{return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'))}catch{return new Set()}}
function saveFavorites(s){localStorage.setItem(FAVORITES_KEY,JSON.stringify([...s]))}
function getDescendants(rootId,allNodes){
  const ch={};
  allNodes.forEach(n=>{if(n.parent_id){(ch[n.parent_id]=ch[n.parent_id]||[]).push(n.id)}});
  const res=[],q=[rootId];
  while(q.length){const c=q.shift();(ch[c]||[]).forEach(id=>{res.push(id);q.push(id)})}
  return res;
}
function dropSubtree(rootId,all){const d=getDismissed();d.add(rootId);getDescendants(rootId,all).forEach(id=>d.add(id));saveDismissed(d)}
function dropNode(id){const d=getDismissed();d.add(id);saveDismissed(d)}
function restoreSubtree(rootId,all){const d=getDismissed();d.delete(rootId);getDescendants(rootId,all).forEach(id=>d.delete(id));saveDismissed(d)}

/* ── state ───────────────────────────────────────────────────────── */
let showDropped = false;
let compactMode = false;
let lineageData = null, prefsData = null;

/* ── render ──────────────────────────────────────────────────────── */
function render(){
  const lineage = lineageData;
  const marks   = (prefsData||{}).marks || {};
  const dismissed = getDismissed();
  const favs      = getFavorites();

  /* ── descendant counts (over ALL pieces, for tooltip) ── */
  const descCount = {};
  lineage.pieces.forEach(n=>{descCount[n.id]=0});
  lineage.pieces.forEach(n=>{
    let cur=n.parent_id; const seen=new Set();
    while(cur&&!seen.has(cur)){if(cur in descCount)descCount[cur]++;seen.add(cur);
      const par=lineage.pieces.find(x=>x.id===cur);cur=par?par.parent_id:null}
  });

  /* ── annotate all pieces ── */
  const allPieces = lineage.pieces.map(p=>({
    ...p,
    dropped: dismissed.has(p.id)||!!(marks[p.id]||{}).drop,
    favored: favs.has(p.id),
    mark: marks[p.id]||{},
  }));
  const allById = Object.fromEntries(allPieces.map(p=>[p.id,p]));
  const byId    = allById;

  /* ── compute effective parent: skip over dropped ancestors ──
   * When a node is individually dropped, its children are promoted
   * to connect directly to the nearest non-dropped ancestor. */
  const activeIds = new Set(allPieces.filter(p=>!p.dropped).map(p=>p.id));
  function effectiveParent(piece){
    let cur=piece.parent_id;
    while(cur && !activeIds.has(cur)){
      cur=allById[cur]?.parent_id||null;
    }
    return cur||null;
  }

  /* ── which pieces appear in layout ── */
  let cleanPieces;
  if(showDropped){
    /* show everything; apply orphan filter for data integrity only */
    cleanPieces=allPieces;
    let prevSize=-1;
    while(cleanPieces.length!==prevSize){
      prevSize=cleanPieces.length;
      const ids=new Set(cleanPieces.map(p=>p.id));
      cleanPieces=cleanPieces.filter(p=>!p.parent_id||ids.has(p.parent_id));
    }
  } else {
    /* show only active pieces; dropped ones silently removed,
     * their children re-attached via effectiveParent */
    cleanPieces=allPieces.filter(p=>!p.dropped);
  }
  const knownIds=new Set(cleanPieces.map(p=>p.id));

  /* ── cross edges (hybrid connections) ── */
  const primaryParent={};
  cleanPieces.forEach(p=>{
    primaryParent[p.id]=showDropped?(p.parent_id||null):effectiveParent(p);
  });
  const crossEdges=(lineage.edges||[]).filter(e=>
    knownIds.has(e.from)&&knownIds.has(e.to)&&primaryParent[e.to]!==e.from
  );

  /* ── group nodes: fine-grained similarity clustering ──────────────────
     Rules:
       1. group highly similar siblings (same style_key → same group)
       2. avoid large groups: if a style_key bucket > SUB_THRESHOLD,
          sub-split by direction-family into ≤2 sub-groups
       3. singletons (only 1 sibling with a style_key) connect directly
     Applies to any parent with > GROUP_THRESHOLD active children.       */
  const GROUP_THRESHOLD = 6;
  const SUB_THRESHOLD   = 6;
  const MIN_BUCKET_SIZE = 2;
  const GHALF = 45;   /* half-width of group pill (wider than piece HALF=33) */

  function dirFamily(dir){
    if(!dir) return 'other';
    const d=dir.toLowerCase();
    if(d.includes('attractor'))                         return 'attractor';
    if(d.includes('growth'))                            return 'growth';
    if(d.includes('lsystem')||d.includes('l-system'))   return 'lsystem';
    if(d.includes('point-cloud')||d.includes('cloud'))  return 'cloud';
    if(d.includes('audio'))                             return 'audio';
    if(d.includes('boid')||d.includes('biological'))    return 'systems';
    if(d.includes('morph'))                             return 'morph';
    return 'other';
  }
  function bucketLabel(sk){
    if(!sk||sk==='other') return 'other';
    if(sk.startsWith('channel:')){ const n=sk.slice(8).replace(/_/g,' '); return n.length>16?n.slice(0,14)+'…':n; }
    if(sk.startsWith('mode:'))    return sk.slice(5);
    const c=sk.replace(/_/g,' ');
    return c.length>16?c.slice(0,14)+'…':c;
  }

  /* count active children per parent */
  const activeChildCount={};
  cleanPieces.forEach(p=>{
    const par=showDropped?(p.parent_id||null):effectiveParent(p);
    if(par) activeChildCount[par]=(activeChildCount[par]||0)+1;
  });

  /* pass 1: bucket siblings by style_key for large parents */
  const rawBuckets={};   /* key → {parId,sk,pieces:[]} */
  cleanPieces.forEach(p=>{
    const par=showDropped?(p.parent_id||null):effectiveParent(p);
    if(!par||(activeChildCount[par]||0)<=GROUP_THRESHOLD) return;
    const sk=p.style_key||'other';
    const key=`${par}|||${sk}`;
    if(!rawBuckets[key]) rawBuckets[key]={parId:par,sk,pieces:[]};
    rawBuckets[key].pieces.push(p);
  });

  /* pass 2: materialise group nodes; sub-split oversized buckets by dirFamily */
  const groupNodes={};
  const pieceToGroup={};
  Object.values(rawBuckets).forEach(({parId,sk,pieces})=>{
    if(pieces.length<MIN_BUCKET_SIZE) return;   /* singleton: direct edge */
    if(pieces.length>SUB_THRESHOLD){
      /* sub-split by direction family */
      const subMap={};
      pieces.forEach(p=>{ const f=dirFamily(p.direction||''); (subMap[f]=subMap[f]||[]).push(p); });
      const families=Object.keys(subMap);
      if(families.length>1){
        families.forEach(fam=>{
          const sub=subMap[fam];
          if(sub.length<MIN_BUCKET_SIZE) return;
          const gid=`${parId}__grp__${sk}__${fam}`;
          groupNodes[gid]={id:gid,label:`${bucketLabel(sk)} · ${fam}`,parent_id:parId,childIds:sub.map(p=>p.id),style_key:sk,is_group:true};
          sub.forEach(p=>{pieceToGroup[p.id]=gid;});
        });
        return;
      }
    }
    /* single group for this bucket */
    const gid=`${parId}__grp__${sk}`;
    groupNodes[gid]={id:gid,label:bucketLabel(sk),parent_id:parId,childIds:pieces.map(p=>p.id),style_key:sk,is_group:true};
    pieces.forEach(p=>{pieceToGroup[p.id]=gid;});
  });

  const groupNodesList=Object.values(groupNodes);
  const allGroupIds=new Set(Object.keys(groupNodes));

  /* ── compact mode: collapse leaf children into parent badge (skip grouped leaves) ── */
  const childCount={};
  cleanPieces.forEach(p=>{childCount[p.id]=0});
  cleanPieces.forEach(p=>{
    const par=showDropped?(p.parent_id||null):effectiveParent(p);
    if(par && par in childCount) childCount[par]++;
  });
  const collapsedLeaves={};
  let compactPieces=cleanPieces;
  if(compactMode){
    const hiddenLeafIds=new Set();
    cleanPieces.forEach(p=>{
      if(childCount[p.id]===0 && !pieceToGroup[p.id]){
        const par=showDropped?(p.parent_id||null):effectiveParent(p);
        if(par){
          collapsedLeaves[par]=(collapsedLeaves[par]||0)+1;
          hiddenLeafIds.add(p.id);
        }
      }
    });
    compactPieces=cleanPieces.filter(p=>!hiddenLeafIds.has(p.id));
  }

  /* ── D3 stratify + left-to-right tree ── */
  const SYNTH='__root__';
  const compactIds=new Set([...compactPieces.map(p=>p.id),...allGroupIds]);
  const stratData=[
    {id:SYNTH,parent_id:null},
    /* virtual group nodes */
    ...groupNodesList.map(g=>({
      id:g.id, parent_id:compactIds.has(g.parent_id)?g.parent_id:SYNTH,
      is_group:true, label:g.label, childIds:g.childIds, style_key:g.style_key,
    })),
    /* actual pieces */
    ...compactPieces.map(p=>({
      ...p,
      parent_id:(()=>{
        /* grouped pieces point to their group node */
        if(pieceToGroup[p.id]) return pieceToGroup[p.id];
        const ep=showDropped?(p.parent_id||null):effectiveParent(p);
        if(!ep) return SYNTH;
        if(compactIds.has(ep)) return ep;
        let cur=allById[ep]?.parent_id||null;
        while(cur&&!compactIds.has(cur)) cur=allById[cur]?.parent_id||null;
        return cur||SYNTH;
      })(),
    })),
  ];
  const root=d3.stratify().id(d=>d.id).parentId(d=>d.parent_id)(stratData);

  const SIBLING_GAP=compactMode?72:88, DEPTH_GAP=120, THUMB=66, HALF=33, PAD_TOP=20;
  d3.tree().nodeSize([SIBLING_GAP,DEPTH_GAP])(root);

  const pos={};
  root.descendants().forEach(n=>{pos[n.id]={x:n.x,y:n.y};});

  const synthDepth=pos[SYNTH].y;
  const OFFSET_X=-synthDepth+20;
  const svgX=id=>pos[id]?.y+OFFSET_X;
  const svgY=id=>pos[id]?.x;

  const allDisplayNodes=[...compactPieces,...groupNodesList];
  const allX=allDisplayNodes.map(n=>svgX(n.id));
  const allY=allDisplayNodes.map(n=>svgY(n.id));
  const minYVal=Math.min(...allY);
  const SHIFT_Y=-minYVal+PAD_TOP;

  /* ── rebuild SVG ── */
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  stage.setAttribute('width',  Math.max(...allX)+HALF+24);
  stage.setAttribute('height', Math.max(...allY)-minYVal+PAD_TOP+HALF+16+20);

  const svg=d3.select(stage);
  const g  =svg.append('g').attr('transform',`translate(0,${SHIFT_Y})`);

  svg.append('defs').append('clipPath').attr('id','clip-round')
    .append('rect').attr('x',-HALF).attr('y',-HALF)
    .attr('width',THUMB).attr('height',THUMB).attr('rx',5);

  /* ── edges ── */
  const edgeG=g.append('g').attr('fill','none');
  root.links().forEach(link=>{
    if(link.source.id===SYNTH) return;
    const srcIsGrp=allGroupIds.has(link.source.id), tgtIsGrp=allGroupIds.has(link.target.id);
    const px=svgX(link.source.id)+(srcIsGrp?GHALF:HALF), py=svgY(link.source.id);
    const cx=svgX(link.target.id)-(tgtIsGrp?GHALF:HALF), cy=svgY(link.target.id);
    const midX=(px+cx)/2;
    const srcDropped=byId[link.source.id]?.dropped, tgtDropped=byId[link.target.id]?.dropped;
    const edgeDrop=srcDropped||tgtDropped;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${midX},${py} ${midX},${cy} ${cx},${cy}`)
      .attr('stroke',srcIsGrp||tgtIsGrp?'#2d3045':edgeDrop?'#222230':'#2a3a5a')
      .attr('stroke-width',srcIsGrp||tgtIsGrp?1:1.2)
      .attr('opacity',edgeDrop?0.5:srcIsGrp||tgtIsGrp?0.5:0.8);
  });
  crossEdges.forEach(e=>{
    if(!pos[e.from]||!pos[e.to]) return;
    const px=svgX(e.from)+HALF, py=svgY(e.from);
    const cx=svgX(e.to)-HALF,   cy=svgY(e.to);
    const midX=(px+cx)/2;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${midX},${py} ${midX},${cy} ${cx},${cy}`)
      .attr('stroke','#c9a86a').attr('stroke-dasharray','4,3')
      .attr('stroke-width',1).attr('opacity',0.5);
  });

  /* ── group node pills ── */
  const grpG=g.append('g');
  const grpEnter=grpG.selectAll('g.grp-node').data(groupNodesList,d=>d.id).enter()
    .append('g').attr('class','grp-node').attr('data-id',d=>d.id)
    .attr('transform',d=>`translate(${svgX(d.id)},${svgY(d.id)})`)
    .style('cursor','pointer');
  grpEnter.append('rect')
    .attr('x',-GHALF).attr('y',-11).attr('width',GHALF*2).attr('height',22).attr('rx',11)
    .attr('fill','#111118').attr('stroke','#c9a86a').attr('stroke-width',1.2).attr('opacity',0.92);
  grpEnter.append('text')
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('y',0).attr('font-size','8.5px').attr('font-family','ui-monospace,monospace')
    .attr('fill','#c9a86a').style('pointer-events','none')
    .text(d=>`${d.label} · ${d.childIds.length}`);
  grpEnter
    .on('mouseover',(e,d)=>{
      tip.innerHTML=`
        <div class="code">${d.label}</div>
        <div class="row"><b>style</b> · ${d.style_key}</div>
        <div class="row"><b>${d.childIds.length} pieces</b> in this group</div>
        <div class="row" style="color:#8a8a93">right-click → drop group</div>
      `;
      tip.style.display='block';
      tip.style.left=Math.min(window.innerWidth-380,e.clientX+12)+'px';
      tip.style.top=Math.min(window.innerHeight-200,e.clientY+12)+'px';
    })
    .on('mousemove',(e)=>{
      tip.style.left=Math.min(window.innerWidth-380,e.clientX+12)+'px';
      tip.style.top=Math.min(window.innerHeight-200,e.clientY+12)+'px';
    })
    .on('mouseout',hideTip)
    .on('contextmenu',onGrpCtx);

  /* ── piece nodes ── */
  const nodeG=g.append('g');
  const enter=nodeG.selectAll('g.node').data(compactPieces,d=>d.id).enter()
    .append('g').attr('class','node').attr('data-id',d=>d.id)
    .attr('transform',d=>`translate(${svgX(d.id)},${svgY(d.id)})`)
    .style('cursor','pointer');

  enter.append('rect')
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('rx',5).attr('fill','#1f1f26');
  enter.append('image')
    .attr('href',d=>`thumbs/${d.id}.png`)
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('clip-path','url(#clip-round)').attr('preserveAspectRatio','xMidYMid slice')
    .attr('opacity',d=>d.dropped?0.18:1)
    .on('error',function(e,d){
      d3.select(this).attr('opacity',0);
      d3.select(this.parentNode).select('rect').attr('fill','#161622');
      d3.select(this.parentNode).append('text')
        .attr('text-anchor','middle').attr('dominant-baseline','middle')
        .attr('y',0).attr('font-size','8px')
        .attr('font-family','ui-monospace,monospace')
        .attr('fill','#4a4a5a').text(d.id);
    });
  enter.append('rect').attr('class','drop-overlay')
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('rx',5).attr('fill','#0a0a0d').attr('opacity',d=>d.dropped?0.62:0);
  /* favored ring */
  enter.append('rect').attr('class','fav-ring')
    .attr('x',-HALF-2).attr('y',-HALF-2).attr('width',THUMB+4).attr('height',THUMB+4)
    .attr('rx',6).attr('fill','none').attr('stroke','#c9a86a').attr('stroke-width',2)
    .attr('opacity',d=>d.favored?1:0);
  enter.append('text')
    .attr('y',HALF+11).attr('text-anchor','middle')
    .attr('font-size','9px').attr('font-family','ui-monospace,monospace')
    .style('pointer-events','none')
    .attr('fill',d=>d.dropped?'#33333d':d.favored?'#c9a86a':'#8a8a93')
    .text(d=>d.id);

  /* compact mode: +N badge for collapsed leaf children */
  if(compactMode){
    enter.filter(d=>!!(collapsedLeaves[d.id]))
      .append('text')
        .attr('x',HALF-2).attr('y',-HALF+2)
        .attr('text-anchor','end').attr('dominant-baseline','hanging')
        .attr('font-size','8px').attr('font-family','ui-monospace,monospace')
        .attr('fill','#8a8a93').style('pointer-events','none')
        .text(d=>'+'+collapsedLeaves[d.id]);
  }

  enter
    .on('mouseover',showTip).on('mousemove',showTip).on('mouseout',hideTip)
    .on('contextmenu',onCtx)
    .on('click',(e,d)=>{closeCtx();window.open(`pieces/${d.id}/`,'_blank');});

  /* ── counts ── */
  const droppedCount=allPieces.filter(p=>p.dropped).length;
  const favCount=allPieces.filter(p=>p.favored).length;
  const collapsedTotal=Object.values(collapsedLeaves).reduce((a,b)=>a+b,0);
  document.getElementById('counts').textContent=
    `${compactPieces.length} shown · ${(lineage.edges||[]).length} edges · ${favCount} encouraged`+
    (groupNodesList.length>0?` · ${groupNodesList.length} groups`:'')+
    (compactMode&&collapsedTotal>0?` · ${collapsedTotal} leaves collapsed`:'')+
    (showDropped?` · ${droppedCount} dropped (visible)`:'');
  document.getElementById('drop-count-label').textContent=
    `${droppedCount} dropped piece${droppedCount===1?'':'s'} hidden`;
  document.getElementById('toggleDropped').className=showDropped?'active':'';
  document.getElementById('toggleDropped').textContent=
    showDropped?'hide dropped nodes':'show dropped nodes';
  document.getElementById('toggleCompact').className=compactMode?'active':'';
  document.getElementById('toggleCompact').textContent=
    compactMode?'compact view ✓':'compact view';

  /* rebind ctx menu to updated data */
  _allPieces=allPieces; _byId=byId; _groupNodes=groupNodes;
}

/* ── tooltip / ctx menu (closure refs updated per render) ────────── */
let _allPieces=[], _byId={}, _groupNodes={};
const tip=document.getElementById('tooltip');
function showTip(e,d){
  tip.innerHTML=`
    <div class="code">${d.id}${d.favored?' ♥':''}</div>
    <div class="title">${d.title||''}</div>
    <div class="row"><b>direction</b> · ${d.direction||'—'}</div>
    <div class="row"><b>generation</b> · ${d.generation??0}</div>
    ${d.dropped?'<div class="row" style="color:#a06060">dropped · right-click to restore</div>':''}
    ${d.favored?'<div class="row" style="color:#c9a86a">encouraged branch</div>':''}
  `;
  tip.style.display='block';
  tip.style.left=Math.min(window.innerWidth-380,e.clientX+12)+'px';
  tip.style.top =Math.min(window.innerHeight-200,e.clientY+12)+'px';
}
function hideTip(){tip.style.display='none';}

const ctxMenu=document.getElementById('ctx-menu');
const ctxLabel=document.getElementById('ctx-label');
const ctxPieceButtons=document.getElementById('ctx-piece-buttons');
const ctxGroupButtons=document.getElementById('ctx-group-buttons');
let ctxTarget=null;
function closeCtx(){ctxMenu.style.display='none';ctxTarget=null;}
document.addEventListener('click',closeCtx);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx();});

function _showCtx(e,label,isGroup){
  ctxLabel.textContent=label;
  ctxPieceButtons.style.display=isGroup?'none':'block';
  ctxGroupButtons.style.display=isGroup?'block':'none';
  ctxMenu.style.display='block';
  ctxMenu.style.left=Math.min(window.innerWidth-200,e.clientX)+'px';
  ctxMenu.style.top =Math.min(window.innerHeight-160,e.clientY)+'px';
}
function onCtx(e,d){
  e.preventDefault();e.stopPropagation();hideTip();
  ctxTarget=d;
  _showCtx(e, d.id+' · '+(d.direction||d.title||''), false);
}
function onGrpCtx(e,d){
  e.preventDefault();e.stopPropagation();hideTip();
  ctxTarget=d;
  _showCtx(e, `${d.label} · ${d.childIds.length} pieces`, true);
}

document.getElementById('ctx-drop-node').addEventListener('click',()=>{
  if(!ctxTarget)return;
  dropNode(ctxTarget.id);render();closeCtx();
});
document.getElementById('ctx-drop-tree').addEventListener('click',()=>{
  if(!ctxTarget)return;
  dropSubtree(ctxTarget.id,_allPieces);render();closeCtx();
});
document.getElementById('ctx-restore').addEventListener('click',()=>{
  if(!ctxTarget)return;
  restoreSubtree(ctxTarget.id,_allPieces);render();closeCtx();
});
document.getElementById('ctx-drop-group').addEventListener('click',()=>{
  if(!ctxTarget||!ctxTarget.is_group)return;
  const d=getDismissed();
  ctxTarget.childIds.forEach(id=>{
    d.add(id);
    getDescendants(id,_allPieces).forEach(desc=>d.add(desc));
  });
  saveDismissed(d);
  showToast(`Dropped ${ctxTarget.childIds.length} pieces from "${ctxTarget.label}"`);
  render();closeCtx();
});

let _toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

document.getElementById('ctx-make-more').addEventListener('click',()=>{
  if(!ctxTarget)return;
  const id=ctxTarget.id;
  // Mark as encouraged in localStorage so tree highlights it
  const favs=getFavorites(); favs.add(id); saveFavorites(favs); render();
  // Copy mutation command to clipboard
  const cmd=`python scripts/improv_tick.py --parent ${id}`;
  navigator.clipboard.writeText(cmd).then(()=>{
    showToast(`✓ ${id} marked · command copied`);
  }).catch(()=>{
    showToast(`✓ ${id} marked · run: ${cmd}`);
  });
  closeCtx();
});

/* ── toggles ─────────────────────────────────────────────────────── */
document.getElementById('toggleDropped').addEventListener('click',()=>{
  showDropped=!showDropped;
  render();
});
document.getElementById('toggleCompact').addEventListener('click',()=>{
  compactMode=!compactMode;
  document.getElementById('toggleCompact').className=compactMode?'active':'';
  document.getElementById('toggleCompact').textContent=compactMode?'compact view ✓':'compact view';
  render();
});

/* ── load + initial render ───────────────────────────────────────── */
async function load(){
  [lineageData,prefsData]=await Promise.all([
    fetch('lineage.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('scripts/preferences.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({marks:{}}))
  ]);
  render();
}
load();
</script>
</body>
