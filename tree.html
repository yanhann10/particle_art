<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · lineage tree</title>
<style>
  :root {
    --bg:#0a0a0d; --panel:#111116; --ink:#e8e6df; --muted:#8a8a93;
    --line:#1f1f26; --accent:#c9a86a; --hot:#d76b5a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
    overflow:hidden; }
  header {
    position:fixed; top:0; left:0; right:0;
    padding:1rem 1.6rem 0.7rem;
    background:linear-gradient(180deg,rgba(10,10,13,0.95),rgba(10,10,13,0));
    z-index:5; display:flex; justify-content:space-between; align-items:baseline;
  }
  h1 { margin:0; font-size:1.0rem; font-weight:600; letter-spacing:0.04em; }
  header .meta { color:var(--muted); font-size:0.82rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  header a { color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); }
  header a:hover { color:var(--hot); border-color:var(--hot); }
  #stage { width:100%; height:100vh; display:block; }
  #tooltip {
    position:fixed; pointer-events:none; z-index:10;
    background:rgba(20,20,26,0.96); border:1px solid var(--line);
    border-radius:4px; padding:0.7rem 0.9rem; max-width:360px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    line-height:1.5; display:none;
  }
  #tooltip .code  { color:var(--accent); font-weight:600; font-size:0.95rem; }
  #tooltip .title { color:var(--ink); margin-top:2px; }
  #tooltip .row   { margin-top:6px; color:var(--muted); }
  #tooltip .row b { color:var(--ink); font-weight:500; }
  #tooltip .tags  { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
  #tooltip .tag   { background:rgba(201,168,106,0.15); color:var(--accent);
    border:1px solid rgba(201,168,106,0.35); padding:1px 6px;
    border-radius:2px; font-size:0.7rem; }
  #tooltip .influence { margin-top:8px; padding-top:6px;
    border-top:1px dotted var(--line); color:#c9d2dc;
    font-style:italic; font-size:0.78rem; }
  #ctx-menu {
    position:fixed; z-index:20; background:rgba(17,17,22,0.97);
    border:1px solid var(--line); border-radius:4px; padding:0.25rem 0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    display:none; min-width:180px; box-shadow:0 6px 20px rgba(0,0,0,.55);
  }
  #ctx-menu .ctx-title { padding:0.35rem 0.9rem 0.3rem; color:var(--accent);
    font-weight:600; font-size:0.85rem; border-bottom:1px solid var(--line); }
  #ctx-menu button { display:block; width:100%; background:none; border:none;
    color:var(--ink); padding:0.4rem 0.9rem; text-align:left; cursor:pointer;
    font-family:inherit; font-size:0.8rem; }
  #ctx-menu button:hover { background:rgba(201,168,106,0.12); color:var(--accent); }
  #ctx-menu button.danger:hover { background:rgba(215,107,90,0.12); color:var(--hot); }
  #ctx-menu .sep { border-top:1px solid var(--line); margin:0.2rem 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · lineage tree</h1>
    <div class="meta"><span id="counts">…</span> · hover for tooltip · right-click to drop</div>
  </div>
  <div class="meta"><a href="index.html">← gallery</a></div>
</header>
<svg id="stage"></svg>
<div id="tooltip"></div>
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-label">—</div>
  <button id="ctx-drop-node">Drop this node</button>
  <button id="ctx-drop-tree" class="danger">Drop entire subtree</button>
  <div class="sep"></div>
  <button id="ctx-restore">Restore subtree</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
/* ── helpers ─────────────────────────────────────────────────────── */
const DISMISSED_KEY = 'particle_art_dismissed';
function getDismissed(){try{return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY)||'[]'))}catch{return new Set()}}
function saveDismissed(s){localStorage.setItem(DISMISSED_KEY,JSON.stringify([...s]))}
function getDescendants(rootId,allNodes){
  const ch={};
  allNodes.forEach(n=>{if(n.parent_id){(ch[n.parent_id]=ch[n.parent_id]||[]).push(n.id)}});
  const res=[],q=[rootId];
  while(q.length){const c=q.shift();(ch[c]||[]).forEach(id=>{res.push(id);q.push(id)})}
  return res;
}
function dropSubtree(rootId,all){const d=getDismissed();d.add(rootId);getDescendants(rootId,all).forEach(id=>d.add(id));saveDismissed(d)}
function dropNode(id){const d=getDismissed();d.add(id);saveDismissed(d)}
function restoreSubtree(rootId,all){const d=getDismissed();d.delete(rootId);getDescendants(rootId,all).forEach(id=>d.delete(id));saveDismissed(d)}

/* ── main ────────────────────────────────────────────────────────── */
async function load(){
  const [lineage,prefs] = await Promise.all([
    fetch('lineage.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('scripts/preferences.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({marks:{}}))
  ]);

  const marks = prefs.marks || {};
  const dismissed = getDismissed();

  /* ── descendant counts ── */
  const descCount = {};
  lineage.pieces.forEach(n=>{descCount[n.id]=0});
  lineage.pieces.forEach(n=>{
    let cur=n.parent_id; const seen=new Set();
    while(cur&&!seen.has(cur)){if(cur in descCount)descCount[cur]++;seen.add(cur);
      const par=lineage.pieces.find(x=>x.id===cur);cur=par?par.parent_id:null}
  });

  /* ── filter orphaned nodes — iterate to transitive closure ── */
  let cleanPieces = lineage.pieces;
  let prevSize = -1;
  while (cleanPieces.length !== prevSize) {
    prevSize = cleanPieces.length;
    const validIds = new Set(cleanPieces.map(p=>p.id));
    cleanPieces = cleanPieces.filter(p=>!p.parent_id||validIds.has(p.parent_id));
  }
  const knownIds = new Set(cleanPieces.map(p=>p.id));

  /* ── identify cross edges (target's parent_id ≠ edge.from) ── */
  const pidMap = {};
  cleanPieces.forEach(p=>{pidMap[p.id]=p.parent_id||null});
  const crossEdges = (lineage.edges||[]).filter(e=>knownIds.has(e.from)&&knownIds.has(e.to)&&pidMap[e.to]!==e.from);

  /* ── add synthetic root for stratify ── */
  const SYNTH = '__root__';
  const stratData = [{id:SYNTH, parent_id:null}, ...cleanPieces.map(p=>({
    ...p, parent_id: p.parent_id||SYNTH
  }))];

  const root = d3.stratify()
    .id(d=>d.id)
    .parentId(d=>d.parent_id)(stratData);

  /* ── layout ── */
  const NODE_W=50, NODE_H=90;
  d3.tree().nodeSize([NODE_W,NODE_H])(root);

  /* position lookup by id */
  const pos={};
  root.descendants().forEach(n=>{pos[n.id]={x:n.x,y:n.y,data:n.data}});

  /* shift so __root__ is well above viewport (hide it) */
  const synthY = pos[SYNTH].y;
  const OFFSET_Y = -synthY - 200;   /* true roots land ~200px from svg top after zoom */

  /* ── SVG setup ── */
  const stage = document.getElementById('stage');
  const W = stage.clientWidth, H = stage.clientHeight;
  const svg = d3.select(stage);
  const g   = svg.append('g');

  /* clip-path for rounded thumbnails */
  svg.append('defs').append('clipPath').attr('id','clip-round')
    .append('rect').attr('x',-15).attr('y',-15).attr('width',30).attr('height',30).attr('rx',3);

  /* zoom */
  const zoom = d3.zoom().scaleExtent([0.15,3]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);

  /* initial transform: center the tree horizontally, show from top */
  const xs = cleanPieces.filter(p=>!p.parent_id).map(p=>pos[p.id].x);
  const midX = (Math.min(...xs)+Math.max(...xs))/2;
  const initTx = W/2 - midX;
  const initTy = 80 - (pos[cleanPieces.find(p=>!p.parent_id)?.id||cleanPieces[0].id]?.y||0) - OFFSET_Y;
  svg.call(zoom.transform, d3.zoomIdentity.translate(initTx, initTy).scale(0.9));

  /* ── edge layer ── */
  const edgeG = g.append('g').attr('fill','none');

  /* primary tree edges */
  root.links().forEach(link=>{
    if(link.source.id===SYNTH) return;   /* skip synthetic root edges */
    const px=link.source.x, py=link.source.y+OFFSET_Y+15;
    const cx=link.target.x, cy=link.target.y+OFFSET_Y-15;
    const midY=(py+cy)/2;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${px},${midY} ${cx},${midY} ${cx},${cy}`)
      .attr('stroke','#2a3a5a').attr('stroke-width',1.2).attr('opacity',0.8);
  });

  /* cross / hybrid edges */
  crossEdges.forEach(e=>{
    if(!pos[e.from]||!pos[e.to]) return;
    const px=pos[e.from].x, py=pos[e.from].y+OFFSET_Y+15;
    const cx=pos[e.to].x,   cy=pos[e.to].y+OFFSET_Y-15;
    const midY=(py+cy)/2;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${px},${midY} ${cx},${midY} ${cx},${cy}`)
      .attr('stroke','#c9a86a').attr('stroke-dasharray','4,3')
      .attr('stroke-width',1).attr('opacity',0.5);
  });

  /* ── node layer ── */
  const pieces = cleanPieces.map(p=>({...p, mark:marks[p.id]||{}, dropped:dismissed.has(p.id)||!!(marks[p.id]||{}).drop}));
  const byId   = Object.fromEntries(pieces.map(p=>[p.id,p]));

  const nodeG = g.append('g');

  function renderNodes(){
    const nodes = nodeG.selectAll('g.node').data(pieces, d=>d.id);

    const enter = nodes.enter().append('g')
      .attr('class','node')
      .attr('data-id', d=>d.id)
      .attr('transform', d=>`translate(${pos[d.id].x},${pos[d.id].y+OFFSET_Y})`)
      .style('cursor','pointer');

    /* fallback rect (shows behind image; visible if thumb 404) */
    enter.append('rect')
      .attr('x',-15).attr('y',-15).attr('width',30).attr('height',30)
      .attr('rx',3).attr('fill','#1f1f26');

    /* thumbnail */
    enter.append('image')
      .attr('href', d=>`thumbs/${d.id}.png`)
      .attr('x',-15).attr('y',-15).attr('width',30).attr('height',30)
      .attr('clip-path','url(#clip-round)')
      .attr('preserveAspectRatio','xMidYMid slice');

    /* dropped overlay */
    enter.append('rect').attr('class','drop-overlay')
      .attr('x',-15).attr('y',-15).attr('width',30).attr('height',30)
      .attr('rx',3).attr('fill','#0a0a0d');

    /* label */
    enter.append('text')
      .attr('y',22).attr('text-anchor','middle')
      .attr('font-size','9px').attr('font-family','ui-monospace,monospace')
      .style('pointer-events','none')
      .text(d=>d.id);

    /* merge + style */
    const merged = enter.merge(nodes);
    merged.select('image').attr('opacity', d=>d.dropped?0.2:1);
    merged.select('.drop-overlay').attr('opacity', d=>d.dropped?0.65:0);
    merged.select('text').attr('fill', d=>d.dropped?'#555':'#c9a86a');

    /* events */
    merged
      .on('mouseover', showTip).on('mousemove', showTip).on('mouseout', hideTip)
      .on('contextmenu', onCtx)
      .on('click', (e,d)=>{ closeCtx(); window.open(`pieces/${d.id}/`,'_blank'); });
  }

  function refreshNode(d){
    const sel = nodeG.select(`[data-id="${d.id}"]`);
    sel.select('image').attr('opacity', d.dropped?0.2:1);
    sel.select('.drop-overlay').attr('opacity', d.dropped?0.65:0);
    sel.select('text').attr('fill', d.dropped?'#555':'#c9a86a');
  }

  renderNodes();
  updateCount();

  /* ── tooltip ── */
  const tip = document.getElementById('tooltip');
  function showTip(e,d){
    const tags=(d.enrich?.tags||[]).slice(0,6);
    const channelTag=(tags.find(t=>t.startsWith('channel:'))||'').replace('channel:','');
    const conceptTag=(tags.find(t=>t.startsWith('concept_'))||'');
    let influence='';
    if(channelTag) influence='channels '+channelTag.replace(/_/g,' ');
    else if(conceptTag) influence='engages '+conceptTag.replace('concept_','').replace(/_/g,' ');
    else if(d.mark.note) influence=d.mark.note;
    tip.innerHTML=`
      <div class="code">${d.id}</div>
      <div class="title">${d.title||''}</div>
      <div class="row"><b>direction</b> · ${d.direction||'—'}</div>
      <div class="row"><b>generation</b> · ${d.generation??0} · <b>desc</b> · ${descCount[d.id]||0}</div>
      ${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
      ${influence?`<div class="influence">${influence}</div>`:''}
    `;
    tip.style.display='block';
    tip.style.left=Math.min(window.innerWidth-380,e.clientX+12)+'px';
    tip.style.top =Math.min(window.innerHeight-200,e.clientY+12)+'px';
  }
  function hideTip(){tip.style.display='none';}

  /* ── context menu ── */
  const ctxMenu  = document.getElementById('ctx-menu');
  const ctxLabel = document.getElementById('ctx-label');
  let ctxTarget  = null;
  function closeCtx(){ctxMenu.style.display='none';ctxTarget=null;}
  document.addEventListener('click',closeCtx);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx();});

  function onCtx(e,d){
    e.preventDefault(); e.stopPropagation(); hideTip();
    ctxTarget=d;
    ctxLabel.textContent=d.id+' · '+(d.direction||d.title||'');
    ctxMenu.style.display='block';
    ctxMenu.style.left=Math.min(window.innerWidth-200,e.clientX)+'px';
    ctxMenu.style.top =Math.min(window.innerHeight-140,e.clientY)+'px';
  }

  document.getElementById('ctx-drop-node').addEventListener('click',()=>{
    if(!ctxTarget) return;
    dropNode(ctxTarget.id); ctxTarget.dropped=true; refreshNode(ctxTarget);
    updateCount(); closeCtx();
  });
  document.getElementById('ctx-drop-tree').addEventListener('click',()=>{
    if(!ctxTarget) return;
    dropSubtree(ctxTarget.id,pieces);
    [ctxTarget.id,...getDescendants(ctxTarget.id,pieces)].forEach(id=>{
      if(byId[id]){byId[id].dropped=true;refreshNode(byId[id]);}
    });
    updateCount(); closeCtx();
  });
  document.getElementById('ctx-restore').addEventListener('click',()=>{
    if(!ctxTarget) return;
    restoreSubtree(ctxTarget.id,pieces);
    [ctxTarget.id,...getDescendants(ctxTarget.id,pieces)].forEach(id=>{
      if(byId[id]){byId[id].dropped=false;refreshNode(byId[id]);}
    });
    updateCount(); closeCtx();
  });

  function updateCount(){
    const active=pieces.filter(n=>!n.dropped).length;
    document.getElementById('counts').textContent=
      `${pieces.length} pieces · ${(lineage.edges||[]).length} edges · ${active} active`;
  }
}
load();
</script>
</body>
</html>
