<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · lineage tree</title>
<style>
  :root {
    --bg:#0a0a0d; --panel:#111116; --ink:#e8e6df; --muted:#8a8a93;
    --line:#1f1f26; --accent:#c9a86a; --hot:#d76b5a;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
    overflow-y:scroll; overflow-x:auto;
    padding-bottom:64px; /* room for sticky footer */ }
  header {
    position:sticky; top:0;
    padding:0.9rem 1.6rem 0.7rem;
    background:rgba(10,10,13,0.97);
    border-bottom:1px solid var(--line);
    z-index:10; display:flex; justify-content:space-between; align-items:baseline;
    backdrop-filter:blur(6px);
  }
  h1 { margin:0; font-size:1.0rem; font-weight:600; letter-spacing:0.04em; }
  header .meta { color:var(--muted); font-size:0.82rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  header a { color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); }
  header a:hover { color:var(--hot); border-color:var(--hot); }
  #legend {
    padding:0.35rem 1.6rem;
    background:rgba(10,10,13,0.95);
    border-bottom:1px solid var(--line);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.75rem;
    color:var(--muted); display:flex; gap:1.4rem; align-items:center; flex-wrap:wrap;
  }
  #legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  #stage { display:block; }
  /* sticky footer toggle */
  #drop-footer {
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(10,10,13,0.97); border-top:1px solid var(--line);
    padding:0.55rem 1.6rem;
    display:flex; align-items:center; gap:1rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    color:var(--muted); backdrop-filter:blur(6px);
  }
  #drop-footer button {
    background:rgba(30,30,40,0.9); color:var(--muted);
    border:1px solid var(--line); border-radius:4px;
    padding:4px 14px; cursor:pointer;
    font-family:inherit; font-size:0.78rem;
    transition:border-color 0.15s, color 0.15s;
  }
  #drop-footer button:hover, #drop-footer button.active {
    border-color:var(--accent); color:var(--accent);
  }
  #tooltip {
    position:fixed; pointer-events:none; z-index:20;
    background:rgba(20,20,26,0.96); border:1px solid var(--line);
    border-radius:4px; padding:0.7rem 0.9rem; max-width:360px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    line-height:1.5; display:none;
  }
  #tooltip .code  { color:var(--accent); font-weight:600; font-size:0.95rem; }
  #tooltip .title { color:var(--ink); margin-top:2px; }
  #tooltip .row   { margin-top:6px; color:var(--muted); }
  #tooltip .row b { color:var(--ink); font-weight:500; }
  #tooltip .tags  { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
  #tooltip .tag   { background:rgba(201,168,106,0.15); color:var(--accent);
    border:1px solid rgba(201,168,106,0.35); padding:1px 6px;
    border-radius:2px; font-size:0.7rem; }
  #ctx-menu {
    position:fixed; z-index:30; background:rgba(17,17,22,0.97);
    border:1px solid var(--line); border-radius:4px; padding:0.25rem 0;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    display:none; min-width:180px; box-shadow:0 6px 20px rgba(0,0,0,.55);
  }
  #ctx-menu .ctx-title { padding:0.35rem 0.9rem 0.3rem; color:var(--accent);
    font-weight:600; font-size:0.85rem; border-bottom:1px solid var(--line); }
  #ctx-menu button { display:block; width:100%; background:none; border:none;
    color:var(--ink); padding:0.4rem 0.9rem; text-align:left; cursor:pointer;
    font-family:inherit; font-size:0.8rem; }
  #ctx-menu button:hover { background:rgba(201,168,106,0.12); color:var(--accent); }
  #ctx-menu button.danger:hover { background:rgba(215,107,90,0.12); color:var(--hot); }
  #ctx-menu .sep { border-top:1px solid var(--line); margin:0.2rem 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · lineage tree</h1>
    <div class="meta"><span id="counts">…</span> · hover for tooltip · right-click to drop/restore</div>
  </div>
  <div class="meta"><a href="index.html">← gallery</a></div>
</header>
<div id="legend">
  <span><span class="dot" style="background:#c9a86a"></span><span style="color:#c9a86a">encouraged</span> — system favors these branches</span>
  <span><span class="dot" style="background:#2a3a5a"></span> active</span>
  <span style="color:rgba(201,168,106,0.4)">── dashed gold</span><span> = cross-lineage (hybrid)</span>
</div>
<svg id="stage"></svg>
<div id="tooltip"></div>
<div id="ctx-menu">
  <div class="ctx-title" id="ctx-label">—</div>
  <button id="ctx-drop-node">Drop this node</button>
  <button id="ctx-drop-tree" class="danger">Drop entire subtree</button>
  <div class="sep"></div>
  <button id="ctx-restore">Restore subtree</button>
</div>
<div id="drop-footer">
  <button id="toggleDropped">show dropped nodes</button>
  <span id="drop-count-label"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
/* ── persistence helpers ─────────────────────────────────────────── */
const DISMISSED_KEY = 'particle_art_dismissed';
const FAVORITES_KEY  = 'particle_art_favorites';
function getDismissed(){try{return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY)||'[]'))}catch{return new Set()}}
function saveDismissed(s){localStorage.setItem(DISMISSED_KEY,JSON.stringify([...s]))}
function getFavorites(){try{return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'))}catch{return new Set()}}
function getDescendants(rootId,allNodes){
  const ch={};
  allNodes.forEach(n=>{if(n.parent_id){(ch[n.parent_id]=ch[n.parent_id]||[]).push(n.id)}});
  const res=[],q=[rootId];
  while(q.length){const c=q.shift();(ch[c]||[]).forEach(id=>{res.push(id);q.push(id)})}
  return res;
}
function dropSubtree(rootId,all){const d=getDismissed();d.add(rootId);getDescendants(rootId,all).forEach(id=>d.add(id));saveDismissed(d)}
function dropNode(id){const d=getDismissed();d.add(id);saveDismissed(d)}
function restoreSubtree(rootId,all){const d=getDismissed();d.delete(rootId);getDescendants(rootId,all).forEach(id=>d.delete(id));saveDismissed(d)}

/* ── state ───────────────────────────────────────────────────────── */
let showDropped = false;
let lineageData = null, prefsData = null;

/* ── render ──────────────────────────────────────────────────────── */
function render(){
  const lineage = lineageData;
  const marks   = (prefsData||{}).marks || {};
  const dismissed = getDismissed();
  const favs      = getFavorites();

  /* ── descendant counts (over ALL pieces, for tooltip) ── */
  const descCount = {};
  lineage.pieces.forEach(n=>{descCount[n.id]=0});
  lineage.pieces.forEach(n=>{
    let cur=n.parent_id; const seen=new Set();
    while(cur&&!seen.has(cur)){if(cur in descCount)descCount[cur]++;seen.add(cur);
      const par=lineage.pieces.find(x=>x.id===cur);cur=par?par.parent_id:null}
  });

  /* ── annotate all pieces ── */
  const allPieces = lineage.pieces.map(p=>({
    ...p,
    dropped: dismissed.has(p.id)||!!(marks[p.id]||{}).drop,
    favored: favs.has(p.id),
    mark: marks[p.id]||{},
  }));
  const allById = Object.fromEntries(allPieces.map(p=>[p.id,p]));
  const byId    = allById;

  /* ── compute effective parent: skip over dropped ancestors ──
   * When a node is individually dropped, its children are promoted
   * to connect directly to the nearest non-dropped ancestor. */
  const activeIds = new Set(allPieces.filter(p=>!p.dropped).map(p=>p.id));
  function effectiveParent(piece){
    let cur=piece.parent_id;
    while(cur && !activeIds.has(cur)){
      cur=allById[cur]?.parent_id||null;
    }
    return cur||null;
  }

  /* ── which pieces appear in layout ── */
  let cleanPieces;
  if(showDropped){
    /* show everything; apply orphan filter for data integrity only */
    cleanPieces=allPieces;
    let prevSize=-1;
    while(cleanPieces.length!==prevSize){
      prevSize=cleanPieces.length;
      const ids=new Set(cleanPieces.map(p=>p.id));
      cleanPieces=cleanPieces.filter(p=>!p.parent_id||ids.has(p.parent_id));
    }
  } else {
    /* show only active pieces; dropped ones silently removed,
     * their children re-attached via effectiveParent */
    cleanPieces=allPieces.filter(p=>!p.dropped);
  }
  const knownIds=new Set(cleanPieces.map(p=>p.id));

  /* ── cross edges (hybrid connections) ── */
  const primaryParent={};
  cleanPieces.forEach(p=>{
    primaryParent[p.id]=showDropped?(p.parent_id||null):effectiveParent(p);
  });
  const crossEdges=(lineage.edges||[]).filter(e=>
    knownIds.has(e.from)&&knownIds.has(e.to)&&primaryParent[e.to]!==e.from
  );

  /* ── D3 stratify + left-to-right tree ── */
  const SYNTH='__root__';
  const stratData=[{id:SYNTH,parent_id:null},...cleanPieces.map(p=>({
    ...p,
    parent_id: showDropped
      ? (p.parent_id && knownIds.has(p.parent_id) ? p.parent_id : SYNTH)
      : (effectiveParent(p)||SYNTH)
  }))];
  const root=d3.stratify().id(d=>d.id).parentId(d=>d.parent_id)(stratData);

  const SIBLING_GAP=110, DEPTH_GAP=120, THUMB=66, HALF=33, PAD_TOP=20;
  d3.tree().nodeSize([SIBLING_GAP,DEPTH_GAP])(root);

  const pos={};
  root.descendants().forEach(n=>{pos[n.id]={x:n.x,y:n.y};});

  const synthDepth=pos[SYNTH].y;
  const OFFSET_X=-synthDepth+20;
  const svgX=id=>pos[id].y+OFFSET_X;
  const svgY=id=>pos[id].x;

  const allX=cleanPieces.map(p=>svgX(p.id));
  const allY=cleanPieces.map(p=>svgY(p.id));
  const minYVal=Math.min(...allY);
  const SHIFT_Y=-minYVal+PAD_TOP;

  /* ── rebuild SVG ── */
  const stage=document.getElementById('stage');
  stage.innerHTML='';                                      /* clear previous render */
  stage.setAttribute('width',  Math.max(...allX)+HALF+24);
  stage.setAttribute('height', Math.max(...allY)-minYVal+PAD_TOP+HALF+16+20);

  const svg=d3.select(stage);
  const g  =svg.append('g').attr('transform',`translate(0,${SHIFT_Y})`);

  svg.append('defs').append('clipPath').attr('id','clip-round')
    .append('rect').attr('x',-HALF).attr('y',-HALF)
    .attr('width',THUMB).attr('height',THUMB).attr('rx',5);

  /* ── edges ── */
  const edgeG=g.append('g').attr('fill','none');
  root.links().forEach(link=>{
    if(link.source.id===SYNTH) return;
    const px=svgX(link.source.id)+HALF, py=svgY(link.source.id);
    const cx=svgX(link.target.id)-HALF, cy=svgY(link.target.id);
    const midX=(px+cx)/2;
    /* dim edges that lead to or from dropped nodes (in show-dropped mode) */
    const srcDropped=byId[link.source.id]?.dropped, tgtDropped=byId[link.target.id]?.dropped;
    const edgeDrop=srcDropped||tgtDropped;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${midX},${py} ${midX},${cy} ${cx},${cy}`)
      .attr('stroke', edgeDrop?'#222230':'#2a3a5a')
      .attr('stroke-width',1.2).attr('opacity', edgeDrop?0.5:0.8);
  });
  crossEdges.forEach(e=>{
    if(!pos[e.from]||!pos[e.to]) return;
    const px=svgX(e.from)+HALF, py=svgY(e.from);
    const cx=svgX(e.to)-HALF,   cy=svgY(e.to);
    const midX=(px+cx)/2;
    edgeG.append('path')
      .attr('d',`M${px},${py} C${midX},${py} ${midX},${cy} ${cx},${cy}`)
      .attr('stroke','#c9a86a').attr('stroke-dasharray','4,3')
      .attr('stroke-width',1).attr('opacity',0.5);
  });

  /* ── nodes ── */
  const nodeG=g.append('g');
  const enter=nodeG.selectAll('g.node').data(cleanPieces,d=>d.id).enter()
    .append('g').attr('class','node').attr('data-id',d=>d.id)
    .attr('transform',d=>`translate(${svgX(d.id)},${svgY(d.id)})`)
    .style('cursor','pointer');

  enter.append('rect')
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('rx',5).attr('fill','#1f1f26');
  enter.append('image')
    .attr('href',d=>`thumbs/${d.id}.png`)
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('clip-path','url(#clip-round)').attr('preserveAspectRatio','xMidYMid slice')
    .attr('opacity',d=>d.dropped?0.18:1);
  enter.append('rect').attr('class','drop-overlay')
    .attr('x',-HALF).attr('y',-HALF).attr('width',THUMB).attr('height',THUMB)
    .attr('rx',5).attr('fill','#0a0a0d').attr('opacity',d=>d.dropped?0.62:0);
  /* favored ring */
  enter.append('rect').attr('class','fav-ring')
    .attr('x',-HALF-2).attr('y',-HALF-2).attr('width',THUMB+4).attr('height',THUMB+4)
    .attr('rx',6).attr('fill','none').attr('stroke','#c9a86a').attr('stroke-width',2)
    .attr('opacity',d=>d.favored?1:0);
  enter.append('text')
    .attr('y',HALF+11).attr('text-anchor','middle')
    .attr('font-size','9px').attr('font-family','ui-monospace,monospace')
    .style('pointer-events','none')
    .attr('fill',d=>d.dropped?'#33333d':d.favored?'#c9a86a':'#8a8a93')
    .text(d=>d.id);

  enter
    .on('mouseover',showTip).on('mousemove',showTip).on('mouseout',hideTip)
    .on('contextmenu',onCtx)
    .on('click',(e,d)=>{closeCtx();window.open(`pieces/${d.id}/`,'_blank');});

  /* ── counts ── */
  const droppedCount=allPieces.filter(p=>p.dropped).length;
  const favCount=allPieces.filter(p=>p.favored).length;
  document.getElementById('counts').textContent=
    `${cleanPieces.length} shown · ${(lineage.edges||[]).length} edges · ${favCount} encouraged`+
    (showDropped?` · ${droppedCount} dropped (visible)`:'');
  document.getElementById('drop-count-label').textContent=
    `${droppedCount} dropped piece${droppedCount===1?'':'s'} hidden`;
  document.getElementById('toggleDropped').className=showDropped?'active':'';
  document.getElementById('toggleDropped').textContent=
    showDropped?'hide dropped nodes':'show dropped nodes';

  /* rebind ctx menu to updated data */
  _allPieces=allPieces; _byId=byId;
}

/* ── tooltip / ctx menu (closure refs updated per render) ────────── */
let _allPieces=[], _byId={};
const tip=document.getElementById('tooltip');
function showTip(e,d){
  const descCount={};
  /* lazy: use pre-computed via mark or just show 0 */
  tip.innerHTML=`
    <div class="code">${d.id}${d.favored?' ♥':''}</div>
    <div class="title">${d.title||''}</div>
    <div class="row"><b>direction</b> · ${d.direction||'—'}</div>
    <div class="row"><b>generation</b> · ${d.generation??0}</div>
    ${d.dropped?'<div class="row" style="color:#a06060">dropped · right-click to restore</div>':''}
    ${d.favored?'<div class="row" style="color:#c9a86a">encouraged branch</div>':''}
  `;
  tip.style.display='block';
  tip.style.left=Math.min(window.innerWidth-380,e.clientX+12)+'px';
  tip.style.top =Math.min(window.innerHeight-200,e.clientY+12)+'px';
}
function hideTip(){tip.style.display='none';}

const ctxMenu=document.getElementById('ctx-menu');
const ctxLabel=document.getElementById('ctx-label');
let ctxTarget=null;
function closeCtx(){ctxMenu.style.display='none';ctxTarget=null;}
document.addEventListener('click',closeCtx);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCtx();});
function onCtx(e,d){
  e.preventDefault();e.stopPropagation();hideTip();
  ctxTarget=d;
  ctxLabel.textContent=d.id+' · '+(d.direction||d.title||'');
  ctxMenu.style.display='block';
  ctxMenu.style.left=Math.min(window.innerWidth-200,e.clientX)+'px';
  ctxMenu.style.top =Math.min(window.innerHeight-140,e.clientY)+'px';
}
document.getElementById('ctx-drop-node').addEventListener('click',()=>{
  if(!ctxTarget)return;
  dropNode(ctxTarget.id);render();closeCtx();
});
document.getElementById('ctx-drop-tree').addEventListener('click',()=>{
  if(!ctxTarget)return;
  dropSubtree(ctxTarget.id,_allPieces);render();closeCtx();
});
document.getElementById('ctx-restore').addEventListener('click',()=>{
  if(!ctxTarget)return;
  restoreSubtree(ctxTarget.id,_allPieces);render();closeCtx();
});

/* ── toggle ──────────────────────────────────────────────────────── */
document.getElementById('toggleDropped').addEventListener('click',()=>{
  showDropped=!showDropped;
  render();
});

/* ── load + initial render ───────────────────────────────────────── */
async function load(){
  [lineageData,prefsData]=await Promise.all([
    fetch('lineage.json',{cache:'no-cache'}).then(r=>r.json()),
    fetch('scripts/preferences.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>({marks:{}}))
  ]);
  render();
}
load();
</script>
</body>
</html>
