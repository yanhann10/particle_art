name: Build thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'pieces/**'
      - 'lineage.json'
      - 'scripts/render_thumbs.py'
      - '.github/workflows/build-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Render thumbnails
        run: python3 scripts/render_thumbs.py

      - name: Commit thumbs
        run: |
          git config user.name  "particle-art-bot"
          git config user.email "particle-art-bot@users.noreply.github.com"
          git add thumbs/
          if git diff --staged --quiet; then
            echo "no thumbnail changes"
          else
            git commit -m "render thumbnails [skip ci]"
            git push
          fi
