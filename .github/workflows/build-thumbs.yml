name: Build thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'pieces/**'
      - 'lineage.json'
      - 'scripts/render_thumbs.py'
      - '.github/workflows/build-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

# serialize: only one thumb-builder runs at a time to avoid push races
concurrency:
  group: build-thumbs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Render thumbnails
        run: python3 scripts/render_thumbs.py

      - name: Commit thumbs
        run: |
          # use the repo owner's verified email so Vercel can attribute the commit
          git config user.name  "particle-art-bot"
          git config user.email "yanhann10@gmail.com"
          git add thumbs/
          if git diff --staged --quiet; then
            echo "no thumbnail changes"
            exit 0
          fi
          git commit -m "render thumbnails [skip ci]"
          # retry push w/ rebase against any newer mutations.
          # binary PNGs can't auto-merge, so on conflict we keep OUR freshly-rendered
          # thumbs (-X theirs in rebase semantics = the side being rebased = us).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            if ! git pull --rebase -X theirs --autostash; then
              echo "rebase failed at attempt $i — aborting"
              git rebase --abort 2>/dev/null || true
              # last-ditch: fetch and reset our index keeping our thumbs, redo the commit
              git fetch origin main
              git reset --soft origin/main
              git add thumbs/
              if git diff --staged --quiet; then
                echo "no thumb changes vs remote, exiting clean"; exit 0
              fi
              git commit -m "render thumbnails [skip ci]" --allow-empty-message --reuse-message=HEAD@{1} 2>/dev/null \
                || git commit -m "render thumbnails [skip ci]"
            fi
          done
          echo "push failed after 5 attempts"; exit 1
