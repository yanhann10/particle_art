name: Build thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'pieces/**'
      - 'lineage.json'
      - 'scripts/render_thumbs.py'
      - '.github/workflows/build-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

# serialize: only one thumb-builder runs at a time to avoid push races
concurrency:
  group: build-thumbs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Render thumbnails
        run: python3 scripts/render_thumbs.py

      - name: Commit thumbs
        run: |
          # use the repo owner's verified email so Vercel can attribute the commit
          git config user.name  "particle-art-bot"
          git config user.email "yanhann10@gmail.com"

          # HERMETIC PATTERN — each retry: reset to fresh origin/main, restore our
          # rendered thumbs from /tmp, stage thumbs/ only, commit, push. This makes
          # it structurally impossible for this workflow to commit reversions of
          # unrelated files (like scripts/, pieces/, lineage.json) when retrying
          # against a fast-moving main. Earlier "soft reset + index keeps prior
          # state" pattern was reverting mutation worker commits.
          mkdir -p /tmp/our-thumbs
          cp -r thumbs/. /tmp/our-thumbs/

          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -r /tmp/our-thumbs/. thumbs/

            git add thumbs/
            if git diff --staged --quiet; then
              echo "no thumbnail changes vs origin/main"; exit 0
            fi
            git commit -m "render thumbnails [skip ci]"
            if git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push rejected on attempt $i, refetching"
          done
          echo "push failed after 5 attempts"; exit 1
