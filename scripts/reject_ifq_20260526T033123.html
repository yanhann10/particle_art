<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ifq · folded leaves</title>
<!-- MOTION: unfurling, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ifq</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);

/* ── leaf-twirl curve generator ── */
function makeLeafCurve(lengthBase, twist, curlPower){
  const pts = [];
  const N = 80;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const len = lengthBase * Math.pow(t, 0.9);
    const curl = Math.pow(t, curlPower) * twist;
    const x = len * Math.cos(curl);
    const z = len * Math.sin(curl);
    const y = t * 0.4 * lengthBase - 0.2;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return new THREE.CatmullRomCurve3(pts);
}

/* ── leaf-sheet particle builder ── */
function buildLeafSheet(curve, particlesPerLeaf, widthProfile, seed){
  const positions = new Float32Array(particlesPerLeaf * 3);
  const seeds = new Float32Array(particlesPerLeaf);
  const spineTs = new Float32Array(particlesPerLeaf);
  const widths = new Float32Array(particlesPerLeaf);
  
  let idx = 0;
  const segN = 60;
  for (let i = 0; i <= segN && idx < particlesPerLeaf; i++){
    const t = i / segN;
    const pt = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const binormal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    
    const w = widthProfile(t);
    const ptsAcross = Math.max(2, Math.floor(8 * w));
    
    for (let j = 0; j < ptsAcross && idx < particlesPerLeaf; j++){
      const s = (j / Math.max(1, ptsAcross - 1)) - 0.5;
      const pos = pt.clone().addScaledVector(binormal, s * w);
      
      const jitter = 0.03 * w;
      pos.x += (Math.random() - 0.5) * jitter;
      pos.y += (Math.random() - 0.5) * jitter;
      pos.z += (Math.random() - 0.5) * jitter;
      
      positions[idx * 3] = pos.x;
      positions[idx * 3 + 1] = pos.y;
      positions[idx * 3 + 2] = pos.z;
      seeds[idx] = seed + Math.random() * 0.1;
      spineTs[idx] = t;
      widths[idx] = Math.abs(s);
      idx++;
    }
  }
  
  return { positions, seeds, spineTs, widths, count: idx };
}

/* ── width profiles ── */
const profiles = [
  t => 1.2 * (1 - Math.pow(t, 1.8)),
  t => 0.9 * Math.sin(t * Math.PI) * (1 - t * 0.3),
  t => 1.0 * (t < 0.5 ? t * 2 : (1 - t) * 2) * (1 - t * 0.5),
  t => 0.85 * Math.pow(Math.sin(t * Math.PI), 0.6),
  t => 1.1 * (1 - t) * (0.5 + 0.5 * Math.sin(t * 5)),
];

/* ── leaf ensemble configuration ── */
const leafConfigs = [
  { len: 4.5, twist: Math.PI * 2.2, curl: 1.4, pos: [0, 0, 0], rot: [0, 0, 0], scale: 1.0, profile: 0 },
  { len: 3.8, twist: Math.PI * 1.8, curl: 1.6, pos: [-1.2, 0.5, 0.8], rot: [0.3, -0.6, 0.2], scale: 0.85, profile: 1 },
  { len: 4.2, twist: Math.PI * 2.5, curl: 1.3, pos: [1.5, 0.3, -0.6], rot: [-0.2, 0.8, -0.1], scale: 0.9, profile: 2 },
  { len: 3.2, twist: Math.PI * 3.0, curl: 1.8, pos: [0.6, 1.2, 1.2], rot: [0.5, 0.3, 0.4], scale: 0.7, profile: 3 },
  { len: 5.0, twist: Math.PI * 1.6, curl: 1.2, pos: [-0.9, -0.4, -1.0], rot: [-0.4, -0.9, 0.3], scale: 1.1, profile: 4 },
  { len: 3.5, twist: Math.PI * 2.8, curl: 1.7, pos: [2.0, 0.8, 0.4], rot: [0.2, 1.2, -0.3], scale: 0.75, profile: 1 },
  { len: 4.0, twist: Math.PI * 2.0, curl: 1.5, pos: [-1.8, 0.6, -0.5], rot: [-0.3, -1.1, 0.2], scale: 0.8, profile: 3 },
];

const TOTAL_PARTICLES = 80000;
const particlesPerLeaf = Math.floor(TOTAL_PARTICLES / leafConfigs.length);

const allPos = [];
const allSeeds = [];
const allSpineTs = [];
const allWidths = [];
const allLeafIds = [];

leafConfigs.forEach((cfg, leafIdx) => {
  const curve = makeLeafCurve(cfg.len * cfg.scale, cfg.twist, cfg.curl);
  const profile = profiles[cfg.profile % profiles.length];
  const sheet = buildLeafSheet(curve, particlesPerLeaf, profile, leafIdx * 0.3);
  
  const rot = new THREE.Euler(cfg.rot[0], cfg.rot[1], cfg.rot[2]);
  const mat = new THREE.Matrix4().makeRotationFromEuler(rot);
  const offset = new THREE.Vector3(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
  
  for (let i = 0; i < sheet.count; i++){
    const p = new THREE.Vector3(
      sheet.positions[i * 3],
      sheet.positions[i * 3 + 1],
      sheet.positions[i * 3 + 2]
    );
    p.applyMatrix4(mat).add(offset);
    allPos.push(p.x, p.y, p.z);
    allSeeds.push(sheet.seeds[i]);
    allSpineTs.push(sheet.spineTs[i]);
    allWidths.push(sheet.widths[i]);
    allLeafIds.push(leafIdx);
  }
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.Float32BufferAttribute(allPos, 3));
geom.setAttribute('seed', new THREE.Float32BufferAttribute(allSeeds, 1));
geom.setAttribute('spineT', new THREE.Float32BufferAttribute(allSpineTs, 1));
geom.setAttribute('widthT', new THREE.Float32BufferAttribute(allWidths, 1));
geom.setAttribute('leafId', new THREE.Float32BufferAttribute(allLeafIds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uUnfurl: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uUnfurl;
    attribute float seed;
    attribute float spineT;
    attribute float widthT;
    attribute float leafId;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      
      /* unfurling animation — leaves unroll from base */
      float unfurlPhase = uUnfurl - (leafId * 0.08 + spineT * 0.6);
      float reveal = smoothstep(0.0, 1.0, unfurlPhase);
      
      /* coiled start state */
      vec3 coiled = vec3(
        p.x * 0.1 + sin(spineT * 12.0) * 0.2,
        p.y * 0.3 - 2.0,
        p.z * 0.1 + cos(spineT * 12.0) * 0.2
      );
      p = mix(coiled, p, reveal);
      
      /* gentle breeze sway */
      float t = uTime * 0.35 + seed * 6.28;
      float sway = 0.08 * spineT * widthT;
      p.x += sway * sin(t * 0.6 + spineT * 2.0);
      p.z += sway * cos(t * 0.5 + spineT * 1.8);
      p.y += sway * 0.3 * sin(t * 0.8 + leafId);
      
      /* edge flutter */
      float flutter = smoothstep(0.3, 0.5, widthT) * 0.05;
      p.y += flutter * sin(uTime * 3.5 + seed * 40.0 + spineT * 8.0);
      
      /* palette — warm amber autumn */
      vec3 ochre = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 copper = vec3(0.72, 0.45, 0.28);
      vec3 rust = vec3(0.62, 0.38, 0.24);
      
      /* spine is darker, edges lighter */
      vec3 baseCol = mix(sienna, ochre, spineT);
      baseCol = mix(baseCol, copper, widthT * 0.6);
      
      /* per-leaf hue shift */
      float leafHue = sin(leafId * 1.3) * 0.5 + 0.5;
      baseCol = mix(baseCol, rust, leafHue * 0.3);
      
      /* faint vein shimmer */
      float vein = smoothstep(0.15, 0.0, widthT) * 0.2;
      baseCol += vein * vec3(0.12, 0.08, 0.04) * (0.5 + 0.5 * sin(uTime * 0.4 + spineT * 10.0));
      
      vCol = baseCol;
      
      /* alpha: softer at edges, full at spine */
      float energy = 0.4 + 0.3 * sin(t * 0.5);
      vAlpha = (0.6 + energy) * (1.0 - widthT * 0.4) * reveal;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + energy * 0.4) * uPixel * (38.0 / dist) * reveal;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

geom.computeBoundingSphere();
const centroid = geom.boundingSphere.center.clone();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  /* unfurl over 3.5 seconds */
  uniforms.uUnfurl.value = Math.min(1.5, elapsed / 3.5);
  
  /* camera tracks centroid with gentle drift */
  const breathe = Math.sin(elapsed * 0.18) * 0.3;
  controls.target.y = centroid.y + breathe;
  controls.update();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
