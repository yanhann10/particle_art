<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>diamond field — wireframe lattice</title>
  <!-- MOTION: pulsation, intensity: calm -->
  <style>
    *{margin:0;padding:0}
    body{background:#1a1a1a;overflow:hidden}
    canvas{display:block}
    #id{position:fixed;bottom:8px;left:8px;font-family:ui-monospace,monospace;color:#cdd2dc;opacity:0.55;font-size:11px;pointer-events:none}
  </style>
</head>
<body>
<div id="id">an7</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// ── Deterministic seeded RNG ──────────────────────────────────────────────
function seededRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = seededRNG(0xDEADBEEF);
const rand = (a, b) => a + rng() * (b - a);

// ── Scene setup ───────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const W = innerWidth, H = innerHeight;
const camera = new THREE.OrthographicCamera(
  -W / 2, W / 2, H / 2, -H / 2, 0.1, 1000
);
camera.position.set(0, 0, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

// ── Diamond geometry ──────────────────────────────────────────────────────
function createDiamondWireframe(size) {
  const hw = size / 2;
  const hh = size / 2;
  
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    0, hh, 0,      // top
    hw, 0, 0,      // right
    0, -hh, 0,     // bottom
    -hw, 0, 0,     // left
    0, hh, 0,      // close loop
  ]);
  
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  return geometry;
}

// ── Color gradient function ──────────────────────────────────────────────
function getColorForY(y, minY, maxY) {
  const t = (y - minY) / (maxY - minY);
  // Bottom (t=0): warm amber #d4a574
  // Top (t=1): silver-grey #b8bcc4
  const bottomR = 0xd4 / 255, bottomG = 0xa5 / 255, bottomB = 0x74 / 255;
  const topR = 0xb8 / 255, topG = 0xbc / 255, topB = 0xc4 / 255;
  
  const r = bottomR + (topR - bottomR) * t;
  const g = bottomG + (topG - bottomG) * t;
  const b = bottomB + (topB - bottomB) * t;
  
  return new THREE.Color(r, g, b);
}

// ── Build diamond lattice ─────────────────────────────────────────────────
const diamonds = [];
const LARGE_SIZE = 85;
const SMALL_SIZE = 52;
const ROW_SPACING_Y = 58;
const COL_SPACING_X = 70;
const OFFSET_SHIFT = COL_SPACING_X / 2;

const rows = Math.ceil(H / ROW_SPACING_Y) + 3;
const cols = Math.ceil(W / COL_SPACING_X) + 3;

const startY = -H / 2 - ROW_SPACING_Y;
const startX = -W / 2 - COL_SPACING_X;

const minY = startY;
const maxY = startY + rows * ROW_SPACING_Y;

for (let row = 0; row < rows; row++) {
  const y = startY + row * ROW_SPACING_Y;
  const isOffsetRow = row % 2 === 1;
  const xShift = isOffsetRow ? OFFSET_SHIFT : 0;
  
  for (let col = 0; col < cols; col++) {
    const x = startX + col * COL_SPACING_X + xShift;
    
    // Alternate between large and small diamonds
    const useLarge = (row + col) % 2 === 0;
    const size = useLarge ? LARGE_SIZE : SMALL_SIZE;
    const geo = createDiamondWireframe(size);
    
    const color = getColorForY(y, minY, maxY);
    const mat = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: rand(0.4, 1.0),
    });
    
    const line = new THREE.Line(geo, mat);
    line.position.set(x, y, useLarge ? 5 : 0);
    
    scene.add(line);
    
    diamonds.push({
      mesh: line,
      baseOpacity: mat.opacity,
      rotationSpeed: rand(-0.15, 0.15),
      rotationPhase: rand(0, Math.PI * 2),
      pulseFreq: rand(0.5, 1.2),
      pulsePhase: rand(0, Math.PI * 2),
    });
  }
}

// ── Animation loop ────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  totalTime += dt;
  
  for (const d of diamonds) {
    // Gentle rotation ±5 degrees
    const rotationOffset = Math.sin(totalTime * 0.8 + d.rotationPhase) * (Math.PI / 36); // 5 degrees
    d.mesh.rotation.z = rotationOffset;
    
    // Opacity pulse 0.4–1.0
    const pulseFactor = Math.sin(totalTime * d.pulseFreq + d.pulsePhase) * 0.5 + 0.5;
    d.mesh.material.opacity = 0.4 + pulseFactor * 0.6;
  }
  
  renderer.render(scene, camera);
}

animate();

// ── Resize handler ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const w = innerWidth;
  const h = innerHeight;
  camera.left = -w / 2;
  camera.right = w / 2;
  camera.top = h / 2;
  camera.bottom = -h / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
</body>
</html>
