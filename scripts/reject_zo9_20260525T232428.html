<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zo9 · membrane dissolution</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">zo9</div>
<div class="hint">drag to orbit · scroll to zoom · click to regenerate</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Biomorphic L-system — leaf-vein abstraction ── */
const RULES = {
  'F': [
    { p: 0.35, s: 'F[+F]F[-F][F]' },
    { p: 0.30, s: 'FF[/F\\F]' },
    { p: 0.20, s: 'F[+F-F]' },
    { p: 0.15, s: 'F[\\F][/F]F' },
  ],
  'X': [
    { p: 0.5, s: 'F[+X][-X]FX' },
    { p: 0.5, s: 'F[\\X][/X]FX' },
  ]
};
const ANGLE_BASE = THREE.MathUtils.degToRad(28);
const STEP_BASE = 1.2;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, seed){
  const H = new THREE.Vector3(0,1,0);
  const L = new THREE.Vector3(-1,0,0);
  const U = new THREE.Vector3(0,0,1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  
  for (const ch of str){
    const angleVar = ANGLE_BASE * (0.7 + 0.6 * rng());
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(0.72, gen) * (0.85 + 0.3 * rng());
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen, vein: rng() });
        pos = next;
        break;
      }
      case 'X': break;
      case '+': rotate(u, +angleVar); break;
      case '-': rotate(u, -angleVar); break;
      case '&': rotate(l, +angleVar); break;
      case '^': rotate(l, -angleVar); break;
      case '/': rotate(h, +angleVar); break;
      case '\\': rotate(h, -angleVar); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return segments;
}

function buildParticles(segments, totalN, seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN);
  const veins = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;
  
  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++){
      const t = rng();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      
      const lateral = Math.pow(t * (1-t) * 4, 0.6);
      const spread = 0.25 * Math.pow(0.8, segments[i].gen);
      const perpDir = new THREE.Vector3(
        segments[i].to.z - segments[i].from.z,
        0,
        -(segments[i].to.x - segments[i].from.x)
      ).normalize();
      
      const lateralDist = (rng() - 0.5) * spread * lateral * 3.5;
      v.addScaledVector(perpDir, lateralDist);
      
      const jitter = 0.08 * Math.pow(0.78, segments[i].gen);
      v.x += (rng()-0.5)*jitter;
      v.y += (rng()-0.5)*jitter;
      v.z += (rng()-0.5)*jitter;
      
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written] = rng();
      gens[written]  = segments[i].gen;
      veins[written] = segments[i].vein;
      written++;
    }
  }
  return { positions, seeds, gens, veins };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 8, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 4, 0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uDissolve: { value: 0 },
  uCentroid: { value: new THREE.Vector3(0, 4, 0) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uDissolve;
    uniform vec3 uCentroid;
    attribute float seed;
    attribute float gen;
    attribute float vein;
    varying vec3 vCol;
    varying float vAlpha;

    vec3 hash3(float p){
      vec3 p3 = fract(vec3(p) * vec3(0.1031, 0.1030, 0.0973));
      p3 += dot(p3, p3.yxz + 33.33);
      return fract((p3.xxy + p3.yxx) * p3.zyx);
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;

      /* biomorphic sway — organic membrane breathing */
      float swayPhase = t * 0.6 + p.y * 0.2;
      float swayAmp = 0.12 * (0.3 + 0.7 * gen / 6.0);
      p.x += swayAmp * sin(swayPhase);
      p.z += swayAmp * cos(swayPhase * 0.8 + seed * 3.14);
      
      /* vein pulse — veins contract/expand */
      float veinPulse = sin(uTime * 0.5 + vein * 6.28) * 0.5 + 0.5;
      float veinInfluence = smoothstep(0.3, 0.7, vein);
      float veinScale = mix(1.0, 0.92 + veinPulse * 0.16, veinInfluence);
      vec3 toCenter = p - uCentroid;
      p = uCentroid + toCenter * veinScale;

      /* reveal animation — particles emerge from void */
      vec3 entry = hash3(seed * 100.0) * 20.0 - 10.0;
      entry.y += 15.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* dissolution — edge particles drift away */
      float edgeDist = length(p.xz) / (length(p.xz) + 2.0);
      float dissolveForce = uDissolve * smoothstep(0.4, 0.9, edgeDist) * seed;
      vec3 dissolveDir = normalize(hash3(seed * 200.0) - 0.5);
      p += dissolveDir * dissolveForce * 4.5;
      p.y -= dissolveForce * 0.8;

      /* tremor — high-frequency membrane flutter */
      float tremor = 0.04 * sin(uTime * 8.0 + seed * 40.0) * (1.0 - veinInfluence);
      p += hash3(seed * 300.0) * tremor;

      /* ── palette: chlorophyll membrane ── */
      float energy = 0.5 + 0.5 * sin(t * 0.7);

      vec3 deepChlorophyll = vec3(0.12, 0.22, 0.15);
      vec3 freshLeaf       = vec3(0.25, 0.55, 0.30);
      vec3 veinGold        = vec3(0.72, 0.65, 0.35);
      vec3 paleMargin      = vec3(0.45, 0.58, 0.42);
      vec3 autumnBlush     = vec3(0.68, 0.42, 0.28);

      float genNorm = gen / 6.0;
      vec3 baseCol = mix(deepChlorophyll, freshLeaf, genNorm);
      
      /* veins show gold highlights */
      baseCol = mix(baseCol, veinGold, veinInfluence * veinPulse * 0.6);
      
      /* edge particles fade toward pale margin */
      baseCol = mix(baseCol, paleMargin, edgeDist * 0.4);
      
      /* dissolved particles shift toward autumn tones */
      baseCol = mix(baseCol, autumnBlush, dissolveForce * 0.5);
      
      /* subtle luminescence along veins */
      float veinGlow = veinInfluence * (0.3 + 0.7 * veinPulse);
      baseCol += vec3(0.08, 0.12, 0.06) * veinGlow;

      vCol = baseCol;

      /* alpha: dissolved particles fade */
      vAlpha = (0.5 + 0.5 * energy) * (1.0 - dissolveForce * 0.6);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.5 * energy) * uPixel * (38.0/dist) * (0.5 + 0.5*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;
let currentSeed = 0;

function regrow(seed){
  currentSeed = seed;
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const axiom = rng() > 0.5 ? 'X' : 'F';
  const str = expand(axiom, 5, rng);
  const segs = turtle(str, seed);
  
  const bb = new THREE.Box3();
  for (const sg of segs){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  
  for (const sg of segs){
    sg.from.sub(ctr);
    sg.to.sub(ctr);
    sg.from.y += 4;
    sg.to.y += 4;
  }
  
  const { positions, seeds, gens, veins } = buildParticles(segs, N, seed);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('vein',     new THREE.BufferAttribute(veins, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
    geom.attributes.vein.array.set(veins);          geom.attributes.vein.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  
  const finalBB = new THREE.Box3();
  for (let i = 0; i < positions.length; i+=3){
    finalBB.expandByPoint(new THREE.Vector3(positions[i], positions[i+1], positions[i+2]));
  }
  const centroid = finalBB.getCenter(new THREE.Vector3());
  uniforms.uCentroid.value.copy(centroid);
  
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2500);
  }

  /* dissolution cycle — membrane breathes between intact and fragmenting */
  const dissolveCycle = elapsed * 0.08;
  const dissolveSin = Math.sin(dissolveCycle) * 0.5 + 0.5;
  uniforms.uDissolve.value = Math.pow(dissolveSin, 2.2) * 0.4;

  /* camera gentle drift tracking centroid */
  const driftX = Math.sin(elapsed * 0.15) * 1.2;
  const driftY = Math.cos(elapsed * 0.12) * 0.8;
  controls.target.x = driftX;
  controls.target.y = 4 + driftY;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
