<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ofg · twin sphere orbits</title>
<!-- MOTION: orbit, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050818; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">ofg</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050818, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 20);
camera.lookAt(0, 0, 0);

const CLUSTER_Y   = [-6.0, 6.0];
const N_PER       = 3200;
const N           = N_PER * CLUSTER_Y.length;

const positions  = new Float32Array(N * 3);
const aTheta     = new Float32Array(N);
const aPhi       = new Float32Array(N);
const aR         = new Float32Array(N);
const aSpeed     = new Float32Array(N);
const aClusterY  = new Float32Array(N);

let idx = 0;
for (let ci = 0; ci < CLUSTER_Y.length; ci++) {
  const cy = CLUSTER_Y[ci];
  for (let i = 0; i < N_PER; i++) {
    // Uniform distribution on sphere
    const theta = Math.acos(2.0 * Math.random() - 1.0);
    const phi   = Math.random() * Math.PI * 2.0;

    // Radius: 2.5 + Gaussian(sigma=0.8), clamped positive
    const u1  = Math.max(1e-9, Math.random());
    const gn  = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * Math.random());
    const r   = Math.max(0.4, 2.5 + gn * 0.8);

    // Base angular speed 0.4 rad/s ± slight variation per particle
    const speed = 0.36 + Math.random() * 0.08;

    // Initial position matches shader output at t=0
    positions[idx * 3]     = r * Math.sin(theta) * Math.cos(phi);
    positions[idx * 3 + 1] = cy + r * Math.cos(theta);
    positions[idx * 3 + 2] = r * Math.sin(theta) * Math.sin(phi);

    aTheta[idx]    = theta;
    aPhi[idx]      = phi;
    aR[idx]        = r;
    aSpeed[idx]    = speed;
    aClusterY[idx] = cy;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',  new THREE.BufferAttribute(positions,  3));
geom.setAttribute('aTheta',    new THREE.BufferAttribute(aTheta,     1));
geom.setAttribute('aPhi',      new THREE.BufferAttribute(aPhi,       1));
geom.setAttribute('aR',        new THREE.BufferAttribute(aR,         1));
geom.setAttribute('aSpeed',    new THREE.BufferAttribute(aSpeed,     1));
geom.setAttribute('aClusterY', new THREE.BufferAttribute(aClusterY,  1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0.0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float aTheta;
    attribute float aPhi;
    attribute float aR;
    attribute float aSpeed;
    attribute float aClusterY;

    void main() {
      // Each particle orbits in its own fixed polar plane;
      // only azimuth phi advances — keeps void between clusters stable.
      float phi  = aPhi + aSpeed * uTime;
      float sinT = sin(aTheta);
      float cosT = cos(aTheta);

      vec3 worldPos = vec3(
        aR * sinT * cos(phi),
        aClusterY + aR * cosT,
        aR * sinT * sin(phi)
      );

      vec4 mvPos   = modelViewMatrix * vec4(worldPos, 1.0);
      float depth  = max(4.0, abs(mvPos.z));
      gl_PointSize = max(1.5, 4.0 * uPixel * (18.0 / depth));
      gl_Position  = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    void main() {
      vec2  uv    = gl_PointCoord - 0.5;
      float alpha = exp(-dot(uv, uv) * 18.0) * 0.9;
      if (alpha < 0.005) discard;
      gl_FragColor = vec4(vec3(1.0, 0.95, 0.88) * alpha, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) * 0.001;
  mat.uniforms.uTime.value = t;
  // Very subtle breath — stays within ~1 unit of (0,0,20)
  camera.position.x = Math.sin(t * 0.04) * 0.7;
  camera.position.y = Math.sin(t * 0.027) * 0.35;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
