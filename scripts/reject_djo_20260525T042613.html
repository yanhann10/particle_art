<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>djo · sparse vertical columns</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
<!-- MOTION: rise, intensity: calm -->
</head>
<body>
<div class="id">djo · sparse vertical columns</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// 4 narrow Gaussian columns of particles rising slowly
// particles fade from dark at bottom to bright amber-white near top
// additive blend on pure black

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 12);
camera.lookAt(0, 2.5, 0);

// 4 columns: x positions
const COLUMNS = [-2.8, -0.9, 0.9, 2.8];
const N_PER_COL = 6000;
const N = N_PER_COL * COLUMNS.length;

const positions = new Float32Array(N * 3);
const ages = new Float32Array(N);
const columns = new Float32Array(N); // 0,1,2,3

for (let c = 0; c < COLUMNS.length; c++){
  const xBase = COLUMNS[c];
  for (let i = 0; i < N_PER_COL; i++){
    const idx = c * N_PER_COL + i;
    // Gaussian spread in xz, uniform in y
    const angle = Math.random() * Math.PI * 2;
    const rad = Math.abs(gaussianRandom()) * 0.22;
    positions[idx*3]   = xBase + Math.cos(angle) * rad;
    positions[idx*3+1] = Math.random() * 8.0; // 0→8 height
    positions[idx*3+2] = Math.sin(angle) * rad;
    ages[idx] = Math.random();
    columns[idx] = c;
  }
}

function gaussianRandom(){
  let u = 0, v = 0;
  while(u === 0) u = Math.random();
  while(v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('age', new THREE.BufferAttribute(ages, 1));
geom.setAttribute('column', new THREE.BufferAttribute(columns, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float age;
    attribute float column;
    varying float vBrightness;
    void main(){
      vec3 p = position;
      
      // rise slowly, loop when exceeding 8
      float speed = 0.4;
      p.y = mod(p.y + uTime * speed + age * 3.0, 8.0);
      
      // brightness increases with height
      float heightFactor = smoothstep(0.0, 8.0, p.y);
      vBrightness = heightFactor;
      
      vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mvPos;
      
      // large soft sprites, bigger near top
      float size = 18.0 + heightFactor * 12.0;
      gl_PointSize = size * uPixel * (4.0 / -mvPos.z);
    }
  `,
  fragmentShader: `
    varying float vBrightness;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      
      // soft Gaussian falloff
      float alpha = exp(-r * r * 8.0);
      
      // warm amber-white palette
      vec3 darkAmber = vec3(0.4, 0.25, 0.1);
      vec3 brightAmber = vec3(1.0, 0.85, 0.6);
      vec3 col = mix(darkAmber, brightAmber, vBrightness);
      
      float finalAlpha = alpha * vBrightness * 0.7;
      gl_FragColor = vec4(col * finalAlpha, finalAlpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(t){
  mat.uniforms.uTime.value = t / 1000;
  
  // subtle camera sway
  camera.position.x = Math.sin(t * 0.0001) * 1.2;
  camera.lookAt(0, 2.5, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(0);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
</html>
