<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9ri · teardrop drift</title>
<!-- MOTION: rise, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0e18; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">9ri</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  INTENTION: memory as delicate outline rising through a deep space — the vessel form
             dissolved to its essential arc, each teardrop a breath that ascends
  ARC: teardrops born at depth drift upward with varying speeds; rotation reveals
       their curved silhouette; smallest ones move fastest, largest drift slower;
       continuous soft ascent through navy void
  HOOK: 120 unique teardrops, each a sparse traced outline (30–60 line segments per form),
        rotating independently; no fills, only silver-white arcs; depth creates soft scale
  After: Chiharu Shiota thread suspension × Olafur Eliasson void light (2024)
*/

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e18, 15, 80);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e18, 1);
document.body.appendChild(renderer.domElement);

// ── seeded RNG ───────────────────────────────────────────────────────────────
let rngState = 0xDEADBEEF;
function rng() {
  rngState = (rngState + 0x6D2B79F5) | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── teardrop outline builder ─────────────────────────────────────────────────
// Elongated teardrop: parametric curve combining top sphere arc + bottom taper
function buildTeardropOutline(segments, scale, seed) {
  const positions = [];
  const ELONGATION = 1.8 + seed * 0.4; // 1.8–2.2× height
  const TOP_RADIUS = 1.0;
  const BOTTOM_Y = -ELONGATION * TOP_RADIUS;

  // Top hemisphere (60% of segments)
  const topSegs = Math.floor(segments * 0.6);
  for (let i = 0; i <= topSegs; i++) {
    const theta = (i / topSegs) * Math.PI; // 0→π (hemisphere)
    const x = Math.sin(theta) * TOP_RADIUS;
    const y = Math.cos(theta) * TOP_RADIUS * 0.85; // slight flatten
    positions.push(x * scale, y * scale, 0);
  }

  // Bottom taper (40% of segments)
  const botSegs = segments - topSegs;
  const startX = Math.sin(Math.PI) * TOP_RADIUS * scale; // ~0
  const startY = Math.cos(Math.PI) * TOP_RADIUS * 0.85 * scale;
  for (let i = 1; i <= botSegs; i++) {
    const t = i / botSegs;
    const easedT = t * t; // quadratic ease toward point
    const x = startX * (1.0 - easedT);
    const y = startY + (BOTTOM_Y * scale - startY) * t;
    positions.push(x, y, 0);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  return geom;
}

// ── spawn teardrops ──────────────────────────────────────────────────────────
const teardrops = [];
const NUM_DROPS = 120;

for (let i = 0; i < NUM_DROPS; i++) {
  const seed = rng();
  const scale = 0.3 + seed * 1.7; // 0.3–2.0×
  const segments = 30 + Math.floor(rng() * 30); // 30–60 segments

  const geom = buildTeardropOutline(segments, scale, seed);
  const mat = new THREE.LineBasicMaterial({
    color: 0xd0dce8,
    transparent: true,
    opacity: 0.35 + rng() * 0.25, // 0.35–0.6
    fog: true
  });
  const line = new THREE.Line(geom, mat);

  // spawn position: scattered across wide XZ plane, deep Y range
  line.position.set(
    (rng() - 0.5) * 50,
    -30 + rng() * 60, // -30 to +30
    (rng() - 0.5) * 50
  );

  // rotation: random initial spin
  line.rotation.set(
    rng() * Math.PI * 2,
    rng() * Math.PI * 2,
    rng() * Math.PI * 2
  );

  // motion params stored on userData
  line.userData.riseSpeed = (0.8 + rng() * 0.5) / scale; // smaller = faster
  line.userData.rotSpeed = [(rng() - 0.5) * 0.15, (rng() - 0.5) * 0.15, (rng() - 0.5) * 0.15];
  line.userData.spawnY = line.position.y;
  line.userData.maxY = 40;

  scene.add(line);
  teardrops.push(line);
}

// ── camera ───────────────────────────────────────────────────────────────────
camera.position.set(0, 0, 30);
camera.lookAt(0, 0, 0);

// ── ambient light ────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x3a4a5c, 0.6);
scene.add(ambient);

// ── resize ───────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── animate ──────────────────────────────────────────────────────────────────
const t0 = performance.now();

function loop() {
  const t = (performance.now() - t0) / 1000;

  // update each teardrop
  for (let drop of teardrops) {
    const ud = drop.userData;

    // rise
    drop.position.y += ud.riseSpeed * 0.016; // ~60fps → ~1 unit/sec for speed=1

    // wrap when above max
    if (drop.position.y > ud.maxY) {
      drop.position.y = -30 + (drop.position.y - ud.maxY);
    }

    // rotate
    drop.rotation.x += ud.rotSpeed[0] * 0.016;
    drop.rotation.y += ud.rotSpeed[1] * 0.016;
    drop.rotation.z += ud.rotSpeed[2] * 0.016;
  }

  // gentle camera drift
  camera.position.x = Math.sin(t * 0.08) * 3;
  camera.position.y = Math.cos(t * 0.06) * 2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>
</body>
</html>
