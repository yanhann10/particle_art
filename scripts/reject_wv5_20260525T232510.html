<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>wv5 — interlocking diamond field</title>
<style>
*{margin:0;padding:0}
body{background:#0a0a0e;overflow:hidden}
canvas{display:block}
#id{position:fixed;bottom:8px;left:8px;font-family:ui-monospace,monospace;color:#cdd2dc;opacity:0.55;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="id">wv5</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const W = innerWidth, H = innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0e);

const camera = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, 0.1, 1000);
camera.position.set(0, 0, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

// ── Seeded RNG ────────────────────────────────────────────────────────────
function seededRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = seededRNG(0x1A2B3C4D);

// ── Diamond glyph generator ───────────────────────────────────────────────
function createDiamondGlyph(size) {
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    0, size, 0,      // top
    size, 0, 0,      // right
    0, -size, 0,     // bottom
    -size, 0, 0,     // left
    0, size, 0       // close loop
  ]);
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  return geometry;
}

// ── Field configuration ───────────────────────────────────────────────────
const ROWS = 18;
const COLS = 12;
const COUNT = ROWS * COLS;
const SPACING_X = W / (COLS - 1);
const SPACING_Y = H / (ROWS - 1);
const OFFSET = SPACING_X * 0.5;

const SIZE_LARGE = Math.min(SPACING_X, SPACING_Y) * 0.42;
const SIZE_SMALL = SIZE_LARGE * 0.62;

const diamonds = [];
const diamondData = [];

// ── Generate field ────────────────────────────────────────────────────────
for (let row = 0; row < ROWS; row++) {
  const yFrac = row / (ROWS - 1);
  const yPos = -H/2 + row * SPACING_Y;
  const rowOffset = (row % 2) * OFFSET;
  
  for (let col = 0; col < COLS; col++) {
    const xPos = -W/2 + col * SPACING_X + rowOffset;
    
    // Determine size (alternating pattern with some randomness)
    const isLarge = ((row + col) % 2 === 0) && rng() > 0.3;
    const size = isLarge ? SIZE_LARGE : SIZE_SMALL;
    const zPos = isLarge ? 10 : -5;
    
    // Color gradient: amber to silver
    const t = yFrac * 0.9 + rng() * 0.1;
    const amber = new THREE.Color(0xffb347);
    const silver = new THREE.Color(0xe8e8f0);
    const color = amber.clone().lerp(silver, t);
    
    // Create line geometry
    const geometry = createDiamondGlyph(size);
    const material = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.7,
      linewidth: 1
    });
    
    const line = new THREE.Line(geometry, material);
    line.position.set(xPos, yPos, zPos);
    scene.add(line);
    
    diamonds.push(line);
    diamondData.push({
      baseRotation: (rng() - 0.5) * Math.PI * 0.08,
      rotationSpeed: (rng() - 0.5) * 0.6,
      pulsePhase: rng() * Math.PI * 2,
      pulseSpeed: 0.8 + rng() * 0.4,
      baseOpacity: 0.5 + rng() * 0.3
    });
  }
}

// ── Animation loop ────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  totalTime += dt;
  
  diamonds.forEach((diamond, i) => {
    const data = diamondData[i];
    
    // Gentle rotation ±5 degrees
    const rotationRange = Math.PI / 36; // 5 degrees
    const rotation = data.baseRotation + Math.sin(totalTime * data.rotationSpeed + data.pulsePhase) * rotationRange;
    diamond.rotation.z = rotation;
    
    // Opacity pulse 0.4 to 1.0
    const pulse = Math.sin(totalTime * data.pulseSpeed + data.pulsePhase) * 0.5 + 0.5;
    const opacity = 0.4 + pulse * 0.6;
    diamond.material.opacity = opacity * data.baseOpacity;
  });
  
  renderer.render(scene, camera);
}

animate();

// ── Resize handler ────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const newW = innerWidth;
  const newH = innerHeight;
  
  camera.left = -newW/2;
  camera.right = newW/2;
  camera.top = newH/2;
  camera.bottom = -newH/2;
  camera.updateProjectionMatrix();
  
  renderer.setSize(newW, newH);
});
</script>
<!-- MOTION: pulse, intensity: gentle -->
</body>
</html>
