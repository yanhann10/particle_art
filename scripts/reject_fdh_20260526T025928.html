<head>
<meta charset="utf-8">

<title>fdh · leaf-flutter-nautilus</title>
<!-- MOTION: oscillation, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c11; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">fdh · leaf-flutter-nautilus</div>
<div class="hint">golden-spiral shell chambers · each a leaf · edge-weighted flutter</div>
<div class="src">Nautilus pompilius × leaf venation × biomechanics</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c11, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 35, 85);
camera.lookAt(0, 0, 0);

// Nautilus shell: logarithmic spiral in 3D
// Each chamber is a LEAF — the leaf is the unit of composition
const PHI = 1.618033988749;
const GOLDEN_ANGLE = Math.PI * (3.0 - Math.sqrt(5.0)); // ~137.5°
const NUM_CHAMBERS = 42;

const leafGeometry = new THREE.BufferGeometry();
const leafVerts = [];
const leafColors = [];
const leafUVs = [];
const leafIndices = [];

// Palette: fossil-cream, shell-nacre, oxidized-copper, deep-ocean
const palette = [
  new THREE.Color(0xe8dcc8), // fossil cream
  new THREE.Color(0xb8c4d4), // nacre blue
  new THREE.Color(0x8fa899), // verdigris
  new THREE.Color(0x4a5d6b), // deep ocean
  new THREE.Color(0xc9a86a)  // amber accent
];

// Build nautilus as a spiral of leaf-chambers
for (let i = 0; i < NUM_CHAMBERS; i++) {
  const t = i / NUM_CHAMBERS;
  const angle = i * GOLDEN_ANGLE;
  
  // Logarithmic spiral radius
  const r = 2.5 * Math.pow(PHI, t * 3.2);
  
  // Position on spiral (flat spiral initially, will rotate)
  const cx = r * Math.cos(angle);
  const cy = r * Math.sin(angle);
  const cz = t * 8.0 - 4.0; // slight depth progression
  
  // Leaf size grows with chamber size
  const leafW = r * 0.45;
  const leafH = r * 0.72;
  
  // Rotation: tangent to spiral + some perpendicular tilt
  const tangentAngle = angle + Math.PI * 0.5;
  const tiltAngle = t * Math.PI * 0.3; // chambers curl inward
  
  // Color: cycle through palette with depth
  const colorIndex = Math.floor(t * 4.5) % palette.length;
  const col = palette[colorIndex];
  
  // Leaf shape: pointed oval (leaf-like)
  const SEGMENTS = 18;
  const baseIdx = leafVerts.length / 3;
  
  // Center vertex
  leafVerts.push(cx, cy, cz);
  leafColors.push(col.r, col.g, col.b);
  leafUVs.push(0.5, 0.5);
  
  // Edge vertices — form a leaf outline
  for (let s = 0; s <= SEGMENTS; s++) {
    const u = s / SEGMENTS;
    const theta = u * Math.PI * 2.0;
    
    // Leaf outline: pointed at top, rounded at base
    const radialScale = Math.sin(theta * 0.5); // pointed ends
    const localX = Math.cos(theta) * leafW * radialScale;
    const localY = Math.sin(theta) * leafH * radialScale;
    
    // Apply rotation (tangent + tilt)
    const cosT = Math.cos(tangentAngle);
    const sinT = Math.sin(tangentAngle);
    const cosTilt = Math.cos(tiltAngle);
    const sinTilt = Math.sin(tiltAngle);
    
    // Rotate around spiral tangent
    let px = localX * cosT - localY * sinT;
    let py = localX * sinT + localY * cosT;
    let pz = 0;
    
    // Tilt perpendicular (curl chambers inward)
    const py2 = py * cosTilt - pz * sinTilt;
    const pz2 = py * sinTilt + pz * cosTilt;
    
    leafVerts.push(cx + px, cy + py2, cz + pz2);
    
    // Color: slightly darker at edges (venation darkness)
    const edgeDarken = 0.85;
    leafColors.push(col.r * edgeDarken, col.g * edgeDarken, col.b * edgeDarken);
    
    // UV for flutter calculation (distance from midrib = u distance from center)
    leafUVs.push(u, radialScale);
  }
  
  // Triangles: center to edge loop
  for (let s = 0; s < SEGMENTS; s++) {
    const i0 = baseIdx;
    const i1 = baseIdx + 1 + s;
    const i2 = baseIdx + 1 + ((s + 1) % (SEGMENTS + 1));
    leafIndices.push(i0, i1, i2);
  }
}

leafGeometry.setAttribute('position', new THREE.Float32BufferAttribute(leafVerts, 3));
leafGeometry.setAttribute('color', new THREE.Float32BufferAttribute(leafColors, 3));
leafGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(leafUVs, 2));
leafGeometry.setIndex(leafIndices);
leafGeometry.computeVertexNormals();

// Store original positions for flutter
const originalPositions = leafVerts.slice();

const leafMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uLightDir: { value: new THREE.Vector3(0.6, 0.8, 0.5).normalize() }
  },
  vertexShader: `
    attribute vec3 color;
    varying vec3 vColor;
    varying vec3 vNormal;
    varying float vEdgeDist;
    uniform float uTime;
    
    void main() {
      vColor = color;
      vNormal = normalize(normalMatrix * normal);
      
      // UV.x = distance along edge loop (0 at center, 1 at far edge)
      // UV.y = radial scale (how far from midrib)
      vEdgeDist = uv.y;
      
      vec3 pos = position;
      
      // Edge-weighted flutter: amplitude modulated by distance from midrib
      // Elegant biomechanical detail — edges flutter more than center
      float seed = float(gl_VertexID) * 0.017; // per-vertex phase
      float flutterAmp = vEdgeDist * 0.12 * sin(uTime * 2.5 + seed * 12.0);
      
      // Apply flutter perpendicular to local leaf plane (approximate: use normal)
      pos += normal * flutterAmp;
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying vec3 vNormal;
    varying float vEdgeDist;
    uniform vec3 uLightDir;
    
    void main() {
      // Diffuse shading
      float ndl = max(0.0, dot(vNormal, uLightDir));
      float ambient = 0.25;
      float diffuse = ndl * 0.75;
      float lighting = ambient + diffuse;
      
      // Subtle edge highlight (venation glow)
      float edgeGlow = smoothstep(0.7, 1.0, vEdgeDist) * 0.15;
      
      vec3 litColor = vColor * lighting + vec3(edgeGlow);
      
      // Slight translucency feel
      float alpha = 0.95 + vEdgeDist * 0.05;
      
      gl_FragColor = vec4(litColor, alpha);
    }
  `,
  side: THREE.DoubleSide,
  transparent: true,
  depthWrite: true
});

const leafMesh = new THREE.Mesh(leafGeometry, leafMaterial);
scene.add(leafMesh);

// Soft ambient light
const ambientLight = new THREE.AmbientLight(0x9ba5b8, 0.4);
scene.add(ambientLight);

// Directional key light (slightly warm)
const dirLight = new THREE.DirectionalLight(0xffeac8, 0.6);
dirLight.position.set(4, 6, 3);
scene.add(dirLight);

// Subtle volumetric fog (depth atmosphere)
scene.fog = new THREE.Fog(0x0a0c11, 40, 140);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Camera: slow orbit with slight breathing motion
let time = 0;
function loop() {
  time += 0.016;
  
  leafMaterial.uniforms.uTime.value = time;
  
  // Camera orbit: slow, contemplative
  const orbitRadius = 85;
  const orbitSpeed = 0.00018;
  const angle = time * orbitSpeed;
  camera.position.x = Math.sin(angle) * orbitRadius;
  camera.position.z = Math.cos(angle) * orbitRadius;
  
  // Slight vertical breathing
  camera.position.y = 35 + Math.sin(time * 0.0012) * 8;
  
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
