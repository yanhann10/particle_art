<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g83 · flock as ink-stroke field</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a14; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      radial-gradient(ellipse at 50% 60%,
        #1a1a28 0%,
        #12141f 40%,
        #0a0a12 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">g83 · flock as ink-stroke field</div>
<div class="hint">curl noise guides each bird's path — the flock paints coherent flow</div>
<div class="src">descended from sav · boids + curl-noise vector field · Katsushika Hokusai</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// sav's 4-stage emotional arc (together/loss/seeking/return) works but felt
// too clean — the motion was purely boid-mechanical. This descendant injects
// a CURL-NOISE VECTOR FIELD into the per-bird steering: each bird samples the
// field at its position and adds that flow direction to its velocity. The field
// is animated slowly, creating coherent ink-stroke paths that EMERGE from the
// boid rules rather than sitting on top of them.
//
// Hokusai's 'The Great Wave' — the wave is made of smaller waves. Each bird is
// a brush-stroke; the flock is a calligraphic wave front. The curl field makes
// the strokes flow in vortex arcs, pooling and dispersing, like ink swirling
// in water.
//
// Palette: midnight indigo + ivory + burnt umber — sumi-e ink on aged paper.
// Atmospheric texture: subtle noise overlay (paper grain), low fog.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a12, 0.012);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── curl noise field
// Simplified 3D curl-noise: we compute pseudo-curl from 3D Perlin gradients.
// The field is sampled at each bird's position and feeds into steering.

function hash(x, y, z) {
  let n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164) * 43758.5453;
  return n - Math.floor(n);
}

function noise3d(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
  const xf = x - X, yf = y - Y, zf = z - Z;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const a = hash(X, Y, Z);
  const b = hash(X + 1, Y, Z);
  const c = hash(X, Y + 1, Z);
  const d = hash(X + 1, Y + 1, Z);
  const e = hash(X, Y, Z + 1);
  const f = hash(X + 1, Y, Z + 1);
  const g = hash(X, Y + 1, Z + 1);
  const h = hash(X + 1, Y + 1, Z + 1);
  const k0 = a + u * (b - a);
  const k1 = c + u * (d - c);
  const k2 = e + u * (f - e);
  const k3 = g + u * (h - g);
  const k4 = k0 + v * (k1 - k0);
  const k5 = k2 + v * (k3 - k2);
  return k4 + w * (k5 - k4);
}

function curlNoise(x, y, z, t) {
  const eps = 0.5;
  const scale = 0.18;
  const sx = x * scale, sy = y * scale, sz = z * scale;
  const n1 = noise3d(sx, sy + eps, sz + t);
  const n2 = noise3d(sx, sy - eps, sz + t);
  const n3 = noise3d(sx, sy, sz + eps + t);
  const n4 = noise3d(sx, sy, sz - eps + t);
  const n5 = noise3d(sx + eps, sy, sz + t);
  const n6 = noise3d(sx - eps, sy, sz + t);
  return {
    x: (n1 - n2) - (n3 - n4),
    y: (n3 - n4) - (n5 - n6),
    z: (n5 - n6) - (n1 - n2)
  };
}

// ────────────── boid flock
const N = 320;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const trail = [];  // per-bird trail history for line segments

// init: loose scatter
for (let i = 0; i < N; i++){
  const r = 2.5 + Math.random() * 3.0;
  const th = Math.random() * Math.PI * 2;
  const ph = (Math.random() - 0.5) * Math.PI * 0.6;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r;
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = (Math.random() - 0.5) * 0.6;
  vel[i*3 + 1] = (Math.random() - 0.5) * 0.5;
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.6;
  trail.push([]);
}

const PERCEPTION_R = 4.5;
const SEPARATION_R = 1.2;
const W_COH = 0.014;
const W_ALI = 0.050;
const W_SEP = 0.070;
const W_CURL = 0.045;  // curl-noise steering weight
const MAX_SPEED = 1.1;
const MAX_FORCE = 0.025;

function step(dt, t){
  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];

    // standard boid rules
    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3] - px;
      const dy = pos[j*3+1] - py;
      const dz = pos[j*3+2] - pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > PERCEPTION_R * PERCEPTION_R || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R * SEPARATION_R){
        const inv = 1.0 / Math.sqrt(d2);
        sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
      }
    }
    if (cohN > 0){
      cohX = cohX/cohN - px; cohY = cohY/cohN - py; cohZ = cohZ/cohN - pz;
      acc[i*3]     += cohX * W_COH;
      acc[i*3+1]   += cohY * W_COH;
      acc[i*3+2]   += cohZ * W_COH;
    }
    if (aliN > 0){
      aliX = aliX/aliN - vel[i*3]; aliY = aliY/aliN - vel[i*3+1]; aliZ = aliZ/aliN - vel[i*3+2];
      acc[i*3]     += aliX * W_ALI;
      acc[i*3+1]   += aliY * W_ALI;
      acc[i*3+2]   += aliZ * W_ALI;
    }
    acc[i*3]   += sepX * W_SEP;
    acc[i*3+1] += sepY * W_SEP;
    acc[i*3+2] += sepZ * W_SEP;

    // CURL-NOISE STEERING — the key mutation
    const curl = curlNoise(px, py, pz, t);
    acc[i*3]     += curl.x * W_CURL;
    acc[i*3+1]   += curl.y * W_CURL;
    acc[i*3+2]   += curl.z * W_CURL;

    // soft world bounds
    const d2c = px*px + py*py + pz*pz;
    if (d2c > 120){
      const inv = 0.010 / Math.sqrt(d2c);
      acc[i*3]   += -px * inv;
      acc[i*3+1] += -py * inv;
      acc[i*3+2] += -pz * inv;
    }
  }

  // integrate
  for (let i = 0; i < N; i++){
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MAX_FORCE){ ax = ax * MAX_FORCE / af; ay = ay * MAX_FORCE / af; az = az * MAX_FORCE / af; }
    vel[i*3]     += ax;
    vel[i*3 + 1] += ay;
    vel[i*3 + 2] += az;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MAX_SPEED){ vx *= MAX_SPEED/sp; vy *= MAX_SPEED/sp; vz *= MAX_SPEED/sp; vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]     += vel[i*3]   * dt;
    pos[i*3+1]   += vel[i*3+1] * dt;
    pos[i*3+2]   += vel[i*3+2] * dt;

    // update trail
    trail[i].push({ x: pos[i*3], y: pos[i*3+1], z: pos[i*3+2] });
    if (trail[i].length > 28) trail[i].shift();
  }
}

// ────────────── render: points + trail lines
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying vec3  vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.8 + 0.6 * sin(t * 0.7);
      gl_PointSize = baseSize * uPixel * (18.0 / dist);
      vFade = clamp(1.0 - (dist - 26.0) / 32.0, 0.0, 1.0);
      // sumi-e palette: midnight indigo (main), ivory (highlight), burnt umber (mid)
      vec3 indigo = vec3(0.18, 0.22, 0.35);
      vec3 ivory  = vec3(0.96, 0.94, 0.88);
      vec3 umber  = vec3(0.42, 0.28, 0.22);
      float acc = smoothstep(0.4, 1.0, sin(t * 0.6));
      vCol = mix(indigo, mix(umber, ivory, acc * 0.5), acc * 0.3);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vFade;
      gl_FragColor = vec4(vCol * a * 0.85, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// trail lines — ink-stroke afterimage
const lineGroup = new THREE.Group();
scene.add(lineGroup);
function updateTrails() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  for (let i = 0; i < N; i++){
    if (trail[i].length < 2) continue;
    const pts = trail[i].map(p => new THREE.Vector3(p.x, p.y, p.z));
    const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
    const lineMat = new THREE.LineBasicMaterial({
      color: 0x2a2e40,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending
    });
    const line = new THREE.Line(lineGeom, lineMat);
    lineGroup.add(line);
  }
}

// paper-grain overlay (atmospheric texture)
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 512; grainCanvas.height = 512;
const gctx = grainCanvas.getContext('2d');
const imgData = gctx.createImageData(512, 512);
for (let i = 0; i < imgData.data.length; i += 4){
  const v = Math.random() * 20;
  imgData.data[i] = v; imgData.data[i+1] = v; imgData.data[i+2] = v; imgData.data[i+3] = 18;
}
gctx.putImageData(imgData, 0, 0);
const grainTex = new THREE.CanvasTexture(grainCanvas);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
grainTex.repeat.set(2, 2);
const grainGeom = new THREE.PlaneGeometry(80, 60);
const grainMat = new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, opacity: 0.08, depthWrite: false, blending: THREE.NormalBlending });
const grainPlane = new THREE.Mesh(grainGeom, grainMat);
grainPlane.position.z = -10;
scene.add(grainPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 180; s++) step(0.04, s * 0.04);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  step(dt, t * 0.2);
  geom.attributes.position.needsUpdate = true;
  updateTrails();

  // slow camera drift — follows centroid with gentle offset
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < N; i++){ cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; }
  cx /= N; cy /= N; cz /= N;
  camera.position.x += (cx * 0.3 - camera.position.x) * 0.012;
  camera.position.y += (cy + 6 - camera.position.y) * 0.012;
  camera.position.z += (28 - camera.position.z) * 0.008;
  camera.lookAt(cx, cy, cz);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
