<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ew6 · vascular tower of the lost bird</title>
<!-- MOTION: rise, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #0a0a0e;
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; 
          letter-spacing: 0.04em; color:#9ba8bc; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; 
          letter-spacing: 0.04em; color:#9ba8bc; z-index:10; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; 
          letter-spacing: 0.06em; color:#b89060; z-index:10; }
</style>
</head>
<body>
<div class="id">ew6 · vascular tower of the lost bird</div>
<div class="hint">a flock that climbs as it searches — bottom rooted, top rising</div>
<div class="src">ascended from sav · vertical drift anchored below · muted sky</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x12121a, 0.012);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 32);
camera.lookAt(0, 8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e);
document.body.appendChild(renderer.domElement);

// muted dawn sky gradient via scene background
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2;
skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const grad = skyCtx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0.00, '#1a1a28');
grad.addColorStop(0.28, '#252030');
grad.addColorStop(0.55, '#3a2838');
grad.addColorStop(0.78, '#52362e');
grad.addColorStop(1.00, '#6a4832');
skyCtx.fillStyle = grad;
skyCtx.fillRect(0, 0, 2, 512);
const skyTex = new THREE.CanvasTexture(skyCanvas);
scene.background = skyTex;

// starfield upper sky
const starGeom = new THREE.BufferGeometry();
const starCount = 180;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++){
  starPos[i*3] = (Math.random() - 0.5) * 120;
  starPos[i*3+1] = 16 + Math.random() * 18;
  starPos[i*3+2] = (Math.random() - 0.5) * 80;
}
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0xf4f0e8,
  size: 0.35,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.60,
  fog: false
});
const stars = new THREE.Points(starGeom, starMat);
scene.add(stars);

// ground silhouette landform — bottom third, near-black
const groundGeom = new THREE.PlaneGeometry(140, 32, 1, 1);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x050507, fog: true });
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = -10;
scene.add(ground);

// boids with vertical drift — tower climbs
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const birthTime = new Float32Array(N);

const startTime = performance.now();
for (let i = 0; i < N; i++){
  const r = Math.random() * 1.8 + 0.5;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r - 4.0;
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.35 + (Math.random() - 0.5) * 0.4;
  vel[i*3 + 1] = (Math.random() - 0.5) * 0.3;
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.4;
  birthTime[i] = 0;
}
pos[STRAGGLER * 3]     = -1.4;
pos[STRAGGLER * 3 + 1] = -3.5;
pos[STRAGGLER * 3 + 2] =  0.0;

const PERCEPTION_R = 4.2;
const SEPARATION_R = 1.0;
const W_COH = 0.020;
const W_ALI = 0.065;
const W_SEP = 0.085;
const MAX_SPEED = 1.6;
const MAX_FORCE = 0.032;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function step(dt, elapsed){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3 + 1]; cz += pos[i*3 + 2];
  }
  cx /= (N - 1); cy /= (N - 1); cz /= (N - 1);

  const sx = pos[STRAGGLER*3] - cx;
  const sy = pos[STRAGGLER*3+1] - cy;
  const sz = pos[STRAGGLER*3+2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 8.5));
  cohesion += (targetCohesion - cohesion) * dt * 0.50;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 5.0) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];

    const isStraggler = (i === STRAGGLER);
    const perceptionR = isStraggler ? PERCEPTION_R * 0.58 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3] - px;
      const dy = pos[j*3+1] - py;
      const dz = pos[j*3+2] - pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > perceptionR * perceptionR || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R * SEPARATION_R){
        const inv = 1.0 / Math.sqrt(d2);
        sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
      }
    }

    if (isStraggler){
      const drift = Math.sin(elapsed * 0.35) * 0.45;
      acc[i*3]     += drift;
      acc[i*3+1]   += -0.28 + Math.cos(elapsed * 0.28) * 0.22;
      acc[i*3+2]   += drift * 0.65;
    }

    if (!isStraggler){
      if (arcStage === 'seeking' || arcStage === 'return'){
        const tx = pos[STRAGGLER*3] - px;
        const ty = pos[STRAGGLER*3+1] - py;
        const tz = pos[STRAGGLER*3+2] - pz;
        const td = Math.sqrt(tx*tx + ty*ty + tz*tz) + 1e-3;
        const seek = arcStage === 'seeking' ? 0.022 : 0.014;
        acc[i*3]     += (tx / td) * seek;
        acc[i*3+1]   += (ty / td) * seek;
        acc[i*3+2]   += (tz / td) * seek;
      }
    }

    if (cohN > 0){
      cohX = cohX/cohN - px;
      cohY = cohY/cohN - py;
      cohZ = cohZ/cohN - pz;
      acc[i*3]     += cohX * W_COH;
      acc[i*3+1]   += cohY * W_COH;
      acc[i*3+2]   += cohZ * W_COH;
    }
    if (aliN > 0){
      aliX = aliX/aliN - vel[i*3];
      aliY = aliY/aliN - vel[i*3+1];
      aliZ = aliZ/aliN - vel[i*3+2];
      acc[i*3]     += aliX * W_ALI;
      acc[i*3+1]   += aliY * W_ALI;
      acc[i*3+2]   += aliZ * W_ALI;
    }
    acc[i*3]   += sepX * W_SEP;
    acc[i*3+1] += sepY * W_SEP;
    acc[i*3+2] += sepZ * W_SEP;

    const d2c = px*px + py*py + pz*pz;
    if (d2c > 110){
      const inv = 0.014 / Math.sqrt(d2c);
      acc[i*3]   += -px * inv;
      acc[i*3+1] += -py * inv;
      acc[i*3+2] += -pz * inv;
    }

    // VERTICAL DRIFT: anchor bottom, lift top
    // age = time alive; bottom stays low, top rises
    const age = elapsed - birthTime[i];
    const anchorY = -4.0;
    const distFromAnchor = py - anchorY;
    const liftForce = Math.max(0, distFromAnchor) * 0.0045 * (age * 0.12 + 1.0);
    acc[i*3+1] += liftForce;
  }

  const speedMul = (arcStage === 'loss' || arcStage === 'seeking') ? 0.58
                  : arcStage === 'return' ? 0.88 : 1.0;
  for (let i = 0; i < N; i++){
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MAX_FORCE){ ax *= MAX_FORCE/af; ay *= MAX_FORCE/af; az *= MAX_FORCE/af; }
    vel[i*3]     += ax;
    vel[i*3 + 1] += ay;
    vel[i*3 + 2] += az;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MAX_SPEED){ vx *= MAX_SPEED/sp; vy *= MAX_SPEED/sp; vz *= MAX_SPEED/sp; vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]     += vx * dt * speedMul;
    pos[i*3+1]   += vy * dt * speedMul;
    pos[i*3+2]   += vz * dt * speedMul;
  }

  // track centroid for camera
  camera.position.y = cy * 0.6 + 8;
  camera.lookAt(0, cy * 0.6 + 8, 0);
}

// render: crisp sharp point sprites
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStraggler = new Float32Array(N);
isStraggler[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStraggler, 1));

const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#ffffff';
ctx.beginPath();
ctx.arc(16, 16, 14, 0, Math.PI * 2);
ctx.fill();
const tex = new THREE.CanvasTexture(canvas);

const mat = new THREE.PointsMaterial({
  size: 11,
  sizeAttenuation: true,
  map: tex,
  alphaTest: 0.5,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  fog: true,
  vertexColors: true
});

const colors = new Float32Array(N * 3);
for (let i = 0; i < N; i++){
  const isStrag = (i === STRAGGLER);
  if (isStrag){
    colors[i*3] = 0.97;
    colors[i*3+1] = 0.96;
    colors[i*3+2] = 0.92;
  } else {
    const t = Math.random();
    if (t < 0.15){
      colors[i*3] = 0.97;
      colors[i*3+1] = 0.96;
      colors[i*3+2] = 0.92;
    } else if (t < 0.35){
      colors[i*3] = 0.88;
      colors[i*3+1] = 0.82;
      colors[i*3+2] = 0.72;
    } else {
      colors[i*3] = 0.72;
      colors[i*3+1] = 0.65;
      colors[i*3+2] = 0.58;
    }
  }
}
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 180; s++) step(0.05, s * 0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const elapsed = (now - startTime) / 1000;
  step(dt, elapsed);
  geom.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
