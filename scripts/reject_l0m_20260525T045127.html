<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>l0m — diamond lattice</title>
<style>
*{margin:0;padding:0}
body{background:#0a0a0e;overflow:hidden}
canvas{display:block}
#id{position:fixed;bottom:8px;left:8px;font-family:ui-monospace,monospace;color:#cdd2dc;opacity:0.55;font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="id">l0m</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const W = innerWidth, H = innerHeight;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0e);

const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 1000);
camera.position.set(0, 0, 85);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

// ── Diamond lattice vertices ──────────────────────────────────────────────
const ROWS = 50, COLS = 40;
const COUNT = ROWS * COLS;
const SPACING_X = 2.8;
const SPACING_Y = 2.4;
const OFFSET_STRIDE = 1.4; // horizontal offset per row

const positions = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);

function seededRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = seededRNG(0xD1A7890A);

let idx = 0;
for (let row = 0; row < ROWS; row++) {
  const yFrac = row / (ROWS - 1);
  const yPos = (row - ROWS/2) * SPACING_Y;
  const rowOffset = (row % 2) * OFFSET_STRIDE;
  
  for (let col = 0; col < COLS; col++) {
    const xPos = (col - COLS/2) * SPACING_X + rowOffset;
    const zNoise = (rng() - 0.5) * 1.2;
    
    positions[idx*3 + 0] = xPos + (rng()-0.5)*0.3;
    positions[idx*3 + 1] = yPos + (rng()-0.5)*0.3;
    positions[idx*3 + 2] = zNoise;
    
    // Amber (low) to silver (high) gradient
    const t = yFrac * 0.85 + rng() * 0.15;
    const amber = new THREE.Color(0xffb347);
    const silver = new THREE.Color(0xe8e8f0);
    const col_mix = amber.clone().lerp(silver, t);
    
    colors[idx*3 + 0] = col_mix.r;
    colors[idx*3 + 1] = col_mix.g;
    colors[idx*3 + 2] = col_mix.b;
    
    idx++;
  }
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// ── Diamond glow shader ───────────────────────────────────────────────────
const vertexShader = `
uniform float uPixel;
attribute vec3 color;
varying vec3 vColor;

void main() {
  vColor = color;
  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
  gl_Position = projectionMatrix * mvPosition;
  gl_PointSize = 18.0 * uPixel;
}
`;

const fragmentShader = `
varying vec3 vColor;

void main() {
  vec2 uv = 2.0 * (gl_PointCoord - 0.5);
  float dist = abs(uv.x) + abs(uv.y);
  
  // Diamond fill with soft glow edge
  float alpha = 1.0 - smoothstep(0.55, 0.75, dist);
  
  // Inner core brightening
  float core = 1.0 - smoothstep(0.0, 0.4, dist);
  vec3 finalColor = vColor + vec3(core * 0.6);
  
  if (alpha < 0.01) discard;
  gl_FragColor = vec4(finalColor, alpha);
}
`;

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ── Slow drift animation ──────────────────────────────────────────────────
const clock = new THREE.Clock();
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  totalTime += dt;
  
  // Gentle rotation
  points.rotation.z += 0.0002;
  points.rotation.y = Math.sin(totalTime * 0.08) * 0.05;
  
  // Subtle z-wave through rows
  const pos = geometry.attributes.position.array;
  for (let i = 0; i < COUNT; i++) {
    const row = Math.floor(i / COLS);
    const baseZ = (Math.sin(totalTime * 0.4 + row * 0.12) - 0.5) * 0.6;
    pos[i*3 + 2] = baseZ + (rng() - 0.5) * 0.15;
  }
  geometry.attributes.position.needsUpdate = true;
  
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  material.uniforms.uPixel.value = renderer.getPixelRatio();
});
</script>
<!-- MOTION: drift, intensity: calm -->
</body>
</html>
