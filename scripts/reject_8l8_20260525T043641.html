<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8l8 · dipole magnetic sculpture</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0d12; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">8l8</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Aizawa attractor with dipole magnetic field influence:
// two poles at (0,±12,0) shape color and opacity by proximity.
// Cream-white near poles → deep indigo at midpoint.
// Monochromatic depth, no noise texture.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0d12, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.5;
  init[i*4+1] = (Math.random()*2-1) * 0.5;
  init[i*4+2] = (Math.random()*2-1) * 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.011 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 },
  uPoleN: { value: new THREE.Vector3(0, 12, 0) },
  uPoleS: { value: new THREE.Vector3(0, -12, 0) },
  uMagStr: { value: 0.08 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uMagStr;
    uniform vec3 uPoleN, uPoleS;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      
      // Aizawa flow
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      
      // Magnetic dipole force: attract toward poles along field lines
      vec3 toN = uPoleN - p;
      vec3 toS = uPoleS - p;
      float distN = length(toN);
      float distS = length(toS);
      vec3 magForce = vec3(0.0);
      if (distN > 0.1) magForce += normalize(toN) * uMagStr / (distN * distN + 1.0);
      if (distS > 0.1) magForce += normalize(toS) * uMagStr / (distS * distS + 1.0);
      
      p += (dp + magForce) * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 18);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uPoleN: { value: new THREE.Vector3(0, 12, 0) },
    uPoleS: { value: new THREE.Vector3(0, -12, 0) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform vec3 uPoleN, uPoleS;
    attribute vec2 uvIdx;
    varying float vProximity;
    varying float vAge;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      
      float distN = distance(p, uPoleN);
      float distS = distance(p, uPoleS);
      float minDist = min(distN, distS);
      // proximity: 0 at pole, 1 at midpoint (y=0)
      vProximity = clamp(minDist / 12.0, 0.0, 1.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      gl_PointSize = (1.2 + 1.0 * (1.0 - vProximity)) * uPixel * (10.0 / depth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vProximity;
    varying float vAge;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float core = exp(-r * 16.0);
      
      // cream-white near poles (proximity=0) → deep indigo at midpoint (proximity=1)
      vec3 creamWhite = vec3(0.98, 0.96, 0.92);
      vec3 deepIndigo = vec3(0.14, 0.16, 0.28);
      vec3 col = mix(creamWhite, deepIndigo, smoothstep(0.0, 1.0, vProximity));
      
      float alpha = core * (0.7 - vProximity * 0.5) * (0.6 + 0.4 * sin(vAge * 6.28318));
      gl_FragColor = vec4(col * core, alpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// Visual pole markers (small spheres at dipole locations)
const poleGeom = new THREE.SphereGeometry(0.4, 16, 16);
const poleMat = new THREE.MeshBasicMaterial({ color: 0xfdfbf8, transparent: true, opacity: 0.7 });
const poleN = new THREE.Mesh(poleGeom, poleMat);
poleN.position.set(0, 12, 0);
scene.add(poleN);
const poleS = new THREE.Mesh(poleGeom.clone(), poleMat.clone());
poleS.position.set(0, -12, 0);
scene.add(poleS);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
let centroid = new THREE.Vector3();

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // Track centroid for camera framing
  centroid.lerp(new THREE.Vector3(0, 0, 0), 0.02);
  
  // Slow orbital drift
  const angle = elapsed * 0.08;
  camera.position.x = Math.sin(angle) * 18;
  camera.position.z = Math.cos(angle) * 18;
  camera.position.y = 2 + Math.sin(angle * 0.5) * 3;
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
