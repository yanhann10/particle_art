<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>45h · the flock that rises as it remembers</title>
<!-- MOTION: ascent, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      radial-gradient(ellipse at 50% 85%, #2a1f3a 0%, #1a1a30 45%, #0a0a14 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #d09060; }
</style>
</head>
<body>
<div class="id">45h</div>
<div class="hint">the flock ascends as it heals — lower birds anchor, upper rise</div>
<div class="src">descended from sav · vertical drift tower form</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// starfield layer — sharp bright specks
const starGeom = new THREE.BufferGeometry();
const starCount = 180;
const starPos = new Float32Array(starCount * 3);
const starSize = new Float32Array(starCount);
for (let i = 0; i < starCount; i++){
  starPos[i*3]     = (Math.random() - 0.5) * 80;
  starPos[i*3 + 1] = 12 + Math.random() * 18;
  starPos[i*3 + 2] = -40 - Math.random() * 15;
  starSize[i] = 1.2 + Math.random() * 1.8;
}
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeom.setAttribute('size', new THREE.BufferAttribute(starSize, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `
    attribute float size;
    varying float vAlpha;
    void main(){
      vAlpha = 0.7 + 0.3 * fract(sin(position.x * 123.456) * 43758.5453);
      gl_PointSize = size;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = dot(c, c);
      if (r > 0.25) discard;
      gl_FragColor = vec4(1.0, 1.0, 1.0, vAlpha);
    }
  `
});
const stars = new THREE.Points(starGeom, starMat);
scene.add(stars);

// ground horizon silhouette — black landforms
const horizonGeom = new THREE.PlaneGeometry(120, 20, 1, 1);
const horizonMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
const horizon = new THREE.Mesh(horizonGeom, horizonMat);
horizon.position.set(0, -12, -25);
horizon.rotation.x = 0.15;
scene.add(horizon);

// boids with vertical drift
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const age = new Float32Array(N);  // time since birth, drives upward velocity

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.8 + 0.5;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r - 2.0;  // start lower
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3 + 1] = 0.1 + Math.random() * 0.2;  // initial upward drift
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.4;
  age[i] = i * 0.02;  // stagger ages
}
pos[STRAGGLER * 3]     = -1.3;
pos[STRAGGLER * 3 + 1] = -1.5;
pos[STRAGGLER * 3 + 2] =  0.0;

const PERCEPTION_R   = 4.2;
const SEPARATION_R   = 0.95;
const W_COH = 0.016;
const W_ALI = 0.055;
const W_SEP = 0.075;
const MAX_SPEED = 1.3;
const MAX_FORCE = 0.028;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function step(dt){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3 + 1]; cz += pos[i*3 + 2];
  }
  cx /= (N - 1); cy /= (N - 1); cz /= (N - 1);

  const sx = pos[STRAGGLER*3] - cx;
  const sy = pos[STRAGGLER*3+1] - cy;
  const sz = pos[STRAGGLER*3+2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 8.5));
  cohesion += (targetCohesion - cohesion) * dt * 0.4;

  if (cohesion > 0.82) arcStage = 'together';
  else if (cohesion > 0.48 && stragDist > 5.0) arcStage = 'loss';
  else if (cohesion < 0.48) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.62) arcStage = 'return';

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    age[i] += dt;
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];

    const isStraggler = (i === STRAGGLER);
    const perceptionR = isStraggler ? PERCEPTION_R * 0.52 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3] - px;
      const dy = pos[j*3+1] - py;
      const dz = pos[j*3+2] - pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > perceptionR * perceptionR || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R * SEPARATION_R){
        const inv = 1.0 / Math.sqrt(d2);
        sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
      }
    }

    if (isStraggler){
      const drift = Math.sin(performance.now() * 0.00028) * 0.38;
      acc[i*3]     += drift;
      acc[i*3+1]   += -0.22 + Math.cos(performance.now() * 0.00019) * 0.18;
      acc[i*3+2]   += drift * 0.55;
    }

    if (!isStraggler){
      if (arcStage === 'seeking' || arcStage === 'return'){
        const tx = pos[STRAGGLER*3] - px;
        const ty = pos[STRAGGLER*3+1] - py;
        const tz = pos[STRAGGLER*3+2] - pz;
        const td = Math.sqrt(tx*tx + ty*ty + tz*tz) + 1e-3;
        const seek = arcStage === 'seeking' ? 0.018 : 0.011;
        acc[i*3]     += (tx / td) * seek;
        acc[i*3+1]   += (ty / td) * seek;
        acc[i*3+2]   += (tz / td) * seek;
      }
    }

    if (cohN > 0){
      cohX = cohX/cohN - px;
      cohY = cohY/cohN - py;
      cohZ = cohZ/cohN - pz;
      acc[i*3]     += cohX * W_COH;
      acc[i*3+1]   += cohY * W_COH;
      acc[i*3+2]   += cohZ * W_COH;
    }
    if (aliN > 0){
      aliX = aliX/aliN - vel[i*3];
      aliY = aliY/aliN - vel[i*3+1];
      aliZ = aliZ/aliN - vel[i*3+2];
      acc[i*3]     += aliX * W_ALI;
      acc[i*3+1]   += aliY * W_ALI;
      acc[i*3+2]   += aliZ * W_ALI;
    }
    acc[i*3]   += sepX * W_SEP;
    acc[i*3+1] += sepY * W_SEP;
    acc[i*3+2] += sepZ * W_SEP;

    // vertical drift: birds rise with age; lower Y acts as anchor
    const verticalAnchor = Math.max(0.0, (-py - 1.0) / 6.0);  // stronger pull when low
    const ageFactor = Math.min(1.0, age[i] / 8.0);
    const uplift = 0.08 * ageFactor * (1.0 - verticalAnchor * 0.7);
    acc[i*3+1] += uplift;

    // soft world bounds
    const d2c = px*px + py*py + pz*pz;
    if (d2c > 95){
      const inv = 0.011 / Math.sqrt(d2c);
      acc[i*3]   += -px * inv;
      acc[i*3+1] += -py * inv;
      acc[i*3+2] += -pz * inv;
    }
  }

  const speedMul = (arcStage === 'loss' || arcStage === 'seeking') ? 0.58
                  : arcStage === 'return' ? 0.82 : 1.0;
  for (let i = 0; i < N; i++){
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MAX_FORCE){ ax = ax * MAX_FORCE / af; ay = ay * MAX_FORCE / af; az = az * MAX_FORCE / af; }
    vel[i*3]     += ax;
    vel[i*3 + 1] += ay;
    vel[i*3 + 2] += az;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MAX_SPEED){ vx *= MAX_SPEED/sp; vy *= MAX_SPEED/sp; vz *= MAX_SPEED/sp; vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]     += vel[i*3]   * dt * speedMul;
    pos[i*3+1]   += vel[i*3+1] * dt * speedMul;
    pos[i*3+2]   += vel[i*3+2] * dt * speedMul;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStraggler = new Float32Array(N);
isStraggler[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStraggler, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.55 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 2.8 + 1.2 * sin(t * 0.8);
      float stragSize = strag * 3.5;
      gl_PointSize = (baseSize + stragSize) * uPixel * (18.0 / dist);
      vAlpha = clamp(1.0 - (dist - 26.0) / 32.0, 0.0, 1.0);

      vec3 warm  = vec3(0.98, 0.88, 0.72);
      vec3 hot   = vec3(1.00, 0.98, 0.95);
      vec3 cool  = vec3(0.65, 0.72, 0.82);
      vec3 lost  = vec3(0.72, 0.58, 0.68);
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot, smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag * 0.8 + smoothstep(0.55, 1.0, sin(t * 0.35)) * 0.25);
      vCol *= (1.0 + strag * 0.5);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r = length(c);
      if (r > 0.5) discard;
      float core = 1.0 - smoothstep(0.0, 0.4, r);
      float a = core * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 220; s++) step(0.055);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = (now / 1000);
  uniforms.uCohesion.value = cohesion;
  step(dt);
  geom.attributes.position.needsUpdate = true;

  let cy = 0;
  for (let i = 0; i < N; i++) cy += pos[i*3+1];
  cy /= N;
  camera.position.y = cy * 0.4 + 2.0;
  camera.lookAt(0, cy * 0.6, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
