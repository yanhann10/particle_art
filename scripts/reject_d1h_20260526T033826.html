<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d1h · folded leaves bouquet</title>
<!-- MOTION: unfurling, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">d1h</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 9.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

/* ── leaf-twirl constructor ── each leaf is a curved strip geometry */
function createLeafStrip(opts){
  const { length, width, curvature, twist, segments, midVeinProminence } = opts;
  const positions = [];
  const seeds = [];
  const locals = [];
  
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const alongLen = t * length;
    
    /* midvein: straight along Y */
    const veinY = alongLen;
    const veinX = 0;
    const veinZ = 0;
    
    /* curl: leaf curves in XZ plane as it grows */
    const curlAngle = curvature * t * t;
    const curlX = Math.sin(curlAngle) * alongLen;
    const curlZ = (Math.cos(curlAngle) - 1.0) * alongLen;
    
    /* twist: leaf surface rotates around midvein */
    const twistAngle = twist * t * Math.PI;
    
    /* width taper: narrower at tip */
    const taperedWidth = width * (0.2 + 0.8 * (1.0 - t*t));
    
    /* sample 7 points across the leaf width at this segment */
    const crossSamples = 7;
    for (let j = 0; j < crossSamples; j++){
      const u = (j / (crossSamples - 1)) * 2.0 - 1.0; // -1 to +1
      
      /* position relative to midvein */
      let localX = u * taperedWidth;
      let localZ = 0;
      
      /* apply twist */
      const ct = Math.cos(twistAngle);
      const st = Math.sin(twistAngle);
      const rotX = localX * ct - localZ * st;
      const rotZ = localX * st + localZ * ct;
      
      /* world position */
      const px = curlX + rotX;
      const py = veinY;
      const pz = curlZ + rotZ;
      
      positions.push(px, py, pz);
      seeds.push(Math.random());
      locals.push(t, u); // t = along leaf, u = across leaf
    }
  }
  
  /* add midvein particles for calligraphic prominence */
  if (midVeinProminence > 0){
    for (let i = 0; i <= segments * 2; i++){
      const t = i / (segments * 2);
      const alongLen = t * length;
      const curlAngle = curvature * t * t;
      const px = Math.sin(curlAngle) * alongLen;
      const py = alongLen;
      const pz = (Math.cos(curlAngle) - 1.0) * alongLen;
      
      for (let k = 0; k < 3; k++){
        positions.push(px, py, pz);
        seeds.push(Math.random());
        locals.push(t, 0); // u=0 marks midvein
      }
    }
  }
  
  return { positions: new Float32Array(positions),
           seeds: new Float32Array(seeds),
           locals: new Float32Array(locals) };
}

/* ── bouquet arrangement: 7 leaf-twirl elements ── */
const leafConfigs = [
  /* central fern frond — tallest, gentle curve */
  { length: 4.2, width: 0.85, curvature: 0.38, twist: 0.65, segments: 42,
    midVeinProminence: 1.0, offsetX: 0, offsetY: -1.8, offsetZ: 0,
    rotX: 0, rotY: 0, rotZ: 0, scale: 1.0 },
  
  /* left palm frond — curves left */
  { length: 3.6, width: 0.72, curvature: 0.55, twist: -0.48, segments: 38,
    midVeinProminence: 0.8, offsetX: -1.2, offsetY: -1.5, offsetZ: 0.3,
    rotX: 0.15, rotY: -0.35, rotZ: 0.22, scale: 0.92 },
  
  /* right palm frond — curves right */
  { length: 3.8, width: 0.68, curvature: 0.62, twist: 0.52, segments: 40,
    midVeinProminence: 0.8, offsetX: 1.1, offsetY: -1.6, offsetZ: -0.2,
    rotX: -0.18, rotY: 0.42, rotZ: -0.25, scale: 0.88 },
  
  /* back left autumn leaf — tight spiral */
  { length: 2.8, width: 1.0, curvature: 0.95, twist: 1.2, segments: 32,
    midVeinProminence: 0.6, offsetX: -0.7, offsetY: -1.2, offsetZ: -1.0,
    rotX: 0.25, rotY: -0.6, rotZ: 0.4, scale: 0.75 },
  
  /* back right autumn leaf — opposite spiral */
  { length: 2.6, width: 0.95, curvature: 0.88, twist: -1.15, segments: 30,
    midVeinProminence: 0.6, offsetX: 0.8, offsetY: -1.0, offsetZ: -0.9,
    rotX: -0.22, rotY: 0.7, rotZ: -0.38, scale: 0.72 },
  
  /* front small fern — delicate, high twist */
  { length: 2.2, width: 0.55, curvature: 0.48, twist: 0.85, segments: 28,
    midVeinProminence: 1.0, offsetX: -0.4, offsetY: -0.8, offsetZ: 0.8,
    rotX: -0.3, rotY: -0.2, rotZ: 0.15, scale: 0.65 },
  
  /* front right small leaf — high curve */
  { length: 2.4, width: 0.6, curvature: 0.72, twist: -0.68, segments: 26,
    midVeinProminence: 0.7, offsetX: 0.5, offsetY: -0.9, offsetZ: 0.7,
    rotX: 0.28, rotY: 0.25, rotZ: -0.2, scale: 0.68 },
];

const allPositions = [];
const allSeeds = [];
const allLocals = [];
const allLeafIds = [];

leafConfigs.forEach((cfg, leafIdx) => {
  const strip = createLeafStrip(cfg);
  const n = strip.positions.length / 3;
  
  for (let i = 0; i < n; i++){
    let x = strip.positions[i*3];
    let y = strip.positions[i*3+1];
    let z = strip.positions[i*3+2];
    
    /* apply rotation */
    const cosX = Math.cos(cfg.rotX), sinX = Math.sin(cfg.rotX);
    const cosY = Math.cos(cfg.rotY), sinY = Math.sin(cfg.rotY);
    const cosZ = Math.cos(cfg.rotZ), sinZ = Math.sin(cfg.rotZ);
    
    /* rotate X */
    let y1 = y * cosX - z * sinX;
    let z1 = y * sinX + z * cosX;
    y = y1; z = z1;
    
    /* rotate Y */
    let x1 = x * cosY + z * sinY;
    z1 = -x * sinY + z * cosY;
    x = x1; z = z1;
    
    /* rotate Z */
    x1 = x * cosZ - y * sinZ;
    y1 = x * sinZ + y * cosZ;
    x = x1; y = y1;
    
    /* scale */
    x *= cfg.scale;
    y *= cfg.scale;
    z *= cfg.scale;
    
    /* offset */
    x += cfg.offsetX;
    y += cfg.offsetY;
    z += cfg.offsetZ;
    
    allPositions.push(x, y, z);
    allSeeds.push(strip.seeds[i]);
    allLocals.push(strip.locals[i*2], strip.locals[i*2+1]);
    allLeafIds.push(leafIdx / (leafConfigs.length - 1));
  }
});

const N = allPositions.length / 3;
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(allPositions), 3));
geom.setAttribute('seed', new THREE.BufferAttribute(new Float32Array(allSeeds), 1));
geom.setAttribute('local', new THREE.BufferAttribute(new Float32Array(allLocals), 2));
geom.setAttribute('leafId', new THREE.BufferAttribute(new Float32Array(allLeafIds), 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uUnfurl: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uUnfurl;
    attribute float seed;
    attribute vec2 local; // x=along, y=across
    attribute float leafId;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      
      /* unfurling animation — leaves uncurl from base */
      float alongLeaf = local.x;
      float revealThreshold = uUnfurl * 1.1;
      float reveal = smoothstep(revealThreshold - 0.15, revealThreshold, alongLeaf);
      
      /* before reveal: leaves are tightly curled at base */
      vec3 curledPos = vec3(p.x * 0.05, p.y * 0.1 - 1.8, p.z * 0.05);
      p = mix(curledPos, p, reveal);
      
      /* gentle breathing sway */
      float breathPhase = uTime * 0.18 + leafId * 1.5;
      float sway = 0.04 * alongLeaf * sin(breathPhase);
      p.x += sway;
      p.z += sway * 0.6;
      
      /* micro-tremor on edges */
      float edgeDist = abs(local.y);
      float tremor = edgeDist * 0.02 * sin(uTime * 3.5 + seed * 20.0);
      p.x += tremor;
      p.z += tremor * 0.8;
      
      /* ── palette: El Anatsui warm metals, ochre, sienna, copper ── */
      vec3 ochre  = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 copper = vec3(0.72, 0.45, 0.28);
      vec3 amber  = vec3(0.88, 0.68, 0.38);
      
      /* color per leaf — variation across bouquet */
      float leafHue = leafId;
      vec3 baseCol = mix(sienna, ochre, leafHue);
      baseCol = mix(baseCol, copper, alongLeaf * 0.3);
      
      /* midvein (local.y near 0) is brighter amber */
      float veinness = 1.0 - smoothstep(0.0, 0.15, abs(local.y));
      baseCol = mix(baseCol, amber, veinness * 0.6);
      
      /* edge darkening */
      float edgeDarken = smoothstep(0.6, 1.0, edgeDist);
      baseCol = mix(baseCol, sienna * 0.7, edgeDarken * 0.4);
      
      /* subtle shimmer */
      float shimmer = 0.5 + 0.5 * sin(t * 0.6 + alongLeaf * 3.0);
      baseCol += vec3(0.04, 0.02, 0.0) * shimmer;
      
      vCol = baseCol;
      
      /* alpha: softer at edges, stronger on vein */
      vAlpha = (0.45 + 0.25 * veinness) * reveal;
      vAlpha *= (0.7 + 0.3 * shimmer);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.2 + 0.5 * veinness;
      gl_PointSize = baseSize * uPixel * (38.0 / dist) * reveal;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  /* unfurling: slow reveal over first 5 seconds */
  uniforms.uUnfurl.value = Math.min(1.0, elapsed / 5.0);
  
  /* camera gently drifts with breathing */
  const breathPhase = elapsed * 0.18;
  const drift = 0.12 * Math.sin(breathPhase);
  controls.target.x = drift * 0.5;
  controls.target.y = 0.8 + drift * 0.3;
  controls.update();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
