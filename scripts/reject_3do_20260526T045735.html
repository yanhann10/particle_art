<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3do · physarum colony network grown to permanence</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #0f0e12;
  }
  canvas { display:block; position: absolute; top: 0; left: 0; }
  #bg-canvas { z-index: 1; }
  #main-canvas { z-index: 2; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; z-index: 10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; 
          letter-spacing: 0.04em; z-index: 10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; 
          letter-spacing: 0.04em; z-index: 10; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="id">3do · physarum colony network grown to permanence</div>
<div class="hint">no input — physarum grows continuously into stable vascular form</div>
<div class="src">descended from sav · slime-mold growth without reset · inhabited sky</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Background: subtle starfield + atmospheric dust
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = innerWidth;
bgCanvas.height = innerHeight;

function paintBackground() {
  // desaturated dawn gradient: ash-grey to muted rust-dusk
  const grad = bgCtx.createLinearGradient(0, 0, 0, innerHeight);
  grad.addColorStop(0,    '#16141c');   // deep ash
  grad.addColorStop(0.35, '#1c1820');   // warm charcoal
  grad.addColorStop(0.70, '#251e22');   // rust shadow
  grad.addColorStop(1,    '#2d2528');   // dusk rust
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, innerWidth, innerHeight);

  // subtle paper grain texture
  for (let i = 0; i < 2800; i++) {
    const x = Math.random() * innerWidth;
    const y = Math.random() * innerHeight;
    const a = Math.random() * 0.08 + 0.02;
    bgCtx.fillStyle = `rgba(255,255,255,${a})`;
    bgCtx.fillRect(x, y, 1, 1);
  }

  // distant horizon specks (ground/low atmospheric scatter)
  const horizonY = innerHeight * 0.82;
  for (let i = 0; i < 180; i++) {
    const x = Math.random() * innerWidth;
    const y = horizonY + (Math.random() - 0.5) * 60;
    const a = Math.random() * 0.12 + 0.03;
    const sz = Math.random() < 0.3 ? 2 : 1;
    bgCtx.fillStyle = `rgba(200,190,180,${a})`;
    bgCtx.fillRect(x, y, sz, sz);
  }

  // starfield (upper half, sparse)
  for (let i = 0; i < 220; i++) {
    const x = Math.random() * innerWidth;
    const y = Math.random() * innerHeight * 0.55;
    const a = Math.random() * 0.15 + 0.04;
    const sz = Math.random() < 0.15 ? 2 : 1;
    bgCtx.fillStyle = `rgba(230,220,210,${a})`;
    bgCtx.fillRect(x, y, sz, sz);
  }
}
paintBackground();

addEventListener('resize', () => {
  bgCanvas.width = innerWidth;
  bgCanvas.height = innerHeight;
  paintBackground();
});

// ────────────── physarum network growth (no reset)
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 35);
const renderer = new THREE.WebGLRenderer({ 
  antialias: true, 
  alpha: true,
  canvas: document.getElementById('main-canvas') || document.createElement('canvas')
});
if (!document.getElementById('main-canvas')) {
  renderer.domElement.id = 'main-canvas';
  document.body.appendChild(renderer.domElement);
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);

// Physarum parameters (multi-agent differential growth toward attractors)
const N = 62000;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const age = new Float32Array(N);     // how long agent has lived
const branch = new Uint8Array(N);    // branch lineage 0..255

// attractors: chemotaxis targets (food sources) — agents grow toward these
const attractors = [];
const NA = 8;
for (let i = 0; i < NA; i++) {
  const r = 4.5 + Math.random() * 5.5;
  const th = (i / NA) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
  attractors.push(new THREE.Vector3(
    Math.cos(th) * r,
    (Math.random() - 0.5) * 3.5,
    Math.sin(th) * r
  ));
}

// init: agents start at origin (colony core)
for (let i = 0; i < N; i++) {
  const r = Math.random() * 0.4;
  const th = Math.random() * Math.PI * 2;
  pos[i*3]     = Math.cos(th) * r;
  pos[i*3 + 1] = (Math.random() - 0.5) * 0.3;
  pos[i*3 + 2] = Math.sin(th) * r;
  vel[i*3]     = 0;
  vel[i*3 + 1] = 0;
  vel[i*3 + 2] = 0;
  age[i] = 0;
  branch[i] = i % 16;
}

const SENSE_ANGLE = Math.PI / 6;
const SENSE_DIST = 1.8;
const TURN_SPEED = 0.08;
const MOVE_SPEED = 0.15;
const DEPOSIT_RATE = 0.08;
const DECAY_RATE = 0.015;

// trail map (coarse 3D voxel grid for chemotaxis)
const GRID_RES = 48;
const GRID_SIZE = 28;
const CELL_SIZE = GRID_SIZE / GRID_RES;
const trail = new Float32Array(GRID_RES * GRID_RES * GRID_RES);

function gridIndex(x, y, z) {
  const ix = Math.floor((x + GRID_SIZE/2) / CELL_SIZE);
  const iy = Math.floor((y + GRID_SIZE/2) / CELL_SIZE);
  const iz = Math.floor((z + GRID_SIZE/2) / CELL_SIZE);
  if (ix < 0 || ix >= GRID_RES || iy < 0 || iy >= GRID_RES || iz < 0 || iz >= GRID_RES) return -1;
  return ix + iy * GRID_RES + iz * GRID_RES * GRID_RES;
}

function sampleTrail(x, y, z) {
  const idx = gridIndex(x, y, z);
  return idx >= 0 ? trail[idx] : 0;
}

function depositTrail(x, y, z, amount) {
  const idx = gridIndex(x, y, z);
  if (idx >= 0) trail[idx] = Math.min(1.0, trail[idx] + amount);
}

// growth step
function stepPhysarum(dt) {
  // decay trails
  for (let i = 0; i < trail.length; i++) {
    trail[i] *= (1.0 - DECAY_RATE * dt);
  }

  // agent motor
  for (let i = 0; i < N; i++) {
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const spd = Math.sqrt(vx*vx + vy*vy + vz*vz) + 1e-6;
    vx /= spd; vy /= spd; vz /= spd;

    // sense ahead, left, right (3D cones)
    const senseFwd = sampleTrail(px + vx * SENSE_DIST, py + vy * SENSE_DIST, pz + vz * SENSE_DIST);
    
    // left cone: rotate around up-vector
    const leftX = vx * Math.cos(SENSE_ANGLE) - vz * Math.sin(SENSE_ANGLE);
    const leftZ = vx * Math.sin(SENSE_ANGLE) + vz * Math.cos(SENSE_ANGLE);
    const senseLeft = sampleTrail(px + leftX * SENSE_DIST, py + vy * SENSE_DIST, pz + leftZ * SENSE_DIST);

    const rightX = vx * Math.cos(-SENSE_ANGLE) - vz * Math.sin(-SENSE_ANGLE);
    const rightZ = vx * Math.sin(-SENSE_ANGLE) + vz * Math.cos(-SENSE_ANGLE);
    const senseRight = sampleTrail(px + rightX * SENSE_DIST, py + vy * SENSE_DIST, pz + rightZ * SENSE_DIST);

    // steer toward higher concentration
    if (senseFwd > senseLeft && senseFwd > senseRight) {
      // continue straight
    } else if (senseLeft > senseRight) {
      // turn left
      const nvx = vx * Math.cos(TURN_SPEED) - vz * Math.sin(TURN_SPEED);
      const nvz = vx * Math.sin(TURN_SPEED) + vz * Math.cos(TURN_SPEED);
      vx = nvx; vz = nvz;
    } else {
      // turn right
      const nvx = vx * Math.cos(-TURN_SPEED) - vz * Math.sin(-TURN_SPEED);
      const nvz = vx * Math.sin(-TURN_SPEED) + vz * Math.cos(-TURN_SPEED);
      vx = nvx; vz = nvz;
    }

    // attractant pull: agents sense nearest attractor and bias toward it (food source)
    let nearestDist = 1e9;
    let nearestIdx = -1;
    for (let a = 0; a < attractors.length; a++) {
      const ax = attractors[a].x - px;
      const ay = attractors[a].y - py;
      const az = attractors[a].z - pz;
      const d2 = ax*ax + ay*ay + az*az;
      if (d2 < nearestDist) {
        nearestDist = d2;
        nearestIdx = a;
      }
    }
    if (nearestIdx >= 0 && nearestDist < 100) {
      const ax = attractors[nearestIdx].x - px;
      const ay = attractors[nearestIdx].y - py;
      const az = attractors[nearestIdx].z - pz;
      const ad = Math.sqrt(ax*ax + ay*ay + az*az) + 1e-3;
      const pull = 0.035;
      vx += (ax / ad) * pull;
      vy += (ay / ad) * pull;
      vz += (az / ad) * pull;
    }

    // normalize velocity
    const nsp = Math.sqrt(vx*vx + vy*vy + vz*vz) + 1e-6;
    vx = (vx / nsp) * MOVE_SPEED;
    vy = (vy / nsp) * MOVE_SPEED;
    vz = (vz / nsp) * MOVE_SPEED;

    vel[i*3] = vx; vel[i*3+1] = vy; vel[i*3+2] = vz;

    // move
    pos[i*3]     += vx * dt;
    pos[i*3 + 1] += vy * dt;
    pos[i*3 + 2] += vz * dt;

    // deposit trail
    depositTrail(pos[i*3], pos[i*3+1], pos[i*3+2], DEPOSIT_RATE * dt);

    // boundary reflection (soft bounds)
    const boundR = 12.0;
    const dx = pos[i*3], dy = pos[i*3+1], dz = pos[i*3+2];
    const d2 = dx*dx + dy*dy + dz*dz;
    if (d2 > boundR * boundR) {
      const inv = 1.0 / Math.sqrt(d2);
      vel[i*3]   = -dx * inv * MOVE_SPEED * 0.8;
      vel[i*3+1] = -dy * inv * MOVE_SPEED * 0.8;
      vel[i*3+2] = -dz * inv * MOVE_SPEED * 0.8;
    }

    age[i] += dt;
  }
}

// render: sharp points (sizeAttenuation=false, crisp pixel size)
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const ageAttr = new Float32Array(N);
geom.setAttribute('age', new THREE.BufferAttribute(ageAttr, 1));
const branchAttr = new Float32Array(N);
for (let i = 0; i < N; i++) branchAttr[i] = branch[i] / 255.0;
geom.setAttribute('branch', new THREE.BufferAttribute(branchAttr, 1));

const mat = new THREE.PointsMaterial({
  size: 2.8,
  sizeAttenuation: false,
  transparent: true,
  opacity: 0.92,
  vertexColors: true,
  blending: THREE.NormalBlending,
  depthWrite: false
});

const colors = new Float32Array(N * 3);
// palette: aged bone-white, rust patina, ash-grey, midnight blue
const palette = [
  new THREE.Color(0.88, 0.86, 0.82),  // bone
  new THREE.Color(0.72, 0.54, 0.42),  // rust
  new THREE.Color(0.48, 0.46, 0.50),  // ash
  new THREE.Color(0.32, 0.38, 0.52)   // midnight
];
for (let i = 0; i < N; i++) {
  const c = palette[branch[i] % palette.length];
  colors[i*3]     = c.r;
  colors[i*3 + 1] = c.g;
  colors[i*3 + 2] = c.b;
}
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.04, (now - lastT) / 1000);
  lastT = now;

  stepPhysarum(dt);
  geom.attributes.position.needsUpdate = true;

  // camera: single slow reveal drift (not rotation)
  const t = now * 0.00008;
  camera.position.x = Math.sin(t) * 2.5;
  camera.position.y = Math.cos(t * 0.7) * 1.8;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
