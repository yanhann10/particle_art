<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: reveal, intensity: calm -->
<title>x7l · city subdivision · mondrian urbanism</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e14; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; z-index:10; }
</style>
</head>
<body>
<div class="id">x7l</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Block subdivision L-system (Mondrian urbanism) ── */
const allBlocks = [];
const seed = { x: 0, z: 0, w: 24, h: 24, gen: 0 };
const queue = [seed];

const PHI = 1.618033988749;
const MIN_SIZE = 0.6;
const MAX_GEN = 7;

while (queue.length > 0) {
  const b = queue.shift();
  allBlocks.push(b);
  
  if (b.gen >= MAX_GEN) continue;
  if (b.w < MIN_SIZE * 2 && b.h < MIN_SIZE * 2) continue;

  const splitH = b.w > b.h || (b.w === b.h && Math.random() > 0.5);
  
  if (splitH && b.w >= MIN_SIZE * 2) {
    const ratio = 0.35 + Math.random() * 0.3;
    const w1 = b.w * ratio;
    const w2 = b.w - w1;
    queue.push({ x: b.x, z: b.z, w: w1, h: b.h, gen: b.gen + 1 });
    queue.push({ x: b.x + w1, z: b.z, w: w2, h: b.h, gen: b.gen + 1 });
  } else if (!splitH && b.h >= MIN_SIZE * 2) {
    const ratio = 0.35 + Math.random() * 0.3;
    const h1 = b.h * ratio;
    const h2 = b.h - h1;
    queue.push({ x: b.x, z: b.z, w: b.w, h: h1, gen: b.gen + 1 });
    queue.push({ x: b.x, z: b.z + h1, w: b.w, h: h2, gen: b.gen + 1 });
  }
}

/* assign building heights and types */
allBlocks.forEach((b, i) => {
  b.height = 0.2 + Math.pow(Math.random(), 1.8) * (6.5 + b.gen * 0.8);
  b.type = Math.random() < 0.15 ? 'accent' : (Math.random() < 0.4 ? 'amber' : 'cyan');
  b.birth = i / allBlocks.length;
});

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e14, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(16, 22, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e14, 1);
document.body.appendChild(renderer.domElement);

/* ── Ground plane ── */
const groundGeo = new THREE.PlaneGeometry(60, 60);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x12161c,
  transparent: true,
  opacity: 0.9,
  side: THREE.DoubleSide
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = 0;
scene.add(ground);

/* ── Street grid (outline of blocks) ── */
const streetMat = new THREE.LineBasicMaterial({ color: 0x1a3a52, transparent: true, opacity: 0.7 });
allBlocks.forEach(b => {
  const pts = [
    new THREE.Vector3(b.x - 12, 0.02, b.z - 12),
    new THREE.Vector3(b.x + b.w - 12, 0.02, b.z - 12),
    new THREE.Vector3(b.x + b.w - 12, 0.02, b.z + b.h - 12),
    new THREE.Vector3(b.x - 12, 0.02, b.z + b.h - 12),
    new THREE.Vector3(b.x - 12, 0.02, b.z - 12)
  ];
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(geom, streetMat);
  line.userData.birth = b.birth;
  scene.add(line);
});

/* ── Buildings (InstancedMesh per type) ── */
const buildingGeo = new THREE.BoxGeometry(1, 1, 1);
buildingGeo.translate(0, 0.5, 0);

const amberBlocks = allBlocks.filter(b => b.type === 'amber');
const cyanBlocks = allBlocks.filter(b => b.type === 'cyan');
const accentBlocks = allBlocks.filter(b => b.type === 'accent');

const amberMat = new THREE.MeshBasicMaterial({ color: 0x4a3520, transparent: true, opacity: 0 });
const cyanMat = new THREE.MeshBasicMaterial({ color: 0x1a3540, transparent: true, opacity: 0 });
const accentMat = new THREE.MeshBasicMaterial({ color: 0x3a1a30, transparent: true, opacity: 0 });

const amberMesh = new THREE.InstancedMesh(buildingGeo, amberMat, amberBlocks.length);
const cyanMesh = new THREE.InstancedMesh(buildingGeo, cyanMat, cyanBlocks.length);
const accentMesh = new THREE.InstancedMesh(buildingGeo, accentMat, accentBlocks.length);

scene.add(amberMesh);
scene.add(cyanMesh);
scene.add(accentMesh);

const dummy = new THREE.Object3D();

function updateBuildings(meshInst, blocks) {
  blocks.forEach((b, i) => {
    dummy.position.set(b.x + b.w * 0.5 - 12, b.height * 0.5, b.z + b.h * 0.5 - 12);
    dummy.scale.set(b.w * 0.92, b.height, b.h * 0.92);
    dummy.updateMatrix();
    meshInst.setMatrixAt(i, dummy.matrix);
  });
  meshInst.instanceMatrix.needsUpdate = true;
}

updateBuildings(amberMesh, amberBlocks);
updateBuildings(cyanMesh, cyanBlocks);
updateBuildings(accentMesh, accentBlocks);

/* ── Window particles ── */
const N = 80000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const typeAttr = new Float32Array(N);
const birthAttr = new Float32Array(N);

let written = 0;
allBlocks.forEach(b => {
  const vol = b.w * b.h * b.height;
  const share = Math.max(1, Math.floor(N * vol / allBlocks.reduce((sum, bb) => sum + bb.w * bb.h * bb.height, 0)));
  
  for (let k = 0; k < share && written < N; k++) {
    const wx = b.x + Math.random() * b.w - 12;
    const wz = b.z + Math.random() * b.h - 12;
    const wy = Math.random() * b.height;
    
    positions[written * 3] = wx;
    positions[written * 3 + 1] = wy;
    positions[written * 3 + 2] = wz;
    
    seeds[written] = Math.random();
    typeAttr[written] = b.type === 'amber' ? 0.0 : (b.type === 'cyan' ? 0.5 : 1.0);
    birthAttr[written] = b.birth;
    written++;
  }
});

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReveal: { value: 0 }
};

const particleMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReveal;
    attribute float seed;
    attribute float type;
    attribute float birth;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;
      
      float revealT = smoothstep(birth - 0.02, birth + 0.02, uReveal);
      if (revealT < 0.01) {
        gl_PointSize = 0.0;
        gl_Position = vec4(0.0, 0.0, -100.0, 1.0);
        vAlpha = 0.0;
        vCol = vec3(0.0);
        return;
      }
      
      float flicker = 0.85 + 0.15 * sin(uTime * 4.0 + seed * 62.8318);
      
      vec3 amber = vec3(0.85, 0.55, 0.28);
      vec3 cyan = vec3(0.28, 0.65, 0.82);
      vec3 magenta = vec3(0.82, 0.38, 0.72);
      
      vec3 col;
      if (type < 0.25) {
        col = amber;
      } else if (type < 0.75) {
        col = cyan;
      } else {
        col = magenta;
      }
      
      col *= flicker;
      
      vCol = col;
      vAlpha = (0.6 + 0.3 * seed) * revealT;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = uPixel * (22.0 / max(dist, 1.0));
      sz *= 0.5 + 0.5 * revealT;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('type', new THREE.BufferAttribute(typeAttr, 1));
geom.setAttribute('birth', new THREE.BufferAttribute(birthAttr, 1));

const points = new THREE.Points(geom, particleMat);
scene.add(points);

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animation loop ── */
const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  uniforms.uReveal.value = Math.min(1.0, elapsed / 6.0);
  
  const revealNow = uniforms.uReveal.value;
  amberMat.opacity = Math.min(0.65, revealNow * 0.75);
  cyanMat.opacity = Math.min(0.6, revealNow * 0.7);
  accentMat.opacity = Math.min(0.75, revealNow * 0.85);
  
  camera.position.x = 16 + Math.sin(elapsed * 0.08) * 3.0;
  camera.position.z = 16 + Math.cos(elapsed * 0.08) * 3.0;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  var _pcc=document.getElementById('pc-close');if(_pcc)_pcc.onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
