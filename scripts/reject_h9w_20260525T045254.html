<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h9w · komorebi vessels (glass tubes + light globes)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e14; overflow:hidden;
               color:#e0e6ed; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">h9w</div>

<!-- MOTION: flow, intensity: gentle -->

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0e14, 20, 80);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e14, 1);
document.body.appendChild(renderer.domElement);

// Lighting for glass reflections
const ambientLight = new THREE.AmbientLight(0x4a5f7a, 0.3);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0xffeedd, 1.2, 50);
pointLight1.position.set(10, 15, 10);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xaaddff, 0.8, 50);
pointLight2.position.set(-10, 5, -10);
scene.add(pointLight2);

// Glass tube structure — multiple curved tubes
const tubeGroup = new THREE.Group();
scene.add(tubeGroup);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd4e8f0,
  transparent: true,
  opacity: 0.12,
  roughness: 0.05,
  metalness: 0.0,
  transmission: 0.95,
  thickness: 0.8,
  envMapIntensity: 1.5,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  side: THREE.DoubleSide,
});

function createTubePath(config) {
  const { startPos, endPos, curvature, twist } = config;
  const curve = new THREE.CatmullRomCurve3([
    startPos,
    new THREE.Vector3(
      (startPos.x + endPos.x) / 2 + curvature.x,
      (startPos.y + endPos.y) / 2 + curvature.y,
      (startPos.z + endPos.z) / 2 + curvature.z
    ),
    endPos
  ]);
  return curve;
}

const tubeConfigs = [
  {
    startPos: new THREE.Vector3(-8, -6, 0),
    endPos: new THREE.Vector3(-4, 8, 2),
    curvature: { x: 2, y: 2, z: -3 },
    twist: 0.5,
    radius: 0.4,
    globeCount: 12
  },
  {
    startPos: new THREE.Vector3(6, -7, 1),
    endPos: new THREE.Vector3(3, 10, -2),
    curvature: { x: -3, y: 0, z: 2 },
    twist: -0.3,
    radius: 0.35,
    globeCount: 14
  },
  {
    startPos: new THREE.Vector3(0, -5, -4),
    endPos: new THREE.Vector3(-2, 9, 3),
    curvature: { x: 4, y: -2, z: 0 },
    twist: 0.7,
    radius: 0.45,
    globeCount: 16
  },
  {
    startPos: new THREE.Vector3(-3, -8, 3),
    endPos: new THREE.Vector3(5, 7, -1),
    curvature: { x: -2, y: 3, z: 4 },
    twist: -0.5,
    radius: 0.38,
    globeCount: 13
  },
  {
    startPos: new THREE.Vector3(4, -6, -2),
    endPos: new THREE.Vector3(-6, 8, 4),
    curvature: { x: 1, y: -3, z: -2 },
    twist: 0.4,
    radius: 0.42,
    globeCount: 15
  }
];

const tubes = [];
const globeSystems = [];

tubeConfigs.forEach((config, idx) => {
  const curve = createTubePath(config);
  const tubeGeometry = new THREE.TubeGeometry(curve, 128, config.radius, 16, false);
  const tubeMesh = new THREE.Mesh(tubeGeometry, glassMaterial);
  tubeGroup.add(tubeMesh);
  tubes.push({ mesh: tubeMesh, curve, config });

  // Create light globes that flow through this tube
  const globeCount = config.globeCount;
  const globes = [];
  
  for (let i = 0; i < globeCount; i++) {
    const t = i / globeCount;
    const globeGeometry = new THREE.SphereGeometry(0.15, 16, 16);
    const hue = (idx * 0.15 + i * 0.05) % 1.0;
    const color = new THREE.Color().setHSL(hue, 0.7, 0.6);
    
    const globeMaterial = new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 2.5,
      transparent: true,
      opacity: 0.9,
      roughness: 0.2,
      metalness: 0.1
    });
    
    const globe = new THREE.Mesh(globeGeometry, globeMaterial);
    const pos = curve.getPointAt(t);
    globe.position.copy(pos);
    
    // Add soft glow
    const glowGeometry = new THREE.SphereGeometry(0.3, 16, 16);
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.3,
      side: THREE.BackSide
    });
    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
    globe.add(glow);
    
    scene.add(globe);
    globes.push({
      mesh: globe,
      t: t,
      speed: 0.01 + Math.random() * 0.015,
      phase: Math.random() * Math.PI * 2,
      baseColor: color.clone()
    });
  }
  
  globeSystems.push({ curve, globes, config });
});

// Ambient particles for atmosphere
const ambientParticleCount = 2000;
const ambientGeometry = new THREE.BufferGeometry();
const ambientPositions = new Float32Array(ambientParticleCount * 3);
const ambientColors = new Float32Array(ambientParticleCount * 3);

for (let i = 0; i < ambientParticleCount; i++) {
  ambientPositions[i * 3] = (Math.random() - 0.5) * 40;
  ambientPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
  ambientPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
  
  const c = new THREE.Color().setHSL(Math.random() * 0.15 + 0.5, 0.4, 0.5);
  ambientColors[i * 3] = c.r;
  ambientColors[i * 3 + 1] = c.g;
  ambientColors[i * 3 + 2] = c.b;
}

ambientGeometry.setAttribute('position', new THREE.BufferAttribute(ambientPositions, 3));
ambientGeometry.setAttribute('color', new THREE.BufferAttribute(ambientColors, 3));

const ambientMaterial = new THREE.PointsMaterial({
  size: 0.15,
  vertexColors: true,
  transparent: true,
  opacity: 0.4,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending
});

const ambientParticles = new THREE.Points(ambientGeometry, ambientMaterial);
scene.add(ambientParticles);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;

  // Animate globes flowing through tubes
  globeSystems.forEach((system, sysIdx) => {
    system.globes.forEach((globe, gIdx) => {
      globe.t = (globe.t + globe.speed * 0.016) % 1.0;
      const pos = system.curve.getPointAt(globe.t);
      globe.mesh.position.copy(pos);
      
      // Pulse brightness as they flow
      const pulse = Math.sin(t * 2 + globe.phase) * 0.3 + 0.7;
      globe.mesh.material.emissiveIntensity = 2.0 + pulse * 1.5;
      globe.mesh.material.opacity = 0.7 + pulse * 0.3;
      
      // Slight color shift
      const hueShift = Math.sin(t * 0.5 + gIdx) * 0.05;
      const newColor = globe.baseColor.clone();
      newColor.offsetHSL(hueShift, 0, 0);
      globe.mesh.material.color.copy(newColor);
      globe.mesh.material.emissive.copy(newColor);
    });
  });

  // Gentle tube rotation
  tubeGroup.rotation.y = Math.sin(t * 0.1) * 0.15;
  tubeGroup.rotation.x = Math.sin(t * 0.07) * 0.08;

  // Ambient particle drift
  const ambientPos = ambientGeometry.attributes.position.array;
  for (let i = 0; i < ambientParticleCount; i++) {
    ambientPos[i * 3 + 1] += Math.sin(t * 0.5 + i * 0.1) * 0.003;
    ambientPos[i * 3] += Math.cos(t * 0.3 + i * 0.15) * 0.002;
  }
  ambientGeometry.attributes.position.needsUpdate = true;

  // Camera gentle orbit
  const radius = 28;
  const camX = Math.sin(t * 0.08) * radius;
  const camZ = Math.cos(t * 0.08) * radius;
  const camY = 8 + Math.sin(t * 0.05) * 3;
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
