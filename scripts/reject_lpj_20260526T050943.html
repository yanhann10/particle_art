<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lpj · membrane ascent</title>
<!-- MOTION: rise, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">lpj</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">differential growth + vertical climb · vascular tower</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*  Membrane Ascent — a differential-growth membrane starts as a horizontal disc
    and climbs upward as it grows, transforming into a vertical vascular tower.
    
    PHYSICAL LAW: AGE-BASED VERTICAL DRIFT
      Each vertex i accumulates age as the system grows.
      Y-velocity = f(age), where f is a smooth function that:
        - keeps bottom vertices (age < 0.1) anchored
        - accelerates middle-age vertices upward
        - eases upper vertices into a terminal rise rate
      The form grows horizontally via differential growth while simultaneously
      climbing vertically via age-stratified ascent.
*/

const BG = 0x08070a;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.015);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// --- Differential growth parameters ---
const MAX_EDGE_LEN = 0.18;
const MIN_EDGE_LEN = 0.08;
const REPULSION_RADIUS = 0.22;
const REPULSION_STRENGTH = 0.006;
const ATTRACTION_STRENGTH = 0.012;

// --- Vertical drift parameters ---
const RISE_SPEED = 0.024;  // base climb rate for mature vertices
const ANCHOR_AGE_THRESHOLD = 0.12;  // vertices younger than this stay grounded

// Initial ring of vertices
const INIT_VERTICES = 42;
const INIT_RADIUS = 2.8;

class Vertex {
  constructor(x, y, z) {
    this.x = x;
    this.y = y;
    this.z = z;
    this.vx = 0;
    this.vy = 0;
    this.vz = 0;
    this.age = 0;
    this.neighbors = [];
    this.anchored = false; // set true for initial ring base
  }
}

const vertices = [];
const edges = new Set();

function addEdge(a, b) {
  const key = a < b ? `${a},${b}` : `${b},${a}`;
  if (edges.has(key)) return false;
  edges.add(key);
  vertices[a].neighbors.push(b);
  vertices[b].neighbors.push(a);
  return true;
}

function removeEdge(a, b) {
  const key = a < b ? `${a},${b}` : `${b},${a}`;
  if (!edges.has(key)) return;
  edges.delete(key);
  vertices[a].neighbors = vertices[a].neighbors.filter(n => n !== b);
  vertices[b].neighbors = vertices[b].neighbors.filter(n => n !== a);
}

// Initialize ring
for (let i = 0; i < INIT_VERTICES; i++) {
  const theta = (i / INIT_VERTICES) * Math.PI * 2;
  const x = Math.cos(theta) * INIT_RADIUS;
  const z = Math.sin(theta) * INIT_RADIUS;
  const v = new Vertex(x, 0, z);
  v.anchored = true; // bottom ring stays at y=0
  vertices.push(v);
}
for (let i = 0; i < INIT_VERTICES; i++) {
  addEdge(i, (i + 1) % INIT_VERTICES);
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function growthStep() {
  if (paused) return;

  // Age vertices
  for (const v of vertices) {
    v.age += 0.0008;
  }

  // Reset velocities
  for (const v of vertices) {
    v.vx = 0; v.vy = 0; v.vz = 0;
  }

  // Repulsion between nearby vertices
  for (let i = 0; i < vertices.length; i++) {
    const a = vertices[i];
    for (let j = i + 1; j < vertices.length; j++) {
      const b = vertices[j];
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist < REPULSION_RADIUS && dist > 1e-6) {
        const f = REPULSION_STRENGTH * (1 - dist / REPULSION_RADIUS);
        const fx = f * dx / dist, fy = f * dy / dist, fz = f * dz / dist;
        a.vx -= fx; a.vy -= fy; a.vz -= fz;
        b.vx += fx; b.vy += fy; b.vz += fz;
      }
    }
  }

  // Attraction along edges
  for (const key of edges) {
    const [ai, bi] = key.split(',').map(Number);
    const a = vertices[ai], b = vertices[bi];
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist < 1e-6) continue;
    const f = ATTRACTION_STRENGTH * (dist - MIN_EDGE_LEN);
    const fx = f * dx / dist, fy = f * dy / dist, fz = f * dz / dist;
    a.vx += fx; a.vy += fy; a.vz += fz;
    b.vx -= fx; b.vy -= fy; b.vz -= fz;
  }

  // Apply velocities
  for (const v of vertices) {
    if (!v.anchored) {
      v.x += v.vx;
      v.y += v.vy;
      v.z += v.vz;
    }
  }

  // Vertical drift based on age
  for (const v of vertices) {
    if (v.anchored) continue; // initial ring stays grounded
    if (v.age < ANCHOR_AGE_THRESHOLD) continue; // young vertices don't rise yet
    
    // Smooth acceleration curve: slow start, then linear climb
    const ageNorm = Math.min(1.0, (v.age - ANCHOR_AGE_THRESHOLD) / 0.3);
    const riseRate = RISE_SPEED * ageNorm * ageNorm;
    v.y += riseRate;
  }

  // Edge splitting
  const toSplit = [];
  for (const key of edges) {
    const [ai, bi] = key.split(',').map(Number);
    const a = vertices[ai], b = vertices[bi];
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (dist > MAX_EDGE_LEN) {
      toSplit.push([ai, bi]);
    }
  }

  for (const [ai, bi] of toSplit) {
    if (vertices.length > 2800) break;
    const a = vertices[ai], b = vertices[bi];
    const mid = new Vertex(
      (a.x + b.x) / 2 + (Math.random() - 0.5) * 0.02,
      (a.y + b.y) / 2,
      (a.z + b.z) / 2 + (Math.random() - 0.5) * 0.02
    );
    mid.age = (a.age + b.age) / 2;
    const mi = vertices.length;
    vertices.push(mid);

    removeEdge(ai, bi);
    addEdge(ai, mi);
    addEdge(mi, bi);

    // Connect to nearby vertices to maintain membrane
    for (let j = 0; j < vertices.length; j++) {
      if (j === mi || j === ai || j === bi) continue;
      const v = vertices[j];
      const dx = v.x - mid.x, dy = v.y - mid.y, dz = v.z - mid.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist < MAX_EDGE_LEN * 1.3 && vertices[j].neighbors.length < 8) {
        addEdge(mi, j);
      }
    }
  }
}

// --- Rendering: 40k particles distributed on edges ---
const N_RENDER = 40000;
const rPos = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age', new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor: { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.015 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      // pulse
      float pulse = 0.85 + 0.15 * sin(uTime * 0.8 + seed * 40.0);

      // palette: rust → bone → ash as structure climbs
      vec3 rust = vec3(0.58, 0.38, 0.28);
      vec3 bone = vec3(0.82, 0.78, 0.72);
      vec3 ash  = vec3(0.48, 0.46, 0.52);

      float k = clamp(age * 1.8, 0.0, 1.0);
      vec3 baseCol = mix(rust, bone, k * 0.6);
      baseCol = mix(baseCol, ash, smoothstep(0.5, 1.0, age) * 0.4);

      vCol = baseCol * pulse;
      vAlpha = 0.35 + 0.15 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.4 * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 20.0);
      float halo = exp(-r * 6.0) * 0.25;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.7);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Wire underlay
const wireGeom = new THREE.BufferGeometry();
const wirePos = new Float32Array(60000);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
const wireMat = new THREE.LineBasicMaterial({ color: 0x1e1a24, transparent: true, opacity: 0.18 });
const wireSegments = new THREE.LineSegments(wireGeom, wireMat);
scene.add(wireSegments);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const startT = performance.now();

function loop() {
  const t = (performance.now() - startT) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) growthStep();

  // Distribute particles along edges
  const edgeArr = Array.from(edges);
  let written = 0;
  const spread = 0.015;
  for (let ei = 0; ei < edgeArr.length && written < N_RENDER; ei++) {
    const [ai, bi] = edgeArr[ei].split(',').map(Number);
    const a = vertices[ai], b = vertices[bi];
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const share = Math.max(1, Math.floor(N_RENDER * len / (edgeArr.length * 0.15)));
    for (let k = 0; k < share && written < N_RENDER; k++) {
      const u = Math.random();
      rPos[written * 3] = a.x + dx * u + (Math.random() - 0.5) * spread;
      rPos[written * 3 + 1] = a.y + dy * u + (Math.random() - 0.5) * spread * 0.5;
      rPos[written * 3 + 2] = a.z + dz * u + (Math.random() - 0.5) * spread;
      rAge[written] = a.age + (b.age - a.age) * u;
      written++;
    }
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;

  // Update wire
  let wi = 0;
  for (const key of edges) {
    if (wi >= 19998) break;
    const [ai, bi] = key.split(',').map(Number);
    const a = vertices[ai], b = vertices[bi];
    wirePos[wi++] = a.x; wirePos[wi++] = a.y; wirePos[wi++] = a.z;
    wirePos[wi++] = b.x; wirePos[wi++] = b.y; wirePos[wi++] = b.z;
  }
  wireGeom.setDrawRange(0, wi / 3);
  wireGeom.attributes.position.needsUpdate = true;

  // Camera tracks centroid
  let cx = 0, cy = 0, cz = 0, n = 0;
  for (const v of vertices) {
    cx += v.x; cy += v.y; cz += v.z; n++;
  }
  if (n > 0) {
    cx /= n; cy /= n; cz /= n;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);
  }

  statEl.textContent = `vertices=${vertices.length}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
