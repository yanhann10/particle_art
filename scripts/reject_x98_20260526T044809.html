<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x98 · rising confetti lattice</title>
<!-- MOTION: rise, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#FFF8F0; overflow:hidden;
               color:#FF8C69; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; color:#FF8C69; }
</style>
</head>
<body>
<div class="id">x98</div>
<div class="hint">click to scatter · watch confetti rise</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────── LERP constant ≤ 0.04
const LERP = 0.038;
const MAX_VELOCITY = 0.12;

// ─────────── Joy palette: warm gold, pink, coral, cream
const JOY_COLORS = [
  new THREE.Color(0xFFD166), // gold
  new THREE.Color(0xFF6B9D), // pink
  new THREE.Color(0xFF8C69), // coral
  new THREE.Color(0xFFF4E6), // cream
];
const BG = 0xFFF8F0;

// ─────────── Scene setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.008);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 8, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 6, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── Confetti lattice structure
// Each piece is a small straight-line polygon that rises and rotates gently

const NUM_CONFETTI = 120;
const confettiPieces = [];

// Each confetti: { mesh, x, y, z, tx, ty, tz, vx, vy, vz, rx, ry, rz, trx, try, trz, colorIdx, bouncePhase, bounceAmp }

function createConfettiShape(colorIdx) {
  // Random straight-line polygon: triangle, square, or rectangle
  const shapes = [
    // triangle
    () => {
      const w = 0.3 + Math.random() * 0.2;
      const h = 0.3 + Math.random() * 0.2;
      return [
        new THREE.Vector2(0, h),
        new THREE.Vector2(w, 0),
        new THREE.Vector2(-w, 0),
      ];
    },
    // square
    () => {
      const s = 0.25 + Math.random() * 0.15;
      return [
        new THREE.Vector2(-s, -s),
        new THREE.Vector2(s, -s),
        new THREE.Vector2(s, s),
        new THREE.Vector2(-s, s),
      ];
    },
    // rectangle
    () => {
      const w = 0.2 + Math.random() * 0.2;
      const h = 0.15 + Math.random() * 0.1;
      return [
        new THREE.Vector2(-w, -h),
        new THREE.Vector2(w, -h),
        new THREE.Vector2(w, h),
        new THREE.Vector2(-w, h),
      ];
    },
  ];
  const shapeFunc = shapes[Math.floor(Math.random() * shapes.length)];
  const points = shapeFunc();
  
  const shape = new THREE.Shape(points);
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({
    color: JOY_COLORS[colorIdx % JOY_COLORS.length],
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85,
  });
  const mesh = new THREE.Mesh(geom, mat);
  return mesh;
}

function initConfetti() {
  for (let i = 0; i < NUM_CONFETTI; i++) {
    const colorIdx = Math.floor(Math.random() * JOY_COLORS.length);
    const mesh = createConfettiShape(colorIdx);
    
    // Start at bottom in a cluster
    const x = (Math.random() - 0.5) * 8;
    const y = Math.random() * 2 - 1;
    const z = (Math.random() - 0.5) * 8;
    
    mesh.position.set(x, y, z);
    
    // Initial rotation
    const rx = Math.random() * Math.PI * 2;
    const ry = Math.random() * Math.PI * 2;
    const rz = Math.random() * Math.PI * 2;
    mesh.rotation.set(rx, ry, rz);
    
    scene.add(mesh);
    
    confettiPieces.push({
      mesh,
      x, y, z,
      tx: x, ty: y, tz: z,
      vx: 0, vy: 0, vz: 0,
      rx, ry, rz,
      trx: rx, try: ry, trz: rz,
      colorIdx,
      bouncePhase: Math.random() * Math.PI * 2,
      bounceAmp: 0.15 + Math.random() * 0.1,
      riseSpeed: 0.8 + Math.random() * 0.6,
    });
  }
}

initConfetti();

// ─────────── Rising motion
// All confetti pieces gently rise upward, rotate slowly, with gentle bounce

function updateConfetti(dt) {
  for (let i = 0; i < confettiPieces.length; i++) {
    const c = confettiPieces[i];
    
    // Rising motion: target y increases over time
    c.ty += c.riseSpeed * dt * 0.5;
    
    // Gentle sideways drift
    c.tx += Math.sin(c.bouncePhase + performance.now() * 0.0003) * 0.02 * dt;
    c.tz += Math.cos(c.bouncePhase + performance.now() * 0.0004) * 0.02 * dt;
    
    // Bounce at top boundary (y > 14) — gentle elastic return
    if (c.ty > 14) {
      c.ty = 14;
      c.vy = -0.3;
    }
    
    // Velocity update with clamping
    c.vx += (c.tx - c.x) * LERP * 0.3;
    c.vy += (c.ty - c.y) * LERP * 0.3;
    c.vz += (c.tz - c.z) * LERP * 0.3;
    
    // Cap velocity
    const speed = Math.hypot(c.vx, c.vy, c.vz);
    if (speed > MAX_VELOCITY) {
      const scale = MAX_VELOCITY / speed;
      c.vx *= scale;
      c.vy *= scale;
      c.vz *= scale;
    }
    
    // LERP position toward target
    c.x += c.vx;
    c.y += c.vy;
    c.z += c.vz;
    
    // Gentle rotation
    c.trx += dt * 0.1;
    c.try += dt * 0.15;
    c.trz += dt * 0.08;
    
    c.rx += (c.trx - c.rx) * LERP;
    c.ry += (c.try - c.ry) * LERP;
    c.rz += (c.trz - c.rz) * LERP;
    
    // Gentle bounce oscillation
    c.bouncePhase += dt * 2;
    const bounceY = Math.sin(c.bouncePhase) * c.bounceAmp;
    
    c.mesh.position.set(c.x, c.y + bounceY, c.z);
    c.mesh.rotation.set(c.rx, c.ry, c.rz);
  }
}

// ─────────── Scatter on click
renderer.domElement.addEventListener('click', () => {
  for (let i = 0; i < confettiPieces.length; i++) {
    const c = confettiPieces[i];
    const angle = Math.random() * Math.PI * 2;
    const dist = 2 + Math.random() * 3;
    c.tx += Math.cos(angle) * dist;
    c.tz += Math.sin(angle) * dist;
    c.ty += 1 + Math.random() * 2;
    
    // Add some angular momentum
    c.trx += (Math.random() - 0.5) * Math.PI;
    c.try += (Math.random() - 0.5) * Math.PI;
    c.trz += (Math.random() - 0.5) * Math.PI;
  }
});

// ─────────── Animation
const startT = performance.now();
let prevT = startT;

function loop() {
  const nowMs = performance.now();
  const t = (nowMs - startT) / 1000;
  const dt = Math.min((nowMs - prevT) / 1000, 0.05);
  prevT = nowMs;
  
  updateConfetti(dt);
  
  // Camera gently tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (const c of confettiPieces) {
    cx += c.x;
    cy += c.y;
    cz += c.z;
  }
  cx /= confettiPieces.length;
  cy /= confettiPieces.length;
  cz /= confettiPieces.length;
  
  controls.target.x += (cx - controls.target.x) * LERP * 0.2;
  controls.target.y += (cy - controls.target.y) * LERP * 0.2;
  controls.target.z += (cz - controls.target.z) * LERP * 0.2;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
