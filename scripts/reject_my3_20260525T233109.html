<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my3 · tender descending lights</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0a09; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
<!-- MOTION: descent, intensity: calm -->
</head>
<body>
<div class="id">my3</div>
<div class="hint">drag to orbit</div>
<div class="src">Felix Gonzalez-Torres · eternal descent · mod-loop recycling</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender descending lights — dual paired strands (the absent lover)
   that fall perpetually through darkness. Phase-staggered mod-loop
   recycling ensures smooth eternal descent with no pop artifacts.
   Each particle has randomized phase offset so the column appears
   continuous and organic, never mechanical. */

const BG = 0x0e0a09;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.028);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 150);
camera.position.set(2.5, 8, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.minDistance = 8;
controls.maxDistance = 50;

// Two paired strands — Gonzalez-Torres signature duplication
const STRANDS = 2;
const PARTICLES_PER_STRAND = 20000;
const TOTAL_PARTICLES = STRANDS * PARTICLES_PER_STRAND;

// Column height for mod-loop recycling
const COL_HEIGHT = 60;
const DESCENT_SPEED = 0.18; // calm, tender pace

const positions = new Float32Array(TOTAL_PARTICLES * 3);
const seeds = new Float32Array(TOTAL_PARTICLES);
const phases = new Float32Array(TOTAL_PARTICLES); // randomized phase offset per particle
const strandIds = new Float32Array(TOTAL_PARTICLES);

// Initialize two strands — paired but not identical (like the lover relationship)
for (let s = 0; s < STRANDS; s++) {
  const offset = s * PARTICLES_PER_STRAND;
  const xCenter = s === 0 ? -1.8 : 1.8; // paired separation
  
  for (let i = 0; i < PARTICLES_PER_STRAND; i++) {
    const idx = offset + i;
    
    // Vertical distribution with random phase offset
    // This ensures smooth recycling without visible seams
    const verticalPhase = Math.random(); // 0..1
    phases[idx] = verticalPhase;
    
    // Initial Y position based on phase
    const y = verticalPhase * COL_HEIGHT - COL_HEIGHT * 0.5;
    
    // Gentle spiral around strand center
    const angle = (i / PARTICLES_PER_STRAND) * Math.PI * 12 + s * Math.PI * 0.5;
    const radius = 0.3 + Math.random() * 0.4;
    const x = xCenter + Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    
    positions[idx * 3] = x + (Math.random() - 0.5) * 0.15;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z + (Math.random() - 0.5) * 0.15;
    
    seeds[idx] = Math.random();
    strandIds[idx] = s;
  }
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
geometry.setAttribute('strandId', new THREE.BufferAttribute(strandIds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uColHeight: { value: COL_HEIGHT },
  uSpeed: { value: DESCENT_SPEED }
};

const material = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uColHeight;
    uniform float uSpeed;
    
    attribute float seed;
    attribute float phase;
    attribute float strandId;
    
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vec3 pos = position;
      
      // Phase-staggered mod-loop descent — the magic
      // Each particle has its own phase offset, creating seamless recycling
      float localY = pos.y + phase * uColHeight;
      float descendedY = localY - uTime * uSpeed;
      
      // Modulo wrapping for eternal loop
      float wrappedY = mod(descendedY + uColHeight * 0.5, uColHeight) - uColHeight * 0.5;
      pos.y = wrappedY;
      
      // Gentle horizontal drift — like lights swaying in night air
      float swayPhase = uTime * 0.3 + seed * 6.28;
      pos.x += sin(swayPhase) * 0.08;
      pos.z += cos(swayPhase * 0.7) * 0.06;
      
      // Soft pulse per bulb
      float pulse = 0.75 + 0.25 * sin(uTime * 0.8 + seed * 20.0);
      
      // Tender palette — warm amber incandescent, Gonzalez-Torres intimacy
      vec3 amber = vec3(1.0, 0.68, 0.28);
      vec3 warmWhite = vec3(1.0, 0.90, 0.78);
      vec3 softPeach = vec3(1.0, 0.82, 0.68);
      
      // Strand differentiation (subtle — paired but not identical)
      vec3 col = strandId < 0.5 ? mix(amber, warmWhite, seed) : mix(amber, softPeach, seed);
      vColor = col * pulse;
      
      // Fade at top and bottom edges for seamless loop
      float fadeTop = smoothstep(uColHeight * 0.48, uColHeight * 0.35, abs(wrappedY));
      float fadeBottom = smoothstep(-uColHeight * 0.48, -uColHeight * 0.35, wrappedY);
      vAlpha = 0.6 * pulse * fadeTop * fadeBottom;
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPosition;
      
      float dist = -mvPosition.z;
      gl_PointSize = 2.2 * uPixel * (40.0 / dist);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vec2 center = gl_PointCoord - 0.5;
      float r = dot(center, center);
      if (r > 0.25) discard;
      
      // Warm incandescent glow
      float core = exp(-r * 28.0);
      float halo = exp(-r * 9.0) * 0.4;
      float intensity = core + halo;
      
      vec3 col = vColor * intensity;
      float alpha = vAlpha * intensity;
      
      gl_FragColor = vec4(col, alpha);
    }
  `
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// Ambient light — very dim, just enough to define space
const ambient = new THREE.AmbientLight(0x1a1210, 0.15);
scene.add(ambient);

// Subtle top-light — catching the descending particles
const topLight = new THREE.DirectionalLight(0xffddbb, 0.08);
topLight.position.set(0, 20, 5);
scene.add(topLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function animate() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

animate();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
