<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kp5 · folded bouquet</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">kp5</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Leaf sheet geometry builder ── */
function createLeafStrip(config) {
  const { length, segments, curlStrength, veinCurve, widthProfile } = config;
  const positions = [];
  const indices = [];
  const seeds = [];
  
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const along = t * length;
    
    // Mid-vein path — calligraphic S-curve with fern-uncurl
    const veinX = veinCurve.x * Math.sin(t * Math.PI * 1.5);
    const veinY = along;
    const veinZ = veinCurve.z * Math.sin(t * Math.PI * 0.8);
    
    // Width modulation — wider at base, taper to tip
    const widthT = widthProfile(t);
    const halfWidth = 0.8 * widthT;
    
    // Curl — edges lift away from mid-vein plane
    const curl = curlStrength * Math.pow(t, 1.5);
    const curlAngle = curl * Math.PI * 0.6;
    
    // Left edge
    const lx = veinX - halfWidth * Math.cos(curlAngle);
    const ly = veinY;
    const lz = veinZ + halfWidth * Math.sin(curlAngle);
    positions.push(lx, ly, lz);
    seeds.push(Math.random());
    
    // Right edge
    const rx = veinX + halfWidth * Math.cos(curlAngle);
    const ry = veinY;
    const rz = veinZ - halfWidth * Math.sin(curlAngle);
    positions.push(rx, ry, rz);
    seeds.push(Math.random());
    
    if (i < segments) {
      const base = i * 2;
      indices.push(base, base+1, base+2);
      indices.push(base+1, base+3, base+2);
    }
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('seed', new THREE.Float32BufferAttribute(seeds, 1));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  
  return geom;
}

/* ── Leaf configurations (7 distinct leaf-twirl elements) ── */
const leafConfigs = [
  // Large central fern-frond, uncurling upward
  {
    length: 9.5,
    segments: 48,
    curlStrength: 1.6,
    veinCurve: { x: 0.8, z: 0.6 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 0.7) * (1.2 - t * 0.4),
    position: [0, -4, 0],
    rotation: [0.1, 0, 0],
    scale: 1.2,
    color: [0.78, 0.58, 0.30],
  },
  // Autumn leaf curling left
  {
    length: 6.8,
    segments: 36,
    curlStrength: 2.2,
    veinCurve: { x: -1.2, z: 0.4 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 0.9) * 1.0,
    position: [-3.2, -2, 1.5],
    rotation: [0.3, -0.6, 0.4],
    scale: 0.85,
    color: [0.72, 0.45, 0.28],
  },
  // Palm frond sweep right
  {
    length: 8.2,
    segments: 42,
    curlStrength: 1.3,
    veinCurve: { x: 1.5, z: -0.3 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 0.6) * (1.1 - t * 0.3),
    position: [2.8, -3, -1.2],
    rotation: [-0.2, 0.7, -0.3],
    scale: 0.95,
    color: [0.52, 0.34, 0.22],
  },
  // Small tightly-curled upper leaf
  {
    length: 4.5,
    segments: 28,
    curlStrength: 2.8,
    veinCurve: { x: -0.6, z: 0.8 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 1.2) * 0.7,
    position: [-1.5, 2, 2],
    rotation: [0.6, -1.2, 0.8],
    scale: 0.6,
    color: [0.92, 0.84, 0.66],
  },
  // Mid-sized back-curl
  {
    length: 7.0,
    segments: 38,
    curlStrength: 1.9,
    veinCurve: { x: 0.4, z: -1.1 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 0.8) * 0.95,
    position: [0.8, -1, -2.5],
    rotation: [-0.4, 0.2, 0.5],
    scale: 0.78,
    color: [0.68, 0.52, 0.34],
  },
  // Long side-frond
  {
    length: 8.8,
    segments: 44,
    curlStrength: 1.4,
    veinCurve: { x: 1.8, z: 0.5 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 0.65) * (1.15 - t * 0.35),
    position: [3.5, -2.5, 0.8],
    rotation: [0.15, 0.9, -0.25],
    scale: 0.88,
    color: [0.76, 0.54, 0.26],
  },
  // Small accent leaf forward
  {
    length: 5.2,
    segments: 30,
    curlStrength: 2.4,
    veinCurve: { x: -0.8, z: 1.3 },
    widthProfile: t => Math.pow(Math.sin(t * Math.PI), 1.1) * 0.8,
    position: [-2.2, 0.5, 2.8],
    rotation: [0.5, -0.8, 0.6],
    scale: 0.65,
    color: [0.82, 0.62, 0.38],
  },
];

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
};

/* ── Build leaf meshes as particle systems ── */
const leafGroup = new THREE.Group();
scene.add(leafGroup);

for (const cfg of leafConfigs) {
  const geom = createLeafStrip(cfg);
  
  // Convert to particles for consistent shader treatment
  const posArray = geom.attributes.position.array;
  const seedArray = geom.attributes.seed.array;
  const particleCount = posArray.length / 3;
  
  const particleGeom = new THREE.BufferGeometry();
  particleGeom.setAttribute('position', new THREE.Float32BufferAttribute(posArray, 3));
  particleGeom.setAttribute('seed', new THREE.Float32BufferAttribute(seedArray, 1));
  
  const leafColor = new Float32Array(particleCount * 3);
  for (let i = 0; i < particleCount; i++) {
    leafColor[i*3]   = cfg.color[0];
    leafColor[i*3+1] = cfg.color[1];
    leafColor[i*3+2] = cfg.color[2];
  }
  particleGeom.setAttribute('leafColor', new THREE.Float32BufferAttribute(leafColor, 3));
  
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: uniforms.uTime,
      uPixel: uniforms.uPixel,
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uPixel;
      attribute float seed;
      attribute vec3 leafColor;
      varying vec3 vCol;
      varying float vAlpha;
      
      void main() {
        vec3 p = position;
        float t = uTime * 0.4 + seed * 6.28;
        
        // Gentle breathing — leaf edges flutter
        float flutter = 0.08 * sin(t * 1.2 + p.y * 0.5) * (1.0 + abs(p.x) * 0.3);
        p.x += flutter * sin(t * 2.3);
        p.z += flutter * cos(t * 1.8);
        
        // Very slow drift down-and-sideways (autumn settle)
        float drift = uTime * 0.15;
        p.y -= drift * 0.08 * (0.5 + seed * 0.5);
        p.x += drift * 0.04 * (seed - 0.5);
        
        float energy = 0.5 + 0.5 * sin(t * 0.6);
        vCol = leafColor * (0.8 + 0.2 * energy);
        vAlpha = 0.65 + 0.35 * energy;
        
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        float dist = -mv.z;
        gl_PointSize = (1.2 + 0.4 * energy) * uPixel * (48.0 / dist);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vCol;
      varying float vAlpha;
      
      void main() {
        vec2 d = gl_PointCoord - 0.5;
        float r = dot(d, d);
        if (r > 0.25) discard;
        float a = exp(-r * 14.0) * vAlpha;
        gl_FragColor = vec4(vCol * a, a);
      }
    `
  });
  
  const points = new THREE.Points(particleGeom, mat);
  points.position.set(cfg.position[0], cfg.position[1], cfg.position[2]);
  points.rotation.set(cfg.rotation[0], cfg.rotation[1], cfg.rotation[2]);
  points.scale.setScalar(cfg.scale);
  
  leafGroup.add(points);
}

// Center the bouquet
const box = new THREE.Box3().setFromObject(leafGroup);
const center = box.getCenter(new THREE.Vector3());
leafGroup.position.sub(center);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  // Very subtle bouquet rotation — single slow drift, not oscillation
  leafGroup.rotation.y = elapsed * 0.04;
  
  // Camera breathes closer/farther gently
  const breathe = 22 + 1.5 * Math.sin(elapsed * 0.18);
  camera.position.z += (breathe - camera.position.z) * 0.02;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
