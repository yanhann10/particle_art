<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e9z · tender nebula drape</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0812; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">e9z</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · nebula drape · ember/indigo</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender nebula drape — differential growth string reimagined
   through cosmic palette: warm ember cores bleeding into deep indigo.
   Fine-grain particle clusters (tight, hot) contrast smooth low-density
   halos (diffuse, cool). Still Gonzalez-Torres quiet intimacy. */

const BG = 0x0d0812;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

const MAX_VERTS = 3200;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 6;

const verts = [];
const NV0 = 40;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 6;
  const y = -Math.abs(t) * 1.2 + Math.sin(t * Math.PI * 2) * 0.3;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
  }

  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- TWO particle systems: CORE (fine-grain, ember) + HALO (diffuse, indigo) ---
const N_CORE = 28000;
const N_HALO = 12000;
const N_TOTAL = N_CORE + N_HALO;

const rPos   = new Float32Array(N_TOTAL * 3);
const rSeeds = new Float32Array(N_TOTAL);
const rAge   = new Float32Array(N_TOTAL);
const rLayer = new Float32Array(N_TOTAL); // 0=core, 1=halo
for (let i = 0; i < N_TOTAL; i++) {
  rSeeds[i] = Math.random();
  rLayer[i] = i < N_CORE ? 0 : 1;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('layer',    new THREE.BufferAttribute(rLayer, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    attribute float layer; // 0=core, 1=halo
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLayer;
    varying float vFogFactor;

    void main() {
      vec3 p = position;
      vLayer = layer;

      // gentle sway
      float t = uTime * 0.3 + seed * 6.28;
      float sway = sin(t) * 0.008 * (1.0 + seed);
      p.x += sway;
      p.z += cos(t * 0.7) * 0.005;

      // pulse per-particle
      float pulse = 0.85 + 0.15 * sin(uTime * 1.2 + seed * 40.0);

      // CORE: ember → warm orange → soft peach
      // HALO: deep indigo → cool lavender
      vec3 ember   = vec3(1.0, 0.45, 0.15);   // hot ember core
      vec3 orange  = vec3(1.0, 0.65, 0.35);
      vec3 peach   = vec3(1.0, 0.82, 0.70);
      vec3 indigo  = vec3(0.18, 0.14, 0.35);  // deep cosmic blue
      vec3 lavend  = vec3(0.45, 0.38, 0.72);

      float k = clamp(age * 1.2, 0.0, 1.0);
      if (layer < 0.5) {
        // core: ember → orange → peach
        vCol = mix(ember, orange, k);
        vCol = mix(vCol, peach, smoothstep(0.7, 1.0, k));
        vAlpha = 0.6 + 0.2 * pulse;
      } else {
        // halo: indigo → lavender (cooler, softer)
        vCol = mix(indigo, lavend, k * 0.5);
        vAlpha = 0.3 + 0.15 * pulse;
      }
      vCol *= pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // CORE: fine-grain (smaller particles, tight clusters)
      // HALO: smooth low-density (larger particles, soft diffuse)
      float sz = (layer < 0.5) ? 1.5 : 3.2;
      gl_PointSize = sz * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;

      // fog
      float fogDepth = length(mv.xyz);
      float fogDensity = 0.028;
      vFogFactor = 1.0 - exp(-fogDensity * fogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLayer;
    varying float vFogFactor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core, halo, a;
      if (vLayer < 0.5) {
        // CORE: tight sharp falloff (fine-grain cluster)
        core = exp(-r * 32.0);
        halo = exp(-r * 12.0) * 0.25;
        a = (core + halo) * vAlpha;
      } else {
        // HALO: smooth broad falloff (low-density diffuse)
        core = exp(-r * 18.0) * 0.6;
        halo = exp(-r * 6.0) * 0.5;
        a = (core + halo) * vAlpha;
      }

      vec3 col = vCol;
      vec3 fogColor = vec3(0.051, 0.031, 0.071); // match BG #0d0812
      col = mix(col, fogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.75);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// faint wire
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x1a1525,
  transparent: true,
  opacity: 0.25
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 500; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;

  for (let i = 0; i < n; i++) {
    wirePositions[i * 3]     = verts[i].x;
    wirePositions[i * 3 + 1] = verts[i].y;
    wirePositions[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // distribute particles along curve
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt(
      (b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2
    );
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n - 1; i++) {
      const share = (i === n - 2)
        ? N_TOTAL - written
        : Math.max(1, Math.floor(N_TOTAL * lengths[i] / total));
      const a = verts[i], b = verts[i + 1];
      for (let k = 0; k < share && written < N_TOTAL; k++) {
        const isCore = written < N_CORE;
        const u = Math.random();
        // CORE: tight cluster around vertices (fine-grain)
        // HALO: broad spread (low-density smooth)
        const cu = isCore
          ? (u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2)
          : u;
        const spread = isCore ? 0.012 : 0.045;
        rPos[written * 3]     = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * spread;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * spread;
        rAge[written] = Math.max(a.age, b.age);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
  }

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
