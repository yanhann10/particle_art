<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a5e · woven field</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body { background: #07060f; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">a5e</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── CONCEPT ────────────────────────────────────────────────────────────────
// 80k Lorenz field particles as oriented dash-strokes using InstancedMesh.
// Each dash is a 6×1 rect aligned to flow velocity, creating woven textile.
// Color maps birth x-position: teal (left) → amber (right).
// Dense overlap, additive blending, no empty regions.
// Palette: #1A7A6E (teal) → #D4A574 (amber).

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07060f, 1);
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 0, 68);
camera.lookAt(0, 0, 0);
const scene = new THREE.Scene();

// ── GPGPU LORENZ (320×250 = 80k particles) ────────────────────────────────
const W = 320, H = 250, N = W * H;
const rtP = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const initD = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  const x = (Math.random()*2-1) * 12;
  const y = (Math.random()*2-1) * 12;
  const z = (Math.random()*2-1) * 12 + 25;
  initD[i*4]   = x;
  initD[i*4+1] = y;
  initD[i*4+2] = z;
  initD[i*4+3] = x; // store birth x for color
}
const initTex = new THREE.DataTexture(initD, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitSc = new THREE.Scene();
blitSc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: { t: { value: initTex } },
  vertexShader:   `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; varying vec2 v; void main(){ gl_FragColor=texture2D(t,v); }`
})));
renderer.setRenderTarget(rtA); renderer.render(blitSc, ortho); renderer.setRenderTarget(null);

const simU = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.004 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 }
};
const simSc = new THREE.Scene();
simSc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 v;
    void main(){
      vec4 s = texture2D(prev, v);
      vec3 p = s.xyz;
      vec3 dp = vec3(uSigma*(p.y-p.x), p.x*(uRho-p.z)-p.y, p.x*p.y-uBeta*p.z);
      p += dp * uDt;
      gl_FragColor = vec4(p, s.w);
    }
  `
})));

// ── DASH INSTANCED MESH (6×1 rect oriented to velocity) ───────────────────
const dashGeom = new THREE.PlaneGeometry(0.16, 0.026);
const dashMat = new THREE.ShaderMaterial({
  uniforms: { 
    state: { value: rtA.texture },
    uSigma: { value: 10.0 },
    uRho: { value: 28.0 },
    uBeta: { value: 8.0/3.0 }
  },
  transparent: true, 
  depthWrite: false, 
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uSigma, uRho, uBeta;
    varying vec3 vCol;
    varying float vAlpha;
    
    mat3 rotateAlign(vec3 dir) {
      vec3 up = abs(dir.y) < 0.99 ? vec3(0,1,0) : vec3(1,0,0);
      vec3 right = normalize(cross(up, dir));
      up = cross(dir, right);
      return mat3(right, up, dir);
    }
    
    void main(){
      float idx = float(gl_InstanceID);
      float total = ${N}.0;
      float y = floor(idx / ${W}.0);
      float x = idx - y * ${W}.0;
      vec2 uv = vec2((x + 0.5) / ${W}.0, (y + 0.5) / ${H}.0);
      
      vec4 s = texture2D(state, uv);
      vec3 p = s.xyz;
      float birthX = s.w;
      
      // compute velocity for orientation
      vec3 vel = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      float speed = length(vel);
      vec3 dir = speed > 0.001 ? normalize(vel) : vec3(1,0,0);
      
      // color from birth x: teal to amber
      float t = clamp((birthX + 12.0) / 24.0, 0.0, 1.0);
      vec3 teal = vec3(0.102, 0.478, 0.431);
      vec3 amber = vec3(0.831, 0.647, 0.455);
      vCol = mix(teal, amber, t);
      
      // scale by speed
      float sizeMul = 0.8 + 0.6 * clamp(speed / 4.0, 0.0, 1.0);
      vAlpha = 0.18 + 0.22 * clamp(speed / 5.0, 0.0, 1.0);
      
      // orient dash along velocity
      mat3 rot = rotateAlign(dir);
      vec3 pos = rot * (position * sizeMul) + (p - vec3(0,0,25));
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      gl_FragColor = vec4(vCol * 1.3, vAlpha);
    }
  `
});

const dashMesh = new THREE.InstancedMesh(dashGeom, dashMat, N);
scene.add(dashMesh);

// ── INTERACTION ────────────────────────────────────────────────────────────
const target = { sigma:10, rho:28 };
addEventListener('pointermove', e=>{
  target.rho   = 28+(e.clientY/innerHeight-.5)*7;
  target.sigma = 10+(e.clientX/innerWidth -.5)*3;
});
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── MAIN LOOP ──────────────────────────────────────────────────────────────
function loop() {
  const now = performance.now();
  simU.uSigma.value += (target.sigma-simU.uSigma.value)*0.04;
  simU.uRho.value   += (target.rho  -simU.uRho.value  )*0.04;

  dashMat.uniforms.uSigma.value = simU.uSigma.value;
  dashMat.uniforms.uRho.value = simU.uRho.value;
  dashMat.uniforms.uBeta.value = simU.uBeta.value;

  // 4 GPU Lorenz substeps
  for (let i=0;i<4;i++){
    simU.prev.value=rtA.texture;
    renderer.setRenderTarget(rtB); renderer.render(simSc,ortho);
    [rtA,rtB]=[rtB,rtA];
  }
  renderer.setRenderTarget(null);
  dashMat.uniforms.state.value=rtA.texture;

  // slow camera orbit
  const ang=now*0.00009;
  camera.position.x=Math.sin(ang)*68;
  camera.position.z=Math.cos(ang)*68;
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
