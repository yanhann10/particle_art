<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ldq · curl noise textile</title>
<!-- MOTION: drift, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #0a0a0f;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(42,31,58,0.2) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(58,31,42,0.15) 0%, transparent 50%),
      #0a0a0f;
  }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">ldq · curl noise textile</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Curl noise textile — high-intensity turbulent flow field (no boids, no rules).
// Each particle: born at a fixed position, that birth-position maps to hue
// (acid green/cobalt/magenta spectrum). Particle drifts in curl-noise field at
// intensity 4.5, rendered as 1.5px ink stroke with 120-frame fade trail.
// Dense pressurized edge-to-edge coverage — the canvas is a woven textile,
// not a void with scattered points.
//
// Curl noise: divergence-free vector field derived from the curl of a potential
// (Perlin or simplex noise). Produces swirling, eddy-like flow without sources/sinks.
// We use 3-octave curl with high amplitude so local clusters shear apart and rejoin.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

// Particle system — dense coverage
const N = 8000;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const birthPos = new Float32Array(N * 3);  // birth position → hue mapping
const age = new Float32Array(N);           // frames since birth
const MAX_AGE = 120;

// Init: uniform coverage across a 32×32 grid in XY, Z=0
const gridSize = Math.ceil(Math.sqrt(N));
for (let i = 0; i < N; i++){
  const gx = (i % gridSize) / gridSize;
  const gy = Math.floor(i / gridSize) / gridSize;
  const x = (gx - 0.5) * 28 + (Math.random() - 0.5) * 0.4;
  const y = (gy - 0.5) * 28 + (Math.random() - 0.5) * 0.4;
  const z = (Math.random() - 0.5) * 0.8;
  pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
  birthPos[i*3] = x; birthPos[i*3+1] = y; birthPos[i*3+2] = z;
  vel[i*3] = 0; vel[i*3+1] = 0; vel[i*3+2] = 0;
  age[i] = Math.random() * MAX_AGE;
}

// 3-octave Perlin-like noise (simplex approximation via sin/cos lattice)
function noise3(x, y, z){
  const X = Math.floor(x); const Y = Math.floor(y); const Z = Math.floor(z);
  const xf = x - X; const yf = y - Y; const zf = z - Z;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const hash = (i, j, k) => {
    let n = i * 374761393 + j * 668265263 + k;
    n = (n ^ (n >> 13)) * 1274126177;
    return (n ^ (n >> 16)) / 2147483648.0;
  };
  const lerp = (a, b, t) => a + t * (b - a);
  const a = lerp(hash(X, Y, Z), hash(X+1, Y, Z), u);
  const b = lerp(hash(X, Y+1, Z), hash(X+1, Y+1, Z), u);
  const c = lerp(hash(X, Y, Z+1), hash(X+1, Y, Z+1), u);
  const d = lerp(hash(X, Y+1, Z+1), hash(X+1, Y+1, Z+1), u);
  const e = lerp(a, b, v);
  const f = lerp(c, d, v);
  return lerp(e, f, w) * 2 - 1;
}

// Curl of a 3D potential field
function curl(x, y, z, t){
  const eps = 0.15;
  const scale = 0.08;
  const sx = x * scale, sy = y * scale, sz = z * scale;
  // potential function: sum of 3 octaves
  const pot = (px, py, pz) => {
    const freq1 = 1.0, amp1 = 4.5;
    const freq2 = 2.1, amp2 = 2.2;
    const freq3 = 4.3, amp3 = 1.1;
    return noise3(px * freq1 + t * 0.12, py * freq1 - t * 0.09, pz * freq1 + t * 0.05) * amp1 +
           noise3(px * freq2 + t * 0.08, py * freq2 + t * 0.11, pz * freq2 - t * 0.06) * amp2 +
           noise3(px * freq3 - t * 0.05, py * freq3 + t * 0.13, pz * freq3 + t * 0.07) * amp3;
  };
  // curl = ∇ × potential
  const dPdy_z = (pot(sx, sy + eps, sz) - pot(sx, sy - eps, sz)) / (2 * eps);
  const dPdz_y = (pot(sx, sy, sz + eps) - pot(sx, sy, sz - eps)) / (2 * eps);
  const dPdz_x = (pot(sx, sy, sz + eps) - pot(sx, sy, sz - eps)) / (2 * eps);
  const dPdx_z = (pot(sx + eps, sy, sz) - pot(sx - eps, sy, sz)) / (2 * eps);
  const dPdx_y = (pot(sx + eps, sy, sz) - pot(sx - eps, sy, sz)) / (2 * eps);
  const dPdy_x = (pot(sx, sy + eps, sz) - pot(sx, sy - eps, sz)) / (2 * eps);
  return [dPdy_z - dPdz_y, dPdz_x - dPdx_z, dPdx_y - dPdy_x];
}

function step(dt, t){
  for (let i = 0; i < N; i++){
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const [fx, fy, fz] = curl(px, py, pz, t);
    // integrate velocity (damping to keep speeds bounded)
    vel[i*3]     += fx * dt * 0.5;
    vel[i*3 + 1] += fy * dt * 0.5;
    vel[i*3 + 2] += fz * dt * 0.5;
    vel[i*3]     *= 0.94;
    vel[i*3 + 1] *= 0.94;
    vel[i*3 + 2] *= 0.94;
    // integrate position
    pos[i*3]     += vel[i*3] * dt;
    pos[i*3 + 1] += vel[i*3 + 1] * dt;
    pos[i*3 + 2] += vel[i*3 + 2] * dt;

    // wrap around edges for edge-to-edge coverage
    const bounds = 15;
    if (pos[i*3] < -bounds) pos[i*3] += bounds * 2;
    if (pos[i*3] > bounds) pos[i*3] -= bounds * 2;
    if (pos[i*3+1] < -bounds) pos[i*3+1] += bounds * 2;
    if (pos[i*3+1] > bounds) pos[i*3+1] -= bounds * 2;
    if (pos[i*3+2] < -4) pos[i*3+2] += 8;
    if (pos[i*3+2] > 4) pos[i*3+2] -= 8;

    age[i] += 1;
    if (age[i] > MAX_AGE){
      age[i] = 0;
      // respawn at birth position with small jitter
      pos[i*3]     = birthPos[i*3] + (Math.random() - 0.5) * 0.6;
      pos[i*3 + 1] = birthPos[i*3+1] + (Math.random() - 0.5) * 0.6;
      pos[i*3 + 2] = birthPos[i*3+2] + (Math.random() - 0.5) * 0.6;
      vel[i*3] = 0; vel[i*3+1] = 0; vel[i*3+2] = 0;
    }
  }
}

// Render: each particle as 1.5px ink stroke with fade trail
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('birthPos', new THREE.BufferAttribute(birthPos, 3));
geom.setAttribute('age', new THREE.BufferAttribute(age, 1));

const uniforms = {
  uTime: { value: 0 },
  uMaxAge: { value: MAX_AGE },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMaxAge;
    attribute vec3 birthPos;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      // birth position → hue: map XY to hue angle
      float hue = atan(birthPos.y, birthPos.x) / 6.283185 + 0.5;
      // quantize hue into 3 bands: acid green (0.25-0.35), cobalt (0.55-0.65), magenta (0.85-0.95)
      float band = mod(hue * 3.0, 1.0);
      vec3 col;
      if (band < 0.33) col = vec3(0.58, 0.95, 0.32);  // acid green
      else if (band < 0.66) col = vec3(0.22, 0.48, 0.88);  // cobalt
      else col = vec3(0.92, 0.28, 0.68);  // magenta

      // fade over lifetime
      float life = age / uMaxAge;
      vAlpha = (1.0 - life) * 0.65;
      vCol = col * (0.6 + 0.4 * (1.0 - life));

      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 1.5 * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      // ink stroke: slight soft edge
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      float edge = smoothstep(0.5, 0.3, r);
      gl_FragColor = vec4(vCol, vAlpha * edge);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm 80 frames so render-gate sees the textile already weaving
for (let i = 0; i < 80; i++){
  step(0.016, i * 0.016);
}
geom.attributes.position.needsUpdate = true;
geom.attributes.age.needsUpdate = true;

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.032, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  step(dt, t);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
