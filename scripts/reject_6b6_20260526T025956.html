<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6b6 · folded leaves cluster</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">6b6</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── LEAF SHEET BUILDER ── */
function buildLeafSheet(config) {
  const { 
    length = 4.0, 
    width = 1.2, 
    segments = 40, 
    curlStrength = 0.8, 
    twistStrength = 0.4,
    edgeCurl = 0.6,
    particlesPerUnit = 2000
  } = config;

  const totalParticles = Math.floor(length * width * particlesPerUnit);
  const positions = new Float32Array(totalParticles * 3);
  const seeds = new Float32Array(totalParticles);
  const uvs = new Float32Array(totalParticles * 2);

  let idx = 0;
  for (let i = 0; i < totalParticles; i++) {
    // parametric coords: u along length (0→1), v across width (-1→1)
    const u = Math.random();
    const v = (Math.random() - 0.5) * 2;
    
    // base position along midrib
    const x = u * length;
    const y = 0;
    const z = 0;

    // curl along length (fern-uncurling arc)
    const curlAngle = u * Math.PI * curlStrength;
    const radius = length / (Math.PI * curlStrength + 0.001);
    const xCurled = radius * Math.sin(curlAngle);
    const yCurled = radius * (1 - Math.cos(curlAngle));

    // width distribution (leaf narrows at tip)
    const widthTaper = Math.pow(1 - u, 0.4);
    const localWidth = width * widthTaper * v;

    // twist along length
    const twistAngle = u * Math.PI * twistStrength;
    const ct = Math.cos(twistAngle);
    const st = Math.sin(twistAngle);

    // edge curl (outer edges lift)
    const edgeLift = Math.abs(v) * edgeCurl * Math.sin(u * Math.PI);

    // combine transformations
    let px = xCurled;
    let py = yCurled + localWidth * st + edgeLift;
    let pz = localWidth * ct;

    // surface texture jitter
    const jitter = 0.02 * (1 + Math.abs(v) * 0.5);
    px += (Math.random() - 0.5) * jitter;
    py += (Math.random() - 0.5) * jitter;
    pz += (Math.random() - 0.5) * jitter;

    positions[idx * 3] = px;
    positions[idx * 3 + 1] = py;
    positions[idx * 3 + 2] = pz;
    seeds[idx] = Math.random();
    uvs[idx * 2] = u;
    uvs[idx * 2 + 1] = (v + 1) / 2;
    idx++;
  }

  return { positions, seeds, uvs, count: totalParticles };
}

/* ── LEAF CLUSTER COMPOSITION ── */
const leafConfigs = [
  // central large fern frond
  {
    length: 5.5, width: 1.8, curlStrength: 0.9, twistStrength: 0.2, edgeCurl: 0.5,
    position: [0, 0, 0], rotation: [0, 0, 0], scale: 1.0,
    particlesPerUnit: 1800
  },
  // left palm-like twist
  {
    length: 4.2, width: 1.4, curlStrength: 0.6, twistStrength: 0.7, edgeCurl: 0.8,
    position: [-2.5, -0.8, -1.2], rotation: [0.3, -0.6, -0.4], scale: 0.85,
    particlesPerUnit: 1600
  },
  // right autumn-curl
  {
    length: 3.8, width: 1.5, curlStrength: 1.2, twistStrength: 0.5, edgeCurl: 0.7,
    position: [2.2, -1.0, 0.8], rotation: [-0.2, 0.7, 0.5], scale: 0.9,
    particlesPerUnit: 1700
  },
  // top-back gentle arc
  {
    length: 4.0, width: 1.3, curlStrength: 0.5, twistStrength: 0.3, edgeCurl: 0.4,
    position: [0.5, 2.0, -2.5], rotation: [0.6, 0.2, -0.1], scale: 0.8,
    particlesPerUnit: 1500
  },
  // lower-front tight spiral
  {
    length: 3.5, width: 1.1, curlStrength: 1.4, twistStrength: 0.9, edgeCurl: 1.0,
    position: [-0.8, -2.2, 2.0], rotation: [-0.5, -0.3, 0.7], scale: 0.75,
    particlesPerUnit: 1400
  },
  // mid-left broad sweep
  {
    length: 4.5, width: 1.6, curlStrength: 0.7, twistStrength: 0.4, edgeCurl: 0.6,
    position: [-3.2, 0.5, 0.5], rotation: [0.1, -0.8, -0.3], scale: 0.88,
    particlesPerUnit: 1650
  },
  // mid-right gentle fold
  {
    length: 3.9, width: 1.35, curlStrength: 0.8, twistStrength: 0.6, edgeCurl: 0.65,
    position: [2.8, 0.3, -0.7], rotation: [-0.15, 0.65, 0.35], scale: 0.82,
    particlesPerUnit: 1550
  }
];

function buildCluster() {
  let totalCount = 0;
  const sheetData = [];

  for (const cfg of leafConfigs) {
    const sheet = buildLeafSheet(cfg);
    const mat = new THREE.Matrix4();
    const euler = new THREE.Euler(cfg.rotation[0], cfg.rotation[1], cfg.rotation[2]);
    mat.makeRotationFromEuler(euler);
    mat.scale(new THREE.Vector3(cfg.scale, cfg.scale, cfg.scale));
    mat.setPosition(cfg.position[0], cfg.position[1], cfg.position[2]);

    sheetData.push({ sheet, matrix: mat });
    totalCount += sheet.count;
  }

  const positions = new Float32Array(totalCount * 3);
  const seeds = new Float32Array(totalCount);
  const uvs = new Float32Array(totalCount * 2);
  const leafIds = new Float32Array(totalCount);

  let writeIdx = 0;
  const v = new THREE.Vector3();
  
  sheetData.forEach((data, leafIdx) => {
    const { sheet, matrix } = data;
    for (let i = 0; i < sheet.count; i++) {
      v.set(
        sheet.positions[i * 3],
        sheet.positions[i * 3 + 1],
        sheet.positions[i * 3 + 2]
      );
      v.applyMatrix4(matrix);
      positions[writeIdx * 3] = v.x;
      positions[writeIdx * 3 + 1] = v.y;
      positions[writeIdx * 3 + 2] = v.z;
      seeds[writeIdx] = sheet.seeds[i];
      uvs[writeIdx * 2] = sheet.uvs[i * 2];
      uvs[writeIdx * 2 + 1] = sheet.uvs[i * 2 + 1];
      leafIds[writeIdx] = leafIdx / leafConfigs.length;
      writeIdx++;
    }
  });

  return { positions, seeds, uvs, leafIds, count: totalCount };
}

/* ── Scene Setup ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 4, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

/* ── Build Geometry ── */
const clusterData = buildCluster();
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(clusterData.positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(clusterData.seeds, 1));
geom.setAttribute('uv', new THREE.BufferAttribute(clusterData.uvs, 2));
geom.setAttribute('leafId', new THREE.BufferAttribute(clusterData.leafIds, 1));
geom.computeBoundingSphere();

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute vec2 uv;
    attribute float leafId;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;
      float t = uTime * 0.3 + seed * 6.28;

      // gentle drift - each leaf sways differently
      float swayPhase = leafId * 6.28 + t * 0.6;
      float swayAmp = 0.12 * (0.5 + 0.5 * sin(leafId * 12.0));
      p.x += swayAmp * sin(swayPhase);
      p.y += swayAmp * 0.4 * cos(swayPhase * 0.7);
      p.z += swayAmp * 0.6 * sin(swayPhase * 0.8);

      // breath - subtle scale pulse
      float breath = 1.0 + 0.03 * sin(t * 0.5 + leafId * 3.0);
      p *= breath;

      // per-particle shimmer
      float shimmer = 0.5 + 0.5 * sin(t * 2.0 + seed * 40.0);

      // palette: warm amber on near-black (El Anatsui ochre metal)
      vec3 ochre = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 copper = vec3(0.72, 0.45, 0.28);
      vec3 dust = vec3(0.88, 0.76, 0.58);

      // color varies by position on leaf and which leaf
      float alongLeaf = uv.x;
      float acrossLeaf = abs(uv.y - 0.5) * 2.0;
      
      vec3 baseCol = mix(sienna, ochre, alongLeaf);
      baseCol = mix(baseCol, copper, acrossLeaf * 0.4);
      baseCol = mix(baseCol, dust, leafId * 0.3);
      
      // edge highlight
      float edgeBright = smoothstep(0.7, 1.0, acrossLeaf);
      baseCol += dust * edgeBright * 0.2;

      // vein darkening along midrib
      float veinDark = (1.0 - acrossLeaf) * 0.15;
      baseCol *= (1.0 - veinDark);

      vCol = baseCol;
      vAlpha = (0.6 + 0.4 * shimmer) * (1.0 - acrossLeaf * 0.2);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.4 * shimmer) * uPixel * (35.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── Ambient light (paper-grain atmosphere) ── */
const ambientGeo = new THREE.BufferGeometry();
const ambientCount = 2000;
const ambientPos = new Float32Array(ambientCount * 3);
const ambientSeeds = new Float32Array(ambientCount);
for (let i = 0; i < ambientCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 15 + Math.random() * 10;
  ambientPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  ambientPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) - 3;
  ambientPos[i * 3 + 2] = r * Math.cos(phi);
  ambientSeeds[i] = Math.random();
}
ambientGeo.setAttribute('position', new THREE.BufferAttribute(ambientPos, 3));
ambientGeo.setAttribute('seed', new THREE.BufferAttribute(ambientSeeds, 1));

const ambientMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      float drift = sin(uTime * 0.2 + seed * 6.28) * 0.5;
      p.y += drift;
      vAlpha = 0.08 * (0.5 + 0.5 * sin(uTime + seed * 6.28));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * 1.5;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      gl_FragColor = vec4(vec3(0.92, 0.84, 0.70), vAlpha);
    }
  `
});
const ambientPoints = new THREE.Points(ambientGeo, ambientMat);
scene.add(ambientPoints);

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animation Loop ── */
const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
