<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · compare</title>
<style>
  :root {
    --bg:#0a0a0d; --panel:#111116; --ink:#e8e6df; --muted:#8a8a93;
    --line:#1f1f26; --accent:#c9a86a; --hot:#d76b5a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif; }

  /* ── top bar ── */
  #topbar {
    position:fixed; top:0; left:0; right:0; z-index:20;
    height:44px;
    background:rgba(10,10,13,0.97); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:0.7rem; padding:0 1rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    backdrop-filter:blur(6px);
  }
  #topbar .label { color:var(--accent); font-weight:600; min-width:3rem; }
  #topbar .arrow { color:var(--muted); font-size:1.1rem; }
  #topbar .pending { color:var(--muted); font-style:italic; }
  #topbar button {
    background:rgba(30,30,40,0.9); color:var(--ink);
    border:1px solid var(--line); border-radius:3px;
    padding:4px 12px; cursor:pointer;
    font-family:inherit; font-size:0.78rem;
    transition:border-color 0.15s, color 0.15s;
  }
  #topbar button:hover { border-color:var(--accent); color:var(--accent); }
  #topbar button.primary { border-color:var(--accent); color:var(--accent); }
  #topbar button.primary:hover { background:rgba(201,168,106,0.15); }
  #topbar button.danger:hover { border-color:var(--hot); color:var(--hot); }
  #topbar .spacer { flex:1; }
  #topbar .close-btn { color:var(--muted); }

  /* ── split panes ── */
  #panes {
    position:fixed; top:44px; bottom:0; left:0; right:0;
    display:flex;
  }
  .pane {
    flex:1; position:relative; border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .pane:last-child { border-right:none; }
  .pane-header {
    position:absolute; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; gap:0.5rem;
    padding:6px 10px;
    background:linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.75rem;
    pointer-events:none;
  }
  .pane-header .pid { color:var(--accent); font-weight:600; }
  .pane-header .tag { color:var(--muted); }
  .pane iframe {
    flex:1; width:100%; height:100%; border:0; background:#000;
  }

  /* ── right pane feedback bar ── */
  #right-feedback {
    position:absolute; bottom:0; left:0; right:0; z-index:10;
    background:rgba(10,10,13,0.95); border-top:1px solid var(--line);
    display:flex; align-items:center; gap:0.5rem; padding:6px 10px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.78rem;
  }
  #right-feedback input {
    flex:1; background:rgba(30,30,40,0.9); color:var(--ink);
    border:1px solid var(--line); border-radius:3px;
    padding:5px 9px; font-family:inherit; font-size:0.78rem;
    outline:none;
  }
  #right-feedback input:focus { border-color:var(--accent); }
  #right-feedback button {
    background:rgba(30,30,40,0.9); color:var(--muted);
    border:1px solid var(--line); border-radius:3px;
    padding:5px 12px; cursor:pointer;
    font-family:inherit; font-size:0.78rem;
    transition:border-color 0.15s, color 0.15s;
    white-space:nowrap;
  }
  #right-feedback button:hover { border-color:var(--accent); color:var(--accent); }

  /* ── loading spinner ── */
  #loading {
    position:absolute; inset:0; z-index:8;
    background:rgba(10,10,13,0.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1rem; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.85rem;
    color:var(--muted);
  }
  .spinner {
    width:32px; height:32px;
    border:2px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #toast {
    position:fixed; bottom:4rem; left:50%; transform:translateX(-50%);
    background:rgba(30,35,45,0.97); border:1px solid var(--accent);
    color:var(--accent); border-radius:4px; padding:0.4rem 1rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:0.8rem;
    z-index:50; pointer-events:none; opacity:0; transition:opacity 0.2s;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div id="topbar">
  <span class="label" id="tb-left-id">—</span>
  <span class="arrow">→</span>
  <span class="label" id="tb-right-id">—</span>
  <span class="pending" id="tb-status"></span>
  <span class="spacer"></span>
  <button id="btn-replace" class="primary" style="display:none">Replace original →</button>
  <button id="btn-iterate" style="display:none">Iterate further</button>
  <button id="btn-back" class="close-btn">← back</button>
</div>

<div id="panes">
  <!-- left: original -->
  <div class="pane" id="left-pane">
    <div class="pane-header">
      <span class="pid" id="left-pid">—</span>
      <span class="tag">original</span>
    </div>
    <iframe id="left-frame" allow="camera; microphone; autoplay"></iframe>
  </div>

  <!-- right: new piece (or loading) -->
  <div class="pane" id="right-pane">
    <div class="pane-header">
      <span class="pid" id="right-pid">—</span>
      <span class="tag" id="right-tag">generating…</span>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-msg">Generating new piece…</div>
      <div id="loading-sub" style="font-size:0.72rem;color:var(--muted);max-width:280px;text-align:center"></div>
    </div>
    <iframe id="right-frame" allow="camera; microphone; autoplay" style="display:none"></iframe>
    <div id="right-feedback" style="display:none">
      <input id="right-input" type="text" placeholder="Make it better… (10 words)" maxlength="200">
      <button id="right-submit">→ Iterate</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ── URL params ─────────────────────────────────────────────────────── */
const params  = new URL(location.href).searchParams;
const leftId  = params.get('a') || '';
const rightId = params.get('b') || '';
const jobId   = params.get('job') || '';
const directive = params.get('directive') || '';

/* ── state ──────────────────────────────────────────────────────────── */
let currentRightId = rightId;
let pollTimer = null;
let pollSince = null;

/* ── DOM refs ───────────────────────────────────────────────────────── */
const leftFrame  = document.getElementById('left-frame');
const rightFrame = document.getElementById('right-frame');
const loading    = document.getElementById('loading');
const loadingMsg = document.getElementById('loading-msg');
const loadingSub = document.getElementById('loading-sub');
const tbLeftId   = document.getElementById('tb-left-id');
const tbRightId  = document.getElementById('tb-right-id');
const tbStatus   = document.getElementById('tb-status');
const leftPid    = document.getElementById('left-pid');
const rightPid   = document.getElementById('right-pid');
const rightTag   = document.getElementById('right-tag');
const btnReplace = document.getElementById('btn-replace');
const btnIterate = document.getElementById('btn-iterate');
const rfBar      = document.getElementById('right-feedback');
const rfInput    = document.getElementById('right-input');
const rfSubmit   = document.getElementById('right-submit');

/* ── toast ──────────────────────────────────────────────────────────── */
let _toastT = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ── load left piece ────────────────────────────────────────────────── */
function loadLeft(id) {
  leftFrame.src = `pieces/${id}/`;
  leftPid.textContent = id;
  tbLeftId.textContent = id;
  document.getElementById('left-pane').style.display = '';
}

/* ── show right piece once ready ────────────────────────────────────── */
function showRight(id) {
  currentRightId = id;
  rightFrame.src = `pieces/${id}/`;
  rightFrame.style.display = '';
  loading.style.display = 'none';
  rightPid.textContent = id;
  rightTag.textContent = 'new';
  tbRightId.textContent = id;
  tbStatus.textContent = '';
  btnReplace.style.display = '';
  btnIterate.style.display = '';
  rfBar.style.display = '';
  // update URL without reload
  const u = new URL(location.href);
  u.searchParams.set('b', id);
  u.searchParams.delete('job');
  history.replaceState({}, '', u);
}

/* ── polling: lineage.json for new child ───────────────────────────── */
async function pollLineage(parentId) {
  try {
    const r = await fetch('lineage.json?_=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const data = await r.json();
    const candidates = (data.pieces || []).filter(p =>
      p.parent_id === parentId &&
      (!pollSince || new Date(p.created_at) > pollSince)
    );
    if (candidates.length > 0) {
      const newest = candidates.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
      clearInterval(pollTimer);
      showRight(newest.id);
    }
  } catch (_) {}
}

/* ── polling: VM job status ─────────────────────────────────────────── */
async function pollJob(jid, parentId) {
  try {
    const r = await fetch(`/api/mutate?job_id=${jid}`);
    const data = await r.json();
    if (data.status === 'done' && data.new_id) {
      clearInterval(pollTimer);
      showRight(data.new_id);
      return;
    }
    if (data.status === 'error') {
      clearInterval(pollTimer);
      loadingMsg.textContent = 'Generation failed — check VM logs';
      loadingSub.textContent = data.error || '';
      return;
    }
  } catch (_) {}
  // also check lineage as fallback
  await pollLineage(parentId);
}

/* ── start polling ──────────────────────────────────────────────────── */
function startPolling(parentId, jid) {
  pollSince = new Date();
  if (jid) {
    loadingSub.textContent = directive ? `"${directive.slice(0,80)}"` : '';
    pollTimer = setInterval(() => pollJob(jid, parentId), 6000);
  } else {
    // GitHub-queue path: cron runs at 3 AM UTC — show estimated time
    const now = new Date();
    const next3am = new Date(now);
    next3am.setUTCHours(3, 0, 0, 0);
    if (next3am <= now) next3am.setUTCDate(next3am.getUTCDate() + 1);
    const hrsUntil = Math.round((next3am - now) / 36e5 * 10) / 10;
    loadingMsg.textContent = 'Queued — generating tonight';
    loadingSub.textContent = `~${hrsUntil}h until next cron run (3 AM UTC). This page will update automatically.`;
    // Poll every 5 min — cron runs daily, no need to hammer
    pollTimer = setInterval(() => pollLineage(parentId), 5 * 60 * 1000);
    // Also do one immediate check in case it was already generated
    pollLineage(parentId);
  }
}

/* ── submit right-pane feedback ─────────────────────────────────────── */
async function submitRightFeedback() {
  const text = rfInput.value.trim();
  if (!text) return;
  rfInput.disabled = true; rfSubmit.disabled = true;
  rfInput.value = '';

  // show loading again
  rightFrame.style.display = 'none';
  loading.style.display = '';
  loadingMsg.textContent = 'Generating refined piece…';
  loadingSub.textContent = `"${text.slice(0,80)}"`;
  btnReplace.style.display = 'none';
  btnIterate.style.display = 'none';
  rfBar.style.display = 'none';

  try {
    const r = await fetch('/api/mutate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({parent_id: currentRightId, directive: text}),
    });
    const data = await r.json();
    if (data.job_id) {
      startPolling(currentRightId, data.job_id);
    } else {
      startPolling(currentRightId, null);
    }
  } catch (e) {
    startPolling(currentRightId, null);
  }

  rfInput.disabled = false; rfSubmit.disabled = false;
}

rfSubmit.addEventListener('click', submitRightFeedback);
rfInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitRightFeedback(); });

/* ── Replace button ─────────────────────────────────────────────────── */
btnReplace.addEventListener('click', async () => {
  if (!currentRightId || !leftId) return;
  btnReplace.disabled = true;
  btnReplace.textContent = 'Replacing…';
  try {
    const r = await fetch('/api/replace', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({drop_id: leftId, new_id: currentRightId}),
    });
    const d = await r.json();
    if (d.ok) {
      showToast(`Replaced ${leftId} with ${currentRightId}`);
      setTimeout(() => { location.href = `pieces/${currentRightId}/`; }, 1000);
    } else {
      // Fallback: just navigate to new piece, mark old as dismissed in localStorage
      const dismissed = JSON.parse(localStorage.getItem('particle_art_dismissed')||'[]');
      dismissed.push(leftId);
      localStorage.setItem('particle_art_dismissed', JSON.stringify(dismissed));
      showToast(`${leftId} marked dropped · viewing ${currentRightId}`);
      setTimeout(() => { location.href = `pieces/${currentRightId}/`; }, 1000);
    }
  } catch {
    const dismissed = JSON.parse(localStorage.getItem('particle_art_dismissed')||'[]');
    dismissed.push(leftId);
    localStorage.setItem('particle_art_dismissed', JSON.stringify(dismissed));
    showToast(`${leftId} marked dropped · viewing ${currentRightId}`);
    setTimeout(() => { location.href = `pieces/${currentRightId}/`; }, 1000);
  }
});

/* ── Iterate button ─────────────────────────────────────────────────── */
btnIterate.addEventListener('click', () => {
  rfInput.focus();
  showToast('Type a direction in the box below →');
});

/* ── Back button ────────────────────────────────────────────────────── */
document.getElementById('btn-back').addEventListener('click', () => {
  if (history.length > 1) history.back();
  else location.href = 'index.html';
});

/* ── init ───────────────────────────────────────────────────────────── */
if (!leftId) {
  document.body.innerHTML = '<p style="padding:2rem;font-family:monospace">Missing ?a= parameter</p>';
} else {
  loadLeft(leftId);
  if (rightId) {
    showRight(rightId);
  } else {
    // waiting for generation
    startPolling(leftId, jobId);
  }
}
</script>
</body>
</html>
