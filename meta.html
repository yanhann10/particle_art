<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · meta</title>
<style>
  :root{--bg:#0a0a0d;--panel:#111116;--ink:#e8e6df;--muted:#8a8a93;--line:#1f1f26;--accent:#c9a86a;--hot:#d76b5a;}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;line-height:1.45}
  header{border-bottom:1px solid var(--line);padding:1.2rem 1.8rem .9rem;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.8rem}
  h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.04em}
  .sub{color:var(--muted);font-size:.84rem;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .sub a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  main{padding:1.6rem 1.8rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.6rem}
  section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1rem 1.2rem}
  h2{margin:0 0 .8rem;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;align-items:center;gap:.6rem;margin:.28rem 0;font-size:.82rem;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .label{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .bar-wrap{width:110px;flex-shrink:0;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar{height:100%;background:var(--accent);border-radius:3px}
  .cnt{color:var(--muted);min-width:34px;text-align:right}
  .pill{display:inline-block;padding:1px 7px;border-radius:3px;margin-right:4px;background:var(--line);font-size:.75rem}
</style>
</head>
<body>
<header>
  <h1>particle_art · meta</h1>
  <span class="sub" id="hdr">— · <a href="/">← back</a></span>
</header>
<main id="main"></main>
<script>
fetch('meta_index.json').then(r=>r.json()).then(data=>{
  const n = data.length;
  document.getElementById('hdr').innerHTML = `<b style="color:var(--accent)">${n}</b> pieces · <a href="/">← back</a>`;

  function tally(fn){
    const m={};
    data.forEach(p=>{const k=fn(p);if(k!=null)(m[k]=(m[k]||0)+1);});
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);
  }

  function section(title, rows, opts={}){
    const max=rows[0]?.[1]||1;
    const rowHtml=rows.map(([k,v])=>{
      const pct=Math.round(v/max*100);
      const label = opts.fmt ? opts.fmt(k) : k;
      return `<div class="row"><span class="label" title="${k}">${label}</span><div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div><span class="cnt">${v}</span></div>`;
    }).join('');
    return `<section><h2>${title}</h2>${rowHtml}</section>`;
  }

  // Direction: collapse minor variants, clean label
  const dirClean = s => s.replace(/-/g,' ').replace(/with environment/,'+ env').replace(/mediapipe/,'').trim();
  const dirRows = tally(p=>p.dir||'unknown').slice(0,12);

  // Provider
  const pvRows = tally(p=>p.pv||'unknown');

  // Generation buckets
  const genBucket = g => g<=3 ? `gen ${g}` : g<=10 ? 'gen 4–10' : g<=30 ? 'gen 11–30' : 'gen 31+';
  const genRows = tally(p=>genBucket(p.gen||0));

  // Particle count buckets
  const pcBucket = n => n<20000?'< 20k': n<60000?'20–60k': n<120000?'60–120k': n<200000?'120–200k':'200k+';
  const pcRows = tally(p=>pcBucket(p.pc||0));

  document.getElementById('main').innerHTML =
    section('direction · visual method', dirRows, {fmt: dirClean}) +
    section('provider', pvRows) +
    section('generation depth', genRows) +
    section('particle count', pcRows);
});
</script>
</body>
</html>
