<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>particle_art · new batch review</title><style>
:root{--bg:#09090c;--panel:#121217;--line:#292932;--ink:#ece9e1;--muted:#8e8b86;--keep:#c9a86a;--evolve:#7397c8;--reject:#b76464}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}header{position:sticky;top:0;z-index:5;background:rgba(9,9,12,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:15px;margin:0}.muted{color:var(--muted)}button,a{font:inherit;color:var(--ink);background:#15151b;border:1px solid var(--line);border-radius:6px;padding:7px 10px;text-decoration:none;cursor:pointer}button:hover,a:hover{border-color:var(--keep)}#progress{margin-left:auto}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.card[data-decision=keep]{border-color:var(--keep)}.card[data-decision=evolve]{border-color:var(--evolve)}.card[data-decision=reject]{opacity:.55;border-color:var(--reject)}.thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#000;cursor:pointer}.meta{padding:10px 11px 6px;display:flex;gap:8px;align-items:baseline}.id{font-weight:700}.title{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:7px 10px}.actions button{padding:7px 3px}.keep{color:var(--keep)}.evolve{color:var(--evolve)}.reject{color:var(--reject)}.actions .keep.selected{color:#12100a;background:var(--keep);border-color:var(--keep);font-weight:700}.actions .evolve.selected{color:#08111e;background:var(--evolve);border-color:var(--evolve);font-weight:700}.actions .reject.selected{color:#180909;background:var(--reject);border-color:var(--reject);font-weight:700}.save-state{height:18px;margin:0 11px 5px;color:var(--muted);font-size:11px}.save-state strong{color:var(--ink)}textarea{display:block;margin:0 10px 10px;width:calc(100% - 20px);min-height:56px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:#0c0c10;color:var(--ink);padding:8px;font:12px ui-monospace,monospace}.viewer{position:fixed;inset:0;background:#000;z-index:10;display:none}.viewer.show{display:block}.viewer iframe{width:100%;height:100%;border:0}.viewer .bar{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:6px;pointer-events:none}.viewer .bar>*{pointer-events:auto}.viewer .bar .spacer{flex:1}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#22222a;border:1px solid var(--line);border-radius:7px;opacity:0;z-index:20}.toast.show{opacity:1}@media(max-width:650px){#progress{margin-left:0}.grid{padding:10px}}
</style></head><body><header><h1>new batch review</h1><span class="muted">keep = eligible to deploy · evolve = iterate · reject = never deploy</span><span id="progress">0 / 0 reviewed</span><button id="pending">pending only</button><button id="save">save now</button><button id="copy">copy feedback</button><button id="download">download JSON</button><a href="index.html">gallery</a></header><main class="grid" id="grid"></main><div class="viewer" id="viewer"><div class="bar"><button id="prev">←</button><span id="viewId"></span><div class="spacer"></div><button id="close">close</button></div><iframe id="frame"></iframe></div><div class="toast" id="toast"></div><script>
const referenceMode=new URLSearchParams(location.search).has('reference');
const KEY=referenceMode?'particle_art_reference_review_v2':'particle_art_batch_review_v1';let items=[],state=JSON.parse(localStorage.getItem(KEY)||'{}'),pendingOnly=false,current=-1,saveTimer,retryTimer,revision=0,ackRevision=0;
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}
function migrate(s){for(const v of Object.values(s)){if(v.decision&&!v.decisions){v.decisions=v.decision==='keep'?['keep']:v.decision==='evolve'?['evolve']:v.decision==='reject'?['reject']:[];delete v.decision}}return s}state=migrate(state);
function choices(id){return new Set(state[id]?.decisions||[])}
function payload(){return{version:2,updated_at:new Date().toISOString(),source:'batch-review.html',reviews:Object.fromEntries(items.map(x=>[x.id,{decisions:[...choices(x.id)],keep:choices(x.id).has('keep'),evolve:choices(x.id).has('evolve'),reject:choices(x.id).has('reject'),note:state[x.id]?.note||'',title:x.title,group:x.group}]))}}
async function persist(show=false){localStorage.setItem(KEY,JSON.stringify(state));clearTimeout(saveTimer);clearTimeout(retryTimer);const sentRevision=revision;try{let r=await fetch(referenceMode?'/api/reference-feedback':'/api/batch-feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload()),keepalive:true});if(!r.ok)throw Error(r.status);ackRevision=Math.max(ackRevision,sentRevision);if(ackRevision===revision)markSaved();else persist(false);if(show)notify('feedback confirmed on disk')}catch(e){markUnconfirmed();retryTimer=setTimeout(()=>persist(false),1500);if(show)notify('browser saved · server retrying')}}
function schedule(){revision++;localStorage.setItem(KEY,JSON.stringify(state));clearTimeout(saveTimer);saveTimer=setTimeout(()=>persist(false),150);progress()}
function markSaving(id,label='saving…'){let c=document.querySelector(`.card[data-id="${id}"]`),s=c?.querySelector('.save-state');if(s)s.innerHTML=label}
function markSaved(){document.querySelectorAll('.card').forEach(c=>{let d=[...choices(c.dataset.id)].join(' + '),n=state[c.dataset.id]?.note||'',s=c.querySelector('.save-state');if(s&&(d||n))s.innerHTML=`<strong>saved</strong>${d?' · '+d:''}${n?' · note saved':''}`})}
function markUnconfirmed(){document.querySelectorAll('.card').forEach(c=>{let d=choices(c.dataset.id),n=state[c.dataset.id]?.note||'',s=c.querySelector('.save-state');if(s&&(d.size||n))s.innerHTML='<strong>browser saved</strong> · server retrying…'})}
function syncButtons(c,id){let selected=choices(id);c.querySelectorAll('.actions button').forEach(b=>b.classList.toggle('selected',selected.has([...b.classList].find(x=>['keep','evolve','reject'].includes(x)))))}
function decide(id,d){state[id]??={};let selected=choices(id);if(d==='reject'){selected=selected.has('reject')?new Set():new Set(['reject'])}else{selected.delete('reject');selected.has(d)?selected.delete(d):selected.add(d)}state[id].decisions=[...selected];let label=[...selected].join(' + ')||'cleared',c=document.querySelector(`.card[data-id="${id}"]`);if(c){c.dataset.decision=selected.has('reject')?'reject':selected.has('evolve')?'evolve':selected.has('keep')?'keep':'';syncButtons(c,id);markSaving(id,`<strong>${label}</strong> · saving…`)}schedule();if(pendingOnly&&!selected.size)setTimeout(render,450)}
function progress(){let reviewed=x=>choices(x.id).size>0,n=items.filter(reviewed).length;$('#progress').textContent=`${n} / ${items.length} reviewed · ${items.filter(x=>choices(x.id).has('keep')).length} keep · ${items.filter(x=>choices(x.id).has('evolve')).length} evolve · ${items.filter(x=>choices(x.id).has('reject')).length} reject`}
function render(){let grid=$('#grid');grid.innerHTML='';items.forEach((x,i)=>{let selected=choices(x.id);if(pendingOnly&&selected.size)return;let c=document.createElement('article');c.className='card';c.dataset.id=x.id;c.dataset.decision=selected.has('reject')?'reject':selected.has('evolve')?'evolve':selected.has('keep')?'keep':'';c.innerHTML=`<img class="thumb" src="thumbs/${x.id}.png" alt=""><div class="meta"><span class="id">${x.id}</span><span class="title">${esc(x.title)}</span></div><div class="actions"><button class="keep">keep</button><button class="evolve">evolve</button><button class="reject">reject</button></div><div class="save-state"></div><textarea placeholder="feedback / evolution direction — typing autosaves">${esc(state[x.id]?.note||'')}</textarea>`;c.querySelector('.thumb').onclick=()=>open(i);c.querySelector('.keep').onclick=()=>decide(x.id,'keep');c.querySelector('.evolve').onclick=()=>decide(x.id,'evolve');c.querySelector('.reject').onclick=()=>decide(x.id,'reject');c.querySelector('textarea').oninput=e=>{state[x.id]??={};state[x.id].note=e.target.value;markSaving(x.id,'note · saving…');schedule()};grid.appendChild(c);syncButtons(c,x.id)});markSaved();progress()}
function open(i){current=i;$('#viewId').textContent=items[i].id+' · '+items[i].title;$('#frame').src=`pieces/${items[i].id}/index.html`;$('#viewer').classList.add('show')}
function close(){$('#frame').src='about:blank';$('#viewer').classList.remove('show');current=-1}$('#close').onclick=close;$('#prev').onclick=()=>current>0&&open(current-1);addEventListener('keydown',e=>{if(current<0)return;if(e.key==='Escape')close();if(e.key==='ArrowRight'&&current<items.length-1)open(current+1);if(e.key==='ArrowLeft'&&current>0)open(current-1);if(e.key==='1')decide(items[current].id,'keep');if(e.key==='2')decide(items[current].id,'evolve');if(e.key==='3')decide(items[current].id,'reject')});
addEventListener('pagehide',()=>{if(revision>ackRevision)navigator.sendBeacon(referenceMode?'/api/reference-feedback':'/api/batch-feedback',new Blob([JSON.stringify(payload())],{type:'application/json'}))});
$('#pending').onclick=()=>{pendingOnly=!pendingOnly;$('#pending').textContent=pendingOnly?'show all':'pending only';render()};$('#save').onclick=()=>persist(true);$('#copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(payload(),null,2));notify('feedback copied')};$('#download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}));a.download='particle-art-batch-feedback.json';a.click();URL.revokeObjectURL(a.href)};
if(referenceMode){
  document.title='particle_art · reference evolutions';document.querySelector('h1').textContent='reference evolutions · vetted four';
  fetch('reference_evolutions_v2.json').then(r=>r.json()).then(all=>{let vetted=new Set(['gd7','f2k','ckc','0fu']);items=all.filter(x=>vetted.has(x.id)).map(x=>({...x,group:'reference-v2'}));render();if(Object.keys(state).length){revision++;markUnconfirmed();persist(false)}}).catch(e=>{$('#grid').textContent='Could not load review manifest: '+e});
}else Promise.all([fetch('critique_vetted_50.json').then(r=>r.json()),fetch('feedback_evolutions_11.json').then(r=>r.json())]).then(([batch,evo])=>{let evolvedKeep=new Set(['nm3','6q1','0pj','dk0','5pi','58k','plt','knn']);items=[...evo.filter(x=>evolvedKeep.has(x.id)).map(x=>({...x,group:'evolved'})),...batch.map(x=>({...x,group:'new-50'}))];render();persist(false)}).catch(e=>{$('#grid').textContent='Could not load review manifests: '+e});
</script></body></html>
