<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · all pieces</title>
<style>
  :root {
    --bg:#0a0a0d; --panel:#111116; --ink:#e8e6df; --muted:#8a8a93;
    --line:#1f1f26; --accent:#c9a86a; --hot:#d76b5a; --fav:#c9a86a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",sans-serif;
    line-height:1.45; }
  header {
    border-bottom:1px solid var(--line);
    padding:1.2rem 1.8rem 0.9rem;
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:0.8rem;
  }
  h1 { margin:0; font-size:1.05rem; font-weight:600; letter-spacing:0.04em; }
  .meta { color:var(--muted); font-size:0.84rem;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .meta b { color:var(--accent); font-weight:500; }
  .meta a { color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); }
  .meta a:hover { color:var(--hot); border-color:var(--hot); }
  .legend {
    padding:0.5rem 1.8rem;
    color:var(--muted); font-size:0.78rem;
    border-bottom:1px solid var(--line);
    background:#08080b;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    display:flex; gap:1.2rem; flex-wrap:wrap; align-items:center;
  }
  .legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
    gap:1rem;
    padding:1.2rem 1.8rem 3rem;
  }
  .card {
    background:var(--panel); border:1px solid var(--line);
    border-radius:6px; overflow:hidden; cursor:pointer;
    transition:transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    position:relative;
  }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 18px rgba(0,0,0,0.4); }
  /* encouraged: golden ring */
  .card.favored { border-color:rgba(201,168,106,0.55); box-shadow:0 0 12px rgba(201,168,106,0.18); }
  /* dropped: dim */
  .card.dropped { opacity:0.38; border-color:rgba(80,80,90,0.4); }
  .card.dropped:hover { opacity:0.6; transform:none; border-color:#555; box-shadow:none; }
  .thumb-wrap {
    width:100%; aspect-ratio:16/10; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#1a1a25 0%,#0e0e14 100%);
  }
  .thumb-wrap img { width:100%; height:100%; display:block; object-fit:cover; }
  .thumb-wrap .placeholder {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:0.3rem;
    background:linear-gradient(135deg,#18182a 0%,#0a0a14 60%,#1f0d1f 100%);
  }
  .thumb-wrap .placeholder .glyph {
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:1.8rem; font-weight:300; color:var(--accent); opacity:0.6;
  }
  /* encouraged star badge */
  .card.favored .thumb-wrap::after {
    content:'♥'; position:absolute; top:6px; left:6px;
    font-size:0.75rem; color:var(--accent);
    background:rgba(0,0,0,0.6); border-radius:3px;
    padding:1px 5px; line-height:1.5;
  }
  /* dropped badge */
  .card.dropped .thumb-wrap::after {
    content:'dropped'; position:absolute; top:6px; left:6px;
    font-size:0.65rem; color:#888;
    background:rgba(0,0,0,0.7); border-radius:3px;
    padding:1px 5px; line-height:1.5;
    letter-spacing:0.05em;
  }
  .meta-row {
    padding:0.5rem 0.7rem 0.6rem;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .meta-row .code {
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-size:0.9rem; font-weight:600;
    color:var(--accent); letter-spacing:0.06em;
  }
  .card.dropped .meta-row .code { color:var(--muted); }
  .meta-row .dir { font-size:0.68rem; color:var(--muted); font-family:ui-monospace,monospace; }
  .gen-pill {
    position:absolute; top:6px; right:6px;
    background:rgba(0,0,0,0.55); color:var(--muted);
    font-size:0.58rem; padding:1px 5px; border-radius:3px;
    font-family:ui-monospace,monospace;
  }
  /* restore button (only shown on dropped cards on hover) */
  .restore-btn {
    position:absolute; bottom:7px; right:7px;
    width:20px; height:20px;
    background:rgba(10,10,13,0.7); color:var(--muted);
    border:1px solid var(--line); border-radius:3px;
    cursor:pointer; font-size:0.72rem; line-height:1;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity 0.15s, border-color 0.15s, color 0.15s;
    z-index:3; padding:0;
  }
  .card.dropped:hover .restore-btn { opacity:1; }
  .restore-btn:hover { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · all pieces</h1>
    <div class="meta">
      <b id="totalCount">0</b> total ·
      <b id="favCount">0</b> encouraged ·
      <b id="dropCount">0</b> dropped
    </div>
  </div>
  <div class="meta">
    <a href="index.html">← curated view</a>
    <span style="margin:0 0.5rem">·</span>
    <a href="tree.html">lineage tree</a>
  </div>
</header>
<div class="legend">
  <span><span class="dot" style="background:var(--accent)"></span> encouraged — system will create more in this style</span>
  <span><span class="dot" style="background:#555"></span> dropped — excluded from curated view</span>
  <span style="color:var(--ink)">hover dropped piece to restore it</span>
</div>
<div class="grid" id="grid"></div>
<script>
const DISMISSED_KEY = 'particle_art_dismissed';
const FAVORITES_KEY  = 'particle_art_favorites';
function getDismissed(){try{return new Set(JSON.parse(localStorage.getItem(DISMISSED_KEY)||'[]'))}catch{return new Set()}}
function saveDismissed(s){localStorage.setItem(DISMISSED_KEY,JSON.stringify([...s]))}
function getFavorites(){try{return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]'))}catch{return new Set()}}

async function load(){
  const res = await fetch('lineage.json',{cache:'no-cache'});
  if(!res.ok) return;
  const lineage = await res.json();
  const dismissed = getDismissed();
  const favs = getFavorites();
  const pieces = lineage.pieces;

  document.getElementById('totalCount').textContent = pieces.length;
  document.getElementById('favCount').textContent   = pieces.filter(p=>favs.has(p.id)).length;
  document.getElementById('dropCount').textContent  = pieces.filter(p=>dismissed.has(p.id)).length;

  const grid = document.getElementById('grid');
  for(const p of pieces){
    const isDrop = dismissed.has(p.id);
    const isFav  = favs.has(p.id);
    const card = document.createElement('div');
    card.className = 'card' + (isDrop?' dropped':'') + (isFav?' favored':'');
    card.dataset.id = p.id;
    const thumb = `thumbs/${p.id}.png`;
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${thumb}" alt="${p.id}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="placeholder" style="display:none"><div class="glyph">${p.id}</div></div>
        ${p.generation>0?`<div class="gen-pill">g${p.generation}</div>`:''}
      </div>
      <div class="meta-row">
        <span class="code">${p.id}</span>
        <span class="dir">${p.title||p.direction||''}</span>
      </div>
      ${isDrop?`<button class="restore-btn" title="restore to curated view">↩</button>`:''}
    `;
    if(isDrop){
      card.querySelector('.restore-btn').addEventListener('click',(e)=>{
        e.stopPropagation();
        const d=getDismissed(); d.delete(p.id); saveDismissed(d);
        card.classList.remove('dropped');
        card.querySelector('.restore-btn').remove();
        document.getElementById('dropCount').textContent =
          parseInt(document.getElementById('dropCount').textContent)-1;
      });
    }
    card.addEventListener('click',()=>{ window.open(`pieces/${p.id}/`,'_blank'); });
    grid.appendChild(card);
  }
}
load();
</script>
</body>
</html>
