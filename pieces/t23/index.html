<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);

<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">t23</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

/* ── Logarithmic-spiral nautilus shells ── */
const SHELLS = 5;
const PER_SHELL = 3200;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
const spiralT   = new Float32Array(N);

// Each shell has a tilted axis for silhouette complexity
const shellAxes = [
  new THREE.Vector3(0, 1, 0),
  new THREE.Vector3(0.5, 0.85, 0.15).normalize(),
  new THREE.Vector3(-0.3, 0.9, 0.3).normalize(),
  new THREE.Vector3(0.2, 0.75, -0.6).normalize(),
  new THREE.Vector3(-0.4, 0.8, 0.45).normalize()
];
const shellQuats = shellAxes.map(ax => {
  const q = new THREE.Quaternion();
  q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ax);
  return q;
});

const golden = (1 + Math.sqrt(5)) / 2;

for (let s = 0; s < SHELLS; s++) {
  const baseR = 2.2 + s * 1.6;
  const growthRate = 0.12 + s * 0.02; // logarithmic spiral growth
  const turns = 2.5 + s * 0.4;

  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const t = i / PER_SHELL; // 0..1

    // Logarithmic spiral: r = a * e^(b*theta)
    const theta = t * turns * Math.PI * 2;
    const r = baseR * Math.exp(growthRate * theta * 0.15);

    // Cross-section offset for nautilus thickness
    const crossAngle = Math.random() * Math.PI * 2;
    const crossR = (0.3 + 0.5 * s * 0.1) * (0.5 + 0.5 * Math.random());

    // Base spiral in XY plane
    let px = r * Math.cos(theta) + crossR * Math.cos(crossAngle) * Math.cos(theta + Math.PI * 0.5);
    let py = crossR * Math.sin(crossAngle);
    let pz = r * Math.sin(theta) + crossR * Math.cos(crossAngle) * Math.sin(theta + Math.PI * 0.5);

    // Rotate by shell's unique axis
    const v = new THREE.Vector3(px, py, pz);
    v.applyQuaternion(shellQuats[s]);

    positions[idx * 3]     = v.x;
    positions[idx * 3 + 1] = v.y;
    positions[idx * 3 + 2] = v.z;
    shellIdx[idx] = s;
    seeds[idx] = Math.random();
    spiralT[idx] = t;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('spiralT',  new THREE.BufferAttribute(spiralT, 1));

const uBands = new THREE.Vector4(0, 0, 0, 0);
const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uBands:   { value: uBands },
  uTreble:  { value: 0 },
  uSurprise: { value: 0 }  // 0 = normal, 1 = implode, 2 = hold, 3 = bloom
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform float uSurprise;
    attribute float shellIdx;
    attribute float seed;
    attribute float spiralT;
    varying vec3 vCol;
    varying float vEnergy;

    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;
      vEnergy = e;

      vec3 p = position;
      float r = length(p);
      vec3 dir = p / max(r, 0.001);

      // Radial pulse from band energy
      float pulse = 1.0 + e * 0.6;
      p = dir * r * pulse;

      // Per-shell tilted swirl (each shell orbits its own axis)
      float swirlSpeed = 0.3 + shellIdx * 0.08;
      float t = uTime * swirlSpeed + seed * 6.28;
      // Swirl perpendicular changes per shell — uses shellIdx to pick axis offset
      float axAngle = shellIdx * 1.256 + 0.5;
      vec3 swirlAxis = normalize(vec3(sin(axAngle), cos(axAngle * 0.7), sin(axAngle * 1.3)));
      vec3 perp = normalize(cross(dir, swirlAxis));
      p += perp * sin(t) * (0.25 + e * 0.7) * (0.5 + spiralT);

      // ── VOILÀ surprise: implode → hold → bloom ──
      // uSurprise: 0→1 implode, 1→2 hold tight, 2→3 bloom outward
      if (uSurprise > 0.0) {
        float phase = uSurprise;
        if (phase <= 1.0) {
          // implode: pull everything toward center
          float imp = phase;
          imp = imp * imp; // ease-in
          p = mix(p, dir * 0.3, imp);
        } else if (phase <= 2.0) {
          // hold: tight cluster, trembling
          float hold = phase - 1.0;
          p = dir * 0.3;
          p += vec3(sin(seed*40.0 + uTime*20.0), cos(seed*37.0 + uTime*18.0), sin(seed*43.0 + uTime*22.0)) * 0.15;
        } else {
          // bloom: explode outward past original, then return
          float bloom = phase - 2.0;
          float expand = sin(bloom * 3.14159) * 2.2; // arc up then back
          p = dir * (r * pulse + expand * (3.0 + shellIdx * 1.5));
          p += perp * sin(t * 2.0) * expand * 0.5;
        }
      }

      // ── palette ──
      // normal: amber → cyan duotone
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan  = vec3(0.25, 0.85, 0.95);
      float k = clamp(spiralT + shellIdx * 0.15 + e * 0.3, 0.0, 1.0);
      vCol = mix(amber, cyan, k);

      // during surprise hold+bloom: flip to magenta → gold
      if (uSurprise > 1.0) {
        vec3 magenta = vec3(0.92, 0.2, 0.65);
        vec3 gold    = vec3(1.0, 0.85, 0.3);
        float flip = smoothstep(1.0, 1.5, uSurprise);
        float unflip = smoothstep(2.5, 3.0, uSurprise);
        float amt = flip * (1.0 - unflip);
        vec3 altCol = mix(magenta, gold, k);
        vCol = mix(vCol, altCol, amt);
      }

      vCol *= (0.6 + e * 1.2);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 2.0 * e) * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * (0.5 + 0.5 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Audio setup ── */
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 spiral shells';
  } catch (e) {
    hint.textContent = 'mic denied — passive synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi - lo)) / 255;
}

/* ── Surprise cycle timing ──
   Every ~18s: 2s implode → 0.8s hold → 2s bloom → normal
   Total surprise window ~4.8s, rest ~13.2s of nautilus form */
const CYCLE = 18.0;
const IMPLODE_DUR = 2.0;
const HOLD_DUR = 0.8;
const BLOOM_DUR = 2.0;
const SURPRISE_TOTAL = IMPLODE_DUR + HOLD_DUR + BLOOM_DUR;

function getSurprisePhase(t) {
  const inCycle = ((t + 6.0) % CYCLE); // offset so first voilà isn't immediate
  if (inCycle > SURPRISE_TOTAL) return 0.0;
  if (inCycle < IMPLODE_DUR) return inCycle / IMPLODE_DUR; // 0→1
  if (inCycle < IMPLODE_DUR + HOLD_DUR) return 1.0 + (inCycle - IMPLODE_DUR) / HOLD_DUR; // 1→2
  return 2.0 + (inCycle - IMPLODE_DUR - HOLD_DUR) / BLOOM_DUR; // 2→3
}

/* ── Centroid tracking camera ── */
const camTarget = new THREE.Vector3();

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  uniforms.uSurprise.value = getSurprisePhase(t);

  // Gentle rotation — slower so spiral form reads
  points.rotation.y = t * 0.06;
  points.rotation.x = Math.sin(t * 0.04) * 0.15;

  // Camera tracks centroid
  const surprise = uniforms.uSurprise.value;
  let targetZ = 22;
  if (surprise > 2.0) {
    // pull back during bloom
    const bloom = surprise - 2.0;
    targetZ = 22 + Math.sin(bloom * Math.PI) * 12;
  } else if (surprise > 0.5 && surprise <= 1.5) {
    // push in during implode/hold
    targetZ = 22 - smoothstep(0.5, 1.2, surprise) * 8;
  }
  camera.position.z += (targetZ - camera.position.z) * 0.04;

  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n * 0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n * 0.04), Math.floor(n * 0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n * 0.12), Math.floor(n * 0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n * 0.30), Math.floor(n * 0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n * 0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t * 1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t * 2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t * 3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t * 4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t * 7.0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
