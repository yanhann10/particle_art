<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEW_ID · Leaf Flurry Through Web</title>
<!-- MOTION: drift + sudden gust, intensity: calm → surprise → calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">NEW_ID · Leaf Flurry Through Web</div>
<div class="hint">drag to orbit · wait for the gust</div>
<div class="src">Saraceno web + autumn surprise · tumbling leaves interrupt topology</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0, 0);

const N = 300;
const anchors = [];
const velocities = [];

let seed = 0xABC1234;
function rng(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

const clusterCenters = [
  new THREE.Vector3(-4, 2, 1),
  new THREE.Vector3(2, -1, -2),
  new THREE.Vector3(1, 3, 3),
];

for (let i = 0; i < N; i++){
  const cIdx = Math.floor(rng() * clusterCenters.length);
  const c = clusterCenters[cIdx];
  const r = 3.0 + rng() * 1.5;
  const theta = rng() * Math.PI * 2;
  const phi = Math.acos(2 * rng() - 1);
  const x = c.x + r * Math.sin(phi) * Math.cos(theta);
  const y = c.y + r * Math.sin(phi) * Math.sin(theta);
  const z = c.z + r * Math.cos(phi);
  anchors.push(new THREE.Vector3(x, y, z));
  velocities.push(new THREE.Vector3(0, 0, 0));
}

const edges = [];
const edgeSeeds = [];
for (let i = 0; i < N; i++){
  const dists = anchors.map((a, j) => ({ j, d: anchors[i].distanceTo(a) }));
  dists.sort((a, b) => a.d - b.d);
  const k = 2 + Math.floor(rng() * 3);
  for (let m = 1; m <= k && m < dists.length; m++){
    const j = dists[m].j;
    if (j > i) {
      edges.push([i, j]);
      edgeSeeds.push(rng());
    }
  }
  if (rng() < 0.04){
    const farIdx = Math.floor(dists.length * 0.7 + rng() * dists.length * 0.3);
    if (farIdx < dists.length){
      const j = dists[farIdx].j;
      if (j > i){
        edges.push([i, j]);
        edgeSeeds.push(rng());
      }
    }
  }
}

const linePositions = new Float32Array(edges.length * 6);
const lineMat = new THREE.LineBasicMaterial({
  color: 0xc8d4e0,
  transparent: true,
  opacity: 0.18,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const lineMesh = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lineMesh);

function updateLineGeometry(){
  for (let i = 0; i < edges.length; i++){
    const [a, b] = edges[i];
    const pa = anchors[a];
    const pb = anchors[b];
    linePositions[i*6]   = pa.x;
    linePositions[i*6+1] = pa.y;
    linePositions[i*6+2] = pa.z;
    linePositions[i*6+3] = pb.x;
    linePositions[i*6+4] = pb.y;
    linePositions[i*6+5] = pb.z;
  }
  lineGeom.attributes.position.needsUpdate = true;
}
updateLineGeometry();

const nodeSphereGeom = new THREE.SphereGeometry(0.05, 6, 6);
const nodeInstances = new THREE.InstancedMesh(
  nodeSphereGeom,
  new THREE.MeshBasicMaterial({
    color: 0xe0edf5,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  }),
  N
);
scene.add(nodeInstances);

const mat = new THREE.Matrix4();
for (let i = 0; i < N; i++){
  mat.setPosition(anchors[i]);
  nodeInstances.setMatrixAt(i, mat);
}
nodeInstances.instanceMatrix.needsUpdate = true;

const restPositions = anchors.map(a => a.clone());
const SPRING_K = 0.008;
const DAMPING = 0.92;
const WIND_SCALE = 0.006;

// SURPRISE: Leaf system
const LEAF_COUNT = 80;
const leaves = [];
const leafVelocities = [];
const leafRotations = [];
const leafAngularVel = [];

const leafGeom = new THREE.PlaneGeometry(0.25, 0.4);
const leafMat = new THREE.MeshBasicMaterial({
  color: 0xd4a574,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.7,
  blending: THREE.NormalBlending,
  depthWrite: false,
});
const leafInstances = new THREE.InstancedMesh(leafGeom, leafMat, LEAF_COUNT);
scene.add(leafInstances);

for (let i = 0; i < LEAF_COUNT; i++){
  leaves.push(new THREE.Vector3(
    -15 + rng() * 5,
    8 + rng() * 6,
    -3 + rng() * 6
  ));
  leafVelocities.push(new THREE.Vector3(0, 0, 0));
  leafRotations.push(new THREE.Euler(
    rng() * Math.PI * 2,
    rng() * Math.PI * 2,
    rng() * Math.PI * 2
  ));
  leafAngularVel.push(new THREE.Vector3(
    (rng() - 0.5) * 0.08,
    (rng() - 0.5) * 0.1,
    (rng() - 0.5) * 0.06
  ));
}

let gustActive = false;
let gustStartTime = 0;
const GUST_DURATION = 3.5;
const GUST_TRIGGER = 8.0; // seconds after start

function updatePhysics(t){
  // Check for gust trigger
  if (!gustActive && t > GUST_TRIGGER && t < GUST_TRIGGER + 0.1){
    gustActive = true;
    gustStartTime = t;
  }
  
  const gustPhase = gustActive ? Math.min(1, (t - gustStartTime) / GUST_DURATION) : 0;
  const gustStrength = gustActive ? Math.sin(gustPhase * Math.PI) * 0.8 : 0;
  
  // Web physics
  for (let i = 0; i < N; i++){
    const rest = restPositions[i];
    const curr = anchors[i];
    const dx = rest.x - curr.x;
    const dy = rest.y - curr.y;
    const dz = rest.z - curr.z;
    velocities[i].x += dx * SPRING_K;
    velocities[i].y += dy * SPRING_K;
    velocities[i].z += dz * SPRING_K;
    
    const wx = Math.sin(t * 0.2 + curr.y * 0.3) * WIND_SCALE;
    const wy = Math.cos(t * 0.15 + curr.x * 0.25) * WIND_SCALE;
    const wz = Math.sin(t * 0.18 + curr.z * 0.35) * WIND_SCALE;
    velocities[i].x += wx + gustStrength * 0.15;
    velocities[i].y += wy - gustStrength * 0.05;
    velocities[i].z += wz;
    
    velocities[i].multiplyScalar(DAMPING);
    curr.add(velocities[i]);
  }
  
  for (let i = 0; i < N; i++){
    mat.setPosition(anchors[i]);
    nodeInstances.setMatrixAt(i, mat);
  }
  nodeInstances.instanceMatrix.needsUpdate = true;
  updateLineGeometry();
  
  // Leaf physics
  const gravity = new THREE.Vector3(0, -0.012, 0);
  const windForce = new THREE.Vector3(
    1.2 + Math.sin(t * 0.8) * 0.3,
    -0.1 + Math.cos(t * 0.6) * 0.2,
    Math.sin(t * 0.5) * 0.4
  );
  windForce.multiplyScalar(0.02 + gustStrength * 0.15);
  
  for (let i = 0; i < LEAF_COUNT; i++){
    leafVelocities[i].add(gravity);
    leafVelocities[i].add(windForce);
    
    // Tumble drag
    leafVelocities[i].multiplyScalar(0.985);
    
    leaves[i].add(leafVelocities[i]);
    
    // Tumble rotation
    leafRotations[i].x += leafAngularVel[i].x;
    leafRotations[i].y += leafAngularVel[i].y;
    leafRotations[i].z += leafAngularVel[i].z;
    
    // Respawn at top if too low
    if (leaves[i].y < -10){
      leaves[i].set(-15 + rng() * 5, 14, -3 + rng() * 6);
      leafVelocities[i].set(0, 0, 0);
    }
    
    mat.identity();
    mat.makeRotationFromEuler(leafRotations[i]);
    mat.setPosition(leaves[i]);
    leafInstances.setMatrixAt(i, mat);
  }
  leafInstances.instanceMatrix.needsUpdate = true;
  
  // Fade out gust effect after duration
  if (gustActive && gustPhase >= 1.0){
    // Keep leaves visible but no more gust amplification
    gustActive = false;
  }
}

const CAM_RADIUS = 18;
const CAM_SPEED = 0.04;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  updatePhysics(t);
  
  if (t > 3.0){
    const angle = t * CAM_SPEED;
    camera.position.x = CAM_RADIUS * Math.cos(angle) * 0.7;
    camera.position.z = CAM_RADIUS * Math.sin(angle);
    camera.position.y = 2 + Math.sin(t * 0.08) * 3;
    camera.lookAt(0, 0, 0);
  }
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
