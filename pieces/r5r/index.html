<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>r5r · disrupted ribbon · architectural scars</title>
<!-- MOTION: distortion, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">r5r</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Vera Molnár disrupted-grid principle applied to ajo's ribbon growth:
// 3 deliberate compositional scars in the smooth ribbon — (1) a vertical
// density void where the ribbon refuses to grow, (2) a local inflation zone
// where the ribbon doubles width, (3) a torn-edge segment where vertices
// scatter instead of forming a clean strip. The breaks are legible, not
// accidental — pulled threads in architectural embroidery.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.022);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 7, 13);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.0);
lightKey.position.set(5, 11, 3);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.4));
const lightFill = new THREE.DirectionalLight(0x405078, 0.35);
lightFill.position.set(-5, 3, -5);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// ─────────── differential growth with disruption zones
const MAX_VERTS = 1200;
const ATTRACT   = 0.065;
const REPEL_R   = 0.52;
const REPEL_STR = 0.15;
const NOISE     = 0.003;
const PRESSURE  = 0.0032;
const RISE      = 0.0048;
const MAX_D     = 0.40;

// DISRUPTION ZONES — hand-placed compositional voids/scars
// zone1: vertical cylinder where growth is suppressed (the void)
const VOID_CENTER = new THREE.Vector3(-1.2, 3.5, 0.8);
const VOID_RADIUS = 1.4;
// zone2: inflation zone where ribbon width doubles
const INFLATE_CENTER = new THREE.Vector3(1.5, 5.2, -1.0);
const INFLATE_RADIUS = 1.8;
// zone3: torn-edge scatter zone
const SCATTER_CENTER = new THREE.Vector3(0.2, 7.0, 1.2);
const SCATTER_RADIUS = 1.3;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  
  for (let i = 0; i < n; i++){
    const v = verts[i];
    // VOID suppression: if vertex inside void zone, push it away strongly
    const toVoid = new THREE.Vector3(v.x - VOID_CENTER.x, v.y - VOID_CENTER.y, v.z - VOID_CENTER.z);
    const dVoid = toVoid.length();
    if (dVoid < VOID_RADIUS){
      const pushFactor = 0.08 * (1 - dVoid / VOID_RADIUS);
      dx[i] += toVoid.x / (dVoid + 1e-6) * pushFactor;
      dy[i] += toVoid.y / (dVoid + 1e-6) * pushFactor;
      dz[i] += toVoid.z / (dVoid + 1e-6) * pushFactor;
    }
    
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    const dVoid = Math.hypot(a.x - VOID_CENTER.x, a.y - VOID_CENTER.y, a.z - VOID_CENTER.z);
    const suppressGrowth = dVoid < VOID_RADIUS * 1.2;
    if (!suppressGrowth && ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

for (let s = 0; s < 1000; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── disrupted ribbon renderer
let ribbonMesh = null, scatterMesh = null;
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0xc9a45a,
  emissive: 0x2a1a06,
  roughness: 0.32,
  metalness: 0.7,
  side: THREE.DoubleSide,
});
const scatterMat = new THREE.MeshStandardMaterial({
  color: 0xa88540,
  emissive: 0x1a1004,
  roughness: 0.5,
  metalness: 0.6,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 4; s++) step();

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N_SAMPLES = Math.min(1000, verts.length * 3);

    const positions = new Float32Array(N_SAMPLES * 2 * 3);
    const indices = [];
    const scatterPositions = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const tangent = curve.getTangentAt(tt).normalize();
      
      let lateral = new THREE.Vector3().crossVectors(tangent, up);
      if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
      lateral.normalize();
      
      // INFLATION ZONE: double width if inside
      const dInflate = p.distanceTo(INFLATE_CENTER);
      const inflationFactor = dInflate < INFLATE_RADIUS ? 2.2 : 1.0;
      
      // SCATTER ZONE: if inside, scatter individual quads instead of clean strip
      const dScatter = p.distanceTo(SCATTER_CENTER);
      const inScatter = dScatter < SCATTER_RADIUS;
      
      const width = (0.20 + 0.16 * Math.sin(tt * 32.0 + t * 0.4)) * inflationFactor;
      
      if (inScatter){
        // torn edge: scatter 3-5 small quads offset from the ribbon path
        const numFragments = 3 + Math.floor(Math.random() * 3);
        for (let f = 0; f < numFragments; f++){
          const offset = new THREE.Vector3(
            (Math.random() - 0.5) * 0.6,
            (Math.random() - 0.5) * 0.4,
            (Math.random() - 0.5) * 0.6
          );
          const pFrag = p.clone().add(offset);
          const wFrag = width * (0.3 + Math.random() * 0.4);
          const left  = pFrag.clone().addScaledVector(lateral, -wFrag);
          const right = pFrag.clone().addScaledVector(lateral,  wFrag);
          scatterPositions.push(left.x, left.y, left.z, right.x, right.y, right.z);
        }
        // leave gap in main ribbon
        positions[i*6]   = p.x; positions[i*6+1] = p.y; positions[i*6+2] = p.z;
        positions[i*6+3] = p.x; positions[i*6+4] = p.y; positions[i*6+5] = p.z;
      } else {
        const left  = p.clone().addScaledVector(lateral, -width);
        const right = p.clone().addScaledVector(lateral,  width);
        positions[i*6]   = left.x;  positions[i*6+1] = left.y;  positions[i*6+2] = left.z;
        positions[i*6+3] = right.x; positions[i*6+4] = right.y; positions[i*6+5] = right.z;
      }
    }
    
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      const a = i * 2, b = i * 2 + 1;
      const c = ni * 2, d = ni * 2 + 1;
      // skip face if either sample is degenerate (scatter zone gap)
      const p1 = new THREE.Vector3(positions[a*3], positions[a*3+1], positions[a*3+2]);
      const p2 = new THREE.Vector3(positions[b*3], positions[b*3+1], positions[b*3+2]);
      if (p1.distanceTo(p2) > 0.01){
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    scene.add(ribbonMesh);
    
    // scatter fragments
    if (scatterPositions.length > 0){
      const sg = new THREE.BufferGeometry();
      const spos = new Float32Array(scatterPositions);
      sg.setAttribute('position', new THREE.BufferAttribute(spos, 3));
      const sidx = [];
      for (let i = 0; i < spos.length / 6; i++){
        sidx.push(i*2, i*2+1, i*2);
      }
      sg.setIndex(sidx);
      sg.computeVertexNormals();
      if (scatterMesh){ scene.remove(scatterMesh); scatterMesh.geometry.dispose(); }
      scatterMesh = new THREE.Mesh(sg, scatterMat);
      scene.add(scatterMesh);
    }
  }

  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
