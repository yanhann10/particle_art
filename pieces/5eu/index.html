<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5eu · blind camera · sound→form hallucination</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#eae4d8; overflow:hidden;
               color:#4a4034; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#7a6d5c; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">5eu · blind camera</div>
<div class="hint">mic active · sound → remembered geometry · refresh to restart</div>
<div class="src">inspired by Diego Trujillo Pisanty (Lumen Prize 2024) · audio-driven hallucination</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── scene
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xeae4d8, 18, 55);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 8, 24);
camera.lookAt(0, 5, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xeae4d8, 1);
document.body.appendChild(renderer.domElement);

// ────────────── audio capture
let audioCtx, analyser, freqData, timeDomainData;
let audioReady = false;
const FFT_SIZE = 256;
const FREQ_BINS = FFT_SIZE / 2;

navigator.mediaDevices.getUserMedia({ audio: true, video: false })
  .then(stream => {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT_SIZE;
    analyser.smoothingTimeConstant = 0.75;
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    freqData = new Uint8Array(FREQ_BINS);
    timeDomainData = new Uint8Array(FFT_SIZE);
    audioReady = true;
  })
  .catch(() => {
    // fallback: synthetic ambient noise if mic denied
    freqData = new Uint8Array(FREQ_BINS);
    timeDomainData = new Uint8Array(FFT_SIZE);
    for (let i = 0; i < FREQ_BINS; i++) freqData[i] = 10 + Math.random() * 30;
    audioReady = true;
  });

// ────────────── particle field: 65k particles form "remembered" urban geometry
// BASE SILHOUETTE: street grid + building outlines + vendor stalls + distant horizon
// particles have a REST position (architectural memory) and are PULLED by spectral bins
const N = 65000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const binAssignments = new Uint8Array(N);    // which freq bin controls this particle
const seeds = new Float32Array(N);

// remembered city geometry: 3 horizontal street planes + 8 vertical building facades + scattered market stalls
// streets: y=0..0.2 (ground), y=3..3.2 (awnings), y=6..6.2 (second-floor facades)
// buildings: vertical rectangles at z=-4..-2 (near), z=8..12 (far)
// stalls: clustered low boxes at y=0.5, x=-6..6, z=2..5

function sampleCityMemory() {
  let idx = 0;
  const rng = Math.random;
  const addPoint = (x, y, z, bin) => {
    restPositions[idx*3] = x; restPositions[idx*3+1] = y; restPositions[idx*3+2] = z;
    positions[idx*3] = x + (rng()-0.5)*0.3;
    positions[idx*3+1] = y + (rng()-0.5)*0.3;
    positions[idx*3+2] = z + (rng()-0.5)*0.3;
    velocities[idx*3] = 0; velocities[idx*3+1] = 0; velocities[idx*3+2] = 0;
    binAssignments[idx] = bin;
    seeds[idx] = rng();
    idx++;
  };

  // ground plane: x=-15..15, z=-2..15, y=0..0.2
  const GROUND = Math.floor(N * 0.25);
  for (let i = 0; i < GROUND; i++) {
    const x = -15 + rng() * 30;
    const z = -2 + rng() * 17;
    const y = rng() * 0.2;
    const bin = Math.floor((z + 2) / 17 * 20) % FREQ_BINS;   // z-depth maps to freq
    addPoint(x, y, z, bin);
  }

  // building facades: 6 vertical slabs
  const FACADES = Math.floor(N * 0.30);
  const buildings = [
    { x: -10, zMin: 8, zMax: 12, hMin: 0, hMax: 12, bin: 10 },
    { x: -6,  zMin: 6, zMax: 10, hMin: 0, hMax: 14, bin: 15 },
    { x: -2,  zMin: 4, zMax: 8,  hMin: 0, hMax: 16, bin: 20 },
    { x: 3,   zMin: 5, zMax: 9,  hMin: 0, hMax: 13, bin: 25 },
    { x: 7,   zMin: 7, zMax: 11, hMin: 0, hMax: 15, bin: 30 },
    { x: 11,  zMin: 9, zMax: 13, hMin: 0, hMax: 11, bin: 35 },
  ];
  for (let i = 0; i < FACADES; i++) {
    const b = buildings[Math.floor(rng() * buildings.length)];
    const x = b.x + (rng()-0.5) * 0.6;
    const y = b.hMin + rng() * (b.hMax - b.hMin);
    const z = b.zMin + rng() * (b.zMax - b.zMin);
    addPoint(x, y, z, b.bin % FREQ_BINS);
  }

  // awning/second-floor plane: y=3..3.2, scattered along street
  const AWNINGS = Math.floor(N * 0.12);
  for (let i = 0; i < AWNINGS; i++) {
    const x = -12 + rng() * 24;
    const y = 3 + rng() * 0.2;
    const z = 0 + rng() * 10;
    const bin = Math.floor(z / 10 * 15) % FREQ_BINS;
    addPoint(x, y, z, bin);
  }

  // market stalls: low clustered boxes y=0.5..1.5
  const STALLS = Math.floor(N * 0.15);
  const stallCenters = [
    { x: -5, z: 3 }, { x: -2, z: 4 }, { x: 1, z: 3.5 }, { x: 4, z: 4.2 }, { x: 7, z: 3.8 }
  ];
  for (let i = 0; i < STALLS; i++) {
    const sc = stallCenters[Math.floor(rng() * stallCenters.length)];
    const x = sc.x + (rng()-0.5) * 2;
    const y = 0.5 + rng() * 1.0;
    const z = sc.z + (rng()-0.5) * 1.5;
    const bin = Math.floor(sc.z / 10 * 18) % FREQ_BINS;
    addPoint(x, y, z, bin);
  }

  // distant horizon scatter: y=6..10, z=14..18 (far silhouette)
  const HORIZON = Math.floor(N * 0.10);
  for (let i = 0; i < HORIZON; i++) {
    const x = -18 + rng() * 36;
    const y = 6 + rng() * 4;
    const z = 14 + rng() * 4;
    const bin = Math.floor((y - 6) / 4 * 12) % FREQ_BINS;
    addPoint(x, y, z, bin);
  }

  // ambient dust/air particles: scattered throughout volume
  while (idx < N) {
    const x = -20 + rng() * 40;
    const y = rng() * 16;
    const z = -3 + rng() * 21;
    const bin = Math.floor(rng() * FREQ_BINS);
    addPoint(x, y, z, bin);
  }
}
sampleCityMemory();

// ────────────── shader: spectral magnitude drives color + opacity, position jitter
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uSpectrum: { value: new Float32Array(FREQ_BINS) },   // normalized [0..1]
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('restPos', new THREE.BufferAttribute(restPositions, 3));
geom.setAttribute('binIdx', new THREE.BufferAttribute(binAssignments, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uSpectrum[${FREQ_BINS}];
    attribute vec3 restPos;
    attribute float binIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      int bin = int(binIdx);
      float magnitude = uSpectrum[bin];
      
      // particle position: rest + magnitude-driven offset toward camera (hallucination pull)
      vec3 offset = vec3(0.0, 0.0, magnitude * 2.0);
      vec3 p = position + offset;
      
      // depth-based displacement: near particles jitter more (granular hallucination)
      float depthFac = clamp((18.0 - restPos.z) / 20.0, 0.0, 1.0);
      float jitter = magnitude * depthFac * 0.8;
      p.x += sin(uTime * 1.2 + seed * 6.28) * jitter;
      p.y += cos(uTime * 0.9 + seed * 3.14) * jitter * 0.6;
      
      // color: sun-bleached concrete (low freq) → smog ochre (mid) → dust white (high)
      vec3 concrete = vec3(0.82, 0.78, 0.70);
      vec3 ochre = vec3(0.72, 0.58, 0.38);
      vec3 dust = vec3(0.95, 0.92, 0.85);
      float freqNorm = float(bin) / float(${FREQ_BINS});
      vec3 c1 = mix(concrete, ochre, smoothstep(0.2, 0.5, freqNorm));
      vCol = mix(c1, dust, smoothstep(0.6, 0.9, freqNorm));
      
      // opacity: magnitude + depth + seed variance (memory fragments)
      vAlpha = (0.15 + magnitude * 0.6) * (0.4 + depthFac * 0.6) * (0.7 + seed * 0.3);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + magnitude * 1.5) * uPixel * (80.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── physics: spectral bins pull particles from rest → emergent forms
// high-magnitude bins act as local attractors; particles drift back to rest when silent
function updateParticles(dt) {
  const PULL = 2.5;
  const DRAG = 0.92;
  const RESTORE = 0.08;
  
  for (let i = 0; i < N; i++) {
    const bin = binAssignments[i];
    const mag = uniforms.uSpectrum.value[bin];
    
    // attractor force: pull toward rest + magnitude-driven offset
    const rx = restPositions[i*3];
    const ry = restPositions[i*3+1];
    const rz = restPositions[i*3+2];
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    // target: rest + z-forward displacement scaled by magnitude
    const tz = rz - mag * 1.2;
    const dx = rx - px;
    const dy = ry - py;
    const dz = tz - pz;
    
    // velocity update
    velocities[i*3]   += dx * (RESTORE + mag * PULL) * dt;
    velocities[i*3+1] += dy * (RESTORE + mag * PULL * 0.5) * dt;
    velocities[i*3+2] += dz * (RESTORE + mag * PULL) * dt;
    
    velocities[i*3]   *= DRAG;
    velocities[i*3+1] *= DRAG;
    velocities[i*3+2] *= DRAG;
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
  }
  geom.attributes.position.needsUpdate = true;
}

// ────────────── camera drift: slow horizontal arc + subtle vertical bob
let camAngle = 0;
function updateCamera(t) {
  camAngle += 0.008;
  camera.position.x = Math.sin(camAngle) * 26;
  camera.position.z = Math.cos(camAngle) * 26;
  camera.position.y = 8 + Math.sin(t * 0.3) * 1.2;
  camera.lookAt(0, 5, 0);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  
  // read audio spectrum
  if (audioReady && analyser) {
    analyser.getByteFrequencyData(freqData);
    for (let i = 0; i < FREQ_BINS; i++) {
      uniforms.uSpectrum.value[i] = freqData[i] / 255.0;
    }
  } else {
    // fallback: gentle synthetic ambient
    for (let i = 0; i < FREQ_BINS; i++) {
      uniforms.uSpectrum.value[i] = 0.05 + 0.15 * Math.sin(t * 0.4 + i * 0.2);
    }
  }
  
  updateParticles(dt);
  updateCamera(t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
