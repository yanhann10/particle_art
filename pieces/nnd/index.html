<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nnd · cyanotype star field</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d2c54; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">nnd</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 2, 38);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d2c54, 1);
document.body.appendChild(renderer.domElement);

/* ── galactic particle field ── */
const N = 18000;
const pos = new Float32Array(N * 3);
const seed = new Float32Array(N);
const brightness = new Float32Array(N);

for (let i = 0; i < N; i++) {
  // galactic-coordinate distribution: concentrated along a tilted band
  const u = Math.random();
  const galacticLat = (Math.pow(Math.random(), 2.2) * (Math.random() < 0.5 ? 1 : -1)) * 6.0;
  const galacticLon = Math.random() * Math.PI * 2;
  const r = 8 + Math.random() * 22;
  const latRad = (galacticLat / 180) * Math.PI;
  // tilt the galactic plane 23 degrees
  let x = r * Math.cos(latRad) * Math.cos(galacticLon);
  let y = r * Math.sin(latRad);
  let z = r * Math.cos(latRad) * Math.sin(galacticLon);
  // tilt
  const tilt = 0.4;
  const ny = y * Math.cos(tilt) - z * Math.sin(tilt);
  const nz = y * Math.sin(tilt) + z * Math.cos(tilt);
  // scatter some halo stars (15%)
  if (Math.random() < 0.15) {
    const hr = 5 + Math.random() * 28;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = hr * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = hr * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = hr * Math.cos(phi);
    brightness[i] = 0.3 + Math.random() * 0.3;
  } else {
    pos[i*3]   = x;
    pos[i*3+1] = ny;
    pos[i*3+2] = nz;
    brightness[i] = 0.5 + Math.random() * 0.5;
  }
  seed[i] = Math.random();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
geom.setAttribute('aBright', new THREE.BufferAttribute(brightness, 1));

/* ── orbital diagram lines (constellation arcs) ── */
const orbGroup = new THREE.Group();
scene.add(orbGroup);
const orbitCount = 7;
for (let k = 0; k < orbitCount; k++) {
  const pts = [];
  const a = 6 + k * 3.2 + Math.sin(k * 2.3) * 2;
  const b = 4 + k * 2.1 + Math.cos(k * 1.7) * 1.5;
  const segs = 120;
  const arcStart = Math.random() * Math.PI * 0.5;
  const arcLen = Math.PI * (0.6 + Math.random() * 1.2);
  for (let j = 0; j <= segs; j++) {
    const angle = arcStart + (j / segs) * arcLen;
    pts.push(new THREE.Vector3(
      a * Math.cos(angle),
      b * Math.sin(angle) * 0.7 + (k - 3) * 1.5,
      (k - 3) * 2.5
    ));
  }
  const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xc8dce8,
    transparent: true,
    opacity: 0.08 + Math.random() * 0.06,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(lineGeom, lineMat);
  line.rotation.z = (k * 0.3) - 0.5;
  line.rotation.y = k * 0.15;
  orbGroup.add(line);
}

/* ── drip lines (vertical painterly streaks) ── */
const dripGroup = new THREE.Group();
scene.add(dripGroup);
for (let d = 0; d < 12; d++) {
  const x = (Math.random() - 0.5) * 50;
  const z = (Math.random() - 0.5) * 20 - 5;
  const yTop = 10 + Math.random() * 15;
  const yBot = yTop - (4 + Math.random() * 14);
  const dPts = [new THREE.Vector3(x, yTop, z), new THREE.Vector3(x + Math.random()*0.5, yBot, z)];
  const dGeom = new THREE.BufferGeometry().setFromPoints(dPts);
  const dMat = new THREE.LineBasicMaterial({
    color: 0x9ec5db,
    transparent: true,
    opacity: 0.04 + Math.random() * 0.04,
    blending: THREE.AdditiveBlending
  });
  dripGroup.add(new THREE.Line(dGeom, dMat));
}

/* ── main star shader ── */
const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float aSeed;
    attribute float aBright;
    varying float vBright;
    varying float vSeed;

    // simplex-ish 3D noise for brushstroke SDF
    vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec4 perm(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      vec3 i = floor(v + dot(v, vec3(C.y)));
      vec3 x0 = v - i + dot(i, vec3(C.x));
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g, l.zxy);
      vec3 i2 = max(g, l.zxy);
      vec3 x1 = x0 - i1 + C.x;
      vec3 x2 = x0 - i2 + C.y;
      vec3 x3 = x0 - 0.5;
      i = mod289(i);
      vec4 p = perm(perm(perm(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      vec4 j = p - 49.0*floor(p/49.0);
      vec4 x_ = floor(j/7.0);
      vec4 y_ = floor(j - 7.0*x_);
      vec4 xx = (x_*2.0 + 0.5)/7.0 - 1.0;
      vec4 yy = (y_*2.0 + 0.5)/7.0 - 1.0;
      vec4 h = 1.0 - abs(xx) - abs(yy);
      vec4 b0 = vec4(xx.xy, yy.xy);
      vec4 b1 = vec4(xx.zw, yy.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 g0 = vec3(a0.xy, h.x);
      vec3 g1 = vec3(a0.zw, h.y);
      vec3 g2 = vec3(a1.xy, h.z);
      vec3 g3 = vec3(a1.zw, h.w);
      vec4 norm = 1.79284291400159 - 0.85373472095314 *
        vec4(dot(g0,g0),dot(g1,g1),dot(g2,g2),dot(g3,g3));
      g0 *= norm.x; g1 *= norm.y; g2 *= norm.z; g3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);
      m = m*m;
      return 42.0 * dot(m*m, vec4(dot(g0,x0),dot(g1,x1),dot(g2,x2),dot(g3,x3)));
    }

    void main(){
      vec3 p = position;

      // gentle drift — stars breathe slowly
      float drift = uTime * 0.015;
      p.x += sin(aSeed * 19.3 + drift * 2.1) * 0.15;
      p.y += cos(aSeed * 13.7 + drift * 1.7) * 0.12;
      p.z += sin(aSeed * 7.9 + drift * 0.9) * 0.1;

      // brushstroke SDF: noise field that modulates brightness
      // slow-moving brushstroke regions
      float brush = snoise(p * 0.08 + vec3(uTime * 0.02, uTime * 0.015, 0.0));
      float brushMask = smoothstep(-0.1, 0.4, brush); // 0 outside, 1 inside brush

      // second octave for texture
      float brush2 = snoise(p * 0.15 + vec3(0.0, uTime * 0.01, uTime * 0.008));
      brushMask = brushMask * 0.7 + smoothstep(0.0, 0.5, brush2) * 0.3;

      vBright = aBright * (0.4 + brushMask * 0.8);
      vSeed = aSeed;

      // some stars twinkle
      float twinkle = sin(uTime * (2.0 + aSeed * 6.0) + aSeed * 100.0);
      vBright *= (0.7 + 0.3 * twinkle * twinkle);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // vary star size: most small, a few bright ones larger
      float sizeBase = mix(1.2, 3.5, pow(aBright, 3.0));
      sizeBase *= (0.8 + brushMask * 0.6);
      gl_PointSize = sizeBase * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vBright;
    varying float vSeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      // Gaussian falloff — soft photographic glow
      float glow = exp(-r2 * 18.0);

      // cyanotype palette: paper-white core, slight warm edge
      vec3 paperWhite = vec3(0.92, 0.93, 0.96);
      vec3 warmEdge = vec3(0.85, 0.88, 0.92);
      vec3 col = mix(warmEdge, paperWhite, glow);

      float a = glow * vBright * 0.85;
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const stars = new THREE.Points(geom, mat);
scene.add(stars);

/* ── full-screen cyanotype grain overlay ── */
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    void main(){
      vec2 uv = gl_FragCoord.xy;
      // film grain
      float n = fract(sin(dot(uv, vec2(12.9898, 78.233)) + uTime * 0.3) * 43758.5453);
      float grain = (n - 0.5) * 0.06;
      // slight vignette darkening
      vec2 vc = (gl_FragCoord.xy / vec2(${innerWidth.toFixed(1)}, ${innerHeight.toFixed(1)})) - 0.5;
      float vig = 1.0 - dot(vc, vc) * 0.5;
      // Prussian blue tint shift at edges
      vec3 tint = vec3(0.04, 0.08, 0.14) * (1.0 - vig);
      gl_FragColor = vec4(tint + grain, 0.12);
    }
  `
});
const grainQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  grainMat
);
grainQuad.frustumCulled = false;
const grainScene = new THREE.Scene();
const grainCam = new THREE.Camera();
grainScene.add(grainQuad);

/* ── comet streaks (a few bright trails) ── */
const cometGroup = new THREE.Group();
scene.add(cometGroup);
const cometCount = 4;
const comets = [];
for (let c = 0; c < cometCount; c++) {
  const trail = [];
  const tailLen = 40;
  const cx = (Math.random() - 0.5) * 40;
  const cy = (Math.random() - 0.5) * 20;
  const cz = -5 + Math.random() * 10;
  const vx = (Math.random() - 0.5) * 0.03;
  const vy = -0.01 - Math.random() * 0.02;
  for (let j = 0; j < tailLen; j++) {
    trail.push(new THREE.Vector3(cx - vx*j*8, cy - vy*j*8, cz));
  }
  const tGeom = new THREE.BufferGeometry().setFromPoints(trail);
  const alphas = new Float32Array(tailLen);
  for (let j = 0; j < tailLen; j++) alphas[j] = Math.pow(1.0 - j/tailLen, 2.5);
  tGeom.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
  const tMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float alpha;
      varying float vA;
      void main(){
        vA = alpha;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying float vA;
      void main(){
        vec3 c = vec3(0.9, 0.92, 0.96);
        gl_FragColor = vec4(c * vA * 0.6, vA * 0.6);
      }
    `
  });
  const cLine = new THREE.Line(tGeom, tMat);
  cometGroup.add(cLine);
  comets.push({ line: cLine, geom: tGeom, vx, vy, phase: Math.random() * 100 });
}

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation ── */
const t0 = performance.now();
function loop() {
  const t = (performance.now() - t0) / 1000;
  mat.uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;

  // slow camera drift — gentle orbital motion
  const camR = 38;
  camera.position.x = Math.sin(t * 0.018) * camR * 0.15;
  camera.position.y = 2 + Math.sin(t * 0.012 + 1.0) * 3;
  camera.position.z = camR * Math.cos(t * 0.018 * 0.5);
  camera.lookAt(0, 0, 0);

  // animate comet trails
  for (const c of comets) {
    const posArr = c.geom.attributes.position.array;
    const speed = 0.4;
    const ct = t * speed + c.phase;
    const headX = Math.sin(ct * 0.3) * 20 + c.vx * ct * 40;
    const headY = Math.cos(ct * 0.2) * 12 + c.vy * ct * 20;
    for (let j = posArr.length / 3 - 1; j > 0; j--) {
      posArr[j*3]   = posArr[(j-1)*3]   * 0.97 + posArr[j*3]   * 0.03;
      posArr[j*3+1] = posArr[(j-1)*3+1] * 0.97 + posArr[j*3+1] * 0.03;
    }
    posArr[0] = headX % 30;
    posArr[1] = headY % 18;
    c.geom.attributes.position.needsUpdate = true;
  }

  // orbital lines drift
  orbGroup.rotation.z = Math.sin(t * 0.008) * 0.05;

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
