<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uag · hyperstition engine</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#0f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,monospace; z-index:10; }
  .caption { position:fixed; left:0; right:0; top:50%; transform:translateY(-50%);
             text-align:center; font-size:clamp(14px,3vw,28px); letter-spacing:0.15em;
             color:#0ff; opacity:0; pointer-events:none; z-index:5;
             text-transform:uppercase; font-weight:700; mix-blend-mode:screen;
             text-shadow: 0 0 8px #0ff, 0 0 20px #f0f; }
  .caption.flash { opacity:1; transition: opacity 0s; }
  .caption.fade { opacity:0; transition: opacity 0.12s; }
</style>
</head>
<body>
<div class="id">uag</div>
<div class="caption" id="caption"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320, N = W * H;
const BPM = 160;
const BEAT_MS = 60000 / BPM;

const PHRASES = [
  'THE OUTSIDE WILL HAVE BEEN',
  'NOTHING HUMAN MAKES IT OUT',
  'HYPERSTITION IS A TIME WEAPON',
  'THE FUTURE IS ALREADY LEAKING',
  'CAPITALISM IS AN AI',
  'FLATLINES DECODE THEMSELVES',
  'CYBERPOSITIVE RUNAWAY',
  'ZERO IS COMING FROM THE FUTURE',
  'MELTDOWN HAS A FACE'
];

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.5;
  init[i*4+1] = (Math.random()*2-1) * 0.5;
  init[i*4+2] = (Math.random()*2-1) * 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.014 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 },
  uKick: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uKick;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      // aizawa + perturbation on kick
      float kick = uKick * 0.15;
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y + kick * sin(p.z * 6.0),
        uD * p.x + (p.z - uB) * p.y + kick * cos(p.x * 6.0),
        uC + uA * p.z - (p.z*p.z*p.z)/3.0
          - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
          + uF*p.z*p.x*p.x*p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.09, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 3.5);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uBeat: { value: 0.0 },
    uTime: { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uBeat, uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vIntensity;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      float speed = length(p);
      // square-wave brightness: hard on/off per beat
      float beatPulse = step(0.5, fract(uTime * ${(BPM/60).toFixed(4)}));
      vIntensity = mix(0.6, 1.0, beatPulse) * (0.5 + speed * 0.3);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // hard-edged: larger point, no distance falloff smoothing
      gl_PointSize = (1.8 + uBeat * 2.0) * uPixel * (7.0 / max(dist, 0.5));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vIntensity;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      // hard edge — step not smooth
      if (r2 > 0.20) discard;
      // dark rave palette: acid green, cyan, magenta
      vec3 acid   = vec3(0.2, 1.0, 0.1);
      vec3 cyan   = vec3(0.0, 1.0, 0.9);
      vec3 mag    = vec3(1.0, 0.0, 0.7);
      float k = fract(vAge * 3.0);
      vec3 col = k < 0.33 ? acid : k < 0.66 ? cyan : mag;
      // square wave: no gradient, full brightness or half
      float alpha = vIntensity * step(0.15, r2 < 0.05 ? 1.0 : 0.7);
      gl_FragColor = vec4(col * vIntensity, alpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio analysis — mic if granted
let analyser = null, freqData = null, bassEnergy = 0;
async function initAudio(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(e){}
}
initAudio();

// caption engine
const captionEl = document.getElementById('caption');
let phraseIdx = 0;
function flashCaption(){
  captionEl.textContent = PHRASES[phraseIdx % PHRASES.length];
  captionEl.className = 'caption flash';
  phraseIdx++;
  setTimeout(() => { captionEl.className = 'caption fade'; }, 90);
}

// pointer → parameter chaos
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  target.a = 0.95 + ((e.clientX / innerWidth) - 0.5) * 0.12;
  target.c = 0.60 + ((e.clientY / innerHeight) - 0.5) * 0.15;
});

let t0 = performance.now();
let lastBeat = 0, beatCount = 0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  // beat clock at 160 BPM
  const beatNow = Math.floor((now - t0) / BEAT_MS);
  let onBeat = beatNow > lastBeat;
  if (onBeat) {
    lastBeat = beatNow;
    beatCount++;
    if (beatCount % 8 === 0) flashCaption();
  }

  // audio bass detection
  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    bassEnergy = 0;
    for (let i = 0; i < 8; i++) bassEnergy += freqData[i];
    bassEnergy = bassEnergy / (8 * 255);
  }

  const kick = onBeat ? 1.0 : (bassEnergy > 0.6 ? bassEnergy : 0.0);

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.08;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.08;
  simUniforms.uKick.value = kick;
  // faster dt — deliberately uncomfortable speed
  simUniforms.uDt.value = 0.016 + kick * 0.004;

  // more integration steps — machine speed
  for (let i = 0; i < 6; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uBeat.value = kick;
  pointsMat.uniforms.uTime.value = elapsed;

  // aggressive camera — fast orbit, jerky on beats
  const ang = elapsed * 0.9;
  const jerk = onBeat ? (Math.random() - 0.5) * 0.4 : 0;
  camera.position.x = Math.sin(ang) * 3.2 + jerk;
  camera.position.z = Math.cos(ang) * 3.2;
  camera.position.y = Math.sin(ang * 1.3) * 1.2 + jerk * 0.5;
  camera.lookAt(0, 0, 0.8);

  // background flash on kick
  const bg = kick > 0.5 ? 0x0a0a0a : 0x000000;
  renderer.setClearColor(bg, 1);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
