<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rvg · fossil vascular growth · mosquito in amber</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">rvg</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from t9w · vascular network wraps fossil mosquito</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

// Differential-growth vascular network seeded by mosquito-in-amber fossil surface.
// The 3D growth curve is initialized from 60k surface samples of the preserved insect,
// then grows outward in branching vessel tubes, pulsing with diastolic rhythm.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.035);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 10, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey  = new THREE.DirectionalLight(0xfff0e8, 0.8);
lightKey.position.set(6, 12, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.5));
const lightRim  = new THREE.DirectionalLight(0x88aacc, 0.35);
lightRim.position.set(-6, 4, -6);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// ─────────── differential growth (3D)
const MAX_VERTS = 2400;
const ATTRACT   = 0.05;
const REPEL_R   = 0.45;
const REPEL_STR = 0.11;
const NOISE     = 0.0025;
const PRESSURE  = 0.0024;
const RISE      = 0.0038;
const MAX_D     = 0.38;

const verts = [];
let fossilMesh = null;
let modelLoaded = false;

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused || verts.length === 0) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.5;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.25 + 1.0 * Math.min(a * 1.3, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.04, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

addEventListener('click', () => { paused = !paused; });

// ─────────── Load mosquito-in-amber model
const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/MosquitoInAmber/glTF-Binary/MosquitoInAmber.glb',
  (gltf) => {
    let mesh = null;
    gltf.scene.traverse((child) => {
      if (!mesh && child.isMesh && child.geometry && child.geometry.attributes.position){
        mesh = child;
      }
    });
    if (!mesh){
      console.warn('No mesh found in glTF, falling back to simple seed');
      initFallbackVerts();
      return;
    }

    // Normalize bounding box to fit camera framing
    const box = new THREE.Box3().setFromObject(mesh);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 4.0 / maxDim;
    
    mesh.geometry.translate(-center.x, -center.y, -center.z);
    mesh.geometry.scale(scale, scale, scale);
    mesh.geometry.computeVertexNormals();

    // Add the fossil mesh to the scene (semi-transparent amber)
    const fossilMat = new THREE.MeshStandardMaterial({
      color: 0xd4a574,
      emissive: 0x3a1f0a,
      transparent: true,
      opacity: 0.35,
      roughness: 0.3,
      metalness: 0.1,
    });
    fossilMesh = new THREE.Mesh(mesh.geometry, fossilMat);
    scene.add(fossilMesh);

    // Sample surface points
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tempPos = new THREE.Vector3();
    const samples = [];
    const SAMPLE_COUNT = 60000;
    for (let i = 0; i < SAMPLE_COUNT; i++){
      sampler.sample(tempPos);
      samples.push({ x: tempPos.x, y: tempPos.y, z: tempPos.z });
    }

    // Initialize differential growth from surface samples (subsample to seed ring)
    const SEED_COUNT = 80;
    const step = Math.floor(samples.length / SEED_COUNT);
    for (let i = 0; i < SEED_COUNT; i++){
      const s = samples[i * step];
      verts.push({ x: s.x, y: s.y, z: s.z, age: 0 });
    }

    // Pre-grow the network a bit
    for (let s = 0; s < 400; s++) step();
    modelLoaded = true;
  },
  undefined,
  (error) => {
    console.error('Failed to load model:', error);
    initFallbackVerts();
  }
);

function initFallbackVerts(){
  for (let i = 0; i < 24; i++){
    const th = i / 24 * Math.PI * 2;
    const r = 1.6 + (Math.random() - 0.5) * 0.2;
    verts.push({ x: Math.cos(th)*r, y: (Math.random()-0.5)*0.8, z: Math.sin(th)*r, age: 0 });
  }
  for (let s = 0; s < 400; s++) step();
  modelLoaded = true;
}

// ─────────── vascular tube renderer
let tubeMesh = null;
const tubeMat = new THREE.MeshStandardMaterial({
  color:    0xa83c30,
  emissive: 0x280606,
  roughness: 0.55,
  metalness: 0.08,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  if (modelLoaded){
    for (let s = 0; s < 2; s++) step();
  }

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){ if (v.y < yMin) yMin = v.y; if (v.y > yMax) yMax = v.y; }
    const yRange = Math.max(yMax - yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const RADIAL = 8;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    const pulse = 1.0 + 0.09 * Math.sin(t * 1.55);

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
      let r = 0.35 * (1 - heightFrac * 0.75);
      const node = Math.sin(tt * 20.0) * 0.5 + 0.5;
      r *= (1.0 + 0.16 * Math.pow(node, 5));
      r *= pulse;

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i * RADIAL + j) * 3]     = v.x;
        positions[(i * RADIAL + j) * 3 + 1] = v.y;
        positions[(i * RADIAL + j) * 3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  if (verts.length > 0){
    let yMean = 0; 
    for (const v of verts) yMean += v.y; 
    yMean /= verts.length;
    const targetY = yMean * 0.5;
    controls.target.y += (targetY - controls.target.y) * 0.03;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
