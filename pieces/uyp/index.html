<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uyp · memory threads</title>
<!-- MOTION: sway, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #150a25; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#22113a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · threads respond to voice</button>
<div class="id">uyp</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 12, 60);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

// Shiota-style convergent threads: many threads converge to a few anchors
const ANCHOR_COUNT = 5;
const THREAD_COUNT = 15000;

// place anchors in architectural constellation
const anchors = [
  new THREE.Vector3(0, 8, 0),      // high center
  new THREE.Vector3(-18, -6, -8),  // lower left back
  new THREE.Vector3(18, -6, -8),   // lower right back
  new THREE.Vector3(-12, 2, 10),   // mid left front
  new THREE.Vector3(12, 2, 10)     // mid right front
];

// each thread: one endpoint scattered in space, other endpoint is nearest anchor
const threadEnds = [];
const energyBands = [];
for (let i = 0; i < THREAD_COUNT; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 16 + Math.random() * 28;
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta) - 8; // bias downward
  const z = r * Math.cos(phi);
  const free = new THREE.Vector3(x, y, z);
  
  // find nearest anchor
  let minDist = Infinity;
  let closest = anchors[0];
  for (let a of anchors){
    const d = free.distanceTo(a);
    if (d < minDist){ minDist = d; closest = a; }
  }
  
  threadEnds.push({ free, anchor: closest.clone() });
  energyBands.push(Math.floor(Math.random() * 5));
}

// build line segments
const positions = new Float32Array(THREAD_COUNT * 6);
const bandAttr = new Float32Array(THREAD_COUNT * 2);
for (let i = 0; i < THREAD_COUNT; i++){
  positions[i*6]   = threadEnds[i].free.x;
  positions[i*6+1] = threadEnds[i].free.y;
  positions[i*6+2] = threadEnds[i].free.z;
  positions[i*6+3] = threadEnds[i].anchor.x;
  positions[i*6+4] = threadEnds[i].anchor.y;
  positions[i*6+5] = threadEnds[i].anchor.z;
  bandAttr[i*2] = energyBands[i];
  bandAttr[i*2+1] = energyBands[i];
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('band', new THREE.BufferAttribute(bandAttr, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uBands: { value: uBands },
  uTreble: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform vec4 uBands;
    uniform float uTreble;
    attribute float band;
    varying float vAlpha;
    void main(){
      float e;
      if (band < 0.5)      e = uBands.x;
      else if (band < 1.5) e = uBands.y;
      else if (band < 2.5) e = uBands.z;
      else if (band < 3.5) e = uBands.w;
      else                 e = uTreble;
      
      vec3 p = position;
      // subtle sway driven by band energy
      float swayPhase = uTime * 0.3 + p.x * 0.02 + p.z * 0.015;
      p.x += sin(swayPhase) * (0.4 + e * 1.2);
      p.y += cos(swayPhase * 1.3) * (0.3 + e * 0.8);
      
      vAlpha = 0.07 + e * 0.08;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      // Shiota crimson signature
      vec3 col = vec3(0.61, 0.12, 0.12);
      gl_FragColor = vec4(col * vAlpha, vAlpha);
    }
  `
});

const lines = new THREE.LineSegments(geom, mat);
scene.add(lines);

// add anchor spheres as subtle markers
for (let a of anchors){
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0x9c1f1f, transparent: true, opacity: 0.5 })
  );
  sphere.position.copy(a);
  scene.add(sphere);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'listening · memory threads';
  } catch (e) {
    hint.textContent = 'passive mode · threads breathe';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    uBands.x = 0.25 + 0.15 * Math.sin(t*0.8);
    uBands.y = 0.22 + 0.12 * Math.sin(t*1.1 + 1.2);
    uBands.z = 0.18 + 0.10 * Math.sin(t*1.5 + 2.4);
    uBands.w = 0.15 + 0.08 * Math.sin(t*2.2 + 0.7);
    uniforms.uTreble.value = 0.12 + 0.06 * Math.sin(t*3.5);
  }

  // gentle camera orbit
  camera.position.x = Math.sin(t * 0.03) * 50;
  camera.position.z = Math.cos(t * 0.03) * 50 + 10;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
