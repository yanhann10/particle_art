<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2tw · calligraphic ink · grayscale + vermillion accent</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">2tw</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from 2iy · grayscale + vermillion accent</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Grayscale base (#d4d4d8 for the main ink body) with sparse vermillion #c14a3d
// accent marks where curvature peaks — restraint: only 8–12 accent segments
// in the entire stroke, placed where the brush truly PRESSED.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (3D, inherited from 2iy)
const MAX_VERTS = 1800;
const ATTRACT   = 0.06;
const REPEL_R   = 0.46;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0042;
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 700; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── grayscale + vermillion accent renderer
const grayMat = new THREE.MeshBasicMaterial({
  color: 0xd4d4d8,
  transparent: true,
  opacity: 0.90,
});
const accentMat = new THREE.MeshBasicMaterial({
  color: 0xc14a3d,
  transparent: true,
  opacity: 0.88,
});

const meshes = [];

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  for (let s = 0; s < 2; s++) step();

  if (verts.length > 8){
    // clear old meshes
    for (const m of meshes){ scene.remove(m); m.geometry.dispose(); }
    meshes.length = 0;

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const radiiList = new Array(N_SAMPLES);
    const curvatureList = new Array(N_SAMPLES);
    
    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const dt = 1 / N_SAMPLES;
      const t1 = curve.getTangent((t - dt + 1) % 1);
      const t2 = curve.getTangent(t);
      const t3 = curve.getTangent((t + dt) % 1);
      const cosAB = t1.dot(t2);
      const cosBC = t2.dot(t3);
      const curvature = (2 - cosAB - cosBC) * 0.5;
      curvatureList[i] = curvature;
      const pressure = Math.min(1.0, curvature * 8);
      const r = 0.018 + 0.10 * pressure;
      radiiList[i] = r;
    }

    // identify top 10 curvature peaks for accent placement
    const sortedIndices = curvatureList
      .map((c, i) => ({ c, i }))
      .sort((a, b) => b.c - a.c)
      .slice(0, 10)
      .map(x => x.i);
    const accentSet = new Set(sortedIndices);

    // build separate tube for each material run
    const RADIAL = 6;
    const up = new THREE.Vector3(0, 1, 0);
    
    let currentMat = accentSet.has(0) ? accentMat : grayMat;
    let runStart = 0;
    
    for (let i = 1; i <= N_SAMPLES; i++){
      const isAccent = accentSet.has(i % N_SAMPLES);
      const mat = isAccent ? accentMat : grayMat;
      
      if (mat !== currentMat || i === N_SAMPLES){
        // flush run
        const runLen = i - runStart;
        if (runLen > 0){
          const positions = new Float32Array(runLen * RADIAL * 3);
          const indices = [];
          
          for (let j = 0; j < runLen; j++){
            const idx = (runStart + j) % N_SAMPLES;
            const t = idx / N_SAMPLES;
            const p = curve.getPointAt(t);
            const tangent = curve.getTangentAt(t).normalize();
            const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
            if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
            const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
            const r = radiiList[idx];
            
            for (let k = 0; k < RADIAL; k++){
              const ang = (k / RADIAL) * Math.PI * 2;
              const v = new THREE.Vector3()
                .copy(normal).multiplyScalar(Math.cos(ang) * r)
                .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
                .add(p);
              positions[(j * RADIAL + k) * 3]     = v.x;
              positions[(j * RADIAL + k) * 3 + 1] = v.y;
              positions[(j * RADIAL + k) * 3 + 2] = v.z;
            }
          }
          
          for (let j = 0; j < runLen - 1; j++){
            for (let k = 0; k < RADIAL; k++){
              const nk = (k + 1) % RADIAL;
              const a = j * RADIAL + k, b = j * RADIAL + nk;
              const c = (j + 1) * RADIAL + k, d = (j + 1) * RADIAL + nk;
              indices.push(a, b, c);
              indices.push(b, d, c);
            }
          }
          
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          g.setIndex(indices);
          g.computeVertexNormals();
          
          const mesh = new THREE.Mesh(g, currentMat);
          scene.add(mesh);
          meshes.push(mesh);
        }
        
        currentMat = mat;
        runStart = i;
      }
    }
  }

  // camera follow
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
