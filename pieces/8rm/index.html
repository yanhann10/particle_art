<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8rm · lidar tree scan</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
<!-- MOTION: orbit, intensity: calm -->
</head>
<body>
<div class="id">8rm</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0d, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 12, 35);
camera.lookAt(0, 8, 0);

// L-system tree skeleton
function lTree(depth, len, rad, pos, dir, rules){
  if (depth <= 0) return [];
  const end = pos.clone().addScaledVector(dir, len);
  const segs = [{ p0: pos.clone(), p1: end.clone(), r: rad }];
  
  rules.forEach(r => {
    const axis = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5)).normalize();
    const rotated = dir.clone().applyAxisAngle(axis, r.angle);
    segs.push(...lTree(depth - 1, len * r.scale, rad * 0.72, end.clone(), rotated, rules));
  });
  return segs;
}

const trunk = { p0: new THREE.Vector3(0,0,0), p1: new THREE.Vector3(0,0,0), r: 0 };
const skeleton = [trunk, ...lTree(8, 3.2, 0.4, new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0.02), [
  { angle: 0.48, scale: 0.78 },
  { angle: -0.52, scale: 0.76 },
  { angle: 0.3, scale: 0.68 }
])];

// Convert skeleton to point cloud with LiDAR-style errors
const cloudPoints = [];
const cloudSizes = [];
const cloudOpacities = [];

skeleton.forEach((seg, segIdx) => {
  const len = seg.p0.distanceTo(seg.p1);
  const samplesPerUnit = seg.r > 0.15 ? 180 : 320; // denser on thin branches
  const nSamples = Math.max(8, Math.floor(len * samplesPerUnit));
  
  // Occlusion probability: higher on far side (camera-relative)
  const midPoint = seg.p0.clone().lerp(seg.p1, 0.5);
  const camDist = midPoint.distanceTo(camera.position);
  const occlusionProb = Math.random() < 0.18 ? 0.85 : 0.0; // 18% of segments heavily occluded
  
  for (let i = 0; i < nSamples; i++){
    if (Math.random() < occlusionProb) continue; // gap
    
    const t = i / nSamples;
    const base = seg.p0.clone().lerp(seg.p1, t);
    
    // Radial sample around cylinder
    const theta = Math.random() * Math.PI * 2;
    const rNoise = seg.r * (0.6 + Math.random() * 0.4);
    const offset = new THREE.Vector3(
      Math.cos(theta) * rNoise,
      0,
      Math.sin(theta) * rNoise
    );
    
    // LiDAR noise grows with distance
    const depthNoise = camDist * 0.012;
    const gaussian = () => {
      let u = 0, v = 0;
      while(u === 0) u = Math.random();
      while(v === 0) v = Math.random();
      return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    };
    
    const noise = new THREE.Vector3(
      gaussian() * depthNoise,
      gaussian() * depthNoise,
      gaussian() * depthNoise
    );
    
    const p = base.clone().add(offset).add(noise);
    
    // Foliage regions become unresolved blobs (thin branches far from camera)
    const isFoliage = seg.r < 0.12 && camDist > 18;
    const blobNoise = isFoliage ? 0.8 : 0.0;
    p.add(new THREE.Vector3(
      gaussian() * blobNoise,
      gaussian() * blobNoise,
      gaussian() * blobNoise
    ));
    
    cloudPoints.push(p.x, p.y, p.z);
    
    // Size variation: smaller on thin/far branches
    const baseSize = isFoliage ? 1.8 : 1.0;
    cloudSizes.push(baseSize * (0.8 + Math.random() * 0.4));
    
    // Opacity lower on blob regions
    cloudOpacities.push(isFoliage ? 0.25 : 0.5);
  }
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cloudPoints), 3));
geom.setAttribute('size', new THREE.BufferAttribute(new Float32Array(cloudSizes), 1));
geom.setAttribute('opacity', new THREE.BufferAttribute(new Float32Array(cloudOpacities), 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: renderer.getPixelRatio() },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform float uPixelRatio;
    attribute float size;
    attribute float opacity;
    varying float vOpacity;
    void main(){
      vOpacity = opacity;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float dist = -mvPos.z;
      gl_PointSize = size * uPixelRatio * (22.0 / dist);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying float vOpacity;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vOpacity;
      // pale gray — LiDAR scan aesthetic
      vec3 col = vec3(0.78, 0.80, 0.82);
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const cloud = new THREE.Points(geom, mat);
scene.add(cloud);

// Ambient fog to soften the black void
scene.fog = new THREE.Fog(0x0a0b0d, 25, 60);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let startTime = performance.now();
function loop(){
  const elapsed = (performance.now() - startTime) / 1000;
  
  // Slow orbit — LiDAR turntable reveal
  const angle = elapsed * 0.08;
  camera.position.x = Math.sin(angle) * 35;
  camera.position.z = Math.cos(angle) * 35;
  camera.lookAt(0, 8, 0);
  
  mat.uniforms.uTime.value = elapsed;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
