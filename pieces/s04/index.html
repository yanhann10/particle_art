<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s04 · Turrell ganzfeld aperture (luminous)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a12; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">s04</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a12, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBreath: { value: 0 },
  uAspect: { value: innerWidth / innerHeight },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBreath;

    attribute float radius;
    attribute float angle;
    attribute float depth;
    attribute float band;

    varying float vLum;
    varying float vBand;
    varying float vDepth;

    void main(){
      // Turrell aperture: particles form a soft rectangular frame
      // with luminous inner edge
      float r = radius;
      float a = angle;
      float d = depth;

      // Breathing expansion
      float breath = sin(uTime * 0.15) * 0.3 + 1.0;
      r *= breath * (0.85 + uBreath * 0.15);

      // Rectangular aperture shape via superellipse
      float cx = cos(a);
      float cy = sin(a);
      float n = 3.5; // superellipse exponent
      float superR = pow(pow(abs(cx), n) + pow(abs(cy), n), -1.0/n);
      float shapeR = superR * r;

      // Gentle drift inward/outward like light settling
      float drift = sin(uTime * 0.08 + band * 6.28) * 0.15;
      shapeR += drift;

      vec3 pos = vec3(cx * shapeR, cy * shapeR, d);

      // Luminosity peaks at inner edge of aperture
      float innerEdge = smoothstep(3.0, 5.5, r) * (1.0 - smoothstep(5.5, 9.0, r));
      float outerGlow = 1.0 - smoothstep(5.5, 10.0, r);
      vLum = mix(innerEdge, outerGlow, 0.5) + 0.08;
      vLum *= 0.7 + 0.3 * sin(uTime * 0.2 + band * 3.14);

      vBand = band;
      vDepth = d;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float size = uPixel * (2.0 + innerEdge * 2.5);
      size *= (20.0 / -mv.z);
      gl_PointSize = size;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLum;
    varying float vBand;
    varying float vDepth;

    uniform float uTime;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;

      float soft = 1.0 - smoothstep(0.0, 0.5, r);
      soft *= soft;

      // Turrell palette: deep indigo → rose → warm white at core
      // Band determines color position
      float t = vBand;
      // Slow color cycle
      t += sin(uTime * 0.05) * 0.1;
      t = fract(t);

      vec3 indigo = vec3(0.12, 0.08, 0.35);
      vec3 rose = vec3(0.55, 0.15, 0.25);
      vec3 warmWhite = vec3(0.95, 0.85, 0.75);

      vec3 col;
      if (t < 0.4) {
        col = mix(indigo, rose, t / 0.4);
      } else {
        col = mix(rose, warmWhite, (t - 0.4) / 0.6);
      }

      float alpha = soft * vLum * 0.65;
      gl_FragColor = vec4(col * vLum * 1.8, alpha);
    }
  `
});

// Build aperture geometry
const positions = new Float32Array(N * 3);
const radii = new Float32Array(N);
const angles = new Float32Array(N);
const depths = new Float32Array(N);
const bands = new Float32Array(N);

let s = 91827364;
const rng = () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

for (let i = 0; i < N; i++) {
  // Distribute particles in annular ring (aperture frame)
  // Inner radius ~4, outer radius ~10
  // More density near inner edge (the luminous threshold)
  const u = rng();
  // Bias toward inner edge
  const r = 3.5 + Math.pow(u, 0.6) * 7.0;
  const a = rng() * Math.PI * 2;
  const d = (rng() - 0.5) * 3.0; // slight depth spread

  const cx = Math.cos(a);
  const cy = Math.sin(a);
  const n = 3.5;
  const superR = Math.pow(Math.pow(Math.abs(cx), n) + Math.pow(Math.abs(cy), n), -1.0/n);
  const shapeR = superR * r;

  positions[i * 3] = cx * shapeR;
  positions[i * 3 + 1] = cy * shapeR;
  positions[i * 3 + 2] = d;

  radii[i] = r;
  angles[i] = a;
  depths[i] = d;
  bands[i] = u; // use distribution position as color band
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('radius', new THREE.BufferAttribute(radii, 1));
geom.setAttribute('angle', new THREE.BufferAttribute(angles, 1));
geom.setAttribute('depth', new THREE.BufferAttribute(depths, 1));
geom.setAttribute('band', new THREE.BufferAttribute(bands, 1));

const points = new THREE.Points(geom, mat);
scene.add(points);

// Inner glow plane — the "sky" through the aperture
const glowMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uTime: uniforms.uTime },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float dist = length(c);
      // Soft inner glow
      float glow = 1.0 - smoothstep(0.0, 0.45, dist);
      glow *= glow * glow;

      // Color shift over time: deep blue to rose
      float t = sin(uTime * 0.04) * 0.5 + 0.5;
      vec3 col1 = vec3(0.15, 0.1, 0.4);
      vec3 col2 = vec3(0.5, 0.12, 0.2);
      vec3 col = mix(col1, col2, t);

      gl_FragColor = vec4(col * 1.5, glow * 0.25);
    }
  `
});

const glowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  glowMat
);
glowPlane.position.z = -2;
scene.add(glowPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
  uniforms.uAspect.value = innerWidth / innerHeight;
});

// Slow orbit on click
let targetRot = 0;
addEventListener('click', () => {
  targetRot += Math.PI * 0.25;
});

const start = performance.now();
let currentRot = 0;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  uniforms.uBreath.value = Math.sin(t * 0.1) * 0.5 + 0.5;

  // Gentle auto-rotation
  currentRot += (targetRot - currentRot) * 0.02;
  points.rotation.z = currentRot + Math.sin(t * 0.03) * 0.05;

  // Camera subtle drift
  camera.position.x = Math.sin(t * 0.02) * 0.5;
  camera.position.y = Math.cos(t * 0.025) * 0.3;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
