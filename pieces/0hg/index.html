<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0hg · echoes of the earth (living archive)</title>
<!-- MOTION: morph, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>

<body>
<div class="id">0hg</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Refik Anadol — Echoes of the Earth: Living Archive
// AI-hallucinated coral reef morphing through biological latent space
// Each coral instance drifts through 4D species-parameter space via Perlin noise
// Palette: turquoise water #14a89d, coral pink #ff6b9d, lime kelp #c6ff00

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 28);
camera.lookAt(0, 0, 0);

// Volumetric fog between layers
scene.fog = new THREE.FogExp2(0x0a1618, 0.018);

// Substrate plane
const substrate = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60, 1, 1),
  new THREE.MeshBasicMaterial({ 
    color: 0x082328, 
    transparent: true, 
    opacity: 0.4,
    side: THREE.DoubleSide 
  })
);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = -2;
scene.add(substrate);

// Ambient light with vertical temperature gradient
const ambientLight = new THREE.AmbientLight(0x14a89d, 0.3);
scene.add(ambientLight);

const topLight = new THREE.DirectionalLight(0xffb380, 0.6);
topLight.position.set(8, 20, 10);
scene.add(topLight);

const bottomLight = new THREE.DirectionalLight(0x0d5f6f, 0.4);
bottomLight.position.set(-5, -10, -8);
scene.add(bottomLight);

// Coral archetypes: tube, branching, plate, brain
// Each is a parametric geometry factory
function tubeCoral(params) {
  const { height, radius, segments, twist } = params;
  const geom = new THREE.CylinderGeometry(
    radius * 0.8, 
    radius, 
    height, 
    segments, 
    Math.floor(height * 2)
  );
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const angle = (y / height) * twist;
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const r = Math.sqrt(x*x + z*z);
    pos.setX(i, r * Math.cos(Math.atan2(z, x) + angle));
    pos.setZ(i, r * Math.sin(Math.atan2(z, x) + angle));
  }
  geom.computeVertexNormals();
  return geom;
}

function branchingCoral(params) {
  const { size, branches } = params;
  const geom = new THREE.BufferGeometry();
  const vertices = [];
  const indices = [];
  let vIdx = 0;
  
  for (let b = 0; b < branches; b++) {
    const angle = (b / branches) * Math.PI * 2;
    const baseX = Math.cos(angle) * size * 0.3;
    const baseZ = Math.sin(angle) * size * 0.3;
    
    for (let s = 0; s < 8; s++) {
      const t = s / 7;
      const r = size * 0.1 * (1 - t * 0.7);
      const h = size * t;
      
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        vertices.push(
          baseX + Math.cos(a) * r,
          h,
          baseZ + Math.sin(a) * r
        );
      }
    }
  }
  
  for (let b = 0; b < branches; b++) {
    for (let s = 0; s < 7; s++) {
      for (let i = 0; i < 6; i++) {
        const base = b * 48 + s * 6;
        const next = (i + 1) % 6;
        indices.push(base + i, base + i + 6, base + next);
        indices.push(base + next, base + i + 6, base + next + 6);
      }
    }
  }
  
  geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

function plateCoral(params) {
  const { width, depth, wave } = params;
  const geom = new THREE.PlaneGeometry(width, depth, 16, 16);
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = Math.sin(x * wave) * Math.cos(z * wave) * width * 0.15;
    pos.setY(i, y);
  }
  geom.computeVertexNormals();
  return geom;
}

function brainCoral(params) {
  const { radius, detail } = params;
  const geom = new THREE.SphereGeometry(radius, detail, detail);
  const pos = geom.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const noise = Math.sin(x * 8) * Math.cos(y * 8) * Math.sin(z * 8) * 0.15;
    const scale = 1 + noise;
    pos.setX(i, x * scale);
    pos.setY(i, y * scale);
    pos.setZ(i, z * scale);
  }
  geom.computeVertexNormals();
  return geom;
}

// Perlin noise (simple 3D implementation)
function noise3D(x, y, z) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  const Z = Math.floor(z) & 255;
  x -= Math.floor(x);
  y -= Math.floor(y);
  z -= Math.floor(z);
  const u = x * x * x * (x * (x * 6 - 15) + 10);
  const v = y * y * y * (y * (y * 6 - 15) + 10);
  const w = z * z * z * (z * (z * 6 - 15) + 10);
  const p = new Uint8Array(512);
  for (let i = 0; i < 256; i++) p[i] = p[256 + i] = (i * 7919) & 255;
  const A = p[X] + Y;
  const AA = p[A] + Z;
  const AB = p[A + 1] + Z;
  const B = p[X + 1] + Y;
  const BA = p[B] + Z;
  const BB = p[B + 1] + Z;
  return lerp(w,
    lerp(v, lerp(u, grad(p[AA], x, y, z), grad(p[BA], x-1, y, z)),
            lerp(u, grad(p[AB], x, y-1, z), grad(p[BB], x-1, y-1, z))),
    lerp(v, lerp(u, grad(p[AA+1], x, y, z-1), grad(p[BA+1], x-1, y, z-1)),
            lerp(u, grad(p[AB+1], x, y-1, z-1), grad(p[BB+1], x-1, y-1, z-1)))
  ) * 0.5 + 0.5;
}
function lerp(t, a, b) { return a + t * (b - a); }
function grad(hash, x, y, z) {
  const h = hash & 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : h === 12 || h === 14 ? x : z;
  return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v);
}

// Coral instances
const coralCount = 48;
const corals = [];
const coralData = [];

for (let i = 0; i < coralCount; i++) {
  const type = Math.floor(Math.random() * 4);
  const angle = (i / coralCount) * Math.PI * 2 + Math.random() * 0.5;
  const dist = 4 + Math.random() * 14;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  
  coralData.push({
    type,
    x, z,
    latentOffset: [Math.random() * 100, Math.random() * 100, Math.random() * 100, Math.random() * 100],
    baseParams: {
      tube: { height: 1.5 + Math.random() * 2, radius: 0.4 + Math.random() * 0.6, segments: 8, twist: Math.random() * Math.PI },
      branching: { size: 1.2 + Math.random() * 1.5, branches: 4 + Math.floor(Math.random() * 4) },
      plate: { width: 2 + Math.random() * 2, depth: 1.5 + Math.random() * 1.5, wave: 0.5 + Math.random() * 1 },
      brain: { radius: 0.6 + Math.random() * 0.8, detail: 12 }
    }
  });
}

// Subsurface scattering shader
const coralMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uMorphFactor: { value: 0 },
    uColor1: { value: new THREE.Color(0x14a89d) },
    uColor2: { value: new THREE.Color(0xff6b9d) },
    uColor3: { value: new THREE.Color(0xc6ff00) }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vViewPosition;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      vViewPosition = -mvPosition.xyz;
      vPosition = position;
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uMorphFactor;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec3 vViewPosition;
    void main() {
      vec3 viewDir = normalize(vViewPosition);
      vec3 normal = normalize(vNormal);
      
      // Subsurface scattering approximation
      float ndotv = abs(dot(normal, viewDir));
      float fresnel = pow(1.0 - ndotv, 3.0);
      float thickness = 1.0 - ndotv;
      
      // Species color morphing
      vec3 col = mix(uColor1, uColor2, uMorphFactor);
      col = mix(col, uColor3, smoothstep(0.6, 1.0, uMorphFactor));
      
      // Wet coral look
      vec3 subsurface = col * thickness * 0.6;
      vec3 specular = vec3(0.9) * pow(ndotv, 8.0) * 0.3;
      
      vec3 finalColor = col * (0.4 + ndotv * 0.6) + subsurface + specular + fresnel * vec3(0.2, 0.4, 0.5) * 0.3;
      
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `,
  side: THREE.DoubleSide
});

// Create coral meshes
coralData.forEach((data, idx) => {
  const { type, x, z, baseParams } = data;
  let geom;
  
  if (type === 0) geom = tubeCoral(baseParams.tube);
  else if (type === 1) geom = branchingCoral(baseParams.branching);
  else if (type === 2) geom = plateCoral(baseParams.plate);
  else geom = brainCoral(baseParams.brain);
  
  const mat = coralMaterial.clone();
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(x, -1.5, z);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  scene.add(mesh);
  corals.push({ mesh, data, material: mat });
});

// Plankton particles
const planktonCount = 8000;
const planktonGeom = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonVel = [];

for (let i = 0; i < planktonCount; i++) {
  planktonPos[i*3] = (Math.random() - 0.5) * 50;
  planktonPos[i*3+1] = Math.random() * 20 - 5;
  planktonPos[i*3+2] = (Math.random() - 0.5) * 50;
  planktonVel.push({
    x: (Math.random() - 0.5) * 0.02,
    y: (Math.random() - 0.5) * 0.01,
    z: (Math.random() - 0.5) * 0.02
  });
}

planktonGeom.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));

const planktonMat = new THREE.PointsMaterial({
  color: 0xc6ff00,
  size: 0.08,
  transparent: true,
  opacity: 0.35,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const plankton = new THREE.Points(planktonGeom, planktonMat);
scene.add(plankton);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;
  
  // Update coral morphing through latent space
  corals.forEach((coral, idx) => {
    const { data, material, mesh } = coral;
    const [ox, oy, oz, ow] = data.latentOffset;
    
    // 4D Perlin drift through species parameter space
    const speed = 0.08;
    const n1 = noise3D(ox + elapsed * speed, oy, oz);
    const n2 = noise3D(ox, oy + elapsed * speed, oz);
    const n3 = noise3D(ox, oy, oz + elapsed * speed);
    const n4 = noise3D(ow + elapsed * speed * 0.5, ox, oy);
    
    // Morph factor drives color transition
    const morphFactor = (n1 + n2 + n3) / 3;
    material.uniforms.uMorphFactor.value = morphFactor;
    material.uniforms.uTime.value = elapsed;
    
    // Geometry scaling based on latent position
    const scale = 0.8 + n4 * 0.4;
    mesh.scale.setScalar(scale);
    
    // Subtle vertical oscillation
    mesh.position.y = -1.5 + Math.sin(elapsed * 0.3 + idx * 0.5) * 0.3;
  });
  
  // Update plankton drift
  const pos = planktonGeom.attributes.position;
  for (let i = 0; i < planktonCount; i++) {
    pos.setX(i, pos.getX(i) + planktonVel[i].x);
    pos.setY(i, pos.getY(i) + planktonVel[i].y);
    pos.setZ(i, pos.getZ(i) + planktonVel[i].z);
    
    if (Math.abs(pos.getX(i)) > 25) pos.setX(i, -pos.getX(i));
    if (pos.getY(i) > 15) pos.setY(i, -5);
    if (pos.getY(i) < -5) pos.setY(i, 15);
    if (Math.abs(pos.getZ(i)) > 25) pos.setZ(i, -pos.getZ(i));
  }
  pos.needsUpdate = true;
  
  // Camera orbit with slow vertical drift
  const radius = 28;
  const angle = elapsed * 0.12;
  camera.position.x = Math.sin(angle) * radius;
  camera.position.z = Math.cos(angle) * radius;
  camera.position.y = 12 + Math.sin(elapsed * 0.08) * 4;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
