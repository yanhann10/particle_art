<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9xm · mirror-flip coral</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#070a09; overflow:hidden;
               color:#dde6d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">9xm · mirror-flip coral</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">bilateral symmetry surprise · reflected morphogenesis</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a09, 0.04);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a09, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const MAX_VERTS = 4000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE = 0.0035;
const MAX_D    = 0.32;

// SURPRISE: evolution happens only on the right half-plane (x>=0).
// Every frame we mirror to create bilateral symmetry.
// At t~10s, the mirror plane suddenly rotates 90deg (now z>=0 mirrors to z<0).
// The coral appears to "flip" its axis of symmetry mid-growth.

const verts = [];
const NV0 = 12; // half the initial vertices (only right side)
for (let i = 0; i < NV0; i++){
  const th = i / NV0 * Math.PI * 2;
  const r  = 1.4 + (Math.random() - 0.5) * 0.1;
  const x = Math.cos(th) * r;
  const z = Math.sin(th) * r;
  if (x >= 0) verts.push({ x, z, y: 0, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x, z){ return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const arr = grid.get((cx+dx) + ',' + (cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
let mirrorAxis = 'x'; // starts as x-axis mirror (x>=0), flips to 'z' (z>=0) later
addEventListener('click', () => { paused = !paused; });

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS / 2) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex*ex + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i - 1 + n) % n];
    const b = verts[(i + 1) % n];
    const v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0006;
    verts[i].y = -Math.min(verts[i].age * 0.6, 1.4);
    
    // clamp to half-plane
    if (mirrorAxis === 'x' && verts[i].x < 0) verts[i].x = 0;
    if (mirrorAxis === 'z' && verts[i].z < 0) verts[i].z = 0;
  }

  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex*ex + ez*ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS / 2){
      grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5,
                   y: (a.y + b.y) * 0.5, age: Math.max(a.age, b.age) * 0.85 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAge;
    void main(){
      vec3 p = position;
      vAge = age;
      float t = uTime * 0.5 + seed * 6.28;
      p += 0.005 * vec3(sin(t), 0.0, cos(t));

      vec3 a = vec3(0.50, 0.90, 0.62);
      vec3 b = vec3(0.95, 0.42, 0.38);
      vec3 c = vec3(0.92, 0.88, 0.78);
      float k = clamp(age * 0.8, 0.0, 1.0);
      vCol = mix(a, b, k);
      vCol = mix(vCol, c, smoothstep(0.85, 1.0, k) * 0.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.4 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAge;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * 0.65;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 400; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();
let flipped = false;

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // SURPRISE at t=10s: mirror axis rotates 90deg
  if (t > 10 && !flipped){
    flipped = true;
    mirrorAxis = 'z';
    // re-clamp all verts to new half-plane
    for (let v of verts){
      if (v.z < 0) v.z = 0;
    }
  }

  for (let s = 0; s < 4; s++) step();

  const n = verts.length;
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    const L = Math.sqrt(ex*ex + ez*ez + ey*ey);
    lengths.push(L); total += L;
  }
  if (total > 0){
    let written = 0;
    for (let i = 0; i < n; i++){
      const share = (i === n - 1)
        ? N_RENDER / 2 - written
        : Math.max(1, Math.floor(N_RENDER / 2 * lengths[i] / total));
      const a = verts[i], b = verts[(i + 1) % n];
      for (let k = 0; k < share && written < N_RENDER / 2; k++){
        const u = Math.random();
        const x = a.x + (b.x - a.x) * u + (Math.random()-0.5) * 0.02;
        const y = a.y + (b.y - a.y) * u;
        const z = a.z + (b.z - a.z) * u + (Math.random()-0.5) * 0.02;
        const ag = Math.max(a.age, b.age);
        
        // original particle
        rPositions[written*3]   = x;
        rPositions[written*3+1] = y;
        rPositions[written*3+2] = z;
        rAge[written] = ag;
        written++;
      }
    }
    // mirror the first half to the second half
    for (let i = 0; i < N_RENDER / 2; i++){
      const idx = (N_RENDER / 2) + i;
      const x = rPositions[i*3];
      const y = rPositions[i*3+1];
      const z = rPositions[i*3+2];
      
      if (mirrorAxis === 'x'){
        rPositions[idx*3]   = -x;
        rPositions[idx*3+1] = y;
        rPositions[idx*3+2] = z;
      } else {
        rPositions[idx*3]   = x;
        rPositions[idx*3+1] = y;
        rPositions[idx*3+2] = -z;
      }
      rAge[idx] = rAge[i];
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
  }
  statEl.textContent = `vertices=${n}×2 · mirror=${mirrorAxis}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
