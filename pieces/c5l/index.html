<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: calm -->
<!-- Intent: a topographic landscape of 70k identical pin-particles accumulated along branching ridge lines — the cypress L-system from kam laid horizontal as geology. Tara Donovan's "millions of identical objects become landscape." The viewer should recognize rolling terrain ridges and feel geological stillness. -->
<title>&lt;NEW_ID&gt; · topographic accumulation</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#12100d; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">&lt;NEW_ID&gt;</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ─── scene ─── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x12100d, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 250);
camera.position.set(-1, 15, 22);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x12100d, 1);
document.body.appendChild(renderer.domElement);

/* ─── deterministic RNG ─── */
let _s = 0xC0FFEE;
function rng(){ _s = (_s + 0x6D2B79F5)|0;
  let t = Math.imul(_s ^ _s>>>15, 1|_s);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
  return ((t ^ t>>>14)>>>0) / 4294967296; }

/* ─── L-system ridge network (kam's cypress DNA laid horizontal) ─── */
const ridges = [];

function addRidge(x0, z0, angle, length, width, height, depth){
  if(depth <= 0 || length < 0.4) return;
  const dx = Math.cos(angle), dz = Math.sin(angle);
  const x1 = x0 + dx*length, z1 = z0 + dz*length;
  ridges.push({x0, z0, x1, z1, w: width, h: height});

  // cypress-tight branching angles (from kam's 13° rule)
  const brA = 0.22 + rng()*0.25;
  const shrink = 0.62 + rng()*0.12;
  // left branch
  if(rng() < 0.72)
    addRidge(x0+dx*length*0.35, z0+dz*length*0.35,
             angle+brA, length*shrink, width*0.68, height*0.72, depth-1);
  // right branch
  if(rng() < 0.72)
    addRidge(x0+dx*length*0.55, z0+dz*length*0.55,
             angle-brA, length*shrink, width*0.68, height*0.7, depth-1);
  // continue trunk
  if(rng() < 0.82)
    addRidge(x1, z1, angle+(rng()-0.5)*0.15,
             length*0.78, width*0.82, height*0.82, depth-1);
}

// Three main ridge spines — like the cypress's trunk splitting
addRidge( 0, -9,  Math.PI*0.47, 14, 2.4, 3.8, 5);
addRidge(-4, -5,  Math.PI*0.32, 11, 1.9, 3.0, 4);
addRidge( 3, -7,  Math.PI*0.58, 10, 1.6, 2.6, 4);

/* ─── terrain height function ─── */
function distToSeg(px, pz, seg){
  const dx = seg.x1-seg.x0, dz = seg.z1-seg.z0;
  const len2 = dx*dx + dz*dz;
  if(len2 < 0.001) return Math.hypot(px-seg.x0, pz-seg.z0);
  let t = ((px-seg.x0)*dx + (pz-seg.z0)*dz) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (seg.x0+t*dx), pz - (seg.z0+t*dz));
}

function terrainH(x, z){
  let h = 0;
  for(const r of ridges){
    const d = distToSeg(x, z, r);
    h += r.h * Math.exp(-d*d / (2*r.w*r.w));
  }
  // gentle base undulation — contour lines
  h += 0.12 * Math.sin(x*0.35 + 0.7) * Math.cos(z*0.3);
  h += 0.08 * Math.sin(x*0.6 + z*0.45);
  return h;
}

/* ─── 70k particles: identical pins accumulated on terrain ─── */
const N = 70000;
const positions = new Float32Array(N*3);
const baseY     = new Float32Array(N); // store base terrain height for animation
const seeds     = new Float32Array(N);
const hNorms    = new Float32Array(N);

// find height range
const EXTENT = 15;
let maxH = 0;
for(let i = 0; i < 800; i++){
  const x = (rng()*2-1)*EXTENT, z = (rng()*2-1)*EXTENT;
  maxH = Math.max(maxH, terrainH(x, z));
}

// height-biased placement: more particles where ridges are (Donovan accumulation)
let placed = 0;
while(placed < N){
  const x = (rng()*2-1)*EXTENT;
  const z = (rng()*2-1)*EXTENT;
  const h = terrainH(x, z);
  const prob = 0.12 + 0.88 * (h / maxH);
  if(rng() < prob){
    const pinH = 0.015 + rng()*0.06;   // tiny pin offset — identical units
    positions[placed*3]   = x;
    positions[placed*3+1] = h + pinH;
    positions[placed*3+2] = z;
    baseY[placed] = h;
    hNorms[placed] = h / maxH;
    seeds[placed] = rng();
    placed++;
  }
}

/* ─── shader material ─── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('hNorm',    new THREE.BufferAttribute(hNorms, 1));
geom.setAttribute('baseY',    new THREE.BufferAttribute(baseY, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float hNorm;
    attribute float baseY;
    varying float vH;
    varying float vFog;
    void main(){
      vec3 p = position;

      // geological breathing — slow wave passes through terrain
      float wave = sin(p.x*0.12 + p.z*0.08 + uTime*0.07)*0.3
                 + sin(p.z*0.15 - uTime*0.045)*0.18;
      p.y += wave * hNorm;  // ridges heave more than valleys

      // individual pin micro-tremor
      p.y += sin(uTime*0.25 + seed*6.283) * 0.008;

      vH = hNorm;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // uniform pin-head size (Donovan: identical objects)
      gl_PointSize = uPixel * (1.1 + hNorm*0.5) * (42.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;

      // manual fog
      vFog = 1.0 - exp(-0.012 * dist * dist * 0.01);
    }
  `,
  fragmentShader: `
    varying float vH;
    varying float vFog;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if(r2 > 0.25) discard;

      float edge = 1.0 - smoothstep(0.08, 0.25, r2);

      // Donovan palette: bone → warm stone → deep shadow
      // restrained, matte, museum-wall feel
      vec3 shadow = vec3(0.28, 0.25, 0.22);  // deep valley
      vec3 stone  = vec3(0.52, 0.48, 0.42);  // mid slope
      vec3 bone   = vec3(0.82, 0.78, 0.71);  // ridge crest
      vec3 cream  = vec3(0.88, 0.84, 0.77);  // peak highlight

      vec3 col = mix(shadow, stone, smoothstep(0.0, 0.35, vH));
      col = mix(col, bone, smoothstep(0.35, 0.7, vH));
      col = mix(col, cream, smoothstep(0.8, 1.0, vH) * 0.55);

      // fog blend to background
      vec3 fogCol = vec3(0.071, 0.063, 0.051);
      col = mix(col, fogCol, vFog);

      float a = edge * 0.55;
      gl_FragColor = vec4(col, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ─── subtle ground shadow plane ─── */
{
  const gm = new THREE.PlaneGeometry(60, 60);
  const gmat = new THREE.MeshBasicMaterial({
    color: 0x0a0908, transparent: true, opacity: 0.35
  });
  const ground = new THREE.Mesh(gm, gmat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.15;
  scene.add(ground);
}

/* ─── resize ─── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── animation: contemplative, still — single slow lateral drift ─── */
const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;
  uniforms.uTime.value = t;

  // very slow lateral drift (NOT rotation) — camera pans gently across the terrain
  const driftX = Math.sin(t * 0.018) * 2.0;
  const driftZ = 22 + Math.cos(t * 0.013) * 1.2;
  const driftY = 15 + Math.sin(t * 0.01) * 0.5;
  camera.position.set(-1 + driftX, driftY, driftZ);
  camera.lookAt(0, 1.2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<!-- piece controls -->
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
<button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
<button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
<input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
<button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- grade panel -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
