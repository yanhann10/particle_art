<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xd6 · Shiota — Two Home Countries</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">xd6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0018);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Single warm point light — Shiota: darkness is the primary material
scene.add(new THREE.AmbientLight(0x080202, 0.008));
const warmL = new THREE.PointLight(0xff5030, 0.018, 60, 2.0);
warmL.position.set(4, 10, -3);
scene.add(warmL);

// Faint secondary from below — like gallery uplighting
const underL = new THREE.PointLight(0xff4020, 0.006, 40, 2.0);
underL.position.set(-2, -8, 2);
scene.add(underL);

let seed = 4827193;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ── ARCHITECTURAL VOLUME — 30×24×28 chamber
const ROOM = { w:30, h:24, d:28 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE SUSPENDED SPHERE — pale, cottony, the still center
// "like a circulatory cosmos around a moon"
const sphereCenter = new THREE.Vector3(1.2, 0.8, -0.3);
const sphereRadius = 2.2;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8da,
  emissive: 0xf0e8da,
  emissiveIntensity: 0.6,
  roughness: 1.0,
  metalness: 0.0,
  transparent: true,
  opacity: 0.22,
  fog: true,
  side: THREE.DoubleSide
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner glow — slightly smaller, more opaque
const innerMat = new THREE.MeshStandardMaterial({
  color: 0xf5efe2,
  emissive: 0xf5efe2,
  emissiveIntensity: 0.85,
  roughness: 1.0,
  metalness: 0.0,
  transparent: true,
  opacity: 0.12,
  fog: true
});
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius * 0.7, 16, 12),
  innerMat
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

function sphereSurfPt(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereRadius,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereRadius,
    sphereCenter.z + Math.cos(v)*sphereRadius
  );
}

// ── DARK FRAGMENTS — 18 charred scraps caught in the web
const fragments = [];
for(let i = 0; i < 18; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3 + Math.floor(rng()*4);
  const fSize = 0.06 + rng()*0.12;
  for(let j = 0; j < nPts; j++){
    verts.push(
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.3,
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.3
    );
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color: 0x0c0a08, transparent: true, opacity: 0.55
  }));
  let pos;
  do {
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = 3.5 + rng()*7.0;
    pos = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.85,
      sphereCenter.z + Math.cos(v)*r
    );
  } while(pos.distanceTo(sphereCenter) < 3.2);
  fMesh.position.copy(pos);
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — deliberate negative space the camera can look through
const voids = [];
for(let i = 0; i < 3; i++){
  const a = (i/3)*Math.PI*2 + rng()*0.9;
  const vr = 5.5 + rng()*3.5;
  voids.push({
    x: sphereCenter.x + Math.cos(a)*vr,
    y: sphereCenter.y + (rng()-0.5)*4.0,
    z: sphereCenter.z + Math.sin(a)*vr,
    r: 2.0 + rng()*0.7
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dy=p.y-v.y, dz=p.z-v.z;
    if(dx*dx+dy*dy+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ANCHOR FIELD — concentric shells around sphere
const anchors = [];
const shells = [3.8, 6.0, 8.5, 11.0, 14.0];
for(const sr of shells){
  const count = Math.floor(16 + sr*1.3);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.82+rng()*0.36);
    const pt = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.9,
      sphereCenter.z + Math.cos(v)*r
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
}
// Wall anchors
for(let i = 0; i < 60; i++){
  const wp = wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
// Fragment positions as anchors
for(const f of fragments) anchors.push(f.position.clone());

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  if(inVoid(a) || inVoid(b)) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE — 50% — threads from volume toward sphere surface
// "blood vessels around a heart" — the sphere as gravitational center
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.35){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  const target = sphereSurfPt();

  // 12% yearning threads — stop short, never quite arriving
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng()*1.5;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: LATERAL — anchor-to-anchor within threshold
// The structural mesh — the web between convergence lines
const THRESH = 7.0;
const catBtarget = Math.floor(NUM_LINES * 0.20);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 50000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 1);
  catBcount++;
}

// RULE 3: DENDRITIC CHAINS — branching filaments from sphere
// Morphogenetic growth outward — like capillaries branching
for(let i = 0; i < 160 && li < NUM_LINES; i++){
  let pt = sphereSurfPt();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*4);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.35 + rng()*0.7;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.35, (rng()-0.5)*0.35, (rng()-0.5)*0.35
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next, 2);
    // Y-fork at second segment
    if(c === 1 && rng() < 0.4 && li < NUM_LINES){
      const fDev = new THREE.Vector3(
        (rng()-0.5)*0.7, (rng()-0.5)*0.7, (rng()-0.5)*0.7
      );
      const fDir = prevDir.clone().add(fDev).normalize();
      const fLen = 0.25 + rng()*0.45;
      setLine(pt, pt.clone().add(fDir.multiplyScalar(fLen)), 2);
    }
    pt = next;
    prevDir = dir;
  }
}

// RULE 4: SUSPENSION — vertical threads from ceiling to sphere top and floor to sphere bottom
// Making the hanging physically legible
for(let i = 0; i < 14 && li < NUM_LINES; i++){
  const a = (i/14)*Math.PI*2 + (rng()-0.5)*0.3;
  const topR = 0.1 + rng()*0.4;
  const ceilPt = new THREE.Vector3(
    sphereCenter.x + Math.cos(a)*topR,
    hh,
    sphereCenter.z + Math.sin(a)*topR
  );
  const surfTop = new THREE.Vector3(
    sphereCenter.x + Math.cos(a)*0.08,
    sphereCenter.y + sphereRadius + 0.05,
    sphereCenter.z + Math.sin(a)*0.08
  );
  setLine(ceilPt, surfTop, 3);
}

// RULE 5: GRAVITY THREADS — hanging down from lower hemisphere
// Like threads that once held something, now trailing into void
for(let i = 0; i < 250 && li < NUM_LINES; i++){
  const u = rng()*Math.PI*2;
  // Lower hemisphere only
  const v = Math.PI*0.5 + rng()*Math.PI*0.5;
  const startPt = new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereRadius,
    sphereCenter.y + Math.cos(v)*sphereRadius,
    sphereCenter.z + Math.sin(v)*Math.sin(u)*sphereRadius
  );
  const dropLen = 1.5 + rng()*4.0;
  const drift = (rng()-0.5)*0.5;
  const endPt = new THREE.Vector3(
    startPt.x + drift,
    startPt.y - dropLen,
    startPt.z + (rng()-0.5)*0.3
  );
  setLine(startPt, endPt, 3);
}

// RULE 6: RISING THREADS — from floor toward sphere
// Memory ascending — the past reaching up
for(let i = 0; i < 350 && li < NUM_LINES; i++){
  const a = rng()*Math.PI*2;
  const floorR = 1.0 + rng()*11.0;
  const floorPt = new THREE.Vector3(
    sphereCenter.x + Math.cos(a)*floorR,
    -hh + rng()*0.2,
    sphereCenter.z + Math.sin(a)*floorR
  );
  let target;
  if(rng() < 0.3){
    target = sphereSurfPt();
  } else {
    const midA = rng()*Math.PI*2;
    const midR = 2.5 + rng()*5.5;
    target = new THREE.Vector3(
      sphereCenter.x + Math.cos(midA)*midR,
      sphereCenter.y + (rng()-0.5)*7.0,
      sphereCenter.z + Math.sin(midA)*midR
    );
  }
  setLine(floorPt, target, 1);
}

// RULE 7: RADIAL-QUANTIZED THREADS near sphere — 15° angular increments
// vera_molnar: order-to-chaos gradient
for(let i = 0; i < 400 && li < NUM_LINES; i++){
  const rawAngle = rng()*Math.PI*2;
  const quantAngle = Math.round(rawAngle/(Math.PI/12))*(Math.PI/12);
  const elev = (rng()-0.5)*Math.PI*0.8;
  const nearR = sphereRadius + 0.1 + rng()*1.5;
  const nearPt = new THREE.Vector3(
    sphereCenter.x + Math.cos(quantAngle)*Math.cos(elev)*nearR,
    sphereCenter.y + Math.sin(elev)*nearR,
    sphereCenter.z + Math.sin(quantAngle)*Math.cos(elev)*nearR
  );
  const farR = nearR + 2.0 + rng()*4.0;
  // Progressively de-quantize with distance
  const chaos = rng()*0.4;
  const farPt = new THREE.Vector3(
    sphereCenter.x + Math.cos(quantAngle+chaos)*Math.cos(elev+chaos*0.3)*farR,
    sphereCenter.y + Math.sin(elev+chaos*0.3)*farR,
    sphereCenter.z + Math.sin(quantAngle+chaos)*Math.cos(elev+chaos*0.3)*farR
  );
  setLine(nearPt, farPt, 0);
}

// Fill remainder with architectural wall-to-wall and wall-to-sphere spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.3 ? sphereSurfPt() : (rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt());
  setLine(a, b, 1);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — blood-red #c20018
// Category opacity: convergence brightest, lateral dimmer, dendritic medium, suspension subtle
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catOpacity = [0.10, 0.045, 0.065, 0.055];

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0 - d*0.045);
  const cat = lineCat[i];
  const baseOp = catOpacity[cat] * distFade;
  // Warmer near sphere
  const warmShift = d < 4.0 ? 0.015 : 0.0;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = (bR + warmShift) * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.65;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — slow drift through the web, inside the volume
const pathLen = 3000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.12){
    // Begin close, below — looking up through gravity threads at the sphere
    const lt = t/0.12;
    rH = 4.0 + lt*1.5;
    y = cy - 5.0 + lt*3.0;
  } else if(t < 0.28){
    // Rise — sphere emerges through the thread canopy
    const lt = (t-0.12)/0.16;
    rH = 5.5 + lt*3.0;
    y = cy - 2.0 + lt*4.5;
  } else if(t < 0.42){
    // Level with sphere — the intimate approach
    const lt = (t-0.28)/0.14;
    rH = 8.5 - lt*3.0;
    y = cy + 2.5 + Math.sin(lt*Math.PI)*1.5;
  } else if(t < 0.55){
    // Drift laterally — pendular, not circular
    const lt = (t-0.42)/0.13;
    rH = 5.5 + Math.sin(lt*Math.PI*1.5)*2.0;
    y = cy + 4.0 - lt*2.0;
  } else if(t < 0.68){
    // Pull back — see the whole web structure
    const lt = (t-0.55)/0.13;
    rH = 7.5 + lt*3.5;
    y = cy + 2.0 - lt*1.0;
  } else if(t < 0.80){
    // Descend — below sphere, through gravity threads again
    const lt = (t-0.68)/0.12;
    rH = 11.0 - lt*5.0;
    y = cy + 1.0 - lt*6.0;
  } else if(t < 0.92){
    // Close — near sphere surface, intimate witness
    const lt = (t-0.80)/0.12;
    rH = 6.0 - lt*2.0;
    y = cy - 5.0 + lt*7.0;
  } else {
    // Return to start
    const lt = (t-0.92)/0.08;
    rH = 4.0 + lt*0.0;
    y = cy + 2.0 - lt*7.0;
  }

  // Gentle drift — not a perfect circle
  const driftA = Math.sin(p*2.3)*0.15;
  const driftB = Math.cos(p*3.7)*0.10;
  const x = cx + Math.sin(p*0.72 + driftA)*rH;
  const z = cz + Math.cos(p*0.72 + driftB)*rH*1.08;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — <0.3% variation, glacial
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00004 * Math.max(0, 1.0-dist/18.0);
    const phase = basePositions[idx]*0.03 + basePositions[idx+1]*0.04 + i*0.0001;
    const breath = Math.sin(elapsed*0.002+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.12;
      arr[vi+1] = basePositions[vi+1] + breath*0.08;
      arr[vi+2] = basePositions[vi+2] + breath*0.10;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere luminance pulse — like a slow heartbeat
  sphereMat.emissiveIntensity = 0.6 + Math.sin(elapsed*0.0005)*0.05;
  innerMat.emissiveIntensity = 0.85 + Math.sin(elapsed*0.0005+0.5)*0.04;
  sphereMat.opacity = 0.22 + Math.sin(elapsed*0.0004)*0.015;

  // Camera dolly
  const speed = 0.00007;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle drift
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00035)*0.08;
  look.y += Math.cos(elapsed*0.00028)*0.25 - 0.2;
  look.z += Math.sin(elapsed*0.00045+0.4)*0.06;
  camera.lookAt(look);

  // Light micro-drift
  warmL.position.x = 4 + Math.sin(elapsed*0.00015)*0.06;
  warmL.position.y = 10 + Math.cos(elapsed*0.00009)*0.05;
  warmL.intensity = 0.018 + Math.sin(elapsed*0.0002)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
