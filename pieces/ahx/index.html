<!DOCTYPE html>
<!-- MOTION: drift, intensity: gentle -->
<!-- PIECE: ahx — Hadid Fluid Interior (MAXXI Rome) -->
<!-- PALETTE: cream-white #f0ede8, warm key + cool fill lighting -->
<!-- CONCEPT: Channel the interior of MAXXI Rome (Zaha Hadid). A single sweeping
     ParametricGeometry surface that folds back on itself — floor-becomes-wall, no outside.
     MeshStandardMaterial cream. Warm key from one side, cool fill from other.
     Form suggests inhabitable space, not abstract sculpture. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>ahx · hadid fluid interior</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0b0a; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b0a);

const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 300);
camera.position.set(0, 4, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.target.set(0, 2, 0);
controls.minDistance = 5;
controls.maxDistance = 50;

// ── Lighting ─────────────────────────────────────────────────────────────────
// Warm key light from one side (MAXXI's warm concrete daylight)
const keyLight = new THREE.DirectionalLight(0xfff4d8, 2.5);
keyLight.position.set(8, 14, 6);
keyLight.castShadow = true;
scene.add(keyLight);

// Cool fill from opposite
const fillLight = new THREE.DirectionalLight(0xc8d8f0, 0.85);
fillLight.position.set(-10, 6, -5);
scene.add(fillLight);

// Soft ambient for shadow regions — never pitch-black inside
const ambient = new THREE.AmbientLight(0x1a1612, 3.5);
scene.add(ambient);

// Subtle rim from below to lift the underside of folds
const rimLight = new THREE.DirectionalLight(0xffeedd, 0.4);
rimLight.position.set(0, -8, 3);
scene.add(rimLight);

// ── Parametric surface: MAXXI-style floor-becomes-wall fold ─────────────────
// The surface is a continuous strip that sweeps along U (longitudinal direction)
// while the V cross-section defines a C-shape or möbius-style fold so floor→wall.
// u ∈ [0,1]: along the length of the gallery corridor
// v ∈ [0,1]: across the cross-section (0=floor edge, 0.5=crown, 1=wall edge)

function hadiInterior(u, v, target) {
  // u: position along the corridor (0..1)
  // v: cross-section parameter (0..1)

  // Longitudinal path: a gentle S-curve (Hadid always curves)
  const ux = (u - 0.5) * 24;   // range -12..12
  const uz = Math.sin(u * Math.PI) * 4.5; // Z bow in the middle

  // Cross-section: maps v to a floor-ceiling fold
  // At v=0: floor (low, horizontal), at v=1: far wall (high, vertical)
  // Use a quadratic arc to make it a smooth continuous fold
  const theta = v * Math.PI * 0.85; // 0 → ~153° sweep
  const R = 4.5 + 1.5 * Math.sin(u * Math.PI); // wider in middle
  const cy = -1.0; // center of arc
  const cz = 0;

  const px = ux;
  const py = cy + R * Math.sin(theta);  // rises from floor (-1+0) to ceiling (-1+R)
  const pz = uz + cz + R * Math.cos(theta) * (0.5 + 0.5 * Math.sin(u * Math.PI * 1.5));

  // Secondary fold: the surface wraps back slightly at the top (ceiling concave inward)
  // This is the Hadid signature: "interior with no outside" — topological fold
  const topFold = Math.max(0, (v - 0.72) / 0.28);  // only at v > 0.72
  const foldAngle = topFold * Math.PI * 0.35;
  const foldedPy = py - topFold * R * 0.25 * (1 - Math.cos(foldAngle));
  const foldedPz = pz + topFold * R * 0.18 * Math.sin(foldAngle);

  target.set(px, foldedPy, foldedPz);
}

const slices = 160, rings = 64;
const geo = new ParametricGeometry(hadiInterior, slices, rings);

// Cream-white MeshStandardMaterial: architectural concrete finish
const mat = new THREE.MeshStandardMaterial({
  color: 0xf0ede8,
  metalness: 0.08,
  roughness: 0.62,
  side: THREE.DoubleSide,
});

const surface = new THREE.Mesh(geo, mat);
surface.castShadow = true;
surface.receiveShadow = true;
scene.add(surface);

// ── Secondary: a second surface — the opposing wall, to create enclosed space
// Mirror and offset slightly for the sense of CORRIDOR (both walls visible)
function hadiOpposite(u, v, target) {
  // Same corridor path, but cross-section flipped (mirrored in Z) and shifted
  const ux = (u - 0.5) * 24;
  const uz = Math.sin(u * Math.PI) * 4.5;

  const theta = v * Math.PI * 0.85;
  const R = 4.5 + 1.5 * Math.sin(u * Math.PI);
  const cy = -1.0;

  const px = ux;
  const py = cy + R * Math.sin(theta);
  const pz_raw = uz + R * Math.cos(theta) * (0.5 + 0.5 * Math.sin(u * Math.PI * 1.5));
  const pz = -pz_raw - 2.5; // mirror and offset to form opposite wall

  const topFold = Math.max(0, (v - 0.72) / 0.28);
  const foldAngle = topFold * Math.PI * 0.35;
  const foldedPy = py - topFold * R * 0.25 * (1 - Math.cos(foldAngle));
  const foldedPz = pz - topFold * R * 0.18 * Math.sin(foldAngle);

  target.set(px, foldedPy, foldedPz);
}

const geo2 = new ParametricGeometry(hadiOpposite, slices, rings);
const mat2 = new THREE.MeshStandardMaterial({
  color: 0xe8e4de, // slightly cooler for the shadow-side wall
  metalness: 0.05,
  roughness: 0.70,
  side: THREE.DoubleSide,
});
const surface2 = new THREE.Mesh(geo2, mat2);
surface2.castShadow = true;
surface2.receiveShadow = true;
scene.add(surface2);

// ── Subtle floor plane: polished concrete ────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(30, 16);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0xd8d4ce,
  metalness: 0.12,
  roughness: 0.80,
  side: THREE.DoubleSide,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.0;
floor.receiveShadow = true;
scene.add(floor);

// ── Camera drift: slow, reveals the spatial enclosure ────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.003;

  // Slow pendular drift that suggests walking along the interior
  controls.autoRotateSpeed = 0.28 + 0.15 * Math.sin(t * 0.4);

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const W2 = window.innerWidth, H2 = window.innerHeight;
  camera.aspect = W2 / H2;
  camera.updateProjectionMatrix();
  renderer.setSize(W2, H2);
});
</script>
<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
