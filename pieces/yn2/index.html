<head>

<title>s7k · iki lucy · Tanaka Ikko restrained elegance</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070c; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em;

</style>

<body>
<div class="loading" id="loading">loading lucy · iki drift …</div>
<div class="id">yn2</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070c, 1);
document.body.appendChild(renderer.domElement);

/* ── instance layout: central Lucy + 3 concentric rings (inherited) ── */
const COPIES = 30;
const PER_CENTER = 28000;
const PER_RING   = 1200;
const N = PER_CENTER + (COPIES - 1) * PER_RING;

const copyOffsets = [];
const copyScales  = [];

copyOffsets.push(new THREE.Vector3(0, 0, 0));
copyScales.push(1.0);

for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 22, 0, Math.sin(a) * 22));
  copyScales.push(0.52);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.28;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 42, 0, Math.sin(a) * 42));
  copyScales.push(0.33);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.14;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 64, 0, Math.sin(a) * 64));
  copyScales.push(0.21);
}

const restPositions = new Float32Array(N * 3);
const localRest     = new Float32Array(N * 3);
const seedsArr      = new Float32Array(N);
const scaleArr      = new Float32Array(N);

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uReady:     { value: 0.0 },
  uDotFreq:   { value: 3.2 },
  uDotRad:    { value: 0.22 }
};

/* ── shaders: iki morph — Tanaka Ikko sparse graphic elegance ── */
/* iki (粋): Edo-period refined chic — restraint, suggestion, cool warmth tension */
/* From selcouth's uncanny indigo detachment → iki's sumi-ink discipline with amber breath */
const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uReady;
  uniform float uDotFreq;
  uniform float uDotRad;
  attribute vec3  rest;
  attribute vec3  localR;
  attribute float seed;
  attribute float sc;
  varying vec3  vCol;
  varying float vAlpha;
  varying float vGlow;
  varying float vRise;

  float polkaDot(vec3 p, float freq, float rad) {
    vec3 cell = fract(p * freq + 0.5) - 0.5;
    return 1.0 - smoothstep(rad - 0.04, rad + 0.04, length(cell));
  }

  /* iki stripe — vertical emphasis like kimono pattern */
  float ikiStripe(vec3 p) {
    float s = sin(p.y * 1.8 + p.x * 0.3) * 0.5 + 0.5;
    return smoothstep(0.42, 0.58, s);
  }

  void main() {
    float t = uTime * 0.25 + seed * 6.2831;

    /* iki drape — gentle vertical fold replaces selcouth twist */
    vec3 lr = localR;
    float drapeAng = sin(lr.y * 0.18 + uTime * 0.05) * 0.18 * smoothstep(0.0, 1.0, uReady);
    float ct = cos(drapeAng), st = sin(drapeAng);
    lr = vec3(lr.x * ct - lr.z * st, lr.y, lr.x * st + lr.z * ct);

    /* sparse dot pattern — iki restraint: fewer, smaller dots */
    float freq = uDotFreq + 0.08 * sin(uTime * 0.12);
    float dot  = polkaDot(lr, freq, uDotRad);

    /* iki stripe overlay — vertical rhythm */
    float stripe = ikiStripe(lr);

    /* iki palette: sumi ink body, warm amber accents on dots (tension of cool/warm) */
    vec3 sumiBase   = vec3(0.14, 0.13, 0.16);    /* warm near-black    */
    vec3 inkBody    = vec3(0.52, 0.50, 0.54);     /* grey ink wash      */
    vec3 amberDot   = vec3(0.72, 0.45, 0.18);     /* restrained amber   */
    vec3 deepViolet = vec3(0.28, 0.18, 0.32);     /* murasaki undertone */

    /* surface: ink wash with subtle stripe modulation */
    vec3 surfaceCol = mix(inkBody, sumiBase, stripe * 0.4);

    /* dots carry amber warmth — iki's signature tension */
    vec3 dotCol = mix(amberDot, deepViolet, sin(seed * 30.0 + uTime * 0.08) * 0.5 + 0.5);
    vCol = mix(surfaceCol, dotCol, dot * 0.85);

    /* reconstruct world position */
    vec3 off = rest - localR * sc;
    vec3 p = lr * sc + off;

    /* iki breathing — subtler than parent, almost imperceptible */
    vec3 dir = normalize(lr + 0.001);
    p += dir * sin(t) * 0.018 * sc;

    /* iki rising: dot-positive particles drift upward like incense smoke */
    /* replaces selcouth's outward detachment with vertical ascent */
    float riseChance = step(0.90, seed) * dot;
    float risePhase = sin(uTime * 0.14 + seed * 9.42) * 0.5 + 0.5;
    float riseDist = riseChance * risePhase * 3.2 * sc;
    p.y += riseDist;
    /* slight horizontal drift as they rise — incense curl */
    p.x += riseChance * sin(uTime * 0.22 + seed * 18.0) * 0.4 * sc * risePhase;
    vRise = riseChance * risePhase;
    vGlow = vRise;

    /* rising particles fade to warm amber glow */
    vCol = mix(vCol, vec3(0.82, 0.58, 0.22), vRise * 0.7);

    /* assembly reveal — spiral inward (inherited) */
    float angle = seed * 6.2831 * 4.0;
    float radius = 50.0 + seed * 30.0;
    vec3 entry = vec3(cos(angle) * radius, sin(seed * 20.0) * 25.0, sin(angle) * radius);
    float reveal = smoothstep(0.0, 1.0, uReady);
    p = mix(entry, p, reveal);

    /* iki: slightly lower base alpha for restraint, dots and risers stand out more */
    vAlpha = reveal * (0.65 + 0.30 * dot + 0.30 * vRise);

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float camDist = -mv.z;
    /* iki: smaller base points, rising particles get elongated glow */
    float baseSz = (1.3 + 0.5 * dot + 1.5 * vRise) * uPixel * (42.0 / max(camDist, 1.0)) * reveal;
    gl_PointSize = max(1.0, baseSz);
    gl_Position  = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying vec3  vCol;
  varying float vAlpha;
  varying float vGlow;
  varying float vRise;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d);
    if (r2 > 0.25) discard;
    /* rising particles get softer, more diffuse edge — incense quality */
    float edge = mix(0.05, 0.18, vRise);
    float a = smoothstep(0.25, edge, r2) * vAlpha;
    /* subtle warm additive for risers */
    vec3 col = vCol * (1.0 + vGlow * 0.3);
    gl_FragColor = vec4(col * a, a);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  blending: THREE.NormalBlending,
  vertexShader,
  fragmentShader
});

const geom   = new THREE.BufferGeometry();
const points  = new THREE.Points(geom, mat);
scene.add(points);

/* ── ground plane: iki — minimal ink-wash floor with faint vertical line echoes ── */
const floorGeo = new THREE.PlaneGeometry(200, 200, 1, 1);
floorGeo.rotateX(-Math.PI / 2);
const floorMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  uniforms: { uTime: uniforms.uTime, uReady: uniforms.uReady },
  vertexShader: `
    varying vec3 vWPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uReady;
    varying vec3 vWPos;
    void main() {
      /* iki floor: near-invisible vertical line rhythm */
      float line = sin(vWPos.x * 0.6 + uTime * 0.03) * 0.5 + 0.5;
      line = smoothstep(0.46, 0.54, line);
      /* sparse dots echoing the figures above */
      float freq = 0.14;
      vec2 cell = fract(vWPos.xz * freq + 0.5) - 0.5;
      float d = length(cell);
      float dot = 1.0 - smoothstep(0.18, 0.24, d);
      /* sumi ink floor with faint amber dot warmth */
      vec3 col = vec3(0.04, 0.035, 0.055);
      col += vec3(0.06, 0.04, 0.02) * dot;
      col += vec3(0.015, 0.012, 0.025) * line;
      float fade = smoothstep(100.0, 25.0, length(vWPos.xz));
      gl_FragColor = vec4(col, fade * 0.22 * uReady);
    }
  `
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -8.5;
scene.add(floor);

/* ── load Stanford Lucy ── */
const loadingEl = document.getElementById('loading');
let revealStart = 0;

new PLYLoader().load(
  'https://threejs.org/examples/models/ply/binary/Lucy100k.ply',
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size   = bb.getSize(new THREE.Vector3());
    const baseScale = 15 / Math.max(size.x, size.y, size.z);
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(baseScale, baseScale, baseScale);

    const mesh    = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp     = new THREE.Vector3();

    let idx = 0;
    for (let c = 0; c < COPIES; c++) {
      const count = c === 0 ? PER_CENTER : PER_RING;
      const s   = copyScales[c];
      const off = copyOffsets[c];
      for (let i = 0; i < count; i++) {
        sampler.sample(tmp);
        const lx = tmp.x * s, ly = tmp.y * s, lz = tmp.z * s;
        localRest[idx * 3]     = lx;
        localRest[idx * 3 + 1] = ly;
        localRest[idx * 3 + 2] = lz;
        restPositions[idx * 3]     = lx + off.x;
        restPositions[idx * 3 + 1] = ly + off.y;
        restPositions[idx * 3 + 2] = lz + off.z;
        seedsArr[idx] = Math.random();
        scaleArr[idx] = s;
        idx++;
      }
    }

    const posArr = new Float32Array(N * 3);
    geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('localR',   new THREE.BufferAttribute(localRest, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seedsArr, 1));
    geom.setAttribute('sc',       new THREE.BufferAttribute(scaleArr, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      loadingEl.textContent = `loading lucy · ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  () => { loadingEl.textContent = 'load failed — check network'; }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ── */
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3500);
  }

  /* camera: iki — slower, more deliberate orbit; lower angle for composure */
  const orbitR = 28 + 4 * Math.sin(t * 0.04);
  const angle  = t * 0.035;
  const camY   = 3.5 + 3.0 * Math.sin(t * 0.04) + 1.0 * Math.sin(t * 0.017);
  camera.position.set(Math.sin(angle) * orbitR, camY, Math.cos(angle) * orbitR);
  camera.lookAt(0, 0.8, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
