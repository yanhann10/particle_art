<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eyk · suminagashi marbling (fluid dye advection)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede1; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#3a3a3a; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; color:#3a3a3a; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#3a3a3a; }
</style>
</head>
<body>
<div class="id">eyk</div>
<div class="hint">move pointer to drag ink</div>
<div class="src">suminagashi · semi-lagrangian advection</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Suminagashi paper marbling as a 2D Eulerian dye advection system.
// Two fields: velocity (u,v) and dye (r,g,b). User pointer drags the surface.
// Semi-Lagrangian advection keeps sharp boundaries (no diffusion).
// Concentric rings dropped at startup, then camera motion combs them into waves.

const W = 512, H = 512;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede1, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { 
  type: THREE.HalfFloatType, 
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter, 
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping, 
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false 
};

let velA = new THREE.WebGLRenderTarget(W, H, rtParams);
let velB = new THREE.WebGLRenderTarget(W, H, rtParams);
let dyeA = new THREE.WebGLRenderTarget(W, H, rtParams);
let dyeB = new THREE.WebGLRenderTarget(W, H, rtParams);

// Initialize dye field with concentric rings (suminagashi style)
const initDye = new Float32Array(W * H * 4);
const centers = [
  { x: 0.3, y: 0.4, col: [0.1, 0.1, 0.15] },
  { x: 0.7, y: 0.6, col: [0.15, 0.12, 0.12] },
  { x: 0.5, y: 0.3, col: [0.08, 0.10, 0.14] },
  { x: 0.4, y: 0.7, col: [0.12, 0.08, 0.10] },
  { x: 0.6, y: 0.5, col: [0.14, 0.14, 0.16] }
];
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    const px = x / W, py = y / H;
    let r = 0.96, g = 0.93, b = 0.88; // cream paper base
    
    for (const c of centers) {
      const dx = px - c.x, dy = py - c.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const ringCount = 8;
      for (let ring = 0; ring < ringCount; ring++) {
        const radius = (ring + 0.5) * 0.04;
        const thickness = 0.006;
        if (Math.abs(dist - radius) < thickness) {
          const fade = 1.0 - Math.abs(dist - radius) / thickness;
          r = r * (1 - fade) + c.col[0] * fade;
          g = g * (1 - fade) + c.col[1] * fade;
          b = b * (1 - fade) + c.col[2] * fade;
        }
      }
    }
    
    initDye[i] = r;
    initDye[i+1] = g;
    initDye[i+2] = b;
    initDye[i+3] = 1.0;
  }
}
const dyeTex = new THREE.DataTexture(initDye, W, H, THREE.RGBAFormat, THREE.FloatType);
dyeTex.needsUpdate = true;

// Blit init dye to dyeA
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: dyeTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(dyeA); 
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// Advection shader (semi-Lagrangian)
const advectMat = new THREE.ShaderMaterial({
  uniforms: {
    field: { value: null },
    velocity: { value: null },
    dt: { value: 0.016 },
    res: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D field;
    uniform sampler2D velocity;
    uniform float dt;
    uniform vec2 res;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(velocity, vUv).xy;
      vec2 back = vUv - vel * dt;
      gl_FragColor = texture2D(field, back);
    }
  `
});
const advectScene = new THREE.Scene();
advectScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), advectMat));

// Add impulse to velocity field (Gaussian splat)
const impulseMat = new THREE.ShaderMaterial({
  uniforms: {
    prev: { value: null },
    center: { value: new THREE.Vector2(0.5, 0.5) },
    force: { value: new THREE.Vector2(0, 0) },
    radius: { value: 0.04 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform vec2 center;
    uniform vec2 force;
    uniform float radius;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(prev, vUv).xy;
      vec2 d = vUv - center;
      float dist = length(d);
      float gauss = exp(-dist * dist / (radius * radius));
      vel += force * gauss;
      vel *= 0.985; // mild decay
      gl_FragColor = vec4(vel, 0.0, 1.0);
    }
  `
});
const impulseScene = new THREE.Scene();
impulseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), impulseMat));

// Display scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 2, 6);
camera.lookAt(0, 0, 0);

const displayGeom = new THREE.PlaneGeometry(5, 5, 1, 1);
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    dye: { value: dyeA.texture }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dye;
    varying vec2 vUv;
    void main(){
      vec3 col = texture2D(dye, vUv).rgb;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const displayMesh = new THREE.Mesh(displayGeom, displayMat);
displayMesh.rotation.x = -0.15;
scene.add(displayMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pointer tracking
let pointerPos = { x: 0.5, y: 0.5 };
let pointerPrev = { x: 0.5, y: 0.5 };
let pointerDown = false;

addEventListener('pointerdown', (e) => {
  pointerDown = true;
  pointerPos.x = e.clientX / innerWidth;
  pointerPos.y = 1.0 - e.clientY / innerHeight;
  pointerPrev.x = pointerPos.x;
  pointerPrev.y = pointerPos.y;
});

addEventListener('pointerup', () => {
  pointerDown = false;
});

addEventListener('pointermove', (e) => {
  if (pointerDown) {
    pointerPrev.x = pointerPos.x;
    pointerPrev.y = pointerPos.y;
    pointerPos.x = e.clientX / innerWidth;
    pointerPos.y = 1.0 - e.clientY / innerHeight;
  }
});

// Automated combing forces (gentle waves)
function applyAutoComb(t) {
  const freq = 0.0003;
  const amp = 0.0002;
  const centers = [
    { x: 0.3 + Math.sin(t * freq) * 0.1, y: 0.5 + Math.cos(t * freq * 1.3) * 0.1 },
    { x: 0.7 + Math.sin(t * freq * 1.7) * 0.08, y: 0.5 + Math.cos(t * freq * 0.9) * 0.12 }
  ];
  
  for (const c of centers) {
    impulseMat.uniforms.prev.value = velA.texture;
    impulseMat.uniforms.center.value.set(c.x, c.y);
    const angle = t * freq * 5;
    impulseMat.uniforms.force.value.set(Math.cos(angle) * amp, Math.sin(angle) * amp);
    impulseMat.uniforms.radius.value = 0.06;
    
    renderer.setRenderTarget(velB);
    renderer.render(impulseScene, camOrtho);
    let tmp = velA; velA = velB; velB = tmp;
  }
}

let t0 = performance.now();

function loop(){
  const now = performance.now();
  const t = now - t0;
  
  // Apply pointer drag force
  if (pointerDown) {
    const dx = pointerPos.x - pointerPrev.x;
    const dy = pointerPos.y - pointerPrev.y;
    if (dx !== 0 || dy !== 0) {
      impulseMat.uniforms.prev.value = velA.texture;
      impulseMat.uniforms.center.value.set(pointerPos.x, pointerPos.y);
      impulseMat.uniforms.force.value.set(dx * 0.5, dy * 0.5);
      impulseMat.uniforms.radius.value = 0.05;
      
      renderer.setRenderTarget(velB);
      renderer.render(impulseScene, camOrtho);
      let tmp = velA; velA = velB; velB = tmp;
    }
  }
  
  // Apply automated combing
  applyAutoComb(t);
  
  // Advect velocity (self-advection)
  advectMat.uniforms.field.value = velA.texture;
  advectMat.uniforms.velocity.value = velA.texture;
  advectMat.uniforms.dt.value = 0.6;
  renderer.setRenderTarget(velB);
  renderer.render(advectScene, camOrtho);
  let tmp = velA; velA = velB; velB = tmp;
  
  // Advect dye
  advectMat.uniforms.field.value = dyeA.texture;
  advectMat.uniforms.velocity.value = velA.texture;
  advectMat.uniforms.dt.value = 0.6;
  renderer.setRenderTarget(dyeB);
  renderer.render(advectScene, camOrtho);
  tmp = dyeA; dyeA = dyeB; dyeB = tmp;
  
  // Update display
  displayMat.uniforms.dye.value = dyeA.texture;
  
  // Gentle camera sway
  const sway = t * 0.00008;
  camera.position.x = Math.sin(sway) * 0.8;
  camera.position.y = 2 + Math.cos(sway * 1.3) * 0.3;
  camera.lookAt(0, 0, 0);
  
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
