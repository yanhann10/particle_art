<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES) {
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0, 1, 0);
  const L = new THREE.Vector3(-1, 0, 0);
  const U = new THREE.Vector3(0, 0, 1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, -7, 0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(depthFactor, gen);
        const nextPos = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: nextPos.clone(), gen });
        pos = nextPos;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen;
        break;
      }
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b, 0);
  const positions = new Float32Array(totalN * 3);
  const seeds     = new Float32Array(totalN);
  const gens      = new Float32Array(totalN);
  const lengths   = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;
  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length - 1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5) * jitter;
      v.y += (Math.random()-0.5) * jitter;
      v.z += (Math.random()-0.5) * jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written]   = Math.random();
      gens[written]    = segments[i].gen;
      lengths[written] = t;
      written++;
    }
  }
  return { positions, seeds, gens, lengths };
}

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 4, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

const N = 80000;
let geom, points;

/* ── tree material with Kusama infection ── */
const treeUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uBurst: { value: 0 },       // 0→1 = Kusama takeover
  uBurstWaveY: { value: -10 }, // bottom-up wave front y position
};

const treeMat = new THREE.ShaderMaterial({
  uniforms: treeUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uBurst;
    uniform float uBurstWaveY;
    attribute float seed;
    attribute float gen;
    attribute float lengthT;
    varying vec3 vCol;
    varying float vGen;
    varying float vEnergy;
    varying float vDot;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      float sway = 0.06 * gen * (0.5 + 0.5*sin(t * 0.7));
      p.x += sway * sin(t + p.y * 0.3);
      p.z += sway * cos(t * 0.9 + p.y * 0.3);

      vec3 entry = vec3(seed*4.0 - 2.0, 25.0 + seed*8.0, seed*4.0 - 2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vGen = gen;
      vEnergy = 0.5 + 0.5 * sin(t * 0.5);

      // Kusama infection: bottom-up wave — particles below wave front turn red
      float waveDist = p.y - uBurstWaveY;
      float infect = uBurst * smoothstep(2.0, -0.5, waveDist);
      // hash-select ~40% of particles to become polka dots (not all — Kusama is selective)
      float dotSelect = step(0.6, fract(seed * 127.53 + gen * 31.17));
      vDot = infect * dotSelect;

      // normal tree palette
      vec3 a = vec3(0.45, 0.30, 0.20);
      vec3 b = vec3(0.42, 0.62, 0.35);
      vec3 c = vec3(0.85, 0.95, 0.55);
      float k = clamp(gen * 0.18, 0.0, 1.0);
      vec3 treeCol = mix(a, b, k);
      treeCol = mix(treeCol, c, smoothstep(0.65, 1.0, k));

      // Kusama red
      vec3 kusamaRed = vec3(0.92, 0.12, 0.15);
      vCol = mix(treeCol, kusamaRed, vDot);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // infected dots swell to polka-dot size
      float dotScale = mix(1.0, 2.2, vDot);
      gl_PointSize = dotScale * (1.0 + 0.7*vEnergy) * uPixel * (40.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vGen;
    varying float vEnergy;
    varying float vDot;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // infected dots: hard-edged circles (Kusama style); normal: soft glow
      float softA = exp(-r * 17.0) * (0.55 + 0.45*vEnergy);
      float hardA = smoothstep(0.25, 0.20, r) * 0.9;
      float a = mix(softA, hardA, vDot);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

/* ── dot rain system (Kusama polka dots falling from sky) ── */
const DOT_N = 8000;
const dotGeom = new THREE.BufferGeometry();
const dotPos = new Float32Array(DOT_N * 3);
const dotSeed = new Float32Array(DOT_N);
const dotPhase = new Float32Array(DOT_N); // stagger fall start
for (let i = 0; i < DOT_N; i++){
  dotPos[i*3]   = (Math.random() - 0.5) * 16;
  dotPos[i*3+1] = 20 + Math.random() * 20;
  dotPos[i*3+2] = (Math.random() - 0.5) * 16;
  dotSeed[i] = Math.random();
  dotPhase[i] = Math.random();
}
dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
dotGeom.setAttribute('seed', new THREE.BufferAttribute(dotSeed, 1));
dotGeom.setAttribute('phase', new THREE.BufferAttribute(dotPhase, 1));

const dotUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBurst: { value: 0 },
  uBurstTime: { value: 0 }, // time since burst start
};

const dotMat = new THREE.ShaderMaterial({
  uniforms: dotUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBurst;
    uniform float uBurstTime;
    attribute float seed;
    attribute float phase;
    varying float vAlpha;
    varying float vSize;
    void main(){
      vec3 p = position;
      // each dot falls at its own staggered time
      float fallDelay = phase * 1.2;
      float fallT = max(0.0, uBurstTime - fallDelay);
      float speed = 6.0 + seed * 4.0;
      p.y -= fallT * speed;
      // slight wobble
      p.x += sin(uTime * 2.0 + seed * 20.0) * 0.3;
      p.z += cos(uTime * 1.7 + seed * 15.0) * 0.3;

      // visible only during burst, fade in quickly, fade out after passing below tree
      vAlpha = uBurst * smoothstep(0.0, 0.3, fallT) * smoothstep(-12.0, -8.0, p.y);
      // hide if fallen too far
      if (p.y < -12.0) vAlpha = 0.0;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (80.0 / dist) * (0.8 + 0.4 * seed);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // hard-edged Kusama polka dot
      float a = smoothstep(0.25, 0.18, r) * 0.85 * vAlpha;
      vec3 col = vec3(0.92, 0.12, 0.15);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const dotPoints = new THREE.Points(dotGeom, dotMat);
scene.add(dotPoints);

/* ── regrow ── */
let revealStart = 0;

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str, 0.78);
  const bb = new THREE.Box3();
  for (const s of segs) { bb.expandByPoint(s.from); bb.expandByPoint(s.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const min = bb.min;
  for (const s of segs){
    s.from.x -= ctr.x; s.from.z -= ctr.z; s.from.y -= min.y - (-7);
    s.to.x   -= ctr.x; s.to.z   -= ctr.z; s.to.y   -= min.y - (-7);
  }
  const { positions, seeds, gens, lengths } = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('lengthT',  new THREE.BufferAttribute(lengths, 1));
    points = new THREE.Points(geom, treeMat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
    geom.attributes.lengthT.array.set(lengths);     geom.attributes.lengthT.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── burst cycle timing ──
   Kusama invasion: every 9s, burst lasts ~5s total
   0-1s: dots start raining, wave front rises from bottom
   1-3.5s: full infection hold — tree is polka-dotted, rain thick
   3.5-5s: fade out, tree recovers
*/
const CYCLE = 9.0;
const BURST_DURATION = 5.0;
const RAIN_LEAD = 0.3;   // rain starts slightly before infection
const WAVE_SPEED = 8.0;  // y-units per second the infection wave travels
const TREE_BOTTOM = -7.0;
const TREE_TOP = 12.0;

function burstEnvelope(cycleT) {
  // cycleT is 0..BURST_DURATION within the burst window
  // ramp up 0-1s, hold 1-3.5s, fade 3.5-5s
  if (cycleT < 1.0) return smoothstep(0, 1, cycleT);
  if (cycleT < 3.5) return 1.0;
  return 1.0 - smoothstep(3.5, BURST_DURATION, cycleT);
}

function smoothstep(lo, hi, x) {
  const t = Math.max(0, Math.min(1, (x - lo) / (hi - lo)));
  return t * t * (3 - 2 * t);
}

function resetDotRain() {
  for (let i = 0; i < DOT_N; i++){
    dotPos[i*3]   = (Math.random() - 0.5) * 16;
    dotPos[i*3+1] = 18 + Math.random() * 18;
    dotPos[i*3+2] = (Math.random() - 0.5) * 16;
    dotSeed[i] = Math.random();
    dotPhase[i] = Math.random();
  }
  dotGeom.attributes.position.needsUpdate = true;
  dotGeom.attributes.seed.needsUpdate = true;
  dotGeom.attributes.phase.needsUpdate = true;
}

const start = performance.now();
let lastCycleIndex = -1;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  treeUniforms.uTime.value = elapsed;
  dotUniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    treeUniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }

  // burst cycle — first burst at t=3s so the tree is visible first
  const shifted = elapsed - 3.0;
  const cycleIndex = Math.floor(shifted / CYCLE);
  const cycleT = shifted - cycleIndex * CYCLE;

  // reset rain particles at start of each new burst
  if (cycleIndex !== lastCycleIndex && cycleIndex >= 0) {
    resetDotRain();
    lastCycleIndex = cycleIndex;
  }

  let burst = 0;
  let burstTime = 0;
  let waveY = TREE_BOTTOM - 5;

  if (shifted >= 0 && cycleT < BURST_DURATION) {
    burst = burstEnvelope(cycleT);
    burstTime = Math.max(0, cycleT - RAIN_LEAD);
    // wave front rises from bottom to top over ~2.5s
    waveY = TREE_BOTTOM + (cycleT - 0.3) * WAVE_SPEED;
    waveY = Math.min(waveY, TREE_TOP + 5);
  }

  treeUniforms.uBurst.value = burst;
  treeUniforms.uBurstWaveY.value = waveY;
  dotUniforms.uBurst.value = burst;
  dotUniforms.uBurstTime.value = burstTime;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
