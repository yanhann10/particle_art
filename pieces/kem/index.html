<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>kem · human unreadable duet</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .seed { position:fixed; left:14px; bottom:30px; opacity:0.12; font-size:8px; letter-spacing:0.12em; color:#cdd2dc;
          font-family: ui-monospace, monospace; word-break:break-all; max-width:280px; z-index:10; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">kem</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Operator · Human Unreadable · hash-seeded duet · F. Gonzalez-Torres register</div>
<div class="seed" id="seedLabel"></div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Human Unreadable Duet — two paired figures (the absent lover)
   rendered as spring-coupled joint-skeletons, choreography seeded
   from a 256-bit hash. Each dance is unique, provably derived,
   unrepeatable. Particles cluster along limbs as warm incandescent
   light — Gonzalez-Torres' string-of-lights vocabulary carried
   into choreographic space. Slowness > speed. Intimacy > spectacle. */

const BG = 0x0a0807;

// --- generate 256-bit seed ---
const seedBytes = new Uint8Array(32);
crypto.getRandomValues(seedBytes);
const SEED_HEX = Array.from(seedBytes, b => b.toString(16).padStart(2,'0')).join('');
document.getElementById('seedLabel').textContent = '0x' + SEED_HEX;

// seeded PRNG from hash
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let seedInt = 0;
for (let i = 0; i < 4; i++) seedInt = (seedInt << 8) | seedBytes[i];
const rng = mulberry32(seedInt);

// scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1.5, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.5, 0);

// --- skeleton definition ---
// joints: 0-head, 1-neck, 2-Lshoulder, 3-Rshoulder, 4-Lelbow, 5-Relbow,
//         6-Lhand, 7-Rhand, 8-spine, 9-hips, 10-Lknee, 11-Rknee, 12-Lfoot, 13-Rfoot
const BONES = [
  [0,1],[1,2],[1,3],[2,4],[3,5],[4,6],[5,7],
  [1,8],[8,9],[9,10],[9,11],[10,12],[11,13]
];
const REST_Y = [1.7, 1.5, 1.45, 1.45, 1.2, 1.2, 0.95, 0.95, 1.15, 0.85, 0.5, 0.5, 0.05, 0.05];
const REST_X = [0, 0, -0.2, 0.2, -0.35, 0.35, -0.45, 0.45, 0, 0, -0.12, 0.12, -0.15, 0.15];
const NJ = 14;

function makeFigure(offsetX, mirror) {
  const joints = [];
  const phases = [];
  const amps = [];
  const freqs = [];
  for (let j = 0; j < NJ; j++) {
    const rx = REST_X[j] * (mirror ? -1 : 1);
    joints.push({
      x: rx + offsetX, y: REST_Y[j], z: 0,
      vx: 0, vy: 0, vz: 0,
      restX: rx, restY: REST_Y[j], restZ: 0
    });
    // seed-derived motion parameters
    phases.push(rng() * Math.PI * 2);
    amps.push(0.06 + rng() * 0.18);    // gentle amplitudes
    freqs.push(0.15 + rng() * 0.25);   // slow frequencies
  }
  return { joints, phases, amps, freqs, offsetX };
}

// two figures, close together — the paired form
const figA = makeFigure(-1.2, false);
const figB = makeFigure(1.2, true);

// seed-derived orbit parameters for the pair
const orbitRadius = 0.4 + rng() * 0.6;
const orbitFreq = 0.03 + rng() * 0.04;  // very slow
const approachPhase = rng() * Math.PI * 2;
const approachAmp = 0.5 + rng() * 0.8;
const approachFreq = 0.015 + rng() * 0.02;

// spring constants
const SPRING_BONE = 0.04;
const SPRING_REST = 0.015;
const DAMP = 0.92;

function stepFigure(fig, t, centerX) {
  const { joints, phases, amps, freqs } = fig;
  // choreographic forces from seed
  for (let j = 0; j < NJ; j++) {
    const jt = joints[j];
    // sinusoidal drive — the "dance"
    const px = Math.sin(t * freqs[j] + phases[j]) * amps[j];
    const py = Math.sin(t * freqs[j] * 1.3 + phases[j] + 1.0) * amps[j] * 0.5;
    const pz = Math.cos(t * freqs[j] * 0.7 + phases[j] + 2.0) * amps[j] * 0.6;
    // spring toward rest + drive
    const targetX = jt.restX + centerX + px;
    const targetY = jt.restY + py;
    const targetZ = jt.restZ + pz;
    jt.vx += (targetX - jt.x) * SPRING_REST;
    jt.vy += (targetY - jt.y) * SPRING_REST;
    jt.vz += (targetZ - jt.z) * SPRING_REST;
  }
  // bone spring constraints
  for (const [a, b] of BONES) {
    const ja = joints[a], jb = joints[b];
    const dx = jb.x - ja.x, dy = jb.y - ja.y, dz = jb.z - ja.z;
    const restDx = (jb.restX - ja.restX);
    const restDy = (jb.restY - ja.restY);
    const restDz = 0;
    const fx = (dx - restDx) * SPRING_BONE;
    const fy = (dy - restDy) * SPRING_BONE;
    const fz = (dz - restDz) * SPRING_BONE;
    ja.vx += fx; ja.vy += fy; ja.vz += fz;
    jb.vx -= fx; jb.vy -= fy; jb.vz -= fz;
  }
  // integrate
  for (let j = 0; j < NJ; j++) {
    const jt = joints[j];
    jt.vx *= DAMP; jt.vy *= DAMP; jt.vz *= DAMP;
    jt.x += jt.vx; jt.y += jt.vy; jt.z += jt.vz;
  }
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

// --- particles: 40k warm bulbs along skeleton limbs ---
const N_RENDER = 40000;
const N_PER_FIG = N_RENDER / 2;
const rPos = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = rng();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age', new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor: { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.028 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;
      float t = uTime * 0.25 + seed * 6.28;
      p.x += sin(t) * 0.004 * (1.0 + seed);
      p.z += cos(t * 0.7) * 0.003;
      p.y += sin(t * 1.1 + 1.0) * 0.002;

      float pulse = 0.82 + 0.18 * sin(uTime * 0.8 + seed * 50.0);

      // warm filament palette: amber → peach → soft white
      vec3 amber = vec3(1.0, 0.70, 0.30);
      vec3 peach = vec3(1.0, 0.82, 0.62);
      vec3 blush = vec3(1.0, 0.90, 0.82);
      float k = age;
      vCol = mix(amber, peach, smoothstep(0.0, 0.5, k));
      vCol = mix(vCol, blush, smoothstep(0.5, 1.0, k) * 0.4);
      vCol *= pulse;

      // joints brighter (age=1), limb midpoints dimmer (age=0.5)
      vAlpha = 0.35 + 0.25 * pulse * (0.6 + 0.4 * age);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + age * 0.8) * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 28.0);
      float halo = exp(-r * 6.0) * 0.3;
      float a = (core + halo) * vAlpha;
      vec3 col = mix(vCol, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// thin wire lines for each figure's skeleton
function makeWire() {
  const wg = new THREE.BufferGeometry();
  const wp = new Float32Array(BONES.length * 6);
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  const wm = new THREE.LineSegments(wg, new THREE.LineBasicMaterial({
    color: 0x2a2018, transparent: true, opacity: 0.18
  }));
  scene.add(wm);
  return { geom: wg, pos: wp, mesh: wm };
}
const wireA = makeWire();
const wireB = makeWire();

function updateWire(wire, fig) {
  for (let i = 0; i < BONES.length; i++) {
    const [a, b] = BONES[i];
    const ja = fig.joints[a], jb = fig.joints[b];
    wire.pos[i*6]   = ja.x; wire.pos[i*6+1] = ja.y; wire.pos[i*6+2] = ja.z;
    wire.pos[i*6+3] = jb.x; wire.pos[i*6+4] = jb.y; wire.pos[i*6+5] = jb.z;
  }
  wire.geom.attributes.position.needsUpdate = true;
}

// reaching threads between figures — 4-6 faint lines connecting nearest joints
const reachGeom = new THREE.BufferGeometry();
const REACH_N = 5;
const reachPos = new Float32Array(REACH_N * 6);
reachGeom.setAttribute('position', new THREE.BufferAttribute(reachPos, 3));
const reachMat = new THREE.LineSegments(reachGeom, new THREE.LineBasicMaterial({
  color: 0x3a2a1a, transparent: true, opacity: 0.10
}));
scene.add(reachMat);

// pairs that reach: hands, head, elbows
const REACH_PAIRS = [[6,7],[7,6],[0,0],[4,5],[5,4]]; // figA joint → figB joint

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-step to settle springs
const preT0 = -20;
for (let s = 0; s < 300; s++) {
  const pt = preT0 + s * 0.033;
  const angle = pt * orbitFreq;
  const sep = approachAmp * (0.5 + 0.5 * Math.sin(pt * approachFreq + approachPhase));
  const cxA = -sep * 0.5 + Math.cos(angle) * orbitRadius * 0.5;
  const czA = Math.sin(angle) * orbitRadius * 0.3;
  const cxB = sep * 0.5 - Math.cos(angle) * orbitRadius * 0.5;
  const czB = -Math.sin(angle) * orbitRadius * 0.3;
  figA.offsetX = cxA; figB.offsetX = cxB;
  stepFigure(figA, pt, cxA);
  stepFigure(figB, pt, cxB);
  // update restZ for depth
  for (let j = 0; j < NJ; j++) {
    figA.joints[j].restZ = czA;
    figB.joints[j].restZ = czB;
  }
}

function distributeParticles(fig, offset) {
  // compute bone lengths
  const boneLens = [];
  let total = 0;
  for (const [a, b] of BONES) {
    const ja = fig.joints[a], jb = fig.joints[b];
    const L = Math.hypot(jb.x-ja.x, jb.y-ja.y, jb.z-ja.z);
    boneLens.push(L);
    total += L;
  }
  // also add joint halo particles
  let written = 0;
  const limit = N_PER_FIG;
  // 30% at joints as halos
  const jointShare = Math.floor(limit * 0.3);
  const perJoint = Math.floor(jointShare / NJ);
  for (let j = 0; j < NJ && written < limit; j++) {
    const jt = fig.joints[j];
    for (let k = 0; k < perJoint && written < limit; k++) {
      const spread = 0.06;
      const idx = (offset + written) * 3;
      rPos[idx]   = jt.x + (rSeeds[offset+written]-0.5) * spread;
      rPos[idx+1] = jt.y + (rSeeds[(offset+written+7)%N_RENDER]-0.5) * spread * 0.8;
      rPos[idx+2] = jt.z + (rSeeds[(offset+written+13)%N_RENDER]-0.5) * spread;
      rAge[offset+written] = 0.8 + rSeeds[offset+written] * 0.2;
      written++;
    }
  }
  // 70% along bones
  if (total > 0) {
    for (let i = 0; i < BONES.length && written < limit; i++) {
      const [a, b] = BONES[i];
      const share = (i === BONES.length-1)
        ? limit - written
        : Math.max(1, Math.floor((limit - jointShare) * boneLens[i] / total));
      const ja = fig.joints[a], jb = fig.joints[b];
      for (let k = 0; k < share && written < limit; k++) {
        const u = rSeeds[offset+written];
        const spread = 0.025;
        const idx = (offset + written) * 3;
        rPos[idx]   = ja.x + (jb.x-ja.x)*u + (rSeeds[(offset+written+3)%N_RENDER]-0.5)*spread;
        rPos[idx+1] = ja.y + (jb.y-ja.y)*u + (rSeeds[(offset+written+5)%N_RENDER]-0.5)*spread*0.5;
        rPos[idx+2] = ja.z + (jb.z-ja.z)*u + (rSeeds[(offset+written+9)%N_RENDER]-0.5)*spread;
        rAge[offset+written] = 0.3 + u * 0.4;
        written++;
      }
    }
  }
}

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (!paused) {
    // orbit and approach — slow intimate circling
    const angle = t * orbitFreq;
    const sep = approachAmp * (0.5 + 0.5 * Math.sin(t * approachFreq + approachPhase));
    const cxA = -sep * 0.5 + Math.cos(angle) * orbitRadius * 0.5;
    const czA = Math.sin(angle) * orbitRadius * 0.3;
    const cxB = sep * 0.5 - Math.cos(angle) * orbitRadius * 0.5;
    const czB = -Math.sin(angle) * orbitRadius * 0.3;

    for (let j = 0; j < NJ; j++) {
      figA.joints[j].restZ = czA;
      figB.joints[j].restZ = czB;
    }

    for (let s = 0; s < 2; s++) {
      stepFigure(figA, t, cxA);
      stepFigure(figB, t, cxB);
    }
  }

  // distribute particles
  distributeParticles(figA, 0);
  distributeParticles(figB, N_PER_FIG);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;

  // wires
  updateWire(wireA, figA);
  updateWire(wireB, figB);

  // reaching threads
  for (let i = 0; i < REACH_N; i++) {
    const [ja, jb] = REACH_PAIRS[i];
    const fa = figA.joints[ja], fb = figB.joints[jb];
    reachPos[i*6]   = fa.x; reachPos[i*6+1] = fa.y; reachPos[i*6+2] = fa.z;
    reachPos[i*6+3] = fb.x; reachPos[i*6+4] = fb.y; reachPos[i*6+5] = fb.z;
  }
  reachGeom.attributes.position.needsUpdate = true;

  // camera tracks centroid
  let cx=0, cy=0, cz=0;
  for (let j = 0; j < NJ; j++) {
    cx += figA.joints[j].x + figB.joints[j].x;
    cy += figA.joints[j].y + figB.joints[j].y;
    cz += figA.joints[j].z + figB.joints[j].z;
  }
  cx /= NJ*2; cy /= NJ*2; cz /= NJ*2;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);

  statEl.textContent = `seed=${SEED_HEX.slice(0,12)}…${paused?' · paused':''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
