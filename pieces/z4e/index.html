<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z4e · fern frond assemblage</title>
<!-- MOTION: breathe, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">z4e</div>
<div class="hint">microphone breathes the fronds · drag to orbit</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── FFT / Microphone ── */
const fft = new Float32Array(5);
let analyser = null, dataArray = null, micActive = false;

function synthFFT(t) {
  fft[0] = 0.35 + 0.25 * Math.sin(t * 0.31);
  fft[1] = 0.30 + 0.20 * Math.sin(t * 0.53 + 1.0);
  fft[2] = 0.25 + 0.15 * Math.sin(t * 0.97 + 2.0);
  fft[3] = 0.15 + 0.10 * Math.sin(t * 1.7  + 3.0);
  fft[4] = 0.10 + 0.08 * Math.sin(t * 2.3  + 4.0);
}

async function initMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    document.querySelector('.hint').textContent = 'mic active · drag to orbit';
  } catch(e) { /* fallback to synthetic */ }
}

function updateFFT(t) {
  if (micActive && analyser) {
    analyser.getByteFrequencyData(dataArray);
    const n = dataArray.length;
    const bandSize = Math.floor(n / 5);
    for (let b = 0; b < 5; b++) {
      let sum = 0;
      for (let i = b * bandSize; i < (b + 1) * bandSize && i < n; i++) sum += dataArray[i];
      fft[b] = (sum / bandSize) / 255.0;
    }
  } else {
    synthFFT(t);
  }
}

let micRequested = false;
addEventListener('click', () => {
  if (!micRequested) { micRequested = true; initMic(); }
});

/* ── SEEDED RNG (mulberry32) ── */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ── FERN FROND GEOMETRY: a central rachis with pairs of pinnae ── */
function buildFernFrond(rng, opts = {}) {
  const {
    rachisLength = 8.0,
    pinnaeCount  = 12,
    pinnaeLength = 2.5,
    pinnaeCurve  = 0.6,
    taper        = 0.7,
  } = opts;

  const positions = [];
  const normals   = [];
  const uvs       = [];
  const indices   = [];

  // Central rachis spine
  const spineSteps = 80;
  const spine = [];
  for (let i = 0; i <= spineSteps; i++) {
    const t = i / spineSteps;
    const x = 0;
    const y = rachisLength * t;
    const z = 0.05 * Math.sin(t * Math.PI * 2.5) * (1 - t * 0.5);
    spine.push(new THREE.Vector3(x, y, z));
  }

  // For each pinna pair along the rachis
  const pinnaStepY = rachisLength / (pinnaeCount + 1);
  for (let pi = 1; pi <= pinnaeCount; pi++) {
    const baseIdx = Math.floor((pi / (pinnaeCount + 1)) * spineSteps);
    const basePos = spine[baseIdx];
    const progress = pi / (pinnaeCount + 1);
    const shrink = 1.0 - progress * taper;
    const pLen = pinnaeLength * shrink;

    // Tangent at this point
    const nextIdx = Math.min(baseIdx + 1, spineSteps);
    const tang = new THREE.Vector3().subVectors(spine[nextIdx], spine[baseIdx]).normalize();
    const norm = new THREE.Vector3(-tang.z, 0, tang.x).normalize();

    // Build pinna on both sides
    for (const side of [-1, 1]) {
      const pinnaSegs = 18;
      const pinnaWidth = 0.4 * shrink;
      
      // Pinna curve: starts horizontal, curves slightly downward
      const angle = side * (Math.PI * 0.5 - 0.15);
      const ca = Math.cos(angle), sa = Math.sin(angle);
      
      const vStart = positions.length / 3;
      
      // Two strips: one for top surface, curve creates volume
      for (let j = 0; j <= pinnaSegs; j++) {
        const t = j / pinnaSegs;
        const localY = pLen * t;
        const curve = -0.3 * t * t * pLen * pinnaeCurve;
        const widthHere = pinnaWidth * Math.sin(t * Math.PI) * (1.0 + 0.2 * Math.sin(t * Math.PI * 3));
        
        for (let w of [-1, 1]) {
          const localX = w * widthHere;
          const wx = ca * localX - sa * (localY + curve);
          const wy = sa * localX + ca * (localY + curve);
          
          const px = basePos.x + norm.x * wx;
          const py = basePos.y + wy;
          const pz = basePos.z + norm.z * wx;
          
          positions.push(px, py, pz);
          normals.push(0, 0, side);
          uvs.push(w * 0.5 + 0.5, t);
        }
      }
      
      // Index the pinna strip
      for (let j = 0; j < pinnaSegs; j++) {
        const a = vStart + j * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;
        indices.push(a, c, b, b, c, d);
      }
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  
  return geometry;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c0e, 10, 45);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 6, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 4, 0);
controls.maxDistance = 35;
controls.minDistance = 8;

/* ── Ambient light (cool dusk) + warm key light ── */
const ambient = new THREE.AmbientLight(0x4a5c68, 0.4);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xc9a86a, 0.8);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x88b8a0, 0.3, 30);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

/* ── Frond assembly: 8 fronds at curated positions ── */
const rng = makeRng(42);
const fronds = [];

// Curated layout: foreground large, midground medium, background small
const frondData = [
  // close large fronds (warm lit)
  { pos: [-2.5, 0, 2], scale: 1.2, tilt: [0.1, 0, 0.15], hue: 0.28, band: 0 },
  { pos: [2.8, 0, 1.5], scale: 1.15, tilt: [-0.12, 0, -0.2], hue: 0.32, band: 1 },
  { pos: [0, 0, 3], scale: 1.0, tilt: [0.05, 0, 0.05], hue: 0.30, band: 2 },
  
  // midground fronds
  { pos: [-4, 0, -2], scale: 0.85, tilt: [0.08, 0, 0.1], hue: 0.26, band: 3 },
  { pos: [4.5, 0, -1.5], scale: 0.8, tilt: [-0.1, 0, -0.12], hue: 0.34, band: 4 },
  { pos: [0, 0, -3], scale: 0.75, tilt: [0, 0, 0], hue: 0.29, band: 1 },
  
  // background small fronds (cooler)
  { pos: [-6, 0, -6], scale: 0.55, tilt: [0.15, 0, 0.18], hue: 0.24, band: 2 },
  { pos: [5, 0, -7], scale: 0.5, tilt: [-0.08, 0, -0.1], hue: 0.25, band: 0 },
];

frondData.forEach((fd, i) => {
  const geom = buildFernFrond(rng, {
    rachisLength: 7.0 + rng() * 2.0,
    pinnaeCount: 10 + Math.floor(rng() * 4),
    pinnaeLength: 2.2 + rng() * 0.8,
    pinnaeCurve: 0.5 + rng() * 0.3,
    taper: 0.6 + rng() * 0.2,
  });

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:  { value: 0 },
      uBand:  { value: 0 },
      uHue:   { value: fd.hue },
      uDepth: { value: -fd.pos[2] / 10.0 }, // depth for color temperature
    },
    side: THREE.DoubleSide,
    transparent: true,
    vertexShader: `
      uniform float uTime;
      uniform float uBand;
      varying vec3 vPos;
      varying vec3 vNormal;
      varying vec2 vUv;
      varying float vDepth;

      void main() {
        vec3 p = position;
        
        // Gentle breathe motion: pinnae tips sway with audio
        float distFromBase = p.y / 8.0;
        float sway = distFromBase * uBand * 0.5;
        p.x += sway * sin(uTime * 1.2 + position.y * 0.4);
        p.z += sway * cos(uTime * 0.9 + position.y * 0.3);
        
        // Subtle up-down breathe
        p.y += distFromBase * uBand * 0.2 * sin(uTime * 1.5);
        
        vPos = (modelMatrix * vec4(p, 1.0)).xyz;
        vNormal = normalize(normalMatrix * normal);
        vUv = uv;
        vDepth = -vPos.z;
        
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uBand;
      uniform float uHue;
      uniform float uDepth;
      varying vec3 vPos;
      varying vec3 vNormal;
      varying vec2 vUv;
      varying float vDepth;

      vec3 hsl2rgb(float h, float s, float l) {
        vec3 rgb = clamp(abs(mod(h*6.0 + vec3(0.0,4.0,2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
        return l + s * (rgb - 0.5) * (1.0 - abs(2.0*l - 1.0));
      }

      void main() {
        // Base color: aged green-to-amber forest floor palette
        float h = mod(uHue + 0.02 * sin(vPos.y * 0.5 + uTime * 0.3), 1.0);
        // Cooler hue shift with depth (background → blue-green)
        h += uDepth * 0.05;
        
        float s = 0.35 + 0.15 * uBand - uDepth * 0.1;
        float l = 0.25 + 0.12 * (1.0 - vUv.y) + 0.08 * uBand;
        
        // Depth darkens background
        l -= uDepth * 0.15;
        
        vec3 col = hsl2rgb(h, s, l);
        
        // Edge glow at pinna tips (higher Y, higher U near edges)
        float tipGlow = smoothstep(0.6, 1.0, vUv.y) * smoothstep(0.4, 0.5, abs(vUv.x - 0.5));
        vec3 glowCol = vec3(0.72, 0.88, 0.65);
        col = mix(col, glowCol, tipGlow * uBand * 0.4);
        
        // Fresnel rim light
        vec3 viewDir = normalize(cameraPosition - vPos);
        float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 3.0);
        col += fresnel * vec3(0.6, 0.75, 0.55) * 0.2;
        
        // Fade alpha with depth
        float alpha = 0.85 - uDepth * 0.3;
        alpha *= smoothstep(0.0, 0.1, vUv.y); // fade base
        
        gl_FragColor = vec4(col, alpha);
      }
    `
  });

  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(fd.pos[0], fd.pos[1], fd.pos[2]);
  mesh.scale.setScalar(fd.scale);
  mesh.rotation.set(fd.tilt[0], fd.tilt[1], fd.tilt[2]);
  
  mesh.userData.band = fd.band;
  mesh.userData.mat = mat;
  
  scene.add(mesh);
  fronds.push(mesh);
});

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const smoothBand = new Float32Array(5);
const start = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;

  updateFFT(elapsed);

  for (let i = 0; i < 5; i++) {
    smoothBand[i] += (fft[i] - smoothBand[i]) * 0.08;
  }

  fronds.forEach(f => {
    f.userData.mat.uniforms.uTime.value = elapsed;
    f.userData.mat.uniforms.uBand.value = smoothBand[f.userData.band];
  });

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
<script src="/audio-reactive.js" defer></script>
</body>
