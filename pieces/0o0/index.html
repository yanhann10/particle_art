<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   Rosa Menkman – JPEG FROM A VERNACULAR OF FILE FORMATS
   Concept: the art-deco tower is the "intended image" being
   JPEG-decoded. Corruption wavefronts propagate across 8×8
   macroblock regions, and where they pass the cypress bleeds
   through — nature leaking from beneath the compression.
   Palette: ringing-artifact grays + chroma-subsampled
   magenta / cyan / yellow.
   ═══════════════════════════════════════════════════════════════ */

// ── scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

// ── repeatable RNG ──
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

// ── L-system cypress (pose A) ──
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, r) {
  let s = axiom;
  for (let d = 0; d < depth; d++) {
    let out = '';
    for (const ch of s) {
      if (ch in RULES) {
        const rv = r(); let acc = 0;
        for (const opt of RULES[ch]) { acc += opt.p; if (rv <= acc) { out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str) {
  const stack = [], segments = [];
  let pos = new THREE.Vector3(), h = new THREE.Vector3(0,1,0),
      l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1), gen = 0;
  const rot = (ax, a) => { const q = new THREE.Quaternion().setFromAxisAngle(ax, a);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q); };
  for (const ch of str) {
    switch (ch) {
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen }); pos = next; break; }
      case '+': rot(u, +ANGLE); break;  case '-': rot(u, -ANGLE); break;
      case '&': rot(l, +ANGLE); break;  case '^': rot(l, -ANGLE); break;
      case '/': rot(h, +ANGLE*1.5); break; case '\\': rot(h, -ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const cypressSegs = turtle(expand('F', 6, rng));

// ── art-deco tower (pose B) ──
function sampleArtDeco(N) {
  const out = new Float32Array(N * 3), pos = new THREE.Vector3();
  const tiers = [
    { hw:4.5, y0:0, y1:4, ridges:14 }, { hw:3.4, y0:4, y1:7.5, ridges:12 },
    { hw:2.4, y0:7.5, y1:10.5, ridges:10 }, { hw:1.5, y0:10.5, y1:13, ridges:8 },
    { hw:0.85, y0:13, y1:15, ridges:6 }
  ];
  const W = Math.floor(N*0.55), B = Math.floor(N*0.25), S = Math.floor(N*0.12), C = N-W-B-S;
  const tw = tiers.map(t=>8*t.hw*(t.y1-t.y0)), tot = tw.reduce((a,b)=>a+b,0);
  let i = 0;
  for (let ti = 0; ti < tiers.length; ti++) {
    const t = tiers[ti];
    const count = ti===tiers.length-1 ? W-i : Math.floor(tw[ti]/tot*W);
    for (let k = 0; k < count; k++) {
      const face = Math.floor(Math.random()*4);
      const r = Math.floor(Math.random()*t.ridges);
      const along = ((r+0.5)/t.ridges*2-1)*t.hw;
      const y = t.y0+Math.random()*(t.y1-t.y0);
      const j = 0.04;
      switch(face) {
        case 0: pos.set(t.hw+(Math.random()-.5)*j, y, along); break;
        case 1: pos.set(-t.hw+(Math.random()-.5)*j, y, along); break;
        case 2: pos.set(along, y, t.hw+(Math.random()-.5)*j); break;
        case 3: pos.set(along, y, -t.hw+(Math.random()-.5)*j); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k = 0; k < B; k++) {
    const ti = Math.floor(Math.random()*tiers.length), t = tiers[ti];
    const edge = Math.random()<0.6 ? t.y1 : t.y0, face = Math.floor(Math.random()*4);
    const along = (Math.random()*2-1)*t.hw, j = 0.02;
    switch(face) {
      case 0: pos.set(t.hw, edge+(Math.random()-.5)*j, along); break;
      case 1: pos.set(-t.hw, edge+(Math.random()-.5)*j, along); break;
      case 2: pos.set(along, edge+(Math.random()-.5)*j, t.hw); break;
      case 3: pos.set(along, edge+(Math.random()-.5)*j, -t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k = 0; k < S; k++) {
    const t = Math.random(), y = 15+t*5.5, r = 0.6*(1-t), th = Math.random()*Math.PI*2;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k = 0; k < C; k++) {
    const ch = Math.floor(Math.random()*16), th = (ch+.5)/16*Math.PI*2;
    const along = Math.random(), r = 0.7+along*1.3;
    const y = 14.6+along*0.8+(Math.random()-.5)*.05;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ── build particle buffers ──
const N = 70000;
const treePos = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

// cypress skeleton + foliage (same as parent)
const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const N_SKEL = Math.floor(N * 0.55);
let written = 0;
const v = new THREE.Vector3();

for (let i = 0; i < cypressSegs.length; i++) {
  const share = i===cypressSegs.length-1 ? N_SKEL-written : Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++) {
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const j = 0.05*Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]=v.x+(Math.random()-.5)*j;
    treePos[written*3+1]=v.y+(Math.random()-.5)*j;
    treePos[written*3+2]=v.z+(Math.random()-.5)*j;
    seeds[written]=Math.random(); written++;
  }
}

// foliage halo
{
  let yMin=Infinity, yMax=-Infinity;
  for (const s of cypressSegs) { yMin=Math.min(yMin,s.from.y,s.to.y); yMax=Math.max(yMax,s.from.y,s.to.y); }
  const haloYStart = yMin + (yMax-yMin)*0.16;
  const RIDGES=8, SPIRAL=0.9, TUFT_COUNT=24;
  const tuftYs=[], tuftThs=[];
  for (let i=0;i<TUFT_COUNT;i++){tuftYs.push(haloYStart+(i+.5)/TUFT_COUNT*(yMax-haloYStart));tuftThs.push(Math.random()*Math.PI*2);}
  const N_FOL=N-N_SKEL, N_RIDGE=Math.floor(N_FOL*0.6);
  for (let k=0;k<N_RIDGE&&written<N;k++){
    const yt=Math.random(), y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(.18,1-1.5*Math.pow(yt-.45,2)), baseR=.05+.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const th=(ridge/RIDGES)*Math.PI*2+y*SPIRAL+(Math.random()-.5)*.3;
    const r=baseR*(.55+.45*Math.random());
    treePos[written*3]=Math.cos(th)*r; treePos[written*3+1]=y+(Math.random()-.5)*.05;
    treePos[written*3+2]=Math.sin(th)*r; seeds[written]=Math.random(); written++;
  }
  for (let k=0;written<N;k++){
    const t=Math.floor(Math.random()*TUFT_COUNT), ty=tuftYs[t], tth=tuftThs[t];
    const yt=(ty-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(.18,1-1.5*Math.pow(yt-.45,2)), baseR=.05+.95*taper;
    const reach=baseR+.1+Math.random()*.35;
    treePos[written*3]=Math.cos(tth+(Math.random()-.5)*.4)*(reach+(Math.random()-.5)*.18);
    treePos[written*3+1]=ty+(Math.random()-.5)*.4;
    treePos[written*3+2]=Math.sin(tth+(Math.random()-.5)*.4)*(reach+(Math.random()-.5)*.18);
    seeds[written]=Math.random(); written++;
  }
}

// fit both to shared height
function fitToHeight(arr, h) {
  let minY=Infinity, maxY=-Infinity, cx=0, cz=0;
  const n=arr.length/3;
  for (let i=0;i<n;i++){minY=Math.min(minY,arr[i*3+1]);maxY=Math.max(maxY,arr[i*3+1]);cx+=arr[i*3];cz+=arr[i*3+2];}
  cx/=n; cz/=n; const s=h/(maxY-minY);
  for (let i=0;i<n;i++){arr[i*3]=(arr[i*3]-cx)*s;arr[i*3+1]=(arr[i*3+1]-minY)*s;arr[i*3+2]=(arr[i*3+2]-cz)*s;}
}
fitToHeight(treePos, 16); fitToHeight(towerPos, 16);

// ── compute block IDs for each particle (based on tower position) ──
// 8×8 macroblock grid mapped to the tower's bounding volume
const BLOCK_DIV = 8;
const blockIdx = new Float32Array(N); // flattened block index
{
  // find tower bounds
  let bx0=Infinity,bx1=-Infinity,by0=Infinity,by1=-Infinity,bz0=Infinity,bz1=-Infinity;
  for (let i=0;i<N;i++){
    bx0=Math.min(bx0,towerPos[i*3]);bx1=Math.max(bx1,towerPos[i*3]);
    by0=Math.min(by0,towerPos[i*3+1]);by1=Math.max(by1,towerPos[i*3+1]);
    bz0=Math.min(bz0,towerPos[i*3+2]);bz1=Math.max(bz1,towerPos[i*3+2]);
  }
  const dx=bx1-bx0||1, dy=by1-by0||1, dz=bz1-bz0||1;
  for (let i=0;i<N;i++){
    const bx=Math.min(BLOCK_DIV-1,Math.floor((towerPos[i*3]-bx0)/dx*BLOCK_DIV));
    const by=Math.min(BLOCK_DIV-1,Math.floor((towerPos[i*3+1]-by0)/dy*BLOCK_DIV));
    const bz=Math.min(BLOCK_DIV-1,Math.floor((towerPos[i*3+2]-bz0)/dz*BLOCK_DIV));
    blockIdx[i]=bx+by*BLOCK_DIV+bz*BLOCK_DIV*BLOCK_DIV;
  }
}

// ── shader ──
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  // 4 corruption wave epicenters: vec4(blockX, blockY, blockZ, startTime)
  uWave0: { value: new THREE.Vector4(3,2,4, 0) },
  uWave1: { value: new THREE.Vector4(6,5,1, 4) },
  uWave2: { value: new THREE.Vector4(1,7,6, 8) },
  uWave3: { value: new THREE.Vector4(5,1,3, 12) },
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(towerPos.slice(), 3));
geom.setAttribute('treePos', new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('blockId', new THREE.BufferAttribute(blockIdx, 1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4 uWave0, uWave1, uWave2, uWave3;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    attribute float blockId;
    varying vec3 vCol;
    varying float vAlpha;

    // hash for block-level variation
    float hash(float n){ return fract(sin(n*127.1)*43758.5453); }

    // compute corruption level from a single wave
    float waveCorrupt(vec4 wave, vec3 bCoord, float t){
      float dist = length(bCoord - wave.xyz);
      float waveT = t - wave.w;
      if(waveT < 0.0) return 0.0;
      float front = waveT * 1.8;           // wave speed in block-units
      float thickness = 3.5;               // how wide the wavefront is
      float d = abs(dist - front);
      float env = exp(-d*d / (thickness*thickness));
      // wave decays over time
      float decay = exp(-waveT * 0.08);
      return env * decay;
    }

    void main(){
      // decompose block ID to block coords
      float bid = blockId;
      float bz = floor(bid / 64.0);
      float rem = bid - bz * 64.0;
      float by = floor(rem / 8.0);
      float bx = rem - by * 8.0;
      vec3 bCoord = vec3(bx, by, bz);

      // total corruption from all waves (cycling with period 16s)
      float cycleT = mod(uTime, 16.0);
      float c = 0.0;
      c += waveCorrupt(uWave0, bCoord, cycleT);
      c += waveCorrupt(uWave1, bCoord, cycleT);
      c += waveCorrupt(uWave2, bCoord, cycleT);
      c += waveCorrupt(uWave3, bCoord, cycleT);

      // bit-flip bursts: sharp per-block events
      float blockPhase = hash(bid * 13.7 + floor(uTime * 0.3));
      float burst = step(0.92, blockPhase) * 0.6;
      c = clamp(c + burst, 0.0, 1.0);

      // smoothstep the corruption
      float m = smoothstep(0.1, 0.6, c);

      // position: lerp tower→cypress based on corruption
      vec3 p = mix(towerPos, treePos, m);

      // DCT cosine-basis ripple displacement in corrupted blocks
      // Use first 3 DCT basis functions: cos(pi*k*(2n+1)/16)
      float blockLocal = fract(seed * 7.0); // position within block [0,1]
      float dctRipple = 0.0;
      dctRipple += 0.4 * cos(3.14159 * 1.0 * (2.0*blockLocal+1.0) / 16.0);
      dctRipple += 0.25 * cos(3.14159 * 2.0 * (2.0*blockLocal+1.0) / 16.0);
      dctRipple += 0.15 * cos(3.14159 * 3.0 * (2.0*blockLocal+1.0) / 16.0);
      // apply ripple displacement perpendicular to the form
      float rippleAmt = m * 0.35;
      float rippleAngle = hash(bid) * 6.283;
      p.x += dctRipple * rippleAmt * cos(rippleAngle);
      p.z += dctRipple * rippleAmt * sin(rippleAngle);
      p.y += dctRipple * rippleAmt * 0.3 * sin(rippleAngle * 2.0);

      // macroblock snap: in corrupted zones, quantize position
      float snapStr = smoothstep(0.3, 0.8, m);
      float gridSize = 0.5;  // world-space grid cell
      vec3 snapped = floor(p / gridSize + 0.5) * gridSize;
      p = mix(p, snapped, snapStr * 0.4);

      // ── palette ──
      // clean tower: ringing-artifact warm gray
      vec3 cleanA = vec3(0.55, 0.53, 0.50);  // warm mid-gray
      vec3 cleanB = vec3(0.82, 0.78, 0.72);  // cream highlight
      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 cleanCol = mix(cleanA, cleanB, hk);

      // corrupted: chroma-subsampled Menkman palette
      // magenta #c840a0, cyan #40c0c8, yellow #c8c040
      vec3 chromaMagenta = vec3(0.78, 0.25, 0.63);
      vec3 chromaCyan    = vec3(0.25, 0.75, 0.78);
      vec3 chromaYellow  = vec3(0.78, 0.75, 0.25);

      // chroma subsampling: pick channel based on block position (simulates 4:2:0)
      // luminance changes per pixel, chroma per 2x2 block
      float chromaSel = mod(bx + by * 3.0, 3.0);
      vec3 glitchCol;
      if(chromaSel < 1.0) glitchCol = chromaMagenta;
      else if(chromaSel < 2.0) glitchCol = chromaCyan;
      else glitchCol = chromaYellow;

      // mix with a gray base for ringing artifact feel
      vec3 ringGray = vec3(0.50, 0.52, 0.56);
      glitchCol = mix(ringGray, glitchCol, 0.6 + 0.4 * sin(seed * 40.0));

      // cypress green bleeds through at high corruption
      vec3 cypressGreen = vec3(0.22, 0.40, 0.24);
      glitchCol = mix(glitchCol, cypressGreen, m * 0.3 * hk);

      vCol = mix(cleanCol, glitchCol, m);

      // slight energy pulse
      float energy = 0.5 + 0.5 * sin(uTime * 0.4 + seed * 6.28);
      vAlpha = 0.35 + 0.25 * energy + 0.2 * m;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // corrupted particles slightly larger (block-fill)
      float sizeBoost = 1.0 + m * 0.5;
      gl_PointSize = (0.8 + 0.5 * energy) * sizeBoost * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if(r > 0.25) discard;
      // corrupted particles: slightly squarer falloff (macroblock feel)
      float falloff = exp(-r * 14.0);
      float a = falloff * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ── 8×8 grid overlay (faint macroblock lines) ──
// horizontal + vertical lines in a plane behind the form
{
  const gridGeo = new THREE.BufferGeometry();
  const gridPts = [];
  const span = 12, steps = 9; // 8 divisions = 9 lines
  const z = -6; // behind the form
  for (let i = 0; i < steps; i++) {
    const f = (i / (steps-1)) * 2 - 1;
    // horizontal
    gridPts.push(-span, f * 10 + 8, z,  span, f * 10 + 8, z);
    // vertical
    gridPts.push(f * span, -2, z,  f * span, 18, z);
  }
  gridGeo.setAttribute('position', new THREE.Float32BufferAttribute(gridPts, 3));
  const gridMat = new THREE.LineBasicMaterial({ color: 0x2a2a35, transparent: true, opacity: 0.18 });
  const gridLines = new THREE.LineSegments(gridGeo, gridMat);
  scene.add(gridLines);
}

// ── film grain overlay (Lia Halloran influence) ──
// done via a fullscreen quad with noise shader
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    float hash21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 uv = gl_FragCoord.xy;
      float n = hash21(uv + fract(uTime * 7.3)) * 0.06;
      gl_FragColor = vec4(vec3(n), n * 0.7);
    }
  `
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
grainQuad.frustumCulled = false;
grainQuad.renderOrder = 999;
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.Camera();

// ── resize ──
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── animation ──
const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;

  // randomize wave epicenters each cycle
  const cycle = Math.floor(t / 16);
  const rngW = (off) => {
    let s = cycle * 4 + off + 0xBEEF;
    s = (s + 0x6D2B79F5) | 0;
    let r = Math.imul(s ^ s>>>15, 1|s);
    r = r + Math.imul(r ^ r>>>7, 61|r) ^ r;
    return ((r ^ r>>>14)>>>0) / 4294967296;
  };
  uniforms.uWave0.value.set(Math.floor(rngW(0)*8), Math.floor(rngW(1)*8), Math.floor(rngW(2)*8), 0);
  uniforms.uWave1.value.set(Math.floor(rngW(3)*8), Math.floor(rngW(4)*8), Math.floor(rngW(5)*8), 3);
  uniforms.uWave2.value.set(Math.floor(rngW(6)*8), Math.floor(rngW(7)*8), Math.floor(rngW(8)*8), 7);
  uniforms.uWave3.value.set(Math.floor(rngW(9)*8), Math.floor(rngW(10)*8), Math.floor(rngW(11)*8), 11);

  // slow orbit, centered on form
  const ang = t * 0.06;
  const radius = 26;
  camera.position.set(Math.sin(ang) * radius, 8 + Math.sin(t * 0.03) * 1.5, Math.cos(ang) * radius);
  camera.lookAt(0, 8, 0);

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
