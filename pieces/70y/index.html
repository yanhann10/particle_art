<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: vigorous -->
<title>70y · cypress ↔ psaltery · audio-reactive</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070a; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,monospace; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">70y</div>
<div class="hint">click for mic · drag to orbit · strings resonate on bass</div>
<div class="label" id="phaseLabel">psaltery 30%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════ audio ═══════════════ */
let analyser = null, freqData = null, audioActive = false;
let bassEnergy = 0, bassPeak = 0, shockwave = 0, shockOrigin = 0;
const BASS_THRESHOLD = 0.62, BASS_DECAY = 0.92, SHOCK_DECAY = 0.94;

async function initAudio(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    audioActive = true;
  } catch(e){}
}
document.addEventListener('click', () => { if(!audioActive) initAudio(); }, { once:true });

function updateAudio(){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for(let i=1;i<7;i++) sum += freqData[i];
  const raw = sum / (6*255);
  bassEnergy = bassEnergy * BASS_DECAY + raw * (1-BASS_DECAY);
  if(raw > BASS_THRESHOLD && raw > bassPeak * 1.3){
    shockwave = 1.0;
    shockOrigin = performance.now()/1000;
    bassPeak = raw;
  }
  bassPeak *= 0.995;
  shockwave *= SHOCK_DECAY;
}

/* ═══════════════ scene ═══════════════ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.016);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

/* ═══════════════ post-processing ═══════════════ */
let rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType });
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const postUniforms = {
  tDiffuse:    { value: rt.texture },
  uShockwave:  { value: 0 },
  uShockTime:  { value: 0 },
  uBass:       { value: 0 },
  uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
  uAudioOn:    { value: 0 }
};
const postMat = new THREE.ShaderMaterial({
  uniforms: postUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uShockwave, uShockTime, uBass, uAudioOn;
    uniform vec2 uResolution;
    varying vec2 vUv;
    void main(){
      vec2 center = vec2(0.5);
      vec2 dir = vUv - center;
      float dist = length(dir);
      float wave = uShockwave * sin(dist*28.0 - uShockTime*12.0) * exp(-dist*4.0) * 0.035;
      vec2 offset = normalize(dir+0.001) * wave;
      float aberr = (0.001 + uBass * 0.012) * uAudioOn;
      vec2 uvR = vUv + offset + dir * aberr;
      vec2 uvG = vUv + offset;
      vec2 uvB = vUv + offset - dir * aberr;
      float r = texture2D(tDiffuse, uvR).r;
      float g = texture2D(tDiffuse, uvG).g;
      float b = texture2D(tDiffuse, uvB).b;
      float vig = 1.0 - (0.3 + uBass*0.25*uAudioOn) * dist * dist;
      gl_FragColor = vec4(vec3(r,g,b)*vig, 1.0);
    }
  `
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postScene.add(postQuad);

/* ═══════════════ L-system cypress (pose A) ═══════════════ */
const RULES = {
  'F': [
    { p:0.55, s:'F[+f][-f]F' },
    { p:0.25, s:'FF[/f]\\F' },
    { p:0.20, s:'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p:0.6, s:'f[+f][-f]' },
    { p:0.4, s:'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for(let d=0;d<depth;d++){
    let out='';
    for(const ch of s){
      if(ch in RULES){
        const r=rng(); let acc=0;
        for(const opt of RULES[ch]){ acc+=opt.p; if(r<=acc){ out+=opt.s; break; } }
      } else out+=ch;
    }
    s=out;
  }
  return s;
}

function turtle(str){
  const stack=[], segments=[];
  let pos=new THREE.Vector3(), h=new THREE.Vector3(0,1,0),
      l=new THREE.Vector3(-1,0,0), u=new THREE.Vector3(0,0,1), gen=0;
  const rot=(axis,ang)=>{
    const q=new THREE.Quaternion().setFromAxisAngle(axis,ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for(const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step=STEP_BASE*Math.pow(0.85,gen);
        const next=pos.clone().addScaledVector(h,step);
        segments.push({from:pos.clone(),to:next.clone(),gen});
        pos=next; break;
      }
      case '+': rot(u,+ANGLE); break;
      case '-': rot(u,-ANGLE); break;
      case '&': rot(l,+ANGLE); break;
      case '^': rot(l,-ANGLE); break;
      case '/': rot(h,+ANGLE*1.5); break;
      case '\\': rot(h,-ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f=stack.pop(); pos=f.pos;h=f.h;l=f.l;u=f.u;gen=f.gen; break; }
    }
  }
  return segments;
}

const rng=(()=>{let s=0xC0FFEE;return()=>{s=(s+0x6D2B79F5)|0;
  let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};})();

const cypressSegs = turtle(expand('F',6,rng));

/* ═══════════════ psaltery (pose B) — trapezoidal frame + curved strings ═══════════════ */
function samplePsaltery(N){
  const out = new Float32Array(N*3);
  // psaltery trapezoid: wider at bottom, narrower at top
  // bottom edge ~9 wide, top edge ~3 wide, height ~16
  // slight depth ~1.2 for body thickness
  const bW = 4.5, tW = 1.5, H = 16, D = 0.6;
  // frame gets 40% of particles (thick), strings get 45%, bridge/nut 10%, soundhole 5%
  const N_FRAME = Math.floor(N * 0.40);
  const N_STRING = Math.floor(N * 0.45);
  const N_BRIDGE = Math.floor(N * 0.08);
  const N_HOLE = N - N_FRAME - N_STRING - N_BRIDGE;
  let idx = 0;

  // helper: width at height y (0=bottom, H=top)
  function widthAt(y){ return bW + (tW - bW) * (y / H); }

  // Frame edges — thick particle bands
  // bottom edge
  const N_BOT = Math.floor(N_FRAME * 0.22);
  for(let k=0; k<N_BOT; k++){
    const t = Math.random();
    const x = (t * 2 - 1) * bW;
    const y = (Math.random() - 0.5) * 0.5; // thickness
    const z = (Math.random() - 0.5) * D;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }
  // top edge
  const N_TOP = Math.floor(N_FRAME * 0.15);
  for(let k=0; k<N_TOP; k++){
    const t = Math.random();
    const x = (t * 2 - 1) * tW;
    const y = H + (Math.random() - 0.5) * 0.4;
    const z = (Math.random() - 0.5) * D;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }
  // left edge (angled)
  const N_LEFT = Math.floor(N_FRAME * 0.28);
  for(let k=0; k<N_LEFT; k++){
    const t = Math.random();
    const y = t * H;
    const w = widthAt(y);
    const x = -w + (Math.random() - 0.5) * 0.35;
    const z = (Math.random() - 0.5) * D;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }
  // right edge (angled)
  const N_RIGHT = N_FRAME - N_BOT - N_TOP - N_LEFT;
  for(let k=0; k<N_RIGHT; k++){
    const t = Math.random();
    const y = t * H;
    const w = widthAt(y);
    const x = w + (Math.random() - 0.5) * 0.35;
    const z = (Math.random() - 0.5) * D;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }

  // Strings — vertical with slight catenary curve, spaced across width
  const NUM_STRINGS = 18;
  const stringMargin = 0.3;
  for(let k=0; k<N_STRING; k++){
    const si = Math.floor(Math.random() * NUM_STRINGS);
    const sf = (si + 0.5) / NUM_STRINGS; // 0..1
    // string endpoints: bottom x and top x differ (trapezoid)
    const xBot = (-bW + stringMargin) + sf * (2*(bW - stringMargin));
    const xTop = (-tW + stringMargin*0.5) + sf * (2*(tW - stringMargin*0.5));
    // only draw string if top x is within frame
    const t = Math.random();
    const y = t * H;
    const x = xBot + (xTop - xBot) * t;
    // catenary sag — deeper for longer (outer) strings
    const sag = Math.sin(t * Math.PI) * (0.15 + 0.25 * Math.abs(sf - 0.5));
    const z = sag + (Math.random() - 0.5) * 0.04;
    // skip if outside frame
    const w = widthAt(y);
    if(Math.abs(x) < w - 0.15){
      out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
    } else {
      // redistribute to a centered string
      const sf2 = 0.3 + Math.random() * 0.4;
      const xB2 = (-bW + stringMargin) + sf2 * (2*(bW - stringMargin));
      const xT2 = (-tW + stringMargin*0.5) + sf2 * (2*(tW - stringMargin*0.5));
      const x2 = xB2 + (xT2 - xB2) * t;
      const sag2 = Math.sin(t * Math.PI) * 0.2;
      out[idx*3]=x2; out[idx*3+1]=y; out[idx*3+2]=sag2 + (Math.random()-.5)*0.04; idx++;
    }
  }

  // Bridge (bottom) and nut (top) — horizontal bars
  const N_BBOT = Math.floor(N_BRIDGE * 0.5);
  for(let k=0; k<N_BBOT; k++){
    const x = (Math.random() * 2 - 1) * (bW - 0.2);
    const y = 0.3 + (Math.random() - 0.5) * 0.25;
    const z = (Math.random() - 0.5) * 0.3;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }
  const N_BTOP = N_BRIDGE - N_BBOT;
  for(let k=0; k<N_BTOP; k++){
    const x = (Math.random() * 2 - 1) * (tW - 0.1);
    const y = H - 0.3 + (Math.random() - 0.5) * 0.25;
    const z = (Math.random() - 0.5) * 0.3;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }

  // Soundhole — rosette circle in upper-center area
  for(let k=0; k<N_HOLE; k++){
    const th = Math.random() * Math.PI * 2;
    const band = 0.6 + Math.random() * 0.4; // ring, not filled
    const r = band * 0.9;
    const x = Math.cos(th) * r;
    const y = H * 0.62 + Math.sin(th) * r;
    const z = -D * 0.3 + (Math.random() - 0.5) * 0.08;
    out[idx*3]=x; out[idx*3+1]=y; out[idx*3+2]=z; idx++;
  }

  // fill remainder
  while(idx < N){
    out[idx*3]=0; out[idx*3+1]=H*0.5; out[idx*3+2]=0; idx++;
  }
  return out;
}

/* ═══════════════ build particle correspondence ═══════════════ */
const N = 70000;
const treePos = new Float32Array(N*3);
const psalteryPos = samplePsaltery(N);
const seeds = new Float32Array(N);
const stringIdx = new Float32Array(N); // which string (0-17) for vibration

const lens=cypressSegs.map(s=>s.from.distanceTo(s.to));
const totalLen=lens.reduce((a,b)=>a+b,0);
const N_SKEL=Math.floor(N*0.55), N_FOL=N-N_SKEL;
let written=0;
const v=new THREE.Vector3();

for(let i=0;i<cypressSegs.length;i++){
  const share=i===cypressSegs.length-1?(N_SKEL-written):Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for(let k=0;k<share&&written<N_SKEL;k++){
    const t=Math.random();
    v.lerpVectors(cypressSegs[i].from,cypressSegs[i].to,t);
    const j=0.05*Math.pow(0.85,cypressSegs[i].gen);
    treePos[written*3]=v.x+(Math.random()-.5)*j;
    treePos[written*3+1]=v.y+(Math.random()-.5)*j;
    treePos[written*3+2]=v.z+(Math.random()-.5)*j;
    seeds[written]=Math.random();
    stringIdx[written]=Math.floor(Math.random()*18);
    written++;
  }
}
{
  let yMin=Infinity,yMax=-Infinity;
  for(const s of cypressSegs){yMin=Math.min(yMin,s.from.y,s.to.y);yMax=Math.max(yMax,s.from.y,s.to.y);}
  const trunkH=yMax-yMin, haloYStart=yMin+trunkH*0.16;
  const RIDGES=8,SPIRAL=0.9,TUFT_COUNT=24;
  const tuftYs=[],tuftThs=[];
  for(let i=0;i<TUFT_COUNT;i++){
    tuftYs.push(haloYStart+((i+.5)/TUFT_COUNT)*(yMax-haloYStart));
    tuftThs.push(Math.random()*Math.PI*2);
  }
  const N_R=Math.floor(N_FOL*0.60), N_T=N_FOL-N_R;
  for(let k=0;k<N_R&&written<N;k++){
    const yt=Math.random(), y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const ridgeTh=(ridge/RIDGES)*Math.PI*2+y*SPIRAL;
    const th=ridgeTh+(Math.random()-.5)*0.30;
    const r=baseR*(0.55+0.45*Math.random());
    treePos[written*3]=Math.cos(th)*r;
    treePos[written*3+1]=y+(Math.random()-.5)*0.05;
    treePos[written*3+2]=Math.sin(th)*r;
    seeds[written]=Math.random();
    stringIdx[written]=Math.floor(Math.random()*18);
    written++;
  }
  for(let k=0;k<N_T&&written<N;k++){
    const t=Math.floor(Math.random()*TUFT_COUNT);
    const tuftY=tuftYs[t], tuftTh=tuftThs[t];
    const yt=(tuftY-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const reach=baseR+0.1+Math.random()*0.35;
    treePos[written*3]=Math.cos(tuftTh+(Math.random()-.5)*0.4)*(reach+(Math.random()-.5)*0.18);
    treePos[written*3+1]=tuftY+(Math.random()-.5)*0.4;
    treePos[written*3+2]=Math.sin(tuftTh+(Math.random()-.5)*0.4)*(reach+(Math.random()-.5)*0.18);
    seeds[written]=Math.random();
    stringIdx[written]=Math.floor(Math.random()*18);
    written++;
  }
}
while(written<N){ treePos[written*3]=0;treePos[written*3+1]=0;treePos[written*3+2]=0;seeds[written]=Math.random();stringIdx[written]=0;written++; }

function fitToHeight(arr,targetH){
  let minY=Infinity,maxY=-Infinity,cx=0,cz=0;
  for(let i=0;i<arr.length/3;i++){
    minY=Math.min(minY,arr[i*3+1]);maxY=Math.max(maxY,arr[i*3+1]);
    cx+=arr[i*3];cz+=arr[i*3+2];
  }
  cx/=arr.length/3;cz/=arr.length/3;
  const h=maxY-minY||1,s=targetH/h;
  for(let i=0;i<arr.length/3;i++){
    arr[i*3]=(arr[i*3]-cx)*s;
    arr[i*3+1]=(arr[i*3+1]-minY)*s;
    arr[i*3+2]=(arr[i*3+2]-cz)*s;
  }
}
fitToHeight(treePos,16);
fitToHeight(psalteryPos,16);

/* ═══════════════ particle shader ═══════════════ */
const uniforms = {
  uTime:  {value:0}, uPixel: {value:renderer.getPixelRatio()},
  uMix:   {value:0.3}, uBass:  {value:0}, uShock: {value:0}
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(),3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos,3));
geom.setAttribute('psalteryPos', new THREE.BufferAttribute(psalteryPos,3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds,1));
geom.setAttribute('sIdx',     new THREE.BufferAttribute(stringIdx,1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uMix, uBass, uShock;
    attribute vec3 treePos, psalteryPos;
    attribute float seed, sIdx;
    varying vec3 vCol;
    varying float vEnergy, vMix;
    void main(){
      float m = smoothstep(0.0,1.0,uMix);
      vec3 p = mix(treePos, psalteryPos, m);
      float t = uTime*0.55 + seed*6.28;

      // string vibration when in psaltery pose — each string has own frequency
      float stringFreq = 3.0 + sIdx * 0.7;
      float stringPhase = uTime * stringFreq + seed * 3.14;
      float vibAmt = m * (0.04 + uBass * 0.25 + uShock * 0.35);
      // vibrate in z (perpendicular to string plane)
      float yNorm = p.y / 16.0;
      float vibEnvelope = sin(yNorm * 3.14159); // max at middle of string
      p.z += sin(stringPhase) * vibAmt * vibEnvelope;

      // sway: organic at m=0, damped at m=1
      float swayAmt = (1.0-m)*0.06*(p.y/16.0) + uBass*0.08;
      p.x += swayAmt*sin(t);
      p.z += (1.0-m)*swayAmt*cos(t*0.9);

      // bass pulse
      float radial = length(p.xz);
      float pulsePhase = uShock * sin(radial*3.0 - uTime*8.0) * 0.4;
      p.xz *= 1.0 + pulsePhase * 0.06;
      p.y  *= 1.0 + uBass*0.04;

      vMix = m;
      vEnergy = 0.5 + 0.5*sin(t*0.8) + uBass*0.8;

      // palette: greens → warm amber/wood
      vec3 treeA=vec3(0.18,0.36,0.20), treeB=vec3(0.55,0.78,0.35), treeC=vec3(0.85,0.92,0.55);
      vec3 psal_a=vec3(0.35,0.22,0.10), psal_b=vec3(0.78,0.55,0.25), psal_c=vec3(0.95,0.82,0.55);
      vec3 hotCol = vec3(1.0,0.6,0.18); // plucked-string glow

      float hk = clamp(p.y/16.0,0.0,1.0);
      vec3 treeCol = mix(treeA,treeB,hk);
      treeCol = mix(treeCol,treeC,smoothstep(0.7,1.0,hk)*0.6);
      vec3 psalCol = mix(psal_a,psal_b,hk);
      psalCol = mix(psalCol,psal_c,smoothstep(0.85,1.0,hk)*0.7);
      vCol = mix(treeCol, psalCol, m);
      // strings glow hot on bass
      float isString = step(0.02, abs(vibEnvelope)) * m;
      vCol = mix(vCol, hotCol, uShock*0.45*isString);

      vec4 mv = modelViewMatrix * vec4(p,1.0);
      float dist = -mv.z;
      float sizeBoost = 1.0 + uBass*0.5;
      // frame particles larger than string particles for readability
      float baseSize = mix(0.9, 1.3, step(0.95, 1.0 - vibEnvelope) * m);
      gl_PointSize = (baseSize+0.6*vEnergy)*uPixel*(50.0/dist)*sizeBoost;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol;
    varying float vEnergy, vMix;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r>0.25) discard;
      float a = exp(-r*18.0)*(0.45+0.55*vEnergy);
      gl_FragColor = vec4(vCol*a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ═══════════════ interaction + loop ═══════════════ */
let target=0, phase=0.3; // start at 0.3 so psaltery is immediately visible
addEventListener('click',()=>{ target=1-target; });
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  rt.setSize(innerWidth,innerHeight);
  postUniforms.uResolution.value.set(innerWidth,innerHeight);
});

const phaseLabel=document.getElementById('phaseLabel');
const start=performance.now();

function loop(){
  const t=(performance.now()-start)/1000;
  updateAudio();

  uniforms.uTime.value=t;
  uniforms.uBass.value=bassEnergy;
  uniforms.uShock.value=shockwave;

  // morph: oscillate between 0.15 and 0.85 so both forms always partially visible
  const oscPeriod = audioActive ? 10 : 14;
  const oscPhase = (Math.sin(t * Math.PI * 2 / oscPeriod) * 0.5 + 0.5);
  let desired = 0.15 + oscPhase * 0.70; // range 0.15..0.85
  // click toggles bias
  if(target === 1) desired = 1.0 - desired;
  // bass hit: slam toward psaltery
  if(shockwave > 0.7 && audioActive) desired = 0.9;
  const morphSpeed = audioActive ? 0.04 : 0.02;
  phase += (desired-phase) * morphSpeed;
  uniforms.uMix.value=phase;

  const pct=Math.round(phase*100);
  phaseLabel.textContent = phase<0.5?`cypress ${100-pct}%`:`psaltery ${pct}%`;

  // camera orbit — centroid tracking
  const centroidY = 8;
  const ang=t*0.045;
  const camR = 20 + (1-phase)*3; // closer for psaltery (flatter form)
  const shake = audioActive ? bassEnergy*0.8 : 0;
  camera.position.x = Math.sin(ang)*camR + Math.sin(t*7.3)*shake;
  camera.position.z = Math.cos(ang)*camR + Math.cos(t*6.1)*shake;
  camera.position.y = 6 + Math.sin(t*0.3)*0.5 + shockwave*1.5;
  camera.lookAt(0, centroidY, 0);
  controls.update();

  renderer.setRenderTarget(rt);
  renderer.render(scene,camera);

  postUniforms.uShockwave.value = shockwave;
  postUniforms.uShockTime.value = t - shockOrigin;
  postUniforms.uBass.value = bassEnergy;
  postUniforms.uAudioOn.value = audioActive?1:0;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);

  requestAnimationFrame(loop);
}
loop();
</script>

(function(){

  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
