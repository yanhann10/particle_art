<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y6a · cosmic web</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000408; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">y6a · cosmic web</div>
<div class="hint">MillenniumTNG · 200 Mpc/h scale</div>
<div class="src">voronoi filament structure · gravitational infall</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// MillenniumTNG-style cosmic web: Voronoi tessellation edges as dark-matter filaments,
// vertices as galaxy clusters. 50k particles concentrated along edges, drifting toward nodes.

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000408, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 2000);
camera.position.set(0, 0, 420);

// ---- Generate 3D Voronoi by placing N nodes and computing edges ----
const N_NODES = 200;
const BOX = 400; // comoving Mpc/h scale
const nodes = [];
for (let i = 0; i < N_NODES; i++){
  nodes.push(new THREE.Vector3(
    (Math.random() - 0.5) * BOX,
    (Math.random() - 0.5) * BOX,
    (Math.random() - 0.5) * BOX
  ));
}

// Build edge list: connect each node to its K nearest neighbors (K=6 typical for cosmic web)
const K = 6;
const edges = [];
const edgeSet = new Set();
for (let i = 0; i < N_NODES; i++){
  const dists = nodes.map((n, j) => ({ j, d: nodes[i].distanceTo(n) }));
  dists.sort((a, b) => a.d - b.d);
  for (let k = 1; k <= K && k < dists.length; k++){
    const j = dists[k].j;
    const key = i < j ? `${i}_${j}` : `${j}_${i}`;
    if (!edgeSet.has(key)){
      edgeSet.add(key);
      edges.push({ a: i, b: j, len: dists[k].d });
    }
  }
}

// ---- Place 50k particles along edges with Gaussian falloff perpendicular ----
const N_PARTICLES = 50000;
const positions = new Float32Array(N_PARTICLES * 3);
const targetNodes = new Uint16Array(N_PARTICLES); // nearest node index for drift
const edgeParams = new Float32Array(N_PARTICLES); // t along edge [0,1]

for (let i = 0; i < N_PARTICLES; i++){
  // Pick random edge weighted by length (longer filaments get more particles)
  const totalLen = edges.reduce((s, e) => s + e.len, 0);
  let r = Math.random() * totalLen;
  let edge = edges[0];
  for (let e of edges){
    r -= e.len;
    if (r <= 0){ edge = e; break; }
  }

  const nA = nodes[edge.a];
  const nB = nodes[edge.b];
  const t = Math.random();
  edgeParams[i] = t;

  // Position along edge with Gaussian perpendicular scatter (filament thickness)
  const mid = new THREE.Vector3().lerpVectors(nA, nB, t);
  const axis = new THREE.Vector3().subVectors(nB, nA).normalize();
  const perp1 = new THREE.Vector3(axis.y, -axis.x, 0).normalize();
  const perp2 = new THREE.Vector3().crossVectors(axis, perp1);
  
  // Gaussian scatter: thicker near nodes, thinner mid-filament
  const nodeDist = Math.min(t, 1 - t) * 2; // 0 at ends, 1 at midpoint
  const sigma = 1.5 + nodeDist * 2.5; // filaments ~1.5 Mpc/h thick at clusters, ~4 mid-span
  const r1 = (Math.random() + Math.random() + Math.random() + Math.random() - 2) * sigma;
  const r2 = (Math.random() + Math.random() + Math.random() + Math.random() - 2) * sigma;
  
  mid.addScaledVector(perp1, r1);
  mid.addScaledVector(perp2, r2);

  positions[i*3]   = mid.x;
  positions[i*3+1] = mid.y;
  positions[i*3+2] = mid.z;

  // Assign nearest node (for gravitational drift)
  const dA = mid.distanceTo(nA);
  const dB = mid.distanceTo(nB);
  targetNodes[i] = dA < dB ? edge.a : edge.b;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('targetNode', new THREE.BufferAttribute(targetNodes, 1));
geom.setAttribute('edgeParam', new THREE.BufferAttribute(edgeParams, 1));

// Pack node positions into a DataTexture for shader access
const nodeTexSize = Math.ceil(Math.sqrt(N_NODES));
const nodeData = new Float32Array(nodeTexSize * nodeTexSize * 4);
for (let i = 0; i < N_NODES; i++){
  nodeData[i*4]   = nodes[i].x;
  nodeData[i*4+1] = nodes[i].y;
  nodeData[i*4+2] = nodes[i].z;
  nodeData[i*4+3] = 1.0;
}
const nodeTex = new THREE.DataTexture(nodeData, nodeTexSize, nodeTexSize, THREE.RGBAFormat, THREE.FloatType);
nodeTex.needsUpdate = true;

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uNodes: { value: nodeTex },
    uNodeTexSize: { value: nodeTexSize },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform sampler2D uNodes;
    uniform float uNodeTexSize;
    attribute float targetNode;
    attribute float edgeParam;
    varying float vDistToNode;
    varying float vEdgeParam;

    vec3 getNode(float idx){
      float x = mod(idx, uNodeTexSize);
      float y = floor(idx / uNodeTexSize);
      vec2 uv = (vec2(x, y) + 0.5) / uNodeTexSize;
      return texture2D(uNodes, uv).xyz;
    }

    void main(){
      vec3 pos = position;
      vec3 target = getNode(targetNode);
      
      // Drift toward nearest node (gravitational infall) — slow, ~0.1% of distance per second
      vec3 dir = target - pos;
      float dist = length(dir);
      pos += normalize(dir) * min(dist * 0.0008 * uTime, dist * 0.3);
      
      vDistToNode = dist;
      vEdgeParam = edgeParam;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float depth = -mv.z;
      gl_PointSize = (0.8 + 0.4 * (1.0 - smoothstep(0.0, 80.0, dist))) * (120.0 / depth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDistToNode;
    varying float vEdgeParam;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float alpha = exp(-r * 12.0);

      // Color: hot magenta near nodes (clusters), cool cyan-blue mid-filament, dark in voids
      // MillenniumTNG palette: #ff3d8a (cluster core) → #4a90e2 (filament) → #000408 (void)
      float clusterProx = smoothstep(80.0, 5.0, vDistToNode);
      vec3 clusterCol = vec3(1.0, 0.24, 0.54); // magenta
      vec3 filamentCol = vec3(0.29, 0.56, 0.89); // blue
      vec3 col = mix(filamentCol, clusterCol, clusterProx);
      
      // Dim particles far from both endpoints (mid-filament thinning)
      float midFade = 1.0 - smoothstep(0.3, 0.7, abs(vEdgeParam - 0.5) * 2.0) * 0.6;
      alpha *= midFade * (0.3 + clusterProx * 0.7);

      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Add a few bright cluster cores as small sphere meshes
const clusterGeom = new THREE.SphereGeometry(2.5, 12, 12);
const clusterMat = new THREE.MeshBasicMaterial({ color: 0xff3d8a, transparent: true, opacity: 0.6 });
const clusters = new THREE.InstancedMesh(clusterGeom, clusterMat, 20);
clusters.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const dummy = new THREE.Object3D();
for (let i = 0; i < 20; i++){
  const node = nodes[Math.floor(Math.random() * N_NODES)];
  dummy.position.copy(node);
  dummy.scale.setScalar(1 + Math.random() * 0.5);
  dummy.updateMatrix();
  clusters.setMatrixAt(i, dummy.matrix);
}
scene.add(clusters);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
function loop(now){
  const t = (now - t0) / 1000;
  mat.uniforms.uTime.value = t;

  // Slow camera orbit — cosmological scale feels vast, unhurried
  const ang = t * 0.03;
  const rad = 420;
  camera.position.x = Math.sin(ang) * rad;
  camera.position.z = Math.cos(ang) * rad;
  camera.position.y = Math.sin(ang * 0.3) * 80;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(t0);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
