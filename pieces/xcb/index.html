<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xcb · origami crane becoming flock</title>
<!-- MOTION: dispersal, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: radial-gradient(ellipse at center, #1a1820 0%, #0d0d12 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #9ab3c8; }
</style>
</head>
<body>
<div class="id">xcb · origami crane becoming flock</div>
<div class="hint">move cursor across canvas — the crane remembers it was one, then many</div>
<div class="src">descended from sav · object-cloud dispersal via boids · paper fold</div>
<div class="arc" id="arc">rest · cohesion 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// The origami crane as point cloud (each point is a bird at rest).
// On mouse input, points obey boids rules (cohesion/alignment/separation).
// When input is neutral, they return to rest pose (the recognizable crane).
// The piece is: one object remembering it was always many.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0d12, 0.012);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 2, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── origami crane point cloud
// Simplified crane geometry: 8 control points defining wing, body, neck, head, tail
const craneShape = [
  // body
  [0, 0, 0],
  [-1.2, 0.1, 0.6], [1.2, 0.1, 0.6],    // left/right wing base
  [-2.8, 0.3, 1.4], [2.8, 0.3, 1.4],    // wing tips
  // neck + head
  [0, 0.8, -0.9], [0, 1.4, -1.5], [0, 1.7, -1.8],
  // tail
  [0, 0.4, 1.8], [0, 0.7, 2.6]
];

// tessellate each segment into particles
function sampleSegment(a, b, n){
  const pts = [];
  for (let i = 0; i <= n; i++){
    const t = i / n;
    pts.push([
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t
    ]);
  }
  return pts;
}

let restPts = [];
// body to wings
restPts.push(...sampleSegment(craneShape[0], craneShape[1], 18));
restPts.push(...sampleSegment(craneShape[0], craneShape[2], 18));
restPts.push(...sampleSegment(craneShape[1], craneShape[3], 28));
restPts.push(...sampleSegment(craneShape[2], craneShape[4], 28));
// left wing surface fill
for (let j = 0; j < 12; j++){
  const u = j / 11;
  const start = [
    craneShape[0][0] + (craneShape[1][0] - craneShape[0][0]) * u,
    craneShape[0][1] + (craneShape[1][1] - craneShape[0][1]) * u,
    craneShape[0][2] + (craneShape[1][2] - craneShape[0][2]) * u
  ];
  const end = [
    craneShape[1][0] + (craneShape[3][0] - craneShape[1][0]) * u,
    craneShape[1][1] + (craneShape[3][1] - craneShape[1][1]) * u,
    craneShape[1][2] + (craneShape[3][2] - craneShape[1][2]) * u
  ];
  restPts.push(...sampleSegment(start, end, 8));
}
// right wing surface fill
for (let j = 0; j < 12; j++){
  const u = j / 11;
  const start = [
    craneShape[0][0] + (craneShape[2][0] - craneShape[0][0]) * u,
    craneShape[0][1] + (craneShape[2][1] - craneShape[0][1]) * u,
    craneShape[0][2] + (craneShape[2][2] - craneShape[0][2]) * u
  ];
  const end = [
    craneShape[2][0] + (craneShape[4][0] - craneShape[2][0]) * u,
    craneShape[2][1] + (craneShape[4][1] - craneShape[2][1]) * u,
    craneShape[2][2] + (craneShape[4][2] - craneShape[2][2]) * u
  ];
  restPts.push(...sampleSegment(start, end, 8));
}
// neck
restPts.push(...sampleSegment(craneShape[0], craneShape[5], 12));
restPts.push(...sampleSegment(craneShape[5], craneShape[6], 10));
restPts.push(...sampleSegment(craneShape[6], craneShape[7], 6));
// tail
restPts.push(...sampleSegment(craneShape[0], craneShape[8], 14));
restPts.push(...sampleSegment(craneShape[8], craneShape[9], 12));

const N = restPts.length;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const restPos = new Float32Array(N * 3);
for (let i = 0; i < N; i++){
  restPos[i*3]     = restPts[i][0];
  restPos[i*3 + 1] = restPts[i][1];
  restPos[i*3 + 2] = restPts[i][2];
  pos[i*3]     = restPos[i*3];
  pos[i*3 + 1] = restPos[i*3 + 1];
  pos[i*3 + 2] = restPos[i*3 + 2];
  vel[i*3] = vel[i*3+1] = vel[i*3+2] = 0;
}

// boid params
const PERCEPTION_R = 2.8;
const SEPARATION_R = 0.6;
const W_COH = 0.014;
const W_ALI = 0.050;
const W_SEP = 0.070;
const W_REST = 0.085;   // attraction back to rest pose
const MAX_SPEED = 2.2;
const MAX_FORCE = 0.040;

// interaction state
let mouseX = 0, mouseY = 0;
let mouseActive = false;
let dispersionStrength = 0.0;   // 0=rest, 1=full boids

addEventListener('mousemove', e => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = -(e.clientY / innerHeight) * 2 + 1;
  mouseActive = true;
  dispersionStrength = Math.min(1.0, dispersionStrength + 0.12);
});
addEventListener('mouseleave', () => {
  mouseActive = false;
});

const arcEl = document.getElementById('arc');

function step(dt){
  // decay dispersion when mouse inactive
  if (!mouseActive){
    dispersionStrength = Math.max(0.0, dispersionStrength - dt * 0.35);
  }
  arcEl.textContent = dispersionStrength < 0.15 ? 'rest · cohesion 100%'
                    : dispersionStrength < 0.5 ? 'awakening · cohesion 70%'
                    : dispersionStrength < 0.85 ? 'dispersing · cohesion 35%'
                    : 'flock · cohesion 0%';

  // compute flock centroid
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= N; cy /= N; cz /= N;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];

    // boids rules (active only when dispersed)
    if (dispersionStrength > 0.05){
      for (let j = 0; j < N; j++){
        if (i === j) continue;
        const dx = pos[j*3] - px;
        const dy = pos[j*3+1] - py;
        const dz = pos[j*3+2] - pz;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 > PERCEPTION_R * PERCEPTION_R || d2 < 1e-6) continue;
        cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
        aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
        if (d2 < SEPARATION_R * SEPARATION_R){
          const inv = 1.0 / Math.sqrt(d2);
          sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
        }
      }
      if (cohN > 0){
        cohX = cohX/cohN - px;
        cohY = cohY/cohN - py;
        cohZ = cohZ/cohN - pz;
        acc[i*3]     += cohX * W_COH * dispersionStrength;
        acc[i*3+1]   += cohY * W_COH * dispersionStrength;
        acc[i*3+2]   += cohZ * W_COH * dispersionStrength;
      }
      if (aliN > 0){
        aliX = aliX/aliN - vel[i*3];
        aliY = aliY/aliN - vel[i*3+1];
        aliZ = aliZ/aliN - vel[i*3+2];
        acc[i*3]     += aliX * W_ALI * dispersionStrength;
        acc[i*3+1]   += aliY * W_ALI * dispersionStrength;
        acc[i*3+2]   += aliZ * W_ALI * dispersionStrength;
      }
      acc[i*3]   += sepX * W_SEP * dispersionStrength;
      acc[i*3+1] += sepY * W_SEP * dispersionStrength;
      acc[i*3+2] += sepZ * W_SEP * dispersionStrength;
    }

    // repulsion from mouse ray
    if (mouseActive && dispersionStrength > 0.1){
      const ray = new THREE.Vector3(mouseX * 8, mouseY * 6, 0).sub(new THREE.Vector3(px, py, pz));
      const dist = ray.length();
      if (dist < 6.0){
        ray.normalize().multiplyScalar(-0.18 * (1.0 - dist / 6.0) * dispersionStrength);
        acc[i*3]   += ray.x;
        acc[i*3+1] += ray.y;
        acc[i*3+2] += ray.z;
      }
    }

    // strong spring back to rest pose
    const rx = restPos[i*3] - px;
    const ry = restPos[i*3+1] - py;
    const rz = restPos[i*3+2] - pz;
    const restForce = W_REST * (1.0 - dispersionStrength * 0.75);
    acc[i*3]   += rx * restForce;
    acc[i*3+1] += ry * restForce;
    acc[i*3+2] += rz * restForce;
  }

  // integrate
  for (let i = 0; i < N; i++){
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MAX_FORCE){ ax *= MAX_FORCE/af; ay *= MAX_FORCE/af; az *= MAX_FORCE/af; }
    vel[i*3]     += ax;
    vel[i*3 + 1] += ay;
    vel[i*3 + 2] += az;
    // damping when returning to rest
    const damp = 1.0 - (1.0 - dispersionStrength) * 0.06;
    vel[i*3]   *= damp;
    vel[i*3+1] *= damp;
    vel[i*3+2] *= damp;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MAX_SPEED){ vx *= MAX_SPEED/sp; vy *= MAX_SPEED/sp; vz *= MAX_SPEED/sp; vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]     += vel[i*3] * dt;
    pos[i*3+1]   += vel[i*3+1] * dt;
    pos[i*3+2]   += vel[i*3+2] * dt;
  }
}

// ────────────── render
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uDispersion: { value: 0.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uDispersion;
    attribute float seed;
    varying vec3  vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.8 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.2 + 0.5 * sin(t);
      gl_PointSize = baseSize * uPixel * (14.0 / dist);
      vFade = clamp(1.0 - (dist - 20.0) / 35.0, 0.0, 1.0);

      // color: paper-white at rest, warm amber when dispersed
      vec3 paper = vec3(0.95, 0.93, 0.88);   // origami paper
      vec3 warm  = vec3(0.98, 0.78, 0.52);   // warm amber
      vec3 sky   = vec3(0.60, 0.70, 0.82);   // pale sky blue
      vCol = mix(paper, mix(warm, sky, smoothstep(0.0, 1.0, sin(t * 0.5))), smoothstep(0.0, 1.0, uDispersion));

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vFade;
      gl_FragColor = vec4(vCol * a * 0.88, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// paper texture overlay (subtle grain)
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 512; grainCanvas.height = 512;
const grainCtx = grainCanvas.getContext('2d');
const grainData = grainCtx.createImageData(512, 512);
for (let i = 0; i < grainData.data.length; i += 4){
  const v = Math.random() * 8;
  grainData.data[i] = grainData.data[i+1] = grainData.data[i+2] = v;
  grainData.data[i+3] = 255;
}
grainCtx.putImageData(grainData, 0, 0);
const grainTex = new THREE.CanvasTexture(grainCanvas);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
grainTex.repeat.set(4, 4);
const grainPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, opacity: 0.04, depthWrite: false })
);
grainPlane.position.z = -10;
scene.add(grainPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = now / 1000;
  uniforms.uDispersion.value = dispersionStrength;
  step(dt);
  geom.attributes.position.needsUpdate = true;

  // slow camera orbit
  const ang = now * 0.00008;
  camera.position.x = Math.sin(ang) * 18;
  camera.position.z = Math.cos(ang) * 18;
  camera.lookAt(0, 0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
