<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>35g · six mass extinctions (we are watching the sixth)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#8a8272; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: radial-gradient(ellipse at 50% 45%, #2a221c 0%, #1a1612 68%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.48; font-size: 10px; letter-spacing: 0.04em;
          line-height: 1.6; max-width: 340px; }
  .counter { position:fixed; right:14px; top:14px; opacity:0.62; font-size: 10px; letter-spacing: 0.06em;
             text-align: right; line-height: 1.7; }
  .extinction { color: #6a5a4a; }
  .culled { color: #5a4a3a; }
</style>
</head>
<body>
<div class="id">35g · six mass extinctions (we are watching the sixth)</div>
<div class="hint">
  541 million years compressed to 90 seconds.<br>
  each particle: one genus. each extinction event: mass cull.<br>
  the sixth is happening now — you cannot see it happen.
</div>
<div class="counter" id="counter">
  <div class="extinction">Ordovician-Silurian (443 Mya) · 0%</div>
  <div class="culled">genera lost: 0 / 12,000</div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Timothy Morton's DARK ECOLOGY — scale that exceeds human pacing.
// The Phanerozoic eon (541 Mya → present) is a 90-second piece.
// Each particle is one biological genus. The flock drifts through deep time.
// Five historical mass extinctions cull the flock suddenly; the sixth
// (Holocene/Anthropocene, now) culls slowly, imperceptibly — you watch but
// cannot see it happen at human frame-rate.
//
// EXTINCTIONS (% genera lost):
//   1. Ordovician-Silurian (443 Mya) — 57%
//   2. Late Devonian (375 Mya) — 49%
//   3. Permian-Triassic (252 Mya) — 81% (The Great Dying)
//   4. Triassic-Jurassic (201 Mya) — 47%
//   5. Cretaceous-Paleogene (66 Mya) — 40% (dinosaurs)
//   6. Holocene (0.01 Mya → present) — ongoing, ~1% per century (exponential)
//
// Palette: muted earth tones (ochre, rust, charcoal) bleeding to dead grey.
// Motion: geological drift — particles move but imperceptibly slow relative
// to extinction-pulse speed. The viewer feels SCALE THEY CAN'T HOLD.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1612, 0.009);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── deep-time timeline
const PIECE_DURATION = 90;  // seconds
const PHANEROZOIC_START = 541;  // million years ago
const PHANEROZOIC_END = 0;

const EXTINCTIONS = [
  { mya: 443, name: 'Ordovician-Silurian', cull: 0.57 },
  { mya: 375, name: 'Late Devonian', cull: 0.49 },
  { mya: 252, name: 'Permian-Triassic', cull: 0.81 },
  { mya: 201, name: 'Triassic-Jurassic', cull: 0.47 },
  { mya: 66,  name: 'Cretaceous-Paleogene', cull: 0.40 },
  { mya: 0.01, name: 'Holocene (ongoing)', cull: 0.0 }  // sixth is slow
];

let pieceTime = 0;  // seconds elapsed in piece
let currentMya = PHANEROZOIC_START;
let extinctionIndex = 0;
let totalCulled = 0;

function myaFromPieceTime(t){
  return PHANEROZOIC_START - (t / PIECE_DURATION) * (PHANEROZOIC_START - PHANEROZOIC_END);
}

// ────────────── particle system
const MAX_GENERA = 12000;
const pos = new Float32Array(MAX_GENERA * 3);
const vel = new Float32Array(MAX_GENERA * 3);
const alive = new Uint8Array(MAX_GENERA);  // 1 = alive, 0 = extinct
const birthTime = new Float32Array(MAX_GENERA);  // Mya when genus appeared
const deathTime = new Float32Array(MAX_GENERA);  // Mya when genus went extinct (or Infinity)

let activeCount = MAX_GENERA;

// init: tight primordial cluster (Cambrian explosion remnants)
for (let i = 0; i < MAX_GENERA; i++){
  const r = (Math.random() * 0.5 + 0.3) * 2.5;
  const th = Math.random() * Math.PI * 2;
  const ph = (Math.random() - 0.5) * Math.PI * 0.6;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r;
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  // geological drift: extremely slow, sub-perceptible motion
  vel[i*3]     = (Math.random() - 0.5) * 0.012;
  vel[i*3 + 1] = (Math.random() - 0.5) * 0.008;
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.012;
  alive[i] = 1;
  birthTime[i] = PHANEROZOIC_START - Math.random() * 40;  // born near start
  deathTime[i] = Infinity;
}

function cullExtinction(cullFraction){
  // kill cullFraction of currently alive genera
  const toCull = Math.floor(activeCount * cullFraction);
  let culled = 0;
  for (let i = 0; i < MAX_GENERA && culled < toCull; i++){
    if (alive[i] === 1){
      alive[i] = 0;
      deathTime[i] = currentMya;
      culled++;
      totalCulled++;
    }
  }
  activeCount -= culled;
}

function cullHolocene(dt){
  // sixth extinction: slow exponential cull — 1% per century becomes
  // ~0.00001 per frame at 60fps. imperceptible in real-time.
  const cullRate = 0.000008;  // tuned so ~1% culls over 10 seconds
  const toCull = Math.floor(activeCount * cullRate * dt * 60);
  let culled = 0;
  for (let i = 0; i < MAX_GENERA && culled < toCull; i++){
    if (alive[i] === 1 && Math.random() < 0.02){
      alive[i] = 0;
      deathTime[i] = currentMya;
      culled++;
      totalCulled++;
    }
  }
  activeCount -= culled;
}

function updateTimeline(dt){
  pieceTime += dt;
  currentMya = myaFromPieceTime(pieceTime);

  // check if we crossed an extinction threshold
  if (extinctionIndex < EXTINCTIONS.length){
    const ext = EXTINCTIONS[extinctionIndex];
    if (currentMya <= ext.mya){
      if (ext.cull > 0){
        cullExtinction(ext.cull);
      }
      extinctionIndex++;
    }
  }

  // if we're in the Holocene window (last 0.01 Mya), cull slowly
  if (currentMya <= 0.01 && currentMya > 0){
    cullHolocene(dt);
  }

  // update counter UI
  const counterEl = document.getElementById('counter');
  let label = '';
  if (extinctionIndex < EXTINCTIONS.length){
    const ext = EXTINCTIONS[extinctionIndex];
    const pct = Math.max(0, Math.min(100, ((ext.mya - currentMya) / (ext.mya - (EXTINCTIONS[extinctionIndex+1]?.mya || 0))) * 100));
    label = `${ext.name} (${ext.mya} Mya) · ${Math.round(pct)}%`;
  } else {
    label = `present day · extinction ongoing`;
  }
  counterEl.innerHTML = `
    <div class="extinction">${label}</div>
    <div class="culled">genera lost: ${totalCulled.toLocaleString()} / ${MAX_GENERA.toLocaleString()}</div>
  `;
}

function stepParticles(dt){
  // geological drift — motion so slow the viewer cannot see individual
  // displacement per frame, only aggregate shift over 10+ seconds
  for (let i = 0; i < MAX_GENERA; i++){
    if (alive[i] === 0) continue;
    pos[i*3]     += vel[i*3] * dt;
    pos[i*3 + 1] += vel[i*3 + 1] * dt;
    pos[i*3 + 2] += vel[i*3 + 2] * dt;
    // soft bound — very gentle pull toward origin
    const dx = -pos[i*3] * 0.0008;
    const dy = -pos[i*3+1] * 0.0008;
    const dz = -pos[i*3+2] * 0.0008;
    vel[i*3]   += dx;
    vel[i*3+1] += dy;
    vel[i*3+2] += dz;
  }
}

// ────────────── render
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const aliveAttr = new Float32Array(MAX_GENERA);
for (let i = 0; i < MAX_GENERA; i++) aliveAttr[i] = alive[i];
geom.setAttribute('alive', new THREE.BufferAttribute(aliveAttr, 1));
const seedArr = new Float32Array(MAX_GENERA);
for (let i = 0; i < MAX_GENERA; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMya: { value: PHANEROZOIC_START }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMya;
    attribute float alive;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      if (alive < 0.5){
        gl_Position = vec4(0.0);
        gl_PointSize = 0.0;
        return;
      }
      vec3 p = position;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.2 + 0.4 * sin(uTime * 0.3 + seed * 6.28);
      gl_PointSize = baseSize * uPixel * (18.0 / dist);
      vAlpha = clamp(1.0 - (dist - 40.0) / 60.0, 0.0, 1.0);

      // palette: muted earth tones bleeding to dead grey
      // Cambrian (541 Mya): warm ochre / rust
      // Permian (252 Mya): charcoal / burnt umber
      // Present (0 Mya): cold dead grey
      float age = (541.0 - uMya) / 541.0;  // 0 at start, 1 at present
      vec3 ancient = vec3(0.72, 0.52, 0.32);  // ochre
      vec3 middle  = vec3(0.42, 0.32, 0.26);  // burnt umber
      vec3 modern  = vec3(0.38, 0.36, 0.34);  // dead grey
      vCol = mix(ancient, middle, smoothstep(0.0, 0.5, age));
      vCol = mix(vCol, modern, smoothstep(0.5, 1.0, age));
      // per-particle variation
      vCol *= (0.85 + seed * 0.3);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha * 0.7;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  updateTimeline(dt);
  stepParticles(dt);
  uniforms.uTime.value = pieceTime;
  uniforms.uMya.value = currentMya;

  // update alive buffer
  for (let i = 0; i < MAX_GENERA; i++){
    geom.attributes.alive.array[i] = alive[i];
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.alive.needsUpdate = true;

  // camera: slow drift — geological scale
  const ang = pieceTime * 0.008;
  camera.position.x = Math.sin(ang) * 50;
  camera.position.z = Math.cos(ang) * 50;
  camera.position.y = 8 + Math.sin(pieceTime * 0.004) * 4;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
