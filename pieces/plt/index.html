<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>plt · marbled vessel</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030305}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.165.0/examples/jsm/"}}</script></head><body><script type="module">
import * as T from'three';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';
const scene=new T.Scene();scene.background=new T.Color(0x030305);scene.fog=new T.FogExp2(0x030305,.018);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);camera.position.set(0,0,9);camera.lookAt(0,0,0);const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new T.Vector2(innerWidth,innerHeight),.38,.5,.42));const root=new T.Group();scene.add(root);const clock=new T.Clock();let update=()=>{};let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=1-e.clientY/innerHeight*2});
scene.add(new T.HemisphereLight(0xffffff,0x130b18,2.5));const u={uT:{value:0}};const mat=new T.ShaderMaterial({uniforms:u,vertexShader:`varying vec3 p;varying vec3 n;void main(){p=position;n=normal;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 p,n;uniform float uT;vec3 pal(float k){k=fract(k);if(k<.2)return vec3(.02,.01,.06);if(k<.4)return vec3(.98,.28,.02);if(k<.58)return vec3(1.,.25,.62);if(k<.76)return vec3(.12,.16,.55);if(k<.9)return vec3(.25,.38,.18);return vec3(.82,.66,.55);}void main(){float a=atan(p.z,p.x)+1.2*sin(p.y*1.7)+.25*sin(length(p.xz)*5.-uT*.08);float f=p.y*.22+a*.34+.08*sin(a*7.+p.y*4.);float b=floor(fract(f)*16.)/16.;vec3 c=pal(b*2.7);float rim=pow(1.-abs(dot(normalize(n),vec3(0.,0.,1.))),2.);gl_FragColor=vec4(c+rim*.18,1.);}`});const vessel=new T.Mesh(new T.TorusKnotGeometry(1.65,.62,360,48,2,3),mat);vessel.scale.set(1,1.28,.78);root.add(vessel);update=t=>{u.uT.value=t;root.rotation.y=t*.045;root.rotation.x=.18*Math.sin(t*.1)}
function loop(){const t=clock.getElapsedTime();update(t);composer.render();requestAnimationFrame(loop)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script></body></html>
