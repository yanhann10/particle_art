<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebs · color-field planes · rothko</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0604; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">ebs</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0604, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
camera.lookAt(0, 0, 0);

// Three horizontal bands: bottom (vermilion-rust), middle (maroon-plum), top (slate-rust)
const BANDS = [
  { y: -3.5, height: 5.0, color: new THREE.Color(0.62, 0.14, 0.08), count: 1400 },
  { y:  1.0, height: 4.2, color: new THREE.Color(0.45, 0.08, 0.15), count: 1200 },
  { y:  5.8, height: 3.8, color: new THREE.Color(0.32, 0.28, 0.25), count: 800 }
];

const planeGeom = new THREE.PlaneGeometry(0.24, 0.24);

BANDS.forEach(band => {
  const mesh = new THREE.InstancedMesh(planeGeom, new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: band.color },
      uTime: { value: 0 }
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      varying float vDepth;
      varying vec2 vLocalUV;
      void main() {
        vLocalUV = uv - 0.5;
        vec4 mvPos = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        vDepth = -mvPos.z;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uTime;
      varying float vDepth;
      varying vec2 vLocalUV;
      void main() {
        float edgeDist = max(abs(vLocalUV.x), abs(vLocalUV.y));
        float edge = smoothstep(0.35, 0.50, edgeDist);
        float core = 1.0 - edge * 0.4;
        
        float depthFade = exp(-vDepth * 0.012);
        float alpha = 0.065 * core * depthFade;
        
        vec3 col = uColor * (0.95 + 0.05 * sin(uTime * 0.3 + vDepth * 0.1));
        gl_FragColor = vec4(col, alpha);
      }
    `
  }), band.count);

  const dummy = new THREE.Object3D();
  const borderJitter = band.height * 0.22;
  
  for (let i = 0; i < band.count; i++) {
    const u = i / band.count;
    const x = (Math.random() - 0.5) * 16;
    const yBase = band.y + (Math.random() - 0.5) * band.height;
    
    // Soak edges: increase jitter near band vertical boundaries
    const distFromCenter = Math.abs(yBase - band.y) / (band.height * 0.5);
    const edgeWeight = Math.pow(distFromCenter, 0.6);
    const yJitter = (Math.random() - 0.5) * borderJitter * edgeWeight;
    const y = yBase + yJitter;
    
    const z = (Math.random() - 0.5) * 12;
    
    dummy.position.set(x, y, z);
    dummy.rotation.z = (Math.random() - 0.5) * 0.15;
    
    const scaleVariation = 0.7 + Math.random() * 0.6;
    dummy.scale.set(scaleVariation, scaleVariation, 1);
    
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  
  scene.add(mesh);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(t) {
  const seconds = t * 0.001;
  
  scene.children.forEach(child => {
    if (child.material && child.material.uniforms) {
      child.material.uniforms.uTime.value = seconds;
    }
  });
  
  camera.position.y = Math.sin(seconds * 0.08) * 0.6;
  camera.position.x = Math.sin(seconds * 0.05) * 0.8;
  camera.lookAt(0, 1.2, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop(0);
</script>
</body>
</html>
