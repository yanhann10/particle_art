<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wjb · pivot — Calder bump in Shiota's web</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">wjb</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.045);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x221111, 0.8);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
dirLight.position.set(-3, 5, 2);
scene.add(dirLight);

// ── Deterministic RNG
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Sphere — the still center (until it pivots)
const sphereRadius = 1.8;
const sphereHome = new THREE.Vector3(2.8, 0.6, -3.0);
const spherePos = sphereHome.clone();

const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.35,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.85
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereHome);
scene.add(sphere);

// Wire-frame twin — hidden until the pivot reveal
const wireGeo = new THREE.SphereGeometry(sphereRadius * 1.01, 16, 10);
const wireMat = new THREE.MeshBasicMaterial({
  color: 0xf0e8dc,
  wireframe: true,
  transparent: true,
  opacity: 0.0,
  depthWrite: false
});
const wireframe = new THREE.Mesh(wireGeo, wireMat);
wireframe.position.copy(sphereHome);
scene.add(wireframe);

// ── Room anchors
const ROOM = { w: 18, h: 12, d: 28 };
const anchors = [];

function wallPoint(){
  const face = Math.floor(rng() * 6);
  let x, y, z;
  const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;
  switch(face){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    case 5: z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

const NUM_ANCHORS = 600;
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.1 + rng() * 2.5;
    anchors.push(sphereHome.clone().add(dir.multiplyScalar(dist)));
  } else {
    anchors.push(wallPoint());
  }
}

// ── Build line segments
const NUM_LINES = 20000;
const linePositions = new Float32Array(NUM_LINES * 6);
// Track which vertex end is near the sphere (for pivot displacement)
const vertexNearSphere = new Uint8Array(NUM_LINES * 2); // 0 or 1 per vertex
let li = 0;

function sphereSurfacePoint(from){
  const dir = sphereHome.clone().sub(from).normalize();
  return sphereHome.clone().add(dir.multiplyScalar(-sphereRadius * (0.98 + rng()*0.04)));
}

function markNearSphere(idx, x, y, z){
  const dx = x - sphereHome.x, dy = y - sphereHome.y, dz = z - sphereHome.z;
  const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
  vertexNearSphere[idx] = d < sphereRadius + 3.0 ? 1 : 0;
}

// Cat A: wall-to-wall threads (~40%)
const catA = Math.floor(NUM_LINES * 0.4);
for (let i = 0; i < catA && li < NUM_LINES; i++){
  const a = wallPoint(), b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereHome) > 12 && rng() > 0.3){ i--; continue; }
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=b.x; linePositions[idx+4]=b.y; linePositions[idx+5]=b.z;
  markNearSphere(li*2, a.x, a.y, a.z);
  markNearSphere(li*2+1, b.x, b.y, b.z);
  li++;
}

// Cat B: threads converging on sphere (~35%)
const catB = Math.floor(NUM_LINES * 0.35);
for (let i = 0; i < catB && li < NUM_LINES; i++){
  const a = anchors[Math.floor(rng() * anchors.length)];
  const nearS = sphereSurfacePoint(a);
  nearS.x += (rng()-0.5)*0.5; nearS.y += (rng()-0.5)*0.5; nearS.z += (rng()-0.5)*0.5;
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=nearS.x; linePositions[idx+4]=nearS.y; linePositions[idx+5]=nearS.z;
  markNearSphere(li*2, a.x, a.y, a.z);
  markNearSphere(li*2+1, nearS.x, nearS.y, nearS.z);
  li++;
}

// Cat C: short local threads (~25%)
const catC = NUM_LINES - li;
for (let i = 0; i < catC && li < NUM_LINES; i++){
  const ai = Math.floor(rng() * anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 8; j++){
    const bi = Math.floor(rng() * anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.2){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) best = wallPoint();
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=best.x; linePositions[idx+4]=best.y; linePositions[idx+5]=best.z;
  markNearSphere(li*2, a.x, a.y, a.z);
  markNearSphere(li*2+1, best.x, best.y, best.z);
  li++;
}

const basePositions = new Float32Array(linePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Fragments
const fragments = [];
const NUM_FRAGMENTS = 18;
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.05 + rng() * 0.15;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(size, size*(0.3+rng()*1.4), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04+rng()*0.06, 0.02+rng()*0.03, 0.02+rng()*0.02),
    transparent: true,
    opacity: 0.6 + rng()*0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = rng();
  const segIdx = Math.floor(rng() * li) * 6;
  mesh.position.set(
    basePositions[segIdx]*(1-t) + basePositions[segIdx+3]*t,
    basePositions[segIdx+1]*(1-t) + basePositions[segIdx+4]*t,
    basePositions[segIdx+2]*(1-t) + basePositions[segIdx+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  mesh.userData.home = mesh.position.clone();
  mesh.userData.nearSphere = mesh.position.distanceTo(sphereHome) < sphereRadius + 3.0;
  fragments.push(mesh);
  scene.add(mesh);
}

// ── PIVOT SURPRISE — Calder-mobile bump
// Every ~20s the sphere suddenly swings to one side like it was nudged,
// dragging nearby threads, then settles back with a damped oscillation.
// During the swing the solid sphere briefly goes transparent revealing wireframe.
const PIVOT_PERIOD = 20.0;   // seconds between pivots
const PIVOT_DURATION = 4.0;  // how long the swing lasts
const PIVOT_SWING = 2.8;     // max displacement
const pivotDir = new THREE.Vector3(); // random direction each time
let pivotSeed = 0;

function pivotPhase(elapsed){
  const cycle = elapsed % PIVOT_PERIOD;
  if (cycle > PIVOT_DURATION) return { active: false, t: 0, displacement: new THREE.Vector3() };
  // normalised 0→1 through the swing
  const t = cycle / PIVOT_DURATION;
  // damped sine: big swing then settle
  // sin with exponential decay — like a pendulum after a bump
  const swing = Math.sin(t * Math.PI * 3.0) * Math.exp(-t * 3.0);
  // pick a new random direction at each cycle start
  const seed = Math.floor(elapsed / PIVOT_PERIOD);
  if (seed !== pivotSeed){
    pivotSeed = seed;
    // deterministic but varying direction each time
    const a = seed * 1.618;
    pivotDir.set(Math.sin(a * 3.1), Math.cos(a * 2.7) * 0.4, Math.sin(a * 1.9)).normalize();
  }
  const disp = pivotDir.clone().multiplyScalar(swing * PIVOT_SWING);
  return { active: true, t, displacement: disp, swing: Math.abs(swing) };
}

// ── Camera
const cameraPath = { radius: 6.5, height: 0.8, speed: 0.018, lookBias: new THREE.Vector3(0.5, 0.3, 0) };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const pv = pivotPhase(elapsed);

  // Update sphere position
  spherePos.copy(sphereHome).add(pv.displacement);
  sphere.position.copy(spherePos);
  wireframe.position.copy(spherePos);

  // During pivot: solid fades out, wireframe fades in (brief reveal of emptiness)
  if (pv.active){
    const reveal = pv.swing; // 0–1
    sphereMat.opacity = 0.85 - reveal * 0.7;
    wireMat.opacity = reveal * 0.5;
    // slight rotation on the sphere during swing
    sphere.rotation.z = pv.displacement.x * 0.15;
    sphere.rotation.x = pv.displacement.z * 0.1;
    wireframe.rotation.copy(sphere.rotation);
  } else {
    sphereMat.opacity = 0.85;
    wireMat.opacity = 0.0;
    sphere.rotation.z *= 0.95;
    sphere.rotation.x *= 0.95;
    wireframe.rotation.copy(sphere.rotation);
  }

  // Thread breathing + pivot displacement for near-sphere vertices
  const breathAmp = 0.015;
  const breathFreq = 0.3;
  const posAttr = lineGeo.attributes.position;
  const arr = posAttr.array;
  for (let i = 0; i < li * 2; i++){
    const vi = i * 3;
    const bx = basePositions[vi], by = basePositions[vi+1], bz = basePositions[vi+2];
    const phase = bx * 0.7 + by * 1.1 + bz * 0.5;
    const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;
    let px = bx + b, py = by + b * 0.7, pz = bz + b * 0.5;

    // If near sphere, drag toward pivot displacement (falloff by distance)
    if (vertexNearSphere[i] && pv.active){
      const dx = bx - sphereHome.x, dy = by - sphereHome.y, dz = bz - sphereHome.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      const influence = Math.max(0, 1.0 - (dist - sphereRadius) / 3.0);
      px += pv.displacement.x * influence;
      py += pv.displacement.y * influence;
      pz += pv.displacement.z * influence;
    }
    arr[vi] = px; arr[vi+1] = py; arr[vi+2] = pz;
  }
  posAttr.needsUpdate = true;

  // Fragments near sphere follow the pivot
  for (const frag of fragments){
    if (frag.userData.nearSphere && pv.active){
      const home = frag.userData.home;
      const dist = home.distanceTo(sphereHome);
      const influence = Math.max(0, 1.0 - (dist - sphereRadius) / 3.0);
      frag.position.set(
        home.x + pv.displacement.x * influence,
        home.y + pv.displacement.y * influence,
        home.z + pv.displacement.z * influence
      );
    } else if (!pv.active) {
      // settle back
      frag.position.lerp(frag.userData.home, 0.05);
    }
  }

  // Camera dolly
  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  camera.position.set(
    sphereHome.x + Math.cos(angle) * cr,
    sphereHome.y + cameraPath.height + Math.sin(elapsed * 0.012) * 1.5,
    sphereHome.z + Math.sin(angle) * cr
  );
  const lookTarget = spherePos.clone();
  lookTarget.x += Math.sin(elapsed * 0.04) * cameraPath.lookBias.x;
  lookTarget.y += Math.cos(elapsed * 0.03) * cameraPath.lookBias.y;
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
