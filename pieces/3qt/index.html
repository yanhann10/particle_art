<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3qt · physarum nerve weave · sage jenson agent field</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">3qt</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Physarum-inspired agent field. Each agent deposits pheromone into a trail texture,
// senses ahead-left/ahead/ahead-right, steers toward max density. Trail rendered as
// primary visual — organic nerve weave, mxsage SOTA fxhash 2024 aesthetic.
// Two complementary agent populations (A/B from parent hn4 merge) seeded in opposing
// circular zones; they grow webs toward each other and eventually mingle.

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
camera.position.z = 1;
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const W = 1024, H = 1024;
const N = 80000;  // 40k per population

// ────────────────────────── simulation state
const agents = new Float32Array(N * 4);  // x, y, angle, population
for (let i = 0; i < N; i++){
  const popA = i < N/2;
  const cx = popA ? 0.3 : 0.7;
  const cy = 0.5;
  const r = 0.08 + Math.random() * 0.05;
  const th = Math.random() * Math.PI * 2;
  agents[i*4]   = cx + Math.cos(th) * r;
  agents[i*4+1] = cy + Math.sin(th) * r;
  agents[i*4+2] = Math.random() * Math.PI * 2;
  agents[i*4+3] = popA ? 0 : 1;
}

// ────────────────────────── pheromone RT ping-pong
const trailRT = [
  new THREE.WebGLRenderTarget(W, H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.FloatType }),
  new THREE.WebGLRenderTarget(W, H, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.FloatType })
];
let trailIdx = 0;

// deposit shader: sum agent deposits as additive points onto trail
const depositGeom = new THREE.BufferGeometry();
const depositPos = new Float32Array(N * 3);
const depositPop = new Float32Array(N);
depositGeom.setAttribute('position', new THREE.BufferAttribute(depositPos, 3));
depositGeom.setAttribute('pop', new THREE.BufferAttribute(depositPop, 1));
const depositMat = new THREE.ShaderMaterial({
  uniforms: { uAspect: { value: W/H } },
  vertexShader: `
    attribute float pop;
    varying float vPop;
    void main(){
      vPop = pop;
      gl_Position = vec4(position.xy * 2.0 - 1.0, 0.0, 1.0);
      gl_PointSize = 2.5;
    }
  `,
  fragmentShader: `
    varying float vPop;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = exp(-d * 6.0) * 0.35;
      gl_FragColor = vPop < 0.5 ? vec4(a, 0.0, 0.0, 1.0) : vec4(0.0, a, 0.0, 1.0);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false
});
const depositPoints = new THREE.Points(depositGeom, depositMat);
const depositScene = new THREE.Scene();
depositScene.add(depositPoints);

// diffuse + decay shader
const diffuseMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null },
    uTexel: { value: new THREE.Vector2(1/W, 1/H) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform vec2 uTexel;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tTrail, vUv);
      // 3x3 box blur (diffusion)
      vec4 sum = vec4(0.0);
      for (int dy = -1; dy <= 1; dy++){
        for (int dx = -1; dx <= 1; dx++){
          sum += texture2D(tTrail, vUv + vec2(float(dx), float(dy)) * uTexel);
        }
      }
      sum /= 9.0;
      // decay
      sum *= 0.985;
      gl_FragColor = sum;
    }
  `
});
const diffuseQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), diffuseMat);
const diffuseScene = new THREE.Scene();
diffuseScene.add(diffuseQuad);

// ────────────────────────── display shader
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec4 trail = texture2D(tTrail, vUv);
      float r = trail.r;
      float g = trail.g;
      // population A → warm amber/rust (sage jenson biofilm palette)
      vec3 colA = vec3(0.95, 0.72, 0.52);
      // population B → cool cyan/steel
      vec3 colB = vec3(0.48, 0.78, 0.88);
      vec3 col = colA * r + colB * g;
      // edge-highlight: sharpen trails slightly
      float lum = r + g;
      col *= (0.6 + 0.9 * pow(lum, 1.4));
      // subtle film-grain texture (physarum mycelium feel)
      float grain = fract(sin(dot(vUv * 1234.56 + uTime * 0.1, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.03;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
const displayScene = new THREE.Scene();
displayScene.add(displayQuad);

// ────────────────────────── agent CPU step
const SENSOR_ANGLE = 0.4;
const SENSOR_DIST = 0.008;
const TURN_SPEED = 0.12;
const MOVE_SPEED = 0.004;

const senseCanvas = document.createElement('canvas');
senseCanvas.width = W;
senseCanvas.height = H;
const senseCtx = senseCanvas.getContext('2d', { willReadFrequently: true });

function stepAgents(){
  // read current trail texture to CPU for sensing
  renderer.readRenderTargetPixels(trailRT[trailIdx], 0, 0, W, H, new Uint8Array(W*H*4));
  // (above line is just to trigger the RT state; actual read per-agent below via getImageData)
  renderer.setRenderTarget(trailRT[trailIdx]);
  renderer.render(new THREE.Scene(), camera);  // dummy to ensure RT is current
  const imgData = senseCtx.getImageData(0, 0, W, H);
  renderer.setRenderTarget(null);

  for (let i = 0; i < N; i++){
    let x = agents[i*4];
    let y = agents[i*4+1];
    let a = agents[i*4+2];
    const p = agents[i*4+3];

    // sense three directions
    const senseL = sense(x, y, a - SENSOR_ANGLE, p, imgData.data);
    const senseC = sense(x, y, a, p, imgData.data);
    const senseR = sense(x, y, a + SENSOR_ANGLE, p, imgData.data);

    // steer toward max
    if (senseC > senseL && senseC > senseR){
      // keep heading
    } else if (senseL > senseR){
      a -= TURN_SPEED;
    } else if (senseR > senseL){
      a += TURN_SPEED;
    } else {
      // equal: random turn
      a += (Math.random() - 0.5) * TURN_SPEED * 2;
    }

    // move
    x += Math.cos(a) * MOVE_SPEED;
    y += Math.sin(a) * MOVE_SPEED;

    // wrap edges
    if (x < 0) x = 1;
    if (x > 1) x = 0;
    if (y < 0) y = 1;
    if (y > 1) y = 0;

    agents[i*4]   = x;
    agents[i*4+1] = y;
    agents[i*4+2] = a;
  }
}

function sense(x, y, angle, pop, data){
  const sx = x + Math.cos(angle) * SENSOR_DIST;
  const sy = y + Math.sin(angle) * SENSOR_DIST;
  const ix = Math.floor(sx * W);
  const iy = Math.floor(sy * H);
  if (ix < 0 || ix >= W || iy < 0 || iy >= H) return 0;
  const idx = (iy * W + ix) * 4;
  return pop < 0.5 ? data[idx] : data[idx+1];
}

// ────────────────────────── main loop
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;

  // agent step
  stepAgents();

  // deposit
  for (let i = 0; i < N; i++){
    depositPos[i*3]   = agents[i*4];
    depositPos[i*3+1] = agents[i*4+1];
    depositPos[i*3+2] = 0;
    depositPop[i] = agents[i*4+3];
  }
  depositGeom.attributes.position.needsUpdate = true;
  depositGeom.attributes.pop.needsUpdate = true;
  renderer.setRenderTarget(trailRT[trailIdx]);
  renderer.render(depositScene, camera);

  // diffuse + decay
  const nextIdx = 1 - trailIdx;
  diffuseMat.uniforms.tTrail.value = trailRT[trailIdx].texture;
  renderer.setRenderTarget(trailRT[nextIdx]);
  renderer.render(diffuseScene, camera);
  trailIdx = nextIdx;

  // display
  displayMat.uniforms.tTrail.value = trailRT[trailIdx].texture;
  displayMat.uniforms.uTime.value = t;
  renderer.setRenderTarget(null);
  renderer.render(displayScene, camera);

  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
