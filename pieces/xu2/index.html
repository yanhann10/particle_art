<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xu2 · physarum network (slime mold cognition on forest floor)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
         letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">xu2</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 300);
camera.position.set(-4, 18, 14);
camera.lookAt(-2, 0, -1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;

// Physarum parameters — multiple food sources (nuclei) placed asymmetrically
const nuclei = [
  { x: -6.2, z: -3.8, strength: 1.0 },
  { x:  3.5, z:  5.2, strength: 0.8 },
  { x:  7.1, z: -2.1, strength: 0.6 },
  { x: -2.0, z:  8.0, strength: 0.7 },
  { x:  1.2, z: -7.5, strength: 0.5 },
  { x: -8.5, z:  2.3, strength: 0.4 },
  { x:  5.8, z:  9.1, strength: 0.3 },
];

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uLightAng:  { value: 0 },
  uLightElev: { value: 0.4 },
  uNuclei:    { value: nuclei.map(n => new THREE.Vector3(n.x, 0, n.z)) },
  uNucleiStr: { value: nuclei.map(n => n.strength) },
};

const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uLightAng;
  uniform float uLightElev;
  uniform vec3 uNuclei[7];
  uniform float uNucleiStr[7];

  attribute vec2 gridPos;
  attribute float seed;
  attribute float trail;

  varying float vTrail;
  varying float vLight;
  varying float vDepth;
  varying float vLeaf;

  // Simplex-ish noise
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float noise2d(vec2 p){
    vec2 i = floor(p); vec2 f = fract(p);
    f = f*f*(3.0-2.0*f);
    float a = hash(i); float b = hash(i+vec2(1,0));
    float c = hash(i+vec2(0,1)); float d = hash(i+vec2(1,1));
    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
  }

  void main(){
    vec2 gp = gridPos;
    float t = uTime;

    // Physarum pheromone field: each particle drifts toward nearest trail
    // Compute attraction to nuclei (food sources)
    float totalAttract = 0.0;
    vec2 drift = vec2(0.0);
    for(int i = 0; i < 7; i++){
      vec2 toNuc = uNuclei[i].xz - gp;
      float d = length(toNuc);
      float att = uNucleiStr[i] / (1.0 + d * d * 0.08);
      drift += normalize(toNuc + 0.001) * att;
      totalAttract += att;
    }

    // Slime mold network: particles cluster along shortest-path corridors
    // Use interference of distance fields to create network edges
    float network = 0.0;
    for(int i = 0; i < 7; i++){
      for(int j = i+1; j < 7; j++){
        vec2 a = uNuclei[i].xz;
        vec2 b = uNuclei[j].xz;
        // Distance to line segment between nuclei
        vec2 ab = b - a;
        float tProj = clamp(dot(gp - a, ab) / dot(ab, ab), 0.0, 1.0);
        vec2 closest = a + ab * tProj;
        float distToEdge = length(gp - closest);
        // Sharper falloff = thinner veins
        float vein = exp(-distToEdge * distToEdge * 0.8) * uNucleiStr[i] * uNucleiStr[j];
        network += vein;
      }
    }

    // Pheromone wave motion (doubled speed per user direction)
    float wave1 = sin(gp.x * 0.9 + t * 1.2 + seed * 6.28) * 0.3;
    float wave2 = sin(gp.y * 1.1 - t * 0.9 + network * 3.0) * 0.25;

    // Particle position: mostly flat (forest floor plane) with slight height from trail density
    float trailHeight = network * 2.5 + totalAttract * 0.4;
    // Noise displacement — organic, non-symmetric
    float nx = noise2d(gp * 0.3 + t * 0.05);
    float nz = noise2d(gp * 0.3 + vec2(50.0) + t * 0.04);

    vec3 pos = vec3(
      gp.x + wave1 * (0.5 + network) + (nx - 0.5) * 0.8,
      trailHeight * (0.3 + 0.7 * smoothstep(0.1, 0.6, network)) + wave2 * network,
      gp.y + wave2 * (0.5 + network) + (nz - 0.5) * 0.8
    );

    // Leaf detection: particles near nuclei become leaf-shaped substrate
    float nearestNuc = 100.0;
    for(int i = 0; i < 7; i++){
      nearestNuc = min(nearestNuc, length(gp - uNuclei[i].xz));
    }
    vLeaf = smoothstep(3.0, 0.5, nearestNuc);

    // Turrell-style drifting light
    vec3 lightDir = normalize(vec3(
      cos(uLightAng) * cos(uLightElev),
      sin(uLightElev),
      sin(uLightAng) * cos(uLightElev)
    ));
    // Surface normal approximation (from height gradient)
    vec3 normal = normalize(vec3(-wave1 * 0.5, 1.0, -wave2 * 0.5));
    vLight = max(0.0, dot(normal, lightDir)) * 0.7 + 0.3;

    vTrail = network;
    vDepth = trailHeight;

    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
    float dist = -mv.z;
    // Particles on trails are slightly larger
    float size = mix(1.2, 3.5, smoothstep(0.0, 0.5, network));
    gl_PointSize = uPixel * max(1.0, size - dist * 0.03);
    gl_Position = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying float vTrail;
  varying float vLight;
  varying float vDepth;
  varying float vLeaf;

  void main(){
    vec2 d = gl_PointCoord - 0.5;
    float r = dot(d, d);
    if(r > 0.25) discard;

    // Palette: forest floor at night
    // Trail veins: bioluminescent amber-gold (Physarum yellow)
    vec3 trailColor = vec3(0.85, 0.65, 0.15);
    // Substrate: dark humus brown
    vec3 groundColor = vec3(0.06, 0.05, 0.04);
    // Leaf litter near nuclei: muted olive-brown
    vec3 leafColor = vec3(0.18, 0.16, 0.08);
    // Nuclei glow: warm amber
    vec3 nucleusGlow = vec3(0.95, 0.72, 0.2);

    float trailMix = smoothstep(0.05, 0.5, vTrail);
    vec3 baseColor = mix(groundColor, leafColor, vLeaf * 0.6);
    baseColor = mix(baseColor, trailColor, trailMix * 0.8);
    // Bright cores where trails converge
    baseColor = mix(baseColor, nucleusGlow, smoothstep(0.6, 1.2, vTrail));

    // Apply Turrell light — warm on lit side, cool shadow
    vec3 litColor = baseColor * (0.4 + vLight * 1.2);
    vec3 shadowTint = vec3(0.03, 0.04, 0.06);
    vec3 col = mix(shadowTint, litColor, 0.3 + vLight * 0.7);

    // Depth fog into darkness
    float fog = smoothstep(0.0, 4.0, vDepth);
    col = mix(col * 0.5, col, 0.4 + fog * 0.6);

    float alpha = (1.0 - smoothstep(0.15, 0.25, r)) * (0.3 + trailMix * 0.7);
    // Ground particles very faint, trail particles bright
    alpha *= mix(0.25, 1.0, trailMix);

    gl_FragColor = vec4(col, alpha);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
});

function buildParticles(){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);
  const trails = new Float32Array(N);

  let s = (Math.random() * 1e9) >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  // Distribute particles with bias toward network corridors
  const spread = 22;
  for(let i = 0; i < N; i++){
    let x, y;
    // 60% biased toward inter-nuclei corridors, 40% scattered
    if(rng() < 0.6){
      // Pick random pair of nuclei, place along corridor with jitter
      const a = nuclei[Math.floor(rng() * nuclei.length)];
      const b = nuclei[Math.floor(rng() * nuclei.length)];
      const t = rng();
      x = a.x + (b.x - a.x) * t + (rng() - 0.5) * 4.0;
      y = a.z + (b.z - a.z) * t + (rng() - 0.5) * 4.0;
    } else {
      x = (rng() - 0.5) * spread;
      y = (rng() - 0.5) * spread;
    }
    positions[i * 3] = x;
    positions[i * 3 + 1] = 0;
    positions[i * 3 + 2] = y;
    gridPositions[i * 2] = x;
    gridPositions[i * 2 + 1] = y;
    seeds[i] = rng();
    trails[i] = rng();
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
  geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
  geom.setAttribute('trail', new THREE.BufferAttribute(trails, 1));
  geom.computeBoundingSphere();
  return geom;
}

const geom = buildParticles();
const points = new THREE.Points(geom, mat);
scene.add(points);

// Subtle ground plane — dark substrate with grain
const groundGeo = new THREE.PlaneGeometry(50, 50);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x080604,
  transparent: true,
  opacity: 0.4,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

// Orbit
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0, orbitPhi = 0.7;
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if(!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.004;
  orbitPhi = Math.max(0.2, Math.min(1.3, orbitPhi - (e.clientY - prevY) * 0.004));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  // Drifting Turrell light — very slow arc
  uniforms.uLightAng.value = t * 0.06 + 0.8;
  uniforms.uLightElev.value = 0.25 + Math.sin(t * 0.03) * 0.15;

  // Camera: off-center, looking slightly away from geometric center
  // Slow drift, not rotation — observing, not performing
  const autoTheta = t * 0.02 + 0.4; // slow drift
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;
  const radius = 24;

  // Asymmetric lookAt — not center, shifted
  const lookX = -1.5 + Math.sin(t * 0.015) * 2.0;
  const lookZ = 1.0 + Math.cos(t * 0.012) * 1.5;

  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(lookX, 0.8, lookZ);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
