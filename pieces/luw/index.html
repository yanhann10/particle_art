<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>luw · the flock that loses one and finds it again (physarum)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a14; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      radial-gradient(ellipse at 50% 30%, rgba(42,31,58,0.4) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 80%, rgba(122,69,56,0.25) 0%, transparent 65%),
      linear-gradient(135deg, #0f0f1a 0%, #1a1626 40%, #2a1f2a 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #d09060; }
</style>
</head>
<body>
<div class="id">luw · the flock that loses one and finds it again (physarum)</div>
<div class="hint">no input — slime-mold agents deposit + follow pheromone trails</div>
<div class="src">descended from sav · physarum simulation · sage jenson</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Physarum slime-mold simulation replacing boids.
// Same emotional arc (TOGETHER → LOSS → SEEKING → RETURN), but now expressed
// through collective chemotaxis — the flock's cohesion is the trail network's
// density, the straggler is a single agent that deposits weaker pheromone and
// drifts away, the flock slows and reorients when it senses the straggler is
// disconnected from the main trail network.
//
// Trail texture holds pheromone concentration. Agents sense ahead-left, ahead,
// ahead-right and steer toward highest. Decay + diffusion make trails fade and
// spread. Visual is the accumulated trail field rendered as luminous fibers.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f0f1a, 0.022);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 150);
camera.position.set(0, 0, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── physarum agents
const N = 481;
const STRAGGLER = 0;
const agents = [];
const WORLD_SIZE = 18.0;
for (let i = 0; i < N; i++){
  const r = Math.random() * 1.2 + 0.3;
  const th = Math.random() * Math.PI * 2;
  agents.push({
    x: Math.cos(th) * r,
    y: Math.sin(th) * r,
    angle: Math.random() * Math.PI * 2,
    speed: 0.08 + Math.random() * 0.04,
    sensorDist: 0.8 + Math.random() * 0.4,
    sensorAngle: 0.42 + Math.random() * 0.15,
    turnSpeed: 0.32,
    depositStrength: i === STRAGGLER ? 0.15 : 0.45,
    isStraggler: i === STRAGGLER
  });
}
// straggler starts adjacent but with weak deposition
agents[STRAGGLER].x = -1.5;
agents[STRAGGLER].y = 0.8;
agents[STRAGGLER].sensorDist *= 0.6;
agents[STRAGGLER].turnSpeed *= 1.4;

// ────────────── pheromone field (ping-pong RT)
const TRAIL_RES = 512;
const trailTarget1 = new THREE.WebGLRenderTarget(TRAIL_RES, TRAIL_RES, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});
const trailTarget2 = trailTarget1.clone();
let trailRead = trailTarget1, trailWrite = trailTarget2;

const trailScene = new THREE.Scene();
const trailCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const trailQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    uniforms: {
      uTrail: { value: null },
      uDeposits: { value: null },
      uDecay: { value: 0.96 },
      uDiffuse: { value: 0.08 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTrail;
      uniform sampler2D uDeposits;
      uniform float uDecay;
      uniform float uDiffuse;
      varying vec2 vUv;
      void main(){
        vec2 px = 1.0 / vec2(512.0);
        float center = texture2D(uTrail, vUv).r;
        float n = texture2D(uTrail, vUv + vec2(0.0, px.y)).r;
        float s = texture2D(uTrail, vUv - vec2(0.0, px.y)).r;
        float e = texture2D(uTrail, vUv + vec2(px.x, 0.0)).r;
        float w = texture2D(uTrail, vUv - vec2(px.x, 0.0)).r;
        float diffused = mix(center, (n+s+e+w)*0.25, uDiffuse);
        float decayed = diffused * uDecay;
        float deposit = texture2D(uDeposits, vUv).r;
        float final = min(1.0, decayed + deposit);
        gl_FragColor = vec4(final, final, final, 1.0);
      }
    `
  })
);
trailScene.add(trailQuad);

// deposit texture (cleared each frame, agents write into it)
const depositCanvas = document.createElement('canvas');
depositCanvas.width = TRAIL_RES;
depositCanvas.height = TRAIL_RES;
const depositCtx = depositCanvas.getContext('2d', { willReadFrequently: false });
const depositTex = new THREE.CanvasTexture(depositCanvas);
depositTex.minFilter = THREE.LinearFilter;
depositTex.magFilter = THREE.LinearFilter;

// sample pheromone at world position
function sampleTrail(x, y){
  const u = (x / WORLD_SIZE + 1.0) * 0.5;
  const v = (y / WORLD_SIZE + 1.0) * 0.5;
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  const px = Math.floor(u * TRAIL_RES);
  const py = Math.floor(v * TRAIL_RES);
  const idx = (py * TRAIL_RES + px) * 4;
  const imgData = depositCtx.getImageData(px, py, 1, 1).data;
  return imgData[0] / 255.0;
}

// emotional arc
let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function stepAgents(dt){
  // measure flock cohesion via trail connectivity
  // main cluster centroid
  let cx = 0, cy = 0, count = 0;
  for (let i = 1; i < N; i++){
    cx += agents[i].x; cy += agents[i].y; count++;
  }
  cx /= count; cy /= count;
  const stragDist = Math.hypot(agents[STRAGGLER].x - cx, agents[STRAGGLER].y - cy);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 10.0));
  cohesion += (targetCohesion - cohesion) * dt * 0.5;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 5.0) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  // arc-driven behavior modifiers
  const speedMul = (arcStage === 'loss' || arcStage === 'seeking') ? 0.4
                  : arcStage === 'return' ? 0.7 : 1.0;

  depositCtx.clearRect(0, 0, TRAIL_RES, TRAIL_RES);
  depositCtx.fillStyle = 'white';

  for (let agent of agents){
    // sense three directions
    const sensorOffset = agent.sensorDist;
    const sensorAngle = agent.sensorAngle;
    const leftAngle = agent.angle - sensorAngle;
    const rightAngle = agent.angle + sensorAngle;
    const leftX = agent.x + Math.cos(leftAngle) * sensorOffset;
    const leftY = agent.y + Math.sin(leftAngle) * sensorOffset;
    const fwdX = agent.x + Math.cos(agent.angle) * sensorOffset;
    const fwdY = agent.y + Math.sin(agent.angle) * sensorOffset;
    const rightX = agent.x + Math.cos(rightAngle) * sensorOffset;
    const rightY = agent.y + Math.sin(rightAngle) * sensorOffset;

    // read trail texture at sensor positions
    const leftVal = sampleTrail(leftX, leftY);
    const fwdVal = sampleTrail(fwdX, fwdY);
    const rightVal = sampleTrail(rightX, rightY);

    // steer toward highest
    if (fwdVal > leftVal && fwdVal > rightVal){
      // keep forward
    } else if (fwdVal < leftVal && fwdVal < rightVal){
      // random turn when both sides equal
      agent.angle += (Math.random() - 0.5) * agent.turnSpeed;
    } else if (leftVal > rightVal){
      agent.angle -= agent.turnSpeed * dt * 60;
    } else if (rightVal > leftVal){
      agent.angle += agent.turnSpeed * dt * 60;
    }

    // straggler drift — additional wandering force
    if (agent.isStraggler){
      agent.angle += Math.sin(performance.now() * 0.0004) * 0.015;
    }

    // seeking behavior — non-straggler agents bias toward straggler when arc is 'seeking'
    if (!agent.isStraggler && (arcStage === 'seeking' || arcStage === 'return')){
      const toStragX = agents[STRAGGLER].x - agent.x;
      const toStragY = agents[STRAGGLER].y - agent.y;
      const toStragAngle = Math.atan2(toStragY, toStragX);
      let angleDiff = toStragAngle - agent.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      const seekStr = arcStage === 'seeking' ? 0.018 : 0.010;
      agent.angle += angleDiff * seekStr;
    }

    // move
    const speed = agent.speed * speedMul;
    agent.x += Math.cos(agent.angle) * speed;
    agent.y += Math.sin(agent.angle) * speed;

    // wrap bounds
    if (agent.x < -WORLD_SIZE) agent.x = WORLD_SIZE;
    if (agent.x > WORLD_SIZE) agent.x = -WORLD_SIZE;
    if (agent.y < -WORLD_SIZE) agent.y = WORLD_SIZE;
    if (agent.y > WORLD_SIZE) agent.y = -WORLD_SIZE;

    // deposit pheromone
    const u = (agent.x / WORLD_SIZE + 1.0) * 0.5;
    const v = (agent.y / WORLD_SIZE + 1.0) * 0.5;
    const px = Math.floor(u * TRAIL_RES);
    const py = Math.floor(v * TRAIL_RES);
    if (px >= 0 && px < TRAIL_RES && py >= 0 && py < TRAIL_RES){
      const alpha = agent.depositStrength;
      depositCtx.globalAlpha = alpha;
      depositCtx.fillRect(px, py, 2, 2);
    }
  }
  depositTex.needsUpdate = true;
}

// ────────────── trail display mesh
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    uTrail: { value: null },
    uTime: { value: 0 },
    uCohesion: { value: 1.0 }
  },
  transparent: true, depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uTrail;
    uniform float uTime;
    uniform float uCohesion;
    varying vec2 vUv;
    void main(){
      float trail = texture2D(uTrail, vUv).r;
      if (trail < 0.01) discard;
      
      // color palette tied to emotional arc
      vec3 warm = vec3(0.96, 0.65, 0.32);   // together: dawn amber
      vec3 hot = vec3(1.00, 0.92, 0.78);    // highlight
      vec3 cool = vec3(0.42, 0.55, 0.78);   // lost: steel blue
      vec3 lost = vec3(0.55, 0.32, 0.62);   // violet
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot, smoothstep(0.0, 1.0, uCohesion));
      
      float pulse = sin(uTime * 0.8 + trail * 12.0) * 0.5 + 0.5;
      vec3 col = mix(cohCol, highCol, pulse * 0.3);
      
      float intensity = pow(trail, 0.7) * 1.8;
      float alpha = smoothstep(0.0, 0.3, trail) * 0.85;
      
      gl_FragColor = vec4(col * intensity, alpha);
    }
  `
});
const displayGeo = new THREE.PlaneGeometry(WORLD_SIZE * 2, WORLD_SIZE * 2);
const displayMesh = new THREE.Mesh(displayGeo, displayMat);
scene.add(displayMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 180; s++){
  stepAgents(0.05);
  trailQuad.material.uniforms.uTrail.value = trailRead.texture;
  trailQuad.material.uniforms.uDeposits.value = depositTex;
  renderer.setRenderTarget(trailWrite);
  renderer.render(trailScene, trailCam);
  [trailRead, trailWrite] = [trailWrite, trailRead];
}

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  stepAgents(dt);

  // update trail texture
  trailQuad.material.uniforms.uTrail.value = trailRead.texture;
  trailQuad.material.uniforms.uDeposits.value = depositTex;
  renderer.setRenderTarget(trailWrite);
  renderer.render(trailScene, trailCam);
  [trailRead, trailWrite] = [trailWrite, trailRead];

  // display
  displayMat.uniforms.uTrail.value = trailRead.texture;
  displayMat.uniforms.uTime.value = now / 1000;
  displayMat.uniforms.uCohesion.value = cohesion;

  // slow camera orbit
  const ang = now * 0.00008;
  camera.position.x = Math.sin(ang) * 22;
  camera.position.z = Math.cos(ang) * 22;
  camera.lookAt(0, 0, 0);

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
