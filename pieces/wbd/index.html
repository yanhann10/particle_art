<div class="id">wbd</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040201, 0.006);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Single warm point light near the dress — darkness is the primary material
scene.add(new THREE.AmbientLight(0x060202, 0.04));
const pL = new THREE.PointLight(0xffe4c4, 0.18, 45, 1.8);
pL.position.set(2.0, 12.0, -1.5);
scene.add(pL);

let seed = 73914826;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — presence-in-absence, a body that was here
// Shiota's dresses are always empty — the person is gone, the garment remembers.
// Approximated: cone (skirt) + cylinder (bodice) + small sphere (collar)
const dressCenter = new THREE.Vector3(0.8, 1.0, -0.3);
const DRESS_TOP = dressCenter.y + 3.2;   // shoulder line
const DRESS_HEM = dressCenter.y - 4.5;   // skirt hem
const DRESS_WAIST = dressCenter.y + 0.8;
const BODICE_R = 0.55;
const HEM_R = 2.8;

// Bodice — slim cylinder
const bodiceMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.55,
  roughness: 0.92, metalness: 0, transparent: true, opacity: 0.24
});
const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(BODICE_R * 0.7, BODICE_R, DRESS_TOP - DRESS_WAIST, 12, 1, true),
  bodiceMat
);
bodice.position.set(dressCenter.x, (DRESS_TOP + DRESS_WAIST) / 2, dressCenter.z);
scene.add(bodice);

// Skirt — open cone
const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(BODICE_R, HEM_R, DRESS_WAIST - DRESS_HEM, 16, 1, true),
  bodiceMat.clone()
);
skirt.material.opacity = 0.20;
skirt.position.set(dressCenter.x, (DRESS_WAIST + DRESS_HEM) / 2, dressCenter.z);
scene.add(skirt);

// Collar / neckline — small sphere
const collar = new THREE.Mesh(
  new THREE.SphereGeometry(BODICE_R * 0.65, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xf5ede4, transparent: true, opacity: 0.12 })
);
collar.position.set(dressCenter.x, DRESS_TOP + 0.15, dressCenter.z);
scene.add(collar);

// Inner glow — faint core light
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.2, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xf8f0e6, transparent: true, opacity: 0.06 })
);
innerGlow.position.set(dressCenter.x, dressCenter.y + 0.5, dressCenter.z);
scene.add(innerGlow);

// ── HANGER + SUSPENSION WIRES — make the hanging physically legible
const hangerY = DRESS_TOP + 0.6;
const hangerW = 1.4;
const hangerPts = new Float32Array([
  // Hook up to ceiling
  dressCenter.x, hh, dressCenter.z,
  dressCenter.x, hangerY + 0.5, dressCenter.z,
  // Hook curve (simplified as 2 segments)
  dressCenter.x, hangerY + 0.5, dressCenter.z,
  dressCenter.x, hangerY, dressCenter.z,
  // Hanger bar
  dressCenter.x - hangerW, hangerY, dressCenter.z,
  dressCenter.x + hangerW, hangerY, dressCenter.z,
  // Shoulder slopes
  dressCenter.x - hangerW, hangerY, dressCenter.z,
  dressCenter.x - BODICE_R * 0.6, DRESS_TOP, dressCenter.z,
  dressCenter.x + hangerW, hangerY, dressCenter.z,
  dressCenter.x + BODICE_R * 0.6, DRESS_TOP, dressCenter.z,
  // Additional ceiling wires for stability
  dressCenter.x - 0.3, hh, dressCenter.z + 0.2,
  dressCenter.x - 0.1, hangerY + 0.3, dressCenter.z + 0.05,
  dressCenter.x + 0.4, hh, dressCenter.z - 0.25,
  dressCenter.x + 0.12, hangerY + 0.2, dressCenter.z - 0.08,
]);
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0404, transparent: true, opacity: 0.5
})));

// ── DRESS SURFACE SAMPLER — points on the dress silhouette for thread attachment
function dressSurf(){
  const t = rng();
  let y, r;
  if(t < 0.35){
    // Bodice
    y = DRESS_WAIST + rng() * (DRESS_TOP - DRESS_WAIST);
    const bodiceT = (y - DRESS_WAIST) / (DRESS_TOP - DRESS_WAIST);
    r = BODICE_R * (1.0 - bodiceT * 0.3);
  } else {
    // Skirt
    y = DRESS_HEM + rng() * (DRESS_WAIST - DRESS_HEM);
    const skirtT = (y - DRESS_HEM) / (DRESS_WAIST - DRESS_HEM);
    r = HEM_R + (BODICE_R - HEM_R) * skirtT;
  }
  const th = rng() * Math.PI * 2;
  const jr = r + (rng() - 0.5) * 0.06;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(th) * jr,
    y,
    dressCenter.z + Math.sin(th) * jr
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — radial shells around the dress, denser near bodice
const NUM_ANCHORS = 620;
const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [3.0, 6.5, 11.0, 16.0, 22.0];
const ptsPerShell = [40, 55, 55, 50, 40];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    anchors.push(new THREE.Vector3(
      dressCenter.x + r * Math.cos(th) * R + (rng()-0.5)*0.9,
      dressCenter.y + y * R * 0.85 + (rng()-0.5)*1.0,
      dressCenter.z + r * Math.sin(th) * R + (rng()-0.5)*0.9
    ));
  }
}

while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.45 ? wallPt() : wallPt().lerp(dressCenter, 0.1 + rng()*0.35);
  anchors.push(p);
}

// Void zones — negative space the camera can peer through
const voids = [
  { pos: new THREE.Vector3(dressCenter.x - 6, dressCenter.y + 7, dressCenter.z + 7), r: 2.6 },
  { pos: new THREE.Vector3(dressCenter.x + 7, dressCenter.y - 4, dressCenter.z - 6), r: 2.2 },
  { pos: new THREE.Vector3(dressCenter.x + 4, dressCenter.y + 9, dressCenter.z + 4), r: 1.9 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — 19,000 segments max
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-dressCenter.x, dy = my-dressCenter.y, dz = mz-dressCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Cat A: CONVERGENCE — threads reaching toward the dress like veins of memory
// ~50% of threads. Each connects an anchor or wall point to the dress surface.
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.38){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 12% stop short — threads that almost reach but fail
  // Presence-in-absence: the gap IS the meaning
  if(rng() < 0.12){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.15 + rng()*1.5));
    setLine(a, target);
  } else {
    setLine(a, dressSurf());
  }
}

// Cat B: STRUCTURAL WEB — anchor-to-anchor proximity connections
// Emergent density from proximity alone (casey_reas rule)
const THRESHOLD = 6.5;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.24);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 120000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;

  setLine(a, best);
  catBcount++;

  // Dendritic branching — Y-forks, morphogenetic growth
  if(rng() < 0.16 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.15 + rng()*0.55);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.2 + rng()*0.7));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      catBcount++;
      // Second generation
      if(rng() < 0.2 && li < NUM_LINES - 1){
        const mid2 = mid.clone().lerp(bEnd, 0.4 + rng()*0.35);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.08 + rng()*0.3));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          catBcount++;
        }
      }
    }
  }
}

// Cat C: COCOON — tight wrapping threads orbiting the dress silhouette
// Like silk around a chrysalis — the dress is being remembered, preserved
const catC = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = dressSurf();
  const toCenter = dressCenter.clone().sub(s1).normalize();
  // Tangent direction — wrapping, not radial
  const up = new THREE.Vector3(0, 1, 0);
  const tangent = new THREE.Vector3().crossVectors(toCenter, up).normalize();
  if(tangent.length() < 0.01) tangent.set(1, 0, 0);
  const perpUp = new THREE.Vector3().crossVectors(tangent, toCenter).normalize();

  const outA = s1.clone().add(toCenter.clone().multiplyScalar(-(0.1 + rng()*1.6)));
  const arcLen = 0.4 + rng() * 2.2;
  const outB = s1.clone()
    .add(toCenter.clone().multiplyScalar(-(0.1 + rng()*1.6)))
    .add(tangent.multiplyScalar((rng()-0.5) * arcLen))
    .add(perpUp.multiplyScalar((rng()-0.5) * arcLen * 0.6));

  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB);
}

// Cat D: GRAVITY / HEM DRIP — threads falling from skirt hem to floor
// The dress remembers weight, even without a body
const catD = Math.floor(NUM_LINES * 0.05);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const th = rng() * Math.PI * 2;
  const hemR = HEM_R * (0.85 + rng() * 0.3);
  const hemPt = new THREE.Vector3(
    dressCenter.x + Math.cos(th) * hemR,
    DRESS_HEM + (rng()-0.5)*0.3,
    dressCenter.z + Math.sin(th) * hemR
  );
  const floorPt = new THREE.Vector3(
    hemPt.x + (rng()-0.5)*1.8,
    -hh,
    hemPt.z + (rng()-0.5)*1.8
  );
  if(!inVoid(hemPt)) setLine(hemPt, floorPt);
}

// Cat E: LONG SPANS — wall-to-wall and wall-to-dress, architectural web
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.35 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, memory residue caught in the web
// Sparser than parent — the dress speaks loudly enough
const NUM_FRAGMENTS = 28;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.10;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.5 + rng()*0.8);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.4, h*(-0.05+rng()*0.1), 0,
    w*(0.06-rng()*0.25), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.2+rng()*0.3), h*(rng()*0.06), 0,
    w*(0.06-rng()*0.25), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.08, d*0.03),
    transparent: true,
    opacity: 0.10 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.65){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(1.5 + rng()*9.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate, slow sway around the dress
// Narrative arc: approach → circle → descend to hem → rise to look down through threads
const pathLen = 1200;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;

  // Tight asymmetric orbit — closer on one side, further on other
  const rX = 4.5 + Math.sin(p * 0.6) * 1.8 + Math.cos(p * 1.1 + 1.2) * 0.5;
  const rZ = 6.0 + Math.cos(p * 0.4) * 2.2 + Math.sin(p * 0.8 + 2.0) * 0.6;
  const x = cx + Math.sin(p) * rX;
  const z = cz + Math.cos(p) * rZ;

  // Vertical: starts at eye level, descends past hem, rises above to look down
  const yBase = cy + 0.3;
  const yWave = Math.sin(p * 0.3 + 0.5) * 5.5
              + Math.cos(p * 0.65 + 1.8) * 1.8
              + Math.sin(p * 1.2) * 0.4;
  const y = yBase + yWave;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

// Dress sway state — gentle pendular motion, not noise
let swayAngle = 0;
const swaySpeed = 0.003;
const swayAmp = 0.0008;

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible, < 0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0004 * Math.max(0, 1.0 - dist / 28.0);
    const phase = basePositions[idx]*0.18 + basePositions[idx+1]*0.22 + i*0.0008;
    const breath = Math.sin(t*0.018 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.25;
      arr[vi+1] = basePositions[vi+1] + breath*0.20;
      arr[vi+2] = basePositions[vi+2] + breath*0.22;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Dress sway — pendular, like air moving through the room
  swayAngle = Math.sin(t * swaySpeed) * swayAmp;
  const swayX = Math.sin(t * 0.004) * 0.015;
  const swayZ = Math.cos(t * 0.003) * 0.010;
  bodice.rotation.z = swayAngle * 0.8;
  bodice.position.x = dressCenter.x + swayX;
  skirt.rotation.z = swayAngle;
  skirt.position.x = dressCenter.x + swayX * 1.2;
  collar.position.x = dressCenter.x + swayX * 0.6;
  collar.position.z = dressCenter.z + swayZ * 0.5;

  // Glacial camera drift
  const speed = 0.0006;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress — the gravitational center of memory
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.002)*0.08;
  look.y += Math.cos(t*0.0018)*0.12 - 0.3;
  look.z += Math.sin(t*0.0024)*0.06;
  camera.lookAt(look);

  // Light sway
  pL.position.x = 2.0 + Math.sin(t*0.001)*0.3;
  pL.position.y = 12.0 + Math.cos(t*0.0008)*0.15;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
