  .hint { position:fixed; left:14px; top:14px; opacity:0.48; font-size: 10px; letter-spacing: 0.04em; }

<body>
<div class="id">9ju</div>
<div class="hint">drag to orbit · the monument inhales</div>
<div class="src">descended from b3s · Hans Haacke condensation</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// BALLOON SURPRISE — the withdrawn monument from b3s periodically inhales:
// every ~12 seconds particles swell outward from centroid into a taut sphere,
// the whole form lifts slightly as if buoyant, a faint warm blush appears,
// holds for a beat, then deflates back to its spiky monument silhouette.
// Like Hans Haacke's Condensation Cube — the form breathes, alive inside glass.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.2, 28);
camera.position.set(9, 6, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 4.2, 0);
controls.minDistance = 6;
controls.maxDistance = 16;

// ─────────── differential growth (3D, monument aspect ratio)
const MAX_VERTS = 2400;
const ATTRACT   = 0.055;
const REPEL_R   = 0.38;
const REPEL_STR = 0.12;
const NOISE     = 0.002;
const PRESSURE  = 0.0022;
const RISE      = 0.0055;
const MAX_D     = 0.32;

const verts = [];
for (let i = 0; i < 20; i++){
  const th = i / 20 * Math.PI * 2;
  const r = 1.2 + (Math.random() - 0.5) * 0.12;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.3;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.4 + 1.1 * Math.min(a * 1.8, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.4 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.04, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 900; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── compute centroid + max radius for balloon envelope
function computeCentroid(){
  let cx=0, cy=0, cz=0;
  for (const v of verts){ cx+=v.x; cy+=v.y; cz+=v.z; }
  const n = verts.length;
  return { x: cx/n, y: cy/n, z: cz/n };
}

// ─────────── particle constellation with balloon surprise
const PARTICLES_PER_VERT = 8;
const totalParticles = verts.length * PARTICLES_PER_VERT;
const particlePositions = new Float32Array(totalParticles * 3);
const restPositions = new Float32Array(totalParticles * 3);
const particleData = [];

const centroid = computeCentroid();

for (let i = 0; i < verts.length; i++){
  const v = verts[i];
  for (let p = 0; p < PARTICLES_PER_VERT; p++){
    const idx = i * PARTICLES_PER_VERT + p;
    const offset = (Math.random() - 0.5) * 0.08;
    const ox = v.x + (Math.random() - 0.5) * offset;
    const oy = v.y + (Math.random() - 0.5) * offset;
    const oz = v.z + (Math.random() - 0.5) * offset;
    particlePositions[idx * 3]     = ox;
    particlePositions[idx * 3 + 1] = oy;
    particlePositions[idx * 3 + 2] = oz;
    restPositions[idx * 3]     = ox;
    restPositions[idx * 3 + 1] = oy;
    restPositions[idx * 3 + 2] = oz;
    particleData.push({ x: ox, y: oy, z: oz });
  }
}

const particleGeom = new THREE.BufferGeometry();
particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

const vertShader = `
uniform float time;
uniform float rotationY;
uniform float inflateAmount;
uniform vec3 formCentroid;
varying vec3 vWorldPos;
varying float vDistFromCam;
varying float vInflate;
void main(){
  vec3 p = position;
  // autonomous rotation
  float c = cos(rotationY);
  float s = sin(rotationY);
  float nx = p.x * c - p.z * s;
  float nz = p.x * s + p.z * c;
  p.x = nx; p.z = nz;

  // rotate centroid too
  vec3 cen = formCentroid;
  float cnx = cen.x * c - cen.z * s;
  float cnz = cen.x * s + cen.z * c;
  cen.x = cnx; cen.z = cnz;

  // balloon inflate: push particles outward toward a sphere envelope
  vec3 fromCenter = p - cen;
  float dist = length(fromCenter);
  float targetR = 4.8; // balloon radius
  if (dist > 0.001 && inflateAmount > 0.0) {
    vec3 dir = fromCenter / dist;
    float spherePos = targetR;
    // lerp between current distance and sphere surface
    float newDist = mix(dist, spherePos, inflateAmount);
    p = cen + dir * newDist;
    // buoyancy lift during inflation
    p.y += inflateAmount * 1.8;
  }

  vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
  vWorldPos = (modelMatrix * vec4(p, 1.0)).xyz;
  vDistFromCam = -mvPos.z;
  vInflate = inflateAmount;
  gl_PointSize = mix(2.4, 3.2, inflateAmount) / vDistFromCam;
  gl_Position = projectionMatrix * mvPos;
}
`;

const fragShader = `
uniform vec3 cameraPos;
uniform float fogDensity;
uniform float inflateAmount;
uniform vec4 shyZones[4];
varying vec3 vWorldPos;
varying float vDistFromCam;
varying float vInflate;
void main(){
  float nearFade = smoothstep(0.8, 2.5, vDistFromCam);
  float farFade = 1.0 - smoothstep(16.0, 24.0, vDistFromCam);
  float distAlpha = nearFade * farFade;

  // shy zones — reduced during inflation (form asserts itself)
  float shyAlpha = 1.0;
  float shyWeight = 1.0 - vInflate * 0.8;
  for (int i = 0; i < 4; i++){
    vec3 zoneDir = normalize(shyZones[i].xyz);
    vec3 camDir = normalize(cameraPos);
    float alignment = dot(camDir, zoneDir);
    if (alignment > 0.3){
      float shyDist = length(vWorldPos - cameraPos);
      shyAlpha *= mix(1.0, smoothstep(4.0, 10.0, shyDist), shyWeight);
    }
  }

  // fog reduced during inflation — the form becomes present
  float effFog = fogDensity * (1.0 - vInflate * 0.6);
  float fogFactor = exp(-effFog * vDistFromCam);

  float alpha = distAlpha * shyAlpha * fogFactor * 0.72;
  if (alpha < 0.01) discard;

  // color: cool silver → warm blush during inflation
  vec3 coolColor = vec3(0.82, 0.84, 0.88);
  vec3 warmColor = vec3(0.94, 0.72, 0.68);  // terracotta blush
  vec3 col = mix(coolColor, warmColor, vInflate * vInflate);

  gl_FragColor = vec4(col, alpha);
}
`;

const particleMat = new THREE.ShaderMaterial({
  vertexShader: vertShader,
  fragmentShader: fragShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    time: { value: 0 },
    rotationY: { value: 0 },
    inflateAmount: { value: 0 },
    formCentroid: { value: new THREE.Vector3(centroid.x, centroid.y, centroid.z) },
    cameraPos: { value: camera.position.clone() },
    fogDensity: { value: 0.08 },
    shyZones: {
      value: [
        new THREE.Vector4(1, 0, 0, 6),
        new THREE.Vector4(-1, 0, 0, 6),
        new THREE.Vector4(0, 0, 1, 6),
        new THREE.Vector4(0, 0, -1, 6),
      ]
    }
  }
});

const particleMesh = new THREE.Points(particleGeom, particleMat);
scene.add(particleMesh);

const ambientLight = new THREE.AmbientLight(0x404560, 0.6);
scene.add(ambientLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── balloon breath cycle
// Cycle: 12s total. 0-7s normal monument. 7-8.5s inhale. 8.5-9.5s hold. 9.5-11s exhale. 11-12s settle.
function balloonCurve(t){
  const cycle = t % 14.0;
  if (cycle < 8.0) return 0.0;
  if (cycle < 9.5){
    // inhale — ease in
    const p = (cycle - 8.0) / 1.5;
    return p * p * (3.0 - 2.0 * p); // smoothstep
  }
  if (cycle < 10.5) return 1.0; // hold — taut
  if (cycle < 12.0){
    // exhale — ease out
    const p = 1.0 - (cycle - 10.5) / 1.5;
    return p * p * (3.0 - 2.0 * p);
  }
  return 0.0; // settle
}

const start = performance.now();
let growthDone = false;

function loop(t){
  const elapsed = (t - start) * 0.001;

  // continue growth briefly
  if (!growthDone && verts.length < MAX_VERTS){
    for (let s = 0; s < 2; s++) step();
    for (let i = 0; i < verts.length; i++){
      const v = verts[i];
      for (let p = 0; p < PARTICLES_PER_VERT; p++){
        const idx = i * PARTICLES_PER_VERT + p;
        if (idx < particleData.length){
          const offset = (Math.random() - 0.5) * 0.08;
          const px = v.x + (Math.random() - 0.5) * offset;
          const py = v.y + (Math.random() - 0.5) * offset;
          const pz = v.z + (Math.random() - 0.5) * offset;
          particlePositions[idx * 3]     = px;
          particlePositions[idx * 3 + 1] = py;
          particlePositions[idx * 3 + 2] = pz;
          restPositions[idx * 3]     = px;
          restPositions[idx * 3 + 1] = py;
          restPositions[idx * 3 + 2] = pz;
        }
      }
    }
    particleGeom.attributes.position.needsUpdate = true;
    // update centroid
    const cen = computeCentroid();
    particleMat.uniforms.formCentroid.value.set(cen.x, cen.y, cen.z);
    if (verts.length >= MAX_VERTS) growthDone = true;
  }

  // balloon inflation
  const inflate = balloonCurve(elapsed);
  particleMat.uniforms.inflateAmount.value = inflate;

  // autonomous rotation — slow drift
  particleMat.uniforms.rotationY.value = elapsed * 0.08;

  // variable fog density
  const fogBase = 0.065;
  const fogOsc = Math.sin(elapsed * 0.3) * 0.035;
  particleMat.uniforms.fogDensity.value = fogBase + fogOsc;

  particleMat.uniforms.cameraPos.value.copy(camera.position);
  particleMat.uniforms.time.value = elapsed;

  // camera tracks centroid with slight lift during inflation
  const liftY = inflate * 1.2;
  controls.target.y = 4.2 + liftY;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
