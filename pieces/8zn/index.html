<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8zn · reas process-field · sphere-drawing</title>
<!-- MOTION: accumulation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f1ed; overflow:hidden;
               color:#1a1614; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#1a1614; }
  .info { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; 
          letter-spacing: 0.04em; max-width:240px; text-align:right; line-height:1.45; }
</style>
</head>
<body>
<div class="id">8zn</div>
<div class="info">process-field · sphere agents · contact-drawing · after c.reas</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1ed);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Agent system: N=400 Elements moving on sphere surface
const N = 400;
const R = 5.0; // sphere radius

class Element {
  constructor(){
    // place on sphere
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    this.theta = theta;
    this.phi   = phi;
    this.pos   = new THREE.Vector3(
      R * Math.sin(phi) * Math.cos(theta),
      R * Math.sin(phi) * Math.sin(theta),
      R * Math.cos(phi)
    );
    
    // circular motion parameters
    this.angVel  = (0.002 + Math.random() * 0.004) * (Math.random() < 0.5 ? 1 : -1);
    this.radius  = 0.3 + Math.random() * 0.5; // local circle radius on tangent plane
    this.phase   = Math.random() * Math.PI * 2;
    this.circleCenter = this.pos.clone();
    
    // contact state
    this.contacts = [];
    this.contactTimes = new Map();
  }
  
  update(dt){
    this.phase += this.angVel;
    
    // tangent-plane circular motion approximation:
    // construct local tangent basis at current sphere position
    const up = this.pos.clone().normalize();
    const tangent = new THREE.Vector3(
      -Math.sin(this.theta),
      Math.cos(this.theta),
      0
    ).normalize();
    const bitangent = new THREE.Vector3().crossVectors(up, tangent).normalize();
    
    // move in circle on tangent plane
    const dx = Math.cos(this.phase) * this.radius;
    const dy = Math.sin(this.phase) * this.radius;
    const offset = tangent.clone().multiplyScalar(dx).add(bitangent.clone().multiplyScalar(dy));
    const newPos = this.circleCenter.clone().add(offset);
    
    // project back onto sphere
    this.pos.copy(newPos.normalize().multiplyScalar(R));
    
    // update spherical coords for drift correction
    this.theta = Math.atan2(this.pos.y, this.pos.x);
    this.phi   = Math.acos(this.pos.z / R);
    
    // drift circle center slowly along sphere surface
    const drift = 0.001;
    this.circleCenter.applyAxisAngle(new THREE.Vector3(
      Math.random() - 0.5,
      Math.random() - 0.5,
      Math.random() - 0.5
    ).normalize(), drift);
    this.circleCenter.normalize().multiplyScalar(R);
  }
}

const elements = [];
for (let i = 0; i < N; i++) elements.push(new Element());

// Connection quads
const EPSILON = 1.2; // contact threshold
const maxQuads = 5000;
let quadCount = 0;

const quadGeom = new THREE.BufferGeometry();
const quadPos  = new Float32Array(maxQuads * 4 * 3);
const quadAlpha = new Float32Array(maxQuads * 4);
const quadIndices = new Uint16Array(maxQuads * 6);

for (let i = 0; i < maxQuads; i++){
  const base = i * 6;
  const vbase = i * 4;
  quadIndices[base]   = vbase;
  quadIndices[base+1] = vbase+1;
  quadIndices[base+2] = vbase+2;
  quadIndices[base+3] = vbase;
  quadIndices[base+4] = vbase+2;
  quadIndices[base+5] = vbase+3;
}

quadGeom.setAttribute('position', new THREE.BufferAttribute(quadPos, 3));
quadGeom.setAttribute('alpha', new THREE.BufferAttribute(quadAlpha, 1));
quadGeom.setIndex(new THREE.BufferAttribute(quadIndices, 1));

const quadMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    void main(){
      vAlpha = alpha;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      // sumi-ink black with subtle warm undertone
      vec3 col = vec3(0.08, 0.07, 0.06);
      gl_FragColor = vec4(col, vAlpha * 0.18);
    }
  `
});

const quadMesh = new THREE.Mesh(quadGeom, quadMat);
scene.add(quadMesh);

// Agent markers (small circles)
const dotGeom = new THREE.BufferGeometry();
const dotPos  = new Float32Array(N * 3);
dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));

const dotMat = new THREE.PointsMaterial({
  size: 0.08,
  color: 0x1a1614,
  transparent: true,
  opacity: 0.65,
  sizeAttenuation: true
});

const dotMesh = new THREE.Points(dotGeom, dotMat);
scene.add(dotMesh);

// Background fade to white over time (slow accumulation reveal)
let fadeTimer = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const contactRecords = [];

function loop(t){
  const dt = 16.67;
  fadeTimer += dt;
  
  // update agents
  for (let i = 0; i < N; i++){
    elements[i].update(dt);
    dotPos[i*3]   = elements[i].pos.x;
    dotPos[i*3+1] = elements[i].pos.y;
    dotPos[i*3+2] = elements[i].pos.z;
  }
  dotGeom.attributes.position.needsUpdate = true;
  
  // detect contacts and spawn quads
  for (let i = 0; i < N; i++){
    for (let j = i+1; j < N; j++){
      const dist = elements[i].pos.distanceTo(elements[j].pos);
      if (dist < EPSILON){
        // contact — draw connecting quad
        if (quadCount < maxQuads){
          // quad corners: perpendicular to line between agents
          const mid = new THREE.Vector3().addVectors(elements[i].pos, elements[j].pos).multiplyScalar(0.5);
          const dir = new THREE.Vector3().subVectors(elements[j].pos, elements[i].pos).normalize();
          const perp = new THREE.Vector3(-dir.y, dir.x, dir.z * 0.5).normalize().multiplyScalar(0.25);
          
          const c1 = elements[i].pos.clone().add(perp);
          const c2 = elements[i].pos.clone().sub(perp);
          const c3 = elements[j].pos.clone().sub(perp);
          const c4 = elements[j].pos.clone().add(perp);
          
          const base = quadCount * 4 * 3;
          quadPos[base]    = c1.x; quadPos[base+1]  = c1.y; quadPos[base+2]  = c1.z;
          quadPos[base+3]  = c2.x; quadPos[base+4]  = c2.y; quadPos[base+5]  = c2.z;
          quadPos[base+6]  = c3.x; quadPos[base+7]  = c3.y; quadPos[base+8]  = c3.z;
          quadPos[base+9]  = c4.x; quadPos[base+10] = c4.y; quadPos[base+11] = c4.z;
          
          // alpha grows with contact duration
          const key = `${i}_${j}`;
          if (!contactRecords[quadCount]) contactRecords[quadCount] = { key, time: 0 };
          contactRecords[quadCount].time = Math.min(contactRecords[quadCount].time + dt, 1500);
          const alpha = Math.min(1.0, contactRecords[quadCount].time / 800);
          
          const abase = quadCount * 4;
          quadAlpha[abase] = quadAlpha[abase+1] = quadAlpha[abase+2] = quadAlpha[abase+3] = alpha;
          
          quadCount++;
        }
      }
    }
  }
  
  quadGeom.attributes.position.needsUpdate = true;
  quadGeom.attributes.alpha.needsUpdate = true;
  quadGeom.setDrawRange(0, quadCount * 6);
  
  // slow rotation
  scene.rotation.y = t * 0.00008;
  scene.rotation.x = Math.sin(t * 0.00005) * 0.1;
  
  // camera gentle drift
  camera.position.x = Math.sin(t * 0.00012) * 2;
  camera.position.y = Math.cos(t * 0.00009) * 1.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop(0);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
