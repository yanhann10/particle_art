<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lwi · rubato growth tower</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#080b0e; overflow:hidden;
               color:#dde6d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">lwi</div>
<div class="hint">drag to orbit · scroll to zoom · click to pause/resume</div>
<div class="src">2m2 × rubato · stolen time bends the tower's breath</div>
<div class="stat" id="stat">vertices=0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// INTENT: The parent's differential-growth tower now breathes with rubato —
// musical stolen time. Growth rate is non-uniform along the polyline: some
// zones linger in dense coral elaboration while others rush upward in sudden
// vertical leaps. A slow sine wave shifts the rubato phase so the tower
// seems to inhale and exhale. The viewer sees breathing rhythm in the
// tower's silhouette — knotted dense zones alternating with stretched gaps.
// Named technique: differential growth + Thomas attractor (inherited).
// Evokes Neri Oxman's Wanderers — biological growth with variable density.
// Hybridizes the density-variation quality into the growth pacing.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080b0e, 0.030);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 250);
camera.position.set(10, 9, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080b0e, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────────────── Thomas attractor field evaluation
const THOMAS_B = 0.208186;
function thomasField(x, y, z) {
  return {
    dx: Math.sin(y) - THOMAS_B * x,
    dy: Math.sin(z) - THOMAS_B * y,
    dz: Math.sin(x) - THOMAS_B * z
  };
}

// ─────────────────── curve state (differential growth + Thomas + RUBATO)
const MAX_VERTS = 4000;
const ATTRACT   = 0.055;
const REPEL_R   = 0.42;
const REPEL_STR = 0.11;
const NOISE     = 0.002;
const PRESSURE  = 0.0022;
const RISE      = 0.004;
const MAX_D     = 0.32;
const THOMAS_SCALE = 0.35;
const THOMAS_SPATIAL = 0.18;
let paused = false;
let simTime = 0;

// rubato parameters — the stolen-time wave
const RUBATO_WAVELENGTH = 0.28; // fraction of polyline per rubato cycle
const RUBATO_DEPTH = 0.72;     // how much time is "stolen" (0=none, 1=full stop)
const RUBATO_DRIFT = 0.0003;   // how fast the rubato phase shifts per step

// initial wobbly ring at y=0
const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2;
  const r = 1.3 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0, rubato: 0 });
}

// 3D spatial hash
const CELL = REPEL_R;
const grid = new Map();
function hashKey(x, y, z){
  return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL);
}
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = hashKey(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++)
    for (let dy=-1; dy<=1; dy++)
      for (let dz=-1; dz<=1; dz++){
        const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if (arr) for (const idx of arr) out.push(idx);
      }
  return out;
}

// rubato factor: returns 0..1 where 0 = full linger, 1 = full rush
function rubatoFactor(polyFrac, time){
  // slow-shifting sine wave along the polyline
  const phase = polyFrac / RUBATO_WAVELENGTH + time;
  const raw = Math.sin(phase * Math.PI * 2);
  // map [-1,1] → [1-depth, 1+depth*0.6] — lingering is deeper than rushing
  // so dense zones are more pronounced than stretched ones
  return 1.0 + raw * RUBATO_DEPTH * (raw > 0 ? 0.55 : 1.0);
}

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  simTime += RUBATO_DRIFT;

  rebuildGrid();
  const fx = new Float32Array(n), fy = new Float32Array(n), fz = new Float32Array(n);

  // repulsion via spatial hash
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      fx[i] += ex*f; fy[i] += ey*f; fz[i] += ez*f;
    }
  }
  // attraction to polyline neighbors
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    fx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    fy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    fz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  // outward pressure from centroid
  let ccx = 0, ccy = 0, ccz = 0;
  for (let i = 0; i < n; i++){ ccx += verts[i].x; ccy += verts[i].y; ccz += verts[i].z; }
  ccx /= n; ccy /= n; ccz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x-ccx, oy = verts[i].y-ccy, oz = verts[i].z-ccz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    fx[i] += (ox/d)*PRESSURE;
    fy[i] += (oy/d)*PRESSURE*0.35;
    fz[i] += (oz/d)*PRESSURE;
  }

  // Thomas attractor field deformation
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const sx = v.x * THOMAS_SPATIAL, sy = v.y * THOMAS_SPATIAL, sz = v.z * THOMAS_SPATIAL;
    const tf = thomasField(sx, sy, sz);
    const ageFactor = Math.min(v.age * 2.0, 1.0);
    const str = THOMAS_SCALE * ageFactor * 0.006;
    fx[i] += tf.dx * str;
    fy[i] += tf.dy * str * 0.5;
    fz[i] += tf.dz * str;
  }

  // RUBATO — apply forces + age-proportional upward drift, MODULATED by rubato wave
  for (let i = 0; i < n; i++){
    const polyFrac = i / n;
    const rb = rubatoFactor(polyFrac, simTime);
    verts[i].rubato = rb; // store for rendering

    const a = verts[i].age;
    // rubato scales the upward drift: lingering zones barely rise, rushing zones leap
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0)) * rb;

    // lateral forces also breathe with rubato — dense zones get more lateral elaboration
    const lateralScale = 1.0 + (1.0 - rb) * 0.4; // lingering = more lateral spread

    verts[i].x += fx[i] * lateralScale + (Math.random()-0.5)*NOISE;
    verts[i].y += fy[i] * rb + (Math.random()-0.5)*NOISE*0.4 + upward;
    verts[i].z += fz[i] * lateralScale + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012 * rb; // age slower in lingering zones
  }

  // subdivide — rubato affects subdivision threshold: lingering zones subdivide more densely
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    const dist2 = ex*ex + ey*ey + ez*ez;
    // lingering zones (low rubato) subdivide at shorter distances → denser coral
    const rb = a.rubato || 1.0;
    const localMaxD = MAX_D * (0.7 + 0.5 * Math.min(rb, 1.4));
    if (dist2 > localMaxD*localMaxD && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x: (a.x+b.x)*0.5,
        y: (a.y+b.y)*0.5 - 0.04,
        z: (a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.45,
        rubato: (a.rubato + (b.rubato||1)) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-warm
for (let s = 0; s < 850; s++) step();

addEventListener('click', () => { paused = !paused; });

// ─────────────────── main particle cloud along polyline
const N_MAIN = 50000;
const mPos = new Float32Array(N_MAIN * 3);
const mSeed = new Float32Array(N_MAIN);
const mHgt = new Float32Array(N_MAIN);
const mAge = new Float32Array(N_MAIN);
const mRub = new Float32Array(N_MAIN); // rubato factor per particle
for (let i = 0; i < N_MAIN; i++) mSeed[i] = Math.random();

const gMain = new THREE.BufferGeometry();
gMain.setAttribute('position', new THREE.BufferAttribute(mPos, 3));
gMain.setAttribute('seed',     new THREE.BufferAttribute(mSeed, 1));
gMain.setAttribute('hgt',      new THREE.BufferAttribute(mHgt, 1));
gMain.setAttribute('age',      new THREE.BufferAttribute(mAge, 1));
gMain.setAttribute('rub',      new THREE.BufferAttribute(mRub, 1));

const uMain = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uYMax:  { value: 1 },
  uBreath:{ value: 0 } // global rubato breath phase
};
const matMain = new THREE.ShaderMaterial({
  uniforms: uMain,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    uniform float uBreath;
    attribute float seed;
    attribute float hgt;
    attribute float age;
    attribute float rub;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // rubato micro-drift: lingering particles sway more laterally
      float sway = mix(0.008, 0.003, clamp(rub, 0.0, 1.5) / 1.5);
      float t = uTime * 0.3 + seed * 6.28;
      p.x += sway * sin(t);
      p.z += sway * cos(t * 0.7);
      // subtle vertical breath — particles in rush zones drift slightly upward
      p.y += 0.002 * max(rub - 1.0, 0.0) * sin(uTime * 0.15 + seed * 3.0);

      float h = clamp(hgt / max(uYMax, 0.5), 0.0, 1.0);
      // ash → rust → bone (inherited palette)
      vec3 ash  = vec3(0.38, 0.36, 0.34);
      vec3 rust = vec3(0.62, 0.32, 0.22);
      vec3 bone = vec3(0.88, 0.84, 0.76);
      vec3 col = mix(ash, rust, smoothstep(0.0, 0.5, h));
      col = mix(col, bone, smoothstep(0.5, 1.0, h));
      // rubato warmth: lingering zones flush slightly warmer (more rust)
      float lingerWarm = max(1.0 - rub, 0.0) * 0.08;
      col.r += lingerWarm;
      col.g -= lingerWarm * 0.3;
      // slight variation from age
      col += 0.03 * sin(age * 40.0 + seed * 3.0);
      vCol = col;

      // lingering zones are denser → slightly brighter opacity cluster
      vAlpha = 0.58 + max(1.0 - rub, 0.0) * 0.12;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      // lingering zones: slightly larger points (denser coral feeling)
      float sizeScale = 1.3 + max(1.0 - rub, 0.0) * 0.3;
      gl_PointSize = sizeScale * uPixel * (38.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d,d);
      if (r2 > 0.25) discard;
      float a = exp(-r2 * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
scene.add(new THREE.Points(gMain, matMain));

// ─────────────────── sparse atmospheric dust
const N_DUST = 1500;
const dPos = new Float32Array(N_DUST * 3);
const dSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dPos[i*3]   = (Math.random()-0.5) * 28;
  dPos[i*3+1] = Math.random() * 22;
  dPos[i*3+2] = (Math.random()-0.5) * 28;
  dSeed[i] = Math.random();
}
const gDust = new THREE.BufferGeometry();
gDust.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
gDust.setAttribute('seed',     new THREE.BufferAttribute(dSeed, 1));
const matDust = new THREE.ShaderMaterial({
  uniforms: { uTime: uMain.uTime, uPixel: uMain.uPixel },
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      float t = uTime * 0.08 + seed * 6.28;
      p.x += sin(t) * 0.4;
      p.y += cos(t * 0.6) * 0.25;
      vA = 0.12 + 0.06 * sin(seed * 20.0 + uTime * 0.2);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 0.8 * uPixel * (20.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      gl_FragColor = vec4(0.55, 0.52, 0.48, vA * 0.35);
    }
  `
});
scene.add(new THREE.Points(gDust, matDust));

// ─────────────────── resize
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const t0 = performance.now();

function loop(){
  const time = (performance.now() - t0) / 1000;
  uMain.uTime.value = time;
  uMain.uBreath.value = Math.sin(time * 0.1) * 0.5 + 0.5;

  for (let s = 0; s < 3; s++) step();

  // distribute render particles along polyline
  const n = verts.length;
  let yMax = 0;
  if (n > 1){
    const lengths = []; let total = 0;
    for (let i = 0; i < n; i++){
      const a = verts[i], b = verts[(i+1)%n];
      const L = Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z);
      lengths.push(L); total += L;
      if (a.y > yMax) yMax = a.y;
    }
    if (total > 0){
      let written = 0;
      for (let i = 0; i < n; i++){
        const share = (i === n-1) ? N_MAIN - written : Math.max(1, Math.floor(N_MAIN * lengths[i] / total));
        const a = verts[i], b = verts[(i+1)%n];
        for (let k = 0; k < share && written < N_MAIN; k++){
          const u = Math.random();
          const j3 = written * 3;
          mPos[j3]   = a.x+(b.x-a.x)*u + (Math.random()-0.5)*0.016;
          mPos[j3+1] = a.y+(b.y-a.y)*u + (Math.random()-0.5)*0.016;
          mPos[j3+2] = a.z+(b.z-a.z)*u + (Math.random()-0.5)*0.016;
          mAge[written] = Math.max(a.age, b.age);
          mHgt[written] = a.y + (b.y-a.y)*u;
          mRub[written] = (a.rubato||1) + ((b.rubato||1)-(a.rubato||1))*u;
          written++;
        }
      }
      gMain.attributes.position.needsUpdate = true;
      gMain.attributes.age.needsUpdate = true;
      gMain.attributes.hgt.needsUpdate = true;
      gMain.attributes.rub.needsUpdate = true;
    }
  }
  uMain.uYMax.value = Math.max(yMax, 1.0);

  // camera tracks centroid
  let yMean = 0;
  if (n > 0){ for (let i = 0; i < n; i++) yMean += verts[i].y; yMean /= n; }
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.035;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.035;

  statEl.textContent = `vertices=${n} · height=${yMax.toFixed(1)} · centroid=${yMean.toFixed(1)}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){
      document.getElementById('gp-'+k).value=G[k];
      document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    arr.push({id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con});
    store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:arr[arr.length-1]})}).catch(function(){});
  };
  renderSaved();
})();
</script>
</body>
</html>
