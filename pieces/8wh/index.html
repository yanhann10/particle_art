<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8wh · patient (Martin graphite bands)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f9f7f3; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">8wh</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Intent ──────────────────────────────────────────────────────
   The viewer sees a luminous field of graphite-thin horizontal
   bands breathing with imperceptible patience — Agnes Martin's
   devotional restraint rendered in 80 000 points. A slow wash
   of pale warmth drifts across the surface like morning light
   crossing a studio wall. The grid is hand-drawn: every line
   wobbles slightly, every band varies in density. Edges dissolve
   into cream. The whole surface exhales.
   ────────────────────────────────────────────────────────────── */

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.set(0, 0, 5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf9f7f3, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const ROWS = 140;
const COLS = Math.ceil(N / ROWS);

/* ── Seeded RNG ── */
let _s = 839201745 >>> 0;
function rng() {
  _s |= 0; _s = _s + 0x6D2B79F5 | 0;
  let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

/* ── Build grid: horizontal bands with hand-drawn wobble ── */
const gridPos = new Float32Array(N * 2);
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const bandIdx = new Float32Array(N);

const fieldW = 2.0;
const fieldH = 2.0;
const marginX = 0.12;
const marginY = 0.10;
const innerW = fieldW - marginX * 2;
const innerH = fieldH - marginY * 2;

let idx = 0;
for (let row = 0; row < ROWS && idx < N; row++) {
  /* Martin's bands vary in density — some rows are sparser */
  const rowDensity = 0.7 + 0.3 * (0.5 + 0.5 * Math.sin(row * 0.37 + 2.1));
  const colsThisRow = Math.floor(COLS * rowDensity);

  const yNorm = row / (ROWS - 1);
  const baseY = -fieldH * 0.5 + marginY + yNorm * innerH;

  for (let col = 0; col < colsThisRow && idx < N; col++) {
    const xNorm = col / (colsThisRow - 1 || 1);
    const baseX = -fieldW * 0.5 + marginX + xNorm * innerW;

    /* Hand-drawn wobble: vertical tiny, horizontal subtle */
    const wobbleY = (rng() - 0.5) * 0.0025;
    const wobbleX = (rng() - 0.5) * 0.004;

    const x = baseX + wobbleX;
    const y = baseY + wobbleY;

    gridPos[idx * 2] = x;
    gridPos[idx * 2 + 1] = y;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    seeds[idx] = rng();
    bandIdx[idx] = row;
    idx++;
  }
}
/* Fill remainder */
while (idx < N) {
  const x = (rng() - 0.5) * innerW;
  const y = (rng() - 0.5) * innerH;
  gridPos[idx * 2] = x;
  gridPos[idx * 2 + 1] = y;
  positions[idx * 3] = x;
  positions[idx * 3 + 1] = y;
  positions[idx * 3 + 2] = 0;
  seeds[idx] = rng();
  bandIdx[idx] = Math.floor(rng() * ROWS);
  idx++;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('aGridPos', new THREE.BufferAttribute(gridPos, 2));
geom.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aBand', new THREE.BufferAttribute(bandIdx, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uAspect:{ value: innerWidth / innerHeight },
  uFieldH:{ value: fieldH },
  uFieldW:{ value: fieldW },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uAspect;
    uniform float uFieldH;
    uniform float uFieldW;

    attribute vec2 aGridPos;
    attribute float aSeed;
    attribute float aBand;

    varying float vWash;
    varying float vEdge;
    varying float vBandPhase;
    varying float vSeed;

    void main() {
      vec2 gp = aGridPos;

      /* ── Breathing: imperceptible vertical drift per band ── */
      float bandPhase = aBand * 0.0449;
      float breath1 = sin(uTime * 0.12 + bandPhase * 6.28) * 0.0012;
      float breath2 = sin(uTime * 0.067 + gp.x * 2.0 + bandPhase * 3.0) * 0.0008;

      /* Very slow horizontal drift — light crossing the wall */
      float hDrift = sin(uTime * 0.04 + gp.y * 1.5) * 0.0006;

      vec2 p = gp + vec2(hDrift, breath1 + breath2);

      /* ── Edge dissolution ── */
      float halfW = uFieldW * 0.5;
      float halfH = uFieldH * 0.5;
      float edgeX = 1.0 - smoothstep(halfW * 0.72, halfW * 0.96, abs(p.x));
      float edgeY = 1.0 - smoothstep(halfH * 0.70, halfH * 0.95, abs(p.y));
      vEdge = edgeX * edgeY;

      /* ── Wash: slow golden warmth drifting across ── */
      float washX = (p.x + halfW) / uFieldW;
      float washY = (p.y + halfH) / uFieldH;
      float washWave = sin(washX * 3.14 + uTime * 0.03) * 0.5 + 0.5;
      float washWave2 = sin(washY * 2.0 - uTime * 0.02 + 1.0) * 0.5 + 0.5;
      vWash = washWave * washWave2;

      vBandPhase = bandPhase;
      vSeed = aSeed;

      /* ── Orthographic mapping with aspect correction ── */
      vec2 screen = p;
      if (uAspect > 1.0) {
        screen.x /= uAspect;
      } else {
        screen.y *= uAspect;
      }

      gl_Position = vec4(screen, 0.0, 1.0);
      gl_PointSize = uPixel * mix(1.2, 1.8, aSeed);
    }
  `,
  fragmentShader: `
    varying float vWash;
    varying float vEdge;
    varying float vBandPhase;
    varying float vSeed;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      /* ── Graphite palette: 5 specific tones ── */
      /* 1: warm graphite  #8a867e
         2: cool pencil    #9b9893
         3: pale ochre     #c4bba8  (the wash)
         4: deep charcoal  #5a5751
         5: silver grey    #b3afa8 */

      vec3 warmGraphite = vec3(0.541, 0.525, 0.494);
      vec3 coolPencil   = vec3(0.608, 0.596, 0.576);
      vec3 paleOchre    = vec3(0.769, 0.733, 0.659);
      vec3 deepCharcoal = vec3(0.353, 0.341, 0.318);
      vec3 silverGrey   = vec3(0.702, 0.686, 0.659);

      /* Select base tone per particle — deterministic from seed + band */
      float toneIdx = fract(vSeed * 5.0 + vBandPhase * 2.7);
      vec3 base;
      if (toneIdx < 0.30) base = warmGraphite;
      else if (toneIdx < 0.50) base = coolPencil;
      else if (toneIdx < 0.65) base = silverGrey;
      else if (toneIdx < 0.80) base = deepCharcoal;
      else base = warmGraphite;

      /* Blend in pale ochre wash where the light drifts */
      vec3 col = mix(base, paleOchre, vWash * 0.35);

      /* Edge fade + per-particle breath */
      float alpha = vEdge * mix(0.35, 0.7, vSeed);
      alpha *= 1.0 - smoothstep(0.15, 0.25, r);

      /* Sparse particles nearly vanish — Martin's near-invisibility */
      alpha *= smoothstep(0.0, 0.15, vEdge);

      gl_FragColor = vec4(col, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── Resize ── */
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
  uniforms.uAspect.value = innerWidth / innerHeight;
});

/* ── Render loop ── */
const start = performance.now();
function loop() {
  uniforms.uTime.value = (performance.now() - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
