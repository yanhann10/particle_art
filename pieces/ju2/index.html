<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ju2 · critical climate machine · Gaëtan Robillard</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ju2</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 8, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0d, 1);
document.body.appendChild(renderer.domElement);

// Climate misinformation corpus — distorted facts and clean data
const DISTORTION_CORPUS = [
  'GLOBAL COOLING', 'NO CONSENSUS', 'SOLAR CYCLES', 'NATURAL VARIABILITY',
  'BENEFITS CO2', 'ICE GROWING', 'MODELS FAIL', 'HOCKEY STICK FRAUD',
  'UNCERTAINTY', 'PAUSE WARMING', 'NOT HUMAN', 'EXPENSIVE HOAX'
];

const TRUTH_CORPUS = [
  '1.5°C', '415ppm', 'IPCC AR6', 'NET ZERO 2050', '97% CONSENSUS',
  'SEA RISE', 'EMISSIONS', 'MITIGATION', 'ADAPTATION', 'ATTRIBUTION',
  'FEEDBACK', 'ALBEDO', 'CARBON BUDGET', 'TIPPING POINT'
];

// Nodes — truth anchor (left) and distortion amplifier (right)
const truthNode = new THREE.Vector3(-12, 0, 0);
const distortionNode = new THREE.Vector3(12, 0, 0);

// Geometry for nodes — transparent cubes
const nodeMat = new THREE.MeshBasicMaterial({ 
  color: 0x1a4d5a, 
  transparent: true, 
  opacity: 0.15, 
  wireframe: false 
});
const nodeWireMat = new THREE.LineBasicMaterial({ color: 0x2a7d8a, opacity: 0.5, transparent: true });

const truthCube = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), nodeMat);
truthCube.position.copy(truthNode);
scene.add(truthCube);
const truthWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(2.5, 2.5, 2.5)), 
  nodeWireMat
);
truthWire.position.copy(truthNode);
scene.add(truthWire);

const distortionCube = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 2.5), nodeMat);
distortionCube.position.copy(distortionNode);
scene.add(distortionCube);
const distortionWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(2.5, 2.5, 2.5)), 
  nodeWireMat
);
distortionWire.position.copy(distortionNode);
scene.add(distortionWire);

// Particle system — text glyphs
const N = 8000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const glyphTypes = new Float32Array(N); // 0=truth, 1=distortion
const lifetimes = new Float32Array(N);
const seeds = new Float32Array(N);

for (let i = 0; i < N; i++){
  const type = Math.random() < 0.5 ? 0 : 1;
  glyphTypes[i] = type;
  
  // Spawn near respective node
  const spawnNode = type === 0 ? truthNode : distortionNode;
  positions[i*3]   = spawnNode.x + (Math.random() - 0.5) * 3;
  positions[i*3+1] = spawnNode.y + (Math.random() - 0.5) * 3;
  positions[i*3+2] = spawnNode.z + (Math.random() - 0.5) * 3;
  
  velocities[i*3]   = 0;
  velocities[i*3+1] = 0;
  velocities[i*3+2] = 0;
  
  lifetimes[i] = Math.random();
  seeds[i] = Math.random();
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float glyphType;
    attribute float lifetime;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float life = fract(lifetime + uTime * 0.08);
      
      // Truth glyphs: clean teal
      vec3 truthCol = vec3(0.16, 0.49, 0.54);
      // Distortion glyphs: turbulent orange-red
      vec3 distortCol = vec3(0.82, 0.38, 0.22);
      
      vCol = mix(truthCol, distortCol, glyphType);
      
      // Fade in/out over lifetime
      float fade = smoothstep(0.0, 0.1, life) * (1.0 - smoothstep(0.85, 1.0, life));
      vAlpha = fade * (0.5 + 0.3 * sin(seed * 6.28 + uTime));
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeVar = 0.8 + 0.4 * seed;
      gl_PointSize = sizeVar * 2.8 * uPixel * (50.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      // Render as small square glyph (simplified character)
      float box = step(abs(uv.x), 0.35) * step(abs(uv.y), 0.35);
      if (box < 0.5) discard;
      float edge = smoothstep(0.35, 0.25, max(abs(uv.x), abs(uv.y)));
      float a = edge * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('glyphType', new THREE.BufferAttribute(glyphTypes, 1));
geom.setAttribute('lifetime', new THREE.BufferAttribute(lifetimes, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Vector field — flows from nodes, bends toward center, splits at boundary
const tmpVec = new THREE.Vector3();
const force = new THREE.Vector3();

function vectorField(p, type){
  force.set(0, 0, 0);
  
  if (type === 0){
    // Truth particles: flow smoothly rightward with gentle downward curve
    const toCenter = new THREE.Vector3(0, -1, 0).sub(p).normalize();
    force.add(toCenter.multiplyScalar(0.02));
    force.x += 0.08; // rightward drift
  } else {
    // Distortion particles: turbulent chaotic flow, upward spiral
    const noise = Math.sin(p.x * 0.3 + p.z * 0.4) * Math.cos(p.y * 0.5);
    force.x -= 0.06;
    force.y += 0.05 + noise * 0.08;
    force.z += Math.sin(p.x * 0.2) * 0.04;
  }
  
  // Boundary repulsion — keep particles in frame
  const distFromOrigin = p.length();
  if (distFromOrigin > 20){
    const repel = new THREE.Vector3().copy(p).normalize().multiplyScalar(-0.1);
    force.add(repel);
  }
  
  return force;
}

function updateParticles(dt){
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const type = glyphTypes[i];
    
    lifetimes[i] += dt * 0.08;
    if (lifetimes[i] > 1.0){
      lifetimes[i] = 0.0;
      // Respawn at node
      const spawnNode = type === 0 ? truthNode : distortionNode;
      positions[i*3]   = spawnNode.x + (Math.random() - 0.5) * 3;
      positions[i*3+1] = spawnNode.y + (Math.random() - 0.5) * 3;
      positions[i*3+2] = spawnNode.z + (Math.random() - 0.5) * 3;
      velocities[i*3] = 0;
      velocities[i*3+1] = 0;
      velocities[i*3+2] = 0;
    }
    
    tmpVec.set(px, py, pz);
    const f = vectorField(tmpVec, type);
    
    velocities[i*3]   += f.x * dt;
    velocities[i*3+1] += f.y * dt;
    velocities[i*3+2] += f.z * dt;
    
    // Damping
    velocities[i*3]   *= 0.98;
    velocities[i*3+1] *= 0.98;
    velocities[i*3+2] *= 0.98;
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.lifetime.needsUpdate = true;
}

// Connection lines between nodes — data pipeline
const lineGeom = new THREE.BufferGeometry();
const linePos = new Float32Array([
  truthNode.x, truthNode.y, truthNode.z,
  distortionNode.x, distortionNode.y, distortionNode.z
]);
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({ 
  color: 0x1a4d5a, 
  transparent: true, 
  opacity: 0.25 
});
const connectionLine = new THREE.Line(lineGeom, lineMat);
scene.add(connectionLine);

// Ambient fog
scene.fog = new THREE.Fog(0x0a0b0d, 30, 80);

// Subtle camera drift
const centroid = new THREE.Vector3();
function updateCamera(t){
  centroid.set(0, 0, 0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  // Look at weighted centroid (biased toward origin)
  const lookTarget = new THREE.Vector3().lerpVectors(
    new THREE.Vector3(0, 0, 0),
    centroid,
    0.3
  );
  
  camera.position.x = Math.sin(t * 0.05) * 3;
  camera.position.y = 8 + Math.sin(t * 0.08) * 2;
  camera.lookAt(lookTarget);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
const start = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;
  
  uniforms.uTime.value = t;
  
  updateParticles(dt * 60);
  updateCamera(t);
  
  // Rotate nodes slowly
  truthCube.rotation.y += 0.003;
  truthWire.rotation.y += 0.003;
  distortionCube.rotation.y -= 0.003;
  distortionWire.rotation.y -= 0.003;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
