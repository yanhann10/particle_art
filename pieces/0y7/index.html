<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: cascade, intensity: gentle -->
<title>0y7 · autumn vessel · cascading leaf-shed</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0d12; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>

<body>
<div class="id">0y7</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════════
   autumn vessel — vascular tree sheds leaf-scales in gentle cascade
   ─────────────────────────────────────────────────────────────────
   Technique ref: Andy Goldsworthy (ephemeral leaf arrangements,
   natural material as medium, time as sculptor). The differential-
   growth skeleton grows upward; leaves tile the vessel wall then
   detach and drift earthward — growth paying its debt to gravity.
   LEAF AS BASIC UNIT: leaves ARE the vessel wall (scales on a
   serpent / fish-scales that peel and fall).
   ═══════════════════════════════════════════════════════════════════ */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0d12, 0.028);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 250);
camera.position.set(9, 7, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0d12, 1);
document.body.appendChild(renderer.domElement);

// warm key light from above-left, cool fill from below
const keyLight = new THREE.DirectionalLight(0xffe4c4, 0.85);
keyLight.position.set(4, 12, 3);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0x1a2030, 0.5));
const rimLight = new THREE.DirectionalLight(0x6688aa, 0.3);
rimLight.position.set(-4, -2, -6);
scene.add(rimLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// ─────────── PALETTE ───────────
// Hand-picked autumn: goldenrod, sienna, dark olive, burnt umber, pale ochre
const PALETTE = [
  new THREE.Color(0xc9922a), // goldenrod
  new THREE.Color(0xa0522d), // sienna
  new THREE.Color(0x5c6b2f), // dark olive
  new THREE.Color(0x6b3a20), // burnt umber
  new THREE.Color(0xd4b87a), // pale ochre
];

// ─────────── DIFFERENTIAL GROWTH (inherited from t9w/5gm)
const MAX_VERTS = 900;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE_AMT = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r  = 1.2 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, gridMap = new Map();
function rebuildGrid(){
  gridMap.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!gridMap.has(k)) gridMap.set(k, []);
    gridMap.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const arr=gridMap.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr) for(const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function growStep(){
  if(paused) return;
  const n = verts.length;
  if(n >= MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of gridNeighbors(v)){
      if(j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=verts[i].x; cy+=verts[i].y; cz+=verts[i].z;}
  cx/=n; cy/=n; cz/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx, oy=verts[i].y-cy, oz=verts[i].z-cz;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;
    dy[i]+=(oy/d)*PRESSURE*0.4;
    dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_AMT;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_AMT*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_AMT;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                  age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}
// pre-warm
for(let s=0;s<600;s++) growStep();

addEventListener('click', ()=>{ paused=!paused; });

// ─────────── SKELETON line rendering
const skelGeo = new THREE.BufferGeometry();
const skelMat = new THREE.LineBasicMaterial({ color:0x3a2218, transparent:true, opacity:0.35 });
const skeleton = new THREE.LineLoop(skelGeo, skelMat);
scene.add(skeleton);

// ─────────── LEAF GEOMETRY — pointed oval, ~0.14 wide
function makeLeafGeo(){
  const g = new THREE.BufferGeometry();
  // 6 verts: tip, left, mid-left, base, mid-right, right
  const p = new Float32Array([
    0, 0.10, 0,    -0.06, 0.04, 0,   -0.04, -0.04, 0,
    0, -0.08, 0,    0.04, -0.04, 0,    0.06, 0.04, 0,
  ]);
  const n = new Float32Array(18); // all face +Z
  for(let i=0;i<6;i++){ n[i*3]=0; n[i*3+1]=0; n[i*3+2]=1; }
  const idx = [0,1,5, 1,2,5, 2,4,5, 2,3,4];
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(n, 3));
  g.setIndex(idx);
  return g;
}

const MAX_LEAVES = 1800;
const leafGeo    = makeLeafGeo();
const leafMat    = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.7,
  metalness: 0.0,
  side: THREE.DoubleSide,
});
const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, MAX_LEAVES);
leafMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
leafMesh.instanceColor = new THREE.InstancedBufferAttribute(
  new Float32Array(MAX_LEAVES * 3), 3
);
leafMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
scene.add(leafMesh);

// ─────────── LEAF STATE
const leaves = []; // {px,py,pz, vx,vy,vz, rx,ry,rz, rvx,rvy,rvz, attached, vertIdx, colorIdx, settled, life}

function spawnLeaf(vIdx){
  if(leaves.length >= MAX_LEAVES) return;
  const v = verts[vIdx];
  if(!v) return;
  // outward normal from centroid
  let cx=0,cy=0,cz=0;
  for(const u of verts){cx+=u.x;cy+=u.y;cz+=u.z;}
  cx/=verts.length; cy/=verts.length; cz/=verts.length;
  const nx=v.x-cx, ny=v.y-cy, nz=v.z-cz;
  const nl=Math.hypot(nx,ny,nz)+1e-6;

  leaves.push({
    px: v.x + (nx/nl)*0.12,
    py: v.y + (ny/nl)*0.12,
    pz: v.z + (nz/nl)*0.12,
    vx:0, vy:0, vz:0,
    rx: Math.random()*Math.PI*2,
    ry: Math.random()*Math.PI*2,
    rz: Math.random()*Math.PI*2,
    rvx:0, rvy:0, rvz:0,
    attached: true,
    vertIdx: vIdx,
    colorIdx: Math.floor(Math.random()*PALETTE.length),
    settled: false,
    life: 0,
    detachAge: 0.6 + Math.random()*0.8, // age at which it detaches
  });
}

// initial leaf population along skeleton
function populateLeaves(){
  const step = Math.max(1, Math.floor(verts.length / 500));
  for(let i=0; i<verts.length && leaves.length<MAX_LEAVES*0.6; i+=step){
    spawnLeaf(i);
  }
}
populateLeaves();

// ─────────── GROUND — subtle dark plane for landed leaves
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x0e0a08, roughness: 1, metalness: 0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.05;
scene.add(ground);

// ─────────── ANIMATION
const dummy  = new THREE.Object3D();
const tmpCol = new THREE.Color();
const startT = performance.now();
let spawnAcc = 0;
let frameCount = 0;

function updateLeaves(dt, t){
  // wind: gentle drift varies with time
  const windX = Math.sin(t*0.13)*0.3;
  const windZ = Math.cos(t*0.17)*0.2;

  for(let i=leaves.length-1; i>=0; i--){
    const L = leaves[i];
    L.life += dt;

    if(L.attached){
      // follow skeleton vertex
      const vi = L.vertIdx % verts.length;
      const v  = verts[vi];
      if(!v){ L.attached=false; continue; }
      // check detach by age
      if(v.age > L.detachAge){
        L.attached = false;
        // initial detach velocity: slight outward + down
        let cx=0,cy=0,cz=0;
        for(const u of verts){cx+=u.x;cy+=u.y;cz+=u.z;}
        cx/=verts.length; cy/=verts.length; cz/=verts.length;
        const nx=L.px-cx, ny=L.py-cy, nz=L.pz-cz;
        const nl=Math.hypot(nx,ny,nz)+1e-6;
        L.vx = (nx/nl)*0.4 + (Math.random()-0.5)*0.2;
        L.vy = -0.1;
        L.vz = (nz/nl)*0.4 + (Math.random()-0.5)*0.2;
        // tumble
        L.rvx = (Math.random()-0.5)*2.0;
        L.rvy = (Math.random()-0.5)*1.5;
        L.rvz = (Math.random()-0.5)*1.0;
      } else {
        // track vertex
        let cx2=0,cy2=0,cz2=0;
        for(const u of verts){cx2+=u.x;cy2+=u.y;cz2+=u.z;}
        cx2/=verts.length; cy2/=verts.length; cz2/=verts.length;
        const nx=v.x-cx2, ny=v.y-cy2, nz=v.z-cz2;
        const nl=Math.hypot(nx,ny,nz)+1e-6;
        L.px = v.x + (nx/nl)*0.12;
        L.py = v.y + (ny/nl)*0.12;
        L.pz = v.z + (nz/nl)*0.12;
        // orient outward
        L.ry = Math.atan2(nx, nz);
        L.rx = Math.atan2(ny, Math.hypot(nx,nz));
      }
    }

    if(!L.attached && !L.settled){
      // CASCADE physics: gravity + wind + drag
      const gravity = -1.8;
      L.vy += gravity * dt;
      // air resistance (leaves flutter, don't plummet)
      const drag = 2.5;
      L.vx += (windX - L.vx) * drag * dt;
      L.vz += (windZ - L.vz) * drag * dt;
      L.vy *= (1 - 1.2*dt); // vertical drag — leaf-like slow descent

      // sway: sinusoidal lateral oscillation
      const swayPhase = L.life * 3.0 + L.colorIdx;
      L.vx += Math.sin(swayPhase) * 0.6 * dt;
      L.vz += Math.cos(swayPhase*0.7) * 0.4 * dt;

      L.px += L.vx * dt;
      L.py += L.vy * dt;
      L.pz += L.vz * dt;

      L.rx += L.rvx * dt;
      L.ry += L.rvy * dt;
      L.rz += L.rvz * dt;
      // slow tumble over time
      L.rvx *= (1 - 0.5*dt);
      L.rvy *= (1 - 0.5*dt);
      L.rvz *= (1 - 0.5*dt);

      // settle on ground
      if(L.py <= 0.02){
        L.py = 0.02 + Math.random()*0.01;
        L.settled = true;
        L.vx=L.vy=L.vz=0;
        L.rvx=L.rvy=L.rvz=0;
        // flatten onto ground
        L.rx = -Math.PI/2 + (Math.random()-0.5)*0.3;
        L.rz = Math.random()*Math.PI*2;
      }
    }
  }
}

function render(){
  const now = performance.now();
  const t   = (now - startT) / 1000;
  const dt  = Math.min(1/30, 1/60);
  frameCount++;

  // grow skeleton
  for(let s=0;s<2;s++) growStep();

  // spawn new leaves periodically on newer vertices
  spawnAcc += dt;
  if(spawnAcc > 0.15 && leaves.length < MAX_LEAVES){
    spawnAcc = 0;
    // spawn on random recent vertices
    const count = Math.min(4, MAX_LEAVES - leaves.length);
    for(let c=0;c<count;c++){
      const idx = Math.floor(Math.random()*verts.length);
      spawnLeaf(idx);
    }
  }

  // update skeleton line
  if(verts.length > 4){
    const posArr = new Float32Array(verts.length * 3);
    for(let i=0;i<verts.length;i++){
      posArr[i*3]   = verts[i].x;
      posArr[i*3+1] = verts[i].y;
      posArr[i*3+2] = verts[i].z;
    }
    skelGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    skelGeo.attributes.position.needsUpdate = true;
  }

  // update leaves
  updateLeaves(dt, t);

  // write instance matrices + colors
  const activeCount = Math.min(leaves.length, MAX_LEAVES);
  for(let i=0;i<activeCount;i++){
    const L = leaves[i];
    dummy.position.set(L.px, L.py, L.pz);
    dummy.rotation.set(L.rx, L.ry, L.rz);

    // scale: attached leaves slightly smaller, falling ones full size
    const s = L.attached ? 0.8 : 1.0;
    // settled leaves get a slight scale variation
    const sv = L.settled ? 0.7 + 0.3*((i*137)%100)/100 : s;
    dummy.scale.set(sv, sv, sv);
    dummy.updateMatrix();
    leafMesh.setMatrixAt(i, dummy.matrix);

    // color: palette + darken settled leaves slightly
    const baseCol = PALETTE[L.colorIdx];
    if(L.settled){
      tmpCol.copy(baseCol).multiplyScalar(0.6);
    } else if(!L.attached){
      // falling: slightly desaturate over time
      const fade = Math.min(L.life * 0.1, 0.3);
      tmpCol.copy(baseCol).lerp(new THREE.Color(0x8a7a60), fade);
    } else {
      tmpCol.copy(baseCol);
    }
    leafMesh.instanceColor.setXYZ(i, tmpCol.r, tmpCol.g, tmpCol.b);
  }
  leafMesh.count = activeCount;
  leafMesh.instanceMatrix.needsUpdate = true;
  leafMesh.instanceColor.needsUpdate  = true;

  // camera: track centroid of growing form
  let yMean=0, xMean=0, zMean=0;
  for(const v of verts){xMean+=v.x; yMean+=v.y; zMean+=v.z;}
  xMean/=verts.length; yMean/=verts.length; zMean/=verts.length;
  const targetY = Math.max(yMean, 2.0);
  controls.target.x += (xMean - controls.target.x) * 0.03;
  controls.target.y += (targetY - controls.target.y) * 0.03;
  controls.target.z += (zMean - controls.target.z) * 0.03;
  const desiredCamY = targetY + 3;
  camera.position.y += (desiredCamY - camera.position.y) * 0.03;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(render);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

render();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
