<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iin · oceanic drift (Lorenz)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0f1a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">iin</div>
<div class="hint">move slowly — the attractor breathes with you</div>
<div class="src">memo akten · physics-driven inertia</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Memo Akten: physics-driven, atmospheric, slow temporal evolution, sublime.
// Every interaction response is smooth integration over multiple seconds.
// Particles have momentum and inertia. Camera on a slow rail through depth.
// Palette: cool blues, deep teals, oceanic dusk.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0f1a, 1);
document.body.appendChild(renderer.domElement);

// fog for atmospheric depth
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0f1a, 0.008);

// ---- ping-pong state RTs: (xyz, age) ----
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// velocity buffer: (vx, vy, vz, _)
let rtVelA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtVelB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init position: scatter near the basin
const initPos = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  initPos[i*4]   = (Math.random()*2-1) * 6.0;
  initPos[i*4+1] = (Math.random()*2-1) * 6.0;
  initPos[i*4+2] = (Math.random()*2-1) * 6.0 + 25.0;
  initPos[i*4+3] = Math.random();
}
const initPosTex = new THREE.DataTexture(initPos, W, H, THREE.RGBAFormat, THREE.FloatType);
initPosTex.needsUpdate = true;

// init velocity: zero
const initVel = new Float32Array(N * 4);
const initVelTex = new THREE.DataTexture(initVel, W, H, THREE.RGBAFormat, THREE.FloatType);
initVelTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat);
blitScene.add(blitQuad);

blitMat.uniforms.tex.value = initPosTex;
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
blitMat.uniforms.tex.value = initVelTex;
renderer.setRenderTarget(rtVelA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- simulation pass: physics-driven with inertia ----
const simUniforms = {
  pos: { value: rtA.texture },
  vel: { value: rtVelA.texture },
  uDt:    { value: 0.004 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 },
  uDrag:  { value: 0.02 },
  uForce: { value: 0.98 }
};

// update velocity from Lorenz force
const simVelMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D pos;
    uniform sampler2D vel;
    uniform float uDt;
    uniform float uSigma;
    uniform float uRho;
    uniform float uBeta;
    uniform float uDrag;
    uniform float uForce;
    varying vec2 vUv;
    void main(){
      vec4 sPos = texture2D(pos, vUv);
      vec3 p = sPos.xyz;
      vec3 v = texture2D(vel, vUv).xyz;
      
      // Lorenz force field
      vec3 force = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      
      // integrate velocity with drag and inertia
      v += force * uForce * uDt;
      v *= (1.0 - uDrag);
      
      gl_FragColor = vec4(v, 0.0);
    }
  `
});
const simVelScene = new THREE.Scene();
simVelScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simVelMat));

// update position from velocity
const simPosMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D pos;
    uniform sampler2D vel;
    uniform float uDt;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(pos, vUv);
      vec3 p = s.xyz;
      vec3 v = texture2D(vel, vUv).xyz;
      float age = s.w;
      
      p += v * uDt;
      age = mod(age + uDt * 0.03, 1.0);
      
      gl_FragColor = vec4(p, age);
    }
  `
});
const simPosScene = new THREE.Scene();
simPosScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simPosMat));

// ---- render pass ----
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 0, 90);
camera.lookAt(0, 0, 25);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    vel:    { value: rtVelB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 },
    fogColor: { value: scene.fog.color },
    fogDensity: { value: scene.fog.density }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform sampler2D vel;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vec3 v = texture2D(vel, uvIdx).xyz;
      
      float speed = length(v);
      vSpeed = clamp(speed * 0.15, 0.0, 1.0);
      vAge = s.w;

      // shift attractor down
      p.z -= 25.0;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      float dist = vDepth;
      gl_PointSize = (0.8 + 2.2 * vSpeed) * uPixel * (70.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying float vAge;
    varying float vSpeed;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      
      // oceanic palette: deep teal → azure → pale cyan
      vec3 a_col = vec3(0.08, 0.22, 0.32);
      vec3 b_col = vec3(0.18, 0.42, 0.58);
      vec3 c_col = vec3(0.52, 0.72, 0.82);
      
      float k = mod(vAge + vSpeed * 0.2, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.4, k));
      col = mix(col, c_col, smoothstep(0.6, 1.0, k));
      
      // depth fog
      float fogFactor = exp(-fogDensity * vDepth);
      col = mix(fogColor, col, fogFactor);
      
      float brightness = 0.3 + vSpeed * 1.2;
      gl_FragColor = vec4(col * a * brightness, a * fogFactor);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// environment mesh for depth
const envGeom = new THREE.IcosahedronGeometry(180, 2);
const envMat = new THREE.MeshBasicMaterial({
  color: 0x0a0f1a,
  side: THREE.BackSide,
  transparent: true,
  opacity: 0.15,
  fog: false
});
const envMesh = new THREE.Mesh(envGeom, envMat);
scene.add(envMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer: smooth integration over multiple seconds (low alpha LERP)
const target = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
const current = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 4.0;
  target.sigma = 10.0 + nx * 1.8;
  target.beta  = 8.0/3.0 + nx * 0.3;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05); 
  lastTime = now;
  
  // SLOW integration toward target (Memo Akten: sublime, patient)
  const alpha = 0.008;
  current.sigma += (target.sigma - current.sigma) * alpha;
  current.rho   += (target.rho   - current.rho)   * alpha;
  current.beta  += (target.beta  - current.beta)  * alpha;
  
  simUniforms.uSigma.value = current.sigma;
  simUniforms.uRho.value   = current.rho;
  simUniforms.uBeta.value  = current.beta;

  // step sim: velocity then position (2 substeps for stability)
  for (let i = 0; i < 2; i++){
    simUniforms.pos.value = rtA.texture;
    simUniforms.vel.value = rtVelA.texture;
    
    renderer.setRenderTarget(rtVelB);
    renderer.render(simVelScene, camOrtho);
    
    simUniforms.vel.value = rtVelB.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simPosScene, camOrtho);
    
    let tmp = rtA; rtA = rtB; rtB = tmp;
    tmp = rtVelA; rtVelA = rtVelB; rtVelB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.vel.value = rtVelA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;
  
  // slow camera rail: wide arc through depth
  const t = now * 0.00008;
  const radius = 95.0 + Math.sin(t * 0.7) * 15.0;
  camera.position.x = Math.sin(t) * radius;
  camera.position.y = Math.cos(t * 1.3) * 20.0;
  camera.position.z = Math.cos(t) * radius;
  camera.lookAt(0, 0, 0);
  
  // slow environment rotation
  envMesh.rotation.y = t * 0.3;
  envMesh.rotation.x = Math.sin(t * 0.5) * 0.1;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
