<!doctype html>
<html lang="en">
<head>
<!-- MOTION: drift, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>q3x · lorenz wash planes</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">q3x</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070b, 1);
document.body.appendChild(renderer.domElement);

/* ── ping-pong state textures ── */
const rtParams = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 8.0;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 8.0;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 8.0 + 25.0;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ── simulation: Lorenz integration (unchanged) ── */
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0 / 3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ── render: instanced planes aligned to velocity field ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);
camera.lookAt(0, 0, 0);

// base quad — unit plane, scaled in shader
const basePlane = new THREE.PlaneGeometry(1, 1);
const instGeo = new THREE.InstancedBufferGeometry();
instGeo.index = basePlane.index;
instGeo.setAttribute('position', basePlane.getAttribute('position'));
instGeo.setAttribute('uv', basePlane.getAttribute('uv'));

// per-instance: UV coordinate into state texture
const uvIdxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const i = y * W + x;
    uvIdxArr[i * 2]     = (x + 0.5) / W;
    uvIdxArr[i * 2 + 1] = (y + 0.5) / H;
  }
}
instGeo.setAttribute('uvIdx', new THREE.InstancedBufferAttribute(uvIdxArr, 2));
instGeo.instanceCount = N;

const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uTime: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform sampler2D state;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying vec2 vPuv;

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;

      // Lorenz velocity → orientation basis
      vec3 vel = vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x * p.z,
        p.x * p.y - (8.0 / 3.0) * p.z
      );
      float spd = length(vel);
      vSpeed = clamp(spd * 0.003, 0.0, 1.0);
      vAge = age;
      vPuv = uv;

      // center attractor at origin
      p.z -= 25.0;

      // build orientation frame from velocity
      vec3 fwd = spd > 0.001 ? vel / spd : vec3(0.0, 0.0, 1.0);
      vec3 ref = abs(fwd.y) > 0.95 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
      vec3 right = normalize(cross(fwd, ref));
      vec3 up    = cross(right, fwd);

      // per-instance spin around normal (age as seed)
      float rot = age * 6.2832 * 5.0;
      float cr = cos(rot), sr = sin(rot);
      vec2 lp = vec2(
        position.x * cr - position.y * sr,
        position.x * sr + position.y * cr
      );

      // scale — smaller planes, rely on density for brightness
      float sz = 0.32 + vSpeed * 0.18;

      vec3 worldPos = p + (lp.x * right + lp.y * up) * sz;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying vec2 vPuv;

    void main(){
      // soft circular falloff within the plane
      float r = length(vPuv - 0.5) * 2.0;
      float soft = 1.0 - smoothstep(0.55, 1.0, r);

      // palette: deep indigo → magenta → warm gold
      vec3 a_col = vec3(0.20, 0.32, 0.78);
      vec3 b_col = vec3(0.85, 0.32, 0.62);
      vec3 c_col = vec3(0.98, 0.86, 0.50);
      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));

      // opacity: low base, speed adds more — overlap IS composition
      float alpha = soft * (0.025 + vSpeed * 0.055);

      // slight warm tint in dense overlap zones via color modulation
      col *= 0.85 + vSpeed * 0.5;

      gl_FragColor = vec4(col, alpha);
    }
  `
});

const mesh = new THREE.Mesh(instGeo, planeMat);
mesh.frustumCulled = false;
scene.add(mesh);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── pointer nudge (unchanged) ── */
const target = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.0;
  target.sigma = 10.0 + nx * 2.5;
});

/* ── loop ── */
function loop(){
  const now = performance.now();

  // ease params
  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;

  // step sim — 4 substeps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  planeMat.uniforms.state.value = rtA.texture;
  planeMat.uniforms.uTime.value = now / 1000;

  // slow orbit
  const ang = now * 0.00012;
  camera.position.x = Math.sin(ang) * 80;
  camera.position.z = Math.cos(ang) * 80;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
