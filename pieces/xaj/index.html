<!DOCTYPE html>
<!-- MOTION: trace, intensity: gentle -->
<!-- PIECE: xaj — Multi-Ribbon Hadid -->
<!-- PALETTE: platinum #d4d0c8 on void-black #060606, dull-gold accent #8a6a20 -->
<!-- CONCEPT: 5 interlocking parametric ribbon surfaces sweeping through space.
     Negative space between ribbons IS the form. Channel Zaha Hadid continuous-surface architecture.
     CatmullRomCurve3 + TubeGeometry. Counter-rotating speeds. Architectural cross-section reading. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>xaj · hadid ribbons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060606; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060606);

const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
camera.position.set(0, 2, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.target.set(0, 1, 0);

// Lighting: key from upper right, cool fill from left, ambient
const keyLight = new THREE.DirectionalLight(0xfaf0e0, 2.2);
keyLight.position.set(6, 10, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc0d8ff, 0.7);
fillLight.position.set(-8, 4, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, -5, -8);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0x1a1810, 1.0));

// ── Ribbon definitions ──────────────────────────────────────────────────────
// Each ribbon: array of control points (generated parametrically), material, rotation speed
const RIBBONS = [
  // 1: Platinum sweep — long sinuous S
  { color: 0xd4d0c8, metalness: 0.6, roughness: 0.25, speed: 0.18, radius: 0.18,
    pts: makeRibbonPts(0, 12, 1.2, 0.6, 0.5, Math.PI * 0.0) },
  // 2: Platinum — tighter loop, counter-rotates
  { color: 0xd4d0c8, metalness: 0.55, roughness: 0.30, speed: -0.28, radius: 0.15,
    pts: makeRibbonPts(1, 10, 0.9, 0.8, 0.7, Math.PI * 0.4) },
  // 3: Gold accent — diagonal slash
  { color: 0x8a6a20, metalness: 0.8, roughness: 0.15, speed: 0.22, radius: 0.22,
    pts: makeRibbonPts(2, 10, 1.4, 0.5, 0.3, Math.PI * 0.7) },
  // 4: Platinum — tight coil, slow
  { color: 0xd4d0c8, metalness: 0.5, roughness: 0.35, speed: -0.14, radius: 0.13,
    pts: makeRibbonPts(3, 14, 1.0, 1.0, 0.9, Math.PI * 1.1) },
  // 5: Pale platinum — thin, fast
  { color: 0xbcb8b0, metalness: 0.4, roughness: 0.40, speed: 0.35, radius: 0.10,
    pts: makeRibbonPts(4, 11, 0.7, 0.7, 0.6, Math.PI * 1.5) },
];

function makeRibbonPts(seed, nPts, scaleX, scaleY, scaleZ, phaseOff) {
  // Parametric sweep: figure-8 / lemniscate-based with vertical rise
  const pts = [];
  for (let i = 0; i < nPts; i++) {
    const t = (i / (nPts - 1)) * Math.PI * 2 + phaseOff;
    const u = (i / (nPts - 1)) * 2.0 - 1.0; // -1..1
    // Lemniscate-like x, sinusoidal y, z twist — scaled up 4x for frame fill
    const x = Math.sin(t) * scaleX * (1 + 0.3 * Math.cos(t * 2 + seed));
    const y = u * 4.0 * scaleY + Math.sin(t * 1.5 + seed * 0.8) * 0.6;
    const z = Math.cos(t * 0.7 + seed * 1.2) * scaleZ * 1.8;
    pts.push(new THREE.Vector3(x * 6.0, y * 2.2, z * 5.0));
  }
  return pts;
}

// Build ribbon meshes
const ribbonGroups = [];
const ribbonMeshes = [];

RIBBONS.forEach((def, idx) => {
  const mat = new THREE.MeshStandardMaterial({
    color: def.color,
    metalness: def.metalness,
    roughness: def.roughness,
    side: THREE.DoubleSide,
  });

  const curve = new THREE.CatmullRomCurve3(def.pts, false, 'catmullrom', 0.5);
  const tubeGeo = new THREE.TubeGeometry(curve, 120, def.radius, 8, false);
  const mesh = new THREE.Mesh(tubeGeo, mat);

  const group = new THREE.Group();
  // Spread ribbons spatially so they interlock but don't overlap identically
  group.position.set(
    (idx - 2) * 0.3,
    (idx % 2 === 0 ? 0.2 : -0.2),
    (idx - 2) * 0.15
  );
  group.add(mesh);
  scene.add(group);
  ribbonGroups.push({ group, speed: def.speed });
  ribbonMeshes.push(mesh);
});

// ── Animation ───────────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.004;

  ribbonGroups.forEach(({ group, speed }) => {
    group.rotation.y += speed * 0.008;
    // Slow breathing: scale pulsation
    const pulse = 1.0 + 0.015 * Math.sin(t * speed * 5 + group.rotation.y);
    group.scale.setScalar(pulse);
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const W2 = window.innerWidth, H2 = window.innerHeight;
  camera.aspect = W2 / H2;
  camera.updateProjectionMatrix();
  renderer.setSize(W2, H2);
});
</script>
</body>
</html>
