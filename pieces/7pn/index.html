<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7pn · parallel line field figure · Da Costa + Niederhauser</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; cursor:crosshair; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">7pn · parallel line field figure · Da Costa + Niederhauser</div>
<div class="hint">move cursor to warp rails · 2024 Lumen Prize Interactive</div>
<div class="src">Marc Da Costa & Matthew Niederhauser · Parallels</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 65);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

// Parallel rail system — 80 vertical rails spanning the frame
const RAIL_COUNT = 80;
const RAIL_HEIGHT = 50;
const RAIL_SPACING = 0.85;
const RAIL_WIDTH = RAIL_COUNT * RAIL_SPACING;
const SEGMENTS_PER_RAIL = 120;

// Each rail is a vertical line that can be displaced horizontally by viewer presence
const rails = [];
for (let i = 0; i < RAIL_COUNT; i++){
  const xBase = (i / (RAIL_COUNT - 1) - 0.5) * RAIL_WIDTH;
  const rail = {
    xBase,
    segments: [],
    targetDisplacements: new Float32Array(SEGMENTS_PER_RAIL),
    currentDisplacements: new Float32Array(SEGMENTS_PER_RAIL),
    phase: Math.random() * Math.PI * 2
  };
  
  for (let j = 0; j < SEGMENTS_PER_RAIL; j++){
    const yPos = (j / (SEGMENTS_PER_RAIL - 1) - 0.5) * RAIL_HEIGHT;
    rail.segments.push({ y: yPos });
    rail.targetDisplacements[j] = 0;
    rail.currentDisplacements[j] = 0;
  }
  
  rails.push(rail);
}

// Instanced line rendering — each rail segment is a short line
const LINE_INSTANCES = RAIL_COUNT * (SEGMENTS_PER_RAIL - 1);
const lineGeom = new THREE.InstancedBufferGeometry();

// Base geometry: a vertical line segment
const basePositions = new Float32Array([
  0, -0.2, 0,
  0,  0.2, 0
]);
lineGeom.setAttribute('position', new THREE.BufferAttribute(basePositions, 3));

// Instance attributes: offset, rotation, opacity
const offsets = new Float32Array(LINE_INSTANCES * 3);
const opacities = new Float32Array(LINE_INSTANCES);
const phases = new Float32Array(LINE_INSTANCES);

let idx = 0;
for (let i = 0; i < RAIL_COUNT; i++){
  const rail = rails[i];
  for (let j = 0; j < SEGMENTS_PER_RAIL - 1; j++){
    const y0 = rail.segments[j].y;
    const y1 = rail.segments[j + 1].y;
    const yMid = (y0 + y1) * 0.5;
    
    offsets[idx * 3] = rail.xBase;
    offsets[idx * 3 + 1] = yMid;
    offsets[idx * 3 + 2] = 0;
    
    opacities[idx] = 0.6 + Math.random() * 0.3;
    phases[idx] = rail.phase + j * 0.08;
    
    idx++;
  }
}

lineGeom.setAttribute('offset', new THREE.InstancedBufferAttribute(offsets, 3));
lineGeom.setAttribute('opacity', new THREE.InstancedBufferAttribute(opacities, 1));
lineGeom.setAttribute('phase', new THREE.InstancedBufferAttribute(phases, 1));

const uniforms = {
  uTime: { value: 0 },
  uAmber: { value: new THREE.Color(0xffb347) } // LED amber
};

const lineMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    attribute vec3 offset;
    attribute float opacity;
    attribute float phase;
    varying float vAlpha;
    
    void main(){
      vec3 pos = position;
      
      // Drift: gentle horizontal wave over time
      float drift = sin(phase + uTime * 0.15) * 0.12;
      pos.x += drift;
      
      // Apply instance offset
      pos += offset;
      
      // Pulsing opacity
      float pulse = 0.5 + 0.5 * sin(phase * 2.0 + uTime * 0.5);
      vAlpha = opacity * (0.7 + 0.3 * pulse);
      
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uAmber;
    varying float vAlpha;
    
    void main(){
      gl_FragColor = vec4(uAmber * vAlpha, vAlpha);
    }
  `
});

const lineMesh = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lineMesh);

// Mouse interaction — track normalized device coords
const mouse = new THREE.Vector2(0, 0);
const mouseVel = new THREE.Vector2(0, 0);
const prevMouse = new THREE.Vector2(0, 0);
let mousePresent = false;

function onMouseMove(e){
  prevMouse.copy(mouse);
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  mouseVel.subVectors(mouse, prevMouse);
  mousePresent = true;
}

function onMouseLeave(){
  mousePresent = false;
}

addEventListener('mousemove', onMouseMove);
addEventListener('mouseleave', onMouseLeave);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Figure-field interaction — mouse presence warps rails into silhouette
function updateRailDisplacements(t){
  if (!mousePresent){
    // Snap back to baseline
    for (let i = 0; i < RAIL_COUNT; i++){
      const rail = rails[i];
      for (let j = 0; j < SEGMENTS_PER_RAIL; j++){
        rail.targetDisplacements[j] *= 0.92;
      }
    }
  } else {
    // Mouse position in world space (z=0 plane)
    const aspect = camera.aspect;
    const vFOV = camera.fov * Math.PI / 180;
    const distToPlane = camera.position.z;
    const planeHeight = 2 * Math.tan(vFOV / 2) * distToPlane;
    const planeWidth = planeHeight * aspect;
    
    const mouseWorldX = mouse.x * planeWidth * 0.5;
    const mouseWorldY = mouse.y * planeHeight * 0.5;
    
    // Figure silhouette: ellipse around cursor
    const figureRadiusX = 8 + Math.abs(mouseVel.x) * 40;
    const figureRadiusY = 12 + Math.abs(mouseVel.y) * 40;
    
    for (let i = 0; i < RAIL_COUNT; i++){
      const rail = rails[i];
      const dx = rail.xBase - mouseWorldX;
      
      for (let j = 0; j < SEGMENTS_PER_RAIL; j++){
        const yPos = rail.segments[j].y;
        const dy = yPos - mouseWorldY;
        
        // Distance to cursor center
        const distSq = (dx / figureRadiusX) ** 2 + (dy / figureRadiusY) ** 2;
        
        if (distSq < 1.0){
          // Inside figure — displace rail outward to carve silhouette
          const strength = 1.0 - distSq;
          const angle = Math.atan2(dy, dx);
          const dispX = Math.cos(angle) * strength * 6.5;
          
          // Smoother transition with velocity influence
          const velInfluence = mouseVel.x * 2.0;
          rail.targetDisplacements[j] = dispX + velInfluence;
        } else {
          // Outside — gentle relaxation
          rail.targetDisplacements[j] *= 0.88;
        }
      }
    }
  }
  
  // Smooth interpolation toward target
  idx = 0;
  for (let i = 0; i < RAIL_COUNT; i++){
    const rail = rails[i];
    
    for (let j = 0; j < SEGMENTS_PER_RAIL - 1; j++){
      const t0 = rail.targetDisplacements[j];
      const t1 = rail.targetDisplacements[j + 1];
      const c0 = rail.currentDisplacements[j];
      const c1 = rail.currentDisplacements[j + 1];
      
      // Lerp with physics-like damping
      rail.currentDisplacements[j] += (t0 - c0) * 0.15;
      rail.currentDisplacements[j + 1] += (t1 - c1) * 0.15;
      
      // Update instance offset
      const xDisp = (rail.currentDisplacements[j] + rail.currentDisplacements[j + 1]) * 0.5;
      offsets[idx * 3] = rail.xBase + xDisp;
      
      idx++;
    }
  }
  
  lineGeom.attributes.offset.needsUpdate = true;
}

// Ambient camera drift
function updateCamera(t){
  const driftX = Math.sin(t * 0.08) * 3.5;
  const driftY = Math.cos(t * 0.06) * 2.0;
  camera.position.x = driftX;
  camera.position.y = driftY;
  camera.lookAt(0, 0, 0);
}

const start = performance.now();

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  
  uniforms.uTime.value = t;
  updateRailDisplacements(t);
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
