<title>uw1 · filigree tracery</title>
<style>

  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/*
  Filigree tracery — 8zu's kintsugi cracks refined into ornamental metalwork.
  Reference: René Lalique's Art Nouveau filigree jewelry — gold wire bent into
  scrolling organic tendrils, where the negative space is as important as the wire.

  The Aizawa attractor supplies the macro silhouette but is heavily suppressed;
  Voronoi edge forces dominate, channelling particles onto bisector planes.
  Along each edge, particles follow a helical scroll (committed amplitude)
  producing visible Art Nouveau curlicues rather than straight cracks.

  Palette (4 colors, hand-picked):
    #C9A96E  antique gold — filigree wire, edge particles
    #E8D5B0  warm ivory — brightest highlights on near-camera edges
    #2E1F3A  deep plum — faint interior glow
    #0A0D14  background — blue-black void

  Edge particles are bright and sharp; interior particles are nearly invisible,
  so the Voronoi cell boundaries read as delicate threads against darkness.
*/

const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0d14, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ─── Voronoi seeds — 20 seeds for finer filigree mesh ───
const voronoiSeedGLSL = `
vec3 voronoiSeed(int idx, float t) {
  float fi = float(idx);
  float theta = fi * 2.39996323 + t * (0.03 + fi * 0.0015);
  float zFrac = fract(fi * 0.618033988 + 0.1);
  float r = 0.45 + 0.5 * sin(fi * 1.7 + t * 0.012);
  float z = -0.1 + zFrac * 2.2;
  return vec3(cos(theta) * r, sin(theta) * r, z + sin(t * 0.018 + fi) * 0.1);
}
`;

// ─── Simulation shader ───
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.011 },
  uA:     { value: 0.95 },
  uB:     { value: 0.70 },
  uC:     { value: 0.60 },
  uD:     { value: 3.50 },
  uE:     { value: 0.25 },
  uF:     { value: 0.10 },
  uTime:  { value: 0.0 },
  uVStr:  { value: 0.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uTime, uVStr;
    varying vec2 vUv;

    ${voronoiSeedGLSL}

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // Aizawa attractor — macro silhouette only
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
          - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
          + uF * p.z * p.x * p.x * p.x
      );

      // Find two nearest Voronoi seeds
      float d1 = 1e6, d2 = 1e6;
      vec3 s1 = vec3(0.0), s2 = vec3(0.0);
      for (int i = 0; i < 20; i++) {
        vec3 sd = voronoiSeed(i, uTime);
        float d = distance(p, sd);
        if (d < d1) { d2 = d1; s2 = s1; d1 = d; s1 = sd; }
        else if (d < d2) { d2 = d; s2 = sd; }
      }

      // Force toward Voronoi edge (perpendicular bisector)
      vec3 mid = (s1 + s2) * 0.5;
      vec3 edgeDir = normalize(s2 - s1 + 1e-6);
      float distToEdge = dot(p - mid, edgeDir);
      vec3 edgeForce = -edgeDir * distToEdge;

      // Helical scroll along Voronoi edge — Art Nouveau curlicue
      // Tangent along the edge (perpendicular to edgeDir in the bisector plane)
      vec3 toP = p - mid;
      vec3 tangent = toP - edgeDir * dot(toP, edgeDir);
      float tangentLen = length(tangent);
      if (tangentLen > 0.001) {
        tangent /= tangentLen;
      }
      vec3 binormal = cross(edgeDir, tangent);
      // Scroll: oscillate in the tangent-binormal plane along the edge
      float scrollPhase = dot(p, edgeDir) * 8.0 + uTime * 0.3 + age * 6.2832;
      float scrollAmp = 0.06 * uVStr;
      vec3 scrollForce = (tangent * cos(scrollPhase) + binormal * sin(scrollPhase)) * scrollAmp;

      // Blend: filigree mode heavily suppresses attractor, amplifies edge channelling
      float vs = uVStr;
      float attractorWeight = mix(1.0, 0.12, vs); // attractor fades to 12%
      vec3 step = (dp * attractorWeight + edgeForce * vs * 2.8 + scrollForce) * uDt;
      step = clamp(step, vec3(-0.06), vec3(0.06));
      p += step;

      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

// ─── Render points ───
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 0, 4.5);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  idxArr[i * 2]     = (x + 0.5) / W;
  idxArr[i * 2 + 1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime;
    attribute vec2 uvIdx;
    varying float vEdge;
    varying float vAge;
    varying float vDepth;

    ${voronoiSeedGLSL}

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;

      // Voronoi edge proximity
      float d1 = 1e6, d2 = 1e6;
      for (int i = 0; i < 20; i++) {
        float d = distance(p, voronoiSeed(i, uTime));
        if (d < d1) { d2 = d1; d1 = d; }
        else if (d < d2) { d2 = d; }
      }
      // 0 = on edge, 1 = deep in cell
      vEdge = clamp((d2 - d1) / (d2 + d1 + 0.001), 0.0, 1.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = clamp(-mv.z * 0.15, 0.0, 1.0);

      // Filigree sizing: edge particles are visible threads, interior nearly invisible
      float edgeFactor = 1.0 - smoothstep(0.0, 0.18, vEdge);
      // Thin wire: small base, modest edge boost
      float size = mix(0.3, 1.6, edgeFactor) * uPixel;
      float dist = max(-mv.z, 0.5);
      gl_PointSize = size * (7.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vEdge;
    varying float vAge;
    varying float vDepth;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0); // tighter falloff for sharper dots

      // Filigree palette — Lalique antique gold
      vec3 antiqueGold = vec3(0.788, 0.663, 0.431);  // #C9A96E
      vec3 warmIvory   = vec3(0.910, 0.835, 0.690);  // #E8D5B0
      vec3 deepPlum    = vec3(0.180, 0.122, 0.227);   // #2E1F3A

      float edge = 1.0 - smoothstep(0.0, 0.18, vEdge);

      // Interior: near-invisible plum. Edge: gold wire. Brightest: ivory highlights.
      vec3 col = deepPlum;
      col = mix(col, antiqueGold, smoothstep(0.3, 0.7, edge));
      col = mix(col, warmIvory, smoothstep(0.85, 1.0, edge) * (0.6 + 0.4 * (1.0 - vDepth)));

      // Subtle age shimmer on edges only
      float shimmer = 0.92 + 0.08 * sin(vAge * 6.2832 + vEdge * 4.0);
      col *= shimmer;

      // Strong contrast: interior nearly transparent, edges bright
      float alpha = a * mix(0.02, 0.85, edge * edge);
      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ─── Subtle vignette background ───
const vigMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float vig = 1.0 - smoothstep(0.15, 0.72, length(c));
      vec3 col = mix(vec3(0.039, 0.047, 0.063), vec3(0.048, 0.038, 0.032), vig * 0.3);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const vigScene = new THREE.Scene();
const vigCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
vigScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vigMat));

// ─── Events ───
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.06;
  target.c = 0.60 + ny * 0.08;
});

// ─── Loop ───
const t0 = performance.now();
function loop() {
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  // Voronoi strength ramps fully: attractor settles first, then filigree takes over
  const vStr = smoothstepJS(4.0, 14.0, elapsed);

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;
  simUniforms.uVStr.value = vStr;

  // 4 integration sub-steps
  for (let i = 0; i < 4; i++) {
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;

  // Slow orbit — tracks attractor centroid
  const ang = elapsed * 0.10;
  const radius = 3.8 + Math.sin(elapsed * 0.04) * 0.25;
  camera.position.x = Math.sin(ang) * radius;
  camera.position.z = Math.cos(ang) * radius;
  camera.position.y = Math.sin(ang * 0.55) * 0.7;
  camera.lookAt(0, 0, 0.8);

  renderer.autoClear = false;
  renderer.clear();
  renderer.render(vigScene, vigCam);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}

function smoothstepJS(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

loop();
</script>
