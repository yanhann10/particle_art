<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zpy · Breath-carried choreography — Human Unreadable</title>
<!-- MOTION: drift + breath, intensity: gentle -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f9fc; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
.hash { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#8a9db3; opacity:0.45; font-size:9px; letter-spacing:0.08em; z-index:5; }
</style>
</head>
<body>
<div class="id">zpy</div>
<div class="hash"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
// Sky gradient — pale dawn to soft azure
const canvas = document.createElement('canvas');
canvas.width = 2;
canvas.height = 512;
const ctx = canvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#e8f2f8');
grad.addColorStop(0.4, '#cde4f2');
grad.addColorStop(0.75, '#a8cee8');
grad.addColorStop(1, '#7ab8dc');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
const bgTex = new THREE.CanvasTexture(canvas);
scene.background = bgTex;
scene.fog = new THREE.FogExp2(0xe8f2f8, 0.012);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 12, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Soft daylight
const ambLight = new THREE.AmbientLight(0xd8e8f5, 0.7);
scene.add(ambLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(-8, 16, 12);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xb8d8f0, 0.4);
fillLight.position.set(6, 8, -5);
scene.add(fillLight);

// ── Hash generation and seeded RNG
function generateHash(){
  let h = '';
  const chars = '0123456789abcdef';
  for(let i=0; i<64; i++) h += chars[Math.floor(Math.random()*16)];
  return h;
}

let HASH = generateHash();
document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';

// Seed RNG from hash
let rngState = 0;
for(let i=0; i<8; i++){
  rngState ^= parseInt(HASH.substring(i*8, i*8+8), 16);
}
rngState = rngState >>> 0;

function rng(){
  rngState |= 0;
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Derive choreography parameters from hash
const NUM_FIGURES = 3 + Math.floor(rng() * 4); // 3-6 dancers
const JOINTS_PER_FIGURE = 12;

class Figure {
  constructor(index){
    this.index = index;
    this.joints = [];
    this.springs = [];
    
    // Hash-derived initial placement
    const angle = (index / NUM_FIGURES) * Math.PI * 2 + rng() * 0.8;
    const radius = 8 + rng() * 6;
    const centerX = Math.cos(angle) * radius;
    const centerZ = Math.sin(angle) * radius;
    const centerY = 6 + rng() * 4;
    
    // Phase offsets from hash — zephyr: slower, breathier
    this.phaseX = rng() * Math.PI * 2;
    this.phaseY = rng() * Math.PI * 2;
    this.phaseZ = rng() * Math.PI * 2;
    
    // Amplitude from hash — lighter, more buoyant
    this.ampX = 1.5 + rng() * 3.5;
    this.ampY = 2.0 + rng() * 4.5;
    this.ampZ = 1.5 + rng() * 3.5;
    
    // Frequency from hash — slower breath cycles
    this.freqX = 0.08 + rng() * 0.15;
    this.freqY = 0.06 + rng() * 0.14;
    this.freqZ = 0.09 + rng() * 0.13;
    
    // Breath offset — secondary slow modulation
    this.breathPhase = rng() * Math.PI * 2;
    this.breathFreq = 0.03 + rng() * 0.05;
    this.breathAmp = 0.6 + rng() * 1.2;
    
    // Initialize joints as point masses
    for(let i=0; i<JOINTS_PER_FIGURE; i++){
      const t = i / (JOINTS_PER_FIGURE - 1);
      // Vertical spine with hash-derived variation
      const x = centerX + (rng()-0.5) * 1.5;
      const y = centerY + t * 8 + (rng()-0.5) * 0.8;
      const z = centerZ + (rng()-0.5) * 1.5;
      this.joints.push({
        pos: new THREE.Vector3(x, y, z),
        vel: new THREE.Vector3(),
        base: new THREE.Vector3(x, y, z),
        mass: 0.6 + rng() * 0.3 // lighter masses for zephyr
      });
    }
    
    // Spring connections — hash-derived topology, softer
    const numSprings = 18 + Math.floor(rng() * 12);
    for(let i=0; i<numSprings; i++){
      const a = Math.floor(rng() * JOINTS_PER_FIGURE);
      let b = Math.floor(rng() * JOINTS_PER_FIGURE);
      if(a === b) b = (b+1) % JOINTS_PER_FIGURE;
      const restLen = this.joints[a].pos.distanceTo(this.joints[b].pos);
      const stiffness = 0.02 + rng() * 0.04; // softer springs
      const damping = 0.80 + rng() * 0.12;
      this.springs.push({ a, b, restLen, stiffness, damping });
    }
    
    // Color per figure from hash — cool pale tones
    const hue = rng();
    this.color = new THREE.Color().setHSL(
      0.5 + hue * 0.2, // cyan-blue range
      0.35 + rng() * 0.25,
      0.6 + rng() * 0.25
    );
  }
  
  update(time, dt){
    // Breath modulation — slow expansion/contraction
    const breathScale = 1.0 + Math.sin(time * this.breathFreq + this.breathPhase) * this.breathAmp * 0.15;
    
    // Apply hash-derived motion fields with breath
    for(let i=0; i<this.joints.length; i++){
      const j = this.joints[i];
      const target = j.base.clone();
      
      // Wave motion with per-joint phase offset
      const jointPhase = (i / JOINTS_PER_FIGURE) * Math.PI;
      const wx = Math.sin(time * this.freqX + this.phaseX + jointPhase) * this.ampX;
      const wy = Math.cos(time * this.freqY + this.phaseY + jointPhase * 0.7) * this.ampY;
      const wz = Math.sin(time * this.freqZ + this.phaseZ + jointPhase * 1.3) * this.ampZ;
      
      target.x += wx * breathScale;
      target.y += wy * breathScale;
      target.z += wz * breathScale;
      
      // Attraction to target — lighter for zephyr feel
      const force = target.clone().sub(j.pos).multiplyScalar(0.05);
      j.vel.add(force.multiplyScalar(dt));
    }
    
    // Spring forces
    for(let s of this.springs){
      const ja = this.joints[s.a];
      const jb = this.joints[s.b];
      const delta = jb.pos.clone().sub(ja.pos);
      const dist = delta.length();
      if(dist < 0.01) continue;
      const force = delta.normalize().multiplyScalar((dist - s.restLen) * s.stiffness);
      ja.vel.add(force.multiplyScalar(dt / ja.mass));
      jb.vel.sub(force.multiplyScalar(dt / jb.mass));
      // Damping
      ja.vel.multiplyScalar(s.damping);
      jb.vel.multiplyScalar(s.damping);
    }
    
    // Integrate
    for(let j of this.joints){
      j.pos.add(j.vel.clone().multiplyScalar(dt));
      j.vel.multiplyScalar(0.98); // Slightly higher damping for floaty feel
    }
  }
}

// Create figures
const figures = [];
for(let i=0; i<NUM_FIGURES; i++){
  figures.push(new Figure(i));
}

// ── Build line geometry for all figures
const totalLines = figures.reduce((sum, f) => sum + f.springs.length, 0);
const linePositions = new Float32Array(totalLines * 6);
const lineColors = new Float32Array(totalLines * 6);
let lineIdx = 0;

for(let fig of figures){
  for(let s of fig.springs){
    const idx = lineIdx * 6;
    const ja = fig.joints[s.a];
    const jb = fig.joints[s.b];
    linePositions[idx]   = ja.pos.x;
    linePositions[idx+1] = ja.pos.y;
    linePositions[idx+2] = ja.pos.z;
    linePositions[idx+3] = jb.pos.x;
    linePositions[idx+4] = jb.pos.y;
    linePositions[idx+5] = jb.pos.z;
    
    // Color
    lineColors[idx]   = fig.color.r;
    lineColors[idx+1] = fig.color.g;
    lineColors[idx+2] = fig.color.b;
    lineColors[idx+3] = fig.color.r;
    lineColors[idx+4] = fig.color.g;
    lineColors[idx+5] = fig.color.b;
    
    lineIdx++;
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.55,
  blending: THREE.NormalBlending,
  depthWrite: false,
  fog: true
});
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// ── Joint point sprites
const jointGeo = new THREE.BufferGeometry();
const jointPositions = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
const jointColors = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
let jointIdx = 0;

for(let fig of figures){
  for(let j of fig.joints){
    const idx = jointIdx * 3;
    jointPositions[idx]   = j.pos.x;
    jointPositions[idx+1] = j.pos.y;
    jointPositions[idx+2] = j.pos.z;
    
    jointColors[idx]   = fig.color.r * 1.2;
    jointColors[idx+1] = fig.color.g * 1.2;
    jointColors[idx+2] = fig.color.b * 1.2;
    
    jointIdx++;
  }
}

jointGeo.setAttribute('position', new THREE.BufferAttribute(jointPositions, 3));
jointGeo.setAttribute('color', new THREE.BufferAttribute(jointColors, 3));

const jointMat = new THREE.PointsMaterial({
  size: 0.28,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
  blending: THREE.NormalBlending,
  depthWrite: false,
  fog: true
});
const points = new THREE.Points(jointGeo, jointMat);
scene.add(points);

// ── Stage floor (subtle pale plane)
const floorGeo = new THREE.PlaneGeometry(120, 120);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0xddeef8,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.25
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// ── Camera orbit — gentle drift
const cameraPath = {
  radius: 42,
  height: 12,
  speed: 0.006,
  lookHeight: 10
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Regenerate on click
addEventListener('click', () => {
  HASH = generateHash();
  document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';
  location.reload();
});

// ── Animate
const start = performance.now();
let lastTime = start;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  
  // Update all figures
  for(let fig of figures){
    fig.update(elapsed, dt);
  }
  
  // Update line geometry
  lineIdx = 0;
  const posAttr = lineGeo.attributes.position;
  const posArr = posAttr.array;
  for(let fig of figures){
    for(let s of fig.springs){
      const idx = lineIdx * 6;
      const ja = fig.joints[s.a];
      const jb = fig.joints[s.b];
      posArr[idx]   = ja.pos.x;
      posArr[idx+1] = ja.pos.y;
      posArr[idx+2] = ja.pos.z;
      posArr[idx+3] = jb.pos.x;
      posArr[idx+4] = jb.pos.y;
      posArr[idx+5] = jb.pos.z;
      lineIdx++;
    }
  }
  posAttr.needsUpdate = true;
  
  // Update joint geometry
  jointIdx = 0;
  const jointPosAttr = jointGeo.attributes.position;
  const jointPosArr = jointPosAttr.array;
  for(let fig of figures){
    for(let j of fig.joints){
      const idx = jointIdx * 3;
      jointPosArr[idx]   = j.pos.x;
      jointPosArr[idx+1] = j.pos.y;
      jointPosArr[idx+2] = j.pos.z;
      jointIdx++;
    }
  }
  jointPosAttr.needsUpdate = true;
  
  // Camera drift with breath
  const angle = elapsed * cameraPath.speed;
  const breathY = Math.sin(elapsed * 0.04) * 1.8;
  camera.position.set(
    Math.cos(angle) * cameraPath.radius,
    cameraPath.height + breathY,
    Math.sin(angle) * cameraPath.radius
  );
  camera.lookAt(0, cameraPath.lookHeight, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
