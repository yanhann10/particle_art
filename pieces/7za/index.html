<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>448 → elegy · differential-growth requiem</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px;
           letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">7za</div>
<div class="hint">drag to orbit · watch it fade</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── scene ── */
const scene = new THREE.Scene();
const fogCol = new THREE.Color(0x0a0608);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xfff0e8, 0.9).translateX(5).translateY(10).translateZ(5));
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const rimLight = new THREE.DirectionalLight(0x88aacc, 0.4);
rimLight.position.set(-5, 3, -5); scene.add(rimLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 5, 0);

/* ── differential growth (from 448 / t9w lineage) ── */
const MAX_VERTS=1500, ATTRACT=0.06, REPEL_R=0.50, REPEL_STR=0.13;
const NOISE_S=0.003, PRESSURE=0.0028, RISE=0.0045, MAX_D=0.40;
const verts=[];
for(let i=0;i<16;i++){
  const th=i/16*Math.PI*2, r=1.4+(Math.random()-0.5)*0.1;
  verts.push({x:Math.cos(th)*r, y:0, z:Math.sin(th)*r, age:0});
}
const CELL=REPEL_R, grid=new Map();
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i];
    const k=Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);
  }
}
function gridNear(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL),out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const a=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));if(a)for(const j of a)out.push(j);}
  return out;
}
let paused=false;
function step(){
  if(paused)return; const n=verts.length; if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);
  for(let i=0;i<n;i++){const v=verts[i];for(const j of gridNear(v)){
    if(j===i)continue;const u=verts[j];
    const ex=v.x-u.x,ey=v.y-u.y,ez=v.z-u.z,d2=ex*ex+ey*ey+ez*ez;
    if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;const d=Math.sqrt(d2);
    const f=REPEL_STR*(1-d/REPEL_R)/d;dx[i]+=ex*f;dy[i]+=ey*f;dz[i]+=ez*f;}}
  for(let i=0;i<n;i++){const a=verts[(i-1+n)%n],b=verts[(i+1)%n],v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;}
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for(let i=0;i<n;i++){const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;dy[i]+=(oy/d)*PRESSURE*0.4;dz[i]+=(oz/d)*PRESSURE;}
  for(let i=0;i<n;i++){const ag=verts[i].age;
    const up=RISE*(0.3+1.2*Math.min(ag*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;verts[i].age+=0.0014;}
  const grown=[];
  for(let i=0;i<n;i++){const a=verts[i],b=verts[(i+1)%n];grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS)
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,
        age:Math.max(a.age,b.age)*0.5});}
  verts.length=0;for(const v of grown)verts.push(v);
}
for(let s=0;s<600;s++)step();
addEventListener('click',()=>{paused=!paused;});

/* ── elegy shader: iridescence drains to violet-grey ash (Rachel Whiteread memorial tone) ── */
const elegMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0}, uDecay:{value:0},
    uLightDir:{value:new THREE.Vector3(0.5,0.8,0.5).normalize()},
    uFogColor:{value:fogCol}, uFogDensity:{value:0.04},
    uCamPos:{value:new THREE.Vector3()},
  },
  vertexShader:`
    attribute float aFilmThick;
    attribute float aLocalDecay;
    varying vec3 vNorm, vWorldPos;
    varying float vFilm, vDec;
    void main(){
      vNorm = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorldPos = wp.xyz;
      vFilm = aFilmThick;
      vDec = aLocalDecay;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:`
    precision highp float;
    uniform float uTime, uDecay;
    uniform vec3 uLightDir, uFogColor, uCamPos;
    uniform float uFogDensity;
    varying vec3 vNorm, vWorldPos;
    varying float vFilm, vDec;

    vec3 thinFilm(float cosT, float thick, float drain){
      float d = thick * cosT * 14.0 + uTime * 0.15;
      vec3 mag = vec3(0.72,0.16,0.52);
      vec3 tea = vec3(0.14,0.58,0.56);
      vec3 gld = vec3(0.82,0.70,0.38);
      float s1 = sin(d)*0.5+0.5;
      float s2 = cos(d*0.63)*0.5+0.5;
      vec3 iris = mix(mix(mag,tea,s1), gld, s2*0.30);
      // drain color toward violet-grey ash
      vec3 ash = vec3(0.38,0.32,0.42);
      return mix(iris, ash, drain);
    }

    void main(){
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vWorldPos);
      float NdV = max(dot(N,V),0.0);
      float NdL = max(dot(N,uLightDir),0.0);
      float fres = pow(1.0-NdV, 3.0);

      // vascular base — desaturates with decay
      vec3 vasc = vec3(0.69,0.27,0.22)*(0.3+0.7*NdL) + vec3(0.16,0.03,0.03);
      vec3 vascGrey = vec3(0.34,0.30,0.36)*(0.3+0.7*NdL) + vec3(0.08,0.06,0.09);
      vasc = mix(vasc, vascGrey, vDec);

      // film with color drain
      vec3 film = thinFilm(NdV, vFilm, vDec);
      film += vec3(0.20,0.22,0.28)*fres*0.4;
      film *= 0.45 + 0.55*NdL;

      // blend: decay zones become more translucent
      float filmAlpha = mix(0.30, 0.82, fres);
      float b = vDec * uDecay;
      vec3 col = mix(vasc, film, b*0.6);
      float a = mix(1.0, filmAlpha*0.7, b);

      // overall fade toward background as form dies
      float globalFade = uDecay * 0.25;
      a *= (1.0 - globalFade);

      // fog (manual FogExp2)
      float dist = length(vWorldPos - uCamPos);
      float fog = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
      col = mix(col, uFogColor, fog);
      gl_FragColor = vec4(col, a);
    }`,
  transparent:true, side:THREE.DoubleSide, depthWrite:true,
});

/* ── tube mesh with progressive elegy collapse ── */
let tubeMesh = null;
const _up = new THREE.Vector3(0,1,0);

// irreversible erosion state per ring — once collapsed, stays collapsed
const ringErosion = new Float32Array(600); // one per NS ring
let erosionWaveFront = 1.01; // starts above top, sweeps down (fraction 1→0)
let erosionDepth = 0.0; // deepens each pass

function buildTube(t, decayGlobal){
  if(verts.length<10) return;
  let yMin=1e9, yMax=-1e9;
  for(const v of verts){if(v.y<yMin)yMin=v.y;if(v.y>yMax)yMax=v.y;}
  const yRange=Math.max(yMax-yMin,0.1);
  const pts=verts.map(v=>new THREE.Vector3(v.x,v.y,v.z));
  const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',0.5);
  const NS=Math.min(600,verts.length*2), RAD=10;
  const tot=NS*RAD;
  const pos=new Float32Array(tot*3), nrm=new Float32Array(tot*3);
  const aFilm=new Float32Array(tot), aDec=new Float32Array(tot);
  const idx=[];

  // sample points + curvature
  const sp=[];
  for(let i=0;i<NS;i++) sp.push(curve.getPointAt(i/NS));
  const curvArr=new Float32Array(NS);
  for(let i=0;i<NS;i++){
    const p=sp[(i-1+NS)%NS], n=sp[(i+1)%NS];
    curvArr[i]=p.clone().add(n).multiplyScalar(0.5).sub(sp[i]).length();
  }

  for(let i=0;i<NS;i++){
    const tt=i/NS, p=sp[i];
    const hFrac=Math.max(0,Math.min(1,(p.y-yMin)/yRange));

    // update irreversible erosion: wave sweeps top→bottom
    if(hFrac > erosionWaveFront){
      const waveDist = hFrac - erosionWaveFront;
      const newE = Math.min(1.0, erosionDepth * Math.max(0, 1.0 - waveDist*4.0));
      ringErosion[i] = Math.max(ringErosion[i], newE); // never decreases
    }
    const localDecay = ringErosion[i];

    // thicker base radius (critic: 0.40 too wispy, use 0.58)
    let r = 0.58*(1 - hFrac*0.65);
    const node = Math.sin(tt*22)*0.5+0.5;
    r *= (1 + 0.15*Math.pow(node,6));

    // collapse: radius shrinks where eroded, membrane thins
    const collapseR = r * (1.0 - localDecay*0.7);
    // sagging: eroded sections droop
    const sag = localDecay * localDecay * 0.4;

    const tang=curve.getTangentAt(tt).normalize();
    const norm=new THREE.Vector3().crossVectors(tang,_up).normalize();
    if(norm.lengthSq()<0.001)norm.set(1,0,0);
    const binorm=new THREE.Vector3().crossVectors(tang,norm).normalize();

    // film thickness — thins as it erodes
    const filmT = (0.4 + curvArr[i]*10.0 + Math.sin(tt*50)*0.12) * (1.0 - localDecay*0.5);

    for(let j=0;j<RAD;j++){
      const ang=(j/RAD)*Math.PI*2;
      const ca=Math.cos(ang), sa=Math.sin(ang);

      // wrinkle intensifies with decay
      let wr = collapseR;
      if(localDecay>0.1){
        const warp = 1.0 - localDecay*0.18*(Math.sin(ang*5+i*0.6+t*0.3)*0.5+0.5);
        wr *= warp;
      }

      const vi = i*RAD+j;
      pos[vi*3]  = norm.x*ca*wr + binorm.x*sa*wr + p.x;
      pos[vi*3+1]= norm.y*ca*wr + binorm.y*sa*wr + p.y - sag;
      pos[vi*3+2]= norm.z*ca*wr + binorm.z*sa*wr + p.z;
      nrm[vi*3]  = norm.x*ca + binorm.x*sa;
      nrm[vi*3+1]= norm.y*ca + binorm.y*sa;
      nrm[vi*3+2]= norm.z*ca + binorm.z*sa;
      aFilm[vi] = filmT + Math.sin(ang*2.0+i*0.3)*0.15*curvArr[i]*5.0;
      aDec[vi] = localDecay;
    }
  }

  // faces — progressively remove faces where erosion is deep
  for(let i=0;i<NS;i++){
    const ni=(i+1)%NS;
    const dec = ringErosion[i];
    for(let j=0;j<RAD;j++){
      const nj=(j+1)%RAD;
      // structural holes widen irreversibly with erosion
      if(dec > 0.35){
        const h=((i*7+j*13)&31);
        const thresh = Math.floor(dec * 20);
        if(h < thresh) continue;
      }
      const a=i*RAD+j, b=i*RAD+nj, c=ni*RAD+j, d=ni*RAD+nj;
      idx.push(a,b,c, b,d,c);
    }
  }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('aFilmThick',new THREE.BufferAttribute(aFilm,1));
  g.setAttribute('aLocalDecay',new THREE.BufferAttribute(aDec,1));
  g.setIndex(idx);

  if(tubeMesh){scene.remove(tubeMesh);tubeMesh.geometry.dispose();}
  tubeMesh=new THREE.Mesh(g,elegMat);
  scene.add(tubeMesh);
}

/* ── falling ash particles — shed from eroded regions ── */
const ASH_MAX = 400;
const ashGeo = new THREE.BufferGeometry();
const ashPos = new Float32Array(ASH_MAX*3);
const ashAlpha = new Float32Array(ASH_MAX);
const ashVel = new Float32Array(ASH_MAX*3);
const ashLife = new Float32Array(ASH_MAX);
let ashCount = 0;
ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPos,3));
const ashMat = new THREE.PointsMaterial({
  color:0x8878a0, size:0.04, transparent:true, opacity:0.45,
  depthWrite:false, blending:THREE.AdditiveBlending
});
const ashPts = new THREE.Points(ashGeo, ashMat);
scene.add(ashPts);

function spawnAsh(x,y,z){
  if(ashCount>=ASH_MAX) return;
  const i=ashCount++;
  ashPos[i*3]=x; ashPos[i*3+1]=y; ashPos[i*3+2]=z;
  ashVel[i*3]=(Math.random()-0.5)*0.008;
  ashVel[i*3+1]=-0.005-Math.random()*0.01;
  ashVel[i*3+2]=(Math.random()-0.5)*0.008;
  ashLife[i]=1.0;
}

function updateAsh(dt){
  let write=0;
  for(let i=0;i<ashCount;i++){
    ashLife[i]-=dt*0.12;
    if(ashLife[i]<=0) continue;
    ashPos[i*3]+=ashVel[i*3];
    ashPos[i*3+1]+=ashVel[i*3+1];
    ashPos[i*3+2]+=ashVel[i*3+2];
    ashVel[i*3+1]-=0.00002; // gravity
    if(write!==i){
      ashPos[write*3]=ashPos[i*3];
      ashPos[write*3+1]=ashPos[i*3+1];
      ashPos[write*3+2]=ashPos[i*3+2];
      ashVel[write*3]=ashVel[i*3];
      ashVel[write*3+1]=ashVel[i*3+1];
      ashVel[write*3+2]=ashVel[i*3+2];
      ashLife[write]=ashLife[i];
    }
    write++;
  }
  ashCount=write;
  ashGeo.attributes.position.needsUpdate=true;
  ashGeo.setDrawRange(0,ashCount);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

const t0=performance.now();
let lastT=0;

(function loop(){
  const t=(performance.now()-t0)/1000;
  const dt=Math.min(t-lastT, 0.05); lastT=t;

  // growth slows and stops as elegy deepens
  const growthRate = Math.max(0, 2 - Math.floor(t/15));
  for(let s=0;s<growthRate;s++) step();

  // irreversible erosion — wave sweeps top→bottom, deepening each pass
  // first 6 seconds: the form stands whole (pre-elegy breath)
  if(t > 6.0){
    const elegT = t - 6.0;
    // wave front descends: 1.0→0.0 over ~25s, then stays low
    erosionWaveFront = Math.max(-0.1, 1.0 - elegT*0.04);
    // erosion depth increases permanently — each second adds weight
    erosionDepth = Math.min(1.0, elegT*0.018);
  }

  // global decay for shader (overall palette drain)
  const decayGlobal = t > 6.0 ? Math.min(1.0, (t-6.0)*0.015) : 0.0;

  elegMat.uniforms.uTime.value=t;
  elegMat.uniforms.uDecay.value=decayGlobal;
  elegMat.uniforms.uCamPos.value.copy(camera.position);

  buildTube(t, decayGlobal);

  // spawn ash from eroding zones
  if(decayGlobal > 0.05 && verts.length > 10 && Math.random()<0.3){
    const vi = Math.floor(Math.random()*verts.length);
    const v = verts[vi];
    const hFrac = v.y; // approximate
    if(ringErosion[Math.floor(vi*600/verts.length)]>0.2){
      spawnAsh(v.x, v.y, v.z);
    }
  }
  updateAsh(dt);

  // ash particle opacity fades with global decay
  ashMat.opacity = 0.45 * (1.0 - decayGlobal*0.5);

  // camera: track centroid + drift inward as form crumbles (critic request)
  let yMean=0, xMean=0, zMean=0;
  for(const v of verts){xMean+=v.x; yMean+=v.y; zMean+=v.z;}
  const n=Math.max(verts.length,1);
  xMean/=n; yMean/=n; zMean/=n;
  const tgtY=Math.max(yMean,2.0);
  controls.target.x+=(xMean-controls.target.x)*0.03;
  controls.target.y+=(tgtY-controls.target.y)*0.04;
  controls.target.z+=(zMean-controls.target.z)*0.03;

  // intimate drift inward: camera slowly closes distance
  const intimacy = decayGlobal * 0.35; // up to 35% closer
  const baseDist = 14;
  const targetDist = baseDist * (1.0 - intimacy);
  const camDir = camera.position.clone().sub(controls.target).normalize();
  const currentDist = camera.position.distanceTo(controls.target);
  const newDist = currentDist + (targetDist - currentDist)*0.008;
  const targetCamPos = controls.target.clone().add(camDir.multiplyScalar(newDist));
  camera.position.lerp(targetCamPos, 0.015);
  camera.position.y+=(tgtY+4-camera.position.y)*0.04;

  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
