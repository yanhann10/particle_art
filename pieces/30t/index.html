<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: trace, intensity: gentle -->
<!-- Halvorsen attractor: 3-lobed spiral, like a 3-petal flower in 3D.
     Palette: deep indigo (#1a1060) at low velocity → electric white (#f8f8ff) at high velocity.
     Rendered as a single THREE.Line trail (200k integration steps). NormalBlending. -->
<title>xaj · halvorsen attractor</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08060f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id  { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .src { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">xaj · halvorsen attractor</div>
<div class="src">strange attractor · 200k trail steps</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Halvorsen system ──────────────────────────────────────────────────────────
// dx/dt = -a*x - 4*y - 4*z - y*y
// dy/dt = -a*y - 4*z - 4*x - z*z
// dz/dt = -a*z - 4*x - 4*y - x*x
// a = 1.89, dt = 0.001
// Produces a distinctive 3-lobed spiral — three interpenetrating petals in 3D.

// Use dt=0.005 and 3 interleaved traces for dense coverage of the attractor manifold.
// Each trace starts from a slightly different initial condition to fill in the shape.
const TRACES = 3;
const N_PER  = 120000;
const N      = TRACES * N_PER;
const DT     = 0.005;   // larger step → more orbit coverage
const A      = 1.89;

// ── Integrate trajectory on CPU ───────────────────────────────────────────────
const positions = new Float32Array(N * 3);
const colors    = new Float32Array(N * 3);

// Multiple trace seeds (slight perturbation)
const seeds = [
  [-5.0,  0.1,  1.0],
  [-4.8,  0.3,  1.2],
  [-5.2, -0.2,  0.8],
];

const pts    = new Float32Array(N * 3);
const velBuf = new Float32Array(N);

for (let t = 0; t < TRACES; t++) {
  let [x, y, z] = seeds[t];
  // Warm up 2000 steps to get onto the manifold
  for (let w = 0; w < 2000; w++) {
    const dx = -A*x - 4*y - 4*z - y*y;
    const dy = -A*y - 4*z - 4*x - z*z;
    const dz = -A*z - 4*x - 4*y - x*x;
    x += dx*DT; y += dy*DT; z += dz*DT;
  }
  const base = t * N_PER;
  for (let i = 0; i < N_PER; i++) {
    const dx = -A*x - 4*y - 4*z - y*y;
    const dy = -A*y - 4*z - 4*x - z*z;
    const dz = -A*z - 4*x - 4*y - x*x;
    x += dx*DT; y += dy*DT; z += dz*DT;
    const idx = base + i;
    pts[idx*3]   = x; pts[idx*3+1] = y; pts[idx*3+2] = z;
    velBuf[idx]  = Math.sqrt(dx*dx + dy*dy + dz*dz);
  }
}

// Velocity range for normalization
let vMin = Infinity, vMax = -Infinity;
for (let i = 0; i < N; i++) {
  if (velBuf[i] < vMin) vMin = velBuf[i];
  if (velBuf[i] > vMax) vMax = velBuf[i];
}
const vRange = vMax - vMin || 1.0;

// Center the attractor
let cx = 0, cy = 0, cz = 0;
for (let i = 0; i < N; i++) { cx += pts[i*3]; cy += pts[i*3+1]; cz += pts[i*3+2]; }
cx /= N; cy /= N; cz /= N;

// Build position + color arrays
for (let i = 0; i < N; i++) {
  positions[i*3]   = pts[i*3]   - cx;
  positions[i*3+1] = pts[i*3+1] - cy;
  positions[i*3+2] = pts[i*3+2] - cz;

  // Velocity → color: deep indigo (#1a1060) to electric white (#f8f8ff)
  const tv = Math.pow((velBuf[i] - vMin) / vRange, 0.5); // gamma 0.5 for visual pop
  // low-vel: indigo (0.102, 0.063, 0.376)
  // high-vel: white (0.973, 0.973, 1.0)
  colors[i*3]   = 0.102 + tv * (0.973 - 0.102);
  colors[i*3+1] = 0.063 + tv * (0.973 - 0.063);
  colors[i*3+2] = 0.376 + tv * (1.000 - 0.376);
}

// ── Three.js scene ────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08060f, 1);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 10, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.3;
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;

// Build the line geometry
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

const mat = new THREE.LineBasicMaterial({
  vertexColors: true,
  blending:     THREE.NormalBlending,
  transparent:  true,
  opacity:      0.82,
  linewidth:    1   // GPU driver caps at 1 on most platforms
});

scene.add(new THREE.Line(geo, mat));

// Resize handler
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
