<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c8m · marshmallow surprise</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">c8m</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 14, 28);
camera.lookAt(0, 10, 0);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const N_AGENTS = 280;
const agents = [];
const CELL_SIZE = 0.8;
const GRID_W = 32, GRID_H = 48, GRID_D = 32;
const grid = new Uint8Array(GRID_W * GRID_H * GRID_D);

function gridIdx(x, y, z){
  const ix = Math.floor((x + GRID_W/2 * CELL_SIZE) / CELL_SIZE);
  const iy = Math.floor(y / CELL_SIZE);
  const iz = Math.floor((z + GRID_D/2 * CELL_SIZE) / CELL_SIZE);
  if (ix < 0 || ix >= GRID_W || iy < 0 || iy >= GRID_H || iz < 0 || iz >= GRID_D) return -1;
  return ix + iy * GRID_W + iz * GRID_W * GRID_H;
}

function gridDensity(x, y, z, r){
  let count = 0;
  for (let dy = -1; dy <= 1; dy++){
    for (let dx = -1; dx <= 1; dx++){
      for (let dz = -1; dz <= 1; dz++){
        const idx = gridIdx(x + dx*CELL_SIZE, y + dy*CELL_SIZE, z + dz*CELL_SIZE);
        if (idx >= 0) count += grid[idx];
      }
    }
  }
  return count;
}

const rng = (() => { let s = 0x2F6E2B1; return () => { s = (s + 0x9E3779B9) | 0;
  let t = Math.imul(s ^ s >>> 16, 0x21F0AAAD); t ^= t >>> 15;
  t = Math.imul(t, 0x735A2D97); return ((t ^ t >>> 15) >>> 0) / 4294967296; }; })();

for (let i = 0; i < N_AGENTS; i++){
  const th = rng() * Math.PI * 2;
  const r = 2.5 + rng() * 5;
  agents.push({
    x: Math.cos(th) * r,
    y: 2 + rng() * 0.5,
    z: Math.sin(th) * r,
    vx: 0, vy: 0, vz: 0,
    state: 0,   // 0=seek, 1=trace, 2=PUFF
    traceSteps: 0,
    puffTime: 0,
    seed: rng()
  });
}

const MAX_TRACES = 60000;
const tracePositions = new Float32Array(MAX_TRACES * 2 * 3);
const traceColors = new Float32Array(MAX_TRACES * 2 * 3);
let traceCount = 0;

function addTrace(x0, y0, z0, x1, y1, z1, hue){
  if (traceCount >= MAX_TRACES) return;
  const i = traceCount * 6;
  tracePositions[i]   = x0; tracePositions[i+1] = y0; tracePositions[i+2] = z0;
  tracePositions[i+3] = x1; tracePositions[i+4] = y1; tracePositions[i+5] = z1;
  const c = hue === 1
    ? [0.72, 0.48, 0.32]
    : [0.88, 0.88, 0.88];
  traceColors[i]   = c[0]; traceColors[i+1] = c[1]; traceColors[i+2] = c[2];
  traceColors[i+3] = c[0]; traceColors[i+4] = c[1]; traceColors[i+5] = c[2];
  traceCount++;
}

const traceGeom = new THREE.BufferGeometry();
traceGeom.setAttribute('position', new THREE.BufferAttribute(tracePositions, 3));
traceGeom.setAttribute('color', new THREE.BufferAttribute(traceColors, 3));
const traceMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.5 });
const traceLines = new THREE.LineSegments(traceGeom, traceMat);
scene.add(traceLines);

const agentGeom = new THREE.BufferGeometry();
const agentPos = new Float32Array(N_AGENTS * 3);
const agentCol = new Float32Array(N_AGENTS * 3);
const agentSize = new Float32Array(N_AGENTS);
agentGeom.setAttribute('position', new THREE.BufferAttribute(agentPos, 3));
agentGeom.setAttribute('color', new THREE.BufferAttribute(agentCol, 3));
agentGeom.setAttribute('size', new THREE.BufferAttribute(agentSize, 1));

const agentMat = new THREE.ShaderMaterial({
  transparent: true,
  vertexShader: `
    attribute float size;
    attribute vec3 color;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      vec2 coord = gl_PointCoord - vec2(0.5);
      float r = length(coord);
      if (r > 0.5) discard;
      float alpha = 0.9 * (1.0 - smoothstep(0.3, 0.5, r));
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});
const agentPoints = new THREE.Points(agentGeom, agentMat);
scene.add(agentPoints);

function updateAgents(){
  grid.fill(0);
  for (const a of agents){
    const idx = gridIdx(a.x, a.y, a.z);
    if (idx >= 0) grid[idx] = Math.min(grid[idx] + 1, 255);
  }

  for (let i = 0; i < agents.length; i++){
    const a = agents[i];
    const prevX = a.x, prevY = a.y, prevZ = a.z;

    if (a.state === 0){
      // SEEK mode
      const toCenter = Math.sqrt(a.x*a.x + a.z*a.z);
      const centerForce = Math.min(0.12, toCenter * 0.04);
      a.vx += -(a.x / (toCenter + 0.001)) * centerForce;
      a.vz += -(a.z / (toCenter + 0.001)) * centerForce;
      a.vy += 0.08;
      const dens = gridDensity(a.x, a.y, a.z, 1.2);
      
      // MARSHMALLOW SURPRISE: transition to PUFF at height threshold
      if (dens > 5 && a.y > 16 && rng() < 0.4){
        a.state = 2;  // PUFF state
        a.puffTime = 0;
      } else if (dens > 5 && a.y > 4){
        a.state = 1;
        a.traceSteps = 0;
      }
    } else if (a.state === 2){
      // PUFF mode: marshmallow expansion burst
      a.puffTime++;
      
      // Strong outward repulsion from neighbors
      let repulseX = 0, repulseZ = 0;
      for (const other of agents){
        if (other === a || other.state !== 2) continue;
        const dx = a.x - other.x;
        const dz = a.z - other.z;
        const dist = Math.sqrt(dx*dx + dz*dz) + 0.01;
        if (dist < 3){
          const force = 0.25 / (dist * dist);
          repulseX += dx * force;
          repulseZ += dz * force;
        }
      }
      a.vx += repulseX;
      a.vz += repulseZ;
      a.vy += 0.02;  // gentle upward drift
      
      // Exit puff after 80 frames → settle into trace mode
      if (a.puffTime > 80){
        a.state = 1;
        a.traceSteps = 0;
      }
    } else {
      // TRACE mode
      const toCenter = Math.sqrt(a.x*a.x + a.z*a.z) + 0.001;
      const r = toCenter;
      const orbitSpeed = 0.03;
      a.vx = -(a.z / r) * orbitSpeed * r;
      a.vz =  (a.x / r) * orbitSpeed * r;
      a.vy = 0.05 + a.seed * 0.02;
      a.traceSteps++;
      if (a.traceSteps > 180 || a.y > 24){
        a.state = 0;
        a.traceSteps = 0;
      }
    }

    // damping
    const damp = a.state === 2 ? 0.92 : 0.85;
    a.vx *= damp;
    a.vy *= 0.92;
    a.vz *= damp;
    const maxV = a.state === 2 ? 0.35 : 0.25;
    const spd = Math.sqrt(a.vx*a.vx + a.vy*a.vy + a.vz*a.vz);
    if (spd > maxV){
      a.vx = a.vx / spd * maxV;
      a.vy = a.vy / spd * maxV;
      a.vz = a.vz / spd * maxV;
    }

    a.x += a.vx;
    a.y += a.vy;
    a.z += a.vz;

    if (a.y < 0){ a.y = 0; a.vy *= -0.2; }
    if (a.y > 26){ a.y = 26; a.vy *= -0.2; }
    const lim = 12;
    if (Math.abs(a.x) > lim){ a.x = Math.sign(a.x) * lim; a.vx *= -0.3; }
    if (Math.abs(a.z) > lim){ a.z = Math.sign(a.z) * lim; a.vz *= -0.3; }

    if (a.state === 1){
      const moved = Math.sqrt((a.x-prevX)**2 + (a.y-prevY)**2 + (a.z-prevZ)**2);
      if (moved > 0.05){
        const hue = (i % 20 === 0) ? 1 : 0;
        addTrace(prevX, prevY, prevZ, a.x, a.y, a.z, hue);
      }
    }

    agentPos[i*3]   = a.x;
    agentPos[i*3+1] = a.y;
    agentPos[i*3+2] = a.z;
    
    // MARSHMALLOW COLOR + SIZE SHIFT
    if (a.state === 2){
      // Creamy marshmallow palette: #FFF5E8 → #FFE4E1
      const puffProg = Math.min(a.puffTime / 40, 1);
      agentCol[i*3]   = 1.0;
      agentCol[i*3+1] = 0.96 - puffProg * 0.07;  // 0.96 → 0.89
      agentCol[i*3+2] = 0.91 - puffProg * 0.03;  // 0.91 → 0.88
      // 3x size during puff
      agentSize[i] = 0.15 + Math.sin(puffProg * Math.PI) * 0.35;
    } else if (a.state === 1 && i % 20 === 0){
      agentCol[i*3]   = 0.72;
      agentCol[i*3+1] = 0.48;
      agentCol[i*3+2] = 0.32;
      agentSize[i] = 0.15;
    } else {
      agentCol[i*3]   = 0.88;
      agentCol[i*3+1] = 0.88;
      agentCol[i*3+2] = 0.88;
      agentSize[i] = 0.15;
    }
  }

  agentGeom.attributes.position.needsUpdate = true;
  agentGeom.attributes.color.needsUpdate = true;
  agentGeom.attributes.size.needsUpdate = true;
  traceGeom.setDrawRange(0, traceCount * 2);
  traceGeom.attributes.position.needsUpdate = true;
  traceGeom.attributes.color.needsUpdate = true;
}

let frame = 0;
function loop(){
  frame++;
  if (frame % 2 === 0) updateAgents();
  
  const t = frame * 0.0008;
  camera.position.x = Math.sin(t) * 28;
  camera.position.z = Math.cos(t) * 28;
  camera.lookAt(0, 10, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
