<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t8j · Shiota — Archive of Keys</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">t8j</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020000, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.006));
const pL = new THREE.PointLight(0xff6040, 0.022, 60, 2.4);
pL.position.set(-3, 6, 2);
scene.add(pL);

let seed = 8172635;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── ARCHITECTURAL VOLUME — 32×26×28 chamber
const ROOM = { w:32, h:26, d:28 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── SUSPENDED KEYS — field of 2200 small keys, dense cloud
const keyCenter = new THREE.Vector3(0.0, 1.2, 0.0);
const keyFieldR = 7.5;
const NUM_KEYS = 2200;
const keys = [];

for(let i = 0; i < NUM_KEYS; i++){
  const keyGeo = new THREE.BufferGeometry();
  
  // Simple key shape: shaft + head + teeth
  const shaftLen = 0.08 + rng()*0.06;
  const headR = 0.015 + rng()*0.008;
  const verts = [];
  
  // Shaft
  verts.push(-shaftLen*0.5, 0, 0);
  verts.push(shaftLen*0.5, 0, 0);
  
  // Head loop (6 segments)
  for(let j = 0; j < 6; j++){
    const a = (j/6)*Math.PI*2;
    verts.push(-shaftLen*0.5 + Math.cos(a)*headR, Math.sin(a)*headR, 0);
  }
  
  // Teeth (3-5 notches)
  const teeth = 3 + Math.floor(rng()*3);
  for(let t = 0; t < teeth; t++){
    const tx = shaftLen*0.3 + (t/(teeth-1||1))*(shaftLen*0.15);
    const ty = (rng()-0.5)*0.004;
    verts.push(tx, ty, 0);
    verts.push(tx + 0.004, ty - (0.003+rng()*0.003), 0);
  }
  
  keyGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts.flat()), 3));
  
  const keyMat = new THREE.LineBasicMaterial({
    color: 0x1a1412,
    transparent: true,
    opacity: 0.42,
    fog: true
  });
  
  const keyMesh = new THREE.LineSegments(keyGeo, keyMat);
  
  // Distribute in volumetric cloud
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  const r = Math.pow(rng(), 0.6) * keyFieldR;
  
  keyMesh.position.set(
    keyCenter.x + Math.sin(v)*Math.cos(u)*r,
    keyCenter.y + Math.sin(v)*Math.sin(u)*r*0.85,
    keyCenter.z + Math.cos(v)*r
  );
  
  keyMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  
  keys.push(keyMesh);
  scene.add(keyMesh);
}

// ── ANCHOR FIELD — 580 anchor points for thread network
const anchors = [];

// Radial shells around key-cloud center
const shells = [3.2, 5.5, 8.0, 10.5, 13.0];
for(const sr of shells){
  const count = Math.floor(14 + sr*1.2);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.8+rng()*0.4);
    anchors.push(new THREE.Vector3(
      keyCenter.x + Math.sin(v)*Math.cos(u)*r,
      keyCenter.y + Math.sin(v)*Math.sin(u)*r*0.82,
      keyCenter.z + Math.cos(v)*r
    ));
  }
}

// Wall anchors — sparse
for(let i = 0; i < 55; i++){
  anchors.push(wallPt());
}

// Key positions as anchors
for(let i = 0; i < NUM_KEYS; i++){
  if(i % 8 === 0){
    anchors.push(keys[i].position.clone());
  }
}

// ── SUSPENSION THREADS — 10 vertical lines from ceiling to key-cloud top
const suspPts = [];
for(let i = 0; i < 10; i++){
  const a = (i/10)*Math.PI*2 + (rng()-0.5)*0.3;
  const topR = 0.3 + rng()*0.8;
  const botR = keyFieldR*0.7 + (rng()-0.5)*1.2;
  const botAngle = a + (rng()-0.5)*0.4;
  suspPts.push(
    keyCenter.x + Math.cos(a)*topR, hh, keyCenter.z + Math.sin(a)*topR,
    keyCenter.x + Math.cos(botAngle)*botR, keyCenter.y + keyFieldR*0.65, keyCenter.z + Math.sin(botAngle)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0202, transparent: true, opacity: 0.36
})));

// ── BUILD THE THREAD NETWORK — 20,000 segments (hard limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-keyCenter.x)**2+(my-keyCenter.y)**2+(mz-keyCenter.z)**2);
  li++;
}

// RULE 1: CONVERGENCE — threads wrapping the key-cloud
// 60% of budget — threads converging toward key positions
const catA = Math.floor(NUM_LINES * 0.60);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.50){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  
  // Target random key position
  const targetKey = keys[Math.floor(rng()*NUM_KEYS)];
  const target = targetKey.position.clone();
  
  // Add small offset so thread doesn't hit key exactly
  target.x += (rng()-0.5)*0.015;
  target.y += (rng()-0.5)*0.015;
  target.z += (rng()-0.5)*0.015;
  
  // 12% yearning threads — stop short
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng()*1.8;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped);
  } else {
    setLine(origin, target);
  }
}

// RULE 2: LATERAL — anchor-to-anchor within proximity
const THRESH = 6.5;
const catBtarget = Math.floor(NUM_LINES * 0.22);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 40000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  catBcount++;
}

// RULE 3: BRANCHING WEBS — dendritic chains from key-cloud surface
for(let i = 0; i < 120 && li < NUM_LINES; i++){
  const keyIdx = Math.floor(rng()*NUM_KEYS);
  let pt = keys[keyIdx].position.clone();
  
  const radial = pt.clone().sub(keyCenter).normalize();
  const chainLen = 2 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.4 + rng()*0.7;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next);
    
    // Y-fork at gen 1
    if(c === 1 && rng() < 0.38 && li < NUM_LINES){
      const forkDev = new THREE.Vector3(
        (rng()-0.5)*0.8, (rng()-0.5)*0.8, (rng()-0.5)*0.8
      );
      const forkDir = prevDir.clone().add(forkDev).normalize();
      const forkLen = 0.3 + rng()*0.4;
      const forkPt = pt.clone().add(forkDir.multiplyScalar(forkLen));
      setLine(pt, forkPt);
    }
    
    pt = next;
    prevDir = dir;
  }
}

// Fill remainder with architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.18 ? keys[Math.floor(rng()*NUM_KEYS)].position.clone() : wallPt();
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — single blood-red #c20018
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.25, 1.0 - d*0.065);
  const baseOp = 0.082 * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.78;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — slow drift through the archive, inside the web
const pathLen = 1800;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=keyCenter.x, cy=keyCenter.y, cz=keyCenter.z;

  let rH, y;
  if(t < 0.22){
    const lt = t/0.22;
    rH = 4.5 + lt*1.2;
    y = cy - 1.2 + lt*1.5;
  } else if(t < 0.42){
    const lt = (t-0.22)/0.2;
    rH = 5.7 + lt*3.8;
    y = cy + 0.3 + lt*4.2;
  } else if(t < 0.58){
    const lt = (t-0.42)/0.16;
    rH = 9.5 - lt*1.2;
    y = cy + 4.5 + Math.sin(lt*Math.PI)*1.8;
  } else if(t < 0.78){
    const lt = (t-0.58)/0.2;
    rH = 8.3 - lt*0.8;
    y = cy + 6.3 - lt*11.2;
  } else {
    const lt = (t-0.78)/0.22;
    rH = 7.5 - lt*3.0;
    y = cy - 4.9 + lt*3.7;
  }

  const x = cx + Math.sin(p*0.78)*rH;
  const z = cz + Math.cos(p*0.78)*rH*1.12;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — <0.4% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00007 * Math.max(0, 1.0-dist/16.0);
    const phase = basePositions[idx]*0.05 + basePositions[idx+1]*0.07 + i*0.0002;
    const breath = Math.sin(elapsed*0.0042+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.12;
      arr[vi+2] = basePositions[vi+2] + breath*0.14;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Keys slow rotation/drift
  for(let i = 0; i < NUM_KEYS; i++){
    if(i % 5 === 0){
      keys[i].rotation.y += 0.0002;
      keys[i].rotation.x += 0.00015;
    }
  }

  // Camera dolly — slow drift
  const speed = 0.00012;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward key-cloud with gentle breathing offset
  const look = keyCenter.clone();
  look.x += Math.sin(elapsed*0.0005)*0.04;
  look.y += Math.cos(elapsed*0.00038)*0.22;
  look.z += Math.sin(elapsed*0.00065+0.3)*0.035;
  camera.lookAt(look);

  // Light micro-drift
  pL.position.x = -3 + Math.sin(elapsed*0.00025)*0.08;
  pL.position.y = 6 + Math.cos(elapsed*0.00015)*0.06;
  pL.intensity = 0.022 + Math.sin(elapsed*0.00032)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
