<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9vx · Geometric Tree (Manolo Gamboa Naon)</title>
<!-- MOTION: stacking, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">9vx</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Manolo Gamboa Naon aesthetic: geometric primitives, flat colors, editorial poster layout
// Tree abstracted into stacked triangular forms with ring/hexagon/line decorations
// No organic noise — pure geometry, hard edges, color blocking

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.enableZoom = false;
controls.enablePan = false;

// Color palette: 5 flat colors, no gradients
const PALETTE = [
  0xf4e8c1, // cream
  0xe63946, // red
  0x2a9d8f, // teal
  0xf77f00, // orange
  0x264653, // dark blue-gray
];

const group = new THREE.Group();
scene.add(group);

// Trunk: stacked triangles forming a vertical column
function createTrunk() {
  const trunkGroup = new THREE.Group();
  const layers = 12;
  for (let i = 0; i < layers; i++) {
    const y = -6 + i * 0.65;
    const scale = 0.7 - i * 0.03;
    const shape = new THREE.Shape();
    shape.moveTo(0, 0.5);
    shape.lineTo(-0.4, -0.5);
    shape.lineTo(0.4, -0.5);
    shape.lineTo(0, 0.5);
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshBasicMaterial({ 
      color: PALETTE[4], 
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.9
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.y = y;
    mesh.scale.set(scale, scale, scale);
    trunkGroup.add(mesh);
  }
  return trunkGroup;
}

// Canopy: triangular layers with alternating orientations
function createCanopy() {
  const canopyGroup = new THREE.Group();
  const layers = [
    { y: 1.5, s: 2.8, rot: 0, col: PALETTE[2] },
    { y: 2.5, s: 2.4, rot: Math.PI/6, col: PALETTE[3] },
    { y: 3.5, s: 2.0, rot: 0, col: PALETTE[2] },
    { y: 4.5, s: 1.6, rot: Math.PI/6, col: PALETTE[3] },
    { y: 5.5, s: 1.2, rot: 0, col: PALETTE[2] },
    { y: 6.3, s: 0.8, rot: Math.PI/6, col: PALETTE[1] },
  ];
  
  for (const layer of layers) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0.6);
    shape.lineTo(-0.5, -0.3);
    shape.lineTo(0.5, -0.3);
    shape.lineTo(0, 0.6);
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshBasicMaterial({ 
      color: layer.col, 
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.y = layer.y;
    mesh.rotation.z = layer.rot;
    mesh.scale.set(layer.s, layer.s, layer.s);
    canopyGroup.add(mesh);
  }
  return canopyGroup;
}

// Decorative rings at canopy intersections
function createRings() {
  const ringGroup = new THREE.Group();
  const positions = [1.5, 2.5, 3.5, 4.5, 5.5];
  
  for (let i = 0; i < positions.length; i++) {
    const y = positions[i];
    const radius = 1.2 + i * 0.15;
    const geom = new THREE.RingGeometry(radius, radius + 0.08, 32);
    const mat = new THREE.MeshBasicMaterial({ 
      color: PALETTE[0], 
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.6
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.y = y;
    mesh.rotation.x = Math.PI / 2;
    ringGroup.add(mesh);
  }
  return ringGroup;
}

// Ground plane: hexagonal grid pattern
function createGround() {
  const groundGroup = new THREE.Group();
  const hexRadius = 0.35;
  const gridSize = 8;
  
  for (let i = -gridSize; i <= gridSize; i++) {
    for (let j = -gridSize; j <= gridSize; j++) {
      const x = i * hexRadius * 1.8;
      const z = j * hexRadius * 1.5 + (i % 2) * hexRadius * 0.75;
      
      if (x*x + z*z < 64) {
        const shape = new THREE.Shape();
        for (let k = 0; k < 6; k++) {
          const angle = (Math.PI / 3) * k;
          const px = hexRadius * Math.cos(angle);
          const py = hexRadius * Math.sin(angle);
          if (k === 0) shape.moveTo(px, py);
          else shape.lineTo(px, py);
        }
        shape.lineTo(hexRadius, 0);
        
        const geom = new THREE.ShapeGeometry(shape);
        const mat = new THREE.MeshBasicMaterial({ 
          color: PALETTE[4], 
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.15
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.set(x, -6.2, z);
        mesh.rotation.x = -Math.PI / 2;
        groundGroup.add(mesh);
      }
    }
  }
  return groundGroup;
}

// Accent lines: vertical rays behind the tree
function createAccentLines() {
  const lineGroup = new THREE.Group();
  const numLines = 24;
  
  for (let i = 0; i < numLines; i++) {
    const angle = (i / numLines) * Math.PI * 2;
    const dist = 9 + (i % 3) * 1.5;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    
    const points = [
      new THREE.Vector3(x, -6, z),
      new THREE.Vector3(x, 8, z)
    ];
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({ 
      color: PALETTE[1], 
      transparent: true, 
      opacity: 0.12 
    });
    const line = new THREE.Line(geom, mat);
    lineGroup.add(line);
  }
  return lineGroup;
}

// Half-circle decorations at select canopy levels
function createHalfCircles() {
  const halfGroup = new THREE.Group();
  const positions = [
    { y: 3.5, r: 1.8, rot: 0 },
    { y: 5.5, r: 1.2, rot: Math.PI },
  ];
  
  for (const pos of positions) {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, pos.r, 0, Math.PI, false);
    shape.lineTo(0, 0);
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshBasicMaterial({ 
      color: PALETTE[1], 
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.4
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.y = pos.y;
    mesh.rotation.z = pos.rot;
    mesh.rotation.y = Math.PI / 2;
    halfGroup.add(mesh);
  }
  return halfGroup;
}

// Assemble scene
const accentLines = createAccentLines();
const ground = createGround();
const trunk = createTrunk();
const canopy = createCanopy();
const rings = createRings();
const halfCircles = createHalfCircles();

group.add(accentLines);
group.add(ground);
group.add(trunk);
group.add(canopy);
group.add(rings);
group.add(halfCircles);

// Slow rotation for editorial reveal
let time = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(now) {
  time = now * 0.0001;
  
  // Very slow rotation to show the geometric construction
  group.rotation.y = time * 0.15;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(0);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
