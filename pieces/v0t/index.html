<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v0t · tender leaf ascent (Felix Gonzalez-Torres)</title>
<!-- MOTION: ASCEND, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">v0t</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · paper leaves ascending · buoyancy memory</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender leaf ascent — paper leaves rising slowly through still air,
   each one a memory inscribed and released. The absent lover's name
   repeated on fragile sheets. Physics: buoyancy overcomes gravity,
   gentle thermal uplift, leaves tumble slowly as they climb.
   Felix Gonzalez-Torres: the work diminishes as viewers take pieces,
   here the leaves ascend and vanish into atmosphere. */

const BG = 0x0f0c0a;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.5, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2, 0);

// --- leaf system: each leaf is a paper rectangle rising ---
const MAX_LEAVES = 120;
const leaves = [];

class Leaf {
  constructor(x, y, z, size, seed) {
    this.x = x;
    this.y = y;
    this.z = z;
    this.size = size; // width/height of paper
    this.seed = seed;
    this.age = 0;
    
    // rotation (euler angles for tumbling)
    this.rx = Math.random() * Math.PI * 2;
    this.ry = Math.random() * Math.PI * 2;
    this.rz = Math.random() * Math.PI * 2;
    
    // rotation velocity (slow tumble)
    this.drx = (Math.random() - 0.5) * 0.008;
    this.dry = (Math.random() - 0.5) * 0.012;
    this.drz = (Math.random() - 0.5) * 0.006;
    
    // horizontal drift
    this.vx = (Math.random() - 0.5) * 0.003;
    this.vz = (Math.random() - 0.5) * 0.003;
    
    // upward velocity (buoyancy)
    this.vy = 0.008 + Math.random() * 0.004;
    
    // lifespan
    this.maxAge = 12 + Math.random() * 8;
  }
  
  update(dt) {
    this.age += dt;
    
    // ascend — gentle gravity-defying rise
    this.y += this.vy * dt * 60;
    
    // slow horizontal thermal drift
    this.x += this.vx * dt * 60;
    this.z += this.vz * dt * 60;
    
    // tumble rotation
    this.rx += this.drx * dt * 60;
    this.ry += this.dry * dt * 60;
    this.rz += this.drz * dt * 60;
    
    // slight velocity decay (air resistance)
    this.vy *= 0.998;
    this.vx *= 0.995;
    this.vz *= 0.995;
    
    return this.age < this.maxAge;
  }
}

// spawn leaves continuously from ground plane
function spawnLeaf() {
  if (leaves.length >= MAX_LEAVES) return;
  const x = (Math.random() - 0.5) * 8;
  const z = (Math.random() - 0.5) * 8;
  const size = 0.15 + Math.random() * 0.08;
  leaves.push(new Leaf(x, 0, z, size, Math.random()));
}

// initial spawn
for (let i = 0; i < 40; i++) {
  const x = (Math.random() - 0.5) * 7;
  const y = Math.random() * 6;
  const z = (Math.random() - 0.5) * 7;
  const size = 0.15 + Math.random() * 0.08;
  const leaf = new Leaf(x, y, z, size, Math.random());
  leaf.age = Math.random() * 3;
  leaves.push(leaf);
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

// --- render leaves as instanced quads ---
const leafGeom = new THREE.PlaneGeometry(1, 1.4);
const N_INST = MAX_LEAVES;

const dummy = new THREE.Object3D();
const leafMesh = new THREE.InstancedMesh(
  leafGeom,
  new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      fogColor: { value: new THREE.Color(BG) },
      fogNear: { value: 1 },
      fogFar: { value: 50 }
    },
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    vertexShader: `
      varying vec2 vUv;
      varying float vFogDepth;
      varying vec3 vWorldPos;
      
      #include <fog_pars_vertex>
      
      void main() {
        vUv = uv;
        vec4 worldPos = modelMatrix * instanceMatrix * vec4(position, 1.0);
        vWorldPos = worldPos.xyz;
        vec4 mvPos = viewMatrix * worldPos;
        vFogDepth = -mvPos.z;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      varying float vFogDepth;
      varying vec3 vWorldPos;
      
      #include <fog_pars_fragment>
      
      void main() {
        // paper texture — subtle noise + crease lines
        float noise = fract(sin(dot(vUv * 47.0, vec2(12.9898, 78.233))) * 43758.5453);
        noise = noise * 0.06 + 0.94;
        
        // crease lines (horizontal faint bands)
        float crease = step(0.92, fract(vUv.y * 12.0 + vWorldPos.y * 0.3));
        crease = crease * 0.15;
        
        // edge darkening
        vec2 edge = abs(vUv * 2.0 - 1.0);
        float border = smoothstep(0.85, 1.0, max(edge.x, edge.y));
        
        // warm paper base — aged cream to soft amber
        vec3 base = vec3(0.95, 0.92, 0.85);
        base = mix(base, vec3(0.98, 0.88, 0.72), vWorldPos.y * 0.04);
        
        vec3 col = base * noise;
        col = mix(col, col * 0.5, crease);
        col = mix(col, col * 0.7, border * 0.4);
        
        float alpha = 0.85 - border * 0.3;
        
        // fog
        #ifdef USE_FOG
          #ifdef FOG_EXP2
            float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
          #else
            float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
          #endif
          col = mix(col, fogColor, fogFactor);
          alpha *= (1.0 - fogFactor * 0.7);
        #endif
        
        gl_FragColor = vec4(col, alpha);
      }
    `,
    defines: {
      USE_FOG: '',
      FOG_EXP2: ''
    }
  }),
  N_INST
);
leafMesh.frustumCulled = false;
scene.add(leafMesh);

// --- particle system: each leaf trails soft motes ---
const N_PARTICLES = 40000;
const pPos = new Float32Array(N_PARTICLES * 3);
const pSeed = new Float32Array(N_PARTICLES);
const pAge = new Float32Array(N_PARTICLES);

for (let i = 0; i < N_PARTICLES; i++) {
  pSeed[i] = Math.random();
}

const pGeom = new THREE.BufferGeometry();
pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeom.setAttribute('seed', new THREE.BufferAttribute(pSeed, 1));
pGeom.setAttribute('age', new THREE.BufferAttribute(pAge, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec3 p = position;
      
      // gentle drift on particles
      float t = uTime * 0.4 + seed * 6.28;
      p.x += sin(t * 0.8) * 0.01;
      p.z += cos(t * 0.6) * 0.01;
      
      // warm palette — soft amber to pale cream
      vec3 amber = vec3(1.0, 0.78, 0.52);
      vec3 cream = vec3(1.0, 0.96, 0.88);
      float k = clamp(age * 0.5, 0.0, 1.0);
      vCol = mix(amber, cream, k);
      
      // fade with age
      vAlpha = (1.0 - age) * 0.4;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.2 * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float core = exp(-r * 20.0);
      float halo = exp(-r * 6.0) * 0.3;
      float a = (core + halo) * vAlpha;
      
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const pPoints = new THREE.Points(pGeom, pMat);
scene.add(pPoints);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();
let lastSpawn = 0;

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = 1 / 60;
  
  leafMesh.material.uniforms.uTime.value = t;
  pMat.uniforms.uTime.value = t;
  
  if (!paused) {
    // spawn new leaves every 0.8 seconds
    if (t - lastSpawn > 0.8) {
      spawnLeaf();
      lastSpawn = t;
    }
    
    // update leaves
    for (let i = leaves.length - 1; i >= 0; i--) {
      if (!leaves[i].update(dt)) {
        leaves.splice(i, 1);
      }
    }
    
    // update instanced mesh
    for (let i = 0; i < N_INST; i++) {
      if (i < leaves.length) {
        const L = leaves[i];
        dummy.position.set(L.x, L.y, L.z);
        dummy.rotation.set(L.rx, L.ry, L.rz);
        dummy.scale.setScalar(L.size);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(i, dummy.matrix);
        leafMesh.setColorAt(i, new THREE.Color(1, 1, 1).multiplyScalar(1 - L.age / L.maxAge * 0.3));
      } else {
        dummy.position.set(0, -1000, 0);
        dummy.scale.set(0, 0, 0);
        dummy.updateMatrix();
        leafMesh.setMatrixAt(i, dummy.matrix);
      }
    }
    leafMesh.instanceMatrix.needsUpdate = true;
    if (leafMesh.instanceColor) leafMesh.instanceColor.needsUpdate = true;
    
    // distribute particles across leaves
    let pi = 0;
    const ppLeaf = Math.floor(N_PARTICLES / Math.max(1, leaves.length));
    for (let i = 0; i < leaves.length && pi < N_PARTICLES; i++) {
      const L = leaves[i];
      const n = Math.min(ppLeaf, N_PARTICLES - pi);
      for (let k = 0; k < n; k++) {
        const u = Math.random() - 0.5;
        const v = Math.random() - 0.5;
        // particles cluster near leaf surface
        pPos[pi * 3]     = L.x + u * L.size * 1.1;
        pPos[pi * 3 + 1] = L.y + v * L.size * 1.5;
        pPos[pi * 3 + 2] = L.z + (Math.random() - 0.5) * L.size * 0.3;
        pAge[pi] = L.age / L.maxAge;
        pi++;
      }
    }
    pGeom.attributes.position.needsUpdate = true;
    pGeom.attributes.age.needsUpdate = true;
    
    // camera tracks rising centroid
    if (leaves.length > 0) {
      let cx = 0, cy = 0, cz = 0;
      for (const L of leaves) {
        cx += L.x; cy += L.y; cz += L.z;
      }
      cx /= leaves.length; cy /= leaves.length; cz /= leaves.length;
      controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
    }
  }
  
  statEl.textContent = `leaves=${leaves.length}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
