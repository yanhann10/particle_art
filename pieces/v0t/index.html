<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v0t · oil rivers (Tyler Hobbs)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1512; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">v0t</div>
<div class="hint">drag to orbit</div>
<div class="src">Tyler Hobbs · oil rivers · flow field partitioning</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Oil rivers — Tyler Hobbs direction.
   Domain is partitioned into 7 non-overlapping flow regions.
   Each region has its own color and hand-tuned flow law.
   Particles follow structured streamlines without crossing.
   Composition: significant negative space, earth palette,
   feel of an oil painting. */

const BG = 0x1a1512;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(BG, 8, 35);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 5, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// --- 7 flow regions, hand-placed for composition ---
// Each region: center, radius, color, flow law, density
const regions = [
  {
    cx: -3.2, cy: 1.8, r: 2.4,
    color: new THREE.Color(0.55, 0.32, 0.18), // raw umber
    flow: (x, y, t) => ({
      vx: Math.sin(y * 1.2 + t * 0.15) * 0.012,
      vy: -0.008 + Math.cos(x * 0.8) * 0.004
    }),
    density: 6500
  },
  {
    cx: 2.8, cy: 2.2, r: 2.0,
    color: new THREE.Color(0.72, 0.42, 0.28), // terracotta
    flow: (x, y, t) => ({
      vx: -0.006 + Math.sin(y * 1.8 + t * 0.18) * 0.008,
      vy: Math.cos(x * 1.5 + t * 0.1) * 0.009
    }),
    density: 5200
  },
  {
    cx: 0.5, cy: -1.5, r: 2.8,
    color: new THREE.Color(0.62, 0.48, 0.22), // ochre
    flow: (x, y, t) => {
      const d = Math.hypot(x - 0.5, y + 1.5);
      const a = Math.atan2(y + 1.5, x - 0.5) + t * 0.08;
      return { vx: Math.cos(a) * 0.01, vy: Math.sin(a) * 0.01 };
    },
    density: 7000
  },
  {
    cx: -2.5, cy: -2.0, r: 1.8,
    color: new THREE.Color(0.48, 0.22, 0.15), // oxide red dark
    flow: (x, y, t) => ({
      vx: 0.009,
      vy: Math.sin(x * 2.2 + t * 0.12) * 0.007
    }),
    density: 4500
  },
  {
    cx: 4.0, cy: -1.2, r: 1.6,
    color: new THREE.Color(0.68, 0.28, 0.18), // oxide red bright
    flow: (x, y, t) => ({
      vx: -Math.cos(y * 1.5 + t * 0.14) * 0.008,
      vy: -0.007
    }),
    density: 4000
  },
  {
    cx: -0.8, cy: 2.5, r: 1.5,
    color: new THREE.Color(0.32, 0.45, 0.52), // cool accent (slate blue)
    flow: (x, y, t) => {
      const a = Math.atan2(y - 2.5, x + 0.8) + Math.PI * 0.5;
      return { vx: Math.cos(a) * 0.008, vy: Math.sin(a) * 0.008 };
    },
    density: 3800
  },
  {
    cx: 3.2, cy: 0.2, r: 1.3,
    color: new THREE.Color(0.58, 0.38, 0.25), // mid-tone earth
    flow: (x, y, t) => ({
      vx: Math.sin(y * 2.5 + t * 0.2) * 0.01,
      vy: 0.006
    }),
    density: 3500
  }
];

// assign each particle to exactly one region
const N = 40000;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const col = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const regionIdx = new Uint8Array(N);

let idx = 0;
for (let ri = 0; ri < regions.length; ri++) {
  const reg = regions[ri];
  const count = Math.min(reg.density, N - idx);
  for (let i = 0; i < count; i++) {
    // spawn uniformly within disc
    const theta = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random()) * reg.r;
    pos[idx * 3]     = reg.cx + Math.cos(theta) * rr;
    pos[idx * 3 + 1] = reg.cy + Math.sin(theta) * rr;
    pos[idx * 3 + 2] = (Math.random() - 0.5) * 0.4; // thin Z spread
    vel[idx * 3] = vel[idx * 3 + 1] = vel[idx * 3 + 2] = 0;
    // vary color slightly per particle (oil-paint stroke variation)
    const vary = 0.08;
    col[idx * 3]     = Math.max(0, reg.color.r + (Math.random() - 0.5) * vary);
    col[idx * 3 + 1] = Math.max(0, reg.color.g + (Math.random() - 0.5) * vary);
    col[idx * 3 + 2] = Math.max(0, reg.color.b + (Math.random() - 0.5) * vary);
    seeds[idx] = Math.random();
    regionIdx[idx] = ri;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('color',    new THREE.BufferAttribute(col, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;
      
      // gentle drift in Z (out-of-plane brush texture)
      p.z += sin(uTime * 0.2 + seed * 6.28) * 0.02;

      vCol = color;
      // oil paint opacity: denser at center of strokes
      float coreAlpha = 0.75 + seed * 0.2;
      vAlpha = coreAlpha;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // larger points → painterly daub effect
      gl_PointSize = 2.8 * uPixel * (38.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // soft falloff — oil paint has soft edges
      float a = (1.0 - smoothstep(0.0, 0.25, r)) * vAlpha;

      gl_FragColor = vec4(vCol, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  mat.uniforms.uTime.value = t;

  // update positions via flow field
  for (let i = 0; i < N; i++) {
    const x = pos[i * 3], y = pos[i * 3 + 1];
    const ri = regionIdx[i];
    const reg = regions[ri];
    
    // compute flow
    const { vx, vy } = reg.flow(x, y, t);
    vel[i * 3]     = vx;
    vel[i * 3 + 1] = vy;
    vel[i * 3 + 2] = 0;

    // integrate
    pos[i * 3]     += vel[i * 3];
    pos[i * 3 + 1] += vel[i * 3 + 1];
    pos[i * 3 + 2] += vel[i * 3 + 2];

    // if particle leaves region disc, wrap to opposite edge
    const dx = pos[i * 3] - reg.cx;
    const dy = pos[i * 3 + 1] - reg.cy;
    const dist = Math.hypot(dx, dy);
    if (dist > reg.r) {
      const angle = Math.atan2(dy, dx) + Math.PI;
      pos[i * 3]     = reg.cx + Math.cos(angle) * reg.r * 0.95;
      pos[i * 3 + 1] = reg.cy + Math.sin(angle) * reg.r * 0.95;
    }
  }

  geom.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
