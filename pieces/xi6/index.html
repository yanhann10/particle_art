<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&lt;NEW_ID&gt; · stratigraphic core · dark ecology</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080605; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .counter { position:fixed; right:14px; bottom:14px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
             color:#7a7870; opacity:0.55; font-size:10px; letter-spacing:0.03em;
             text-align:right; line-height:1.7; pointer-events:none; }
  .hint { position:fixed; left:14px; top:14px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
          color:#7a7870; opacity:0.35; font-size:10px; }
</style>
</head>
<body>
<div class="id">&lt;NEW_ID&gt;</div>
<div class="counter" id="ctr"></div>
<div class="hint">drag to orbit · click to pause/resume</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════
   Timothy Morton · Dark Ecology
   A stratigraphic core of deep time.  The differential-growth
   ring from t9w becomes a vascular column whose colour, girth,
   and scars encode 4 500 million years.  Mass-extinction events
   neck the form; CO₂ swells it.  The viewer watches what they
   cannot hold.
   ═══════════════════════════════════════════════════════════════ */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080605, 0.028);
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 250);
camera.position.set(7, 7, 13);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080605, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xeee4d8, 0.7);
lightKey.position.set(4, 12, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x1c1410, 0.5));
const lightRim = new THREE.DirectionalLight(0x667788, 0.3);
lightRim.position.set(-4, 2, -6);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 5, 0);

/* ──── geological time helpers ──── */
// heightFrac 0 = bottom (4500 Mya), 1 = present, >1 = projected future
function geoMya(hf){ return Math.max(0, 4500*(1-Math.min(hf,1))); }
function eraName(mya){
  if(mya>4000) return 'Hadean';   if(mya>2500) return 'Archean';
  if(mya>541)  return 'Proterozoic'; if(mya>485) return 'Cambrian';
  if(mya>444)  return 'Ordovician';  if(mya>419) return 'Silurian';
  if(mya>359)  return 'Devonian';    if(mya>299) return 'Carboniferous';
  if(mya>252)  return 'Permian';     if(mya>201) return 'Triassic';
  if(mya>145)  return 'Jurassic';    if(mya>66)  return 'Cretaceous';
  if(mya>23)   return 'Paleogene';   if(mya>2.6) return 'Neogene';
  if(mya>0.012)return 'Pleistocene'; return 'Anthropocene';
}

// muted earth → dead grey palette
function eraColor(hf){
  const S=[
    {t:0.00,r:0.055,g:0.035,b:0.025},  // Hadean: volcanic dark
    {t:0.11,r:0.065,g:0.075,b:0.050},  // Archean: green-black
    {t:0.33,r:0.155,g:0.095,b:0.060},  // early Proterozoic: iron oxide
    {t:0.55,r:0.105,g:0.085,b:0.065},  // Snowball Earth: dark
    {t:0.88,r:0.130,g:0.145,b:0.095},  // Paleozoic: muted green
    {t:0.935,r:0.175,g:0.155,b:0.110}, // Mesozoic: warm earth
    {t:0.985,r:0.195,g:0.185,b:0.175}, // Cenozoic: cooling
    {t:1.00,r:0.260,g:0.255,b:0.250},  // present: ash
    {t:1.25,r:0.340,g:0.330,b:0.320},  // projected future: dead grey
  ];
  let i=0;
  while(i<S.length-2 && S[i+1].t<hf) i++;
  const a=S[i], b=S[i+1];
  const f=Math.max(0,Math.min(1,(hf-a.t)/(b.t-a.t)));
  return { r:a.r+(b.r-a.r)*f, g:a.g+(b.g-a.g)*f, b:a.b+(b.b-a.b)*f };
}

// simplified CO₂ curve → radius multiplier
function co2Mult(hf){
  let v=1.0;
  v+=0.25*Math.exp(-(hf*hf)/0.03);
  v-=0.18*Math.exp(-((hf-0.50)**2)/0.012);
  v+=0.12*Math.exp(-((hf-0.89)**2)/0.003);
  v-=0.18*Math.exp(-((hf-0.93)**2)/0.003);
  v+=0.14*Math.exp(-((hf-0.96)**2)/0.004);
  v+=0.30*Math.exp(-((hf-1.005)**2)/0.00015);
  return Math.max(0.55,v);
}

// Big Five extinction scars → radius reduction
const EXTINCTIONS=[
  {t:0.901,w:0.007,d:0.40,mya:444,name:'Ordovician–Silurian',pct:86},
  {t:0.917,w:0.007,d:0.32,mya:372,name:'Late Devonian',pct:75},
  {t:0.944,w:0.010,d:0.65,mya:252,name:'Permian–Triassic',pct:96},
  {t:0.955,w:0.007,d:0.38,mya:201,name:'Triassic–Jurassic',pct:80},
  {t:0.985,w:0.007,d:0.38,mya:66, name:'Cretaceous–Paleogene',pct:76},
];
function extinctionScar(hf){
  let scar=0;
  for(const e of EXTINCTIONS){
    const d=Math.abs(hf-e.t);
    if(d<e.w) scar=Math.max(scar, e.d*(1-d/e.w));
  }
  return 1-scar;
}

/* ──── differential growth (inherited from t9w / 5gm) ──── */
const MAX_VERTS=1500, ATTRACT=0.055, REPEL_R=0.50, REPEL_STR=0.12;
const NOISE=0.0025, PRESSURE=0.0024, RISE=0.004, MAX_D=0.40;

const verts=[];
for(let i=0;i<16;i++){
  const th=i/16*Math.PI*2, r=1.3+(Math.random()-0.5)*0.1;
  verts.push({x:Math.cos(th)*r, y:0, z:Math.sin(th)*r, age:0});
}

const CELL=REPEL_R, grid=new Map();
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i];
    const k=Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if(!grid.has(k))grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr)for(const idx of arr)out.push(idx);
  }
  return out;
}

let paused=false;
function step(){
  if(paused)return;
  const n=verts.length;
  if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of neighbors(v)){
      if(j===i)continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x; cy2+=verts[i].y; cz2+=verts[i].z;}
  cx2/=n; cy2/=n; cz2/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;
    dy[i]+=(oy/d)*PRESSURE*0.35;
    dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.04, z:(a.z+b.z)*0.5,
                  age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown)verts.push(v);
}
for(let s=0;s<600;s++)step();
addEventListener('click',()=>{paused=!paused;});

/* ──── atmospheric sediment particles ──── */
const DUST_N=280;
const dustGeo=new THREE.BufferGeometry();
const dustPos=new Float32Array(DUST_N*3);
const dustVel=new Float32Array(DUST_N);
for(let i=0;i<DUST_N;i++){
  dustPos[i*3]  =(Math.random()-0.5)*20;
  dustPos[i*3+1]=Math.random()*25;
  dustPos[i*3+2]=(Math.random()-0.5)*20;
  dustVel[i]=0.002+Math.random()*0.004;
}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
const dustMat=new THREE.PointsMaterial({color:0x998877,size:0.06,transparent:true,opacity:0.12,
                                        depthWrite:false,sizeAttenuation:true});
const dustPts=new THREE.Points(dustGeo,dustMat);
scene.add(dustPts);

function updateDust(){
  const p=dustGeo.attributes.position.array;
  for(let i=0;i<DUST_N;i++){
    p[i*3+1]-=dustVel[i];
    if(p[i*3+1]<-1){
      p[i*3]=(Math.random()-0.5)*20;
      p[i*3+1]=22+Math.random()*4;
      p[i*3+2]=(Math.random()-0.5)*20;
    }
  }
  dustGeo.attributes.position.needsUpdate=true;
}

/* ──── stratigraphic tube renderer ──── */
let tubeMesh=null;
const tubeMat=new THREE.MeshStandardMaterial({
  vertexColors:true,
  roughness:0.65,
  metalness:0.03,
  emissive:new THREE.Color(0x0a0504),
});

function buildTube(t){
  if(verts.length<10)return;
  let yMin=Infinity, yMax=-Infinity;
  for(const v of verts){if(v.y<yMin)yMin=v.y; if(v.y>yMax)yMax=v.y;}
  const yRange=Math.max(yMax-yMin,0.1);

  const pts=verts.map(v=>new THREE.Vector3(v.x,v.y,v.z));
  const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',0.5);

  const NS=Math.min(700,verts.length*2);
  const RAD=8;
  const positions=new Float32Array(NS*RAD*3);
  const colors=new Float32Array(NS*RAD*3);
  const indices=[];
  const up=new THREE.Vector3(0,1,0);

  // very slow, deep pulse — tectonic breathing, not heartbeat
  const pulse=1.0+0.035*Math.sin(t*0.3);

  for(let i=0;i<NS;i++){
    const tt=i/NS;
    const p=curve.getPointAt(tt);
    const hf=(p.y-yMin)/yRange;  // 0=base, 1=tip

    // base radius tapers toward tip, modulated by CO₂ and extinction scars
    let r=0.38*(1-hf*0.72);
    r*=co2Mult(hf);
    r*=extinctionScar(hf);
    // vessel nodes
    r*=(1.0+0.12*Math.pow(Math.sin(tt*20)*0.5+0.5,6));
    r*=pulse;

    const col=eraColor(hf);

    const tangent=curve.getTangentAt(tt).normalize();
    const normal=new THREE.Vector3().crossVectors(tangent,up).normalize();
    if(normal.lengthSq()<0.001)normal.set(1,0,0);
    const binormal=new THREE.Vector3().crossVectors(tangent,normal).normalize();

    for(let j=0;j<RAD;j++){
      const ang=(j/RAD)*Math.PI*2;
      const vx=p.x+normal.x*Math.cos(ang)*r+binormal.x*Math.sin(ang)*r;
      const vy=p.y+normal.y*Math.cos(ang)*r+binormal.y*Math.sin(ang)*r;
      const vz=p.z+normal.z*Math.cos(ang)*r+binormal.z*Math.sin(ang)*r;
      const idx=(i*RAD+j)*3;
      positions[idx]=vx; positions[idx+1]=vy; positions[idx+2]=vz;
      colors[idx]=col.r; colors[idx+1]=col.g; colors[idx+2]=col.b;
    }
  }
  for(let i=0;i<NS;i++){
    const ni=(i+1)%NS;
    for(let j=0;j<RAD;j++){
      const nj=(j+1)%RAD;
      const a=i*RAD+j, b=i*RAD+nj, c=ni*RAD+j, d=ni*RAD+nj;
      indices.push(a,b,c, b,d,c);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(positions,3));
  g.setAttribute('color',new THREE.BufferAttribute(colors,3));
  g.setIndex(indices);
  g.computeVertexNormals();

  if(tubeMesh){scene.remove(tubeMesh); tubeMesh.geometry.dispose();}
  tubeMesh=new THREE.Mesh(g,tubeMat);
  scene.add(tubeMesh);
}

/* ──── counter DOM ──── */
const ctrEl=document.getElementById('ctr');
let extinctionsPassed=0, cumulativeLoss=0;
function updateCounter(){
  if(verts.length<10)return;
  let yMin=Infinity, yMax=-Infinity;
  for(const v of verts){if(v.y<yMin)yMin=v.y; if(v.y>yMax)yMax=v.y;}
  const yRange=Math.max(yMax-yMin,0.1);
  // tip = highest vertex
  const tipHf=(yMax-yMin)/yRange;  // always 1, but the mapped Mya changes as structure grows
  // use a time-based geological clock: structure age maps to deep time
  const structureAge=verts.reduce((s,v)=>s+v.age,0)/verts.length;
  // map structure age (roughly 0→1.5) to geological time
  const geoProgress=Math.min(1.05, structureAge/1.2);
  const mya=geoMya(geoProgress);
  const era=eraName(mya);

  extinctionsPassed=0; cumulativeLoss=0;
  for(const e of EXTINCTIONS){
    if(geoProgress>=e.t){
      extinctionsPassed++;
      cumulativeLoss=Math.min(99, cumulativeLoss+e.pct*0.18);
    }
  }

  const myaStr=mya>1? Math.round(mya).toLocaleString()+' Mya' : mya>0.012? Math.round(mya*1000)+' Ka' : 'now';
  ctrEl.innerHTML=
    `${era} · ${myaStr}<br>`+
    `extinctions witnessed: ${extinctionsPassed}/5<br>`+
    `cumulative loss: ${Math.round(cumulativeLoss)}% of species<br>`+
    `<span style="opacity:0.4">${verts.length} vertices · deep time</span>`;
}

/* ──── resize ──── */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ──── main loop ──── */
const t0=performance.now();
let frameCount=0;
function loop(){
  const t=(performance.now()-t0)/1000;
  for(let s=0;s<2;s++)step();
  buildTube(t);
  updateDust();

  // camera tracks centroid, slow and heavy
  let yMean=0; for(const v of verts) yMean+=v.y;
  yMean/=Math.max(verts.length,1);
  const targetY=Math.max(yMean,2.0);
  controls.target.y+=(targetY-controls.target.y)*0.025;
  camera.position.y+=(targetY+3.5-camera.position.y)*0.025;

  controls.update();
  renderer.render(scene,camera);

  frameCount++;
  if(frameCount%30===0)updateCounter();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
