<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c9n · petrichor</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #f4eedb 0%, #e2d4b2 38%, #ad9568 78%, #5c4226 100%),
      #5c4226;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.10  0 0 0 0 0.06  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(225,222,205,0.28), rgba(225,222,205,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color:#2a1a08; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">c9n</div>
<div class="hint">click to regrow · what the earth exhales after rain</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: The same Riley-interference calyx, now catching invisible rain.
// Particles at the bowl's center rise as scent molecules — geosmin, petrichor —
// lifting in slow wisps from the heart of the form, then settling.
// A flower remembering water. The viewer should see: exhaling earth.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.5, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const radials = new Float32Array(N); // 0=center, 1=edge

let regrowSeed = Math.random() * 1e9;
function buildField(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w2 = { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 };
  const w3 = { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0;
  let attempts = 0;
  while (written < N && attempts < N * 16){
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
    const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
    const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.10);
    const accept = (f > 0) && (rng() < fall * (0.4 + 0.6 * f));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
    const y = -0.15 * r * r + scallop;
    positions[written*3]     = x;
    positions[written*3 + 1] = y;
    positions[written*3 + 2] = z;
    seeds[written] = rng();
    radials[written] = r / 4.0;
    written++;
  }
  for (let i = written; i < N; i++){
    positions[i*3] = 0; positions[i*3+1] = -2; positions[i*3+2] = 0;
    seeds[i] = 0; radials[i] = 1.0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('radial',   new THREE.BufferAttribute(radials, 1));

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uPointer:   { value: new THREE.Vector2(0, 0) },
  uPetrichor: { value: 0.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uPetrichor;
    attribute float seed;
    attribute float radial;
    varying float vDepth;
    varying float vSeed;
    varying float vRise;
    void main(){
      vec3 p = position;

      // petrichor release: center particles rise first, wave spreads outward
      float riseThreshold = uPetrichor * 1.5 - radial;
      float particleRise = smoothstep(0.0, 0.5, riseThreshold);
      particleRise *= (0.7 + 0.3 * seed);
      vRise = particleRise;

      // rise motion: upward with gentle sinusoidal shimmer (heat-haze / scent wisp)
      float riseY = particleRise * (2.2 + seed * 1.4);
      float shimmerPhase = uTime * 0.35 + seed * 18.0;
      float riseDriftX = particleRise * sin(shimmerPhase) * 0.25;
      float riseDriftZ = particleRise * cos(shimmerPhase * 0.8 + 2.0) * 0.18;
      p.y += riseY;
      p.x += riseDriftX;
      p.z += riseDriftZ;

      // pointer tilt
      float tiltX = uPointer.y * 0.22;
      float tiltZ = -uPointer.x * 0.22;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);

      // breath — suppressed during rise
      float t = uTime * 0.20 + seed * 6.28;
      q.y += 0.025 * sin(t) * (1.0 - vRise);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      gl_PointSize = (1.4 + 0.7 * sin(t * 0.6)) * uPixel * (5.0 / vDepth);
      // rising particles shrink as they disperse into air
      gl_PointSize *= (1.0 - vRise * 0.4);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vRise;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);

      // dry earth ink tones
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.28, 0.17, 0.08);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));

      // rising particles shift to wet-earth violet-grey (geosmin color)
      vec3 wetCol = vec3(0.16, 0.13, 0.20);
      col = mix(col, wetCol, vRise * 0.65);

      // depth haze
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      vec3 hazeCol = vec3(0.80, 0.75, 0.62);
      col = mix(col, hazeCol, haze);

      // rising particles become translucent — scent dissipating
      float finalAlpha = a * 0.78 * (1.0 - haze * 0.6) * (1.0 - vRise * 0.38);
      gl_FragColor = vec4(col, finalAlpha);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── DUST MOTES — drift lazily when dry, rise gently during petrichor release
const N_DUST = 280;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 14;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 10;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uPetrichor: uniforms.uPetrichor },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPetrichor;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;

      // during petrichor motes drift upward (scent rising); otherwise gentle fall
      float rate = mix(0.06, -0.12, uPetrichor);
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * rate + seed * 7.0, 5.0) - 2.5;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;

      float sx = -p.x / 7.0;
      float sy =  p.y / 5.0;
      vGlow = clamp(0.25 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vGlow = mix(vGlow, vGlow * 1.25, uPetrichor * 0.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.3 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(0.94, 0.88, 0.74) * vGlow;
      gl_FragColor = vec4(col, a * 0.62 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ── Interaction
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.radial.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Petrichor cycle
// Long dry calm, then rain arrives, scent releases center-outward, settles.
// 22s cycle — geosmin waits in soil, water frees it, earth exhales.
function petrichorEnvelope(t){
  const cycle = 22.0;
  const phase = ((t + 5.0) % cycle) / cycle;
  if (phase < 0.50) return 0.0;
  if (phase < 0.65) return smooth(0.50, 0.65, phase);
  if (phase < 0.78) return 1.0;
  return 1.0 - smooth(0.78, 1.0, phase);
}

function smooth(a, b, x){ const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); }

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  const pet = petrichorEnvelope(t);
  uniforms.uPetrichor.value = pet;

  // gentle camera drift — rises slightly during release to follow the scent
  camera.position.x = Math.sin(t * 0.04) * 0.35;
  camera.position.y = 0.3 + Math.sin(t * 0.035 + 1.0) * 0.2 + pet * 0.45;
  camera.lookAt(0, pet * 0.35, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
