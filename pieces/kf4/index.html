<div class="id">kf4 · threads of remembered flight</div>
<div class="hint">no input — the flock leaves only its memory, woven in red thread</div>
<div class="src">descended from sav · Chiharu Shiota thread-web monochrome</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Mutation directive: channel Chiharu Shiota's thread-installation aesthetic.
// The flock from sav is gone; what remains is a RED THREAD WEB mapping the
// trajectories the birds TOOK through space. Each thread connects two anchor
// points — not the current particle positions but the memory-trace of where
// they were. 15,000 thread segments. Sparse Erdős-Rényi random graph.
// Monochrome crimson #9c1f1f on near-black. LineBasicMaterial with opacity 0.08,
// additive blending. The whole field reads as volume — emotion mapped as
// infrastructure. Shiota's work suspends dense thread-mass in architectural
// voids; here we add extra negative space at the top and let threads pool
// toward the bottom (anchor y-positions weighted downward). Subtle sway from
// an invisible wind-vector so the network breathes without dissolving into
// noise.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0e, 0.011);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 240);
camera.position.set(0, 3, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e);
document.body.appendChild(renderer.domElement);

// ────────────── generate anchor field
// We want 15,000 thread segments. Each segment connects two anchors.
// Total anchors needed: we'll create a pool of N anchors and randomly pair them.
// To ensure connectivity and avoid isolated clumps, we'll use ~2000 anchors
// and build a sparse random graph with avg degree ~15 edges/node.
const N_ANCHORS = 2000;
const N_THREADS = 15000;
const anchors = new Float32Array(N_ANCHORS * 3);

// Spatial distribution: the original flock occupied a ~8-unit radius volume.
// We'll place anchors in a similar region but with y-bias downward (threads
// pooling at bottom as Shiota's installations do — the mass hangs).
for (let i = 0; i < N_ANCHORS; i++){
  const r = 1.2 + Math.pow(Math.random(), 0.8) * 10.0;
  const th = Math.random() * Math.PI * 2;
  const ph = (Math.random() - 0.3) * Math.PI * 0.7;  // bias toward -y
  anchors[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  anchors[i*3 + 1] = Math.sin(ph) * r - 2.5;  // shift down
  anchors[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
}

// ────────────── build thread segments (Erdős-Rényi random graph)
const threadPairs = [];
const MAX_DIST = 9.5;  // only connect anchors within this distance
for (let t = 0; t < N_THREADS; t++){
  let attempts = 0;
  while (attempts < 50){
    const a = Math.floor(Math.random() * N_ANCHORS);
    const b = Math.floor(Math.random() * N_ANCHORS);
    if (a === b){ attempts++; continue; }
    const dx = anchors[a*3]   - anchors[b*3];
    const dy = anchors[a*3+1] - anchors[b*3+1];
    const dz = anchors[a*3+2] - anchors[b*3+2];
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (d < MAX_DIST){
      threadPairs.push(a, b);
      break;
    }
    attempts++;
  }
  if (attempts >= 50){
    // fallback: pick two random anchors and accept distance
    const a = Math.floor(Math.random() * N_ANCHORS);
    let b = Math.floor(Math.random() * N_ANCHORS);
    while (b === a) b = Math.floor(Math.random() * N_ANCHORS);
    threadPairs.push(a, b);
  }
}

// ────────────── construct LineSegments geometry
const positions = new Float32Array(threadPairs.length * 3);
for (let i = 0; i < threadPairs.length; i++){
  const idx = threadPairs[i];
  positions[i*3]     = anchors[idx*3];
  positions[i*3 + 1] = anchors[idx*3 + 1];
  positions[i*3 + 2] = anchors[idx*3 + 2];
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Shiota signature: crimson red (or white on black, or black on white) — we choose crimson
const mat = new THREE.LineBasicMaterial({
  color: 0x9c1f1f,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const web = new THREE.LineSegments(geom, mat);
scene.add(web);

// ────────────── subtle wind sway
// Each anchor drifts slightly under a time-varying wind vector. We'll modulate
// the anchor positions sinusoidally with per-anchor phase offsets so the whole
// field breathes without losing legibility.
const anchorPhase = new Float32Array(N_ANCHORS);
for (let i = 0; i < N_ANCHORS; i++){
  anchorPhase[i] = Math.random() * Math.PI * 2;
}

function applyWind(t){
  const windX = Math.sin(t * 0.15) * 0.25;
  const windY = Math.cos(t * 0.10) * 0.18;
  const windZ = Math.sin(t * 0.12 + 1.0) * 0.22;
  for (let i = 0; i < N_ANCHORS; i++){
    const phase = anchorPhase[i];
    const strength = 0.5 + 0.5 * Math.sin(t * 0.08 + phase);
    const dx = windX * strength;
    const dy = windY * strength;
    const dz = windZ * strength;
    // rebuild segment positions from swayed anchors
    anchors[i*3]     += dx * 0.02;
    anchors[i*3 + 1] += dy * 0.02;
    anchors[i*3 + 2] += dz * 0.02;
  }
  // update geometry
  for (let i = 0; i < threadPairs.length; i++){
    const idx = threadPairs[i];
    positions[i*3]     = anchors[idx*3];
    positions[i*3 + 1] = anchors[idx*3 + 1];
    positions[i*3 + 2] = anchors[idx*3 + 2];
  }
  geom.attributes.position.needsUpdate = true;
}

// ────────────── camera framing
// Architectural negative space: camera elevated slightly, looking down-forward
// so the thread-mass pools below the horizon. Extra negative space at top.
camera.position.set(0, 4.5, 28);
camera.lookAt(0, -1, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ────────────── animation loop
let t0 = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - t0) / 1000;
  applyWind(t);
  // slow auto-orbit around y-axis
  const ang = t * 0.035;
  const rad = 28;
  camera.position.x = Math.sin(ang) * rad;
  camera.position.z = Math.cos(ang) * rad;
  camera.lookAt(0, -1, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
