<!doctype html>
<html lang="en">
<head>
<!-- MOTION: propagate, intensity: calm -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6dp · mycelial network</title>
<!-- Palette rationale: warm amber-white hyphae (#e8d8b0) on dark earth (#0a0804) —
     the soil color under a forest floor; hyphae glow slightly warmer than ambient,
     like phosphorescent wood-decay fungi; spore clusters pulse with soft cream light. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0804; overflow:hidden;
               color:#c8b890; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">6dp · mycelial network</div>
<div class="hint">top-down view · slow zoom out as network expands</div>
<div class="src">descended from 5gm · horizontal mycorrhizal spread · self-avoiding tips</div>
<div class="stat" id="stat">nodes=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// MYCELIAL NETWORK
// Horizontal mycorrhizal spread from center on the ground plane.
// Algorithm: tips advance 0.05 units/tick, fork probability 0.25 when space available.
// Hyphae: very thin TubeGeometry (r=0.006). Spore clusters at fork nodes.
// Camera: top-down orthographic, slow zoom out as network expands.
// Stops growing at radius 6.

const STEP      = 0.07;
const FORK_P    = 0.30;
const REPEL_R   = 0.35;
const MAX_R     = 6.0;
const TUBE_R    = 0.018;
const MAX_TIPS  = 300;

// ── Orthographic camera — top-down view
const frustumSize = 4; // initial view
const aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -frustumSize * aspect, frustumSize * aspect,
   frustumSize, -frustumSize,
   0.1, 100
);
camera.position.set(0, 15, 0);
camera.lookAt(0, 0, 0);
camera.up.set(0, 0, -1); // forward is -Z in top-down

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0804, 1);
document.body.appendChild(renderer.domElement);

// Lighting for the ground-plane network — strong to show thin hyphae
scene.add(new THREE.AmbientLight(0x2a1e10, 1.4));
const topLight = new THREE.DirectionalLight(0xf0d890, 1.2);
topLight.position.set(0, 15, 0);
scene.add(topLight);
const sideLight = new THREE.DirectionalLight(0xe09040, 0.6);
sideLight.position.set(4, 5, 2);
scene.add(sideLight);

// ── Spatial hash
class SpatialHash {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  _key(x,z) {
    return `${Math.floor(x/this.cell)},${Math.floor(z/this.cell)}`;
  }
  add(x,z) {
    const k = this._key(x,z);
    if (!this.map.has(k)) this.map.set(k,[]);
    this.map.get(k).push({x,z});
  }
  neighbors(x,z,r) {
    const out=[];
    const s=Math.ceil(r/this.cell);
    for(let dx=-s;dx<=s;dx++)
    for(let dz=-s;dz<=s;dz++){
      const pts=this.map.get(`${Math.floor(x/this.cell)+dx},${Math.floor(z/this.cell)+dz}`);
      if(pts) out.push(...pts);
    }
    return out;
  }
}
const sh = new SpatialHash(REPEL_R * 0.6);

// ── Hypha tip state
const tips = [];
// Each tip: { pts: Vec2[], dir: Vec2, alive: bool, mesh: null }

function addTip(x, z, dx, dz) {
  if (tips.length >= MAX_TIPS) return;
  tips.push({
    pts: [{x,z}],
    dir: {x: dx, z: dz},
    alive: true,
    mesh: null,
    segCount: 0,
  });
  sh.add(x, z);
}

// Seed at center
addTip(0, 0, 1, 0);
addTip(0, 0, -1, 0);
addTip(0, 0, 0, 1);
addTip(0, 0, 0, -1);

// Materials
const hyphaMat = new THREE.MeshStandardMaterial({
  color: 0xe8d8b0,
  emissive: 0x504020,
  emissiveIntensity: 0.4,
  roughness: 0.5,
  metalness: 0.0,
});
const sporeMat = new THREE.MeshStandardMaterial({
  color: 0xf8ecd8,
  roughness: 0.3,
  emissive: 0xd8b870,
  emissiveIntensity: 0.25,
});

const meshGroup = new THREE.Group();
scene.add(meshGroup);

let totalNodes = 0;
let growing = true;
let maxReachedR = 0;

function growStep() {
  if (!growing) return;
  let anyAlive = false;

  for (let i = 0; i < tips.length; i++) {
    const t = tips[i];
    if (!t.alive) continue;
    const last = t.pts[t.pts.length - 1];

    // Stop if at max radius
    if (Math.sqrt(last.x*last.x + last.z*last.z) >= MAX_R) {
      t.alive = false; continue;
    }
    anyAlive = true;

    // Noise on direction
    const angle = Math.atan2(t.dir.z, t.dir.x) + (Math.random()-0.5)*0.5;
    let dx = Math.cos(angle);
    let dz = Math.sin(angle);

    // Self-avoidance
    const neighbors = sh.neighbors(last.x, last.z, REPEL_R);
    let rx = 0, rz = 0;
    for (const q of neighbors) {
      const dd = Math.sqrt((last.x-q.x)**2 + (last.z-q.z)**2);
      if (dd < REPEL_R && dd > 0.001) {
        rx += (last.x-q.x)/dd * (1-dd/REPEL_R);
        rz += (last.z-q.z)/dd * (1-dd/REPEL_R);
      }
    }
    const rlen = Math.sqrt(rx*rx+rz*rz);
    if (rlen > 0) { dx += rx/rlen*0.3; dz += rz/rlen*0.3; }
    const dlen = Math.sqrt(dx*dx+dz*dz);
    dx /= dlen; dz /= dlen;

    const nx = last.x + dx * STEP;
    const nz = last.z + dz * STEP;

    // Check for blocking proximity
    const newNeighbors = sh.neighbors(nx, nz, TUBE_R * 4);
    let blocked = false;
    for (const q of newNeighbors) {
      if (Math.sqrt((nx-q.x)**2+(nz-q.z)**2) < TUBE_R * 3) { blocked = true; break; }
    }
    if (blocked) { t.alive = false; continue; }

    t.pts.push({x:nx, z:nz});
    t.dir = {x:dx, z:dz};
    sh.add(nx, nz);
    totalNodes++;
    t.segCount++;
    maxReachedR = Math.max(maxReachedR, Math.sqrt(nx*nx+nz*nz));

    // Forking
    if (t.segCount > 5 && Math.random() < FORK_P) {
      const nq = sh.neighbors(nx, nz, REPEL_R * 1.2);
      if (nq.length < 4) {
        // Fork at angle offset
        const forkAngle = angle + (Math.random() > 0.5 ? 0.6 : -0.6) + (Math.random()-0.5)*0.3;
        addTip(nx, nz, Math.cos(forkAngle), Math.sin(forkAngle));

        // Add spore cluster at fork node
        const sporeGeo = new THREE.IcosahedronGeometry(0.1, 0);
        const spore = new THREE.Mesh(sporeGeo, sporeMat);
        spore.position.set(nx, 0, nz);
        spore.rotation.set(Math.random(), Math.random(), Math.random());
        meshGroup.add(spore);
      }
    }

    // Rebuild mesh periodically
    if (t.pts.length >= 3 && t.pts.length % 4 === 0) {
      rebuildHyphaMesh(t);
    }
  }

  if (!anyAlive) { growing = false; rebuildAll(); }
  document.getElementById('stat').textContent = `nodes=${totalNodes}`;
}

function rebuildHyphaMesh(t) {
  if (t.pts.length < 2) return;
  if (t.mesh) {
    meshGroup.remove(t.mesh);
    t.mesh.geometry.dispose();
    t.mesh = null;
  }
  const pts3 = t.pts.map(p => new THREE.Vector3(p.x, 0, p.z));
  const curve = new THREE.CatmullRomCurve3(pts3);
  const segs = Math.min(t.pts.length * 2, 60);
  try {
    const geo = new THREE.TubeGeometry(curve, segs, TUBE_R, 4, false);
    t.mesh = new THREE.Mesh(geo, hyphaMat);
    meshGroup.add(t.mesh);
  } catch(e) {}
}

function rebuildAll() {
  for (const t of tips) rebuildHyphaMesh(t);
}

// ── Camera zoom out as network expands
let time = 0;
const initialFrustum = frustumSize;

window.addEventListener('resize', () => {
  const asp = innerWidth/innerHeight;
  const f = camera.top; // current frustum
  camera.left = -f * asp;
  camera.right = f * asp;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let paused = false;
renderer.domElement.addEventListener('click', () => { paused = !paused; });

function animate(ts) {
  requestAnimationFrame(animate);
  if (paused) return;
  time = ts * 0.001;

  // Grow 20 steps per frame for dense visible network
  if (growing) {
    for (let i = 0; i < 20; i++) growStep();
  }

  // Slowly zoom out orthographic camera as network expands
  const targetFrustum = Math.max(initialFrustum, maxReachedR * 1.3);
  const asp = innerWidth / innerHeight;
  // Lerp frustum toward target
  const curFrustum = camera.top;
  const newFrustum = curFrustum + (targetFrustum - curFrustum) * 0.01;
  camera.top    =  newFrustum;
  camera.bottom = -newFrustum;
  camera.left   = -newFrustum * asp;
  camera.right  =  newFrustum * asp;
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);
}
animate(0);
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
