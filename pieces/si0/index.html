<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>si0 · haunted cell (Bourgeois)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0808; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">si0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Louise Bourgeois: haunted cell
// Her spider Maman: protective, containing, charged with memory.
// The cell structures: enclosed psychological space, fabric, bronze, trauma.
// Here: differential growth becomes a membrane that encloses, trembles, breathes.
// The form is an organic cell-cage that slowly contracts and expands like a lung,
// haunted by its own rhythm. Particles cling to the membrane, quivering.
// Palette: bruise colors — old blood, bone, graphite shadow.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0808, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.03;
controls.target.set(0, 0, 0);

// differential growth parameters — tuned for enclosed, trembling form
const MAX_VERTS = 3200;
const ATTRACT  = 0.075;
const REPEL_R  = 0.38;
const REPEL_STR= 0.09;
const NOISE    = 0.0015;
const PRESSURE = 0.0018;  // gentler — form should feel trapped, not expanding
const MAX_D    = 0.28;
const BREATHE_AMPLITUDE = 0.12;  // pulsation strength
const BREATHE_FREQ = 0.35;       // slow breathing cycle

// start with a flattened ellipsoid — already cell-like
const verts = [];
const NV0 = 32;
for (let i = 0; i < NV0; i++){
  for (let j = 0; j < 8; j++){
    const theta = i / NV0 * Math.PI * 2;
    const phi   = (j / 8 - 0.5) * Math.PI;
    const rx = 2.2, ry = 1.4, rz = 2.2;  // flattened sphere
    const x = rx * Math.cos(phi) * Math.cos(theta);
    const y = ry * Math.sin(phi);
    const z = rz * Math.cos(phi) * Math.sin(theta);
    verts.push({ x, y, z, age: 0, tension: Math.random() });
  }
}

// spatial hash (3D now)
const CELL = REPEL_R;
const grid = new Map();
function key(x, y, z){
  return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL);
}
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i], k = key(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(breathePhase){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dy = new Float32Array(n);
  const dz = new Float32Array(n);

  // repulsion
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }
  
  // attraction toward local neighbors (k-nearest approximation via hash)
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v).slice(0, 6);  // limit to ~6 nearest
    let ax=0, ay=0, az=0, count=0;
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      ax += u.x; ay += u.y; az += u.z; count++;
    }
    if (count > 0){
      ax /= count; ay /= count; az /= count;
      dx[i] += (ax - v.x) * ATTRACT;
      dy[i] += (ay - v.y) * ATTRACT;
      dz[i] += (az - v.z) * ATTRACT;
    }
  }

  // pressure — radial, but modulated by breathing
  let cx=0, cy=0, cz=0;
  for (let i=0; i<n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx/=n; cy/=n; cz/=n;
  const breathe = Math.sin(breathePhase) * BREATHE_AMPLITUDE;
  for (let i=0; i<n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.sqrt(ox*ox + oy*oy + oz*oz) + 1e-6;
    const push = (PRESSURE + breathe);
    dx[i] += (ox/d) * push;
    dy[i] += (oy/d) * push;
    dz[i] += (oz/d) * push;
  }

  // apply + noise + tension drift
  for (let i=0; i<n; i++){
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0004;
    // tension: slight oscillation per vertex (haunted tremor)
    verts[i].tension += (Math.random()-0.5)*0.006;
  }

  // subdivide sparse regions
  const toAdd = [];
  for (let i=0; i<n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j <= i) continue;
      const u = verts[j];
      const ex = u.x - v.x, ey = u.y - v.y, ez = u.z - v.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > MAX_D*MAX_D && verts.length + toAdd.length < MAX_VERTS){
        toAdd.push({
          x: (v.x+u.x)*0.5, y: (v.y+u.y)*0.5, z: (v.z+u.z)*0.5,
          age: Math.max(v.age, u.age)*0.9, tension: (v.tension + u.tension)*0.5
        });
      }
    }
  }
  for (const w of toAdd) verts.push(w);
}

// rendering — particles on the membrane + interior wisps
const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
const rType      = new Float32Array(N_RENDER);  // 0=membrane, 1=interior wisp
for (let i=0; i<N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('ptype',    new THREE.BufferAttribute(rType, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  fogColor: { value: new THREE.Color(0x0a0808) },
  fogDensity: { value: 0.05 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    attribute float ptype;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      // membrane particles: slight surface tremble
      if (ptype < 0.5){
        p += 0.008 * vec3(sin(t), cos(t*1.3), sin(t*0.7));
      } else {
        // interior wisps: drift
        p += 0.015 * vec3(sin(t*0.6), cos(t*0.9), sin(t*1.1));
      }

      // Bourgeois palette: bruise — old blood (dark red), bone (cream), graphite (blue-gray)
      vec3 bone = vec3(0.88, 0.84, 0.78);
      vec3 blood = vec3(0.52, 0.18, 0.20);
      vec3 shadow = vec3(0.22, 0.24, 0.28);
      
      float k = clamp(age * 1.2, 0.0, 1.0);
      vCol = mix(blood, bone, k);
      vCol = mix(vCol, shadow, smoothstep(0.7, 1.0, k) * 0.5);
      
      vAlpha = (ptype < 0.5) ? 0.7 : 0.3;  // membrane brighter, wisps fainter

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vFogDepth = -mv.z;
      float dist = vFogDepth;
      gl_PointSize = 1.6 * uPixel * (35.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 16.0);
      float a = core * vAlpha;
      vec3 col = vCol * core;
      // fog mix
      float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
      col = mix(col, fogColor, fogFactor);
      a *= (1.0 - fogFactor * 0.6);
      gl_FragColor = vec4(col, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow: 400 steps so the membrane is already dense
for (let s=0; s<400; s++) step(0);

// track centroid for camera
function updateCamera(){
  if (verts.length === 0) return;
  let cx=0, cy=0, cz=0;
  for (const v of verts){ cx+=v.x; cy+=v.y; cz+=v.z; }
  cx/=verts.length; cy/=verts.length; cz/=verts.length;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  const breathePhase = t * BREATHE_FREQ * Math.PI * 2;

  for (let s=0; s<3; s++) step(breathePhase);

  const n = verts.length;
  // 70% membrane particles, 30% interior wisps
  const nMembrane = Math.floor(N_RENDER * 0.7);
  const nWisp = N_RENDER - nMembrane;
  
  // membrane particles: scatter on surface + local offset
  for (let i=0; i<nMembrane; i++){
    const v = verts[Math.floor(Math.random() * n)];
    const jitter = 0.04;
    rPositions[i*3]   = v.x + (Math.random()-0.5)*jitter;
    rPositions[i*3+1] = v.y + (Math.random()-0.5)*jitter;
    rPositions[i*3+2] = v.z + (Math.random()-0.5)*jitter;
    rAge[i] = v.age + v.tension * 0.1;
    rType[i] = 0;
  }
  
  // interior wisps: sample points inside the membrane (simple: toward centroid)
  let cx=0, cy=0, cz=0;
  for (const v of verts){ cx+=v.x; cy+=v.y; cz+=v.z; }
  cx/=n; cy/=n; cz/=n;
  for (let i=nMembrane; i<N_RENDER; i++){
    const v = verts[Math.floor(Math.random() * n)];
    const blend = 0.3 + Math.random() * 0.5;  // drift toward interior
    rPositions[i*3]   = v.x * (1-blend) + cx * blend + (Math.random()-0.5)*0.1;
    rPositions[i*3+1] = v.y * (1-blend) + cy * blend + (Math.random()-0.5)*0.1;
    rPositions[i*3+2] = v.z * (1-blend) + cz * blend + (Math.random()-0.5)*0.1;
    rAge[i] = v.age * 0.6;
    rType[i] = 1;
  }

  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;
  geom.attributes.ptype.needsUpdate = true;

  updateCamera();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
