<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t0g · echoes of the earth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#041419; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">t0g</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Perlin noise for morph control ── */
function fade(t){ return t*t*t*(t*(t*6-15)+10); }
function lerp(a,b,t){ return a+t*(b-a); }
class PerlinNoise {
  constructor(seed){
    this.p = new Array(512);
    const perm = Array.from({length:256},(_,i)=>i);
    let s = seed;
    const rng = ()=>{ s=(s*1664525+1013904223)|0; return((s>>>0)/4294967296); };
    for(let i=255;i>0;i--){
      const j=Math.floor(rng()*(i+1));
      [perm[i],perm[j]]=[perm[j],perm[i]];
    }
    for(let i=0;i<256;i++){this.p[i]=this.p[i+256]=perm[i];}
  }
  grad(hash,x,y,z){
    const h=hash&15;
    const u=h<8?x:y, v=h<4?y:h===12||h===14?x:z;
    return((h&1)===0?u:-u)+((h&2)===0?v:-v);
  }
  noise(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), w=fade(z);
    const A=this.p[X]+Y, AA=this.p[A]+Z, AB=this.p[A+1]+Z,
          B=this.p[X+1]+Y, BA=this.p[B]+Z, BB=this.p[B+1]+Z;
    return lerp(lerp(lerp(this.grad(this.p[AA],x,y,z),this.grad(this.p[BA],x-1,y,z),u),
                     lerp(this.grad(this.p[AB],x,y-1,z),this.grad(this.p[BB],x-1,y-1,z),u),v),
                lerp(lerp(this.grad(this.p[AA+1],x,y,z-1),this.grad(this.p[BA+1],x-1,y,z-1),u),
                     lerp(this.grad(this.p[AB+1],x,y-1,z-1),this.grad(this.p[BB+1],x-1,y-1,z-1),u),v),w);
  }
}
const perlin = new PerlinNoise(42);

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x041419, 0.03);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 15, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x041419, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);
controls.maxDistance = 80;
controls.minDistance = 8;

/* ── Substrate plane (reef floor) ── */
const substrateGeom = new THREE.PlaneGeometry(60, 60, 1, 1);
const substrateMat = new THREE.MeshBasicMaterial({
  color: 0x0a2a34,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.6
});
const substrate = new THREE.Mesh(substrateGeom, substrateMat);
substrate.rotation.x = -Math.PI/2;
substrate.position.y = -0.5;
scene.add(substrate);

/* ── Coral instances ── */
const CORAL_COUNT = 180;
const uniforms = {
  uTime: { value: 0 },
  uMorphRate: { value: 0.4 },
};

/* Species archetypes: branch, tube, plate, brain */
const branchGeom = new THREE.CylinderGeometry(0.08, 0.15, 1.5, 6, 4);
const tubeGeom = new THREE.CylinderGeometry(0.2, 0.2, 2.0, 8, 1);
const plateGeom = new THREE.BoxGeometry(1.2, 0.15, 0.9);
const brainGeom = new THREE.SphereGeometry(0.6, 16, 12);

const coralMat = new THREE.ShaderMaterial({
  uniforms: {
    ...uniforms,
    uSpeciesParam: { value: 0 },
    uSeed: { value: 0 },
  },
  vertexShader: `
    uniform float uTime;
    uniform float uSpeciesParam;
    uniform float uSeed;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vSpecies;
    void main(){
      vec3 p = position;
      float t = uTime * 0.3 + uSeed * 6.28;
      /* organic undulation */
      p.x += 0.04 * sin(t * 0.7 + p.y * 2.0);
      p.z += 0.04 * cos(t * 0.6 + p.y * 2.0);
      /* species morph via scale/bulge */
      float bulge = 1.0 + 0.2 * sin(uSpeciesParam * 6.28 + p.y * 3.0);
      p.x *= bulge;
      p.z *= bulge;
      vNormal = normalize(normalMatrix * normal);
      vPos = (modelMatrix * vec4(p, 1.0)).xyz;
      vSpecies = uSpeciesParam;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uSeed;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vSpecies;
    void main(){
      /* subsurface scattering approximation */
      vec3 lightDir = normalize(vec3(0.5, 1.0, 0.3));
      float ndl = dot(vNormal, lightDir);
      float sss = pow(clamp(1.0 - ndl, 0.0, 1.0), 2.5) * 0.6;
      float rim = pow(1.0 - abs(dot(vNormal, vec3(0,0,1))), 3.0) * 0.4;
      /* palette: turquoise → coral pink → lime, driven by species latent */
      vec3 turquoise = vec3(0.12, 0.82, 0.78);
      vec3 coral = vec3(0.95, 0.45, 0.55);
      vec3 lime = vec3(0.65, 0.92, 0.35);
      vec3 col = mix(turquoise, coral, smoothstep(0.0, 0.5, vSpecies));
      col = mix(col, lime, smoothstep(0.5, 1.0, vSpecies));
      /* wet shimmer */
      float shimmer = 0.15 * sin(uTime * 2.0 + vPos.x * 8.0 + vPos.z * 6.0 + uSeed * 40.0);
      col += shimmer;
      /* AI flicker — rapid color-shift at edges to mimic latent-space interpolation */
      float flicker = 0.08 * sin(uTime * 7.0 + uSeed * 100.0);
      col += flicker * vec3(sin(vPos.y*20.0), cos(vPos.y*18.0), sin(vPos.y*22.0));
      /* combine lighting */
      float ambient = 0.3;
      float diffuse = max(0.0, ndl) * 0.5;
      col *= (ambient + diffuse + sss + rim);
      /* fog */
      float depth = gl_FragCoord.z / gl_FragCoord.w;
      float fogFactor = 1.0 - exp(-0.03 * depth);
      vec3 fogColor = vec3(0.016, 0.082, 0.098);
      col = mix(col, fogColor, fogFactor);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});

const coralInstances = [];
const geomPool = [branchGeom, tubeGeom, plateGeom, brainGeom];

for (let i = 0; i < CORAL_COUNT; i++){
  const seed = Math.random();
  const geomIdx = Math.floor(seed * 4);
  const geom = geomPool[geomIdx];
  const mat = coralMat.clone();
  mat.uniforms.uSeed.value = seed;
  const mesh = new THREE.Mesh(geom, mat);
  const angle = Math.random() * Math.PI * 2;
  const radius = 4 + Math.random() * 18;
  mesh.position.x = Math.cos(angle) * radius;
  mesh.position.z = Math.sin(angle) * radius;
  mesh.position.y = Math.random() * 0.5;
  const scale = 0.6 + Math.random() * 1.8;
  mesh.scale.set(scale, scale, scale);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  mesh.userData = {
    seed,
    speciesOffset: Math.random() * 100,
  };
  scene.add(mesh);
  coralInstances.push(mesh);
}

/* ── Plankton particles (drifting foreground) ── */
const planktonCount = 4000;
const planktonGeom = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonSeeds = new Float32Array(planktonCount);
for (let i = 0; i < planktonCount; i++){
  planktonPos[i*3] = (Math.random()-0.5) * 70;
  planktonPos[i*3+1] = Math.random() * 30;
  planktonPos[i*3+2] = (Math.random()-0.5) * 70;
  planktonSeeds[i] = Math.random();
}
planktonGeom.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
planktonGeom.setAttribute('seed', new THREE.BufferAttribute(planktonSeeds, 1));

const planktonMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: uniforms.uTime,
    uPixel: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.25 + seed * 6.28;
      /* slow drift */
      p.x += sin(t * 0.6 + seed * 10.0) * 2.0;
      p.z += cos(t * 0.5 + seed * 12.0) * 2.0;
      p.y += sin(t * 0.4) * 0.5;
      /* wrap y */
      if (p.y > 30.0) p.y -= 30.0;
      if (p.y < 0.0) p.y += 30.0;
      /* palette — faint bioluminescence */
      float energy = 0.5 + 0.5 * sin(t * 2.0);
      vec3 cyan = vec3(0.2, 0.9, 0.95);
      vec3 lime = vec3(0.6, 1.0, 0.4);
      vCol = mix(cyan, lime, seed);
      vAlpha = 0.3 + 0.4 * energy;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.8 + 0.6 * energy) * uPixel * (30.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const planktonPoints = new THREE.Points(planktonGeom, planktonMat);
scene.add(planktonPoints);

/* ── Ambient light ── */
const ambLight = new THREE.AmbientLight(0x406080, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 5);
scene.add(dirLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animation loop ── */
const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  /* morph rate modulation — audio-reactive proxy: slow underwater hum */
  const humPhase = elapsed * 0.15;
  const morphRate = 0.3 + 0.25 * Math.sin(humPhase) + 0.1 * Math.sin(humPhase * 2.3);
  uniforms.uMorphRate.value = morphRate;

  /* update coral species parameters via 4D Perlin latent space */
  for (const coral of coralInstances){
    const seed = coral.userData.seed;
    const offset = coral.userData.speciesOffset;
    const nx = perlin.noise(offset + elapsed * morphRate * 0.08, seed * 10, 0, 0);
    const ny = perlin.noise(seed * 10, offset + elapsed * morphRate * 0.08, 0, 0);
    const speciesParam = (nx * 0.5 + 0.5) * 0.7 + (ny * 0.5 + 0.5) * 0.3;
    coral.material.uniforms.uSpeciesParam.value = speciesParam;
    coral.material.uniforms.uTime.value = elapsed;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
