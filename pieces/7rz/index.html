<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7rz · belousov-zhabotinsky oscillator</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">7rz</div>
<div class="hint">move pointer left-right to drive through bifurcation cascade</div>
<div class="src">belousov-zhabotinsky · oregonator model · phase space</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Belousov-Zhabotinsky reaction — Oregonator model (Field-Noyes 1974):
//   dx/dt = (1/ε) * (y - xy + x - q·x²)
//   dy/dt = (-y - xy + fz) / ε
//   dz/dt = x - z
// where x = [HBrO₂], y = [Br⁻], z = [Ce(IV)]
// Control parameter f ∈ [0.5, 3.0] drives the system:
//   f < 1.0: stable fixed point (chemical equilibrium)
//   f ≈ 1.0: Hopf bifurcation → limit cycle (oscillations begin)
//   f > 1.5: large-amplitude oscillations (spiral waves)
//   f > 2.5: period-doubling route to chaos
// Pointer X maps to f; the phase-space orbit is the rendered form.

const W = 256, H = 256;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

// ---- ping-pong state RTs (xyz = phase coords, w = trail age) ----
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: scatter particles near the fixed point (x≈2, y≈0.002, z≈2) with phase offsets
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const phase = i / N;
  const r = Math.pow(Math.random(), 0.5) * 0.4;
  const theta = phase * Math.PI * 2;
  init[i*4]   = 2.0 + r * Math.cos(theta);
  init[i*4+1] = 0.002 + r * Math.sin(theta) * 0.001;
  init[i*4+2] = 2.0 + r * Math.sin(theta);
  init[i*4+3] = phase;   // per-particle phase for color mapping
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- simulation pass: Oregonator integration ----
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:  { value: 0.008 },
  uF:   { value: 1.2 },
  uEps: { value: 0.04 },
  uQ:   { value: 0.0008 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uF;
    uniform float uEps;
    uniform float uQ;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      float x = p.x, y = p.y, z = p.z;
      // Oregonator equations
      float dx = (1.0 / uEps) * (y - x*y + x - uQ * x * x);
      float dy = (-y - x*y + uF * z) / uEps;
      float dz = x - z;
      // RK2 midpoint
      vec3 k1 = vec3(dx, dy, dz);
      vec3 mid = p + k1 * (uDt * 0.5);
      float x2 = mid.x, y2 = mid.y, z2 = mid.z;
      float dx2 = (1.0 / uEps) * (y2 - x2*y2 + x2 - uQ * x2 * x2);
      float dy2 = (-y2 - x2*y2 + uF * z2) / uEps;
      float dz2 = x2 - z2;
      vec3 k2 = vec3(dx2, dy2, dz2);
      p += k2 * uDt;
      // clamp to physical bounds
      p.x = clamp(p.x, 0.0, 8.0);
      p.y = clamp(p.y, 0.0, 0.05);
      p.z = clamp(p.z, 0.0, 8.0);
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ---- render pass: phase-space trajectory ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 300);
camera.position.set(12, 8, 18);
camera.lookAt(3, 0.01, 3);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uF:     { value: 1.2 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uF;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vRegime;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      // regime indicator: f < 1.0 (fixed pt) vs f > 1.0 (oscillatory)
      vRegime = smoothstep(0.8, 1.2, uF);
      // scale phase coords for visibility
      vec3 scaled = vec3(p.x * 2.5 - 5.0, p.y * 400.0 - 1.0, p.z * 2.5 - 5.0);
      vec4 mv = modelViewMatrix * vec4(scaled, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + vAge * 1.4) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vRegime;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      // palette: fixed-point (cool teal) → oscillatory (warm amber/rust)
      vec3 fixedCol = vec3(0.15, 0.52, 0.58);
      vec3 limitCol = vec3(0.88, 0.44, 0.26);
      vec3 chaosCol = vec3(0.95, 0.76, 0.32);
      vec3 col = mix(fixedCol, limitCol, vRegime);
      col = mix(col, chaosCol, smoothstep(0.7, 1.0, vRegime) * vAge);
      gl_FragColor = vec4(col * a * 0.7, a * 0.6);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// add a thin reference grid on the XZ plane to anchor phase space
const gridHelper = new THREE.GridHelper(20, 20, 0x2a2a35, 0x1a1a22);
gridHelper.position.y = -1;
scene.add(gridHelper);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer X drives f through bifurcation cascade
let targetF = 1.2;
addEventListener('pointermove', (e) => {
  const nx = e.clientX / innerWidth;
  // f ∈ [0.5, 3.0] — left = stable, right = chaos
  targetF = 0.5 + nx * 2.5;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;
  // ease f parameter
  simUniforms.uF.value += (targetF - simUniforms.uF.value) * 0.03;
  pointsMat.uniforms.uF.value = simUniforms.uF.value;

  // step sim 3 substeps for stability
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  // slow orbital camera around phase space
  const ang = now * 0.00008;
  camera.position.x = 12 * Math.cos(ang);
  camera.position.z = 18 * Math.sin(ang);
  camera.position.y = 8 + Math.sin(ang * 0.7) * 3;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
