<script type="module">
import * as THREE from 'three';

/*
  Mona Hatoum × topological

  The Riley-wave calyx from ere becomes a wire-mesh cage — a domestic
  vessel (colander, lantern, crib) whose surface slowly undergoes
  topological transformation: the torus twists, its cross-section
  pinches into a figure-8, the genus shifts. Hatoum's language of
  the cage rendered in particle wireframe on warm parchment.

  Technique: particles placed on parametric grid lines of a torus;
  vertex shader morphs the surface in real time (twist, pinch, breathe).
  Reference: Hatoum's "Light Sentence" (1992) — wire-mesh lockers,
  bare swinging bulb, shifting shadows on walls.
*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ─── Build parametric grid on torus ───
const N = 80000;
const TWO_PI = Math.PI * 2;
const paramU = new Float32Array(N);
const paramV = new Float32Array(N);
const positions = new Float32Array(N * 3); // placeholder for BufferAttribute

const N_U_LINES = 52;   // meridional wires (around tube cross-section)
const N_V_LINES = 30;   // longitudinal wires (around the hole)

let morphSeed = 0;

function buildGrid(seed) {
  let s = (seed * 1597 + 51749) >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  let idx = 0;
  // Slightly randomise grid spacing for organic feel (Hatoum's hand-welded mesh)
  const uJitter = 0.012 + rng() * 0.008;
  const vJitter = 0.012 + rng() * 0.008;

  const halfN = Math.floor(N * 0.52);
  const ptsPerU = Math.floor(halfN / N_U_LINES);
  // u-lines: fixed u, sweep v
  for (let i = 0; i < N_U_LINES && idx < N; i++) {
    const u = (i / N_U_LINES) * TWO_PI + (rng() - 0.5) * uJitter;
    for (let j = 0; j < ptsPerU && idx < N; j++) {
      paramU[idx] = u;
      paramV[idx] = (j / ptsPerU) * TWO_PI + (rng() - 0.5) * vJitter;
      idx++;
    }
  }
  // v-lines: fixed v, sweep u
  const remaining = N - idx;
  const ptsPerV = Math.floor(remaining / N_V_LINES);
  for (let i = 0; i < N_V_LINES && idx < N; i++) {
    const v = (i / N_V_LINES) * TWO_PI + (rng() - 0.5) * vJitter;
    for (let j = 0; j < ptsPerV && idx < N; j++) {
      paramU[idx] = (j / ptsPerV) * TWO_PI + (rng() - 0.5) * uJitter;
      paramV[idx] = v;
      idx++;
    }
  }
  // Pad
  while (idx < N) {
    paramU[idx] = rng() * TWO_PI;
    paramV[idx] = rng() * TWO_PI;
    idx++;
  }
}
buildGrid(morphSeed);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('aU', new THREE.BufferAttribute(paramU, 1));
geom.setAttribute('aV', new THREE.BufferAttribute(paramV, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uMorph:   { value: 0 }  // lerps toward target on click
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uMorph;
    attribute float aU;
    attribute float aV;
    varying float vDepth;
    varying float vLocalCurv;

    void main() {
      float t = uTime;

      // ── Topological parameters ──
      // Twist: v offset proportional to u — partial Dehn twist
      // At twist=1.0 it's a full twist (Klein-bottle immersion)
      float twistAmt = 0.35 + 0.3 * sin(t * 0.04 + uMorph);
      float v = aV + twistAmt * aU;
      float u = aU;

      // Pinch: cross-section deforms circle → figure-8
      // This changes the effective topology (self-intersection)
      float pinch = 0.32 * sin(t * 0.055 + uMorph * 2.3 + 0.7);

      // Major and minor radii
      float R = 2.6 + 0.08 * sin(t * 0.25);   // breathe
      float r = 1.05;
      float rLocal = r * (1.0 + pinch * cos(2.0 * v));

      // ── Torus parametric surface ──
      vec3 p;
      p.x = (R + rLocal * cos(v)) * cos(u);
      p.y = rLocal * sin(v);
      p.z = (R + rLocal * cos(v)) * sin(u);

      // ── Base tilt — domestic object resting at slight angle ──
      float tiltAng = 0.28;
      float ct = cos(tiltAng), st = sin(tiltAng);
      p = vec3(p.x, p.y * ct - p.z * st, p.y * st + p.z * ct);

      // ── Pointer-driven tilt — the cage responds to gaze ──
      float tx = uPointer.y * 0.12;
      float tz = -uPointer.x * 0.12;
      float ca = cos(tx), sa = sin(tx);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      float cb = cos(tz), sb = sin(tz);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);

      // ── Slow rotation — walk around the cage ──
      float rot = t * 0.06;
      float cr = cos(rot), sr = sin(rot);
      q = vec3(q.x * cr - q.z * sr, q.y, q.x * sr + q.z * cr);

      // Local curvature hint (for fragment shading)
      vLocalCurv = abs(rLocal / r);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;

      // Fine wire points — small and even
      gl_PointSize = (1.1 + 0.3 * vLocalCurv) * uPixel * (4.5 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vLocalCurv;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float a = exp(-r * 20.0);

      // Iron wire — dark, slightly warm where curvature stretches
      vec3 wireBase = vec3(0.11, 0.09, 0.07);
      vec3 wireStressed = vec3(0.22, 0.14, 0.08);
      float stress = smoothstep(0.7, 1.5, vLocalCurv);
      vec3 col = mix(wireBase, wireStressed, stress);

      // Depth haze toward parchment
      float haze = clamp((vDepth - 7.0) / 9.0, 0.0, 0.65);
      col = mix(col, vec3(0.80, 0.72, 0.56), haze);

      gl_FragColor = vec4(col, a * 0.80 * (1.0 - haze * 0.45));
    }
  `
});

const cage = new THREE.Points(geom, mat);
scene.add(cage);

// ─── Shadow on floor plane — Light Sentence reference ───
// A faint projected-shadow disc beneath the cage
const shadowGeom = new THREE.PlaneGeometry(8, 8);
const shadowMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime },
  transparent: true, depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      vec2 c = vUv - 0.5;
      float d = length(c);
      // Elliptical shadow, sways slightly (swinging bulb)
      float sway = sin(uTime * 0.13) * 0.04;
      vec2 shifted = c - vec2(sway, sway * 0.6);
      float sd = length(shifted);
      float shadow = exp(-sd * sd * 6.0);
      // Grid pattern in shadow — wire mesh projected
      float gridU = sin(shifted.x * 52.0) * sin(shifted.y * 32.0);
      float gridMask = smoothstep(-0.1, 0.3, gridU);
      shadow *= 0.4 + 0.6 * gridMask;
      gl_FragColor = vec4(0.08, 0.05, 0.02, shadow * 0.25);
    }
  `
});
const shadowPlane = new THREE.Mesh(shadowGeom, shadowMat);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -2.8;
scene.add(shadowPlane);

// ─── Dust motes — inherited from ere, the inhabited room ───
const N_DUST = 180;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST * 3);
const dustSd = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 14;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
  dustSd[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSd, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main() {
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.07 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.25 + 0.50 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + 1.2 * vGlow) * uPixel * (3.5 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(0.98, 0.92, 0.76) * vGlow;
      gl_FragColor = vec4(col, a * 0.60 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ─── Interaction ───
let morphTarget = 0;
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  morphSeed++;
  morphTarget += 1.0 + Math.random() * 2.0;
  buildGrid(morphSeed);
  geom.attributes.aU.needsUpdate = true;
  geom.attributes.aV.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Render loop ───
const start = performance.now();
let currentMorph = 0;
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // Smooth lerp toward morph target
  currentMorph += (morphTarget - currentMorph) * 0.015;
  uniforms.uMorph.value = currentMorph;

  // Camera: slow vertical drift, always looking at center
  camera.position.x = Math.sin(t * 0.035) * 0.5;
  camera.position.y = 1.8 + Math.sin(t * 0.028 + 0.8) * 0.6;
  camera.position.z = 10.5 + Math.sin(t * 0.02) * 0.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
