<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>axk · midnight sky · winger-bearskin erosion</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06050a; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">axk</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 800);
camera.position.set(0, 8, 45);
camera.lookAt(0, 10, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06050a, 1);
document.body.appendChild(renderer.domElement);

/* ─── background gradient plane ─── */
const bgGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.999,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float t = vUv.y;
      // sodium-lit horizon → deep night
      vec3 horizon = vec3(0.18, 0.08, 0.03);
      vec3 mid     = vec3(0.04, 0.03, 0.08);
      vec3 zenith  = vec3(0.015, 0.012, 0.04);
      vec3 col = mix(horizon, mid, smoothstep(0.0, 0.35, t));
      col = mix(col, zenith, smoothstep(0.35, 0.75, t));
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bgMesh = new THREE.Mesh(bgGeo, bgMat);
bgMesh.renderOrder = -1;
bgMesh.frustumCulled = false;
scene.add(bgMesh);

/* ─── particles ─── */
const N = 55000;
const builtPos   = new Float32Array(N * 3); // infrastructure positions
const skyPos     = new Float32Array(N * 3); // sky/star positions
const seeds      = new Float32Array(N);
const phases     = new Float32Array(N);     // when this particle erodes (0–1)
const leafAngles = new Float32Array(N);     // rotation of leaf shape

// Built layer: grids, lines, orthogonal infrastructure on ground plane
// Roads as grid lines, power-line poles, fence posts
for (let i = 0; i < N; i++) {
  seeds[i] = Math.random();
  phases[i] = Math.random(); // uniform distribution across cycle
  leafAngles[i] = Math.random() * Math.PI * 2.0;

  const r = Math.random();
  let bx, by, bz;

  if (r < 0.25) {
    // Road grid lines — X axis
    const roadZ = (Math.floor(Math.random() * 8) - 4) * 7.0 + (Math.random() - 0.5) * 0.4;
    bx = (Math.random() - 0.5) * 80;
    bz = roadZ;
    by = (Math.random() - 0.5) * 0.3;
  } else if (r < 0.5) {
    // Road grid lines — Z axis
    const roadX = (Math.floor(Math.random() * 8) - 4) * 7.0 + (Math.random() - 0.5) * 0.4;
    bx = roadX;
    bz = (Math.random() - 0.5) * 80;
    by = (Math.random() - 0.5) * 0.3;
  } else if (r < 0.65) {
    // Power line poles — vertical segments
    const poleX = (Math.floor(Math.random() * 12) - 6) * 9.5 + (Math.random() - 0.5) * 0.2;
    const poleZ = (Math.floor(Math.random() * 3) - 1) * 14.0;
    bx = poleX;
    bz = poleZ + (Math.random() - 0.5) * 0.3;
    by = Math.random() * 8.0;
  } else if (r < 0.8) {
    // Power lines — horizontal wires between poles (catenary)
    const wireZ = (Math.floor(Math.random() * 3) - 1) * 14.0;
    bx = (Math.random() - 0.5) * 80;
    const sag = Math.sin((bx / 40 + 0.5) * Math.PI) * 1.2;
    by = 7.0 - sag + (Math.random() - 0.5) * 0.15;
    bz = wireZ + (Math.random() - 0.5) * 0.15;
  } else {
    // Fence posts and wire — low horizontal
    const fenceZ = (Math.floor(Math.random() * 5) - 2) * 11.0 + 3.5;
    bx = (Math.random() - 0.5) * 70;
    bz = fenceZ + (Math.random() - 0.5) * 0.2;
    by = Math.random() * 3.0;
  }

  builtPos[i*3]   = bx;
  builtPos[i*3+1] = by;
  builtPos[i*3+2] = bz;

  // Sky positions: dome of stars
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(1 - Math.random() * 0.85); // mostly upper hemisphere
  const rad = 50 + Math.random() * 120;
  skyPos[i*3]   = Math.sin(phi) * Math.cos(theta) * rad;
  skyPos[i*3+1] = Math.cos(phi) * rad + 15; // lift above horizon
  skyPos[i*3+2] = Math.sin(phi) * Math.sin(theta) * rad;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',  new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geom.setAttribute('builtPos',  new THREE.BufferAttribute(builtPos, 3));
geom.setAttribute('skyPos',    new THREE.BufferAttribute(skyPos, 3));
geom.setAttribute('seed',      new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('phase',     new THREE.BufferAttribute(phases, 1));
geom.setAttribute('leafAngle', new THREE.BufferAttribute(leafAngles, 1));

const uniforms = {
  uTime:    { value: 0 },
  uCycle:   { value: 0 },  // 0=fully built, 1=fully sky
  uPixel:   { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uCycle;
    uniform float uPixel;
    attribute vec3 builtPos;
    attribute vec3 skyPos;
    attribute float seed;
    attribute float phase;
    attribute float leafAngle;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;
    varying float vIsSky;

    void main(){
      // Each particle transitions when cycle crosses its phase
      // Spread transition over ~0.15 of cycle so it's gradual
      float particleT = smoothstep(phase - 0.08, phase + 0.08, uCycle);

      // Lerp position
      vec3 p = mix(builtPos, skyPos, particleT);

      // Rising drift during transition
      float transitioning = particleT * (1.0 - particleT) * 4.0; // peaks at 0.5
      p.y += transitioning * 12.0 * (0.5 + seed);
      // Slight horizontal wander during rise
      float t = uTime * 0.3 + seed * 6.28;
      p.x += transitioning * sin(t * 1.3 + seed * 20.0) * 3.0;
      p.z += transitioning * cos(t * 0.9 + seed * 15.0) * 3.0;

      // Built: subtle flicker (light pollution)
      float builtFlicker = 1.0 + 0.15 * sin(t * 4.0 + seed * 50.0) * (1.0 - particleT);

      // Sky: gentle twinkle
      float skyTwinkle = 0.6 + 0.4 * sin(t * 0.8 + seed * 30.0);

      // Palette
      // Built: sodium orange → amber → dirty yellow
      vec3 sodium1 = vec3(0.95, 0.55, 0.12);  // deep sodium
      vec3 sodium2 = vec3(0.98, 0.72, 0.25);  // amber
      vec3 sodium3 = vec3(0.85, 0.82, 0.45);  // sickly yellow-white
      vec3 builtCol = mix(sodium1, sodium2, seed);
      builtCol = mix(builtCol, sodium3, sin(seed * 7.0) * 0.5 + 0.5);

      // Sky: cobalt → star white → faint blue
      vec3 cobalt   = vec3(0.15, 0.18, 0.55);
      vec3 starBlue = vec3(0.55, 0.62, 0.85);
      vec3 starWhite= vec3(0.92, 0.94, 0.98);
      vec3 skyCol = mix(cobalt, starBlue, seed * 0.6);
      // Brightest stars
      skyCol = mix(skyCol, starWhite, step(0.92, seed));

      vCol = mix(builtCol * builtFlicker, skyCol * skyTwinkle, particleT);
      vIsSky = particleT;
      vLeafAngle = leafAngle + transitioning * 3.0; // leaves spin as they rise

      // Alpha
      float builtA = 0.7 * builtFlicker;
      float skyA = mix(0.25, 0.9, step(0.85, seed)) * skyTwinkle;
      vAlpha = mix(builtA, skyA, particleT);
      // Extra glow during transition
      vAlpha += transitioning * 0.5;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // Built particles: small. Sky: varies. Transit: larger
      float builtSize = 1.2 + seed * 0.8;
      float skySize = mix(0.6, 2.5, step(0.85, seed));
      float sz = mix(builtSize, skySize, particleT);
      sz += transitioning * 2.5; // bloom during rise
      gl_PointSize = sz * uPixel * (50.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;
    varying float vIsSky;

    void main(){
      vec2 uv = gl_PointCoord - 0.5;

      // Rotate UV by leaf angle
      float ca = cos(vLeafAngle), sa = sin(vLeafAngle);
      vec2 ruv = vec2(uv.x * ca - uv.y * sa, uv.x * sa + uv.y * ca);

      // Leaf SDF: elongated with pointed tip and base
      // Built particles: rectangular/rigid leaf. Sky: soft circle/star
      float shape;
      if (vIsSky > 0.9) {
        // Star: soft radial
        float r = length(uv);
        shape = exp(-r * r * 22.0);
      } else if (vIsSky < 0.1) {
        // Infrastructure leaf: angular, asymmetric
        float leaf = abs(ruv.x) * 2.5 + abs(ruv.y) * 1.2;
        // Pointed top
        leaf += max(0.0, ruv.y) * 1.5;
        shape = 1.0 - smoothstep(0.25, 0.42, leaf);
      } else {
        // Transitioning: morph between leaf and star
        float r = length(uv);
        float star = exp(-r * r * 22.0);
        float leaf = abs(ruv.x) * 2.5 + abs(ruv.y) * 1.2;
        leaf += max(0.0, ruv.y) * 1.5;
        float leafS = 1.0 - smoothstep(0.25, 0.42, leaf);
        shape = mix(leafS, star, vIsSky);
      }

      if (shape < 0.01) discard;
      float a = shape * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ─── film grain overlay ─── */
const grainGeo = new THREE.PlaneGeometry(2, 2);
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.998,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float grain = hash(vUv * 800.0 + uTime * 100.0);
      grain = (grain - 0.5) * 0.06;
      gl_FragColor = vec4(vec3(grain), abs(grain) * 1.5);
    }
  `
});
const grainMesh = new THREE.Mesh(grainGeo, grainMat);
grainMesh.renderOrder = 100;
grainMesh.frustumCulled = false;
scene.add(grainMesh);

/* ─── resize ─── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── animation ─── */
const CYCLE_DURATION = 90; // seconds for full erosion cycle
const HOLD_DURATION  = 15; // hold at each extreme
const TOTAL = CYCLE_DURATION + HOLD_DURATION * 2;

const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;
  grainMat.uniforms.uTime.value = elapsed;

  // Cycle: hold built → erode → hold sky → rebuild → repeat
  const cycleT = (elapsed % (TOTAL * 2)) / (TOTAL * 2); // 0–1 for full round trip
  let cycle;
  if (cycleT < HOLD_DURATION / (TOTAL * 2)) {
    cycle = 0; // hold built
  } else if (cycleT < (HOLD_DURATION + CYCLE_DURATION) / (TOTAL * 2)) {
    // eroding
    const erodeT = (cycleT - HOLD_DURATION / (TOTAL * 2)) / (CYCLE_DURATION / (TOTAL * 2));
    cycle = erodeT;
  } else if (cycleT < (HOLD_DURATION * 2 + CYCLE_DURATION) / (TOTAL * 2)) {
    cycle = 1; // hold sky
  } else {
    // rebuilding
    const rebuildT = (cycleT - (HOLD_DURATION * 2 + CYCLE_DURATION) / (TOTAL * 2)) /
                     (CYCLE_DURATION / (TOTAL * 2));
    cycle = 1 - rebuildT;
  }
  cycle = Math.max(0, Math.min(1, cycle));
  uniforms.uCycle.value = cycle;

  // Camera: gently tilt from horizon view up to sky view as cycle progresses
  const camBaseY = 8 + cycle * 20;
  const lookY = 5 + cycle * 50;
  const camZ = 45 - cycle * 15;
  const camOscX = Math.sin(elapsed * 0.02) * 5;
  const camOscZ = Math.cos(elapsed * 0.015) * 3;

  camera.position.set(camOscX, camBaseY, camZ + camOscZ);
  camera.lookAt(0, lookY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
