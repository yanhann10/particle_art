<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vx8 · physarum network · agent trails</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">vx8</div>
<div class="hint">physarum slime-mold agent system · self-organizing network</div>
<div class="src">mutation from ajo · sage jenson directive · trail deposition + chemotaxis</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Sage Jenson / mxsage physarum directive:
// Each agent deposits pheromone, senses ahead-left/ahead/ahead-right,
// steers toward strongest. Ping-pong render targets with diffusion+decay.
// Trail rendered as glowing lines on midnight — biological intelligence emerging.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.012);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const W = 1024, H = 1024;

// ───── pheromone field (ping-pong render targets)
const trailA = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});
const trailB = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});

let trailRead = trailA, trailWrite = trailB;
function swapTrails(){ [trailRead, trailWrite] = [trailWrite, trailRead]; }

const orthoCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);

// ───── diffusion + decay shader
const diffuseMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null },
    decay: { value: 0.985 },
    diffuse: { value: 0.16 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform float decay, diffuse;
    varying vec2 vUv;
    void main() {
      vec2 px = 1.0 / vec2(${W}.0, ${H}.0);
      float c = texture2D(tTrail, vUv).r;
      float n = texture2D(tTrail, vUv + vec2(0.0, px.y)).r;
      float s = texture2D(tTrail, vUv - vec2(0.0, px.y)).r;
      float e = texture2D(tTrail, vUv + vec2(px.x, 0.0)).r;
      float w = texture2D(tTrail, vUv - vec2(px.x, 0.0)).r;
      float avg = (c + n + s + e + w) / 5.0;
      float val = mix(c, avg, diffuse) * decay;
      gl_FragColor = vec4(val, val, val, 1.0);
    }
  `
});
const diffuseQuad = new THREE.Mesh(quadGeo, diffuseMat);
const diffuseScene = new THREE.Scene();
diffuseScene.add(diffuseQuad);

// ───── agent deposition shader (additive point-splat)
const N_AGENTS = 4500;
const agentPositions = new Float32Array(N_AGENTS * 3);
const agentAngles = new Float32Array(N_AGENTS);
const agentVelocities = new Float32Array(N_AGENTS * 2);

// Initialize agents in a loose cluster (arabesque heritage — ring shape)
for (let i = 0; i < N_AGENTS; i++){
  const th = (i / N_AGENTS) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
  const r = 0.24 + Math.random() * 0.08;
  agentPositions[i*3]   = 0.5 + Math.cos(th) * r;
  agentPositions[i*3+1] = 0.5 + Math.sin(th) * r;
  agentPositions[i*3+2] = 0.0;
  agentAngles[i] = th + Math.PI + (Math.random() - 0.5) * 0.4;
  agentVelocities[i*2] = 0;
  agentVelocities[i*2+1] = 0;
}

const depositGeo = new THREE.BufferGeometry();
depositGeo.setAttribute('position', new THREE.BufferAttribute(agentPositions, 3));
const depositMat = new THREE.ShaderMaterial({
  uniforms: { depositStrength: { value: 0.15 } },
  vertexShader: `
    void main() {
      gl_Position = vec4(position.xy * 2.0 - 1.0, 0.0, 1.0);
      gl_PointSize = 3.5;
    }
  `,
  fragmentShader: `
    uniform float depositStrength;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = (1.0 - d * 2.0) * depositStrength;
      gl_FragColor = vec4(a, a, a, 1.0);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false
});
const depositPoints = new THREE.Points(depositGeo, depositMat);
const depositScene = new THREE.Scene();
depositScene.add(depositPoints);

// ───── agent update (CPU — sample trail texture, steer, move)
const SPEED = 0.0014;
const SENSOR_ANGLE = 0.36;
const SENSOR_DIST = 0.008;
const ROTATE_ANGLE = 0.12;

const canvas2d = document.createElement('canvas');
canvas2d.width = W; canvas2d.height = H;
const ctx = canvas2d.getContext('2d', { willReadFrequently: true });

function sampleTrail(x, y){
  const ix = Math.floor(x * W), iy = Math.floor(y * H);
  if (ix < 0 || ix >= W || iy < 0 || iy >= H) return 0;
  const idx = (iy * W + ix) * 4;
  return ctx.getImageData(ix, iy, 1, 1).data[0] / 255.0;
}

function updateAgents(){
  // read current trail into canvas2d
  renderer.readRenderTargetPixels(trailRead, 0, 0, W, H, new Uint8Array(W * H * 4));
  const pixels = new Uint8Array(W * H * 4);
  renderer.readRenderTargetPixels(trailRead, 0, 0, W, H, pixels);
  const imgData = ctx.createImageData(W, H);
  imgData.data.set(pixels);
  ctx.putImageData(imgData, 0, 0);

  for (let i = 0; i < N_AGENTS; i++){
    const x = agentPositions[i*3], y = agentPositions[i*3+1];
    const angle = agentAngles[i];

    // sense three directions
    const aheadX = x + Math.cos(angle) * SENSOR_DIST;
    const aheadY = y + Math.sin(angle) * SENSOR_DIST;
    const leftX  = x + Math.cos(angle + SENSOR_ANGLE) * SENSOR_DIST;
    const leftY  = y + Math.sin(angle + SENSOR_ANGLE) * SENSOR_DIST;
    const rightX = x + Math.cos(angle - SENSOR_ANGLE) * SENSOR_DIST;
    const rightY = y + Math.sin(angle - SENSOR_ANGLE) * SENSOR_DIST;

    const ahead = sampleTrail(aheadX, aheadY);
    const left  = sampleTrail(leftX, leftY);
    const right = sampleTrail(rightX, rightY);

    // steer toward strongest
    if (ahead > left && ahead > right){
      // continue straight
    } else if (ahead < left && ahead < right){
      // choose random
      agentAngles[i] += (Math.random() < 0.5 ? 1 : -1) * ROTATE_ANGLE;
    } else if (left > right){
      agentAngles[i] += ROTATE_ANGLE;
    } else if (right > left){
      agentAngles[i] -= ROTATE_ANGLE;
    }

    // move forward
    agentPositions[i*3]   += Math.cos(agentAngles[i]) * SPEED;
    agentPositions[i*3+1] += Math.sin(agentAngles[i]) * SPEED;

    // wrap edges
    if (agentPositions[i*3] < 0) agentPositions[i*3] += 1.0;
    if (agentPositions[i*3] > 1) agentPositions[i*3] -= 1.0;
    if (agentPositions[i*3+1] < 0) agentPositions[i*3+1] += 1.0;
    if (agentPositions[i*3+1] > 1) agentPositions[i*3+1] -= 1.0;
  }
  depositGeo.attributes.position.needsUpdate = true;
}

// ───── visualization — render trail texture as glowing plane
const visMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null },
    time: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform float time;
    varying vec2 vUv;

    void main() {
      float val = texture2D(tTrail, vUv).r;
      
      // gradient: teal → warm gold at peaks
      vec3 base = vec3(0.05, 0.12, 0.16);     // deep teal-gray
      vec3 mid  = vec3(0.18, 0.24, 0.28);     // lighter teal
      vec3 peak = vec3(0.82, 0.68, 0.42);     // warm gold (arabesque heritage)
      
      vec3 col = base;
      if (val > 0.02) col = mix(base, mid, smoothstep(0.02, 0.15, val));
      if (val > 0.15) col = mix(mid, peak, smoothstep(0.15, 0.55, val));
      
      // emissive glow at high density
      col += vec3(0.9, 0.7, 0.4) * pow(val, 3.0) * 1.2;
      
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});

const visPlane = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), visMat);
scene.add(visPlane);

// ambient architectural light
scene.add(new THREE.AmbientLight(0x1a1520, 0.3));
const keyLight = new THREE.DirectionalLight(0x3a4555, 0.6);
keyLight.position.set(4, 8, 6);
scene.add(keyLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let frame = 0;

function loop(){
  const t = (performance.now() - start) / 1000;
  frame++;

  // agent update every frame
  updateAgents();

  // deposit pheromone
  renderer.setRenderTarget(trailWrite);
  renderer.render(depositScene, orthoCamera);

  // diffuse + decay
  diffuseMat.uniforms.tTrail.value = trailWrite.texture;
  renderer.setRenderTarget(trailRead);
  renderer.render(diffuseScene, orthoCamera);
  
  swapTrails();

  // visualize
  visMat.uniforms.tTrail.value = trailRead.texture;
  visMat.uniforms.time.value = t;
  
  // gentle camera drift (biological drift, not orbit)
  camera.position.x = Math.sin(t * 0.08) * 2.4;
  camera.position.y = Math.cos(t * 0.11) * 1.8;
  camera.lookAt(0, 0, 0);

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
