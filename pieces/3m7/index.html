<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3m7 · abyss passage · particle drift through infinite depth</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">3m7</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// SUBLIME SCALE — James Turrell Ganzfeld void-walk meets Caspar David Friedrich
// Wanderer Above the Sea of Fog. Single luminous band recedes through darkness
// toward a vanishing horizon. The viewer is suspended in what feels like
// kilometers of empty space; particles drift past at glacial speed, revealing
// the scale only through their differential motion parallax. Fog density so low
// that geometry is visible to hundreds of units — the opposite of claustrophobic
// enclosure. Camera near-clip 0.01 so viewer sees the closest particles almost
// touching the lens. Audio (if mic available): low-frequency amplitude tilts
// the luminous band, earthquake rumble energy.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.00085);  // fog so thin the void persists
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.01, 1800);
camera.position.set(0, 0, 0);
camera.lookAt(0, 0, -1);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// ─────────── luminous horizon band (Rothko color-field in 3D void)
// Single glowing horizontal stripe at z=-800, height 120, width 600
const bandGeo = new THREE.PlaneGeometry(600, 120);
const bandMat = new THREE.MeshBasicMaterial({
  color: 0xffd4a3,  // warm amber glow
  transparent: true,
  opacity: 0.12,
  side: THREE.DoubleSide
});
const band = new THREE.Mesh(bandGeo, bandMat);
band.position.z = -800;
scene.add(band);

// secondary fainter band further back
const band2 = new THREE.Mesh(
  new THREE.PlaneGeometry(900, 80),
  new THREE.MeshBasicMaterial({ color: 0x8899bb, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
);
band2.position.z = -1400;
scene.add(band2);

// ─────────── particle field — large depth span, very sparse
const PARTICLE_COUNT = 3200;
const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const sizes = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++){
  const z = -1600 + Math.random() * 1600;  // span from camera to far beyond band
  const spread = Math.abs(z) * 0.4;        // cone expands with distance
  positions[i*3]     = (Math.random()-0.5) * spread;
  positions[i*3 + 1] = (Math.random()-0.5) * spread * 0.6;
  positions[i*3 + 2] = z;
  
  // drift velocity: very slow, mostly forward (toward camera)
  velocities[i*3]     = (Math.random()-0.5) * 0.008;
  velocities[i*3 + 1] = (Math.random()-0.5) * 0.004;
  velocities[i*3 + 2] = 0.15 + Math.random() * 0.35;  // forward drift
  
  // size inversely proportional to distance (perspective helper)
  const distFactor = Math.max(0.3, 1 - Math.abs(z) / 1600);
  sizes[i] = (0.4 + Math.random() * 1.6) * distFactor;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const particleMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float size;
    varying float vDepth;
    void main(){
      vDepth = 1.0 - clamp(-position.z / 1600.0, 0.0, 1.0);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    void main(){
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float alpha = (1.0 - r*2.0) * 0.14 * vDepth;
      // pale blue-white
      gl_FragColor = vec4(0.85, 0.88, 0.95, alpha);
    }
  `
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// ─────────── audio reactivity (optional)
let audioContext, analyser, dataArray, micEnabled = false;
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      const source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      micEnabled = true;
    })
    .catch(() => {});
}

function getLowFreqAmplitude(){
  if (!micEnabled || !analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  let sum = 0;
  const lowBins = 8;  // first 8 bins (~0-340Hz at 44.1kHz, fftSize=512)
  for (let i = 0; i < lowBins; i++) sum += dataArray[i];
  return (sum / lowBins) / 255.0;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(t){
  const elapsed = (t - start) * 0.001;
  
  // particle drift
  for (let i = 0; i < PARTICLE_COUNT; i++){
    positions[i*3]     += velocities[i*3];
    positions[i*3 + 1] += velocities[i*3 + 1];
    positions[i*3 + 2] += velocities[i*3 + 2];
    
    // wrap particles that pass camera
    if (positions[i*3 + 2] > 20){
      positions[i*3 + 2] = -1600;
      const spread = 640;
      positions[i*3]     = (Math.random()-0.5) * spread;
      positions[i*3 + 1] = (Math.random()-0.5) * spread * 0.6;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;
  
  // band slow rotation (barely perceptible)
  band.rotation.z = Math.sin(elapsed * 0.08) * 0.03;
  band2.rotation.z = Math.cos(elapsed * 0.05) * 0.02;
  
  // audio tilt
  const lowAmp = getLowFreqAmplitude();
  if (lowAmp > 0.05){
    band.rotation.x = (lowAmp - 0.5) * 0.4;
    band2.rotation.x = (lowAmp - 0.5) * 0.3;
  } else {
    band.rotation.x *= 0.95;
    band2.rotation.x *= 0.95;
  }
  
  // camera very slow forward drift (viewer being pulled toward the band)
  camera.position.z -= 0.012;
  if (camera.position.z < -400){
    camera.position.z = 0;  // reset before reaching band
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
</body>
</html>
