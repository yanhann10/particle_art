<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sfm · biomorphic triptych cycle</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; }
  .state { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:5; color:#2a1a08; transition: opacity 0.4s; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">sfm</div>
<div class="state" id="stateLabel">i · vascular</div>
<div class="hint">click to cycle states · drag to tilt</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const posA = new Float32Array(N * 3);
const posB = new Float32Array(N * 3);
const posCurrent = new Float32Array(N * 3);
const seedArr = new Float32Array(N);

const states = [
  { name: 'i · vascular', build: buildVascular },
  { name: 'ii · breathing', build: buildBreathing },
  { name: 'iii · peristalsis', build: buildPeristalsis }
];
let currentState = 0;
let transitioning = false;
let transitionT = 0;
const TRANSITION_DUR = 1.8;

// ──── State builders ────

function rng(seed) {
  let s = seed >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// State 1: Vascular network — branching tubes with pulsing flow
function buildVascular(out) {
  const r = rng(42317);
  // Generate branching paths, distribute particles along them
  const branches = [];
  function branch(ox, oy, oz, dx, dy, dz, depth, len) {
    if (depth > 5) return;
    branches.push({ ox, oy, oz, dx, dy, dz, len });
    if (r() < 0.7 && depth < 4) {
      const angle = (r() - 0.5) * 1.2;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const ndx = dx * ca - dy * sa, ndy = dx * sa + dy * ca;
      branch(ox + dx * len, oy + dy * len, oz + dz * len, ndx, ndy, dz + (r()-0.5)*0.3, depth+1, len * (0.5 + r()*0.3));
    }
    if (r() < 0.6 && depth < 4) {
      const angle = (r() - 0.5) * 1.2;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const ndx = dx * ca + dz * sa, ndz = -dx * sa + dz * ca;
      branch(ox + dx * len * 0.5, oy + dy * len * 0.5, oz + dz * len * 0.5, ndx, dy+(r()-0.5)*0.4, ndz, depth+1, len * (0.4 + r()*0.3));
    }
  }
  // Several root branches
  for (let i = 0; i < 6; i++) {
    const a = r() * Math.PI * 2;
    branch(0, 0, 0, Math.cos(a)*0.7, Math.sin(a)*0.7, (r()-0.5)*0.4, 0, 1.5 + r());
  }
  const nb = branches.length;
  for (let i = 0; i < N; i++) {
    const b = branches[Math.floor(r() * nb)];
    const t = r();
    const radius = 0.06 + 0.12 * (1 - t); // taper
    const angle = r() * Math.PI * 2;
    const px = b.ox + b.dx * b.len * t + Math.cos(angle) * radius;
    const py = b.oy + b.dy * b.len * t + Math.sin(angle) * radius;
    const pz = b.oz + b.dz * b.len * t + Math.cos(angle + 1.0) * radius * 0.5;
    out[i*3] = px; out[i*3+1] = py; out[i*3+2] = pz;
    seedArr[i] = r();
  }
}

// State 2: Breathing membrane — a lung/alveolar sac surface
function buildBreathing(out) {
  const r = rng(88192);
  for (let i = 0; i < N; i++) {
    // Sphere with alveolar bumps
    const u = r() * Math.PI * 2;
    const v = Math.acos(2 * r() - 1);
    const baseR = 2.8;
    // Multiple frequency bumps like alveoli
    const bump = 0.3 * Math.sin(u * 7) * Math.sin(v * 5) +
                 0.2 * Math.sin(u * 13 + 1.0) * Math.sin(v * 11 + 2.0) +
                 0.15 * Math.sin(u * 19 + 3.0) * Math.cos(v * 17);
    const rad = baseR + bump;
    // Thin shell — particles on surface ± small thickness
    const thickness = (r() - 0.5) * 0.08;
    const finalR = rad + thickness;
    out[i*3]     = finalR * Math.sin(v) * Math.cos(u);
    out[i*3 + 1] = finalR * Math.sin(v) * Math.sin(u);
    out[i*3 + 2] = finalR * Math.cos(v);
    seedArr[i] = r();
  }
}

// State 3: Peristalsis — intestinal tube with traveling wave
function buildPeristalsis(out) {
  const r = rng(55503);
  const tubeLen = 8;
  for (let i = 0; i < N; i++) {
    const t = r() * tubeLen - tubeLen / 2; // along tube axis
    const angle = r() * Math.PI * 2;
    // Tube with constrictions — standing wave shape
    const baseRadius = 0.8 + 0.35 * Math.sin(t * 2.5) + 0.2 * Math.sin(t * 4.1 + 1.0);
    const thickness = (r() - 0.5) * 0.06;
    const rad = baseRadius + thickness;
    // Tube curves in 3D — gentle S-curve
    const cx = Math.sin(t * 0.4) * 1.2;
    const cy = Math.cos(t * 0.3) * 0.6;
    out[i*3]     = cx + rad * Math.cos(angle);
    out[i*3 + 1] = cy + rad * Math.sin(angle);
    out[i*3 + 2] = t;
    seedArr[i] = r();
  }
}

// Initialize
states[0].build(posA);
posCurrent.set(posA);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(posCurrent, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uState: { value: 0.0 },
  uPulse: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2 uPointer;
    uniform float uState;
    uniform float uPulse;
    attribute float seed;
    varying float vDepth;
    varying float vSeed;
    varying float vPulseLocal;
    void main(){
      vec3 p = position;
      // Biomorphic motion per state
      float st = uState;
      float t = uTime;
      // Vascular: pulsing flow along branch direction
      if (st < 0.5) {
        float wave = sin(t * 2.2 + p.x * 3.0 + p.y * 2.0 + seed * 6.28);
        p += normalize(p + 0.001) * 0.04 * wave;
        vPulseLocal = wave * 0.5 + 0.5;
      }
      // Breathing: radial expansion/contraction
      else if (st < 1.5) {
        float breath = sin(t * 0.8) * 0.12 + sin(t * 1.7 + seed * 3.0) * 0.04;
        vec3 dir = normalize(p + 0.001);
        p += dir * breath;
        // Alveolar micro-pulse
        float micro = sin(t * 3.5 + length(p.xy) * 5.0) * 0.02;
        p += dir * micro;
        vPulseLocal = breath * 3.0 + 0.5;
      }
      // Peristalsis: traveling squeeze wave
      else {
        float wave = sin(p.z * 1.8 - t * 2.0);
        float squeeze = 0.85 + 0.15 * wave;
        vec2 radial = p.xy - vec2(sin(p.z * 0.4) * 1.2, cos(p.z * 0.3) * 0.6);
        p.xy = vec2(sin(p.z * 0.4) * 1.2, cos(p.z * 0.3) * 0.6) + radial * squeeze;
        // Slow forward creep
        p.z += sin(t * 0.3) * 0.3;
        vPulseLocal = wave * 0.5 + 0.5;
      }
      // Pointer tilt
      float tiltX = uPointer.y * 0.18;
      float tiltZ = -uPointer.x * 0.18;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);
      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      gl_PointSize = (1.2 + 0.6 * vPulseLocal) * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vPulseLocal;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);
      // Warm organic tones — arterial reds shift with pulse
      vec3 inkBase = vec3(0.18, 0.06, 0.04);
      vec3 inkWarm = vec3(0.42, 0.12, 0.08);
      vec3 inkPulse = vec3(0.55, 0.10, 0.06);
      vec3 col = mix(inkBase, inkWarm, smoothstep(0.0, 1.0, vSeed));
      col = mix(col, inkPulse, vPulseLocal * 0.4);
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      gl_FragColor = vec4(col, a * 0.80 * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ──── Dust motes (inherited atmosphere)
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST * 3);
const dustSd = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3] = (Math.random()-0.5)*14;
  dustPos[i*3+1] = (Math.random()-0.5)*8;
  dustPos[i*3+2] = (Math.random()-0.5)*8;
  dustSd[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSd, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime; uniform float uPixel; attribute float seed; varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0; float sy = p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5; float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

// ──── Interaction: cycle states
const stateLabel = document.getElementById('stateLabel');

addEventListener('click', () => {
  if (transitioning) return;
  const nextState = (currentState + 1) % 3;
  // Copy current to A, build next into B
  posA.set(posCurrent);
  states[nextState].build(posB);
  transitioning = true;
  transitionT = 0;
  currentState = nextState;
  uniforms.uState.value = currentState;
  stateLabel.textContent = states[currentState].name;
});

addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ──── Centroid tracking
function computeCentroid() {
  let cx = 0, cy = 0, cz = 0;
  const step = 200;
  let count = 0;
  for (let i = 0; i < N; i += step) {
    cx += posCurrent[i*3]; cy += posCurrent[i*3+1]; cz += posCurrent[i*3+2];
    count++;
  }
  return new THREE.Vector3(cx/count, cy/count, cz/count);
}

let lastTime = performance.now();
const start = performance.now();

function loop(){
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  // Cross-fade transition
  if (transitioning) {
    transitionT += dt / TRANSITION_DUR;
    if (transitionT >= 1.0) {
      transitionT = 1.0;
      transitioning = false;
    }
    // Smooth ease
    const ease = transitionT * transitionT * (3 - 2 * transitionT);
    for (let i = 0; i < N * 3; i++) {
      posCurrent[i] = posA[i] * (1 - ease) + posB[i] * ease;
    }
    geom.attributes.position.needsUpdate = true;
  }

  // Camera tracks centroid with gentle drift
  const centroid = computeCentroid();
  camera.position.x = centroid.x + Math.sin(t * 0.05) * 0.5;
  camera.position.y = centroid.y + 0.3 + Math.sin(t * 0.04 + 1.0) * 0.3;
  camera.position.z = centroid.z + 10;
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Build initial state
states[0].build(posCurrent);
geom.attributes.position.needsUpdate = true;
uniforms.uState.value = 0;
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
