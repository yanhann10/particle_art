<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.014);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.3));

const pL = new THREE.PointLight(0xffc8a0, 0.45, 50, 1.8);
pL.position.set(-1.5, 9.0, 2.0);
scene.add(pL);

let seed = 83741629;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── SUSPENDED SPHERE — pale moon, the heart of absence
const sphereRadius = 2.2;
const spherePos = new THREE.Vector3(1.8, 2.5, -1.0);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e6d8,
    emissive: 0xf0e6d8,
    emissiveIntensity: 0.65,
    roughness: 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.72
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── SUSPENDED DRESS — Shiota's "State of Being": wireframe remembered garment
const dressPos = new THREE.Vector3(-2.0, -1.8, 0.6);
const dressH = 5.0, dressWTop = 0.8, dressWBot = 2.4;
const dressSlices = 14, dressRings = 10;
const dressVerts = [];
const dressEdges = [];

// Build dress silhouette — bodice narrows at waist, skirt flares
for(let r = 0; r <= dressRings; r++){
  const t = r / dressRings; // 0=shoulders, 1=hem
  const y = dressPos.y + dressH * (1.0 - t);
  let radius;
  if(t < 0.15) radius = dressWTop * (0.7 + t * 2.0); // shoulders
  else if(t < 0.35) radius = dressWTop * (1.0 + (t - 0.15) * 0.5); // bodice
  else if(t < 0.42) radius = dressWTop * (1.1 - (t - 0.35) * 2.0); // waist pinch
  else radius = dressWTop * 0.96 + (t - 0.42) * (dressWBot - dressWTop * 0.96) / 0.58; // skirt flare

  // Add slight hand-tied irregularity
  for(let s = 0; s < dressSlices; s++){
    const angle = (s / dressSlices) * Math.PI * 2;
    const wobble = 1.0 + (rng() - 0.5) * 0.12;
    const rx = radius * wobble;
    const rz = radius * (1.0 + (rng() - 0.5) * 0.1);
    dressVerts.push(new THREE.Vector3(
      dressPos.x + Math.cos(angle) * rx,
      y + (rng() - 0.5) * 0.06,
      dressPos.z + Math.sin(angle) * rz
    ));
  }
}

// Horizontal ring edges
for(let r = 0; r <= dressRings; r++){
  for(let s = 0; s < dressSlices; s++){
    const i = r * dressSlices + s;
    const j = r * dressSlices + ((s + 1) % dressSlices);
    dressEdges.push(i, j);
  }
}
// Vertical edges
for(let r = 0; r < dressRings; r++){
  for(let s = 0; s < dressSlices; s++){
    const i = r * dressSlices + s;
    const j = (r + 1) * dressSlices + s;
    dressEdges.push(i, j);
  }
}
// Diagonal cross-wires (hand-tied irregularity)
for(let r = 0; r < dressRings; r++){
  for(let s = 0; s < dressSlices; s += 2){
    const i = r * dressSlices + s;
    const j = (r + 1) * dressSlices + ((s + 1) % dressSlices);
    dressEdges.push(i, j);
  }
}

const dressFloats = new Float32Array(dressVerts.length * 3);
dressVerts.forEach((v, i) => { dressFloats[i*3]=v.x; dressFloats[i*3+1]=v.y; dressFloats[i*3+2]=v.z; });
const dressGeo = new THREE.BufferGeometry();
dressGeo.setAttribute('position', new THREE.BufferAttribute(dressFloats, 3));
dressGeo.setIndex(dressEdges);
const dress = new THREE.LineSegments(dressGeo, new THREE.LineBasicMaterial({
  color: 0x1a0808,
  transparent: true,
  opacity: 0.6
}));
scene.add(dress);

// Hanger — thin horizontal bar at dress top
const hangerGeo = new THREE.BufferGeometry();
const hTop = dressPos.y + dressH;
const hangerPts = new Float32Array([
  dressPos.x - 1.2, hTop + 0.1, dressPos.z, dressPos.x + 1.2, hTop + 0.1, dressPos.z,
  dressPos.x, hTop + 0.1, dressPos.z, dressPos.x, hTop + 0.7, dressPos.z
]);
hangerGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
hangerGeo.setIndex([0,1, 2,3]);
scene.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a08, transparent: true, opacity: 0.5
})));

// ── ROOM — architectural volume
const ROOM = { w: 38, h: 26, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Centroid between sphere and dress
const centroid = spherePos.clone().add(dressPos).multiplyScalar(0.5);

// ── ANCHORS
const NUM_ANCHORS = 1100;
const anchors = [];

// Icosahedral skeleton anchors (Mohr geometry)
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  anchors.push(new THREE.Vector3(
    v[0]*7.5 + centroid.x, v[1]*6.0 + centroid.y, v[2]*7.5 + centroid.z
  ));
}

// Suspension anchors — ceiling above dress
const suspAnchors = [];
for(let i=0; i<6; i++){
  const p = new THREE.Vector3(
    dressPos.x + (rng()-0.5)*3.0, hh, dressPos.z + (rng()-0.5)*3.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}
// Ceiling above sphere
for(let i=0; i<5; i++){
  const p = new THREE.Vector3(
    spherePos.x + (rng()-0.5)*4.0, hh, spherePos.z + (rng()-0.5)*4.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones — deliberate negative space (Tyler Hobbs)
const voids = [
  { pos: new THREE.Vector3(centroid.x + 5, centroid.y - 2, centroid.z + 3), r: 2.5 },
  { pos: new THREE.Vector3(centroid.x - 4, centroid.y + 3, centroid.z - 5), r: 2.8 },
  { pos: new THREE.Vector3(centroid.x + 1, centroid.y - 6, centroid.z - 2), r: 2.0 }
];

function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense shell anchors around both objects
for(let i = anchors.length; i < NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.30){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = spherePos.clone().add(dir.multiplyScalar(sphereRadius + 0.6 + rng()*6.0));
  } else if(r < 0.52){
    // Around dress — use dress centroid with spread
    const dCenter = new THREE.Vector3(dressPos.x, dressPos.y + dressH*0.5, dressPos.z);
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = dCenter.clone().add(dir.multiplyScalar(1.5 + rng()*5.0));
  } else if(r < 0.72){
    p = wallPt();
    p.lerp(centroid, 0.18 + rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereRadius));
}

function dressSurf(){
  // Random point on dress wireframe
  const vi = Math.floor(rng() * dressVerts.length);
  return dressVerts[vi].clone();
}

// Radial quantization near sphere (Molnar: order near center, chaos at periphery)
function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 9) return p;
  const strength = Math.max(0, 1 - d/9);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snapAngle = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snapAngle) * snapAngle;
  const blended = theta + (snapped - theta) * strength * 0.5;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  const dx=mx-centroid.x, dy=my-centroid.y, dz=mz-centroid.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Suspension threads — dress to ceiling (Saraceno: make hanging legible)
for(const sa of suspAnchors.slice(0, 6)){
  const hangerTop = new THREE.Vector3(dressPos.x, hTop + 0.7, dressPos.z);
  setLine(sa, hangerTop);
  for(let j=0; j<2; j++){
    const shoulder = dressVerts[Math.floor(rng() * dressSlices)];
    setLine(sa, shoulder);
  }
}

// Suspension threads — sphere to ceiling
for(const sa of suspAnchors.slice(6)){
  for(let j=0; j<3; j++){
    const target = sphereSurf();
    target.y = Math.max(target.y, spherePos.y + sphereRadius*0.4);
    setLine(sa, target);
  }
}

// Sphere-to-dress linking threads — the connection between remembered body and soul
for(let i=0; i<80; i++){
  const a = sphereSurf();
  const b = dressSurf();
  setLine(a, b);
}

// Cat A: threads converging on sphere (38%)
// Including ~10% that stop short (Quayola: threads that almost reach but fail)
const catA = Math.floor(NUM_LINES * 0.38);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  const target = sphereSurf();
  if(rng() < 0.10){
    // Threads that stop short — presence-in-absence
    const dir = a.clone().sub(target).normalize();
    const gap = 0.3 + rng() * 1.4;
    const shortTarget = target.clone().add(dir.multiplyScalar(gap));
    setLine(a, shortTarget);
  } else {
    setLine(a, target);
  }
}

// Cat B: threads converging on dress (18%)
const catB = Math.floor(NUM_LINES * 0.18);
for(let i=0; i<catB && li<NUM_LINES; i++){
  let a = rng()<0.45 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  const target = dressSurf();
  if(rng() < 0.08){
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*0.8));
  }
  setLine(a, target);
}

// Cat C: wall-to-wall atmospheric threads (18%)
const catC = Math.floor(NUM_LINES * 0.18);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(centroid) > 18 && rng() > 0.06){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat D: dendritic branching filaments (Andy Lomas: morphogenetic branching)
while(li < NUM_LINES - 100){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.5){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Branch: 3 generations deep (Lomas)
  if(rng() < 0.30 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.3 + rng()*0.35);
    const brDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const brEnd = mid.clone().add(brDir.multiplyScalar(0.8 + rng()*2.0));
    if(!inVoid(brEnd)){
      setLine(mid, brEnd);
      // Second generation
      if(rng() < 0.35 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(brEnd, 0.4 + rng()*0.3);
        const brDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const brEnd2 = mid2.clone().add(brDir2.multiplyScalar(0.5 + rng()*1.2));
        if(!inVoid(brEnd2)) setLine(mid2, brEnd2);
      }
    }
  }
}

// Fill remaining with sphere/dress convergence
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)){
    if(rng() < 0.55) setLine(a, sphereSurf());
    else setLine(a, dressSurf());
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / stones caught in the web
const NUM_FRAGS = 28;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03 + rng()*0.12;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz*(1.5+rng()*2.0), sz*0.02, sz*(0.6+rng()*1.0))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.02;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.25, d*0.18),
    transparent: true,
    opacity: 0.2 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Cluster fragments in the space between sphere and dress
  if(rng() < 0.65){
    const t = 0.15 + rng()*0.7;
    mesh.position.lerpVectors(spherePos, dressPos, t);
    mesh.position.x += (rng()-0.5)*3.5;
    mesh.position.y += (rng()-0.5)*2.5;
    mesh.position.z += (rng()-0.5)*3.5;
  } else {
    const si = Math.floor(rng()*li)*6;
    const t = 0.2 + rng()*0.6;
    mesh.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  }
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — intimate interior path, weaving between sphere and dress
const pathLen = 400;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;

  // Asymmetric path that weaves close to both objects
  const cx = centroid.x, cy = centroid.y, cz = centroid.z;
  const x = cx + Math.sin(p)*5.8 + Math.sin(p*1.3+0.8)*2.5 + Math.cos(p*0.35)*1.8;
  const y = cy + 1.2 + Math.sin(p*0.5+1.0)*3.8 + Math.cos(p*0.45)*1.0;
  const z = cz + Math.cos(p)*7.5 + Math.cos(p*0.7+2.0)*2.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── DRIFT — the entire web breathes laterally, like architecture in wind
  // Very slow, very subtle — the installation is almost still
  const arr = lineGeo.attributes.position.array;
  const driftX = Math.sin(t * 0.015) * 0.04;
  const driftZ = Math.cos(t * 0.011) * 0.03;

  for(let i=0; i<li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    // Threads far from center drift more — periphery breathes, center is still
    const driftAmp = Math.min(1.0, dist / 20.0);
    // Per-thread phase offset for organic irregularity
    const phase = basePositions[idx]*0.15 + basePositions[idx+1]*0.4 + i*0.003;
    const microSway = Math.sin(t*0.02 + phase) * 0.001;

    for(let v=0; v<2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + driftX * driftAmp + microSway;
      arr[vi+1] = basePositions[vi+1] + microSway * 0.3;
      arr[vi+2] = basePositions[vi+2] + driftZ * driftAmp + microSway * 0.5;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.002;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look slowly wanders between sphere and dress
  const lookBlend = Math.sin(t * 0.006) * 0.5 + 0.5;
  const look = spherePos.clone().lerp(dressPos, lookBlend * 0.6 + 0.15);
  look.x += Math.sin(t*0.008)*0.5;
  look.y += Math.cos(t*0.006)*0.3;
  camera.lookAt(look);

  // Sphere — imperceptible luminous pulse
  sphere.position.y = spherePos.y + Math.sin(t*0.01)*0.015;

  // Light slow wander
  pL.position.x = -1.5 + Math.sin(t*0.005)*1.0;
  pL.position.y = 9.0 + Math.cos(t*0.004)*0.6;
  pL.position.z = 2.0 + Math.cos(t*0.007)*0.8;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
