<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ufh · Shiota — presence in absence</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">ufh</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.018);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0000, 0.8));
const dL = new THREE.DirectionalLight(0xffe8e0, 0.18);
dL.position.set(-6, 9, 3);
scene.add(dL);

let seed = 82401663;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── THE SUSPENDED BED — remembered object at center
const bedFrame = new THREE.Group();

// Mattress — pale cotton white
const mattressGeo = new THREE.BoxGeometry(3.2, 0.35, 5.4);
const mattressMat = new THREE.MeshStandardMaterial({ 
  color: 0xf4ebe2,
  emissive: 0xf4ebe2,
  emissiveIntensity: 0.65,
  roughness: 0.88,
  metalness: 0.02,
  transparent: true,
  opacity: 0.92
});
const mattress = new THREE.Mesh(mattressGeo, mattressMat);
mattress.position.y = 0;
bedFrame.add(mattress);

// Pillow
const pillowGeo = new THREE.BoxGeometry(1.2, 0.18, 0.85);
const pillow = new THREE.Mesh(pillowGeo, mattressMat);
pillow.position.set(0, 0.27, -2.0);
bedFrame.add(pillow);

// Four bed posts — dark iron remnants
const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.4, 8);
const postMat = new THREE.MeshBasicMaterial({ color: 0x121212, transparent: true, opacity: 0.7 });
const postPositions = [
  [-1.5, -0.7, -2.5], [1.5, -0.7, -2.5],
  [-1.5, -0.7, 2.5], [1.5, -0.7, 2.5]
];
postPositions.forEach(([x, y, z]) => {
  const post = new THREE.Mesh(postGeo, postMat);
  post.position.set(x, y, z);
  bedFrame.add(post);
});

bedFrame.position.set(2.5, 1.2, -2.0);
scene.add(bedFrame);

const bedPos = bedFrame.position;

// ── ROOM BOUNDARIES — architectural cube
const ROOM = { w: 38, h: 28, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — dense constellation around bed
const NUM_ANCHORS = 1100;
const anchors = [];

// Suspension anchors above bed (visible hanging threads)
const suspensionAnchors = [];
for(let i=0; i<8; i++){
  const xOff = (rng()-0.5)*3.0;
  const zOff = (rng()-0.5)*4.5;
  const p = new THREE.Vector3(bedPos.x + xOff, hh, bedPos.z + zOff);
  suspensionAnchors.push(p);
  anchors.push(p);
}

// Concentration around bed — blood network
for(let i=0; i<NUM_ANCHORS - 8; i++){
  if(rng() < 0.58){
    // Dense ring around bed
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = 2.5 + rng()*7.5;
    anchors.push(bedPos.clone().add(dir.multiplyScalar(dist)));
  } else if(rng() < 0.35){
    // Mid-field layer
    const p = wallPt();
    p.lerp(bedPos, 0.18 + rng()*0.48);
    anchors.push(p);
  } else {
    // Wall boundary
    anchors.push(wallPt());
  }
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function bedSurf(){
  // Random point on bed surface
  const x = bedPos.x + (rng()-0.5)*3.2;
  const y = bedPos.y + 0.18 + rng()*0.05;
  const z = bedPos.z + (rng()-0.5)*5.4;
  return new THREE.Vector3(x, y, z);
}

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Suspension threads — ceiling to bed corners
suspensionAnchors.forEach(sa => {
  const target = bedSurf();
  target.y = bedPos.y + 0.20;
  setLine(sa, target);
});

// Category A: threads converging on bed (48%)
const catA = Math.floor(NUM_LINES * 0.48);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.60 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, bedSurf());
}

// Category B: wall-to-wall threads near bed (26%)
const catB = Math.floor(NUM_LINES * 0.26);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(bedPos) > 14 && rng() > 0.12){ i--; continue; }
  setLine(a, b);
}

// Category C: short anchor-to-anchor network (remaining)
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<14; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.25 && d < 7.2){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper caught in web
const NUM_FRAGS = 38;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.06 + rng()*0.20;
  const geo = rng()>0.50
    ? new THREE.BoxGeometry(sz*(1.5+rng()*2.0), sz*0.018, sz*(1.0+rng()*1.3))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.015 + rng()*0.042;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.45, d*0.35),
    transparent: true, 
    opacity: 0.40 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Attach to thread
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.20 + rng()*0.60;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI*2, rng()*Math.PI*2, rng()*Math.PI*2);
  scene.add(mesh);
}

// ── CAMERA PATH — slow interior walk weaving through threads
const dollyPath = [];
const pathLen = 220;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;
  
  // Interior spiral around bed
  const x = bedPos.x + Math.sin(phase) * 7.5 + Math.cos(phase*1.3)*1.8;
  const y = bedPos.y + Math.sin(phase*0.65 + 0.8) * 4.2 + Math.sin(phase*0.85)*1.0;
  const z = bedPos.z + Math.cos(phase) * 9.5 + Math.cos(phase*0.45)*2.5;
  
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Micro-breathing on anchors — <0.4% movement
  const breathAmp = 0.006;
  const breathFreq = 0.14;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.30 + by*0.90 + bz*0.20 + (i/6)*0.010;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s*0.85;
    arr[i+1] = by + s*0.65;
    arr[i+2] = bz + s*0.50;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — continuous slow drift
  const speed = 0.0042;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at bed with subtle wander
  const lookTarget = bedPos.clone();
  lookTarget.x += Math.sin(t*0.016)*0.6;
  lookTarget.y += Math.cos(t*0.012)*0.5;
  camera.lookAt(lookTarget);

  // Bed — imperceptible breathing
  bedFrame.rotation.y = Math.sin(t*0.008)*0.012;
  bedFrame.position.y = bedPos.y + Math.sin(t*0.015)*0.025;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
