<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9vv · withdrawn</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">9vv</div>
<div class="hint">drag to orbit · the form withdraws as you approach</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Organic folded-leaf clusters: multiple twirled sheets in arrangement ── */
function createLeafTwirl(scale, twist, curlAxis, seedVal){
  const segs = 32;
  const verts = [];
  const rng = () => {
    seedVal = (seedVal * 1103515245 + 12345) & 0x7fffffff;
    return seedVal / 0x7fffffff;
  };
  
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const u = t * Math.PI * 2 * twist;
    const width = 0.8 * scale * Math.sin(t * Math.PI);
    const lengthPos = t * 3.5 * scale;
    
    const curlAngle = u + curlAxis * t * Math.PI * 0.6;
    const radius = lengthPos * 0.15;
    
    const x = Math.cos(curlAngle) * radius;
    const y = lengthPos;
    const z = Math.sin(curlAngle) * radius;
    
    const jitter = 0.08 * scale * rng();
    verts.push(new THREE.Vector3(
      x + width * Math.cos(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5),
      y + jitter * (rng()-0.5),
      z + width * Math.sin(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5)
    ));
    verts.push(new THREE.Vector3(
      x - width * Math.cos(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5),
      y + jitter * (rng()-0.5),
      z - width * Math.sin(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5)
    ));
  }
  
  return verts;
}

function buildLeafCluster(){
  const allVerts = [];
  const centerY = 0;
  
  const arrangements = [
    { scale: 1.2, twist: 1.8, curl: 1.0, rot: 0, offset: new THREE.Vector3(-1.5, centerY, 0.8) },
    { scale: 1.0, twist: 2.2, curl: -1.0, rot: Math.PI*0.4, offset: new THREE.Vector3(1.2, centerY+0.5, -0.6) },
    { scale: 0.9, twist: 1.5, curl: 0.5, rot: Math.PI*0.8, offset: new THREE.Vector3(0.3, centerY-0.8, 1.4) },
    { scale: 1.1, twist: 2.0, curl: -0.7, rot: Math.PI*1.2, offset: new THREE.Vector3(-0.8, centerY+1.2, -1.2) },
    { scale: 0.85, twist: 1.6, curl: 0.8, rot: Math.PI*1.6, offset: new THREE.Vector3(1.8, centerY-0.4, 0.4) },
    { scale: 1.05, twist: 2.4, curl: -0.6, rot: Math.PI*2.0, offset: new THREE.Vector3(-1.0, centerY+0.8, 1.8) },
    { scale: 0.95, twist: 1.9, curl: 1.2, rot: Math.PI*2.4, offset: new THREE.Vector3(0.6, centerY-1.0, -1.6) },
    { scale: 0.88, twist: 2.1, curl: -0.9, rot: Math.PI*2.8, offset: new THREE.Vector3(2.0, centerY+0.2, 1.0) },
  ];
  
  for (const cfg of arrangements){
    const leafVerts = createLeafTwirl(cfg.scale, cfg.twist, cfg.curl, Math.floor(cfg.rot * 1000));
    const quat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), cfg.rot);
    for (const v of leafVerts){
      v.applyQuaternion(quat);
      v.add(cfg.offset);
      allVerts.push(v);
    }
  }
  
  return allVerts;
}

function buildParticles(verts, totalN){
  const positions = new Float32Array(totalN * 3);
  const seeds = new Float32Array(totalN);
  const shyZones = new Float32Array(totalN);
  
  for (let i = 0; i < totalN; i++){
    const v = verts[Math.floor(Math.random() * verts.length)].clone();
    const jitter = 0.15;
    v.x += (Math.random() - 0.5) * jitter;
    v.y += (Math.random() - 0.5) * jitter;
    v.z += (Math.random() - 0.5) * jitter;
    
    positions[i*3] = v.x;
    positions[i*3+1] = v.y;
    positions[i*3+2] = v.z;
    seeds[i] = Math.random();
    
    const dist = v.length();
    const angle = Math.atan2(v.z, v.x);
    const zone1 = Math.abs(angle - Math.PI*0.25) < 0.6 && dist < 3.5 ? 1.0 : 0.0;
    const zone2 = Math.abs(angle - Math.PI*1.2) < 0.7 && dist > 2.0 ? 1.0 : 0.0;
    const zone3 = v.y > 2.0 && Math.abs(v.x) < 1.2 ? 1.0 : 0.0;
    const zone4 = v.y < -1.5 && dist < 2.8 ? 1.0 : 0.0;
    shyZones[i] = Math.max(zone1, zone2, zone3, zone4);
  }
  
  return { positions, seeds, shyZones };
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.08);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.8, 35);
camera.position.set(8, 3, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.target.set(0, 0, 0);

const N = 80000;
const leafVerts = buildLeafCluster();
const { positions, seeds, shyZones } = buildParticles(leafVerts, N);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('shyZone', new THREE.BufferAttribute(shyZones, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCamPos: { value: camera.position.clone() },
  uFogDensity: { value: 0.08 },
  uFogColor: { value: new THREE.Color(0x0a0908) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec3 uCamPos;
    uniform float uFogDensity;
    attribute float seed;
    attribute float shyZone;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    
    void main(){
      vec3 p = position;
      
      float drift = uTime * 0.08 + seed * 6.28;
      p.x += 0.15 * sin(drift * 0.4 + p.y * 0.2);
      p.z += 0.12 * cos(drift * 0.5 + p.y * 0.3);
      p.y += 0.08 * sin(drift * 0.6);
      
      vec3 camDir = normalize(uCamPos - p);
      float distToCam = distance(uCamPos, p);
      
      float shyFade = 1.0;
      if (shyZone > 0.5){
        float approachDist = smoothstep(10.0, 5.0, distToCam);
        shyFade = 1.0 - approachDist * 0.85;
      }
      
      float viewAngle = dot(camDir, normalize(p));
      float occlusion = smoothstep(-0.3, 0.5, viewAngle);
      
      float layerFog = smoothstep(12.0, 18.0, distToCam) * 0.7;
      float nearClip = smoothstep(1.2, 2.5, distToCam);
      
      vec3 amber = vec3(0.82, 0.62, 0.38);
      vec3 ochre = vec3(0.68, 0.48, 0.28);
      vec3 sienna = vec3(0.52, 0.36, 0.24);
      vec3 rust = vec3(0.58, 0.32, 0.18);
      
      float energyPhase = seed * 6.28 + uTime * 0.3;
      float energy = 0.5 + 0.5 * sin(energyPhase);
      
      vec3 col = mix(sienna, amber, energy);
      col = mix(col, ochre, shyZone * 0.4);
      col = mix(col, rust, (1.0 - nearClip) * 0.3);
      
      vCol = col;
      
      float baseAlpha = 0.6 + 0.3 * energy;
      baseAlpha *= shyFade;
      baseAlpha *= occlusion;
      baseAlpha *= (1.0 - layerFog);
      baseAlpha *= nearClip;
      vAlpha = baseAlpha;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vFogFactor = 1.0 - exp(-uFogDensity * dist * dist * 0.15);
      
      gl_PointSize = (1.2 + 0.5 * energy) * uPixel * (38.0 / max(1.0, dist));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float core = exp(-r * 14.0);
      float a = core * vAlpha;
      
      vec3 col = mix(vCol, uFogColor, vFogFactor * 0.5);
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

geom.computeBoundingSphere();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  uniforms.uCamPos.value.copy(camera.position);
  
  const fogBreathing = 0.08 + 0.03 * Math.sin(elapsed * 0.15);
  uniforms.uFogDensity.value = fogBreathing;
  scene.fog.density = fogBreathing;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
