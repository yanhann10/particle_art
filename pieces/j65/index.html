<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j65 · Human Unreadable (hash-seeded choreography)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0808; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .seed { position:fixed; right:14px; bottom:12px; opacity:0.35; font-size: 9px; letter-spacing: 0.03em; font-family: ui-monospace; }
</style>
</head>
<body>
<!-- MOTION: sway, intensity: gentle -->
<div class="id">j65 · human unreadable</div>
<div class="hint">hash-seeded choreography · 8 figures · provably derived motion</div>
<div class="seed" id="seedDisplay"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Cryptographic seed → deterministic choreography. Each figure is a skeleton of 12 joints
// whose motion is spring-coupled oscillators seeded from 256-bit hash. No random() calls.
// Ref: Operator · Metaversal Generative Art (Lumen Prize 2023).

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0808, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 35);
camera.lookAt(0, 6, 0);

// ---- PRNG seeded from 256-bit hex ----
class SeededRNG {
  constructor(seedHex) {
    this.state = [];
    for (let i = 0; i < 64; i += 8) {
      this.state.push(parseInt(seedHex.substr(i, 8), 16) >>> 0);
    }
    this.idx = 0;
  }
  next() {
    // xorshift128+
    let s1 = this.state[this.idx];
    const s0 = this.state[this.idx = (this.idx + 1) & 7];
    s1 ^= s1 << 23;
    s1 ^= s1 >>> 17;
    s1 ^= s0;
    s1 ^= s0 >>> 26;
    this.state[this.idx] = s1;
    return ((s1 + s0) >>> 0) / 0x100000000;
  }
}

// generate cryptographic-looking seed (in production this would be an actual hash)
function genSeed() {
  let s = '';
  const hex = '0123456789abcdef';
  for (let i = 0; i < 64; i++) s += hex[Math.floor(Math.random() * 16)];
  return s;
}

const SEED = genSeed();
document.getElementById('seedDisplay').textContent = `seed: ${SEED.substr(0,16)}…`;
const rng = new SeededRNG(SEED);

// ---- Figure skeleton: 12 joints ----
// pelvis → spine → neck → head
// shoulders L/R → elbows L/R → wrists L/R
// hips L/R → knees L/R → ankles L/R
const JOINT_COUNT = 12;
const FIGURE_COUNT = 8;

class Figure {
  constructor(rng, idx) {
    // base position in a shallow arc across stage
    const t = (idx / (FIGURE_COUNT - 1)) * 0.8 + 0.1;
    const angle = (t - 0.5) * Math.PI * 0.5;
    this.baseX = Math.sin(angle) * 14.0;
    this.baseY = 0.0;
    this.baseZ = Math.cos(angle) * 6.0 - 2.0;

    // each joint = oscillator: {phase, freq, amp, offset}
    this.joints = [];
    for (let j = 0; j < JOINT_COUNT; j++) {
      this.joints.push({
        phase: rng.next() * Math.PI * 2,
        freqX: 0.4 + rng.next() * 0.6,
        freqY: 0.3 + rng.next() * 0.5,
        freqZ: 0.35 + rng.next() * 0.55,
        ampX: (rng.next() - 0.5) * 1.2,
        ampY: (rng.next() - 0.5) * 0.9,
        ampZ: (rng.next() - 0.5) * 1.1,
        offsetX: (rng.next() - 0.5) * 1.5,
        offsetY: rng.next() * 6.0,
        offsetZ: (rng.next() - 0.5) * 1.0
      });
    }

    // skeleton topology: pairs [parent, child] defining bones
    this.bones = [
      [0,1],[1,2],[2,3],     // spine
      [2,4],[4,5],[5,6],     // left arm
      [2,7],[7,8],[8,9],     // right arm
      [0,10],[0,11]          // legs (simplified)
    ];

    // point geometry
    const geom = new THREE.BufferGeometry();
    const posArr = new Float32Array(JOINT_COUNT * 3);
    geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const mat = new THREE.PointsMaterial({
      size: 3.5 * renderer.getPixelRatio(),
      color: 0xf4d8a8,
      transparent: true,
      opacity: 0.85,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.pointsMesh = new THREE.Points(geom, mat);
    scene.add(this.pointsMesh);

    // line geometry for bones
    const lineGeom = new THREE.BufferGeometry();
    const linePos = new Float32Array(this.bones.length * 2 * 3);
    lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
    const lineMat = new THREE.LineBasicMaterial({
      color: 0xe8b870,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    this.linesMesh = new THREE.LineSegments(lineGeom, lineMat);
    scene.add(this.linesMesh);
  }

  update(t) {
    const posArr = this.pointsMesh.geometry.attributes.position.array;
    for (let j = 0; j < JOINT_COUNT; j++) {
      const osc = this.joints[j];
      const px = this.baseX + osc.offsetX + Math.sin(t * osc.freqX + osc.phase) * osc.ampX;
      const py = this.baseY + osc.offsetY + Math.sin(t * osc.freqY + osc.phase) * osc.ampY;
      const pz = this.baseZ + osc.offsetZ + Math.sin(t * osc.freqZ + osc.phase) * osc.ampZ;
      posArr[j*3]   = px;
      posArr[j*3+1] = py;
      posArr[j*3+2] = pz;
    }
    this.pointsMesh.geometry.attributes.position.needsUpdate = true;

    // update bone lines
    const linePos = this.linesMesh.geometry.attributes.position.array;
    for (let b = 0; b < this.bones.length; b++) {
      const [i0, i1] = this.bones[b];
      linePos[b*6]   = posArr[i0*3];
      linePos[b*6+1] = posArr[i0*3+1];
      linePos[b*6+2] = posArr[i0*3+2];
      linePos[b*6+3] = posArr[i1*3];
      linePos[b*6+4] = posArr[i1*3+1];
      linePos[b*6+5] = posArr[i1*3+2];
    }
    this.linesMesh.geometry.attributes.position.needsUpdate = true;
  }
}

const figures = [];
for (let i = 0; i < FIGURE_COUNT; i++) {
  figures.push(new Figure(rng, i));
}

// stage cyclorama gradient (warm amber → deep rust)
const bgGradient = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 50),
  new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main(){
        float t = vUv.y;
        vec3 top = vec3(0.08, 0.06, 0.05);
        vec3 mid = vec3(0.18, 0.10, 0.06);
        vec3 bot = vec3(0.32, 0.16, 0.08);
        vec3 col = mix(bot, mid, smoothstep(0.0, 0.5, t));
        col = mix(col, top, smoothstep(0.5, 1.0, t));
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
bgGradient.position.set(0, 6, -12);
scene.add(bgGradient);

// subtle ambient + key light
scene.add(new THREE.AmbientLight(0x1a1512, 0.4));
const key = new THREE.DirectionalLight(0xf4d8a8, 0.6);
key.position.set(-10, 15, 8);
scene.add(key);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let startTime = performance.now();
function loop() {
  const elapsed = (performance.now() - startTime) / 1000;

  // update all figures
  for (const fig of figures) {
    fig.update(elapsed);
  }

  // gentle camera sway
  camera.position.x = Math.sin(elapsed * 0.08) * 3.5;
  camera.position.y = 8 + Math.sin(elapsed * 0.12) * 1.2;
  camera.lookAt(0, 6, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
