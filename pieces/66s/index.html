<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>66s · moonbow coral</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#070a09; overflow:hidden;
               color:#dde6d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">66s</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">differential growth · moonbow (atmospheric optics)</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a09, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const MAX_VERTS = 4000;
const ATTRACT   = 0.06;
const REPEL_R   = 0.42;
const REPEL_STR = 0.12;
const NOISE     = 0.003;
const PRESSURE  = 0.0035;
const MAX_D     = 0.32;

const verts = [];
const NV0 = 24;
for (let i = 0; i < NV0; i++){
  const th = i / NV0 * Math.PI * 2;
  const r  = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, z: Math.sin(th) * r, y: 0, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z){ return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const arr = grid.get((cx+dx) + ',' + (cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = gridNeighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex*ex + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i - 1 + n) % n];
    const b = verts[(i + 1) % n];
    const v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0006;
    verts[i].y = -Math.min(verts[i].age * 0.6, 1.4);
  }

  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex*ex + ez*ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5,
                   y: (a.y + b.y) * 0.5, age: Math.max(a.age, b.age) * 0.85 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// rendering
const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
const rAngle     = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('angle',    new THREE.BufferAttribute(rAngle, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBow:   { value: 0 },       // 0..1 moonbow intensity
  uBowAngle: { value: 0 }     // sweep angle of the moonbow arc
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBow;
    uniform float uBowAngle;
    attribute float seed;
    attribute float age;
    attribute float angle;
    varying vec3 vCol;
    varying float vAlpha;

    // spectral rainbow via smooth HSV-like ramp
    vec3 spectral(float t){
      vec3 a = vec3(0.5); vec3 b = vec3(0.5);
      vec3 c = vec3(1.0); vec3 d = vec3(0.0, 0.33, 0.67);
      return a + b * cos(6.28318 * (c * t + d));
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      p += 0.005 * vec3(sin(t), 0.0, cos(t));

      // base coral palette: algae → coral red → bone
      vec3 colA = vec3(0.50, 0.90, 0.62);
      vec3 colB = vec3(0.95, 0.42, 0.38);
      vec3 colC = vec3(0.92, 0.88, 0.78);
      float k = clamp(age * 0.8, 0.0, 1.0);
      vec3 base = mix(colA, colB, k);
      base = mix(base, colC, smoothstep(0.85, 1.0, k) * 0.4);

      // moonbow surprise: a spectral arc that sweeps through
      // particles near a specific angular band get prismatic color
      float angDiff = mod(angle - uBowAngle + 3.14159, 6.28318) - 3.14159;
      float arcWidth = 0.45;
      float bowHit = smoothstep(arcWidth, 0.0, abs(angDiff));
      // the spectral color is mapped by the particle's angle within the arc
      float spectralT = (angDiff / arcWidth) * 0.5 + 0.5;
      vec3 rainbow = spectral(spectralT * 0.8 + 0.1);
      // desaturate slightly so it stays tasteful
      rainbow = mix(rainbow, vec3(dot(rainbow, vec3(0.299, 0.587, 0.114))), 0.15);

      float bowStr = uBow * bowHit;
      vCol = mix(base, rainbow, bowStr * 0.7);
      // slight brightness boost during moonbow
      vCol += rainbow * bowStr * 0.25;
      vAlpha = 0.65 + bowStr * 0.2;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // particles in the moonbow arc get slightly larger
      float sizeBoost = 1.0 + bowStr * 0.5;
      gl_PointSize = 1.4 * uPixel * (40.0 / dist) * sizeBoost;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 600; s++) step();

// moonbow timing state
let bowPhase = 0;       // 0 = waiting, 1 = rising, 2 = sweeping, 3 = fading
let bowTimer = 0;
let bowNext  = 8 + Math.random() * 4;  // first moonbow in 8-12s
let bowSweepStart = 0;
const BOW_RISE   = 0.8;   // seconds to fade in
const BOW_SWEEP  = 3.0;   // seconds the arc sweeps ~180°
const BOW_FADE   = 1.2;   // seconds to fade out
const BOW_SPEED  = Math.PI / BOW_SWEEP;  // radians per second

const statEl = document.getElementById('stat');
const start = performance.now();
let lastT = 0;

function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  uniforms.uTime.value = t;

  // moonbow state machine
  bowTimer += dt;
  if (bowPhase === 0 && bowTimer > bowNext){
    bowPhase = 1; bowTimer = 0;
    bowSweepStart = Math.random() * Math.PI * 2;
    uniforms.uBowAngle.value = bowSweepStart;
  }
  if (bowPhase === 1){
    uniforms.uBow.value = Math.min(bowTimer / BOW_RISE, 1.0);
    if (bowTimer >= BOW_RISE){ bowPhase = 2; bowTimer = 0; }
  }
  if (bowPhase === 2){
    uniforms.uBow.value = 1.0;
    uniforms.uBowAngle.value = bowSweepStart + bowTimer * BOW_SPEED;
    if (bowTimer >= BOW_SWEEP){ bowPhase = 3; bowTimer = 0; }
  }
  if (bowPhase === 3){
    uniforms.uBow.value = Math.max(1.0 - bowTimer / BOW_FADE, 0.0);
    if (bowTimer >= BOW_FADE){
      bowPhase = 0; bowTimer = 0;
      bowNext = 7 + Math.random() * 5;
      uniforms.uBow.value = 0;
    }
  }

  for (let s = 0; s < 4; s++) step();

  // compute centroid for camera tracking
  const n = verts.length;
  let cenX = 0, cenY = 0, cenZ = 0;
  for (let i = 0; i < n; i++){
    cenX += verts[i].x; cenY += verts[i].y; cenZ += verts[i].z;
  }
  cenX /= n; cenY /= n; cenZ /= n;
  // smooth camera target toward centroid
  controls.target.lerp(new THREE.Vector3(cenX, cenY, cenZ), 0.02);

  // distribute particles along polyline
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    const L = Math.sqrt(ex*ex + ez*ez + ey*ey);
    lengths.push(L); total += L;
  }
  if (total > 0){
    let written = 0;
    for (let i = 0; i < n; i++){
      const share = (i === n - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[(i + 1) % n];
      for (let k = 0; k < share && written < N_RENDER; k++){
        const u = Math.random();
        const px = a.x + (b.x - a.x) * u + (Math.random()-0.5) * 0.02;
        const pz = a.z + (b.z - a.z) * u + (Math.random()-0.5) * 0.02;
        rPositions[written*3]   = px;
        rPositions[written*3+1] = a.y + (b.y - a.y) * u;
        rPositions[written*3+2] = pz;
        rAge[written] = Math.max(a.age, b.age);
        // angle from centroid — used by moonbow arc
        rAngle[written] = Math.atan2(pz - cenZ, px - cenX);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.angle.needsUpdate = true;
  }

  const bowActive = bowPhase > 0;
  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}${bowActive ? ' · moonbow' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
