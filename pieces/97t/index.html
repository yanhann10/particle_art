<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: ascend, intensity: gentle -->
<title>97t · differential growth · 3D upward tower</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080b; overflow:hidden;
               color:#dde6d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">97t</div>
<div class="stat" id="stat">vertices=0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Ambient-only mutation of 5gm: no user input, camera orbits autonomously
// while the differential-growth tower ascends. The camera breathes — slow
// elliptical orbit with altitude tracking the centroid, gentle radius
// oscillation so framing shifts between intimate and architectural.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06080b, 0.038);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080b, 1);
document.body.appendChild(renderer.domElement);

// ─────────────────────────── curve state (full 3D)
const MAX_VERTS = 4000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE = 0.0028;
const RISE     = 0.0045;
const MAX_D    = 0.32;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, y, z){
  return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL);
}
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = gridKey(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++)
    for (let dy=-1; dy<=1; dy++)
      for (let dz=-1; dz<=1; dz++){
        const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if (arr) for (const idx of arr) out.push(idx);
      }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x: (a.x+b.x)*0.5,
        y: (a.y+b.y)*0.5 - 0.05,
        z: (a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-warm
for (let s = 0; s < 800; s++) step();

// ─────────────────────────── rendering
const N_RENDER = 50000;
const rPos = new Float32Array(N_RENDER * 3);
const rSeed = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
const rHeight = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeed[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeed, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('hgt',      new THREE.BufferAttribute(rHeight, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uYMax: { value: 1 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    attribute float seed;
    attribute float age;
    attribute float hgt;
    varying vec3 vCol;
    varying float vH;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      p.x += 0.005 * sin(t);
      p.z += 0.005 * cos(t);

      vH = clamp(hgt / max(uYMax, 0.5), 0.0, 1.0);
      vec3 a = vec3(0.42, 0.86, 0.55);
      vec3 b = vec3(0.95, 0.40, 0.38);
      vec3 c = vec3(0.94, 0.92, 0.84);
      vec3 col = mix(a, b, smoothstep(0.0, 0.55, vH));
      col = mix(col, c, smoothstep(0.55, 1.0, vH));
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.4 * uPixel * (40.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vH;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * 0.62;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────────────────────── autonomous camera orbit
// Slow elliptical orbit with breathing radius. Camera altitude tracks
// the tower centroid so the form stays centered as it ascends.
const CAM_BASE_RADIUS = 14;
const CAM_RADIUS_BREATH = 3;       // oscillation amplitude
const CAM_ORBIT_SPEED = 0.04;      // radians per second — ~2.6 min full revolution
const CAM_BREATH_SPEED = 0.017;    // radius oscillation period ~6 min
const CAM_ELLIPSE = 0.7;           // z-axis squeeze for elliptical path

const statEl = document.getElementById('stat');
const start = performance.now();

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  for (let s = 0; s < 3; s++) step();

  // distribute render particles along polyline
  const n = verts.length;
  let yMax = 0;
  if (n > 1){
    const lengths = []; let total = 0;
    for (let i = 0; i < n; i++){
      const a = verts[i], b = verts[(i+1)%n];
      const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
      const L = Math.sqrt(ex*ex + ey*ey + ez*ez);
      lengths.push(L); total += L;
      if (a.y > yMax) yMax = a.y;
    }
    if (total > 0){
      let written = 0;
      for (let i = 0; i < n; i++){
        const share = (i === n - 1) ? N_RENDER - written : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
        const a = verts[i], b = verts[(i+1)%n];
        for (let k = 0; k < share && written < N_RENDER; k++){
          const u = Math.random();
          rPos[written*3]   = a.x + (b.x-a.x)*u + (Math.random()-0.5)*0.018;
          rPos[written*3+1] = a.y + (b.y-a.y)*u + (Math.random()-0.5)*0.018;
          rPos[written*3+2] = a.z + (b.z-a.z)*u + (Math.random()-0.5)*0.018;
          rAge[written]    = Math.max(a.age, b.age);
          rHeight[written] = a.y + (b.y-a.y)*u;
          written++;
        }
      }
      geom.attributes.position.needsUpdate = true;
      geom.attributes.age.needsUpdate = true;
      geom.attributes.hgt.needsUpdate = true;
    }
  }
  uniforms.uYMax.value = Math.max(yMax, 1.0);

  // compute centroid for camera tracking
  let xMean = 0, yMean = 0, zMean = 0;
  if (n > 0){
    for (let i = 0; i < n; i++){
      xMean += verts[i].x; yMean += verts[i].y; zMean += verts[i].z;
    }
    xMean /= n; yMean /= n; zMean /= n;
  }
  const targetY = Math.max(yMean, 2.0);

  // autonomous orbit
  const angle = elapsed * CAM_ORBIT_SPEED;
  const radius = CAM_BASE_RADIUS + Math.sin(elapsed * CAM_BREATH_SPEED) * CAM_RADIUS_BREATH;
  const camX = xMean + Math.cos(angle) * radius;
  const camZ = zMean + Math.sin(angle) * radius * CAM_ELLIPSE;
  const camY = targetY + 4 + Math.sin(elapsed * 0.023) * 1.5; // gentle vertical sway

  // smooth camera position
  camera.position.x += (camX - camera.position.x) * 0.025;
  camera.position.y += (camY - camera.position.y) * 0.025;
  camera.position.z += (camZ - camera.position.z) * 0.025;
  camera.lookAt(xMean, targetY, zMean);

  statEl.textContent = `vertices=${n} · height=${yMax.toFixed(1)}`;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
