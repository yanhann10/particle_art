<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: morph, intensity: gentle -->
<title>h5q · ancestral drift</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a08; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">h5q</div>
<div class="hint">drag to orbit · faces drift between generations</div>
<div class="src">Nouf Aljowaysir · Ana Min Wein · F. Gonzalez-Torres tenderness</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*
  Ancestral Drift — Nouf Aljowaysir meets Felix Gonzalez-Torres
  
  A point-cloud portrait morphs between three generational anchors
  (great-grandparent → grandparent → self). Each particle is a small
  leaf that drifts toward its target with individual lag — memory
  catching up to the present. The in-between frames are the truth.
  
  Palette: sepia, dried rose, ink wash, warm cream.
  Tenderness: slow morph, soft edges, no spectacle.
  Leaf as basic unit: each particle rendered as a tiny leaf shape.
*/

const BG = 0x0d0a08;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0, 0);

// --- Generate 3 ancestral face point clouds ---
// Parametric face: oval + nose ridge + eye hollows + mouth + cheekbones
// Each generation has slightly different proportions

function generateFace(params, N) {
  const { headW, headH, headD, eyeSpread, eyeY, noseLen, mouthW, mouthY, jawW, browY } = params;
  const pts = [];
  const rng = mulberry32(params.seed);

  // head surface - sample on ellipsoid with feature density bias
  for (let i = 0; i < N; i++) {
    const u = rng() * Math.PI * 2;
    const v = (rng() - 0.5) * Math.PI;
    let r = 1.0;

    // base ellipsoid
    let x = Math.cos(v) * Math.sin(u) * headW;
    let y = Math.sin(v) * headH + 0.2;
    let z = Math.cos(v) * Math.cos(u) * headD;

    // only keep front-facing points (z > -0.3) for portrait feel
    if (z < -headD * 0.2) {
      z = -headD * 0.2 + rng() * 0.1;
      x *= 0.7;
    }

    // feature density: cluster more points near eyes, nose, mouth
    const featureChoice = rng();
    if (featureChoice < 0.15) {
      // left eye region
      x = -eyeSpread + (rng() - 0.5) * 0.35;
      y = eyeY + (rng() - 0.5) * 0.2;
      z = headD * 0.85 + rng() * 0.1;
    } else if (featureChoice < 0.30) {
      // right eye region
      x = eyeSpread + (rng() - 0.5) * 0.35;
      y = eyeY + (rng() - 0.5) * 0.2;
      z = headD * 0.85 + rng() * 0.1;
    } else if (featureChoice < 0.40) {
      // nose
      x = (rng() - 0.5) * 0.15;
      y = eyeY - 0.3 - rng() * noseLen;
      z = headD * 0.9 + rng() * 0.25;
    } else if (featureChoice < 0.50) {
      // mouth
      x = (rng() - 0.5) * mouthW;
      y = mouthY + (rng() - 0.5) * 0.15;
      z = headD * 0.8 + rng() * 0.08;
    } else if (featureChoice < 0.58) {
      // jaw line
      const jt = rng() * Math.PI;
      x = Math.cos(jt) * jawW;
      y = -headH * 0.7 + (rng() - 0.5) * 0.2;
      z = Math.sin(jt) * headD * 0.6;
    } else if (featureChoice < 0.64) {
      // brow ridge
      x = (rng() - 0.5) * eyeSpread * 2.5;
      y = browY + (rng() - 0.5) * 0.1;
      z = headD * 0.88 + rng() * 0.05;
    }

    pts.push(x, y, z);
  }
  return new Float32Array(pts);
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const N_PARTICLES = 36000;

// Three generations — subtle proportion shifts
const faces = [
  generateFace({ seed: 7331, headW: 1.95, headH: 2.6, headD: 1.5, eyeSpread: 0.6, eyeY: 0.45, noseLen: 0.7, mouthW: 0.55, mouthY: -0.75, jawW: 1.6, browY: 0.75 }, N_PARTICLES),
  generateFace({ seed: 1994, headW: 1.8, headH: 2.45, headD: 1.45, eyeSpread: 0.55, eyeY: 0.5, noseLen: 0.6, mouthW: 0.5, mouthY: -0.7, jawW: 1.45, browY: 0.8 }, N_PARTICLES),
  generateFace({ seed: 2023, headW: 1.7, headH: 2.35, headD: 1.4, eyeSpread: 0.52, eyeY: 0.48, noseLen: 0.55, mouthW: 0.48, mouthY: -0.65, jawW: 1.35, browY: 0.78 }, N_PARTICLES),
];

// Per-particle lag (how slowly each catches up to its target)
const lags = new Float32Array(N_PARTICLES);
const seeds = new Float32Array(N_PARTICLES);
const leafAngles = new Float32Array(N_PARTICLES);
for (let i = 0; i < N_PARTICLES; i++) {
  lags[i] = 0.003 + Math.random() * 0.018; // varied response time
  seeds[i] = Math.random();
  leafAngles[i] = Math.random() * Math.PI * 2;
}

// Current positions start at first face
const currentPos = new Float32Array(N_PARTICLES * 3);
currentPos.set(faces[0]);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('leafAngle', new THREE.BufferAttribute(leafAngles, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMorphPhase: { value: 0 },
  uFogColor: { value: new THREE.Color(BG) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMorphPhase;
    attribute float seed;
    attribute float leafAngle;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      // gentle per-particle drift — breath-like
      float t = uTime * 0.15 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 3.0) * 0.012;
      p.y += cos(t * 0.9 + seed * 5.0) * 0.008;
      p.z += sin(t * 0.7 + seed * 2.0) * 0.006;

      // palette: sepia → dried rose → ink → warm cream
      // interpolate based on morph phase and per-particle seed
      vec3 sepia  = vec3(0.56, 0.42, 0.24);  // #8F6B3D
      vec3 rose   = vec3(0.77, 0.46, 0.42);  // #C4756B
      vec3 ink    = vec3(0.18, 0.17, 0.23);  // #2D2B3A
      vec3 cream  = vec3(0.96, 0.90, 0.82);  // #F5E6D1
      vec3 blush  = vec3(0.85, 0.62, 0.55);  // warm mid

      float k = fract(seed * 7.13 + uMorphPhase * 0.3);
      vec3 col;
      if (k < 0.3) col = mix(sepia, cream, k / 0.3);
      else if (k < 0.55) col = mix(cream, rose, (k - 0.3) / 0.25);
      else if (k < 0.8) col = mix(rose, blush, (k - 0.55) / 0.25);
      else col = mix(blush, sepia, (k - 0.8) / 0.2);

      // particles in transition glow slightly brighter
      float transition = sin(uMorphPhase * 3.14159) * 0.15;
      vCol = col * (0.85 + transition);

      // alpha varies — denser at features, softer at edges
      vAlpha = 0.4 + 0.25 * sin(seed * 43.7 + uTime * 0.2);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // leaf-sized particles
      gl_PointSize = (1.6 + seed * 0.8) * uPixel * (38.0 / dist);
      gl_Position = projectionMatrix * mv;

      vLeafAngle = leafAngle + uTime * 0.05 * (seed - 0.5);

      // distance fog
      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-0.008 * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      // rotate to leaf angle
      float c = cos(vLeafAngle), s = sin(vLeafAngle);
      vec2 ruv = vec2(uv.x * c - uv.y * s, uv.x * s + uv.y * c);

      // leaf shape: ellipse pinched at ends
      float lx = ruv.x * 2.2;
      float ly = ruv.y * 3.5;
      float leaf = lx * lx + ly * ly + abs(lx) * abs(ly) * 0.5;
      if (leaf > 1.0) discard;

      // soft falloff
      float a = (1.0 - leaf) * vAlpha;

      // subtle vein (center line)
      float vein = exp(-abs(ruv.x) * 40.0) * 0.15;
      vec3 col = vCol + vein;

      // fog
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.7);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// subtle ambient dust — atmosphere
const dustN = 800;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 12;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 10;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
}
const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0x8a7560, size: 0.02, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(dustGeom, dustMat));

// background gradient — warm above, dark below (not empty void)
const bgGeom = new THREE.PlaneGeometry(60, 60);
const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float y = vUv.y;
      vec3 top = vec3(0.08, 0.06, 0.05);
      vec3 bot = vec3(0.04, 0.03, 0.03);
      vec3 col = mix(bot, top, y);
      // subtle warm vignette
      float vig = 1.0 - length(vUv - 0.5) * 0.6;
      col *= vig;
      gl_FragColor = vec4(col, 0.4);
    }
  `
});
const bgPlane = new THREE.Mesh(bgGeom, bgMat);
bgPlane.position.z = -8;
scene.add(bgPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let morphTime = 0;
let currentFaceIdx = 0;
let nextFaceIdx = 1;
let morphProgress = 0;
const MORPH_DURATION = 12; // seconds per transition
const HOLD_DURATION = 5;  // seconds to hold a face
let holdTimer = 0;
let morphing = false;

function loop() {
  const t = (performance.now() - start) / 1000;
  const dt = 1 / 60;
  uniforms.uTime.value = t;

  // morph state machine
  if (!morphing) {
    holdTimer += dt;
    if (holdTimer > HOLD_DURATION) {
      morphing = true;
      holdTimer = 0;
      nextFaceIdx = (currentFaceIdx + 1) % faces.length;
      morphProgress = 0;
    }
  } else {
    morphProgress += dt / MORPH_DURATION;
    if (morphProgress >= 1) {
      morphProgress = 1;
      morphing = false;
      currentFaceIdx = nextFaceIdx;
      holdTimer = 0;
    }
  }

  uniforms.uMorphPhase.value = morphing ? morphProgress : 0;

  // update particle positions — each drifts toward target with its own lag
  const src = faces[currentFaceIdx];
  const dst = faces[nextFaceIdx];
  const phase = morphing ? morphProgress : 0;

  for (let i = 0; i < N_PARTICLES; i++) {
    const i3 = i * 3;
    // target: lerp between current and next face
    const tx = src[i3] + (dst[i3] - src[i3]) * phase;
    const ty = src[i3 + 1] + (dst[i3 + 1] - src[i3 + 1]) * phase;
    const tz = src[i3 + 2] + (dst[i3 + 2] - src[i3 + 2]) * phase;

    // ease toward target with per-particle lag
    const lag = lags[i];
    currentPos[i3] += (tx - currentPos[i3]) * lag;
    currentPos[i3 + 1] += (ty - currentPos[i3 + 1]) * lag;
    currentPos[i3 + 2] += (tz - currentPos[i3 + 2]) * lag;
  }
  geom.attributes.position.needsUpdate = true;

  // camera gentle breathing
  const breathX = Math.sin(t * 0.08) * 0.15;
  const breathY = Math.cos(t * 0.06) * 0.1;
  controls.target.set(breathX, breathY, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
