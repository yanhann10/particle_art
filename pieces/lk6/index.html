<style>

<body>
<div class="id">lk6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// COLOR SYSTEM: bioluminescent-body — deep viridian (dark organic trunk/body, ~60%) +
// electric lime (growing tips and high-velocity zones, ~30%) +
// near-white seafoam (maximum velocity / beat-flash apex, ~10%).
// Hierarchy: dark root mass → lit edge growth → white-flash tension point.
// Background: pure void black. No rave scatter — every hue earns its place.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 10);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// ── AUDIO ANALYSIS (mic if granted) ──
let audioLevel = 0, bassLevel = 0;
let analyser = null, freqData = null;
async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(e) { /* no mic — visual-only mode */ }
}
initAudio();

function updateAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let sum = 0, bassSum = 0;
  for (let i = 0; i < freqData.length; i++) {
    sum += freqData[i];
    if (i < 8) bassSum += freqData[i];
  }
  audioLevel = sum / (freqData.length * 255);
  bassLevel = bassSum / (8 * 255);
}

// ── VASCULAR L-SYSTEM SKELETON ──
// Generates branching vein-like paths, particles distributed along them
const N = 80000;
const positions = new Float32Array(N * 3);
const basePositions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const branchIds = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildVascularField(seed) {
  const rng = mulberry32(seed >>> 0);

  // Generate L-system branches
  const branches = [];
  const maxDepth = 6;
  const branchLen = 1.2;

  function grow(x, y, z, angle, angleZ, depth, parentBranch) {
    if (depth > maxDepth) return;
    const len = branchLen * (1 - depth * 0.08) * (0.7 + rng() * 0.6);
    const steps = 12;
    const pts = [];
    let cx = x, cy = y, cz = z;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      // peristaltic curve along branch
      const wobble = Math.sin(t * Math.PI * 3 + rng() * 6.28) * 0.08 * (1 + depth * 0.3);
      cx = x + Math.cos(angle) * Math.cos(angleZ) * len * t + wobble * Math.sin(angle);
      cy = y + Math.sin(angleZ) * len * t + wobble * Math.cos(angleZ);
      cz = z + Math.sin(angle) * Math.cos(angleZ) * len * t + wobble * Math.cos(angle);
      pts.push({ x: cx, y: cy, z: cz });
    }
    branches.push({ pts, depth, idx: branches.length });

    // branch
    const nBranch = depth < 3 ? 2 + Math.floor(rng() * 2) : 1 + Math.floor(rng() * 2);
    for (let b = 0; b < nBranch; b++) {
      const spread = 0.4 + rng() * 0.5;
      const newAngle = angle + (rng() - 0.5) * spread * 2;
      const newAngleZ = angleZ + (rng() - 0.5) * spread;
      grow(cx, cy, cz, newAngle, newAngleZ, depth + 1, branches.length - 1);
    }
  }

  // Multiple root veins
  const nRoots = 3 + Math.floor(rng() * 3);
  for (let r = 0; r < nRoots; r++) {
    const a = rng() * Math.PI * 2;
    const az = (rng() - 0.5) * 1.2;
    grow(0, 0, 0, a, az, 0, -1);
  }

  // Distribute particles along branches
  let written = 0;
  const totalBranches = branches.length;

  while (written < N) {
    const bi = Math.floor(rng() * totalBranches);
    const branch = branches[bi];
    const pts = branch.pts;
    const pi = Math.floor(rng() * (pts.length - 1));
    const t = rng();
    const p0 = pts[pi], p1 = pts[Math.min(pi + 1, pts.length - 1)];

    // interpolate along segment + thickness scatter
    const thickness = 0.15 * (1 - branch.depth / (maxDepth + 1)) + 0.02;
    const scatter = (rng() - 0.5) * 2 * thickness;
    const scatter2 = (rng() - 0.5) * 2 * thickness;

    const x = p0.x + (p1.x - p0.x) * t + scatter;
    const y = p0.y + (p1.y - p0.y) * t + scatter2;
    const z = p0.z + (p1.z - p0.z) * t + (rng() - 0.5) * thickness;

    const i3 = written * 3;
    positions[i3] = basePositions[i3] = x;
    positions[i3+1] = basePositions[i3+1] = y;
    positions[i3+2] = basePositions[i3+2] = z;
    seeds[written] = rng();
    branchIds[written] = branch.depth / maxDepth;
    written++;
  }
}

buildVascularField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('branchId', new THREE.BufferAttribute(branchIds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBeat: { value: 0 },
  uBass: { value: 0 },
  uAudio: { value: 0 },
  uPointer: { value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBeat;
    uniform float uBass;
    uniform vec2 uPointer;
    attribute float seed;
    attribute float branchId;
    varying float vSeed;
    varying float vBranch;
    varying float vPulse;
    varying float vDepth;

    void main() {
      vec3 p = position;

      // PERISTALTIC PULSE — wave travels outward from center along branches
      float dist = length(p);
      float bpm = 2.6667; // ~160 BPM
      float pulsePhase = dist * 2.0 - uTime * bpm * 6.2832;
      float pulse = 0.5 + 0.5 * sign(sin(pulsePhase)); // square wave
      vPulse = pulse;

      // VASCULAR BREATHING — expansion/contraction cycles
      float breathe = sin(uTime * bpm * 0.5) * 0.15;
      p *= 1.0 + breathe * (1.0 - branchId);

      // Bass-reactive throb
      p *= 1.0 + uBass * 0.3;

      // Peristaltic displacement along radial direction
      vec3 radDir = normalize(p + 0.001);
      p += radDir * pulse * 0.06 * (1.0 + uBass * 0.5);

      // Pointer repulsion
      vec3 pointerWorld = vec3(uPointer * 4.0, 0.0);
      vec3 diff = p - pointerWorld;
      float d2 = dot(diff, diff);
      if (d2 < 4.0) {
        p += normalize(diff) * (2.0 - sqrt(d2)) * 0.3;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      vBranch = branchId;

      // Hard-edged size — no smooth falloff, snaps between states
      float sz = (1.8 + pulse * 1.2 + uBass * 2.0) * uPixel * (6.0 / max(vDepth, 1.0));
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSeed;
    varying float vBranch;
    varying float vPulse;
    varying float vDepth;
    uniform float uTime;
    uniform float uBeat;
    uniform float uBass;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);

      // HARD EDGE — no soft gaussian, square-wave brightness
      if (r2 > 0.20) discard;

      // COLOR HIERARCHY:
      // Primary   (~60%) — deep viridian #1A6B4A: dark organic trunk / body mass
      // Secondary (~30%) — electric lime #A8FF3E: growing tips, high-velocity edges
      // Highlight (~10%) — near-white seafoam #DFFFEC: beat flash, maximum tension
      vec3 viridian  = vec3(0.102, 0.420, 0.290); // #1A6B4A
      vec3 lime      = vec3(0.659, 1.000, 0.243); // #A8FF3E
      vec3 seafoam   = vec3(0.875, 1.000, 0.925); // #DFFFEC

      // branchId=0 → trunk (primary), branchId=1 → tip (secondary)
      // Blend: trunk stays viridian, tips push toward lime
      float tipness = smoothstep(0.0, 0.7, vBranch);
      vec3 col = mix(viridian, lime, tipness);

      // Highlight: only at pulse peak + beat flash — the rarest moment
      float beatFlash = uBeat * step(0.5, vPulse);
      col = mix(col, seafoam, beatFlash * 0.65);

      // Bass pushes tips brighter (lime blooms, not color-shift)
      col += lime * uBass * 0.25 * tipness;

      // Square-wave brightness snap on beat — keeps energy without hue chaos
      float snap = step(0.5, fract(uTime * 2.6667));
      col *= 0.75 + 0.45 * vPulse + 0.2 * snap;

      // Depth fog — pure dark, not tinted
      float fog = clamp((vDepth - 6.0) / 14.0, 0.0, 0.7);
      col = mix(col, vec3(0.0), fog);

      float alpha = (0.80 + 0.20 * vPulse) * (1.0 - fog * 0.5);
      gl_FragColor = vec4(col, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ── GLYPH PARTICLES — equation fragments scattering ──
// (sasha_stiles-inspired: text as co-material)
// Implemented as a second small particle system with sprite texture
const glyphCanvas = document.createElement('canvas');
glyphCanvas.width = 256; glyphCanvas.height = 256;
const gctx = glyphCanvas.getContext('2d');
const glyphs = '∂∇∫∮∞≡≢⊕⊗⊲⊳⧫◊◈⌬⏣⎔⟁⟐⦿⊜⌖'.split('');
gctx.fillStyle = '#000';
gctx.fillRect(0,0,256,256);
// 4x4 grid of glyphs
for (let gy = 0; gy < 4; gy++) {
  for (let gx = 0; gx < 4; gx++) {
    const idx = gy * 4 + gx;
    if (idx >= glyphs.length) break;
    gctx.fillStyle = '#fff';
    gctx.font = '48px ui-monospace, monospace';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    gctx.fillText(glyphs[idx], gx * 64 + 32, gy * 64 + 32);
  }
}
const glyphTex = new THREE.CanvasTexture(glyphCanvas);
glyphTex.minFilter = THREE.LinearFilter;

const N_GLYPH = 600;
const glyphGeom = new THREE.BufferGeometry();
const gPos = new Float32Array(N_GLYPH * 3);
const gSeed = new Float32Array(N_GLYPH);
for (let i = 0; i < N_GLYPH; i++) {
  gPos[i*3]   = (Math.random() - 0.5) * 10;
  gPos[i*3+1] = (Math.random() - 0.5) * 10;
  gPos[i*3+2] = (Math.random() - 0.5) * 6;
  gSeed[i] = Math.random();
}
glyphGeom.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
glyphGeom.setAttribute('seed', new THREE.BufferAttribute(gSeed, 1));

const glyphMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: uniforms.uTime,
    uPixel: uniforms.uPixel,
    uMap: { value: glyphTex }
  },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vSeed;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      float t = uTime * 0.3 + seed * 40.0;
      p.x += sin(t * 0.7) * 1.5;
      p.y += cos(t * 0.5) * 1.2;
      p.z += sin(t * 0.3 + seed * 10.0) * 0.8;
      // fade in/out on cycle
      float cycle = fract(uTime * 0.08 + seed);
      vAlpha = smoothstep(0.0, 0.1, cycle) * smoothstep(1.0, 0.7, cycle) * 0.4;
      vSeed = seed;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 18.0 * uPixel * (4.0 / max(-mv.z, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uMap;
    uniform float uTime;
    varying float vSeed;
    varying float vAlpha;
    void main() {
      // pick glyph from atlas
      float idx = floor(vSeed * 16.0);
      float gx = mod(idx, 4.0) * 0.25;
      float gy = floor(idx / 4.0) * 0.25;
      vec2 uv = gl_PointCoord * 0.25 + vec2(gx, gy);
      float g = texture2D(uMap, uv).r;
      if (g < 0.3) discard;
      // viridian → lime cycle — stays within the intentional palette
      vec3 col = mix(vec3(0.102, 0.420, 0.290), vec3(0.659, 1.000, 0.243), sin(uTime * 1.5 + vSeed * 6.28) * 0.5 + 0.5);
      gl_FragColor = vec4(col, g * vAlpha);
    }
  `
});
const glyphPoints = new THREE.Points(glyphGeom, glyphMat);
scene.add(glyphPoints);

// ── INTERACTION ──
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildVascularField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.branchId.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── CENTROID TRACKING ──
function computeCentroid() {
  let cx = 0, cy = 0, cz = 0;
  const pos = geom.attributes.position.array;
  const sampleN = Math.min(N, 2000);
  const step = Math.floor(N / sampleN);
  for (let i = 0; i < N; i += step) {
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  const count = Math.ceil(N / step);
  return new THREE.Vector3(cx/count, cy/count, cz/count);
}

// ── RENDER LOOP ──
const start = performance.now();
const lookTarget = new THREE.Vector3();
const BPM = 160;

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // Audio update
  updateAudio();
  uniforms.uBass.value += (bassLevel - uniforms.uBass.value) * 0.3;
  uniforms.uAudio.value += (audioLevel - uniforms.uAudio.value) * 0.3;

  // Beat pulse (160 BPM square wave)
  const beatPhase = (t * BPM / 60) % 1;
  uniforms.uBeat.value = beatPhase < 0.25 ? 1 : 0;

  // Camera — orbit + track centroid, faster-than-comfortable
  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.05);

  const orbitSpeed = 0.35; // deliberately uncomfortable speed
  const camR = 9 + Math.sin(t * 0.8) * 2;
  camera.position.x = Math.sin(t * orbitSpeed) * camR;
  camera.position.y = Math.cos(t * orbitSpeed * 0.7) * 3;
  camera.position.z = Math.cos(t * orbitSpeed) * camR;
  camera.lookAt(lookTarget);

  // Background: pure black — no tint, no pulse color bleed
  renderer.setClearColor(0x000000, 1);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
