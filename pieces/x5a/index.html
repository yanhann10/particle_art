<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x5a · Shiota — Two Home Countries</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">x5a</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020000, 0.0025);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.03));
const pL = new THREE.PointLight(0xffd8b0, 0.04, 60, 1.6);
pL.position.set(3, 20, -2);
scene.add(pL);

let seed = 48291053;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 36, h: 28, d: 40 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a moon within the circulatory cosmos
const sphereCenter = new THREE.Vector3(1.2, 2.0, -0.8);
const SPHERE_R = 2.4;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf5f0e8, emissive: 0xede4d0, emissiveIntensity: 0.6,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.28,
  side: THREE.FrontSide
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner core glow
const innerCore = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.7, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf4e6, transparent: true, opacity: 0.045 })
);
innerCore.position.copy(sphereCenter);
scene.add(innerCore);

// Suspension threads — from ceiling to sphere top
const suspPts = [];
for(let i = 0; i < 7; i++){
  const ox = (rng()-0.5) * 1.8;
  const oz = (rng()-0.5) * 1.5;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox * 0.06, sphereCenter.y + SPHERE_R - 0.1, sphereCenter.z + oz * 0.06
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0202, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const theta = rng() * Math.PI * 2;
  const phi = Math.acos(2 * rng() - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi) * Math.cos(theta) * SPHERE_R,
    sphereCenter.y + Math.sin(phi) * Math.sin(theta) * SPHERE_R,
    sphereCenter.z + Math.cos(phi) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — concentric shells around the sphere, like orbital shells
const anchors = [];

// Spherical shells at increasing radii
const shellRadii = [4.0, 5.5, 7.5, 10, 13, 16];
for(const sr of shellRadii){
  const nPts = Math.floor(12 + sr * 2.2);
  for(let i = 0; i < nPts; i++){
    const theta = rng() * Math.PI * 2;
    const phi = Math.acos(2 * rng() - 1);
    const r = sr * (0.85 + rng() * 0.3);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(phi) * Math.cos(theta) * r,
      sphereCenter.y + Math.sin(phi) * Math.sin(theta) * r,
      sphereCenter.z + Math.cos(phi) * r
    ));
  }
}

// Wall-hugging anchors — architectural frame
while(anchors.length < 400){
  const p = rng() < 0.5 ? wallPt() : wallPt().lerp(sphereCenter, 0.08 + rng()*0.2);
  anchors.push(p);
}

// Void zones — gaps for camera passage and breathing
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 5, sphereCenter.y - 3, sphereCenter.z + 6), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y + 5, sphereCenter.z - 5), r: 2.2 },
  { pos: new THREE.Vector3(sphereCenter.x + 1, sphereCenter.y - 10, sphereCenter.z + 2), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — 18,000 line segments max
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — threads radiate from sphere like blood vessels from a heart
// ~55% of threads converge on the sphere
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = sphereSurf();

  // 10% stop short — the gap, the yearning
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng() * 1.2;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — anchor-to-anchor within threshold
const THRESH = 6.0;
const catBtarget = Math.floor(NUM_LINES * 0.25);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 60000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Rule 3: GRAVITY DRAPE — threads falling from sphere downward
const catC = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const sp = sphereSurf();
  // Only from lower hemisphere
  if(sp.y > sphereCenter.y){ i--; continue; }
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*4.0,
    -hh,
    sp.z + (rng()-0.5)*4.0
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 2);
}

// Fill remainder: architectural wall-to-wall or wall-to-sphere
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.3 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — differentiation by category and distance
const catOpacity = [0.08, 0.05, 0.065, 0.032];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat];
  const bright = op / 0.08;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, stones caught in the web
const NUM_FRAGMENTS = 28;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.09;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.7);
  const h = sz * (0.4 + rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.15+rng()*0.35), h*(rng()*0.05), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.015;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.15 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    // Scattered in space near the sphere shell
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(SPHERE_R + 1.5 + rng()*6.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, slowly spiraling inward then outward
// Narrative: approach from distance, enter the web, orbit close to the sphere,
// then drift upward to see the convergence from above
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const angle = t * Math.PI * 2.4; // slightly more than one full revolution

  let rH, y;
  if(t < 0.25){
    // Phase 1: entering from below-side, medium distance
    const lt = t / 0.25;
    rH = 12 - lt * 4;
    y = sphereCenter.y - 6 + lt * 4;
  } else if(t < 0.5){
    // Phase 2: close orbit at sphere level — intimate
    const lt = (t - 0.25) / 0.25;
    rH = 8 - lt * 2.5;
    y = sphereCenter.y - 2 + lt * 3 + Math.sin(lt * Math.PI) * 1.5;
  } else if(t < 0.75){
    // Phase 3: very close, drifting upward past the sphere
    const lt = (t - 0.5) / 0.25;
    rH = 5.5 + Math.sin(lt * Math.PI) * 0.8;
    y = sphereCenter.y + 1 + lt * 5;
  } else {
    // Phase 4: above, looking down — the whole web as circulatory system
    const lt = (t - 0.75) / 0.25;
    rH = 6.3 + lt * 3;
    y = sphereCenter.y + 6 + lt * 3 + Math.sin(lt * Math.PI) * 2;
  }

  const x = sphereCenter.x + Math.sin(angle) * rH + Math.cos(angle * 0.4 + 1.2) * 0.6;
  const z = sphereCenter.z + Math.cos(angle) * (rH * 1.05) + Math.sin(angle * 0.5 + 0.7) * 0.5;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible, <0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0001 * Math.max(0, 1.0 - dist / 20.0);
    const phase = basePositions[idx]*0.09 + basePositions[idx+1]*0.12 + i*0.0003;
    const breath = Math.sin(t*0.008 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.1;
      arr[vi+2] = basePositions[vi+2] + breath*0.18;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera dolly
  const speed = 0.00035;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — the still center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.001)*0.03;
  look.y += Math.cos(t*0.0008)*0.02;
  look.z += Math.sin(t*0.0012)*0.025;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = 3 + Math.sin(t*0.0005)*0.1;
  pL.position.y = 20 + Math.cos(t*0.0003)*0.05;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
