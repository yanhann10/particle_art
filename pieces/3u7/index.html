<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3u7 · désordres gradient · Vera Molnar</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede3; overflow:hidden;
               color:#3a3832; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#3a3832; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; color:#3a3832; }
</style>
</head>
<body>
<div class="id">3u7 · désordres gradient · Vera Molnar</div>
<div class="hint">1% de désordre · order to chaos</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4ede3);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Grid of nested square line-segments with entropy gradient
// SIGNATURE: order at top, chaos at bottom — Désordres (1976)

const ROWS = 32;
const COLS = 32;
const CELL_SIZE = 0.7;
const GRID_W = COLS * CELL_SIZE;
const GRID_H = ROWS * CELL_SIZE;

const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1816, linewidth: 1.5 });

// Seeded random for Molnar's controlled disorder
let seed = 12345;
function random(){
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
function gaussian(mean=0, std=1){
  const u1 = random(), u2 = random();
  const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return mean + z0 * std;
}

for (let row = 0; row < ROWS; row++){
  const yNorm = row / (ROWS - 1);
  const chaos = Math.pow(yNorm, 1.8); // entropy gradient: 0 at top, 1 at bottom
  
  for (let col = 0; col < COLS; col++){
    const baseX = (col - COLS/2) * CELL_SIZE + CELL_SIZE/2;
    const baseY = (ROWS/2 - row) * CELL_SIZE - CELL_SIZE/2;
    
    // Position offset increases with chaos
    const offsetX = gaussian(0, chaos * 0.15);
    const offsetY = gaussian(0, chaos * 0.15);
    const cx = baseX + offsetX;
    const cy = baseY + offsetY;
    
    // Rotation offset
    const baseRot = 0; // start orthogonal
    const rotNoise = gaussian(0, chaos * 0.35); // radians
    
    // Size variation
    const baseSize = 0.32;
    const sizeNoise = 1.0 + gaussian(0, chaos * 0.12);
    const halfSize = baseSize * sizeNoise * 0.5;
    
    // Nested square: 4 line segments forming a rectangle
    const corners = [
      new THREE.Vector3(-halfSize, -halfSize, 0),
      new THREE.Vector3( halfSize, -halfSize, 0),
      new THREE.Vector3( halfSize,  halfSize, 0),
      new THREE.Vector3(-halfSize,  halfSize, 0),
    ];
    
    // Apply rotation around center
    const cosR = Math.cos(rotNoise);
    const sinR = Math.sin(rotNoise);
    for (const c of corners){
      const x = c.x, y = c.y;
      c.x = x * cosR - y * sinR;
      c.y = x * sinR + y * cosR;
      c.x += cx;
      c.y += cy;
    }
    
    // Draw 4 edges
    for (let i = 0; i < 4; i++){
      const p1 = corners[i];
      const p2 = corners[(i+1)%4];
      const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      const line = new THREE.Line(geom, lineMat);
      scene.add(line);
    }
    
    // Inner nested square (smaller, rotated slightly more)
    if (chaos < 0.85){ // culled at high disorder
      const innerSize = halfSize * 0.55;
      const innerRot = rotNoise + gaussian(0, chaos * 0.15);
      const cosI = Math.cos(innerRot);
      const sinI = Math.sin(innerRot);
      const innerCorners = [
        new THREE.Vector3(-innerSize, -innerSize, 0),
        new THREE.Vector3( innerSize, -innerSize, 0),
        new THREE.Vector3( innerSize,  innerSize, 0),
        new THREE.Vector3(-innerSize,  innerSize, 0),
      ];
      for (const c of innerCorners){
        const x = c.x, y = c.y;
        c.x = x * cosI - y * sinI + cx;
        c.y = x * sinI + y * cosI + cy;
      }
      for (let i = 0; i < 4; i++){
        const p1 = innerCorners[i];
        const p2 = innerCorners[(i+1)%4];
        const geom = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        const line = new THREE.Line(geom, lineMat);
        scene.add(line);
      }
    }
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Slow orbital rotation to reveal 3D wave
  const orbitRadius = 28;
  const orbitSpeed = 0.08;
  camera.position.x = Math.sin(t * orbitSpeed) * orbitRadius * 0.3;
  camera.position.z = Math.cos(t * orbitSpeed) * orbitRadius;
  camera.position.y = Math.sin(t * orbitSpeed * 0.5) * 3;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
