<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: oscillate, intensity: gentle -->
<title>mkh · Riley phase transition (particulate ↔ liquid)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e1a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; color:#667; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; color:#667; z-index:10; }
</style>
</head>
<body>
<div class="id">mkh</div>
<div class="hint">click to regenerate · Riley phase fields</div>
<div class="src">Riley · particle↔liquid · 80k</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 28;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2, 0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e1a, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points;

/* Palette rationale:
   - warm ivory (#f0e6d3): particulate phase — discrete, sandy, dry
   - terracotta (#c4725a): transition boundary — the liminal edge
   - slate blue (#5a7c9c): liquid/coalesced phase — fluid, cool, continuous
   Background deep navy (#0a0e1a) gives warmth without paper-white sterility */

const uniforms = {
  uTime:     { value: 0 },
  uPhase:    { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uRowFreq:  { value: 0 },
  uColFreq:  { value: 0 },
  uWaveAmp:  { value: 0 },
  uTwist:    { value: 0 },
  uLiquid:   { value: 0 },
  uColIvory: { value: new THREE.Color(0xf0e6d3) },
  uColTerra: { value: new THREE.Color(0xc4725a) },
  uColSlate: { value: new THREE.Color(0x5a7c9c) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uLiquid;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity;
    varying float vPhaseZone;
    varying float vEdgeDist;

    void main(){
      vec2 gp = gridPos;

      // Wave fields — two dominant Riley stripe directions
      float wave1 = sin(gp.y * uRowFreq + uTime * 0.6 + uPhase);
      float wave2 = sin(gp.x * uColFreq + uTime * 0.4);
      float wave3 = sin((gp.x + gp.y) * uRowFreq * 0.7 + uTime * 0.3);

      // Interference pattern — determines phase
      float interference = wave1 * wave2;
      float interference2 = wave2 * wave3;

      // Phase zone: -1 = liquid, 0 = boundary, +1 = particulate
      float phaseField = interference;

      // Liquid threshold oscillates over time — breathing phase transition
      float liquidThresh = sin(uTime * 0.15) * 0.3 + uLiquid;

      // In liquid zones, particles snap toward wave-crest lines (coalesce)
      // In particulate zones, particles keep their grid scatter
      float liquidness = smoothstep(liquidThresh + 0.15, liquidThresh - 0.15, phaseField);

      // Displacement: particulate = jittery grid; liquid = smooth wave bands
      float twist = uTwist * length(gp) * 0.04;
      float ct = cos(twist); float st = sin(twist);
      vec2 twisted = vec2(gp.x * ct - gp.y * st, gp.x * st + gp.y * ct);

      // Particulate displacement — scattered
      float rowDisp = wave1 * uWaveAmp;
      float colDisp = wave2 * uWaveAmp;

      // Liquid displacement — particles flow into wave crests
      float crestY = round(gp.y * uRowFreq / 6.2832) * 6.2832 / uRowFreq;
      float flowY = mix(gp.y, crestY + wave1 * 0.3, liquidness * 0.7);
      float flowX = gp.x + sin(flowY * 3.0 + uTime * 0.5) * liquidness * 0.4;

      vec3 p = vec3(
        mix(twisted.x + rowDisp, flowX, liquidness),
        mix(twisted.y + colDisp, flowY, liquidness),
        0.0
      );

      // Size: liquid particles grow to fill gaps (coalesce); particulate stay small
      float baseSize = uPixel * mix(2.0, 4.5, liquidness);
      // Add subtle seed variation
      baseSize *= 0.85 + seed * 0.3;

      // Edge distance — how close to the phase boundary
      float edgeDist = abs(phaseField - liquidThresh);

      vDensity = interference;
      vPhaseZone = liquidness;
      vEdgeDist = edgeDist;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = baseSize;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uColIvory;
    uniform vec3 uColTerra;
    uniform vec3 uColSlate;

    varying float vDensity;
    varying float vPhaseZone;
    varying float vEdgeDist;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);

      // Soft edge for liquid phase, hard edge for particulate
      float edgeSoft = mix(0.25, 0.15, vPhaseZone);
      float alpha = 1.0 - smoothstep(edgeSoft - 0.05, edgeSoft, r);
      if (alpha < 0.01) discard;

      // Color by phase zone:
      // particulate (vPhaseZone ~ 0) → ivory
      // boundary → terracotta
      // liquid (vPhaseZone ~ 1) → slate blue
      float boundary = smoothstep(0.3, 0.0, vEdgeDist) * (1.0 - step(0.85, vPhaseZone));
      vec3 col = mix(uColIvory, uColSlate, vPhaseZone);
      col = mix(col, uColTerra, boundary * 0.8);

      // Density modulation — Riley's retinal flicker
      float densityMod = smoothstep(-0.3, 0.3, vDensity);
      alpha *= mix(0.5, 0.95, densityMod);

      // Liquid phase slightly more opaque (continuous feel)
      alpha *= mix(0.7, 0.95, vPhaseZone);

      gl_FragColor = vec4(col, alpha);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24;
  const height = 24;
  const cellW = width / cols;
  const cellH = height / rows;

  let idx = 0;
  const perCell = Math.floor(N / (rows * cols));
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      for (let k = 0; k < perCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  return { positions, gridPositions, seeds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 90 + Math.floor(rng() * 50);
  const cols = 90 + Math.floor(rng() * 50);

  uniforms.uRowFreq.value = 0.9 + rng() * 1.0;
  uniforms.uColFreq.value = 0.9 + rng() * 1.0;
  uniforms.uWaveAmp.value = 0.4 + rng() * 0.6;
  uniforms.uTwist.value = rng() * 4.0;
  uniforms.uPhase.value = rng() * 6.28;
  uniforms.uLiquid.value = -0.1 + rng() * 0.2;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

/* Atmosphere — faint grain overlay via a full-screen quad */
const grainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: { uTime: uniforms.uTime },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    void main(){
      vec2 uv = gl_FragCoord.xy;
      float n = fract(sin(dot(uv, vec2(12.9898, 78.233)) + uTime * 0.7) * 43758.5453);
      gl_FragColor = vec4(vec3(0.85, 0.8, 0.75), n * 0.04);
    }
  `
});
const grainQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  grainMat
);
grainQuad.frustumCulled = false;
grainQuad.renderOrder = 999;
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* Subtle background gradient — warm top to cool bottom */
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 top = vec3(0.055, 0.045, 0.08);
      vec3 bot = vec3(0.035, 0.05, 0.1);
      gl_FragColor = vec4(mix(bot, top, vUv.y), 1.0);
    }
  `
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false;
bgQuad.renderOrder = -1;
const bgScene = new THREE.Scene();
bgScene.add(bgQuad);
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

regenerate();
addEventListener('click', regenerate);

addEventListener('resize', () => {
  const a = innerWidth / innerHeight;
  camera.left = frustumSize * a / -2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
renderer.autoClear = false;

function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  renderer.render(grainScene, grainCam);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
