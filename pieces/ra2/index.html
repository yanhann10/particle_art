<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ra2 · Shiota — Circulatory Moon (After Two Home Countries)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">ra2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.011);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.12));

const pL = new THREE.PointLight(0xffe0c0, 0.3, 50, 1.6);
pL.position.set(3.0, 14.0, -2.0);
scene.add(pL);

// Subtle rim light from below — barely perceptible
const pL2 = new THREE.PointLight(0xc20018, 0.08, 30, 2.0);
pL2.position.set(-4.0, -8.0, 5.0);
scene.add(pL2);

let seed = 48291653;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ARCHITECTURAL VOID — taller than wide, cathedral proportions
const ROOM = { w: 36, h: 30, d: 42 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, off-white, cottony
// Placed slightly right of center as in the seed image
const sphereCenter = new THREE.Vector3(1.8, 1.5, 0.0);
const SPHERE_R = 2.2;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece0,
  emissive: 0xf2ece0,
  emissiveIntensity: 0.6,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.42
});
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

// Inner glow sphere — slightly smaller, more opaque core
const innerMat = new THREE.MeshBasicMaterial({
  color: 0xf5efe5,
  transparent: true,
  opacity: 0.18
});
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.82, 16, 12),
  innerMat
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

// Suspension wires from ceiling — physical legibility
const suspGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  sphereCenter.x - 0.3, hh, sphereCenter.z + 0.15,
  sphereCenter.x, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z,
  sphereCenter.x + 0.35, hh, sphereCenter.z - 0.2,
  sphereCenter.x + 0.1, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z + 0.05,
  sphereCenter.x + 0.05, hh, sphereCenter.z + 0.3,
  sphereCenter.x - 0.05, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z - 0.08,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0404, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng() * 2 - 1;
  const th = rng() * Math.PI * 2;
  const r2 = Math.sqrt(1 - u*u);
  return new THREE.Vector3(
    sphereCenter.x + SPHERE_R * r2 * Math.cos(th),
    sphereCenter.y + SPHERE_R * u,
    sphereCenter.z + SPHERE_R * r2 * Math.sin(th)
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — radial shells around the sphere
const NUM_ANCHORS = 800;
const anchors = [];

// Fibonacci sphere distribution at multiple radii — organic but structured
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [3.5, 6.0, 10.0, 15.0];
const ptsPerShell = [60, 80, 100, 80];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    // Slight per-point jitter — hand-tied irregularity
    const jx = (rng()-0.5)*0.6;
    const jy = (rng()-0.5)*0.6;
    const jz = (rng()-0.5)*0.6;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + r * Math.cos(th) * R + jx,
      sphereCenter.y + y * R + jy,
      sphereCenter.z + r * Math.sin(th) * R + jz
    ));
  }
}

// Fill remaining anchors with wall-biased points
while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.6 ? wallPt() : wallPt().lerp(sphereCenter, 0.2 + rng()*0.4);
  anchors.push(p);
}

// Void zones — negative space breathing holes
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 7, sphereCenter.y + 4, sphereCenter.z + 6), r: 3.2 },
  { pos: new THREE.Vector3(sphereCenter.x + 5, sphereCenter.y - 5, sphereCenter.z - 7), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 8, sphereCenter.y + 8, sphereCenter.z + 3), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — max 18,500 line segments
const NUM_LINES = 18500;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-sphereCenter.x, dy = my-sphereCenter.y, dz = mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Category A: Convergence threads — anchor/wall → sphere surface (blood vessels to the heart)
// ~55% of threads
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.35){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 10% stop short — threads reaching but failing to arrive
  if(rng() < 0.10){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.8));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Category B: Anchor-to-anchor structural web — proximity rule (Casey Reas)
const THRESHOLD = 7.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.22);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  catBcount++;

  // Dendritic Y-fork branching — capillary growth
  if(rng() < 0.18 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.3 + rng()*1.0));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      catBcount++;
      if(rng() < 0.25 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(bEnd, 0.5 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.15 + rng()*0.5));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          catBcount++;
        }
      }
    }
  }
}

// Category C: Dense near-sphere halo — threads that orbit close, creating density around the moon
const catC = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const dir1 = s1.clone().sub(sphereCenter).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.3 + rng()*3.0));
  // Tangential displacement
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.3 + rng()*3.0)).add(tangent.multiplyScalar(1.0 + rng()*2.5));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB);
}

// Category D: Long wall-spanning threads — the room-scale architectural web
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.5 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / stones caught in the web
const NUM_FRAGMENTS = 40;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.04 + rng()*0.12;
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.7 + rng()*0.9);
  // Irregular torn shapes
  const verts = new Float32Array([
    w*(-0.3+rng()*0.25), h*0.5, 0,
    -w*0.5, h*(-0.15+rng()*0.2), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.25), h*0.5, 0,
    w*(0.35+rng()*0.25), h*(rng()*0.12), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.02;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.15, d*0.06),
    transparent: true,
    opacity: 0.12 + rng()*0.38,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  // Place along threads or orbiting sphere
  if(rng() < 0.5){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(SPHERE_R + 0.5 + rng()*8.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate architectural drift
// Asymmetric path that passes close to sphere, rises, descends, looks through voids
const pathLen = 700;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;
  // Egg-shaped orbit — closer on one approach, farther on the other
  const rX = 5.0 + Math.sin(p * 0.5) * 2.0 + Math.sin(p * 1.3 + 0.8) * 0.7;
  const rZ = 7.0 + Math.cos(p * 0.7) * 2.5 + Math.cos(p * 0.4 + 1.5) * 1.0;
  const x = cx + Math.sin(p) * rX;
  // Vertical: slow rise, linger at sphere-height, descend
  const yBase = cy + 0.5;
  const yWave = Math.sin(p * 0.35 + 0.3) * 5.0 + Math.cos(p * 0.8 + 1.0) * 1.5;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible (<0.3% variation)
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0008 * Math.max(0, 1.0 - dist / 25.0);
    const phase = basePositions[idx]*0.3 + basePositions[idx+1]*0.35 + i*0.0015;
    const breath = Math.sin(t*0.03 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.35;
      arr[vi+1] = basePositions[vi+1] + breath*0.28;
      arr[vi+2] = basePositions[vi+2] + breath*0.32;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.001;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere — the gravitational center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.004)*0.2;
  look.y += Math.cos(t*0.003)*0.15;
  look.z += Math.sin(t*0.0035)*0.12;
  camera.lookAt(look);

  // Light drift — barely perceptible
  pL.position.x = 3.0 + Math.sin(t*0.002)*0.6;
  pL.position.y = 14.0 + Math.cos(t*0.0018)*0.3;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
