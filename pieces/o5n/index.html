<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o5n · lorenz / lidar scan error</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">o5n · lorenz / lidar scan error</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Quayola Remains: convert the Lorenz attractor into a ghostly LiDAR point cloud — 
// preserve scan errors (occlusion gaps, depth-falloff noise, unresolved blobs).
// Each orbit-ribbon dissolves into measurement artifact as depth increases.

const W = 320, H = 320, N = W * H;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0e, 1);
document.body.appendChild(renderer.domElement);

// ping-pong state RTs
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: seed particles on Lorenz attractor
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 8.0;
  init[i*4+1] = (Math.random()*2-1) * 8.0;
  init[i*4+2] = (Math.random()*2-1) * 8.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation pass
const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho: { value: 28.0 },
  uBeta: { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render pass: LiDAR point cloud with scan error
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 90);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
const occlusionArr = new Float32Array(N); // per-particle occlusion flag
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
  // occlusion gaps: 15% of particles removed in block patterns
  const blockX = Math.floor(x / 32);
  const blockY = Math.floor(y / 32);
  const blockHash = (blockX * 73 + blockY * 137) % 100;
  occlusionArr[i] = blockHash < 15 ? 0.0 : 1.0;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));
pointsGeom.setAttribute('occlusion', new THREE.BufferAttribute(occlusionArr, 1));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime: { value: 0 },
    uCamPos: { value: camera.position }
  },
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime;
    uniform vec3 uCamPos;
    attribute vec2 uvIdx;
    attribute float occlusion;
    varying float vAlpha;
    varying float vDepth;
    
    // simple hash for Gaussian-like noise
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    
    void main(){
      if (occlusion < 0.5) {
        gl_Position = vec4(0.0, 0.0, -10.0, 1.0);
        gl_PointSize = 0.0;
        vAlpha = 0.0;
        return;
      }
      
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      p.z -= 25.0; // center attractor
      
      // LiDAR depth-falloff noise: grows with distance from camera
      float dist = length(p - uCamPos);
      float noiseFalloff = smoothstep(20.0, 120.0, dist);
      
      // Gaussian noise per particle (3D)
      float n1 = hash(uvIdx + vec2(uTime * 0.01));
      float n2 = hash(uvIdx.yx + vec2(uTime * 0.02));
      float n3 = hash(uvIdx * 2.0 + vec2(uTime * 0.015));
      vec3 noise = vec3(n1, n2, n3) * 2.0 - 1.0;
      noise *= noiseFalloff * 3.5; // scale noise by depth
      
      p += noise;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      
      // point size: smaller with distance, slight jitter
      float sizeFactor = 1.2 + (hash(uvIdx * 3.0) - 0.5) * 0.6;
      gl_PointSize = sizeFactor * uPixel * (80.0 / vDepth);
      
      // alpha falloff: fade distant points to simulate scan incompleteness
      vAlpha = smoothstep(140.0, 40.0, vDepth) * (0.5 + hash(uvIdx * 4.0) * 0.5);
      
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // soft gaussian falloff
      float a = exp(-r * 12.0) * vAlpha;
      
      // pale gray, slight warmth (Quayola signature)
      vec3 col = vec3(0.76, 0.78, 0.79);
      
      // depth-based subtle fade to darker
      col *= mix(0.85, 1.0, smoothstep(100.0, 30.0, vDepth));
      
      gl_FragColor = vec4(col * a, a * 0.6);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;
  
  // step sim
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);
  
  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;
  
  // slow orbital drift (Quayola's camera: patient, architectural)
  const ang = now * 0.00008;
  const radius = 90;
  camera.position.x = Math.sin(ang) * radius;
  camera.position.z = Math.cos(ang) * radius;
  camera.position.y = Math.sin(ang * 0.3) * 15;
  camera.lookAt(0, 0, 0);
  pointsMat.uniforms.uCamPos.value.copy(camera.position);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
