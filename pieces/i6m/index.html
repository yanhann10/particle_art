<style>

<div class="id">i6m</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.005);

const camera = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.03));

const pL = new THREE.PointLight(0xffe8d0, 0.12, 45, 1.8);
pL.position.set(-1.5, 16.0, -2.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0xc20018, 0.025, 30, 2.0);
pL2.position.set(4.0, -8.0, 5.0);
scene.add(pL2);

let seed = 48291053;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 42, h: 34, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — the remembered form, the absent body
// Shiota: "the dress is the skin we shed — presence of absence"
const dressCenter = new THREE.Vector3(0.0, 1.2, 0.0);
const DRESS_H = 4.8;
const DRESS_WAIST = 0.45;
const DRESS_HEM = 1.9;

// Bodice — narrow cylinder
const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(DRESS_WAIST * 0.6, DRESS_WAIST, DRESS_H * 0.32, 12, 1, true),
  new THREE.MeshStandardMaterial({
    color: 0xf5ede2, emissive: 0xf5ede2, emissiveIntensity: 0.55,
    roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.28,
    side: THREE.DoubleSide
  })
);
bodice.position.set(dressCenter.x, dressCenter.y + DRESS_H * 0.34, dressCenter.z);
scene.add(bodice);

// Skirt — flared cone
const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(DRESS_WAIST, DRESS_HEM, DRESS_H * 0.68, 16, 1, true),
  new THREE.MeshStandardMaterial({
    color: 0xf0e6d8, emissive: 0xf0e6d8, emissiveIntensity: 0.50,
    roughness: 0.96, metalness: 0.0, transparent: true, opacity: 0.24,
    side: THREE.DoubleSide
  })
);
skirt.position.set(dressCenter.x, dressCenter.y - DRESS_H * 0.16, dressCenter.z);
scene.add(skirt);

// Inner glow — the body that was here
const innerGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(DRESS_WAIST * 0.35, DRESS_HEM * 0.5, DRESS_H * 0.85, 8, 1),
  new THREE.MeshBasicMaterial({ color: 0xfaf6f0, transparent: true, opacity: 0.06 })
);
innerGlow.position.copy(dressCenter);
scene.add(innerGlow);

// Hanger wire — simple inverted V
const hangerPts = new Float32Array([
  dressCenter.x - 0.8, dressCenter.y + DRESS_H * 0.50, dressCenter.z,
  dressCenter.x, dressCenter.y + DRESS_H * 0.58, dressCenter.z,
  dressCenter.x, dressCenter.y + DRESS_H * 0.58, dressCenter.z,
  dressCenter.x + 0.8, dressCenter.y + DRESS_H * 0.50, dressCenter.z
]);
const hangerGeo = new THREE.BufferGeometry();
hangerGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
scene.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x1a1210, transparent: true, opacity: 0.6
})));

// Suspension wires — from ceiling to hanger
const suspPts = [];
for(let i = 0; i < 5; i++){
  const ox = (rng() - 0.5) * 0.5;
  const oz = (rng() - 0.5) * 0.3;
  suspPts.push(
    dressCenter.x + ox, hh, dressCenter.z + oz,
    dressCenter.x + ox * 0.08, dressCenter.y + DRESS_H * 0.56 + rng()*0.02, dressCenter.z + oz * 0.08
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0606, transparent: true, opacity: 0.45
})));

// ── DRESS SURFACE SAMPLER — points along the dress silhouette
function dressSurf(){
  const t = rng(); // 0=hem, 1=shoulder
  const y = dressCenter.y - DRESS_H * 0.5 + t * DRESS_H;
  const r = t < 0.68
    ? DRESS_HEM * (1.0 - t / 0.68) + DRESS_WAIST * (t / 0.68)
    : DRESS_WAIST * (1.0 - (t - 0.68) / 0.32) * 1.1 + DRESS_WAIST * 0.5 * ((t - 0.68) / 0.32);
  const ang = rng() * Math.PI * 2;
  const jr = r + (rng() - 0.5) * 0.08;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(ang) * jr,
    y,
    dressCenter.z + Math.sin(ang) * jr
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — concentric shells around the dress
const anchors = [];
const shellRadii = [3.0, 5.5, 9.0, 14.0, 20.0];
for(const R of shellRadii){
  const count = Math.floor(12 + R * 2.5);
  for(let i = 0; i < count; i++){
    const phi = Math.acos(2 * rng() - 1);
    const theta = rng() * Math.PI * 2;
    anchors.push(new THREE.Vector3(
      dressCenter.x + Math.sin(phi) * Math.cos(theta) * R + (rng()-0.5)*0.5,
      dressCenter.y + Math.cos(phi) * R * 0.85 + (rng()-0.5)*0.5,
      dressCenter.z + Math.sin(phi) * Math.sin(theta) * R + (rng()-0.5)*0.5
    ));
  }
}
// Wall-biased anchors
while(anchors.length < 600){
  const p = rng() < 0.5 ? wallPt() : wallPt().lerp(dressCenter, 0.08 + rng()*0.3);
  anchors.push(p);
}

// Void zones — deliberate negative space (windows into the web)
const voids = [
  { pos: new THREE.Vector3(dressCenter.x - 7, dressCenter.y + 5, dressCenter.z + 8), r: 2.8 },
  { pos: new THREE.Vector3(dressCenter.x + 8, dressCenter.y - 5, dressCenter.z - 7), r: 2.4 },
  { pos: new THREE.Vector3(dressCenter.x + 3, dressCenter.y + 10, dressCenter.z - 5), r: 2.0 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — max 19,000 segments
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-dressCenter.x, dy = my-dressCenter.y, dz = mz-dressCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  lineCat[li] = cat;
  li++;
}

// Cat A: CONVERGENCE — threads from walls/anchors to dress surface
// 55% — the dress is the gravitational center, every thread remembers it
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.35){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 10% stop short — threads that almost reach the dress but fail
  if(rng() < 0.10){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.4));
    setLine(a, target, 0);
  } else {
    setLine(a, dressSurf(), 0);
  }
}

// Cat B: STRUCTURAL WEB — anchor-to-nearest-anchor (proximity rule)
const THRESHOLD = 7.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.18);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;

  // Dendritic Y-forks
  if(rng() < 0.18 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.2 + rng()*0.6));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 1);
      catBcount++;
      if(rng() < 0.25 && li < NUM_LINES - 1){
        const mid2 = mid.clone().lerp(bEnd, 0.5 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.06 + rng()*0.25));
        if(!inVoid(bEnd2)){ setLine(mid2, bEnd2, 1); catBcount++; }
      }
    }
  }
}

// Cat C: COCOON — dense threads wrapping tight around the dress silhouette
// Like a cocoon of memory around the absent body
const catC = Math.floor(NUM_LINES * 0.12);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = dressSurf();
  const s2 = dressSurf();
  // Keep cocoon threads short — nearby surface points
  if(s1.distanceTo(s2) > 4.0){ i--; continue; }
  // Push both slightly outward
  const n1 = s1.clone().sub(dressCenter).normalize();
  const n2 = s2.clone().sub(dressCenter).normalize();
  s1.add(n1.multiplyScalar(0.08 + rng()*0.6));
  s2.add(n2.multiplyScalar(0.08 + rng()*0.6));
  setLine(s1, s2, 2);
}

// Cat D: GRAVITY THREADS — from dress hem straight down to floor
const catD = Math.floor(NUM_LINES * 0.05);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const hemAng = rng() * Math.PI * 2;
  const hemR = DRESS_HEM * (0.7 + rng() * 0.35);
  const hemPt = new THREE.Vector3(
    dressCenter.x + Math.cos(hemAng) * hemR,
    dressCenter.y - DRESS_H * 0.5 + (rng()-0.5)*0.15,
    dressCenter.z + Math.sin(hemAng) * hemR
  );
  const floorPt = new THREE.Vector3(
    hemPt.x + (rng()-0.5)*1.8,
    -hh,
    hemPt.z + (rng()-0.5)*1.8
  );
  setLine(hemPt, floorPt, 3);
}

// Cat E: LONG SPANS — wall-to-wall, architectural web
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.40 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-category opacity via color brightness
// convergence 0.08, structural 0.05, cocoon 0.07, gravity 0.06, spans 0.04
const catOpacity = [0.08, 0.05, 0.07, 0.06, 0.04];
const colors = new Float32Array(li * 6);
const baseR = 0xc2/255, baseG = 0x00/255, baseB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.05;
  const bright = op / 0.08;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = baseR * bright;
    colors[i*6+v*3+1] = baseG * bright;
    colors[i*6+v*3+2] = baseB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, letters never sent
const NUM_FRAGMENTS = 38;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.12;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.5 + rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.15-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.25+rng()*0.3), h*(rng()*0.05), 0,
    w*(0.15-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.06, d*0.02),
    transparent: true,
    opacity: 0.12 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(2.0 + rng()*8.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate
// Narrative: begin below looking up through hem threads, rise to eye-level,
// orbit close past the bodice, drift higher to see the suspension, descend again
const pathLen = 1400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;

  // Asymmetric breathing orbit — viewer inside the installation
  const rX = 5.0 + Math.sin(p * 0.5) * 1.5 + Math.cos(p * 1.3 + 0.8) * 0.4;
  const rZ = 6.5 + Math.cos(p * 0.35) * 2.0 + Math.sin(p * 0.9 + 1.5) * 0.5;

  const x = cx + Math.sin(p) * rX;
  // Vertical pacing: start low, rise, hover at eye-level, dip below hem, rise again
  const yBase = cy - 0.5;
  const yWave = Math.sin(p * 0.25 + 0.3) * 5.0
    + Math.cos(p * 0.55 + 2.0) * 2.2
    + Math.sin(p * 1.1 + 4.0) * 0.5;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0003 * Math.max(0, 1.0 - dist / 30.0);
    const phase = basePositions[idx]*0.15 + basePositions[idx+1]*0.20 + i*0.001;
    const breath = Math.sin(t*0.015 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.28;
      arr[vi+1] = basePositions[vi+1] + breath*0.18;
      arr[vi+2] = basePositions[vi+2] + breath*0.24;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Dress gentle sway — barely perceptible pendulum
  const swayX = Math.sin(t * 0.008) * 0.012;
  const swayZ = Math.cos(t * 0.006) * 0.008;
  bodice.rotation.z = swayX;
  bodice.rotation.x = swayZ;
  skirt.rotation.z = swayX * 1.3;
  skirt.rotation.x = swayZ * 1.2;

  // Glacial camera drift
  const speed = 0.00055;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress — center of gravity, subtle wander
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.0018)*0.08;
  look.y += Math.cos(t*0.0015)*0.06;
  look.z += Math.sin(t*0.002)*0.05;
  camera.lookAt(look);

  // Light drift
  pL.position.x = -1.5 + Math.sin(t*0.0009)*0.25;
  pL.position.y = 16.0 + Math.cos(t*0.0007)*0.12;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
