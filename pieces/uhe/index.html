<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uhe · mycelial network signal</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a08; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">uhe</div>
<div class="hint">drag to explore · mycorrhizal anastomosis</div>
<div class="src">Anna Tsing · fungal network · hyphal fusion</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Mycelial network — fungal hyphal threads seeking nutrients,
   anastomosing (fusing) when they encounter kin, forming a
   distributed intelligence with no center. Camera drifts low
   through the substrate like a beetle, no aerial view. */

const BG = 0x0d0a08;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
camera.position.set(-8, 0.3, 4);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 2;
controls.maxDistance = 30;

// hyphae: growing tips + trail history
const MAX_HYPHAE = 60;
const MAX_TRAIL = 180;
const hyphae = [];

// nutrient gradient field (discrete points in substrate)
const nutrients = [];
const N_NUTRIENTS = 120;
for (let i = 0; i < N_NUTRIENTS; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = 3 + Math.random() * 8;
  nutrients.push({
    x: Math.cos(theta) * r,
    y: (Math.random() - 0.5) * 0.4,
    z: Math.sin(theta) * r,
    strength: 0.6 + Math.random() * 0.4,
    consumed: 0
  });
}

// spawn initial hyphae near origin (fungal spawn point)
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  hyphae.push({
    x: Math.cos(angle) * 0.2,
    y: (Math.random() - 0.5) * 0.1,
    z: Math.sin(angle) * 0.2,
    vx: Math.cos(angle) * 0.03,
    vy: 0,
    vz: Math.sin(angle) * 0.03,
    trail: [],
    age: 0,
    energy: 1.0,
    branchCooldown: 0,
    kin: i // kinship id — same-kin hyphae can fuse
  });
}

function step() {
  const toRemove = [];
  const toAdd = [];
  
  for (let i = 0; i < hyphae.length; i++) {
    const h = hyphae[i];
    if (h.energy < 0.05) {
      toRemove.push(i);
      continue;
    }
    
    h.age += 1;
    h.branchCooldown = Math.max(0, h.branchCooldown - 1);
    
    // chemotaxis: seek nearest unconsumed nutrient
    let bestN = null, bestD = Infinity;
    for (const n of nutrients) {
      if (n.consumed > 0.9) continue;
      const dx = n.x - h.x, dy = n.y - h.y, dz = n.z - h.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < bestD) { bestD = d; bestN = n; }
    }
    
    if (bestN && bestD < 8) {
      const dx = bestN.x - h.x, dy = bestN.y - h.y, dz = bestN.z - h.z;
      const inv = 0.04 / (bestD + 0.1);
      h.vx += dx * inv;
      h.vy += dy * inv;
      h.vz += dz * inv;
      
      // consume nutrient on contact
      if (bestD < 0.2) {
        const take = Math.min(0.05, bestN.strength - bestN.consumed);
        bestN.consumed += take;
        h.energy += take * 0.4;
      }
    }
    
    // random walk (fungal exploratory growth)
    h.vx += (Math.random() - 0.5) * 0.008;
    h.vy += (Math.random() - 0.5) * 0.004;
    h.vz += (Math.random() - 0.5) * 0.008;
    
    // substrate constraint (fungi grow mostly horizontal)
    h.vy += (0 - h.y) * 0.02;
    
    // friction
    const v = Math.sqrt(h.vx*h.vx + h.vy*h.vy + h.vz*h.vz);
    if (v > 0.08) {
      const s = 0.08 / v;
      h.vx *= s; h.vy *= s; h.vz *= s;
    }
    
    h.x += h.vx;
    h.y += h.vy;
    h.z += h.vz;
    
    h.trail.push({ x: h.x, y: h.y, z: h.z, age: h.age });
    if (h.trail.length > MAX_TRAIL) h.trail.shift();
    
    h.energy -= 0.0015;
    
    // anastomosis: fuse with nearby same-kin hyphae
    for (let j = i + 1; j < hyphae.length; j++) {
      const o = hyphae[j];
      if (o.kin !== h.kin) continue;
      const dx = o.x - h.x, dy = o.y - h.y, dz = o.z - h.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < 0.4 && d > 0.05) {
        // fusion: share energy, merge velocity
        const avg = (h.energy + o.energy) * 0.5;
        h.energy = avg; o.energy = avg;
        h.vx = (h.vx + o.vx) * 0.5;
        h.vy = (h.vy + o.vy) * 0.5;
        h.vz = (h.vz + o.vz) * 0.5;
        o.vx = h.vx; o.vy = h.vy; o.vz = h.vz;
      }
    }
    
    // branching: if energy is high and cooldown expired
    if (h.energy > 0.7 && h.branchCooldown === 0 && hyphae.length + toAdd.length < MAX_HYPHAE) {
      const perpAngle = Math.atan2(h.vz, h.vx) + (Math.random() - 0.5) * Math.PI * 0.7;
      const branchVel = 0.035;
      toAdd.push({
        x: h.x,
        y: h.y,
        z: h.z,
        vx: Math.cos(perpAngle) * branchVel,
        vy: (Math.random() - 0.5) * 0.01,
        vz: Math.sin(perpAngle) * branchVel,
        trail: [{ x: h.x, y: h.y, z: h.z, age: h.age }],
        age: 0,
        energy: h.energy * 0.4,
        branchCooldown: 200,
        kin: h.kin
      });
      h.energy *= 0.6;
      h.branchCooldown = 150;
    }
  }
  
  for (let i = toRemove.length - 1; i >= 0; i--) {
    hyphae.splice(toRemove[i], 1);
  }
  for (const h of toAdd) hyphae.push(h);
}

// particle system: spores and hyphal glow
const N_PARTICLES = 40000;
const pPos = new Float32Array(N_PARTICLES * 3);
const pSeed = new Float32Array(N_PARTICLES);
const pType = new Float32Array(N_PARTICLES); // 0=hyphal trail, 1=tip glow, 2=spore
for (let i = 0; i < N_PARTICLES; i++) pSeed[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(pSeed, 1));
geom.setAttribute('ptype', new THREE.BufferAttribute(pType, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float ptype;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec3 p = position;
      
      // hyphal trail particles drift slightly with micro-currents
      if (ptype < 0.5) {
        float drift = uTime * 0.2 + seed * 6.28;
        p.x += sin(drift) * 0.004;
        p.z += cos(drift * 1.3) * 0.004;
      }
      
      // tip glow particles pulse
      float pulse = 1.0;
      if (ptype > 0.5 && ptype < 1.5) {
        pulse = 0.7 + 0.3 * sin(uTime * 2.0 + seed * 20.0);
      }
      
      // spore particles (type=2) drift more
      if (ptype > 1.5) {
        float t = uTime * 0.15 + seed * 10.0;
        p.x += sin(t) * 0.02;
        p.y += sin(t * 1.7) * 0.015;
        p.z += cos(t * 0.9) * 0.02;
        pulse = 0.5 + 0.3 * sin(uTime * 1.5 + seed * 15.0);
      }
      
      // palette: fungal cream/tan/white — no bright colors, substrate palette
      vec3 cream = vec3(0.82, 0.76, 0.66);
      vec3 tan = vec3(0.72, 0.65, 0.52);
      vec3 white = vec3(0.92, 0.88, 0.82);
      
      if (ptype < 0.5) {
        // hyphal trail: aged cream
        vCol = mix(tan, cream, seed) * 0.5;
        vAlpha = 0.15;
      } else if (ptype < 1.5) {
        // tip glow: brighter cream with pulse
        vCol = mix(cream, white, seed * 0.4) * pulse;
        vAlpha = 0.45 * pulse;
      } else {
        // spores: dim white motes
        vCol = white * 0.6 * pulse;
        vAlpha = 0.25 * pulse;
      }
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      float sz = 1.2;
      if (ptype > 0.5 && ptype < 1.5) sz = 2.0;
      if (ptype > 1.5) sz = 0.9;
      
      gl_PointSize = sz * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float core = exp(-r * 20.0);
      float halo = exp(-r * 6.0) * 0.4;
      float a = (core + halo) * vAlpha;
      
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// hyphal thread lines (very thin, low-opacity)
const lineGeom = new THREE.BufferGeometry();
const linePos = new Float32Array(MAX_HYPHAE * MAX_TRAIL * 3);
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({
  color: 0x4a4238,
  transparent: true,
  opacity: 0.18
});
const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 400; s++) step();

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  for (let s = 0; s < 2; s++) step();
  
  // camera drifts low through substrate (beetle POV)
  const drift = t * 0.08;
  camera.position.x = -6 + Math.sin(drift * 0.3) * 4;
  camera.position.y = 0.2 + Math.sin(drift * 0.5) * 0.15;
  camera.position.z = 4 + Math.cos(drift * 0.3) * 4;
  
  // look at network centroid, not origin
  let cx = 0, cy = 0, cz = 0, cnt = 0;
  for (const h of hyphae) {
    cx += h.x; cy += h.y; cz += h.z; cnt++;
  }
  if (cnt > 0) {
    cx /= cnt; cy /= cnt; cz /= cnt;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
  }
  
  // distribute particles
  let idx = 0;
  
  // hyphal trails
  for (const h of hyphae) {
    const trailShare = Math.floor(N_PARTICLES * 0.5 / hyphae.length);
    for (let i = 0; i < h.trail.length && idx < N_PARTICLES; i++) {
      const share = Math.ceil(trailShare / h.trail.length);
      const pt = h.trail[i];
      for (let k = 0; k < share && idx < N_PARTICLES; k++) {
        const spread = 0.02;
        pPos[idx * 3] = pt.x + (Math.random() - 0.5) * spread;
        pPos[idx * 3 + 1] = pt.y + (Math.random() - 0.5) * spread * 0.3;
        pPos[idx * 3 + 2] = pt.z + (Math.random() - 0.5) * spread;
        pType[idx] = 0;
        idx++;
      }
    }
  }
  
  // tip glow
  for (const h of hyphae) {
    const tipShare = 50;
    for (let k = 0; k < tipShare && idx < N_PARTICLES; k++) {
      const spread = 0.03;
      pPos[idx * 3] = h.x + (Math.random() - 0.5) * spread;
      pPos[idx * 3 + 1] = h.y + (Math.random() - 0.5) * spread * 0.5;
      pPos[idx * 3 + 2] = h.z + (Math.random() - 0.5) * spread;
      pType[idx] = 1;
      idx++;
    }
  }
  
  // spores scattered in substrate
  while (idx < N_PARTICLES) {
    const theta = Math.random() * Math.PI * 2;
    const r = 2 + Math.random() * 10;
    pPos[idx * 3] = Math.cos(theta) * r;
    pPos[idx * 3 + 1] = (Math.random() - 0.5) * 0.8;
    pPos[idx * 3 + 2] = Math.sin(theta) * r;
    pType[idx] = 2;
    idx++;
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.ptype.needsUpdate = true;
  
  // update thread lines
  let lineIdx = 0;
  for (const h of hyphae) {
    for (let i = 0; i < h.trail.length - 1; i++) {
      const a = h.trail[i], b = h.trail[i + 1];
      linePos[lineIdx++] = a.x;
      linePos[lineIdx++] = a.y;
      linePos[lineIdx++] = a.z;
      linePos[lineIdx++] = b.x;
      linePos[lineIdx++] = b.y;
      linePos[lineIdx++] = b.z;
    }
  }
  lineGeom.setDrawRange(0, lineIdx / 3);
  lineGeom.attributes.position.needsUpdate = true;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
