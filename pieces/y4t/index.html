<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&lt;NEW_ID&gt; · nocturne · whistler reflection</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#020318; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">&lt;NEW_ID&gt;</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Whistler's Nocturne in Blue and Silver — the differential-growth arabesque
// ribbon from 7wq now drifts through deep night, its IKB blue cooled to
// midnight indigo. A reflective water plane below mirrors the form as a dim
// silver ghost. Movement slows to a dreamlike drift. The additive planes
// become moonlit motes — silver-white at their brightest overlap, dissolving
// to indigo at the edges. Chopin-tempo rotation.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 7, 22);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020318, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15; // slower, nocturnal drift

// ─────────── differential growth (from ajo/5gm → 7wq) ───────────
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE_S   = 0.003;
const PRESSURE  = 0.003;
const RISE      = 0.004;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++) {
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const k = Math.floor(v.x / CELL) + ',' + Math.floor(v.y / CELL) + ',' + Math.floor(v.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function cellNeighbors(v) {
  const cx = Math.floor(v.x / CELL), cy = Math.floor(v.y / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of cellNeighbors(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dy[i] += (oy / d) * PRESSURE * 0.4;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE_S;
    verts[i].y += dy[i] + (Math.random() - 0.5) * NOISE_S * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE_S;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 - 0.05, z: (a.z + b.z) * 0.5,
                    age: Math.max(a.age, b.age) * 0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-simulate growth
for (let s = 0; s < 1200; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── nocturne plane field ───────────
const PLANES_PER_VERT = 4;
const MAX_PLANES = MAX_VERTS * PLANES_PER_VERT;
const PLANE_SIZE = 0.38;

const planeGeo = new THREE.PlaneGeometry(1, 1);

// Main form: midnight indigo with silver moonlight at overlaps
const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColorDeep: { value: new THREE.Color(0.02, 0.04, 0.18) },   // midnight indigo
    uColorMoon: { value: new THREE.Color(0.55, 0.62, 0.78) },   // silver moonlight
    uOpacity: { value: 0.06 },
  },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vBreath;
    varying float vHeight;

    void main() {
      vUv = uv;

      vec3 iPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      float s = length(vec3(instanceMatrix[0][0], instanceMatrix[0][1], instanceMatrix[0][2]));

      vHeight = iPos.y;
      // nocturnal breath — slower, like moonlight drifting across water
      vBreath = 0.5 + 0.5 * sin(iPos.x * 0.3 + iPos.y * 0.2 + iPos.z * 0.4 + uTime * 0.06);

      vec4 viewPos = modelViewMatrix * vec4(iPos, 1.0);
      viewPos.xy += position.xy * s;

      gl_Position = projectionMatrix * viewPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uColorDeep;
    uniform vec3 uColorMoon;
    uniform float uOpacity;
    uniform float uTime;
    varying vec2 vUv;
    varying float vBreath;
    varying float vHeight;

    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float falloff = 1.0 - smoothstep(0.0, 1.0, d);
      falloff *= falloff;

      // mix indigo→silver based on height and breath (upper regions catch more moonlight)
      float moonFactor = smoothstep(2.0, 12.0, vHeight) * vBreath;
      vec3 col = mix(uColorDeep, uColorMoon, moonFactor * 0.6);

      col *= uOpacity * (0.7 + 0.3 * vBreath) * falloff;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  transparent: true,
  side: THREE.DoubleSide,
});

const mesh = new THREE.InstancedMesh(planeGeo, planeMat, MAX_PLANES);
mesh.count = 0;
mesh.frustumCulled = false;
scene.add(mesh);

// ─────────── reflection (Whistler's water) ───────────
const reflMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColorDeep: { value: new THREE.Color(0.01, 0.02, 0.08) },
    uColorMoon: { value: new THREE.Color(0.2, 0.24, 0.35) },
    uOpacity: { value: 0.025 },
  },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vBreath;
    varying float vDepth;

    void main() {
      vUv = uv;

      vec3 iPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
      float s = length(vec3(instanceMatrix[0][0], instanceMatrix[0][1], instanceMatrix[0][2]));

      // mirror Y below water plane (y=0), with slight ripple distortion
      vec3 reflPos = iPos;
      reflPos.y = -reflPos.y - 0.5;
      reflPos.x += sin(reflPos.y * 2.0 + uTime * 0.3) * 0.12;
      reflPos.z += cos(reflPos.y * 1.5 + uTime * 0.2) * 0.08;

      vDepth = -reflPos.y;
      vBreath = 0.4 + 0.3 * sin(reflPos.x * 0.5 + uTime * 0.08);

      vec4 viewPos = modelViewMatrix * vec4(reflPos, 1.0);
      viewPos.xy += position.xy * s * 1.1; // slightly stretched reflection

      gl_Position = projectionMatrix * viewPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uColorDeep;
    uniform vec3 uColorMoon;
    uniform float uOpacity;
    varying vec2 vUv;
    varying float vBreath;
    varying float vDepth;

    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float falloff = 1.0 - smoothstep(0.0, 1.0, d);
      falloff *= falloff;

      // reflection fades with depth
      float fade = 1.0 / (1.0 + vDepth * 0.15);
      vec3 col = mix(uColorDeep, uColorMoon, vBreath * 0.4);
      col *= uOpacity * falloff * fade * vBreath;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: false,
  transparent: true,
  side: THREE.DoubleSide,
});

const reflMesh = new THREE.InstancedMesh(planeGeo, reflMat, MAX_PLANES);
reflMesh.count = 0;
reflMesh.frustumCulled = false;
scene.add(reflMesh);

// ─────────── water horizon line (subtle) ───────────
const horizonGeo = new THREE.PlaneGeometry(60, 0.02);
const horizonMat = new THREE.MeshBasicMaterial({
  color: 0x1a2040,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const horizon = new THREE.Mesh(horizonGeo, horizonMat);
horizon.position.y = -0.2;
horizon.rotation.x = -Math.PI / 2;
scene.add(horizon);

// per-instance scatter
const scatterX = new Float32Array(MAX_PLANES);
const scatterY = new Float32Array(MAX_PLANES);
const scatterZ = new Float32Array(MAX_PLANES);
const scatterS = new Float32Array(MAX_PLANES);
for (let i = 0; i < MAX_PLANES; i++) {
  scatterX[i] = (Math.random() - 0.5) * 0.3;
  scatterY[i] = (Math.random() - 0.5) * 0.3;
  scatterZ[i] = (Math.random() - 0.5) * 0.3;
  scatterS[i] = PLANE_SIZE * (0.6 + Math.random() * 0.8);
}

const dummy = new THREE.Object3D();

function updatePlanes() {
  const nv = verts.length;
  const count = Math.min(nv * PLANES_PER_VERT, MAX_PLANES);
  mesh.count = count;
  reflMesh.count = count;

  for (let i = 0; i < nv; i++) {
    const v = verts[i];
    for (let p = 0; p < PLANES_PER_VERT; p++) {
      const idx = i * PLANES_PER_VERT + p;
      if (idx >= MAX_PLANES) break;
      const s = scatterS[idx];
      dummy.position.set(
        v.x + scatterX[idx],
        v.y + scatterY[idx],
        v.z + scatterZ[idx]
      );
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      mesh.setMatrixAt(idx, dummy.matrix);
      reflMesh.setMatrixAt(idx, dummy.matrix);
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  reflMesh.instanceMatrix.needsUpdate = true;
}

updatePlanes();

// ─────────── resize ───────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── animation ───────────
const t0 = performance.now();
let frameCount = 0;

function loop() {
  const t = (performance.now() - t0) / 1000;
  planeMat.uniforms.uTime.value = t;
  reflMat.uniforms.uTime.value = t;

  // slow continued growth
  if (frameCount % 3 === 0) {
    for (let s = 0; s < 2; s++) step();
    updatePlanes();
  }

  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (const v of verts) { cx += v.x; cy += v.y; cz += v.z; }
  const n = Math.max(verts.length, 1);
  cx /= n; cy /= n; cz /= n;
  const targetY = Math.max(cy, 2.0);
  controls.target.x += (cx - controls.target.x) * 0.02;
  controls.target.y += (targetY - controls.target.y) * 0.02;
  controls.target.z += (cz - controls.target.z) * 0.02;

  const desiredCamY = targetY + 2;
  camera.position.y += (desiredCamY - camera.position.y) * 0.015;

  controls.update();
  renderer.render(scene, camera);
  frameCount++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
