<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a18 · naïve deep-time</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0b08; overflow:hidden;
               color:#8a8378; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .counter { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em;
             line-height:1.6; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">a18</div>
<div class="counter" id="counter">
  epoch: cambrian<br>
  years wondered at: 0<br>
  particles released: 0 / 70000<br>
  warmth: 4500 ppm
</div>
<div class="src">henri rousseau · the dream<br>innocence as a way of seeing</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── deep-time trajectory preserved from parent
const EPOCHS = [
  { name: 'cambrian',     start: -542, end: -485, co2: 4500 },
  { name: 'ordovician',   start: -485, end: -444, co2: 4200, extinction: { at: -444, kill: 0.86 } },
  { name: 'silurian',     start: -444, end: -419, co2: 4500 },
  { name: 'devonian',     start: -419, end: -359, co2: 2200, extinction: { at: -375, kill: 0.75 } },
  { name: 'carboniferous',start: -359, end: -299, co2: 800 },
  { name: 'permian',      start: -299, end: -252, co2: 900, extinction: { at: -252, kill: 0.96 } },
  { name: 'triassic',     start: -252, end: -201, co2: 1750, extinction: { at: -201, kill: 0.80 } },
  { name: 'jurassic',     start: -201, end: -145, co2: 1950 },
  { name: 'cretaceous',   start: -145, end: -66,  co2: 1700, extinction: { at: -66, kill: 0.75 } },
  { name: 'paleogene',    start: -66,  end: -23,  co2: 500 },
  { name: 'neogene',      start: -23,  end: -2.6, co2: 280 },
  { name: 'quaternary',   start: -2.6, end: 0,    co2: 280 },
  { name: 'anthropocene', start: 0,    end: 0.27, co2: 420 }
];
const TOTAL_SPAN = 542 + 0.27;
const REALTIME_SCALE = 120;

function getEpochAt(mya){
  for (const e of EPOCHS) if (mya >= e.start && mya <= e.end) return e;
  return EPOCHS[EPOCHS.length - 1];
}

function co2At(mya){
  const e = getEpochAt(mya);
  if (!e) return 280;
  if (mya >= 0){
    const t = mya / 0.27;
    return 280 * Math.exp(t * Math.log(420 / 280));
  }
  return e.co2;
}

// ────────────── scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 10, 34);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0b08, 1);
document.body.appendChild(renderer.domElement);

// ────────────── geometry: naïve morph — rounder, softer mounds → lush simple jungle
const N = 70000;
const poseA = new Float32Array(N * 3);
const poseB = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const extinctionTime = new Float32Array(N); // -1 = alive, else = time of extinction

// stromatolites: rounder bubbles — naïve's simplification of complex biology
const MOUNDS = 10;
const moundCenters = [];
for (let i = 0; i < MOUNDS; i++){
  const angle = (i / MOUNDS) * Math.PI * 2;
  const r = 5 + Math.random() * 3.5;
  moundCenters.push({
    x: Math.cos(angle) * r,
    z: Math.sin(angle) * r,
    radius: 1.8 + Math.random() * 1.2, // rounder, more bubble-like
    h: 2.0 + Math.random() * 2.0
  });
}

for (let i = 0; i < N; i++){
  const m = moundCenters[Math.floor(Math.random() * MOUNDS)];
  // spherical sampling — rounder than parent's domes (naïve simplification)
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const shell = Math.pow(Math.random(), 0.35);
  const sr = m.radius * shell;
  poseA[i*3]   = m.x + Math.sin(phi) * Math.cos(theta) * sr;
  poseA[i*3+1] = Math.abs(Math.cos(phi)) * m.h * shell; // half-sphere, always above ground
  poseA[i*3+2] = m.z + Math.sin(phi) * Math.sin(theta) * sr;
  seeds[i] = Math.random();
  extinctionTime[i] = -1.0;
}

// rousseau jungle: lush round canopies on simple trunks
const TREES = 14;
const treeBases = [];
for (let t = 0; t < TREES; t++){
  const angle = (t / TREES) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
  const r = 4 + Math.random() * 5;
  treeBases.push({
    x: Math.cos(angle) * r,
    z: Math.sin(angle) * r,
    h: 7 + Math.random() * 5,
    canopyR: 1.5 + Math.random() * 1.5
  });
}

for (let i = 0; i < N; i++){
  const tree = treeBases[Math.floor(Math.random() * TREES)];
  const isTrunk = Math.random() < 0.25;
  if (isTrunk){
    // simple trunk — naïve straight line
    const y = Math.random() * tree.h * 0.7;
    const tw = 0.12 * (1.0 - 0.5 * y / tree.h);
    const ta = Math.random() * Math.PI * 2;
    poseB[i*3]   = tree.x + Math.cos(ta) * tw;
    poseB[i*3+1] = y;
    poseB[i*3+2] = tree.z + Math.sin(ta) * tw;
  } else {
    // round canopy — childlike lollipop tree shape
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const cr = tree.canopyR * Math.pow(Math.random(), 0.4);
    poseB[i*3]   = tree.x + Math.sin(phi) * Math.cos(theta) * cr;
    poseB[i*3+1] = tree.h * 0.7 + Math.cos(phi) * cr + cr;
    poseB[i*3+2] = tree.z + Math.sin(phi) * Math.sin(theta) * cr;
  }
}

// ────────────── extinction: particles float upward instead of vanishing
const speciesGroup = new Float32Array(N);
for (let i = 0; i < N; i++) speciesGroup[i] = Math.random();

let totalCulled = 0;
let currentRealtime = 0;

function cullExtinction(killFrac){
  const threshold = 1.0 - killFrac;
  let culled = 0;
  for (let i = 0; i < N; i++){
    if (extinctionTime[i] < 0 && speciesGroup[i] > threshold){
      extinctionTime[i] = currentRealtime; // record when they were released
      culled++;
    }
  }
  totalCulled += culled;
  return culled;
}

// ────────────── shader
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uMya:    { value: -542 },
  uCO2:    { value: 4500 },
  uMorph:  { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',  new THREE.BufferAttribute(poseA.slice(), 3));
geom.setAttribute('poseA',     new THREE.BufferAttribute(poseA, 3));
geom.setAttribute('poseB',     new THREE.BufferAttribute(poseB, 3));
geom.setAttribute('seed',      new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('extTime',   new THREE.BufferAttribute(extinctionTime, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMya;
    uniform float uCO2;
    uniform float uMorph;
    attribute vec3 poseA;
    attribute vec3 poseB;
    attribute float seed;
    attribute float extTime;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      float m = smoothstep(0.0, 1.0, uMorph);
      vec3 p = mix(poseA, poseB, m);

      // naïve: gentle CO₂ breathing — expansion feels like wonder, not threat
      float co2_norm = (uCO2 - 280.0) / (4500.0 - 280.0);
      float breath = co2_norm * 0.15;
      p.x += p.x * breath;
      p.z += p.z * breath;
      p.y += co2_norm * (p.y / 14.0) * 0.6;

      // childlike bobbing — simple sine, no geological weight
      float bob_t = uTime * 0.3 + seed * 6.28;
      p.x += sin(bob_t) * 0.08;
      p.y += sin(bob_t * 1.3 + 1.0) * 0.06;
      p.z += cos(bob_t * 0.9) * 0.08;

      // released particles float upward gently — naïve view of extinction
      // they don't die, they just drift away like dandelion seeds
      float released = 0.0;
      if (extTime >= 0.0){
        float since = uTime - extTime;
        float rise = since * 0.8; // gentle float
        p.y += rise;
        // gentle horizontal drift while ascending
        p.x += sin(seed * 20.0 + since * 0.4) * since * 0.15;
        p.z += cos(seed * 30.0 + since * 0.3) * since * 0.15;
        released = 1.0;
        // fade over 8 seconds
        float fadeOut = 1.0 - smoothstep(0.0, 8.0, since);
        if (fadeOut <= 0.0){
          gl_Position = vec4(0.0, 0.0, -1000.0, 1.0);
          gl_PointSize = 0.0;
          return;
        }
        vAlpha = fadeOut * 0.5;
      } else {
        vAlpha = 0.45 + 0.25 * sin(bob_t * 0.5);
      }

      // palette: naïve warmth — honey gold to soft rose
      // innocence sees warmth even in deep time
      vec3 warm   = vec3(0.62, 0.48, 0.28); // honey
      vec3 tender = vec3(0.55, 0.38, 0.35); // dusty rose
      float rose_t = smoothstep(-200.0, 0.0, uMya);
      vCol = mix(warm, tender, rose_t);

      // released particles glow slightly warmer — ascending light
      if (released > 0.5){
        vCol = mix(vCol, vec3(0.65, 0.52, 0.36), 0.4);
      }

      // height shading — gentler than parent, more even illumination
      float shade = 0.6 + 0.4 * clamp(p.y / 14.0, 0.0, 1.0);
      vCol *= shade;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // slightly larger points — rounder, softer feel
      gl_PointSize = 0.85 * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // softer falloff — rounder, more innocent particles
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── camera tracking centroid of live particles
function computeCentroid(){
  let cx = 0, cy = 0, cz = 0, count = 0;
  const pos = geom.attributes.poseA.array;
  const posB = geom.attributes.poseB.array;
  const ext = geom.attributes.extTime.array;
  const m = Math.min(1, Math.max(0, uniforms.uMorph.value));
  for (let i = 0; i < N; i += 8){ // sample every 8th for perf
    if (ext[i] < 0){
      const px = pos[i*3] * (1-m) + posB[i*3] * m;
      const py = pos[i*3+1] * (1-m) + posB[i*3+1] * m;
      const pz = pos[i*3+2] * (1-m) + posB[i*3+2] * m;
      cx += px; cy += py; cz += pz; count++;
    }
  }
  if (count === 0) return new THREE.Vector3(0, 6, 0);
  return new THREE.Vector3(cx / count, cy / count, cz / count);
}

// ────────────── naïve epoch naming — childlike wonder
const naiveNames = {
  'cambrian':      'the first bubbles',
  'ordovician':    'cold surprise',
  'silurian':      'green arrives',
  'devonian':      'fish learn to breathe',
  'carboniferous': 'the big ferns',
  'permian':       'too much heat',
  'triassic':      'starting over',
  'jurassic':      'the tall ones',
  'cretaceous':    'the bright rock falls',
  'paleogene':     'small and warm',
  'neogene':       'grass everywhere',
  'quaternary':    'the ice comes',
  'anthropocene':  'now'
};

// ────────────── animation loop
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastExtinctionCheck = -1000;
const counter = document.getElementById('counter');
const start = performance.now();

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  currentRealtime = elapsed;
  uniforms.uTime.value = elapsed;

  const mya = -542 + (elapsed / REALTIME_SCALE) * TOTAL_SPAN;
  uniforms.uMya.value = mya;
  const co2 = co2At(mya);
  uniforms.uCO2.value = co2;

  const morph = (mya + 542) / TOTAL_SPAN;
  uniforms.uMorph.value = Math.pow(morph, 1.5);

  // check for mass extinctions
  const epoch = getEpochAt(mya);
  if (epoch && epoch.extinction){
    const ext = epoch.extinction;
    if (mya >= ext.at && lastExtinctionCheck < ext.at){
      cullExtinction(ext.kill);
      geom.attributes.extTime.array.set(extinctionTime);
      geom.attributes.extTime.needsUpdate = true;
      lastExtinctionCheck = ext.at;
    }
  }

  // naïve counter — wonder instead of data
  const years = Math.round(Math.abs(mya) * 1e6);
  const epochName = epoch ? epoch.name : 'unknown';
  const naiveName = naiveNames[epochName] || epochName;
  counter.innerHTML = `chapter: ${naiveName}<br>years wondered at: ${years.toLocaleString()}<br>particles released: ${totalCulled.toLocaleString()} / ${N.toLocaleString()}<br>warmth: ${Math.round(co2)} ppm`;

  // camera: gentle orbit, slightly closer — child's eye level
  const centroid = computeCentroid();
  const ang = elapsed * 0.035;
  const camR = 34 - morph * 8;
  camera.position.x = centroid.x + Math.sin(ang) * camR;
  camera.position.z = centroid.z + Math.cos(ang) * camR;
  camera.position.y = centroid.y + 8 + morph * 3;
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
