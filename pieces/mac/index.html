<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glitch attractor · Rosa Menkman</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">mac</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070b, 1);
document.body.appendChild(renderer.domElement);

// ping-pong state
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// scene render target for post-processing
const sceneRT = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat, type: THREE.UnsignedByteType
});

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 8.0;
  init[i*4+1] = (Math.random()*2-1) * 8.0;
  init[i*4+2] = (Math.random()*2-1) * 8.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 },
  uGlitchTime: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta, uGlitchTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      // glitch jitter: occasionally scrub ahead rapidly
      float jitter = step(0.92, fract(sin(uGlitchTime * 3.7 + vUv.x * 11.3) * 43758.5));
      float dt = uDt * (1.0 + jitter * 8.0);
      p += dp * dt;
      age = mod(age + dt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render particles
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying vec3 vPos;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x*p.z,
        p.x * p.y - (8.0/3.0) * p.z
      )) * 0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      p.z -= 25.0;
      vPos = p;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + 1.8 * vSpeed) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge, vSpeed;
    varying vec3 vPos;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 10.0);
      // quantized 5-color palette — posterization is the point
      float k = mod(vAge + vSpeed * 0.3, 1.0);
      vec3 col;
      if (k < 0.2) col = vec3(0.0, 0.95, 0.85);       // cyan
      else if (k < 0.4) col = vec3(0.95, 0.0, 0.45);   // hot pink
      else if (k < 0.6) col = vec3(0.1, 0.15, 0.9);    // blue
      else if (k < 0.8) col = vec3(0.95, 0.95, 0.0);   // yellow
      else col = vec3(0.9, 0.3, 0.0);                   // orange
      gl_FragColor = vec4(col * a * (0.5 + vSpeed * 0.8), a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// post-processing: glitch pass with block artifacts, channel separation, pixel stretch
const glitchUniforms = {
  tScene: { value: sceneRT.texture },
  uTime: { value: 0.0 },
  uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
  uGlitchIntensity: { value: 0.0 },
  uFrameSkip: { value: 0.0 }
};

const glitchMat = new THREE.ShaderMaterial({
  uniforms: glitchUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tScene;
    uniform float uTime, uGlitchIntensity, uFrameSkip;
    uniform vec2 uResolution;
    varying vec2 vUv;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float hash1(float n){ return fract(sin(n) * 43758.5453); }

    void main(){
      vec2 uv = vUv;
      float t = uTime;

      // 8x8 block quantization — JPEG artifact simulation
      vec2 blockSize = vec2(8.0) / uResolution;
      vec2 blockUV = floor(uv / blockSize) * blockSize;
      float blockNoise = hash(blockUV + floor(t * 2.0));

      // determine if this block gets glitched
      float blockGlitch = step(0.82 - uGlitchIntensity * 0.3, blockNoise);

      // vertical pixel stretch — zalgo effect on certain rows
      float rowHash = hash1(floor(uv.y * uResolution.y * 0.125) + floor(t * 4.7));
      float stretch = step(0.93 - uGlitchIntensity * 0.15, rowHash);
      if (stretch > 0.5) {
        // smear horizontally from a fixed x
        float smearSrc = hash1(floor(uv.y * uResolution.y * 0.125) + 99.0);
        uv.x = mix(uv.x, smearSrc, 0.7);
      }

      // RGB channel separation — chromatic aberration beyond tasteful
      float aberration = (0.004 + uGlitchIntensity * 0.012) * (1.0 + blockGlitch * 3.0);
      float angle = t * 0.5 + hash(blockUV) * 6.28;
      vec2 rOff = vec2(cos(angle), sin(angle)) * aberration;
      vec2 bOff = vec2(cos(angle + 2.09), sin(angle + 2.09)) * aberration;

      float r = texture2D(tScene, uv + rOff).r;
      float g = texture2D(tScene, uv).g;
      float b = texture2D(tScene, uv + bOff).b;

      vec3 col = vec3(r, g, b);

      // block artifact: shift color in glitched blocks
      if (blockGlitch > 0.5) {
        vec2 shiftUV = blockUV + vec2(hash(blockUV + 7.0) - 0.5, 0.0) * 0.04;
        vec3 blockCol = texture2D(tScene, shiftUV).rgb;
        col = mix(col, blockCol.gbr, 0.6); // channel swap in block
      }

      // posterize to ~5 levels per channel
      col = floor(col * 5.0 + 0.5) / 5.0;

      // scanline overlay
      float scan = 0.92 + 0.08 * sin(uv.y * uResolution.y * 3.14159);
      col *= scan;

      // frame skip flash — brief white/invert burst
      if (uFrameSkip > 0.5) {
        float flashZone = step(0.4, hash(uv * 10.0 + t));
        col = mix(col, 1.0 - col, flashZone * 0.4);
      }

      // vignette with glitch color
      float vig = 1.0 - dot((uv - 0.5) * 1.4, (uv - 0.5) * 1.4);
      col *= vig;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const glitchScene = new THREE.Scene();
glitchScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), glitchMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sceneRT.setSize(innerWidth, innerHeight);
  glitchUniforms.uResolution.value.set(innerWidth, innerHeight);
});

// pointer nudges + glitch intensity
const target = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0, glitch: 0.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 8.0;
  target.sigma = 10.0 + nx * 3.0;
  target.glitch = Math.abs(nx) + Math.abs(ny); // edges = more glitch
});

let lastTime = performance.now();
let frameCount = 0;
let glitchIntensity = 0.3; // base glitch always present

function loop(){
  const now = performance.now();
  lastTime = now;
  frameCount++;

  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;
  simUniforms.uGlitchTime.value = now * 0.001;

  // glitch intensity eases toward target
  glitchIntensity += (0.3 + target.glitch * 0.7 - glitchIntensity) * 0.08;

  // frame skip: occasionally freeze sim for 2-4 frames then burst forward
  const skipBurst = Math.sin(now * 0.0013) > 0.85;
  const substeps = skipBurst ? 12 : 4;

  for (let i = 0; i < substeps; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now * 0.001;

  // camera orbits with occasional jitter
  const ang = now * 0.00015;
  const jitterX = (Math.sin(now * 0.037) > 0.9) ? (Math.random() - 0.5) * 5.0 : 0.0;
  const jitterY = (Math.sin(now * 0.023) > 0.92) ? (Math.random() - 0.5) * 3.0 : 0.0;
  camera.position.x = Math.sin(ang) * 75 + jitterX;
  camera.position.y = jitterY + Math.sin(now * 0.0003) * 8.0;
  camera.position.z = Math.cos(ang) * 75;
  camera.lookAt(0, 0, 0);

  // render scene to texture
  renderer.setRenderTarget(sceneRT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);

  // glitch post-process
  glitchUniforms.tScene.value = sceneRT.texture;
  glitchUniforms.uTime.value = now * 0.001;
  glitchUniforms.uGlitchIntensity.value = glitchIntensity;
  glitchUniforms.uFrameSkip.value = skipBurst ? 1.0 : 0.0;

  renderer.render(glitchScene, camOrtho);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
