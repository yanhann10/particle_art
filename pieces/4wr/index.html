<script type="importmap">

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040101, 0.009);

const camera = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.10));

const pL = new THREE.PointLight(0xffe0c0, 0.25, 55, 1.5);
pL.position.set(4.0, 16.0, -3.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0xc20018, 0.06, 35, 2.0);
pL2.position.set(-5.0, -10.0, 6.0);
scene.add(pL2);

let seed = 73195248;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 34, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — pale moon, presence-in-absence
const sphereCenter = new THREE.Vector3(1.5, 2.0, 0.0);
const SPHERE_R = 2.4;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8d8,
  emissive: 0xf0e8d8,
  emissiveIntensity: 0.6,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.38
});
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

const innerMat = new THREE.MeshBasicMaterial({
  color: 0xf5efe5,
  transparent: true,
  opacity: 0.15
});
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.78, 16, 12),
  innerMat
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

// ── SUSPENDED KEYS — Shiota's "Key in the Hand" (Venice 2015)
// 50,000 keys donated by the public, suspended on red yarn above two boats
// Here: small dark key-shaped fragments hanging from threads near the sphere
const NUM_KEYS = 65;
const keyPositions = [];
for(let i = 0; i < NUM_KEYS; i++){
  const dir = new THREE.Vector3(rng()-0.5, rng()*0.6 + 0.2, rng()-0.5).normalize();
  const dist = SPHERE_R + 1.5 + rng() * 10.0;
  const kp = sphereCenter.clone().add(dir.multiplyScalar(dist));
  keyPositions.push(kp);

  // Key shape: elongated shaft + small ring at top
  const keyGrp = new THREE.Group();
  const shaftL = 0.08 + rng() * 0.14;
  const shaftW = 0.012 + rng() * 0.008;
  // Shaft
  const shaftGeo = new THREE.PlaneGeometry(shaftW, shaftL);
  const keyColor = 0.015 + rng() * 0.025;
  const keyMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(keyColor, keyColor * 0.6, keyColor * 0.3),
    transparent: true,
    opacity: 0.25 + rng() * 0.4,
    side: THREE.DoubleSide
  });
  const shaft = new THREE.Mesh(shaftGeo, keyMat);
  shaft.position.y = -shaftL * 0.3;
  keyGrp.add(shaft);

  // Ring / bow at top
  const ringR = shaftW * (1.8 + rng());
  const ringGeo = new THREE.RingGeometry(ringR * 0.5, ringR, 8);
  const ring = new THREE.Mesh(ringGeo, keyMat);
  ring.position.y = shaftL * 0.25;
  keyGrp.add(ring);

  // Teeth — two small notches
  if(rng() < 0.7){
    const toothGeo = new THREE.PlaneGeometry(shaftW * 1.5, shaftW * 0.8);
    const t1 = new THREE.Mesh(toothGeo, keyMat);
    t1.position.set(shaftW * 0.7, -shaftL * 0.55, 0);
    keyGrp.add(t1);
    if(rng() < 0.6){
      const t2 = new THREE.Mesh(toothGeo, keyMat);
      t2.position.set(shaftW * 0.7, -shaftL * 0.7, 0);
      keyGrp.add(t2);
    }
  }

  keyGrp.position.copy(kp);
  keyGrp.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(keyGrp);
}

// Suspension wires from ceiling to sphere
const suspGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  sphereCenter.x - 0.25, hh, sphereCenter.z + 0.12,
  sphereCenter.x, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z,
  sphereCenter.x + 0.3, hh, sphereCenter.z - 0.18,
  sphereCenter.x + 0.08, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z + 0.04,
  sphereCenter.x + 0.04, hh, sphereCenter.z + 0.25,
  sphereCenter.x - 0.04, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z - 0.06,
  sphereCenter.x - 0.4, hh, sphereCenter.z - 0.3,
  sphereCenter.x - 0.12, sphereCenter.y + SPHERE_R + 0.1, sphereCenter.z + 0.02,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0404, transparent: true, opacity: 0.4
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng() * 2 - 1;
  const th = rng() * Math.PI * 2;
  const r2 = Math.sqrt(1 - u*u);
  return new THREE.Vector3(
    sphereCenter.x + SPHERE_R * r2 * Math.cos(th),
    sphereCenter.y + SPHERE_R * u,
    sphereCenter.z + SPHERE_R * r2 * Math.sin(th)
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — Fibonacci shells + angular quantization near sphere (Molnár: order→chaos)
const NUM_ANCHORS = 900;
const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [3.2, 5.5, 9.0, 14.0, 20.0];
const ptsPerShell = [55, 70, 90, 80, 65];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    // Near sphere: angular quantization to 15° increments (order)
    // Far: free placement (chaos)
    const orderFactor = Math.max(0, 1.0 - R / 18.0);
    const quantizedTh = orderFactor > 0.3
      ? Math.round(th / (Math.PI/12)) * (Math.PI/12) + (rng()-0.5)*0.15*(1-orderFactor)
      : th;
    const jitter = (1.0 - orderFactor * 0.7);
    const jx = (rng()-0.5) * 0.7 * jitter;
    const jy = (rng()-0.5) * 0.7 * jitter;
    const jz = (rng()-0.5) * 0.7 * jitter;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + r * Math.cos(quantizedTh) * R + jx,
      sphereCenter.y + y * R + jy,
      sphereCenter.z + r * Math.sin(quantizedTh) * R + jz
    ));
  }
}

while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.55 ? wallPt() : wallPt().lerp(sphereCenter, 0.15 + rng()*0.45);
  anchors.push(p);
}

// Void zones — deliberate negative space for the camera to look through
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 8, sphereCenter.y + 5, sphereCenter.z + 7), r: 3.5 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y - 6, sphereCenter.z - 8), r: 3.0 },
  { pos: new THREE.Vector3(sphereCenter.x + 9, sphereCenter.y + 9, sphereCenter.z + 4), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x - 3, sphereCenter.y - 3, sphereCenter.z - 10), r: 2.2 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCategory = new Uint8Array(NUM_LINES); // for opacity differentiation
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-sphereCenter.x, dy = my-sphereCenter.y, dz = mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  lineCategory[li] = cat || 0;
  li++;
}

// Cat A: Convergence threads — anchor/wall → sphere surface (blood vessels to the heart)
// These are the circulatory system — the red threads that converge as if the sphere is a beating heart
const catA = Math.floor(NUM_LINES * 0.42);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.30){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 12% stop short — threads reaching but failing to arrive (Quayola: the gap)
  if(rng() < 0.12){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.15 + rng()*1.5));
    setLine(a, target, 0);
  } else {
    setLine(a, sphereSurf(), 0);
  }
}

// Cat B: Key-suspension threads — from keys upward to ceiling or to nearby anchors
// Each key hangs from 1-3 red threads, as in "The Key in the Hand"
for(let i = 0; i < keyPositions.length && li < NUM_LINES; i++){
  const kp = keyPositions[i];
  // Thread to ceiling
  const ceilPt = new THREE.Vector3(
    kp.x + (rng()-0.5)*1.5,
    hh,
    kp.z + (rng()-0.5)*1.5
  );
  setLine(kp, ceilPt, 1);
  // Sometimes a second thread to a nearby anchor
  if(rng() < 0.6){
    let bestA = null, bestD = Infinity;
    for(let j = 0; j < 15; j++){
      const ai = Math.floor(rng()*anchors.length);
      const d = kp.distanceTo(anchors[ai]);
      if(d < bestD && d > 0.5 && d < 8.0){ bestD = d; bestA = anchors[ai]; }
    }
    if(bestA) setLine(kp, bestA, 1);
  }
  // Thread from key to sphere
  if(rng() < 0.3){
    setLine(kp, sphereSurf(), 1);
  }
}

// Cat C: Anchor-to-anchor structural web — proximity rule
const THRESHOLD = 6.5;
let catCcount = 0;
const catCtarget = Math.floor(NUM_LINES * 0.24);
let attempts = 0;
while(catCcount < catCtarget && li < NUM_LINES && attempts < 120000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best, 2);
  catCcount++;

  // Dendritic Y-fork — capillary growth (Andy Lomas: morphogenetic propagation)
  if(rng() < 0.15 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.15 + rng()*0.55);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.25 + rng()*0.9));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 2);
      catCcount++;
      // Second generation branch
      if(rng() < 0.3 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(bEnd, 0.45 + rng()*0.35);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.12 + rng()*0.4));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2, 2);
          catCcount++;
        }
      }
      // Third generation — finest capillaries
      if(rng() < 0.12 && li < NUM_LINES){
        const mid3 = mid.clone().lerp(bEnd, 0.7 + rng()*0.2);
        const bDir3 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd3 = mid3.clone().add(bDir3.multiplyScalar(0.08 + rng()*0.25));
        if(!inVoid(bEnd3)) setLine(mid3, bEnd3, 2);
      }
    }
  }
}

// Cat D: Dense near-sphere halo — circulatory corona
const catD = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const dir1 = s1.clone().sub(sphereCenter).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.2 + rng()*2.5));
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.2 + rng()*2.5)).add(tangent.multiplyScalar(0.8 + rng()*2.0));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB, 3);
}

// Cat E: Long wall-spanning threads — architectural scale
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.45 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);
const totalLines = li;

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.062,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── LEAF-SHAPED DARK FRAGMENTS — the leaf as basic unit
// Charred leaves caught in the web — memory residue, organic matter trapped in the circulatory network
const NUM_FRAGMENTS = 50;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const leafGeo = new THREE.BufferGeometry();
  const sz = 0.05 + rng()*0.15;
  const lw = sz * (0.25 + rng()*0.3);
  const lh = sz * (0.8 + rng()*1.0);
  // Leaf shape — pointed at tip and base, widest at center
  // Midrib with asymmetric lobes
  const asymL = 0.7 + rng()*0.6;
  const asymR = 0.7 + rng()*0.6;
  const tipBend = (rng()-0.5)*lw*0.3; // slightly curled tip
  const verts = new Float32Array([
    // Left lobe triangle
    0, lh*0.5 + tipBend*0.5, 0,
    -lw*asymL*0.5, lh*0.08, lw*0.05,
    0, -lh*0.5, 0,
    // Right lobe triangle
    0, lh*0.5 + tipBend*0.5, 0,
    lw*asymR*0.5, lh*0.05, -lw*0.04,
    0, -lh*0.5, 0,
    // Upper left sub-lobe
    0, lh*0.5 + tipBend*0.5, 0,
    -lw*asymL*0.35, lh*0.28, lw*0.03,
    -lw*asymL*0.5, lh*0.08, lw*0.05,
    // Upper right sub-lobe
    0, lh*0.5 + tipBend*0.5, 0,
    lw*asymR*0.35, lh*0.25, -lw*0.02,
    lw*asymR*0.5, lh*0.05, -lw*0.04,
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.008 + rng()*0.018;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.12, d*0.05),
    transparent: true,
    opacity: 0.15 + rng()*0.40,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  // Place along threads or orbiting sphere
  if(rng() < 0.55){
    const si = Math.floor(rng()*totalLines)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(SPHERE_R + 0.8 + rng()*9.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── ATMOSPHERIC DUST — barely visible motes floating in the void
const NUM_DUST = 400;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(NUM_DUST * 3);
const dustVel = new Float32Array(NUM_DUST * 3);
for(let i = 0; i < NUM_DUST; i++){
  dustPos[i*3]   = (rng()-0.5) * ROOM.w * 0.8;
  dustPos[i*3+1] = (rng()-0.5) * ROOM.h * 0.8;
  dustPos[i*3+2] = (rng()-0.5) * ROOM.d * 0.8;
  dustVel[i*3]   = (rng()-0.5) * 0.0003;
  dustVel[i*3+1] = rng() * 0.0002 + 0.00005;
  dustVel[i*3+2] = (rng()-0.5) * 0.0003;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0x3a1a12,
  size: 0.06,
  transparent: true,
  opacity: 0.12,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const dustPts = new THREE.Points(dustGeo, dustMat);
scene.add(dustPts);

// ── CAMERA PATH — intimate walk through the installation
// Starts far, draws close to the sphere, passes through thread density, pulls back through a void
const pathLen = 800;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;
  // Asymmetric orbit — intimate on one side, architectural on the other
  const rX = 4.5 + Math.sin(p * 0.5) * 2.5 + Math.sin(p * 1.7 + 1.2) * 0.5;
  const rZ = 6.5 + Math.cos(p * 0.6) * 3.0 + Math.cos(p * 0.35 + 0.8) * 0.8;
  const x = cx + Math.sin(p) * rX;
  // Vertical: slow cathedral-height rise, intimate sphere-level linger, descend
  const yBase = cy + 0.3;
  const yWave = Math.sin(p * 0.3 + 0.2) * 5.5 + Math.cos(p * 0.7 + 0.9) * 1.8;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible, proximity-dependent
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < totalLines; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    // Closer to sphere = more breathing (the heart pulses the network)
    const amp = 0.0012 * Math.max(0, 1.0 - dist / 22.0);
    const phase = basePositions[idx]*0.28 + basePositions[idx+1]*0.33 + i*0.0013;
    const breath = Math.sin(t*0.025 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.32;
      arr[vi+1] = basePositions[vi+1] + breath*0.25;
      arr[vi+2] = basePositions[vi+2] + breath*0.30;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Dust drift
  const dArr = dustGeo.attributes.position.array;
  for(let i = 0; i < NUM_DUST; i++){
    dArr[i*3]   += dustVel[i*3];
    dArr[i*3+1] += dustVel[i*3+1];
    dArr[i*3+2] += dustVel[i*3+2];
    // Wrap
    if(dArr[i*3+1] > hh * 0.8) dArr[i*3+1] = -hh * 0.8;
    if(Math.abs(dArr[i*3]) > hw * 0.8) dArr[i*3] *= -0.95;
    if(Math.abs(dArr[i*3+2]) > hd * 0.8) dArr[i*3+2] *= -0.95;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0008;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere — gravitational center, with micro-wander
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0035)*0.18;
  look.y += Math.cos(t*0.0028)*0.12;
  look.z += Math.sin(t*0.003)*0.10;
  camera.lookAt(look);

  // Light micro-drift
  pL.position.x = 4.0 + Math.sin(t*0.0018)*0.5;
  pL.position.y = 16.0 + Math.cos(t*0.0015)*0.25;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
