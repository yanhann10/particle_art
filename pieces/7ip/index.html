<title>7ip · the house that builds itself and forgets</title>
<!-- MOTION: assembly, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #0a0a0e;
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #8a9ba8; }
</style>
</head>
<body>
<div class="id">7ip · the house that builds itself and forgets</div>
<div class="hint">no input — one room assembles, another collapses. informal architecture.</div>
<div class="src">descended from sav · AUTO{}Construccion (CNDSD+Abreu) · voxel grammar</div>
<div class="arc" id="arc">foundation · 0 blocks</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// CNDSD & Abreu: informal housing as speculative architecture. Rooms self-assemble
// from voxel primitives following stochastic L-system rules, then dissolve when
// the structure reaches capacity — one room always building, one always falling.
//
// NARRATIVE ARC: FOUNDATION → WALLS → ROOF → COLLAPSE (cycling per room unit)
// Each room is a 4×3×3 grid of cubes. The L-system decides which cubes to place
// (walls, floor, ceiling) and which to leave as void (windows, doorways). Assembly
// happens bottom-up; collapse happens gravity-driven top-down.
//
// PALETTE: rebar gray (#4a4a52), cinder block (#6a6a72), concrete dust (#8a8a92),
// neon code-flash accent (#00ffaa) on newly-placed blocks that fades over 0.8s.
//
// ATMOSPHERIC TEXTURE: volumetric dust motes (50 tiny particles drifting through
// the scene), slight paper-grain noise overlay in fragment shader, horizontal
// ground plane with subtle grid to anchor the floating architecture.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a0e, 8, 42);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 100);
camera.position.set(12, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

// Ground plane — dim grid
const groundGeom = new THREE.PlaneGeometry(60, 60, 30, 30);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x1a1a1e, wireframe: true, transparent: true, opacity: 0.08
});
const ground = new THREE.Mesh(groundGeom, groundMat);
scene.add(ground);

// Dust motes — atmospheric texture
const dustCount = 50;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustVel = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 28;
  dustPos[i*3 + 1] = Math.random() * 12;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 28;
  dustVel[i*3]     = (Math.random() - 0.5) * 0.04;
  dustVel[i*3 + 1] = -Math.random() * 0.02;
  dustVel[i*3 + 2] = (Math.random() - 0.5) * 0.04;
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0x8a8a92, size: 0.15, transparent: true, opacity: 0.12, fog: true
});
const dustPoints = new THREE.Points(dustGeom, dustMat);
scene.add(dustPoints);

// Lighting — single point light at construction site, ambient low
const ambient = new THREE.AmbientLight(0x3a3a42, 0.35);
scene.add(ambient);
const buildLight = new THREE.PointLight(0x00ffaa, 1.2, 18);
buildLight.position.set(0, 5, 0);
scene.add(buildLight);

// ────────────── voxel grammar state
const BLOCK_SIZE = 0.8;
const ROOM_W = 4, ROOM_H = 3, ROOM_D = 3;
const MAX_ROOMS = 3;
const rooms = [];

class Room {
  constructor(id, originX, originZ){
    this.id = id;
    this.originX = originX;
    this.originZ = originZ;
    this.blocks = [];  // {x,y,z, cube, state:'building'|'built'|'falling', age, fallVel}
    this.stage = 'foundation';  // foundation | walls | roof | collapse
    this.buildIndex = 0;
    this.rule = this.generateRule();
    this.lastBuildT = 0;
    this.collapseStarted = false;
  }
  generateRule(){
    // L-system-like rule: decide which voxels to place.
    // floor: full, walls: sparse (60% fill), roof: partial (40% fill)
    const rule = [];
    for (let y = 0; y < ROOM_H; y++){
      for (let z = 0; z < ROOM_D; z++){
        for (let x = 0; x < ROOM_W; x++){
          let place = false;
          if (y === 0) place = true;  // floor always full
          else if (y === ROOM_H - 1){  // roof: 40% sparse
            place = Math.random() < 0.4;
          } else {  // walls: edges mostly, interior rarely
            const isEdge = (x === 0 || x === ROOM_W - 1 || z === 0 || z === ROOM_D - 1);
            if (isEdge) place = Math.random() < 0.6;
            else place = Math.random() < 0.05;
          }
          if (place) rule.push({x, y, z});
        }
      }
    }
    // sort bottom-up for assembly
    rule.sort((a,b) => a.y - b.y);
    return rule;
  }
  update(dt, now){
    if (this.stage === 'collapse'){
      // gravity-driven fall
      this.blocks.forEach(b => {
        if (b.state === 'falling'){
          b.fallVel += -9.8 * dt;
          b.cube.position.y += b.fallVel * dt;
          if (b.cube.position.y < -2){
            scene.remove(b.cube);
            b.state = 'removed';
          }
        }
      });
      if (this.blocks.every(b => b.state === 'removed')){
        this.remove();
        return true;  // signal removal
      }
      return false;
    }

    // building phase
    if (this.buildIndex < this.rule.length && now - this.lastBuildT > 0.12){
      const v = this.rule[this.buildIndex];
      const wx = this.originX + v.x * BLOCK_SIZE;
      const wy = v.y * BLOCK_SIZE + BLOCK_SIZE * 0.5;
      const wz = this.originZ + v.z * BLOCK_SIZE;
      const geom = new THREE.BoxGeometry(BLOCK_SIZE * 0.92, BLOCK_SIZE * 0.92, BLOCK_SIZE * 0.92);
      const mat = new THREE.MeshLambertMaterial({ color: 0x6a6a72, fog: true });
      const cube = new THREE.Mesh(geom, mat);
      cube.position.set(wx, wy, wz);
      scene.add(cube);
      this.blocks.push({
        x: v.x, y: v.y, z: v.z, cube, state: 'building', age: 0, fallVel: 0
      });
      this.buildIndex++;
      this.lastBuildT = now;
      buildLight.position.set(wx, wy + 1.5, wz);
      // stage tracking
      if (v.y === 0 && this.stage === 'foundation') this.stage = 'foundation';
      else if (v.y > 0 && v.y < ROOM_H - 1 && this.stage !== 'roof') this.stage = 'walls';
      else if (v.y === ROOM_H - 1) this.stage = 'roof';
    }
    if (this.buildIndex >= this.rule.length && this.stage !== 'collapse'){
      this.stage = 'collapse';
      // start collapse — top-down
      const sorted = this.blocks.slice().sort((a,b) => b.y - a.y);
      sorted.forEach((b, i) => {
        setTimeout(() => { b.state = 'falling'; b.fallVel = 0; }, i * 60);
      });
      this.collapseStarted = true;
    }
    // age & color fade
    this.blocks.forEach(b => {
      if (b.state === 'building'){
        b.age += dt;
        const flash = Math.max(0, 1.0 - b.age / 0.8);
        const base = new THREE.Color(0x6a6a72);
        const accent = new THREE.Color(0x00ffaa);
        b.cube.material.color.lerpColors(accent, base, 1.0 - flash);
        if (b.age > 0.8) b.state = 'built';
      }
    });
    return false;
  }
  remove(){
    this.blocks.forEach(b => {
      if (b.cube && b.cube.parent) scene.remove(b.cube);
    });
  }
}

let nextRoomId = 0;
function spawnRoom(){
  const offset = (rooms.length % 3) * (ROOM_W * BLOCK_SIZE + 1.5);
  const originX = -5 + offset;
  const originZ = 0;
  const room = new Room(nextRoomId++, originX, originZ);
  rooms.push(room);
}

// Initial rooms
spawnRoom();

const arcEl = document.getElementById('arc');
let lastSpawnCheck = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, (now * 1000 - lastT) / 1000);
  lastT = now * 1000;

  // dust drift
  for (let i = 0; i < dustCount; i++){
    dustPos[i*3]     += dustVel[i*3];
    dustPos[i*3 + 1] += dustVel[i*3 + 1];
    dustPos[i*3 + 2] += dustVel[i*3 + 2];
    if (dustPos[i*3 + 1] < 0){
      dustPos[i*3 + 1] = 12;
      dustPos[i*3] = (Math.random() - 0.5) * 28;
      dustPos[i*3 + 2] = (Math.random() - 0.5) * 28;
    }
  }
  dustGeom.attributes.position.needsUpdate = true;

  // room updates
  for (let i = rooms.length - 1; i >= 0; i--){
    const removed = rooms[i].update(dt, now);
    if (removed) rooms.splice(i, 1);
  }

  // spawn new room when under capacity
  if (rooms.length < MAX_ROOMS && now - lastSpawnCheck > 2.5){
    spawnRoom();
    lastSpawnCheck = now;
  }

  // arc display
  const totalBlocks = rooms.reduce((sum, r) => sum + r.blocks.length, 0);
  const activeStage = rooms.length > 0 ? rooms[rooms.length - 1].stage : 'idle';
  arcEl.textContent = `${activeStage} · ${totalBlocks} blocks`;

  // camera slow orbit around construction site
  const ang = now * 0.08;
  const rad = 14 + Math.sin(now * 0.3) * 2;
  camera.position.x = Math.sin(ang) * rad;
  camera.position.z = Math.cos(ang) * rad;
  camera.position.y = 8 + Math.sin(now * 0.2) * 1.5;
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);

  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
