<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x8z · Persian garden lattice (particle miniature)</title>
<!-- MOTION: gentle, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1410; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#998870; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#998870; }
</style>
</head>
<body>
<div class="id">x8z</div>
<div class="hint">click to regenerate garden</div>
<div class="src">Persian miniature structure · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 32;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1410, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points, mat;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPhase: { value: 0 },
};

mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    
    attribute vec3 cellPos;
    attribute float zone;
    attribute float phase;
    attribute float density;
    
    varying vec3 vColor;
    varying float vAlpha;
    
    vec3 getZoneColor(float z){
      if(z < 0.2) return vec3(0.12, 0.35, 0.45); // water - deep teal
      else if(z < 0.4) return vec3(0.82, 0.68, 0.35); // gold lattice
      else if(z < 0.6) return vec3(0.25, 0.45, 0.28); // foliage - muted jade
      else if(z < 0.8) return vec3(0.65, 0.25, 0.22); // brick - terracotta
      else return vec3(0.88, 0.82, 0.70); // cream - sky/background
    }
    
    void main(){
      vec3 p = cellPos;
      
      // Persian miniature characteristic: CONTAINED motion within rigid borders
      // Particles oscillate within their assigned cell boundary
      float t = uTime * 0.3 + phase * 6.28;
      float localOscillate = sin(t) * 0.08 * density;
      
      // Circular containment - keeps extreme density without overlap
      float angle = phase * 6.28 + uTime * 0.15;
      p.x += cos(angle) * localOscillate;
      p.y += sin(angle) * localOscillate;
      
      // Slight breathing of entire composition
      float breath = 1.0 + sin(uTime * 0.5 + uPhase) * 0.015;
      p.xy *= breath;
      
      // Zone determines color (miniature palette: water, gold, jade, brick, cream)
      vColor = getZoneColor(zone);
      
      // Alpha varies by density - Persian miniatures are DENSE with detail
      vAlpha = 0.3 + density * 0.5;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * (1.2 + density * 0.6);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Soft falloff but preserve color saturation
      float alpha = (1.0 - r * 4.0) * vAlpha;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

function buildGarden(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const positions = new Float32Array(N * 3);
  const cellPositions = new Float32Array(N * 3);
  const zones = new Float32Array(N);
  const phases = new Float32Array(N);
  const densities = new Float32Array(N);
  
  // Persian garden structure: chahar bagh (four-fold garden)
  // Radial quadrants divided by water channels
  const width = 28;
  const height = 28;
  
  // Define zones as concentric regions + quadrant divisions
  const centerX = 0;
  const centerY = 0;
  
  for(let i = 0; i < N; i++){
    // Generate position with extreme clustering in defined zones
    let x, y, zoneType, localDensity;
    
    const r = rng();
    
    if(r < 0.15){
      // Water channels (horizontal + vertical cross)
      const axis = rng() < 0.5 ? 0 : 1;
      if(axis === 0){
        x = (rng() - 0.5) * width;
        y = (rng() - 0.5) * 1.2; // narrow channel
      } else {
        x = (rng() - 0.5) * 1.2;
        y = (rng() - 0.5) * height;
      }
      zoneType = 0.1; // water
      localDensity = 0.85;
    } else if(r < 0.35){
      // Gold lattice framework (geometric border zones)
      const border = Math.floor(rng() * 4);
      const offset = (rng() - 0.5) * 0.4;
      if(border === 0){ // top
        x = (rng() - 0.5) * width;
        y = height * 0.5 + offset;
      } else if(border === 1){ // bottom
        x = (rng() - 0.5) * width;
        y = -height * 0.5 + offset;
      } else if(border === 2){ // left
        x = -width * 0.5 + offset;
        y = (rng() - 0.5) * height;
      } else { // right
        x = width * 0.5 + offset;
        y = (rng() - 0.5) * height;
      }
      zoneType = 0.3; // gold
      localDensity = 0.75;
    } else if(r < 0.65){
      // Foliage zones (dense quadrant fill)
      const quadrant = Math.floor(rng() * 4);
      const qx = quadrant % 2 === 0 ? -1 : 1;
      const qy = quadrant < 2 ? 1 : -1;
      
      // Cluster within quadrant using radial distribution
      const rad = Math.pow(rng(), 0.6) * width * 0.4;
      const ang = rng() * Math.PI * 0.5;
      x = qx * (width * 0.25 + rad * Math.cos(ang));
      y = qy * (height * 0.25 + rad * Math.sin(ang));
      
      zoneType = 0.5; // jade
      localDensity = 0.9; // extreme density like miniature foliage
    } else if(r < 0.85){
      // Architectural elements (brick - scattered pavilions)
      const pavilion = Math.floor(rng() * 4);
      const px = (pavilion % 2 === 0 ? -1 : 1) * (width * 0.3);
      const py = (pavilion < 2 ? 1 : -1) * (height * 0.3);
      
      x = px + (rng() - 0.5) * 2.5;
      y = py + (rng() - 0.5) * 2.5;
      
      zoneType = 0.7; // terracotta
      localDensity = 0.7;
    } else {
      // Sky/background (sparse cream particles)
      x = (rng() - 0.5) * width * 0.95;
      y = (rng() - 0.5) * height * 0.95;
      zoneType = 0.9; // cream
      localDensity = 0.3;
    }
    
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = (rng() - 0.5) * 0.5;
    
    cellPositions[i * 3] = x;
    cellPositions[i * 3 + 1] = y;
    cellPositions[i * 3 + 2] = positions[i * 3 + 2];
    
    zones[i] = zoneType;
    phases[i] = rng();
    densities[i] = localDensity;
  }
  
  return { positions, cellPositions, zones, phases, densities };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  uniforms.uPhase.value = rng() * 6.28;
  
  const { positions, cellPositions, zones, phases, densities } = buildGarden(seed);
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('cellPos', new THREE.BufferAttribute(cellPositions, 3));
    geom.setAttribute('zone', new THREE.BufferAttribute(zones, 1));
    geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
    geom.setAttribute('density', new THREE.BufferAttribute(densities, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.cellPos.array.set(cellPositions);
    geom.attributes.cellPos.needsUpdate = true;
    geom.attributes.zone.array.set(zones);
    geom.attributes.zone.needsUpdate = true;
    geom.attributes.phase.array.set(phases);
    geom.attributes.phase.needsUpdate = true;
    geom.attributes.density.array.set(densities);
    geom.attributes.density.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', regenerate);

addEventListener('resize', () => {
  const newAspect = innerWidth / innerHeight;
  camera.left = frustumSize * newAspect / -2;
  camera.right = frustumSize * newAspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
