<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f6v · Collage figure — Wangechi Mutu</title>
<!-- MOTION: gathering, intensity: gentle -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  background:
    radial-gradient(ellipse at 50% 46%, #2a1f18 0%, #1a1410 42%, #0f0c0a 100%);
  color: #c7b89e;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0.12 0.06 0 0 0.03  0.08 0.06 0.02 0 0.02  0.04 0.02 0.01 0 0.01  0 0 0 0.3 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  mix-blend-mode: multiply; opacity: 0.4;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background:
    radial-gradient(ellipse 80% 70% at 50% 46%, transparent 45%, rgba(0,0,0,0.35) 100%),
    radial-gradient(ellipse 70% 60% at 52% 48%, rgba(160,100,50,0.06), transparent 55%);
  mix-blend-mode: screen;
}
canvas { display: block; position: relative; z-index: 0; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#c7b89e; }
.hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; z-index:5; color:#c7b89e; }
.src { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; z-index:5; color:#c7b89e; }
</style>
</head>
<body>
<div class="id">f6v</div>
<div class="hint">click to reassemble · drag to tilt — leaf-fragments gather into myth</div>
<div class="src">collage · Wangechi Mutu · differential growth · leaf-as-unit</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 80);
camera.position.set(0.2, 0.6, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* ── figure silhouette ── */
function capDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  let t=l2>0?((px-ax)*dx+(py-ay)*dy)/l2:0;
  t=Math.max(0,Math.min(1,t));
  return Math.sqrt((px-ax-t*dx)**2+(py-ay-t*dy)**2);
}
function figTest(x,y){
  // head
  const hx=(x-0.05)/0.46,hy=(y-3.55)/0.56;
  const hd=Math.sqrt(hx*hx+hy*hy);
  if(hd<1) return {d:1-hd,p:0};
  // neck
  if(Math.abs(x-0.05)<0.16&&y>2.92&&y<3.08) return {d:0.5,p:1};
  // torso
  if(y>=0.5&&y<=2.92){
    const t=(y-0.5)/2.42, hw=0.32+0.35*Math.pow(t,0.6);
    const nx=Math.abs(x)/hw;
    if(nx<1) return {d:1-nx,p:2};
  }
  // hips
  if(y>=-0.2&&y<0.5){
    const t=(y+0.2)/0.7, hw=0.42-0.1*t;
    const nx=Math.abs(x)/hw;
    if(nx<1) return {d:1-nx,p:3};
  }
  // legs
  let dl=capDist(x,y,-0.22,-0.2,-0.36,-3.0);
  if(dl<0.18) return {d:1-dl/0.18,p:4};
  dl=capDist(x,y,0.22,-0.2,0.36,-3.0);
  if(dl<0.18) return {d:1-dl/0.18,p:4};
  // left arm (down)
  dl=capDist(x,y,-0.66,2.4,-1.5,0.7);
  if(dl<0.13) return {d:1-dl/0.13,p:5};
  // right arm (raised — invocation)
  dl=capDist(x,y,0.66,2.4,1.35,3.7);
  if(dl<0.13) return {d:1-dl/0.13,p:5};
  // right hand spread
  dl=capDist(x,y,1.35,3.7,1.55,3.95);
  if(dl<0.08) return {d:1-dl/0.08,p:5};
  return null;
}

/* ── build particles ── */
const N=48000;
const pos=new Float32Array(N*3);
const aSeed=new Float32Array(N);
const aAngle=new Float32Array(N);
const aColor=new Float32Array(N);
const aType=new Float32Array(N);

let regrowSeed=Math.random()*1e9;
let st=(regrowSeed|0)>>>0;
const rng=()=>{st|=0;st=st+0x6d2b79f5|0;let t=Math.imul(st^st>>>15,1|st);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

function build(){
  st=(regrowSeed|0)>>>0;
  let idx=0;
  // body (~38k)
  let att=0;
  while(idx<38000&&att<38000*30){
    att++;
    const x=(rng()-0.5)*4.2, y=rng()*8.0-3.5;
    const t=figTest(x,y);
    if(!t) continue;
    if(rng()>0.3+0.7*t.d) continue;
    const fringe=t.d<0.15&&rng()<0.3;
    const fo=fringe?(rng()-0.3)*0.14:0;
    pos[idx*3]=x+(fringe?(Math.sign(x)||1)*fo:0);
    pos[idx*3+1]=y;
    pos[idx*3+2]=(rng()-0.5)*0.5;
    aSeed[idx]=rng();
    aAngle[idx]=(rng()-0.5)*Math.PI*0.85;
    aType[idx]=fringe?1:0;
    aColor[idx]=Math.min(1,t.p*0.12+rng()*0.52);
    idx++;
  }
  // tendrils
  const trs=[
    {ax:0.05,ay:3.85,bx:-0.6,by:5.0,cx:-1.2,cy:5.4,r:0.07,n:550},
    {ax:0.05,ay:3.85,bx:0.35,by:4.9,cx:0.85,cy:5.5,r:0.06,n:480},
    {ax:0.1,ay:3.9,bx:0.15,by:4.5,cx:-0.25,cy:5.0,r:0.05,n:380},
    {ax:-0.36,ay:-3.0,bx:-0.7,by:-3.7,cx:-1.3,cy:-4.1,r:0.06,n:420},
    {ax:0.36,ay:-3.0,bx:0.55,by:-3.6,cx:1.1,cy:-4.3,r:0.06,n:380},
    {ax:-0.36,ay:-3.0,bx:-0.3,by:-3.6,cx:-0.1,cy:-4.2,r:0.05,n:300},
    {ax:1.35,ay:3.7,bx:1.8,by:4.2,cx:2.0,cy:3.9,r:0.05,n:320},
    {ax:1.35,ay:3.7,bx:1.55,by:4.4,cx:1.35,cy:4.9,r:0.04,n:280},
  ];
  for(const tr of trs){
    for(let i=0;i<tr.n&&idx<N;i++){
      const t=rng(), u=1-t;
      const px=u*u*tr.ax+2*u*t*tr.bx+t*t*tr.cx;
      const py=u*u*tr.ay+2*u*t*tr.by+t*t*tr.cy;
      const j=tr.r*2*(1+t*0.6);
      pos[idx*3]=px+(rng()-0.5)*j;
      pos[idx*3+1]=py+(rng()-0.5)*j;
      pos[idx*3+2]=(rng()-0.5)*0.25;
      aSeed[idx]=rng();
      aAngle[idx]=(rng()-0.5)*Math.PI;
      aType[idx]=2;
      aColor[idx]=0.55+rng()*0.45;
      idx++;
    }
  }
  // dust
  while(idx<N){
    pos[idx*3]=(rng()-0.5)*14;
    pos[idx*3+1]=(rng()-0.5)*12;
    pos[idx*3+2]=(rng()-0.5)*5;
    aSeed[idx]=rng();
    aAngle[idx]=rng()*6.28;
    aType[idx]=3;
    aColor[idx]=rng();
    idx++;
  }
}
build();

const geom=new THREE.BufferGeometry();
geom.setAttribute('position',new THREE.BufferAttribute(pos,3));
geom.setAttribute('aSeed',new THREE.BufferAttribute(aSeed,1));
geom.setAttribute('aAngle',new THREE.BufferAttribute(aAngle,1));
geom.setAttribute('aColor',new THREE.BufferAttribute(aColor,1));
geom.setAttribute('aType',new THREE.BufferAttribute(aType,1));

const u={uTime:{value:0},uPx:{value:renderer.getPixelRatio()},uPtr:{value:new THREE.Vector2(0,0)}};

const mat=new THREE.ShaderMaterial({
  uniforms:u, transparent:true, depthWrite:false, depthTest:true,
  blending:THREE.CustomBlending,
  blendSrc:THREE.SrcAlphaFactor,
  blendDst:THREE.OneMinusSrcAlphaFactor,
  vertexShader:`
uniform float uTime;
uniform float uPx;
uniform vec2 uPtr;
attribute float aSeed;
attribute float aAngle;
attribute float aColor;
attribute float aType;
varying float vAngle;
varying float vColor;
varying float vType;
varying float vDepth;
varying float vAlpha;

void main(){
  vec3 tgt=position;
  // gathering
  float gt=clamp(uTime/5.0,0.0,1.0);
  gt=gt*gt*(3.0-2.0*gt);
  vec3 scat=vec3(
    sin(aSeed*127.3+0.5)*9.0,
    cos(aSeed*311.7+1.2)*7.5,
    sin(aSeed*543.1+2.7)*4.5
  );
  float tg=aType<1.5?gt:
           aType<2.5?smoothstep(0.0,1.0,clamp((uTime-2.0)/6.0,0.0,1.0)):
           1.0;
  vec3 p=mix(scat,tgt,tg);
  // breathing
  float bph=aSeed*6.28;
  float br=sin(uTime*0.25+bph)*0.04*gt;
  float fm=aType>0.4&&aType<1.6?2.8:1.0;
  vec3 bd=normalize(tgt+vec3(0.001));
  p+=bd*br*fm;
  // micro drift for settled particles
  p.x+=sin(uTime*0.12+aSeed*19.0)*0.015*gt;
  p.y+=cos(uTime*0.10+aSeed*23.0)*0.012*gt;
  // pointer tilt
  float tx=uPtr.y*0.10,tz=-uPtr.x*0.10;
  float ca=cos(tx),sa=sin(tx),cb=cos(tz),sb=sin(tz);
  vec3 q=vec3(p.x,p.y*ca-p.z*sa,p.y*sa+p.z*ca);
  q=vec3(q.x*cb+q.y*sb,-q.x*sb+q.y*cb,q.z);
  vec4 mv=modelViewMatrix*vec4(q,1.0);
  vDepth=-mv.z;
  vAngle=aAngle+sin(uTime*0.13+aSeed*11.0)*0.04;
  vColor=aColor;
  vType=aType;
  float bs=aType<0.5?7.5:aType<1.5?6.5:aType<2.5?5.0:2.2;
  bs*=(0.65+0.7*aSeed);
  gl_PointSize=bs*uPx*(6.0/vDepth);
  vAlpha=aType<0.5?0.82:aType<1.5?0.42:aType<2.5?0.62:0.10;
  gl_Position=projectionMatrix*mv;
}`,
  fragmentShader:`
varying float vAngle;
varying float vColor;
varying float vType;
varying float vDepth;
varying float vAlpha;

void main(){
  vec2 uv=gl_PointCoord*2.0-1.0;
  // rotate
  float ca=cos(vAngle),sa=sin(vAngle);
  vec2 rv=vec2(uv.x*ca-uv.y*sa,uv.x*sa+uv.y*ca);
  float la;
  if(vType>2.5){
    // dust: soft circle
    float r=dot(uv,uv);
    if(r>0.25)discard;
    la=exp(-r*14.0);
  } else {
    // leaf shape
    float st=0.55+0.35*rv.y;
    float lr=length(rv*vec2(1.0,st));
    // torn edge
    float n=fract(sin(dot(floor(rv*7.0),vec2(12.9898,78.233)))*43758.5);
    lr+=n*0.045;
    la=smoothstep(0.63,0.50,lr);
    if(la<0.01)discard;
  }
  // palette: bone→sienna→umber→ochre→charcoal
  vec3 c0=vec3(0.78,0.72,0.62);
  vec3 c1=vec3(0.55,0.37,0.24);
  vec3 c2=vec3(0.42,0.29,0.15);
  vec3 c3=vec3(0.55,0.43,0.28);
  vec3 c4=vec3(0.23,0.25,0.27);
  float t=vColor*4.0;
  vec3 col=t<1.0?mix(c0,c1,t):
           t<2.0?mix(c1,c2,t-1.0):
           t<3.0?mix(c2,c3,t-2.0):
           mix(c3,c4,t-3.0);
  // central vein
  if(vType<2.5){
    float vein=smoothstep(0.05,0.01,abs(rv.x));
    col=mix(col,col*0.68,vein*0.28);
    // side veins
    float sv=smoothstep(0.04,0.01,abs(fract(rv.y*2.5+abs(rv.x)*2.0)-0.5));
    col=mix(col,col*0.78,sv*0.10);
  }
  // depth haze
  float hz=clamp((vDepth-11.0)/10.0,0.0,0.5);
  col=mix(col,vec3(0.09,0.07,0.05),hz*0.45);
  float a=la*vAlpha*(1.0-hz*0.3);
  gl_FragColor=vec4(col,a);
}`
});

const pts=new THREE.Points(geom,mat);
scene.add(pts);

/* ── interaction ── */
addEventListener('pointermove',e=>{
  u.uPtr.value.set((e.clientX/innerWidth)*2-1,(e.clientY/innerHeight)*2-1);
});

addEventListener('click',()=>{
  regrowSeed=Math.random()*1e9;
  build();
  geom.attributes.position.needsUpdate=true;
  geom.attributes.aSeed.needsUpdate=true;
  geom.attributes.aAngle.needsUpdate=true;
  geom.attributes.aColor.needsUpdate=true;
  geom.attributes.aType.needsUpdate=true;
  u.uTime.value=0;
  t0=performance.now();
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ── loop ── */
let t0=performance.now();
(function loop(){
  const t=(performance.now()-t0)/1000;
  u.uTime.value=t;
  camera.position.x=0.2+Math.sin(t*0.018)*0.25;
  camera.position.y=0.6+Math.sin(t*0.015+1.0)*0.18;
  camera.lookAt(0,0.35,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(180,140,90,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(160,100,70,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(180,140,90,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(180,140,90,0.4);border-radius:3px;padding:4px 10px;color:rgba(180,140,90,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#b48c5a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#a06446';this.style.borderColor='rgba(160,100,70,0.5)';goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var ix=pieces.findIndex(function(p){return p.id===pid;});var next=ix>=0&&ix+1<pieces.length?pieces[ix+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
