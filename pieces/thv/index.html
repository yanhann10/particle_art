<!doctype html>
<html lang="en">
<head>
<!-- MOTION: pulse, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xaj · vascular sphere interior</title>
<!-- Palette rationale: warm amber-orange (#c87840) vessels evoke arterial blood and beeswax;
     near-black (#0a0604) background is deep body cavity; soft point light at center
     simulates a bioluminescent glow from within the vascular network. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0604; overflow:hidden;
               color:#c89860; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">xaj · vascular sphere interior</div>
<div class="hint">drag to orbit · camera is INSIDE the vessel network</div>
<div class="src">descended from 7ea · differential growth · 3D sphere interior</div>
<div class="stat" id="stat">vessels=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// VASCULAR SPHERE INTERIOR
// 50 seed points on sphere surface grow INWARD via self-avoiding differential
// growth, filling the sphere interior with a tangled vascular network.
// Camera starts at origin (inside), looking outward at the surrounding vessels.

const SPHERE_R = 5.0;
const N_SEEDS  = 50;
const MAX_SEGS = 6000;
const STEP     = 0.09;
const REPEL_R  = 0.4;
const REPEL_S  = 0.12;
const TUBE_R   = 0.035;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 0.01); // start inside at near-origin

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0604, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.05;
controls.maxDistance = 4.5; // stay inside sphere

// Lighting — bright point light at center, strong ambient so vessels are visible
const innerLight = new THREE.PointLight(0xff9040, 6.0, 14.0, 1.2);
innerLight.position.set(0, 0, 0);
scene.add(innerLight);
scene.add(new THREE.AmbientLight(0x3a2010, 1.2));
const rimLight = new THREE.DirectionalLight(0xff8030, 0.8);
rimLight.position.set(3, 5, -3);
scene.add(rimLight);
const rimLight2 = new THREE.DirectionalLight(0xd06020, 0.5);
rimLight2.position.set(-3, -2, 4);
scene.add(rimLight2);

// ────────── vessel growth state
// Each vessel is a growing polyline (array of Vec3) starting at sphere surface
// growing inward. Tips advance each frame with self-avoidance.

function randomOnSphere(r) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}

// Spatial hash for O(1) neighbor lookup
class SpatialHash {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  _key(x,y,z) {
    const cx = Math.floor(x/this.cell);
    const cy = Math.floor(y/this.cell);
    const cz = Math.floor(z/this.cell);
    return `${cx},${cy},${cz}`;
  }
  add(p) {
    const k = this._key(p.x,p.y,p.z);
    if (!this.map.has(k)) this.map.set(k, []);
    this.map.get(k).push(p);
  }
  neighbors(p, r) {
    const out = [];
    const steps = Math.ceil(r/this.cell);
    for (let dx=-steps; dx<=steps; dx++)
    for (let dy=-steps; dy<=steps; dy++)
    for (let dz=-steps; dz<=steps; dz++) {
      const k = this._key(p.x+dx*this.cell, p.y+dy*this.cell, p.z+dz*this.cell);
      const pts = this.map.get(k);
      if (pts) for (const q of pts) out.push(q);
    }
    return out;
  }
}

const spatialHash = new SpatialHash(REPEL_R * 0.6);

// Initialize vessels
const vessels = [];
for (let i = 0; i < N_SEEDS; i++) {
  const start = randomOnSphere(SPHERE_R);
  vessels.push({
    pts: [start.clone()],
    dir: start.clone().negate().normalize(), // inward direction
    alive: true,
    mesh: null,
  });
  spatialHash.add(start.clone());
}

// Material — warm amber, emissive so it glows even without direct light
const vesselMat = new THREE.MeshStandardMaterial({
  color: 0xc87840,
  emissive: 0x7a3010,
  emissiveIntensity: 0.6,
  roughness: 0.3,
  metalness: 0.15,
  side: THREE.FrontSide,
});

// Mesh pool
const meshGroup = new THREE.Group();
scene.add(meshGroup);

let totalSegs = 0;
let growing = true;

function rebuildVesselMesh(v) {
  if (v.pts.length < 2) return;
  if (v.mesh) {
    meshGroup.remove(v.mesh);
    v.mesh.geometry.dispose();
  }
  // Variable radius: thicker near sphere surface, thinner near center
  const distFromCenter = v.pts[v.pts.length-1].length();
  const taper = THREE.MathUtils.clamp(distFromCenter / SPHERE_R, 0.2, 1.0);
  const r = TUBE_R * (0.5 + 0.5 * taper);

  const curve = new THREE.CatmullRomCurve3(v.pts);
  const segments = Math.max(3, Math.min(v.pts.length * 3, 40));
  const geo = new THREE.TubeGeometry(curve, segments, r, 5, false);
  v.mesh = new THREE.Mesh(geo, vesselMat);
  meshGroup.add(v.mesh);
}

// ────────── pulsing heartbeat for vessels
let time = 0;

function growStep() {
  if (!growing) return;
  let anyAlive = false;
  for (const v of vessels) {
    if (!v.alive) continue;
    if (totalSegs >= MAX_SEGS) { v.alive = false; continue; }
    anyAlive = true;

    const tip = v.pts[v.pts.length-1];
    // Check if too close to center — stop
    if (tip.length() < 0.3) { v.alive = false; continue; }

    // Add slight organic noise to direction
    const noise = new THREE.Vector3(
      (Math.random()-0.5)*0.12,
      (Math.random()-0.5)*0.12,
      (Math.random()-0.5)*0.12
    );
    let dir = v.dir.clone().add(noise).normalize();
    // Bias toward center (inward)
    const toCenter = tip.clone().negate().normalize();
    dir.lerp(toCenter, 0.15).normalize();

    // Self-avoidance repulsion
    const neighbors = spatialHash.neighbors(tip, REPEL_R);
    let repel = new THREE.Vector3();
    for (const q of neighbors) {
      const d = tip.distanceTo(q);
      if (d < REPEL_R && d > 0.001) {
        repel.add(tip.clone().sub(q).normalize().multiplyScalar(REPEL_S * (1 - d/REPEL_R)));
      }
    }
    dir.add(repel).normalize();

    const newPt = tip.clone().addScaledVector(dir, STEP);
    // Keep inside sphere
    if (newPt.length() >= SPHERE_R) { v.alive = false; continue; }

    // Check if too close to existing points
    let blocked = false;
    for (const q of neighbors) {
      if (tip.distanceTo(q) > 0.001 && newPt.distanceTo(q) < TUBE_R * 3) {
        blocked = true; break;
      }
    }
    if (blocked) { v.alive = false; continue; }

    v.pts.push(newPt.clone());
    v.dir = dir.clone();
    spatialHash.add(newPt.clone());
    totalSegs++;

    // Rebuild mesh every 4 new points for visible growth
    if (v.pts.length % 4 === 0 || v.pts.length < 4) {
      rebuildVesselMesh(v);
    }
  }
  if (!anyAlive) { growing = false; }
  document.getElementById('stat').textContent = `vessels=${totalSegs}`;
}

// ────────── animation loop
window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let paused = false;
renderer.domElement.addEventListener('click', () => { paused = !paused; });

function animate(ts) {
  requestAnimationFrame(animate);
  if (paused) return;
  time = ts * 0.001;

  // Heartbeat pulse: modulate inner light intensity
  innerLight.intensity = 2.5 + 0.8 * Math.sin(time * 1.6);

  // Grow ~15 steps per frame for denser fill
  if (growing) {
    for (let i = 0; i < 15; i++) growStep();
    // Rebuild all vessel meshes when done growing
    if (!growing) {
      for (const v of vessels) rebuildVesselMesh(v);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate(0);
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
