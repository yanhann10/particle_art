<style>

    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;

<body>
<div class="id">4zb</div>
<div class="hint">click to regrow · drag to nudge — vascular currents fold through the calyx</div>
<div class="src">ere × zs4 · Lorenz flow on Riley interference · parchment + vascular pulsing</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// CROSS-POLLINATION: sibling 'zs4' Lorenz attractor chosen — most different from
// the Riley interference pattern's static wave-field. The Lorenz system's characteristic
// folding/stretching dynamics are mapped onto the calyx surface as a flow field,
// giving particles biomorphic vascular motion: pulsing, peristalsis, tidal breathing.
// The parent's Riley interference calyx form and parchment atmosphere are preserved.
// Visual reference: Bridget Riley's current paintings meet the Lorenz butterfly's
// phase-space folding — ink channels that breathe and circulate like living tissue.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── Riley wave-interference field on cupped calyx surface
const N = 80000;
const positions = new Float32Array(N * 3);
const basePos   = new Float32Array(N * 3); // store originals for Lorenz flow reset
const seeds     = new Float32Array(N);
const flowPhase = new Float32Array(N); // per-particle phase in the flow cycle

let regrowSeed = Math.random() * 1e9;

function buildField(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const w1 = { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w2 = { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 };
  const w3 = { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0, attempts = 0;
  while (written < N && attempts < N * 16) {
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
    const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
    const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.10);
    const accept = (f > 0) && (rng() < fall * (0.4 + 0.6 * f));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
    const y = -0.15 * r * r + scallop;
    const i3 = written * 3;
    positions[i3] = x; positions[i3 + 1] = y; positions[i3 + 2] = z;
    basePos[i3] = x; basePos[i3 + 1] = y; basePos[i3 + 2] = z;
    seeds[written] = rng();
    flowPhase[written] = rng() * Math.PI * 2;
    written++;
  }
  for (let i = written; i < N; i++) {
    const i3 = i * 3;
    positions[i3] = 0; positions[i3 + 1] = -5; positions[i3 + 2] = 0;
    basePos[i3] = 0; basePos[i3 + 1] = -5; basePos[i3 + 2] = 0;
    seeds[i] = 0; flowPhase[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',  new THREE.BufferAttribute(positions, 3));
geom.setAttribute('basePos',   new THREE.BufferAttribute(basePos, 3));
geom.setAttribute('seed',      new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('flowPhase', new THREE.BufferAttribute(flowPhase, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    attribute vec3 basePos;
    attribute float seed;
    attribute float flowPhase;
    varying float vDepth;
    varying float vSeed;
    varying float vFlow; // flow intensity for vascular coloring

    // Lorenz system evaluated at a point — returns velocity
    vec3 lorenz(vec3 p) {
      float sigma = 10.0;
      float rho   = 28.0;
      float beta  = 2.6667;
      return vec3(
        sigma * (p.y - p.x),
        p.x * (rho - p.z) - p.y,
        p.x * p.y - beta * p.z
      );
    }

    void main(){
      vec3 bp = basePos;

      // Map calyx (x,z) → Lorenz state space for flow field lookup
      // Scale so the calyx spans a meaningful region of the attractor
      vec3 lp = vec3(bp.x * 4.0, bp.z * 4.0, (bp.y + 2.0) * 6.0 + 12.0);
      vec3 lv = lorenz(lp);
      float speed = length(lv);
      vec3 flowDir = lv / (speed + 0.001);

      // Biomorphic pulsing: multiple layered breathing cycles
      // — peristaltic wave propagates radially from center
      float r = length(bp.xz);
      float peristalsis = sin(uTime * 0.4 - r * 1.8 + flowPhase) * 0.5 + 0.5;
      // — slow tidal expansion/contraction of whole form
      float tidal = sin(uTime * 0.15 + flowPhase * 0.3) * 0.5 + 0.5;
      // — fast vascular pulse along flow lines
      float vascPulse = sin(uTime * 1.2 + dot(flowDir.xy, bp.xz) * 3.0 + seed * 6.28) * 0.5 + 0.5;

      // Combine into displacement: particles flow along Lorenz streamlines
      // but amplitude is modulated by the breathing cycles
      float amp = 0.06 * peristalsis + 0.03 * tidal + 0.02 * vascPulse;
      vec3 disp = flowDir * amp;

      // Radial breathing — the calyx swells and contracts like a lung
      float breathe = sin(uTime * 0.22 + flowPhase) * 0.04 * (0.5 + 0.5 * tidal);
      vec3 radial = normalize(vec3(bp.x, 0.0, bp.z) + 0.001) * breathe;

      // Vertical peristaltic wave — ripple across the cup surface
      float yWave = sin(uTime * 0.35 - r * 2.2 + flowPhase) * 0.035 * peristalsis;

      vec3 p = bp + disp + radial;
      p.y += yWave;

      // Pointer-driven tilt
      float tiltX = uPointer.y * 0.22;
      float tiltZ = -uPointer.x * 0.22;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      // Flow intensity for coloring — faster flow = more vascular warmth
      vFlow = clamp(speed / 50.0, 0.0, 1.0);

      // Size pulses with vascular rhythm
      float sizePulse = 1.0 + 0.35 * vascPulse * peristalsis;
      gl_PointSize = (1.3 + 0.7 * sizePulse) * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vFlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);

      // Ink palette shifts with flow intensity:
      // low flow = deep cool sumi ink (veins at rest)
      // high flow = warmer oxblood (arterial pulse)
      vec3 inkDeep    = vec3(0.08, 0.05, 0.06); // cool near-black
      vec3 inkVenal   = vec3(0.18, 0.06, 0.10); // venous dark wine
      vec3 inkArterial= vec3(0.38, 0.12, 0.08); // arterial warmth
      vec3 inkWarm    = vec3(0.30, 0.18, 0.08); // amber for seed variation

      vec3 col = mix(inkDeep, inkVenal, smoothstep(0.0, 0.4, vFlow));
      col = mix(col, inkArterial, smoothstep(0.4, 0.85, vFlow));
      col = mix(col, inkWarm, vSeed * 0.3); // subtle seed variation

      // Depth haze toward parchment
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      // Flow-dependent opacity: high-flow regions more opaque (vessels stand out)
      float flowAlpha = 0.72 + 0.18 * vFlow;
      gl_FragColor = vec4(col, a * flowAlpha * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── DUST MOTES — warm specs catching window light
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 14;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]        = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── autonomous (no input — moves on its own)
// Pointer is driven by two slow Lissajous-like oscillators so the field
// breathes without user interaction. Period ≈ 23s/29s — incommensurate so
// the path never repeats exactly.
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Auto re-seeding every ~22s lets the field "regrow" without clicks.
const REGROW_PERIOD = 22.0;
let nextRegrow = REGROW_PERIOD;

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // autonomous "pointer" drift — slow Lissajous in the [-1, 1]² unit square
  uniforms.uPointer.value.set(
    Math.sin(t * 0.273) * 0.85,                         // ~23s period
    Math.sin(t * 0.217 + 1.4) * 0.65                    // ~29s period
  );

  // periodic auto-regrow (was "click to regrow" before)
  if (t >= nextRegrow) {
    regrowSeed = Math.random() * 1e9;
    buildField(Math.floor(regrowSeed));
    geom.attributes.position.needsUpdate = true;
    geom.attributes.basePos.needsUpdate = true;
    geom.attributes.seed.needsUpdate = true;
    geom.attributes.flowPhase.needsUpdate = true;
    nextRegrow = t + REGROW_PERIOD;
  }

  // Gentle camera drift — the viewer breathes
  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
