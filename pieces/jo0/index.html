<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: orbit, intensity: gentle -->
<title>jo0 · lorenz risograph</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">jo0</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0f, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 8.0;
  init[i*4+1] = (Math.random()*2-1) * 8.0;
  init[i*4+2] = (Math.random()*2-1) * 8.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// --- grain texture for risograph paper feel ---
const grainSize = 256;
const grainData = new Uint8Array(grainSize * grainSize * 4);
for (let i = 0; i < grainSize * grainSize; i++) {
  const v = Math.floor(Math.random() * 255);
  grainData[i*4] = v; grainData[i*4+1] = v; grainData[i*4+2] = v; grainData[i*4+3] = 255;
}
const grainTex = new THREE.DataTexture(grainData, grainSize, grainSize, THREE.RGBAFormat);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
grainTex.needsUpdate = true;

// ---- render pass ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);
camera.lookAt(0, 0, 25);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtB.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uTime:    { value: 0 },
    uGrain:   { value: grainTex },
    uRes:     { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x*p.z,
        p.x * p.y - (8.0/3.0) * p.z
      )) * 0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      p.z -= 25.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // slightly larger points for the posterized look
      gl_PointSize = (1.4 + 1.8 * vSpeed) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform sampler2D uGrain;
    uniform vec2 uRes;
    varying float vAge;
    varying float vSpeed;

    // posterize to N steps — risograph inks have limited tonal range
    vec3 posterize(vec3 c, float steps){
      return floor(c * steps + 0.5) / steps;
    }

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);

      // risograph ink palette:
      // fluorescent pink (#ff6b8a), federal blue (#1b3a6b), sunflower gold (#e8b84b)
      vec3 ink_a = vec3(0.14, 0.23, 0.42);  // deep federal blue
      vec3 ink_b = vec3(1.0, 0.42, 0.54);   // fluorescent pink
      vec3 ink_c = vec3(0.91, 0.72, 0.29);  // sunflower gold

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(ink_a, ink_b, smoothstep(0.0, 0.5, k));
      col = mix(col, ink_c, smoothstep(0.5, 1.0, k));

      // apply brightness from speed and falloff
      col *= a * (0.5 + vSpeed * 0.85);

      // 8-step posterization — the core risograph quantization
      col = posterize(col, 8.0);

      // paper grain: subtle noise to break banding, mimic riso ink absorption
      vec2 screenUV = gl_FragCoord.xy / uRes;
      float grain = texture2D(uGrain, screenUV * 4.0 + uTime * 0.01).r;
      // grain subtly modulates brightness — ink soaks unevenly into paper
      col *= 0.92 + grain * 0.16;
      // re-posterize after grain to keep the stepped look
      col = posterize(col, 8.0);

      gl_FragColor = vec4(col, a * 0.95);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pointsMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

const target = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.0;
  target.sigma = 10.0 + nx * 2.5;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;

  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;

  const ang = now * 0.00012;
  camera.position.x = Math.sin(ang) * 80;
  camera.position.z = Math.cos(ang) * 80;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
