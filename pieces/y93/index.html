<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y93 · tender klein bottle</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0b0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">y93</div>
<div class="hint">drag to orbit · topology of longing</div>
<div class="src">Felix Gonzalez-Torres · Klein bottle as doubled vessel</div>
<div class="stat" id="stat">tracing surface</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender Klein bottle — the impossible topology as intimate gesture.
   A non-orientable surface (like a doubled lover, inside becoming outside)
   rendered in warm amber particles. The bottle traces itself slowly,
   building presence over time. Domestic scale, soft edges, quiet rotation. */

const BG = 0x0f0b0a;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 6.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;

// Klein bottle parametric equations (figure-8 immersion in R³)
// u ∈ [0, 2π], v ∈ [0, 2π]
// Scale chosen for domestic intimacy (~2.5 units tall)
function kleinBottle(u, v) {
  const r = 1.2;
  const a = 1.8;
  let x, y, z;
  
  if (u < Math.PI) {
    x = (a + r * Math.cos(v)) * Math.cos(u);
    y = (a + r * Math.cos(v)) * Math.sin(u);
    z = r * Math.sin(v);
  } else {
    x = (a + r * Math.cos(v)) * Math.cos(u);
    y = (a + r * Math.cos(v)) * Math.sin(u);
    z = r * Math.sin(v) + 4 * (u - Math.PI);
  }
  
  // shift and scale for tender framing
  const s = 0.65;
  return {
    x: x * s,
    y: (z * s) - 0.2,
    z: y * s
  };
}

// generate surface mesh for spatial reference (hidden)
const U_RES = 80;
const V_RES = 60;
const surfaceVerts = [];
for (let iu = 0; iu < U_RES; iu++) {
  for (let iv = 0; iv < V_RES; iv++) {
    const u = (iu / U_RES) * Math.PI * 2;
    const v = (iv / V_RES) * Math.PI * 2;
    const p = kleinBottle(u, v);
    surfaceVerts.push(p);
  }
}

// --- particle system: 40k points distributed on surface ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rBirth = new Float32Array(N_RENDER); // when particle appears

// stagger births over 80 seconds so bottle traces itself
for (let i = 0; i < N_RENDER; i++) {
  rSeeds[i] = Math.random();
  rBirth[i] = (i / N_RENDER) * 80;
  
  // initial position: sample surface with slight jitter
  const u = (i / N_RENDER) * Math.PI * 2 + Math.random() * 0.1;
  const v = Math.random() * Math.PI * 2;
  const p = kleinBottle(u, v);
  
  // add gentle positional spread (particles not perfectly on surface)
  const spread = 0.018;
  rPos[i * 3]     = p.x + (Math.random() - 0.5) * spread;
  rPos[i * 3 + 1] = p.y + (Math.random() - 0.5) * spread;
  rPos[i * 3 + 2] = p.z + (Math.random() - 0.5) * spread;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('birth',    new THREE.BufferAttribute(rBirth, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.022 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float birth;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float uFogDensity;

    void main() {
      // particle appears when time passes its birth moment
      float age = max(0.0, uTime - birth);
      if (age <= 0.0) {
        gl_Position = vec4(0.0, 0.0, -1000.0, 1.0);
        vAlpha = 0.0;
        return;
      }

      vec3 p = position;

      // gentle breathing motion — surface inhales/exhales
      float breathe = sin(uTime * 0.4 + seed * 6.28) * 0.012;
      p += normalize(p) * breathe;

      // subtle drift along u-direction (topology reveals over time)
      float drift = uTime * 0.008;
      float u = seed * 6.28 * 2.0 + drift;
      float v = seed * 42.0;
      
      // fade-in over 1.2 seconds after birth
      float fadeIn = smoothstep(0.0, 1.2, age);

      // palette: warm amber → soft rose → pale cream
      // Gonzalez-Torres: incandescent warmth, not clinical white
      vec3 amber = vec3(1.0, 0.68, 0.28);
      vec3 rose  = vec3(1.0, 0.82, 0.72);
      vec3 cream = vec3(0.98, 0.92, 0.88);
      
      float colorT = clamp(age * 0.015, 0.0, 1.0);
      vCol = mix(amber, rose, colorT);
      vCol = mix(vCol, cream, smoothstep(0.6, 1.0, colorT) * 0.4);
      
      // pulse per-particle (slower, gentler than coral)
      float pulse = 0.88 + 0.12 * sin(uTime * 0.8 + seed * 20.0);
      vCol *= pulse;

      vAlpha = 0.5 * fadeIn;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // particle size: larger than default (domestic scale)
      gl_PointSize = 2.2 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;

      // fog
      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // soft glow — warmer core, diffuse halo
      float core = exp(-r * 20.0);
      float halo = exp(-r * 6.0) * 0.4;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.75);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// faint wireframe guide (visible only near camera)
const wireGeom = new THREE.BufferGeometry();
const wireIdx = [];
for (let iu = 0; iu < U_RES - 1; iu++) {
  for (let iv = 0; iv < V_RES - 1; iv++) {
    const i0 = iu * V_RES + iv;
    const i1 = iu * V_RES + (iv + 1);
    const i2 = (iu + 1) * V_RES + iv;
    wireIdx.push(i0, i1, i0, i2);
  }
}
const wirePos = new Float32Array(surfaceVerts.length * 3);
for (let i = 0; i < surfaceVerts.length; i++) {
  wirePos[i * 3]     = surfaceVerts[i].x;
  wirePos[i * 3 + 1] = surfaceVerts[i].y;
  wirePos[i * 3 + 2] = surfaceVerts[i].z;
}
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
wireGeom.setIndex(wireIdx);
const wireMat = new THREE.LineBasicMaterial({
  color: 0x2a211e,
  transparent: true,
  opacity: 0.08
});
const wireMesh = new THREE.LineSegments(wireGeom, wireMat);
scene.add(wireMesh);

// ambient light (very dim, particles self-illuminate)
const ambient = new THREE.AmbientLight(0x1a1512, 0.2);
scene.add(ambient);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // slow gentle rotation override
  controls.autoRotateSpeed = 0.12;

  // count visible particles
  const visible = Math.min(N_RENDER, Math.floor(t * (N_RENDER / 80)));
  statEl.textContent = `particles=${visible.toLocaleString()} · surface emerging`;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
