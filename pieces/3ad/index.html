<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050510; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

      radial-gradient(ellipse at 50% 100%,

  }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }

<body>
<div class="id">3ad · infrastructure erodes to reveal the sky</div>
<div class="hint">no input — built landscape dissolves into shared starfield</div>
<div class="src">amelia winger-bearskin · lumen prize 2025 · indigenous AI commons</div>
<div class="arc" id="arc">built · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Amelia Winger-Bearskin — 'I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY'
// AI removes human infrastructure from landscapes to reveal a shared celestial commons.
// This piece: two particle-layers with a 140-second dissolve cycle:
//   BUILT layer — orthogonal grids (roads, fences, power lines), sodium-orange glow
//   SKY layer — deep starfield, slow drift, cobalt + white
// The built layer progressively erodes; particles fade out, reveal the sky beneath.
// As infrastructure disappears, color shifts from warm pollution to cold deep field.
// Emotional arc: ERASURE (built structures dissolve) → REVELATION (stars emerge) → COMMONS (shared sky).

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050510, 0.009);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 18, 45);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── two-layer landscape
const BUILT_N = 2200;  // infrastructure particles — grids, lines, nodes
const SKY_N = 3600;    // starfield particles — deep, slow drift

const builtPos = new Float32Array(BUILT_N * 3);
const builtSeed = new Float32Array(BUILT_N);
const builtType = new Float32Array(BUILT_N);  // 0=road grid, 1=fence, 2=power line, 3=node

const skyPos = new Float32Array(SKY_N * 3);
const skySeed = new Float32Array(SKY_N);
const skyDepth = new Float32Array(SKY_N);     // depth field 0..1

// built layer — orthogonal infrastructure grids spanning the ground plane
let bi = 0;
// road grid — orthogonal lines at y=0
for (let i = 0; i < 800; i++){
  const gx = (Math.random() - 0.5) * 60;
  const gz = (Math.random() - 0.5) * 60;
  const axis = Math.random() < 0.5 ? 0 : 1;  // 0=x-aligned, 1=z-aligned
  builtPos[bi*3]     = axis === 0 ? gx : (Math.random() - 0.5) * 60;
  builtPos[bi*3 + 1] = 0.1 + Math.random() * 0.2;
  builtPos[bi*3 + 2] = axis === 1 ? gz : (Math.random() - 0.5) * 60;
  builtSeed[bi] = Math.random();
  builtType[bi] = 0.0;  // road
  bi++;
}
// fences — vertical lines, lower density
for (let i = 0; i < 500; i++){
  const fx = (Math.random() - 0.5) * 50;
  const fz = (Math.random() - 0.5) * 50;
  builtPos[bi*3]     = fx;
  builtPos[bi*3 + 1] = Math.random() * 4.5;
  builtPos[bi*3 + 2] = fz;
  builtSeed[bi] = Math.random();
  builtType[bi] = 1.0;  // fence
  bi++;
}
// power lines — elevated horizontal lines
for (let i = 0; i < 400; i++){
  const px = (Math.random() - 0.5) * 55;
  const pz = (Math.random() - 0.5) * 55;
  builtPos[bi*3]     = px;
  builtPos[bi*3 + 1] = 8.0 + Math.random() * 2.0;
  builtPos[bi*3 + 2] = pz;
  builtSeed[bi] = Math.random();
  builtType[bi] = 2.0;  // power line
  bi++;
}
// nodes — junction points, brighter
for (let i = 0; i < 500; i++){
  const nx = (Math.random() - 0.5) * 52;
  const nz = (Math.random() - 0.5) * 52;
  builtPos[bi*3]     = nx;
  builtPos[bi*3 + 1] = Math.random() * 6.0;
  builtPos[bi*3 + 2] = nz;
  builtSeed[bi] = Math.random();
  builtType[bi] = 3.0;  // node
  bi++;
}

// sky layer — deep starfield spanning full volume
for (let i = 0; i < SKY_N; i++){
  const r = 40 + Math.random() * 100;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  skyPos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  skyPos[i*3 + 1] = Math.sin(ph) * r + 10;  // bias upward
  skyPos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  skySeed[i] = Math.random();
  skyDepth[i] = Math.random();  // depth for parallax
}

// erosion state — cycles over 140 seconds
let erosionPhase = 0.0;  // 0..1 over cycle

const arcEl = document.getElementById('arc');

function updateErosion(dt){
  erosionPhase += dt / 140.0;
  if (erosionPhase > 1.0) erosionPhase -= 1.0;

  // 3-stage arc within the cycle:
  //   0.00–0.40 : BUILT (infrastructure visible, sky faint)
  //   0.40–0.75 : ERASURE (built layer dissolves)
  //   0.75–1.00 : COMMONS (sky revealed, built gone)
  let stage = 'built';
  if (erosionPhase > 0.75) stage = 'commons';
  else if (erosionPhase > 0.40) stage = 'erasure';

  const builtAlpha = erosionPhase < 0.40 ? 1.0
                    : erosionPhase < 0.75 ? 1.0 - (erosionPhase - 0.40) / 0.35
                    : 0.0;
  const skyAlpha = erosionPhase < 0.40 ? 0.2
                  : erosionPhase < 0.75 ? 0.2 + (erosionPhase - 0.40) / 0.35 * 0.8
                  : 1.0;

  arcEl.textContent = `${stage} · ${Math.round((1.0 - builtAlpha) * 100)}% eroded`;
  return { builtAlpha, skyAlpha, erosionPhase };
}

// ────────────── render layers
const builtGeom = new THREE.BufferGeometry();
builtGeom.setAttribute('position', new THREE.BufferAttribute(builtPos, 3));
builtGeom.setAttribute('seed', new THREE.BufferAttribute(builtSeed, 1));
builtGeom.setAttribute('pType', new THREE.BufferAttribute(builtType, 1));

const builtUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBuiltAlpha: { value: 1.0 },
  uErosion: { value: 0.0 }
};
const builtMat = new THREE.ShaderMaterial({
  uniforms: builtUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBuiltAlpha;
    uniform float uErosion;
    attribute float seed;
    attribute float pType;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // slow drift + noise dissolve as erosion increases
      float t = uTime * 0.15 + seed * 6.28;
      float dissolve = uErosion * 2.0;
      p.y += sin(t * 0.6 + p.x * 0.08) * dissolve * 1.5;
      p.x += cos(t * 0.5 + p.z * 0.06) * dissolve * 0.8;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // size by type: nodes larger, roads smaller
      float baseSize = pType < 0.5 ? 1.0     // road
                     : pType < 1.5 ? 1.3     // fence
                     : pType < 2.5 ? 1.6     // power line
                     : 2.2;                  // node
      gl_PointSize = baseSize * uPixel * (18.0 / dist);
      // sodium-orange glow for built layer
      vec3 sodium = vec3(1.0, 0.65, 0.28);   // warm pollution
      vec3 amber  = vec3(0.95, 0.80, 0.55);  // softer highlight
      vCol = mix(sodium, amber, smoothstep(0.0, 1.0, sin(t * 0.8)) * 0.3);
      // fade with erosion + distance
      float erosionFade = smoothstep(0.0, 1.0, 1.0 - uErosion);
      float distFade = clamp(1.0 - (dist - 40.0) / 50.0, 0.0, 1.0);
      vAlpha = uBuiltAlpha * erosionFade * distFade;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 10.0) * vAlpha;
      gl_FragColor = vec4(vCol * a * 0.85, a);
    }
  `
});
const builtPoints = new THREE.Points(builtGeom, builtMat);
scene.add(builtPoints);

const skyGeom = new THREE.BufferGeometry();
skyGeom.setAttribute('position', new THREE.BufferAttribute(skyPos, 3));
skyGeom.setAttribute('seed', new THREE.BufferAttribute(skySeed, 1));
skyGeom.setAttribute('depth', new THREE.BufferAttribute(skyDepth, 1));

const skyUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uSkyAlpha: { value: 0.2 }
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uSkyAlpha;
    attribute float seed;
    attribute float depth;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // slow celestial drift — parallax by depth
      float t = uTime * 0.04 + seed * 6.28;
      p.x += sin(t * 0.3 + depth * 3.14) * depth * 2.0;
      p.y += cos(t * 0.25 + depth * 2.1) * depth * 1.5;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // size: deeper stars smaller
      float baseSize = 0.8 + (1.0 - depth) * 1.8;
      gl_PointSize = baseSize * uPixel * (20.0 / dist);
      // cobalt + white starfield
      vec3 cobalt = vec3(0.35, 0.50, 0.75);
      vec3 white  = vec3(0.95, 0.95, 1.00);
      vCol = mix(cobalt, white, smoothstep(0.0, 1.0, sin(t * 0.6 + seed * 12.0)) * 0.5);
      float distFade = clamp(1.0 - (dist - 60.0) / 120.0, 0.0, 1.0);
      vAlpha = uSkyAlpha * distFade * (0.5 + depth * 0.5);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const skyPoints = new THREE.Points(skyGeom, skyMat);
scene.add(skyPoints);

// subtle ground horizon line — horizon as memory of removed landscape
const horizonGeom = new THREE.BufferGeometry();
const horizonPts = [];
for (let i = 0; i < 120; i++){
  const ang = (i / 120) * Math.PI * 2;
  horizonPts.push(Math.cos(ang) * 48, -0.5, Math.sin(ang) * 48);
}
horizonGeom.setAttribute('position', new THREE.Float32BufferAttribute(horizonPts, 3));
const horizonMat = new THREE.LineBasicMaterial({ color: 0x1a1f28, opacity: 0.15, transparent: true, fog: true });
const horizonLine = new THREE.Line(horizonGeom, horizonMat);
scene.add(horizonLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  builtUniforms.uTime.value = t;
  skyUniforms.uTime.value = t;
  const { builtAlpha, skyAlpha, erosionPhase } = updateErosion(dt);
  builtUniforms.uBuiltAlpha.value = builtAlpha;
  builtUniforms.uErosion.value = erosionPhase;
  skyUniforms.uSkyAlpha.value = skyAlpha;

  // slow camera drift — low orbit, horizon-focused
  const ang = t * 0.018;
  camera.position.x = Math.sin(ang) * 42;
  camera.position.z = Math.cos(ang) * 42;
  camera.position.y = 18 + Math.sin(t * 0.012) * 3;
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
