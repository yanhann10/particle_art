<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7so · tidal breath</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#070d12; overflow:hidden;
               color:#5a7f8a; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">7so</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── folded-leaf geometry builder ── */
function buildLeafTwirl(width, length, curlAmount, segments){
  const positions = [];
  const cols = segments;
  const rows = segments * 2;
  
  for (let i = 0; i <= rows; i++){
    const v = i / rows;
    const y = (v - 0.5) * length;
    const curlPhase = v * Math.PI * curlAmount;
    const twist = Math.sin(curlPhase) * 0.8;
    const wMul = Math.pow(1.0 - Math.abs(v - 0.5) * 2, 1.2);
    
    for (let j = 0; j <= cols; j++){
      const u = (j / cols - 0.5) * 2;
      const x = u * width * wMul;
      const z = twist * width * Math.abs(u) * 0.6;
      positions.push(x, y, z);
    }
  }
  
  const indices = [];
  for (let i = 0; i < rows; i++){
    for (let j = 0; j < cols; j++){
      const a = i * (cols + 1) + j;
      const b = a + 1;
      const c = a + (cols + 1);
      const d = c + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

function createLeafCluster(particleCount){
  const leafConfigs = [
    { w: 1.8, l: 5.0, curl: 2.2, seg: 16, pos: [0, 0, 0], rot: [0.2, 0, 0.3], scale: 1.0 },
    { w: 1.5, l: 4.2, curl: 1.8, seg: 14, pos: [-1.2, 0.5, 0.8], rot: [-0.3, 0.8, -0.2], scale: 0.85 },
    { w: 2.0, l: 4.6, curl: 2.5, seg: 16, pos: [1.5, -0.3, 0.6], rot: [0.4, -0.6, 0.1], scale: 0.92 },
    { w: 1.3, l: 3.8, curl: 1.5, seg: 12, pos: [0.3, 1.2, -0.5], rot: [0.5, 0.3, 0.8], scale: 0.75 },
    { w: 1.6, l: 4.0, curl: 2.0, seg: 14, pos: [-0.8, -1.0, 0.3], rot: [-0.2, -0.5, -0.4], scale: 0.80 },
    { w: 1.4, l: 3.5, curl: 1.7, seg: 12, pos: [0.9, 0.8, -0.9], rot: [0.6, 0.2, -0.5], scale: 0.70 },
    { w: 1.9, l: 4.8, curl: 2.3, seg: 16, pos: [-1.0, -0.5, -0.7], rot: [-0.4, 0.9, 0.3], scale: 0.88 },
  ];
  
  const allTriangles = [];
  
  for (const cfg of leafConfigs){
    const geom = buildLeafTwirl(cfg.w, cfg.l, cfg.curl, cfg.seg);
    const mesh = new THREE.Mesh(geom);
    mesh.position.set(...cfg.pos);
    mesh.rotation.set(...cfg.rot);
    mesh.scale.setScalar(cfg.scale);
    mesh.updateMatrix();
    geom.applyMatrix4(mesh.matrix);
    
    const pos = geom.attributes.position.array;
    const idx = geom.index.array;
    
    for (let i = 0; i < idx.length; i += 3){
      const a = idx[i] * 3, b = idx[i+1] * 3, c = idx[i+2] * 3;
      allTriangles.push({
        v0: [pos[a], pos[a+1], pos[a+2]],
        v1: [pos[b], pos[b+1], pos[b+2]],
        v2: [pos[c], pos[c+1], pos[c+2]],
      });
    }
    geom.dispose();
  }
  
  let totalArea = 0;
  const areas = allTriangles.map(tri => {
    const v0 = new THREE.Vector3(...tri.v0);
    const v1 = new THREE.Vector3(...tri.v1);
    const v2 = new THREE.Vector3(...tri.v2);
    const a = new THREE.Vector3().subVectors(v1, v0);
    const b = new THREE.Vector3().subVectors(v2, v0);
    const area = a.cross(b).length() * 0.5;
    totalArea += area;
    return area;
  });
  
  const positions = new Float32Array(particleCount * 3);
  const velocities = new Float32Array(particleCount * 3);
  const seeds = new Float32Array(particleCount);
  
  for (let i = 0; i < particleCount; i++){
    let r = Math.random() * totalArea;
    let triIdx = 0;
    for (let j = 0; j < areas.length; j++){
      if (r < areas[j]){ triIdx = j; break; }
      r -= areas[j];
    }
    
    const tri = allTriangles[triIdx];
    const u = Math.random(), v = Math.random();
    const su = Math.sqrt(u);
    const w0 = 1 - su;
    const w1 = su * (1 - v);
    const w2 = su * v;
    
    const v0 = new THREE.Vector3(...tri.v0);
    const v1 = new THREE.Vector3(...tri.v1);
    const v2 = new THREE.Vector3(...tri.v2);
    const p = new THREE.Vector3();
    p.addScaledVector(v0, w0);
    p.addScaledVector(v1, w1);
    p.addScaledVector(v2, w2);
    
    const jit = 0.06;
    p.x += (Math.random() - 0.5) * jit;
    p.y += (Math.random() - 0.5) * jit;
    p.z += (Math.random() - 0.5) * jit;
    
    positions[i*3] = p.x;
    positions[i*3+1] = p.y;
    positions[i*3+2] = p.z;
    
    velocities[i*3] = (Math.random() - 0.5) * 0.02;
    velocities[i*3+1] = (Math.random() - 0.5) * 0.02;
    velocities[i*3+2] = (Math.random() - 0.5) * 0.02;
    
    seeds[i] = Math.random();
  }
  
  return { positions, velocities, seeds };
}

/* ── scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1520, 0.025);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 3, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070d12, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const { positions, velocities, seeds } = createLeafCluster(N);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCameraY: { value: camera.position.y },
  uEnvRotation: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCameraY;
    uniform float uEnvRotation;
    attribute vec3 velocity;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vDepth;
    
    void main(){
      vec3 p = position;
      
      /* momentum-based drift */
      float t = uTime * 0.18;
      vec3 drift = velocity * t;
      drift.x += sin(t * 0.4 + seed * 6.28) * 0.3;
      drift.y += cos(t * 0.35 + seed * 4.0) * 0.2;
      drift.z += sin(t * 0.5 + seed * 5.0) * 0.25;
      p += drift;
      
      /* slow breathing expansion */
      float breathe = 1.0 + 0.08 * sin(uTime * 0.12 + seed * 3.0);
      p *= breathe;
      
      /* environment rotation — subtle rail movement */
      float envRot = uEnvRotation;
      float c = cos(envRot);
      float s = sin(envRot);
      vec3 pRot = vec3(
        p.x * c - p.z * s,
        p.y,
        p.x * s + p.z * c
      );
      
      /* vertical wave — ocean swell */
      float swellPhase = uTime * 0.22 + pRot.x * 0.15 + pRot.z * 0.12;
      pRot.y += sin(swellPhase) * 0.4 * (1.0 + seed * 0.3);
      
      vec4 mv = modelViewMatrix * vec4(pRot, 1.0);
      float dist = -mv.z;
      vDepth = dist;
      
      /* oceanic palette — cool blues, deep teals, dusk atmosphere */
      vec3 deep = vec3(0.08, 0.18, 0.28);
      vec3 mid  = vec3(0.15, 0.35, 0.48);
      vec3 foam = vec3(0.45, 0.60, 0.68);
      vec3 dusk = vec3(0.28, 0.32, 0.42);
      
      float yNorm = (pRot.y + 3.0) / 6.0;
      vec3 col = mix(deep, mid, yNorm);
      col = mix(col, foam, smoothstep(0.6, 1.0, yNorm) * seed);
      col = mix(col, dusk, 0.15 * (1.0 - seed));
      
      /* depth fade — foreground brighter, background dissolves into fog */
      float depthFade = smoothstep(18.0, 8.0, dist);
      col = mix(vec3(0.04, 0.08, 0.12), col, depthFade);
      
      vCol = col;
      
      /* alpha — atmospheric, soft */
      float energy = 0.3 + 0.15 * sin(uTime * 0.6 + seed * 6.28);
      vAlpha = energy * depthFade * 0.75;
      
      /* size — foreground particles larger, background smaller */
      float sizeMul = mix(0.6, 1.4, depthFade);
      gl_PointSize = sizeMul * uPixel * (35.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vDepth;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      /* soft gradient falloff */
      float a = smoothstep(0.25, 0.05, r) * vAlpha;
      
      /* atmospheric scatter — distant particles blur more */
      float scatter = smoothstep(12.0, 20.0, vDepth) * 0.3;
      vec3 col = mix(vCol, vec3(0.10, 0.20, 0.28), scatter);
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* smooth camera target integration */
const cameraTarget = new THREE.Vector3(0, 0, 0);
const cameraLookAt = new THREE.Vector3(0, 0, 0);
const cameraUp = new THREE.Vector3(0, 1, 0);

/* inertial mouse tracking */
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;

addEventListener('mousemove', (e) => {
  targetMouseX = (e.clientX / innerWidth - 0.5) * 2;
  targetMouseY = (e.clientY / innerHeight - 0.5) * 2;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  /* slow environment rotation — rail through space */
  uniforms.uEnvRotation.value = elapsed * 0.04;
  
  /* inertial mouse response — ocean staring, not tech demo */
  mouseX += (targetMouseX - mouseX) * 0.015;
  mouseY += (targetMouseY - mouseY) * 0.015;
  
  /* camera orbit with momentum */
  const orbitRadius = 14;
  const orbitSpeed = elapsed * 0.03 + mouseX * 0.5;
  const orbitHeight = 3 + mouseY * 2;
  
  const camX = Math.cos(orbitSpeed) * orbitRadius;
  const camZ = Math.sin(orbitSpeed) * orbitRadius;
  const camY = orbitHeight + Math.sin(elapsed * 0.08) * 0.6;
  
  cameraTarget.set(camX, camY, camZ);
  camera.position.lerp(cameraTarget, 0.012);
  
  /* look-at drifts toward cluster centroid with lag */
  const lookDrift = new THREE.Vector3(
    Math.sin(elapsed * 0.05) * 0.4,
    Math.cos(elapsed * 0.06) * 0.3,
    Math.sin(elapsed * 0.04) * 0.5
  );
  cameraLookAt.lerp(lookDrift, 0.008);
  camera.lookAt(cameraLookAt);
  camera.up.lerp(cameraUp, 0.02);
  
  uniforms.uCameraY.value = camera.position.y;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
