<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7n2 · nautilus leaf spiral</title>
<!-- MOTION: spiral, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">7n2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 45);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

// golden ratio spiral constants
const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = Math.PI * 2 / (PHI * PHI);
const LEAF_COUNT = 180;

// palette: oxide red, ochre, umber, rare warm green
const PALETTE = [
  new THREE.Color(0x8b3a26), // oxide red
  new THREE.Color(0xcc7722), // ochre
  new THREE.Color(0x6b4423), // umber
  new THREE.Color(0xd4a574), // warm tan
  new THREE.Color(0x4a5d3a)  // rare warm green
];

// leaf geometry: curled sheet with midrib
function createLeafGeometry(length, width) {
  const segs = 18;
  const positions = [];
  const indices = [];
  
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = (t - 0.5) * length;
    // leaf profile: wider at base, tapers to tip
    const profile = Math.sin(t * Math.PI) * width;
    // curl: edges curl downward more than center
    const curlZ = -Math.pow(Math.abs(t - 0.5) * 2, 1.8) * length * 0.15;
    
    for (let side = -1; side <= 1; side += 2) {
      const y = side * profile * 0.5;
      // edge curl more pronounced
      const edgeCurl = curlZ * Math.abs(side);
      positions.push(x, y, edgeCurl);
    }
  }
  
  for (let i = 0; i < segs; i++) {
    const base = i * 2;
    indices.push(base, base + 1, base + 2);
    indices.push(base + 1, base + 3, base + 2);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

// create leaf instances on nautilus spiral
const leaves = [];
const group = new THREE.Group();
scene.add(group);

for (let i = 0; i < LEAF_COUNT; i++) {
  const t = i / LEAF_COUNT;
  
  // nautilus spiral: r = a * e^(b*theta)
  const theta = i * GOLDEN_ANGLE;
  const r = 0.4 * Math.exp(0.28 * i / LEAF_COUNT * Math.PI * 4);
  
  const x = r * Math.cos(theta);
  const y = r * Math.sin(theta);
  
  // scale increases with radius (golden ratio progression)
  const scale = 0.3 + r * 0.18;
  const length = 2.2 + i * 0.015;
  const width = 0.9 + i * 0.005;
  
  const geom = createLeafGeometry(length, width);
  
  // per-leaf color variation
  const colorIdx = Math.floor(Math.pow(Math.random(), 1.5) * PALETTE.length);
  const baseColor = PALETTE[colorIdx].clone();
  baseColor.offsetHSL(0, 0, (Math.random() - 0.5) * 0.15);
  
  const mat = new THREE.MeshStandardMaterial({
    color: baseColor,
    roughness: 0.85,
    metalness: 0.02,
    side: THREE.DoubleSide,
    flatShading: true
  });
  
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(x, y, -i * 0.02);
  
  // rotation: tangent to spiral + individual variation
  const tangentAngle = theta + Math.PI / 2;
  mesh.rotation.z = tangentAngle + (Math.random() - 0.5) * 0.4;
  
  // tilt variation for handmade feel
  mesh.rotation.x = (Math.random() - 0.5) * 0.3;
  mesh.rotation.y = (Math.random() - 0.5) * 0.25;
  
  mesh.scale.setScalar(scale);
  
  mesh.userData = {
    phase: Math.random() * Math.PI * 2,
    breathSpeed: 0.4 + Math.random() * 0.3,
    breathAmp: 0.03 + Math.random() * 0.02,
    driftSpeed: 0.15 + Math.random() * 0.1,
    driftAmp: 0.08 + Math.random() * 0.06,
    baseZ: mesh.rotation.z
  };
  
  leaves.push(mesh);
  group.add(mesh);
}

// lighting: warm side-light from upper-left
const ambientLight = new THREE.AmbientLight(0x1a1410, 0.8);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffddaa, 1.8);
keyLight.position.set(-12, 16, 20);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4a3a2a, 0.6);
rimLight.position.set(8, -6, -10);
scene.add(rimLight);

// subtle volumetric fog
scene.fog = new THREE.Fog(0x0a0806, 20, 80);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// camera tracks centroid with gentle parallax
let cameraPhase = 0;

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  
  // overall spiral rotation: very slow
  group.rotation.z = t * 0.08;
  
  // per-leaf breathing and drift
  leaves.forEach(mesh => {
    const u = mesh.userData;
    const breath = Math.sin(t * u.breathSpeed + u.phase) * u.breathAmp;
    mesh.scale.setScalar(mesh.scale.x * (1 + breath));
    
    const drift = Math.sin(t * u.driftSpeed + u.phase * 1.3) * u.driftAmp;
    mesh.rotation.z = u.baseZ + drift;
  });
  
  // camera gentle orbit around spiral center
  cameraPhase += 0.003;
  camera.position.x = Math.sin(cameraPhase) * 3;
  camera.position.y = Math.cos(cameraPhase * 0.7) * 2;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
