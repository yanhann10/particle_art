<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1rd · Shiota — Suspended Breath</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">1rd</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0035);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.008));
const pL = new THREE.PointLight(0xff9070, 0.028, 60, 2.0);
pL.position.set(-3, 10, 2);
scene.add(pL);

let seed = 91047263;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── THE SPHERE — the sole suspended object, a remembered moon
// Shiota: "The sphere holds the silence before words."
const sphereCenter = new THREE.Vector3(0.0, 0.0, 0.0);
const sphereR = 1.5;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf5f0e8, 
    emissive: 0xf5ead8, 
    emissiveIntensity: 0.6,
    roughness: 0.98, 
    metalness: 0.0
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── ARCHITECTURAL VOLUME — a 28×24×32 unit room where the web lives
const ROOM = { w:28, h:24, d:32 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

// ── ANCHOR POINTS — concentric shells around the sphere
// Then a sparse wall-grid perimeter
const anchors = [];

// Inner shells — dense near the sphere
const shells = [2.8, 4.2, 6.0, 8.5, 11.0];
for(const sr of shells){
  const count = Math.floor(18 + sr*1.5);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.9+rng()*0.2);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.85,
      sphereCenter.z + Math.cos(v)*r
    ));
  }
}

// Wall anchors — perimeter grid with jitter
for(let i = 0; i < 80; i++){
  anchors.push(wallPt());
}

// ── SUSPENSION THREADS — 8 vertical lines from ceiling to sphere top
// Gravity's evidence, the physical hold
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.4;
  const topR = 0.4 + rng()*1.0;
  const botR = 0.01 + rng()*0.04;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*topR, hh, sphereCenter.z + Math.sin(a)*topR,
    sphereCenter.x + Math.cos(a)*botR, sphereCenter.y + sphereR - 0.02, sphereCenter.z + Math.sin(a)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0202, transparent: true, opacity: 0.6
})));

// ── BUILD THE NETWORK — 20,000 line segments maximum
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  li++;
}

// RULE 1: CONVERGENCE — 60% of lines reach toward the sphere from outer shells
const catA = Math.floor(NUM_LINES * 0.60);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.55){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  const target = sphereSurf();
  
  // 10% stop short — threads that reach but don't quite touch
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.15 + rng()*0.9;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped);
  } else {
    setLine(origin, target);
  }
}

// RULE 2: LATERAL BONDS — anchor-to-anchor within 5.0 units
const THRESH = 5.0;
const catBtarget = Math.floor(NUM_LINES * 0.25);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 40000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  catBcount++;
}

// RULE 3: RADIAL FILAMENTS — short chains growing outward from sphere surface
for(let i = 0; i < 120 && li < NUM_LINES; i++){
  let pt = sphereSurf();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 2 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.4 + rng()*0.7;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.4, (rng()-0.5)*0.4, (rng()-0.5)*0.4
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next);
    pt = next;
    prevDir = dir;
  }
}

// Fill remainder: sparse wall-to-wall architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.2 ? sphereSurf() : wallPt();
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Single red hue — blood, family, connection
// Opacity varies by distance from sphere: denser near center
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
for(let i = 0; i < li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.4, 1.0 - d*0.08);
  const baseOp = 0.06;
  const bright = baseOp * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright * 0.9;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, passport corners, keys
// caught in the web, held between two places
const NUM_FRAGMENTS = 18;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.02 + rng()*0.05;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.4+rng()*0.7);
  const h = sz*(0.5+rng()*0.9);
  const verts = new Float32Array([
    w*(-0.4+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.1-rng()*0.2), -h*0.5, 0,
    w*(-0.4+rng()*0.2), h*0.5, 0,
    w*(0.2+rng()*0.15), h*(rng()*0.1), 0,
    w*(0.1-rng()*0.2), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.004 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.15 + rng()*0.2,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  
  const si = Math.floor(rng()*li)*6;
  const t = 0.2+rng()*0.6;
  frag.position.set(
    basePositions[si]*(1-t)+basePositions[si+3]*t,
    basePositions[si+1]*(1-t)+basePositions[si+4]*t,
    basePositions[si+2]*(1-t)+basePositions[si+5]*t
  );
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — slow walk INSIDE the web
// Phase 1: Close to the sphere, intimate
// Phase 2: Drift sideways through the network
// Phase 3: Descend below, looking up
// Phase 4: Rise and return
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.25){
    const lt = t/0.25;
    rH = 3.5 + lt*1.5;
    y = cy - 0.8 + lt*2.0;
  } else if(t < 0.5){
    const lt = (t-0.25)/0.25;
    rH = 5.0 + lt*3.0;
    y = cy + 1.2 + Math.sin(lt*Math.PI)*1.8;
  } else if(t < 0.75){
    const lt = (t-0.5)/0.25;
    rH = 8.0 - lt*1.5;
    y = cy + 3.0 - lt*7.0;
  } else {
    const lt = (t-0.75)/0.25;
    rH = 6.5 - lt*3.0;
    y = cy - 4.0 + lt*3.2;
  }

  const x = cx + Math.sin(p*0.9)*rH;
  const z = cz + Math.cos(p*0.9)*rH*1.1;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — anchor jitter < 0.4% of length
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00008 * Math.max(0, 1.0-dist/15.0);
    const phase = basePositions[idx]*0.08 + basePositions[idx+1]*0.1 + i*0.0003;
    const breath = Math.sin(elapsed*0.006+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.1;
      arr[vi+2] = basePositions[vi+2] + breath*0.18;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — glacial drift through the web
  const speed = 0.00018;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — the gravitational center
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0008)*0.05;
  look.y += Math.cos(elapsed*0.0006)*0.25;
  look.z += Math.sin(elapsed*0.0009+0.3)*0.04;
  camera.lookAt(look);

  // Light drift
  pL.position.x = -3 + Math.sin(elapsed*0.0004)*0.1;
  pL.position.y = 10 + Math.cos(elapsed*0.0002)*0.08;
  pL.intensity = 0.028 + Math.sin(elapsed*0.0005)*0.004;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
