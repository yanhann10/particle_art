<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>joh · cyber-nest accretion · Wang & Söderström</title>
<!-- MOTION: gathering, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0e12; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">joh</div>
<div class="hint" id="hint">gathering · biomorphic accretion</div>
<div class="src">Wang & Söderström · Lumen Prize 2023</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0e12, 1);
document.body.appendChild(renderer.domElement);

// Palette: pearl, lavender, mercury — biomorphic data-glow
const palette = [
  new THREE.Color(0xe8dfe0), // pearl
  new THREE.Color(0xc6b3d4), // lavender
  new THREE.Color(0xa8a6ab), // mercury
  new THREE.Color(0xd4c4d8), // pale orchid
];

const N = 180; // blob count
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const radii = new Float32Array(N);
const ages = new Float32Array(N); // how long stuck to nest
const seeds = new Float32Array(N);
const stuck = new Uint8Array(N); // 0=orbiting, 1=stuck

// Attractor at center — the viewer proxy
const attractor = new THREE.Vector3(0, 0, 0);

// Initialize blobs in scattered orbit
for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 12;
  positions[i*3]   = Math.cos(theta) * Math.sin(phi) * r;
  positions[i*3+1] = Math.sin(theta) * Math.sin(phi) * r;
  positions[i*3+2] = Math.cos(phi) * r;
  
  const vtheta = Math.random() * Math.PI * 2;
  const speed = 0.4 + Math.random() * 0.6;
  velocities[i*3]   = Math.cos(vtheta) * speed;
  velocities[i*3+1] = Math.sin(vtheta) * speed;
  velocities[i*3+2] = (Math.random() - 0.5) * speed * 0.5;
  
  radii[i] = 0.4 + Math.random() * 0.8;
  ages[i] = 0;
  seeds[i] = Math.random();
  stuck[i] = 0;
}

// Instanced sphere mesh for blobs
const sphereGeom = new THREE.SphereGeometry(1, 16, 12);
const instancedMesh = new THREE.InstancedMesh(
  sphereGeom,
  new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPalette: { value: palette },
    },
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vPos;
      varying float vSeed;
      varying float vRadius;
      attribute float seed;
      attribute float radius;
      attribute float age;
      attribute float isStuck;
      
      void main(){
        vSeed = seed;
        vRadius = radius;
        vNormal = normalize(normalMatrix * normal);
        
        // Soft pulse for stuck blobs
        float pulse = 0.5 + 0.5 * sin(uTime * 1.2 + seed * 6.28);
        float scale = radius * (1.0 + pulse * 0.15 * isStuck);
        
        vec3 pos = position * scale;
        vec4 mvPos = modelViewMatrix * instanceMatrix * vec4(pos, 1.0);
        vPos = mvPos.xyz;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uPalette[4];
      varying vec3 vNormal;
      varying vec3 vPos;
      varying float vSeed;
      varying float vRadius;
      
      void main(){
        // Fresnel-like rim glow
        float fresnel = pow(1.0 - abs(dot(vNormal, normalize(-vPos))), 2.5);
        
        // Color by seed
        int idx = int(vSeed * 4.0);
        vec3 col = uPalette[idx];
        
        // Glossy center, glowing rim
        float rim = smoothstep(0.3, 0.8, fresnel);
        col = mix(col * 0.6, col * 1.4, rim);
        
        // Subtle internal glow pulse
        float pulse = 0.5 + 0.5 * sin(uTime * 1.5 + vSeed * 6.28);
        col += vec3(0.08, 0.06, 0.1) * pulse;
        
        float alpha = 0.75 + rim * 0.25;
        gl_FragColor = vec4(col, alpha);
      }
    `,
  }),
  N
);

// Add custom attributes for instanced data
const seedAttr = new THREE.InstancedBufferAttribute(seeds, 1);
const radiusAttr = new THREE.InstancedBufferAttribute(radii, 1);
const ageAttr = new THREE.InstancedBufferAttribute(ages, 1);
const stuckAttr = new THREE.InstancedBufferAttribute(stuck, 1);
instancedMesh.geometry.setAttribute('seed', seedAttr);
instancedMesh.geometry.setAttribute('radius', radiusAttr);
instancedMesh.geometry.setAttribute('age', ageAttr);
instancedMesh.geometry.setAttribute('isStuck', stuckAttr);

scene.add(instancedMesh);

// Ambient + point light for volume
const ambient = new THREE.AmbientLight(0x4a4754, 0.5);
scene.add(ambient);
const pointLight = new THREE.PointLight(0xc6b3d4, 1.2, 50);
pointLight.position.set(5, 8, 10);
scene.add(pointLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const matrix = new THREE.Matrix4();
const tmpVec = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();
const tmpScale = new THREE.Vector3();

// Attractor movement — slow drift mimicking viewer presence
let attractorPhase = 0;

// SDF-like soft blending threshold
const STICK_THRESHOLD = 2.8; // distance to stick
const ORBIT_RADIUS = 12;
const ATTRACTOR_STRENGTH = 0.04;
const DRAG = 0.96;

function updateBlobs(dt){
  // Drift attractor slowly
  attractorPhase += dt * 0.3;
  attractor.x = Math.cos(attractorPhase * 0.7) * 2;
  attractor.y = Math.sin(attractorPhase * 0.5) * 1.5;
  attractor.z = Math.sin(attractorPhase * 0.3) * 1.2;
  
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const vx = velocities[i*3];
    const vy = velocities[i*3+1];
    const vz = velocities[i*3+2];
    
    const dx = attractor.x - px;
    const dy = attractor.y - py;
    const dz = attractor.z - pz;
    const distToAttractor = Math.sqrt(dx*dx + dy*dy + dz*dz);
    
    if (stuck[i] === 0){
      // Orbiting: gentle attractor pull + tangential velocity
      const speed = Math.sqrt(vx*vx + vy*vy + vz*vz);
      
      // Gravity toward attractor
      velocities[i*3]   += dx * ATTRACTOR_STRENGTH * dt;
      velocities[i*3+1] += dy * ATTRACTOR_STRENGTH * dt;
      velocities[i*3+2] += dz * ATTRACTOR_STRENGTH * dt;
      
      // Tangential component to maintain orbit
      const cross = new THREE.Vector3(vx, vy, vz).cross(new THREE.Vector3(dx, dy, dz));
      velocities[i*3]   += cross.x * 0.015 * dt;
      velocities[i*3+1] += cross.y * 0.015 * dt;
      velocities[i*3+2] += cross.z * 0.015 * dt;
      
      // Check if slow enough and close enough to stick
      if (distToAttractor < STICK_THRESHOLD && speed < 0.8){
        stuck[i] = 1;
        ages[i] = 0;
        velocities[i*3] = 0;
        velocities[i*3+1] = 0;
        velocities[i*3+2] = 0;
      }
      
      // Drag
      velocities[i*3] *= DRAG;
      velocities[i*3+1] *= DRAG;
      velocities[i*3+2] *= DRAG;
      
      // Update position
      positions[i*3]   += velocities[i*3] * dt;
      positions[i*3+1] += velocities[i*3+1] * dt;
      positions[i*3+2] += velocities[i*3+2] * dt;
      
    } else {
      // Stuck: grow age, slight drift toward attractor
      ages[i] += dt;
      
      // Slow creep toward attractor center
      positions[i*3]   += dx * 0.008 * dt;
      positions[i*3+1] += dy * 0.008 * dt;
      positions[i*3+2] += dz * 0.008 * dt;
      
      // Occasionally shed if attractor moves away fast
      if (distToAttractor > STICK_THRESHOLD * 1.8 && Math.random() < 0.002){
        stuck[i] = 0;
        // Re-launch
        const angle = Math.random() * Math.PI * 2;
        velocities[i*3]   = Math.cos(angle) * 1.2;
        velocities[i*3+1] = Math.sin(angle) * 1.2;
        velocities[i*3+2] = (Math.random() - 0.5) * 0.6;
      }
    }
    
    // Update instance matrix
    tmpVec.set(positions[i*3], positions[i*3+1], positions[i*3+2]);
    tmpQuat.identity();
    tmpScale.set(1, 1, 1);
    matrix.compose(tmpVec, tmpQuat, tmpScale);
    instancedMesh.setMatrixAt(i, matrix);
  }
  
  instancedMesh.instanceMatrix.needsUpdate = true;
  stuckAttr.needsUpdate = true;
  ageAttr.needsUpdate = true;
}

// Camera follows attractor centroid
const cameraTarget = new THREE.Vector3();
function updateCamera(){
  // Compute centroid of stuck blobs
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < N; i++){
    if (stuck[i] === 1){
      cx += positions[i*3];
      cy += positions[i*3+1];
      cz += positions[i*3+2];
      count++;
    }
  }
  if (count > 0){
    cx /= count;
    cy /= count;
    cz /= count;
    cameraTarget.set(cx, cy, cz);
  } else {
    cameraTarget.copy(attractor);
  }
  
  // Slow orbit around nest centroid
  const angle = performance.now() * 0.00006;
  const orbitR = 22 + Math.sin(angle * 0.5) * 4;
  camera.position.x = cameraTarget.x + Math.cos(angle) * orbitR;
  camera.position.z = cameraTarget.z + Math.sin(angle) * orbitR;
  camera.position.y = cameraTarget.y + Math.sin(angle * 0.3) * 6;
  camera.lookAt(cameraTarget);
}

let lastTime = performance.now();
const start = performance.now();
const hintEl = document.getElementById('hint');

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05) * 60;
  lastTime = now;
  const t = (now - start) / 1000;
  
  instancedMesh.material.uniforms.uTime.value = t;
  
  updateBlobs(dt);
  updateCamera();
  
  // Update hint with nest size
  const stuckCount = stuck.filter(s => s === 1).length;
  if (Math.floor(t * 2) % 2 === 0){
    hintEl.textContent = `nest size: ${stuckCount} blobs · biomorphic accretion`;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
