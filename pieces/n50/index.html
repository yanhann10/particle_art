<div class="id">n50</div>
<div class="hint">click to regrow · drag to tilt — watch the pulse travel</div>
<div class="src">descended from gxw · chain: mycelium · pulse propagation · Saraceno tensile web</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: the sproing calyx is decomposing — moth-eaten holes in the bowl — and
// from its underside a branching mycelial network grows downward into dark earth.
// The sproing becomes a slow bioluminescent PULSE that originates at the calyx
// center and propagates through the network to the tips over ~4 seconds.
// Narrative: the flower's last energy feeds the network below. Death → transfer → life.
// Named technique: space colonization branching + traveling Gaussian pulse.
// Constraint: calyx must remain recognizable despite decomposition holes.
// Evokes: Tomás Saraceno's spider-web architectures — tensile branching networks
// as load-bearing structure, life as infrastructure.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0.6, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── Pulse physics (replaces sproing) ──
const PULSE_PERIOD = 20;
const PULSE_WAIT   = 8;
const PULSE_SPEED  = 1.1;
function getPulse(t) {
  const adj = t - PULSE_WAIT;
  if (adj < 0) return -20;
  const phase = adj % PULSE_PERIOD;
  if (phase > 7) return -20;
  return phase * PULSE_SPEED;
}

// ── Particle buffers ──
const N = 80000;
const N_CALYX = 26000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
const depths    = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;

function buildAll(seed) {
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  // ── Calyx (decomposed Riley wave bowl) ──
  const CALYX_Y = 2.8;
  const w1 = { ang: rng()*Math.PI*2, k: 1.6+rng()*1.2, ph: rng()*Math.PI*2 };
  const w2 = { ang: rng()*Math.PI*2, k: 2.1+rng()*1.4, ph: rng()*Math.PI*2 };
  const w3 = { ang: rng()*Math.PI*2, k: 0.8+rng()*0.6, ph: rng()*Math.PI*2 };
  const radK = 1.3 + rng() * 0.6;
  const d1 = rng()*5, d2 = rng()*5, d3 = rng()*5;

  let cW = 0, att = 0;
  while (cW < N_CALYX && att < N_CALYX * 20) {
    att++;
    const r  = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x  = r * Math.cos(th), z = r * Math.sin(th);
    const v1 = Math.sin(x*Math.cos(w1.ang)*w1.k + z*Math.sin(w1.ang)*w1.k + w1.ph);
    const v2 = Math.sin(x*Math.cos(w2.ang)*w2.k + z*Math.sin(w2.ang)*w2.k + w2.ph);
    const v3 = Math.sin(x*Math.cos(w3.ang)*w3.k + z*Math.sin(w3.ang)*w3.k + w3.ph);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.10);
    // decomposition: organic holes via low-freq interference
    const dec = Math.sin(x*1.7 + z*2.3 + d1) * Math.cos(z*1.1 - x*0.8 + d2)
              + Math.sin(r*3.0 + th*2.0 + d3) * 0.6;
    if (!(f > 0 && rng() < fall * (0.32 + 0.5*f) && dec > -0.35)) continue;
    const scallop = Math.cos(th * 6) * 0.18 * (r / 4);
    positions[cW*3]     = x;
    positions[cW*3 + 1] = -0.15 * r * r + scallop + CALYX_Y;
    positions[cW*3 + 2] = z;
    depths[cW] = 0;
    seeds[cW]  = rng();
    cW++;
  }

  // ── Mycelial network (recursive branching) ──
  const branches = [];
  function grow(ox, oy, oz, dx, dy, dz, dep, pLen) {
    if (dep > 7 || pLen > 6.0) return;
    const len = 0.18 + rng() * 0.38;
    dy -= 0.04;
    const m = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    dx /= m; dy /= m; dz /= m;
    const ex = ox + dx*len, ey = oy + dy*len, ez = oz + dz*len;
    branches.push([ox,oy,oz, ex,ey,ez, pLen, pLen+len, dep]);
    const nB = rng() < (0.82 - dep*0.09) ? (rng() < 0.35 ? 3 : 2) : 1;
    for (let i = 0; i < nB; i++) {
      grow(ex, ey, ez,
        dx + (rng()-0.5)*0.95,
        dy - rng()*0.12,
        dz + (rng()-0.5)*0.95,
        dep+1, pLen+len);
    }
  }
  // Primary rhizomorphs from calyx center
  for (let i = 0; i < 3; i++) {
    const a = (i/3)*Math.PI*2 + rng()*0.4;
    const rd = 0.2 + rng()*0.4;
    grow(rd*Math.cos(a), CALYX_Y - 0.15*rd*rd - 0.1, rd*Math.sin(a),
         (rng()-0.5)*0.35, -0.88, (rng()-0.5)*0.35, 0, 0);
  }
  // Secondary exploratory hyphae from wider positions
  for (let i = 0; i < 4; i++) {
    const a = (i/4)*Math.PI*2 + rng()*0.7;
    const rd = 1.0 + rng()*1.8;
    grow(rd*Math.cos(a), CALYX_Y - 0.15*rd*rd - 0.05, rd*Math.sin(a),
         (rng()-0.5)*0.7, -0.65 - rng()*0.2, (rng()-0.5)*0.7, 2, 0);
  }

  // Distribute particles along branches weighted by 1/(depth+1)
  let totalW = 0;
  for (const b of branches) totalW += 1.0 / (b[8] + 1);
  const N_MYC = N - N_CALYX;
  let mW = 0;
  for (const b of branches) {
    if (mW >= N_MYC) break;
    const [sx,sy,sz, ex,ey,ez, pl0,pl1, dep] = b;
    const w = 1.0 / (dep + 1);
    const nP = Math.max(1, Math.round((w / totalW) * N_MYC));
    const thick = 0.055 * Math.exp(-dep * 0.28);
    for (let j = 0; j < nP && mW < N_MYC; j++) {
      const t = rng();
      const idx = N_CALYX + mW;
      positions[idx*3]     = sx+(ex-sx)*t + (rng()-0.5)*thick;
      positions[idx*3 + 1] = sy+(ey-sy)*t + (rng()-0.5)*thick;
      positions[idx*3 + 2] = sz+(ez-sz)*t + (rng()-0.5)*thick;
      depths[idx] = pl0 + (pl1-pl0)*t;
      seeds[idx]  = rng();
      mW++;
    }
  }
  // Fill remaining (shouldn't be many)
  for (let i = N_CALYX + mW; i < N; i++) {
    positions[i*3] = 0; positions[i*3+1] = -6; positions[i*3+2] = 0;
    depths[i] = 8; seeds[i] = 0;
  }
}
buildAll(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aDepth',   new THREE.BufferAttribute(depths, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uPulse:   { value: -20 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uPulse;
    attribute float seed;
    attribute float aDepth;
    varying float vSeed;
    varying float vPulse;
    varying float vMycel;
    varying float vFog;
    void main(){
      vec3 p = position;
      float tiltX = uPointer.y * 0.18;
      float tiltZ = -uPointer.x * 0.18;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      float t = uTime * 0.18 + seed * 6.28;
      float isM = step(0.01, aDepth);

      // calyx breath
      q.y += (1.0 - isM) * 0.025 * sin(t);
      // mycelium undulation — slow peristaltic sway
      q.x += isM * 0.012 * sin(t * 0.6 + aDepth * 2.2);
      q.z += isM * 0.010 * cos(t * 0.5 + aDepth * 1.7);

      // pulse: traveling Gaussian wave
      float pd = uPulse - aDepth;
      float pulse = exp(-2.8 * pd * pd) * smoothstep(-20.0, -5.0, uPulse);
      // calyx lifts slightly at pulse origin
      q.y += pulse * 0.035 * (1.0 - isM);
      // mycelium swells radially at wavefront
      float swell = pulse * isM * 0.02;
      q.x += swell * sin(seed * 40.0);
      q.z += swell * cos(seed * 40.0);

      vSeed  = seed;
      vPulse = pulse;
      vMycel = isM;
      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vFog = -mv.z;
      float baseS = mix(1.3, 0.85, isM);
      float pulseS = 1.0 + 0.35 * pulse;
      gl_PointSize = (baseS + 0.5 * sin(t * 0.6)) * pulseS * uPixel * (5.0 / vFog);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSeed;
    varying float vPulse;
    varying float vMycel;
    varying float vFog;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);
      // calyx: dark decomposing ink
      vec3 cDark  = vec3(0.09, 0.05, 0.03);
      vec3 cLight = vec3(0.24, 0.15, 0.07);
      vec3 cCol = mix(cDark, cLight, vSeed);
      // mycelium: pale bone threads
      vec3 mWarm = vec3(0.38, 0.30, 0.20);
      vec3 mPale = vec3(0.52, 0.46, 0.35);
      vec3 mCol = mix(mWarm, mPale, vSeed);
      vec3 col = mix(cCol, mCol, vMycel);
      // pulse bioluminescence — warm amber flush
      vec3 pCol = vec3(0.48, 0.30, 0.11);
      col = mix(col, pCol, vPulse * 0.55);
      // depth haze
      float haze = clamp((vFog - 10.0) / 8.0, 0.0, 0.50);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      float op = mix(0.76, 0.58, vMycel) + vPulse * 0.18;
      gl_FragColor = vec4(col, a * op * (1.0 - haze * 0.55));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── Dust motes / spores — drift upward (released by network) ──
const N_DUST = 280;
const dGeom = new THREE.BufferGeometry();
const dPos  = new Float32Array(N_DUST * 3);
const dSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dPos[i*3]   = (Math.random()-0.5)*12;
  dPos[i*3+1] = (Math.random()-0.5)*10 - 1;
  dPos[i*3+2] = (Math.random()-0.5)*8;
  dSeed[i]    = Math.random();
}
dGeom.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dGeom.setAttribute('seed',     new THREE.BufferAttribute(dSeed, 1));
const dMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uPulse: uniforms.uPulse },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPulse;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.08 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 28.0) * 0.35;
      p.y += mod(uTime * 0.06 + seed * 8.0, 5.0) - 2.5;
      p.z += cos(t * 0.9 + seed * 20.0) * 0.25;
      // spores drift upward faster during pulse
      float pBoost = smoothstep(-5.0, 0.0, uPulse) * 0.15;
      p.y += pBoost * (0.4 + seed);
      float sx = -p.x / 6.0, sy = p.y / 5.0;
      vGlow = clamp(0.25 + 0.5 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vGlow += smoothstep(-5.0, 0.0, uPulse) * 0.10;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.9 + 1.2 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(0.95, 0.88, 0.70) * vGlow;
      gl_FragColor = vec4(col, a * 0.60 * vGlow);
    }
  `
});
scene.add(new THREE.Points(dGeom, dMat));

// ── Interaction ──
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)*2 - 1,
    (e.clientY / innerHeight)*2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildAll(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.aDepth.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation ──
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value  = t;
  uniforms.uPulse.value = getPulse(t);

  // gentle camera: slow lateral drift, slight downward track during pulse
  const pulseActive = uniforms.uPulse.value > -5;
  const pulseNorm = pulseActive ? Math.min(uniforms.uPulse.value / 6.0, 1.0) : 0;
  camera.position.x = Math.sin(t * 0.035) * 0.35;
  camera.position.y = 0.7 - pulseNorm * 0.25;
  camera.position.z = 15;
  camera.lookAt(0, 0.8 - pulseNorm * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
</body>
</html>
