<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>obl · obbligato</title>
<!-- MOTION: obligatory accompaniment, intensity: persistent -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0708; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">9nw</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── OBBLIGATO: The cadence becomes accompaniment — a second voice enters,
   harmonically locked to the primary rotation. Like an obbligato part in baroque music,
   this new layer cannot be omitted; it's essential, persistent, intertwined.
   Each leaf now spins on TWO axes simultaneously: the original Y-axis cadence remains,
   but a counter-rotating X-axis wobble threads through it, harmonically linked at 3:2 ratio.
   The two motions form an obligatory duet — neither can exist without the other. ── */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0708, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

const N_LEAVES = 7;
const PTS_PER_LEAF = 11000;
const N = N_LEAVES * PTS_PER_LEAF;

function leafShape_ancestor(u, v){
  const theta = u * Math.PI * 2;
  const r = 0.8 + 0.3 * v;
  const h = v * 1.8;
  const spiral = theta + h * 3.5;
  return new THREE.Vector3(
    r * Math.cos(spiral),
    h - 0.9,
    r * Math.sin(spiral)
  );
}

function leafShape_parent(u, v){
  const theta = u * Math.PI * 2;
  const r = 1.2 + 0.5 * v;
  const h = v * 2.2;
  const spiral = theta + h * 2.0;
  return new THREE.Vector3(
    r * Math.cos(spiral),
    h - 1.1,
    r * Math.sin(spiral)
  );
}

function leafShape_self(u, v){
  const theta = u * Math.PI * 2;
  const r = 1.6 + 0.8 * v;
  const h = v * 2.6;
  const spiral = theta + h * 0.9;
  const flatness = 0.3 + 0.7 * v;
  return new THREE.Vector3(
    r * Math.cos(spiral) * flatness,
    h - 1.3,
    r * Math.sin(spiral) * flatness
  );
}

const positions = new Float32Array(N * 3);
const leafIds = new Float32Array(N);
const seeds = new Float32Array(N);
const uvs = new Float32Array(N * 2);

let idx = 0;
for (let L = 0; L < N_LEAVES; L++){
  for (let i = 0; i < PTS_PER_LEAF; i++){
    const u = Math.random();
    const v = Math.random();
    const pos = leafShape_ancestor(u, v);
    positions[idx * 3] = pos.x;
    positions[idx * 3 + 1] = pos.y;
    positions[idx * 3 + 2] = pos.z;
    leafIds[idx] = L;
    seeds[idx] = Math.random();
    uvs[idx * 2] = u;
    uvs[idx * 2 + 1] = v;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('leafId', new THREE.BufferAttribute(leafIds, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const leafRotations = [];
const leafOffsets = [];
const leafMorphPhases = [];
const leafCadenceOffsets = [];
const leafObbligatoPhases = [];
for (let L = 0; L < N_LEAVES; L++){
  const angle = (L / N_LEAVES) * Math.PI * 2;
  const radius = 2.5 + (L % 2) * 0.8;
  leafRotations.push(Math.random() * Math.PI * 2);
  leafOffsets.push(new THREE.Vector3(
    Math.cos(angle) * radius,
    (Math.random() - 0.5) * 1.2,
    Math.sin(angle) * radius
  ));
  leafMorphPhases.push(Math.random() * Math.PI * 2);
  leafCadenceOffsets.push(L * 0.15);
  leafObbligatoPhases.push((L / N_LEAVES) * Math.PI); // harmonic offset
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uLeafRotations: { value: leafRotations },
  uLeafOffsets: { value: leafOffsets.map(v => [v.x, v.y, v.z]).flat() },
  uLeafMorphPhases: { value: leafMorphPhases },
  uCadenceOffsets: { value: leafCadenceOffsets },
  uObbligatoPhases: { value: leafObbligatoPhases },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uLeafRotations[${N_LEAVES}];
    uniform float uLeafOffsets[${N_LEAVES * 3}];
    uniform float uLeafMorphPhases[${N_LEAVES}];
    uniform float uCadenceOffsets[${N_LEAVES}];
    uniform float uObbligatoPhases[${N_LEAVES}];
    attribute float leafId;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vCadenceIntensity;
    varying float vObbligatoIntensity;

    vec3 leafShape_ancestor(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 0.8 + 0.3 * v;
      float h = v * 1.8;
      float spiral = theta + h * 3.5;
      return vec3(r * cos(spiral), h - 0.9, r * sin(spiral));
    }

    vec3 leafShape_parent(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 1.2 + 0.5 * v;
      float h = v * 2.2;
      float spiral = theta + h * 2.0;
      return vec3(r * cos(spiral), h - 1.1, r * sin(spiral));
    }

    vec3 leafShape_self(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 1.6 + 0.8 * v;
      float h = v * 2.6;
      float spiral = theta + h * 0.9;
      float flatness = 0.3 + 0.7 * v;
      return vec3(r * cos(spiral) * flatness, h - 1.3, r * sin(spiral) * flatness);
    }

    void main(){
      int L = int(leafId);
      float t = uTime * 0.18 + uLeafMorphPhases[L];
      
      float cycle = mod(t, 6.28318);
      float stage = cycle / 2.09439;
      
      vec3 target;
      if (stage < 1.0){
        target = mix(leafShape_ancestor(uv.x, uv.y), leafShape_parent(uv.x, uv.y), smoothstep(0.0, 1.0, stage));
      } else if (stage < 2.0){
        target = mix(leafShape_parent(uv.x, uv.y), leafShape_self(uv.x, uv.y), smoothstep(0.0, 1.0, stage - 1.0));
      } else {
        target = mix(leafShape_self(uv.x, uv.y), leafShape_ancestor(uv.x, uv.y), smoothstep(0.0, 1.0, stage - 2.0));
      }
      
      float lagFactor = 0.5 + 0.5 * seed;
      float lagPhase = t - lagFactor * 0.8;
      float lagCycle = mod(lagPhase, 6.28318);
      float lagStage = lagCycle / 2.09439;
      
      vec3 laggedTarget;
      if (lagStage < 1.0){
        laggedTarget = mix(leafShape_ancestor(uv.x, uv.y), leafShape_parent(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage));
      } else if (lagStage < 2.0){
        laggedTarget = mix(leafShape_parent(uv.x, uv.y), leafShape_self(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage - 1.0));
      } else {
        laggedTarget = mix(leafShape_self(uv.x, uv.y), leafShape_ancestor(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage - 2.0));
      }
      
      vec3 p = mix(target, laggedTarget, seed * 0.6);
      
      /* ── PRIMARY VOICE (cadence): 4/4 at 90 BPM, Y-axis rotation ── */
      float bpm = 90.0;
      float beatDuration = 60.0 / bpm;
      float cadenceTime = uTime + uCadenceOffsets[L];
      float beatNumber = floor(cadenceTime / beatDuration);
      float beatPhase = mod(cadenceTime, beatDuration) / beatDuration;
      
      float targetAngle = beatNumber * 1.5708;
      float eased = smoothstep(0.0, 0.8, beatPhase);
      float cadenceRotation = mix(targetAngle - 1.5708, targetAngle, eased);
      
      vCadenceIntensity = exp(-beatPhase * 3.0);
      
      /* ── OBBLIGATO VOICE: 3:2 harmonic ratio, X-axis wobble ── */
      float obbligatoBPM = bpm * 1.5; // 135 BPM, 3:2 ratio
      float obbligatoBeatDuration = 60.0 / obbligatoBPM;
      float obbligatoTime = uTime + uObbligatoPhases[L];
      float obbligatoBeatNumber = floor(obbligatoTime / obbligatoBeatDuration);
      float obbligatoBeatPhase = mod(obbligatoTime, obbligatoBeatDuration) / obbligatoBeatDuration;
      
      /* wobble amplitude: π/6 radians (30 degrees) */
      float obbligatoAmplitude = 0.5236;
      float obbligatoTarget = sin(obbligatoBeatNumber * 3.14159) * obbligatoAmplitude;
      float obbligatoEased = smoothstep(0.0, 0.7, obbligatoBeatPhase);
      float obbligatoPrev = sin((obbligatoBeatNumber - 1.0) * 3.14159) * obbligatoAmplitude;
      float obbligatoRotation = mix(obbligatoPrev, obbligatoTarget, obbligatoEased);
      
      vObbligatoIntensity = exp(-obbligatoBeatPhase * 4.0);
      
      /* apply obbligato (X-axis) first */
      float cObb = cos(obbligatoRotation), sObb = sin(obbligatoRotation);
      vec3 pObb = vec3(p.x, p.y * cObb - p.z * sObb, p.y * sObb + p.z * cObb);
      
      /* then apply cadence (Y-axis) */
      float cc = cos(cadenceRotation), sc = sin(cadenceRotation);
      vec3 pCadence = vec3(pObb.x * cc - pObb.z * sc, pObb.y, pObb.x * sc + pObb.z * cc);
      
      /* combined breath — both voices contribute */
      float breath = 1.0 + 0.06 * vCadenceIntensity + 0.04 * vObbligatoIntensity;
      pCadence *= breath;
      
      /* slow baseline rotation */
      float rot = uLeafRotations[L] + uTime * 0.012;
      float cr = cos(rot), sr = sin(rot);
      vec3 pRot = vec3(pCadence.x * cr - pCadence.z * sr, pCadence.y, pCadence.x * sr + pCadence.z * cr);
      
      int offsetIdx = L * 3;
      pRot.x += uLeafOffsets[offsetIdx];
      pRot.y += uLeafOffsets[offsetIdx + 1];
      pRot.z += uLeafOffsets[offsetIdx + 2];
      
      vec3 sepia = vec3(0.70, 0.52, 0.38);
      vec3 rose = vec3(0.82, 0.56, 0.52);
      vec3 ink = vec3(0.18, 0.14, 0.16);
      
      vec3 col;
      if (stage < 1.0){
        col = mix(ink, sepia, smoothstep(0.0, 1.0, stage));
      } else if (stage < 2.0){
        col = mix(sepia, rose, smoothstep(0.0, 1.0, stage - 1.0));
      } else {
        col = mix(rose, ink, smoothstep(0.0, 1.0, stage - 2.0));
      }
      
      /* cadence accent: warm amber */
      vec3 cadenceAccent = vec3(0.92, 0.68, 0.48);
      col = mix(col, cadenceAccent, vCadenceIntensity * 0.3);
      
      /* obbligato accent: cool violet (harmonically distinct) */
      vec3 obbligatoAccent = vec3(0.68, 0.52, 0.78);
      col = mix(col, obbligatoAccent, vObbligatoIntensity * 0.25);
      
      float desatLag = seed * 0.3;
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, vec3(lum), desatLag);
      
      float edgeness = smoothstep(0.4, 1.0, uv.y);
      col = mix(col, rose * 1.1, edgeness * 0.15);
      
      vCol = col;
      vAlpha = 0.5 + 0.3 * (1.0 - seed * 0.5);
      
      vec4 mv = modelViewMatrix * vec4(pRot, 1.0);
      float dist = -mv.z;
      float energy = 0.5 + 0.5 * sin(uTime * 0.6 + seed * 6.28);
      float combinedIntensity = vCadenceIntensity * 0.4 + vObbligatoIntensity * 0.3;
      gl_PointSize = (1.2 + 0.4 * energy + combinedIntensity) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vCadenceIntensity;
    varying float vObbligatoIntensity;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float combinedPulse = 1.0 + vCadenceIntensity * 0.2 + vObbligatoIntensity * 0.15;
      float a = exp(-r * 14.0) * vAlpha * combinedPulse;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

scene.fog = new THREE.FogExp2(0x0a0708, 0.022);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  const orbit = elapsed * 0.08;
  const drift = Math.sin(elapsed * 0.15) * 0.8;
  camera.position.x = 14 * Math.sin(orbit);
  camera.position.z = 14 * Math.cos(orbit);
  camera.position.y = 2 + drift;
  camera.lookAt(0, 0, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
