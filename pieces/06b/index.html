<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>06b · lorenz-ink · differential growth as attractor trail</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#060610; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
          color:#6080a0; opacity:0.45; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">06b</div>
<div class="hint">drag to orbit · click to pause/resume</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
// ═══════════════════════════════════════════════════════════════════════
// Cross-pollination: zs4 (Lorenz attractor) visual signature
// Parent 2iy's differential-growth closed loop + zs4's luminous flowing
// trajectory trail rendering. The organic growth form is re-cast as a
// strange attractor — ghost orbit lines spiral around the curve, streaming
// point-particles trace the path like phase-space orbits, curvature-mapped
// palette shifts from electric cobalt through cyan to amber ember at folds.
// The form reads as calligraphic growth; the light reads as Lorenz.
// ═══════════════════════════════════════════════════════════════════════

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060610, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

/* ── hand-picked palette (5 colors) ──────────────────────────────────
   #0a1628  deep void navy      — negative space, atmosphere
   #1a5fff  electric cobalt     — primary trail, low curvature
   #00d4ff  cyan spark          — mid curvature, velocity highlight
   #ff6b2b  amber ember         — high curvature, pressure folds
   #f0e0c0  warm cream          — brightest convergence peaks
   Justification: Lorenz attractor visualizations live in additive-
   blending territory — cool base, warm at density/curvature peaks.
   The amber-at-folds echoes the parent's ink-pressure metaphor.      */
const colCobalt = new THREE.Color(0x1a5fff);
const colCyan   = new THREE.Color(0x00d4ff);
const colAmber  = new THREE.Color(0xff6b2b);
const colCream  = new THREE.Color(0xf0e0c0);

// ─── differential growth (inherited from parent 2iy / 5gm) ─────────
const MAX_VERTS = 1800;
const ATTRACT = 0.06, REPEL_R = 0.46, REPEL_STR = 0.13;
const NOISE = 0.003, PRESSURE = 0.0028, RISE = 0.0042, MAX_D = 0.36;

const verts = [];
for (let i = 0; i < 18; i++) {
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z) { return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function getNbrs(v) {
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const fx = new Float32Array(n), fy = new Float32Array(n), fz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of getNbrs(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1-d/REPEL_R) / d;
      fx[i] += ex*f; fy[i] += ey*f; fz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    fx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    fy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    fz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2 = 0, cy2 = 0, cz2 = 0;
  for (let i = 0; i < n; i++) { cx2 += verts[i].x; cy2 += verts[i].y; cz2 += verts[i].z; }
  cx2 /= n; cy2 /= n; cz2 /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x-cx2, oy = verts[i].y-cy2, oz = verts[i].z-cz2;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    fx[i] += (ox/d)*PRESSURE; fy[i] += (oy/d)*PRESSURE*0.4; fz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += fx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += fy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += fz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS) {
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                    age: Math.max(a.age, b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
// pre-grow so render gate sees content immediately
for (let s = 0; s < 700; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─── Lorenz-style trail rendering ───────────────────────────────────

const TRAIL_COUNT = 7;    // ghost orbit copies
const PARTICLE_N  = 280;  // streaming phase-space particles

// curvature → color mapping
function curvColor(curv, h, maxH) {
  const c = new THREE.Color();
  if (curv < 0.25)      c.copy(colCobalt).lerp(colCyan,  curv / 0.25);
  else if (curv < 0.6)  c.copy(colCyan).lerp(colAmber, (curv-0.25) / 0.35);
  else                   c.copy(colAmber).lerp(colCream, Math.min((curv-0.6)/0.4, 1));
  c.lerp(colCream, Math.min(h / Math.max(maxH, 1), 1) * 0.12);
  return c;
}

// core bright trail
const coreGeo = new THREE.BufferGeometry();
const coreMat = new THREE.LineBasicMaterial({
  transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending,
  depthWrite: false, vertexColors: true
});
const coreLine = new THREE.Line(coreGeo, coreMat);
scene.add(coreLine);

// ghost trails — wider orbit halos
const ghostLines = [], ghostGeos = [];
for (let t = 0; t < TRAIL_COUNT; t++) {
  const geo = new THREE.BufferGeometry();
  const mat = new THREE.LineBasicMaterial({
    transparent: true,
    opacity: 0.06 + 0.05 * (1 - t / TRAIL_COUNT),
    blending: THREE.AdditiveBlending,
    depthWrite: false, vertexColors: true
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  ghostLines.push(line);
  ghostGeos.push(geo);
}

// streaming particles
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PARTICLE_N * 3);
const pCol = new Float32Array(PARTICLE_N * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.07, transparent: true, opacity: 0.75,
  blending: THREE.AdditiveBlending, depthWrite: false,
  vertexColors: true, sizeAttenuation: true
});
const pMesh = new THREE.Points(pGeo, pMat);
scene.add(pMesh);
const pT = new Float32Array(PARTICLE_N);
const pSpd = new Float32Array(PARTICLE_N);
for (let i = 0; i < PARTICLE_N; i++) {
  pT[i] = Math.random();
  pSpd[i] = 0.0004 + Math.random() * 0.0014;
}

// sparse dust motes — depth cue
const DUST_N = 120;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustCol = new Float32Array(DUST_N * 3);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i*3]   = (Math.random()-0.5) * 20;
  dustPos[i*3+1] = Math.random() * 18;
  dustPos[i*3+2] = (Math.random()-0.5) * 20;
  const b = 0.08 + Math.random() * 0.06;
  dustCol[i*3] = b * 0.4; dustCol[i*3+1] = b * 0.5; dustCol[i*3+2] = b;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.04, transparent: true, opacity: 0.3,
  blending: THREE.AdditiveBlending, depthWrite: false,
  vertexColors: true, sizeAttenuation: true
});
scene.add(new THREE.Points(dustGeo, dustMat));

// ─── frame loop ─────────────────────────────────────────────────────

const upVec = new THREE.Vector3(0, 1, 0);
const tmpPerp = new THREE.Vector3();
const tmpBi = new THREE.Vector3();

function updateVisuals(time) {
  if (verts.length < 10) return;
  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  const N = Math.min(600, verts.length * 2);
  const curvatures = new Float32Array(N);
  const sampled = [];
  let maxH = 0;
  const dt = 1 / N;
  for (let i = 0; i < N; i++) {
    const t = i / N;
    const p = curve.getPointAt(t);
    sampled.push(p);
    if (p.y > maxH) maxH = p.y;
    const t1 = curve.getTangentAt((t - dt + 1) % 1);
    const t2 = curve.getTangentAt((t + dt) % 1);
    curvatures[i] = Math.min(1, (1 - t1.dot(t2)) * 6);
  }

  // core line
  const cPos = new Float32Array(N * 3);
  const cCol = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    cPos[i*3] = sampled[i].x; cPos[i*3+1] = sampled[i].y; cPos[i*3+2] = sampled[i].z;
    const c = curvColor(curvatures[i], sampled[i].y, maxH);
    cCol[i*3] = c.r; cCol[i*3+1] = c.g; cCol[i*3+2] = c.b;
  }
  coreGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
  coreGeo.setAttribute('color', new THREE.BufferAttribute(cCol, 3));

  // ghost orbits — offset perpendicular to tangent, slowly revolving
  for (let g = 0; g < TRAIL_COUNT; g++) {
    const phase = g / TRAIL_COUNT * Math.PI * 2;
    const amp = 0.04 + g * 0.03;
    const tOff = g * 0.005;
    const gPos = new Float32Array(N * 3);
    const gCol = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const param = ((i / N) + tOff) % 1;
      const p = curve.getPointAt(param);
      const tan = curve.getTangentAt(param).normalize();
      tmpPerp.crossVectors(tan, upVec).normalize();
      if (tmpPerp.lengthSq() < 0.001) tmpPerp.set(1, 0, 0);
      tmpBi.crossVectors(tan, tmpPerp).normalize();
      const ang = phase + time * 0.25 + i * 0.012;
      const ox = Math.cos(ang) * amp, oy = Math.sin(ang) * amp;
      gPos[i*3]   = p.x + tmpPerp.x*ox + tmpBi.x*oy;
      gPos[i*3+1] = p.y + tmpPerp.y*ox + tmpBi.y*oy;
      gPos[i*3+2] = p.z + tmpPerp.z*ox + tmpBi.z*oy;
      const ci = Math.floor(param * N) % N;
      const c = curvColor(curvatures[ci], p.y, maxH);
      c.lerp(colCobalt, 0.35 + g * 0.05);
      gCol[i*3] = c.r; gCol[i*3+1] = c.g; gCol[i*3+2] = c.b;
    }
    ghostGeos[g].setAttribute('position', new THREE.BufferAttribute(gPos, 3));
    ghostGeos[g].setAttribute('color', new THREE.BufferAttribute(gCol, 3));
  }

  // streaming particles
  for (let i = 0; i < PARTICLE_N; i++) {
    pT[i] = (pT[i] + pSpd[i]) % 1;
    const p = curve.getPointAt(pT[i]);
    const ci = Math.floor(pT[i] * N) % N;
    const curv = curvatures[ci];
    // slight jitter for sparkle
    pPos[i*3]   = p.x + (Math.random()-0.5)*0.025;
    pPos[i*3+1] = p.y + (Math.random()-0.5)*0.025;
    pPos[i*3+2] = p.z + (Math.random()-0.5)*0.025;
    const c = curvColor(curv, p.y, maxH);
    c.multiplyScalar(1.1 + curv * 0.9);
    pCol[i*3] = c.r; pCol[i*3+1] = c.g; pCol[i*3+2] = c.b;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;

  // drift dust motes gently
  for (let i = 0; i < DUST_N; i++) {
    dustPos[i*3+1] += 0.002;
    if (dustPos[i*3+1] > 20) dustPos[i*3+1] = -1;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop() {
  const t = (performance.now() - t0) * 0.001;
  for (let s = 0; s < 2; s++) step();
  updateVisuals(t);

  // camera follows centroid
  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
