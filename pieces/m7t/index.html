<div class="id">m7t</div>
<div class="hint">orbit drag</div>
<div class="src">Mutu · collage mythos · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1, 30);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1714, 1);
document.body.appendChild(renderer.domElement);

/* ── constants ── */
const N = 80000;
const NP = 16;

/* ── Mutu palette — umber, sienna, bone, charcoal, olive, wine ── */
const PAL = [
  [0.24,0.17,0.12],[0.42,0.23,0.16],[0.55,0.37,0.24],[0.82,0.78,0.70],
  [0.16,0.16,0.15],[0.29,0.29,0.18],[0.36,0.16,0.16],[0.48,0.46,0.41],
  [0.32,0.22,0.15],[0.60,0.44,0.30],[0.20,0.18,0.14],[0.70,0.64,0.54],
  [0.38,0.28,0.20],[0.26,0.22,0.18],[0.50,0.35,0.22],[0.44,0.40,0.34],
];

/* ── Voronoi patch centres (mapped onto figure anatomy) ── */
const PC = [
  [ 0.0, 6.2],[-0.35,5.2],[ 0.40,4.8],[-0.70,3.0],[ 0.70,3.0],[ 0.0,1.6],
  [-0.60,0.0],[ 0.55,0.0],[ 0.0,-1.2],[-0.90,-2.2],[ 0.80,-2.2],
  [-0.35,-4.2],[ 0.35,-4.2],[-0.30,-6.5],[ 0.30,-6.5],[ 0.0,7.6],
];

/* ── figure silhouette ── */
function lerp(a,b,t){ return a+(b-a)*Math.max(0,Math.min(1,t)); }
function hw(y){
  const t=(y+8)/16;
  if(t<=0.02) return 0;
  if(t<0.06) return lerp(0,0.40,(t-0.02)/0.04);
  if(t<0.10) return 0.48;
  if(t<0.18) return 0.52;
  if(t<0.28) return lerp(0.52,0.90,(t-0.18)/0.10);
  if(t<0.38) return lerp(0.90,1.45,(t-0.28)/0.10);
  if(t<0.44) return 1.45;
  if(t<0.52) return lerp(1.45,1.00,(t-0.44)/0.08);
  if(t<0.58) return lerp(1.00,1.20,(t-0.52)/0.06);
  if(t<0.65) return 1.20;
  if(t<0.70) return lerp(1.20,1.40,(t-0.65)/0.05);
  if(t<0.73) return 1.40;
  if(t<0.78) return lerp(1.40,0.40,(t-0.73)/0.05);
  if(t<0.81) return 0.40;
  if(t<0.85) return lerp(0.40,0.90,(t-0.81)/0.04);
  if(t<0.93) return 0.90;
  if(t<0.98) return lerp(0.90,0.25,(t-0.93)/0.05);
  return lerp(0.25,0,(t-0.98)/0.02);
}
function inside(x,y){
  const t=(y+8)/16, w=hw(y);
  if(w<0.01||Math.abs(x)>w) return false;
  if(t>0.05&&t<0.32){
    const gap=0.10+0.10*Math.max(0,(0.28-t)/0.23);
    if(Math.abs(x)<gap) return false;
  }
  return true;
}

/* ── RNG ── */
function rngFactory(seed){
  let s=seed>>>0;
  return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}

/* ── particle distribution ── */
function buildParticles(){
  const rng=rngFactory(314159);
  const scat=new Float32Array(N*3), tgt=new Float32Array(N*3), sd=new Float32Array(N);
  let idx=0;

  /* body */
  const bodyN=Math.floor(N*0.78);
  while(idx<bodyN){
    const y=-7.8+rng()*15.6, w=hw(y);
    if(w<0.05) continue;
    const x=(rng()*2-1)*w;
    if(!inside(x,y)) continue;
    tgt[idx*3]=x; tgt[idx*3+1]=y; tgt[idx*3+2]=(rng()-0.5)*0.25;
    const a=rng()*6.2832, d=7+rng()*13;
    scat[idx*3]=Math.cos(a)*d*0.9; scat[idx*3+1]=Math.sin(a)*d; scat[idx*3+2]=(rng()-0.5)*6;
    sd[idx]=rng(); idx++;
  }

  /* left vine arm — sinuous arc from shoulder */
  const lvN=Math.floor(N*0.055);
  while(idx<bodyN+lvN){
    const t=rng(), x=-1.4-t*3.2+Math.sin(t*5)*0.35, y=3.2+t*2.2-t*t*1.8;
    const sp=0.10+t*0.35;
    tgt[idx*3]=x+(rng()-0.5)*sp; tgt[idx*3+1]=y+(rng()-0.5)*sp; tgt[idx*3+2]=(rng()-0.5)*0.15;
    const a=rng()*6.2832, d=7+rng()*13;
    scat[idx*3]=Math.cos(a)*d; scat[idx*3+1]=Math.sin(a)*d; scat[idx*3+2]=(rng()-0.5)*6;
    sd[idx]=rng(); idx++;
  }

  /* right vine arm — broader arc, leafy tip */
  const rvN=Math.floor(N*0.055);
  while(idx<bodyN+lvN+rvN){
    const t=rng(), x=1.4+t*2.8+Math.sin(t*4)*0.4, y=3.2+t*2.6-t*t*2.2;
    const sp=0.10+t*0.45;
    tgt[idx*3]=x+(rng()-0.5)*sp; tgt[idx*3+1]=y+(rng()-0.5)*sp; tgt[idx*3+2]=(rng()-0.5)*0.15;
    const a=rng()*6.2832, d=7+rng()*13;
    scat[idx*3]=Math.cos(a)*d; scat[idx*3+1]=Math.sin(a)*d; scat[idx*3+2]=(rng()-0.5)*6;
    sd[idx]=rng(); idx++;
  }

  /* crown tendrils — headdress/botanical eruption */
  while(idx<N){
    const t=rng(), ang=(rng()-0.5)*1.6, r=0.3+t*3.8;
    const x=Math.sin(ang)*r*0.55, y=7.2+Math.cos(ang*0.5)*r+Math.sin(t*6)*0.25;
    const sp=0.06+t*0.28;
    tgt[idx*3]=x+(rng()-0.5)*sp; tgt[idx*3+1]=y+(rng()-0.5)*sp; tgt[idx*3+2]=(rng()-0.5)*0.15;
    const a=rng()*6.2832, d=7+rng()*13;
    scat[idx*3]=Math.cos(a)*d; scat[idx*3+1]=Math.sin(a)*d; scat[idx*3+2]=(rng()-0.5)*6;
    sd[idx]=rng(); idx++;
  }
  return {scat,tgt,sd};
}
const {scat,tgt,sd}=buildParticles();

/* ── uniforms ── */
const uPatches=PC.map(p=>new THREE.Vector2(p[0],p[1]));
const uColors=PAL.map(c=>new THREE.Vector3(c[0],c[1],c[2]));
const uniforms={
  uTime:{value:0}, uGather:{value:0}, uPixel:{value:renderer.getPixelRatio()},
  uPatches:{value:uPatches}, uColors:{value:uColors},
};

/* ── shader material ── */
const mat=new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false,
  vertexShader:`
    uniform float uTime, uGather, uPixel;
    uniform vec2  uPatches[${NP}];
    uniform vec3  uColors[${NP}];
    attribute vec3  aTarget;
    attribute float aSeed;
    varying vec3  vColor;
    varying float vEdge, vAlpha;

    void main(){
      /* staggered gather — each fragment arrives at its own pace */
      float stag = aSeed * 2.2;
      float g = clamp((uGather * 3.5 - stag) * 1.4, 0.0, 1.0);
      g = g * g * (3.0 - 2.0 * g);                       /* smoothstep ease */

      vec3 p = mix(position, aTarget, g);

      /* subtle breath after assembly — collage lives */
      float br = uGather * uGather;
      p.x += sin(uTime*0.35 + aTarget.y*0.3 + aSeed*6.28) * 0.04 * br;
      p.y += sin(uTime*0.22 + aSeed*3.14)                 * 0.025* br;

      /* ── Voronoi patch lookup ── */
      vec2 pos2d = aTarget.xy;
      float minD = 1e6, secD = 1e6, pIdx = 0.0;
      vec3 col = uColors[0];
      for(int i=0;i<${NP};i++){
        /* breathing patch centres — boundaries shimmer gently */
        vec2 pc = uPatches[i] + 0.06 * vec2(
          sin(uTime*0.28 + float(i)*1.73),
          cos(uTime*0.21 + float(i)*2.31)
        ) * br;
        float d = distance(pos2d, pc);
        if(d < minD){ secD=minD; minD=d; col=uColors[i]; pIdx=float(i); }
        else if(d < secD){ secD=d; }
      }

      /* collage layering: z offset per patch */
      p.z += pIdx * 0.018 * g;

      vColor = col;
      vEdge  = secD - minD;
      vAlpha = smoothstep(0.0, 0.35, vEdge) * 0.25 + 0.70;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float szMod = 1.0 + 0.25 * sin(pIdx * 2.37);       /* material diversity */
      gl_PointSize = uPixel * max(1.5, (3.2 - dist*0.05) * szMod);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying vec3  vColor;
    varying float vEdge, vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;

      /* seam darkening at collage boundaries */
      float seam = smoothstep(0.0, 0.28, vEdge);
      vec3 col = vColor * (0.50 + 0.50 * seam);

      float alpha = (1.0 - smoothstep(0.15, 0.25, r)) * vAlpha;
      gl_FragColor = vec4(col, alpha);
    }
  `
});

/* ── geometry ── */
const geom=new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(scat, 3));
geom.setAttribute('aTarget',  new THREE.BufferAttribute(tgt,  3));
geom.setAttribute('aSeed',    new THREE.BufferAttribute(sd,   1));
const pts=new THREE.Points(geom, mat);
pts.renderOrder=1;
scene.add(pts);

/* ── ink-wash background with warm halo ── */
const bgMat=new THREE.ShaderMaterial({
  depthWrite:false,
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float vig = 1.0 - dot(c,c)*1.4;
      vec3 cen = vec3(0.13,0.11,0.09);
      vec3 edg = vec3(0.05,0.04,0.04);
      /* warm halo behind figure */
      vec2 fc = vUv - vec2(0.5, 0.52);
      float glow = exp(-dot(fc,fc)*3.5);
      vec3 col = mix(edg, cen, vig) + vec3(0.04,0.03,0.02)*glow;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(200,200), bgMat);
bg.position.z=-6; bg.renderOrder=-1;
scene.add(bg);

/* ── orbit drag (minimal) ── */
let dragging=false, px=0, py=0, oTheta=0, oPhi=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;e.preventDefault();});
addEventListener('pointermove',e=>{
  if(!dragging) return;
  oTheta-=(e.clientX-px)*0.004; oPhi=Math.max(-0.4,Math.min(0.4,oPhi-(e.clientY-py)*0.004));
  px=e.clientX; py=e.clientY;
});
addEventListener('pointerup',()=>{dragging=false;});

/* ── resize ── */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  uniforms.uPixel.value=renderer.getPixelRatio();
});

/* ── animation ── */
const t0=performance.now();
function loop(){
  const t=(performance.now()-t0)/1000;
  uniforms.uTime.value=t;
  uniforms.uGather.value=Math.min(1.0, t/9.0);

  /* camera: still, slightly below, slow subtle lift during gather */
  const camY=0.4+uniforms.uGather.value*0.8;
  const radius=30;
  camera.position.set(
    radius*Math.sin(oTheta)*Math.cos(oPhi),
    camY + radius*Math.sin(oPhi),
    radius*Math.cos(oTheta)*Math.cos(oPhi)
  );
  camera.lookAt(0, camY, 0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
