<style>

  body {

      linear-gradient(to bottom,

  }

</style>
</head>
<body>
<div class="id">ugw</div>
<div class="hint">no input — watch the flock breathe. one bird strays. the others wait.</div>
<div class="src">descended from sav · posterized risograph · muted sky</div>
<div class="arc" id="arc">together · 100%</div>
<div id="grain"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// sav mutation: quantize color output to 8 discrete steps for a posterized
// risograph feel. Also: mute the dawn-sky gradient, add starfield specks
// and paper-grain overlay so the sky feels inhabited, not blank.
//
// Risograph reference: the Riso Kagaku grain + spot-color layering aesthetic
// (Stencil printing, ~1986). Each color channel posterized to 8 levels gives
// that flat-ink, stepped-tone quality. Paper grain overlay breaks CG sterility.

// ── paper grain texture (generated, no external resource)
(function grainSetup(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4){
    const v = Math.random() * 28;
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v;
    img.data[i+3] = 18;
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x121218, 0.016);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── starfield specks: the sky is inhabited
const STARS = 180;
const starPos = new Float32Array(STARS * 3);
const starAlpha = new Float32Array(STARS);
for (let i = 0; i < STARS; i++){
  const r = 30 + Math.random() * 50;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  starPos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  starPos[i*3+1]   = Math.sin(ph) * r * 0.6 + 5; // bias upward
  starPos[i*3+2]   = Math.sin(th) * Math.cos(ph) * r;
  starAlpha[i]     = 0.15 + Math.random() * 0.35;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeo.setAttribute('aAlpha', new THREE.BufferAttribute(starAlpha, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float aAlpha;
    varying float vA;
    uniform float uTime;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 1.2 + 0.6 * sin(uTime * 0.3 + aAlpha * 40.0);
      gl_Position = projectionMatrix * mv;
      vA = aAlpha * (0.7 + 0.3 * sin(uTime * 0.5 + aAlpha * 20.0));
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      gl_FragColor = vec4(0.7, 0.75, 0.85, vA * 0.5);
    }
  `
});
scene.add(new THREE.Points(starGeo, starMat));

// ── low ground horizon: thin dark plane
const groundGeo = new THREE.PlaneGeometry(200, 200);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x0e0c0a, transparent: true, opacity: 0.25, fog: false
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -12;
scene.add(ground);

// ────────────── boids with embedded narrative
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3+1]   = Math.sin(ph) * r;
  pos[i*3+2]   = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3+1]   = (Math.random() - 0.5) * 0.3;
  vel[i*3+2]   = (Math.random() - 0.5) * 0.4;
}
pos[STRAGGLER*3] = -1.2;
pos[STRAGGLER*3+1] = 0.6;
pos[STRAGGLER*3+2] = 0.0;

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.9;
const W_COH = 0.018;
const W_ALI = 0.060;
const W_SEP = 0.080;
const MAX_SPEED = 1.4;
const MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function step(dt){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= (N-1); cy /= (N-1); cz /= (N-1);

  const sx = pos[STRAGGLER*3] - cx;
  const sy = pos[STRAGGLER*3+1] - cy;
  const sz = pos[STRAGGLER*3+2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 8.0));
  cohesion += (targetCohesion - cohesion) * dt * 0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX=0,cohY=0,cohZ=0,cohN=0;
    let aliX=0,aliY=0,aliZ=0,aliN=0;
    let sepX=0,sepY=0,sepZ=0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const isS = (i === STRAGGLER);
    const perR = isS ? PERCEPTION_R * 0.55 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3]-px, dy = pos[j*3+1]-py, dz = pos[j*3+2]-pz;
      const d2 = dx*dx+dy*dy+dz*dz;
      if (d2 > perR*perR || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R*SEPARATION_R){
        const inv = 1.0/Math.sqrt(d2);
        sepX -= dx*inv; sepY -= dy*inv; sepZ -= dz*inv;
      }
    }

    if (isS){
      const drift = Math.sin(performance.now()*0.0003)*0.4;
      acc[i*3] += drift;
      acc[i*3+1] += -0.25 + Math.cos(performance.now()*0.0002)*0.2;
      acc[i*3+2] += drift*0.6;
    }

    if (!isS && (arcStage === 'seeking' || arcStage === 'return')){
      const tx = pos[STRAGGLER*3]-px, ty = pos[STRAGGLER*3+1]-py, tz = pos[STRAGGLER*3+2]-pz;
      const td = Math.sqrt(tx*tx+ty*ty+tz*tz)+1e-3;
      const seek = arcStage === 'seeking' ? 0.020 : 0.012;
      acc[i*3] += (tx/td)*seek;
      acc[i*3+1] += (ty/td)*seek;
      acc[i*3+2] += (tz/td)*seek;
    }

    if (cohN > 0){
      acc[i*3] += (cohX/cohN-px)*W_COH;
      acc[i*3+1] += (cohY/cohN-py)*W_COH;
      acc[i*3+2] += (cohZ/cohN-pz)*W_COH;
    }
    if (aliN > 0){
      acc[i*3] += (aliX/aliN-vel[i*3])*W_ALI;
      acc[i*3+1] += (aliY/aliN-vel[i*3+1])*W_ALI;
      acc[i*3+2] += (aliZ/aliN-vel[i*3+2])*W_ALI;
    }
    acc[i*3] += sepX*W_SEP;
    acc[i*3+1] += sepY*W_SEP;
    acc[i*3+2] += sepZ*W_SEP;

    const d2c = px*px+py*py+pz*pz;
    if (d2c > 90){
      const inv = 0.012/Math.sqrt(d2c);
      acc[i*3] += -px*inv;
      acc[i*3+1] += -py*inv;
      acc[i*3+2] += -pz*inv;
    }
  }

  const speedMul = (arcStage==='loss'||arcStage==='seeking') ? 0.55
                 : arcStage==='return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++){
    let ax=acc[i*3], ay=acc[i*3+1], az=acc[i*3+2];
    const af = Math.sqrt(ax*ax+ay*ay+az*az);
    if (af > MAX_FORCE){ ax*=MAX_FORCE/af; ay*=MAX_FORCE/af; az*=MAX_FORCE/af; }
    vel[i*3]+=ax; vel[i*3+1]+=ay; vel[i*3+2]+=az;
    let vx=vel[i*3], vy=vel[i*3+1], vz=vel[i*3+2];
    const sp = Math.sqrt(vx*vx+vy*vy+vz*vz);
    if (sp > MAX_SPEED){ vx*=MAX_SPEED/sp; vy*=MAX_SPEED/sp; vz*=MAX_SPEED/sp;
      vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3] += vx*dt*speedMul;
    pos[i*3+1] += vy*dt*speedMul;
    pos[i*3+2] += vz*dt*speedMul;
  }
}

// ────────────── render: posterized risograph shader
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStrag = new Float32Array(N);
isStrag[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStrag, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    varying vec3  vCol;
    varying float vFade;
    varying float vSeed;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.8 + 0.9 * sin(t);
      float stragSize = strag * 2.6;
      gl_PointSize = (baseSize + stragSize) * uPixel * (16.0 / dist);
      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);
      vSeed = seed;

      // risograph palette: 5 hand-picked spot colors
      // warm plate: burnt sienna (#c45e28), raw umber (#8a6642)
      // cool plate: slate blue (#4a5a7a), dusty violet (#6a4868)
      // accent: pale ochre (#d4a86a)
      vec3 warm1 = vec3(0.77, 0.37, 0.16);  // burnt sienna
      vec3 warm2 = vec3(0.54, 0.40, 0.26);  // raw umber
      vec3 cool1 = vec3(0.29, 0.35, 0.48);  // slate blue
      vec3 cool2 = vec3(0.42, 0.28, 0.41);  // dusty violet
      vec3 accent = vec3(0.83, 0.66, 0.42); // pale ochre

      // cohesion drives plate selection: together=warm, lost=cool
      vec3 base = mix(cool1, warm1, smoothstep(0.0, 1.0, uCohesion));
      vec3 high = mix(cool2, accent, smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(base, high, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.2);
      // straggler: brighter ochre identity
      vCol = mix(vCol, accent, strag * 0.5);
      vCol *= (1.0 + strag * 0.3);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    varying float vSeed;
    uniform float uTime;

    // simple hash for dither noise
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float a = exp(-r * 12.0) * vFade;

      // ── posterize: 8 discrete steps per channel (risograph ink layers)
      // add dither noise before quantization to break banding
      vec2 noiseCoord = gl_FragCoord.xy * 0.5 + vSeed * 100.0;
      float dither = (hash(noiseCoord + uTime * 0.1) - 0.5) * 0.07;

      vec3 col = vCol + dither;
      col = floor(col * 7.0 + 0.5) / 7.0; // 8 levels: 0/7 .. 7/7

      // quantize alpha too for harder ink-on-paper edges
      a = floor(a * 7.0 + 0.5) / 7.0;

      col = max(col, 0.0);
      gl_FragColor = vec4(col * a * 0.95, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm for meaningful thumbnail
for (let s = 0; s < 250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = now / 1000;
  uniforms.uCohesion.value = cohesion;
  starMat.uniforms.uTime.value = now / 1000;
  step(dt);
  geom.attributes.position.needsUpdate = true;

  // slow auto-orbit
  const ang = now * 0.00010;
  camera.position.x = Math.sin(ang) * 26;
  camera.position.z = Math.cos(ang) * 26;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
