<title>kbw · Shiota — Two Home Countries</title>

<style>

<div class="id">kbw</div>
<script type="importmap">

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.0015);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060101, 0.004));
const warmL = new THREE.PointLight(0xff4820, 0.02, 60, 2.0);
warmL.position.set(1, 11, -2);
scene.add(warmL);

let seed = 7193826;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:32, h:26, d:28 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── TWO SPHERES — Two Home Countries: separation and belonging
// One warm (origin), one cool (adopted), tethered by the web
const sphereA = new THREE.Vector3(-2.8, 1.2, 0.0); // left — origin
const sphereB = new THREE.Vector3( 3.2, 0.0, 0.5); // right — adopted home
const sphereRa = 1.45;
const sphereRb = 1.7;
const midpoint = sphereA.clone().add(sphereB).multiplyScalar(0.5);

const matA = new THREE.MeshStandardMaterial({
  color: 0xf2e5d0, emissive: 0xf2e5d0, emissiveIntensity: 0.7,
  roughness: 0.94, metalness: 0.0, transparent: true, opacity: 0.3, fog: true
});
const matB = new THREE.MeshStandardMaterial({
  color: 0xe8e0d4, emissive: 0xe8e0d4, emissiveIntensity: 0.6,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.28, fog: true
});
const sGeo24 = new THREE.SphereGeometry(sphereRa, 24, 16);
const sGeo28 = new THREE.SphereGeometry(sphereRb, 24, 16);
const meshA = new THREE.Mesh(sGeo24, matA);
meshA.position.copy(sphereA);
scene.add(meshA);
const meshB = new THREE.Mesh(sGeo28, matB);
meshB.position.copy(sphereB);
scene.add(meshB);

function surfPtA(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=sphereRa*(0.97+rng()*0.06);
  return new THREE.Vector3(sphereA.x+Math.sin(v)*Math.cos(u)*r, sphereA.y+Math.sin(v)*Math.sin(u)*r, sphereA.z+Math.cos(v)*r);
}
function surfPtB(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=sphereRb*(0.97+rng()*0.06);
  return new THREE.Vector3(sphereB.x+Math.sin(v)*Math.cos(u)*r, sphereB.y+Math.sin(v)*Math.sin(u)*r, sphereB.z+Math.cos(v)*r);
}

// ── DARK FRAGMENTS — letters, diary pages, charred scraps of memory
const fragments = [];
for(let i=0; i<22; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3+Math.floor(rng()*5);
  const fSize = 0.03+rng()*0.14;
  for(let j=0; j<nPts; j++){
    verts.push((rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.25,
               (rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.25);
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0806, transparent:true, opacity:0.4
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=3.5+rng()*7.5;
  const center = rng()<0.5 ? sphereA : sphereB;
  fMesh.position.set(
    center.x+Math.sin(v)*Math.cos(u)*r,
    center.y+Math.sin(v)*Math.sin(u)*r*0.85,
    center.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — negative space the camera breathes through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.8;
  const vr=5+rng()*3;
  voids.push({x:midpoint.x+Math.cos(a)*vr, z:midpoint.z+Math.sin(a)*vr, r:1.4+rng()*1.2});
}
function inVoid(p){
  for(const v of voids){ const dx=p.x-v.x, dz=p.z-v.z; if(dx*dx+dz*dz<v.r*v.r) return true; }
  return false;
}

// ── ANCHORS — concentric shells around both spheres + walls
const anchors = [];
const shells = [3.0, 5.0, 7.5, 10.0, 13.0];
for(const center of [sphereA, sphereB]){
  for(const sr of shells){
    const count = Math.floor(10+sr*0.9);
    for(let i=0; i<count; i++){
      const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
      const r=sr*(0.8+rng()*0.4);
      const pt=new THREE.Vector3(center.x+Math.sin(v)*Math.cos(u)*r, center.y+Math.sin(v)*Math.sin(u)*r*0.88, center.z+Math.cos(v)*r);
      if(!inVoid(pt)) anchors.push(pt);
    }
  }
}
for(let i=0; i<50; i++){ const wp=wallPt(); if(!inVoid(wp)) anchors.push(wp); }
for(const f of fragments) anchors.push(f.position.clone());

// ── SUSPENSION THREADS — ceiling to both spheres
const suspPts = [];
for(const [center, rad] of [[sphereA,sphereRa],[sphereB,sphereRb]]){
  for(let i=0; i<6; i++){
    const a=(i/6)*Math.PI*2+(rng()-0.5)*0.2;
    const topR=0.08+rng()*0.3;
    suspPts.push(
      center.x+Math.cos(a)*topR, hh, center.z+Math.sin(a)*topR,
      center.x+Math.cos(a+rng()*0.04)*0.05, center.y+rad+0.04, center.z+Math.sin(a+rng()*0.04)*0.05
    );
  }
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts),3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color:0x0d0404, transparent:true, opacity:0.22
})));

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-midpoint.x)**2+(my-midpoint.y)**2+(mz-midpoint.z)**2);
  lineCat[li] = cat;
  li++;
}

// Angular quantization near spheres — Vera Molnar: order-to-chaos gradient
function quantAngle(pt, origin){
  const d = pt.distanceTo(origin);
  if(d > 6.0) return pt;
  const strength = Math.max(0, 1.0-d/6.0);
  const quant = Math.PI/12; // 15° increments
  const dx=pt.x-origin.x, dy=pt.y-origin.y, dz=pt.z-origin.z;
  const theta = Math.atan2(dy, dx);
  const phi = Math.atan2(dz, Math.sqrt(dx*dx+dy*dy));
  const qTheta = Math.round(theta/quant)*quant;
  const qPhi = Math.round(phi/quant)*quant;
  const thetaF = theta*(1-strength*0.6)+qTheta*strength*0.6;
  const phiF = phi*(1-strength*0.6)+qPhi*strength*0.6;
  const r2d = Math.sqrt(dx*dx+dy*dy+dz*dz);
  return new THREE.Vector3(
    origin.x+Math.cos(thetaF)*Math.cos(phiF)*r2d,
    origin.y+Math.sin(thetaF)*Math.cos(phiF)*r2d,
    origin.z+Math.sin(phiF)*r2d
  );
}

// RULE 1: BRIDGE — 3,200 threads connecting the two spheres
// The narrative core: these are the taut lines of belonging stretched between two homes
for(let i=0; i<3200 && li<NUM_LINES; i++){
  const sa = surfPtA();
  const sb = surfPtB();
  // Some threads bridge directly, others via a midpoint anchor
  if(rng()<0.6){
    setLine(sa, sb, 0);
  } else {
    const mid = sa.clone().lerp(sb, 0.3+rng()*0.4);
    mid.y += (rng()-0.5)*1.5;
    mid.x += (rng()-0.5)*0.8;
    setLine(sa, mid, 0);
    setLine(mid, sb, 0);
  }
}

// RULE 2: CONVERGENCE — threads from volume toward each sphere
for(let i=0; i<4500 && li<NUM_LINES; i++){
  const target = rng()<0.5 ? surfPtA() : surfPtB();
  const targetCenter = rng()<0.5 ? sphereA : sphereB;
  let origin;
  if(rng()<0.3){ origin = anchors[Math.floor(rng()*anchors.length)]; }
  else { origin = wallPt(); }
  origin = quantAngle(origin, targetCenter);
  // 10% yearning threads — stop short
  if(rng()<0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3+rng()*1.2;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)), 1);
  } else {
    setLine(origin, target, 1);
  }
}

// RULE 3: RADIAL CORONA — emanation from each sphere
for(let i=0; i<1600 && li<NUM_LINES; i++){
  const useA = rng()<0.5;
  const surfPt = useA ? surfPtA() : surfPtB();
  const center = useA ? sphereA : sphereB;
  const radial = surfPt.clone().sub(center).normalize();
  const len = 0.8+rng()*4.5;
  const dev = new THREE.Vector3((rng()-0.5)*0.1,(rng()-0.5)*0.1,(rng()-0.5)*0.1);
  const dir = radial.clone().add(dev).normalize();
  setLine(surfPt, surfPt.clone().add(dir.multiplyScalar(len)), 2);
}

// RULE 4: LATERAL WEB — anchor-to-nearest-anchor proximity rule
const THRESH = 6.5;
let catBcount=0, attempts=0;
while(catBcount<2800 && li<NUM_LINES && attempts<40000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<12; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 3);
  catBcount++;
}

// RULE 5: DENDRITIC CHAINS — branching from sphere surfaces
for(let i=0; i<120 && li<NUM_LINES; i++){
  const useA = rng()<0.5;
  let pt = useA ? surfPtA() : surfPtB();
  const center = useA ? sphereA : sphereB;
  const radial = pt.clone().sub(center).normalize();
  const chainLen = 3+Math.floor(rng()*4);
  let prevDir = radial.clone();
  for(let c=0; c<chainLen && li<NUM_LINES; c++){
    const len = 0.3+rng()*0.65;
    const dev = new THREE.Vector3((rng()-0.5)*0.4,(rng()-0.5)*0.4,(rng()-0.5)*0.4);
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next, 2);
    if(c===1 && rng()<0.45 && li<NUM_LINES){
      const fDev = new THREE.Vector3((rng()-0.5)*0.65,(rng()-0.5)*0.65,(rng()-0.5)*0.65);
      const fDir = prevDir.clone().add(fDev).normalize();
      setLine(pt, pt.clone().add(fDir.multiplyScalar(0.2+rng()*0.5)), 2);
    }
    pt=next; prevDir=dir;
  }
}

// RULE 6: GRAVITY THREADS — hanging from lower hemispheres
for(let i=0; i<500 && li<NUM_LINES; i++){
  const useA = rng()<0.5;
  const center = useA ? sphereA : sphereB;
  const rad = useA ? sphereRa : sphereRb;
  const u=rng()*Math.PI*2;
  const v=Math.PI*0.5+rng()*Math.PI*0.5;
  const surfPt = new THREE.Vector3(
    center.x+Math.sin(v)*Math.cos(u)*rad,
    center.y+Math.cos(v)*rad,
    center.z+Math.sin(v)*Math.sin(u)*rad
  );
  const dropLen = 1.2+rng()*4.0;
  const drift = (rng()-0.5)*0.4;
  setLine(surfPt, new THREE.Vector3(surfPt.x+drift, surfPt.y-dropLen, surfPt.z+(rng()-0.5)*0.3), 3);
}

// RULE 7: ASCENDING — floor threads rising toward the web
for(let i=0; i<500 && li<NUM_LINES; i++){
  const a=rng()*Math.PI*2;
  const floorR = 1.0+rng()*10.0;
  const floorPt = new THREE.Vector3(midpoint.x+Math.cos(a)*floorR, -hh+rng()*0.2, midpoint.z+Math.sin(a)*floorR);
  let target;
  if(rng()<0.25){ target = rng()<0.5 ? surfPtA() : surfPtB(); }
  else {
    const midA=rng()*Math.PI*2, midR=2.5+rng()*5.0;
    target = new THREE.Vector3(midpoint.x+Math.cos(midA)*midR, midpoint.y+(rng()-0.5)*6.0, midpoint.z+Math.sin(midA)*midR);
  }
  setLine(floorPt, target, 3);
}

// Fill remainder — wall-to-sphere/anchor spans
while(li<NUM_LINES){
  const a = wallPt();
  const b = rng()<0.35 ? (rng()<0.5?surfPtA():surfPtB()) : (rng()<0.5?anchors[Math.floor(rng()*anchors.length)]:wallPt());
  setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — blood-red #c20018
// Cat 0 bridge: strongest (the story), cat 1 convergence: bright,
// cat 2 corona/dendritic: medium, cat 3 lateral/gravity/fill: subtle
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catOpacity = [0.095, 0.08, 0.06, 0.038];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.12, 1.0-d*0.04);
  const cat = lineCat[i];
  const baseOp = catOpacity[cat]*distFade;
  // Warm shift near the bridge zone between spheres
  const toBridge = Math.abs(positions[i*6]-midpoint.x)+Math.abs(positions[i*6+2]-midpoint.z);
  const warmShift = toBridge<4.0 ? 0.018*(1.0-toBridge/4.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*baseOp;
    colors[i*6+v*3+1] = bG*baseOp;
    colors[i*6+v*3+2] = bB*baseOp*0.6;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — drift between the two spheres, the viewer migrating
// Narrative: begin near sphere A (origin), drift through bridge zone,
// arrive at sphere B (new home), descend, rise, return — a cycle of longing
const pathLen = 3200;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const p = t*Math.PI*2;
  const ax=sphereA.x, ay=sphereA.y, bx=sphereB.x, by=sphereB.y;
  const mx=midpoint.x, my=midpoint.y, mz=midpoint.z;

  let x, y, z, rH;
  if(t<0.15){
    // Near sphere A — intimate, below, looking up through thread rain
    const lt=t/0.15;
    rH = 3.5+lt*1.5;
    x = ax+Math.sin(lt*Math.PI*0.4)*rH;
    y = ay-4.0+lt*5.0;
    z = mz+Math.cos(lt*Math.PI*0.4)*rH*0.9;
  } else if(t<0.32){
    // Traverse the bridge — the journey between homes
    const lt=(t-0.15)/0.17;
    x = ax*(1-lt)+bx*lt + Math.sin(lt*Math.PI)*3.5;
    y = my+2.0+Math.sin(lt*Math.PI)*2.5;
    z = mz+Math.cos(lt*Math.PI*0.7)*5.5;
  } else if(t<0.48){
    // Arrive at sphere B — circle it slowly, higher vantage
    const lt=(t-0.32)/0.16;
    rH = 4.0+lt*2.0;
    x = bx+Math.sin(lt*Math.PI*1.2+1.0)*rH;
    y = by+1.5+lt*3.0;
    z = mz+Math.cos(lt*Math.PI*1.2+1.0)*rH*1.1;
  } else if(t<0.58){
    // Ascend above both — seeing the full web stretched between them
    const lt=(t-0.48)/0.10;
    x = mx+Math.sin(lt*Math.PI+2.0)*6.0;
    y = my+6.0+lt*3.0;
    z = mz+Math.cos(lt*Math.PI+2.0)*5.5;
  } else if(t<0.70){
    // Descend through the center — the bridge zone, surrounded
    const lt=(t-0.58)/0.12;
    x = mx+Math.sin(lt*Math.PI*0.8+3.0)*3.0;
    y = my+9.0-lt*11.0;
    z = mz+Math.cos(lt*Math.PI*0.8+3.0)*3.5;
  } else if(t<0.82){
    // Below — floor level, gravity threads above
    const lt=(t-0.70)/0.12;
    rH = 5.0+lt*3.5;
    x = mx+Math.sin(lt*Math.PI*1.1+4.5)*rH;
    y = my-5.0+lt*2.5;
    z = mz+Math.cos(lt*Math.PI*1.1+4.5)*rH;
  } else if(t<0.92){
    // Return toward sphere A — the pull back to origin
    const lt=(t-0.82)/0.10;
    x = bx*(1-lt)+ax*lt+Math.sin(lt*Math.PI+5.0)*4.0;
    y = my-2.5+lt*2.0+Math.sin(lt*Math.PI)*1.5;
    z = mz+Math.cos(lt*Math.PI*0.6+5.0)*5.0;
  } else {
    // Settle near sphere A — home again, but changed
    const lt=(t-0.92)/0.08;
    rH = 4.5-lt*1.0;
    x = ax+Math.sin(lt*Math.PI*0.3+0.5)*rH;
    y = ay-1.0-lt*3.0;
    z = mz+Math.cos(lt*Math.PI*0.3+0.5)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const dist = lineDist[i];
    const amp = 0.00003*Math.max(0, 1.0-dist/20.0);
    const phase = basePositions[idx]*0.03+basePositions[idx+1]*0.04+i*0.00012;
    const breath = Math.sin(elapsed*0.0018+phase)*amp;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.1;
      arr[vi+1] = basePositions[vi+1] + breath*0.07;
      arr[vi+2] = basePositions[vi+2] + breath*0.09;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere luminance — alternating pulse, like two hearts beating off-phase
  matA.emissiveIntensity = 0.7+Math.sin(elapsed*0.0005)*0.06;
  matB.emissiveIntensity = 0.6+Math.sin(elapsed*0.0005+Math.PI*0.7)*0.05;

  // Camera dolly
  const speed = 0.000055;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward midpoint between spheres with gentle sway
  const look = midpoint.clone();
  look.x += Math.sin(elapsed*0.0003)*0.08;
  look.y += Math.cos(elapsed*0.00025)*0.15-0.1;
  look.z += Math.sin(elapsed*0.00045+0.3)*0.06;
  camera.lookAt(look);

  warmL.position.x = 1+Math.sin(elapsed*0.00012)*0.05;
  warmL.intensity = 0.02+Math.sin(elapsed*0.00018)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
