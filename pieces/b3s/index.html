<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b3s · withdrawn monument · object-oriented ontology</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.48; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">b3s</div>
<div class="hint">drag to orbit · form withdraws from view</div>
<div class="src">descended from 2iy · Graham Harman OOO</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// OBJECT-ORIENTED ONTOLOGY — form exists but WITHDRAWS from full capture.
// We build a ~4m tall human-scale monument (differential growth backbone, now
// rendered as dense particle constellation). Camera orbits at mid-distance but
// can never see the whole: variable FOG DENSITY shifts per frame, 3-4 "shy zones"
// where particles fade when camera approaches that quadrant, depth-based occlusion
// where portions exceed the far plane, and a slow autonomous rotation of the form
// itself so no single vantage persists. The viewer recognizes "a monument / a standing
// form" but never resolves WHAT monument, WHICH figure. Partial apprehension only.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.2, 28);
camera.position.set(9, 6, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 4.2, 0);
controls.minDistance = 6;
controls.maxDistance = 16;

// ─────────── differential growth (3D, monument aspect ratio)
const MAX_VERTS = 2400;
const ATTRACT   = 0.055;
const REPEL_R   = 0.38;
const REPEL_STR = 0.12;
const NOISE     = 0.002;
const PRESSURE  = 0.0022;
const RISE      = 0.0055;
const MAX_D     = 0.32;

const verts = [];
for (let i = 0; i < 20; i++){
  const th = i / 20 * Math.PI * 2;
  const r = 1.2 + (Math.random() - 0.5) * 0.12;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.3;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.4 + 1.1 * Math.min(a * 1.8, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.4 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.04, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 900; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── particle constellation with OOO withdrawal
// Each backbone vertex spawns 8 particles in a tight cluster. We render with
// PointsMaterial + custom shader that encodes:
// 1. distance-from-camera fade (occlude near, fade far)
// 2. shy-zone fade (4 directional quadrants, fade when cam enters that zone)
// 3. variable fog density per frame
// 4. autonomous rotation of the form itself over time

const PARTICLES_PER_VERT = 8;
const particlePositions = new Float32Array(verts.length * PARTICLES_PER_VERT * 3);
const particleData = [];

for (let i = 0; i < verts.length; i++){
  const v = verts[i];
  for (let p = 0; p < PARTICLES_PER_VERT; p++){
    const idx = i * PARTICLES_PER_VERT + p;
    const offset = (Math.random() - 0.5) * 0.08;
    const ox = v.x + (Math.random() - 0.5) * offset;
    const oy = v.y + (Math.random() - 0.5) * offset;
    const oz = v.z + (Math.random() - 0.5) * offset;
    particlePositions[idx * 3]     = ox;
    particlePositions[idx * 3 + 1] = oy;
    particlePositions[idx * 3 + 2] = oz;
    particleData.push({ x: ox, y: oy, z: oz });
  }
}

const particleGeom = new THREE.BufferGeometry();
particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

const vertShader = `
uniform float time;
uniform float rotationY;
varying vec3 vWorldPos;
varying float vDistFromCam;
void main(){
  vec3 p = position;
  // autonomous rotation
  float c = cos(rotationY);
  float s = sin(rotationY);
  float nx = p.x * c - p.z * s;
  float nz = p.x * s + p.z * c;
  p.x = nx; p.z = nz;
  vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
  vWorldPos = (modelMatrix * vec4(p, 1.0)).xyz;
  vDistFromCam = -mvPos.z;
  gl_PointSize = 2.4 / vDistFromCam;
  gl_Position = projectionMatrix * mvPos;
}
`;

const fragShader = `
uniform vec3 cameraPos;
uniform float fogDensity;
uniform vec4 shyZones[4];  // vec4(dirX, dirY, dirZ, fadeRadius)
varying vec3 vWorldPos;
varying float vDistFromCam;
void main(){
  // distance-from-camera fade: occlude very near (<1.5), fade far (>18)
  float nearFade = smoothstep(0.8, 2.5, vDistFromCam);
  float farFade = 1.0 - smoothstep(16.0, 24.0, vDistFromCam);
  float distAlpha = nearFade * farFade;
  
  // shy zones — fade when camera approaches a directional quadrant
  float shyAlpha = 1.0;
  for (int i = 0; i < 4; i++){
    vec3 zoneDir = normalize(shyZones[i].xyz);
    vec3 camDir = normalize(cameraPos);
    float alignment = dot(camDir, zoneDir);
    if (alignment > 0.3){
      float shyDist = length(vWorldPos - cameraPos);
      shyAlpha *= smoothstep(4.0, 10.0, shyDist);
    }
  }
  
  // variable fog
  float fogFactor = exp(-fogDensity * vDistFromCam);
  
  float alpha = distAlpha * shyAlpha * fogFactor * 0.72;
  if (alpha < 0.01) discard;
  gl_FragColor = vec4(0.82, 0.84, 0.88, alpha);
}
`;

const particleMat = new THREE.ShaderMaterial({
  vertexShader: vertShader,
  fragmentShader: fragShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: {
    time: { value: 0 },
    rotationY: { value: 0 },
    cameraPos: { value: camera.position.clone() },
    fogDensity: { value: 0.08 },
    shyZones: {
      value: [
        new THREE.Vector4(1, 0, 0, 6),     // +X shy
        new THREE.Vector4(-1, 0, 0, 6),    // -X shy
        new THREE.Vector4(0, 0, 1, 6),     // +Z shy
        new THREE.Vector4(0, 0, -1, 6),    // -Z shy
      ]
    }
  }
});

const particleMesh = new THREE.Points(particleGeom, particleMat);
scene.add(particleMesh);

// ambient dim light
const ambientLight = new THREE.AmbientLight(0x404560, 0.6);
scene.add(ambientLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(t){
  const elapsed = (t - start) * 0.001;
  
  // continue growth briefly
  if (verts.length < MAX_VERTS){
    for (let s = 0; s < 2; s++) step();
    // update particle positions if growth ongoing
    for (let i = 0; i < verts.length; i++){
      const v = verts[i];
      for (let p = 0; p < PARTICLES_PER_VERT; p++){
        const idx = i * PARTICLES_PER_VERT + p;
        if (idx < particleData.length){
          const offset = (Math.random() - 0.5) * 0.08;
          particlePositions[idx * 3]     = v.x + (Math.random() - 0.5) * offset;
          particlePositions[idx * 3 + 1] = v.y + (Math.random() - 0.5) * offset;
          particlePositions[idx * 3 + 2] = v.z + (Math.random() - 0.5) * offset;
        }
      }
    }
    particleGeom.attributes.position.needsUpdate = true;
  }
  
  // autonomous rotation: slow drift so no perspective stabilizes
  particleMat.uniforms.rotationY.value = elapsed * 0.08;
  
  // variable fog density oscillates — form appears, withdraws
  const fogBase = 0.065;
  const fogOsc = Math.sin(elapsed * 0.3) * 0.035;
  particleMat.uniforms.fogDensity.value = fogBase + fogOsc;
  
  // update camera position uniform for shy-zone calc
  particleMat.uniforms.cameraPos.value.copy(camera.position);
  particleMat.uniforms.time.value = elapsed;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
</body>
</html>
