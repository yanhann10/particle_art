<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6a6 · nest of you</title>
<!-- MOTION: orbit, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0d; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">6a6</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Wang & Söderström 'Nest of You' — biomorphic data-body accretion ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0d, 1);
document.body.appendChild(renderer.domElement);

/* ── palette: pearl / lavender / mercury ── */
const pearl = new THREE.Color(0.92, 0.90, 0.94);
const lavender = new THREE.Color(0.68, 0.64, 0.82);
const mercury = new THREE.Color(0.72, 0.74, 0.78);

/* ── leaf primitive: curved sheet with mid-vein ── */
function makeLeafGeometry(length, width, curvature){
  const segments = 24;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const x = (t - 0.5) * length;
    const widthHere = width * (1 - t * 0.4);
    const curve = Math.pow(t, 1.5) * curvature;
    
    for (let side = -1; side <= 1; side += 2){
      const y = side * widthHere * 0.5;
      const z = curve;
      positions.push(x, y, z);
      normals.push(0, 0, 1);
      uvs.push(t, (side + 1) / 2);
    }
  }

  for (let i = 0; i < segments; i++){
    const base = i * 2;
    indices.push(base, base + 1, base + 2);
    indices.push(base + 1, base + 3, base + 2);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

/* ── leaf elements: folded/curled biomorphic sheets ── */
const leafConfigs = [
  { length: 3.2, width: 1.8, curvature: 2.4, pos: [0, 0.5, 0], rot: [0.3, 0, 0.2], scale: 1.0, color: pearl },
  { length: 2.8, width: 1.6, curvature: 1.9, pos: [-1.2, -0.8, 0.4], rot: [0.5, 0.8, -0.4], scale: 0.85, color: lavender },
  { length: 3.0, width: 1.5, curvature: 2.1, pos: [1.5, 0.2, -0.6], rot: [-0.4, -0.6, 0.3], scale: 0.9, color: mercury },
  { length: 2.5, width: 1.4, curvature: 1.6, pos: [0.3, -1.5, 0.8], rot: [0.7, 0.2, -0.6], scale: 0.75, color: pearl },
  { length: 2.9, width: 1.7, curvature: 2.2, pos: [-1.8, 0.9, -0.3], rot: [-0.3, 1.0, 0.5], scale: 0.88, color: lavender },
  { length: 2.6, width: 1.3, curvature: 1.8, pos: [1.0, 1.6, 0.5], rot: [0.6, -0.5, -0.3], scale: 0.8, color: mercury },
  { length: 3.1, width: 1.9, curvature: 2.3, pos: [-0.6, 1.2, -0.9], rot: [-0.5, 0.4, 0.7], scale: 0.92, color: pearl },
  { length: 2.7, width: 1.5, curvature: 2.0, pos: [2.0, -0.5, 0.2], rot: [0.4, -0.9, -0.2], scale: 0.82, color: lavender },
];

const leaves = [];

leafConfigs.forEach(cfg => {
  const geom = makeLeafGeometry(cfg.length, cfg.width, cfg.curvature);
  const mat = new THREE.MeshPhysicalMaterial({
    color: cfg.color,
    metalness: 0.12,
    roughness: 0.35,
    transparent: true,
    opacity: 0.88,
    side: THREE.DoubleSide,
    transmission: 0.08,
    thickness: 0.3,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(...cfg.pos);
  mesh.rotation.set(...cfg.rot);
  mesh.scale.setScalar(cfg.scale);
  mesh.userData = {
    basePos: new THREE.Vector3(...cfg.pos),
    baseRot: new THREE.Euler(...cfg.rot),
    seed: Math.random(),
  };
  scene.add(mesh);
  leaves.push(mesh);
});

/* ── metaball-like soft spheres: instanced ── */
const sphereCount = 320;
const sphereGeom = new THREE.SphereGeometry(0.12, 16, 12);
const sphereMat = new THREE.MeshPhysicalMaterial({
  color: mercury,
  metalness: 0.25,
  roughness: 0.28,
  transparent: true,
  opacity: 0.75,
  transmission: 0.15,
  thickness: 0.4,
});
const sphereMesh = new THREE.InstancedMesh(sphereGeom, sphereMat, sphereCount);
scene.add(sphereMesh);

const spheres = [];
for (let i = 0; i < sphereCount; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 2.5 + Math.random() * 1.5;
  spheres.push({
    pos: new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi)
    ),
    vel: new THREE.Vector3(),
    seed: Math.random(),
    targetLeaf: Math.floor(Math.random() * leaves.length),
    stuck: false,
    stuckTo: null,
    stuckOffset: new THREE.Vector3(),
    age: 0,
  });
}

/* ── attractor: viewer-position proxy (pointer or centroid) ── */
const attractor = new THREE.Vector3(0, 0, 0);
let pointerActive = false;
const pointer = new THREE.Vector2();

addEventListener('pointermove', e => {
  pointerActive = true;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});
addEventListener('pointerleave', () => {
  pointerActive = false;
});

/* ── lighting ── */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x9090c0, 0.3);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const dummy = new THREE.Object3D();
const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;

  /* ── attractor update: pointer or gentle orbit ── */
  if (pointerActive){
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(pointer, camera);
    const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(plane, intersect);
    if (intersect) attractor.copy(intersect);
  } else {
    attractor.x = Math.sin(elapsed * 0.25) * 1.2;
    attractor.y = Math.cos(elapsed * 0.19) * 0.9;
    attractor.z = 0;
  }

  /* ── sphere physics: orbit, stick, shed ── */
  for (let i = 0; i < spheres.length; i++){
    const s = spheres[i];
    s.age += 0.016;

    if (s.stuck){
      /* stuck to leaf — follow leaf with slight drift */
      const leaf = s.stuckTo;
      const worldPos = new THREE.Vector3();
      leaf.localToWorld(worldPos.copy(s.stuckOffset));
      s.pos.lerp(worldPos, 0.1);

      /* shed if attractor moves fast */
      const dist = s.pos.distanceTo(attractor);
      const speed = s.vel.length();
      if (dist > 5.0 || speed > 0.3){
        s.stuck = false;
        s.stuckTo = null;
      }
    } else {
      /* free — orbit attractor with noise */
      const toAttractor = new THREE.Vector3().subVectors(attractor, s.pos);
      const dist = toAttractor.length();
      const force = toAttractor.normalize().multiplyScalar(0.008 * (1 + dist * 0.2));
      s.vel.add(force);

      /* noise drift */
      const noisePhase = elapsed * 0.4 + s.seed * 6.28;
      s.vel.x += Math.sin(noisePhase * 1.3) * 0.003;
      s.vel.y += Math.cos(noisePhase * 1.7) * 0.003;
      s.vel.z += Math.sin(noisePhase * 2.1 + 1.5) * 0.002;

      /* damping */
      s.vel.multiplyScalar(0.96);
      s.pos.add(s.vel);

      /* stick if slow and near a leaf */
      const speed = s.vel.length();
      if (speed < 0.08 && s.age > 1.0){
        const leaf = leaves[s.targetLeaf];
        const leafDist = s.pos.distanceTo(leaf.position);
        if (leafDist < 1.5){
          s.stuck = true;
          s.stuckTo = leaf;
          leaf.worldToLocal(s.stuckOffset.copy(s.pos));
        }
      }
    }

    /* update instance matrix */
    dummy.position.copy(s.pos);
    const scale = 0.8 + 0.2 * Math.sin(elapsed * 2.0 + s.seed * 6.28);
    dummy.scale.setScalar(scale);
    dummy.updateMatrix();
    sphereMesh.setMatrixAt(i, dummy.matrix);
  }
  sphereMesh.instanceMatrix.needsUpdate = true;

  /* ── leaf breathing animation ── */
  leaves.forEach(leaf => {
    const t = elapsed * 0.3 + leaf.userData.seed * 6.28;
    const breathe = 0.06 * Math.sin(t);
    leaf.rotation.copy(leaf.userData.baseRot);
    leaf.rotation.x += breathe;
    leaf.rotation.y += breathe * 0.5;

    const sway = 0.08 * Math.sin(t * 0.7);
    leaf.position.copy(leaf.userData.basePos);
    leaf.position.x += sway;
    leaf.position.y += sway * 0.6;
  });

  /* ── camera gentle orbit ── */
  camera.position.x = 14 * Math.sin(elapsed * 0.08);
  camera.position.z = 14 * Math.cos(elapsed * 0.08);
  camera.position.y = 1.5 * Math.sin(elapsed * 0.13);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
