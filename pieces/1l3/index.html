<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1l3 · Shiota — Threshold Vigil</title>
<!-- MOTION: anticipatory pulse, intensity: restless -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; cursor:crosshair; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">1l3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0042);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.003));
const key1 = new THREE.PointLight(0x220606, 0.014, 28, 2.0);
key1.position.set(-12, 14, 6);
scene.add(key1);

const key2 = new THREE.PointLight(0x100404, 0.009, 24, 2.2);
key2.position.set(10, -8, -12);
scene.add(key2);

let seed = 892347;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 42, h: 24, d: 38 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// WINDOW PORTAL — looking outward, threshold to elsewhere
const windowPos = new THREE.Vector3(0, 2.8, -hd + 0.2);
const windowW = 8.4, windowH = 11.2;

// Window frame geometry
const frameThick = 0.18;
const frameGeo = new THREE.BoxGeometry(1, 1, 1);
const frameMat = new THREE.MeshStandardMaterial({
  color: 0x1a1412,
  roughness: 0.92,
  metalness: 0.04
});

// Vertical mullions
const leftFrame = new THREE.Mesh(frameGeo, frameMat);
leftFrame.scale.set(frameThick, windowH, frameThick*2);
leftFrame.position.set(windowPos.x - windowW/2, windowPos.y, windowPos.z);
scene.add(leftFrame);

const rightFrame = new THREE.Mesh(frameGeo, frameMat);
rightFrame.scale.set(frameThick, windowH, frameThick*2);
rightFrame.position.set(windowPos.x + windowW/2, windowPos.y, windowPos.z);
scene.add(rightFrame);

// Horizontal mullions
const topFrame = new THREE.Mesh(frameGeo, frameMat);
topFrame.scale.set(windowW, frameThick, frameThick*2);
topFrame.position.set(windowPos.x, windowPos.y + windowH/2, windowPos.z);
scene.add(topFrame);

const bottomFrame = new THREE.Mesh(frameGeo, frameMat);
bottomFrame.scale.set(windowW, frameThick, frameThick*2);
bottomFrame.position.set(windowPos.x, windowPos.y - windowH/2, windowPos.z);
scene.add(bottomFrame);

// Center cross — vertical
const centerV = new THREE.Mesh(frameGeo, frameMat);
centerV.scale.set(frameThick*0.8, windowH*0.94, frameThick);
centerV.position.set(windowPos.x, windowPos.y, windowPos.z);
scene.add(centerV);

// Center cross — horizontal
const centerH = new THREE.Mesh(frameGeo, frameMat);
centerH.scale.set(windowW*0.94, frameThick*0.8, frameThick);
centerH.position.set(windowPos.x, windowPos.y, windowPos.z);
scene.add(centerH);

// Window glow — faint promise beyond
const windowGlow = new THREE.PointLight(0x1a0808, 0.008, 16, 2.6);
windowGlow.position.set(windowPos.x, windowPos.y, windowPos.z - 1.2);
scene.add(windowGlow);

// WINDOW ANCHORS — frame vertices for thread attachment
const windowAnchors = [];
const gridU = 9, gridV = 13;
for(let i=0; i<=gridU; i++){
  for(let j=0; j<=gridV; j++){
    const u = i/gridU - 0.5;
    const v = j/gridV - 0.5;
    const x = windowPos.x + u*windowW*0.98;
    const y = windowPos.y + v*windowH*0.98;
    const z = windowPos.z + 0.1;
    windowAnchors.push(new THREE.Vector3(x, y, z));
  }
}

// WALL ANCHORS
const anchors = [];

function gridAnchors(face, uSteps, vSteps){
  const pts = [];
  for(let i=0; i<=uSteps; i++){
    for(let j=0; j<=vSteps; j++){
      const u = i/uSteps;
      const v = j/vSteps;
      let x, y, z;
      switch(face){
        case 0: x=-hw; y=(v-0.5)*ROOM.h*0.96; z=(u-0.5)*ROOM.d*0.96; break;
        case 1: x= hw; y=(v-0.5)*ROOM.h*0.96; z=(u-0.5)*ROOM.d*0.96; break;
        case 2: y=-hh; x=(u-0.5)*ROOM.w*0.96; z=(v-0.5)*ROOM.d*0.96; break;
        case 3: y= hh; x=(u-0.5)*ROOM.w*0.96; z=(v-0.5)*ROOM.d*0.96; break;
        case 4: z=-hd; x=(u-0.5)*ROOM.w*0.96; y=(v-0.5)*ROOM.h*0.96; break;
        default:z= hd; x=(u-0.5)*ROOM.w*0.96; y=(v-0.5)*ROOM.h*0.96; break;
      }
      pts.push(new THREE.Vector3(x, y, z));
    }
  }
  return pts;
}

for(let f=0; f<6; f++){
  if(f===4) continue; // skip back wall where window is
  anchors.push(...gridAnchors(f, 7, 5));
}

// RED THREAD NETWORK
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CONVERGENT THREADS TO WINDOW — iktsuarpok embodied
// threads reach toward window, many fall short
const approachCount = 8200;
for(let i=0; i<approachCount && li<NUM_LINES-11800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dWindow = a.distanceTo(windowPos);
  if(dWindow < 5.0) continue;
  
  let target = windowAnchors[Math.floor(rng()*windowAnchors.length)];
  const dir = target.clone().sub(a).normalize();
  const fullDist = a.distanceTo(target);
  
  // Anticipatory tension — 65% don't reach, stopping short
  const reachProb = 0.35;
  if(rng() > reachProb){
    const shortFrac = 0.28 + rng()*0.58;
    const shortDist = fullDist * shortFrac;
    const end = a.clone().add(dir.multiplyScalar(shortDist));
    setLine(a, end);
    
    // Some threads tremble, branching mid-reach
    if(rng()<0.22 && li<NUM_LINES-11600){
      const branchPoint = a.clone().add(dir.clone().multiplyScalar(shortDist*0.68));
      const wobble = new THREE.Vector3(
        (rng()-0.5)*0.48,
        (rng()-0.5)*0.42,
        (rng()-0.5)*0.36
      );
      const branchEnd = branchPoint.clone().add(wobble);
      setLine(branchPoint, branchEnd);
    }
  } else {
    setLine(a, target);
  }
}

// WINDOW-TO-ROOM EMANATION — threads from window outward
for(let i=0; i<windowAnchors.length && li<NUM_LINES-3600; i++){
  const wa = windowAnchors[i];
  
  // Primary emanation into room
  const dir = new THREE.Vector3(
    (rng()-0.5)*0.72,
    (rng()-0.5)*0.58,
    0.62 + rng()*0.36
  ).normalize();
  
  const len = 11.2 + rng()*9.8;
  const end = wa.clone().add(dir.multiplyScalar(len));
  setLine(wa, end);
  
  // Secondary branch
  if(rng()<0.38 && li<NUM_LINES-3400){
    const mid = wa.clone().add(dir.clone().multiplyScalar(len*0.52));
    const branch = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, 0.2).normalize(),
      0.72 + rng()*0.56
    ).normalize();
    const end2 = mid.clone().add(branch.multiplyScalar(7.2 + rng()*5.4));
    setLine(mid, end2);
  }
}

// FRAME-TO-ANCHOR CONNECTIONS
const framePoints = [
  ...windowAnchors.filter((_, i) => i%(gridV+1)===0 || i%(gridV+1)===gridV || i<gridV+1 || i>windowAnchors.length-gridV-2)
];

for(let i=0; i<framePoints.length && li<NUM_LINES-3000; i++){
  const fp = framePoints[i];
  
  // Find nearby room anchors
  for(let j=0; j<4; j++){
    const ra = anchors[Math.floor(rng()*anchors.length)];
    const d = fp.distanceTo(ra);
    if(d>8.0 && d<22.0){
      setLine(fp, ra);
      if(li>=NUM_LINES-3000) break;
    }
  }
}

// CROSS-ROOM HORIZONTAL THREADS
for(let i=0; i<720 && li<NUM_LINES-2280; i++){
  const y = windowPos.y + (rng()-0.5)*14.0;
  const x1 = -hw + rng()*5.2;
  const z1 = (rng()-0.5)*ROOM.d*0.94;
  const x2 = hw - rng()*5.2;
  const z2 = (rng()-0.5)*ROOM.d*0.94;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS
for(let i=0; i<580 && li<NUM_LINES-1700; i++){
  const x = (rng()-0.5)*ROOM.w*0.92;
  const z = (rng()-0.5)*ROOM.d*0.92;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.8, hh, z + (rng()-0.5)*1.6);
  setLine(a, b);
}

// DIAGONAL CROSS-THREADS
for(let i=0; i<520 && li<NUM_LINES-1180; i++){
  const x1 = (rng()-0.5)*ROOM.w*0.90;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  const a = new THREE.Vector3(x1, -hh, z1);
  
  const x2 = x1 + (rng()-0.5)*10.2;
  const z2 = z1 + (rng()-0.5)*9.8;
  const b = new THREE.Vector3(x2, hh, z2);
  setLine(a, b);
}

// ANCHOR-TO-ANCHOR PROXIMITY NETWORK
const THRESH = 9.2;
let webCount = 0, attempts = 0;
while(webCount<660 && li<NUM_LINES-520 && attempts<3000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// FILL remaining budget
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.8 && d<19.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.072,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — slow arc facing window
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.32){
    const lt = t/0.32;
    const angle = Math.PI*0.18 + lt*Math.PI*0.72;
    const r = 16.8 - lt*4.2;
    x = windowPos.x + Math.cos(angle)*r;
    y = windowPos.y + 5.8 - lt*4.2;
    z = windowPos.z + Math.sin(angle)*r + 8.2;
  } else if(t<0.62){
    const lt = (t-0.32)/0.30;
    const angle = Math.PI*0.90 + lt*Math.PI*1.18;
    const r = 12.6 + Math.sin(lt*Math.PI*1.4)*1.6;
    x = windowPos.x + Math.cos(angle)*r;
    y = windowPos.y + 1.6 + Math.cos(lt*Math.PI*1.6)*1.4;
    z = windowPos.z + Math.sin(angle)*r + 7.8;
  } else {
    const lt = (t-0.62)/0.38;
    const angle = Math.PI*2.08 + lt*Math.PI*0.88;
    const r = 11.8 + lt*4.8;
    x = windowPos.x + Math.cos(angle)*r;
    y = windowPos.y + 2.2 + lt*3.8;
    z = windowPos.z + Math.sin(angle)*r + 7.2;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Camera dolly — slow approach toward window
  const speed = 0.000006;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at window with restless micro-adjustments
  const lookX = windowPos.x + Math.sin(elapsed*0.00012)*0.18;
  const lookY = windowPos.y + Math.cos(elapsed*0.00009)*0.14;
  const lookZ = windowPos.z + Math.sin(elapsed*0.00015)*0.10;
  camera.lookAt(lookX, lookY, lookZ);

  // Pulsing light — anticipatory rhythm
  const pulse = Math.sin(elapsed*0.00034)*0.5 + 0.5;
  key1.intensity = 0.014 + pulse*0.006;
  windowGlow.intensity = 0.008 + pulse*0.005;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
