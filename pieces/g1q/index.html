<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g1q · Shiota — Held Breath</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">g1q</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.0055);

const camera = new THREE.PerspectiveCamera(54, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080302, 0.02));

// Single warm light near the sphere — darkness is the primary material
const pL = new THREE.PointLight(0xffd8b0, 0.12, 40, 2.0);
pL.position.set(-1.5, 4.5, 2.0);
scene.add(pL);

let seed = 41927083;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 38, h: 30, d: 42 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — a held breath, a stone carried from home
const sphereCenter = new THREE.Vector3(0.6, 0.8, -0.3);
const SPHERE_R = 1.45;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8df,
    emissive: 0xede5d8,
    emissiveIntensity: 0.65,
    roughness: 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.30
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner glow — the sphere holds its own light
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.6, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xfaf4ec, transparent: true, opacity: 0.04 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// 7 suspension threads — ceiling to sphere top, making the hanging physical
const suspPts = [];
for(let i = 0; i < 7; i++){
  const ox = (rng()-0.5)*0.4;
  const oz = (rng()-0.5)*0.35;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.04, sphereCenter.y + SPHERE_R + 0.03, sphereCenter.z + oz*0.04
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.55
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi)*Math.cos(theta) * SPHERE_R,
    sphereCenter.y + Math.sin(phi)*Math.sin(theta) * SPHERE_R,
    sphereCenter.z + Math.cos(phi) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — concentric shells, hand-placed irregularity
const anchors = [];
const icoVerts = [];
for(let i = 0; i < 12; i++){
  const lat = (i === 0) ? Math.PI/2 : (i === 11) ? -Math.PI/2 :
    ((i <= 5) ? Math.atan(0.5) : -Math.atan(0.5));
  const lon = (i === 0 || i === 11) ? 0 :
    ((i <= 5) ? (i-1)*2*Math.PI/5 : (i-6)*2*Math.PI/5 + Math.PI/5);
  icoVerts.push(new THREE.Vector3(
    Math.cos(lat)*Math.cos(lon), Math.sin(lat), Math.cos(lat)*Math.sin(lon)
  ));
}

const edgeMids = [];
for(let i = 0; i < icoVerts.length; i++){
  for(let j = i+1; j < icoVerts.length; j++){
    if(icoVerts[i].distanceTo(icoVerts[j]) < 1.2){
      edgeMids.push(icoVerts[i].clone().add(icoVerts[j]).multiplyScalar(0.5).normalize());
    }
  }
}

// Tighter shells — more intimate web
const shells = [2.5, 4.8, 8.0, 13.0, 18.0];
for(const R of shells){
  const jitter = R * 0.06; // hand-tied irregularity
  for(const v of icoVerts){
    anchors.push(new THREE.Vector3(
      sphereCenter.x + v.x*R + (rng()-0.5)*jitter,
      sphereCenter.y + v.y*R + (rng()-0.5)*jitter,
      sphereCenter.z + v.z*R + (rng()-0.5)*jitter
    ));
  }
  for(const m of edgeMids){
    anchors.push(new THREE.Vector3(
      sphereCenter.x + m.x*R + (rng()-0.5)*jitter*0.8,
      sphereCenter.y + m.y*R + (rng()-0.5)*jitter*0.8,
      sphereCenter.z + m.z*R + (rng()-0.5)*jitter*0.8
    ));
  }
}

// Wall-biased anchors
while(anchors.length < 600){
  const p = rng() < 0.35 ? wallPt() : wallPt().lerp(sphereCenter, 0.06 + rng()*0.20);
  anchors.push(p);
}

// Void zones — apertures in the web for the camera to peer through
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 5, sphereCenter.y + 7, sphereCenter.z + 6), r: 2.4 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y - 5, sphereCenter.z - 7), r: 2.1 },
  { pos: new THREE.Vector3(sphereCenter.x + 3.5, sphereCenter.y + 9, sphereCenter.z + 3.5), r: 1.8 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — 16,000 segments, well within 20k budget
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// ─── Cat A: CONVERGENCE — blood vessels drawn to the sphere
// 55% — the primary visual. Threads converge like veins to a heart.
// 15% stop short: presence-in-absence, the gap between reaching and arriving
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.42){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = sphereSurf();

  // 15% stop short — threads that reach but never arrive
  if(rng() < 0.15){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng() * 1.6;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// ─── Cat B: PROXIMITY NETWORK — threads between nearby anchors
const THRESH = 5.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.18);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.5 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;

  // Dendritic branching — Y-forks, 3 generations deep
  if(rng() < 0.18 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.6);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bLen = 0.12 + rng()*0.55;
    const bEnd = mid.clone().add(bDir.multiplyScalar(bLen));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 1);
      catBcount++;
      // Second generation
      if(rng() < 0.3 && li < NUM_LINES - 2){
        const mid2 = mid.clone().lerp(bEnd, 0.35 + rng()*0.4);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.04 + rng()*0.2));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2, 1);
          catBcount++;
          // Third generation — finest filaments
          if(rng() < 0.2 && li < NUM_LINES - 1){
            const mid3 = mid2.clone().lerp(bEnd2, 0.5);
            const bDir3 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
            const bEnd3 = mid3.clone().add(bDir3.multiplyScalar(0.02 + rng()*0.08));
            if(!inVoid(bEnd3)){
              setLine(mid3, bEnd3, 1);
              catBcount++;
            }
          }
        }
      }
    }
  }
}

// ─── Cat C: CORONA — dense wrapping close to the sphere surface
const catC = Math.floor(NUM_LINES * 0.09);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const s2 = sphereSurf();
  const outA = s1.clone();
  outA.x += (rng()-0.5)*0.4;
  outA.y += (rng()-0.5)*0.4;
  outA.z += (rng()-0.5)*0.4;
  const outB = s2.clone();
  outB.x += (rng()-0.5)*0.4;
  outB.y += (rng()-0.5)*0.4;
  outB.z += (rng()-0.5)*0.4;
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB, 2);
}

// ─── Cat D: GRAVITY DRAPE — threads falling from sphere to floor
const catD = Math.floor(NUM_LINES * 0.07);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  if(sp.y > sphereCenter.y) sp.y = sphereCenter.y - rng() * SPHERE_R;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*3.5,
    -hh,
    sp.z + (rng()-0.5)*3.5
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 3);
}

// ─── Cat E: MEMORY SPANS — long diagonal threads, wall-to-wall
// These are the architectural bones — the room revealing itself through thread
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.30 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
// sphere-converging brightest, wall-to-wall dimmest
const catOpacity = [0.08, 0.04, 0.06, 0.05, 0.035];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat];
  const bright = op / 0.08;
  // Distance fade — threads farther from sphere are slightly dimmer
  const dFade = Math.max(0.4, 1.0 - lineDist[i] / 35.0);
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright * dFade;
    colors[i*6+v*3+1] = bG * bright * dFade;
    colors[i*6+v*3+2] = bB * bright * dFade;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, burnt letters, stones caught in the web
const NUM_FRAGMENTS = 48;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.12;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.25 + rng()*0.7);
  const h = sz * (0.35 + rng()*0.9);
  // Irregular quad — two triangles, slightly asymmetric
  const skew = (rng()-0.5)*0.15;
  const verts = new Float32Array([
    w*(-0.35+rng()*0.15)+skew, h*0.5, rng()*0.01,
    -w*0.5, h*(-0.12+rng()*0.08), rng()*0.01,
    w*(0.08-rng()*0.25), -h*0.5, rng()*0.01,
    w*(-0.35+rng()*0.15)+skew, h*0.5, rng()*0.01,
    w*(0.15+rng()*0.35), h*(rng()*0.04-0.02), rng()*0.01,
    w*(0.08-rng()*0.25), -h*0.5, rng()*0.01
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.004 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.015),
    transparent: true,
    opacity: 0.12 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.12 + rng()*0.76;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(1.8 + rng()*8.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate
// Narrative arc: begin in darkness at distance, drift inward, circle the sphere
// closely, dip below to look up through the web at the glowing stone,
// rise slowly — a held breath released
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  // Approach phase (first 15%): start farther, contract inward
  const approachBlend = Math.min(1.0, t / 0.15);
  const rScale = 1.0 + (1.0 - approachBlend) * 0.6;

  // Gentle elliptical orbit with figure-8 perturbation
  const rX = (4.2 + Math.sin(p * 0.7) * 1.2) * rScale;
  const rZ = (5.4 + Math.cos(p * 0.55) * 1.5) * rScale;

  const x = cx + Math.sin(p) * rX;
  // Vertical: hover near sphere, with slow sine dips below and lifts above
  const yBase = cy + 0.2;
  const yWave = Math.sin(p * 0.25 + 0.5) * 3.8
    + Math.cos(p * 0.6 + 1.5) * 1.5
    + Math.sin(p * 1.3 + 2.8) * 0.25;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — nearly imperceptible, <0.4% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0002 * Math.max(0, 1.0 - dist / 24.0);
    const phase = basePositions[idx]*0.13 + basePositions[idx+1]*0.17 + i*0.00055;
    const breath = Math.sin(t*0.012 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.25;
      arr[vi+1] = basePositions[vi+1] + breath*0.18;
      arr[vi+2] = basePositions[vi+2] + breath*0.22;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — slower than parent
  const speed = 0.00035;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — gravitational anchor
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0012)*0.04;
  look.y += Math.cos(t*0.0010)*0.03;
  look.z += Math.sin(t*0.0015)*0.035;
  camera.lookAt(look);

  // Subtle light wander
  pL.position.x = -1.5 + Math.sin(t*0.0006)*0.15;
  pL.position.y = 4.5 + Math.cos(t*0.0005)*0.08;

  // Sphere inner glow pulse — barely perceptible
  innerGlow.material.opacity = 0.035 + Math.sin(t*0.008)*0.008;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
