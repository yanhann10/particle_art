<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hu4 · Shiota — two home countries</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#030202; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">hu4</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030202);
scene.fog = new THREE.FogExp2(0x030202, 0.032);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lights for sphere
const ambLight = new THREE.AmbientLight(0x1a0808, 1.0);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.7);
dirLight.position.set(-4, 6, 3);
scene.add(dirLight);
const rimLight = new THREE.PointLight(0xc20018, 0.3, 20);
rimLight.position.set(5, -2, -4);
scene.add(rimLight);

// Deterministic RNG
let rngState = 48271035;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// The suspended sphere — pale, cottony, the heart of the web
const sphereRadius = 2.0;
const sphereCenter = new THREE.Vector3(2.2, 0.4, -4.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0,
  emissive: 0xf2ebe0,
  emissiveIntensity: 0.6,
  roughness: 1.0,
  metalness: 0.0,
  transparent: true,
  opacity: 0.82
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Architectural room — the viewer is inside
const ROOM = { w: 22, h: 14, d: 32 };

function wallPoint(){
  const face = Math.floor(rng() * 6);
  const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;
  let x, y, z;
  switch(face){
    case 0: x = -hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 1: x =  hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 2: y = -hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 3: y =  hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 4: z = -hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
    default: z = hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Anchor points — denser near sphere, sparser at walls
const NUM_ANCHORS = 700;
const anchors = [];
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.4){
    // Near sphere — like vessels converging on the heart
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.05 + rng() * 3.5;
    anchors.push(sphereCenter.clone().add(dir.multiplyScalar(dist)));
  } else if (rng() < 0.2){
    // Mid-distance cluster — memory fragments floating between
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 3.5 + rng() * 5;
    anchors.push(sphereCenter.clone().add(dir.multiplyScalar(dist)));
  } else {
    anchors.push(wallPoint());
  }
}

// Build line segments — 20,000 max
const NUM_LINES = 20000;
const linePositions = new Float32Array(NUM_LINES * 6);
let li = 0;

// Thread toward sphere surface
function nearSpherePoint(from){
  const dir = sphereCenter.clone().sub(from).normalize();
  const surf = sphereCenter.clone().sub(dir.multiplyScalar(sphereRadius * (0.97 + rng()*0.06)));
  surf.x += (rng()-0.5)*0.3;
  surf.y += (rng()-0.5)*0.3;
  surf.z += (rng()-0.5)*0.3;
  return surf;
}

function setLine(a, b){
  if (li >= NUM_LINES) return;
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  li++;
}

// Category A: Wall-to-wall threads that pass through the volume (~30%)
for (let i = 0; i < 6000 && li < NUM_LINES; i++){
  const a = wallPoint();
  const b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereCenter) > 14 && rng() > 0.2) { i--; continue; }
  setLine(a, b);
}

// Category B: Convergent threads — wall/anchor to sphere surface (~40%)
// These create the circulatory density around the sphere
for (let i = 0; i < 8000 && li < NUM_LINES; i++){
  const a = rng() < 0.6
    ? anchors[Math.floor(rng() * anchors.length)]
    : wallPoint();
  const b = nearSpherePoint(a);
  setLine(a, b);
}

// Category C: Short local threads between nearby anchors (~20%)
for (let i = 0; i < 4000 && li < NUM_LINES; i++){
  const ai = Math.floor(rng() * anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 10; j++){
    const bi = Math.floor(rng() * anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.15){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) best = wallPoint();
  setLine(a, best);
}

// Category D: Tight wrapping threads very close to sphere surface (~10%)
// The dense arterial layer closest to the heart
for (let i = 0; i < 2000 && li < NUM_LINES; i++){
  const dir1 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const dir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const r1 = sphereRadius + 0.02 + rng() * 0.8;
  const r2 = sphereRadius + 0.02 + rng() * 0.8;
  const a = sphereCenter.clone().add(dir1.multiplyScalar(r1));
  const b = sphereCenter.clone().add(dir2.multiplyScalar(r2));
  if (a.distanceTo(b) < 0.1) { i--; continue; }
  setLine(a, b);
}

const basePositions = new Float32Array(linePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// Dark fragments — charred paper, small stones caught in the web
const NUM_FRAGMENTS = 22;
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.04 + rng() * 0.14;
  const geo = rng() > 0.4
    ? new THREE.BoxGeometry(size, size*(0.2+rng()*1.6), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const darkness = 0.02 + rng()*0.05;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(darkness, darkness*0.6, darkness*0.5),
    transparent: true,
    opacity: 0.5 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Place along random thread segments, biased toward sphere
  const segIdx = Math.floor(rng() * li) * 6;
  const t = 0.2 + rng() * 0.6;
  mesh.position.set(
    basePositions[segIdx]*(1-t) + basePositions[segIdx+3]*t,
    basePositions[segIdx+1]*(1-t) + basePositions[segIdx+4]*t,
    basePositions[segIdx+2]*(1-t) + basePositions[segIdx+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// A second smaller object — a key-like form suspended below sphere
// (Shiota's keys, the everyday remembered object)
const keyGroup = new THREE.Group();
const keyRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.12, 0.025, 8, 16),
  new THREE.MeshBasicMaterial({ color: 0x1a1510, transparent: true, opacity: 0.7 })
);
const keyShaft = new THREE.Mesh(
  new THREE.BoxGeometry(0.04, 0.35, 0.015),
  new THREE.MeshBasicMaterial({ color: 0x1a1510, transparent: true, opacity: 0.7 })
);
keyShaft.position.y = -0.22;
const keyBit = new THREE.Mesh(
  new THREE.BoxGeometry(0.08, 0.06, 0.015),
  new THREE.MeshBasicMaterial({ color: 0x1a1510, transparent: true, opacity: 0.7 })
);
keyBit.position.set(0.02, -0.38, 0);
keyGroup.add(keyRing, keyShaft, keyBit);
keyGroup.position.set(sphereCenter.x - 1.5, sphereCenter.y - 2.8, sphereCenter.z + 1.0);
keyGroup.rotation.set(0.3, 0.5, 0.15);
scene.add(keyGroup);

// Camera path — slow drift inside the web, always looking toward sphere
const camPath = {
  baseRadius: 7.0,
  verticalRange: 2.5,
  speed: 0.014,
  driftSpeed: 0.007
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Breathing — very subtle anchor jitter, <0.5% of segment length
  const breathAmp = 0.012;
  const breathFreq = 0.25;
  const arr = lineGeo.attributes.position.array;
  for (let i = 0; i < li * 6; i += 3){
    const bx = basePositions[i];
    const by = basePositions[i+1];
    const bz = basePositions[i+2];
    const phase = bx * 0.6 + by * 0.9 + bz * 0.4;
    const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;
    arr[i]   = bx + b;
    arr[i+1] = by + b * 0.6;
    arr[i+2] = bz + b * 0.4;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera — gentle orbit inside the web volume
  const angle = elapsed * camPath.speed;
  const drift = elapsed * camPath.driftSpeed;
  const r = camPath.baseRadius + Math.sin(drift * 1.3) * 1.2;
  camera.position.set(
    sphereCenter.x + Math.cos(angle) * r,
    sphereCenter.y + Math.sin(elapsed * 0.009) * camPath.verticalRange,
    sphereCenter.z + Math.sin(angle) * r
  );

  // Look toward sphere with slow wander
  const lookAt = sphereCenter.clone();
  lookAt.x += Math.sin(elapsed * 0.025) * 0.6;
  lookAt.y += Math.cos(elapsed * 0.02) * 0.4;
  camera.lookAt(lookAt);

  // Subtle key rotation
  keyGroup.rotation.z = 0.15 + Math.sin(elapsed * 0.08) * 0.05;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
