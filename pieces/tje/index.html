<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tje · parity-violation ribbon · Wu symmetry break</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">tje</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from ajo · parity-violation · Chien-Shiung Wu 1956</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────────────────────────────────────────────────────────────────────────
   Parity-violation ribbon — Chien-Shiung Wu's Co-60 experiment (1956).
   Parent ajo's arabesque ribbon grows symmetrically in antique gold.
   Every ~9 s a "violation event" fires: left edge stays gold, right edge
   flushes cobalt-60 violet, the ribbon torques asymmetrically, and a brief
   emissive pulse + camera tremor marks the onset. After ~2.5 s symmetry
   self-recovers. Like nature: orderly, then briefly cheeky, then composed.
   ─────────────────────────────────────────────────────────────────────────── */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.016);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(6, 12, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.1);
lightKey.position.set(6, 14, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.5));
const lightFill = new THREE.DirectionalLight(0x405078, 0.4);
lightFill.position.set(-6, 4, -4);
scene.add(lightFill);

// violation-onset pulse light — starts dark, flares violet briefly
const pulseLight = new THREE.PointLight(0x8855cc, 0, 30, 1.5);
pulseLight.position.set(0, 6, 0);
scene.add(pulseLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 6, 0);

// ─────────── differential growth (3D, from 5gm→ajo)
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE     = 0.003;
const PRESSURE  = 0.0030;
const RISE      = 0.013;       // critic: increased for vertical silhouette
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  const helixY = Math.sin(th * 2) * 0.4;  // helical seed for tower shape
  verts.push({ x: Math.cos(th)*r, y: helixY, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearbyIndices(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const fx = new Float32Array(n), fy = new Float32Array(n), fz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of nearbyIndices(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      fx[i]+=ex*f; fy[i]+=ey*f; fz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    fx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    fy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    fz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx=0, cy=0, cz=0;
  for (let i=0;i<n;i++){ cx+=verts[i].x; cy+=verts[i].y; cz+=verts[i].z; }
  cx/=n; cy/=n; cz/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-cx, oy=verts[i].y-cy, oz=verts[i].z-cz;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    fx[i]+=(ox/d)*PRESSURE;
    fy[i]+=(oy/d)*PRESSURE*0.4;
    fz[i]+=(oz/d)*PRESSURE;
  }
  // helical twist bias — tangential push varies with height
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const ox = v.x-cx, oz = v.z-cz;
    const rd = Math.hypot(ox, oz)+1e-6;
    const tx = -oz/rd, tz = ox/rd;
    const twist = 0.0015 * Math.sin(v.y * 0.7);
    fx[i] += tx*twist;
    fz[i] += tz*twist;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2*Math.min(a*1.5, 1.0));
    verts[i].x += fx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y += fy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z += fz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                    age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 1200; s++) step();

addEventListener('click', () => { paused = !paused; });

// ─────────── parity-violation timing
const CYCLE   = 9.0;
const VIO_DUR = 2.5;
const FLASH_T = 0.35;

function vioEnvelope(t){
  const ph = t % CYCLE;
  if (ph > VIO_DUR) return 0;
  return Math.pow(Math.sin(ph / VIO_DUR * Math.PI), 2);
}
function onsetFlash(t){
  const ph = t % CYCLE;
  if (ph > FLASH_T) return 0;
  return 1.0 - ph / FLASH_T;
}

// ─────────── ribbon builder
const GOLD   = new THREE.Color(0xc9a45a);
const VIOLET = new THREE.Color(0x7b4fbf);
let ribbonMesh = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// store base camera pos for shake offset
const baseCamPos = new THREE.Vector3();

const startT = performance.now();
function loop(){
  const t = (performance.now() - startT) / 1000;
  for (let s = 0; s < 4; s++) step();

  const vio   = vioEnvelope(t);
  const flash = onsetFlash(t);

  // pulse light on violation onset
  pulseLight.intensity = flash * 1.8;
  // update pulse light position to centroid
  let cxP=0, cyP=0, czP=0;
  for (const v of verts){ cxP+=v.x; cyP+=v.y; czP+=v.z; }
  cxP/=Math.max(verts.length,1); cyP/=Math.max(verts.length,1); czP/=Math.max(verts.length,1);
  pulseLight.position.set(cxP, cyP, czP);

  // alternate which chirality gets violated each cycle
  const twistSign = (Math.floor(t / CYCLE) % 2 === 0) ? 1 : -1;

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N = Math.min(1200, verts.length * 3);

    const positions = new Float32Array(N * 2 * 3);
    const colors    = new Float32Array(N * 2 * 3);
    const indices   = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < N; i++){
      const tt = i / N;
      const p  = curve.getPointAt(tt);
      const tan = curve.getTangentAt(tt).normalize();
      let lat = new THREE.Vector3().crossVectors(tan, up);
      if (lat.lengthSq() < 0.001) lat.set(1, 0, 0);
      lat.normalize();

      // base width ~0.35 half-width (critic: widen from 0.18)
      const flare = 0.30 + 0.10 * Math.sin(tt * 32.0 + t * 0.4);

      // asymmetric width during violation — one edge swells, other shrinks
      const asym = vio * 0.10 * Math.sin(tt * 6.0 + t * 1.8) * twistSign;
      const wL = flare + asym;
      const wR = flare - asym;

      let left, right;

      if (vio > 0.01){
        // twist the ribbon around its tangent during violation
        const biN = new THREE.Vector3().crossVectors(tan, lat).normalize();
        const twA = vio * 0.18 * Math.sin(tt * 10.0 + t * 1.2) * twistSign;
        const rotLat = lat.clone().multiplyScalar(Math.cos(twA))
                       .addScaledVector(biN, Math.sin(twA));
        left  = p.clone().addScaledVector(rotLat, -wL);
        right = p.clone().addScaledVector(rotLat,  wR);
      } else {
        left  = p.clone().addScaledVector(lat, -wL);
        right = p.clone().addScaledVector(lat,  wR);
      }

      positions[i*6]   = left.x;  positions[i*6+1] = left.y;  positions[i*6+2] = left.z;
      positions[i*6+3] = right.x; positions[i*6+4] = right.y; positions[i*6+5] = right.z;

      // vertex colors: gold vs violet split during violation
      const lc = new THREE.Color().copy(GOLD);
      const rc = new THREE.Color().copy(GOLD);
      if (vio > 0.01) rc.lerp(VIOLET, vio);
      // onset flash: both edges briefly brighten
      if (flash > 0.01){
        lc.lerp(new THREE.Color(0xfff8e0), flash * 0.3);
        rc.lerp(new THREE.Color(0xc8a0ff), flash * 0.4);
      }
      colors[i*6]   = lc.r; colors[i*6+1] = lc.g; colors[i*6+2] = lc.b;
      colors[i*6+3] = rc.r; colors[i*6+4] = rc.g; colors[i*6+5] = rc.b;
    }
    for (let i = 0; i < N; i++){
      const ni = (i+1) % N;
      indices.push(i*2, i*2+1, ni*2);
      indices.push(i*2+1, ni*2+1, ni*2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); ribbonMesh.material.dispose(); }

    // emissive shifts during violation
    const emCol = new THREE.Color(0x2a1a06);
    if (flash > 0.01) emCol.lerp(new THREE.Color(0x6040c0), flash * 0.5);
    else if (vio > 0.01) emCol.lerp(new THREE.Color(0x301848), vio * 0.3);

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      emissive: emCol,
      roughness: 0.28,
      metalness: 0.72,
      side: THREE.DoubleSide,
    });
    ribbonMesh = new THREE.Mesh(g, mat);
    scene.add(ribbonMesh);
  }

  // camera tracking centroid
  const targetY = Math.max(cyP, 2.0);
  controls.target.x += (cxP - controls.target.x) * 0.03;
  controls.target.y += (targetY - controls.target.y) * 0.04;
  controls.target.z += (czP - controls.target.z) * 0.03;
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  // camera tremor on violation onset (critic: add shake so viewer catches the swerve)
  if (flash > 0.01){
    const shk = flash * 0.12;
    camera.position.x += (Math.random()-0.5) * shk;
    camera.position.y += (Math.random()-0.5) * shk * 0.5;
    camera.position.z += (Math.random()-0.5) * shk;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
