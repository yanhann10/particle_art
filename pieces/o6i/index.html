<body>
<div class="id">o6i · Chladni nodal figures — sand settling on resonant plate</div>
<div class="hint">click to cycle resonant mode · hold space for continuous hum</div>
<div class="src">Ernst Chladni, Entdeckungen über die Theorie des Klanges (1787)<br>Nigel Stanford 'Cymatics' (2014)<br>eigenmode-driven self-organization</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Chladni plate simulation: 50k sand particles on a vibrating square plate settle
// into nodal lines (where eigenmode u=0). Physics: each particle moves along −∇|u|
// toward nearest nodal line, plus Brownian jitter. Pattern snaps from chaos to
// crystalline geometry as mode (m,n) changes.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 8, 10);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b09);
document.body.appendChild(renderer.domElement);

// ────────────── PLATE GEOMETRY — dark oxidized bronze square
const plateSize = 6.0;
const plateMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(plateSize, plateSize, 1, 1),
  new THREE.MeshStandardMaterial({
    color: 0x1a1410, metalness: 0.85, roughness: 0.40, side: THREE.DoubleSide
  })
);
plateMesh.rotation.x = -Math.PI * 0.02; // slight tilt toward viewer
scene.add(plateMesh);

// ────────────── LIGHTING — single warm point above, cool ambient
const ambient = new THREE.AmbientLight(0x3a3632, 0.30);
scene.add(ambient);
const key = new THREE.PointLight(0xffeedd, 1.8, 0, 2);
key.position.set(-3, 7, 4);
scene.add(key);

// ────────────── CHLADNI EIGENMODE — plate vibration u(x,y) = cos(mπx/L)cos(nπy/L) − cos(nπx/L)cos(mπy/L)
// Nodal lines where u=0; particles settle there. Classic modes produce rosettes, grids, stars.
let modeM = 3, modeN = 2; // starting mode (3,2) — six-pointed star
let targetM = modeM, targetN = modeN;
let modePhase = 0; // time-varying phase for vibration amplitude

function eigenmode(x, y, m, n, L, phase){
  // normalized coords [-1,1]
  const pi = Math.PI;
  const u = Math.cos(m * pi * x / L) * Math.cos(n * pi * y / L)
          - Math.cos(n * pi * x / L) * Math.cos(m * pi * y / L);
  // multiply by sin(phase) to simulate oscillation
  return u * Math.sin(phase);
}

function eigenmodeGradient(x, y, m, n, L, phase){
  const pi = Math.PI;
  const eps = 0.01;
  const u0 = eigenmode(x, y, m, n, L, phase);
  const ux = (eigenmode(x + eps, y, m, n, L, phase) - u0) / eps;
  const uy = (eigenmode(x, y + eps, m, n, L, phase) - u0) / eps;
  return { dx: ux, dy: uy };
}

// ────────────── SAND PARTICLES — 50k white grains
const N = 50000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 2); // vx, vy in plate space
const seeds = new Float32Array(N);

for (let i = 0; i < N; i++){
  // spawn randomly across plate
  positions[i*3]     = (Math.random() - 0.5) * plateSize;
  positions[i*3 + 1] = 0.01; // just above plate surface
  positions[i*3 + 2] = (Math.random() - 0.5) * plateSize;
  velocities[i*2]    = 0;
  velocities[i*2+1]  = 0;
  seeds[i]           = Math.random();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vSpeed;
    varying float vSeed;
    void main(){
      vec3 p = position;
      // slight Brownian jitter in z (particles don't lie perfectly flat)
      p.y += sin(uTime * 3.0 + seed * 6.28) * 0.004;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vSpeed = length(vec2(p.x, p.z)) * 0.1; // distance from center as proxy for speed
      vSeed = seed;
      gl_PointSize = (1.0 + 0.4 * seed) * uPixel * (6.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSpeed;
    varying float vSeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 22.0);
      // sand: pale cream-white with slight warm tint
      vec3 col = vec3(0.98, 0.94, 0.88);
      // particles near nodal lines glow slightly brighter (higher density)
      float glow = 0.75 + 0.25 * (1.0 - vSpeed);
      gl_FragColor = vec4(col * glow, a * 0.90);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── PHYSICS UPDATE — particles move toward nodal lines
let lastTime = performance.now();
function updateParticles(dt){
  const L = plateSize;
  const damping = 0.92; // velocity damping per frame
  const forceScale = 2.5; // strength of gradient descent
  const brownian = 0.015; // random jitter

  for (let i = 0; i < N; i++){
    let x = positions[i*3];
    let z = positions[i*3 + 2];
    let vx = velocities[i*2];
    let vy = velocities[i*2 + 1];

    // compute gradient of |u| and move downhill
    const grad = eigenmodeGradient(x, z, modeM, modeN, L, modePhase);
    const mag = Math.sqrt(grad.dx * grad.dx + grad.dy * grad.dy);
    if (mag > 0.001){
      vx -= (grad.dx / mag) * forceScale * dt;
      vy -= (grad.dy / mag) * forceScale * dt;
    }

    // Brownian motion
    vx += (Math.random() - 0.5) * brownian;
    vy += (Math.random() - 0.5) * brownian;

    // damping
    vx *= damping;
    vy *= damping;

    // integrate position
    x += vx * dt;
    z += vy * dt;

    // clamp to plate bounds with soft reflection
    if (Math.abs(x) > L * 0.5){
      x = Math.sign(x) * L * 0.5;
      vx *= -0.5;
    }
    if (Math.abs(z) > L * 0.5){
      z = Math.sign(z) * L * 0.5;
      vy *= -0.5;
    }

    positions[i*3]     = x;
    positions[i*3 + 2] = z;
    velocities[i*2]    = vx;
    velocities[i*2+1]  = vy;
  }

  geom.attributes.position.needsUpdate = true;
}

// ────────────── MODE CYCLING — classic Chladni modes
const modes = [
  {m:3, n:2}, {m:4, n:2}, {m:5, n:3}, {m:6, n:3}, {m:7, n:4},
  {m:2, n:2}, {m:3, n:3}, {m:4, n:4}, {m:5, n:5}, {m:6, n:6}
];
let modeIndex = 0;

function nextMode(){
  modeIndex = (modeIndex + 1) % modes.length;
  targetM = modes[modeIndex].m;
  targetN = modes[modeIndex].n;
}

addEventListener('click', () => {
  nextMode();
});

let spaceHeld = false;
addEventListener('keydown', (e) => {
  if (e.code === 'Space') spaceHeld = true;
});
addEventListener('keyup', (e) => {
  if (e.code === 'Space') spaceHeld = false;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ────────────── ANIMATION LOOP
const start = performance.now();
function loop(now){
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  uniforms.uTime.value = t;

  // smooth mode transition
  const modeBlend = 0.08;
  modeM += (targetM - modeM) * modeBlend;
  modeN += (targetN - modeN) * modeBlend;

  // vibration phase — continuous hum when space held, else slow cycle
  if (spaceHeld){
    modePhase += dt * 22.0; // fast oscillation
  } else {
    modePhase += dt * 3.5; // slow drift
  }

  updateParticles(dt);

  // slow camera orbit — viewing the plate from slightly above
  const camRadius = 12;
  const camAngle = t * 0.08;
  camera.position.x = Math.sin(camAngle) * camRadius * 0.3;
  camera.position.z = Math.cos(camAngle) * camRadius;
  camera.position.y = 8 + Math.sin(t * 0.12) * 1.0;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
