<title>bew · Five-column Gaussian spread</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);

  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }

</style>

<body>
<div class="id">bew</div>
<div class="hint">click to pulse · drag for vascular tension</div>
<div class="src">5-column irregular Gaussian X-spread (1.4–2.2σ per column) · biomorphic motion</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// User directive: Five-column irregular Gaussian spread layout — structurally distinct
// from uniform grids, worth preserving as a particle arrangement primitive.
// User iteration feedback: atmosphere (parchment/grain/light/dust) reads beautifully — keep it.
// The form's MOTION needs to be more BIOMORPHIC: vascular pulsing, organic breathing,
// peristalsis, slow tidal expansion/contraction — not algorithmic line redraws.
// Think living tissue, not pattern playback.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── FIVE COLUMNS with asymmetric Gaussian X-spreads
// Each column: center X position, sigma_x (Gaussian spread in X), sigma_y (vertical spread),
// particle density (count per column), and a unique color tone (warm sumi-ink palette).
const N = 80000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
const colIds    = new Float32Array(N);

const columns = [
  { x: -5.0,  sigX: 1.4,  sigY: 4.2, density: 0.18, col: [0.12, 0.08, 0.05] }, // tight, dark
  { x: -2.2,  sigX: 2.2,  sigY: 4.8, density: 0.22, col: [0.22, 0.14, 0.08] }, // widest, warm amber
  { x:  0.5,  sigX: 1.7,  sigY: 4.5, density: 0.20, col: [0.16, 0.10, 0.06] }, // mid
  { x:  3.3,  sigX: 1.9,  sigY: 5.0, density: 0.21, col: [0.20, 0.12, 0.07] }, // slightly wide
  { x:  6.0,  sigX: 1.5,  sigY: 4.0, density: 0.19, col: [0.14, 0.09, 0.05] }  // narrow, cooler
];

function boxMuller() {
  let u = 0, v = 0;
  while(u === 0) u = Math.random();
  while(v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

let written = 0;
columns.forEach((col, cIdx) => {
  const count = Math.floor(N * col.density);
  for (let i = 0; i < count && written < N; i++){
    const x = col.x + boxMuller() * col.sigX;
    const y = boxMuller() * col.sigY;
    const z = (Math.random() - 0.5) * 0.8; // slight depth
    positions[written*3]     = x;
    positions[written*3 + 1] = y;
    positions[written*3 + 2] = z;
    seeds[written]           = Math.random();
    colIds[written]          = cIdx;
    written++;
  }
});
for (let i = written; i < N; i++){
  positions[i*3] = 0; positions[i*3+1] = -20; positions[i*3+2] = 0;
  seeds[i] = 0; colIds[i] = 0;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('colId',    new THREE.BufferAttribute(colIds, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uPointer:{ value: new THREE.Vector2(0, 0) },
  uPulse:  { value: 0 },
  uCol0:   { value: new THREE.Vector3(...columns[0].col) },
  uCol1:   { value: new THREE.Vector3(...columns[1].col) },
  uCol2:   { value: new THREE.Vector3(...columns[2].col) },
  uCol3:   { value: new THREE.Vector3(...columns[3].col) },
  uCol4:   { value: new THREE.Vector3(...columns[4].col) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uPulse;
    attribute float seed;
    attribute float colId;
    varying float vDepth;
    varying float vSeed;
    varying float vColId;
    varying float vGlow;

    // Organic motion primitives: vascular pulse, peristaltic wave, breathing
    void main(){
      vec3 p = position;
      float t = uTime * 0.25 + seed * 6.28;
      int cid = int(colId);

      // VASCULAR PULSE — radial expansion/contraction from column center (heart-beat)
      float phase = uTime * 1.2 + float(cid) * 0.6;
      float pulse = 0.5 + 0.5 * sin(phase);
      float radialPulse = pulse * 0.12 * (1.0 + uPulse * 2.0);
      vec2 toCenter = p.xy - vec2(0.0, 0.0); // center of frame
      p.xy += normalize(toCenter + vec2(0.01)) * radialPulse * length(toCenter) * 0.08;

      // PERISTALSIS — traveling wave vertically (like gut contractions pushing upward)
      float peristalticPhase = uTime * 0.4 - p.y * 0.3 + seed * 3.14;
      float squeeze = sin(peristalticPhase);
      p.x += squeeze * 0.10 * exp(-abs(p.y) * 0.15);

      // BREATHING — slow expansion along Y (ribcage rise/fall)
      float breathPhase = uTime * 0.15;
      float breath = sin(breathPhase);
      p.y *= 1.0 + breath * 0.08;

      // POINTER TENSION — tissue pulls toward pointer (like fascia under skin)
      vec2 toPointer = uPointer - p.xy * 0.08;
      float tension = smoothstep(1.5, 0.0, length(toPointer));
      p.xy += toPointer * tension * 0.18;

      // Depth modulation — columns at different Z planes breathe independently
      float depthBreath = sin(uTime * 0.18 + float(cid) * 0.8) * 0.15;
      p.z += depthBreath;

      vSeed = seed;
      vColId = colId;
      vGlow = pulse * (1.0 + uPulse * 3.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      float sizePulse = 1.0 + pulse * 0.4 * (1.0 + uPulse * 1.5);
      gl_PointSize = (1.2 + 0.6 * sin(t * 0.5)) * uPixel * (6.0 / vDepth) * sizePulse;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uCol0, uCol1, uCol2, uCol3, uCol4;
    varying float vDepth;
    varying float vSeed;
    varying float vColId;
    varying float vGlow;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0);

      // Column-specific ink tone
      int cid = int(vColId + 0.5);
      vec3 col = uCol0;
      if (cid == 1) col = uCol1;
      else if (cid == 2) col = uCol2;
      else if (cid == 3) col = uCol3;
      else if (cid == 4) col = uCol4;

      // Pulse glow — particles brighten during vascular pulse
      col = mix(col, col * 2.0, vGlow * 0.35);

      // Depth haze — distant particles fade toward parchment
      float haze = clamp((vDepth - 10.0) / 7.0, 0.0, 0.60);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      gl_FragColor = vec4(col, a * 0.76 * (1.0 - haze * 0.5));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── DUST MOTES (inherited from parent — window light atmosphere)
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 16;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 10;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 8.0;
      float sy =  p.y / 5.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── INTERACTION — click triggers vascular pulse
let pulseDecay = 0;
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  pulseDecay = 1.0; // trigger immediate pulse
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // Pulse decay — exponential fall-off after click
  if (pulseDecay > 0.001){
    pulseDecay *= 0.94;
    uniforms.uPulse.value = pulseDecay;
  } else {
    uniforms.uPulse.value = 0;
  }

  // Camera breathes — slow drift simulating viewer's subtle head movement
  camera.position.x = Math.sin(t * 0.06) * 0.5;
  camera.position.y = 0.3 + Math.sin(t * 0.05 + 1.2) * 0.3;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
