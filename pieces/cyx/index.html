<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liminal · vascular fracture · chain from 9qc</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">cyx</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">liminal morph of 9qc · fracture geometry</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── LIMINAL: the growth ring fractures into two interleaved strands at a
   climbing threshold boundary. As the phase tide rises through the tower
   (driven by vertex age), the single vascular loop splits where new growth
   emerges, creating a geometric threshold between unified and bifurcated
   form. The phase light intensity tracks per-vertex age, making the
   transition visible as it climbs. ── */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.04);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff0e8, 0.9);
lightKey.position.set(5, 10, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const lightRim = new THREE.DirectionalLight(0xd8a868, 0.5);
lightRim.position.set(-5, 3, -5);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth
const MAX_VERTS = 1500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0, strand: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      if (v.strand !== u.strand && u.age > 0.3) continue;
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    if (a.strand === v.strand && b.strand === v.strand){
      dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
      dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
      dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
    }
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x-cx, oy = verts[i].y-cy, oz = verts[i].z-cz;
    const d = Math.hypot(ox, oy, oz)+1e-6;
    dx[i] += (ox/d)*PRESSURE;
    dy[i] += (oy/d)*PRESSURE*0.4;
    dz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      const newV = {
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age)*0.5,
        strand: a.strand
      };
      if (newV.age > 0.22){
        newV.strand = Math.random() < 0.5 ? 0 : 1;
      }
      grown.push(newV);
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── liminal phase function (slow breathing cycle)
function liminalPhase(t){
  return 0.5 + 0.5 * Math.sin(t * 0.24);
}

// ─────────── vascular tube (split into two meshes for bifurcated strands)
let tubeMesh0 = null, tubeMesh1 = null;
const colorBase = new THREE.Color(0xb04438);
const colorPhase = new THREE.Color(0x88a0b8);
const emissiveBase = new THREE.Color(0x2a0808);
const emissivePhase = new THREE.Color(0x1a2833);

function buildStrandMaterial(baseHue){
  return new THREE.ShaderMaterial({
    uniforms: {
      uPhase: { value: 0.0 },
      uColorBase: { value: new THREE.Color(baseHue) },
      uColorPhase: { value: colorPhase.clone() },
      uEmissiveBase: { value: emissiveBase.clone() },
      uEmissivePhase: { value: emissivePhase.clone() },
      uFogColor: { value: new THREE.Color(0x0a0608) },
      uFogDensity: { value: 0.04 }
    },
    vertexShader: `
      attribute float vAge;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying float vAgeOut;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewPos = mvPos.xyz;
        vAgeOut = vAge;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uPhase;
      uniform vec3 uColorBase;
      uniform vec3 uColorPhase;
      uniform vec3 uEmissiveBase;
      uniform vec3 uEmissivePhase;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying float vAgeOut;
      void main(){
        float ageMix = smoothstep(0.15, 0.35, vAgeOut);
        float phaseMix = uPhase * ageMix;
        vec3 col = mix(uColorBase, uColorPhase, phaseMix);
        vec3 emit = mix(uEmissiveBase, uEmissivePhase, phaseMix);
        vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
        float diff = max(0.0, dot(vNormal, lightDir)) * 0.7 + 0.3;
        vec3 rgb = col * diff + emit;
        float fogDist = length(vViewPos);
        float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDist * fogDist);
        rgb = mix(rgb, uFogColor, fogFactor);
        float alpha = mix(1.0, 0.35, phaseMix * 0.6);
        gl_FragColor = vec4(rgb, alpha);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide
  });
}

const mat0 = buildStrandMaterial(0xb04438);
const mat1 = buildStrandMaterial(0xa85048);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let prevTime = start;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  for (let s = 0; s < 2; s++) step();

  const phase = liminalPhase(t);
  mat0.uniforms.uPhase.value = phase;
  mat1.uniforms.uPhase.value = phase;

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){
      if (v.y < yMin) yMin = v.y;
      if (v.y > yMax) yMax = v.y;
    }
    const yRange = Math.max(yMax - yMin, 0.1);

    const verts0 = verts.filter(v => v.strand === 0);
    const verts1 = verts.filter(v => v.strand === 1);

    function buildStrand(vertList, mat, existingMesh){
      if (vertList.length < 3) return existingMesh;
      const pts = vertList.map(v => new THREE.Vector3(v.x, v.y, v.z));
      const ages = vertList.map(v => v.age);
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
      const N_SAMPLES = Math.min(500, vertList.length * 2);
      const RADIAL = 8;
      const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
      const ageAttrib = new Float32Array(N_SAMPLES * RADIAL);
      const indices = [];
      const up = new THREE.Vector3(0, 1, 0);
      const pulse = 1.0 + 0.10 * Math.sin(t * 1.6);

      for (let i = 0; i < N_SAMPLES; i++){
        const tt = i / (N_SAMPLES - 1);
        const p = curve.getPointAt(tt);
        const idx = Math.floor(tt * (vertList.length - 1));
        const localAge = ages[Math.min(idx, ages.length - 1)];
        const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
        let r = 0.40 * (1 - heightFrac * 0.78);
        const node = Math.sin(tt * 22.0) * 0.5 + 0.5;
        r *= (1.0 + 0.18 * Math.pow(node, 6));
        r *= pulse;
        const tangent = curve.getTangentAt(tt).normalize();
        const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
        for (let j = 0; j < RADIAL; j++){
          const ang = (j / RADIAL) * Math.PI * 2;
          const v = new THREE.Vector3()
            .copy(normal).multiplyScalar(Math.cos(ang) * r)
            .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
            .add(p);
          positions[(i*RADIAL+j)*3]     = v.x;
          positions[(i*RADIAL+j)*3 + 1] = v.y;
          positions[(i*RADIAL+j)*3 + 2] = v.z;
          ageAttrib[i*RADIAL+j] = localAge;
        }
      }
      for (let i = 0; i < N_SAMPLES - 1; i++){
        for (let j = 0; j < RADIAL; j++){
          const nj = (j+1) % RADIAL;
          const a = i*RADIAL+j, b = i*RADIAL+nj;
          const c = (i+1)*RADIAL+j, d = (i+1)*RADIAL+nj;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('vAge', new THREE.BufferAttribute(ageAttrib, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      if (existingMesh){ scene.remove(existingMesh); existingMesh.geometry.dispose(); }
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      return mesh;
    }

    tubeMesh0 = buildStrand(verts0, mat0, tubeMesh0);
    tubeMesh1 = buildStrand(verts1, mat1, tubeMesh1);
  }

  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
