<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4ir · suspended threads · architectural memory</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">4ir</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Shiota thread installation: 15000 line segments, each connecting a scattered
// anchor point to one of 5 fixed focal points suspended in architectural void.
// Pure crimson (#9c1f1f) on black, additive blending, low opacity so density
// reads as volumetric memory. Threads gather at foci like emotional gravity wells.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 18, 42);
camera.lookAt(0, 12, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Ambient light barely visible — threads themselves emit the color
scene.add(new THREE.AmbientLight(0x1a0a0a, 0.3));

// Five focal anchors suspended at different heights — emotional centers
const focalPoints = [
  new THREE.Vector3(0, 22, 0),      // high center
  new THREE.Vector3(-8, 16, -6),    // left mid
  new THREE.Vector3(9, 14, 5),      // right mid
  new THREE.Vector3(-5, 9, 8),      // lower left
  new THREE.Vector3(6, 11, -7),     // lower right
];

// Generate 15000 anchor positions scattered in architectural volume
// Concentration increases toward bottom (pooling effect)
const NUM_THREADS = 15000;
const anchorPositions = [];

for (let i = 0; i < NUM_THREADS; i++){
  // Vertical bias: more density below y=10
  const yBias = Math.pow(Math.random(), 1.8);
  const x = (Math.random() - 0.5) * 32;
  const y = yBias * 30 - 2;
  const z = (Math.random() - 0.5) * 32;
  anchorPositions.push(new THREE.Vector3(x, y, z));
}

// Shiota crimson
const threadColor = new THREE.Color(0x9c1f1f);

// Build line segments: each anchor connects to nearest focal point
// (with some randomness to prevent perfect ray structure)
const lineMaterial = new THREE.LineBasicMaterial({
  color: threadColor,
  opacity: 0.08,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const threadGroup = new THREE.Group();

for (let i = 0; i < NUM_THREADS; i++){
  const anchor = anchorPositions[i];
  
  // Find nearest focal point with slight random bias
  let minDist = Infinity;
  let targetFocal = focalPoints[0];
  
  for (const focal of focalPoints){
    const dist = anchor.distanceTo(focal) * (0.85 + Math.random() * 0.3);
    if (dist < minDist){
      minDist = dist;
      targetFocal = focal;
    }
  }
  
  const geometry = new THREE.BufferGeometry().setFromPoints([anchor, targetFocal]);
  const line = new THREE.Line(geometry, lineMaterial);
  
  // Store original positions for sway animation
  line.userData.anchor = anchor.clone();
  line.userData.focal = targetFocal.clone();
  line.userData.phase = Math.random() * Math.PI * 2;
  
  threadGroup.add(line);
}

scene.add(threadGroup);

// Add small sphere markers at focal points — barely visible, just structure
const focalMaterial = new THREE.MeshBasicMaterial({
  color: 0x9c1f1f,
  opacity: 0.15,
  transparent: true,
});

for (const focal of focalPoints){
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    focalMaterial
  );
  sphere.position.copy(focal);
  scene.add(sphere);
}

// Pointer tracking for subtle sway
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Subtle breathing camera drift
  camera.position.x = Math.sin(t * 0.08) * 2;
  camera.position.z = 42 + Math.cos(t * 0.06) * 3;
  camera.lookAt(0, 12 + Math.sin(t * 0.1) * 0.5, 0);
  
  // Update thread positions with gentle sway influenced by pointer
  threadGroup.children.forEach((line, i) => {
    const anchor = line.userData.anchor;
    const focal = line.userData.focal;
    const phase = line.userData.phase;
    
    // Sway amplitude decreases with height (threads at top more taut)
    const swayAmount = Math.max(0, 1 - anchor.y / 25) * 0.3;
    
    const sway = new THREE.Vector3(
      Math.sin(t * 0.6 + phase) * swayAmount + pointer.x * 0.15,
      Math.sin(t * 0.4 + phase * 1.3) * swayAmount * 0.3,
      Math.cos(t * 0.5 + phase * 0.7) * swayAmount + pointer.y * 0.1
    );
    
    const swayedAnchor = anchor.clone().add(sway);
    
    const positions = line.geometry.attributes.position;
    positions.setXYZ(0, swayedAnchor.x, swayedAnchor.y, swayedAnchor.z);
    positions.setXYZ(1, focal.x, focal.y, focal.z);
    positions.needsUpdate = true;
  });
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
