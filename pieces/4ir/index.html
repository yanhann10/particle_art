<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4ir · suspended threads · architectural memory</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">4ir</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Shiota thread installation: 15000 line segments, each connecting a scattered
// anchor point to one of 5 fixed focal points suspended in architectural void.
// Pure crimson (#9c1f1f) on black, additive blending, low opacity so density
// reads as volumetric memory. Threads gather at foci like emotional gravity wells.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 18, 42);
camera.lookAt(0, 12, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Ambient light barely visible — threads themselves emit the color
scene.add(new THREE.AmbientLight(0x1a0a0a, 0.3));

// Five focal anchors suspended at different heights — emotional centers
const focalPoints = [
  new THREE.Vector3(0, 22, 0),      // high center
  new THREE.Vector3(-8, 16, -6),    // left mid
  new THREE.Vector3(9, 14, 5),      // right mid
  new THREE.Vector3(-5, 9, 8),      // lower left
  new THREE.Vector3(6, 11, -7),     // lower right
];

// Generate 15000 anchor positions scattered in architectural volume
// Concentration increases toward bottom (pooling effect)
const NUM_THREADS = 15000;
const anchorPositions = [];

for (let i = 0; i < NUM_THREADS; i++){
  // Vertical bias: more density below y=10
  const yBias = Math.pow(Math.random(), 1.8);
  const x = (Math.random() - 0.5) * 32;
  const y = yBias * 30 - 2;
  const z = (Math.random() - 0.5) * 32;
  anchorPositions.push(new THREE.Vector3(x, y, z));
}

// Shiota crimson
const threadColor = new THREE.Color(0x9c1f1f);

// Build line segments: each anchor connects to nearest focal point
// (with some randomness to prevent perfect ray structure)
const lineMaterial = new THREE.LineBasicMaterial({
  color: threadColor,
  opacity: 0.08,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const threadGroup = new THREE.Group();

for (let i = 0; i < NUM_THREADS; i++){
  const anchor = anchorPositions[i];
  
  // Find nearest focal point with slight random bias
  let minDist = Infinity;
  let targetFocal = focalPoints[0];
  
  for (const focal of focalPoints){
    const dist = anchor.distanceTo(focal) * (0.85 + Math.random() * 0.3);
    if (dist < minDist){
      minDist = dist;
      targetFocal = focal;
    }
  }
  
  const geometry = new THREE.BufferGeometry().setFromPoints([anchor, targetFocal]);
  const line = new THREE.Line(geometry, lineMaterial);
  
  // Store original positions for sway animation
  line.userData.anchor = anchor.clone();
  line.userData.focal = targetFocal.clone();
  line.userData.phase = Math.random() * Math.PI * 2;
  
  threadGroup.add(line);
}

scene.add(threadGroup);

// Add small sphere markers at focal points — barely visible, just structure
const focalMaterial = new THREE.MeshBasicMaterial({
  color: 0x9c1f1f,
  opacity: 0.15,
  transparent: true,
});

for (const focal of focalPoints){
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    focalMaterial
  );
  sphere.position.copy(focal);
  scene.add(sphere);
}

// Pointer tracking for subtle sway
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Subtle breathing camera drift
  camera.position.x = Math.sin(t * 0.08) * 2;
  camera.position.z = 42 + Math.cos(t * 0.06) * 3;
  camera.lookAt(0, 12 + Math.sin(t * 0.1) * 0.5, 0);
  
  // Update thread positions with gentle sway influenced by pointer
  threadGroup.children.forEach((line, i) => {
    const anchor = line.userData.anchor;
    const focal = line.userData.focal;
    const phase = line.userData.phase;
    
    // Sway amplitude decreases with height (threads at top more taut)
    const swayAmount = Math.max(0, 1 - anchor.y / 25) * 0.3;
    
    const sway = new THREE.Vector3(
      Math.sin(t * 0.6 + phase) * swayAmount + pointer.x * 0.15,
      Math.sin(t * 0.4 + phase * 1.3) * swayAmount * 0.3,
      Math.cos(t * 0.5 + phase * 0.7) * swayAmount + pointer.y * 0.1
    );
    
    const swayedAnchor = anchor.clone().add(sway);
    
    const positions = line.geometry.attributes.position;
    positions.setXYZ(0, swayedAnchor.x, swayedAnchor.y, swayedAnchor.z);
    positions.setXYZ(1, focal.x, focal.y, focal.z);
    positions.needsUpdate = true;
  });
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
