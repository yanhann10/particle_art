<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ibt · fluid rail array</title>
<!-- MOTION: drift-breathe, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; color:#a89984; }
</style>
</head>
<body>
<div class="id">ibt</div>
<div class="hint">click to regenerate · curl rail membrane</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ── ibt: Fluid Rail Array ─────────────────────────────────────────────────
// 60 vertical particle rails whose X positions are continuously warped by a
// 2D curl flow field (from 2gl). Phase transition (fluid/particle) drives
// brightness & size. LED amber palette (from as2). Hard disc sprites for
// sharpness gate. Additive blending on pure black.

const FRUSTUM   = 28;
const N         = 80000;
const N_RAILS   = 60;
const PER_RAIL  = Math.ceil(N / N_RAILS); // ~1334

const scene    = new THREE.Scene();
const aspect   = innerWidth / innerHeight;
const camera   = new THREE.OrthographicCamera(
  FRUSTUM * aspect / -2, FRUSTUM * aspect / 2,
  FRUSTUM / 2, FRUSTUM / -2,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// ── Uniforms ─────────────────────────────────────────────────────────────
const uniforms = {
  uTime:       { value: 0.0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uGustAmp:    { value: 1.0 },  // wind burst multiplier (1..2)
  uSeed:       { value: 0.37 }, // per-regen random offset
};

// ── Shaders ──────────────────────────────────────────────────────────────
const vertexShader = `
  precision highp float;

  uniform float uTime;
  uniform float uPixel;
  uniform float uGustAmp;
  uniform float uSeed;

  attribute vec2  aBirth;   // (railBaseX + jitterX, jitterY) in world units
  attribute float aSeed;    // per-particle random in [0,1]
  attribute float aRailIdx; // 0..59

  varying vec3  vColor;
  varying float vAlpha;

  // ─── value noise ───────────────────────────────────────────────────────
  float hash21(vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 19.19);
    return fract(p.x * p.y);
  }

  float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }

  // ─── stream function & curl ────────────────────────────────────────────
  // ψ(p,t) = two octaves; curl = grad-perp of ψ
  float streamFunc(vec2 p, float t) {
    float n1 = vnoise(p * 0.8 + t * 0.15);
    float n2 = vnoise(p * 1.5 - t * 0.18 * vec2(1.0, 0.9));
    return n1 + n2 * 0.6;
  }

  vec2 curlField(vec2 p, float t) {
    const float eps = 0.008;
    float dx = streamFunc(p + vec2(eps, 0.0), t) - streamFunc(p - vec2(eps, 0.0), t);
    float dy = streamFunc(p + vec2(0.0, eps), t) - streamFunc(p - vec2(0.0, eps), t);
    // curl of 2D stream function: (∂ψ/∂y, -∂ψ/∂x)
    return vec2(dy, -dx) / (2.0 * eps);
  }

  void main() {
    float t = uTime * 0.28 + uSeed * 6.2831;

    // ── particle age fraction (seed-based cycling) ───────────────────────
    float age = fract(aSeed + uTime * 0.07);

    // ── curl displacement: swim along field for age steps ────────────────
    vec2 p = aBirth;
    // 4-step Euler integration along curl
    float dt = age * 0.25;
    vec2 c0 = curlField(p, t);
    p += c0 * dt * uGustAmp;
    vec2 c1 = curlField(p, t + dt);
    p += c1 * dt * uGustAmp;
    vec2 c2 = curlField(p, t + 2.0*dt);
    p += c2 * dt * uGustAmp;
    vec2 c3 = curlField(p, t + 3.0*dt);
    p += c3 * dt * uGustAmp;

    // clamp displacement to ±3 world units from birth rail X
    float dispX = clamp(p.x - aBirth.x, -3.0, 3.0);
    float dispY = clamp(p.y - aBirth.y, -2.0, 2.0);
    vec3 finalPos = vec3(aBirth.x + dispX, aBirth.y + dispY, 0.0);

    // ── phase transition (local density noise) ───────────────────────────
    float localDensity = vnoise(aBirth * 2.0 + uTime * 0.2 * vec2(1.0, 0.7));
    // 0=particle phase (sparse, dim), 1=fluid phase (dense, bright)
    float fluid = smoothstep(0.42, 0.58, localDensity);

    // ── LED amber palette ────────────────────────────────────────────────
    // LED amber base : rgb(240,160,32)  = vec3(0.941, 0.627, 0.125)
    // cream (fluid)  : rgb(248,240,220) = vec3(0.973, 0.941, 0.863)
    // rust-amber (p) : rgb(200,110,40)  = vec3(0.784, 0.431, 0.157)
    vec3 cBase  = vec3(0.941, 0.627, 0.125);
    vec3 cCream = vec3(0.973, 0.941, 0.863);
    vec3 cRust  = vec3(0.784, 0.431, 0.157);

    // Central rail zone (railIdx near center) pops brighter
    float railNorm = aRailIdx / 59.0;           // 0..1
    float centerBoost = 1.0 - abs(railNorm - 0.5) * 1.6; // peaked center
    centerBoost = clamp(centerBoost, 0.0, 1.0);

    vec3 col = mix(cRust, cBase, 0.5 + fluid * 0.5);
    col = mix(col, cCream, fluid * 0.45 + centerBoost * 0.15);

    vColor = col;

    // ── alpha & size ─────────────────────────────────────────────────────
    // particle phase: dim (0.22..0.32), fluid phase: bright (0.72..0.90)
    float baseAlpha = mix(0.27, 0.85, fluid) + centerBoost * 0.12;
    // Never below 0.20 (spec: "never dim below 0.2 alpha")
    baseAlpha = max(baseAlpha, 0.20);
    // Fade edges of age cycle (prevent pop-in)
    float ageFade = smoothstep(0.0, 0.08, age) * smoothstep(1.0, 0.90, age);
    vAlpha = baseAlpha * ageFade;

    // size: particle=1.8px, fluid=2.8px; center rails get +0.5
    float sz = mix(1.9, 2.9, fluid) + centerBoost * 0.6;
    gl_PointSize = uPixel * sz;

    gl_Position = projectionMatrix * modelViewMatrix * vec4(finalPos, 1.0);
  }
`;

const fragmentShader = `
  precision mediump float;

  varying vec3  vColor;
  varying float vAlpha;

  void main() {
    // HARD disc — NO gaussian falloff (sharpness gate)
    vec2  d = gl_PointCoord - 0.5;
    float r = length(d);
    if (r > 0.45) discard;
    // Tiny 1px antialiased rim only at the very edge (0.43..0.45)
    float rim = 1.0 - smoothstep(0.43, 0.45, r);
    gl_FragColor = vec4(vColor, vAlpha * rim);
  }
`;

// ── Geometry builder ─────────────────────────────────────────────────────
let geom, points;

function buildRailParticles(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const positions  = new Float32Array(N * 3);
  const aBirth     = new Float32Array(N * 2);
  const aSeed      = new Float32Array(N);
  const aRailIdx   = new Float32Array(N);

  let idx = 0;
  for (let r = 0; r < N_RAILS; r++) {
    // Rail base X: evenly spaced in [-11, +11]
    const baseX = -11.0 + (r / (N_RAILS - 1)) * 22.0;
    const count = (r < N_RAILS - 1) ? PER_RAIL : (N - idx);

    for (let p = 0; p < count && idx < N; p++) {
      // Small jitter around rail X (±0.15)
      const jx = (rng() - 0.5) * 0.30;
      // Uniform Y coverage along rail [-11, +11]
      const jy = -11.0 + rng() * 22.0;

      positions[idx * 3]     = baseX + jx;
      positions[idx * 3 + 1] = jy;
      positions[idx * 3 + 2] = 0.0;

      aBirth[idx * 2]     = baseX + jx;
      aBirth[idx * 2 + 1] = jy;

      aSeed[idx]    = rng();
      aRailIdx[idx] = r;
      idx++;
    }
  }

  return { positions, aBirth, aSeed, aRailIdx };
}

// ── ShaderMaterial ────────────────────────────────────────────────────────
const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite:  false,
  blending:    THREE.AdditiveBlending,
});

function regenerate() {
  const seed = Math.floor(Math.random() * 1e9);
  uniforms.uSeed.value = Math.random();

  const { positions, aBirth, aSeed, aRailIdx } = buildRailParticles(seed);

  if (!geom) {
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position',  new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('aBirth',    new THREE.BufferAttribute(aBirth,    2));
    geom.setAttribute('aSeed',     new THREE.BufferAttribute(aSeed,     1));
    geom.setAttribute('aRailIdx',  new THREE.BufferAttribute(aRailIdx,  1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aBirth.array.set(aBirth);
    geom.attributes.aBirth.needsUpdate = true;
    geom.attributes.aSeed.array.set(aSeed);
    geom.attributes.aSeed.needsUpdate = true;
    geom.attributes.aRailIdx.array.set(aRailIdx);
    geom.attributes.aRailIdx.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', regenerate);

// ── Resize ────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  const a = innerWidth / innerHeight;
  camera.left   = FRUSTUM * a / -2;
  camera.right  = FRUSTUM * a /  2;
  camera.top    = FRUSTUM /  2;
  camera.bottom = FRUSTUM / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

// ── Wind gust ─────────────────────────────────────────────────────────────
// Every 15 s: 2× amplitude boost decaying over 3 s
let gustEnd = -Infinity;
let gustActive = false;

function triggerGust() {
  gustEnd = performance.now() + 3000;
  gustActive = true;
}

setInterval(triggerGust, 15000);

// ── Camera parallax ───────────────────────────────────────────────────────
// Slow sine drift ±1.5 over 40 s; orthographic so no perspective warp
const CAM_DRIFT_AMP  = 1.5;
const CAM_DRIFT_FREQ = Math.PI * 2 / 40; // 40s period

// ── Render loop ───────────────────────────────────────────────────────────
const startTime = performance.now();

function loop() {
  requestAnimationFrame(loop);

  const now = performance.now();
  const elapsed = (now - startTime) / 1000;
  uniforms.uTime.value = elapsed;

  // Gust amplitude
  if (gustActive) {
    const remain = gustEnd - now;
    if (remain > 0) {
      // 0..1 within the 3s gust
      const t = 1.0 - remain / 3000;
      // Triangle: ramp up first 0.3, hold 0.4, decay 0.3
      let amp;
      if (t < 0.3)      amp = 1.0 + (t / 0.3);
      else if (t < 0.7) amp = 2.0;
      else               amp = 1.0 + (1.0 - t) / 0.3;
      uniforms.uGustAmp.value = amp;
    } else {
      uniforms.uGustAmp.value = 1.0;
      gustActive = false;
    }
  }

  // Camera drift (X only, orthographic)
  camera.position.x = Math.sin(now * 0.001 * CAM_DRIFT_FREQ * 1000 / (2 * Math.PI)) * CAM_DRIFT_AMP;
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){var jobId=d.job_id||'';var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>
