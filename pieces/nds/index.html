<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nds · Shiota — Descent into the Root-Web</title>
<!-- MOTION: disperse, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">nds</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.003);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060202, 0.02));

const pL = new THREE.PointLight(0xffd0a0, 0.09, 40, 1.8);
pL.position.set(1.5, 8, -0.5);
scene.add(pL);

let seed = 73195284;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — pale moon in a circulatory cosmos
const sphereCenter = new THREE.Vector3(0.3, 5.0, -0.8);
const SPHERE_R = 1.9;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf2eade,
    emissive: 0xede4d0,
    emissiveIntensity: 0.65,
    roughness: 0.96,
    metalness: 0.0,
    transparent: true,
    opacity: 0.34
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.6, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf6ec, transparent: true, opacity: 0.05 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// Suspension threads — 8 fine dark lines from ceiling
const suspPts = [];
for(let i = 0; i < 8; i++){
  const ox = (rng()-0.5)*0.5;
  const oz = (rng()-0.5)*0.4;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.02, sphereCenter.y + SPHERE_R + 0.03, sphereCenter.z + oz*0.02
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.5
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi)*Math.cos(theta) * SPHERE_R,
    sphereCenter.y + Math.sin(phi)*Math.sin(theta) * SPHERE_R,
    sphereCenter.z + Math.cos(phi) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron vertices projected into room volume
// (Mohr: let geometry generate the topology)
const anchors = [];

// Golden ratio for icosahedron
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,3*phi],[0,1,-3*phi],[0,-1,3*phi],[0,-1,-3*phi],
  [1,3*phi,0],[1,-3*phi,0],[-1,3*phi,0],[-1,-3*phi,0],
  [3*phi,0,1],[3*phi,0,-1],[-3*phi,0,1],[-3*phi,0,-1],
  [2,(1+2*phi),phi],[2,(1+2*phi),-phi],[-2,(1+2*phi),phi],[-2,(1+2*phi),-phi],
  [2,-(1+2*phi),phi],[2,-(1+2*phi),-phi],[-2,-(1+2*phi),phi],[-2,-(1+2*phi),-phi],
  [(1+2*phi),phi,2],[(1+2*phi),-phi,2],[(1+2*phi),phi,-2],[(1+2*phi),-phi,-2],
  [-(1+2*phi),phi,2],[-(1+2*phi),-phi,2],[-(1+2*phi),phi,-2],[-(1+2*phi),-phi,-2],
  [phi,2,(1+2*phi)],[phi,-2,(1+2*phi)],[phi,2,-(1+2*phi)],[phi,-2,-(1+2*phi)],
  [-phi,2,(1+2*phi)],[-phi,-2,(1+2*phi)],[-phi,2,-(1+2*phi)],[-phi,-2,-(1+2*phi)],
];

// Project truncated-icosahedron vertices at multiple scales
const scales = [2.8, 5.5, 9.0, 14.0];
for(const s of scales){
  for(const v of icoVerts){
    const mag = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
    const nx = v[0]/mag, ny = v[1]/mag, nz = v[2]/mag;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + nx * s + (rng()-0.5)*0.4,
      sphereCenter.y + ny * s + (rng()-0.5)*0.4,
      sphereCenter.z + nz * s + (rng()-0.5)*0.4
    ));
  }
}

// Add wall anchors for architectural span
while(anchors.length < 400){
  const p = rng() < 0.5 ? wallPt() : wallPt().clone().lerp(sphereCenter, 0.05 + rng()*0.25);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 4, sphereCenter.y - 4, sphereCenter.z + 5), r: 2.6 },
  { pos: new THREE.Vector3(sphereCenter.x + 5, sphereCenter.y + 6, sphereCenter.z - 4), r: 2.0 },
  { pos: new THREE.Vector3(sphereCenter.x + 2, sphereCenter.y - 7, sphereCenter.z - 5), r: 2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── RADIAL QUANTIZATION — threads near sphere snap to 15° angular increments,
// threads at walls are free (Molnár: one gradient, order to chaos)
function quantizeDir(origin, target){
  const distToSphere = origin.distanceTo(sphereCenter);
  if(distToSphere > 12) return target; // far = free

  const blend = Math.max(0, 1.0 - distToSphere / 12.0);
  if(blend < 0.1) return target;

  const dir = target.clone().sub(origin);
  const len = dir.length();
  if(len < 0.01) return target;
  dir.normalize();

  // Quantize azimuth angle to 15° steps
  const az = Math.atan2(dir.z, dir.x);
  const step = Math.PI / 12; // 15°
  const qAz = Math.round(az / step) * step;
  const qDir = new THREE.Vector3(
    Math.cos(qAz) * Math.sqrt(dir.x*dir.x + dir.z*dir.z),
    dir.y,
    Math.sin(qAz) * Math.sqrt(dir.x*dir.x + dir.z*dir.z)
  ).normalize();

  // Blend between free and quantized
  const fDir = dir.clone().lerp(qDir, blend * 0.7);
  return origin.clone().add(fDir.multiplyScalar(len));
}

// ── BUILD THREADS
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — anchors reach toward the sphere surface (50%)
const catA = Math.floor(NUM_LINES * 0.48);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.5){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  let target = sphereSurf();
  target = quantizeDir(origin, target);

  // 12% stop short — the thread that cannot arrive
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng() * 1.8;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — anchor-to-nearest-anchor (25%)
const THRESH = 5.5;
const catBtarget = Math.floor(NUM_LINES * 0.25);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 80000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Rule 3: DENDRITIC BRANCHING — short Y-forking chains near anchors (12%)
// Each chain: 3-5 segments that fork from parent midpoint
const catC = Math.floor(NUM_LINES * 0.12);
let catCcount = 0;
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const startIdx = Math.floor(rng() * anchors.length);
  const start = anchors[startIdx];
  if(inVoid(start)) continue;

  // Find direction toward sphere
  const toSphere = sphereCenter.clone().sub(start).normalize();
  const len = 0.8 + rng() * 2.0;

  // Main branch
  const branchDir = toSphere.clone();
  branchDir.x += (rng()-0.5)*0.6;
  branchDir.y += (rng()-0.5)*0.6;
  branchDir.z += (rng()-0.5)*0.6;
  branchDir.normalize();

  const mid = start.clone().add(branchDir.clone().multiplyScalar(len));
  setLine(start, mid, 2);
  catCcount++;

  // Fork: two child branches from midpoint
  const depth = 2 + Math.floor(rng()*2);
  let forkPt = mid.clone();
  for(let d = 0; d < depth && li < NUM_LINES; d++){
    const forkLen = len * (0.5 / (d+1));
    const fDir1 = branchDir.clone();
    fDir1.x += (rng()-0.5)*1.2;
    fDir1.y += (rng()-0.5)*0.8;
    fDir1.z += (rng()-0.5)*1.2;
    fDir1.normalize();
    const end1 = forkPt.clone().add(fDir1.multiplyScalar(forkLen));
    if(!inVoid(end1)){
      setLine(forkPt, end1, 2);
      catCcount++;
    }

    if(rng() < 0.7 && li < NUM_LINES){
      const fDir2 = branchDir.clone();
      fDir2.x += (rng()-0.5)*1.2;
      fDir2.y += (rng()-0.5)*0.8;
      fDir2.z += (rng()-0.5)*1.2;
      fDir2.normalize();
      const end2 = forkPt.clone().add(fDir2.multiplyScalar(forkLen));
      if(!inVoid(end2)){
        setLine(forkPt, end2, 2);
        catCcount++;
      }
    }
    forkPt = end1 || forkPt;
  }
  i += catCcount - 1;
}

// Rule 4: DRAPE — threads from sphere falling to floor (6%)
const catD = Math.floor(NUM_LINES * 0.06);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  if(sp.y > sphereCenter.y + SPHERE_R * 0.3) sp.y = sphereCenter.y - rng() * SPHERE_R;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*6.0,
    -hh,
    sp.z + (rng()-0.5)*6.0
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 3);
}

// Fill remainder: long architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.35 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity varies by category (Halloran: depth through material differentiation)
const catOpacity = [0.075, 0.045, 0.06, 0.03];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat];
  const bright = op / 0.075;
  // Slight warmth shift for close threads
  const warmth = Math.max(0, 1.0 - lineDist[i] / 20.0) * 0.04;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright + warmth;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper caught in the web
const NUM_FRAGMENTS = 24;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.08;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.7);
  const h = sz * (0.3 + rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.15), h*0.5, 0,
    -w*0.5, h*(-0.15+rng()*0.1), 0,
    w*(0.05-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.15), h*0.5, 0,
    w*(0.15+rng()*0.35), h*(rng()*0.05), 0,
    w*(0.05-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.65){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.2 + rng()*7.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative: begin near the sphere, eye-level with it,
// then slowly descend and pull outward into the root-web below.
// Dispersal — moving away from the sacred center, losing it to the network.
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  let rH, y;
  if(t < 0.25){
    // Phase 1: close to sphere, intimate, barely moving
    const lt = t / 0.25;
    rH = 3.8 + lt * 0.8;
    y = cy + 0.5 + Math.sin(lt * Math.PI * 0.5) * 1.0;
  } else if(t < 0.55){
    // Phase 2: slowly descending, spiraling outward — dispersing
    const lt = (t - 0.25) / 0.3;
    rH = 4.6 + lt * 3.5;
    y = cy + 0.5 - lt * 7.0;
  } else if(t < 0.8){
    // Phase 3: deep below, in the dense root architecture
    const lt = (t - 0.55) / 0.25;
    rH = 8.0 + Math.sin(lt * Math.PI) * 2.0;
    y = cy - 6.5 - lt * 4.0 + Math.sin(lt * Math.PI * 2) * 1.5;
  } else {
    // Phase 4: slow return ascent — finding the sphere again from far away
    const lt = (t - 0.8) / 0.2;
    rH = 8.0 - lt * 4.2;
    y = cy - 10.5 + lt * 11.0;
  }

  const x = cx + Math.sin(p * 1.1 + 0.3) * rH + Math.cos(p * 0.35 + 1.2) * 0.5;
  const z = cz + Math.cos(p * 1.1 + 0.3) * (rH * 1.1) + Math.sin(p * 0.45 + 0.6) * 0.4;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible anchor jitter
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.00015 * Math.max(0, 1.0 - dist / 22.0);
    const phase = basePositions[idx]*0.11 + basePositions[idx+1]*0.14 + i*0.0004;
    const breath = Math.sin(t*0.01 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.25;
      arr[vi+1] = basePositions[vi+1] + breath*0.12;
      arr[vi+2] = basePositions[vi+2] + breath*0.2;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0004;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — always the anchor, even when far away
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0012)*0.04;
  look.y += Math.cos(t*0.0009)*0.025;
  look.z += Math.sin(t*0.0015)*0.03;
  camera.lookAt(look);

  // Subtle warm light wander
  pL.position.x = 1.5 + Math.sin(t*0.0006)*0.12;
  pL.position.y = 8 + Math.cos(t*0.0004)*0.06;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
