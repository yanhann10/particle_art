<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b4z · substrate lines</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f5f1e8; overflow:hidden;
               color:#3a2f28; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">b4z</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-20, 20, 15, -15, 0.1, 100);
camera.position.set(0, 0, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf5f1e8, 1);
document.body.appendChild(renderer.domElement);

// Substrate algorithm state
const lines = [];
const grid = new Map();
const gridRes = 0.1;
const bounds = { minX: -18, maxX: 18, minY: -13, maxY: 13 };

function gridKey(x, y) {
  return `${Math.floor(x / gridRes)},${Math.floor(y / gridRes)}`;
}

function markGrid(x, y, lineId) {
  const k = gridKey(x, y);
  if (!grid.has(k)) grid.set(k, []);
  grid.get(k).push(lineId);
}

function checkCollision(x, y, excludeId) {
  const k = gridKey(x, y);
  const ids = grid.get(k);
  if (!ids) return null;
  for (let id of ids) {
    if (id === excludeId) continue;
    return id;
  }
  return null;
}

function spawnLine(x, y, angle, generation) {
  const line = {
    id: lines.length,
    points: [{ x, y }],
    angle,
    generation,
    active: true,
    color: new THREE.Color().setHSL(
      (generation * 0.11 + Math.random() * 0.05) % 1.0,
      0.15 + Math.random() * 0.10,
      0.35 + Math.random() * 0.15
    )
  };
  lines.push(line);
  markGrid(x, y, line.id);
  return line;
}

// Initialize with 8 edge-spawned lines
const edgeCount = 8;
for (let i = 0; i < edgeCount; i++) {
  const side = Math.floor(Math.random() * 4);
  let x, y, angle;
  if (side === 0) { // top
    x = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
    y = bounds.maxY;
    angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  } else if (side === 1) { // right
    x = bounds.maxX;
    y = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
    angle = Math.PI + (Math.random() - 0.5) * 0.6;
  } else if (side === 2) { // bottom
    x = bounds.minX + Math.random() * (bounds.maxX - bounds.minX);
    y = bounds.minY;
    angle = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  } else { // left
    x = bounds.minX;
    y = bounds.minY + Math.random() * (bounds.maxY - bounds.minY);
    angle = (Math.random() - 0.5) * 0.6;
  }
  spawnLine(x, y, angle, 0);
}

// Grow lines step by step
const stepSize = 0.08;
const maxSteps = 12000;
let stepCount = 0;

function growLines() {
  let anyActive = false;
  for (let line of lines) {
    if (!line.active) continue;
    anyActive = true;
    const last = line.points[line.points.length - 1];
    const nx = last.x + Math.cos(line.angle) * stepSize;
    const ny = last.y + Math.sin(line.angle) * stepSize;
    
    // Check bounds
    if (nx < bounds.minX || nx > bounds.maxX || ny < bounds.minY || ny > bounds.maxY) {
      line.active = false;
      continue;
    }
    
    // Check collision
    const collision = checkCollision(nx, ny, line.id);
    if (collision !== null) {
      line.active = false;
      line.points.push({ x: nx, y: ny });
      markGrid(nx, ny, line.id);
      // Spawn perpendicular line at crossing
      const newAngle = line.angle + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
      spawnLine(nx, ny, newAngle, line.generation + 1);
      continue;
    }
    
    line.points.push({ x: nx, y: ny });
    markGrid(nx, ny, line.id);
  }
  return anyActive;
}

// Pre-compute substrate
while (stepCount < maxSteps && growLines()) {
  stepCount++;
}

// Convert lines to particles
const particlesPerSegment = 12;
const positions = [];
const colors = [];

for (let line of lines) {
  const pts = line.points;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i];
    const p1 = pts[i + 1];
    for (let j = 0; j < particlesPerSegment; j++) {
      const t = j / particlesPerSegment;
      const x = p0.x + (p1.x - p0.x) * t;
      const y = p0.y + (p1.y - p0.y) * t;
      const jitter = 0.05;
      positions.push(
        x + (Math.random() - 0.5) * jitter,
        y + (Math.random() - 0.5) * jitter,
        (Math.random() - 0.5) * 0.3
      );
      const colorVariance = 1.0 - i / pts.length * 0.2;
      colors.push(
        line.color.r * colorVariance,
        line.color.g * colorVariance,
        line.color.b * colorVariance
      );
    }
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  sizeAttenuation: false,
  blending: THREE.NormalBlending
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Compute centroid for camera framing
let cx = 0, cy = 0;
for (let i = 0; i < positions.length; i += 3) {
  cx += positions[i];
  cy += positions[i + 1];
}
cx /= (positions.length / 3);
cy /= (positions.length / 3);
camera.position.set(cx, cy, 20);

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const frustumHeight = 30;
  const frustumWidth = frustumHeight * aspect;
  camera.left = -frustumWidth / 2;
  camera.right = frustumWidth / 2;
  camera.top = frustumHeight / 2;
  camera.bottom = -frustumHeight / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const frustumHeight = 30;
  const frustumWidth = frustumHeight * aspect;
  camera.left = -frustumWidth / 2;
  camera.right = frustumWidth / 2;
  camera.top = frustumHeight / 2;
  camera.bottom = -frustumHeight / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  points.rotation.z = Math.sin(t * 0.15) * 0.02;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
