<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the flock that loses one and finds it again</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a14; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      radial-gradient(ellipse at 50% 85%, rgba(176,112,69,0.15) 0%, transparent 50%),
      linear-gradient(to bottom,
        #0e0e1a 0%,
        #16131f 18%,
        #1e1828 35%,
        #281e2a 52%,
        #32251e 70%,
        #3d2a18 85%,
        #4a3016 100%);
  }
  /* subtle paper grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(255,255,255,0.015) 2px, rgba(255,255,255,0.015) 4px);
    pointer-events: none;
    opacity: 0.25;
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #d09060; }
</style>
</head>
<body>
<div class="id">zst · the flock that loses one and finds it again</div>
<div class="hint">interference of two sine waves — no input, watch the flock breathe</div>
<div class="src">descended from sav · boids with grief and return · wave motion</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// sav successor — narrative arc preserved but motion law replaced:
// Each bird's position is the SUPERPOSITION of two sine waves:
//   wave A: frequency ω₁, amplitude A₁, phase φ₁(bird)
//   wave B: frequency ω₂, amplitude A₂, phase φ₂(bird)
// Where the waves constructively interfere, birds cluster. Where they cancel,
// birds spread. The straggler has ω₁ and ω₂ offset from the flock so it
// periodically drifts out of phase — this is what makes it lost. The flock
// SLOWS (reduce ω₁ globally) when the straggler is far, resuming when it
// returns. Emotional arc is the same: TOGETHER → LOSS → SEEKING → RETURN.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e0e1a, 0.016);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);

// each bird has two wave parameters: (phase1, phase2, freq1_offset, freq2_offset, amp1, amp2)
const waveParams = new Float32Array(N * 6);
for (let i = 0; i < N; i++){
  waveParams[i*6 + 0] = Math.random() * Math.PI * 2;   // phase1
  waveParams[i*6 + 1] = Math.random() * Math.PI * 2;   // phase2
  waveParams[i*6 + 2] = (Math.random() - 0.5) * 0.08;  // freq1 offset
  waveParams[i*6 + 3] = (Math.random() - 0.5) * 0.08;  // freq2 offset
  waveParams[i*6 + 4] = 1.8 + Math.random() * 0.6;     // amp1
  waveParams[i*6 + 5] = 1.4 + Math.random() * 0.5;     // amp2
}
// straggler wave frequencies are deliberately offset from flock — it goes out of phase
waveParams[STRAGGLER*6 + 2] = 0.18;
waveParams[STRAGGLER*6 + 3] = -0.14;
waveParams[STRAGGLER*6 + 4] = 2.4;
waveParams[STRAGGLER*6 + 5] = 2.0;

// spatial anchor points per bird — the wave oscillates around this anchor
const anchors = new Float32Array(N * 3);
for (let i = 0; i < N; i++){
  const r = (i === STRAGGLER) ? 1.0 : (0.4 + Math.random() * 1.2);
  const th = Math.random() * Math.PI * 2;
  const ph = (Math.random() - 0.5) * Math.PI * 0.6;
  anchors[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  anchors[i*3 + 1] = Math.sin(ph) * r;
  anchors[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
}

// global wave frequencies (modulated by emotional arc)
let omega1 = 0.42;
let omega2 = 0.67;

// emotional arc state
let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function step(dt, t){
  // compute flock centroid (exclude straggler)
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= (N - 1); cy /= (N - 1); cz /= (N - 1);

  // straggler distance from flock centroid
  const sx = pos[STRAGGLER*3] - cx;
  const sy = pos[STRAGGLER*3+1] - cy;
  const sz = pos[STRAGGLER*3+2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 8.0));
  cohesion += (targetCohesion - cohesion) * dt * 0.45;

  // arc state machine
  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  // modulate global wave frequencies by arc stage
  // seeking/loss → slow the waves (waiting for the lost one)
  const targetOmega1 = (arcStage === 'seeking' || arcStage === 'loss') ? 0.22
                      : arcStage === 'return' ? 0.36 : 0.42;
  const targetOmega2 = (arcStage === 'seeking' || arcStage === 'loss') ? 0.38
                      : arcStage === 'return' ? 0.54 : 0.67;
  omega1 += (targetOmega1 - omega1) * dt * 0.4;
  omega2 += (targetOmega2 - omega2) * dt * 0.4;

  // compute positions as interference of two sine waves
  for (let i = 0; i < N; i++){
    const ph1 = waveParams[i*6 + 0];
    const ph2 = waveParams[i*6 + 1];
    const f1off = waveParams[i*6 + 2];
    const f2off = waveParams[i*6 + 3];
    const amp1 = waveParams[i*6 + 4];
    const amp2 = waveParams[i*6 + 5];
    const ax = anchors[i*3];
    const ay = anchors[i*3+1];
    const az = anchors[i*3+2];

    // wave 1: travels along x-axis
    const w1 = Math.sin((omega1 + f1off) * t + ph1) * amp1;
    // wave 2: travels along z-axis
    const w2 = Math.sin((omega2 + f2off) * t + ph2) * amp2;
    
    // superposition: position = anchor + wave components
    // x-component receives wave1, z-component receives wave2, y oscillates with both
    pos[i*3]     = ax + w1 * 0.8;
    pos[i*3 + 1] = ay + (w1 * 0.3 + w2 * 0.3) * Math.cos(t * 0.2 + ph1);
    pos[i*3 + 2] = az + w2 * 0.8;

    // during 'seeking', the flock gently orbits toward straggler's anchor
    if (i !== STRAGGLER && (arcStage === 'seeking' || arcStage === 'return')){
      const tx = anchors[STRAGGLER*3] - ax;
      const ty = anchors[STRAGGLER*3+1] - ay;
      const tz = anchors[STRAGGLER*3+2] - az;
      const seek = arcStage === 'seeking' ? 0.16 : 0.08;
      pos[i*3]     += tx * seek;
      pos[i*3 + 1] += ty * seek;
      pos[i*3 + 2] += tz * seek;
    }
  }
}

// render
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStraggler = new Float32Array(N);
isStraggler[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStraggler, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    varying vec3  vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.6 + 0.8 * sin(t);
      float stragSize = strag * 2.4;
      gl_PointSize = (baseSize + stragSize) * uPixel * (16.0 / dist);
      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);

      vec3 warm  = vec3(0.96, 0.65, 0.32);
      vec3 hot   = vec3(1.00, 0.92, 0.78);
      vec3 cool  = vec3(0.42, 0.55, 0.78);
      vec3 lost  = vec3(0.55, 0.32, 0.62);
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot, smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.18);
      vCol *= (1.0 + strag * 0.4);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vFade;
      gl_FragColor = vec4(vCol * a * 0.95, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 250; s++) step(0.05, s * 0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  uniforms.uCohesion.value = cohesion;
  step(dt, t);
  geom.attributes.position.needsUpdate = true;

  const ang = now * 0.00010;
  camera.position.x = Math.sin(ang) * 26;
  camera.position.z = Math.cos(ang) * 26;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
