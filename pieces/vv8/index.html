<html lang="en">

<title>vv8 · Shiota — The Key in the Hand</title>
<!-- MOTION: gather, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">vv8</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0022);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060202, 0.01));
const pL = new THREE.PointLight(0xffe0c0, 0.035, 50, 1.8);
pL.position.set(2, 18, -3);
scene.add(pL);

let seed = 73619482;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

const ROOM = { w:36, h:30, d:40 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

// ── THE SPHERE — a pale moon, the origin you can never return to.
// "The Key in the Hand": 50,000 keys dangled in red yarn above two boats
// at the 56th Venice Biennale. Here the sphere holds all the keys inside it —
// every memory locked, every door closed, every hand that once held yours.
const sphereCenter = new THREE.Vector3(0.8, 1.2, -0.3);
const sphereR = 1.8;

const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8d8, emissive: 0xe0d4b8, emissiveIntensity: 0.65,
  roughness: 0.94, metalness: 0.0, transparent: true, opacity: 0.26
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.4, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xfcf2e4, transparent: true, opacity: 0.025 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// ── THE DRESS — dark absence, a body that was here and left.
// Shiota's dresses are always empty. The person is gone.
// This one hangs 4 units from the sphere — close enough to yearn, too far to touch.
const dressCenter = new THREE.Vector3(-3.2, -0.8, 2.5);
const dressGroup = new THREE.Group();
dressGroup.position.copy(dressCenter);

// Bodice — narrow trapezoid
const bodiceGeo = new THREE.BufferGeometry();
bodiceGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
  -0.15, 0.55, 0,   0.15, 0.55, 0,  -0.22, 0.0, 0,
   0.15, 0.55, 0,   0.22, 0.0, 0,   -0.22, 0.0, 0,
  -0.15, 0.55, 0.04,  0.15, 0.55, 0.04, -0.22, 0.0, 0.04,
   0.15, 0.55, 0.04,  0.22, 0.0, 0.04, -0.22, 0.0, 0.04
]), 3));
const dressMat = new THREE.MeshBasicMaterial({
  color: 0x050202, transparent: true, opacity: 0.55, side: THREE.DoubleSide
});
dressGroup.add(new THREE.Mesh(bodiceGeo, dressMat));

// Skirt — wider trapezoid falling below
const skirtGeo = new THREE.BufferGeometry();
skirtGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
  -0.22, 0.0, 0,    0.22, 0.0, 0,   -0.55, -1.1, 0,
   0.22, 0.0, 0,    0.55, -1.1, 0,  -0.55, -1.1, 0,
  -0.22, 0.0, 0.04,  0.22, 0.0, 0.04, -0.55, -1.1, 0.04,
   0.22, 0.0, 0.04,  0.55, -1.1, 0.04,-0.55, -1.1, 0.04,
  // side panels
  -0.22, 0.0, 0,   -0.22, 0.0, 0.04, -0.55, -1.1, 0,
  -0.55, -1.1, 0,  -0.22, 0.0, 0.04, -0.55, -1.1, 0.04,
   0.22, 0.0, 0,    0.22, 0.0, 0.04,  0.55, -1.1, 0,
   0.55, -1.1, 0,   0.22, 0.0, 0.04,  0.55, -1.1, 0.04
]), 3));
dressGroup.add(new THREE.Mesh(skirtGeo, dressMat));

// Hanger bar
const hangerPts = new Float32Array([
  -0.3, 0.65, 0.02, 0.0, 0.75, 0.02,
  0.0, 0.75, 0.02, 0.3, 0.65, 0.02
]);
const hangerGeo = new THREE.BufferGeometry();
hangerGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
dressGroup.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x0a0404, transparent: true, opacity: 0.6
})));

dressGroup.rotation.y = 0.3;
scene.add(dressGroup);

// ── Suspension threads — from ceiling to both objects
const suspPts = [];
// Sphere suspension
for(let i = 0; i < 6; i++){
  const a = (i/6)*Math.PI*2 + (rng()-0.5)*0.5;
  const sTop = 0.5 + rng()*0.9;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*sTop, hh, sphereCenter.z + Math.sin(a)*sTop,
    sphereCenter.x + Math.cos(a)*0.05, sphereCenter.y + sphereR - 0.05, sphereCenter.z + Math.sin(a)*0.05
  );
}
// Dress suspension — 4 lines to the hanger
for(let i = 0; i < 4; i++){
  const ox = (rng()-0.5)*0.4;
  suspPts.push(
    dressCenter.x + ox + (rng()-0.5)*1.5, hh, dressCenter.z + (rng()-0.5)*1.5,
    dressCenter.x + ox, dressCenter.y + 0.75, dressCenter.z + 0.02
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x080303, transparent: true, opacity: 0.5
})));

// ── Surface samplers
function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR*0.95,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}
function dressSurf(){
  const t = rng();
  let y, xw;
  if(t < 0.3){ // bodice
    y = rng()*0.55;
    xw = 0.15 + (0.22-0.15)*(1-y/0.55);
  } else { // skirt
    y = -rng()*1.1;
    xw = 0.22 + (0.55-0.22)*(-y/1.1);
  }
  return new THREE.Vector3(
    dressCenter.x + (rng()-0.5)*2*xw,
    dressCenter.y + y,
    dressCenter.z + (rng()-0.5)*0.04
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ANCHORS — orbital shells around the midpoint between sphere and dress
const midpoint = sphereCenter.clone().add(dressCenter).multiplyScalar(0.5);
const anchors = [];
const shells = [2.5, 5.0, 8.0, 12, 16];
for(const sr of shells){
  const nPts = Math.floor(12 + sr*2.2);
  for(let i = 0; i < nPts; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.8+rng()*0.4);
    anchors.push(new THREE.Vector3(
      midpoint.x + Math.sin(v)*Math.cos(u)*r + (rng()-0.5)*0.5,
      midpoint.y + Math.sin(v)*Math.sin(u)*r*0.8 + (rng()-0.5)*0.4,
      midpoint.z + Math.cos(v)*r + (rng()-0.5)*0.5
    ));
  }
}
while(anchors.length < 380){
  const p = rng()<0.3 ? wallPt() : wallPt().lerp(midpoint, 0.03+rng()*0.12);
  anchors.push(p);
}

// Void zones — negative space windows for the camera to breathe through
const voids = [
  { pos: new THREE.Vector3(midpoint.x-5, midpoint.y-4, midpoint.z+5), r:2.2 },
  { pos: new THREE.Vector3(midpoint.x+5, midpoint.y+4, midpoint.z-4), r:1.9 },
  { pos: new THREE.Vector3(midpoint.x+2, midpoint.y-7, midpoint.z-5), r:2.0 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos)<v.r) return true;
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-midpoint.x)**2+(my-midpoint.y)**2+(mz-midpoint.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE TO SPHERE — 35% of threads
// Blood-threads reaching for the pale heart
const catA = Math.floor(NUM_LINES * 0.35);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.4){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  const target = sphereSurf();
  // 12% stop short — threads that reach but never arrive
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng()*1.2;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)), 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: CONVERGENCE TO DRESS — 15% of threads
// The body remembered. Threads converge on absence.
const catB = Math.floor(NUM_LINES * 0.15);
for(let i = 0; i < catB && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.35){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  const target = dressSurf();
  if(rng() < 0.08){
    const dir = origin.clone().sub(target).normalize();
    setLine(origin, target.clone().add(dir.multiplyScalar(0.15+rng()*0.8)), 1);
  } else {
    setLine(origin, target, 1);
  }
}

// RULE 3: BRIDGE — threads connecting sphere and dress
// The tension between the two centers. Between memory and body.
const catC = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const a = sphereSurf();
  const b = dressSurf();
  if(inVoid(a) || inVoid(b)){ i--; continue; }
  setLine(a, b, 2);
}

// RULE 4: PROXIMITY — anchor-to-anchor within threshold
// Connective tissue: the web's own internal logic
const THRESH = 4.8;
const catDtarget = Math.floor(NUM_LINES * 0.22);
let catDcount = 0, attempts = 0;
while(catDcount < catDtarget && li < NUM_LINES && attempts < 60000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 3);
  catDcount++;
}

// RADIAL FILAMENTS — dendritic growth from sphere surface
for(let i = 0; i < 160 && li < NUM_LINES; i++){
  let pt = sphereSurf();
  const dir = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*3);
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.35 + rng()*0.8;
    const devDir = dir.clone().add(new THREE.Vector3(
      (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
    )).normalize();
    const next = pt.clone().add(devDir.multiplyScalar(len));
    if(!inVoid(next)) setLine(pt, next, 4);
    pt = next;
    if(rng() < 0.3 && li < NUM_LINES){
      const forkDir = dir.clone().add(new THREE.Vector3(
        (rng()-0.5)*1.0, (rng()-0.5)*1.0, (rng()-0.5)*1.0
      )).normalize();
      const forkEnd = pt.clone().add(forkDir.multiplyScalar(0.25+rng()*0.5));
      if(!inVoid(forkEnd)) setLine(pt, forkEnd, 4);
    }
  }
}

// Fill remainder: architectural wall spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.08 ? sphereSurf() : (rng()<0.15 ? dressSurf() : wallPt());
  const mid2 = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid2)) setLine(a, b, 5);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiated by category
// 0=sphere-converge, 1=dress-converge, 2=bridge, 3=proximity, 4=filament, 5=architectural
const catOpacity = [0.075, 0.07, 0.085, 0.045, 0.06, 0.022];
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.022;
  const bright = op / 0.085;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — keys, old letters, passport photos
// caught in the thread mesh like insects in amber
const NUM_FRAGMENTS = 22;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.06;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.35+rng()*0.6);
  const h = sz*(0.4+rng()*0.8);
  // Irregular quadrilateral — torn paper, bent key
  const verts = new Float32Array([
    w*(-0.25+rng()*0.12), h*0.5, 0,
    -w*0.5, h*(-0.08+rng()*0.06), 0,
    w*(0.08-rng()*0.18), -h*0.5, 0,
    w*(-0.25+rng()*0.12), h*0.5, 0,
    w*(0.12+rng()*0.18), h*(rng()*0.03), 0,
    w*(0.08-rng()*0.18), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.03, d*0.01),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  // Place along threads or near objects
  if(rng()<0.55){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15+rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t)+basePositions[si+3]*t,
      basePositions[si+1]*(1-t)+basePositions[si+4]*t,
      basePositions[si+2]*(1-t)+basePositions[si+5]*t
    );
  } else if(rng()<0.4){
    // Near the dress
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(1.5+rng()*4));
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.0+rng()*5));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — gathering:
// Begin between the two objects, looking at neither — disoriented in the web.
// Slowly the sphere comes into view — the origin, the memory.
// Then drift toward the dress — the absence, the body that left.
// Arc upward to see the bridge of threads between them — the tension.
// Return to the intimate center.
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=midpoint.x, cy=midpoint.y, cz=midpoint.z;

  let rH, y, xOff, zOff;
  if(t < 0.2){
    // Phase 1: between — intimate, tangled, close
    const lt = t/0.2;
    rH = 3.0 + lt*1.0;
    y = cy - 0.5 + lt*1.5;
    xOff = Math.sin(lt*Math.PI*0.5)*1.5;
    zOff = 0;
  } else if(t < 0.4){
    // Phase 2: drift toward sphere — the memory reveals itself
    const lt = (t-0.2)/0.2;
    rH = 4.0 + lt*1.5;
    y = cy + 1.0 + lt*2.0;
    xOff = 1.5 + lt*2.0;
    zOff = -lt*1.5;
  } else if(t < 0.6){
    // Phase 3: swing past, discover the dress — the absence
    const lt = (t-0.4)/0.2;
    rH = 5.5 + Math.sin(lt*Math.PI)*2.0;
    y = cy + 3.0 + Math.sin(lt*Math.PI*0.7)*1.5;
    xOff = 3.5 - lt*7.0;
    zOff = -1.5 + lt*3.0;
  } else if(t < 0.8){
    // Phase 4: rise above — see the bridge, the web between them
    const lt = (t-0.6)/0.2;
    rH = 7.5 + Math.sin(lt*Math.PI)*1.5;
    y = cy + 4.5 + lt*2.0;
    xOff = -3.5 + lt*3.5;
    zOff = 1.5 - lt*1.5;
  } else {
    // Phase 5: return — drawn back into the center
    const lt = (t-0.8)/0.2;
    rH = 7.5 - lt*4.5;
    y = cy + 6.5 - lt*7.0;
    xOff = lt*0.5;
    zOff = 0;
  }

  const x = cx + Math.sin(p*1.08)*rH + xOff;
  const z = cz + Math.cos(p*1.08)*(rH*1.02) + zOff;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

// Dynamic look target — shifts between sphere and dress
const lookTargets = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  let w; // weight toward dress (0=sphere, 1=dress)
  if(t < 0.2) w = 0.3;
  else if(t < 0.4) w = 0.1;
  else if(t < 0.6) w = 0.7;
  else if(t < 0.8) w = 0.4;
  else w = 0.3;
  lookTargets.push(sphereCenter.clone().lerp(dressCenter, w));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now()-t0)/1000;

  // Thread micro-breathing — the room inhales
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.0001 * Math.max(0, 1.0-dist/18.0);
    const phase = basePositions[idx]*0.1 + basePositions[idx+1]*0.12 + i*0.00025;
    const breath = Math.sin(t*0.005+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.09;
      arr[vi+2] = basePositions[vi+2] + breath*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera dolly
  const speed = 0.00022;
  const pathT = (t*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target — smoothly shifts between sphere and dress
  const look = lookTargets[i0].clone().lerp(lookTargets[i1], frac);
  look.x += Math.sin(t*0.0007)*0.025;
  look.y += Math.cos(t*0.0005)*0.02 + 0.1;
  look.z += Math.sin(t*0.0008)*0.02;
  camera.lookAt(look);

  // Light drift
  pL.position.x = 2 + Math.sin(t*0.0003)*0.08;
  pL.position.y = 18 + Math.cos(t*0.00018)*0.04;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
