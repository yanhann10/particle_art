<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>89v · grayscale shells</title>
<!-- MOTION: breathe, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; color:#706e74; transition: opacity 1.2s; }
</style>
</head>
<body>
<div class="id">89v</div>
<div class="hint" id="hint">click for mic</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
document.body.appendChild(renderer.domElement);

const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 4.2 + s * 2.2;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uBands = new THREE.Vector4(0, 0, 0, 0);
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uBands:  { value: uBands },
  uTreble: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;

      vec3 p = position;
      float r = length(p);
      vec3 dir = p / max(r, 0.001);

      // gentle breathe — whole form expands/contracts slowly
      float breatheCycle = sin(uTime * 0.45 + shellIdx * 0.6) * 0.06;
      float pulse = 1.0 + breatheCycle + e * 0.55;
      p = dir * r * pulse;

      // subtle tangential drift, not swirl
      float t = uTime * 0.18 + seed * 6.28 + shellIdx * 0.5;
      vec3 perp = normalize(cross(dir, vec3(0.0, 1.0, 0.0) + 0.08 * sin(seed * 7.0)));
      p += perp * sin(t) * (0.2 + e * 0.5);

      // PALETTE: grayscale + one accent #c9a86a
      // shell 0: warm pale gray
      // shell 1: mid gray
      // shell 2: THE ACCENT — gold #c9a86a
      // shell 3: cool light gray
      // shell 4: dark gray
      vec3 c0 = vec3(0.82, 0.80, 0.78);   // warm pale
      vec3 c1 = vec3(0.50, 0.52, 0.55);   // cool mid
      vec3 c2 = vec3(0.788, 0.659, 0.416); // #c9a86a
      vec3 c3 = vec3(0.66, 0.65, 0.68);   // light cool
      vec3 c4 = vec3(0.32, 0.31, 0.34);   // dark

      if (shellIdx < 0.5)      vCol = c0;
      else if (shellIdx < 1.5) vCol = c1;
      else if (shellIdx < 2.5) vCol = c2;
      else if (shellIdx < 3.5) vCol = c3;
      else                     vCol = c4;

      // energy brightens but doesn't saturate — restraint
      vCol *= (0.5 + e * 0.7);

      // gold shell gets a subtle glow boost with energy
      if (shellIdx > 1.5 && shellIdx < 2.5) {
        vCol += vec3(0.08, 0.05, 0.01) * e;
      }

      vAlpha = 0.35 + 0.45 * e;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 1.8 * e) * uPixel * (48.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;
      float falloff = exp(-r2 * 16.0);
      float a = falloff * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio — starts in synthetic mode, mic on click
const hint = document.getElementById('hint');
let analyser = null, freqData = null;
async function startAudio(){
  hint.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'mic live';
    hint.style.opacity = '0.3';
  } catch (e) {
    hint.textContent = '';
  }
}
document.body.addEventListener('click', () => {
  if (!analyser) startAudio();
}, { once: true });

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi - lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // very slow, barely perceptible rotation
  points.rotation.y = t * 0.015;
  points.rotation.x = Math.sin(t * 0.03) * 0.06;

  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n * 0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n * 0.04), Math.floor(n * 0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n * 0.12), Math.floor(n * 0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n * 0.30), Math.floor(n * 0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n * 0.55), n);
  } else {
    // synthetic breathing envelopes — slow, calm
    uBands.x = 0.30 + 0.20 * Math.sin(t * 0.7);
    uBands.y = 0.25 + 0.18 * Math.sin(t * 1.1 + 0.8);
    uBands.z = 0.28 + 0.22 * Math.sin(t * 0.5 + 1.6);
    uBands.w = 0.20 + 0.15 * Math.sin(t * 1.4 + 2.3);
    uniforms.uTreble.value = 0.15 + 0.12 * Math.sin(t * 2.0 + 0.3);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
