<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: gentle -->
<title>qeu · streak shells</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size:11px;
          letter-spacing:0.04em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace;
          transition: opacity 1.5s; }
</style>
</head>
<body>
<div class="id">qeu</div>
<div class="hint" id="hint">click for mic</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 4 + s * 2.4;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uBands:  { value: uBands },
  uTreble: { value: 0 },
  uRes:    { value: new THREE.Vector2(innerWidth, innerHeight) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform vec2  uRes;
    attribute float shellIdx;
    attribute float seed;
    varying vec3  vCol;
    varying float vEnergy;
    varying vec2  vDir;
    varying float vSpeed;

    float getEnergy(float si) {
      if (si < 0.5)      return uBands.x;
      else if (si < 1.5) return uBands.y;
      else if (si < 2.5) return uBands.z;
      else if (si < 3.5) return uBands.w;
      else               return uTreble;
    }

    vec3 animPos(float time, float e) {
      vec3 p = position;
      float r = length(p);
      vec3 dir = p / max(r, 0.001);
      float pulse = 1.0 + e * 0.9;
      p = dir * r * pulse;
      float t = time * 0.4 + seed * 6.28 + shellIdx * 0.7;
      vec3 perp = normalize(cross(dir, vec3(0.0, 1.0, 0.0) + 0.1 * sin(seed * 9.0)));
      p += perp * sin(t) * (0.4 + e * 1.2);
      return p;
    }

    void main(){
      float e = getEnergy(shellIdx);
      vEnergy = e;

      vec3 p     = animPos(uTime, e);
      vec3 pPrev = animPos(uTime - 0.035, e);

      // palette: sodium-amber → ice-cyan
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan  = vec3(0.25, 0.85, 0.95);
      float k = clamp(shellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vCol = mix(amber, cyan, k);
      vCol *= (0.6 + e * 1.4);

      vec4 mv     = modelViewMatrix * vec4(p, 1.0);
      vec4 mvPrev = modelViewMatrix * vec4(pPrev, 1.0);

      vec4 clip     = projectionMatrix * mv;
      vec4 clipPrev = projectionMatrix * mvPrev;

      // screen-space direction (in pixel-ish coords)
      vec2 sc     = (clip.xy / clip.w)     * uRes * 0.5;
      vec2 scPrev = (clipPrev.xy / clipPrev.w) * uRes * 0.5;
      vec2 delta = sc - scPrev;
      float spd = length(delta);

      vSpeed = clamp(spd * 0.3, 0.0, 1.0);
      vDir = spd > 0.05 ? normalize(delta) : vec2(1.0, 0.0);

      float dist = -mv.z;
      float baseSize = (1.2 + 2.0 * e) * uPixel * (50.0 / dist);
      // enlarge point to contain the elongated streak
      float stretch = 1.0 + vSpeed * 3.0;
      gl_PointSize = clamp(baseSize * stretch, 1.0, 48.0);
      gl_Position = clip;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vEnergy;
    varying vec2  vDir;
    varying float vSpeed;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;

      // rotate into motion-aligned frame
      float along  = dot(uv, vDir);
      float across = dot(uv, vec2(-vDir.y, vDir.x));

      // aspect ratio: faster → longer streaks (up to 5:1)
      float aspect = 1.0 + vSpeed * 8.0;
      float r = along * along + across * across * aspect * aspect;

      if (r > 0.25) discard;

      // tapered falloff — brighter at trailing center, fading forward
      float core = exp(-r * 16.0);
      // subtle directional taper: fade more at leading edge
      float taper = 1.0 - smoothstep(-0.3, 0.45, along) * 0.3 * vSpeed;
      float a = core * taper * (0.4 + 0.6 * vEnergy);

      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uRes.value.set(innerWidth, innerHeight);
});

// audio — optional, piece runs in synthetic mode immediately
const hint = document.getElementById('hint');
let analyser = null, freqData = null;
async function startAudio(){
  hint.style.opacity = '0';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 frequency shells';
    hint.style.opacity = '0.5';
  } catch (e) {
    hint.textContent = '';
  }
}
document.body.addEventListener('click', () => {
  if (!analyser) startAudio();
}, { once: true });

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi - lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  points.rotation.y = t * 0.04;
  points.rotation.x = Math.sin(t * 0.06) * 0.12;

  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n * 0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n * 0.04), Math.floor(n * 0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n * 0.12), Math.floor(n * 0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n * 0.30), Math.floor(n * 0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n * 0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t * 1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t * 2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t * 3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t * 4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t * 7.0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
