<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xyk · aizawa oompah</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#07090c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">xyk</div>
<div class="hint">oompah · move pointer to nudge</div>
<div class="src">aizawa attractor · rhythmic pulse</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07090c, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 },
  uPulse: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uPulse;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // during "oom" phase, slightly loosen the attractor (increase a, decrease e)
      // during "pah" phase, tighten it back hard
      float a = uA + uPulse * 0.06;
      float e = uE - uPulse * 0.08;

      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + a * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + e * p.z)
              + uF * p.z * p.x * p.x * p.x
      );

      // scale velocity by pulse — oom expands, pah contracts
      float dtMod = uDt * (1.0 + uPulse * 0.15);
      p += dp * dtMod;

      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
// fixed contemplative camera with very slow single-axis drift
camera.position.set(1.8, 1.4, 3.4);
camera.lookAt(0, 0, 0.8);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uPulse: { value: 0.0 },
    uBrass: { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uPulse;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;

      // oompah: scale the form outward during oom, inward during pah
      float swell = 1.0 + uPulse * 0.12;
      p *= swell;

      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // particles slightly bigger during oom
      float sizeMod = 1.0 + uPulse * 0.3;
      gl_PointSize = (1.1 + 1.5 * vSpeed) * uPixel * (8.0 / dist) * sizeMod;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    uniform float uBrass;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);

      // cool palette: sage → muted violet → silver
      vec3 a_cool = vec3(0.22, 0.52, 0.42);
      vec3 b_cool = vec3(0.48, 0.30, 0.58);
      vec3 c_cool = vec3(0.82, 0.84, 0.88);

      // warm brass palette for the oompah moment: tarnished brass → aged copper → bone
      vec3 a_warm = vec3(0.62, 0.50, 0.28);
      vec3 b_warm = vec3(0.55, 0.36, 0.25);
      vec3 c_warm = vec3(0.88, 0.84, 0.76);

      vec3 a_col = mix(a_cool, a_warm, uBrass);
      vec3 b_col = mix(b_cool, b_warm, uBrass);
      vec3 c_col = mix(c_cool, c_warm, uBrass);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));

      // slightly boost brightness during brass moment
      float bright = 0.45 + vSpeed * 0.9 + uBrass * 0.15;
      gl_FragColor = vec4(col * a * bright, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

// oompah rhythm engine
// pattern: rest → oom (swell) → PAH (snap) → rest
// cycle: 5.5s total — rest 2s, oom 1.8s, pah 0.4s, settle 1.3s
const CYCLE = 5.5;
const OOM_START = 2.0;
const OOM_END   = 3.8;
const PAH_END   = 4.2;

function oompahEnvelope(t) {
  const phase = t % CYCLE;
  if (phase < OOM_START) {
    // rest — slight anticipatory lean
    return Math.sin(phase / OOM_START * Math.PI * 0.5) * 0.03;
  } else if (phase < OOM_END) {
    // oom: smooth swell up
    const f = (phase - OOM_START) / (OOM_END - OOM_START);
    return 0.03 + 0.97 * (1.0 - Math.cos(f * Math.PI)) * 0.5;
  } else if (phase < PAH_END) {
    // pah: sharp snap down past zero (overshoot)
    const f = (phase - OOM_END) / (PAH_END - OOM_END);
    return (1.0 - f) * 1.0 - f * 0.3;
  } else {
    // settle: ease back from -0.3 to 0
    const f = (phase - PAH_END) / (CYCLE - PAH_END);
    const ease = f * f * (3.0 - 2.0 * f); // smoothstep
    return -0.3 * (1.0 - ease);
  }
}

function brassEnvelope(t) {
  const phase = t % CYCLE;
  if (phase < OOM_START) return 0.0;
  if (phase < OOM_END) {
    const f = (phase - OOM_START) / (OOM_END - OOM_START);
    return f * f * 0.7; // warm up slowly
  }
  if (phase < PAH_END) {
    return 0.7 + 0.3 * ((phase - OOM_END) / (PAH_END - OOM_END)); // peak brass at pah
  }
  // fade out
  const f = (phase - PAH_END) / (CYCLE - PAH_END);
  return 1.0 * (1.0 - f * f);
}

const t0 = performance.now();
let currentPulse = 0;
let currentBrass = 0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;

  // compute oompah
  const targetPulse = oompahEnvelope(elapsed);
  const targetBrass = brassEnvelope(elapsed);
  // smooth for no jitter
  currentPulse += (targetPulse - currentPulse) * 0.12;
  currentBrass += (targetBrass - currentBrass) * 0.08;

  simUniforms.uPulse.value = currentPulse;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uPulse.value = currentPulse;
  pointsMat.uniforms.uBrass.value = currentBrass;

  // very slow single-direction drift (not orbiting Y)
  const drift = elapsed * 0.012;
  camera.position.x = 1.8 + Math.sin(drift) * 0.3;
  camera.position.z = 3.4 + Math.cos(drift * 0.7) * 0.15;
  camera.position.y = 1.4 + Math.sin(drift * 0.4) * 0.08;
  camera.lookAt(0, 0, 0.8);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
