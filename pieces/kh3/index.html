<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kh3 · Shiota — After the Dream</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">kh3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0016);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060101, 0.003));
const warmL = new THREE.PointLight(0xff4518, 0.015, 40, 2.0);
warmL.position.set(0.5, 7.0, -1.5);
scene.add(warmL);

let seed = 4829173;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:26, h:20, d:22 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── DRESS — the remembered form. Shiota's After the Dream (2019):
// a single white dress suspended in a cathedral of red thread,
// the garment worn by no one, presence defined by absence.
// The dress replaces the sphere — a vessel of human shape,
// not geometric purity, but the ghost of a body that was here.
const dressCenter = new THREE.Vector3(0.0, 0.5, 0.0);

// Dress profile — surface of revolution
// [y-offset, radius] from center, top to bottom
const dressProfile = [
  [-2.8, 0.02],  // hanger hook tip
  [-2.6, 0.12],  // hanger shoulders
  [-2.4, 0.08],  // neck
  [-2.1, 0.38],  // shoulders
  [-1.5, 0.48],  // bust
  [-0.8, 0.36],  // waist
  [-0.1, 0.52],  // hip
  [ 0.8, 0.85],  // thigh
  [ 1.8, 1.25],  // knee
  [ 2.8, 1.65],  // hem
  [ 3.0, 1.72],  // hem edge
];

const DRESS_MERIDIANS = 14;
const dressVerts = [];
const dressLinePts = [];

// Build dress wireframe rings + meridians
for(let ri=0; ri<dressProfile.length; ri++){
  const [dy, rad] = dressProfile[ri];
  const ring = [];
  for(let mi=0; mi<DRESS_MERIDIANS; mi++){
    const a = (mi/DRESS_MERIDIANS)*Math.PI*2;
    const wobble = 1.0 + (rng()-0.5)*0.06; // hand-sewn irregularity
    const v = new THREE.Vector3(
      dressCenter.x + Math.cos(a)*rad*wobble,
      dressCenter.y + dy,
      dressCenter.z + Math.sin(a)*rad*wobble
    );
    ring.push(v);
    dressVerts.push(v);
    // Ring segments
    if(mi>0){
      dressLinePts.push(ring[mi-1].x, ring[mi-1].y, ring[mi-1].z);
      dressLinePts.push(ring[mi].x, ring[mi].y, ring[mi].z);
    }
  }
  // Close ring
  dressLinePts.push(ring[DRESS_MERIDIANS-1].x, ring[DRESS_MERIDIANS-1].y, ring[DRESS_MERIDIANS-1].z);
  dressLinePts.push(ring[0].x, ring[0].y, ring[0].z);
}
// Meridian lines connecting rings
for(let mi=0; mi<DRESS_MERIDIANS; mi++){
  for(let ri=0; ri<dressProfile.length-1; ri++){
    const a = dressVerts[ri*DRESS_MERIDIANS+mi];
    const b = dressVerts[(ri+1)*DRESS_MERIDIANS+mi];
    dressLinePts.push(a.x,a.y,a.z, b.x,b.y,b.z);
  }
}

const dressGeo = new THREE.BufferGeometry();
dressGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(dressLinePts),3));
const dressMesh = new THREE.LineSegments(dressGeo, new THREE.LineBasicMaterial({
  color: 0xede0cc, transparent: true, opacity: 0.35
}));
scene.add(dressMesh);

// Dress bounding for thread convergence
function dressSurfPt(){
  const ri = Math.floor(rng()*(dressProfile.length-1));
  const t = rng();
  const [y0,r0] = dressProfile[ri];
  const [y1,r1] = dressProfile[ri+1];
  const y = y0+(y1-y0)*t;
  const r = r0+(r1-r0)*t;
  const a = rng()*Math.PI*2;
  const wobble = 1.0+(rng()-0.5)*0.04;
  return new THREE.Vector3(
    dressCenter.x+Math.cos(a)*r*wobble,
    dressCenter.y+y,
    dressCenter.z+Math.sin(a)*r*wobble
  );
}

// Approximate dress center/radius for distance checks
const dressApproxR = 2.0;

// ── FRAGMENTS — charred paper scraps caught in the web
// In Silence (2002): burned piano, burned chairs — memory of childhood fire
const fragments = [];
for(let i=0; i<16; i++){
  const pts = [];
  const s = 0.06+rng()*0.14;
  // Irregular quadrilateral — torn paper
  const corners = [];
  for(let c=0; c<4; c++){
    const ca = (c/4)*Math.PI*2+rng()*0.5;
    const cr = s*(0.5+rng());
    corners.push(new THREE.Vector3(Math.cos(ca)*cr, Math.sin(ca)*cr, (rng()-0.5)*s*0.3));
  }
  for(let c=0; c<4; c++){
    const n=(c+1)%4;
    pts.push(corners[c].x,corners[c].y,corners[c].z, corners[n].x,corners[n].y,corners[n].z);
  }
  // Diagonal crease
  pts.push(corners[0].x,corners[0].y,corners[0].z, corners[2].x,corners[2].y,corners[2].z);

  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0604, transparent:true, opacity:0.35
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=3.0+rng()*7.0;
  fMesh.position.set(
    dressCenter.x+Math.sin(v)*Math.cos(u)*r,
    dressCenter.y+Math.sin(v)*Math.sin(u)*r*0.7,
    dressCenter.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — vertical channels of negative space
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.9;
  const vr=5.5+rng()*3.0;
  voids.push({
    x:dressCenter.x+Math.cos(a)*vr,
    z:dressCenter.z+Math.sin(a)*vr,
    r:1.2+rng()*0.7
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ICOSAHEDRAL ANCHOR GRID
const icoGeo = new THREE.IcosahedronGeometry(1, 2);
const icoPos = icoGeo.attributes.position;
const icoNormals = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNormals.push(v); }
}

const anchors = [];
const shellRadii = [3.5, 6.0, 8.5, 11.0, 13.0];
for(const sr of shellRadii){
  for(const n of icoNormals){
    const pt = new THREE.Vector3(
      dressCenter.x + n.x*sr,
      dressCenter.y + n.y*sr*0.78,
      dressCenter.z + n.z*sr
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw-0.3 && Math.abs(pt.y)<hh-0.3 && Math.abs(pt.z)<hd-0.3){
      anchors.push(pt);
    }
  }
}
for(let i=0; i<55; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── BUILD THREAD NETWORK
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-dressCenter.x)**2+(my-dressCenter.y)**2+(mz-dressCenter.z)**2);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION — taut threads from ceiling to dress hanger
// The hanging made visible — gravity is the first truth
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.15;
  const topSpread=0.2+rng()*0.35;
  const top = new THREE.Vector3(
    dressCenter.x+Math.cos(a)*topSpread*3.5, hh, dressCenter.z+Math.sin(a)*topSpread*3.5
  );
  const bot = new THREE.Vector3(
    dressCenter.x+Math.cos(a)*0.08, dressCenter.y-2.7, dressCenter.z+Math.sin(a)*0.08
  );
  setLine(top, bot, 0);
}

// ── RULE 1: CONVERGENCE — anchors reach toward the dress surface
// The web wraps the remembered body — every thread a reaching hand
for(let i=0; i<anchors.length && li<NUM_LINES; i++){
  const a = anchors[i];
  const d = a.distanceTo(dressCenter);
  const count = d<4.5?5 : d<7.5?3 : d<10?2 : 1;
  for(let j=0; j<count && li<NUM_LINES; j++){
    const target = dressSurfPt();
    // Yearning threads — 12% stop short
    if(rng()<0.12){
      const dir = a.clone().sub(target).normalize();
      const gap = 0.15+rng()*1.0;
      setLine(a, target.clone().add(dir.multiplyScalar(gap)), 1);
    } else {
      setLine(a, target, 0);
    }
  }
}

// ── RULE 2: PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 5.2;
let lat=0, att=0;
while(lat<6000 && li<NUM_LINES && att<45000){
  att++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<14; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  lat++;
}

// ── DENDRITIC BRANCHES — short Y-forking chains near anchors
// Entangled Others: the network exhibits growth, not just wiring
for(let i=0; i<180 && li<NUM_LINES-6; i++){
  const root = anchors[Math.floor(rng()*anchors.length)];
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.6+rng()*0.9;
  let cur = root.clone();
  // 3 generations of branching
  for(let g=0; g<3 && li<NUM_LINES; g++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen*(0.7**g)));
    // Slight random deflection each generation
    dir.x += (rng()-0.5)*0.6;
    dir.y += (rng()-0.5)*0.4;
    dir.z += (rng()-0.5)*0.6;
    dir.normalize();
    if(Math.abs(next.x)<hw && Math.abs(next.y)<hh && Math.abs(next.z)<hd){
      setLine(cur, next, 3);
      // Y-fork at generation 1
      if(g===1 && rng()>0.4){
        const forkDir = dir.clone();
        forkDir.x += (rng()-0.5)*1.2;
        forkDir.z += (rng()-0.5)*1.2;
        forkDir.normalize();
        const forkEnd = cur.clone().add(forkDir.multiplyScalar(segLen*0.4));
        setLine(cur, forkEnd, 3);
      }
      cur = next;
    }
  }
}

// ── GRAVITY DRAPE — threads descending from dress hem
// The weight of fabric translated into thread — garment's ghost-hem
for(let i=0; i<1400 && li<NUM_LINES; i++){
  const a = rng()*Math.PI*2;
  const [,hemR] = dressProfile[dressProfile.length-1];
  const hemY = dressProfile[dressProfile.length-1][0];
  const sp = new THREE.Vector3(
    dressCenter.x+Math.cos(a)*hemR*(0.85+rng()*0.3),
    dressCenter.y+hemY,
    dressCenter.z+Math.sin(a)*hemR*(0.85+rng()*0.3)
  );
  const dropLen=0.8+rng()*3.8;
  const drift=(rng()-0.5)*0.3;
  setLine(sp, new THREE.Vector3(sp.x+drift, sp.y+dropLen, sp.z+(rng()-0.5)*0.25), 3);
}

// ── FILL remaining budget with wall spans
while(li<NUM_LINES){
  const a=wallPt();
  const b=rng()<0.35 ? dressSurfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — arterial red #c20018, per-category opacity
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.09, 0.06, 0.04, 0.035];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0-d*0.03);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  const warmShift = d<5.0 ? 0.015*(1.0-d/5.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.45;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — a vigil: approach the dress from the dark,
// circle it slowly, descend to look up through the drape,
// rise to see the suspension threads, recede into the web
const pathLen = 3000;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=dressCenter.x, cy=dressCenter.y, cz=dressCenter.z;
  let x, y, z;

  if(t<0.08){
    // Distant — the dress is a pale absence in the dark web
    const lt=t/0.08;
    x = cx+10.5-lt*3.0;
    y = cy+2.5-lt*0.8;
    z = cz+6.5-lt*1.5;
  } else if(t<0.20){
    // Enter through a void — threads part around you
    const lt=(t-0.08)/0.12;
    const rH=7.0-lt*2.8;
    const angle=lt*Math.PI*0.5+0.6;
    x = cx+Math.cos(angle)*rH;
    y = cy+1.7-lt*1.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.36){
    // Close orbit — the dress at arm's length, threads crossing your sight
    const lt=(t-0.20)/0.16;
    const rH=3.8+Math.sin(lt*Math.PI)*0.5;
    const angle=lt*Math.PI*1.2+1.3;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.2+Math.sin(lt*Math.PI*0.6)*1.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.46){
    // Face the dress — stillness, the absent body
    const lt=(t-0.36)/0.10;
    x = cx+Math.sin(lt*Math.PI*0.15+2.8)*3.2;
    y = cy+0.3+lt*0.4;
    z = cz+Math.cos(lt*Math.PI*0.15+2.8)*3.0;
  } else if(t<0.56){
    // Descend — look up at the hem drape from below
    const lt=(t-0.46)/0.10;
    x = cx+Math.sin(lt*Math.PI*0.3+3.0)*3.5;
    y = cy+0.7-lt*6.0;
    z = cz+Math.cos(lt*Math.PI*0.3+3.0)*3.2;
  } else if(t<0.66){
    // Below — gravity drape threads hang around you
    const lt=(t-0.56)/0.10;
    const rH=3.4+lt*0.6;
    const angle=lt*Math.PI*0.5+3.4;
    x = cx+Math.cos(angle)*rH;
    y = cy-5.5+lt*2.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.78){
    // Rise through the web's body — threads everywhere
    const lt=(t-0.66)/0.12;
    x = cx+Math.sin(lt*Math.PI+4.2)*2.6;
    y = cy-3.0+lt*10.0;
    z = cz+Math.cos(lt*Math.PI+4.2)*2.8;
  } else if(t<0.88){
    // Above — looking down at the dress through the canopy
    const lt=(t-0.78)/0.10;
    const rH=2.8+lt*2.5;
    const angle=lt*Math.PI*0.6+5.4;
    x = cx+Math.cos(angle)*rH;
    y = cy+7.0-lt*3.0;
    z = cz+Math.sin(angle)*rH;
  } else {
    // Recede — the dress fades back into the web
    const lt=(t-0.88)/0.12;
    const rH=5.3+lt*6.5;
    x = cx+Math.cos(lt*Math.PI*0.2+6.2)*rH;
    y = cy+4.0-lt*2.0;
    z = cz+Math.sin(lt*Math.PI*0.2+6.2)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, nearly imperceptible
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.035+i*0.0001;
    const breath = Math.sin(elapsed*0.001+phase)*0.00002;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.06;
      arr[vi+1] = basePositions[vi+1] + breath*0.04;
      arr[vi+2] = basePositions[vi+2] + breath*0.05;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000038;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look slightly above dress center — the absent shoulders
  const look = dressCenter.clone();
  look.y -= 0.8;
  look.x += Math.sin(elapsed*0.00015)*0.04;
  look.y += Math.cos(elapsed*0.00014)*0.08;
  look.z += Math.sin(elapsed*0.0003+0.7)*0.03;
  camera.lookAt(look);

  warmL.intensity = 0.015+Math.sin(elapsed*0.0001)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
