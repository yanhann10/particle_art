<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rp2 · Clark bichos (geometric hinged planes)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a1a; overflow:hidden;
               color:#ccc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
</style>
</head>
<body>
<div class="id">rp2</div>
<div class="hint">drag to orbit · click to refold</div>
<div class="src">Lygia Clark · bichos · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1a1a, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const PANELS = 12;
const PARTICLES_PER_PANEL = Math.floor(N / PANELS);
const PANEL_W = 2.4, PANEL_H = 2.4, PANEL_D = 0.4;

/* Each panel: hingeAxis (0=x,1=y), hingeSign, parentPanel, basePos, foldRange */
let panelDefs = [];
let foldTargets = [];
let foldCurrents = [];

function definePanels() {
  panelDefs = [];
  foldTargets = [];
  foldCurrents = [];

  const rng = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  /* Central panel */
  panelDefs.push({
    parent: -1,
    hingeAxis: 0,
    hingeEdge: 0,
    localOff: [0, 0, 0],
    accent: false
  });

  /* Ring of panels around center */
  const dirs = [
    { off: [PANEL_W, 0, 0], axis: 1, edge: -1 },
    { off: [-PANEL_W, 0, 0], axis: 1, edge: 1 },
    { off: [0, PANEL_H, 0], axis: 0, edge: -1 },
    { off: [0, -PANEL_H, 0], axis: 0, edge: 1 },
    { off: [PANEL_W, PANEL_H, 0], axis: 1, edge: -1 },
    { off: [-PANEL_W, PANEL_H, 0], axis: 1, edge: 1 },
    { off: [PANEL_W, -PANEL_H, 0], axis: 0, edge: -1 },
    { off: [-PANEL_W, -PANEL_H, 0], axis: 0, edge: 1 },
    { off: [2*PANEL_W, 0, 0], axis: 1, edge: -1 },
    { off: [-2*PANEL_W, 0, 0], axis: 1, edge: 1 },
    { off: [0, 2*PANEL_H, 0], axis: 0, edge: -1 },
  ];

  const accentIdx = 3 + Math.floor(rng() * 4);

  for (let i = 0; i < dirs.length; i++) {
    const d = dirs[i];
    const parentIdx = i < 4 ? 0 : (i < 8 ? (i - 4 + 1) : (i === 9 ? 2 : (i === 10 ? 3 : 1)));
    panelDefs.push({
      parent: parentIdx,
      hingeAxis: d.axis,
      hingeEdge: d.edge,
      localOff: d.off,
      accent: i === accentIdx
    });
  }

  for (let i = 0; i < PANELS; i++) {
    const base = i === 0 ? 0 : (0.3 + rng() * 0.8) * (rng() > 0.5 ? 1 : -1);
    foldTargets.push(base);
    foldCurrents.push(base * 0.7);
  }
}

let seed = 42;

function makeRng(s) {
  let st = s >>> 0;
  return () => {
    st |= 0; st = st + 0x6D2B79F5 | 0;
    let t = Math.imul(st ^ st >>> 15, 1 | st);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const panelIds = new Float32Array(N);
const localCoords = new Float32Array(N * 3);

function populatePanels() {
  const rng = makeRng(seed + 7);

  /* Silver metal colors */
  const silver = [0.72, 0.73, 0.74];
  const silverDark = [0.45, 0.46, 0.48];
  const copper = [0.72, 0.35, 0.18];

  let idx = 0;
  for (let p = 0; p < PANELS && idx < N; p++) {
    const count = p < PANELS - 1 ? PARTICLES_PER_PANEL : N - idx;
    const isAccent = panelDefs[p].accent;

    for (let k = 0; k < count; k++) {
      /* Fill panel volume: w x h x d */
      const lx = (rng() - 0.5) * PANEL_W;
      const ly = (rng() - 0.5) * PANEL_H;
      const lz = (rng() - 0.5) * PANEL_D;

      /* Bias towards surfaces for metal-sheet look */
      const face = rng();
      let fx = lx, fy = ly, fz = lz;
      if (face < 0.35) fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      else if (face < 0.55) fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
      else if (face < 0.7) fy = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_H;

      /* Bias edges more heavily */
      const edgeBias = rng();
      if (edgeBias < 0.15) {
        fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
        fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      }

      localCoords[idx * 3] = fx;
      localCoords[idx * 3 + 1] = fy;
      localCoords[idx * 3 + 2] = fz;
      panelIds[idx] = p;

      /* Color */
      const shade = 0.85 + rng() * 0.15;
      if (isAccent) {
        colors[idx * 3] = copper[0] * shade;
        colors[idx * 3 + 1] = copper[1] * shade;
        colors[idx * 3 + 2] = copper[2] * shade;
      } else {
        const base = rng() > 0.4 ? silver : silverDark;
        colors[idx * 3] = base[0] * shade;
        colors[idx * 3 + 1] = base[1] * shade;
        colors[idx * 3 + 2] = base[2] * shade;
      }

      idx++;
    }
  }
}

function computeTransform(panelIdx, folds) {
  const m = new THREE.Matrix4();
  if (panelIdx === 0) return m;

  const def = panelDefs[panelIdx];
  const parentM = computeTransform(def.parent, folds);

  const pDef = panelDefs[def.parent];
  const off = def.localOff;

  /* Hinge position: edge of parent panel */
  const hx = def.hingeAxis === 1 ? def.hingeEdge * PANEL_W * 0.5 : 0;
  const hy = def.hingeAxis === 0 ? def.hingeEdge * PANEL_H * 0.5 : 0;

  const toHinge = new THREE.Matrix4().makeTranslation(hx, hy, 0);
  const fold = new THREE.Matrix4();
  const angle = folds[panelIdx];
  if (def.hingeAxis === 0) {
    fold.makeRotationX(angle);
  } else {
    fold.makeRotationY(angle);
  }
  const fromHinge = new THREE.Matrix4().makeTranslation(
    off[0] - hx,
    off[1] - hy,
    off[2]
  );

  m.copy(parentM).multiply(toHinge).multiply(fold).multiply(fromHinge);
  return m;
}

function updatePositions(folds) {
  const transforms = [];
  for (let p = 0; p < PANELS; p++) {
    transforms.push(computeTransform(p, folds));
  }

  const v = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    const p = panelIds[i] | 0;
    v.set(localCoords[i*3], localCoords[i*3+1], localCoords[i*3+2]);
    v.applyMatrix4(transforms[p]);
    positions[i*3] = v.x;
    positions[i*3+1] = v.y;
    positions[i*3+2] = v.z;
  }
}

seed = Math.floor(Math.random() * 1e9);
definePanels();
populatePanels();
updatePositions(foldCurrents);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDepth = -mv.z;
      gl_PointSize = uPixel * (2.0 + 12.0 / max(vDepth, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      /* Simple depth-based shading */
      float shade = clamp(1.0 - vDepth * 0.02, 0.3, 1.0);
      vec3 col = vColor * shade;

      /* Fog into background */
      float fogFactor = smoothstep(30.0, 60.0, vDepth);
      vec3 fogCol = vec3(0.102, 0.102, 0.102);
      col = mix(col, fogCol, fogFactor);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const cloud = new THREE.Points(geom, mat);
scene.add(cloud);

/* Camera orbit state */
let azimuth = 0.3, elevation = 0.25, radius = 18;
let targetAz = azimuth, targetEl = elevation;
let isDragging = false, lastMx = 0, lastMy = 0;
let autoRotate = true;

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  isDragging = true;
  autoRotate = false;
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMx;
  const dy = e.clientY - lastMy;
  targetAz -= dx * 0.005;
  targetEl += dy * 0.005;
  targetEl = Math.max(-1.2, Math.min(1.2, targetEl));
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointerup', () => { isDragging = false; });

canvas.addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9);
  definePanels();
  populatePanels();
  geom.attributes.color.needsUpdate = true;
  autoRotate = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = renderer.getPixelRatio();
});

/* Centroid tracking */
function computeCentroid() {
  let cx = 0, cy = 0, cz = 0;
  const step = 50;
  let count = 0;
  for (let i = 0; i < N; i += step) {
    cx += positions[i*3];
    cy += positions[i*3+1];
    cz += positions[i*3+2];
    count++;
  }
  return new THREE.Vector3(cx/count, cy/count, cz/count);
}

const startTime = performance.now();
const lookTarget = new THREE.Vector3(0, 0, 0);

function loop() {
  const t = (performance.now() - startTime) / 1000;

  /* Autonomous fold breathing */
  for (let i = 1; i < PANELS; i++) {
    const baseAngle = foldTargets[i];
    const breathe = Math.sin(t * 0.4 + i * 1.7) * 0.35;
    const secondHarmonic = Math.sin(t * 0.17 + i * 2.9) * 0.15;
    const target = baseAngle + breathe + secondHarmonic;
    foldCurrents[i] += (target - foldCurrents[i]) * 0.03;
  }

  updatePositions(foldCurrents);
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();

  /* Camera */
  if (autoRotate) {
    targetAz += 0.002;
  }
  azimuth += (targetAz - azimuth) * 0.06;
  elevation += (targetEl - elevation) * 0.06;

  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.03);

  camera.position.set(
    lookTarget.x + radius * Math.cos(elevation) * Math.sin(azimuth),
    lookTarget.y + radius * Math.sin(elevation),
    lookTarget.z + radius * Math.cos(elevation) * Math.cos(azimuth)
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
