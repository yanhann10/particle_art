<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x8y · hash-seeded choreography · cryptographic bodies</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .seed { position:fixed; right:14px; bottom:12px; opacity:0.35; font-size: 9px; letter-spacing: 0.02em; font-family: monospace; }
</style>
</head>
<body>
<div class="id">x8y · hash-seeded choreography · cryptographic bodies</div>
<div class="hint">drag to orbit · each figure derived from hash seed</div>
<div class="seed" id="seed-display"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// OPERATOR (2023) — Metaversal Generative Art / Lumen Prize
// 'Human Unreadable' — cryptographically-seeded choreography where each dancer
// is an emergent skeleton whose joint positions, spring tensions, phase offsets,
// and motion paths are ALL derived from a 256-bit hash shown on screen.
//
// FORM: 4 linked point-skeletons (7 joints each), moving in spring-coupled
// paths whose parameters are hash-seeded. Each figure is a unique performance
// provably derived from its seed.
//
// PALETTE: stage cyclorama — warm gradient (amber stage light to deep plum shadow)
// MOTION: drift — bodies oscillate around center paths, slow orbital camera

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(12, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 2, 0);

// ─────────── cryptographic seed generation
function generateSeed(){
  const arr = new Uint8Array(32);
  for (let i = 0; i < 32; i++) arr[i] = Math.floor(Math.random() * 256);
  return arr;
}

function seedToHex(seed){
  return Array.from(seed).map(b => b.toString(16).padStart(2, '0')).join('');
}

function hashToFloat(seed, index, salt = 0){
  // derive deterministic float from seed[index % 32] + salt
  const i = index % 32;
  const v = (seed[i] + salt * 17) % 256;
  return v / 255;
}

const SEED = generateSeed();
document.getElementById('seed-display').textContent = 'seed: 0x' + seedToHex(SEED).substring(0, 16) + '…';

// ─────────── figure skeleton definition
// each figure: 7 joints arranged as torso/head/limbs
// joints connected by springs, positions derived from seed

class Figure {
  constructor(seed, offset){
    this.seed = seed;
    this.offset = offset;
    this.joints = [];
    this.springs = [];
    this.material = null;
    this.lineMesh = null;
    this.pointMesh = null;
    
    // derive figure parameters from seed
    const baseX = (hashToFloat(seed, offset * 7 + 0) - 0.5) * 12;
    const baseZ = (hashToFloat(seed, offset * 7 + 1) - 0.5) * 12;
    const scale = 0.8 + hashToFloat(seed, offset * 7 + 2) * 0.6;
    
    // joint topology: torso center, head, left/right arm, left/right leg, pelvis
    const positions = [
      [0, 2.0, 0],     // 0: torso
      [0, 3.2, 0],     // 1: head
      [-0.9, 2.0, 0],  // 2: left shoulder
      [0.9, 2.0, 0],   // 3: right shoulder
      [-0.5, 0.5, 0],  // 4: left hip
      [0.5, 0.5, 0],   // 5: right hip
      [0, 1.2, 0]      // 6: pelvis
    ];
    
    for (let i = 0; i < positions.length; i++){
      const [x, y, z] = positions[i];
      const joint = {
        x: baseX + x * scale,
        y: y * scale,
        z: baseZ + z * scale,
        vx: 0, vy: 0, vz: 0,
        phase: hashToFloat(seed, offset * 7 + i + 3) * Math.PI * 2,
        freq: 0.3 + hashToFloat(seed, offset * 7 + i + 10) * 0.8,
        amp: 0.2 + hashToFloat(seed, offset * 7 + i + 17) * 0.6,
        axis: hashToFloat(seed, offset * 7 + i + 24) < 0.5 ? 'x' : 'z'
      };
      this.joints.push(joint);
    }
    
    // spring connections (skeleton links)
    const links = [
      [0, 1], // torso-head
      [0, 2], // torso-left shoulder
      [0, 3], // torso-right shoulder
      [0, 6], // torso-pelvis
      [6, 4], // pelvis-left hip
      [6, 5], // pelvis-right hip
      [2, 4], // left shoulder-left hip (diagonal)
      [3, 5]  // right shoulder-right hip (diagonal)
    ];
    
    for (const [a, b] of links){
      const ja = this.joints[a], jb = this.joints[b];
      const dx = jb.x - ja.x, dy = jb.y - ja.y, dz = jb.z - ja.z;
      const rest = Math.sqrt(dx*dx + dy*dy + dz*dz);
      const stiffness = 0.08 + hashToFloat(seed, offset * 7 + a + b + 31) * 0.06;
      this.springs.push({ a, b, rest, stiffness });
    }
    
    // color derived from seed — warm stage gradient
    const hue = hashToFloat(seed, offset * 7 + 50) * 30 + 15; // 15-45° (amber-orange)
    const sat = 0.5 + hashToFloat(seed, offset * 7 + 51) * 0.3;
    const light = 0.4 + hashToFloat(seed, offset * 7 + 52) * 0.2;
    const color = new THREE.Color().setHSL(hue/360, sat, light);
    
    this.material = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 });
    this.pointMat = new THREE.PointsMaterial({ color, size: 0.18, transparent: true, opacity: 0.85 });
  }
  
  update(t, dt){
    // apply hash-seeded oscillation to each joint
    for (let i = 0; i < this.joints.length; i++){
      const j = this.joints[i];
      const target = j.axis === 'x' 
        ? Math.sin(t * j.freq + j.phase) * j.amp
        : Math.cos(t * j.freq + j.phase) * j.amp;
      
      if (j.axis === 'x') j.vx += (target - (j.x - this.joints[0].x)) * 0.02;
      else j.vz += (target - (j.z - this.joints[0].z)) * 0.02;
    }
    
    // spring forces
    for (const spring of this.springs){
      const ja = this.joints[spring.a], jb = this.joints[spring.b];
      const dx = jb.x - ja.x, dy = jb.y - ja.y, dz = jb.z - ja.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
      const force = (dist - spring.rest) * spring.stiffness;
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;
      const fz = (dz / dist) * force;
      
      ja.vx += fx; ja.vy += fy; ja.vz += fz;
      jb.vx -= fx; jb.vy -= fy; jb.vz -= fz;
    }
    
    // integrate + damping
    for (let i = 0; i < this.joints.length; i++){
      const j = this.joints[i];
      j.vx *= 0.92; j.vy *= 0.92; j.vz *= 0.92;
      j.x += j.vx * dt; j.y += j.vy * dt; j.z += j.vz * dt;
      
      // soft floor
      if (j.y < 0.05){
        j.y = 0.05;
        j.vy = Math.abs(j.vy) * 0.4;
      }
    }
  }
  
  render(scene){
    // rebuild geometry each frame (cheap at 7 verts)
    if (this.lineMesh){ scene.remove(this.lineMesh); this.lineMesh.geometry.dispose(); }
    if (this.pointMesh){ scene.remove(this.pointMesh); this.pointMesh.geometry.dispose(); }
    
    const linePositions = [];
    for (const spring of this.springs){
      const ja = this.joints[spring.a], jb = this.joints[spring.b];
      linePositions.push(ja.x, ja.y, ja.z);
      linePositions.push(jb.x, jb.y, jb.z);
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
    this.lineMesh = new THREE.LineSegments(lineGeo, this.material);
    scene.add(this.lineMesh);
    
    const pointPositions = [];
    for (const j of this.joints) pointPositions.push(j.x, j.y, j.z);
    const pointGeo = new THREE.BufferGeometry();
    pointGeo.setAttribute('position', new THREE.Float32BufferAttribute(pointPositions, 3));
    this.pointMesh = new THREE.Points(pointGeo, this.pointMat);
    scene.add(this.pointMesh);
  }
}

// ─────────── create 4 figures from seed
const figures = [];
for (let i = 0; i < 4; i++){
  figures.push(new Figure(SEED, i));
}

// ─────────── stage gradient (warm amber to deep plum)
const bgGradient = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      void main(){
        // warm stage-cyc: amber (top) to deep plum (bottom)
        vec3 top = vec3(0.85, 0.55, 0.25);    // #d98c40 amber stage light
        vec3 bot = vec3(0.18, 0.10, 0.22);    // #2e1a38 deep plum shadow
        vec3 col = mix(bot, top, vUv.y * vUv.y);
        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
bgGradient.position.set(0, 5, -10);
scene.add(bgGradient);

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({ color: 0x0f0a14, transparent: true, opacity: 0.6 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// subtle rim light
const light = new THREE.DirectionalLight(0xffd9a6, 0.4);
light.position.set(5, 10, 8);
scene.add(light);
const ambient = new THREE.AmbientLight(0x3a2a4a, 0.3);
scene.add(ambient);

// ─────────── animation loop
const start = performance.now();
let lastT = 0;

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const dt = Math.min(elapsed - lastT, 0.05);
  lastT = elapsed;
  
  // update all figures
  for (const fig of figures){
    fig.update(elapsed, dt);
    fig.render(scene);
  }
  
  // slow orbital camera drift
  camera.position.x = 12 * Math.cos(elapsed * 0.08);
  camera.position.z = 18 * Math.sin(elapsed * 0.08);
  camera.lookAt(0, 2, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
