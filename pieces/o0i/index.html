<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════════
   Rosa Menkman / Beflix / datamoshing glitch aesthetic layered over
   differential-growth calligraphy from 2iy→5gm lineage.

   The tube is colored with a 5-color posterized palette (hot magenta,
   electric cyan, acid green, warm bone, violet). A full-screen glitch
   shader adds: 8×8 JPEG block quantization, RGB channel separation,
   vertical zalgo-stretch bands, periodic surge bursts, scanlines,
   and horizontal tear artifacts. Error is information.
   ═══════════════════════════════════════════════════════════════════ */

// ─── palette (hand-picked, justified) ───
// Magenta #ff2d6b — signal heat, the "this pixel matters" flag
// Cyan #00e5ff — cold data, channel-B bleed from NTSC decode fail
// Acid green #b8ff00 — phosphor burn, CRT green-gun overshoot
// Bone #f0e0cc — the paper/substrate showing through corruption
// Violet #6b00ff — deep UV, the frequency you weren't supposed to see
const PAL = [
  [1.0, 0.176, 0.42],
  [0.0, 0.898, 1.0],
  [0.722, 1.0, 0.0],
  [0.941, 0.878, 0.8],
  [0.42, 0.0, 1.0],
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: false }); // no AA — glitch wants aliasing
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─── render target for post-processing ───
let rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter
});

// ─── glitch post-processing ───
const glitchVert = `
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

const glitchFrag = `
uniform sampler2D tScene;
uniform float uTime;
uniform vec2 uRes;
varying vec2 vUv;

float hash(float n) { return fract(sin(n) * 43758.5453); }
float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

void main() {
  // surge intensity — periodic spikes of corruption
  float t1 = sin(uTime * 0.7) * sin(uTime * 1.3);
  float surge = pow(max(0.0, t1), 4.0);
  float g = 0.12 + 0.88 * surge;

  vec2 uv = vUv;

  // ── zalgo vertical stretch bands ──
  float bandSeed = floor(uv.y * 35.0 + floor(uTime * 1.5));
  float bandH = hash(bandSeed);
  float stretch = step(1.0 - 0.05 * g, bandH);
  uv.y += stretch * (hash(bandSeed + 7.0) - 0.5) * 0.18 * g;

  // ── horizontal tear during surge ──
  float tearSeed = floor(uTime * 6.0);
  float tearActive = step(0.92, hash(tearSeed));
  float tearY = hash(tearSeed + 3.0);
  float tearBand = smoothstep(0.0, 0.025, abs(uv.y - tearY));
  float tearShift = (1.0 - tearBand) * tearActive * 0.06 * sign(hash(tearSeed + 5.0) - 0.5);
  uv.x += tearShift;

  // ── 8x8 JPEG block quantization ──
  float blockPx = 8.0;
  vec2 blockUV = floor(uv * uRes / blockPx) * blockPx / uRes;
  vec2 sampleUV = mix(uv, blockUV, g * 0.55);

  // ── RGB channel separation (chromatic aberration) ──
  float aberr = (0.002 + 0.018 * g) * (0.4 + 0.6 * sin(uTime * 2.3));

  // per-line horizontal jitter
  float lineJit = g * (hash2(vec2(floor(sampleUV.y * uRes.y), floor(uTime * 3.0))) - 0.5) * 0.012;

  float r = texture2D(tScene, sampleUV + vec2( aberr + lineJit, 0.0)).r;
  float gn= texture2D(tScene, sampleUV + vec2(         lineJit, 0.0)).g;
  float b = texture2D(tScene, sampleUV + vec2(-aberr + lineJit, 0.0)).b;
  vec3 col = vec3(r, gn, b);

  // ── posterization (4-6 levels) ──
  float levels = 4.0 + 2.0 * (1.0 - g);
  col = floor(col * levels + 0.5) / levels;

  // ── scanlines ──
  float scan = 0.90 + 0.10 * sin(gl_FragCoord.y * 3.14159);
  col *= scan;

  // ── tear color distortion ──
  if (tearActive > 0.5 && tearBand < 0.6) {
    col = col.gbr * vec3(1.4, 0.6, 1.1);
  }

  // ── subtle film grain ──
  float grain = (hash2(gl_FragCoord.xy + fract(uTime) * 100.0) - 0.5) * 0.06;
  col += grain;

  gl_FragColor = vec4(col, 1.0);
}`;

const glitchMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rt.texture },
    uTime:  { value: 0 },
    uRes:   { value: new THREE.Vector2(innerWidth, innerHeight) },
  },
  vertexShader: glitchVert,
  fragmentShader: glitchFrag,
  depthTest: false,
});
const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), glitchMat));

// ─── differential growth (3D, inherited from 5gm→2iy) ───
const MAX_VERTS = 1800;
const ATTRACT   = 0.06;
const REPEL_R   = 0.46;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0042;
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 700; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─── ink-tube renderer with palette vertex colors ───
let tubeMesh = null;
const tubeMat = new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.92,
});

// ambient dust motes — tiny particles floating in the scene for atmosphere
const dustCount = 300;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustCol = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i*3]   = (Math.random() - 0.5) * 20;
  dustPos[i*3+1] = Math.random() * 18;
  dustPos[i*3+2] = (Math.random() - 0.5) * 20;
  const ci = Math.floor(Math.random() * PAL.length);
  dustCol[i*3]   = PAL[ci][0] * 0.5;
  dustCol[i*3+1] = PAL[ci][1] * 0.5;
  dustCol[i*3+2] = PAL[ci][2] * 0.5;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
const dustMat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.35 });
scene.add(new THREE.Points(dustGeo, dustMat));

function buildTube() {
  if (verts.length < 10) return;
  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  const N = Math.min(800, verts.length * 2);
  const RADIAL = 6;
  const radii = new Array(N);
  for (let i = 0; i < N; i++){
    const t = i / N;
    const dt = 1 / N;
    const t1 = curve.getTangent((t - dt + 1) % 1);
    const t2 = curve.getTangent(t);
    const t3 = curve.getTangent((t + dt) % 1);
    const curvature = (2 - t1.dot(t2) - t2.dot(t3)) * 0.5;
    const pressure = Math.min(1.0, curvature * 8);
    radii[i] = 0.018 + 0.10 * pressure;
  }

  const positions = new Float32Array(N * RADIAL * 3);
  const colors = new Float32Array(N * RADIAL * 3);
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < N; i++){
    const t = i / N;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
    if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const r = radii[i];

    // palette cycling — 3 full cycles along the curve, offset by curvature
    const pi = Math.floor((t * PAL.length * 3 + radii[i] * 20) % PAL.length);
    const c = PAL[pi];

    for (let j = 0; j < RADIAL; j++){
      const ang = (j / RADIAL) * Math.PI * 2;
      const v = new THREE.Vector3()
        .copy(normal).multiplyScalar(Math.cos(ang) * r)
        .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
        .add(p);
      const idx = (i * RADIAL + j) * 3;
      positions[idx]     = v.x;
      positions[idx + 1] = v.y;
      positions[idx + 2] = v.z;
      colors[idx]     = c[0];
      colors[idx + 1] = c[1];
      colors[idx + 2] = c[2];
    }
  }
  for (let i = 0; i < N; i++){
    const ni = (i + 1) % N;
    for (let j = 0; j < RADIAL; j++){
      const nj = (j + 1) % RADIAL;
      const a = i * RADIAL + j, b = i * RADIAL + nj;
      const c = ni * RADIAL + j, d = ni * RADIAL + nj;
      indices.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();

  if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
  tubeMesh = new THREE.Mesh(g, tubeMat);
  scene.add(tubeMesh);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(innerWidth, innerHeight);
  glitchMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  for (let s = 0; s < 2; s++) step();
  buildTube();

  // camera follow centroid
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;
  controls.update();

  // animate dust drift
  const dp = dustGeo.attributes.position;
  for (let i = 0; i < dustCount; i++) {
    dp.array[i*3+1] += 0.003;
    if (dp.array[i*3+1] > 18) dp.array[i*3+1] = 0;
  }
  dp.needsUpdate = true;

  // pass 1: render scene to texture
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);

  // pass 2: glitch post-process
  glitchMat.uniforms.uTime.value = (performance.now() - t0) * 0.001;
  renderer.render(postScene, postCam);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
