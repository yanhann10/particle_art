<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zo2 · Shiota — circulatory cosmos</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#030303; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">zo2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.FogExp2(0x030303, 0.038);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0x1a0808, 1.2));
const dLight = new THREE.DirectionalLight(0xffeedd, 0.5);
dLight.position.set(-4, 6, 3);
scene.add(dLight);

// Deterministic RNG
let seed = 48271653;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── Suspended sphere — the still heart
const sphereR = 2.0;
const spherePos = new THREE.Vector3(2.2, 0.4, -4.0);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf5ebe0, emissive: 0xf5ebe0, emissiveIntensity: 0.6,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.88
});
const sphereMesh = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 24, 16), sphereMat);
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

// ── Architectural room boundaries
const ROOM = { w: 20, h: 14, d: 30 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Anchor points — cluster heavily around sphere
const NUM_ANCHORS = 800;
const anchors = [];
for(let i=0; i<NUM_ANCHORS; i++){
  if(rng() < 0.45){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereR + 0.08 + rng()*3.5;
    anchors.push(spherePos.clone().add(dir.multiplyScalar(dist)));
  } else if(rng() < 0.3){
    // midfield cluster — between walls and sphere
    const p = wallPt();
    p.lerp(spherePos, 0.3 + rng()*0.3);
    anchors.push(p);
  } else {
    anchors.push(wallPt());
  }
}

// ── Build 20,000 line segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurf(from){
  const dir = spherePos.clone().sub(from).normalize();
  const p = spherePos.clone().sub(dir.multiplyScalar(sphereR * (0.97 + rng()*0.05)));
  p.x += (rng()-0.5)*0.3; p.y += (rng()-0.5)*0.3; p.z += (rng()-0.5)*0.3;
  return p;
}

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Cat A: converging on sphere from walls/anchors (45%)
const catA = Math.floor(NUM_LINES * 0.45);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.6 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  const b = sphereSurf(a);
  setLine(a, b);
}

// Cat B: wall-to-wall threads passing through sphere region (30%)
const catB = Math.floor(NUM_LINES * 0.30);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 10 && rng() > 0.2){ i--; continue; }
  setLine(a, b);
}

// Cat C: short local web — between nearby anchors (25%)
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.15){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Dark fragments — charred paper / memory shards
const NUM_FRAGS = 24;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.14;
  const geo = rng()>0.4
    ? new THREE.BoxGeometry(sz, sz*(0.2+rng()*1.5), sz*(0.3+rng()))
    : new THREE.TetrahedronGeometry(sz, 0);
  const darkness = 0.02 + rng()*0.05;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(darkness, darkness*0.6, darkness*0.5),
    transparent: true, opacity: 0.5 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Place along a random thread, biased toward sphere
  const segIdx = Math.floor(rng()*NUM_LINES)*6;
  const t = rng();
  mesh.position.set(
    basePositions[segIdx]*(1-t) + basePositions[segIdx+3]*t,
    basePositions[segIdx+1]*(1-t) + basePositions[segIdx+4]*t,
    basePositions[segIdx+2]*(1-t) + basePositions[segIdx+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// ── Second suspended object — a small dark key-shape (absence within presence)
const keyGroup = new THREE.Group();
const keyRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.12, 0.03, 8, 12),
  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.7, metalness:0.8 })
);
const keyShaft = new THREE.Mesh(
  new THREE.BoxGeometry(0.04, 0.35, 0.02),
  new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:0.7, metalness:0.8 })
);
keyShaft.position.y = -0.24;
keyGroup.add(keyRing, keyShaft);
keyGroup.position.set(spherePos.x - 3.5, spherePos.y + 1.8, spherePos.z + 1.5);
keyGroup.rotation.set(0.3, 0.8, 0.5);
scene.add(keyGroup);

// ── Camera path — slow wandering INSIDE the web
const camPath = {
  baseRadius: 5.8,
  vertAmp: 2.0,
  orbitSpeed: 0.014,
  driftSpeed: 0.009
};

// Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Very subtle breathing — tiny jitter on anchors
  const breathAmp = 0.012;
  const breathFreq = 0.25;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.6 + by*1.3 + bz*0.4;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.6;
    arr[i+2] = bz + s*0.4;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera: inside the web, slow orbit + vertical drift
  const angle = t * camPath.orbitSpeed;
  const r = camPath.baseRadius + Math.sin(t*0.007)*1.0;
  camera.position.set(
    spherePos.x + Math.cos(angle) * r,
    spherePos.y + Math.sin(t * camPath.driftSpeed) * camPath.vertAmp,
    spherePos.z + Math.sin(angle) * r
  );
  // Look toward sphere with very slow wander
  const look = spherePos.clone();
  look.x += Math.sin(t*0.031)*0.6;
  look.y += Math.cos(t*0.023)*0.4;
  camera.lookAt(look);

  // Key slowly rotates
  keyGroup.rotation.z += 0.0004;
  keyGroup.rotation.x += 0.0002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
