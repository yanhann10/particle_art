<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>q01 · cyanotype cosmos</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d2c54; overflow:hidden;
               color:#e8f2f7; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">q01</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d2c54);
scene.fog = new THREE.Fog(0x0d2c54, 15, 55);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 32);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// galactic coordinate star distribution
const N = 18000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const brightness = new Float32Array(N);

for (let i = 0; i < N; i++) {
  const u = Math.random();
  let r, theta, z;
  if (u < 0.6) {
    // galactic plane — Milky Way band
    r = 8 + Math.random() * 18;
    theta = Math.random() * Math.PI * 2;
    z = (Math.random() - 0.5) * 2.5;
  } else if (u < 0.85) {
    // halo stars
    r = 12 + Math.random() * 22;
    theta = Math.random() * Math.PI * 2;
    z = (Math.random() - 0.5) * 15;
  } else {
    // foreground close stars
    r = 2 + Math.random() * 6;
    theta = Math.random() * Math.PI * 2;
    z = (Math.random() - 0.5) * 5;
  }
  positions[i*3]   = r * Math.cos(theta);
  positions[i*3+1] = z;
  positions[i*3+2] = r * Math.sin(theta);
  seeds[i] = Math.random();
  brightness[i] = 0.3 + Math.random() * 0.7;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('brightness', new THREE.BufferAttribute(brightness, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBrushOrigin: { value: new THREE.Vector2(0, 0) },
  uBrushScale: { value: 1.0 }
};

// simplex 2D noise for brushstroke SDF
const simplexCode = `
vec3 mod289_3(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289_2(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289_3(((x*34.0)+1.0)*x); }
float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy));
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289_2(i);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m; m = m*m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
  vec3 g; g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float brightness;
    varying float vBright;
    varying vec2 vScreenPos;
    void main(){
      vec3 p = position;
      // gentle orbital drift
      float t = uTime * 0.08 + seed * 6.28;
      p.x += sin(t * 0.7) * 0.4;
      p.z += cos(t * 0.5) * 0.35;
      p.y += sin(t * 1.2 + seed * 3.0) * 0.25;
      
      vBright = brightness;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec4 clip = projectionMatrix * mv;
      vScreenPos = (clip.xy / clip.w) * 0.5 + 0.5;
      
      float dist = -mv.z;
      gl_PointSize = (1.2 + brightness * 1.8) * uPixel * (40.0 / dist);
      gl_Position = clip;
    }
  `,
  fragmentShader: simplexCode + `
    uniform float uTime;
    uniform vec2 uBrushOrigin;
    uniform float uBrushScale;
    varying float vBright;
    varying vec2 vScreenPos;
    
    // brushstroke SDF — flowing Bezier-like curve
    float brushDist(vec2 p, float t) {
      float y = 0.5 + 0.12 * sin(p.x * 3.0 + t * 0.4);
      y += 0.06 * snoise(vec2(p.x * 6.0 + t * 0.2, t * 0.3));
      float d = abs(p.y - y);
      float w = 0.08 + 0.04 * snoise(vec2(p.x * 4.0, t * 0.5));
      return smoothstep(w + 0.02, w, d);
    }
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      
      // Gaussian star core
      float core = exp(-r * 16.0);
      
      // brushstroke enhancement
      vec2 bp = (vScreenPos - uBrushOrigin) * uBrushScale;
      float brush = brushDist(bp, uTime);
      
      // cyanotype white on Prussian blue
      float intensity = vBright * (0.4 + 0.6 * brush);
      float a = core * intensity * 0.85;
      vec3 col = vec3(0.95, 0.98, 1.0); // paper white with slight cool tint
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// background paper texture layer
const bgGeom = new THREE.PlaneGeometry(80, 60);
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime },
  transparent: true,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: simplexCode + `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      // subtle paper grain
      float grain = snoise(vUv * 150.0 + uTime * 0.02) * 0.015;
      // vignette
      vec2 c = vUv - 0.5;
      float vig = 1.0 - dot(c,c) * 0.6;
      vec3 blue = vec3(0.05, 0.17, 0.33); // Prussian
      gl_FragColor = vec4(blue * (1.0 + grain) * vig, 1.0);
    }
  `
});
const bgPlane = new THREE.Mesh(bgGeom, bgMat);
bgPlane.position.z = -35;
scene.add(bgPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// camera gentle drift to frame centroid
const centroid = new THREE.Vector3();
geom.computeBoundingBox();
geom.boundingBox.getCenter(centroid);

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // brushstroke parameters drift
  uniforms.uBrushOrigin.value.x = 0.5 + 0.15 * Math.sin(t * 0.18);
  uniforms.uBrushOrigin.value.y = 0.5 + 0.1 * Math.cos(t * 0.24);
  uniforms.uBrushScale.value = 1.8 + 0.4 * Math.sin(t * 0.12);
  
  // slow rotation to reveal depth
  points.rotation.y = t * 0.025;
  points.rotation.x = Math.sin(t * 0.035) * 0.08;
  
  // camera tracks centroid with gentle sway
  camera.position.x = centroid.x + Math.sin(t * 0.06) * 1.2;
  camera.position.y = centroid.y + Math.cos(t * 0.08) * 0.8;
  camera.lookAt(centroid);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
