<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx9 · Shiota — Key in Blood (Frond)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">fx9</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0038);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.014));
const key1 = new THREE.PointLight(0x1a0404, 0.022, 34, 2.1);
key1.position.set(-12, 14, 11);
scene.add(key1);

let seed = 482917;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 58, h: 42, d: 52 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

const keyPos = new THREE.Vector3(0, 0, 0);
const keyGroup = new THREE.Group();
keyGroup.position.copy(keyPos);

const shaftGeo = new THREE.CylinderGeometry(0.12, 0.12, 6.4, 8);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xd8cbb8,
  emissive: 0xc2b5a0,
  emissiveIntensity: 0.48,
  metalness: 0.68,
  roughness: 0.42
});
const shaft = new THREE.Mesh(shaftGeo, keyMat);
shaft.rotation.z = Math.PI/2;
keyGroup.add(shaft);

const bowGeo = new THREE.TorusGeometry(1.4, 0.14, 8, 16);
const bow = new THREE.Mesh(bowGeo, keyMat);
bow.position.set(-3.2, 0, 0);
bow.rotation.y = Math.PI/2;
keyGroup.add(bow);

for(let i=0; i<3; i++){
  const tooth = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.6, 0.08),
    keyMat
  );
  tooth.position.set(2.2 + i*0.52, -0.38, 0);
  keyGroup.add(tooth);
}

scene.add(keyGroup);

const keyGlow = new THREE.PointLight(0x1a0404, 0.028, 24, 2.6);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

const anchors = [];

// FROND GROWTH — L-system architecture with fernlike branching
// Each frond is a chain of segments growing from key outward, branching recursively

function frondRecurse(origin, direction, length, depth, maxDepth, segments){
  if(depth > maxDepth) return;
  
  const segLen = length / segments;
  let curr = origin.clone();
  let dir = direction.clone().normalize();
  
  for(let i=0; i<segments; i++){
    const next = curr.clone().add(dir.clone().multiplyScalar(segLen));
    anchors.push(curr.clone());
    
    // Slight curl as frond extends
    const curlAxis = new THREE.Vector3(
      (rng()-0.5)*0.12,
      (rng()-0.5)*0.08,
      (rng()-0.5)*0.12
    );
    dir.applyAxisAngle(curlAxis.normalize(), 0.06);
    
    // Branch at mid-segments
    if(i === Math.floor(segments/2) && depth < maxDepth){
      const leftAngle = Math.PI * 0.32;
      const rightAngle = -Math.PI * 0.32;
      
      const leftDir = dir.clone().applyAxisAngle(
        new THREE.Vector3(0,1,0).cross(dir).normalize(),
        leftAngle
      );
      const rightDir = dir.clone().applyAxisAngle(
        new THREE.Vector3(0,1,0).cross(dir).normalize(),
        rightAngle
      );
      
      frondRecurse(curr, leftDir, length*0.58, depth+1, maxDepth, Math.max(3, segments-2), anchors);
      frondRecurse(curr, rightDir, length*0.58, depth+1, maxDepth, Math.max(3, segments-2), anchors);
    }
    
    curr = next;
  }
  anchors.push(curr);
}

// PRIMARY FRONDS — 18 major fronds radiating from key
const numPrimaryFronds = 18;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

for(let i=0; i<numPrimaryFronds; i++){
  const y = 1 - (i / (numPrimaryFronds-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const startPt = new THREE.Vector3(x*3.2, y*3.2, z*3.2).add(keyPos);
  const growDir = new THREE.Vector3(x, y, z);
  
  frondRecurse(startPt, growDir, 18.0 + rng()*8.0, 0, 3, 12, anchors);
}

// SECONDARY FRONDS — smaller fronds from mid-volume
for(let i=0; i<30; i++){
  const y = 1 - (i / 30) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i * 1.618;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const r = 8.0 + rng()*4.0;
  const startPt = new THREE.Vector3(x*r, y*r, z*r).add(keyPos);
  const growDir = new THREE.Vector3(x, y, z);
  
  frondRecurse(startPt, growDir, 10.0 + rng()*6.0, 0, 2, 8, anchors);
}

// Wall anchors for suspension — sparse
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*3.2;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*3.2;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.84, ROOM.d*0.84, 2));
anchors.push(...wallGrid('x', hw, ROOM.h*0.84, ROOM.d*0.84, 2));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.84, ROOM.d*0.84, 3));
anchors.push(...wallGrid('y', hh, ROOM.w*0.84, ROOM.d*0.84, 3));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.84, ROOM.h*0.84, 2));
anchors.push(...wallGrid('z', hd, ROOM.w*0.84, ROOM.h*0.84, 2));

// THREAD NETWORK — connecting frond structure
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Sequential frond threads — connect adjacent anchors along growth paths
for(let i=0; i<anchors.length-1 && li<NUM_LINES-14000; i++){
  const a = anchors[i];
  const b = anchors[i+1];
  const d = a.distanceTo(b);
  if(d < 4.8){
    setLine(a, b);
  }
}

// CATEGORY B: Radial convergence to key
const convergeCount = 4000;
for(let i=0; i<convergeCount && li<NUM_LINES-10000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 3.2) continue;
  
  const dir = keyPos.clone().sub(a).normalize();
  const stopDist = 3.0 + rng()*1.4;
  const targetDist = dKey - stopDist;
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY C: Vertical suspension threads from ceiling
for(let i=0; i<60 && li<NUM_LINES-9940; i++){
  const t = (i/60)*Math.PI*2;
  const rx = 0.4 + rng()*0.8;
  const topPt = new THREE.Vector3(
    keyPos.x + Math.cos(t)*rx,
    keyPos.y + 3.2,
    keyPos.z + Math.sin(t)*rx
  );
  
  const ceilPt = new THREE.Vector3(
    topPt.x + (rng()-0.5)*2.0,
    hh - rng()*1.2,
    topPt.z + (rng()-0.5)*2.0
  );
  
  setLine(topPt, ceilPt);
}

// CATEGORY D: Lateral frond connections — horizontal webbing between fronds
for(let i=0; i<3000 && li<NUM_LINES-6880; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  
  // Connect nearby frond segments
  if(d > 2.2 && d < 9.8){
    setLine(a, b);
  }
}

// CATEGORY E: Meridian arcs through structure
const meridians = 28;
const ptsPerMeridian = 52;
for(let m=0; m<meridians && li<NUM_LINES-5424; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 10.8 + (m%4)*2.0;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-5424; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      keyPos.y + Math.sin(phi0)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      keyPos.y + Math.sin(phi1)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY F: Wall-to-frond spans
let wallSpans = 0;
while(wallSpans<1400 && li<NUM_LINES-3968){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>14.0 && d<48.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY G: Proximity web — local connections
const THRESH = 8.8;
let webCount = 0, attempts = 0;
while(webCount<2000 && li<NUM_LINES-1568 && attempts<20000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>2.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY H: Fill remaining budget
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>4.5 && d<22.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.076,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — orbiting through fronds
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const angle = t * Math.PI * 2.8;
  const r = 18.0 + Math.sin(t*Math.PI*4.2)*5.2;
  const yOsc = Math.sin(t*Math.PI*3.6)*8.4;
  
  const x = keyPos.x + Math.cos(angle)*r;
  const y = keyPos.y + yOsc;
  const z = keyPos.z + Math.sin(angle)*r;
  
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const rotSpeed = 0.000042;
  keyGroup.rotation.y = elapsed * rotSpeed;

  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.004;
  keyGroup.scale.setScalar(breathScale);

  const speed = 0.0000072;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000024)*0.22,
    keyPos.y + Math.cos(elapsed*0.000032)*0.18,
    keyPos.z + Math.sin(elapsed*0.000022)*0.16
  );

  key1.intensity = 0.022 + Math.sin(elapsed*0.000044)*0.008;
  keyGlow.intensity = 0.028 + Math.sin(elapsed*0.000052)*0.007;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
