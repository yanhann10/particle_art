<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lvl · hyperstition tender</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .caption {
    position:fixed; left:0; right:0; bottom:56px; text-align:center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #c8a87a; opacity: 0; transition: opacity 4s ease;
    pointer-events: none; z-index: 10;
  }
  .caption.visible { opacity: 0.28; }
</style>
</head>
<body>
<div class="id">lvl</div>
<div class="caption" id="caption"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Hyperstition · Tender — CCRU through Gonzalez-Torres.
   Two light strings (the paired/absent lover) grow and drape,
   never quite touching. Bulbs slowly dim — stack-decay, the work
   diminishes as it is witnessed. Future-tense whispers fade in
   at the threshold of legibility. A cool blue bleeds into dying
   filaments: the outside arriving gently. Time stutters. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

/* ── hyperstitional captions ── */
const CAPTIONS = [
  'WHAT WE WILL HAVE BEEN',
  'THE STRING REMEMBERS FORWARD',
  'ALREADY ARRIVING',
  'IT WAS ALWAYS GOING TO FIND YOU',
  'THE OUTSIDE CAME IN GENTLY',
  'TWO LINES LEARNING THE SAME CURVE',
  'DIMINISHING IS THE GIFT',
  'THE FICTION MADE ITSELF TRUE',
  'YOU WERE THE SIGNAL ALL ALONG',
  'EVERY BULB A SMALL FUTURE'
];
const captionEl = document.getElementById('caption');
let captionIdx = 0;
function cycleCaption() {
  captionEl.classList.remove('visible');
  setTimeout(() => {
    captionEl.textContent = CAPTIONS[captionIdx % CAPTIONS.length];
    captionIdx++;
    captionEl.classList.add('visible');
  }, 3500);
  setTimeout(() => captionEl.classList.remove('visible'), 10000);
}
cycleCaption();
setInterval(cycleCaption, 15000);

/* ── two curves (paired forms) ── */
const MAX_VERTS = 1800;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 5;

function makeCurve(ox, oy) {
  const v = [], NV = 36;
  for (let i = 0; i < NV; i++) {
    const t = (i / (NV - 1)) * 2 - 1;
    v.push({
      x: t * 5 + ox,
      y: -Math.abs(t) * 1.0 + Math.sin(t * Math.PI * 2) * 0.25 + oy,
      z: 0, age: 0, life: 1.0,
      pinY: i < ANCHOR_N || i >= NV - ANCHOR_N
    });
  }
  return v;
}

const curves = [ makeCurve(-0.4, 0.5), makeCurve(0.4, -0.2) ];

const CELL = REPEL_R;
function buildGrid(verts) {
  const g = new Map();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = Math.floor(v.x / CELL) + ',' + Math.floor(v.z / CELL);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(i);
  }
  return g;
}
function nearby(grid, v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL), out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const a = grid.get((cx + dx) + ',' + (cz + dz));
    if (a) for (const i of a) out.push(i);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function stepCurve(verts) {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  const grid = buildGrid(verts);
  const dx = new Float32Array(n), dz = new Float32Array(n), dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(grid, v)) {
      if (j === i) continue;
      const u = verts[j], ex = v.x - u.x, ez = v.z - u.z, d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2), f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const prev = i > 0 ? verts[i - 1] : null, next = i < n - 1 ? verts[i + 1] : null;
    if (prev) { dx[i] += (prev.x - v.x) * ATTRACT; dz[i] += (prev.z - v.z) * ATTRACT; dy[i] += (prev.y - v.y) * ATTRACT; }
    if (next) { dx[i] += (next.x - v.x) * ATTRACT; dz[i] += (next.z - v.z) * ATTRACT; dy[i] += (next.y - v.y) * ATTRACT; }
  }
  let ccx = 0, ccz = 0;
  for (let i = 0; i < n; i++) { ccx += verts[i].x; ccz += verts[i].z; }
  ccx /= n; ccz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - ccx, oz = verts[i].z - ccz, d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE; dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
    verts[i].life = Math.max(0.06, verts[i].life - 0.000025);
  }
  // subdivide
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1]; grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({ x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5, age: Math.max(a.age, b.age) * 0.7,
        life: (a.life + b.life) * 0.5, pinY: false });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

/* ── rendering: 40k particles ── */
const N_RENDER = 40000;
const rPos  = new Float32Array(N_RENDER * 3);
const rSeed = new Float32Array(N_RENDER);
const rAge  = new Float32Array(N_RENDER);
const rLife = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeed[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeed, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('life',     new THREE.BufferAttribute(rLife, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.032 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    attribute float life;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;
      float t = uTime * 0.3 + seed * 6.28;
      p.x += sin(t) * 0.008 * (1.0 + seed);
      p.z += cos(t * 0.7) * 0.005;

      // temporal stutter — time folds imperceptibly
      float stutter = step(0.97, fract(uTime * 0.4 + seed * 3.0));
      p.y += stutter * 0.025 * sin(seed * 100.0);

      float pulse = 0.85 + 0.15 * sin(uTime * 1.2 + seed * 40.0);

      // warm amber → cool whisper as life decays (the outside bleeding in)
      vec3 amber = vec3(1.0, 0.72, 0.32);
      vec3 warm  = vec3(1.0, 0.88, 0.72);
      vec3 cool  = vec3(0.68, 0.78, 0.92);
      float k = clamp(age * 1.2, 0.0, 1.0);
      vCol = mix(amber, warm, k);
      float fade = 1.0 - life;
      vCol = mix(vCol, cool, fade * 0.4);
      vCol *= pulse * life;

      vAlpha = (0.45 + 0.2 * pulse) * life;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.8 * uPixel * (45.0 / dist) * (0.7 + 0.3 * life);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 24.0);
      float halo = exp(-r * 8.0) * 0.35;
      float a = (core + halo) * vAlpha;
      vec3 col = mix(vCol, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── wires for both curves ── */
const wires = curves.map(() => {
  const wg = new THREE.BufferGeometry();
  const wp = new Float32Array(MAX_VERTS * 3);
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  const wm = new THREE.LineBasicMaterial({ color: 0x2a2420, transparent: true, opacity: 0.22 });
  const wl = new THREE.Line(wg, wm);
  scene.add(wl);
  return { geom: wg, positions: wp };
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow so strings have draped and folded
for (let s = 0; s < 500; s++) curves.forEach(c => stepCurve(c));

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) curves.forEach(c => stepCurve(c));

  // update wires
  curves.forEach((verts, ci) => {
    const w = wires[ci];
    for (let i = 0; i < verts.length; i++) {
      w.positions[i * 3]     = verts[i].x;
      w.positions[i * 3 + 1] = verts[i].y;
      w.positions[i * 3 + 2] = verts[i].z;
    }
    w.geom.setDrawRange(0, verts.length);
    w.geom.attributes.position.needsUpdate = true;
  });

  // camera tracks centroid of both curves
  let cx = 0, cy = 0, cz = 0, total = 0;
  curves.forEach(verts => {
    for (const v of verts) { cx += v.x; cy += v.y; cz += v.z; total++; }
  });
  if (total > 0) { cx /= total; cy /= total; cz /= total; }
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // distribute particles across both curves
  const allSegs = [];
  let totalLen = 0;
  curves.forEach(verts => {
    for (let i = 0; i < verts.length - 1; i++) {
      const a = verts[i], b = verts[i + 1];
      const L = Math.sqrt((b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2);
      allSegs.push({ a, b, L }); totalLen += L;
    }
  });

  if (totalLen > 0) {
    let written = 0;
    for (let si = 0; si < allSegs.length; si++) {
      const { a, b, L } = allSegs[si];
      const share = si === allSegs.length - 1
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * L / totalLen));
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
        const sp = 0.015;
        rPos[written * 3]     = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * sp;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * sp * 0.5;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * sp;
        rAge[written]  = Math.max(a.age, b.age);
        rLife[written] = Math.min(a.life, b.life);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.life.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
