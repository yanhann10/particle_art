<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: rotation, intensity: gentle -->
<title>4f6 · lorenz attractor (woven)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">4f6</div>
<div class="hint">σ ρ β · move pointer to nudge parameters</div>
<div class="src">strange attractor · 100k GPGPU line segments</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070b, 1);
document.body.appendChild(renderer.domElement);

/* ---- ping-pong state RTs ---- */
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

/* init: scatter particles near attractor basin */
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 8.0;
  init[i*4+1] = (Math.random()*2-1) * 8.0;
  init[i*4+2] = (Math.random()*2-1) * 8.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ---- simulation: Lorenz integration ---- */
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

/* ---- render: LINE SEGMENTS connecting consecutive texels per row ---- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);
camera.lookAt(0, 0, 25);

// Each row of W texels forms a chain of W-1 segments.
// LineSegments needs pairs: [A0,B0, A1,B1, ...] so 2 verts per segment.
const segsPerRow = W - 1;
const totalSegs = segsPerRow * H;
const totalVerts = totalSegs * 2;

const uvIdxArr = new Float32Array(totalVerts * 2);
let vi = 0;
for (let y = 0; y < H; y++){
  const uy = (y + 0.5) / H;
  for (let x = 0; x < segsPerRow; x++){
    const ux0 = (x + 0.5) / W;
    const ux1 = (x + 1.5) / W;
    // vertex A
    uvIdxArr[vi++] = ux0; uvIdxArr[vi++] = uy;
    // vertex B
    uvIdxArr[vi++] = ux1; uvIdxArr[vi++] = uy;
  }
}

const linesGeom = new THREE.BufferGeometry();
linesGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(totalVerts * 3), 3));
linesGeom.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdxArr, 2));

const linesMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture },
    uTime: { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x*p.z,
        p.x * p.y - (8.0/3.0) * p.z
      )) * 0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      p.z -= 25.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    void main(){
      // Same palette: deep indigo → magenta → warm gold
      vec3 a_col = vec3(0.20, 0.32, 0.78);
      vec3 b_col = vec3(0.85, 0.32, 0.62);
      vec3 c_col = vec3(0.98, 0.86, 0.50);
      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));
      // opacity 0.08-0.16, speed-dependent — additive blending accumulates density
      float alpha = 0.08 + vSpeed * 0.08;
      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});

const lines = new THREE.LineSegments(linesGeom, linesMat);
scene.add(lines);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer nudges parameters
const target = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.0;
  target.sigma = 10.0 + nx * 2.5;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;

  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  linesMat.uniforms.state.value = rtA.texture;
  linesMat.uniforms.uTime.value = now / 1000;

  const ang = now * 0.00012;
  camera.position.x = Math.sin(ang) * 80;
  camera.position.z = Math.cos(ang) * 80;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
