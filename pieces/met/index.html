<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>met · psaltery · strings through stone</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading …</div>
<div class="id">met</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const BG = 0x0d0c0a;
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 0.5, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.12;

const N = 65000;
const restPos = new Float32Array(N * 3);
const seeds   = new Float32Array(N);
const normals = new Float32Array(N * 3);

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReady:  { value: 0 },
  uStrum:  { value: 0 },
  uBg:     { value: new THREE.Color(BG) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uStrum;
    attribute vec3 rest;
    attribute vec3 norm;
    attribute float seed;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vStringDist;

    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec3 p = rest;
      float t = uTime;

      // — psaltery strings: 7 vertical strings spaced across the head —
      // each particle finds its nearest string (vertical lines at fixed x positions)
      float stringCount = 7.0;
      float stringSpacing = 1.6;
      float nearestStringX = floor((p.x + stringSpacing * stringCount * 0.5) / stringSpacing)
                             * stringSpacing - stringSpacing * (stringCount - 1.0) * 0.5;
      nearestStringX = clamp(nearestStringX,
        -stringSpacing * (stringCount - 1.0) * 0.5,
         stringSpacing * (stringCount - 1.0) * 0.5);
      float distToString = abs(p.x - nearestStringX);

      // string index for harmonic variation
      float stringIdx = floor((nearestStringX + stringSpacing * stringCount * 0.5) / stringSpacing);
      float harmonic = 1.0 + stringIdx * 0.4; // each string vibrates at different harmonic

      // strum wave travels left to right across strings
      float strumDelay = (stringIdx / stringCount) * 0.6;
      float strumPhase = max(0.0, uStrum - strumDelay);
      float strumEnvelope = strumPhase * exp(-strumPhase * 0.8);

      // particles near strings get pulled toward string line and vibrate
      float pull = smoothstep(1.2, 0.0, distToString) * uStrum;
      float stringAlign = pull * 0.7;

      // vibration perpendicular to string (in z), harmonic standing wave along y
      float standingWave = sin(p.y * harmonic * 0.8 + t * 2.0 * harmonic);
      float vibAmp = strumEnvelope * 0.15 * standingWave * pull;

      // morph: particles slide toward string x, vibrate in z
      p.x = mix(p.x, nearestStringX, stringAlign * 0.35);
      p.z += vibAmp;
      // slight y-stretch along strings — tension
      p.y *= 1.0 + pull * 0.08 * strumEnvelope;

      // particles far from strings: the original erosion, gentler now
      // they drift away like notes fading
      float farFromString = smoothstep(0.4, 1.5, distToString);
      float noteDecay = farFromString * uStrum;
      vec3 driftDir = normalize(norm + vec3(0.0, 0.3, 0.0));
      driftDir.x += 0.1 * sin(seed * 31.0 + t * 0.2);
      p += driftDir * noteDecay * 0.4 * hash(seed * 97.0);

      // remaining particles: subtle breathing
      float breathe = (1.0 - noteDecay) * 0.004 * sin(t * 0.35 + seed * 6.28);
      p += norm * breathe;

      // reveal
      vec3 entry = p + norm * 2.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vStringDist = distToString;

      // color: concrete base morphing toward aged amber/golden near strings
      // — psaltery wood, catgut, parchment —
      vec3 concrete = vec3(0.58, 0.54, 0.50);
      vec3 amber    = vec3(0.72, 0.58, 0.38);
      vec3 parchment = vec3(0.78, 0.72, 0.60);
      vec3 graphite = vec3(0.28, 0.26, 0.25);
      vec3 catgut   = vec3(0.85, 0.76, 0.58);

      float k = hash(seed * 73.0);
      vec3 col = mix(concrete, graphite, smoothstep(0.0, 0.4, k));
      col = mix(col, parchment, smoothstep(0.4, 0.7, k) * 0.5);

      // near-string particles warm toward amber/catgut
      float stringWarmth = pull * 0.6;
      col = mix(col, amber, stringWarmth * 0.5);
      col = mix(col, catgut, stringWarmth * strumEnvelope * 0.4);

      // vibrating particles glow slightly brighter
      float vibGlow = abs(vibAmp) * 3.0;
      col += vec3(0.12, 0.08, 0.02) * vibGlow;

      // drifting particles fade to ash
      vec3 ash = vec3(0.65, 0.60, 0.55);
      col = mix(col, ash, noteDecay * 0.5);

      // alpha
      float fadeOut = 1.0 - smoothstep(0.8, 2.5, noteDecay);
      float stayAlpha = (1.0 - noteDecay) * (0.35 + 0.2 * (0.5 + 0.5 * sin(t * 0.3 + seed * 4.0)));
      // string-aligned particles slightly brighter
      stayAlpha += pull * 0.15 * strumEnvelope;
      vAlpha = mix(stayAlpha, 0.12 * fadeOut, step(0.5, noteDecay)) * uReady;
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // string-near particles slightly larger (string thickness)
      float baseSize = mix(0.7, 1.0, pull * strumEnvelope * 0.5);
      gl_PointSize = baseSize * uPixel * (40.0 / dist) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;

      if (vAlpha < 0.005) gl_Position = vec4(9999.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uBg;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vStringDist;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      // sharper for string-aligned, softer for drifting
      float nearString = smoothstep(1.0, 0.0, vStringDist);
      float falloff = mix(12.0, 6.0, nearString * 0.5);
      float a = exp(-r * falloff) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

// — dust motes become harmonic overtone particles —
const DUST_N = 3000;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustSeed = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 20;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
  dustSeed[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uStrum;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      float t = uTime;
      // drift like sound waves propagating
      p.y += sin(t * 0.1 + seed * 6.28) * 0.4;
      p.x += cos(t * 0.06 + seed * 3.14) * 0.3;
      // pulse with strum — overtones in the air
      float pulse = sin(t * 1.5 * (1.0 + seed * 2.0)) * 0.5 + 0.5;
      vA = smoothstep(0.15, 0.6, uStrum) * (0.03 + 0.04 * pulse * sin(t * 0.5 + seed * 20.0));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.2 * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      vec3 col = vec3(0.70, 0.58, 0.42);
      gl_FragColor = vec4(col * vA, vA);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

// — string lines: faint vertical lines as visual anchors —
const STRING_COUNT = 7;
const STRING_SPACING = 1.6;
const stringGroup = new THREE.Group();
for (let i = 0; i < STRING_COUNT; i++) {
  const x = (i - (STRING_COUNT - 1) / 2) * STRING_SPACING;
  const lineGeom = new THREE.BufferGeometry();
  const verts = new Float32Array([x, -5, 0, x, 5, 0]);
  lineGeom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const lineMat = new THREE.LineBasicMaterial({
    color: new THREE.Color(0.55, 0.45, 0.30),
    transparent: true,
    opacity: 0.0,
    blending: THREE.AdditiveBlending
  });
  const line = new THREE.Line(lineGeom, lineMat);
  line.userData.idx = i;
  stringGroup.add(line);
}
scene.add(stringGroup);

let revealStart = 0;
const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';

new GLTFLoader().load(HEAD_URL,
  (gltf) => {
    let target = null;
    gltf.scene.traverse(o => { if (!target && o.isMesh && o.geometry?.attributes?.position) target = o; });
    if (!target) { document.getElementById('loading').textContent = 'no mesh'; return; }
    target.updateMatrixWorld(true);

    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    g.computeVertexNormals();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const scl = 8 / Math.max(size.x, size.y, size.z);
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    sampleMesh.geometry.computeVertexNormals();
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const tmp = new THREE.Vector3();
    const tmpN = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      sampler.sample(tmp, tmpN);
      restPos[i * 3]     = tmp.x;
      restPos[i * 3 + 1] = tmp.y;
      restPos[i * 3 + 2] = tmp.z;
      normals[i * 3]     = tmpN.x;
      normals[i * 3 + 1] = tmpN.y;
      normals[i * 3 + 2] = tmpN.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(restPos.slice(), 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('norm',     new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    const since = (performance.now() - revealStart) / 1000;
    // slow reveal over 4 seconds
    uniforms.uReady.value = Math.min(1.0, since / 4.0);

    // strum begins after 5s, builds slowly over 30s
    // oscillates like repeated gentle plucking — psaltery played in devotion
    const strumStart = 5.0;
    if (since > strumStart) {
      const strumT = (since - strumStart);
      // gentle build to 0.7, then slow oscillation as if being played
      const build = Math.min(1.0, strumT / 30.0);
      const pluck = 0.08 * Math.sin(strumT * 0.15) * build;
      uniforms.uStrum.value = 0.7 * (0.5 - 0.5 * Math.cos(build * Math.PI)) + pluck;
    }

    // fade string lines in with strum
    stringGroup.children.forEach(line => {
      const strumVal = uniforms.uStrum.value;
      const delay = line.userData.idx / STRING_COUNT * 0.3;
      const fade = Math.max(0, Math.min(0.06, (strumVal - delay) * 0.15));
      line.material.opacity = fade;
    });
  }

  // gentle camera drift — contemplative, slightly swaying like a listener
  const camT = elapsed * 0.018;
  camera.position.x = Math.sin(camT) * 1.4;
  camera.position.y = 0.5 + Math.sin(camT * 0.6) * 0.25;
  camera.lookAt(0, 0, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
