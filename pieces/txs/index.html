<title>txs · watery · Vija Celmins particle graphite</title>
<style>

<body>
<div class="id">txs</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*
  Vija Celmins × "watery" — graphite ocean surface
  
  The parent's differential-growth loop is flattened onto a horizontal plane,
  duplicated into concentric ripple-rings. Each ring undulates with slow wave
  functions — the y-displacement is tiny, patient, like graphite pressure on
  paper. Thin silver tubes = obsessive pencil marks building an ocean surface.
  
  Monochrome silver-grey on near-black. Camera at a low angle — the ocean
  stretches wide, filling the frame.
*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 12, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// ─────────── differential growth on XZ plane (from parent 2iy)
const MAX_VERTS = 600;
const ATTRACT   = 0.055;
const REPEL_R   = 0.48;
const REPEL_STR = 0.12;
const NOISE_F   = 0.002;
const PRESSURE  = 0.003;
const MAX_D     = 0.38;

function makeRing(radius, count) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const th = (i / count) * Math.PI * 2;
    const r = radius + (Math.random() - 0.5) * 0.08;
    pts.push({ x: Math.cos(th) * r, z: Math.sin(th) * r, age: 0 });
  }
  return pts;
}

const CELL = REPEL_R;
function key2(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }

function stepRing(verts) {
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  const grid = new Map();
  for (let i = 0; i < n; i++) {
    const v = verts[i], k = key2(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
  function nearby(v) {
    const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
    const out = [];
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const arr = grid.get((cx + dx) + ',' + (cz + dz));
      if (arr) for (const idx of arr) out.push(idx);
    }
    return out;
  }

  const ddx = new Float32Array(n), ddz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      ddx[i] += ex * f; ddz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    ddx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    ddz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    ddx[i] += (ox / d) * PRESSURE;
    ddz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    verts[i].x += ddx[i] + (Math.random() - 0.5) * NOISE_F;
    verts[i].z += ddz[i] + (Math.random() - 0.5) * NOISE_F;
    verts[i].age += 0.001;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex * ex + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5, age: Math.max(a.age, b.age) * 0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// Create concentric rings — like ripples
const NUM_RINGS = 9;
const rings = [];
for (let r = 0; r < NUM_RINGS; r++) {
  const radius = 1.2 + r * 1.1;
  const count = 14 + r * 4;
  rings.push(makeRing(radius, count));
}

// Pre-grow rings (patient, slow accretion like graphite layers)
for (let s = 0; s < 500; s++) {
  for (const ring of rings) stepRing(ring);
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

// ─────────── wave function for y-displacement (ocean surface)
function waveY(x, z, t) {
  // Multiple gentle sine waves — Celmins' ocean is not dramatic,
  // it's an infinite field of small patient undulations
  let y = 0;
  y += Math.sin(x * 0.7 + t * 0.3) * 0.12;
  y += Math.sin(z * 0.9 - t * 0.2) * 0.10;
  y += Math.sin((x + z) * 1.3 + t * 0.15) * 0.06;
  y += Math.sin(x * 2.1 - z * 1.7 + t * 0.4) * 0.03;
  y += Math.sin(x * 3.2 + z * 2.8 - t * 0.25) * 0.015;
  return y;
}

// ─────────── tube rendering — thin graphite marks
const RADIAL = 5;
const ringMeshes = [];
const greys = [0.72, 0.65, 0.58, 0.68, 0.55, 0.62, 0.70, 0.53, 0.60];

for (let r = 0; r < NUM_RINGS; r++) {
  const g = greys[r];
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(g * 0.85, g * 0.88, g * 0.95),
    transparent: true,
    opacity: 0.45 + (r % 3) * 0.08,
  });
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
  scene.add(mesh);
  ringMeshes.push(mesh);
}

function buildTube(verts, time) {
  const n = verts.length;
  if (n < 6) return null;

  const pts = verts.map(v => new THREE.Vector3(v.x, waveY(v.x, v.z, time), v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  const N = Math.min(500, n * 2);
  const positions = new Float32Array(N * RADIAL * 3);
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < N; i++) {
    const t = i / N;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();

    // curvature → pressure (thicker at curves, thinner on straights)
    const dt = 1 / N;
    const t1 = curve.getTangent(((t - dt) + 1) % 1);
    const t2 = curve.getTangent((t + dt) % 1);
    const curv = Math.max(0, 1 - t1.dot(t2));
    const radius = 0.012 + 0.035 * Math.min(1, curv * 12);

    const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
    if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

    for (let j = 0; j < RADIAL; j++) {
      const ang = (j / RADIAL) * Math.PI * 2;
      const vx = p.x + normal.x * Math.cos(ang) * radius + binormal.x * Math.sin(ang) * radius;
      const vy = p.y + normal.y * Math.cos(ang) * radius + binormal.y * Math.sin(ang) * radius;
      const vz = p.z + normal.z * Math.cos(ang) * radius + binormal.z * Math.sin(ang) * radius;
      const idx = (i * RADIAL + j) * 3;
      positions[idx] = vx;
      positions[idx + 1] = vy;
      positions[idx + 2] = vz;
    }
  }

  for (let i = 0; i < N; i++) {
    const ni = (i + 1) % N;
    for (let j = 0; j < RADIAL; j++) {
      const nj = (j + 1) % RADIAL;
      const a = i * RADIAL + j, b = i * RADIAL + nj;
      const c = ni * RADIAL + j, d = ni * RADIAL + nj;
      indices.push(a, b, c, b, d, c);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

// ─────────── subtle horizontal spray particles (graphite dust)
const DUST_COUNT = 4000;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_COUNT * 3);
const dustAlpha = new Float32Array(DUST_COUNT);
for (let i = 0; i < DUST_COUNT; i++) {
  const ang = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 12;
  dustPos[i * 3] = Math.cos(ang) * r;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 0.3;
  dustPos[i * 3 + 2] = Math.sin(ang) * r;
  dustAlpha[i] = 0.08 + Math.random() * 0.15;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('alpha', new THREE.BufferAttribute(dustAlpha, 1));

const dustMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    void main() {
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 1.2 * (8.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = vAlpha * smoothstep(0.5, 0.15, d);
      gl_FragColor = vec4(0.68, 0.72, 0.78, a);
    }
  `
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
scene.add(dustPoints);

// ─────────── resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── animation loop
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();

  if (!paused) {
    for (const ring of rings) stepRing(ring);
  }

  // Rebuild all ring tubes
  for (let r = 0; r < NUM_RINGS; r++) {
    const geom = buildTube(rings[r], t);
    if (geom) {
      const old = ringMeshes[r].geometry;
      ringMeshes[r].geometry = geom;
      old.dispose();
    }
  }

  // Animate dust particles — gentle ocean sway
  const pos = dustGeo.attributes.position;
  for (let i = 0; i < DUST_COUNT; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    pos.setY(i, waveY(x, z, t) + (Math.sin(i * 0.37 + t * 0.5) * 0.02));
  }
  pos.needsUpdate = true;

  // Camera: gentle slow orbit, tracking centroid
  let cx = 0, cz = 0, count = 0;
  for (const ring of rings) for (const v of ring) {
    cx += v.x; cz += v.z; count++;
  }
  cx /= Math.max(count, 1);
  cz /= Math.max(count, 1);

  controls.target.x += (cx - controls.target.x) * 0.02;
  controls.target.y += (0.0 - controls.target.y) * 0.02;
  controls.target.z += (cz - controls.target.z) * 0.02;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
