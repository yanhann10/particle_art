<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ja5 · thread field (Shiota)</title>
<!-- MOTION: sway, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">ja5</div>
<div class="hint">memory threads · 16k segments</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 12, 45);
camera.lookAt(0, 0, 0);

// Shiota signature: dense crimson threads in architectural void
const THREAD_COLOR = 0x9c1f1f;
const ANCHOR_COUNT = 800;
const SEGMENT_COUNT = 16000;

// Generate anchor points in a volumetric cloud
const anchors = [];
for (let i = 0; i < ANCHOR_COUNT; i++) {
  // Concentrate mass in upper-middle volume, thinning toward edges
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  const r = Math.pow(Math.random(), 0.6) * 18;
  
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta) - 5; // shift down for architectural hang
  const z = r * Math.cos(phi);
  
  anchors.push(new THREE.Vector3(x, y, z));
}

// Build KD-tree style nearest-neighbor lookup (simplified — brute force for 800 points is fine)
function findNearestNeighbors(idx, count) {
  const origin = anchors[idx];
  const distances = anchors.map((a, i) => ({
    idx: i,
    dist: i === idx ? Infinity : origin.distanceTo(a)
  }));
  distances.sort((a, b) => a.dist - b.dist);
  return distances.slice(0, count).map(d => d.idx);
}

// Create line segments: each anchor connects to 3-5 nearest neighbors
const segments = [];
const seenPairs = new Set();

for (let i = 0; i < ANCHOR_COUNT; i++) {
  const neighborCount = 3 + Math.floor(Math.random() * 3); // 3-5 neighbors
  const neighbors = findNearestNeighbors(i, neighborCount);
  
  for (const nIdx of neighbors) {
    const pairKey = i < nIdx ? `${i}-${nIdx}` : `${nIdx}-${i}`;
    if (!seenPairs.has(pairKey)) {
      seenPairs.add(pairKey);
      segments.push([i, nIdx]);
    }
  }
}

// Pad to exactly SEGMENT_COUNT by adding random long-distance threads
while (segments.length < SEGMENT_COUNT) {
  const a = Math.floor(Math.random() * ANCHOR_COUNT);
  let b = Math.floor(Math.random() * ANCHOR_COUNT);
  while (b === a) b = Math.floor(Math.random() * ANCHOR_COUNT);
  const pairKey = a < b ? `${a}-${b}` : `${b}-${a}`;
  if (!seenPairs.has(pairKey)) {
    seenPairs.add(pairKey);
    segments.push([a, b]);
  }
}

// Build geometry: each segment is a BufferGeometry Line
const lineMat = new THREE.LineBasicMaterial({
  color: THREAD_COLOR,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lineGroup = new THREE.Group();

for (const [aIdx, bIdx] of segments) {
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(6);
  positions[0] = anchors[aIdx].x;
  positions[1] = anchors[aIdx].y;
  positions[2] = anchors[aIdx].z;
  positions[3] = anchors[bIdx].x;
  positions[4] = anchors[bIdx].y;
  positions[5] = anchors[bIdx].z;
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  
  const line = new THREE.Line(geom, lineMat);
  line.userData.anchorA = aIdx;
  line.userData.anchorB = bIdx;
  lineGroup.add(line);
}

scene.add(lineGroup);

// Pointer influence: subtle sway toward pointer
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth - 0.5) * 2;
  pointer.y = -(e.clientY / innerHeight - 0.5) * 2;
});

// Sway anchors slightly under pointer influence
const anchorOffsets = anchors.map(() => new THREE.Vector3());

function updateAnchors(time) {
  const pointerForce = new THREE.Vector3(pointer.x * 3, pointer.y * 3, 0);
  
  for (let i = 0; i < ANCHOR_COUNT; i++) {
    const base = anchors[i];
    const offset = anchorOffsets[i];
    
    // Subtle drift from pointer
    const toPtrDist = Math.hypot(base.x - pointerForce.x, base.y - pointerForce.y);
    const influence = Math.exp(-toPtrDist * 0.03) * 0.4;
    
    const dx = (pointerForce.x - base.x) * influence;
    const dy = (pointerForce.y - base.y) * influence;
    
    // Natural oscillation per anchor
    const phaseX = Math.sin(time * 0.3 + i * 0.1) * 0.08;
    const phaseY = Math.cos(time * 0.4 + i * 0.15) * 0.08;
    
    offset.x += (dx + phaseX - offset.x) * 0.03;
    offset.y += (dy + phaseY - offset.y) * 0.03;
  }
  
  // Update line geometries
  lineGroup.children.forEach(line => {
    const aIdx = line.userData.anchorA;
    const bIdx = line.userData.anchorB;
    const pos = line.geometry.attributes.position;
    
    const a = anchors[aIdx].clone().add(anchorOffsets[aIdx]);
    const b = anchors[bIdx].clone().add(anchorOffsets[bIdx]);
    
    pos.array[0] = a.x;
    pos.array[1] = a.y;
    pos.array[2] = a.z;
    pos.array[3] = b.x;
    pos.array[4] = b.y;
    pos.array[5] = b.z;
    pos.needsUpdate = true;
  });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let startTime = performance.now();
function loop() {
  const now = performance.now();
  const time = (now - startTime) / 1000;
  
  updateAnchors(time);
  
  // Slow orbital camera
  const angle = time * 0.08;
  camera.position.x = Math.sin(angle) * 45;
  camera.position.z = Math.cos(angle) * 45;
  camera.lookAt(0, -2, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
