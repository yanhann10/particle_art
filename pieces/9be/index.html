<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ping · vascular sonar · surprise from cyx</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>

<body>
<div class="id">4rv</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">ping · sonar surprise on cyx</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── PING: the vascular tower from cyx grows as before, but every few
   seconds a sonar-like "ping" fires from a random point on the structure.
   A bright cyan wavefront ring expands outward through the geometry,
   briefly illuminating vertices it passes through, like echolocation
   rippling through a living antenna. Inspired by Ryoji Ikeda's datamatics
   — a digital signal interrupting an organic form. The ping is brief,
   tasteful, and the form self-recovers to its warm baseline. ── */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.04);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff0e8, 0.9);
lightKey.position.set(5, 10, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const lightRim = new THREE.DirectionalLight(0xd8a868, 0.5);
lightRim.position.set(-5, 3, -5);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (inherited from cyx)
const MAX_VERTS = 1500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0, strand: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      if (v.strand !== u.strand && u.age > 0.3) continue;
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    if (a.strand === v.strand && b.strand === v.strand){
      dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
      dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
      dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
    }
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x-cx, oy = verts[i].y-cy, oz = verts[i].z-cz;
    const d = Math.hypot(ox, oy, oz)+1e-6;
    dx[i] += (ox/d)*PRESSURE;
    dy[i] += (oy/d)*PRESSURE*0.4;
    dz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      const newV = {
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age)*0.5,
        strand: a.strand
      };
      if (newV.age > 0.22){
        newV.strand = Math.random() < 0.5 ? 0 : 1;
      }
      grown.push(newV);
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── PING state
// Every ~4s a ping fires from a random vertex position.
// The wavefront expands at a fixed speed, illuminating a thin shell.
let pingOrigin = new THREE.Vector3(0, 0, 0);
let pingTime = -10.0; // seconds since ping fired (negative = dormant)
const PING_INTERVAL = 4.2;  // seconds between pings
const PING_SPEED = 6.0;     // units per second
const PING_WIDTH = 1.2;     // shell thickness
const PING_DURATION = 3.0;  // how long before ping fades completely
let nextPing = 2.0;         // first ping after 2s

function firePing(){
  const idx = Math.floor(Math.random() * verts.length);
  const v = verts[idx];
  pingOrigin.set(v.x, v.y, v.z);
  pingTime = 0.0;
  nextPing = PING_INTERVAL + (Math.random() - 0.5) * 1.4;
}

// ─────────── liminal phase
function liminalPhase(t){
  return 0.5 + 0.5 * Math.sin(t * 0.24);
}

// ─────────── strand materials with ping uniform
const colorPhase = new THREE.Color(0x88a0b8);
const emissiveBase = new THREE.Color(0x2a0808);
const emissivePhase = new THREE.Color(0x1a2833);

function buildStrandMaterial(baseHue){
  return new THREE.ShaderMaterial({
    uniforms: {
      uPhase: { value: 0.0 },
      uColorBase: { value: new THREE.Color(baseHue) },
      uColorPhase: { value: colorPhase.clone() },
      uEmissiveBase: { value: emissiveBase.clone() },
      uEmissivePhase: { value: emissivePhase.clone() },
      uFogColor: { value: new THREE.Color(0x0a0608) },
      uFogDensity: { value: 0.04 },
      uPingOrigin: { value: new THREE.Vector3() },
      uPingRadius: { value: -1.0 },
      uPingFade: { value: 0.0 },
      uPingWidth: { value: PING_WIDTH }
    },
    vertexShader: `
      attribute float vAge;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying float vAgeOut;
      varying vec3 vWorldPos;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vViewPos = mvPos.xyz;
        vWorldPos = position;
        vAgeOut = vAge;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uPhase;
      uniform vec3 uColorBase;
      uniform vec3 uColorPhase;
      uniform vec3 uEmissiveBase;
      uniform vec3 uEmissivePhase;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      uniform vec3 uPingOrigin;
      uniform float uPingRadius;
      uniform float uPingFade;
      uniform float uPingWidth;
      varying vec3 vNormal;
      varying vec3 vViewPos;
      varying float vAgeOut;
      varying vec3 vWorldPos;
      void main(){
        float ageMix = smoothstep(0.15, 0.35, vAgeOut);
        float phaseMix = uPhase * ageMix;
        vec3 col = mix(uColorBase, uColorPhase, phaseMix);
        vec3 emit = mix(uEmissiveBase, uEmissivePhase, phaseMix);
        vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
        float diff = max(0.0, dot(vNormal, lightDir)) * 0.7 + 0.3;
        vec3 rgb = col * diff + emit;

        // ── PING wavefront ──
        if (uPingRadius > 0.0) {
          float dist = distance(vWorldPos, uPingOrigin);
          float edge = smoothstep(uPingRadius - uPingWidth, uPingRadius - uPingWidth * 0.3, dist)
                     * (1.0 - smoothstep(uPingRadius, uPingRadius + uPingWidth * 0.15, dist));
          vec3 pingColor = vec3(0.45, 0.92, 0.98); // bright cyan sonar
          float pingGlow = edge * uPingFade;
          rgb += pingColor * pingGlow * 1.6;
          rgb = mix(rgb, pingColor, pingGlow * 0.25);
        }

        float fogDist = length(vViewPos);
        float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDist * fogDist);
        rgb = mix(rgb, uFogColor, fogFactor);
        float alpha = mix(1.0, 0.35, phaseMix * 0.6);
        gl_FragColor = vec4(rgb, alpha);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide
  });
}

const mat0 = buildStrandMaterial(0xb04438);
const mat1 = buildStrandMaterial(0xa85048);

// ─────────── ping ring particle effect (expanding ring of dots)
const RING_COUNT = 80;
const ringGeo = new THREE.BufferGeometry();
const ringPos = new Float32Array(RING_COUNT * 3);
const ringAlpha = new Float32Array(RING_COUNT);
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
ringGeo.setAttribute('alpha', new THREE.BufferAttribute(ringAlpha, 1));

const ringMat = new THREE.ShaderMaterial({
  uniforms: {
    uFogColor: { value: new THREE.Color(0x0a0608) },
    uFogDensity: { value: 0.04 }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying vec3 vViewPos;
    void main(){
      vAlpha = alpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewPos = mvPos.xyz;
      gl_PointSize = 3.0;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    varying float vAlpha;
    varying vec3 vViewPos;
    void main(){
      float r = length(gl_PointCoord - 0.5);
      if (r > 0.5) discard;
      vec3 col = vec3(0.45, 0.92, 0.98);
      float fogDist = length(vViewPos);
      float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDist * fogDist);
      col = mix(col, uFogColor, fogFactor);
      gl_FragColor = vec4(col, vAlpha * smoothstep(0.5, 0.1, r));
    }
  `,
  transparent: true,
  depthWrite: false
});
const ringPoints = new THREE.Points(ringGeo, ringMat);
scene.add(ringPoints);

// ring angles (fixed)
const ringAngles = [];
for (let i = 0; i < RING_COUNT; i++){
  ringAngles.push({
    theta: Math.random() * Math.PI * 2,
    phi: (Math.random() - 0.5) * Math.PI
  });
}

let tubeMesh0 = null, tubeMesh1 = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let prevTime = start;
let timeSincePing = 99;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  for (let s = 0; s < 2; s++) step();

  // ── ping timing
  timeSincePing += dt;
  if (timeSincePing >= nextPing && verts.length > 20){
    firePing();
    timeSincePing = 0;
  }

  if (pingTime >= 0) pingTime += dt;
  const pingRadius = pingTime >= 0 ? pingTime * PING_SPEED : -1.0;
  const pingFade = pingTime >= 0 ? Math.max(0, 1.0 - pingTime / PING_DURATION) : 0.0;

  const phase = liminalPhase(t);
  for (const m of [mat0, mat1]){
    m.uniforms.uPhase.value = phase;
    m.uniforms.uPingOrigin.value.copy(pingOrigin);
    m.uniforms.uPingRadius.value = pingRadius;
    m.uniforms.uPingFade.value = pingFade;
  }

  // ── update ring particles
  if (pingRadius > 0 && pingFade > 0.05){
    const posArr = ringGeo.attributes.position.array;
    const alphaArr = ringGeo.attributes.alpha.array;
    for (let i = 0; i < RING_COUNT; i++){
      const a = ringAngles[i];
      const r = pingRadius;
      posArr[i*3]   = pingOrigin.x + Math.cos(a.theta) * Math.cos(a.phi) * r;
      posArr[i*3+1] = pingOrigin.y + Math.sin(a.phi) * r;
      posArr[i*3+2] = pingOrigin.z + Math.sin(a.theta) * Math.cos(a.phi) * r;
      alphaArr[i] = pingFade * 0.6;
    }
    ringGeo.attributes.position.needsUpdate = true;
    ringGeo.attributes.alpha.needsUpdate = true;
    ringPoints.visible = true;
  } else {
    ringPoints.visible = false;
  }

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){
      if (v.y < yMin) yMin = v.y;
      if (v.y > yMax) yMax = v.y;
    }

    const verts0 = verts.filter(v => v.strand === 0);
    const verts1 = verts.filter(v => v.strand === 1);

    function buildStrand(vertList, mat, existingMesh){
      if (vertList.length < 3) return existingMesh;
      const pts = vertList.map(v => new THREE.Vector3(v.x, v.y, v.z));
      const ages = vertList.map(v => v.age);
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
      const N_SAMPLES = Math.min(500, vertList.length * 2);
      const RADIAL = 8;
      const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
      const ageAttrib = new Float32Array(N_SAMPLES * RADIAL);
      const indices = [];
      const up = new THREE.Vector3(0, 1, 0);
      const pulse = 1.0 + 0.10 * Math.sin(t * 1.6);

      for (let i = 0; i < N_SAMPLES; i++){
        const tt = i / (N_SAMPLES - 1);
        const p = curve.getPointAt(tt);
        const idx = Math.floor(tt * (vertList.length - 1));
        const localAge = ages[Math.min(idx, ages.length - 1)];
        const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / (yMax - yMin + 0.1)));
        let r = 0.40 * (1 - heightFrac * 0.78);
        const node = Math.sin(tt * 22.0) * 0.5 + 0.5;
        r *= (1.0 + 0.18 * Math.pow(node, 6));
        r *= pulse;
        const tangent = curve.getTangentAt(tt).normalize();
        const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
        for (let j = 0; j < RADIAL; j++){
          const ang = (j / RADIAL) * Math.PI * 2;
          const v = new THREE.Vector3()
            .copy(normal).multiplyScalar(Math.cos(ang) * r)
            .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
            .add(p);
          positions[(i*RADIAL+j)*3]     = v.x;
          positions[(i*RADIAL+j)*3 + 1] = v.y;
          positions[(i*RADIAL+j)*3 + 2] = v.z;
          ageAttrib[i*RADIAL+j] = localAge;
        }
      }
      for (let i = 0; i < N_SAMPLES - 1; i++){
        for (let j = 0; j < RADIAL; j++){
          const nj = (j+1) % RADIAL;
          const a = i*RADIAL+j, b = i*RADIAL+nj;
          const c = (i+1)*RADIAL+j, d = (i+1)*RADIAL+nj;
          indices.push(a, b, c);
          indices.push(b, d, c);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('vAge', new THREE.BufferAttribute(ageAttrib, 1));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      if (existingMesh){ scene.remove(existingMesh); existingMesh.geometry.dispose(); }
      const mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      return mesh;
    }

    tubeMesh0 = buildStrand(verts0, mat0, tubeMesh0);
    tubeMesh1 = buildStrand(verts1, mat1, tubeMesh1);
  }

  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
