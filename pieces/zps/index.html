<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zps · vera molnar · (dés)ordres</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede3; overflow:hidden;
               color:#1a1a1a; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#3a3a3a; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; 
          letter-spacing: 0.04em; color:#4a4a4a; }
</style>
</head>
<body>
<div class="id">zps · vera molnar · (dés)ordres</div>
<div class="hint">entropy gradient · 1976 algorithmic series</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede3, 1);
document.body.appendChild(renderer.domElement);

const GRID = 32;
const SPACING = 1.4;
const FIELD_WIDTH = GRID * SPACING;
const FIELD_HEIGHT = GRID * SPACING;

// We'll use InstancedMesh for line-segments represented as thin stretched boxes
const N = GRID * GRID;
const segmentGeo = new THREE.BoxGeometry(0.02, 1.2, 0.02);
const segmentMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a });
const segments = new THREE.InstancedMesh(segmentGeo, segmentMat, N);
scene.add(segments);

const dummy = new THREE.Object3D();
const chaos = new Float32Array(N);

// Gaussian sample
function gaussianRandom() {
  let u = 0, v = 0;
  while(u === 0) u = Math.random();
  while(v === 0) v = Math.random();
  return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
}

let idx = 0;
for (let iy = 0; iy < GRID; iy++){
  for (let ix = 0; ix < GRID; ix++){
    const x = (ix - GRID/2 + 0.5) * SPACING;
    const y = (iy - GRID/2 + 0.5) * SPACING;
    
    // chaos gradient: 0 at top (iy=0), 1 at bottom (iy=GRID-1)
    const c = iy / (GRID - 1);
    chaos[idx] = c;
    
    // base position
    dummy.position.set(x, -y, 0);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    segments.setMatrixAt(idx, dummy.matrix);
    idx++;
  }
}

segments.instanceMatrix.needsUpdate = true;

// Store base positions for animation
const basePos = [];
const baseRot = [];
idx = 0;
for (let iy = 0; iy < GRID; iy++){
  for (let ix = 0; ix < GRID; ix++){
    const x = (ix - GRID/2 + 0.5) * SPACING;
    const y = (iy - GRID/2 + 0.5) * SPACING;
    basePos.push(new THREE.Vector3(x, -y, 0));
    baseRot.push(0);
    idx++;
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  // slow orbit
  camera.position.x = Math.sin(t * 0.08) * 50;
  camera.position.z = Math.cos(t * 0.08) * 50;
  camera.position.y = 5 + Math.sin(t * 0.05) * 8;
  camera.lookAt(0, 0, 0);
  
  // animate instances with per-segment disorder
  idx = 0;
  for (let iy = 0; iy < GRID; iy++){
    for (let ix = 0; ix < GRID; ix++){
      const c = chaos[idx];
      const base = basePos[idx];
      
      // position offset: grows with chaos
      const offsetX = gaussianRandom() * c * 0.35;
      const offsetY = gaussianRandom() * c * 0.35;
      const offsetZ = gaussianRandom() * c * 0.15;
      
      // rotation: z-axis rotation increases with chaos
      const rot = gaussianRandom() * c * Math.PI * 0.4;
      
      // scale perturbation
      const scaleVar = 1.0 + gaussianRandom() * c * 0.2;
      
      // slow temporal drift so it's not static
      const drift = Math.sin(t * 0.3 + idx * 0.02) * c * 0.08;
      
      dummy.position.set(
        base.x + offsetX + drift,
        base.y + offsetY,
        base.z + offsetZ
      );
      dummy.rotation.set(0, 0, rot);
      dummy.scale.set(1, scaleVar, 1);
      dummy.updateMatrix();
      segments.setMatrixAt(idx, dummy.matrix);
      idx++;
    }
  }
  
  segments.instanceMatrix.needsUpdate = true;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
