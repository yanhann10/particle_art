<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3ul · Shiota — Bound in Silence</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">3ul</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.008));
const key1 = new THREE.PointLight(0x1c0404, 0.016, 28, 2.0);
key1.position.set(-14, 16, 6);
scene.add(key1);

let seed = 581203;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 42, h: 26, d: 40 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED DRESS FORM — cottonpaper white
const dressPos = new THREE.Vector3(1.2, -2.4, 0.6);

const dressGeo = new THREE.Group();

// torso — elongated octahedron
const torsoVerts = new Float32Array([
  0,2.8,0, 0.8,1.4,0.4, 0,0,0,
  0,2.8,0, 0.8,1.4,-0.4, 0,0,0,
  0,2.8,0, -0.8,1.4,-0.4, 0,0,0,
  0,2.8,0, -0.8,1.4,0.4, 0,0,0,
  0,0,0, 0.8,1.4,0.4, 1.2,-1.8,0.6,
  0,0,0, 0.8,1.4,-0.4, 1.2,-1.8,-0.6,
  0,0,0, -0.8,1.4,-0.4, -1.2,-1.8,-0.6,
  0,0,0, -0.8,1.4,0.4, -1.2,-1.8,0.6,
  1.2,-1.8,0.6, 0.8,1.4,0.4, 0.8,1.4,-0.4,
  1.2,-1.8,-0.6, 0.8,1.4,-0.4, -0.8,1.4,-0.4,
  -1.2,-1.8,-0.6, -0.8,1.4,-0.4, -0.8,1.4,0.4,
  -1.2,-1.8,0.6, -0.8,1.4,0.4, 0.8,1.4,0.4
]);
const torsoGeo = new THREE.BufferGeometry();
torsoGeo.setAttribute('position', new THREE.BufferAttribute(torsoVerts, 3));
torsoGeo.computeVertexNormals();

const dressMat = new THREE.MeshStandardMaterial({
  color: 0xf4ede2,
  emissive: 0xd8cbb8,
  emissiveIntensity: 0.58,
  roughness: 0.96,
  metalness: 0.0
});

const torso = new THREE.Mesh(torsoGeo, dressMat);
dressGeo.add(torso);

dressGeo.position.copy(dressPos);
scene.add(dressGeo);

const dressGlow = new THREE.PointLight(0x1a0303, 0.012, 16, 2.4);
dressGlow.position.copy(dressPos);
scene.add(dressGlow);

// ANCHOR GRID — vertices of cube subdivided + dress surface points
const anchors = [];

// dress surface anchors — 18 points around torso
for(let i=0; i<18; i++){
  const angle = (i/18)*Math.PI*2;
  const h = -1.8 + (i%6)*0.7;
  const r = (h > 1.0) ? 0.8 : (1.2 - h*0.2);
  const x = dressPos.x + Math.cos(angle)*r;
  const y = dressPos.y + h;
  const z = dressPos.z + Math.sin(angle)*r;
  anchors.push(new THREE.Vector3(x, y, z));
}

// suspension point above dress
anchors.push(new THREE.Vector3(dressPos.x, dressPos.y+5.2, dressPos.z));

// room volume grid — 8×6×8 lattice
for(let ix=0; ix<8; ix++){
  for(let iy=0; iy<6; iy++){
    for(let iz=0; iz<8; iz++){
      const x = -hw + (ix/7)*ROOM.w;
      const y = -hh + (iy/5)*ROOM.h;
      const z = -hd + (iz/7)*ROOM.d;
      const pt = new THREE.Vector3(x, y, z);
      if(pt.distanceTo(dressPos) > 3.0){
        anchors.push(pt);
      }
    }
  }
}

// wall boundary anchors
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange;
      const v = (j/steps - 0.5) * vRange;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('x', hw, ROOM.h*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.88, ROOM.d*0.88, 6));
anchors.push(...wallGrid('y', hh, ROOM.w*0.88, ROOM.d*0.88, 6));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.88, ROOM.h*0.88, 5));
anchors.push(...wallGrid('z', hd, ROOM.w*0.88, ROOM.h*0.88, 5));

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: SUSPENSION THREADS — ceiling to dress top (vertical tethers)
const suspCount = 32;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2;
  const r = 0.5 + (i%7)*0.14;
  const x = dressPos.x + Math.cos(angle)*r;
  const z = dressPos.z + Math.sin(angle)*r*0.82;
  const dressTop = new THREE.Vector3(x, dressPos.y + 2.8, z);
  
  const ceilX = dressTop.x + (rng()-0.5)*4.2;
  const ceilZ = dressTop.z + (rng()-0.5)*3.6;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, dressTop);
}

// CATEGORY B: RADIAL CONVERGENT THREADS — volume anchors toward dress (failing reach)
const dressAnchors = anchors.slice(0, 18);
const convergeCount = 4200;
for(let i=0; i<convergeCount && li<NUM_LINES-15600; i++){
  const a = anchors[18 + Math.floor(rng()*(anchors.length-18))];
  const dDress = a.distanceTo(dressPos);
  if(dDress < 5.0) continue;
  
  let closest = dressAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<4; k++){
    const candidate = dressAnchors[Math.floor(rng()*dressAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 28% fail to reach dress — threads that fall short
  if(rng()<0.28){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.32 + rng()*0.54);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// CATEGORY C: DRESS EMANATING THREADS — from dress outward into volume
for(let i=0; i<18 && li<NUM_LINES-11200; i++){
  const sa = dressAnchors[i];
  const dir = sa.clone().sub(dressPos).normalize();
  
  for(let j=0; j<16 && li<NUM_LINES-11000; j++){
    const perpAxis = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branch = dir.clone().applyAxisAngle(perpAxis, 0.48 + rng()*0.66).normalize();
    const len = 12.0 + rng()*16.0;
    const end = sa.clone().add(branch.multiplyScalar(len));
    setLine(sa, end);
  }
}

// CATEGORY D: HORIZONTAL SPANS — crossing the void at dress height
for(let i=0; i<680 && li<NUM_LINES-10300; i++){
  const y = dressPos.y + (rng()-0.5)*8.0;
  const x1 = -hw + rng()*5.2;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  const x2 = hw - rng()*5.2;
  const z2 = (rng()-0.5)*ROOM.d*0.90;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// CATEGORY E: LATTICE EDGES — short proximity connections (6–14 unit range)
const latticeCount = 5200;
let latticeAdded = 0, attempts = 0;
while(latticeAdded<latticeCount && li<NUM_LINES-4800 && attempts<28000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<5; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d>6.0 && d<14.0 && d<bestD){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  latticeAdded++;
}

// CATEGORY F: VERTICAL THREADS — floor to ceiling
for(let i=0; i<520 && li<NUM_LINES-4100; i++){
  const x = (rng()-0.5)*ROOM.w*0.86;
  const z = (rng()-0.5)*ROOM.d*0.86;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.8, hh, z + (rng()-0.5)*1.8);
  setLine(a, b);
}

// CATEGORY G: DIAGONAL CROSS-THREADS
for(let i=0; i<460 && li<NUM_LINES-3500; i++){
  const x1 = (rng()-0.5)*ROOM.w*0.84;
  const z1 = (rng()-0.5)*ROOM.d*0.84;
  const a = new THREE.Vector3(x1, -hh, z1);
  
  const x2 = x1 + (rng()-0.5)*9.6;
  const z2 = z1 + (rng()-0.5)*9.6;
  const b = new THREE.Vector3(x2, hh, z2);
  setLine(a, b);
}

// CATEGORY H: WALL-TO-WALL LONG SPANS
let wallSpans = 0;
while(wallSpans<2600 && li<NUM_LINES-800){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>11.0 && d<26.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY I: FILL remaining budget with medium-distance threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.0 && d<19.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.068,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — slow orbit inside the network, centered on dress
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.12 + lt*Math.PI*1.04;
    const r = 19.6 - lt*6.2;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 8.4 - lt*5.8;
    z = dressPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*1.16 + lt*Math.PI*1.38;
    const r = 13.4 + Math.sin(lt*Math.PI*1.2)*1.8;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 2.6 + Math.cos(lt*Math.PI*1.4)*1.6;
    z = dressPos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.52)/0.26;
    const angle = Math.PI*2.54 + lt*Math.PI*1.12;
    const r = 11.8 + Math.cos(lt*Math.PI)*2.2;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y - 1.8 - lt*7.4;
    z = dressPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*3.66 + lt*Math.PI*0.82;
    const r = 11.2 + lt*8.6;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 3.8 + lt*4.8;
    z = dressPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // dress subtle sway
  dressGeo.rotation.y = Math.sin(elapsed*0.00034)*0.018;
  dressGeo.rotation.z = Math.cos(elapsed*0.00042)*0.012;

  // camera dolly
  const speed = 0.0000068;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    dressPos.x + Math.sin(elapsed*0.000038)*0.16,
    dressPos.y + Math.cos(elapsed*0.000032)*0.14,
    dressPos.z + Math.sin(elapsed*0.000028)*0.12
  );

  key1.intensity = 0.016 + Math.sin(elapsed*0.000046)*0.0048;
  dressGlow.intensity = 0.012 + Math.sin(elapsed*0.000054)*0.0032;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
