<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

// Intent: Cy Twombly's chalk scribbles emerge from Reynolds boids —
// the flock draws in graphite pencil, the straggler writes in terracotta blood.
// Trails accumulate on cream parchment like illegible handwriting.
// The emotional arc (together → loss → seeking → return) IS the gesture —
// Twombly's mythological cycles rendered as chalk-pressure and mark-density.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── boids with narrative arc (inherited from sav) ──
const N = 481, STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++) {
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]   = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3+1] = Math.sin(ph) * r;
  pos[i*3+2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]   = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3+1] = (Math.random() - 0.5) * 0.3;
  vel[i*3+2] = (Math.random() - 0.5) * 0.4;
}
pos[0] = -1.2; pos[1] = 0.6; pos[2] = 0;

const PR = 4.0, SR = 0.9, WC = 0.018, WA = 0.060, WS = 0.080, MS = 1.4, MF = 0.030;
let cohesion = 1.0, arcStage = 'together';
const arcEl = document.getElementById('arc');
let simTime = 0;

function step(dt) {
  simTime += dt;
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++) { cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; }
  cx /= (N-1); cy /= (N-1); cz /= (N-1);

  const sx = pos[0]-cx, sy = pos[1]-cy, sz = pos[2]-cz;
  const sd = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const tc = Math.max(0, Math.min(1, 1 - sd / 8));
  cohesion += (tc - cohesion) * dt * 0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && sd > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';
  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let chX=0,chY=0,chZ=0,chN=0, alX=0,alY=0,alZ=0,alN=0, spX=0,spY=0,spZ=0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const isS = i === STRAGGLER;
    const pr = isS ? PR * 0.55 : PR;

    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const dx = pos[j*3]-px, dy = pos[j*3+1]-py, dz = pos[j*3+2]-pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > pr*pr || d2 < 1e-6) continue;
      chX += pos[j*3]; chY += pos[j*3+1]; chZ += pos[j*3+2]; chN++;
      alX += vel[j*3]; alY += vel[j*3+1]; alZ += vel[j*3+2]; alN++;
      if (d2 < SR*SR) { const inv = 1/Math.sqrt(d2); spX -= dx*inv; spY -= dy*inv; spZ -= dz*inv; }
    }

    if (isS) {
      const dr = Math.sin(simTime * 0.3) * 0.4;
      acc[i*3] += dr; acc[i*3+1] += -0.25 + Math.cos(simTime * 0.2) * 0.2; acc[i*3+2] += dr * 0.6;
    }
    if (!isS && (arcStage === 'seeking' || arcStage === 'return')) {
      const tx = pos[0]-px, ty = pos[1]-py, tz = pos[2]-pz;
      const td = Math.sqrt(tx*tx + ty*ty + tz*tz) + 1e-3;
      const sk = arcStage === 'seeking' ? 0.020 : 0.012;
      acc[i*3] += tx/td*sk; acc[i*3+1] += ty/td*sk; acc[i*3+2] += tz/td*sk;
    }

    if (chN > 0) { acc[i*3] += (chX/chN-px)*WC; acc[i*3+1] += (chY/chN-py)*WC; acc[i*3+2] += (chZ/chN-pz)*WC; }
    if (alN > 0) { acc[i*3] += (alX/alN-vel[i*3])*WA; acc[i*3+1] += (alY/alN-vel[i*3+1])*WA; acc[i*3+2] += (alZ/alN-vel[i*3+2])*WA; }
    acc[i*3] += spX*WS; acc[i*3+1] += spY*WS; acc[i*3+2] += spZ*WS;

    const d2c = px*px + py*py + pz*pz;
    if (d2c > 90) { const inv = 0.012/Math.sqrt(d2c); acc[i*3] -= px*inv; acc[i*3+1] -= py*inv; acc[i*3+2] -= pz*inv; }
  }

  const sm = (arcStage === 'loss' || arcStage === 'seeking') ? 0.55 : arcStage === 'return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++) {
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MF) { ax *= MF/af; ay *= MF/af; az *= MF/af; }
    vel[i*3] += ax; vel[i*3+1] += ay; vel[i*3+2] += az;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MS) { vx *= MS/sp; vy *= MS/sp; vz *= MS/sp; vel[i*3] = vx; vel[i*3+1] = vy; vel[i*3+2] = vz; }
    pos[i*3]   += vel[i*3]   * dt * sm;
    pos[i*3+1] += vel[i*3+1] * dt * sm;
    pos[i*3+2] += vel[i*3+2] * dt * sm;
  }
}

// ── trail system: chalk marks that accumulate on parchment ──
const TRAIL = 40;
const TRAIL_SKIP = 2;
const TPTS = N * TRAIL;
const tPos = new Float32Array(TPTS * 3);
const tBirth = new Float32Array(TPTS);
const tStrag = new Float32Array(TPTS);
const tSeed = new Float32Array(TPTS);
const tHead = new Uint8Array(N);
let frame = 0;

for (let i = 0; i < N; i++) {
  for (let t = 0; t < TRAIL; t++) {
    const idx = i * TRAIL + t;
    tPos[idx*3]   = pos[i*3];
    tPos[idx*3+1] = pos[i*3+1];
    tPos[idx*3+2] = pos[i*3+2];
    tBirth[idx] = 0;
    tStrag[idx] = i === STRAGGLER ? 1.0 : 0.0;
    tSeed[idx] = Math.random();
  }
  tHead[i] = 0;
}

function updateTrails() {
  if (frame % TRAIL_SKIP !== 0) return;
  for (let i = 0; i < N; i++) {
    tHead[i] = (tHead[i] + 1) % TRAIL;
    const slot = i * TRAIL + tHead[i];
    const isS = i === STRAGGLER;
    // hand-tremor jitter — Twombly's chalk never lands clean
    const jit = isS ? 0.12 : 0.05;
    tPos[slot*3]   = pos[i*3]   + (Math.random() - 0.5) * jit;
    tPos[slot*3+1] = pos[i*3+1] + (Math.random() - 0.5) * jit;
    tPos[slot*3+2] = pos[i*3+2] + (Math.random() - 0.5) * jit * 0.4;
    tBirth[slot] = frame;
  }
}

// ── rendering: chalk-on-parchment shader ──
const tGeom = new THREE.BufferGeometry();
tGeom.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeom.setAttribute('birth',    new THREE.BufferAttribute(tBirth, 1));
tGeom.setAttribute('strag',    new THREE.BufferAttribute(tStrag, 1));
tGeom.setAttribute('seed',     new THREE.BufferAttribute(tSeed, 1));

const MAX_AGE = (TRAIL * TRAIL_SKIP).toFixed(1);

const tMat = new THREE.ShaderMaterial({
  uniforms: {
    uFrame:    { value: 0 },
    uPx:       { value: renderer.getPixelRatio() },
    uCohesion: { value: 1.0 }
  },
  transparent: true,
  depthWrite: false,
  fog: false,
  vertexShader: `
    uniform float uFrame;
    uniform float uPx;
    uniform float uCohesion;
    attribute float birth;
    attribute float strag;
    attribute float seed;
    varying float vAlpha;
    varying vec3  vCol;
    varying float vRough;

    void main() {
      float age = clamp((uFrame - birth) / ${MAX_AGE}, 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;

      // chalk mark: bold when fresh, ghost when old
      float sz = mix(4.0, 1.0, age * age) * (0.6 + seed * 0.8);
      sz += strag * 2.2 * (1.0 - age);
      gl_PointSize = sz * uPx * (18.0 / max(dist, 1.0));

      // Twombly palette —
      // flock: graphite pencil, warm-grey, shifts cooler when cohesion drops
      // straggler: terracotta / umber — the blood in the letter
      vec3 graphite  = vec3(0.22, 0.22, 0.26);
      vec3 warmGrey  = vec3(0.32, 0.28, 0.25);
      vec3 coolSlate = vec3(0.24, 0.26, 0.34);
      vec3 terra     = vec3(0.52, 0.18, 0.14);
      vec3 umber     = vec3(0.44, 0.24, 0.18);

      vec3 fCol = mix(graphite, warmGrey, seed * 0.6 + 0.2);
      fCol = mix(coolSlate, fCol, smoothstep(0.0, 0.8, uCohesion));
      vec3 sCol = mix(terra, umber, seed);
      vCol = mix(fCol, sCol, strag);

      // chalk pressure — opacity decays quadratically
      vAlpha = mix(0.52, 0.025, age * age);
      vAlpha *= (1.0 - smoothstep(36.0, 56.0, dist));
      vAlpha *= (1.0 + strag * 0.45);
      vRough = seed;

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3  vCol;
    varying float vRough;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);

      // chalk texture: irregular, grainy edge — not a clean circle
      float ang = atan(d.y, d.x);
      float n = fract(sin(ang * 7.3 + vRough * 31.7) * 4375.545);
      float edge = 0.33 + n * 0.17;
      if (r > edge) discard;

      float a = smoothstep(edge, edge * 0.25, r) * vAlpha;
      // warm centre — chalk pressed harder leaves a richer deposit
      vec3 c = vCol + vec3(0.03, 0.02, 0.01) * smoothstep(0.3, 0.0, r);
      gl_FragColor = vec4(c, a);
    }
  `
});

const pts = new THREE.Points(tGeom, tMat);
scene.add(pts);

// ── also render the current bird positions as slightly bolder head-marks ──
const headPos = new Float32Array(N * 3);
const headStrag = new Float32Array(N);
const headSeed = new Float32Array(N);
for (let i = 0; i < N; i++) {
  headPos[i*3] = pos[i*3]; headPos[i*3+1] = pos[i*3+1]; headPos[i*3+2] = pos[i*3+2];
  headStrag[i] = i === STRAGGLER ? 1.0 : 0.0;
  headSeed[i] = Math.random();
}
const hGeom = new THREE.BufferGeometry();
hGeom.setAttribute('position', new THREE.BufferAttribute(headPos, 3));
hGeom.setAttribute('strag', new THREE.BufferAttribute(headStrag, 1));
hGeom.setAttribute('seed', new THREE.BufferAttribute(headSeed, 1));

const hMat = new THREE.ShaderMaterial({
  uniforms: {
    uPx: { value: renderer.getPixelRatio() },
    uCohesion: { value: 1.0 }
  },
  transparent: true, depthWrite: false, fog: false,
  vertexShader: `
    uniform float uPx;
    uniform float uCohesion;
    attribute float strag;
    attribute float seed;
    varying float vAlpha;
    varying vec3  vCol;
    varying float vRough;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      float sz = (2.8 + seed * 1.6 + strag * 3.0) * uPx * (18.0 / max(dist, 1.0));
      gl_PointSize = sz;
      vec3 graphite = vec3(0.20, 0.20, 0.24);
      vec3 warmGrey = vec3(0.30, 0.26, 0.23);
      vec3 coolSlate = vec3(0.22, 0.24, 0.32);
      vec3 terra = vec3(0.50, 0.16, 0.12);
      vec3 fCol = mix(graphite, warmGrey, seed * 0.5 + 0.25);
      fCol = mix(coolSlate, fCol, smoothstep(0.0, 0.8, uCohesion));
      vCol = mix(fCol, terra, strag);
      vAlpha = 0.7 + strag * 0.2;
      vAlpha *= (1.0 - smoothstep(36.0, 56.0, dist));
      vRough = seed;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3  vCol;
    varying float vRough;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      float ang = atan(d.y, d.x);
      float n = fract(sin(ang * 5.7 + vRough * 19.3) * 3758.545);
      float edge = 0.30 + n * 0.20;
      if (r > edge) discard;
      float a = smoothstep(edge, edge * 0.2, r) * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});
const headPts = new THREE.Points(hGeom, hMat);
scene.add(headPts);

// ── camera: contemplative fixed-Z track, no rotation ──
const camTarget = new THREE.Vector3(0, 0, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm: let the arc develop and marks accumulate
for (let s = 0; s < 300; s++) {
  step(0.05);
  frame++;
  updateTrails();
}

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  frame++;

  step(dt);
  updateTrails();

  tMat.uniforms.uFrame.value = frame;
  tMat.uniforms.uCohesion.value = cohesion;
  hMat.uniforms.uCohesion.value = cohesion;
  tGeom.attributes.position.needsUpdate = true;
  tGeom.attributes.birth.needsUpdate = true;

  // update head positions
  for (let i = 0; i < N; i++) {
    headPos[i*3] = pos[i*3]; headPos[i*3+1] = pos[i*3+1]; headPos[i*3+2] = pos[i*3+2];
  }
  hGeom.attributes.position.needsUpdate = true;

  // gentle camera follow — no orbit, just a slow xy drift toward the centroid
  let cx = 0, cy = 0;
  for (let i = 0; i < N; i++) { cx += pos[i*3]; cy += pos[i*3+1]; }
  cx /= N; cy /= N;
  camTarget.lerp(new THREE.Vector3(cx, cy, 0), 0.012);
  camera.position.set(camTarget.x, camTarget.y + 0.4, 26);
  camera.lookAt(camTarget.x, camTarget.y, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
</body>
</html>
