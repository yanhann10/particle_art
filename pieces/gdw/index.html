<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: settling, intensity: calm -->
<title>gdw · from-point (Lee Ufan encounter)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ede8e0; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#666; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#666; }
</style>
</head>
<body>
<div class="id">gdw</div>
<div class="hint">orbit drag</div>
<div class="src">Lee Ufan · From Point + Relatum · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xede8e0, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const ROWS = 7, COLS = 7, STAMPS = ROWS * COLS;
const SPACING = 3.0, STAMP_R = 0.88;
const STONE_N = 16000, STAMP_TOTAL = N - STONE_N;

/* --- seeded RNG (mulberry32) --- */
let _rs = 48271;
const rng = () => {
  _rs |= 0; _rs = _rs + 0x6D2B79F5 | 0;
  let t = Math.imul(_rs ^ _rs >>> 15, 1 | _rs);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

/* --- paint level: reload every 12, each reload weaker --- */
function paintLevel(i) {
  const cycle = Math.floor(i / 12);
  const pos = i % 12;
  const base = Math.max(0.14, 1.0 - cycle * 0.23);
  return Math.max(0.04, base * (1.0 - pos / 12 * 0.93));
}

const levels = Array.from({ length: STAMPS }, (_, i) => paintLevel(i));
const totalW = levels.reduce((a, b) => a + b, 0);

/* allocate particles per stamp proportional to paint */
const stampCounts = levels.map(l => Math.max(60, Math.round(l / totalW * STAMP_TOTAL)));
let diff = STAMP_TOTAL - stampCounts.reduce((a, b) => a + b, 0);
for (let i = 0; diff !== 0; i = (i + 1) % STAMPS) {
  stampCounts[i] += diff > 0 ? 1 : -1;
  diff += diff > 0 ? -1 : 1;
}

/* stamp centers on XZ plane */
const gridW = (COLS - 1) * SPACING, gridH = (ROWS - 1) * SPACING;
const stampCenters = [];
for (let r = 0; r < ROWS; r++)
  for (let c = 0; c < COLS; c++)
    stampCenters.push([c * SPACING - gridW * 0.5, 0, r * SPACING - gridH * 0.5]);

/* stone: just beyond lower-right corner */
const stoneCenter = [gridW * 0.5 + 3.2, 0, gridH * 0.5 - 1.5];
const stoneRx = 2.1, stoneRy = 0.65, stoneRz = 1.4;

/* --- build buffers --- */
const posA = new Float32Array(N * 3);   /* scattered */
const posB = new Float32Array(N * 3);   /* target */
const paintF = new Float32Array(N);
const delayA = new Float32Array(N);
const isStoneA = new Float32Array(N);

let idx = 0;

/* stamp particles */
for (let s = 0; s < STAMPS; s++) {
  const [cx, , cz] = stampCenters[s];
  const count = stampCounts[s];
  const level = levels[s];
  const stDelay = s / STAMPS * 0.82;

  for (let k = 0; k < count && idx < STAMP_TOTAL; k++) {
    const angle = rng() * Math.PI * 2;
    const raw = STAMP_R * Math.sqrt(-2 * Math.log(Math.max(0.001, rng()))) * 0.38;
    const rad = Math.min(raw, STAMP_R * 1.1);

    const tx = cx + Math.cos(angle) * rad;
    const tz = cz + Math.sin(angle) * rad;
    const ty = (rng() - 0.3) * 0.06 * level;

    posB[idx * 3]     = tx;
    posB[idx * 3 + 1] = ty;
    posB[idx * 3 + 2] = tz;

    /* scatter: hover above landing zone */
    posA[idx * 3]     = tx + (rng() - 0.5) * 14;
    posA[idx * 3 + 1] = 3 + rng() * 7;
    posA[idx * 3 + 2] = tz + (rng() - 0.5) * 14;

    paintF[idx]   = level;
    delayA[idx]   = stDelay + rng() * 0.12;
    isStoneA[idx] = 0;
    idx++;
  }
}

/* stone particles (upper-hemisphere ellipsoid via rejection) */
for (let k = 0; k < STONE_N && idx < N; k++) {
  let px, py, pz;
  do { px = rng() * 2 - 1; py = rng() * 2 - 1; pz = rng() * 2 - 1; }
  while (px * px + py * py + pz * pz > 1);

  const tx = stoneCenter[0] + px * stoneRx;
  const ty = stoneCenter[1] + Math.abs(py) * stoneRy;
  const tz = stoneCenter[2] + pz * stoneRz;

  posB[idx * 3]     = tx;
  posB[idx * 3 + 1] = ty;
  posB[idx * 3 + 2] = tz;

  posA[idx * 3]     = tx + (rng() - 0.5) * 6;
  posA[idx * 3 + 1] = ty + 4 + rng() * 5;
  posA[idx * 3 + 2] = tz + (rng() - 0.5) * 6;

  paintF[idx]   = 1.0;
  delayA[idx]   = 0.55 + rng() * 0.25;
  isStoneA[idx] = 1;
  idx++;
}

/* fill any remainder */
while (idx < N) {
  posB[idx * 3] = posA[idx * 3] = 0;
  posB[idx * 3 + 1] = posA[idx * 3 + 1] = -5;
  posB[idx * 3 + 2] = posA[idx * 3 + 2] = 0;
  paintF[idx] = 0; delayA[idx] = 1; isStoneA[idx] = 0;
  idx++;
}

/* geometry */
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posB), 3));
geom.setAttribute('posA',     new THREE.BufferAttribute(posA, 3));
geom.setAttribute('posB',     new THREE.BufferAttribute(posB, 3));
geom.setAttribute('paintF',   new THREE.BufferAttribute(paintF, 1));
geom.setAttribute('delayA',   new THREE.BufferAttribute(delayA, 1));
geom.setAttribute('isStone',  new THREE.BufferAttribute(isStoneA, 1));
geom.computeBoundingSphere();

const uniforms = {
  uTime:  { value: 0 },
  uMorph: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uMorph;
    uniform float uPixel;

    attribute vec3 posA;
    attribute vec3 posB;
    attribute float paintF;
    attribute float delayA;
    attribute float isStone;

    varying float vPaint;
    varying float vIsStone;

    void main() {
      float localM = clamp((uMorph - delayA) / 0.25, 0.0, 1.0);
      /* ease-out: decelerate into place like ink settling into paper */
      localM = 1.0 - (1.0 - localM) * (1.0 - localM);

      vec3 p = mix(posA, posB, localM);

      /* after settling: imperceptible breathing (paint drying) */
      float settled = smoothstep(0.8, 1.0, localM);
      float breath  = sin(uTime * 0.22 + posB.x * 0.4 + posB.z * 0.6) * 0.012 * settled;
      p.y += breath;

      vPaint   = paintF;
      vIsStone = isStone;

      vec4 mv   = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float size = uPixel * max(1.1, 2.6 - dist * 0.025);
      size *= (1.0 + isStone * 0.25) * (0.65 + paintF * 0.45);

      gl_PointSize = size;
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vPaint;
    varying float vIsStone;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      /* sumi-ink palette: charcoal → pale ash */
      vec3 inkDark  = vec3(0.13, 0.11, 0.10);
      vec3 inkLight = vec3(0.76, 0.72, 0.67);
      vec3 inkCol   = mix(inkLight, inkDark, vPaint);

      /* stone: warm basalt grey */
      vec3 stoneCol = vec3(0.21, 0.19, 0.17);

      vec3 col = mix(inkCol, stoneCol, vIsStone);

      float disc  = 1.0 - smoothstep(0.14, 0.25, r2);
      float alpha = disc * (0.28 + vPaint * 0.72);
      /* stone always fully opaque */
      alpha = mix(alpha, disc, vIsStone);

      gl_FragColor = vec4(col, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* --- orbit drag (no auto-rotation — Lee Ufan demands stillness) --- */
let isDrag = false, pX = 0, pY = 0;
let oTheta = 0, oPhi = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  isDrag = true; pX = e.clientX; pY = e.clientY; e.preventDefault();
});
addEventListener('pointermove', e => {
  if (!isDrag) return;
  oTheta -= (e.clientX - pX) * 0.004;
  oPhi = Math.max(-0.35, Math.min(0.35, oPhi - (e.clientY - pY) * 0.004));
  pX = e.clientX; pY = e.clientY;
});
addEventListener('pointerup', () => { isDrag = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/* composition center: biased toward stone for asymmetric framing */
const lookTarget = new THREE.Vector3(stoneCenter[0] * 0.22, 0, stoneCenter[2] * 0.15);

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value  = t;
  uniforms.uMorph.value = Math.min(1.0, t / 14.0); /* 14s settling — unhurried */

  const theta  = 0.06 + oTheta;
  const phi    = 0.88 + oPhi;
  const radius = 42;

  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
  <button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
  <button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
  <input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
  <button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
