<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b2d · cumulus tender</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#080706; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">b2d</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres × Morakana · Cumulus · cloud-strings crossing</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Cumulus Tender — Gonzalez-Torres' draped incandescent strings
   reimagined as satellite-view cloud wisps (Morakana's 'Cumulus' 2025).
   Differential-growth curve drapes under gravity; 40k particles spread
   as soft atmospheric sprites. A faint horizontal border-line tints
   particles from bone-dust to oxidized red as they drift across —
   the invisible threshold between here and there, presence and absence.
   Slow eastward wind. Intimacy of atmospheric passage. */

const BG = 0x080706;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 2, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, -1, 0);

/* ── differential-growth curve ── */
const MAX_VERTS = 2800;
const ATTRACT   = 0.044;
const REPEL_R   = 0.50;
const REPEL_STR = 0.088;
const NOISE     = 0.0014;
const PRESSURE  = 0.0014;
const GRAVITY   = 0.007;
const MAX_D     = 0.38;
const ANCHOR_N  = 5;
const WIND_X    = 0.0006;

const BORDER_Y  = -2.2;

const verts = [];
const NV0 = 36;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 5.5;
  const y = -Math.abs(t) * 1.0 + Math.sin(t * Math.PI * 1.5) * 0.35;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', e => {
  if (e.target.tagName === 'CANVAS') paused = !paused;
});

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  let ccx = 0, ccz = 0;
  for (let i = 0; i < n; i++) { ccx += verts[i].x; ccz += verts[i].z; }
  ccx /= n; ccz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - ccx, oz = verts[i].z - ccz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE + WIND_X;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.04 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.4;
    verts[i].age += 0.0003;
  }

  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

/* ── 40k cloud-wisp particles ── */
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge   = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uBorderY:    { value: BORDER_Y },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.026 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBorderY;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      /* gentle atmospheric drift — wisps on a slow wind */
      float t = uTime * 0.14 + seed * 6.2831;
      float sway = sin(t) * 0.011 * (1.0 + seed * 0.4);
      p.x += sway;
      p.y += cos(t * 0.55 + seed * 3.1) * 0.004;
      p.z += sin(t * 0.38 + seed * 4.7) * 0.005;

      float pulse = 0.92 + 0.08 * sin(uTime * 0.7 + seed * 28.0);

      /* palette — hand-tuned, 5 colors:
         bone #EBE1D2, dust #C7B8A3, warm-fog #A89888,
         oxidized-red #B8482E, deep-crossing #7A2418
         Transition at the invisible border is 3 units of fade */
      vec3 bone    = vec3(0.922, 0.882, 0.824);
      vec3 dust    = vec3(0.780, 0.722, 0.640);
      vec3 warmFog = vec3(0.659, 0.596, 0.533);
      vec3 oxRed   = vec3(0.722, 0.282, 0.180);
      vec3 deepRed = vec3(0.478, 0.141, 0.094);

      float crossing = smoothstep(uBorderY + 1.8, uBorderY - 1.2, p.y);

      float k = clamp(age * 1.4, 0.0, 1.0);
      vec3 above = mix(bone, dust, k * 0.35 + seed * 0.18);
      above = mix(above, warmFog, smoothstep(0.5, 1.0, k) * 0.25);
      vec3 below = mix(oxRed, deepRed, k * 0.3 + seed * 0.15);

      vCol = mix(above, below, crossing);
      vCol *= pulse;

      /* particles near the border brighten subtly — the tension of crossing */
      float borderProx = 1.0 - smoothstep(0.0, 2.2, abs(p.y - uBorderY));
      vAlpha = 0.32 + 0.14 * pulse + borderProx * 0.10;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      /* larger, softer sprites — cloud wisps, not sharp bulbs */
      gl_PointSize = 2.6 * uPixel * (48.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      /* very soft gaussian falloff — atmospheric, not crisp */
      float core = exp(-r * 14.0);
      float halo = exp(-r * 4.5) * 0.22;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.85);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── the border: a faint oxidized line, almost invisible ── */
const borderGeom = new THREE.BufferGeometry();
const bPts = new Float32Array([ -25, BORDER_Y, 0,  25, BORDER_Y, 0 ]);
borderGeom.setAttribute('position', new THREE.BufferAttribute(bPts, 3));
const borderMat = new THREE.LineBasicMaterial({
  color: 0x3d1a10, transparent: true, opacity: 0.16
});
scene.add(new THREE.Line(borderGeom, borderMat));

/* ── faint wire between growth vertices ── */
const wireGeom = new THREE.BufferGeometry();
const wirePos = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x1a1512, transparent: true, opacity: 0.12
});
scene.add(new THREE.Line(wireGeom, wireMat));

/* ── ambient dust motes — sparse, drifting, warm ── */
const N_DUST = 600;
const dustPos = new Float32Array(N_DUST * 3);
const dustSeeds = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 30;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 16 - 2;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
  dustSeeds[i] = Math.random();
}
const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeeds, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vA;
    void main() {
      vec3 p = position;
      float t = uTime * 0.06 + seed * 6.28;
      p.x += sin(t) * 0.4;
      p.y += cos(t * 0.7) * 0.2;
      vA = 0.04 + 0.03 * sin(uTime * 0.3 + seed * 20.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.2 * uPixel * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vA;
      gl_FragColor = vec4(vec3(0.85, 0.78, 0.68) * a, a);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* pre-grow so the form is visible on first frame */
for (let s = 0; s < 500; s++) step();

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;

  /* update wire */
  for (let i = 0; i < n; i++) {
    wirePos[i * 3]     = verts[i].x;
    wirePos[i * 3 + 1] = verts[i].y;
    wirePos[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  /* camera tracks centroid */
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);

  /* distribute particles along curve with cloud-wisp spread */
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt(
      (b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2
    );
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n - 1; i++) {
      const share = (i === n - 2)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[i + 1];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        /* gaussian-ish spread — wider than parent's tight bulbs,
           creating cloud-wisp volume around the string */
        const gx = (Math.random() + Math.random() + Math.random()) / 3 - 0.5;
        const gy = (Math.random() + Math.random() + Math.random()) / 3 - 0.5;
        const gz = (Math.random() + Math.random() + Math.random()) / 3 - 0.5;
        const spread = 0.055;
        rPos[written * 3]     = a.x + (b.x - a.x) * u + gx * spread * 2.2;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * u + gy * spread * 1.6;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * u + gz * spread * 2.2;
        rAge[written] = Math.max(a.age, b.age);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
