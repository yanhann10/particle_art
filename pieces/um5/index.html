<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: crystallize, intensity: gentle -->
<title>um5 · substrate · tarbell</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#020408; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; z-index:10; }
</style>
</head>
<body>
<div class="id">um5</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Substrate algorithm (Jared Tarbell, 2003) ── */
const GW = 400, GH = 400;
const grid = new Int8Array(GW * GH).fill(-1);
const allSegments = [];
let birthCounter = 0;

const activeCracks = [];
const MAX_CRACKS = 350;

function spawnCrack(x, y, angle, gen) {
  if (activeCracks.length >= MAX_CRACKS) return;
  activeCracks.push({ x, y, angle, gen, pts: [{ x, y }], alive: true, age: 0 });
}

/* seed initial fractures — axis-aligned, scattered */
for (let i = 0; i < 14; i++) {
  const x = 30 + Math.random() * (GW - 60);
  const y = 30 + Math.random() * (GH - 60);
  const angle = Math.floor(Math.random() * 4) * Math.PI * 0.5;
  const ix = Math.round(x), iy = Math.round(y);
  if (ix >= 0 && ix < GW && iy >= 0 && iy < GH) grid[iy * GW + ix] = 0;
  spawnCrack(x, y, angle, 0);
}

/* run the algorithm to exhaustion */
for (let iter = 0; iter < 500000; iter++) {
  let anyAlive = false;
  for (let ci = 0; ci < activeCracks.length; ci++) {
    const c = activeCracks[ci];
    if (!c.alive) continue;
    anyAlive = true;

    const nx = c.x + Math.cos(c.angle);
    const ny = c.y + Math.sin(c.angle);
    const ix = Math.round(nx), iy = Math.round(ny);

    if (ix < 1 || ix >= GW - 1 || iy < 1 || iy >= GH - 1) {
      c.alive = false;
      if (c.pts.length > 3) allSegments.push({ pts: c.pts, gen: c.gen, birth: birthCounter++ });
      continue;
    }

    if (grid[iy * GW + ix] >= 0 && c.age > 2) {
      c.alive = false;
      if (c.pts.length > 3) allSegments.push({ pts: c.pts, gen: c.gen, birth: birthCounter++ });
      /* spawn perpendicular cracks at collision point */
      spawnCrack(c.x, c.y, c.angle + Math.PI * 0.5, Math.min(c.gen + 1, 8));
      spawnCrack(c.x, c.y, c.angle - Math.PI * 0.5, Math.min(c.gen + 1, 8));
      continue;
    }

    c.x = nx;
    c.y = ny;
    c.age++;
    grid[iy * GW + ix] = c.gen;
    c.pts.push({ x: nx, y: ny });
  }
  if (!anyAlive) break;
}

/* finalize surviving cracks */
for (const c of activeCracks) {
  if (c.alive && c.pts.length > 3) {
    allSegments.push({ pts: c.pts, gen: c.gen, birth: birthCounter++ });
  }
}

/* ── Distribute particles along segments ── */
const N = 80000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
const genAttr   = new Float32Array(N);
const birthAttr = new Float32Array(N);

/* measure segment lengths */
const segLens = allSegments.map(seg => {
  let len = 0;
  for (let i = 1; i < seg.pts.length; i++) {
    const dx = seg.pts[i].x - seg.pts[i - 1].x;
    const dy = seg.pts[i].y - seg.pts[i - 1].y;
    len += Math.sqrt(dx * dx + dy * dy);
  }
  return Math.max(len, 0.1);
});
const totalLen = segLens.reduce((a, b) => a + b, 0);
const maxGen = allSegments.reduce((m, s) => Math.max(m, s.gen), 1) || 1;
const maxBirth = birthCounter || 1;

/* grid → world mapping */
const SCALE = 0.055;
const OX = -GW * SCALE * 0.5;
const OZ = -GH * SCALE * 0.5;

let written = 0;
for (let si = 0; si < allSegments.length; si++) {
  const seg = allSegments[si];
  const share = si === allSegments.length - 1
    ? N - written
    : Math.max(1, Math.floor(N * segLens[si] / totalLen));

  for (let k = 0; k < share && written < N; k++) {
    const t = Math.random() * (seg.pts.length - 1);
    const idx = Math.min(Math.floor(t), seg.pts.length - 2);
    const frac = t - idx;
    const p0 = seg.pts[idx];
    const p1 = seg.pts[idx + 1];

    const wx = (p0.x + (p1.x - p0.x) * frac) * SCALE + OX;
    const wz = (p0.y + (p1.y - p0.y) * frac) * SCALE + OZ;

    /* perpendicular scatter for line thickness */
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const ln = Math.sqrt(dx * dx + dy * dy) || 1;
    const perpX = -dy / ln, perpZ = dx / ln;
    const scatter = (Math.random() - 0.5) * 0.14 * SCALE;

    /* generation-based height: later gens read as taller buildings */
    const genNorm = seg.gen / maxGen;
    const wy = genNorm * 6.5 + (Math.random() - 0.5) * 0.15;

    positions[written * 3]     = wx + perpX * scatter;
    positions[written * 3 + 1] = wy;
    positions[written * 3 + 2] = wz + perpZ * scatter;

    seeds[written]     = Math.random();
    genAttr[written]   = genNorm;
    birthAttr[written] = seg.birth / maxBirth;
    written++;
  }
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x01010a, 0.022);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(14, 3, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x01010a, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 4.0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

/* ── Shader material ── */
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReveal: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReveal;
    attribute float seed;
    attribute float gen;
    attribute float birth;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;

      /* reveal in birth order — substrate grows before our eyes */
      float revealT = smoothstep(birth - 0.015, birth + 0.015, uReveal);
      if (revealT < 0.005) {
        gl_PointSize = 0.0;
        gl_Position = vec4(0.0, 0.0, -100.0, 1.0);
        vAlpha = 0.0;
        vCol = vec3(0.0);
        return;
      }

      /* gentle breathing along the crack lines */
      float t = uTime * 0.35 + seed * 6.2832;
      p.y += 0.025 * sin(t + birth * 18.0);
      p.x += 0.012 * sin(t * 0.7 + gen * 8.0);
      p.z += 0.012 * cos(t * 0.6 + gen * 5.0);

      /* ── Palette: future city grid at night ── */
      /* 5 hand-picked colors:
         ground   — deep navy street level
         street   — cyan streetlight glow
         midrise  — amber window warmth
         highrise — warm white tower top
         spire    — blue-white antenna spire */
      vec3 ground   = vec3(0.01, 0.01, 0.06);   // near-black void
      vec3 street   = vec3(0.00, 0.55, 0.90);   // electric cobalt
      vec3 midrise  = vec3(0.55, 0.00, 0.90);   // neon violet
      vec3 highrise = vec3(0.90, 0.00, 0.55);   // hot magenta
      vec3 spire    = vec3(1.00, 0.95, 1.00);   // white-hot tip

      float g = gen;
      vec3 col;
      if (g < 0.25) {
        col = mix(ground, street, g * 4.0);
      } else if (g < 0.5) {
        col = mix(street, midrise, (g - 0.25) * 4.0);
      } else if (g < 0.75) {
        col = mix(midrise, highrise, (g - 0.5) * 4.0);
      } else {
        col = mix(highrise, spire, (g - 0.75) * 4.0);
      }

      /* per-segment hue variation — subtle warmth shifts */
      float segHue = sin(birth * 47.0 + seed * 3.0);
      col.r += segHue * 0.03;
      col.g += segHue * 0.015;

      /* newly revealed particles flash slightly brighter */
      float flashT = smoothstep(0.0, 0.08, uReveal - birth);
      float flash = (1.0 - flashT) * 0.3;
      col += flash * spire;

      vCol = col;
      vAlpha = (0.45 + 0.35 * (1.0 - g)) * revealT;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (1.0 + 0.5 * g) * uPixel * (32.0 / max(dist, 1.0));
      sz *= 0.4 + 0.6 * revealT;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('gen',      new THREE.BufferAttribute(genAttr, 1));
geom.setAttribute('birth',    new THREE.BufferAttribute(birthAttr, 1));

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── Atmospheric ground plane — warm ambient glow ── */
const groundGeo = new THREE.PlaneGeometry(40, 40);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x010305,
  transparent: true,
  opacity: 0.6,
  side: THREE.DoubleSide
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = -0.05;
scene.add(ground);

/* neon street grid */
const gridHelper = new THREE.GridHelper(24, 32, 0x0055bb, 0x002244);
gridHelper.position.y = -0.03;
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.55;
scene.add(gridHelper);

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animation loop ── */
const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  /* growth reveal: 15 seconds to full coverage */
  uniforms.uReveal.value = Math.min(1.0, elapsed / 8.0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  var _pcc=document.getElementById('pc-close');if(_pcc)_pcc.onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;

  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
