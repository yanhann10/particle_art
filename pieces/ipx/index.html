<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ipx · illuminated garden · Persian miniature</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a0f0d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ipx · illuminated garden · Persian miniature</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-20, 20, 15, -15, 0.1, 200);
camera.position.set(0, 0, 50);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a0f0d, 1);
document.body.appendChild(renderer.domElement);

// Persian miniature principles:
// 1. Flattened perspective (orthographic)
// 2. Extreme density — every zone occupied
// 3. Hierarchical composition: architectural frame → garden zones → detail layers
// 4. Gold accents, lapis lazuli blue, vermillion, malachite green
// 5. Borders as integral compositional element

const N = 18000;
const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const types = new Float32Array(N); // 0=architectural, 1=floral, 2=water, 3=figure, 4=bird, 5=calligraphy

// Palette: Persian manuscript colors
const GOLD = new THREE.Color(0.85, 0.68, 0.25);
const LAPIS = new THREE.Color(0.15, 0.28, 0.52);
const VERMILLION = new THREE.Color(0.72, 0.18, 0.15);
const MALACHITE = new THREE.Color(0.18, 0.45, 0.35);
const SAFFRON = new THREE.Color(0.95, 0.72, 0.28);
const TURQUOISE = new THREE.Color(0.22, 0.58, 0.62);
const CREAM = new THREE.Color(0.92, 0.88, 0.78);

// Compositional zones following miniature structure
const BORDER_WIDTH = 2.5;
const FRAME_INNER = { minX: -17, maxX: 17, minY: -12, maxY: 12 };

// Garden quadrants (چهارباغ chahar bagh pattern)
const ZONES = [
  { x: -8.5, y: 6, w: 8, h: 5.5, type: 'garden_upper_left' },
  { x: 0.5, y: 6, w: 8, h: 5.5, type: 'garden_upper_right' },
  { x: -8.5, y: -0.5, w: 8, h: 5.5, type: 'garden_lower_left' },
  { x: 0.5, y: -0.5, w: 8, h: 5.5, type: 'garden_lower_right' },
  { x: -4, y: -6.5, w: 8, h: 4, type: 'pool' }
];

let idx = 0;

// Border decoration — dense geometric pattern
for (let side = 0; side < 4; side++) {
  const count = side < 2 ? 800 : 600; // horizontal vs vertical
  for (let i = 0; i < count && idx < N; i++) {
    let x, y;
    const t = i / count;
    if (side === 0) { // top
      x = THREE.MathUtils.lerp(-19, 19, t);
      y = 13 + (Math.sin(t * 40) * 0.3);
    } else if (side === 1) { // bottom
      x = THREE.MathUtils.lerp(-19, 19, t);
      y = -13 + (Math.sin(t * 40) * 0.3);
    } else if (side === 2) { // left
      y = THREE.MathUtils.lerp(-13, 13, t);
      x = -19 + (Math.sin(t * 30) * 0.3);
    } else { // right
      y = THREE.MathUtils.lerp(-13, 13, t);
      x = 19 + (Math.sin(t * 30) * 0.3);
    }
    
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = Math.random() * 0.2;
    
    const col = Math.random() < 0.6 ? GOLD : LAPIS;
    colors[idx * 3] = col.r;
    colors[idx * 3 + 1] = col.g;
    colors[idx * 3 + 2] = col.b;
    sizes[idx] = 0.15 + Math.random() * 0.1;
    types[idx] = 0;
    idx++;
  }
}

// Water channel (central cross)
for (let i = 0; i < 500 && idx < N; i++) {
  const isHoriz = Math.random() < 0.5;
  let x, y;
  if (isHoriz) {
    x = THREE.MathUtils.lerp(-16, 16, Math.random());
    y = Math.random() < 0.5 ? 3 : -3;
    y += (Math.random() - 0.5) * 0.8;
  } else {
    x = -4;
    x += (Math.random() - 0.5) * 0.8;
    y = THREE.MathUtils.lerp(-11, 11, Math.random());
  }
  
  positions[idx * 3] = x;
  positions[idx * 3 + 1] = y;
  positions[idx * 3 + 2] = Math.random() * 0.1;
  
  const col = Math.random() < 0.7 ? TURQUOISE : LAPIS;
  colors[idx * 3] = col.r;
  colors[idx * 3 + 1] = col.g;
  colors[idx * 3 + 2] = col.b;
  sizes[idx] = 0.18 + Math.random() * 0.12;
  types[idx] = 2;
  idx++;
}

// Garden zones — extreme density following miniature convention
ZONES.forEach(zone => {
  const density = zone.type === 'pool' ? 1800 : 2400;
  
  for (let i = 0; i < density && idx < N; i++) {
    // Miniature technique: objects placed in registers/rows with slight overlap
    const row = Math.floor(Math.random() * 8);
    const rowY = zone.y + zone.h * (row / 8 - 0.5);
    const x = zone.x + (Math.random() - 0.5) * zone.w * 0.95;
    const y = rowY + (Math.random() - 0.5) * 0.6;
    
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = row * 0.05 + Math.random() * 0.03; // depth by register
    
    let col, size, type;
    
    if (zone.type === 'pool') {
      // Pool: fish, lotus, reflections
      const r = Math.random();
      if (r < 0.4) { // fish
        col = GOLD.clone().lerp(VERMILLION, Math.random());
        size = 0.25 + Math.random() * 0.15;
        type = 3;
      } else if (r < 0.7) { // lotus
        col = CREAM.clone().lerp(SAFFRON, Math.random() * 0.3);
        size = 0.3 + Math.random() * 0.2;
        type = 1;
      } else { // water ripple
        col = TURQUOISE;
        size = 0.12 + Math.random() * 0.08;
        type = 2;
      }
    } else {
      // Garden quadrants: flowers, birds, trees, figures
      const r = Math.random();
      if (r < 0.5) { // flowers (most dense)
        const flowerRand = Math.random();
        if (flowerRand < 0.3) {
          col = VERMILLION;
        } else if (flowerRand < 0.6) {
          col = SAFFRON;
        } else {
          col = MALACHITE;
        }
        size = 0.2 + Math.random() * 0.15;
        type = 1;
      } else if (r < 0.7) { // birds
        col = GOLD.clone().lerp(LAPIS, Math.random() * 0.4);
        size = 0.18 + Math.random() * 0.12;
        type = 4;
      } else if (r < 0.85) { // trees (dark foliage)
        col = MALACHITE.clone().multiplyScalar(0.6 + Math.random() * 0.4);
        size = 0.35 + Math.random() * 0.25;
        type = 1;
      } else { // figures
        col = Math.random() < 0.5 ? LAPIS : VERMILLION;
        size = 0.28 + Math.random() * 0.18;
        type = 3;
      }
    }
    
    colors[idx * 3] = col.r;
    colors[idx * 3 + 1] = col.g;
    colors[idx * 3 + 2] = col.b;
    sizes[idx] = size;
    types[idx] = type;
    idx++;
  }
});

// Calligraphic inscription zone (upper register)
for (let i = 0; i < 400 && idx < N; i++) {
  const x = THREE.MathUtils.lerp(-15, 15, Math.random());
  const y = 11 + (Math.random() - 0.5) * 0.5;
  
  positions[idx * 3] = x;
  positions[idx * 3 + 1] = y;
  positions[idx * 3 + 2] = 0.8 + Math.random() * 0.1;
  
  colors[idx * 3] = GOLD.r;
  colors[idx * 3 + 1] = GOLD.g;
  colors[idx * 3 + 2] = GOLD.b;
  sizes[idx] = 0.1 + Math.random() * 0.08;
  types[idx] = 5;
  idx++;
}

// Sky zone (upper background) — gold leaf with stars
for (let i = 0; i < 600 && idx < N; i++) {
  const x = THREE.MathUtils.lerp(-17, 17, Math.random());
  const y = THREE.MathUtils.lerp(8, 12.5, Math.random());
  
  positions[idx * 3] = x;
  positions[idx * 3 + 1] = y;
  positions[idx * 3 + 2] = -0.5 + Math.random() * 0.2;
  
  const col = GOLD.clone().lerp(SAFFRON, Math.random() * 0.5);
  colors[idx * 3] = col.r * (0.3 + Math.random() * 0.3);
  colors[idx * 3 + 1] = col.g * (0.3 + Math.random() * 0.3);
  colors[idx * 3 + 2] = col.b * (0.3 + Math.random() * 0.3);
  sizes[idx] = 0.08 + Math.random() * 0.06;
  types[idx] = 0;
  idx++;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute vec3 color;
    attribute float size;
    attribute float type;
    varying vec3 vCol;
    varying float vType;
    varying float vAlpha;
    
    void main() {
      vec3 p = position;
      
      // Gentle drift (miniatures are static but alive)
      float drift = sin(p.x * 0.5 + uTime * 0.15) * 0.08;
      p.y += drift * (type == 4.0 ? 1.0 : 0.3); // birds drift more
      
      vCol = color;
      vType = type;
      vAlpha = 0.85 + 0.15 * sin(uTime * 0.4 + p.x + p.y);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * uPixel * 12.0;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vType;
    varying float vAlpha;
    
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv);
      
      float shape = 1.0;
      
      // Shape by type (miniature iconography)
      if (vType < 0.5) { // architectural/border
        shape = smoothstep(0.5, 0.3, r) * smoothstep(0.1, 0.2, r);
      } else if (vType < 1.5) { // floral
        float petals = abs(sin(atan(uv.y, uv.x) * 5.0));
        shape = smoothstep(0.5, 0.25, r) * (0.7 + 0.3 * petals);
      } else if (vType < 2.5) { // water
        shape = smoothstep(0.5, 0.2, r) * (0.5 + 0.5 * sin(r * 20.0));
      } else if (vType < 3.5) { // figure
        float oval = length(vec2(uv.x, uv.y * 1.5));
        shape = smoothstep(0.5, 0.3, oval);
      } else if (vType < 4.5) { // bird
        float wing = abs(uv.x) / max(0.5 - abs(uv.y), 0.1);
        shape = smoothstep(0.5, 0.25, r) * (1.0 - smoothstep(0.3, 0.6, wing));
      } else { // calligraphy
        float stroke = abs(sin(uv.x * 15.0 + uv.y * 10.0));
        shape = smoothstep(0.5, 0.3, r) * stroke;
      }
      
      if (shape < 0.05) discard;
      
      float alpha = shape * vAlpha;
      gl_FragColor = vec4(vCol, alpha);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geom.setAttribute('type', new THREE.BufferAttribute(types, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Fog plane (parchment veil)
const fogGeom = new THREE.PlaneGeometry(50, 35);
const fogMat = new THREE.MeshBasicMaterial({
  color: 0x1a0f0d,
  transparent: true,
  opacity: 0.02,
  side: THREE.DoubleSide
});
const fogPlane = new THREE.Mesh(fogGeom, fogMat);
fogPlane.position.z = 10;
scene.add(fogPlane);

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const frustumHeight = 30;
  const frustumWidth = frustumHeight * aspect;
  camera.left = -frustumWidth / 2;
  camera.right = frustumWidth / 2;
  camera.top = frustumHeight / 2;
  camera.bottom = -frustumHeight / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
