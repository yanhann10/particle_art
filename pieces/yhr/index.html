<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yhr · withdrawing object</title>
<!-- MOTION: wander, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050810; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
  .grain { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none;
           mix-blend-mode:overlay; opacity:0.08; z-index:5; }
</style>
</head>
<body>
<div class="id">yhr</div>
<canvas class="grain" id="grain"></canvas>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// OOO: the Lorenz attractor as withdrawing object — always partially
// occluded, partially revealed. 4 shy zones cause particles to recede
// when the camera's gaze nears them. Variable fog, aggressive near-clip.

const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050810, 1);
document.body.appendChild(renderer.domElement);

// Film grain canvas
const grainCvs = document.getElementById('grain');
const gCtx = grainCvs.getContext('2d');
grainCvs.width = 512; grainCvs.height = 512;
function drawGrain() {
  const img = gCtx.createImageData(512, 512);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v;
    img.data[i+3] = 255;
  }
  gCtx.putImageData(img, 0, 0);
}

// ---- GPGPU ping-pong ----
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
              minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
              depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i*4]   = (Math.random()*2-1) * 6.0;
  init[i*4+1] = (Math.random()*2-1) * 6.0;
  init[i*4+2] = (Math.random()*2-1) * 6.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- Lorenz simulation ----
const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho: { value: 28.0 },
  uBeta: { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ---- 4 shy zones: regions on the attractor that withdraw from view ----
// Placed at key structural points of the Lorenz butterfly
const shyZones = [
  new THREE.Vector3(-12.0, -14.0, 0.0),   // left lobe low
  new THREE.Vector3( 12.0, -14.0, 0.0),   // right lobe low
  new THREE.Vector3(  0.0,  -2.0, 2.0),   // center saddle
  new THREE.Vector3(  0.0,  12.0, -8.0),  // top rear
];

// ---- render pass ----
const scene = new THREE.Scene();
// Aggressive near clip: camera cuts into the form
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 8.0, 220);
camera.position.set(0, 0, 80);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtB.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uTime:    { value: 0 },
    uCamPos:  { value: new THREE.Vector3() },
    uCamDir:  { value: new THREE.Vector3() },
    uShy0:    { value: shyZones[0] },
    uShy1:    { value: shyZones[1] },
    uShy2:    { value: shyZones[2] },
    uShy3:    { value: shyZones[3] },
    uFogNear: { value: 20.0 },
    uFogFar:  { value: 120.0 },
    uFogDensityPhase: { value: 0.0 },
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime;
    uniform vec3 uCamPos, uCamDir;
    uniform vec3 uShy0, uShy1, uShy2, uShy3;
    uniform float uFogNear, uFogFar, uFogDensityPhase;
    attribute vec2 uvIdx;
    varying float vAlpha;
    varying float vAge;
    varying float vDepth;
    varying vec3 vWorldPos;

    float shyFactor(vec3 p, vec3 zone, vec3 camP, vec3 camD) {
      // How much does this zone withdraw?
      // particle proximity to zone
      float pDist = length(p - zone);
      float pClose = smoothstep(14.0, 3.0, pDist);
      // camera gaze proximity to zone
      vec3 toZone = normalize(zone - camP);
      float gaze = dot(camD, toZone);
      float gazeClose = smoothstep(0.3, 0.85, gaze);
      // camera spatial proximity
      float camDist = length(camP - zone);
      float camClose = smoothstep(70.0, 25.0, camDist);
      // withdrawal: stronger when camera looks at AND approaches
      return pClose * gazeClose * camClose;
    }

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      p.z -= 25.0; // center attractor at origin
      vAge = s.w;
      vWorldPos = p;

      // speed for sizing
      float speed = length(vec3(
        10.0*(p.y-p.x), p.x*28.0-p.y-p.x*(p.z+25.0), p.x*p.y-(8.0/3.0)*(p.z+25.0)
      )) * 0.003;

      // shy zone withdrawal — particles recede from apprehension
      float w0 = shyFactor(p, uShy0, uCamPos, uCamDir);
      float w1 = shyFactor(p, uShy1, uCamPos, uCamDir);
      float w2 = shyFactor(p, uShy2, uCamPos, uCamDir);
      float w3 = shyFactor(p, uShy3, uCamPos, uCamDir);
      float withdrawal = max(max(w0,w1), max(w2,w3));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vDepth = dist;

      // variable-density fog: density oscillates with time
      float fogDensity = 0.012 + 0.006 * sin(uFogDensityPhase);
      float fog = 1.0 - exp(-fogDensity * dist * dist * 0.0004);
      fog = clamp(fog, 0.0, 1.0);

      // near-fade: particles close to camera dissolve (withdrawal at proximity)
      float nearFade = smoothstep(8.0, 18.0, dist);

      // combined alpha
      vAlpha = (1.0 - withdrawal * 0.92) * (1.0 - fog) * nearFade;
      vAlpha *= (0.35 + speed * 0.8);

      gl_PointSize = (0.9 + 1.4 * speed) * uPixel * (55.0 / max(dist, 1.0));
      gl_PointSize *= (1.0 - withdrawal * 0.5); // shy particles shrink
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying float vAge;
    varying float vDepth;
    varying vec3 vWorldPos;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0);

      // Withdrawn palette: prussian blue, tarnished silver, deep umber, faint rose
      // Muted, as if seen through old glass
      vec3 prussian = vec3(0.0, 0.19, 0.33);
      vec3 silver   = vec3(0.54, 0.57, 0.63);
      vec3 umber    = vec3(0.58, 0.38, 0.24);
      vec3 rose     = vec3(0.42, 0.29, 0.36);

      float k = mod(vAge * 1.0 + vWorldPos.x * 0.01, 1.0);
      vec3 col;
      if (k < 0.3) {
        col = mix(prussian, silver, k / 0.3);
      } else if (k < 0.6) {
        col = mix(silver, umber, (k - 0.3) / 0.3);
      } else {
        col = mix(umber, rose, (k - 0.6) / 0.4);
      }

      // depth desaturation: far particles lose color, become grey apparitions
      float desat = smoothstep(30.0, 100.0, vDepth);
      vec3 grey = vec3(dot(col, vec3(0.299, 0.587, 0.114)));
      col = mix(col, grey * 0.7, desat * 0.6);

      gl_FragColor = vec4(col * a * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ---- background: subtle vertical gradient fog plane ----
const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      // very subtle warm-to-cool vertical gradient
      vec3 top = vec3(0.04, 0.03, 0.06);
      vec3 bot = vec3(0.02, 0.04, 0.07);
      vec3 col = mix(bot, top, vUv.y);
      // faint horizontal drift band — the atmosphere breathes
      float band = smoothstep(0.0, 1.0, sin(vUv.y * 6.28 + uTime * 0.15) * 0.5 + 0.5);
      col += vec3(0.008, 0.005, 0.012) * band;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bgScene = new THREE.Scene();
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer: subtle parameter breathing
const target = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 4.0;
  target.sigma = 10.0 + nx * 1.8;
});

// grain refresh interval
let grainT = 0;

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = now / 1000;
  lastTime = now;

  // ease params
  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.04;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.04;

  // sim substeps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  // camera: wandering orbit, varying radius — sometimes uncomfortably close
  // Three incommensurate frequencies create a never-repeating path
  const a1 = elapsed * 0.07;
  const a2 = elapsed * 0.031;
  const a3 = elapsed * 0.019;
  const radius = 58.0 + 28.0 * Math.sin(a2) + 12.0 * Math.cos(a3 * 1.7);
  const elevation = Math.sin(a3) * 22.0 + Math.cos(a2 * 0.8) * 8.0;
  camera.position.x = Math.sin(a1) * radius * Math.cos(elevation * 0.02);
  camera.position.y = elevation;
  camera.position.z = Math.cos(a1) * radius * Math.cos(elevation * 0.02);

  // look slightly off-center — never directly at the core
  const lookOffset = new THREE.Vector3(
    Math.sin(a2 * 2.1) * 5.0,
    Math.cos(a3 * 1.3) * 4.0,
    Math.sin(a1 * 0.7) * 3.0
  );
  camera.lookAt(lookOffset);

  // update uniforms
  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;
  pointsMat.uniforms.uCamPos.value.copy(camera.position);
  const camDir = new THREE.Vector3();
  camera.getWorldDirection(camDir);
  pointsMat.uniforms.uCamDir.value.copy(camDir);
  pointsMat.uniforms.uFogDensityPhase.value = elapsed * 0.23;

  bgMat.uniforms.uTime.value = elapsed;

  // render background then particles
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, camOrtho);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  // refresh grain every ~100ms
  grainT += 16;
  if (grainT > 100) { drawGrain(); grainT = 0; }

  requestAnimationFrame(loop);
}

drawGrain();
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
