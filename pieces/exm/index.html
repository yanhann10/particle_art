<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exm · tender compression</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }

<body>
<div class="id">exm</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres × Menkman · light strings losing fidelity · differential growth + DCT decay</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender compression — the light strings degrade like a photograph
   saved too many times. Gonzalez-Torres' intimacy meets Menkman's
   vernacular of file formats: warmth quantized into 8×8 blocks,
   cosine-basis ripples where memory used to be smooth, chroma
   bleeding at the seams of recollection. The loss IS the tenderness. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

// --- differential growth (open curve, draping) ---
const MAX_VERTS = 3200;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 6;

const verts = [];
const NV0 = 40;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 6;
  const y = -Math.abs(t) * 1.2 + Math.sin(t * Math.PI * 2) * 0.3;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  let ccx = 0, ccz = 0;
  for (let i = 0; i < n; i++) { ccx += verts[i].x; ccz += verts[i].z; }
  ccx /= n; ccz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - ccx, oz = verts[i].z - ccz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
  }

  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- bit-flip events: gentle block shifts ---
// Each event records a time and a block index — particles in that
// macroblock region get displaced as a unit, like a corrupted read
const blockEvents = [];
const BLOCK_CELL = 0.8; // world-space macroblock size

function maybeFlip(t) {
  // very rare — one event every ~8 seconds on average
  if (Math.random() > 0.004) return;
  const n = verts.length;
  if (n < 10) return;
  const vi = Math.floor(Math.random() * n);
  const v = verts[vi];
  // snap to block grid
  const bx = Math.round(v.x / BLOCK_CELL) * BLOCK_CELL;
  const by = Math.round(v.y / BLOCK_CELL) * BLOCK_CELL;
  const bz = Math.round(v.z / BLOCK_CELL) * BLOCK_CELL;
  blockEvents.push({
    bx, by, bz,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.2,
    dz: (Math.random() - 0.5) * 0.3,
    birth: t,
    life: 3.0 + Math.random() * 4.0
  });
  // cap events
  if (blockEvents.length > 12) blockEvents.shift();
}

// --- rendering ---
const N_RENDER = 40000;
const rPos     = new Float32Array(N_RENDER * 3);
const rSeeds   = new Float32Array(N_RENDER);
const rAge     = new Float32Array(N_RENDER);
const rBlockUV = new Float32Array(N_RENDER * 2); // position within macroblock (0-1)
const rCompress = new Float32Array(N_RENDER);     // compression amount
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',  new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',      new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',       new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('blockUV',   new THREE.BufferAttribute(rBlockUV, 2));
geom.setAttribute('compress',  new THREE.BufferAttribute(rCompress, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.032 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    attribute vec2 blockUV;
    attribute float compress;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    varying float vCompress;

    // DCT basis function: cos((2n+1)kπ/16) for 8×8 block
    float dctBasis(float n, float k) {
      return cos((2.0 * n + 1.0) * k * 3.14159265 / 16.0);
    }

    void main() {
      vec3 p = position;
      float c = compress;
      vCompress = c;

      // DCT ripple displacement — cosine-basis waves that emerge
      // as the image "compresses", gentle and undulating
      float dctU = dctBasis(blockUV.x * 7.0, 1.0 + sin(uTime * 0.15) * 2.0);
      float dctV = dctBasis(blockUV.y * 7.0, 1.0 + cos(uTime * 0.12) * 2.0);
      float ripple = dctU * dctV * c * 0.06;
      p.x += ripple;
      p.y += ripple * 0.7;

      // macroblock snap: particles drift toward grid as compression grows
      float blockSize = 0.8;
      vec3 snapped = floor(p / blockSize + 0.5) * blockSize;
      p = mix(p, snapped, c * 0.35);

      // gentle sway (reduced from parent — compression stiffens)
      float t = uTime * 0.25 + seed * 6.28;
      float sway = sin(t) * 0.006 * (1.0 - c * 0.5);
      p.x += sway;
      p.z += cos(t * 0.6) * 0.004 * (1.0 - c * 0.5);

      float pulse = 0.85 + 0.15 * sin(uTime * 0.9 + seed * 40.0);

      // palette: warm filament → chroma-subsampled bleed as compression grows
      // Gonzalez-Torres amber stays dominant; Menkman chroma is a whisper
      vec3 amber    = vec3(1.0, 0.72, 0.32);
      vec3 warm     = vec3(1.0, 0.88, 0.72);
      vec3 white    = vec3(1.0, 0.96, 0.92);
      // subtle chroma bleed colors — not loud, like a memory shifting hue
      vec3 bleedMag = vec3(1.0, 0.68, 0.78); // muted rose
      vec3 bleedCyn = vec3(0.72, 0.88, 0.92); // muted ice
      vec3 bleedYlw = vec3(1.0, 0.92, 0.58); // muted gold

      float k = clamp(age * 1.2, 0.0, 1.0);
      vec3 col = mix(amber, warm, k);
      col = mix(col, white, smoothstep(0.7, 1.0, k) * 0.3);

      // chroma subsampling: at block boundaries, color bleeds
      float blockEdge = max(
        smoothstep(0.4, 0.5, abs(blockUV.x - 0.5)),
        smoothstep(0.4, 0.5, abs(blockUV.y - 0.5))
      );
      // select bleed color by seed band
      vec3 bleed = seed < 0.33 ? bleedMag : (seed < 0.66 ? bleedCyn : bleedYlw);
      col = mix(col, bleed, blockEdge * c * 0.4);

      col *= pulse;
      vCol = col;

      // alpha: slightly reduced in compressed regions (quantization loss)
      vAlpha = (0.50 + 0.2 * pulse) * (1.0 - c * 0.15);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // size: compressed particles slightly larger (blocking up)
      float sz = (1.8 + c * 0.6) * uPixel * (45.0 / dist);
      // at high compression, quantize size to discrete steps
      if (c > 0.5) {
        sz = floor(sz / 1.5 + 0.5) * 1.5;
      }
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    varying float vCompress;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // shape morph: soft glow → squarish block as compression grows
      // at low compression: circular halo (Gonzalez-Torres bulb)
      // at high compression: flatter falloff (macroblock tile)
      float chebyshev = max(abs(d.x), abs(d.y)); // square distance
      float euclidean = sqrt(r);
      float dist = mix(euclidean, chebyshev, vCompress * 0.7);

      float core = exp(-dist * dist * 90.0);
      float halo = exp(-dist * dist * 28.0) * 0.30;
      float a = (core + halo) * vAlpha;

      // ringing artifact: faint bright edge at block boundary
      float ring = smoothstep(0.38, 0.42, chebyshev) *
                   smoothstep(0.50, 0.46, chebyshev);
      a += ring * vCompress * 0.08;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// wire — becomes quantized with age
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x2a2420,
  transparent: true,
  opacity: 0.25
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

// faint macroblock grid overlay — visible structure of compression
// a few horizontal and vertical lines that fade in over time
const gridLines = new THREE.Group();
scene.add(gridLines);
const gridRange = 8;
const gridStep = BLOCK_CELL;
const gridMat = new THREE.LineBasicMaterial({
  color: 0x3a2e28,
  transparent: true,
  opacity: 0.0 // fades in
});
for (let i = -gridRange; i <= gridRange; i++) {
  const pos = i * gridStep;
  // horizontal
  const hg = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-gridRange * gridStep, pos, 0),
    new THREE.Vector3( gridRange * gridStep, pos, 0)
  ]);
  gridLines.add(new THREE.Line(hg, gridMat));
  // vertical
  const vg = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(pos, -gridRange * gridStep, 0),
    new THREE.Vector3(pos,  gridRange * gridStep, 0)
  ]);
  gridLines.add(new THREE.Line(vg, gridMat));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 500; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) step();
  maybeFlip(t);

  const n = verts.length;

  // global compression ramp: 0 at start → ~0.7 over 90 seconds
  // the piece slowly loses fidelity, like re-saving a JPEG
  const globalCompress = Math.min(0.7, t * 0.0078);

  // grid lines fade in with compression
  gridMat.opacity = globalCompress * 0.08;

  // update wire (quantize positions at high compression)
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const c = Math.min(1.0, v.age * 2.5 + globalCompress * 0.5);
    const bs = BLOCK_CELL;
    const sx = Math.round(v.x / bs) * bs;
    const sy = Math.round(v.y / bs) * bs;
    const sz = Math.round(v.z / bs) * bs;
    wirePositions[i * 3]     = v.x + (sx - v.x) * c * 0.3;
    wirePositions[i * 3 + 1] = v.y + (sy - v.y) * c * 0.3;
    wirePositions[i * 3 + 2] = v.z + (sz - v.z) * c * 0.3;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // distribute particles along curve
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt(
      (b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2
    );
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    // prune expired block events
    for (let e = blockEvents.length - 1; e >= 0; e--) {
      if (t - blockEvents[e].birth > blockEvents[e].life) blockEvents.splice(e, 1);
    }

    for (let i = 0; i < n - 1; i++) {
      const share = (i === n - 2)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[i + 1];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
        const spread = 0.015;
        let px = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * spread;
        let py = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
        let pz = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * spread;

        // per-particle compression: blend of vertex age and global time
        const vertAge = Math.max(a.age, b.age);
        const compress = Math.min(1.0, vertAge * 2.0 + globalCompress * 0.6);

        // compute macroblock UV (position within block cell, 0-1)
        const bs = BLOCK_CELL;
        const buRaw = (px / bs) - Math.floor(px / bs);
        const bvRaw = (py / bs) - Math.floor(py / bs);

        // apply block-flip events: displace particles in affected blocks
        for (const ev of blockEvents) {
          const elapsed = t - ev.birth;
          const fade = 1.0 - Math.min(1.0, elapsed / ev.life);
          const ease = fade * fade; // smooth decay
          if (Math.abs(px - ev.bx) < bs * 0.5 &&
              Math.abs(py - ev.by) < bs * 0.5 &&
              Math.abs(pz - ev.bz) < bs * 0.5) {
            px += ev.dx * ease;
            py += ev.dy * ease;
            pz += ev.dz * ease;
          }
        }

        rPos[written * 3]     = px;
        rPos[written * 3 + 1] = py;
        rPos[written * 3 + 2] = pz;
        rAge[written]         = vertAge;
        rBlockUV[written * 2]     = buRaw;
        rBlockUV[written * 2 + 1] = bvRaw;
        rCompress[written]    = compress;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.blockUV.needsUpdate = true;
    geom.attributes.compress.needsUpdate = true;
  }

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
