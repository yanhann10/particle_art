<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fh1 · lucy point-cloud · hand-sculpted instrument</title>
<!-- MOTION: breathing, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a080c; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  #cam { position:fixed; right:14px; bottom:14px; width:240px; height:160px;
         border:1px solid #2a2025; border-radius:4px; transform:scaleX(-1); opacity:0.85; }
  #cam.hidden { display:none; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; bottom:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a141d; color:#e5dcd2; border:1px solid #4a3a44;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:5; }
  button.start:hover { background:#26202a; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
  #panel { position: fixed; right: 14px; top: 14px; background: rgba(10,8,12,0.88);
           border: 1px solid #2a2025; border-radius: 4px; padding: 14px 16px;
           font-size: 11px; letter-spacing: 0.04em; min-width: 220px; }
  #panel .row { display: flex; align-items: center; margin-bottom: 10px; }
  #panel .row:last-child { margin-bottom: 0; }
  #panel label { flex: 0 0 100px; opacity: 0.75; }
  #panel input[type=range] { flex: 1; margin: 0 8px; }
  #panel .val { flex: 0 0 42px; text-align: right; opacity: 0.85; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 2px; background: #2a2025;
                      border-radius: 1px; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                                             width: 10px; height: 10px; background: #e5dcd2;
                                             border-radius: 50%; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; background: #e5dcd2;
                                        border-radius: 50%; cursor: pointer; border: none; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · stanford 3d scanning repo …</div>
<button class="start" id="startBtn" style="display:none">grant camera · sculpt with hands</button>
<video id="cam" class="hidden" autoplay playsinline muted></video>
<div class="id">fh1</div>
<div class="hint" id="hint"></div>
<div class="src">model: stanford 3d scanning repo · public-research</div>
<div id="panel">
  <div class="row">
    <label>particle density</label>
    <input type="range" id="density" min="0.2" max="2.0" step="0.05" value="1.0">
    <span class="val" id="densityVal">1.00</span>
  </div>
  <div class="row">
    <label>breathing</label>
    <input type="range" id="breathing" min="0.0" max="2.0" step="0.05" value="1.0">
    <span class="val" id="breathingVal">1.00</span>
  </div>
  <div class="row">
    <label>gesture mix</label>
    <input type="range" id="gesture" min="0.0" max="2.0" step="0.05" value="1.0">
    <span class="val" id="gestureVal">1.00</span>
  </div>
  <div class="row">
    <label>hue shift</label>
    <input type="range" id="hue" min="0" max="360" step="5" value="0">
    <span class="val" id="hueVal">0°</span>
  </div>
  <div class="row">
    <label>fog density</label>
    <input type="range" id="fog" min="0.0" max="0.02" step="0.001" value="0.004">
    <span class="val" id="fogVal">0.004</span>
  </div>
  <div class="row">
    <label>rotation speed</label>
    <input type="range" id="rotation" min="0.0" max="0.15" step="0.005" value="0.05">
    <span class="val" id="rotationVal">0.05</span>
  </div>
</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a080c, 0.004);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 30);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a080c, 1);
document.body.appendChild(renderer.domElement);

const BASE_N = 60000;
let N = BASE_N;
let positions, restPositions, seeds;

const params = {
  density: 1.0,
  breathing: 1.0,
  gesture: 1.0,
  hue: 0,
  fog: 0.004,
  rotation: 0.05
};

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPinch: { value: 1.0 },
  uHand:  { value: new THREE.Vector3(0,0,0) },
  uActive:{ value: 0.0 },
  uReady: { value: 0.0 },
  uBreathing: { value: 1.0 },
  uGesture: { value: 1.0 },
  uHue: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPinch;
    uniform vec3  uHand;
    uniform float uActive;
    uniform float uReady;
    uniform float uBreathing;
    uniform float uGesture;
    uniform float uHue;
    attribute vec3  rest;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    
    vec3 hueShift(vec3 col, float shift) {
      float angle = shift * 3.14159 / 180.0;
      float c = cos(angle), s = sin(angle);
      mat3 rot = mat3(
        0.299 + 0.701*c + 0.168*s, 0.587 - 0.587*c + 0.330*s, 0.114 - 0.114*c - 0.497*s,
        0.299 - 0.299*c - 0.328*s, 0.587 + 0.413*c + 0.035*s, 0.114 - 0.114*c + 0.292*s,
        0.299 - 0.300*c + 1.250*s, 0.587 - 0.588*c - 1.050*s, 0.114 + 0.886*c - 0.203*s
      );
      return col * rot;
    }
    
    void main(){
      vec3 p = rest;
      float t = uTime * 0.5 + seed * 6.28;

      vec3 dir = normalize(p);
      p += dir * sin(t) * 0.06 * (1.0 + 0.5*sin(seed*9.0)) * uBreathing;

      vec3 fromCenter = p;
      float disperse = mix(0.0, 1.5, uPinch * 0.5) * uActive * uGesture;
      p += fromCenter * disperse;

      vec3 toHand = uHand - p;
      p += toHand * uActive * 0.04 * uGesture;

      vec3 entry = vec3(sin(seed*40.0), cos(seed*30.0), sin(seed*22.0)) * 18.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.4 + 0.6*sin(t*0.7);
      vec3 a = vec3(0.95, 0.92, 0.86);
      vec3 b = vec3(0.98, 0.78, 0.55);
      vec3 c = vec3(0.78, 0.32, 0.22);
      vCol = mix(a, b, vEnergy);
      vCol = mix(vCol, c, smoothstep(0.78, 1.0, vEnergy) * 0.6);
      vCol = hueShift(vCol, uHue);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 1.6*vEnergy) * uPixel * (45.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 17.0) * (0.45 + 0.55*vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');
const startBtn  = document.getElementById('startBtn');
const hintEl    = document.getElementById('hint');
const camEl     = document.getElementById('cam');

function updateParticleCount() {
  N = Math.floor(BASE_N * params.density);
  if (!restPositions) return;
  
  positions = new Float32Array(N * 3);
  seeds = new Float32Array(N);
  const step = restPositions.length / 3 / N;
  
  for (let i = 0; i < N; i++) {
    const srcIdx = Math.floor(i * step) * 3;
    positions[i*3] = restPositions[srcIdx];
    positions[i*3+1] = restPositions[srcIdx+1];
    positions[i*3+2] = restPositions[srcIdx+2];
    seeds[i] = Math.random();
  }
  
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('rest', new THREE.BufferAttribute(positions.slice(), 3));
  geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
}

const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 15 / maxAxis;
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp = new THREE.Vector3();
    const SAMPLE_N = BASE_N * 2;
    restPositions = new Float32Array(SAMPLE_N * 3);
    
    for (let i = 0; i < SAMPLE_N; i++){
      sampler.sample(tmp);
      restPositions[i*3]   = tmp.x;
      restPositions[i*3+1] = tmp.y;
      restPositions[i*3+2] = tmp.z;
    }
    
    updateParticleCount();
    loadingEl.style.display = 'none';
    startBtn.style.display = 'inline-block';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading lucy · ${pct}% · stanford 3d scanning repo`;
    }
  },
  (err) => {
    loadingEl.textContent = 'load failed — check network';
    console.error(err);
  });

let revealStart = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let handsActive = false;
async function loadMP(){
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js');
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js');
}
async function startHands(){
  startBtn.style.display = 'none';
  hintEl.textContent = 'requesting camera…';
  try { await loadMP(); }
  catch { hintEl.textContent = 'mediapipe load failed — passive mode'; return; }
  const hands = new window.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  hands.onResults((res) => {
    if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0){
      uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 0.0, 0.05);
      return;
    }
    uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 1.0, 0.1);
    const lm = res.multiHandLandmarks[0];
    const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y, dz = lm[4].z - lm[8].z;
    const pinch = Math.min(2.0, Math.sqrt(dx*dx+dy*dy+dz*dz) * 6.0);
    uniforms.uPinch.value = THREE.MathUtils.lerp(uniforms.uPinch.value, pinch, 0.15);
    const palm = lm[9];
    const wx = (0.5 - palm.x) * 22;
    const wy = (0.5 - palm.y) * 14;
    uniforms.uHand.value.set(wx, wy, 0.0);
    hintEl.textContent = `hand · pinch=${pinch.toFixed(2)}`;
  });
  camEl.classList.remove('hidden');
  const cam = new window.Camera(camEl, {
    onFrame: async () => { await hands.send({ image: camEl }); },
    width: 320, height: 240
  });
  cam.start();
  handsActive = true;
}
startBtn.addEventListener('click', startHands);

document.getElementById('density').addEventListener('input', (e) => {
  params.density = parseFloat(e.target.value);
  document.getElementById('densityVal').textContent = params.density.toFixed(2);
  updateParticleCount();
});

document.getElementById('breathing').addEventListener('input', (e) => {
  params.breathing = parseFloat(e.target.value);
  document.getElementById('breathingVal').textContent = params.breathing.toFixed(2);
  uniforms.uBreathing.value = params.breathing;
});

document.getElementById('gesture').addEventListener('input', (e) => {
  params.gesture = parseFloat(e.target.value);
  document.getElementById('gestureVal').textContent = params.gesture.toFixed(2);
  uniforms.uGesture.value = params.gesture;
});

document.getElementById('hue').addEventListener('input', (e) => {
  params.hue = parseFloat(e.target.value);
  document.getElementById('hueVal').textContent = params.hue + '°';
  uniforms.uHue.value = params.hue;
});

document.getElementById('fog').addEventListener('input', (e) => {
  params.fog = parseFloat(e.target.value);
  document.getElementById('fogVal').textContent = params.fog.toFixed(3);
  scene.fog.density = params.fog;
});

document.getElementById('rotation').addEventListener('input', (e) => {
  params.rotation = parseFloat(e.target.value);
  document.getElementById('rotationVal').textContent = params.rotation.toFixed(3);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 2500);
  }
  points.rotation.y += params.rotation * 0.016;

  if (!handsActive && uniforms.uReady.value > 0.95) {
    uniforms.uPinch.value = 1.0 + 0.25 * Math.sin(t * 0.4);
    uniforms.uActive.value = 0.35;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
