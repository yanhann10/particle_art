<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8e1 · gray-scott reaction-diffusion · emergent colony</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">8e1</div>
<div class="src">512×512 gray-scott · F=0.039 k=0.058 · mitosis spots</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Gray-Scott reaction-diffusion system: U + 2V → 3V (autocatalytic), V → P (decay)
// Parameters F (feed) and k (kill) determine pattern: spots, stripes, spirals, coral-like growth
// We're using F=0.039, k=0.058 — the "mitosis" regime: spots that split and replicate organically
// The system runs on a 512×512 grid (GPGPU ping-pong), rendered as a height-displaced mesh
// so the chemical concentration becomes topography. Camera orbit is slow; growth is slower.
// Seeded with 9 random nucleation sites — each viewing unfolds differently.

const W = 512, H = 512;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping,
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false
};

let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// Initialize: U=1 everywhere, V=0 except random seed spots
function makeInitTexture(){
  const data = new Float32Array(W * H * 4);
  for (let i = 0; i < W * H; i++){
    data[i*4]   = 1.0;  // U
    data[i*4+1] = 0.0;  // V
    data[i*4+2] = 0.0;
    data[i*4+3] = 1.0;
  }
  // Seed 9 random spots with high V
  for (let s = 0; s < 9; s++){
    const cx = Math.floor(Math.random() * W);
    const cy = Math.floor(Math.random() * H);
    const rad = 4 + Math.floor(Math.random() * 6);
    for (let dy = -rad; dy <= rad; dy++){
      for (let dx = -rad; dx <= rad; dx++){
        if (dx*dx + dy*dy <= rad*rad){
          const x = (cx + dx + W) % W;
          const y = (cy + dy + H) % H;
          const i = y * W + x;
          data[i*4]   = 0.0;
          data[i*4+1] = 1.0;
        }
      }
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true;
  return tex;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// Gray-Scott integration shader
const simMat = new THREE.ShaderMaterial({
  uniforms: {
    prev: { value: rtA.texture },
    uDt:  { value: 0.8 },
    uRes: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform vec2 uRes;
    varying vec2 vUv;

    void main(){
      vec2 texel = 1.0 / uRes;
      vec4 c = texture2D(prev, vUv);
      float U = c.r;
      float V = c.g;

      // 5-tap Laplacian for diffusion
      float lapU = -U;
      float lapV = -V;
      lapU += 0.2 * texture2D(prev, vUv + vec2( texel.x, 0.0)).r;
      lapU += 0.2 * texture2D(prev, vUv + vec2(-texel.x, 0.0)).r;
      lapU += 0.2 * texture2D(prev, vUv + vec2(0.0,  texel.y)).r;
      lapU += 0.2 * texture2D(prev, vUv + vec2(0.0, -texel.y)).r;
      lapU += 0.05 * texture2D(prev, vUv + vec2( texel.x,  texel.y)).r;
      lapU += 0.05 * texture2D(prev, vUv + vec2(-texel.x,  texel.y)).r;
      lapU += 0.05 * texture2D(prev, vUv + vec2( texel.x, -texel.y)).r;
      lapU += 0.05 * texture2D(prev, vUv + vec2(-texel.x, -texel.y)).r;

      lapV += 0.2 * texture2D(prev, vUv + vec2( texel.x, 0.0)).g;
      lapV += 0.2 * texture2D(prev, vUv + vec2(-texel.x, 0.0)).g;
      lapV += 0.2 * texture2D(prev, vUv + vec2(0.0,  texel.y)).g;
      lapV += 0.2 * texture2D(prev, vUv + vec2(0.0, -texel.y)).g;
      lapV += 0.05 * texture2D(prev, vUv + vec2( texel.x,  texel.y)).g;
      lapV += 0.05 * texture2D(prev, vUv + vec2(-texel.x,  texel.y)).g;
      lapV += 0.05 * texture2D(prev, vUv + vec2( texel.x, -texel.y)).g;
      lapV += 0.05 * texture2D(prev, vUv + vec2(-texel.x, -texel.y)).g;

      // Gray-Scott parameters — mitosis spots regime
      float Du = 0.16;
      float Dv = 0.08;
      float F  = 0.039;
      float k  = 0.058;

      float uvv = U * V * V;
      float dU = Du * lapU - uvv + F * (1.0 - U);
      float dV = Dv * lapV + uvv - (F + k) * V;

      U += dU * uDt;
      V += dV * uDt;

      U = clamp(U, 0.0, 1.0);
      V = clamp(V, 0.0, 1.0);

      gl_FragColor = vec4(U, V, 0.0, 1.0);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ─────────────────────────── render scene ───────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0c0e, 8, 28);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(12, 8, 12);
camera.lookAt(0, 0, 0);

// Height-displaced mesh — V concentration becomes elevation
const meshGeom = new THREE.PlaneGeometry(20, 20, W-1, H-1);
meshGeom.rotateX(-Math.PI * 0.5);

const meshMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform sampler2D state;
    uniform float uTime;
    varying vec3 vPos;
    varying float vHeight;
    varying vec3 vNormal;

    void main(){
      vec2 uv = vec2(position.x / 20.0 + 0.5, position.z / 20.0 + 0.5);
      vec4 s = texture2D(state, uv);
      float V = s.g;
      
      // Height from V concentration — spots rise up
      float h = V * 3.5;
      vec3 pos = vec3(position.x, h, position.z);
      vPos = pos;
      vHeight = h;

      // Compute normal via finite difference for lighting
      vec2 texel = vec2(1.0/512.0, 1.0/512.0);
      float hL = texture2D(state, uv + vec2(-texel.x, 0.0)).g * 3.5;
      float hR = texture2D(state, uv + vec2( texel.x, 0.0)).g * 3.5;
      float hD = texture2D(state, uv + vec2(0.0, -texel.y)).g * 3.5;
      float hU = texture2D(state, uv + vec2(0.0,  texel.y)).g * 3.5;
      vec3 dx = vec3(texel.x * 20.0, hR - hL, 0.0);
      vec3 dy = vec3(0.0, hU - hD, texel.y * 20.0);
      vNormal = normalize(cross(dx, dy));

      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vPos;
    varying float vHeight;
    varying vec3 vNormal;

    void main(){
      // Base color: dark charcoal substrate
      vec3 baseCol = vec3(0.08, 0.09, 0.10);
      
      // Active growth color (high V): warm coral pink fading to cream
      vec3 growthCol = mix(vec3(0.92, 0.55, 0.48), vec3(0.98, 0.92, 0.85), vHeight / 3.5);
      
      // Mix based on height
      vec3 col = mix(baseCol, growthCol, smoothstep(0.0, 0.4, vHeight));
      
      // Simple directional light from above-left
      vec3 lightDir = normalize(vec3(-0.6, 1.0, -0.4));
      float ndl = max(0.0, dot(vNormal, lightDir));
      col *= 0.4 + 0.6 * ndl;
      
      // Rim light on edges
      vec3 viewDir = normalize(cameraPosition - vPos);
      float rim = pow(1.0 - abs(dot(viewDir, vNormal)), 2.5);
      col += vec3(0.12, 0.08, 0.06) * rim * smoothstep(0.2, 1.0, vHeight);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});

const mesh = new THREE.Mesh(meshGeom, meshMat);
scene.add(mesh);

// Ground plane for context
const groundGeom = new THREE.PlaneGeometry(50, 50);
groundGeom.rotateX(-Math.PI * 0.5);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x0d0f11, side: THREE.DoubleSide });
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.y = -0.05;
scene.add(ground);

// Ambient + directional light for fallback (shader does its own lighting but three.js fog needs some)
scene.add(new THREE.AmbientLight(0x404040, 0.3));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(-5, 10, -4);
scene.add(dirLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
let totalT = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  totalT += dt;

  meshMat.uniforms.uTime.value = totalT;

  // Run simulation — 2 substeps per frame for stability
  for (let i = 0; i < 2; i++){
    simMat.uniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  meshMat.uniforms.state.value = rtA.texture;

  // Slow camera orbit — growth is the motion here, not the camera
  const ang = totalT * 0.08;
  camera.position.x = Math.cos(ang) * 12;
  camera.position.z = Math.sin(ang) * 12;
  camera.position.y = 8 + Math.sin(ang * 0.4) * 2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
