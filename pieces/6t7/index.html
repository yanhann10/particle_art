<!doctype html>

<!-- MOTION: breathe, intensity: gentle -->
<style>

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; color:#cdd2dc;
          letter-spacing:0.06em; font-family:ui-monospace,"SF Mono",Menlo,monospace; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size:11px; letter-spacing:0.06em; z-index:10; }

  /* ── parameter panel ── */

</style>

<body>
<div class="id">6t7</div>
<div class="hint">drag to orbit · click to flip · sliders to sculpt</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<div class="panel">

  <div class="param">

  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── panel bindings ── */
const pSway     = document.getElementById('p_sway');
const pHue      = document.getElementById('p_hue');
const pFog      = document.getElementById('p_fog');
const pPtscale  = document.getElementById('p_ptscale');
const pMspeed   = document.getElementById('p_mspeed');
const pBreathe  = document.getElementById('p_breathe');
const vSway     = document.getElementById('v_sway');
const vHue      = document.getElementById('v_hue');
const vFog      = document.getElementById('v_fog');
const vPtscale  = document.getElementById('v_ptscale');
const vMspeed   = document.getElementById('v_mspeed');
const vBreathe  = document.getElementById('v_breathe');

function readParams(){
  return {
    sway:    parseFloat(pSway.value),
    hue:     parseFloat(pHue.value),
    fog:     parseFloat(pFog.value),
    ptscale: parseFloat(pPtscale.value),
    mspeed:  parseFloat(pMspeed.value),
    breathe: parseFloat(pBreathe.value),
  };
}
function updateLabels(p){
  vSway.textContent    = p.sway.toFixed(2);
  vHue.textContent     = Math.round(p.hue) + '°';
  vFog.textContent     = p.fog.toFixed(3);
  vPtscale.textContent = p.ptscale.toFixed(2);
  vMspeed.textContent  = p.mspeed.toFixed(2);
  vBreathe.textContent = p.breathe.toFixed(2);
}
[pSway,pHue,pFog,pPtscale,pMspeed,pBreathe].forEach(el => {
  el.addEventListener('input', () => updateLabels(readParams()));
});

// ── scene ──
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ── L-system cypress (pose A) ──
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = new THREE.Vector3(0,1,0), l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

const cypressSegs = turtle(expand('F', 6, rng));

// ── art-deco tower (pose B) ──
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();
  const tiers = [
    { hw: 4.5, y0: 0.0, y1: 4.0, ridges: 14 },
    { hw: 3.4, y0: 4.0, y1: 7.5, ridges: 12 },
    { hw: 2.4, y0: 7.5, y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8 },
    { hw: 0.85, y0: 13.0, y1: 15.0, ridges: 6 },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;
  const W = Math.floor(N * 0.55), B = Math.floor(N * 0.25), S = Math.floor(N * 0.12);
  const C = N - W - B - S;
  let i = 0;

  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b, 0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0, ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      const face = Math.floor(Math.random() * 4);
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;
      const along = (ridgeFrac * 2 - 1) * t.hw;
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      const jitter = 0.04;
      switch(face){
        case 0: pos.set( t.hw+(Math.random()-0.5)*jitter, y, along); break;
        case 1: pos.set(-t.hw+(Math.random()-0.5)*jitter, y, along); break;
        case 2: pos.set(along, y,  t.hw+(Math.random()-0.5)*jitter); break;
        case 3: pos.set(along, y, -t.hw+(Math.random()-0.5)*jitter); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const along = (Math.random() * 2 - 1) * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set( t.hw, edge+(Math.random()-0.5)*j, along); break;
      case 1: pos.set(-t.hw, edge+(Math.random()-0.5)*j, along); break;
      case 2: pos.set(along, edge+(Math.random()-0.5)*j,  t.hw); break;
      case 3: pos.set(along, edge+(Math.random()-0.5)*j, -t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k = 0; k < S; k++){
    const t = Math.random();
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5) * 0.05;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ── build particle arrays ──
const N = 70000;
const treePos  = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N * SKELETON_FRAC);

let written = 0;
const v = new THREE.Vector3();
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written) : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    written++;
  }
}
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8, SPIRAL = 0.9, TUFT_COUNT = 24;
  const N_FOLIAGE = N - N_SKEL;
  const tuftYs = [], tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    tuftYs.push(haloYStart + ((i+0.5)/TUFT_COUNT) * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }
  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT  = N_FOLIAGE - N_RIDGE;
  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random() - 0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    treePos[written*3]   = Math.cos(th) * r;
    treePos[written*3+1] = y + (Math.random()-0.5)*0.05;
    treePos[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random(); written++;
  }
  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t], tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const localY = tuftY + (Math.random()-0.5)*0.4;
    const localTh = tuftTh + (Math.random()-0.5)*0.4;
    const localR = reach + (Math.random()-0.5)*0.18;
    treePos[written*3]   = Math.cos(localTh) * localR;
    treePos[written*3+1] = localY;
    treePos[written*3+2] = Math.sin(localTh) * localR;
    seeds[written] = Math.random(); written++;
  }
}
while (written < N){ treePos[written*3]=0; treePos[written*3+1]=0; treePos[written*3+2]=0; seeds[written]=Math.random(); written++; }

function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity, cx = 0, cz = 0;
  const n = arr.length / 3;
  for (let i = 0; i < n; i++){
    minY = Math.min(minY, arr[i*3+1]); maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= n; cz /= n;
  const s = targetH / (maxY - minY);
  for (let i = 0; i < n; i++){
    arr[i*3]   = (arr[i*3] - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

// ── shader ──
const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uMix:      { value: 0 },
  uSway:     { value: 1.0 },
  uHue:      { value: 0.0 },
  uPtScale:  { value: 1.0 },
  uBreathe:  { value: 0.0 },
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uMix, uSway, uHue, uPtScale, uBreathe;
    attribute vec3 treePos, towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;

    // hue rotation in RGB
    vec3 hueShift(vec3 c, float angle){
      float s = sin(angle), co = cos(angle);
      vec3 w = vec3(0.299, 0.587, 0.114);
      vec3 k = vec3(
        co + (1.0-co)*w.x + s*(-w.z),
        co + (1.0-co)*w.y + s*(0.0),
        co + (1.0-co)*w.z + s*(w.x)
      );
      // Rodrigues approx for hue rotation matrix
      float cosA = cos(angle), sinA = sin(angle);
      mat3 rot = mat3(
        cosA + (1.0-cosA)*0.299,             (1.0-cosA)*0.299*0.587/0.299 - sinA*0.114, (1.0-cosA)*0.299*0.114/0.299 + sinA*0.587,
        (1.0-cosA)*0.587*0.299/0.587 + sinA*0.114, cosA + (1.0-cosA)*0.587,             (1.0-cosA)*0.587*0.114/0.587 - sinA*0.299,
        (1.0-cosA)*0.114*0.299/0.114 - sinA*0.587, (1.0-cosA)*0.114*0.587/0.114 + sinA*0.299, cosA + (1.0-cosA)*0.114
      );
      return clamp(rot * c, 0.0, 1.0);
    }

    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // breathe: whole form scale modulation
      float breatheScale = 1.0 + uBreathe * sin(uTime * 0.9 + 0.3);
      p *= breatheScale;

      // sway
      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = uSway * (1.0 - m) * 0.06 * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      vEnergy = 0.5 + 0.5 * sin(t * 0.8);

      // palette
      vec3 treeA = vec3(0.18, 0.36, 0.20);
      vec3 treeB = vec3(0.55, 0.78, 0.35);
      vec3 treeC = vec3(0.85, 0.92, 0.55);
      vec3 deco_a = vec3(0.42, 0.30, 0.18);
      vec3 deco_b = vec3(0.92, 0.72, 0.40);
      vec3 deco_c = vec3(0.99, 0.94, 0.84);

      float hk = clamp(p.y / (16.0 * breatheScale), 0.0, 1.0);
      vec3 treeCol  = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      vec3 decoCol  = mix(deco_a, deco_b, hk);
      decoCol = mix(decoCol, deco_c, smoothstep(0.85, 1.0, hk) * 0.7);
      vec3 col = mix(treeCol, decoCol, m);

      // apply hue shift
      float hueRad = uHue * 3.14159265 / 180.0;
      vCol = hueShift(col, hueRad);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPtScale * (0.9 + 0.7 * vEnergy) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── interaction ──
let target = 0;
let phase = 0;
addEventListener('click', e => {
  // ignore clicks on the panel
  if (e.target.closest('.panel')) return;
  target = 1 - target;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();
let morphClock = 0;

function loop(){
  const dt = 1/60;
  const t = (performance.now() - start) / 1000;
  const P = readParams();

  uniforms.uTime.value = t;
  uniforms.uSway.value = P.sway;
  uniforms.uHue.value  = P.hue;
  uniforms.uPtScale.value = P.ptscale;
  uniforms.uBreathe.value = P.breathe;

  // fog density
  scene.fog.density = P.fog;

  // morph clock runs at user-controlled speed
  morphClock += dt * P.mspeed;
  const auto = (Math.floor(morphClock / 12) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  // gentle orbit
  const ang = t * 0.05;
  camera.position.x = Math.sin(ang) * 22;
  camera.position.z = Math.cos(ang) * 22;
  camera.position.y = 6 + Math.sin(t * 0.12) * 1.5;
  camera.lookAt(0, 8, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){

  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
