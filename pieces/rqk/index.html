<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rqk · physarum transport network · decentralized pathfinding</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">rqk</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Physarum polycephalum transport network growth — NOT human-centered composition.
// The slime mold finds food sources via distributed chemoattractant gradients,
// then reinforces successful paths while pruning unused ones. No symmetry, no
// centered subject, no portraiture. The camera observes from a near-horizontal
// tangent plane as the organism spreads across substrate in real time. Emergent
// network topology arises from agent-based rules (not authored structure).
//
// Implementation: 8000 mobile agents on a 2D substrate (XZ plane). Each agent:
//   - deposits pheromone trail at its location
//   - senses local gradient (three forward sensors)
//   - turns toward strongest gradient + small random walk
//   - pheromone diffuses + decays over time
// Four food sources (nutrient points) act as chemoattractant sinks.
// Rendering: 60k particles sample the 2D pheromone field, brightness = concentration.
// Camera: low angle, near-parallel to ground, slow drift along one axis — the view
// a beetle would have crawling nearby, NOT a human standing over the petri dish.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0e, 0.12);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 80);
camera.position.set(-2.2, 0.4, 0);
camera.lookAt(4, 0.3, 0);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

// ─────────────────────────── physarum agents (8000 mobile walkers)
const N_AGENTS = 8000;
const SENSOR_ANGLE = 0.42;       // radians offset for left/right sensors
const SENSOR_DIST = 0.35;        // forward sensor distance
const TURN_SPEED = 0.28;         // max turn per step
const MOVE_SPEED = 0.045;        // forward step size
const DEPOSIT_AMT = 1.8;         // pheromone deposited per step
const DECAY = 0.92;              // pheromone decay per step (global multiply)
const DIFFUSE = 0.18;            // diffusion coefficient (neighbor bleed)

const agents = [];
for (let i = 0; i < N_AGENTS; i++){
  // spawn in small cluster near origin (inoculation point)
  const r = Math.random() * 0.6;
  const th = Math.random() * Math.PI * 2;
  agents.push({
    x: Math.cos(th)*r,
    z: Math.sin(th)*r,
    angle: Math.random() * Math.PI * 2
  });
}

// ─────────────────────────── 2D pheromone field (discrete grid)
const GRID_W = 200, GRID_H = 200;
const CELL_SIZE = 0.08;
const field = new Float32Array(GRID_W * GRID_H);
const fieldNext = new Float32Array(GRID_W * GRID_H);

function worldToGrid(x, z){
  const gx = Math.floor((x / CELL_SIZE) + GRID_W * 0.5);
  const gz = Math.floor((z / CELL_SIZE) + GRID_H * 0.5);
  return { gx, gz };
}
function gridToWorld(gx, gz){
  return {
    x: (gx - GRID_W * 0.5) * CELL_SIZE,
    z: (gz - GRID_H * 0.5) * CELL_SIZE
  };
}
function getField(gx, gz){
  if (gx < 0 || gx >= GRID_W || gz < 0 || gz >= GRID_H) return 0;
  return field[gz * GRID_W + gx];
}
function addField(gx, gz, v){
  if (gx < 0 || gx >= GRID_W || gz < 0 || gz >= GRID_H) return;
  field[gz * GRID_W + gx] += v;
}

// ─────────────────────────── food sources (chemoattractant points)
const foods = [
  { x:  5.2, z:  3.8 },
  { x:  6.5, z: -2.4 },
  { x: -4.8, z:  4.2 },
  { x: -3.2, z: -5.6 }
];
const FOOD_STRENGTH = 120;

// ─────────────────────────── simulation step
function stepPhysarum(){
  // 1. agent sense + move + deposit
  for (let i = 0; i < N_AGENTS; i++){
    const a = agents[i];
    // sense three directions: forward, left, right
    const fwdX = a.x + Math.cos(a.angle) * SENSOR_DIST;
    const fwdZ = a.z + Math.sin(a.angle) * SENSOR_DIST;
    const leftX = a.x + Math.cos(a.angle - SENSOR_ANGLE) * SENSOR_DIST;
    const leftZ = a.z + Math.sin(a.angle - SENSOR_ANGLE) * SENSOR_DIST;
    const rightX = a.x + Math.cos(a.angle + SENSOR_ANGLE) * SENSOR_DIST;
    const rightZ = a.z + Math.sin(a.angle + SENSOR_ANGLE) * SENSOR_DIST;

    const fwd = sampleWithFood(fwdX, fwdZ);
    const left = sampleWithFood(leftX, leftZ);
    const right = sampleWithFood(rightX, rightZ);

    // turn toward strongest signal
    if (fwd > left && fwd > right){
      // continue straight (small random wiggle)
      a.angle += (Math.random() - 0.5) * 0.08;
    } else if (left > right){
      a.angle -= TURN_SPEED * (0.5 + 0.5 * Math.random());
    } else if (right > left){
      a.angle += TURN_SPEED * (0.5 + 0.5 * Math.random());
    } else {
      // equal — random walk
      a.angle += (Math.random() - 0.5) * TURN_SPEED * 1.4;
    }

    // move forward
    const nx = a.x + Math.cos(a.angle) * MOVE_SPEED;
    const nz = a.z + Math.sin(a.angle) * MOVE_SPEED;
    const { gx: ngx, gz: ngz } = worldToGrid(nx, nz);
    // bounce off edges
    if (ngx < 2 || ngx >= GRID_W - 2 || ngz < 2 || ngz >= GRID_H - 2){
      a.angle += Math.PI + (Math.random() - 0.5) * 0.6;
    } else {
      a.x = nx; a.z = nz;
    }

    // deposit pheromone at current position
    const { gx, gz } = worldToGrid(a.x, a.z);
    addField(gx, gz, DEPOSIT_AMT);
  }

  // 2. diffuse + decay
  for (let gz = 1; gz < GRID_H - 1; gz++){
    for (let gx = 1; gx < GRID_W - 1; gx++){
      const idx = gz * GRID_W + gx;
      const sum =
        field[idx] * (1 - DIFFUSE) +
        (field[idx - 1] + field[idx + 1] + field[idx - GRID_W] + field[idx + GRID_W]) * (DIFFUSE / 4);
      fieldNext[idx] = sum * DECAY;
    }
  }
  for (let i = 0; i < field.length; i++) field[i] = fieldNext[i];
}

function sampleWithFood(x, z){
  const { gx, gz } = worldToGrid(x, z);
  let val = getField(gx, gz);
  // add chemoattractant from food sources (distance falloff)
  for (const f of foods){
    const dx = x - f.x, dz = z - f.z;
    const d2 = dx*dx + dz*dz;
    val += FOOD_STRENGTH / (1 + d2 * 0.8);
  }
  return val;
}

// ─────────────────────────── rendering: 60k particles sample the field
const N_RENDER = 60000;
const rPos = new Float32Array(N_RENDER * 3);
const rIntensity = new Float32Array(N_RENDER);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('intensity', new THREE.BufferAttribute(rIntensity, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float intensity;
    varying float vI;
    void main(){
      vI = intensity;
      vec3 p = position;
      // slight vertical layering by intensity (thicker trails = slightly raised)
      p.y += intensity * 0.008;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + intensity * 0.6) * uPixel * (20.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vI;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float core = exp(-r * 22.0);
      // pale yellow-green (bioluminescence of slime mold)
      vec3 col = vec3(0.78, 0.82, 0.52);
      float a = core * vI * 0.45;
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// substrate plane (dark charcoal, barely visible — the agar)
const subGeo = new THREE.PlaneGeometry(18, 18);
const subMat = new THREE.MeshBasicMaterial({ color: 0x0d0f11, side: THREE.DoubleSide });
const substrate = new THREE.Mesh(subGeo, subMat);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = -0.02;
scene.add(substrate);

// food sources rendered as faint dim emissive discs
foods.forEach(f => {
  const fGeo = new THREE.CircleGeometry(0.12, 16);
  const fMat = new THREE.MeshBasicMaterial({ color: 0x3a2c1a, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
  const fMesh = new THREE.Mesh(fGeo, fMat);
  fMesh.rotation.x = -Math.PI / 2;
  fMesh.position.set(f.x, 0.01, f.z);
  scene.add(fMesh);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let stepCount = 0;
function loop(){
  const t = (performance.now() - start) / 1000;
  mat.uniforms.uTime.value = t;

  // 2 sim steps per frame (balance evolution speed vs performance)
  stepPhysarum();
  stepPhysarum();
  stepCount += 2;

  // distribute render particles across grid weighted by pheromone concentration
  // (rejection sampling: propose random grid cell, accept with probability ∝ field value)
  let written = 0;
  const maxAttempts = N_RENDER * 4;
  for (let attempt = 0; attempt < maxAttempts && written < N_RENDER; attempt++){
    const gx = Math.floor(Math.random() * GRID_W);
    const gz = Math.floor(Math.random() * GRID_H);
    const val = field[gz * GRID_W + gx];
    if (Math.random() < val / 80){
      const { x, z } = gridToWorld(gx, gz);
      rPos[written*3]   = x + (Math.random()-0.5) * CELL_SIZE * 0.7;
      rPos[written*3+1] = 0;
      rPos[written*3+2] = z + (Math.random()-0.5) * CELL_SIZE * 0.7;
      rIntensity[written] = Math.min(val / 12, 1.0);
      written++;
    }
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.intensity.needsUpdate = true;

  // camera drift: slow lateral slide along -X axis (beetle crawling past the colony)
  camera.position.x -= 0.0012;
  camera.position.z += 0.0005;
  const lookX = camera.position.x + 6;
  camera.lookAt(lookX, 0.3, camera.position.z);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
