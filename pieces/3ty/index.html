<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>3ty · Infrastructure dissolving into shared sky</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  background: linear-gradient(to top,
    #1a0e04 0%, #110a10 25%, #0a0818 50%, #060612 75%, #030308 100%);
  color: #cdd2dc;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0 0.10  0 0 0 0.22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.50'/></svg>");
  mix-blend-mode: screen; opacity: 0.30;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 130% 35% at 50% 100%,
    rgba(255,150,40,0.10), rgba(255,150,40,0) 55%);
  mix-blend-mode: screen;
}
canvas { display:block; position:relative; z-index:0; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55;
      font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
      color:#cdd2dc; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">3ty</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Amelia Winger-Bearskin — 'I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY'
// (Lumen 2025 Special Commendation)
//
// Two-layer leaf landscape. The 'built' layer — orthogonal grid-leaves representing
// roads, fences, power lines — slowly erodes upward into the 'sky' layer: a deep
// field of cobalt and starfield-white leaf-points. The erosion breathes with
// biomorphic tidal rhythm — peristaltic contraction and expansion, not algorithmic
// switching. Over a long cycle the infrastructure dissolves and the shared celestial
// commons is revealed. Then it gathers again. Separation / return.
//
// Leaf as basic unit: every particle is a pointed-oval leaf. On the ground they
// are sodium-lit road-debris; in the sky they are star-fragments. Same form,
// different world.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 2, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const N_BUILT = Math.floor(N * 0.52);
const N_SKY = N - N_BUILT;

const pos    = new Float32Array(N * 3);
const seeds  = new Float32Array(N);
const layers = new Float32Array(N); // 0 = built, 1 = sky

function mkRng(s) {
  s = s >>> 0;
  return () => {
    s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildField(seed) {
  const rng = mkRng(seed);

  // Infrastructure grid: roads + fences + power-line corridors
  const lines = [];
  const nLines = 10 + Math.floor(rng() * 6);
  for (let i = 0; i < nLines; i++) {
    const horiz = rng() > 0.45;
    const p = (rng() - 0.5) * 12;
    const w = 0.04 + rng() * 0.18;
    const dense = 0.3 + rng() * 0.7; // density weight
    lines.push({ horiz, p, w, dense });
  }

  // Built layer — particles along grid lines
  for (let i = 0; i < N_BUILT; i++) {
    const line = lines[Math.floor(rng() * lines.length)];
    let x, z;
    if (line.horiz) {
      x = (rng() - 0.5) * 16;
      z = line.p + (rng() - 0.5) * line.w * 3;
    } else {
      z = (rng() - 0.5) * 16;
      x = line.p + (rng() - 0.5) * line.w * 3;
    }
    // Gentle terrain undulation
    const y = -1.8 + Math.sin(x * 0.22) * 0.25 + Math.cos(z * 0.19) * 0.2;
    pos[i * 3]     = x;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = z;
    seeds[i]  = rng();
    layers[i] = 0.0;
  }

  // Sky layer — hemisphere scatter, denser toward zenith
  for (let i = N_BUILT; i < N; i++) {
    const th = rng() * Math.PI * 2;
    const phi = rng() * Math.PI * 0.42;
    const r = 5 + rng() * 25;
    pos[i * 3]     = r * Math.sin(phi) * Math.cos(th);
    pos[i * 3 + 1] = 3 + r * Math.cos(phi);
    pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(th);
    seeds[i]  = rng();
    layers[i] = 1.0;
  }
}

buildField(7741);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aLayer',   new THREE.BufferAttribute(layers, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uPhase:  { value: 0 },
  uPointer:{ value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform vec2  uPointer;
    attribute float aSeed;
    attribute float aLayer;
    varying float vLayer;
    varying float vSeed;
    varying float vAlpha;
    varying float vDepth;

    void main() {
      vec3 p = position;
      float t = uTime;
      float sd = aSeed;

      // Biomorphic tidal breath — peristaltic wave across the ground plane
      float breathWave = sin(t * 0.09 + sd * 6.28);
      float tidalPulse = sin(t * 0.14 + p.x * 0.15 + p.z * 0.12);

      // Per-particle phase with organic offset
      float localPhase = clamp(uPhase + breathWave * 0.06, 0.0, 1.0);

      if (aLayer < 0.5) {
        // ── BUILT LAYER ──
        // Vascular pulsing along grid — living infrastructure
        float vascX = sin(t * 0.12 + p.x * 0.4) * 0.10;
        float vascZ = sin(t * 0.10 + p.z * 0.35) * 0.08;
        p.y += (vascX + vascZ) * (1.0 - localPhase);

        // Peristaltic ground breathing
        float periWave = sin(t * 0.07 + length(p.xz) * 0.25) * 0.14;
        p.y += periWave * (1.0 - localPhase);

        // Erosion lift: threshold by seed so particles peel off stochastically
        float liftThresh = sd * 0.65;
        float lift = smoothstep(liftThresh, liftThresh + 0.25, localPhase);

        // Lifted particles drift upward organically
        p.y += lift * (4.0 + sd * 10.0);
        p.x += lift * sin(sd * 47.0 + t * 0.06) * 2.5;
        p.z += lift * cos(sd * 33.0 + t * 0.05) * 2.0;
        // Slight spiral as they rise — like leaves caught in updraft
        float angle = lift * (1.0 + sd) * 1.5 + t * 0.04;
        float rx = p.x, rz = p.z;
        p.x = rx * cos(angle * 0.1) - rz * sin(angle * 0.1);
        p.z = rx * sin(angle * 0.1) + rz * cos(angle * 0.1);

        vAlpha = mix(0.82, 0.0, smoothstep(0.5, 1.0, lift));
      } else {
        // ── SKY LAYER ──
        // Slow celestial drift — each star-leaf drifts independently
        float d = t * 0.015;
        p.x += sin(d + sd * 23.0) * 0.4;
        p.y += cos(d * 0.6 + sd * 17.0) * 0.25;
        p.z += sin(d * 0.8 + sd * 31.0) * 0.3;

        // Gentle tidal sway
        p.y += sin(t * 0.05 + sd * 3.14) * 0.2;

        // Reveal as phase increases
        float reveal = smoothstep(0.15, 0.7, localPhase);
        // Even at phase 0, faintest stars visible
        vAlpha = mix(0.06, 0.6, reveal);
        // Bright stars (high seed) get extra alpha
        float brightness = smoothstep(0.88, 0.97, sd);
        vAlpha += brightness * 0.35 * reveal;
      }

      // Subtle pointer parallax
      p.x += uPointer.x * (0.2 + aLayer * 0.4);
      p.y += uPointer.y * (0.15 + aLayer * 0.3);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      vLayer = aLayer;
      vSeed = sd;

      float sz = aLayer < 0.5 ? 2.0 : (0.8 + sd * 1.8);
      gl_PointSize = sz * uPixel * (5.5 / max(vDepth, 0.5));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLayer;
    varying float vSeed;
    varying float vAlpha;
    varying float vDepth;

    void main() {
      vec2 uv = gl_PointCoord - 0.5;

      // Leaf shape — pointed oval with taper
      float leafLen = length(uv * vec2(1.0, 2.4));
      if (leafLen > 0.44) discard;
      float shape = exp(-leafLen * leafLen * 16.0);

      // Faint midrib vein
      float vein = exp(-abs(uv.x) * 45.0) * 0.12;

      vec3 col;
      float a;

      if (vLayer < 0.5) {
        // Sodium-orange — light pollution palette
        // Hand-tuned: deep amber #B85C0A, sodium #FFA028, dim rust #4A2005
        vec3 sodium  = vec3(1.00, 0.63, 0.16);
        vec3 amber   = vec3(0.72, 0.36, 0.04);
        vec3 rust    = vec3(0.29, 0.13, 0.02);
        col = mix(rust, mix(amber, sodium, vSeed * 0.8), shape * 0.7 + 0.3);
        col += vein * vec3(1.0, 0.65, 0.20);
        a = shape * vAlpha;
        // Distance fade
        a *= 1.0 - clamp((vDepth - 12.0) / 18.0, 0.0, 0.75);
      } else {
        // Cobalt–to–starfield-white — sky palette
        // Hand-tuned: deep #0E1340, cobalt #1E3478, ice-white #D0D8F0
        vec3 deep    = vec3(0.055, 0.075, 0.25);
        vec3 cobalt  = vec3(0.12, 0.20, 0.47);
        vec3 ice     = vec3(0.82, 0.85, 0.94);
        float bright = smoothstep(0.85, 0.97, vSeed);
        col = mix(mix(deep, cobalt, vSeed), ice, bright);
        col += vein * vec3(0.25, 0.30, 0.65) * 0.4;
        a = shape * vAlpha;
        a *= 1.0 - clamp((vDepth - 30.0) / 40.0, 0.0, 0.65);
      }

      gl_FragColor = vec4(col, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
points.frustumCulled = false;
scene.add(points);

// ── DUST MOTES — twilight atmosphere ──
const ND = 200;
const dPos = new Float32Array(ND * 3);
const dSd  = new Float32Array(ND);
for (let i = 0; i < ND; i++) {
  dPos[i*3]   = (Math.random()-0.5) * 18;
  dPos[i*3+1] = (Math.random()-0.5) * 12;
  dPos[i*3+2] = (Math.random()-0.5) * 10;
  dSd[i] = Math.random();
}
const dGeom = new THREE.BufferGeometry();
dGeom.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dGeom.setAttribute('aSeed',    new THREE.BufferAttribute(dSd, 1));
const dMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uPhase: uniforms.uPhase },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uPhase;
    attribute float aSeed;
    varying float vG;
    void main() {
      vec3 p = position;
      float t = uTime * 0.05 + aSeed * 6.28;
      p.x += sin(t * 1.2 + aSeed * 28.0) * 0.6;
      p.y += cos(t * 0.9 + aSeed * 18.0) * 0.4;
      p.z += sin(t * 0.7 + aSeed * 22.0) * 0.3;
      // Color temperature shifts with phase: warm at ground, cool at sky
      vG = mix(0.25, 0.40, uPhase) + 0.15 * sin(t * 1.5);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.6 + vG * 0.8) * uPixel * (3.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vG;
    uniform float uPhase;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 22.0);
      // Warm to cool transition
      vec3 warm = vec3(0.95, 0.75, 0.45);
      vec3 cool = vec3(0.50, 0.55, 0.80);
      vec3 col = mix(warm, cool, uPhase) * vG;
      gl_FragColor = vec4(col, a * 0.35 * vG);
    }
  `
});
const dustPts = new THREE.Points(dGeom, dMat);
dustPts.frustumCulled = false;
scene.add(dustPts);

// ── Interaction ──
addEventListener('pointermove', e => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});

addEventListener('click', () => {
  buildField(Math.floor(Math.random() * 1e9));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.aSeed.needsUpdate = true;
  geom.attributes.aLayer.needsUpdate = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ──
function ss(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  uniforms.uTime.value = t;

  // Long tidal cycle: ~100s. Asymmetric — erosion is slow (60s), return faster (40s).
  // Narrative: loss is gradual, gathering is urgent.
  const cycle = (t % 100) / 100;
  let phase;
  if (cycle < 0.60) {
    phase = ss(0, 0.60, cycle);
  } else {
    phase = 1.0 - ss(0.60, 1.0, cycle);
  }
  // Biomorphic breathing modulation
  phase += Math.sin(t * 0.09) * 0.04 + Math.sin(t * 0.17) * 0.02;
  uniforms.uPhase.value = Math.max(0, Math.min(1, phase));

  // Camera: rises and tilts skyward as infrastructure erodes
  const ph = uniforms.uPhase.value;
  camera.position.x = Math.sin(t * 0.025) * 1.8;
  camera.position.y = 0.5 + ph * 4.0 + Math.sin(t * 0.035) * 0.4;
  camera.position.z = 15 - ph * 4.0;
  camera.lookAt(0, -1.0 + ph * 3.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
