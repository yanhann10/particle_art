<script type="importmap">

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.002);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Single warm side-light — darkness is the material
scene.add(new THREE.AmbientLight(0x080202, 0.008));
const warmL = new THREE.PointLight(0xff5530, 0.03, 60, 2.0);
warmL.position.set(5, 10, -6);
scene.add(warmL);

let seed = 3917264;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ── ARCHITECTURAL VOLUME — 30×24×26 chamber
const ROOM = { w:30, h:24, d:26 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE SUSPENDED SPHERE — pale moon at the heart of the circulatory web
const sphereCenter = new THREE.Vector3(0.8, 1.5, -0.3);
const sphereRadius = 1.8;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8d8,
  emissive: 0xf0e8d8,
  emissiveIntensity: 0.55,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.3,
  fog: true,
  side: THREE.DoubleSide
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── DARK FRAGMENTS — 18 charred keys / paper scraps suspended in the web
const fragments = [];
for(let i = 0; i < 18; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  // Key-like shapes: a ring + shaft
  if(rng() < 0.5){
    // Key shape — small cross
    const s = 0.04 + rng()*0.07;
    verts.push(-s,0,0, s,0,0, 0,-s,0, 0,s*1.5,0, -s*0.4,s*1.2,0, s*0.4,s*1.2,0);
  } else {
    // Paper scrap — irregular triangle
    const s = 0.05 + rng()*0.09;
    for(let j=0;j<3;j++){
      verts.push((rng()-0.5)*s,(rng()-0.5)*s,(rng()-0.5)*s*0.15,
                 (rng()-0.5)*s,(rng()-0.5)*s,(rng()-0.5)*s*0.15);
    }
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color: 0x0c0908, transparent: true, opacity: 0.45
  }));
  let pos;
  do {
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = 3.0 + rng()*8.0;
    pos = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.75,
      sphereCenter.z + Math.cos(v)*r
    );
  } while(pos.distanceTo(sphereCenter) < 3.0);
  fMesh.position.copy(pos);
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — deliberate negative space
const voids = [];
for(let i = 0; i < 3; i++){
  const a = (i/3)*Math.PI*2 + rng()*1.0;
  const vr = 5.5 + rng()*3.5;
  voids.push({
    x: sphereCenter.x + Math.cos(a)*vr,
    z: sphereCenter.z + Math.sin(a)*vr,
    r: 2.0 + rng()*0.7
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ANCHOR FIELD — truncated icosahedron vertices projected into room volume
// (manfred_mohr directive: let geometry generate the topology)
const anchors = [];
// Golden ratio for icosahedron
const phi = (1+Math.sqrt(5))/2;
const icoVerts = [
  [-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],
  [0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],
  [phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]
];
// Project icosahedron at multiple scales
const scales = [2.5, 4.5, 7.0, 10.0, 13.5];
for(const sc of scales){
  for(const iv of icoVerts){
    const pt = new THREE.Vector3(
      sphereCenter.x + iv[0]*sc*(0.9+rng()*0.2),
      sphereCenter.y + iv[1]*sc*0.8*(0.9+rng()*0.2),
      sphereCenter.z + iv[2]*sc*(0.9+rng()*0.2)
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
  // Add intermediate random anchors at this shell
  const extra = Math.floor(8 + sc*0.8);
  for(let i=0; i<extra; i++){
    const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
    const r=sc*(0.85+rng()*0.3);
    const pt = new THREE.Vector3(
      sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.8,
      sphereCenter.z+Math.cos(v)*r
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
}
// Wall anchors
for(let i=0; i<40; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── POINT ON SPHERE SURFACE
function sphereSurfPt(){
  const u=rng()*Math.PI*2;
  const v=Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereRadius,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereRadius,
    sphereCenter.z + Math.cos(v)*sphereRadius
  );
}

// ── SUSPENSION THREADS — 8 lines from ceiling to sphere top
const suspPts = [];
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.3;
  const topR=0.1+rng()*0.4;
  suspPts.push(
    sphereCenter.x+Math.cos(a)*topR, hh, sphereCenter.z+Math.sin(a)*topR,
    sphereCenter.x+Math.cos(a)*0.06, sphereCenter.y+sphereRadius+0.05, sphereCenter.z+Math.sin(a)*0.06
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0e0505, transparent: true, opacity: 0.3
})));

// ── BUILD THREAD NETWORK — 20,000 segments max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  if(inVoid(a) || inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li]=cat||0;
  li++;
}

// RULE 1: VASCULAR CONVERGENCE — 50% — threads from volume toward sphere
// Like blood vessels converging on a heart
const catA = Math.floor(NUM_LINES*0.50);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let origin;
  if(rng()<0.35){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  const target = sphereSurfPt();

  // 12% yearning threads — stop short, quivering before the surface
  if(rng()<0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng()*1.5;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: LATERAL WEB — anchor-to-anchor proximity connections
const THRESH = 7.0;
const catBtarget = Math.floor(NUM_LINES*0.20);
let catBcount=0, attempts=0;
while(catBcount<catBtarget && li<NUM_LINES && attempts<50000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0;j<10;j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 1);
  catBcount++;
}

// RULE 3: RADIAL SPOKES — lines radiating outward from sphere like sun rays
// Creates the "circulatory cosmos around a moon" image
for(let i=0; i<600 && li<NUM_LINES; i++){
  const surfPt = sphereSurfPt();
  const dir = surfPt.clone().sub(sphereCenter).normalize();
  // Add slight angular deviation for hand-tied irregularity
  dir.x += (rng()-0.5)*0.15;
  dir.y += (rng()-0.5)*0.15;
  dir.z += (rng()-0.5)*0.15;
  dir.normalize();
  const len = 2.0 + rng()*9.0;
  const endPt = surfPt.clone().add(dir.clone().multiplyScalar(len));
  setLine(surfPt, endPt, 2);
}

// RULE 4: DENDRITIC CHAINS — branching filaments from anchors
// Morphogenetic — each anchor spawns chains that branch
for(let i=0; i<100 && li<NUM_LINES; i++){
  let pt = anchors[Math.floor(rng()*anchors.length)].clone();
  const toCenter = sphereCenter.clone().sub(pt).normalize();
  // Grow toward sphere initially, then deviate
  let dir = toCenter.clone();
  const chainLen = 3 + Math.floor(rng()*4);
  for(let c=0; c<chainLen && li<NUM_LINES; c++){
    const len = 0.3 + rng()*0.7;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
    );
    dir = dir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.clone().multiplyScalar(len));
    setLine(pt, next, 3);
    // Branch at generation 1
    if(c===1 && rng()<0.4 && li<NUM_LINES){
      const bDev = new THREE.Vector3(
        (rng()-0.5)*0.7, (rng()-0.5)*0.7, (rng()-0.5)*0.7
      );
      const bDir = dir.clone().add(bDev).normalize();
      const bEnd = pt.clone().add(bDir.multiplyScalar(0.3+rng()*0.5));
      setLine(pt, bEnd, 3);
      // Second generation branch
      if(rng()<0.3 && li<NUM_LINES){
        const b2Dir = bDir.clone().add(new THREE.Vector3(
          (rng()-0.5)*0.8,(rng()-0.5)*0.8,(rng()-0.5)*0.8
        )).normalize();
        setLine(bEnd, bEnd.clone().add(b2Dir.multiplyScalar(0.2+rng()*0.4)), 3);
      }
    }
    pt = next;
  }
}

// RULE 5: VERTICAL RAIN — threads falling from above, some reaching sphere
// Like rain, like tears, like memory descending
for(let i=0; i<400 && li<NUM_LINES; i++){
  const x = sphereCenter.x + (rng()-0.5)*18;
  const z = sphereCenter.z + (rng()-0.5)*16;
  const topY = hh - rng()*2.0;
  const top = new THREE.Vector3(x, topY, z);

  let bot;
  if(rng()<0.25){
    // Some rain threads reach toward sphere
    bot = sphereSurfPt();
  } else {
    const dropLen = 3.0 + rng()*8.0;
    bot = new THREE.Vector3(
      x + (rng()-0.5)*1.2,
      topY - dropLen,
      z + (rng()-0.5)*0.8
    );
  }
  setLine(top, bot, 1);
}

// RULE 6: FLOOR ASCENDING — threads rising from the ground
for(let i=0; i<250 && li<NUM_LINES; i++){
  const a = rng()*Math.PI*2;
  const floorR = 1.0 + rng()*11.0;
  const floorPt = new THREE.Vector3(
    sphereCenter.x + Math.cos(a)*floorR,
    -hh + rng()*0.4,
    sphereCenter.z + Math.sin(a)*floorR
  );
  let target;
  if(rng()<0.3){
    target = sphereSurfPt();
  } else {
    const midA = rng()*Math.PI*2;
    const midR = 2.5+rng()*5.0;
    target = new THREE.Vector3(
      sphereCenter.x+Math.cos(midA)*midR,
      sphereCenter.y+(rng()-0.5)*7.0,
      sphereCenter.z+Math.sin(midA)*midR
    );
  }
  setLine(floorPt, target, 1);
}

// Fill remainder with architectural wall-to-wall / wall-to-sphere spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.3 ? sphereSurfPt() : (rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt());
  setLine(a, b, 1);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — blood-red #c20018, category-varied opacity
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;

// Category opacity: convergence brightest, lateral softer, radial medium, dendritic subtle
const catOpacity = [0.10, 0.05, 0.07, 0.055];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.2, 1.0 - d*0.045);
  const cat = lineCat[i];
  const baseOp = catOpacity[cat] * distFade;
  // Warm shift near sphere — threads glow warmer as they approach
  const warmShift = d < 4.0 ? 0.015*(1.0-d/4.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR + warmShift) * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.65;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — slow drift inside the web, approaching and receding
const pathLen = 2800;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.12){
    // Begin distant and low, peering through thread thicket
    const lt = t/0.12;
    rH = 10.0 - lt*2.0;
    y = cy - 5.0 + lt*2.0;
  } else if(t < 0.28){
    // Slow approach, rising — sphere emerges through the web
    const lt = (t-0.12)/0.16;
    rH = 8.0 - lt*3.0;
    y = cy - 3.0 + lt*4.5;
  } else if(t < 0.42){
    // Close orbit — intimate distance, level with sphere
    const lt = (t-0.28)/0.14;
    rH = 5.0 + Math.sin(lt*Math.PI)*0.8;
    y = cy + 1.5 + Math.sin(lt*Math.PI*1.5)*1.2;
  } else if(t < 0.55){
    // Drift upward — looking down through the radial spokes
    const lt = (t-0.42)/0.13;
    rH = 5.8 + lt*2.5;
    y = cy + 2.7 + lt*4.0;
  } else if(t < 0.68){
    // High and far — the sphere as a small moon in the web cosmos
    const lt = (t-0.55)/0.13;
    rH = 8.3 - lt*1.5;
    y = cy + 6.7 - lt*4.0;
  } else if(t < 0.82){
    // Descend below sphere — looking up at it through ascending threads
    const lt = (t-0.68)/0.14;
    rH = 6.8 - lt*2.0;
    y = cy + 2.7 - lt*7.0;
  } else if(t < 0.92){
    // Low close approach — near the floor, threads rising around us
    const lt = (t-0.82)/0.10;
    rH = 4.8 + lt*1.5;
    y = cy - 4.3 + lt*3.5;
  } else {
    // Return to start — gentle loop closure
    const lt = (t-0.92)/0.08;
    rH = 6.3 + lt*3.7;
    y = cy - 0.8 - lt*4.2;
  }

  // Gentle lateral drift — not a pure circle
  const driftAmp = 0.12;
  const drift = Math.sin(p*2.5 + 0.7)*driftAmp;
  const angSpeed = 0.55; // slower than parent's 0.68
  const x = cx + Math.sin(p*angSpeed + drift)*rH;
  const z = cz + Math.cos(p*angSpeed + drift)*rH*1.08;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, <0.3% variation
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00004 * Math.max(0, 1.0 - dist/18.0);
    const phase = basePositions[idx]*0.03 + basePositions[idx+1]*0.04 + i*0.0001;
    const breath = Math.sin(elapsed*0.002 + phase)*amp;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.12;
      arr[vi+1] = basePositions[vi+1] + breath*0.08;
      arr[vi+2] = basePositions[vi+2] + breath*0.10;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere luminance pulse — like a slow heartbeat
  sphereMat.emissiveIntensity = 0.55 + Math.sin(elapsed*0.0005)*0.05;
  sphereMat.opacity = 0.3 + Math.sin(elapsed*0.0008)*0.02;

  // Camera dolly
  const speed = 0.00007;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle breathing offset
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00035)*0.08;
  look.y += Math.cos(elapsed*0.00028)*0.15 - 0.2;
  look.z += Math.sin(elapsed*0.0005+0.4)*0.06;
  camera.lookAt(look);

  // Light micro-drift
  warmL.position.x = 5 + Math.sin(elapsed*0.00015)*0.06;
  warmL.position.y = 10 + Math.cos(elapsed*0.00012)*0.05;
  warmL.intensity = 0.03 + Math.sin(elapsed*0.0002)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
