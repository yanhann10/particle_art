<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ysb · pirouette</title>
<!-- MOTION: morph + spin, intensity: playful -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ysb</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── SURPRISE: Each leaf suddenly pirouettes — a full 360° spin — at unpredictable intervals.
   The spin is smooth, balletic, then the leaf returns to its genealogical drift as if nothing happened.
   Like dancers in a line who each break formation for one perfect spin, then rejoin. ── */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

const N_LEAVES = 7;
const PTS_PER_LEAF = 11000;
const N = N_LEAVES * PTS_PER_LEAF;

function leafShape_ancestor(u, v){
  const theta = u * Math.PI * 2;
  const r = 0.8 + 0.3 * v;
  const h = v * 1.8;
  const spiral = theta + h * 3.5;
  return new THREE.Vector3(
    r * Math.cos(spiral),
    h - 0.9,
    r * Math.sin(spiral)
  );
}

function leafShape_parent(u, v){
  const theta = u * Math.PI * 2;
  const r = 1.2 + 0.5 * v;
  const h = v * 2.2;
  const spiral = theta + h * 2.0;
  return new THREE.Vector3(
    r * Math.cos(spiral),
    h - 1.1,
    r * Math.sin(spiral)
  );
}

function leafShape_self(u, v){
  const theta = u * Math.PI * 2;
  const r = 1.6 + 0.8 * v;
  const h = v * 2.6;
  const spiral = theta + h * 0.9;
  const flatness = 0.3 + 0.7 * v;
  return new THREE.Vector3(
    r * Math.cos(spiral) * flatness,
    h - 1.3,
    r * Math.sin(spiral) * flatness
  );
}

const positions = new Float32Array(N * 3);
const leafIds = new Float32Array(N);
const seeds = new Float32Array(N);
const uvs = new Float32Array(N * 2);

let idx = 0;
for (let L = 0; L < N_LEAVES; L++){
  for (let i = 0; i < PTS_PER_LEAF; i++){
    const u = Math.random();
    const v = Math.random();
    const pos = leafShape_ancestor(u, v);
    positions[idx * 3] = pos.x;
    positions[idx * 3 + 1] = pos.y;
    positions[idx * 3 + 2] = pos.z;
    leafIds[idx] = L;
    seeds[idx] = Math.random();
    uvs[idx * 2] = u;
    uvs[idx * 2 + 1] = v;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('leafId', new THREE.BufferAttribute(leafIds, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const leafRotations = [];
const leafOffsets = [];
const leafMorphPhases = [];
const leafPirouetteTriggers = []; // time offset for each leaf's pirouette cycle
for (let L = 0; L < N_LEAVES; L++){
  const angle = (L / N_LEAVES) * Math.PI * 2;
  const radius = 2.5 + (L % 2) * 0.8;
  leafRotations.push(Math.random() * Math.PI * 2);
  leafOffsets.push(new THREE.Vector3(
    Math.cos(angle) * radius,
    (Math.random() - 0.5) * 1.2,
    Math.sin(angle) * radius
  ));
  leafMorphPhases.push(Math.random() * Math.PI * 2);
  leafPirouetteTriggers.push(Math.random() * 8.0); // stagger initial pirouettes
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uLeafRotations: { value: leafRotations },
  uLeafOffsets: { value: leafOffsets.map(v => [v.x, v.y, v.z]).flat() },
  uLeafMorphPhases: { value: leafMorphPhases },
  uPirouetteTriggers: { value: leafPirouetteTriggers },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uLeafRotations[${N_LEAVES}];
    uniform float uLeafOffsets[${N_LEAVES * 3}];
    uniform float uLeafMorphPhases[${N_LEAVES}];
    uniform float uPirouetteTriggers[${N_LEAVES}];
    attribute float leafId;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vPirouetteIntensity;

    vec3 leafShape_ancestor(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 0.8 + 0.3 * v;
      float h = v * 1.8;
      float spiral = theta + h * 3.5;
      return vec3(r * cos(spiral), h - 0.9, r * sin(spiral));
    }

    vec3 leafShape_parent(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 1.2 + 0.5 * v;
      float h = v * 2.2;
      float spiral = theta + h * 2.0;
      return vec3(r * cos(spiral), h - 1.1, r * sin(spiral));
    }

    vec3 leafShape_self(float u, float v){
      float theta = u * 3.14159 * 2.0;
      float r = 1.6 + 0.8 * v;
      float h = v * 2.6;
      float spiral = theta + h * 0.9;
      float flatness = 0.3 + 0.7 * v;
      return vec3(r * cos(spiral) * flatness, h - 1.3, r * sin(spiral) * flatness);
    }

    void main(){
      int L = int(leafId);
      float t = uTime * 0.18 + uLeafMorphPhases[L];
      
      float cycle = mod(t, 6.28318);
      float stage = cycle / 2.09439;
      
      vec3 target;
      if (stage < 1.0){
        target = mix(leafShape_ancestor(uv.x, uv.y), leafShape_parent(uv.x, uv.y), smoothstep(0.0, 1.0, stage));
      } else if (stage < 2.0){
        target = mix(leafShape_parent(uv.x, uv.y), leafShape_self(uv.x, uv.y), smoothstep(0.0, 1.0, stage - 1.0));
      } else {
        target = mix(leafShape_self(uv.x, uv.y), leafShape_ancestor(uv.x, uv.y), smoothstep(0.0, 1.0, stage - 2.0));
      }
      
      float lagFactor = 0.5 + 0.5 * seed;
      float lagPhase = t - lagFactor * 0.8;
      float lagCycle = mod(lagPhase, 6.28318);
      float lagStage = lagCycle / 2.09439;
      
      vec3 laggedTarget;
      if (lagStage < 1.0){
        laggedTarget = mix(leafShape_ancestor(uv.x, uv.y), leafShape_parent(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage));
      } else if (lagStage < 2.0){
        laggedTarget = mix(leafShape_parent(uv.x, uv.y), leafShape_self(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage - 1.0));
      } else {
        laggedTarget = mix(leafShape_self(uv.x, uv.y), leafShape_ancestor(uv.x, uv.y), smoothstep(0.0, 1.0, lagStage - 2.0));
      }
      
      vec3 p = mix(target, laggedTarget, seed * 0.6);
      
      float tremor = seed * 0.04;
      p.x += tremor * sin(uTime * 3.0 + seed * 40.0);
      p.y += tremor * cos(uTime * 2.5 + seed * 35.0);
      p.z += tremor * sin(uTime * 4.0 + seed * 50.0);
      
      /* ── PIROUETTE LOGIC: Each leaf spins 360° every 10 seconds, offset by trigger time ── */
      float pirouetteCycle = 10.0;
      float pirouetteTime = mod(uTime + uPirouetteTriggers[L], pirouetteCycle);
      float pirouetteDuration = 1.2; // spin takes 1.2 seconds
      
      float pirouettePhase = 0.0;
      vPirouetteIntensity = 0.0;
      
      if (pirouetteTime < pirouetteDuration){
        // smooth ease-in-out for the spin
        float progress = pirouetteTime / pirouetteDuration;
        float eased = smoothstep(0.0, 1.0, progress);
        pirouettePhase = eased * 6.28318; // full rotation
        vPirouetteIntensity = sin(progress * 3.14159); // peak at mid-spin
      }
      
      /* apply pirouette rotation around Y axis (vertical ballet spin) */
      float cp = cos(pirouettePhase), sp = sin(pirouettePhase);
      vec3 pSpin = vec3(p.x * cp - p.z * sp, p.y, p.x * sp + p.z * cp);
      
      /* normal rotation */
      float rot = uLeafRotations[L] + uTime * 0.03;
      float cr = cos(rot), sr = sin(rot);
      vec3 pRot = vec3(pSpin.x * cr - pSpin.z * sr, pSpin.y, pSpin.x * sr + pSpin.z * cr);
      
      int offsetIdx = L * 3;
      pRot.x += uLeafOffsets[offsetIdx];
      pRot.y += uLeafOffsets[offsetIdx + 1];
      pRot.z += uLeafOffsets[offsetIdx + 2];
      
      vec3 sepia = vec3(0.70, 0.52, 0.38);
      vec3 rose = vec3(0.82, 0.56, 0.52);
      vec3 ink = vec3(0.20, 0.16, 0.18);
      
      vec3 col;
      if (stage < 1.0){
        col = mix(ink, sepia, smoothstep(0.0, 1.0, stage));
      } else if (stage < 2.0){
        col = mix(sepia, rose, smoothstep(0.0, 1.0, stage - 1.0));
      } else {
        col = mix(rose, ink, smoothstep(0.0, 1.0, stage - 2.0));
      }
      
      /* during pirouette, brighten to rose-gold */
      vec3 pirouetteGold = vec3(0.95, 0.72, 0.60);
      col = mix(col, pirouetteGold, vPirouetteIntensity * 0.5);
      
      float desatLag = seed * 0.3;
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, vec3(lum), desatLag);
      
      float edgeness = smoothstep(0.4, 1.0, uv.y);
      col = mix(col, rose * 1.2, edgeness * 0.2);
      
      vCol = col;
      vAlpha = 0.5 + 0.3 * (1.0 - seed * 0.5);
      
      vec4 mv = modelViewMatrix * vec4(pRot, 1.0);
      float dist = -mv.z;
      float energy = 0.5 + 0.5 * sin(uTime * 0.6 + seed * 6.28);
      gl_PointSize = (1.2 + 0.4 * energy + vPirouetteIntensity * 0.8) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vPirouetteIntensity;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha * (1.0 + vPirouetteIntensity * 0.3);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

scene.fog = new THREE.FogExp2(0x0f0a08, 0.022);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  const orbit = elapsed * 0.08;
  const drift = Math.sin(elapsed * 0.15) * 0.8;
  camera.position.x = 14 * Math.sin(orbit);
  camera.position.z = 14 * Math.cos(orbit);
  camera.position.y = 2 + drift;
  camera.lookAt(0, 0, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
