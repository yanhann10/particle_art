<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4pt · bioluminescence surprise</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading head scan …</div>
<div class="id">4pt</div>
<div class="hint">drag to orbit · scroll to zoom</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080b, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

const N = 60000;
const restPos = new Float32Array(N * 3);
const normals = new Float32Array(N * 3);
const seeds = new Float32Array(N);

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uPulse: { value: -2.0 },
  uPulseActive: { value: 0.0 }
};

const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uReady;
  uniform float uPulse;
  uniform float uPulseActive;
  attribute vec3 rest;
  attribute vec3 norm;
  attribute float seed;
  varying vec3 vCol;
  varying float vAlpha;

  // simple 3d hash for vein pattern
  float hash(vec3 p) {
    p = fract(p * vec3(443.897, 441.423, 437.195));
    p += dot(p, p.yzx + 19.19);
    return fract((p.x + p.y) * p.z);
  }

  float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash(i);
    float b = hash(i + vec3(1,0,0));
    float c = hash(i + vec3(0,1,0));
    float d = hash(i + vec3(1,1,0));
    float e = hash(i + vec3(0,0,1));
    float f2 = hash(i + vec3(1,0,1));
    float g = hash(i + vec3(0,1,1));
    float h = hash(i + vec3(1,1,1));
    float x1 = mix(a, b, f.x);
    float x2 = mix(c, d, f.x);
    float x3 = mix(e, f2, f.x);
    float x4 = mix(g, h, f.x);
    float y1 = mix(x1, x2, f.y);
    float y2 = mix(x3, x4, f.y);
    return mix(y1, y2, f.z);
  }

  // vein pattern: ridged noise
  float veins(vec3 p) {
    float v = 0.0;
    v += abs(noise3(p * 1.8) - 0.5) * 2.0;
    v += abs(noise3(p * 3.6 + 7.0) - 0.5) * 1.0;
    v = 1.0 - v * 0.6;
    return clamp(v, 0.0, 1.0);
  }

  void main(){
    vec3 p = rest;
    vec3 n = norm;
    float t = uTime;

    // reveal spiral
    float th = seed * 6.28;
    vec3 entry = vec3(cos(th) * 12.0, p.y * 0.3, sin(th) * 12.0);
    p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

    // subtle idle shimmer
    float st = t * 0.5 + seed * 6.28;
    p += 0.008 * vec3(sin(st), cos(st * 1.1), sin(st * 0.7));

    // --- BIOLUMINESCENCE PULSE ---
    // wave front sweeps bottom to top of head
    float yNorm = (rest.y + 5.0) / 10.0; // normalized y
    float waveFront = uPulse; // -1 to 2 range, sweeps upward
    float distToWave = yNorm - waveFront;

    // vein channel pattern determines which particles glow
    float veinVal = veins(rest * 0.7);
    float veinMask = smoothstep(0.55, 0.85, veinVal);

    // wave envelope: particles near the front activate
    float waveEnv = exp(-distToWave * distToWave * 18.0) * uPulseActive;
    // trailing glow behind the wave front
    float trailGlow = smoothstep(0.3, 0.0, distToWave) * smoothstep(-1.5, -0.1, distToWave) * uPulseActive;

    float activation = max(waveEnv, trailGlow * 0.6) * veinMask;

    // --- TENDRIL DISPLACEMENT ---
    // particles peel off along normals + curl when activated
    float peelPhase = waveEnv * veinMask;
    // staggered peel: seed modulates timing
    float peelDelay = seed * 0.4;
    float peelAmount = smoothstep(peelDelay, peelDelay + 0.3, peelPhase);

    // tendril direction: mostly normal, with tangential swirl
    vec3 tangent = normalize(cross(n, vec3(0.0, 1.0, 0.1)));
    float swirl = sin(seed * 31.0 + t * 2.0) * 0.5;
    vec3 peelDir = normalize(n + tangent * swirl * 0.6);

    // displacement grows then retracts
    float peelDist = peelAmount * (1.2 + seed * 1.5);
    // add gentle drift at end of tendril
    peelDir += vec3(sin(t * 0.7 + seed * 5.0), cos(t * 0.5 + seed * 3.0), sin(t * 0.9 + seed * 7.0)) * 0.15 * peelAmount;

    p += peelDir * peelDist * uPulseActive;

    // --- SPORE DISSOLVE at wave peak ---
    // some particles drift further and scatter like spores
    float sporeChance = step(0.82, veinVal) * step(0.7, peelPhase);
    float sporeDrift = sporeChance * (2.0 + seed * 3.0) * uPulseActive;
    vec3 sporeDir = normalize(vec3(
      sin(seed * 47.0 + t),
      cos(seed * 23.0 + t * 0.7) * 0.5 + 0.5,
      sin(seed * 67.0 + t * 1.3)
    ));
    p += sporeDir * sporeDrift * smoothstep(0.0, 0.5, peelPhase);

    // --- COLOR ---
    // base: cool stone
    vec3 stone = vec3(0.72, 0.68, 0.66);
    // bioluminescent teal-cyan
    vec3 bioGlow = vec3(0.05, 0.85, 0.72);
    // deep ocean accent for veins
    vec3 deepBlue = vec3(0.02, 0.35, 0.55);

    float k = 0.4 + 0.3 * sin(seed * 9.0);
    vec3 baseCol = mix(stone * 0.9, stone * 0.5, k);

    // glow color follows veins
    vec3 glowCol = mix(deepBlue, bioGlow, veinVal);
    // spore particles get brighter
    glowCol = mix(glowCol, vec3(0.2, 1.0, 0.85), sporeChance * 0.5);

    vCol = mix(baseCol, glowCol, activation);

    // alpha: base particles dimmer, glowing ones bright
    float baseAlpha = 0.35 + 0.15 * sin(st * 0.8);
    float glowAlpha = 0.7 + 0.3 * activation;
    vAlpha = mix(baseAlpha, glowAlpha, activation) * uReady;

    // spore particles flicker
    vAlpha *= 1.0 - sporeChance * 0.3 * sin(t * 8.0 + seed * 50.0) * uPulseActive;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float dist = -mv.z;
    float baseSize = (0.8 + 0.4 * sin(st * 0.8)) * uPixel * (45.0 / dist);
    // glowing particles swell
    float glowSize = baseSize * (1.0 + activation * 1.2);
    // spores get tiny
    glowSize = mix(glowSize, baseSize * 0.5, sporeChance * uPulseActive);
    gl_PointSize = glowSize * (0.4 + 0.6 * uReady);
    gl_Position = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying vec3 vCol;
  varying float vAlpha;
  void main(){
    vec2 d = gl_PointCoord - 0.5;
    float r = dot(d, d);
    if (r > 0.25) discard;
    float a = exp(-r * 16.0) * vAlpha;
    // additive glow
    gl_FragColor = vec4(vCol * a, a);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader, fragmentShader
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

let revealStart = 0;
const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';

const loader = new GLTFLoader();
loader.load(HEAD_URL,
  (gltf) => {
    let target = null;
    gltf.scene.traverse(o => { if (!target && o.isMesh && o.geometry?.attributes?.position) target = o; });
    if (!target) { document.getElementById('loading').textContent = 'no mesh'; return; }
    target.updateMatrixWorld(true);

    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    g.computeVertexNormals();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scl = 8 / maxAxis;
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    sampleMesh.geometry.computeVertexNormals();
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const tmp = new THREE.Vector3();
    const nrm = new THREE.Vector3();
    for (let i = 0; i < N; i++){
      sampler.sample(tmp, nrm);
      restPos[i*3]   = tmp.x;
      restPos[i*3+1] = tmp.y;
      restPos[i*3+2] = tmp.z;
      normals[i*3]   = nrm.x;
      normals[i*3+1] = nrm.y;
      normals[i*3+2] = nrm.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(restPos.slice(), 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('norm',     new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading head scan · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pulse timing: quiet for ~6s after reveal, then pulse every ~9s
// Each pulse lasts ~5s (wave sweeps bottom to top and fades)
const PULSE_INTERVAL = 9.0;
const PULSE_DURATION = 5.0;
const FIRST_PULSE_DELAY = 5.0;
let firstPulseTriggered = false;

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    const revealT = (now - revealStart) / 1000;
    uniforms.uReady.value = Math.min(1.0, revealT / 2.4);

    // pulse logic
    const timeSinceReveal = revealT;
    if (timeSinceReveal > FIRST_PULSE_DELAY) {
      const pulseTime = timeSinceReveal - FIRST_PULSE_DELAY;
      const cyclePos = pulseTime % PULSE_INTERVAL;

      if (cyclePos < PULSE_DURATION) {
        // wave sweeps from -0.3 to 1.3
        const waveProg = cyclePos / PULSE_DURATION;
        uniforms.uPulse.value = -0.3 + waveProg * 1.6;
        // smooth activation envelope
        const attack = smoothstep(0, 0.15, waveProg);
        const release = smoothstep(1.0, 0.7, waveProg);
        uniforms.uPulseActive.value = attack * release;
      } else {
        uniforms.uPulseActive.value = 0.0;
        uniforms.uPulse.value = -2.0;
      }
    }
  }

  // gentle auto-orbit
  points.rotation.y = Math.sin(t * 0.18) * 0.5 + t * 0.04;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

loop();
</script>
</body>
</html>
