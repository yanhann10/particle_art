<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const N = 70000;

// ── Build aPosA: carved face relief ──────────────────────────────────────────
const aPosA = new Float32Array(N * 3);

let idx = 0;

function fillHead(count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const t = Math.random();
    const r = Math.sqrt(t);
    const x = 3.5 * r * Math.cos(angle) + (Math.random() - 0.5) * 0.15;
    const y = 4.2 * r * Math.sin(angle) + (Math.random() - 0.5) * 0.15;
    const rNorm = r;
    const z = 0.5 * (1.0 - rNorm) + (Math.random() - 0.5) * 0.05;
    aPosA[idx * 3]     = x;
    aPosA[idx * 3 + 1] = y;
    aPosA[idx * 3 + 2] = z;
    idx++;
  }
}

function fillEye(cx, cy, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * 0.5;
    const x = cx + r * Math.cos(angle) + (Math.random() - 0.5) * 0.08;
    const y = cy + r * Math.sin(angle) + (Math.random() - 0.5) * 0.08;
    const z = 0.5 + (Math.random() - 0.5) * 0.05;
    aPosA[idx * 3]     = x;
    aPosA[idx * 3 + 1] = y;
    aPosA[idx * 3 + 2] = z;
    idx++;
  }
}

function fillNose(count) {
  for (let i = 0; i < count; i++) {
    const t = Math.random();
    const x = (Math.random() - 0.5) * 0.25;
    const y = -0.6 * t + (Math.random() - 0.5) * 0.1;
    const z = 0.5 + (Math.random() - 0.5) * 0.05;
    aPosA[idx * 3]     = x;
    aPosA[idx * 3 + 1] = y;
    aPosA[idx * 3 + 2] = z;
    idx++;
  }
}

function fillMouth(count) {
  for (let i = 0; i < count; i++) {
    // arc from -1.0 to +1.0 at y=-1.4, radius=1.1
    // center of arc: (0, -1.4 + 1.1) = (0, -0.3) approx
    // angle range: find angles where x in [-1,1], y=-1.4
    // arc center at (0, -0.3), radius 1.1
    // at y=-1.4: sin(a) = (-1.4 - (-0.3))/1.1 = -1.0 → a = -PI/2
    // but we want a slight smile arc: center below mouth
    // simpler: parametric arc
    const arcCenter = [0.0, -0.3];
    const arcR = 1.1;
    const aMin = -Math.PI * 0.8;  // roughly from left to right
    const aMax = -Math.PI * 0.2;
    const angle = aMin + Math.random() * (aMax - aMin);
    const r = arcR + (Math.random() - 0.5) * 0.15;
    const x = arcCenter[0] + r * Math.cos(angle) + (Math.random() - 0.5) * 0.08;
    const y = arcCenter[1] + r * Math.sin(angle) + (Math.random() - 0.5) * 0.08;
    const z = 0.5 + (Math.random() - 0.5) * 0.05;
    aPosA[idx * 3]     = x;
    aPosA[idx * 3 + 1] = y;
    aPosA[idx * 3 + 2] = z;
    idx++;
  }
}

function fillBackground(count) {
  for (let i = 0; i < count; i++) {
    const x = (Math.random() - 0.5) * 12.0;
    const y = (Math.random() - 0.5) * 12.0;
    const z = (Math.random() - 0.5) * 0.1;
    aPosA[idx * 3]     = x;
    aPosA[idx * 3 + 1] = y;
    aPosA[idx * 3 + 2] = z;
    idx++;
  }
}

fillHead(30000);
fillEye(-1.2, 1.2, 8000);
fillEye(1.2, 1.2, 8000);
fillNose(4000);
fillMouth(8000);
fillBackground(N - idx);  // remaining ~12000

// ── Build aPosB: Lorenz butterfly ────────────────────────────────────────────
const aPosB = new Float32Array(N * 3);

{
  let lx = 1, ly = 0, lz = 1;
  const DT = 0.004, S = 10, R = 28, B = 8 / 3;

  // warm-up
  for (let i = 0; i < 5000; i++) {
    const dx = S * (ly - lx), dy = lx * (R - lz) - ly, dz = lx * ly - B * lz;
    lx += dx * DT; ly += dy * DT; lz += dz * DT;
  }

  // collect points — find scale first by sampling
  const pts = new Float32Array(N * 3);
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;
  for (let i = 0; i < N; i++) {
    const dx = S * (ly - lx), dy = lx * (R - lz) - ly, dz = lx * ly - B * lz;
    lx += dx * DT; ly += dy * DT; lz += dz * DT;
    pts[i * 3]     = lx;
    pts[i * 3 + 1] = ly;
    pts[i * 3 + 2] = lz;
    if (lx < minX) minX = lx;
    if (lx > maxX) maxX = lx;
    if (ly < minY) minY = ly;
    if (ly > maxY) maxY = ly;
    if (lz < minZ) minZ = lz;
    if (lz > maxZ) maxZ = lz;
  }

  // scale to ±5 units
  const cxL = (minX + maxX) * 0.5, cyL = (minY + maxY) * 0.5, czL = (minZ + maxZ) * 0.5;
  const scaleX = (maxX - minX) * 0.5;
  const scaleY = (maxY - minY) * 0.5;
  const scaleZ = (maxZ - minZ) * 0.5;
  const maxScale = Math.max(scaleX, scaleY, scaleZ);
  const normalizeScale = 5.0 / maxScale;

  for (let i = 0; i < N; i++) {
    aPosB[i * 3]     = (pts[i * 3]     - cxL) * normalizeScale;
    aPosB[i * 3 + 1] = (pts[i * 3 + 1] - cyL) * normalizeScale;
    aPosB[i * 3 + 2] = (pts[i * 3 + 2] - czL) * normalizeScale * 0.3; // flatten z
  }
}

// ── Per-particle seeds ────────────────────────────────────────────────────────
const aSeed = new Float32Array(N);
for (let i = 0; i < N; i++) aSeed[i] = Math.random();

// ── Three.js setup ────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const FRUSTUM = 14;
const aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  -FRUSTUM * aspect, FRUSTUM * aspect,
  FRUSTUM, -FRUSTUM,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080605, 1);
document.body.appendChild(renderer.domElement);

// ── Geometry ──────────────────────────────────────────────────────────────────
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geo.setAttribute('aPosA', new THREE.BufferAttribute(aPosA, 3));
geo.setAttribute('aPosB', new THREE.BufferAttribute(aPosB, 3));
geo.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));

// ── Shader material ───────────────────────────────────────────────────────────
const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0.0 },
    uPixel:   { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute vec3 aPosA;
    attribute vec3 aPosB;
    attribute float aSeed;

    varying float vBright;
    varying float vPhase;

    void main() {
      float t = mod(uTime, 36.0);
      vec3 p;
      float bright = 1.0;

      if (t < 8.0) {
        // Phase 0: Image A with breathing
        float breathe = 0.03 * sin(uTime * 0.8 + aSeed * 6.2832);
        p = aPosA + vec3(breathe * 0.5, breathe, 0.0);
        float zRaise = clamp(aPosA.z * 2.0, 0.0, 1.0);
        bright = 0.75 + 0.45 * zRaise;
        vPhase = 0.0;

      } else if (t < 14.0) {
        // Phase 1: sand fall
        float fall = (t - 8.0) / 6.0;
        float speed = 0.5 + aSeed * 0.5;
        float yDrop = fall * fall * 13.0 * speed;
        float xDrift = aSeed * 0.4 * fall;
        p = vec3(aPosA.x + xDrift, aPosA.y - yDrop, aPosA.z);
        bright = 0.5 + 0.4 * (1.0 - fall);
        vPhase = 1.0;

      } else if (t < 22.0) {
        // Phase 2: reassemble into B
        float phase = (t - 14.0) / 8.0;
        float ease = phase * phase * (3.0 - 2.0 * phase);
        float speed = 0.5 + aSeed * 0.5;
        float yFallen = aPosA.y - 1.0 * 13.0 * speed;
        vec3 fallen = vec3(aPosA.x + aSeed * 0.4, yFallen, aPosA.z);
        p = mix(fallen, aPosB, ease);
        bright = 0.5 + 0.5 * ease;
        vPhase = 2.0;

      } else if (t < 30.0) {
        // Phase 3: Image B with breathing
        float breathe = 0.03 * sin(uTime * 0.7 + aSeed * 6.2832 + 1.5);
        p = aPosB + vec3(breathe * 0.5, breathe, 0.0);
        float zB = clamp(aPosB.z * 0.3 + 0.5, 0.0, 1.0);
        bright = 0.75 + 0.4 * zB;
        vPhase = 3.0;

      } else {
        // Phase 4: fall from B
        float fall = (t - 30.0) / 6.0;
        float speed = 0.5 + aSeed * 0.5;
        float y = aPosB.y - fall * fall * 10.0 * speed;
        p = vec3(aPosB.x + aSeed * 0.3 * fall, y, aPosB.z);
        bright = 0.5 + 0.4 * (1.0 - fall);
        vPhase = 4.0;
      }

      vBright = bright;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);

      // Fixed absolute pixel sizes — hard discs, no perspective scaling
      float sz = 2.2;
      if (vPhase < 0.5 || (vPhase > 0.5 && vPhase < 1.5)) {
        float zRaise = clamp(aPosA.z * 2.0, 0.0, 1.0);
        sz = 2.0 + 1.0 * zRaise;
      } else if (vPhase > 2.5 && vPhase < 3.5) {
        sz = 2.0;
      }
      gl_PointSize = uPixel * sz;
    }
  `,
  fragmentShader: `
    precision mediump float;
    varying float vBright;
    varying float vPhase;

    void main() {
      // HARD disc — minimal antialiased rim only (0.43..0.45), like ibt
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.45) discard;
      float rim = 1.0 - smoothstep(0.43, 0.45, r);

      vec3 col;
      if (vPhase < 1.5) {
        col = vec3(0.92, 0.84, 0.65) * vBright;
      } else if (vPhase < 2.5) {
        float t = vPhase - 1.0;
        col = mix(vec3(0.92, 0.84, 0.65), vec3(0.82, 0.76, 0.62), t) * vBright;
      } else if (vPhase < 3.5) {
        float blend = vPhase - 2.0;
        col = mix(vec3(0.82, 0.76, 0.62), vec3(0.72, 0.38, 0.30), blend) * vBright;
      } else {
        col = vec3(0.75, 0.42, 0.33) * vBright;
      }

      gl_FragColor = vec4(col, rim);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ── Time tracking ─────────────────────────────────────────────────────────────
let timeOffset = 0;
const clock = new THREE.Clock();

function resetTime() {
  timeOffset = -clock.getElapsedTime();
}

document.addEventListener('click', resetTime);

// ── Animation loop ────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  mat.uniforms.uTime.value = clock.getElapsedTime() + timeOffset;
  renderer.render(scene, camera);
}
animate();

// ── Resize handler ────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const asp = innerWidth / innerHeight;
  camera.left   = -FRUSTUM * asp;
  camera.right  =  FRUSTUM * asp;
  camera.top    =  FRUSTUM;
  camera.bottom = -FRUSTUM;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){var jobId=d.job_id||'';var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){var qs='?a='+pid+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;});
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
