<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3pr · Shiota — Archive of Keys</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">3pr</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0042);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.014));
const key1 = new THREE.PointLight(0x1a0404, 0.016, 42, 2.1);
key1.position.set(-18, 14, 16);
scene.add(key1);

let seed = 482913;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 58, h: 44, d: 52 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// THE SUSPENDED OBJECT — a single key, pale bone-white, slightly scaled up
const keyGeo = new THREE.BoxGeometry(0.6, 4.2, 0.4);
const keyHeadGeo = new THREE.TorusGeometry(0.9, 0.26, 8, 16);
const keyGroup = new THREE.Group();

const keyMat = new THREE.MeshStandardMaterial({
  color: 0xdccfc0,
  emissive: 0xc8b8a6,
  emissiveIntensity: 0.58,
  metalness: 0.12,
  roughness: 0.82
});

const keyShaft = new THREE.Mesh(keyGeo, keyMat);
keyShaft.position.y = -1.4;
keyGroup.add(keyShaft);

const keyHead = new THREE.Mesh(keyHeadGeo, keyMat);
keyHead.rotation.x = Math.PI/2;
keyHead.position.y = 1.2;
keyGroup.add(keyHead);

const keyPos = new THREE.Vector3(2.8, 0, 0);
keyGroup.position.copy(keyPos);
keyGroup.rotation.z = 0.16;
keyGroup.rotation.x = 0.08;
scene.add(keyGroup);

const keyGlow = new THREE.PointLight(0x1a0404, 0.022, 24, 2.3);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// ANCHOR GENERATION — strategic placement for 20k thread budget

const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

// ZONE 1: Tight shell around key — converging threads — 220 anchors
const innerCount = 220;
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 5.4 + rng()*4.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 2: Mid-orbital shell — 280 anchors
const midCount = 280;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i * 1.618;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 12.6 + rng()*7.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 3: Far orbital shell — 180 anchors
const outerCount = 180;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i * 2.414;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 20.4 + rng()*10.6;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 4: Ceiling anchors — irregular grid
for(let i=0; i<=6; i++){
  for(let j=0; j<=6; j++){
    const x = (i/6 - 0.5) * ROOM.w * 0.86 + (rng()-0.5)*3.6;
    const z = (j/6 - 0.5) * ROOM.d * 0.86 + (rng()-0.5)*3.6;
    const y = hh - rng()*1.8;
    anchors.push(new THREE.Vector3(x, y, z));
  }
}

// ZONE 5: Floor anchors — irregular grid
for(let i=0; i<=5; i++){
  for(let j=0; j<=5; j++){
    const x = (i/5 - 0.5) * ROOM.w * 0.82 + (rng()-0.5)*4.2;
    const z = (j/5 - 0.5) * ROOM.d * 0.82 + (rng()-0.5)*4.2;
    const y = -hh + rng()*2.2;
    anchors.push(new THREE.Vector3(x, y, z));
  }
}

// ZONE 6: Wall anchors — each face
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*3.2;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*3.2;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.84, ROOM.d*0.84, 4));
anchors.push(...wallGrid('x', hw, ROOM.h*0.84, ROOM.d*0.84, 4));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.84, ROOM.d*0.84, 4));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.84, ROOM.h*0.84, 4));
anchors.push(...wallGrid('z', hd, ROOM.w*0.84, ROOM.h*0.84, 4));

// ZONE 7: Volume scatter — 160 anchors
for(let i=0; i<160; i++){
  const x = (rng()-0.5)*ROOM.w*0.76;
  const y = (rng()-0.5)*ROOM.h*0.76;
  const z = (rng()-0.5)*ROOM.d*0.76;
  anchors.push(new THREE.Vector3(x, y, z));
}

// THREAD NETWORK — exactly 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Radial convergence to key head/shaft — 9200 threads
const convergeCount = 9200;
for(let i=0; i<convergeCount && li<NUM_LINES-10800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 3.2) continue;
  
  const targetPt = new THREE.Vector3(
    keyPos.x + (rng()-0.5)*1.8,
    keyPos.y + (rng()-0.5)*5.4,
    keyPos.z + (rng()-0.5)*1.2
  );
  
  const dir = targetPt.clone().sub(a).normalize();
  const stopDist = a.distanceTo(targetPt) - (0.4 + rng()*2.2);
  const target = a.clone().add(dir.multiplyScalar(Math.max(stopDist, 0.2)));
  
  setLine(a, target);
}

// CATEGORY B: Vertical suspension threads from ceiling to key — 60 threads
const suspCount = 60;
for(let i=0; i<suspCount && li<NUM_LINES-10740; i++){
  const t = (i/suspCount)*Math.PI*2;
  const rx = 2.4 + rng()*1.8;
  const topPt = new THREE.Vector3(
    keyPos.x + Math.cos(t)*rx,
    keyPos.y + 3.2,
    keyPos.z + Math.sin(t)*rx
  );
  
  const ceilPt = new THREE.Vector3(
    topPt.x + (rng()-0.5)*2.8,
    hh - rng()*1.6,
    topPt.z + (rng()-0.5)*2.8
  );
  
  setLine(topPt, ceilPt);
}

// CATEGORY C: Meridian arcs through key — vertical great circles — 3400 threads
const meridians = 46;
const ptsPerMeridian = 74;
for(let m=0; m<meridians && li<NUM_LINES-7340; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 14.8 + (m%4)*2.6;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-7340; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      keyPos.y + Math.sin(phi0)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      keyPos.y + Math.sin(phi1)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY D: Horizontal latitude rings — 2600 threads
const latitudes = 26;
const ptsPerLat = 100;
for(let l=0; l<latitudes && li<NUM_LINES-4740; l++){
  const phi = -Math.PI/2 + (l/latitudes)*Math.PI;
  const r = 11.8 + (l%5)*2.2;
  const y = keyPos.y + Math.sin(phi)*r;
  const ringR = Math.cos(phi)*r;
  
  for(let i=0; i<ptsPerLat-1 && li<NUM_LINES-4740; i++){
    const t0 = (i/ptsPerLat)*Math.PI*2;
    const t1 = ((i+1)/ptsPerLat)*Math.PI*2;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(t0)*ringR,
      y,
      keyPos.z + Math.sin(t0)*ringR
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(t1)*ringR,
      y,
      keyPos.z + Math.sin(t1)*ringR
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Key radiants — threads extending outward — 1600 threads
const radialCount = 1600;
for(let i=0; i<radialCount && li<NUM_LINES-3140; i++){
  const y = 1 - (i / radialCount) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*3.8, y*3.8, z*3.8).add(keyPos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 5.2 + rng()*14.6;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY F: Wall-to-wall spans — 1200 threads
let wallSpans = 0;
while(wallSpans<1200 && li<NUM_LINES-1940){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>18.0 && d<54.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY G: Horizontal crossing threads — 700 threads
for(let i=0; i<700 && li<NUM_LINES-1240; i++){
  const y = keyPos.y + (rng()-0.5)*26.0;
  const x0 = -hw + rng()*7.2;
  const z0 = (rng()-0.5)*ROOM.d*0.82;
  const x1 = hw - rng()*7.2;
  const z1 = (rng()-0.5)*ROOM.d*0.82;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY H: Vertical threads — 380 threads
for(let i=0; i<380 && li<NUM_LINES-860; i++){
  const x = (rng()-0.5)*ROOM.w*0.80;
  const z = (rng()-0.5)*ROOM.d*0.80;
  const y0 = -hh + rng()*2.8;
  const y1 = hh - rng()*2.8;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY I: Proximity web — local connections — 480 threads
const THRESH = 14.6;
let webCount = 0, attempts = 0;
while(webCount<480 && li<NUM_LINES-380 && attempts<10000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>4.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY J: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.0 && d<32.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.072,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow dolly inside the web, looking at key
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.18 + lt*Math.PI*1.64;
    const r = 28.2 - lt*11.4;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 18.6 - lt*8.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*1.82 + lt*Math.PI*1.88;
    const r = 16.8 + Math.sin(lt*Math.PI*2.2)*4.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 10.4 + Math.cos(lt*Math.PI*1.6)*4.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.76){
    const lt = (t-0.52)/0.24;
    const angle = Math.PI*3.70 + lt*Math.PI*1.52;
    const r = 15.2 + Math.cos(lt*Math.PI)*4.4;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - 2.8 - lt*11.6;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.76)/0.24;
    const angle = Math.PI*5.22 + lt*Math.PI*1.08;
    const r = 13.6 + lt*15.4;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 7.6 + lt*10.8;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.004;
  keyGroup.scale.setScalar(breathScale);
  keyGroup.rotation.y = 0.16 + Math.sin(elapsed*0.00014)*0.008;

  const speed = 0.0000078;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000032)*0.28,
    keyPos.y + Math.cos(elapsed*0.000040)*0.24,
    keyPos.z + Math.sin(elapsed*0.000030)*0.20
  );

  key1.intensity = 0.016 + Math.sin(elapsed*0.000052)*0.008;
  keyGlow.intensity = 0.022 + Math.sin(elapsed*0.000060)*0.007;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
