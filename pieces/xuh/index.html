<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xuh · cypress voronoi shatter</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070a; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">xuh · cypress voronoi shatter</div>
<div class="hint">move mouse · cypress tears along voronoi boundaries</div>
<div class="src">60k particles · site dispersion · fortuin-kasteleyn</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────── scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.020);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ────────────── cypress L-system
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F'         },
    { p: 0.25, s: 'FF[/f]\\F'          },
    { p: 0.20, s: 'F[+f-f][/f\\f]F'    },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]'          },
    { p: 0.4, s: 'f'                   },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let h = new THREE.Vector3(0, 1, 0);
  let l = new THREE.Vector3(-1, 0, 0);
  let u = new THREE.Vector3(0, 0, 1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

const cypressSegs = turtle(expand('F', 6, rng));

// ────────────── build particle cloud
const N = 60000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const voronoiSites = new Float32Array(N * 3); // each particle gets assigned a site

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N * SKELETON_FRAC);
const N_FOLIAGE = N - N_SKEL;

let written = 0;
const v = new THREE.Vector3();

// skeleton particles
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written)
    : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    positions[written*3]   = v.x + (Math.random()-0.5)*jitter;
    positions[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    positions[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    written++;
  }
}

// foliage with ridges + tufts
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8;
  const SPIRAL = 0.9;
  const TUFT_COUNT = 24;
  const tuftYs = [];
  const tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    const yt = (i + 0.5) / TUFT_COUNT;
    tuftYs.push(haloYStart + yt * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }

  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT  = N_FOLIAGE - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random() - 0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    positions[written*3]   = Math.cos(th) * r;
    positions[written*3+1] = y + (Math.random() - 0.5) * 0.05;
    positions[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random();
    written++;
  }

  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t];
    const tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const tuftSize = 0.18;
    const localY = tuftY + (Math.random() - 0.5) * 0.4;
    const localTh = tuftTh + (Math.random() - 0.5) * 0.4;
    const localR = reach + (Math.random() - 0.5) * tuftSize;
    positions[written*3]   = Math.cos(localTh) * localR;
    positions[written*3+1] = localY;
    positions[written*3+2] = Math.sin(localTh) * localR;
    seeds[written] = Math.random();
    written++;
  }
}
while (written < N){
  positions[written*3] = 0; positions[written*3+1] = 0; positions[written*3+2] = 0;
  seeds[written] = Math.random(); written++;
}

function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity;
  let cx = 0, cz = 0;
  for (let i = 0; i < arr.length / 3; i++){
    minY = Math.min(minY, arr[i*3+1]);
    maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= arr.length / 3; cz /= arr.length / 3;
  const h = maxY - minY;
  const s = targetH / h;
  for (let i = 0; i < arr.length / 3; i++){
    arr[i*3]   = (arr[i*3]   - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(positions, 16);

// ────────────── voronoi sites — 180 sites placed along the cypress structure
const SITE_COUNT = 180;
const sites = [];
const siteSeeds = [];

// distribute sites along segments (lengthwise), then assign each particle to nearest site
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (SITE_COUNT - sites.length)
    : Math.max(1, Math.floor(SITE_COUNT * lens[i] / totalLen));
  for (let k = 0; k < share && sites.length < SITE_COUNT; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    // scale to match fitted positions
    let minY = Infinity, maxY = -Infinity;
    for (const s of cypressSegs){ minY = Math.min(minY, s.from.y, s.to.y); maxY = Math.max(maxY, s.from.y, s.to.y); }
    const h = maxY - minY;
    const s = 16 / h;
    v.multiplyScalar(s);
    v.y = (v.y - minY) * s;
    sites.push(v.clone());
    siteSeeds.push(Math.random());
  }
}

// assign each particle to nearest site
for (let i = 0; i < N; i++){
  const px = positions[i*3], py = positions[i*3+1], pz = positions[i*3+2];
  let minD = Infinity, idx = 0;
  for (let j = 0; j < sites.length; j++){
    const dx = px - sites[j].x, dy = py - sites[j].y, dz = pz - sites[j].z;
    const d = dx*dx + dy*dy + dz*dz;
    if (d < minD){ minD = d; idx = j; }
  }
  voronoiSites[i*3]   = sites[idx].x;
  voronoiSites[i*3+1] = sites[idx].y;
  voronoiSites[i*3+2] = sites[idx].z;
}

// ────────────── shader
const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uMouse:   { value: new THREE.Vector2(0, 0) },
  uShatter: { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions.slice(), 3));
geom.setAttribute('restPos',  new THREE.BufferAttribute(positions, 3));
geom.setAttribute('sitePos',  new THREE.BufferAttribute(voronoiSites, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2 uMouse;
    uniform float uShatter;
    attribute vec3 restPos;
    attribute vec3 sitePos;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec3 p = restPos;
      
      // shatter direction: particle moves along vector from site to mouse-influenced point
      vec3 mouseInfluence = vec3(uMouse.x * 12.0, 8.0, uMouse.y * 12.0);
      vec3 shatterDir = normalize(sitePos - mouseInfluence);
      
      // dispersion magnitude grows with distance from mouse-influenced point
      float distToInfluence = distance(sitePos, mouseInfluence);
      float dispersionMag = uShatter * (2.0 + distToInfluence * 0.3) * (0.8 + seed * 0.4);
      
      // each site travels along its unique shatter direction
      p += shatterDir * dispersionMag;
      
      // gentle organic sway persists
      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = 0.04 * (1.0 - uShatter * 0.7) * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      vEnergy = 0.5 + 0.5 * sin(t * 0.8);
      
      // forest greens with height gradient
      vec3 treeA = vec3(0.18, 0.36, 0.20);
      vec3 treeB = vec3(0.55, 0.78, 0.35);
      vec3 treeC = vec3(0.85, 0.92, 0.55);
      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 col = mix(treeA, treeB, hk);
      col = mix(col, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      
      // shattered cells glow warmer
      col = mix(col, vec3(0.88, 0.65, 0.32), uShatter * 0.4);
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + 0.7 * vEnergy) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── interaction
let mouseNormX = 0, mouseNormY = 0;
let targetShatter = 0;
let currentShatter = 0;

addEventListener('mousemove', (e) => {
  mouseNormX = (e.clientX / innerWidth) * 2 - 1;
  mouseNormY = -(e.clientY / innerHeight) * 2 + 1;
  const dx = mouseNormX, dy = mouseNormY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  targetShatter = Math.min(1.0, dist * 1.2);
});

addEventListener('mouseleave', () => {
  targetShatter = 0;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // smooth shatter transition
  currentShatter += (targetShatter - currentShatter) * 0.08;
  uniforms.uShatter.value = currentShatter;
  uniforms.uMouse.value.set(mouseNormX, mouseNormY);
  
  // gentle camera orbit
  const ang = t * 0.04;
  camera.position.x = Math.sin(ang) * 20;
  camera.position.z = Math.cos(ang) * 20;
  camera.lookAt(0, 8, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
