<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9qc · cosmic giggle · vascular tower surprise</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">9qc</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from t9w · vascular tower + cosmic-giggle</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Calder-style surprise: every ~12 seconds the vascular tower briefly
   inflates with a jelly wobble, blushes from arterial red to cosmic
   violet, and exhales a puff of tiny star-sparks from its crown.
   The giggle lasts ~1.5 s then the form self-recovers. ── */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.04);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff0e8, 0.9);
lightKey.position.set(5, 10, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const lightRim = new THREE.DirectionalLight(0x88aacc, 0.4);
lightRim.position.set(-5, 3, -5);
scene.add(lightRim);

// cosmic accent light — only visible during giggle
const cosmicLight = new THREE.PointLight(0x7744cc, 0, 20);
cosmicLight.position.set(0, 10, 0);
scene.add(cosmicLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (inherited from t9w / 5gm)
const MAX_VERTS = 1500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x-cx, oy = verts[i].y-cy, oz = verts[i].z-cz;
    const d = Math.hypot(ox, oy, oz)+1e-6;
    dx[i] += (ox/d)*PRESSURE;
    dy[i] += (oy/d)*PRESSURE*0.4;
    dz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age)*0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── giggle timing (Tinguely-style comic beat)
// Sharp spike every ~12 s, lasting ~1.5 s
function giggle(t){
  const period = 12.0;
  const phase = (t % period) / period;
  // narrow gaussian-ish bump centered at phase=0
  const x = phase < 0.5 ? phase : phase - 1.0; // wrap to [-0.5, 0.5]
  const width = 0.055; // ~1.3 s out of 12 s
  return Math.exp(-(x*x) / (2*width*width));
}

// ─────────── sparkle particles (star-sparks during giggle)
const SPARK_COUNT = 120;
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = new Float32Array(SPARK_COUNT * 3);
const sparkVel = new Float32Array(SPARK_COUNT * 3);
const sparkLife = new Float32Array(SPARK_COUNT);
const sparkAlpha = new Float32Array(SPARK_COUNT);
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('alpha', new THREE.BufferAttribute(sparkAlpha, 1));

const sparkMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uColor: { value: new THREE.Color(0xccaaff) },
    uFogColor: { value: new THREE.Color(0x0a0608) },
    uFogDensity: { value: 0.04 }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      vAlpha = alpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float fogDist = length(mvPos.xyz);
      vFogFactor = 1.0 - exp(-0.04 * 0.04 * fogDist * fogDist);
      gl_Position = projectionMatrix * mvPos;
      gl_PointSize = max(1.0, 4.0 * (8.0 / -mvPos.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform vec3 uFogColor;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float glow = smoothstep(0.5, 0.0, d);
      vec3 col = mix(uColor, uFogColor, vFogFactor);
      gl_FragColor = vec4(col, vAlpha * glow);
    }
  `
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
scene.add(sparkPoints);

let lastGiggle = 0;
function emitSparks(crownY, cx, cz){
  for (let i = 0; i < SPARK_COUNT; i++){
    sparkPos[i*3]   = cx + (Math.random()-0.5)*1.5;
    sparkPos[i*3+1] = crownY + Math.random()*0.5;
    sparkPos[i*3+2] = cz + (Math.random()-0.5)*1.5;
    const speed = 0.03 + Math.random()*0.06;
    const th = Math.random()*Math.PI*2;
    const ph = Math.random()*Math.PI*0.6;
    sparkVel[i*3]   = Math.sin(ph)*Math.cos(th)*speed;
    sparkVel[i*3+1] = Math.cos(ph)*speed + 0.02;
    sparkVel[i*3+2] = Math.sin(ph)*Math.sin(th)*speed;
    sparkLife[i] = 0.6 + Math.random()*0.8;
  }
}

function updateSparks(dt){
  for (let i = 0; i < SPARK_COUNT; i++){
    sparkLife[i] -= dt;
    if (sparkLife[i] <= 0){ sparkAlpha[i] = 0; continue; }
    sparkPos[i*3]   += sparkVel[i*3];
    sparkPos[i*3+1] += sparkVel[i*3+1];
    sparkPos[i*3+2] += sparkVel[i*3+2];
    sparkVel[i*3+1] -= 0.0004; // gravity
    sparkAlpha[i] = Math.min(1, sparkLife[i] * 2.0) * 0.8;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.alpha.needsUpdate = true;
}

// ─────────── vascular tube
let tubeMesh = null;
const colorNormal = new THREE.Color(0xb04438);
const colorCosmic = new THREE.Color(0x7755bb);
const emissiveNormal = new THREE.Color(0x2a0808);
const emissiveCosmic = new THREE.Color(0x1a0833);
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xb04438,
  emissive: 0x2a0808,
  roughness: 0.5,
  metalness: 0.05,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let prevTime = start;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  for (let s = 0; s < 2; s++) step();

  const g_ = giggle(t);
  const isGiggling = g_ > 0.05;

  // color lerp: arterial red → cosmic violet during giggle
  tubeMat.color.copy(colorNormal).lerp(colorCosmic, g_);
  tubeMat.emissive.copy(emissiveNormal).lerp(emissiveCosmic, g_);
  cosmicLight.intensity = g_ * 1.2;

  // spark color shifts warmer at peak
  sparkMat.uniforms.uColor.value.setHex(0xccaaff).lerp(new THREE.Color(0xffeedd), g_ * 0.3);

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    let cxV = 0, czV = 0;
    for (const v of verts){
      if (v.y < yMin) yMin = v.y;
      if (v.y > yMax) yMax = v.y;
      cxV += v.x; czV += v.z;
    }
    cxV /= verts.length; czV /= verts.length;
    const yRange = Math.max(yMax - yMin, 0.1);

    // emit sparks at giggle onset
    if (g_ > 0.3 && (t - lastGiggle) > 8){
      emitSparks(yMax, cxV, czV);
      lastGiggle = t;
    }

    cosmicLight.position.set(cxV, yMax + 2, czV);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(700, verts.length * 2);
    const RADIAL = 8;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    const pulse = 1.0 + 0.10 * Math.sin(t * 1.6);

    // giggle wobble: jelly-like radial distortion
    const giggleInflate = 1.0 + g_ * 0.6; // inflate up to 60%
    const wobbleFreq = 7.0; // fast wobble during giggle
    const wobbleAmp = g_ * 0.25;

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
      let r = 0.40 * (1 - heightFrac * 0.78);
      // vessel nodes
      const node = Math.sin(tt * 22.0) * 0.5 + 0.5;
      r *= (1.0 + 0.18 * Math.pow(node, 6));
      r *= pulse;

      // giggle: inflate + travelling wobble wave
      r *= giggleInflate;
      r *= 1.0 + wobbleAmp * Math.sin(tt * 31.0 + t * wobbleFreq);

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        // additional per-segment wobble during giggle (non-circular cross-section)
        const segWobble = 1.0 + g_ * 0.15 * Math.sin(ang * 3.0 + t * 5.0);
        const rr = r * segWobble;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * rr)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * rr))
          .add(p);
        positions[(i*RADIAL+j)*3]     = v.x;
        positions[(i*RADIAL+j)*3 + 1] = v.y;
        positions[(i*RADIAL+j)*3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i+1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j+1) % RADIAL;
        const a = i*RADIAL+j, b = i*RADIAL+nj;
        const c = ni*RADIAL+j, d = ni*RADIAL+nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(geo, tubeMat);
    scene.add(tubeMesh);
  }

  updateSparks(dt);

  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
