<body>
<div class="id">4b4</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════
   Ayoung Kim — Delivery Dancer's Sphere / speculative AI cartography
   Seoul folds into itself; motorbike-courier paths glow as leaf-trail
   deposits on a wireframe city grid seen from above.
   Palette: chartreuse (#bfff00) + magenta (#ff0066) on slate (#181b22).
   Leaf-as-basic-unit: couriers scatter leaf tokens along their routes.
   ═══════════════════════════════════════════════════════════════════ */

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x181b22, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x181b22, 0.008);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 400);
camera.position.set(0, 62, 35);
camera.lookAt(0, 0, 0);

/* ─── deterministic rand ─── */
let _s = 7919;
function rand(){ _s = (_s * 16807 + 0) % 2147483647; return (_s & 0x7fffffff) / 0x7fffffff; }

/* ─── city graph: warped grid ─── */
const GS = 15, SP = 3.4, HALF = (GS-1)*SP*0.5;
const nodes = [];
const edges = [];

for (let i = 0; i < GS; i++) for (let j = 0; j < GS; j++){
  const bx = i * SP - HALF + (rand()-0.5)*1.5;
  const bz = j * SP - HALF + (rand()-0.5)*1.5;
  const dc = Math.sqrt(bx*bx + bz*bz);
  // taller toward center, some empty lots
  const h = rand() < 0.25 ? 0 :
    (0.3 + rand()*2.8) * Math.max(0.2, 1.0 - dc*0.025);
  nodes.push({ x: bx, z: bz, h });
}

for (let i = 0; i < GS; i++) for (let j = 0; j < GS; j++){
  const idx = i*GS+j;
  if (j < GS-1) edges.push([idx, idx+1]);
  if (i < GS-1) edges.push([idx, idx+GS]);
  if (i < GS-1 && j < GS-1 && rand()<0.12) edges.push([idx, idx+GS+1]);
  if (i < GS-1 && j > 0 && rand()<0.08) edges.push([idx, idx+GS-1]);
}

const adj = nodes.map(() => []);
for (const [a,b] of edges){ adj[a].push(b); adj[b].push(a); }

/* ─── road lines ─── */
const roadPos = [];
for (const [a,b] of edges){
  roadPos.push(nodes[a].x, 0.03, nodes[a].z, nodes[b].x, 0.03, nodes[b].z);
}
const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadPos, 3));
scene.add(new THREE.LineSegments(roadGeo,
  new THREE.LineBasicMaterial({ color: 0x2e3340, transparent: true, opacity: 0.7 })));

/* ─── buildings: leaf-shaped wireframe extrusions ─── */
// Leaf cross-section for building footprint — the leaf is the new pixel
function makeLeafExtrusionGeo(w, d, h){
  const shape = new THREE.Shape();
  const hw = w*0.5, hd = d*0.5;
  shape.moveTo(0, hd);
  shape.quadraticCurveTo(hw*0.9, hd*0.6, hw*0.7, 0);
  shape.quadraticCurveTo(hw*0.9, -hd*0.6, 0, -hd);
  shape.quadraticCurveTo(-hw*0.9, -hd*0.6, -hw*0.7, 0);
  shape.quadraticCurveTo(-hw*0.9, hd*0.6, 0, hd);
  const extGeo = new THREE.ExtrudeGeometry(shape, {
    depth: h, bevelEnabled: false, steps: 1
  });
  return new THREE.EdgesGeometry(extGeo);
}

const bldgMat = new THREE.LineBasicMaterial({ color: 0x4a5568, transparent: true, opacity: 0.45 });
const bldgMatBright = new THREE.LineBasicMaterial({ color: 0x6a7a90, transparent: true, opacity: 0.55 });
for (const n of nodes){
  if (n.h < 0.15) continue;
  const w = 1.0 + rand()*1.4;
  const d = 1.0 + rand()*1.4;
  const geo = makeLeafExtrusionGeo(w, d, n.h);
  const mat = rand() < 0.3 ? bldgMatBright : bldgMat;
  const ls = new THREE.LineSegments(geo, mat);
  ls.rotation.x = -Math.PI/2;
  ls.position.set(n.x, 0, n.z);
  scene.add(ls);
}

/* ─── ground plane ─── */
const gMat = new THREE.MeshBasicMaterial({ color: 0x14171e, side: THREE.DoubleSide });
const gPlane = new THREE.Mesh(new THREE.PlaneGeometry(100,100), gMat);
gPlane.rotation.x = -Math.PI/2; gPlane.position.y = -0.02;
scene.add(gPlane);

/* ─── courier trail system (pooled points with custom shader) ─── */
const NUM_C = 22;
const TMAX = 180;
const TOTAL_T = NUM_C * TMAX;

const tPos = new Float32Array(TOTAL_T * 3);
const tCol = new Float32Array(TOTAL_T * 3);
const tAlp = new Float32Array(TOTAL_T);

const tGeo = new THREE.BufferGeometry();
tGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
tGeo.setAttribute('aColor', new THREE.Float32BufferAttribute(tCol, 3));
tGeo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(tAlp, 1));
tGeo.setDrawRange(0, TOTAL_T);

const trailMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute vec3 aColor;
    attribute float aAlpha;
    varying float vA;
    varying vec3 vC;
    void main(){
      vA = aAlpha; vC = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = mix(1.0, 4.0, aAlpha) * (180.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vA;
    varying vec3 vC;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if(d > 1.0) discard;
      float a = vA * (1.0 - d*d) * 0.85;
      gl_FragColor = vec4(vC, a);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
scene.add(new THREE.Points(tGeo, trailMat));

/* ─── courier dot mesh (instanced) ─── */
const dotGeo = new THREE.SphereGeometry(0.18, 6, 4);
const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const dotMesh = new THREE.InstancedMesh(dotGeo, dotMat, NUM_C);
dotMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(dotMesh);

/* ─── leaf deposit geometry ─── */
const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0.10);
leafShape.quadraticCurveTo(0.055, 0.065, 0.04, 0);
leafShape.quadraticCurveTo(0.02, -0.025, 0, -0.04);
leafShape.quadraticCurveTo(-0.02, -0.025, -0.04, 0);
leafShape.quadraticCurveTo(-0.055, 0.065, 0, 0.10);
const leafGeo = new THREE.ShapeGeometry(leafShape);
leafGeo.rotateX(-Math.PI/2);

const MAX_LEAVES = NUM_C * 50;
const leafMatC = new THREE.MeshBasicMaterial({
  color: 0xbfff00, transparent: true, opacity: 0.3, side: THREE.DoubleSide
});
const leafMatM = new THREE.MeshBasicMaterial({
  color: 0xff0066, transparent: true, opacity: 0.3, side: THREE.DoubleSide
});
const leafMeshC = new THREE.InstancedMesh(leafGeo, leafMatC, MAX_LEAVES);
const leafMeshM = new THREE.InstancedMesh(leafGeo, leafMatM, MAX_LEAVES);
leafMeshC.count = 0; leafMeshM.count = 0;
scene.add(leafMeshC); scene.add(leafMeshM);
let leafCountC = 0, leafCountM = 0;

/* ─── courier state ─── */
const chartreuse = new THREE.Color(0xbfff00);
const magenta = new THREE.Color(0xff0066);

const couriers = [];
for (let i = 0; i < NUM_C; i++){
  const isMag = i % 3 === 0;
  const c = isMag ? magenta.clone() : chartreuse.clone().lerp(magenta, rand()*0.25);
  couriers.push({
    node: Math.floor(rand()*nodes.length),
    target: 0, t: 0,
    speed: 0.006 + rand()*0.014,
    color: c, isMag,
    trail: [], leafTimer: 0,
  });
  couriers[i].target = pickNext(couriers[i].node);
}

function pickNext(n){
  const nb = adj[n];
  return nb.length ? nb[Math.floor(rand()*nb.length)] : n;
}

const _m4 = new THREE.Matrix4();
const _col = new THREE.Color();

function updateCouriers(){
  for (let ci = 0; ci < NUM_C; ci++){
    const c = couriers[ci];
    c.t += c.speed;
    if (c.t >= 1){ c.t = 0; c.node = c.target; c.target = pickNext(c.node); }
    const a = nodes[c.node], b = nodes[c.target];
    const px = a.x + (b.x - a.x)*c.t;
    const pz = a.z + (b.z - a.z)*c.t;

    // Dot instance
    _m4.makeTranslation(px, 0.3, pz);
    dotMesh.setMatrixAt(ci, _m4);
    _col.copy(c.color);
    dotMesh.setColorAt(ci, _col);

    // Trail
    c.trail.push({ x: px, z: pz, age: 1.0 });
    if (c.trail.length > TMAX) c.trail.shift();

    const base = ci * TMAX;
    for (let ti = 0; ti < TMAX; ti++){
      const idx = base + ti;
      if (ti < c.trail.length){
        const p = c.trail[ti];
        p.age = Math.max(0, p.age - 0.0025);
        tPos[idx*3]   = p.x;
        tPos[idx*3+1] = 0.06;
        tPos[idx*3+2] = p.z;
        tCol[idx*3]   = c.color.r;
        tCol[idx*3+1] = c.color.g;
        tCol[idx*3+2] = c.color.b;
        tAlp[idx]     = p.age;
      } else {
        tAlp[idx] = 0;
      }
    }

    // Leaf deposits
    c.leafTimer++;
    if (c.leafTimer > 35){
      c.leafTimer = 0;
      const sc = 0.5 + rand()*1.2;
      _m4.makeRotationY(rand()*Math.PI*2);
      _m4.scale(new THREE.Vector3(sc, sc, sc));
      _m4.setPosition(px + (rand()-0.5)*0.5, 0.02, pz + (rand()-0.5)*0.5);
      if (c.isMag && leafCountM < MAX_LEAVES){
        leafMeshM.setMatrixAt(leafCountM++, _m4);
        leafMeshM.count = leafCountM;
        leafMeshM.instanceMatrix.needsUpdate = true;
      } else if (!c.isMag && leafCountC < MAX_LEAVES){
        leafMeshC.setMatrixAt(leafCountC++, _m4);
        leafMeshC.count = leafCountC;
        leafMeshC.instanceMatrix.needsUpdate = true;
      }
    }
  }
  dotMesh.instanceMatrix.needsUpdate = true;
  if (dotMesh.instanceColor) dotMesh.instanceColor.needsUpdate = true;
  tGeo.attributes.position.needsUpdate = true;
  tGeo.attributes.aColor.needsUpdate = true;
  tGeo.attributes.aAlpha.needsUpdate = true;
}

/* ─── heatmap canvas overlay ─── */
const hCvs = document.createElement('canvas');
hCvs.width = 256; hCvs.height = 256;
const hCtx = hCvs.getContext('2d');
hCtx.fillStyle = '#000'; hCtx.fillRect(0,0,256,256);
const hTex = new THREE.CanvasTexture(hCvs);
const hPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshBasicMaterial({
    map: hTex, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false
  })
);
hPlane.rotation.x = -Math.PI/2; hPlane.position.y = 0.04;
scene.add(hPlane);

let hf = 0;
function updateHeat(){
  if (++hf % 8) return;
  hCtx.fillStyle = 'rgba(0,0,0,0.015)';
  hCtx.fillRect(0,0,256,256);
  for (const c of couriers){
    const tr = c.trail;
    if (!tr.length) continue;
    const p = tr[tr.length-1];
    const u = (p.x + 50)/100*256, v = (p.z + 50)/100*256;
    hCtx.fillStyle = c.isMag ? 'rgba(255,0,102,0.12)' : 'rgba(180,255,0,0.10)';
    hCtx.beginPath(); hCtx.arc(u, v, 5, 0, Math.PI*2); hCtx.fill();
  }
  hTex.needsUpdate = true;
}

/* ─── topographic contour rings on ground ─── */
const topoMat = new THREE.LineBasicMaterial({ color: 0x252a35, transparent: true, opacity: 0.35 });
for (let r = 5; r <= 40; r += 5){
  const pts = [];
  for (let a = 0; a <= 64; a++){
    const th = a/64*Math.PI*2;
    const wobble = 1 + 0.06*Math.sin(th*7 + r*0.3);
    pts.push(new THREE.Vector3(Math.cos(th)*r*wobble, 0.01, Math.sin(th)*r*wobble));
  }
  const lg = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(lg, topoMat));
}

/* ─── lighting ─── */
scene.add(new THREE.AmbientLight(0x303848, 0.6));
const dLight = new THREE.DirectionalLight(0xfff5d0, 0.3);
dLight.position.set(10, 30, 8);
scene.add(dLight);

/* ─── vertical color-temperature gradient (Olafur-style) ─── */
const gradGeo = new THREE.PlaneGeometry(120, 80);
const gradMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 warm = vec3(0.18, 0.12, 0.06);
      vec3 cool = vec3(0.04, 0.07, 0.12);
      vec3 c = mix(cool, warm, vUv.y);
      gl_FragColor = vec4(c, 0.15);
    }`,
  transparent: true, side: THREE.DoubleSide, depthWrite: false,
});
const gradPlane = new THREE.Mesh(gradGeo, gradMat);
gradPlane.position.set(0, 20, -30);
scene.add(gradPlane);

/* ─── film grain overlay (Lia Halloran) ─── */
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float g = hash(vUv * 800.0 + uTime * 3.7) * 0.06;
      gl_FragColor = vec4(vec3(g), g);
    }`,
  transparent: true, depthTest: false, depthWrite: false,
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat);
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
grainScene.add(grainQuad);

/* ─── animation ─── */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Slow overhead orbit — speculative surveillance gaze
  const oR = 52, oSpd = 0.025;
  camera.position.x = Math.sin(t * oSpd) * oR * 0.45;
  camera.position.z = Math.cos(t * oSpd) * oR * 0.45;
  camera.position.y = 55 + Math.sin(t * 0.018) * 4;
  camera.lookAt(0, 0, 0);

  updateCouriers();
  updateHeat();

  grainMat.uniforms.uTime.value = t;

  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
