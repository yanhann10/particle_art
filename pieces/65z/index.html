<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>65z · monument on the infinite plain</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">65z</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// GRANDIOSE: colossal particle monument on infinite plain at sunset, volumetric atmosphere, god rays

const W = 512, H = 512;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: towering column seed — 120 units tall, narrow base
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const r = Math.pow(Math.random(), 1.4) * 18.0;
  const theta = Math.random() * Math.PI * 2.0;
  const y = Math.pow(Math.random(), 0.7) * 120.0;
  init[i*4]   = Math.cos(theta) * r;
  init[i*4+1] = y;
  init[i*4+2] = Math.sin(theta) * r;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation: vertical monument flow with slight swirl
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.016 },
  uTime:  { value: 0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uTime;
    varying vec2 vUv;

    vec3 flowField(vec3 p, float t){
      float height = p.y / 120.0;
      float radial = length(p.xz);
      
      float swirl = sin(height * 3.14159 * 3.0 + t * 0.3) * (1.0 - height);
      float expand = smoothstep(0.0, 0.4, height) * smoothstep(1.0, 0.6, height);
      
      vec3 f;
      f.x = -p.z * swirl * 0.3 + sin(height * 6.28 + t * 0.2) * expand * 2.0;
      f.y = (1.0 - height * height) * 0.8 + sin(p.x * 0.1 + t * 0.15) * 0.3;
      f.z =  p.x * swirl * 0.3 + cos(height * 6.28 + t * 0.2) * expand * 2.0;
      return f * 3.0;
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 vel = flowField(p, uTime);
      p += vel * uDt;

      // hard boundary: keep monument contained
      if (p.y < 0.0) p.y = 120.0;
      if (p.y > 120.0) p.y = 0.0;
      float rad = length(p.xz);
      if (rad > 35.0){
        p.xz *= 35.0 / rad;
      }

      age = mod(age + uDt * 0.015, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 1, 2800);
camera.position.set(0, 35, 280);
camera.lookAt(0, 50, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 },
    uSunDir: { value: new THREE.Vector3(0.6, 0.15, 0.78).normalize() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    uniform vec3 uSunDir;
    attribute vec2 uvIdx;
    varying float vHeight;
    varying float vAge;
    varying float vGodRay;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vHeight = p.y / 120.0;

      // god-ray contribution: alignment with sun vector
      vec3 toSun = normalize(uSunDir);
      vec3 pNorm = normalize(p);
      vGodRay = max(0.0, dot(pNorm, toSun));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + vHeight * 0.8) * uPixel * (140.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vHeight;
    varying float vAge;
    varying float vGodRay;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float core = exp(-r * 10.0);

      // sunset palette: warm amber base, cool violet-blue top, white-hot god-ray
      vec3 base   = vec3(0.95, 0.65, 0.35); // warm amber
      vec3 top    = vec3(0.50, 0.60, 0.78); // cool dusk blue
      vec3 sunlit = vec3(1.00, 0.95, 0.88);

      vec3 col = mix(base, top, smoothstep(0.3, 0.8, vHeight));
      col = mix(col, sunlit, vGodRay * 0.6);

      float a = core * (0.35 + vHeight * 0.3 + vGodRay * 0.25);
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// infinite ground plane: warm terracotta-sand color, fog-occluded at horizon
const groundGeom = new THREE.PlaneGeometry(2500, 2500, 1, 1);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.ShaderMaterial({
  uniforms: {
    uCamPos: { value: camera.position },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec3 vWorld;
    void main(){
      vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uCamPos;
    uniform float uTime;
    varying vec3 vWorld;
    void main(){
      float dist = length(vWorld.xz - uCamPos.xz);
      vec3 ground = vec3(0.55, 0.45, 0.38); // terracotta-sand
      vec3 horizon = vec3(0.62, 0.68, 0.75); // dusk-blue horizon haze
      float fog = smoothstep(300.0, 1200.0, dist);
      vec3 col = mix(ground, horizon, fog);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const groundMesh = new THREE.Mesh(groundGeom, groundMat);
groundMesh.position.y = -0.5;
scene.add(groundMesh);

// volumetric fog layer: horizontal gradient from monument to horizon
const fogGeom = new THREE.PlaneGeometry(2500, 600);
fogGeom.rotateX(-Math.PI / 2);
const fogMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  side: THREE.DoubleSide,
  uniforms: {
    uCamPos: { value: camera.position },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec3 vWorld;
    void main(){
      vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uCamPos;
    uniform float uTime;
    varying vec3 vWorld;
    void main(){
      float dist = length(vWorld.xz - uCamPos.xz);
      float heightFactor = smoothstep(0.0, 60.0, vWorld.y);
      float fog = smoothstep(150.0, 900.0, dist) * (1.0 - heightFactor * 0.7);
      vec3 hazeColor = vec3(0.68, 0.72, 0.78); // atmospheric blue-grey
      gl_FragColor = vec4(hazeColor, fog * 0.35);
    }
  `
});
const fogMesh = new THREE.Mesh(fogGeom, fogMat);
fogMesh.position.y = 25.0;
scene.add(fogMesh);

// god-ray beam: single directional plane cutting through scene
const rayGeom = new THREE.PlaneGeometry(400, 180);
rayGeom.rotateY(Math.PI * 0.25);
const rayMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float beam = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
      beam *= smoothstep(0.0, 0.2, vUv.y) * smoothstep(1.0, 0.6, vUv.y);
      vec3 light = vec3(1.0, 0.92, 0.75);
      gl_FragColor = vec4(light * beam * 0.08, beam * 0.08);
    }
  `
});
const rayMesh = new THREE.Mesh(rayGeom, rayMat);
rayMesh.position.set(-60, 65, 40);
scene.add(rayMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = (now - lastTime) / 1000; lastTime = now;
  const t = now / 1000;

  simUniforms.uTime.value = t;

  simUniforms.prev.value = rtA.texture;
  renderer.setRenderTarget(rtB);
  renderer.render(simScene, camOrtho);
  const tmp = rtA; rtA = rtB; rtB = tmp;
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = t;

  // camera: slow horizontal orbit at ground level (viewer eye height ~35 units), distant
  const ang = t * 0.04;
  const radius = 280;
  camera.position.x = Math.sin(ang) * radius;
  camera.position.y = 35;
  camera.position.z = Math.cos(ang) * radius;
  camera.lookAt(0, 50, 0);

  groundMat.uniforms.uCamPos.value.copy(camera.position);
  groundMat.uniforms.uTime.value = t;
  fogMat.uniforms.uCamPos.value.copy(camera.position);
  fogMat.uniforms.uTime.value = t;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
