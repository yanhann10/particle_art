<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8wq · Riley stripes dissolving into gyroid</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#2a1a08; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:5; color:#2a1a08; }
</style>
</head>
<body>
<div class="id">8wq</div>
<div class="hint">click to regrow · drag to tilt — Riley stripes dissolving into gyroid topology</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: A gyroid minimal surface whose periodic channels are modulated by
// Riley-style planar wave interference — the parent ere's op-art stripe bands
// dissolve into the topology of a triply-periodic minimal surface. The viewer
// sees both: stripe rhythm AND organic coral-bone form, fused.
//
// Technique: SDF isosurface particle distribution — rejection-sample 80k points
// ON the zero-isosurface of a gyroid field, then modulate density/color by
// Riley wave interference so bands of particles read as op-art stripes wrapping
// the minimal surface.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const stripeVal = new Float32Array(N); // Riley stripe phase per particle

let regrowSeed = Math.random() * 1e9;

function buildField(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  // Riley wave parameters — 3 superposed planar waves (inherited from ere)
  const w1 = { dx: Math.cos(rng() * Math.PI * 2), dy: Math.sin(rng() * Math.PI * 2),
               dz: (rng() - 0.5) * 0.6, k: 1.8 + rng() * 1.0, phase: rng() * Math.PI * 2 };
  const w2 = { dx: Math.cos(rng() * Math.PI * 2), dy: Math.sin(rng() * Math.PI * 2),
               dz: (rng() - 0.5) * 0.6, k: 2.4 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w3 = { dx: Math.cos(rng() * Math.PI * 2), dy: Math.sin(rng() * Math.PI * 2),
               dz: (rng() - 0.5) * 0.6, k: 1.1 + rng() * 0.5, phase: rng() * Math.PI * 2 };

  // Gyroid SDF: sin(x)cos(y) + sin(y)cos(z) + sin(z)cos(x) = 0
  // We sample points near the isosurface (|g| < threshold)
  const scale = 1.6; // gyroid spatial frequency
  const R = 3.8;     // bounding sphere radius
  const isoThresh = 0.18; // shell thickness

  let written = 0;
  let attempts = 0;
  while (written < N && attempts < N * 30) {
    attempts++;
    // uniform in sphere
    const u = rng(), v = rng(), w = rng();
    const cosTheta = 2 * u - 1;
    const sinTheta = Math.sqrt(1 - cosTheta * cosTheta);
    const phi = 2 * Math.PI * v;
    const r = R * Math.cbrt(w);
    const x = r * sinTheta * Math.cos(phi);
    const y = r * sinTheta * Math.sin(phi);
    const z = r * cosTheta;

    // gyroid field
    const sx = x * scale, sy = y * scale, sz = z * scale;
    const g = Math.sin(sx) * Math.cos(sy) + Math.sin(sy) * Math.cos(sz) + Math.sin(sz) * Math.cos(sx);

    // Riley wave field — modulates acceptance threshold
    const rv1 = Math.sin(x * w1.dx * w1.k + y * w1.dy * w1.k + z * w1.dz * w1.k + w1.phase);
    const rv2 = Math.sin(x * w2.dx * w2.k + y * w2.dy * w2.k + z * w2.dz * w2.k + w2.phase);
    const rv3 = Math.sin(x * w3.dx * w3.k + y * w3.dy * w3.k + z * w3.dz * w3.k + w3.phase);
    const rileyField = (rv1 + rv2 + rv3) / 3.0; // -1..1

    // Near gyroid isosurface AND Riley stripe positive → accept
    // Riley negative → thin the shell (fewer particles in anti-bands)
    const adaptedThresh = isoThresh * (0.35 + 0.65 * Math.max(0, rileyField * 0.5 + 0.5));
    if (Math.abs(g) > adaptedThresh) continue;

    // radial density falloff (softer edge)
    const rNorm = r / R;
    if (rng() > Math.exp(-rNorm * rNorm * 1.2)) continue;

    positions[written * 3] = x;
    positions[written * 3 + 1] = y;
    positions[written * 3 + 2] = z;
    seeds[written] = rng();
    stripeVal[written] = rileyField * 0.5 + 0.5; // 0..1 normalized stripe phase
    written++;
  }
  for (let i = written; i < N; i++) {
    positions[i * 3] = 0; positions[i * 3 + 1] = -8; positions[i * 3 + 2] = 0;
    seeds[i] = 0; stripeVal[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('stripe', new THREE.BufferAttribute(stripeVal, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    attribute float seed;
    attribute float stripe;
    varying float vDepth;
    varying float vSeed;
    varying float vStripe;
    void main(){
      vec3 p = position;
      // gentle pointer tilt (inherited from ere)
      float tiltX = uPointer.y * 0.18;
      float tiltZ = -uPointer.x * 0.18;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);
      // slow breath — particles pulse along their surface normal direction
      float t = uTime * 0.18 + seed * 6.28;
      float breath = 0.015 * sin(t);
      // approximate outward push (normalize position as proxy for normal)
      float len = length(p);
      vec3 dir = len > 0.01 ? p / len : vec3(0.0, 1.0, 0.0);
      q += dir * breath;
      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      vStripe = stripe;
      gl_PointSize = (1.2 + 0.6 * sin(t * 0.6)) * uPixel * (4.8 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vStripe;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0);
      // palette: bone-coral with Riley stripe banding
      // stripe-bright bands → warm bone; stripe-dark → deep umber
      vec3 bone  = vec3(0.82, 0.74, 0.60);  // light parchment bone
      vec3 coral = vec3(0.55, 0.32, 0.22);  // muted terracotta
      vec3 umber = vec3(0.14, 0.08, 0.05);  // deep shadow
      // stripe modulates between the tones
      float s = smoothstep(0.2, 0.8, vStripe);
      vec3 col = mix(umber, mix(coral, bone, s), 0.4 + 0.6 * s);
      // seed adds subtle variation
      col = mix(col, coral, vSeed * 0.15);
      // depth haze toward parchment background
      float haze = clamp((vDepth - 8.0) / 7.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      gl_FragColor = vec4(col, a * 0.82 * (1.0 - haze * 0.5));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── DUST MOTES (inherited from ere)
const N_DUST = 200;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 14;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── interaction
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.stripe.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  // single slow drift pass — NOT rotation, NOT oscillation
  // camera drifts very gently rightward and slightly up over time, never returning
  camera.position.x = Math.sin(t * 0.012) * 0.5;
  camera.position.y = 0.6 + t * 0.003 % 0.4;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
