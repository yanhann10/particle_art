<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>a7l · the flock that loses one and finds it again (pulled threads)</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      linear-gradient(to bottom,
        #141420 0%,
        #1c1828 22%,

  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em;
          font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.6; font-size:10px; letter-spacing:0.06em;

<body>
<div class="id">a7l</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Mutation of sav: disrupted-grid composition.
// The flock's smooth Reynolds distribution is deliberately broken by
// 3 void zones (spherical repellors where birds refuse to go — like
// pulled threads in a weave) and 1 off-center density attractor that
// clusters birds asymmetrically. The result: the flock has visible
// holes, a dense knot, and a ragged trailing edge. Not random — each
// disruption is placed to create compositional tension.
//
// Background: sav's dawn gradient was too saturated/empty. Now muted
// (#141420→#55422e), with 300 starfield specks and a paper-grain
// noise overlay. The world feels inhabited.
//
// Camera: gentle lateral drift (not orbit) so rotation isn't overused.
// Named ref: Craig Reynolds boids (1987) + Murmuration studies by
// Andrea Cavagna et al. (STARFLAG project, 2010).

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x141420, 0.014);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// ── starfield background (300 dim specks)
const starN = 300;
const starPos = new Float32Array(starN * 3);
for (let i = 0; i < starN; i++){
  starPos[i*3]   = (Math.random()-0.5)*120;
  starPos[i*3+1] = (Math.random()-0.5)*80;
  starPos[i*3+2] = -30 - Math.random()*60;
}
const starGeom = new THREE.BufferGeometry();
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  size: 1.2, color: 0xc8bfb0, transparent: true, opacity: 0.18,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
});
scene.add(new THREE.Points(starGeom, starMat));

// ── paper grain overlay (fullscreen quad with noise)
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  blending: THREE.NormalBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    void main(){
      vec2 uv = gl_FragCoord.xy;
      float n = hash(uv + fract(uTime * 0.7) * 100.0);
      float grain = (n - 0.5) * 0.06;
      gl_FragColor = vec4(vec3(grain + 0.5), 0.035);
    }
  `
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat);
grainScene.add(grainQuad);

// ── disruption zones: 3 voids + 1 density attractor
// Placed asymmetrically — these are the "pulled threads"
const VOIDS = [
  { x: -3.2, y:  1.8, z:  0.5, r: 2.8, force: 0.045 },  // upper-left gap
  { x:  2.5, y: -1.0, z: -1.5, r: 2.2, force: 0.050 },  // lower-right gap
  { x:  0.8, y:  0.3, z:  3.0, r: 1.8, force: 0.040 },  // near-camera gap
];
const ATTRACTOR = { x: -1.5, y: -0.8, z: -2.0, strength: 0.008 }; // density knot

// ── boids with narrative
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]   = Math.cos(th)*Math.cos(ph)*r;
  pos[i*3+1] = Math.sin(ph)*r;
  pos[i*3+2] = Math.sin(th)*Math.cos(ph)*r;
  vel[i*3]   = 0.3 + (Math.random()-0.5)*0.4;
  vel[i*3+1] = (Math.random()-0.5)*0.3;
  vel[i*3+2] = (Math.random()-0.5)*0.4;
}
pos[0] = -1.2; pos[1] = 0.6; pos[2] = 0.0;

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.9;
const W_COH = 0.018, W_ALI = 0.060, W_SEP = 0.080;
const MAX_SPEED = 1.4, MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

// broken-edge zone: birds on the +x, -y quadrant have weaker boundary force
// so the flock frays unevenly on that trailing edge
function boundaryMul(px, py){
  return (px > 2.0 && py < -1.0) ? 0.3 : 1.0;
}

function step(dt){
  let cx=0, cy=0, cz=0;
  for (let i=1; i<N; i++){ cx+=pos[i*3]; cy+=pos[i*3+1]; cz+=pos[i*3+2]; }
  cx/=(N-1); cy/=(N-1); cz/=(N-1);

  const sx=pos[0]-cx, sy=pos[1]-cy, sz=pos[2]-cz;
  const stragDist = Math.sqrt(sx*sx+sy*sy+sz*sz);
  const targetCoh = Math.max(0, Math.min(1, 1-stragDist/8));
  cohesion += (targetCoh-cohesion)*dt*0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';
  arcEl.textContent = `${arcStage} · ${Math.round(cohesion*100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX=0,cohY=0,cohZ=0,cohN=0;
    let aliX=0,aliY=0,aliZ=0,aliN=0;
    let sepX=0,sepY=0,sepZ=0;
    const px=pos[i*3], py=pos[i*3+1], pz=pos[i*3+2];
    const isStrag = (i===STRAGGLER);
    const pR = isStrag ? PERCEPTION_R*0.55 : PERCEPTION_R;

    for (let j=0; j<N; j++){
      if (i===j) continue;
      const dx=pos[j*3]-px, dy=pos[j*3+1]-py, dz=pos[j*3+2]-pz;
      const d2=dx*dx+dy*dy+dz*dz;
      if (d2>pR*pR || d2<1e-6) continue;
      cohX+=pos[j*3]; cohY+=pos[j*3+1]; cohZ+=pos[j*3+2]; cohN++;
      aliX+=vel[j*3]; aliY+=vel[j*3+1]; aliZ+=vel[j*3+2]; aliN++;
      if (d2<SEPARATION_R*SEPARATION_R){
        const inv=1/Math.sqrt(d2);
        sepX-=dx*inv; sepY-=dy*inv; sepZ-=dz*inv;
      }
    }

    // straggler drift
    if (isStrag){
      const drift = Math.sin(performance.now()*0.0003)*0.4;
      acc[i*3] += drift;
      acc[i*3+1] += -0.25 + Math.cos(performance.now()*0.0002)*0.2;
      acc[i*3+2] += drift*0.6;
    }

    // flock seeks straggler during loss/return
    if (!isStrag && (arcStage==='seeking'||arcStage==='return')){
      const tx=pos[0]-px, ty=pos[1]-py, tz=pos[2]-pz;
      const td=Math.sqrt(tx*tx+ty*ty+tz*tz)+1e-3;
      const seek = arcStage==='seeking' ? 0.020 : 0.012;
      acc[i*3]+=tx/td*seek; acc[i*3+1]+=ty/td*seek; acc[i*3+2]+=tz/td*seek;
    }

    if (cohN>0){
      acc[i*3]+=(cohX/cohN-px)*W_COH;
      acc[i*3+1]+=(cohY/cohN-py)*W_COH;
      acc[i*3+2]+=(cohZ/cohN-pz)*W_COH;
    }
    if (aliN>0){
      acc[i*3]+=(aliX/aliN-vel[i*3])*W_ALI;
      acc[i*3+1]+=(aliY/aliN-vel[i*3+1])*W_ALI;
      acc[i*3+2]+=(aliZ/aliN-vel[i*3+2])*W_ALI;
    }
    acc[i*3]+=sepX*W_SEP; acc[i*3+1]+=sepY*W_SEP; acc[i*3+2]+=sepZ*W_SEP;

    // ── DISRUPTION: void zone repulsion (the pulled threads)
    for (const v of VOIDS){
      const vx=px-v.x, vy=py-v.y, vz=pz-v.z;
      const vd=Math.sqrt(vx*vx+vy*vy+vz*vz);
      if (vd < v.r){
        const push = v.force * (1.0 - vd/v.r);
        acc[i*3]   += vx/(vd+0.01)*push;
        acc[i*3+1] += vy/(vd+0.01)*push;
        acc[i*3+2] += vz/(vd+0.01)*push;
      }
    }

    // ── DISRUPTION: density attractor (the knot)
    if (!isStrag){
      const ax=ATTRACTOR.x-px, ay=ATTRACTOR.y-py, az=ATTRACTOR.z-pz;
      const ad=Math.sqrt(ax*ax+ay*ay+az*az)+0.01;
      if (ad < 5.0){
        const pull = ATTRACTOR.strength * (1.0 - ad/5.0);
        acc[i*3]+=ax/ad*pull; acc[i*3+1]+=ay/ad*pull; acc[i*3+2]+=az/ad*pull;
      }
    }

    // world bounds — weakened on trailing edge (+x, -y)
    const d2c=px*px+py*py+pz*pz;
    if (d2c>90){
      const bMul = boundaryMul(px, py);
      const inv=0.012*bMul/Math.sqrt(d2c);
      acc[i*3]-=px*inv; acc[i*3+1]-=py*inv; acc[i*3+2]-=pz*inv;
    }
  }

  const speedMul = (arcStage==='loss'||arcStage==='seeking') ? 0.55
                 : arcStage==='return' ? 0.85 : 1.0;
  for (let i=0; i<N; i++){
    let ax=acc[i*3], ay=acc[i*3+1], az=acc[i*3+2];
    const af=Math.sqrt(ax*ax+ay*ay+az*az);
    if (af>MAX_FORCE){ ax*=MAX_FORCE/af; ay*=MAX_FORCE/af; az*=MAX_FORCE/af; }
    vel[i*3]+=ax; vel[i*3+1]+=ay; vel[i*3+2]+=az;
    let vx=vel[i*3], vy=vel[i*3+1], vz=vel[i*3+2];
    const sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
    if (sp>MAX_SPEED){ vx*=MAX_SPEED/sp; vy*=MAX_SPEED/sp; vz*=MAX_SPEED/sp;
      vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]+=vx*dt*speedMul;
    pos[i*3+1]+=vy*dt*speedMul;
    pos[i*3+2]+=vz*dt*speedMul;
  }
}

// ── render: leaf-shaped point sprites via shader
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i=0; i<N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStragArr = new Float32Array(N);
isStragArr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStragArr, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    varying vec3  vCol;
    varying float vFade;
    varying float vSeed;
    varying float vStrag;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.8 + 0.9 * sin(t);
      float stragSize = strag * 2.8;
      gl_PointSize = (baseSize + stragSize) * uPixel * (18.0 / dist);
      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);
      // muted palette: desaturated compared to parent
      // together: warm umber, not bright amber
      // lost: slate-steel, not vivid blue
      vec3 warm = vec3(0.78, 0.55, 0.34);   // umber
      vec3 hot  = vec3(0.92, 0.82, 0.68);   // parchment
      vec3 cool = vec3(0.38, 0.48, 0.62);   // slate
      vec3 lost = vec3(0.45, 0.32, 0.48);   // muted mauve
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol= mix(lost, hot,  smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag*0.7 + smoothstep(0.6,1.0,sin(t*0.4))*0.18);
      vCol *= (1.0 + strag * 0.5);
      vSeed = seed;
      vStrag = strag;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vFade;
    varying float vSeed;
    varying float vStrag;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      // leaf-shaped mask: elongated along y, pointed tips
      float lx = d.x * 1.8;
      float ly = d.y * 1.0;
      // rotate per-seed for variation
      float ang = vSeed * 3.14159;
      float rx = lx*cos(ang) - ly*sin(ang);
      float ry = lx*sin(ang) + ly*cos(ang);
      float r = rx*rx*2.5 + ry*ry;
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vFade;
      // straggler: slight warm core glow
      vec3 c = vCol;
      if (vStrag > 0.5){
        c += vec3(0.15, 0.08, 0.0) * exp(-r * 8.0);
      }
      gl_FragColor = vec4(c * a * 0.88, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── faint thread lines connecting nearest neighbors in dense zones
// (Chiharu Shiota influence — skeletal web of relation)
const MAX_LINES = 120;
const linePos = new Float32Array(MAX_LINES * 6);
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({
  color: 0x786858, transparent: true, opacity: 0.06,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
});
const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

function updateLines(){
  let li = 0;
  for (let i = 1; i < N && li < MAX_LINES; i += 3){
    let bestD = 999, bestJ = -1;
    const px=pos[i*3], py=pos[i*3+1], pz=pos[i*3+2];
    for (let j = i+1; j < Math.min(i+20, N); j++){
      const dx=pos[j*3]-px, dy=pos[j*3+1]-py, dz=pos[j*3+2]-pz;
      const d2=dx*dx+dy*dy+dz*dz;
      if (d2<bestD && d2>0.01){ bestD=d2; bestJ=j; }
    }
    if (bestJ>=0 && bestD<3.0){
      linePos[li*6]  =px; linePos[li*6+1]=py; linePos[li*6+2]=pz;
      linePos[li*6+3]=pos[bestJ*3]; linePos[li*6+4]=pos[bestJ*3+1]; linePos[li*6+5]=pos[bestJ*3+2];
      li++;
    }
  }
  for (let k=li*6; k<MAX_LINES*6; k++) linePos[k]=0;
  lineGeom.attributes.position.needsUpdate = true;
  lineGeom.setDrawRange(0, li*2);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s=0; s<250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now-lastT)/1000);
  lastT = now;
  uniforms.uTime.value = now/1000;
  uniforms.uCohesion.value = cohesion;
  step(dt);
  geom.attributes.position.needsUpdate = true;
  updateLines();

  // gentle lateral drift (not orbit) — the camera sways like breathing
  const t = now * 0.001;
  const driftX = Math.sin(t * 0.07) * 4.5 + Math.sin(t * 0.03) * 2.0;
  const driftY = 1.2 + Math.cos(t * 0.05) * 1.8;
  const driftZ = 26 + Math.sin(t * 0.04) * 3.0;
  camera.position.set(driftX, driftY, driftZ);

  // camera tracks flock centroid (not fixed origin)
  let tcx=0, tcy=0, tcz=0;
  for (let i=0; i<N; i++){ tcx+=pos[i*3]; tcy+=pos[i*3+1]; tcz+=pos[i*3+2]; }
  camera.lookAt(tcx/N, tcy/N, tcz/N);

  renderer.clear();
  renderer.render(scene, camera);
  // grain overlay
  grainMat.uniforms.uTime.value = t;
  renderer.render(grainScene, grainCam);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
