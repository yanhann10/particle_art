<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6jc · naïveté</title>
<!-- MOTION: drift, intensity: calm -->
<!-- INTENT: the Möbius tree-band from 0z5 exhales — instead of a purposeful traveling eruption wave, particles release in gentle, aimless clusters like a child blowing seeds, drifting upward with wandering sinusoidal paths. The form stays; naïveté is the quality of letting go without knowing why. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">6jc</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system (inherited from x09 → y3k → 5i1 → 0z5) ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const H = new THREE.Vector3(0,1,0);
  const L = new THREE.Vector3(-1,0,0);
  const U = new THREE.Vector3(0,0,1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(0.78, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN);
  const tipFlags = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;

  /* identify tip segments (those whose 'to' endpoint is not the 'from' of any other) */
  const toSet = new Set();
  const fromSet = new Set();
  for (const sg of segments){
    const k = sg.from.x.toFixed(4)+','+sg.from.y.toFixed(4)+','+sg.from.z.toFixed(4);
    fromSet.add(k);
  }
  const tipSegs = new Set();
  for (let i = 0; i < segments.length; i++){
    const k = segments[i].to.x.toFixed(4)+','+segments[i].to.y.toFixed(4)+','+segments[i].to.z.toFixed(4);
    if (!fromSet.has(k)) tipSegs.add(i);
  }

  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    const isTip = tipSegs.has(i) ? 1.0 : 0.0;
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written] = Math.random();
      gens[written]  = segments[i].gen;
      /* tip particles + high-gen particles can drift; weighted by how close to tip */
      tipFlags[written] = isTip * (0.4 + 0.6 * t);
      written++;
    }
  }
  return { positions, seeds, gens, tipFlags };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 4, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uTwist: { value: 0.92 },
  uDrift: { value: 0 },
  uDriftPhase: { value: 0 },
  uYMin:  { value: -7.0 },
  uYMax:  { value: 6.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uTwist;
    uniform float uDrift;
    uniform float uDriftPhase;
    uniform float uYMin;
    uniform float uYMax;
    attribute float seed;
    attribute float gen;
    attribute float tip;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;

      /* minimal tree sway — inherited */
      float sway = 0.02 * gen * (0.5 + 0.5*sin(t * 0.5));
      p.x += sway * sin(t + p.y * 0.3) * (1.0 - uTwist);
      p.z += sway * cos(t * 0.7 + p.y * 0.3) * (1.0 - uTwist);

      /* reveal animation */
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── Möbius transform (inherited from 0z5) ── */
      float yNorm = clamp((p.y - uYMin) / (uYMax - uYMin), 0.0, 1.0);
      float theta = yNorm * 6.2832;
      float s = p.x * 1.4 + p.z * 0.4;
      float R = 5.0;
      float ht = theta * 0.5;

      vec3 mPos;
      mPos.x = (R + s * cos(ht)) * cos(theta);
      mPos.z = (R + s * cos(ht)) * sin(theta);
      mPos.y = s * sin(ht);

      /* ── naïveté drift: tip particles release and wander upward ──
         Unlike 0z5's purposeful traveling wave, this is aimless —
         particles at branch tips slowly detach and float upward
         with gentle sinusoidal wandering, like seeds a child
         blows without knowing where they'll go. */
      float canDrift = tip * step(3.0, gen); /* only tip + high-gen particles */
      float driftAmount = canDrift * uDrift;

      /* each particle gets its own wandering path */
      float wanderPhase = seed * 6.2832 + uDriftPhase * 3.0;
      float wanderX = sin(wanderPhase * 1.3 + seed * 11.0) * 0.8;
      float wanderZ = cos(wanderPhase * 0.9 + seed * 7.0) * 0.6;
      float riseY = uDriftPhase * (2.5 + seed * 3.0); /* slow upward */

      /* gentle spiral as they rise — unhurried, no rush */
      float spiralR = 0.3 * sin(uDriftPhase * 2.0 + seed * 5.0);
      wanderX += spiralR * cos(wanderPhase * 0.4);
      wanderZ += spiralR * sin(wanderPhase * 0.4);

      mPos.x += driftAmount * wanderX;
      mPos.y += driftAmount * riseY;
      mPos.z += driftAmount * wanderZ;

      p = mix(p, mPos, uTwist);

      /* ── palette: ochre/sienna inherited, softened toward bone/parchment ──
         naïveté lightens the palette — not bright, but gentler.
         Drifting particles fade toward warm bone/cream. */
      float energy = 0.5 + 0.5 * sin(t * 0.4);

      /* earth tones: ochre #b8893f, sienna #7a5236, bone #c4b89a, ash #918c80 */
      vec3 ochre  = vec3(0.72, 0.54, 0.28);
      vec3 sienna = vec3(0.48, 0.32, 0.21);
      vec3 bone   = vec3(0.77, 0.72, 0.60);
      vec3 ash    = vec3(0.57, 0.55, 0.50);

      float stripK = yNorm;
      vec3 col = mix(sienna, ochre, stripK);
      col = mix(col, ash, 0.12);

      /* drifting particles lighten toward bone — the innocence of detachment */
      col = mix(col, bone, driftAmount * 0.55);

      /* faint warm shimmer along the band — subtler than parent */
      col += 0.02 * vec3(
        sin(theta * 3.0) * 0.5 + 0.5,
        sin(theta * 3.0 + 1.5) * 0.15,
        0.0
      );

      vCol = mix(vec3(0.42, 0.30, 0.20), col, uTwist);

      /* alpha: drifting particles fade as they rise — letting go */
      float baseAlpha = 0.38 + 0.25 * energy;
      float driftFade = 1.0 - driftAmount * 0.4 * uDriftPhase;
      vAlpha = baseAlpha * max(0.15, driftFade);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* drifting particles shrink gently */
      float sizeShift = 1.0 - driftAmount * 0.2 * uDriftPhase;
      gl_PointSize = (1.0 + 0.4 * energy) * sizeShift * uPixel * (42.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});

let revealStart = 0;
let treeBB = { yMin: -7, yMax: 6 };

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str);
  const bb = new THREE.Box3();
  for (const sg of segs){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segs){
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }
  const bb2 = new THREE.Box3();
  for (const sg of segs){ bb2.expandByPoint(sg.from); bb2.expandByPoint(sg.to); }
  treeBB.yMin = bb2.min.y;
  treeBB.yMax = bb2.max.y;
  uniforms.uYMin.value = treeBB.yMin;
  uniforms.uYMax.value = treeBB.yMax;

  const { positions, seeds, gens, tipFlags } = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('tip',      new THREE.BufferAttribute(tipFlags, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
    geom.attributes.tip.array.set(tipFlags);        geom.attributes.tip.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }

  /* twist: Möbius dominant — same as parent 0z5 */
  const twistBase = 0.90 + 0.08 * Math.cos(elapsed * 0.10);
  const relax = 0.10 * smoothstep(0, 2.5, (elapsed % 28) - 21) *
                       (1 - smoothstep(0, 2.5, (elapsed % 28) - 25));
  uniforms.uTwist.value = Math.max(0.0, twistBase - relax);

  /* ── naïveté drift: replaces 0z5's traveling-wave eruption ──
     Instead of a purposeful wave, tip particles slowly release in
     clusters at irregular intervals — aimless, innocent, unhurried.
     The form stays whole; only the tips exhale.
     Cycle: 40s. Calm 0-22s, drift 22-36s, settle 36-40s. */
  const cycle = 40.0;
  const phase = elapsed % cycle;
  let driftIntensity = 0;
  let driftTravel = 0;

  if (phase >= 22.0 && phase < 36.0) {
    const driftLocal = (phase - 22.0) / 14.0;
    /* very gentle bell — peak lower than 0z5's eruption */
    driftIntensity = Math.sin(driftLocal * Math.PI) * 0.55;
    driftTravel = driftLocal;
  } else if (phase >= 36.0) {
    const settleLocal = (phase - 36.0) / 4.0;
    driftIntensity = Math.max(0, 0.08 * (1.0 - settleLocal));
    driftTravel = 1.0;
  }

  uniforms.uDrift.value = driftIntensity;
  uniforms.uDriftPhase.value = driftTravel;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
