<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d0i · calyx × differential (Riley cup meets fiber-growth)</title>
<!-- MOTION: growth, intensity: gentle -->
<!-- CROSS-POLLINATE: borrowed from '7ea' differential growth — fiber network wraps calyx form -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">d0i</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1612, 0.008);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 24);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

// --- Lighting: warm side-light to reveal cup curvature (Turrell-style) ---
const keyLight = new THREE.DirectionalLight(0xffd4a3, 1.8);
keyLight.position.set(-8, 12, 6);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7799bb, 0.4);
fillLight.position.set(4, -2, -8);
scene.add(fillLight);

const ambientLight = new THREE.AmbientLight(0x3a2f28, 0.35);
scene.add(ambientLight);

// --- Calyx substrate points (Riley interference → cup) ---
const N_SUBSTRATE = 40000;
const substrateGeom = new THREE.BufferGeometry();
const substratePositions = new Float32Array(N_SUBSTRATE * 3);
const substrateNormals = new Float32Array(N_SUBSTRATE * 3);

let seed = Math.floor(Math.random() * 1e9) >>> 0;
function rng() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

const rows = 120, cols = 120;
const width = 24, height = 24;
const cellW = width / cols, cellH = height / rows;
const petals = 5;
const cupDepth = 4.5;
const rowFreq = 1.1, colFreq = 0.95;

let idx = 0;
for (let i = 0; i < rows && idx < N_SUBSTRATE; i++) {
  for (let j = 0; j < cols && idx < N_SUBSTRATE; j++) {
    const pointsPerCell = Math.floor(N_SUBSTRATE / (rows * cols));
    for (let k = 0; k < pointsPerCell && idx < N_SUBSTRATE; k++) {
      const gx = (j + rng() - 0.5) * cellW - width * 0.5;
      const gy = (i + rng() - 0.5) * cellH - height * 0.5;
      
      const r = Math.sqrt(gx * gx + gy * gy);
      const maxR = 12.0;
      const nr = Math.min(r / maxR, 1.0);
      const theta = Math.atan2(gy, gx);
      
      const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
      const cupProfile = cupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      const flare = 1.0 + 0.2 * nr * nr;
      
      const rowWave = Math.sin(gy * rowFreq) * 0.4;
      const colWave = Math.sin(gx * colFreq) * 0.4;
      
      const x = gx * flare + rowWave * 0.3;
      const y = gy * flare + colWave * 0.3;
      const z = cupProfile;
      
      substratePositions[idx * 3] = x;
      substratePositions[idx * 3 + 1] = y;
      substratePositions[idx * 3 + 2] = z;
      
      // Approximate normal via radial gradient
      const nx = -gx * 0.15;
      const ny = -gy * 0.15;
      const nz = 1.0;
      const nlen = Math.sqrt(nx * nx + ny * ny + nz * nz);
      substrateNormals[idx * 3] = nx / nlen;
      substrateNormals[idx * 3 + 1] = ny / nlen;
      substrateNormals[idx * 3 + 2] = nz / nlen;
      idx++;
    }
  }
}

substrateGeom.setAttribute('position', new THREE.BufferAttribute(substratePositions, 3));
substrateGeom.setAttribute('normal', new THREE.BufferAttribute(substrateNormals, 3));

const substrateMat = new THREE.PointsMaterial({
  color: 0x2a2318,
  size: 0.08,
  transparent: true,
  opacity: 0.3,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const substratePoints = new THREE.Points(substrateGeom, substrateMat);
scene.add(substratePoints);

// --- Differential growth fiber network ---
class Node {
  constructor(x, y, z) {
    this.pos = new THREE.Vector3(x, y, z);
    this.vel = new THREE.Vector3();
    this.connections = [];
    this.age = 0;
  }
}

const nodes = [];
const maxNodes = 2500;
const splitThreshold = 0.45;
const repelRadius = 0.8;
const attractRadius = 1.8;
const maxConnections = 6;

// Seed nodes around calyx rim
for (let i = 0; i < 80; i++) {
  const theta = (i / 80) * Math.PI * 2;
  const r = 10 + rng() * 2;
  const x = Math.cos(theta) * r;
  const y = Math.sin(theta) * r;
  const nr = r / 12;
  const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
  const z = cupDepth * nr * nr * (0.6 + 0.4 * petalShape) + rng() * 0.3;
  nodes.push(new Node(x, y, z));
}

// Connect nearby nodes
for (let i = 0; i < nodes.length; i++) {
  for (let j = i + 1; j < nodes.length; j++) {
    const d = nodes[i].pos.distanceTo(nodes[j].pos);
    if (d < attractRadius && nodes[i].connections.length < maxConnections && nodes[j].connections.length < maxConnections) {
      nodes[i].connections.push(nodes[j]);
      nodes[j].connections.push(nodes[i]);
    }
  }
}

function updateNetwork() {
  // Repulsion + attraction forces
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    n.vel.set(0, 0, 0);
    
    // Repel from all nearby nodes
    for (let j = 0; j < nodes.length; j++) {
      if (i === j) continue;
      const other = nodes[j];
      const diff = new THREE.Vector3().subVectors(n.pos, other.pos);
      const d = diff.length();
      if (d < repelRadius && d > 0.01) {
        diff.normalize().multiplyScalar((repelRadius - d) * 0.08);
        n.vel.add(diff);
      }
    }
    
    // Attract to connected neighbors
    for (const neighbor of n.connections) {
      const diff = new THREE.Vector3().subVectors(neighbor.pos, n.pos);
      const d = diff.length();
      if (d > attractRadius) {
        diff.normalize().multiplyScalar((d - attractRadius) * 0.04);
        n.vel.add(diff);
      }
    }
    
    // Slight drift toward calyx surface
    const r2d = Math.sqrt(n.pos.x * n.pos.x + n.pos.y * n.pos.y);
    const theta = Math.atan2(n.pos.y, n.pos.x);
    const nr = Math.min(r2d / 12, 1.0);
    const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
    const targetZ = cupDepth * nr * nr * (0.6 + 0.4 * petalShape);
    n.vel.z += (targetZ - n.pos.z) * 0.02;
  }
  
  // Apply velocity
  for (const n of nodes) {
    n.pos.add(n.vel);
    n.age++;
  }
  
  // Split edges that are too long
  if (nodes.length < maxNodes) {
    const toAdd = [];
    for (const n of nodes) {
      for (let i = n.connections.length - 1; i >= 0; i--) {
        const neighbor = n.connections[i];
        const d = n.pos.distanceTo(neighbor.pos);
        if (d > splitThreshold && nodes.length + toAdd.length < maxNodes) {
          const mid = new THREE.Vector3().addVectors(n.pos, neighbor.pos).multiplyScalar(0.5);
          const newNode = new Node(mid.x, mid.y, mid.z);
          
          // Remove old connection
          n.connections.splice(i, 1);
          const nidx = neighbor.connections.indexOf(n);
          if (nidx >= 0) neighbor.connections.splice(nidx, 1);
          
          // Add new connections
          if (n.connections.length < maxConnections) {
            n.connections.push(newNode);
            newNode.connections.push(n);
          }
          if (neighbor.connections.length < maxConnections) {
            neighbor.connections.push(newNode);
            newNode.connections.push(neighbor);
          }
          
          toAdd.push(newNode);
        }
      }
    }
    nodes.push(...toAdd);
  }
}

// Line segments for fiber network
const fiberGeom = new THREE.BufferGeometry();
const fiberMat = new THREE.LineBasicMaterial({
  color: 0xd4a574,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending
});

const fiberLines = new THREE.LineSegments(fiberGeom, fiberMat);
scene.add(fiberLines);

function updateFiberGeometry() {
  const positions = [];
  for (const n of nodes) {
    for (const neighbor of n.connections) {
      if (nodes.indexOf(neighbor) > nodes.indexOf(n)) {
        positions.push(n.pos.x, n.pos.y, n.pos.z);
        positions.push(neighbor.pos.x, neighbor.pos.y, neighbor.pos.z);
      }
    }
  }
  fiberGeom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
}

updateFiberGeometry();

// --- Camera orbit ---
let orbitTheta = 0.0, orbitPhi = 0.6;
let isDragging = false, prevX = 0, prevY = 0;
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.5, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let frameCount = 0;

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;
  
  // Update fiber network every 3 frames
  if (frameCount % 3 === 0 && t < 120) {
    updateNetwork();
    updateFiberGeometry();
  }
  frameCount++;
  
  // Slow wave motion on substrate (2x speed per directive)
  const wave = t * 1.2;
  for (let i = 0; i < N_SUBSTRATE; i++) {
    const gx = substratePositions[i * 3];
    const gy = substratePositions[i * 3 + 1];
    const rowWave = Math.sin(gy * rowFreq + wave) * 0.4;
    const colWave = Math.sin(gx * colFreq + wave * 0.7) * 0.4;
    
    const r = Math.sqrt(gx * gx + gy * gy);
    const nr = Math.min(r / 12, 1.0);
    const theta = Math.atan2(gy, gx);
    const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
    const cupProfile = cupDepth * nr * nr * (0.6 + 0.4 * petalShape);
    const flare = 1.0 + 0.2 * nr * nr;
    
    substrateGeom.attributes.position.array[i * 3] = gx * flare + rowWave * 0.3;
    substrateGeom.attributes.position.array[i * 3 + 1] = gy * flare + colWave * 0.3;
    substrateGeom.attributes.position.array[i * 3 + 2] = cupProfile;
  }
  substrateGeom.attributes.position.needsUpdate = true;
  
  // Drift keyLight to reveal curvature (per directive)
  keyLight.position.x = -8 + Math.sin(t * 0.15) * 4;
  keyLight.position.z = 6 + Math.cos(t * 0.12) * 3;
  
  // Auto-orbit + manual
  const autoTheta = t * 0.06;
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;
  const radius = 24;
  
  const centroidY = 3 + Math.sin(t * 0.1) * 0.5;
  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    centroidY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, centroidY, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
