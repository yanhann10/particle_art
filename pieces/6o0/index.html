<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>6o0 · harmattan woven</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">6o0</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system (inherited from x09 → y3k → 5i1) ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'             },
    { p: 0.15, s: 'F[/F][\\F]F'            },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'        },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const H = new THREE.Vector3(0,1,0);
  const L = new THREE.Vector3(-1,0,0);
  const U = new THREE.Vector3(0,0,1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(0.78, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return segments;
}

/* ── Build line-segment pairs from L-system paths ── */
function buildLines(segments, targetLines){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b) => a+b, 0);
  if (total === 0) return null;

  /* determine points per segment (proportional to length) */
  const pointCounts = [];
  let totalPts = 0;
  for (let i = 0; i < segments.length; i++){
    const raw = Math.round((targetLines * lens[i]) / total) + 2;
    const k = Math.max(2, Math.min(raw, 600));
    pointCounts.push(k);
    totalPts += k;
  }

  /* total line segments = sum(pointCounts[i] - 1) */
  let totalLineSegs = 0;
  for (const c of pointCounts) totalLineSegs += (c - 1);
  const totalVerts = totalLineSegs * 2;

  const positions = new Float32Array(totalVerts * 3);
  const seeds     = new Float32Array(totalVerts);
  const gens      = new Float32Array(totalVerts);

  let vi = 0;
  const v1 = new THREE.Vector3();
  const v2 = new THREE.Vector3();

  for (let i = 0; i < segments.length; i++){
    const seg = segments[i];
    const K = pointCounts[i];
    const jitter = 0.035 * Math.pow(0.82, seg.gen);

    let prevX, prevY, prevZ, prevSeed;
    for (let k = 0; k < K; k++){
      const t = k / (K - 1);
      v1.lerpVectors(seg.from, seg.to, t);
      v1.x += (Math.random() - 0.5) * jitter;
      v1.y += (Math.random() - 0.5) * jitter;
      v1.z += (Math.random() - 0.5) * jitter;
      const sd = Math.random();

      if (k > 0){
        positions[vi*3]   = prevX;
        positions[vi*3+1] = prevY;
        positions[vi*3+2] = prevZ;
        seeds[vi] = prevSeed;
        gens[vi]  = seg.gen;
        vi++;

        positions[vi*3]   = v1.x;
        positions[vi*3+1] = v1.y;
        positions[vi*3+2] = v1.z;
        seeds[vi] = sd;
        gens[vi]  = seg.gen;
        vi++;
      }

      prevX = v1.x; prevY = v1.y; prevZ = v1.z;
      prevSeed = sd;
    }
  }

  return {
    positions: positions.subarray(0, vi*3),
    seeds:     seeds.subarray(0, vi),
    gens:      gens.subarray(0, vi),
    vertCount: vi
  };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 5, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const TARGET_LINES = 60000;
let geom, linesMesh;

const uniforms = {
  uTime:  { value: 0 },
  uReady: { value: 0 },
  uTwist: { value: 0.92 },
  uGust:  { value: 0 },
  uYMin:  { value: -7.0 },
  uYMax:  { value: 6.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uReady;
    uniform float uTwist;
    uniform float uGust;
    uniform float uYMin;
    uniform float uYMax;
    attribute float seed;
    attribute float gen;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;

      /* minimal tree sway */
      float sway = 0.03 * gen * (0.5 + 0.5*sin(t * 0.7));
      p.x += sway * sin(t + p.y * 0.3) * (1.0 - uTwist);
      p.z += sway * cos(t * 0.9 + p.y * 0.3) * (1.0 - uTwist);

      /* reveal animation */
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── Möbius transform ── */
      float yNorm = clamp((p.y - uYMin) / (uYMax - uYMin), 0.0, 1.0);
      float theta = yNorm * 6.2832;
      float s = p.x * 1.4 + p.z * 0.4;
      float R = 5.0;
      float ht = theta * 0.5;

      vec3 mPos;
      mPos.x = (R + s * cos(ht)) * cos(theta);
      mPos.z = (R + s * cos(ht)) * sin(theta);
      mPos.y = s * sin(ht);

      /* slow rotation */
      float rot = uTwist * uTime * 0.12;
      float cr = cos(rot), sr = sin(rot);
      vec3 mRot = vec3(mPos.x*cr - mPos.z*sr, mPos.y, mPos.x*sr + mPos.z*cr);

      /* ── harmattan wind erosion ── */
      float edgeDist = abs(s) / (abs(s) + 0.8);
      float gustPhase = uTime * 0.35 + seed * 6.28;
      float localGust = uGust * (0.5 + 0.5 * sin(gustPhase * 0.6 + theta * 2.0));

      vec3 windDir = normalize(vec3(0.75, 0.18, 0.55));

      float surfaceShift = localGust * 0.4 * (0.2 + 0.8 * edgeDist);
      mRot += windDir * surfaceShift;

      float detach = smoothstep(0.5, 0.9, edgeDist) * smoothstep(0.4, 0.85, seed);
      float peel = detach * uGust * 2.8;
      mRot += windDir * peel;
      mRot.y -= peel * 0.35;

      float tremor = edgeDist * localGust * 0.18;
      mRot.x += tremor * sin(uTime * 9.0 + seed * 40.0);
      mRot.z += tremor * cos(uTime * 7.5 + seed * 35.0);

      p = mix(p, mRot, uTwist);

      /* ── palette: El Anatsui — ochre metal, desiccated warmth ── */
      float energy = 0.5 + 0.5 * sin(t * 0.5);

      vec3 ochre  = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 dust   = vec3(0.92, 0.84, 0.66);
      vec3 copper = vec3(0.72, 0.45, 0.28);

      float stripK = yNorm;
      vec3 warmCol = mix(sienna, ochre, stripK);
      warmCol = mix(warmCol, copper, edgeDist * 0.4);
      warmCol = mix(warmCol, dust, detach * uGust * 0.8);
      warmCol += 0.04 * vec3(
        sin(theta * 3.0) * 0.5 + 0.5,
        sin(theta * 3.0 + 1.5) * 0.3,
        0.0
      );

      vec3 silver = vec3(0.65, 0.72, 0.88);
      float silverBleed = (1.0 - uGust) * 0.15;
      warmCol = mix(warmCol, silver, silverBleed * (1.0 - edgeDist));

      vCol = mix(vec3(0.45, 0.30, 0.20), warmCol, uTwist);

      /* line alpha: base range 0.08–0.16, generation-dependent */
      float baseAlpha = 0.14 - gen * 0.012;
      baseAlpha = clamp(baseAlpha, 0.08, 0.16);
      vAlpha = baseAlpha * (0.7 + 0.3 * energy) * (1.0 - detach * uGust * 0.5);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      gl_FragColor = vec4(vCol * vAlpha, vAlpha);
    }
  `
});

let revealStart = 0;
let treeBB = { yMin: -7, yMax: 6 };

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str);
  const bb = new THREE.Box3();
  for (const sg of segs){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segs){
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }
  const bb2 = new THREE.Box3();
  for (const sg of segs){ bb2.expandByPoint(sg.from); bb2.expandByPoint(sg.to); }
  treeBB.yMin = bb2.min.y;
  treeBB.yMax = bb2.max.y;
  uniforms.uYMin.value = treeBB.yMin;
  uniforms.uYMax.value = treeBB.yMax;

  const lineData = buildLines(segs, TARGET_LINES);
  if (!lineData) return;

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lineData.positions), 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(new Float32Array(lineData.seeds), 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(new Float32Array(lineData.gens), 1));
    linesMesh = new THREE.LineSegments(geom, mat);
    scene.add(linesMesh);
  } else {
    /* reallocate if vertex count changed */
    if (geom.attributes.position.count !== lineData.vertCount){
      geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(lineData.positions), 3));
      geom.setAttribute('seed',     new THREE.BufferAttribute(new Float32Array(lineData.seeds), 1));
      geom.setAttribute('gen',      new THREE.BufferAttribute(new Float32Array(lineData.gens), 1));
    } else {
      geom.attributes.position.array.set(lineData.positions);
      geom.attributes.position.needsUpdate = true;
      geom.attributes.seed.array.set(lineData.seeds);
      geom.attributes.seed.needsUpdate = true;
      geom.attributes.gen.array.set(lineData.gens);
      geom.attributes.gen.needsUpdate = true;
    }
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstepJS(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const orbitTarget = new THREE.Vector3(0, 0, 0);
const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }

  /* twist breathing */
  const twistBase = 0.90 + 0.08 * Math.cos(elapsed * 0.13);
  const relax = 0.12 * smoothstepJS(0, 2, (elapsed % 24) - 18) *
                       (1 - smoothstepJS(0, 2, (elapsed % 24) - 22));
  uniforms.uTwist.value = Math.max(0.0, twistBase - relax);

  /* harmattan gusts */
  const gustSlow = Math.pow(Math.sin(elapsed * 0.22) * 0.5 + 0.5, 1.8);
  const gustMed  = 0.18 * Math.sin(elapsed * 0.73 + 1.0);
  const gustFast = 0.08 * Math.sin(elapsed * 1.9 + 2.5);
  uniforms.uGust.value = Math.max(0, Math.min(1, gustSlow + gustMed + gustFast));

  /* camera drifts with gusts */
  const gust = uniforms.uGust.value;
  orbitTarget.x = gust * 0.6;
  orbitTarget.y = gust * -0.2;
  controls.target.lerp(orbitTarget, 0.03);
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
