<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6yq · spider web scan · Saraceno cosmic filament</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">6yq</div>
<div class="hint">drag to orbit · scroll to dolly · click to pause</div>
<div class="src">Tomás Saraceno · 3D spider-web scan · TBA21 2018 · sparse filament architecture</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Tomás Saraceno spider-web scan — sparse luminous filaments in pitch black.
// Replicate the visual signature of his 3D laser-scanned arachnid architecture:
// irregular knot clusters connected by long thin strands, pearlescent thread on
// cosmic black. Generate 3D Delaunay-like sparse graph with spring + wind breath.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.008);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.maxDistance = 100;
controls.minDistance = 5;

// ─────────── Anchor nodes: sparse 3D distribution with clustering tendency
const NUM_ANCHORS = 280;
const anchors = [];
const VOLUME_R = 18;

// Seed 4 cluster centers
const clusterCenters = [
  { x: -8, y: 6, z: 2 },
  { x: 7, y: -4, z: -5 },
  { x: -3, y: 8, z: 8 },
  { x: 5, y: -7, z: -8 }
];

for (let i = 0; i < NUM_ANCHORS; i++){
  let x, y, z;
  if (Math.random() < 0.6){
    // cluster around a center
    const c = clusterCenters[Math.floor(Math.random() * clusterCenters.length)];
    const r = Math.pow(Math.random(), 1.5) * 4.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    x = c.x + r * Math.sin(phi) * Math.cos(theta);
    y = c.y + r * Math.sin(phi) * Math.sin(theta);
    z = c.z + r * Math.cos(phi);
  } else {
    // sparse outliers
    const r = Math.pow(Math.random(), 0.7) * VOLUME_R;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    x = r * Math.sin(phi) * Math.cos(theta);
    y = r * Math.sin(phi) * Math.sin(theta);
    z = r * Math.cos(phi);
  }
  anchors.push({
    pos: new THREE.Vector3(x, y, z),
    vel: new THREE.Vector3(0, 0, 0),
    restPos: new THREE.Vector3(x, y, z)
  });
}

// ─────────── Connectivity: sparse graph — nearest neighbors + long-range guy-lines
const edges = [];
const K_NEAREST = 3; // each node connects to 2–4 nearest
const LONG_RANGE_PROB = 0.15; // 15% chance of a long bridge
const MAX_EDGE_LEN = 12;

for (let i = 0; i < anchors.length; i++){
  const a = anchors[i];
  const dists = [];
  for (let j = 0; j < anchors.length; j++){
    if (i === j) continue;
    const d = a.pos.distanceTo(anchors[j].pos);
    if (d < MAX_EDGE_LEN) dists.push({ idx: j, d });
  }
  dists.sort((x, y) => x.d - y.d);
  const numConnect = 2 + Math.floor(Math.random() * 3); // 2–4
  for (let k = 0; k < Math.min(numConnect, dists.length); k++){
    const j = dists[k].idx;
    if (!edges.some(e => (e.a === i && e.b === j) || (e.a === j && e.b === i))){
      edges.push({ a: i, b: j });
    }
  }
  // long-range guy-line
  if (Math.random() < LONG_RANGE_PROB && dists.length > K_NEAREST + 10){
    const farIdx = dists[Math.floor(K_NEAREST + Math.random() * (dists.length - K_NEAREST))].idx;
    if (!edges.some(e => (e.a === i && e.b === farIdx) || (e.a === farIdx && e.b === i))){
      edges.push({ a: i, b: farIdx });
    }
  }
}

// ─────────── Render edges as thin pearlescent lines (additive blend)
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0xc4d4e8,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const edgeGeometry = new THREE.BufferGeometry();
const edgePositions = new Float32Array(edges.length * 6);
edgeGeometry.setAttribute('position', new THREE.BufferAttribute(edgePositions, 3));
const edgeLines = new THREE.LineSegments(edgeGeometry, edgeMaterial);
scene.add(edgeLines);

// ─────────── Render anchor nodes as tiny sprites
const nodeMaterial = new THREE.SpriteMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const nodeSprites = [];
for (const anch of anchors){
  const sprite = new THREE.Sprite(nodeMaterial.clone());
  sprite.scale.set(0.12, 0.12, 1);
  sprite.material.opacity = 0.7 + Math.random() * 0.3; // slight variation
  sprite.position.copy(anch.pos);
  scene.add(sprite);
  nodeSprites.push(sprite);
}

// ─────────── Spring + wind dynamics for breathing web
const SPRING_K = 0.012;
const DAMPING = 0.94;
const WIND_STRENGTH = 0.002;

function updateAnchors(t){
  // soft wind field
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i];
    const windX = Math.sin(a.restPos.x * 0.3 + t * 0.4) * WIND_STRENGTH;
    const windY = Math.cos(a.restPos.y * 0.25 + t * 0.35) * WIND_STRENGTH;
    const windZ = Math.sin(a.restPos.z * 0.28 + t * 0.38) * WIND_STRENGTH;
    
    // spring to rest position
    const dx = a.restPos.x - a.pos.x;
    const dy = a.restPos.y - a.pos.y;
    const dz = a.restPos.z - a.pos.z;
    
    a.vel.x += dx * SPRING_K + windX;
    a.vel.y += dy * SPRING_K + windY;
    a.vel.z += dz * SPRING_K + windZ;
    
    a.vel.multiplyScalar(DAMPING);
    a.pos.add(a.vel);
    
    nodeSprites[i].position.copy(a.pos);
  }
  
  // update edge positions
  for (let i = 0; i < edges.length; i++){
    const e = edges[i];
    const pa = anchors[e.a].pos;
    const pb = anchors[e.b].pos;
    edgePositions[i*6]   = pa.x;
    edgePositions[i*6+1] = pa.y;
    edgePositions[i*6+2] = pa.z;
    edgePositions[i*6+3] = pb.x;
    edgePositions[i*6+4] = pb.y;
    edgePositions[i*6+5] = pb.z;
  }
  edgeGeometry.attributes.position.needsUpdate = true;
}

// ─────────── Stereoscopic camera dolly path (slow walk-through)
const DOLLY_SPEED = 0.08;
const DOLLY_RADIUS = 22;

let paused = false;
addEventListener('click', () => { paused = !paused; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  if (!paused){
    updateAnchors(t);
    
    // slow camera orbit
    const angle = t * DOLLY_SPEED;
    camera.position.x = DOLLY_RADIUS * Math.cos(angle);
    camera.position.z = DOLLY_RADIUS * Math.sin(angle);
    camera.position.y = 4 * Math.sin(t * 0.04);
  }
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
