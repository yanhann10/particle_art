<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: emergence, intensity: gentle -->
<title>88o · arabesque luminous trails · attractor glow on growth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060e; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">88o</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
/*  Cross-pollination: zs4 (Lorenz attractor) visual language →
    ajo (differential-growth arabesque ribbon).
    Borrowed from zs4: luminous point-trail rendering, additive blending,
    deep-space blue → cyan → ember palette, particle glow shader.
    Kept from ajo: differential growth tower form, arabesque width oscillation.
    The ribbon becomes a river of bioluminescent particles —
    a Lorenz trajectory that grew architecture.                              */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

/* ── differential growth (from ajo / 5gm) ── */
const MAX_VERTS = 1400;
const ATTRACT = 0.06, REPEL_R = 0.55, REPEL_STR = 0.14;
const NOISE = 0.003, PRESSURE = 0.003, RISE = 0.0045, MAX_D = 0.42;
const CELL = REPEL_R;

const verts = [];
for (let i = 0; i < 14; i++) {
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const grid = new Map();
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const k = Math.floor(v.x / CELL) + ',' + Math.floor(v.y / CELL) + ',' + Math.floor(v.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v) {
  const cx = Math.floor(v.x / CELL), cy = Math.floor(v.y / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const fx = new Float32Array(n), fy = new Float32Array(n), fz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of neighbors(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      fx[i] += ex * f; fy[i] += ey * f; fz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    fx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    fy[i] += (a.y + b.y - 2 * v.y) * ATTRACT;
    fz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    fx[i] += (ox / d) * PRESSURE;
    fy[i] += (oy / d) * PRESSURE * 0.4;
    fz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += fx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += fy[i] + (Math.random() - 0.5) * NOISE * 0.5 + upward;
    verts[i].z += fz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 - 0.05, z: (a.z + b.z) * 0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 1200; s++) step();
addEventListener('click', () => { paused = !paused; });

/* ── Lorenz-style luminous particle renderer ──
   Pre-generate parametric offsets so particles are persistent (no flicker).
   Each particle lives at (curveT, lateralOffset, binormalOffset).          */

const N_PARTICLES = 16000;
const pCurveT   = new Float32Array(N_PARTICLES);
const pLatOff   = new Float32Array(N_PARTICLES);
const pBinOff   = new Float32Array(N_PARTICLES);
const pPhase    = new Float32Array(N_PARTICLES);  // shimmer phase

for (let i = 0; i < N_PARTICLES; i++) {
  pCurveT[i]  = Math.random();
  // Gaussian-ish lateral spread: sum of 2 randoms centered at 0
  pLatOff[i]  = (Math.random() + Math.random() - 1.0);
  pBinOff[i]  = (Math.random() - 0.5) * 0.3;
  pPhase[i]   = Math.random() * Math.PI * 2;
}

const particleGeo = new THREE.BufferGeometry();
const pPos   = new Float32Array(N_PARTICLES * 3);
const pColor = new Float32Array(N_PARTICLES * 3);
const pAlpha = new Float32Array(N_PARTICLES);
const pSize  = new Float32Array(N_PARTICLES);
particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
particleGeo.setAttribute('aColor',   new THREE.BufferAttribute(pColor, 3));
particleGeo.setAttribute('aAlpha',   new THREE.BufferAttribute(pAlpha, 1));
particleGeo.setAttribute('aSize',    new THREE.BufferAttribute(pSize, 1));

const particleMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute vec3 aColor;
    attribute float aAlpha;
    attribute float aSize;
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      vAlpha = aAlpha;
      vCol   = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (280.0 / -mv.z);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float glow = exp(-d * d * 2.8);
      gl_FragColor = vec4(vCol, vAlpha * glow);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const particleMesh = new THREE.Points(particleGeo, particleMat);
scene.add(particleMesh);

/* ── spine line (thin Lorenz-style trajectory trace) ── */
const MAX_LINE = 2400;
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(MAX_LINE * 3);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
const lineMat = new THREE.LineBasicMaterial({
  color: 0x48c9b0, transparent: true, opacity: 0.18,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const spineL = new THREE.LineLoop(lineGeo, lineMat);
scene.add(spineL);

/* ── ambient dust field ── */
const DUST = 350;
const dustG = new THREE.BufferGeometry();
const dustP = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) {
  dustP[i * 3]     = (Math.random() - 0.5) * 50;
  dustP[i * 3 + 1] = Math.random() * 28;
  dustP[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
dustG.setAttribute('position', new THREE.BufferAttribute(dustP, 3));
scene.add(new THREE.Points(dustG, new THREE.PointsMaterial({
  size: 0.06, color: 0x3a5a7a, transparent: true, opacity: 0.22,
  blending: THREE.AdditiveBlending, depthWrite: false
})));

/* ── hand-picked palette (5 colors, justified) ──
   #0f2b42  deep abyssal blue   — the void the form rises from
   #1a6e8e  twilight teal        — mid-depth oceanic register
   #48c9b0  bioluminescent cyan  — the attractor's bright trajectory
   #f0e2c8  warm bone            — upper reaches catching warm light
   #d4842a  ember amber          — hottest growth tips, Lorenz peak energy */

const PAL = [
  [0.059, 0.169, 0.259],   // deep abyssal
  [0.102, 0.431, 0.557],   // twilight teal
  [0.282, 0.788, 0.690],   // bioluminescent cyan
  [0.941, 0.886, 0.784],   // warm bone
  [0.831, 0.518, 0.165],   // ember amber
];

function lerpPal(t) {
  const idx = t * (PAL.length - 1);
  const lo = Math.floor(idx), hi = Math.min(lo + 1, PAL.length - 1);
  const f = idx - lo;
  return [
    PAL[lo][0] + (PAL[hi][0] - PAL[lo][0]) * f,
    PAL[lo][1] + (PAL[hi][1] - PAL[lo][1]) * f,
    PAL[lo][2] + (PAL[hi][2] - PAL[lo][2]) * f,
  ];
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const up  = new THREE.Vector3(0, 1, 0);
const tmp = new THREE.Vector3();
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 4; s++) step();

  if (verts.length < 10) { requestAnimationFrame(loop); return; }

  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);

  /* spine line */
  const nLine = Math.min(MAX_LINE, verts.length * 2);
  for (let i = 0; i < nLine; i++) {
    const tt = i / nLine;
    const p = curve.getPointAt(tt);
    linePos[i * 3] = p.x; linePos[i * 3 + 1] = p.y; linePos[i * 3 + 2] = p.z;
  }
  lineGeo.setDrawRange(0, nLine);
  lineGeo.attributes.position.needsUpdate = true;

  /* particles — project parametric offsets onto current curve */
  for (let i = 0; i < N_PARTICLES; i++) {
    const ct = pCurveT[i];
    const p  = curve.getPointAt(ct);
    const tg = curve.getTangentAt(ct).normalize();
    let lateral = tmp.crossVectors(tg, up);
    if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
    lateral.normalize();
    const binormal = new THREE.Vector3().crossVectors(tg, lateral).normalize();

    // arabesque width oscillation preserved from parent
    const w = 0.22 + 0.15 * Math.sin(ct * 32.0 + t * 0.35);
    const lo = pLatOff[i] * w;
    const bo = pBinOff[i] * 0.06;

    pPos[i * 3]     = p.x + lateral.x * lo + binormal.x * bo;
    pPos[i * 3 + 1] = p.y + lateral.y * lo + binormal.y * bo;
    pPos[i * 3 + 2] = p.z + lateral.z * lo + binormal.z * bo;

    // height-mapped color (low → abyssal blue, high → ember)
    const yNorm = Math.min(Math.max(p.y / 14.0, 0), 1);
    const col = lerpPal(yNorm);

    // shimmer — slow pulse per particle
    const shimmer = 0.65 + 0.35 * Math.sin(pPhase[i] + t * 1.8 + ct * 40.0);

    pColor[i * 3]     = col[0] * shimmer;
    pColor[i * 3 + 1] = col[1] * shimmer;
    pColor[i * 3 + 2] = col[2] * shimmer;

    // alpha: denser at ribbon center, fade at edges
    const edgeFade = 1.0 - Math.abs(pLatOff[i]);
    pAlpha[i] = (0.15 + 0.4 * edgeFade) * shimmer;

    // size: slight variation, smaller at edges
    pSize[i] = 0.035 + 0.04 * edgeFade + 0.015 * Math.sin(pPhase[i] + t);
  }
  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.aColor.needsUpdate   = true;
  particleGeo.attributes.aAlpha.needsUpdate   = true;
  particleGeo.attributes.aSize.needsUpdate    = true;

  /* camera tracking */
  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= verts.length;
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
