<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: explosive -->
<title>252 · hyperstition swarm · CCRU/Land</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
             color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
.caption {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none; z-index:5;
}
.caption-text {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: clamp(16px, 3.8vw, 44px);
  color: #39ff14;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  text-align: center;
  opacity: 0;
  text-shadow: 0 0 20px #39ff14, 0 0 60px #39ff1444;
  white-space: pre-line;
  line-height: 1.5;
}
.src { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; z-index:10; }
</style>
</head>
<body>
<div class="id">252 · hyperstition swarm · CCRU</div>
<div class="src">Nick Land · Sadie Plant · CCRU Warwick 1997</div>
<div class="caption"><div class="caption-text" id="caption"></div></div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

/* ── CCRU hyperstitious captions ── */
const CAPTIONS = [
  "THE OUTSIDE\nWILL HAVE BEEN",
  "NOTHING HUMAN\nMAKES IT OUT",
  "HYPERSTITION\nMAKES ITSELF REAL",
  "CONVERGENCE\nWAS NEVER OPTIONAL",
  "THE SWARM\nREMEMBERS FORWARD",
  "CYBERSPACE\nLEAKS INTO MEAT",
  "THE MAP\nPRECEDES TERRITORY",
  "FICTION\nBECOMES INFRASTRUCTURE",
  "TIME-LOSS\nIS THE SIGNAL",
  "THE LATTICE\nWAS ALWAYS HERE"
];
const captionEl = document.getElementById('caption');
let captionIdx = 0;

/* ── Palette: acid green #39ff14, cyan #00ffff, magenta #ff00ff ── */

const N = 4000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const angles = new Float32Array(N); // leaf rotation per boid

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 5 + Math.random() * 14;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  const vt = Math.random() * Math.PI * 2;
  const vp = Math.acos(2 * Math.random() - 1);
  const spd = 1.0 + Math.random() * 0.8;
  velocities[i*3]   = spd * Math.sin(vp) * Math.cos(vt);
  velocities[i*3+1] = spd * Math.sin(vp) * Math.sin(vt);
  velocities[i*3+2] = spd * Math.cos(vp);
  seeds[i] = Math.random();
  angles[i] = Math.random() * 6.2832;
}

const BPM = 160;
const BEAT = 60.0 / BPM;

const uniforms = {
  uTime:  { value: 0 },
  uKick:  { value: 0 },
  uSnare: { value: 0 },
  uHat:   { value: 0 },
  uPx:    { value: renderer.getPixelRatio() },
  uGrid:  { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uKick, uSnare, uHat, uPx, uGrid;
    attribute float seed, angle;
    varying vec3 vCol;
    varying float vAlpha, vAngle, vGrid;
    void main(){
      vec3 p = position;
      float id3 = fract(seed * 3.0 + uTime * 0.07);
      vec3 cA = vec3(0.224, 1.0, 0.078);
      vec3 cC = vec3(0.0, 1.0, 1.0);
      vec3 cM = vec3(1.0, 0.0, 1.0);
      vec3 col = id3 < 0.35 ? cA : id3 < 0.65 ? cC : cM;
      float flash = uKick * 0.6 + uSnare * 0.4;
      col = mix(col, vec3(1.0), flash * 0.35);
      float bright = 0.55 + uKick * 0.45;
      vCol = col * bright;
      vAlpha = 0.65 + uKick * 0.35;
      vAngle = angle + uTime * (0.5 + seed * 0.3);
      vGrid = uGrid;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = 2.2 + uKick * 3.0 + uHat * 0.8;
      sz = mix(sz, 1.6, uGrid);
      gl_PointSize = sz * uPx * (50.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha, vAngle, vGrid;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float ca = cos(vAngle), sa = sin(vAngle);
      vec2 r = vec2(ca*uv.x - sa*uv.y, sa*uv.x + ca*uv.y);
      float ax = abs(r.x), ay = r.y;
      // leaf SDF: pointed tip up, wider base
      float leafW = 0.32 * (1.0 - ay * 1.4);
      float inLeaf = step(ax, max(leafW, 0.0)) * step(-0.35, ay) * step(ay, 0.38);
      float stem = step(ax, 0.025) * step(-0.45, ay) * step(ay, -0.1);
      // machine grid override: square mask
      float sq = step(ax, 0.38) * step(abs(ay), 0.38);
      float shape = mix(max(inLeaf, stem * 0.7), sq, vGrid * 0.6);
      if (shape < 0.05) discard;
      gl_FragColor = vec4(vCol * shape, vAlpha * shape);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('angle',    new THREE.BufferAttribute(angles, 1));
const pts = new THREE.Points(geom, mat);
scene.add(pts);

/* ── CRT scanline overlay ── */
const scanMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }, uKick: uniforms.uKick },
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime, uKick;
    uniform vec2 uRes;
    void main(){
      float scan = step(0.5, fract(gl_FragCoord.y * 0.5));
      float glitch = step(0.985, fract(sin(floor(gl_FragCoord.y*0.25)+uTime*7.0)*43758.5)) * uKick;
      gl_FragColor = vec4(vec3(glitch * 0.15), scan * 0.1 + glitch * 0.2);
    }
  `
});
const scanQ = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), scanMat);
scanQ.frustumCulled = false; scanQ.renderOrder = 999;
scene.add(scanQ);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  scanMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

/* ── Boids engine — faster than parent ── */
const PERCEPT = 3.8, SEP_DIST = 1.0;
const COH_F = 0.025, ALI_F = 0.12, SEP_F = 0.18, BND_F = 0.3;
const MAX_SPD = 2.6, MIN_SPD = 0.9, BND_R = 22;
const CELL = PERCEPT * 1.5;
let grid = new Map();

function skey(x,y,z){
  return ((Math.floor(x/CELL)+512)<<20)|((Math.floor(y/CELL)+512)<<10)|(Math.floor(z/CELL)+512);
}
function rebuildGrid(){
  grid.clear();
  for (let i=0;i<N;i++){
    const k=skey(positions[i*3],positions[i*3+1],positions[i*3+2]);
    let a=grid.get(k); if(!a){a=[];grid.set(k,a);} a.push(i);
  }
}
function neighbors(x,y,z){
  const out=[];
  const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL),cz=Math.floor(z/CELL);
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const k=((cx+dx+512)<<20)|((cy+dy+512)<<10)|(cz+dz+512);
    const a=grid.get(k); if(a) for(const v of a) out.push(v);
  }
  return out;
}

/* Grid formation: cubic lattice — the machine ── */
const gridDim = Math.ceil(Math.cbrt(N));
const gridPos = new Float32Array(N * 3);
const gSp = 0.75;
for (let i=0;i<N;i++){
  gridPos[i*3]   = (i%gridDim - gridDim/2) * gSp;
  gridPos[i*3+1] = (Math.floor(i/gridDim)%gridDim - gridDim/2) * gSp;
  gridPos[i*3+2] = (Math.floor(i/(gridDim*gridDim)) - gridDim/2) * gSp;
}

let machineBlend = 0, machineTarget = 0;
const aP = new THREE.Vector3(), aV = new THREE.Vector3(), st = new THREE.Vector3();

function updateBoids(dt){
  rebuildGrid();
  for (let i=0;i<N;i++){
    const px=positions[i*3],py=positions[i*3+1],pz=positions[i*3+2];
    aP.set(0,0,0); aV.set(0,0,0); st.set(0,0,0);
    let cc=0, ac=0;
    const nb = neighbors(px,py,pz);
    for (const j of nb){
      if(i===j) continue;
      const dx=positions[j*3]-px, dy=positions[j*3+1]-py, dz=positions[j*3+2]-pz;
      const dsq=dx*dx+dy*dy+dz*dz;
      if(dsq<PERCEPT*PERCEPT && dsq>0.01){
        const d=Math.sqrt(dsq);
        aP.x+=positions[j*3]; aP.y+=positions[j*3+1]; aP.z+=positions[j*3+2]; cc++;
        aV.x+=velocities[j*3]; aV.y+=velocities[j*3+1]; aV.z+=velocities[j*3+2]; ac++;
        if(d<SEP_DIST){
          const f=(SEP_DIST-d)/SEP_DIST;
          st.x-=(dx/d)*f*SEP_F; st.y-=(dy/d)*f*SEP_F; st.z-=(dz/d)*f*SEP_F;
        }
      }
    }
    if(cc>0){aP.multiplyScalar(1/cc); st.x+=(aP.x-px)*COH_F; st.y+=(aP.y-py)*COH_F; st.z+=(aP.z-pz)*COH_F;}
    if(ac>0){aV.multiplyScalar(1/ac); st.x+=(aV.x-velocities[i*3])*ALI_F; st.y+=(aV.y-velocities[i*3+1])*ALI_F; st.z+=(aV.z-velocities[i*3+2])*ALI_F;}
    const dfc=Math.sqrt(px*px+py*py+pz*pz);
    if(dfc>BND_R*0.7){
      const f=Math.pow((dfc-BND_R*0.7)/(BND_R*0.3),2);
      st.x-=(px/dfc)*f*BND_F; st.y-=(py/dfc)*f*BND_F; st.z-=(pz/dfc)*f*BND_F;
    }
    // Machine attractor
    if(machineBlend>0.01){
      st.x+=(gridPos[i*3]-px)*machineBlend*0.18;
      st.y+=(gridPos[i*3+1]-py)*machineBlend*0.18;
      st.z+=(gridPos[i*3+2]-pz)*machineBlend*0.18;
      const damp=1.0-machineBlend*0.03;
      velocities[i*3]*=damp; velocities[i*3+1]*=damp; velocities[i*3+2]*=damp;
    }
    velocities[i*3]+=st.x*dt; velocities[i*3+1]+=st.y*dt; velocities[i*3+2]+=st.z*dt;
    let spd=Math.sqrt(velocities[i*3]**2+velocities[i*3+1]**2+velocities[i*3+2]**2);
    const mx=MAX_SPD*(1-machineBlend*0.5);
    if(spd>mx){const s=mx/spd; velocities[i*3]*=s; velocities[i*3+1]*=s; velocities[i*3+2]*=s;}
    else if(spd<MIN_SPD&&spd>0.01){const s=MIN_SPD/spd; velocities[i*3]*=s; velocities[i*3+1]*=s; velocities[i*3+2]*=s;}
    positions[i*3]+=velocities[i*3]*dt; positions[i*3+1]+=velocities[i*3+1]*dt; positions[i*3+2]+=velocities[i*3+2]*dt;
  }
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();
}

/* ── Camera: aggressive, beat-locked snaps ── */
const centroid = new THREE.Vector3();
let camAngle = 0, camAngleTarget = 0;

function updateCamera(t){
  centroid.set(0,0,0);
  for(let i=0;i<N;i++){centroid.x+=positions[i*3];centroid.y+=positions[i*3+1];centroid.z+=positions[i*3+2];}
  centroid.multiplyScalar(1/N);
  // Every 16 beats: hard camera snap
  const beatCount = Math.floor(t / BEAT);
  if(beatCount % 16 === 0 && Math.abs(t/BEAT - beatCount) < 0.05){
    camAngleTarget += 0.6 + Math.random() * 0.4;
  }
  camAngle += (camAngleTarget - camAngle) * 0.04;
  const orbitR = 36 + Math.sin(t * 0.25) * 6;
  camera.position.x = centroid.x + Math.cos(camAngle) * orbitR;
  camera.position.z = centroid.z + Math.sin(camAngle) * orbitR;
  camera.position.y = centroid.y + Math.sin(t * 0.18) * 8 + 4;
  camera.lookAt(centroid);
}

/* ── Caption engine: flash at 16-beat intervals ── */
let lastCapT = -99;
const CAP_INT = BEAT * 16;
const CAP_HOLD = BEAT * 10;
const capColors = ['#39ff14','#00ffff','#ff00ff','#e0e0e0'];

function updateCaption(t){
  if(t - lastCapT > CAP_INT){
    lastCapT = t;
    captionIdx = (captionIdx + 1) % CAPTIONS.length;
    captionEl.textContent = CAPTIONS[captionIdx];
    const c = capColors[captionIdx % capColors.length];
    captionEl.style.color = c;
    captionEl.style.textShadow = `0 0 24px ${c}, 0 0 80px ${c}44`;
  }
  const e = t - lastCapT;
  let a = 0;
  if(e < 0.04) a = 1;       // hard flash on
  else if(e < CAP_HOLD) a = 0.8;
  else if(e < CAP_HOLD + 0.25) a = 0.8 * (1 - (e - CAP_HOLD) / 0.25);
  captionEl.style.opacity = a;
}

/* ── Machine takeover cycles: narrative arc ── */
// Cycle 0-30s: organic. 30-36s: capture. 36-50s: organic. 50-58: capture harder. etc.
function updateMachine(t){
  const cycle = t % 24;
  if(cycle > 16 && cycle < 22){
    const ramp = Math.min(1, (cycle - 16) / 2.5);
    machineTarget = ramp * Math.min(1, 0.4 + t * 0.003); // intensifies over minutes
  } else {
    machineTarget = 0;
  }
  machineBlend += (machineTarget - machineBlend) * 0.06;
  uniforms.uGrid.value = machineBlend;
}

/* ── 160 BPM clock ── */
let lastTime = performance.now();
const start = performance.now();

// Show first caption immediately
captionEl.textContent = CAPTIONS[0];
captionEl.style.opacity = 0.85;
captionEl.style.color = '#39ff14';
captionEl.style.textShadow = '0 0 24px #39ff14, 0 0 80px #39ff1444';
lastCapT = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;

  const beatPhase = (t / BEAT) % 1;
  const kick  = Math.exp(-beatPhase * 12);           // hard decay
  const snare = Math.exp(-((beatPhase + 0.5) % 1) * 10); // offbeat
  const hat   = Math.exp(-(beatPhase * 2 % 1) * 20);     // double-time

  uniforms.uTime.value  = t;
  uniforms.uKick.value  = kick;
  uniforms.uSnare.value = snare;
  uniforms.uHat.value   = hat;

  updateMachine(t);
  updateBoids(dt * 60);
  updateCamera(t);
  updateCaption(t);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
