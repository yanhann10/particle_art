<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor stelae · glyphs of emergence</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0805; overflow:hidden;
               color:#c8bcaa; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<!-- MOTION: emergence, intensity: gentle -->
<div class="id">6da · attractor stelae</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Mayan stelae composition: four vertical columns (glyphs), each column houses one attractor.
// Glyphs grow bottom-to-top as vertical cartouches, each attractor emerges from limestone silence.
// Columns arranged in square grid with carved stone framing. Attractors are condensed, filling their glyph-cell.
// Camera fixed frontal view, no orbit — stelae face the viewer as monumental inscription.
// Palette: weathered limestone whites, iron-oxide reds, verdigris copper greens, carbon blacks.

const W = 256, H = 256;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0805, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// Four attractors: Lorenz, Aizawa, Thomas, Halvorsen
const ATTRACTORS = [
  { id: 'lorenz',    basin: [0,0,27], bSize: 8,   norm: [0,0,25],  scale: 22, pal:[0.92,0.88,0.82] },
  { id: 'aizawa',    basin: [0.1,0,0], bSize: 0.6, norm: [0,0,0],   scale: 1.4, pal:[0.58,0.72,0.68] },
  { id: 'thomas',    basin: [0.5,0,0.5], bSize: 1.2, norm: [0,0,0], scale: 4.2, pal:[0.78,0.32,0.18] },
  { id: 'halvorsen', basin: [-1,-1,-1], bSize: 1.8, norm: [0,0,0],  scale: 6.2, pal:[0.12,0.10,0.08] },
];

function makeInitTexture(){
  const init = new Float32Array(N * 4);
  const perGlyph = N / 4;
  for (let g = 0; g < 4; g++){
    const att = ATTRACTORS[g];
    for (let i = 0; i < perGlyph; i++){
      const idx = g * perGlyph + i;
      init[idx*4]   = att.basin[0] + (Math.random()-0.5)*att.bSize;
      init[idx*4+1] = att.basin[1] + (Math.random()-0.5)*att.bSize;
      init[idx*4+2] = att.basin[2] + (Math.random()-0.5)*att.bSize;
      init[idx*4+3] = g; // store glyph-index
    }
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:  { value: 0.0 },
  uTime: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uTime;
    varying vec2 vUv;

    vec3 lorenz(vec3 p){
      return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y - (8.0/3.0)*p.z);
    }
    vec3 aizawa(vec3 p){
      const float a=0.95, b=0.7, c=0.6, d=3.5, e=0.25, f=0.1;
      return vec3((p.z-b)*p.x - d*p.y, d*p.x + (p.z-b)*p.y,
                  c + a*p.z - p.z*p.z*p.z/3.0 - (p.x*p.x + p.y*p.y)*(1.0+e*p.z) + f*p.z*p.x*p.x*p.x);
    }
    vec3 thomasA(vec3 p){
      const float B = 0.208186;
      return vec3(sin(p.y)-B*p.x, sin(p.z)-B*p.y, sin(p.x)-B*p.z);
    }
    vec3 halvorsen(vec3 p){
      const float a = 1.4;
      return vec3(-a*p.x - 4.0*p.y - 4.0*p.z - p.y*p.y,
                  -a*p.y - 4.0*p.z - 4.0*p.x - p.z*p.z,
                  -a*p.z - 4.0*p.x - 4.0*p.y - p.x*p.x);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float glyph = s.w;
      int g = int(glyph);

      vec3 dp;
      float dtScale = 1.0;
      if (g == 0){
        dp = lorenz(p);
        dtScale = 0.15;
      } else if (g == 1){
        dp = aizawa(p);
        dtScale = 1.0;
      } else if (g == 2){
        dp = thomasA(p);
        dtScale = 1.0;
      } else {
        dp = halvorsen(p);
        dtScale = 0.4;
      }

      p += dp * uDt * dtScale;
      gl_FragColor = vec4(p, glyph);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ─────────────────────────── render scene ───────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0, 12);
camera.lookAt(0, 0, 0);

// Limestone carved frame — four vertical columns
const stoneMat = new THREE.MeshStandardMaterial({ 
  color: 0x5a5248, 
  roughness: 0.92, 
  metalness: 0.0,
  flatShading: true
});

// Vertical dividers (three inner, two outer edges)
for (let i = 0; i < 5; i++){
  const x = -4.8 + i * 2.4;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.18, 7.2, 0.3), stoneMat);
  frame.position.set(x, 0, -0.4);
  scene.add(frame);
}

// Horizontal base and cap
const hFrame1 = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.18, 0.3), stoneMat);
hFrame1.position.set(0, -3.6, -0.4);
scene.add(hFrame1);
const hFrame2 = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.18, 0.3), stoneMat);
hFrame2.position.set(0, 3.6, -0.4);
scene.add(hFrame2);

// Diagonal weathering grooves (asymmetric, hand-placed)
const grooveMat = new THREE.LineBasicMaterial({ color: 0x3a3228, opacity: 0.6, transparent: true });
for (let i = 0; i < 12; i++){
  const x = -4.5 + Math.random() * 9;
  const y = -3.2 + Math.random() * 6.4;
  const pts = [
    new THREE.Vector3(x, y, -0.25),
    new THREE.Vector3(x + (Math.random()-0.5)*0.4, y + (Math.random()-0.5)*0.6, -0.25)
  ];
  const geom = new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.Line(geom, grooveMat));
}

// Four glyph-cells (cartouches): particles confined to vertical columns
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float glyph = s.w;
      int g = int(glyph);

      // Each glyph gets its own vertical column in stelae layout
      // Columns: x = -3.6, -1.2, 1.2, 3.6
      float colX = -3.6 + float(g) * 2.4;

      // Map attractor to local cell (2.0 wide × 6.8 tall)
      vec3 norm, disp;
      float scale;
      vec3 pal;
      if (g == 0){
        norm = vec3(0, 0, 25); scale = 22.0;
        pal = vec3(0.92, 0.88, 0.82);
      } else if (g == 1){
        norm = vec3(0, 0, 0); scale = 1.4;
        pal = vec3(0.58, 0.72, 0.68);
      } else if (g == 2){
        norm = vec3(0, 0, 0); scale = 4.2;
        pal = vec3(0.78, 0.32, 0.18);
      } else {
        norm = vec3(0, 0, 0); scale = 6.2;
        pal = vec3(0.12, 0.10, 0.08);
      }
      disp = (p - norm) / scale;

      // Constrain to glyph cartouche: 1.8 wide × 6.2 tall
      disp.x = disp.x * 0.85;
      disp.y = disp.y * 2.8;
      disp.z = disp.z * 0.25; // flatten depth

      vec3 world = vec3(colX + disp.x, disp.y, disp.z);

      // Emergence: particles fade in from bottom over time
      float emerge = smoothstep(0.0, 8.0, uTime);
      float yFade = smoothstep(-3.2, 0.0, world.y);
      vAlpha = emerge * yFade * (0.7 + 0.3 * sin(uTime * 0.3 + float(g)));

      // Subtle color variation per particle
      float noise = fract(sin(dot(uvIdx, vec2(12.9898, 78.233))) * 43758.5453);
      vCol = pal * (0.85 + 0.15 * noise);

      vec4 mv = modelViewMatrix * vec4(world, 1.0);
      gl_PointSize = 2.2 * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      gl_FragColor = vec4(vCol * a * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// Directional light from upper-left (temple sunlight)
const light = new THREE.DirectionalLight(0xfff8e8, 1.2);
light.position.set(-3, 5, 4);
scene.add(light);
const ambient = new THREE.AmbientLight(0x2a2218, 0.6);
scene.add(ambient);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  simUniforms.uTime.value = t;
  simUniforms.uDt.value = dt;
  pointsMat.uniforms.uTime.value = t;

  // Simulate 3 substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
