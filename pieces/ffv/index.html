<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ffv · topographic · Tara Donovan accumulation landscape</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f0ece4; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px;
           letter-spacing:0.04em; color:#666; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px;
           letter-spacing:0.04em; color:#666; }
</style>
</head>
<body>
<div class="id">ffv</div>
<div class="hint">orbit drag</div>
<div class="src">Tara Donovan · Chladni topography · 30k leaves</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── intent ──
   The viewer sees a topographic landscape — ridges, valleys, saddle points —
   built entirely from thousands of identical leaf-shaped tiles, as if Tara Donovan
   had scattered pressed leaves across a vibrating Chladni plate and they'd settled
   into the standing-wave ridges. Bone/parchment/umber palette. Contemplative drift
   as the Chladni modes slowly blend between harmonic pairs.
*/

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ece4);
scene.fog = new THREE.Fog(0xf0ece4, 25, 55);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 12, 22);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ── leaf geometry ── */
const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0.18);
leafShape.quadraticCurveTo(0.09, 0.13, 0.12, 0);
leafShape.quadraticCurveTo(0.09, -0.13, 0, -0.18);
leafShape.quadraticCurveTo(-0.09, -0.13, -0.12, 0);
leafShape.quadraticCurveTo(-0.09, 0.13, 0, 0.18);
const leafGeo = new THREE.ShapeGeometry(leafShape, 4);

/* ── grid layout ── */
const GRID = 170;          // 170×170 ≈ 28900 leaves
const COUNT = GRID * GRID;
const SPAN = 28;
const HALF = SPAN / 2;
const CELL = SPAN / GRID;

/* ── per-instance attributes ── */
const dummy = new THREE.Object3D();
const offsets = new Float32Array(COUNT * 2);   // xz on grid
const flutterSeeds = new Float32Array(COUNT);  // per-leaf phase

let s = 314159;
const rng = () => {
  s |= 0; s = s + 0x6D2B79F5 | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

for (let i = 0; i < GRID; i++) {
  for (let j = 0; j < GRID; j++) {
    const idx = i * GRID + j;
    const x = (j + 0.5) * CELL - HALF + (rng() - 0.5) * CELL * 0.6;
    const z = (i + 0.5) * CELL - HALF + (rng() - 0.5) * CELL * 0.6;
    offsets[idx * 2] = x;
    offsets[idx * 2 + 1] = z;
    flutterSeeds[idx] = rng() * 6.2832;
  }
}

/* ── instanced mesh with custom shader ── */
const iMesh = new THREE.InstancedMesh(leafGeo, null, COUNT);

// Add custom instance attributes
const iOffsetAttr = new THREE.InstancedBufferAttribute(offsets, 2);
const iFlutterAttr = new THREE.InstancedBufferAttribute(flutterSeeds, 1);
leafGeo.setAttribute('iOffset', iOffsetAttr);
leafGeo.setAttribute('iFlutter', iFlutterAttr);

// Set identity matrices (position handled in shader)
const identityMatrix = new THREE.Matrix4();
for (let i = 0; i < COUNT; i++) {
  iMesh.setMatrixAt(i, identityMatrix);
}

/* ── palette: bone, parchment, umber, ash ── */
const PAL = [
  new THREE.Color(0.86, 0.82, 0.74),  // bone
  new THREE.Color(0.78, 0.72, 0.62),  // parchment-dark
  new THREE.Color(0.52, 0.42, 0.32),  // umber
  new THREE.Color(0.65, 0.60, 0.53),  // ash-warm
  new THREE.Color(0.72, 0.68, 0.60),  // stone
];

// Pre-assign per-instance colors based on grid position
for (let i = 0; i < COUNT; i++) {
  const x = offsets[i * 2];
  const z = offsets[i * 2 + 1];
  const band = Math.abs(Math.sin(x * 0.4 + z * 0.3)) * 0.6 + rng() * 0.4;
  const ci = Math.min(Math.floor(band * PAL.length), PAL.length - 1);
  const c = PAL[ci].clone();
  // Subtle per-leaf variation
  c.r += (rng() - 0.5) * 0.04;
  c.g += (rng() - 0.5) * 0.04;
  c.b += (rng() - 0.5) * 0.04;
  iMesh.setColorAt(i, c);
}
iMesh.instanceColor.needsUpdate = true;

/* ── shader material ── */
const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uFogColor: { value: scene.fog.color },
    uFogNear: { value: scene.fog.near },
    uFogFar: { value: scene.fog.far },
  },
  vertexShader: `
    uniform float uTime;

    attribute vec2 iOffset;
    attribute float iFlutter;

    varying vec3 vColor;
    varying float vFogDepth;
    varying float vNY;

    /* Chladni plate: cos(n*pi*x/L)*cos(m*pi*y/L) ± cos(m*pi*x/L)*cos(n*pi*y/L) */
    float chladni(vec2 p, float n, float m, float sign) {
      float L = 14.0;
      float nx = p.x / L;
      float ny = p.y / L;
      float PI = 3.14159265;
      return cos(n * PI * nx) * cos(m * PI * ny)
           + sign * cos(m * PI * nx) * cos(n * PI * ny);
    }

    float terrainHeight(vec2 p, float t) {
      /* Blend between two Chladni harmonic pairs */
      float blend = sin(t * 0.12) * 0.5 + 0.5;
      float h1 = chladni(p, 3.0, 5.0, -1.0);
      float h2 = chladni(p, 4.0, 7.0, 1.0);
      float h = mix(h1, h2, blend);
      /* Add a secondary harmonic for ridge detail */
      float h3 = chladni(p, 2.0, 3.0, 1.0) * 0.3;
      float detail = sin(t * 0.07 + 1.5) * 0.5 + 0.5;
      h += h3 * detail;
      return h * 2.8;
    }

    void main() {
      vec2 gp = iOffset;
      float t = uTime;

      /* terrain displacement */
      float y = terrainHeight(gp, t);

      /* per-leaf flutter: gentle tilt oscillation */
      float flutter = sin(t * 0.8 + iFlutter) * 0.12;
      float flutter2 = cos(t * 0.6 + iFlutter * 1.7) * 0.08;

      /* terrain normal for leaf orientation (finite differences in shader) */
      float eps = 0.15;
      float hL = terrainHeight(gp + vec2(-eps, 0.0), t);
      float hR = terrainHeight(gp + vec2(eps, 0.0), t);
      float hD = terrainHeight(gp + vec2(0.0, -eps), t);
      float hU = terrainHeight(gp + vec2(0.0, eps), t);
      vec3 norm = normalize(vec3(hL - hR, 2.0 * eps, hD - hU));

      /* build leaf orientation from terrain normal */
      vec3 up = norm;
      vec3 right = normalize(cross(up, vec3(0.0, 0.0, 1.0)));
      vec3 forward = cross(right, up);

      /* apply flutter as small rotation around right axis */
      float cf = cos(flutter); float sf = sin(flutter);
      vec3 up2 = up * cf + forward * sf;
      vec3 fwd2 = forward * cf - up * sf;
      /* second flutter axis */
      float cf2 = cos(flutter2); float sf2 = sin(flutter2);
      vec3 right2 = right * cf2 + fwd2 * sf2;

      /* transform local vertex position */
      vec3 localPos = position;
      vec3 worldPos = vec3(gp.x, y, gp.y)
                    + right2 * localPos.x
                    + up2 * localPos.y;

      vNY = norm.y;

      /* instance color from three.js */
      #ifdef USE_INSTANCING_COLOR
        vColor = instanceColor;
      #else
        vColor = vec3(0.7, 0.65, 0.58);
      #endif

      /* height-based tint: higher leaves slightly lighter */
      float heightFactor = smoothstep(-2.0, 3.0, y);
      vColor = mix(vColor * 0.85, vColor * 1.1, heightFactor);

      vec4 mvPos = modelViewMatrix * instanceMatrix * vec4(worldPos, 1.0);
      vFogDepth = -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;

    varying vec3 vColor;
    varying float vFogDepth;
    varying float vNY;

    void main() {
      /* subtle shading from terrain normal */
      float shade = 0.75 + 0.25 * vNY;
      vec3 col = vColor * shade;

      /* fog */
      float fogFactor = smoothstep(uFogNear, uFogFar, vFogDepth);
      col = mix(col, uFogColor, fogFactor);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide,
});

iMesh.material = material;
scene.add(iMesh);

/* ── ambient light gradient (subtle directional shading via bg plane) ── */
const bgGeo = new THREE.PlaneGeometry(80, 80);
const bgMat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      /* warm-to-cool gradient floor */
      vec3 warm = vec3(0.92, 0.88, 0.80);
      vec3 cool = vec3(0.88, 0.86, 0.82);
      vec3 col = mix(warm, cool, vUv.y * 0.5 + 0.25);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  depthWrite: false,
});
const bgPlane = new THREE.Mesh(bgGeo, bgMat);
bgPlane.rotation.x = -Math.PI / 2;
bgPlane.position.y = -3.5;
scene.add(bgPlane);

/* ── orbit controls (manual only, no auto-rotate) ── */
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.35, orbitPhi = 0.75;
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.2, Math.min(1.3, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ── */
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  material.uniforms.uTime.value = t;

  /* fixed contemplative camera with manual orbit */
  const radius = 24;
  const theta = orbitTheta;
  const phi = orbitPhi;

  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, 0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
