<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19h · Shiota — thread diary</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#020202; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">19h</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);
scene.fog = new THREE.FogExp2(0x020202, 0.025);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a0606, 0.8));
const dL = new THREE.DirectionalLight(0xffeedd, 0.3);
dL.position.set(-4, 6, 3);
scene.add(dL);
const pL = new THREE.PointLight(0x440808, 0.5, 20);
pL.position.set(2, 3, -6);
scene.add(pL);
// Faint warm light from below — gallery floor reflection
const floorL = new THREE.PointLight(0x1a0a04, 0.3, 14);
floorL.position.set(0, -6, -4);
scene.add(floorL);

let seed = 55829173;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── Suspended sphere — the pale moon within the blood cosmos
const sphereR = 2.6;
const spherePos = new THREE.Vector3(1.2, 0.4, -6);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf5ede2, emissive: 0xf5ede2, emissiveIntensity: 0.55,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide, depthWrite: false
});
const sphereMesh = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 24, 16), sphereMat);
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

// Inner sphere — slightly smaller, more opaque, gives depth
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.82, 18, 12),
  new THREE.MeshStandardMaterial({
    color: 0xeae0d4, emissive: 0xeae0d4, emissiveIntensity: 0.3,
    roughness: 1.0, transparent: true, opacity: 0.12, depthWrite: false
  })
);
innerSphere.position.copy(spherePos);
scene.add(innerSphere);

// ── Suspended dress form — Shiota's signature remembered garment
// Simplified geometric stand-in: a cone (torso) + trapezoid skirt
const dressGroup = new THREE.Group();
const dressColor = 0x0a0a0a;
const dressMat = new THREE.MeshStandardMaterial({ color: dressColor, roughness: 0.7, metalness: 0.6 });

// Bodice — narrow cylinder
const bodice = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 0.9, 8), dressMat);
bodice.position.y = 0.45;
dressGroup.add(bodice);

// Skirt — wider cone
const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.7, 1.4, 10, 1, true), dressMat);
skirt.position.y = -0.4;
dressGroup.add(skirt);

// Shoulders — thin bar
const shoulders = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.04, 0.08), dressMat);
shoulders.position.y = 0.9;
dressGroup.add(shoulders);

// Hanger hook
const hook = new THREE.Mesh(
  new THREE.TorusGeometry(0.12, 0.02, 6, 12, Math.PI),
  dressMat
);
hook.position.set(0, 1.08, 0);
hook.rotation.x = Math.PI;
dressGroup.add(hook);

const dressPos = new THREE.Vector3(spherePos.x - 2.8, spherePos.y + 1.2, spherePos.z + 3.5);
dressGroup.position.copy(dressPos);
dressGroup.rotation.set(0.08, 0.4, 0.05);
scene.add(dressGroup);

// ── Room volume — the architectural cube we're inside
const ROOM = { w: 24, h: 18, d: 38 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Anchor points with density clusters
const NUM_ANCHORS = 1100;
const anchors = [];
for(let i=0; i<NUM_ANCHORS; i++){
  const r = rng();
  if(r < 0.35){
    // Dense shell around sphere
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereR + 0.04 + rng()*4.0;
    anchors.push(spherePos.clone().add(dir.multiplyScalar(dist)));
  } else if(r < 0.48){
    // Around dress
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    anchors.push(dressPos.clone().add(dir.multiplyScalar(0.2 + rng()*3.0)));
  } else if(r < 0.65){
    // Midfield — between objects and walls
    const p = wallPt();
    const target = rng() < 0.6 ? spherePos : dressPos;
    p.lerp(target, 0.2 + rng()*0.4);
    anchors.push(p);
  } else {
    anchors.push(wallPt());
  }
}

// ── Build 20,000 line segments — the blood-red yarn web
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurf(from){
  const dir = spherePos.clone().sub(from).normalize();
  return spherePos.clone().sub(dir.multiplyScalar(sphereR * (0.94 + rng()*0.08)));
}

function dressSurf(){
  return dressPos.clone().add(new THREE.Vector3(
    (rng()-0.5)*0.8, (rng()-0.5)*2.0, (rng()-0.5)*0.5
  ));
}

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Cat A: converging on sphere — the heart of the web (38%)
const catA = Math.floor(NUM_LINES * 0.38);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, sphereSurf(a));
}

// Cat B: converging on dress — threads gripping the absent body (15%)
const catB = Math.floor(NUM_LINES * 0.15);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = rng()<0.45 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, dressSurf());
}

// Cat C: connecting sphere to dress — the relation (8%)
const catC = Math.floor(NUM_LINES * 0.08);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = sphereSurf(dressPos);
  const b = dressSurf();
  setLine(a, b);
}

// Cat D: wall-to-wall threads passing through the central region (20%)
const catD = Math.floor(NUM_LINES * 0.20);
for(let i=0; i<catD && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 10 && rng() > 0.1){ i--; continue; }
  setLine(a, b);
}

// Cat E: short local filaments between nearby anchors — fills texture
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.1){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── Dark fragments — charred diary pages caught in the web
const NUM_FRAGS = 40;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.025 + rng()*0.14;
  const aspect = 0.4 + rng()*1.2;
  const geo = rng() > 0.6
    ? new THREE.PlaneGeometry(sz*aspect, sz) // paper-like flat
    : new THREE.TetrahedronGeometry(sz*0.7, 0);
  const d = 0.015 + rng()*0.035;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.5, d*0.4),
    transparent: true, opacity: 0.4 + rng()*0.45,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.2 + rng()*0.6; // avoid endpoints
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// ── Camera path — slow walk THROUGH the installation
// Inspired by gallery visitor: approach, circle near sphere, drift past dress, retreat
const dollyPath = [];
const pathLen = 300;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;
  // Asymmetric path — closer approach on one side, wider on another
  const r1 = 5.0 + Math.sin(phase*1.3)*1.5;
  const r2 = 6.5 + Math.cos(phase*0.7)*2.0;
  const x = spherePos.x + Math.sin(phase) * r1 + Math.sin(phase*2.7)*0.8;
  const y = spherePos.y + Math.sin(phase*0.5 + 0.8) * 2.0 + Math.cos(phase*1.3)*0.6 - 0.5;
  const z = spherePos.z + Math.cos(phase) * r2 + Math.cos(phase*0.4)*1.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Micro-breathing on threads — barely perceptible tension shifts
  const breathAmp = 0.008;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.4 + by*0.9 + bz*0.25;
    const s = Math.sin(t*0.18 + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.6;
    arr[i+2] = bz + s*0.4;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera — glacial dolly through the web
  const speed = 0.0045;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Gaze wanders slowly between sphere and dress — presence and absence
  const gazePhase = t * 0.013;
  const lookBlend = 0.5 + Math.sin(gazePhase) * 0.42;
  const lookTarget = spherePos.clone().lerp(dressPos, lookBlend);
  lookTarget.x += Math.sin(t*0.021)*0.4;
  lookTarget.y += Math.cos(t*0.015)*0.25;
  camera.lookAt(lookTarget);

  // Dress — imperceptible sway as if suspended from a thread
  dressGroup.rotation.z = 0.05 + Math.sin(t * 0.07) * 0.015;
  dressGroup.rotation.x = 0.08 + Math.cos(t * 0.05) * 0.008;

  // Sphere — slow luminous pulse, like breathing
  const pulse = 1.0 + Math.sin(t * 0.12) * 0.006;
  sphereMesh.scale.setScalar(pulse);
  sphereMat.emissiveIntensity = 0.5 + Math.sin(t * 0.09) * 0.08;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
