<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi4 · AUTO{}Construccion</title>
<!-- MOTION: collapse, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">pi4</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Stochastic L-system for room/wall grammar ── */
const RULES = {
  'R': [
    { p: 0.40, s: 'R[+W]R[-W]' },
    { p: 0.30, s: 'RW[+R]' },
    { p: 0.20, s: 'R[+W][-W]R' },
    { p: 0.10, s: 'WWR' },
  ],
  'W': [
    { p: 0.50, s: 'WW' },
    { p: 0.30, s: 'W[+W]' },
    { p: 0.20, s: 'W' },
  ],
};

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function gridTurtle(str, rng){
  const stack = [];
  const voxels = [];
  let x = 0, y = 0, z = 0;
  let dir = 0; // 0=+X, 1=+Z, 2=-X, 3=-Z
  const STEP = 1.2;
  
  for (const ch of str){
    switch(ch){
      case 'R': {
        // Room cell
        voxels.push({ x, y, z, type: 'room', age: 0, falling: false, vy: 0 });
        // Step forward
        if (dir === 0) x += STEP;
        else if (dir === 1) z += STEP;
        else if (dir === 2) x -= STEP;
        else z -= STEP;
        break;
      }
      case 'W': {
        // Wall cell
        voxels.push({ x, y, z, type: 'wall', age: 0, falling: false, vy: 0 });
        if (dir === 0) x += STEP;
        else if (dir === 1) z += STEP;
        else if (dir === 2) x -= STEP;
        else z -= STEP;
        break;
      }
      case '+': dir = (dir + 1) % 4; break;
      case '-': dir = (dir + 3) % 4; break;
      case '[': 
        stack.push({ x, y, z, dir });
        if (rng() < 0.5) y += STEP; // sometimes build upward
        break;
      case ']': {
        const f = stack.pop();
        x = f.x; y = f.y; z = f.z; dir = f.dir;
        break;
      }
    }
  }
  return voxels;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a0a, 20, 60);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(16, 14, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

/* ── Instanced cubes ── */
const cubeGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
const MAX_INSTANCES = 4000;

const roomMat = new THREE.MeshStandardMaterial({ 
  color: 0x3a3a3a, 
  roughness: 0.85, 
  metalness: 0.05,
  emissive: 0x0a0a0a,
  emissiveIntensity: 0.2
});
const wallMat = new THREE.MeshStandardMaterial({ 
  color: 0x5a5a5a, 
  roughness: 0.75, 
  metalness: 0.1,
  emissive: 0x1a1a1a,
  emissiveIntensity: 0.15
});

const roomMesh = new THREE.InstancedMesh(cubeGeo, roomMat, MAX_INSTANCES);
const wallMesh = new THREE.InstancedMesh(cubeGeo, wallMat, MAX_INSTANCES);
roomMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
wallMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(roomMesh);
scene.add(wallMesh);

/* ── Lighting ── */
const amb = new THREE.AmbientLight(0x222222, 0.4);
scene.add(amb);
const key = new THREE.DirectionalLight(0xffffff, 0.8);
key.position.set(10, 18, 12);
scene.add(key);
const rim = new THREE.DirectionalLight(0x4488ff, 0.3);
rim.position.set(-8, 6, -10);
scene.add(rim);

/* ── Code-flash accent light (synchronized to collapse) ── */
const flashLight = new THREE.PointLight(0x00ff88, 0, 30);
flashLight.position.set(0, 8, 0);
scene.add(flashLight);

/* ── Voxel state ── */
let voxels = [];
let roomCount = 0;
let wallCount = 0;

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('R', 4, rng);
  voxels = gridTurtle(str, rng);
  
  // Center structure
  const bb = new THREE.Box3();
  for (const v of voxels){
    bb.expandByPoint(new THREE.Vector3(v.x, v.y, v.z));
  }
  const ctr = bb.getCenter(new THREE.Vector3());
  for (const v of voxels){
    v.x -= ctr.x;
    v.z -= ctr.z;
  }
  
  roomCount = 0;
  wallCount = 0;
}

regrow(Date.now());

/* ── Collapse cycle ── */
const CYCLE_DURATION = 8.0; // seconds per build/collapse cycle
let cyclePhase = 0; // 0..1

function updateInstances(elapsed){
  cyclePhase = (elapsed % CYCLE_DURATION) / CYCLE_DURATION;
  
  const buildPhase = Math.min(1, cyclePhase * 2.5); // 0..0.4 of cycle
  const holdPhase = cyclePhase > 0.4 && cyclePhase < 0.6; // 0.4..0.6
  const collapseStart = 0.6;
  const collapsePhase = cyclePhase > collapseStart 
    ? (cyclePhase - collapseStart) / (1 - collapseStart) 
    : 0;
  
  // Code-flash on collapse trigger
  if (collapsePhase > 0 && collapsePhase < 0.15){
    flashLight.intensity = 2.0 * (1 - collapsePhase / 0.15);
  } else {
    flashLight.intensity = 0;
  }
  
  const mat4 = new THREE.Matrix4();
  roomCount = 0;
  wallCount = 0;
  
  for (let i = 0; i < voxels.length; i++){
    const v = voxels[i];
    v.age += 0.016;
    
    // Build phase: rise from ground
    let py = v.y;
    if (buildPhase < 1){
      const delay = (v.x * 0.03 + v.z * 0.02 + v.y * 0.1) % 1.0;
      const progress = Math.max(0, Math.min(1, (buildPhase - delay) / 0.3));
      const s = progress * progress * (3 - 2 * progress);
      py = v.y - 8 + s * 8;
    }
    
    // Collapse phase: falling
    if (collapsePhase > 0){
      if (!v.falling){
        const triggerDelay = (Math.abs(v.x) * 0.05 + Math.abs(v.z) * 0.04) % 0.3;
        if (collapsePhase > triggerDelay){
          v.falling = true;
          v.vy = 0;
        }
      }
      if (v.falling){
        v.vy -= 0.5; // gravity
        py += v.vy * 0.016;
        // Reset if below ground
        if (py < -15){
          v.falling = false;
          v.vy = 0;
        }
      }
    } else {
      // Reset falling state on new cycle
      if (cyclePhase < 0.1){
        v.falling = false;
        v.vy = 0;
      }
    }
    
    const scale = 1.0;
    mat4.makeScale(scale, scale, scale);
    mat4.setPosition(v.x, py, v.z);
    
    if (v.type === 'room'){
      roomMesh.setMatrixAt(roomCount, mat4);
      roomCount++;
    } else {
      wallMesh.setMatrixAt(wallCount, mat4);
      wallCount++;
    }
  }
  
  roomMesh.count = roomCount;
  wallMesh.count = wallCount;
  roomMesh.instanceMatrix.needsUpdate = true;
  wallMesh.instanceMatrix.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Track centroid for camera
function computeCentroid(){
  const c = new THREE.Vector3();
  let count = 0;
  for (const v of voxels){
    if (!v.falling || v.y > -5){
      c.x += v.x;
      c.y += v.y;
      c.z += v.z;
      count++;
    }
  }
  if (count > 0){
    c.divideScalar(count);
  }
  return c;
}

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  updateInstances(elapsed);
  
  // Camera tracks centroid with damping
  const target = computeCentroid();
  controls.target.lerp(target, 0.02);
  controls.update();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
