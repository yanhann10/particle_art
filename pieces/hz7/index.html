<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cornice · projecting crown moldings</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a1a; overflow:hidden;
               color:#ccc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
</style>
</head>
<body>
<div class="id">c9n</div>
<div class="hint">drag to orbit · click to regenerate</div>
<div class="src">Borromini cornices → vaulted crown · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1a1a, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const NUM_RIBS = 9;
const TIERS = 5;
const SEGMENTS_PER_RIB = 8;
const TOTAL_PANELS = NUM_RIBS * SEGMENTS_PER_RIB;
const PARTICLES_PER_PANEL = Math.floor(N * 0.55 / TOTAL_PANELS);
const CORNICE_PARTICLES = N - PARTICLES_PER_PANEL * TOTAL_PANELS;

const PANEL_W = 0.8, PANEL_H = 1.3, PANEL_D = 0.28;

let panelDefs = [];
let foldTargets = [];
let foldCurrents = [];
let corniceDefs = [];

let seed = 42;

function makeRng(s) {
  let st = s >>> 0;
  return () => {
    st |= 0; st = st + 0x6D2B79F5 | 0;
    let t = Math.imul(st ^ st >>> 15, 1 | st);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function definePanels() {
  panelDefs = [];
  foldTargets = [];
  foldCurrents = [];
  corniceDefs = [];

  const rng = makeRng(seed);

  const vaultRise = 5.5 + rng() * 1.5;
  const vaultSpan = 9.0 + rng() * 2.0;

  for (let ribIdx = 0; ribIdx < NUM_RIBS; ribIdx++) {
    const ribAngle = (ribIdx / NUM_RIBS) * Math.PI * 2;
    const ribRadius = vaultSpan * 0.4;
    const ribBaseX = Math.cos(ribAngle) * ribRadius;
    const ribBaseZ = Math.sin(ribAngle) * ribRadius;
    const apexAngle = 0.85 + rng() * 0.3;

    for (let seg = 0; seg < SEGMENTS_PER_RIB; seg++) {
      const t = seg / (SEGMENTS_PER_RIB - 1);
      let localAngle, yPos, isLeft;
      if (t < 0.5) {
        isLeft = true;
        const arcT = t * 2.0;
        localAngle = arcT * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.8;
      } else {
        isLeft = false;
        const arcT = (t - 0.5) * 2.0;
        localAngle = (1.0 - arcT) * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.8;
      }

      const xOffset = isLeft ?
        -Math.cos(localAngle) * (vaultSpan * 0.15) :
        Math.cos(localAngle) * (vaultSpan * 0.15);

      const x = ribBaseX + xOffset * Math.cos(ribAngle);
      const y = yPos;
      const z = ribBaseZ + xOffset * Math.sin(ribAngle);

      const hingeRot = localAngle + (isLeft ? -Math.PI/2 : Math.PI/2);
      const accentProb = seg === Math.floor(SEGMENTS_PER_RIB / 2) ? 0.7 : 0.08;

      panelDefs.push({
        basePos: [x, y, z],
        hingeRot,
        ribAngle,
        segmentT: t,
        accent: rng() < accentProb
      });

      const baseFold = (rng() - 0.5) * 0.5;
      foldTargets.push(baseFold);
      foldCurrents.push(baseFold * 0.8);
    }
  }

  /* Cornice tiers: horizontal projecting bands at key heights */
  const tierHeights = [];
  for (let ti = 0; ti < TIERS; ti++) {
    tierHeights.push(vaultRise * 0.15 + (ti / (TIERS - 1)) * vaultRise * 0.75);
  }

  for (let ti = 0; ti < TIERS; ti++) {
    const h = tierHeights[ti];
    const projDepth = 0.6 + rng() * 0.5;
    const profileH = 0.18 + rng() * 0.15;
    const dentilCount = 16 + Math.floor(rng() * 12);
    const corniceRadius = vaultSpan * 0.38 + projDepth;
    const isAccent = ti === TIERS - 1;

    corniceDefs.push({
      height: h,
      radius: corniceRadius,
      projDepth,
      profileH,
      dentilCount,
      accent: isAccent
    });
  }
}

const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const panelIdsArr = new Float32Array(N);
const localCoords = new Float32Array(N * 3);
const particleType = new Uint8Array(N); // 0=panel, 1=cornice

function populateAll() {
  const rng = makeRng(seed + 7);

  const silver = [0.72, 0.73, 0.74];
  const silverDark = [0.45, 0.46, 0.48];
  const copper = [0.72, 0.35, 0.18];
  const limestone = [0.82, 0.78, 0.7];
  const limeDark = [0.6, 0.56, 0.5];

  let idx = 0;

  /* Panel particles (vault ribs) */
  for (let p = 0; p < TOTAL_PANELS && idx < N - CORNICE_PARTICLES; p++) {
    const count = PARTICLES_PER_PANEL;
    const isAccent = panelDefs[p].accent;

    for (let k = 0; k < count && idx < N; k++) {
      particleType[idx] = 0;
      panelIdsArr[idx] = p;

      const face = rng();
      let fx = (rng() - 0.5) * PANEL_W;
      let fy = (rng() - 0.5) * PANEL_H;
      let fz = (rng() - 0.5) * PANEL_D;

      if (face < 0.4) fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      else if (face < 0.6) fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
      else if (face < 0.75) fy = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_H;

      if (rng() < 0.2) {
        fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
        fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      }

      localCoords[idx * 3] = fx;
      localCoords[idx * 3 + 1] = fy;
      localCoords[idx * 3 + 2] = fz;

      const shade = 0.85 + rng() * 0.15;
      if (isAccent) {
        colors[idx*3] = copper[0]*shade;
        colors[idx*3+1] = copper[1]*shade;
        colors[idx*3+2] = copper[2]*shade;
      } else {
        const base = rng() > 0.4 ? silver : silverDark;
        colors[idx*3] = base[0]*shade;
        colors[idx*3+1] = base[1]*shade;
        colors[idx*3+2] = base[2]*shade;
      }
      idx++;
    }
  }

  /* Cornice particles: projecting molding bands */
  const corniceStart = idx;
  const particlesPerTier = Math.floor(CORNICE_PARTICLES / TIERS);

  for (let ti = 0; ti < TIERS && idx < N; ti++) {
    const cd = corniceDefs[ti];
    const count = ti < TIERS - 1 ? particlesPerTier : N - idx;

    for (let k = 0; k < count && idx < N; k++) {
      particleType[idx] = 1;
      panelIdsArr[idx] = ti; // tier index

      const angle = rng() * Math.PI * 2;
      const profileT = rng();

      /* Classical cornice profile: cyma recta curve */
      let projOffset, yOffset;
      if (profileT < 0.3) {
        // Corona (main flat projection)
        projOffset = cd.projDepth * (0.6 + rng() * 0.4);
        yOffset = 0;
      } else if (profileT < 0.5) {
        // Cyma (S-curve top)
        const ct = (profileT - 0.3) / 0.2;
        projOffset = cd.projDepth * (1.0 - ct * 0.4);
        yOffset = cd.profileH * (0.5 + Math.sin(ct * Math.PI) * 0.3);
      } else if (profileT < 0.7) {
        // Dentil band
        const dentilAngle = angle * cd.dentilCount;
        const isDentil = Math.sin(dentilAngle) > 0.2;
        projOffset = cd.projDepth * (isDentil ? 0.8 : 0.4);
        yOffset = -cd.profileH * 0.4;
      } else {
        // Soffit (underside drip edge)
        projOffset = cd.projDepth * (0.5 + rng() * 0.5);
        yOffset = -cd.profileH * (0.6 + rng() * 0.3);
      }

      const r = cd.radius + projOffset * (0.8 + rng() * 0.4 - 0.2);
      const x = Math.cos(angle) * r;
      const z = Math.sin(angle) * r;
      const y = cd.height + yOffset;

      localCoords[idx*3] = x;
      localCoords[idx*3+1] = y;
      localCoords[idx*3+2] = z;

      positions[idx*3] = x;
      positions[idx*3+1] = y;
      positions[idx*3+2] = z;

      const shade = 0.8 + rng() * 0.2;
      if (cd.accent) {
        colors[idx*3] = copper[0]*shade*0.9;
        colors[idx*3+1] = copper[1]*shade*0.9;
        colors[idx*3+2] = copper[2]*shade*0.9;
      } else {
        const base = rng() > 0.5 ? limestone : limeDark;
        colors[idx*3] = base[0]*shade;
        colors[idx*3+1] = base[1]*shade;
        colors[idx*3+2] = base[2]*shade;
      }
      idx++;
    }
  }
}

function updatePositions(folds, time) {
  const v = new THREE.Vector3();
  const axis = new THREE.Vector3();
  const quat = new THREE.Quaternion();

  for (let i = 0; i < N; i++) {
    if (particleType[i] === 1) {
      /* Cornice particles: gentle radial breathing */
      const ti = panelIdsArr[i] | 0;
      const cd = corniceDefs[ti];
      const ox = localCoords[i*3];
      const oy = localCoords[i*3+1];
      const oz = localCoords[i*3+2];

      const angle = Math.atan2(oz, ox);
      const r = Math.sqrt(ox*ox + oz*oz);
      const breathe = Math.sin(time * 0.25 + ti * 1.2 + angle * 2.0) * 0.15;
      const newR = r + breathe;

      positions[i*3] = Math.cos(angle) * newR;
      positions[i*3+1] = oy + Math.sin(time * 0.18 + ti * 0.9) * 0.06;
      positions[i*3+2] = Math.sin(angle) * newR;
      continue;
    }

    const p = panelIdsArr[i] | 0;
    const def = panelDefs[p];

    v.set(localCoords[i*3], localCoords[i*3+1], localCoords[i*3+2]);

    const foldAngle = folds[p];
    axis.set(0, 1, 0);
    quat.setFromAxisAngle(axis, foldAngle);
    v.applyQuaternion(quat);

    const orientQuat = new THREE.Quaternion();
    orientQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), def.ribAngle);

    const normalQuat = new THREE.Quaternion();
    normalQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), def.hingeRot);

    orientQuat.multiply(normalQuat);
    v.applyQuaternion(orientQuat);

    v.x += def.basePos[0];
    v.y += def.basePos[1];
    v.z += def.basePos[2];

    positions[i*3] = v.x;
    positions[i*3+1] = v.y;
    positions[i*3+2] = v.z;
  }
}

seed = Math.floor(Math.random() * 1e9);
definePanels();
populateAll();
updatePositions(foldCurrents, 0);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDepth = -mv.z;
      gl_PointSize = uPixel * (2.2 + 13.0 / max(vDepth, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      float shade = clamp(1.0 - vDepth * 0.014, 0.35, 1.0);
      vec3 col = vColor * shade;

      float fogFactor = smoothstep(38.0, 75.0, vDepth);
      vec3 fogCol = vec3(0.102, 0.102, 0.102);
      col = mix(col, fogCol, fogFactor);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const cloud = new THREE.Points(geom, mat);
scene.add(cloud);

let azimuth = 0.4, elevation = 0.25, radius = 22;
let targetAz = azimuth, targetEl = elevation;
let isDragging = false, lastMx = 0, lastMy = 0;
let autoRotate = true;

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  isDragging = true;
  autoRotate = false;
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMx;
  const dy = e.clientY - lastMy;
  targetAz -= dx * 0.005;
  targetEl += dy * 0.005;
  targetEl = Math.max(-1.3, Math.min(1.3, targetEl));
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointerup', () => { isDragging = false; });

canvas.addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9);
  definePanels();
  populateAll();
  geom.attributes.color.needsUpdate = true;
  autoRotate = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = renderer.getPixelRatio();
});

function computeCentroid() {
  let cx = 0, cy = 0, cz = 0;
  const step = 50;
  let count = 0;
  for (let i = 0; i < N; i += step) {
    cx += positions[i*3];
    cy += positions[i*3+1];
    cz += positions[i*3+2];
    count++;
  }
  return new THREE.Vector3(cx/count, cy/count, cz/count);
}

const startTime = performance.now();
const lookTarget = new THREE.Vector3(0, 2.5, 0);

function loop() {
  const t = (performance.now() - startTime) / 1000;

  for (let i = 0; i < TOTAL_PANELS; i++) {
    const baseAngle = foldTargets[i];
    const breathe = Math.sin(t * 0.3 + i * 0.8) * 0.35;
    const harmonic = Math.sin(t * 0.12 + i * 1.3) * 0.15;
    const target = baseAngle + breathe + harmonic;
    foldCurrents[i] += (target - foldCurrents[i]) * 0.035;
  }

  updatePositions(foldCurrents, t);
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();

  if (autoRotate) {
    targetAz += 0.0015;
  }
  azimuth += (targetAz - azimuth) * 0.06;
  elevation += (targetEl - elevation) * 0.06;

  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.04);

  camera.position.set(
    lookTarget.x + radius * Math.cos(elevation) * Math.sin(azimuth),
    lookTarget.y + radius * Math.sin(elevation),
    lookTarget.z + radius * Math.cos(elevation) * Math.cos(azimuth)
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
