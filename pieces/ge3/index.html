<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);
scene.fog = new THREE.FogExp2(0x010208, 0.008);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x020208, 0.10));

const pL = new THREE.PointLight(0xd0e0ff, 0.28, 45, 1.8);
pL.position.set(-2.0, 16.0, 3.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0x0028a0, 0.06, 25, 2.2);
pL2.position.set(5.0, -6.0, -4.0);
scene.add(pL2);

let seed = 73915248;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 38, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — faded to the blue of distance, Klein's pigment on absence
const dressCenter = new THREE.Vector3(0.8, 0.0, 0.0);
const DRESS_TOP_Y = 4.2;
const DRESS_BOT_Y = -3.8;
const DRESS_HEIGHT = DRESS_TOP_Y - DRESS_BOT_Y;

const dressProfile = [];
const dressSteps = 20;
for(let i = 0; i <= dressSteps; i++){
  const t = i / dressSteps;
  const y = DRESS_TOP_Y - t * DRESS_HEIGHT;
  let r;
  if(t < 0.02) r = 0.02;
  else if(t < 0.08) r = 0.02 + (t - 0.02) * 6.0;
  else if(t < 0.18) r = 0.38 + (t - 0.08) * 0.5;
  else if(t < 0.35) r = 0.43 + (t - 0.18) * 1.8;
  else r = 0.73 + (t - 0.35) * 2.8;
  dressProfile.push(new THREE.Vector2(r, y));
}

const dressGeo = new THREE.LatheGeometry(dressProfile, 16);
const dressMat = new THREE.MeshStandardMaterial({
  color: 0xc8d8f0,
  emissive: 0x1a3a8a,
  emissiveIntensity: 0.45,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.28,
  side: THREE.DoubleSide
});
const dressMesh = new THREE.Mesh(dressGeo, dressMat);
dressMesh.position.copy(dressCenter);
scene.add(dressMesh);

const innerDressMat = new THREE.MeshBasicMaterial({
  color: 0x4060c0,
  transparent: true,
  opacity: 0.10,
  side: THREE.DoubleSide
});
const innerDress = new THREE.Mesh(
  new THREE.LatheGeometry(dressProfile.map(p => new THREE.Vector2(p.x * 0.85, p.y)), 12),
  innerDressMat
);
innerDress.position.copy(dressCenter);
scene.add(innerDress);

// Suspension wires
const suspGeo = new THREE.BufferGeometry();
const hangerY = dressCenter.y + DRESS_TOP_Y;
const suspPts = new Float32Array([
  dressCenter.x, hh, dressCenter.z + 0.1,
  dressCenter.x, hangerY, dressCenter.z,
  dressCenter.x - 0.25, hh, dressCenter.z - 0.15,
  dressCenter.x - 0.1, hangerY, dressCenter.z + 0.02,
  dressCenter.x + 0.3, hh, dressCenter.z + 0.2,
  dressCenter.x + 0.08, hangerY, dressCenter.z - 0.03,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x030308, transparent: true, opacity: 0.5
})));

function dressSurf(){
  const t = rng();
  const y = DRESS_TOP_Y - t * DRESS_HEIGHT;
  let r;
  if(t < 0.02) r = 0.02;
  else if(t < 0.08) r = 0.02 + (t - 0.02) * 6.0;
  else if(t < 0.18) r = 0.38 + (t - 0.08) * 0.5;
  else if(t < 0.35) r = 0.43 + (t - 0.18) * 1.8;
  else r = 0.73 + (t - 0.35) * 2.8;
  r += (rng() - 0.5) * 0.15;
  const th = rng() * Math.PI * 2;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(th) * r,
    dressCenter.y + y,
    dressCenter.z + Math.sin(th) * r
  );
}

const dressCentroid = new THREE.Vector3(
  dressCenter.x,
  dressCenter.y + (DRESS_TOP_Y + DRESS_BOT_Y) * 0.5,
  dressCenter.z
);

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS
const NUM_ANCHORS = 750;
const anchors = [];

const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [2.8, 5.5, 9.0, 14.0, 20.0];
const ptsPerShell = [40, 55, 70, 65, 50];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    const jx = (rng()-0.5)*0.7;
    const jy = (rng()-0.5)*0.7;
    const jz = (rng()-0.5)*0.7;
    anchors.push(new THREE.Vector3(
      dressCentroid.x + r * Math.cos(th) * R + jx,
      dressCentroid.y + y * R + jy,
      dressCentroid.z + r * Math.sin(th) * R + jz
    ));
  }
}

while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.55 ? wallPt() : wallPt().lerp(dressCentroid, 0.15 + rng()*0.45);
  anchors.push(p);
}

const voids = [
  { pos: new THREE.Vector3(dressCentroid.x - 8, dressCentroid.y + 5, dressCentroid.z + 7), r: 3.0 },
  { pos: new THREE.Vector3(dressCentroid.x + 6, dressCentroid.y - 6, dressCentroid.z - 8), r: 2.6 },
  { pos: new THREE.Vector3(dressCentroid.x + 9, dressCentroid.y + 9, dressCentroid.z + 4), r: 2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — azure filaments, lapis-lazuli veins through the installation
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
// Per-line blue hue variation: closer threads are brighter ultramarine, distant ones darken
const lineHue = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-dressCentroid.x, dy = my-dressCentroid.y, dz = mz-dressCentroid.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  lineHue[li] = rng();
  li++;
}

// Category A: Convergence threads
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.30){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  if(rng() < 0.12){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.15 + rng()*1.5));
    setLine(a, target);
  } else {
    setLine(a, dressSurf());
  }
}

// Category B: Anchor-to-anchor structural web
const THRESHOLD = 6.5;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.24);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 120000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  catBcount++;

  if(rng() < 0.20 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.15 + rng()*0.55);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.25 + rng()*0.9));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      catBcount++;
      if(rng() < 0.30 && li < NUM_LINES - 1){
        const mid2 = mid.clone().lerp(bEnd, 0.4 + rng()*0.35);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.12 + rng()*0.45));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          catBcount++;
          if(rng() < 0.15 && li < NUM_LINES){
            const mid3 = mid2.clone().lerp(bEnd2, 0.5);
            const bDir3 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
            const bEnd3 = mid3.clone().add(bDir3.multiplyScalar(0.08 + rng()*0.25));
            if(!inVoid(bEnd3)){
              setLine(mid3, bEnd3);
              catBcount++;
            }
          }
        }
      }
    }
  }
}

// Category C: Dense halo threads
const catC = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = dressSurf();
  const dir1 = s1.clone().sub(dressCentroid).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.2 + rng()*2.5));
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.2 + rng()*2.5)).add(tangent.multiplyScalar(0.8 + rng()*2.0));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB);
}

// Category D: Vertical threads
const catD = Math.floor(NUM_LINES * 0.04);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const hemPt = dressSurf();
  hemPt.y = dressCenter.y + DRESS_BOT_Y + (rng() - 0.5) * 1.0;
  const hemR = 0.73 + (1.0 - 0.35) * 2.8 + (rng() - 0.5) * 0.3;
  const th = rng() * Math.PI * 2;
  hemPt.x = dressCenter.x + Math.cos(th) * hemR;
  hemPt.z = dressCenter.z + Math.sin(th) * hemR;
  const floorPt = new THREE.Vector3(
    hemPt.x + (rng()-0.5)*2.0,
    -hh,
    hemPt.z + (rng()-0.5)*2.0
  );
  if(!inVoid(hemPt)) setLine(hemPt, floorPt);
}

// Category E: Long wall-spanning threads
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.45 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

// ── TWO-TONE AZURE THREAD SYSTEM — ultramarine core, pale cerulean periphery
// Use two line meshes: deep threads and bright threads, split by distance
const deepPositions = new Float32Array(NUM_LINES * 6);
const palePositions = new Float32Array(NUM_LINES * 6);
let deepCount = 0, paleCount = 0;

for(let i = 0; i < li; i++){
  const idx = i * 6;
  const dist = lineDist[i];
  // Threads near dress: deep ultramarine; far threads: paler cerulean
  if(dist < 8.0){
    const di = deepCount * 6;
    for(let k = 0; k < 6; k++) deepPositions[di+k] = positions[idx+k];
    deepCount++;
  } else {
    const pi = paleCount * 6;
    for(let k = 0; k < 6; k++) palePositions[pi+k] = positions[idx+k];
    paleCount++;
  }
}

const deepGeo = new THREE.BufferGeometry();
deepGeo.setAttribute('position', new THREE.BufferAttribute(deepPositions.slice(0, deepCount*6), 3));
const deepThreads = new THREE.LineSegments(deepGeo, new THREE.LineBasicMaterial({
  color: 0x0a2090,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(deepThreads);

const paleGeo = new THREE.BufferGeometry();
paleGeo.setAttribute('position', new THREE.BufferAttribute(palePositions.slice(0, paleCount*6), 3));
const paleThreads = new THREE.LineSegments(paleGeo, new THREE.LineBasicMaterial({
  color: 0x3868c8,
  transparent: true,
  opacity: 0.045,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(paleThreads);

// Also keep a full-set geometry for breathing animation
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── DARK FRAGMENTS — indigo-black shards, lapis pigment flakes
const NUM_FRAGMENTS = 45;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.14;
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.25 + rng()*0.55);
  const h = sz * (0.6 + rng()*1.0);
  const verts = new Float32Array([
    w*(-0.35+rng()*0.3), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.15), 0,
    w*(0.05-rng()*0.35), -h*0.5, 0,
    w*(-0.35+rng()*0.3), h*0.5, 0,
    w*(0.3+rng()*0.3), h*(rng()*0.1), 0,
    w*(0.05-rng()*0.35), -h*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  // Indigo-black fragments instead of charred brown
  const d = 0.005 + rng()*0.015;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d*0.08, d*0.15, d),
    transparent: true,
    opacity: 0.10 + rng()*0.35,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  if(rng() < 0.55){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCentroid).add(dir.multiplyScalar(1.5 + rng()*9.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH
const pathLen = 800;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCentroid.x, cy = dressCentroid.y, cz = dressCentroid.z;
  const rX = 4.5 + Math.sin(p * 0.5) * 1.8 + Math.sin(p * 1.7 + 1.2) * 0.5;
  const rZ = 6.5 + Math.cos(p * 0.6) * 2.2 + Math.cos(p * 0.3 + 2.0) * 0.8;
  const x = cx + Math.sin(p) * rX;
  const yBase = cy + 1.0;
  const yWave = Math.sin(p * 0.4 + 0.5) * 5.5 + Math.cos(p * 0.9 + 1.2) * 1.2;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0006 * Math.max(0, 1.0 - dist / 28.0);
    const phase = basePositions[idx]*0.25 + basePositions[idx+1]*0.3 + i*0.0012;
    const breath = Math.sin(t*0.025 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.3;
      arr[vi+1] = basePositions[vi+1] + breath*0.25;
      arr[vi+2] = basePositions[vi+2] + breath*0.28;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Copy breathing into split geometries
  const dArr = deepGeo.attributes.position.array;
  const pArr = paleGeo.attributes.position.array;
  let di = 0, pi = 0;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    if(dist < 8.0){
      const off = di * 6;
      for(let k = 0; k < 6; k++) dArr[off+k] = arr[idx+k];
      di++;
    } else {
      const off = pi * 6;
      for(let k = 0; k < 6; k++) pArr[off+k] = arr[idx+k];
      pi++;
    }
  }
  deepGeo.attributes.position.needsUpdate = true;
  paleGeo.attributes.position.needsUpdate = true;

  // Dress micro-sway
  dressMesh.rotation.z = Math.sin(t * 0.008) * 0.003;
  dressMesh.rotation.x = Math.cos(t * 0.006) * 0.002;
  innerDress.rotation.z = dressMesh.rotation.z;
  innerDress.rotation.x = dressMesh.rotation.x;

  // Glacial camera drift
  const speed = 0.0008;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = dressCentroid.clone();
  look.x += Math.sin(t*0.003)*0.15;
  look.y += Math.cos(t*0.0025)*0.12;
  look.z += Math.sin(t*0.003)*0.1;
  camera.lookAt(look);

  // Light drift
  pL.position.x = -2.0 + Math.sin(t*0.0015)*0.5;
  pL.position.y = 16.0 + Math.cos(t*0.0012)*0.25;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

(function(){

  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
