<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x52 · cellular forms · Andy Lomas</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">x52</div>
<div class="hint" id="hint">morphogenetic growth · cell division in progress</div>
<div class="src">Andy Lomas · Cellular Forms 2014</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a0a, 35, 80);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(28, 18, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

// Cellular growth data structures
const MAX_CELLS = 18000;
let cellCount = 250;
const positions = new Float32Array(MAX_CELLS * 3);
const radii = new Float32Array(MAX_CELLS);
const nutrients = new Float32Array(MAX_CELLS);
const ages = new Float32Array(MAX_CELLS);
const neighbors = []; // array of arrays

// Initialize seed cluster
const seedRadius = 1.2;
for (let i = 0; i < cellCount; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = seedRadius * Math.pow(Math.random(), 0.33);
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  radii[i] = 0.22 + Math.random() * 0.08;
  nutrients[i] = Math.random() * 0.3;
  ages[i] = 0;
  neighbors[i] = [];
}

// Build initial neighbor graph (6-8 nearest)
function rebuildNeighbors(){
  const MAX_NEIGHBORS = 8;
  const SEARCH_RADIUS = 2.5;
  
  for (let i = 0; i < cellCount; i++){
    neighbors[i] = [];
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    const dists = [];
    for (let j = 0; j < cellCount; j++){
      if (i === j) continue;
      const dx = positions[j*3] - px;
      const dy = positions[j*3+1] - py;
      const dz = positions[j*3+2] - pz;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < SEARCH_RADIUS){
        dists.push({idx: j, dist: d});
      }
    }
    dists.sort((a,b) => a.dist - b.dist);
    for (let k = 0; k < Math.min(MAX_NEIGHBORS, dists.length); k++){
      neighbors[i].push(dists[k].idx);
    }
  }
}
rebuildNeighbors();

// Instanced sphere geometry
const cellGeom = new THREE.IcosahedronGeometry(1, 2);
const cellMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uLightDir: { value: new THREE.Vector3(0.6, 0.8, 0.5).normalize() },
    uFogColor: { value: new THREE.Color(0x0a0a0a) },
    uFogNear: { value: 35 },
    uFogFar: { value: 80 }
  },
  vertexShader: `
    uniform float uTime;
    uniform vec3 uLightDir;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    varying float vAge;
    attribute float age;
    
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
      vViewPos = mvPos.xyz;
      vAge = age;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uLightDir;
    uniform vec3 uFogColor;
    uniform float uFogNear;
    uniform float uFogFar;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    varying float vAge;
    
    void main(){
      vec3 N = normalize(vNormal);
      
      // Lambertian + slight rim
      float NdotL = max(0.0, dot(N, uLightDir));
      float rim = pow(1.0 - abs(dot(N, normalize(-vViewPos))), 2.5);
      
      // Cheap ambient occlusion via vertical position bias
      float ao = 0.65 + 0.35 * smoothstep(-6.0, 2.0, vViewPos.y);
      
      // Base color: matte bone white with faint pink subsurface
      vec3 baseCol = vec3(0.92, 0.88, 0.86);
      vec3 subsurface = vec3(0.96, 0.82, 0.78);
      vec3 col = mix(baseCol, subsurface, smoothstep(0.2, 0.6, NdotL) * 0.18);
      
      // Shading
      float light = 0.25 + 0.6 * NdotL + 0.15 * rim;
      col *= light * ao;
      
      // Young cells slightly brighter
      col *= 1.0 + 0.12 * smoothstep(10.0, 0.0, vAge);
      
      // Fog
      float depth = length(vViewPos);
      float fogFactor = smoothstep(uFogNear, uFogFar, depth);
      col = mix(col, uFogColor, fogFactor);
      
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const cells = new THREE.InstancedMesh(cellGeom, cellMat, MAX_CELLS);
cells.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
cells.count = cellCount;

// Set initial instance transforms
const dummy = new THREE.Object3D();
for (let i = 0; i < cellCount; i++){
  dummy.position.set(positions[i*3], positions[i*3+1], positions[i*3+2]);
  dummy.scale.setScalar(radii[i]);
  dummy.updateMatrix();
  cells.setMatrixAt(i, dummy.matrix);
}
cells.instanceMatrix.needsUpdate = true;

// Add age attribute
const ageAttr = new THREE.InstancedBufferAttribute(ages, 1);
ageAttr.setUsage(THREE.DynamicDrawUsage);
cellGeom.setAttribute('age', ageAttr);

scene.add(cells);

// Raking light
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(12, 18, 8);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Morphogenesis step
const NUTRIENT_FLOW = 0.08;
const SPLIT_THRESHOLD = 1.8;
const SPRING_K = 0.12;
const DAMPING = 0.88;
const REST_LENGTH = 0.8;
const REPULSION_DIST = 0.6;
const REPULSION_K = 0.25;

const forces = new Float32Array(MAX_CELLS * 3);

function morphogenesisStep(dt){
  if (cellCount >= MAX_CELLS - 10) return;
  
  // Clear forces
  forces.fill(0);
  
  // Spring forces between neighbors
  for (let i = 0; i < cellCount; i++){
    for (const j of neighbors[i]){
      const dx = positions[j*3] - positions[i*3];
      const dy = positions[j*3+1] - positions[i*3+1];
      const dz = positions[j*3+2] - positions[i*3+2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < 0.01) continue;
      
      const stretch = dist - REST_LENGTH * (radii[i] + radii[j]);
      const force = stretch * SPRING_K;
      
      forces[i*3]   += (dx / dist) * force;
      forces[i*3+1] += (dy / dist) * force;
      forces[i*3+2] += (dz / dist) * force;
    }
  }
  
  // Repulsion between non-neighbors
  for (let i = 0; i < cellCount; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    for (let j = i + 1; j < cellCount; j++){
      if (neighbors[i].includes(j)) continue;
      
      const dx = positions[j*3] - px;
      const dy = positions[j*3+1] - py;
      const dz = positions[j*3+2] - pz;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      
      const minDist = (radii[i] + radii[j]) * REPULSION_DIST;
      if (dist < minDist && dist > 0.01){
        const force = ((minDist - dist) / minDist) * REPULSION_K;
        const fx = (dx / dist) * force;
        const fy = (dy / dist) * force;
        const fz = (dz / dist) * force;
        
        forces[i*3]   -= fx;
        forces[i*3+1] -= fy;
        forces[i*3+2] -= fz;
        forces[j*3]   += fx;
        forces[j*3+1] += fy;
        forces[j*3+2] += fz;
      }
    }
  }
  
  // Update positions
  for (let i = 0; i < cellCount; i++){
    positions[i*3]   += forces[i*3] * dt;
    positions[i*3+1] += forces[i*3+1] * dt;
    positions[i*3+2] += forces[i*3+2] * dt;
    
    // Damping
    forces[i*3]   *= DAMPING;
    forces[i*3+1] *= DAMPING;
    forces[i*3+2] *= DAMPING;
  }
  
  // Nutrient accumulation
  for (let i = 0; i < cellCount; i++){
    // Nutrient flows from neighbors
    let inflow = 0;
    for (const j of neighbors[i]){
      const diff = nutrients[j] - nutrients[i];
      inflow += diff * NUTRIENT_FLOW;
    }
    nutrients[i] += inflow * dt;
    
    // Environmental input (surface cells get more)
    const isExposed = neighbors[i].length < 7;
    if (isExposed){
      nutrients[i] += 0.025 * dt;
    }
    
    ages[i] += dt;
  }
  
  // Cell division
  const toSplit = [];
  for (let i = 0; i < cellCount; i++){
    if (nutrients[i] > SPLIT_THRESHOLD){
      toSplit.push(i);
    }
  }
  
  for (const parent of toSplit){
    if (cellCount >= MAX_CELLS - 1) break;
    
    // Create daughter cell
    const daughter = cellCount;
    cellCount++;
    
    // Split nutrient
    nutrients[parent] *= 0.5;
    nutrients[daughter] = nutrients[parent];
    
    // Place daughter slightly offset
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    const offset = (radii[parent] + 0.3) * 0.8;
    positions[daughter*3]   = positions[parent*3]   + offset * Math.sin(phi) * Math.cos(theta);
    positions[daughter*3+1] = positions[parent*3+1] + offset * Math.sin(phi) * Math.sin(theta);
    positions[daughter*3+2] = positions[parent*3+2] + offset * Math.cos(phi);
    
    radii[daughter] = radii[parent] * (0.85 + Math.random() * 0.15);
    ages[daughter] = 0;
    neighbors[daughter] = [];
    
    // Rewire neighbors
    neighbors[parent].push(daughter);
    neighbors[daughter].push(parent);
    
    // Daughter inherits some parent neighbors
    const inherited = neighbors[parent].slice(0, 3);
    for (const n of inherited){
      if (!neighbors[daughter].includes(n)){
        neighbors[daughter].push(n);
      }
      if (!neighbors[n].includes(daughter)){
        neighbors[n].push(daughter);
      }
    }
  }
  
  // Periodic neighbor rebuild for new cells
  if (toSplit.length > 0 && cellCount % 50 === 0){
    rebuildNeighbors();
  }
}

// Update instance matrices
function updateInstances(){
  for (let i = 0; i < cellCount; i++){
    dummy.position.set(positions[i*3], positions[i*3+1], positions[i*3+2]);
    dummy.scale.setScalar(radii[i]);
    dummy.updateMatrix();
    cells.setMatrixAt(i, dummy.matrix);
  }
  cells.count = cellCount;
  cells.instanceMatrix.needsUpdate = true;
  ageAttr.array = ages;
  ageAttr.needsUpdate = true;
}

// Camera tracks centroid and orbits
const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < cellCount; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / cellCount);
  
  // Compute form radius
  let maxDist = 0;
  for (let i = 0; i < cellCount; i++){
    const dx = positions[i*3] - centroid.x;
    const dy = positions[i*3+1] - centroid.y;
    const dz = positions[i*3+2] - centroid.z;
    maxDist = Math.max(maxDist, Math.sqrt(dx*dx + dy*dy + dz*dz));
  }
  
  const orbitRadius = Math.max(18, maxDist * 2.8);
  const t = performance.now() * 0.00006;
  camera.position.x = centroid.x + Math.cos(t) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(t) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(t * 0.4) * orbitRadius * 0.4 + orbitRadius * 0.3;
  camera.lookAt(centroid);
}

let lastTime = performance.now();
const start = performance.now();
const hintEl = document.getElementById('hint');
let frameCount = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  const t = (now - start) / 1000;
  
  frameCount++;
  
  // Run morphogenesis multiple substeps per frame
  for (let i = 0; i < 3; i++){
    morphogenesisStep(dt / 3);
  }
  
  updateInstances();
  updateCamera();
  
  cellMat.uniforms.uTime.value = t;
  
  if (frameCount % 30 === 0){
    const progress = ((cellCount / MAX_CELLS) * 100).toFixed(1);
    hintEl.textContent = `${cellCount} cells · ${progress}% capacity · growth via division`;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
