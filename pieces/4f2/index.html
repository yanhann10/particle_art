<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4f2 · hilbert calyx × dadras (d0i × 9nt)</title>
<!-- MOTION: orbit, intensity: gentle -->
<!-- CROSS-POLLINATE: d0i calyx substrate + Hilbert space-filling curve on surface; 9nt dadras attractor ghost layer -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a08; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">4f2</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0a08, 0.007);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 26);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a08, 1);
document.body.appendChild(renderer.domElement);

// ── Orbit controls ────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.3;
controls.target.set(0, 3, 0);
controls.update();

// ── Calyx substrate points (Riley interference → cup) ─────────────────────────
const N_SUBSTRATE = 40000;
const substrateGeom = new THREE.BufferGeometry();
const substratePositions = new Float32Array(N_SUBSTRATE * 3);

let seed = Math.floor(Math.random() * 1e9) >>> 0;
function rng() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

const rows = 120, cols = 120;
const width = 24, height = 24;
const cellW = width / cols, cellH = height / rows;
const petals = 5;
const cupDepth = 4.5;
const rowFreq = 1.1, colFreq = 0.95;

let idx = 0;
for (let i = 0; i < rows && idx < N_SUBSTRATE; i++) {
  for (let j = 0; j < cols && idx < N_SUBSTRATE; j++) {
    const pointsPerCell = Math.floor(N_SUBSTRATE / (rows * cols));
    for (let k = 0; k < pointsPerCell && idx < N_SUBSTRATE; k++) {
      const gx = (j + rng() - 0.5) * cellW - width * 0.5;
      const gy = (i + rng() - 0.5) * cellH - height * 0.5;

      const r = Math.sqrt(gx * gx + gy * gy);
      const maxR = 12.0;
      const nr = Math.min(r / maxR, 1.0);
      const theta = Math.atan2(gy, gx);

      const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
      const cupProfile = cupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      const flare = 1.0 + 0.2 * nr * nr;

      const rowWave = Math.sin(gy * rowFreq) * 0.4;
      const colWave = Math.sin(gx * colFreq) * 0.4;

      substratePositions[idx * 3]     = gx * flare + rowWave * 0.3;
      substratePositions[idx * 3 + 1] = gy * flare + colWave * 0.3;
      substratePositions[idx * 3 + 2] = cupProfile;
      idx++;
    }
  }
}

substrateGeom.setAttribute('position', new THREE.BufferAttribute(substratePositions, 3));

const substrateMat = new THREE.PointsMaterial({
  color: 0x2a2318,
  size: 0.09,
  transparent: true,
  opacity: 0.28,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

scene.add(new THREE.Points(substrateGeom, substrateMat));

// ── 3D Hilbert curve (order 3 → 512 points) ───────────────────────────────────
function d2xyz(n, d) {
  let rx, ry, rz, s, t = d;
  let x = 0, y = 0, z = 0;
  for (s = 1; s < n; s *= 2) {
    rx = 1 & Math.floor(t / 2);
    ry = 1 & (t ^ rx);
    rz = 1 & Math.floor(t / 4);
    // rotate
    if (ry === 0) {
      if (rx === 1) { x = s - 1 - x; y = s - 1 - y; }
      let tmp = x; x = y; y = tmp;
    }
    if (rz === 1) { x = s - 1 - x; z = s - 1 - z; }
    x += s * rx; y += s * ry; z += s * rz;
    t = Math.floor(t / 8);
  }
  return [x / (n - 1) * 2 - 1, y / (n - 1) * 2 - 1, z / (n - 1) * 2 - 1];
}

function hilbert3D(order) {
  const n = Math.pow(2, order); // side length (8 for order=3)
  const total = Math.pow(8, order); // 512 points
  const pts = [];
  for (let i = 0; i < total; i++) {
    pts.push(d2xyz(n, i));
  }
  return pts;
}

// Generate Hilbert curve and project onto calyx surface
const hilbertPts = hilbert3D(3); // 512 points in [-1,1]^3

// Map each Hilbert point onto the calyx surface:
// Use (hx, hy) as 2D polar coords scaled to calyx domain, then compute z from calyx profile
const maxR_calyx = 11.0; // use slightly inside rim for visibility

const hilbertPositions = [];
for (const [hx, hy, hz] of hilbertPts) {
  // hx, hy in [-1,1] → scale to calyx XY footprint
  const gx = hx * maxR_calyx;
  const gy = hy * maxR_calyx;

  const r = Math.sqrt(gx * gx + gy * gy);
  const maxR = 12.0;
  const nr = Math.min(r / maxR, 1.0);
  const theta = Math.atan2(gy, gx);

  const petalShape = 0.5 + 0.5 * Math.cos(theta * petals);
  const cupProfile = cupDepth * nr * nr * (0.6 + 0.4 * petalShape);
  const flare = 1.0 + 0.2 * nr * nr;

  // Lift slightly above calyx surface, modulated by hz (the Hilbert z component)
  // so the curve floats as a 3D ribbon over the cup
  const liftAmt = 0.3 + 0.5 * (hz + 1) * 0.5; // 0.3..0.8 above surface

  hilbertPositions.push(
    gx * flare,
    gy * flare,
    cupProfile + liftAmt
  );
}

// Build Hilbert curve as Points (large dots along the path)
const hilbertGeom = new THREE.BufferGeometry();
hilbertGeom.setAttribute('position',
  new THREE.Float32BufferAttribute(hilbertPositions, 3));

const hilbertMat = new THREE.PointsMaterial({
  color: 0xdca564,   // warm amber bright rgb(220,165,100)
  size: 0.32,
  transparent: true,
  opacity: 0.92,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true
});

scene.add(new THREE.Points(hilbertGeom, hilbertMat));

// Also draw connecting line to reinforce the space-filling path
const hilbertLineMat = new THREE.LineBasicMaterial({
  color: 0xdca564,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending
});
const hilbertLineGeom = new THREE.BufferGeometry();
hilbertLineGeom.setAttribute('position',
  new THREE.Float32BufferAttribute(hilbertPositions, 3));
scene.add(new THREE.Line(hilbertLineGeom, hilbertLineMat));

// ── Dadras attractor ghost layer (from 9nt) ────────────────────────────────────
const N_DADRAS = 80000;
const DT = 0.003;
const P = 3, Q = 2.7, R = 1.7, C = 2, E = 9;

const dadrasPositions = new Float32Array(N_DADRAS * 3);
const dadrasColors    = new Float32Array(N_DADRAS * 3);

// Warm-up
let dx = 0, dy = 0, dz = 0;
let ax = 1.0, ay = -2.0, az = 1.5;
for (let i = 0; i < 10000; i++) {
  dx = ay - P*ax + Q*ay*az;
  dy = R*ay - ax*az + az;
  dz = C*ax*ay - E*az;
  ax += dx * DT; ay += dy * DT; az += dz * DT;
  if (!isFinite(ax) || Math.abs(ax) > 100) { ax=1.0; ay=-2.0; az=1.5; }
}

// Collect trajectory
const traj = new Float32Array(N_DADRAS * 3);
let zMin = Infinity, zMax = -Infinity;
for (let i = 0; i < N_DADRAS; i++) {
  dx = ay - P*ax + Q*ay*az;
  dy = R*ay - ax*az + az;
  dz = C*ax*ay - E*az;
  const nx = ax + dx*DT, ny = ay + dy*DT, nz = az + dz*DT;
  if (isFinite(nx) && isFinite(ny) && isFinite(nz) &&
      Math.abs(nx) < 50 && Math.abs(ny) < 50 && Math.abs(nz) < 50) {
    ax = nx; ay = ny; az = nz;
  } else {
    ax = 1.0 + (Math.random()-0.5)*0.5;
    ay = -2.0 + (Math.random()-0.5)*0.5;
    az = 1.5 + (Math.random()-0.5)*0.5;
  }
  traj[i*3] = ax; traj[i*3+1] = ay; traj[i*3+2] = az;
  if (isFinite(az)) { if (az < zMin) zMin = az; if (az > zMax) zMax = az; }
}
const zRange = zMax - zMin || 1.0;

// Centroid
let cx = 0, cy = 0, cz = 0;
for (let i = 0; i < N_DADRAS; i++) { cx += traj[i*3]; cy += traj[i*3+1]; cz += traj[i*3+2]; }
cx /= N_DADRAS; cy /= N_DADRAS; cz /= N_DADRAS;

// Scale & translate: divide by 4 (fit calyx scale), then offset up by 6
const DADRAS_SCALE = 4.0;
const DADRAS_Y_OFFSET = 6.0;

for (let i = 0; i < N_DADRAS; i++) {
  dadrasPositions[i*3]   = (traj[i*3]   - cx) / DADRAS_SCALE;
  dadrasPositions[i*3+1] = (traj[i*3+1] - cy) / DADRAS_SCALE;
  dadrasPositions[i*3+2] = (traj[i*3+2] - cz) / DADRAS_SCALE + DADRAS_Y_OFFSET;

  // Salmon-rose palette: #e06050 = rgb(0.878, 0.376, 0.314)
  const tz = (traj[i*3+2] - zMin) / zRange; // 0..1
  const bright = 0.28 + 0.72 * tz;
  dadrasColors[i*3]   = 0.878 * bright;
  dadrasColors[i*3+1] = 0.376 * bright;
  dadrasColors[i*3+2] = 0.314 * bright;
}

const dadrasGeo = new THREE.BufferGeometry();
dadrasGeo.setAttribute('position', new THREE.BufferAttribute(dadrasPositions, 3));
dadrasGeo.setAttribute('color',    new THREE.BufferAttribute(dadrasColors, 3));

const dadrasMat = new THREE.PointsMaterial({
  size: 0.18,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  transparent: true,
  depthWrite: false,
  sizeAttenuation: true
});

scene.add(new THREE.Points(dadrasGeo, dadrasMat));

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
