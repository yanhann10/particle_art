<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c6s · Shiota — Red Room (Cocoon)</title>
<!-- MOTION: gather, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">c6s</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040101, 0.006);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.03));

const pL = new THREE.PointLight(0xffe8d0, 0.07, 40, 1.6);
pL.position.set(1, 12, -2);
scene.add(pL);

let seed = 41927058;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — tighter than parent, more claustrophobic
const ROOM = { w: 32, h: 28, d: 36 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED EGG — a held breath, a stone worn smooth by a river
// Slightly elongated vertically — more organic than a perfect sphere
const eggCenter = new THREE.Vector3(0.6, 0.8, -0.3);
const EGG_RX = 1.4, EGG_RY = 1.9, EGG_RZ = 1.35;

const eggMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dd,
  emissive: 0xede4d6,
  emissiveIntensity: 0.6,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.38
});
const eggGeo = new THREE.SphereGeometry(1, 24, 16);
// Scale to egg shape
const egg = new THREE.Mesh(eggGeo, eggMat);
egg.scale.set(EGG_RX, EGG_RY, EGG_RZ);
egg.position.copy(eggCenter);
scene.add(egg);

// Inner luminance
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf8f2, transparent: true, opacity: 0.04 })
);
innerGlow.scale.set(EGG_RX, EGG_RY, EGG_RZ);
innerGlow.position.copy(eggCenter);
scene.add(innerGlow);

// Suspension threads — 4 fine lines from ceiling
const suspPts = [];
for(let i = 0; i < 4; i++){
  const ox = (rng()-0.5)*0.2, oz = (rng()-0.5)*0.2;
  suspPts.push(
    eggCenter.x + ox, hh, eggCenter.z + oz,
    eggCenter.x + ox*0.03, eggCenter.y + EGG_RY + 0.03, eggCenter.z + oz*0.03
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.45
})));

// ── EGG SURFACE SAMPLER (ellipsoid)
function eggSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    eggCenter.x + Math.sin(phi)*Math.cos(theta) * EGG_RX,
    eggCenter.y + Math.cos(phi) * EGG_RY,
    eggCenter.z + Math.sin(phi)*Math.sin(theta) * EGG_RZ
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR LATTICE — concentric ellipsoidal shells
// Based on icosahedron vertices projected onto ellipsoidal shells
const anchors = [];
const icoVerts = [];
for(let i = 0; i < 12; i++){
  const lat = (i === 0) ? Math.PI/2 : (i === 11) ? -Math.PI/2 :
    ((i <= 5) ? Math.atan(0.5) : -Math.atan(0.5));
  const lon = (i === 0 || i === 11) ? 0 :
    ((i <= 5) ? (i-1)*2*Math.PI/5 : (i-6)*2*Math.PI/5 + Math.PI/5);
  icoVerts.push(new THREE.Vector3(
    Math.cos(lat)*Math.cos(lon), Math.sin(lat), Math.cos(lat)*Math.sin(lon)
  ));
}

// Edge midpoints
const edgeMids = [];
for(let i = 0; i < icoVerts.length; i++){
  for(let j = i+1; j < icoVerts.length; j++){
    if(icoVerts[i].distanceTo(icoVerts[j]) < 1.2){
      edgeMids.push(icoVerts[i].clone().add(icoVerts[j]).multiplyScalar(0.5).normalize());
    }
  }
}

// Ellipsoidal shells — stretched vertically to match egg
const shells = [3.0, 5.0, 8.0, 12.0, 17.0, 22.0];
for(const R of shells){
  const jitter = R * 0.035;
  for(const v of icoVerts){
    anchors.push(new THREE.Vector3(
      eggCenter.x + v.x*R*0.9 + (rng()-0.5)*jitter,
      eggCenter.y + v.y*R*1.1 + (rng()-0.5)*jitter,
      eggCenter.z + v.z*R*0.9 + (rng()-0.5)*jitter
    ));
  }
  for(const m of edgeMids){
    anchors.push(new THREE.Vector3(
      eggCenter.x + m.x*R*0.9 + (rng()-0.5)*jitter,
      eggCenter.y + m.y*R*1.1 + (rng()-0.5)*jitter,
      eggCenter.z + m.z*R*0.9 + (rng()-0.5)*jitter
    ));
  }
}

// Wall-biased anchors — the web must touch the architecture
while(anchors.length < 600){
  const p = rng() < 0.35 ? wallPt() : wallPt().lerp(eggCenter, 0.05 + rng()*0.2);
  anchors.push(p);
}

// ── VOID ZONES — breathing holes in the web, deliberate negative space
const voids = [
  { pos: new THREE.Vector3(eggCenter.x - 5, eggCenter.y + 7, eggCenter.z + 5), r: 2.4 },
  { pos: new THREE.Vector3(eggCenter.x + 6, eggCenter.y - 5, eggCenter.z - 6), r: 2.1 },
  { pos: new THREE.Vector3(eggCenter.x + 3, eggCenter.y + 10, eggCenter.z + 3), r: 1.8 },
  { pos: new THREE.Vector3(eggCenter.x - 4, eggCenter.y - 3, eggCenter.z + 8), r: 2.0 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── ANGULAR QUANTIZATION — order near the egg, dissolution at walls
const QUANT = Math.PI / 12;
function quantize(pt){
  const dx = pt.x - eggCenter.x, dz = pt.z - eggCenter.z;
  const d = Math.sqrt(dx*dx + dz*dz);
  if(d > 5.0 || d < 0.1) return pt;
  const blend = Math.max(0, 1.0 - d / 5.0);
  const ang = Math.atan2(dz, dx);
  const qAng = Math.round(ang / QUANT) * QUANT;
  const lAng = ang + (qAng - ang) * blend * 0.55;
  return new THREE.Vector3(
    eggCenter.x + Math.cos(lAng) * d, pt.y,
    eggCenter.z + Math.sin(lAng) * d
  );
}

// ── BUILD THREADS — two rules only (Casey Reas simplification):
// Rule 1: anchor-to-nearest-egg-surface
// Rule 2: anchor-to-anchor-if-within-threshold
// Plus drape threads for gravity
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const qa = quantize(a);
  const qb = quantize(b);
  const idx = li * 6;
  positions[idx]=qa.x; positions[idx+1]=qa.y; positions[idx+2]=qa.z;
  positions[idx+3]=qb.x; positions[idx+4]=qb.y; positions[idx+5]=qb.z;
  const mx=(qa.x+qb.x)*0.5, my=(qa.y+qb.y)*0.5, mz=(qa.z+qb.z)*0.5;
  lineDist[li] = Math.sqrt((mx-eggCenter.x)**2+(my-eggCenter.y)**2+(mz-eggCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// ── Rule 1: CONVERGENCE — every anchor sends a thread toward the egg surface
// ~55% of budget — the primary visual
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)].clone();
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = eggSurf();

  // 12% stop short — threads that reach but don't arrive. The gap IS the piece.
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng() * 1.8;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// ── Rule 2: PROXIMITY WEB — anchor to nearest anchor within threshold
// Density emerges from proximity alone
const THRESH = 4.8;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.28);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  // Find nearest neighbor by sampling
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;

  // Dendritic branching — morphogenetic, not placed
  if(rng() < 0.12 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.3 + rng()*0.4);
    for(let gen = 0; gen < 3 && li < NUM_LINES; gen++){
      const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
      const bLen = 0.08 + rng()*0.35 * (1.0 / (gen+1));
      const bEnd = mid.clone().add(bDir.multiplyScalar(bLen));
      if(!inVoid(bEnd)){
        setLine(mid, bEnd, 1);
        catBcount++;
        mid.copy(mid.clone().lerp(bEnd, 0.5));
      }
      if(rng() > 0.4) break;
    }
  }
}

// ── DRAPE — threads pulled down from egg to floor by gravity
const catC = Math.floor(NUM_LINES * 0.07);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const sp = eggSurf();
  if(sp.y > eggCenter.y) sp.y = eggCenter.y - rng() * EGG_RY * 0.8;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*3.5,
    -hh,
    sp.z + (rng()-0.5)*3.5
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 2);
}

// ── LONG SPANS — wall-to-wall, the architectural skeleton
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.30 ? eggSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity layering by category
// Cat 0 (convergence): brightest — these define the form
// Cat 1 (web): mid — structural connective tissue
// Cat 2 (drape): mid-low — gravity's signature
// Cat 3 (spans): faintest — architectural context
const catBright = [1.0, 0.6, 0.7, 0.45];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const bright = catBright[cat];
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, memory residue caught in the web
const NUM_FRAGMENTS = 28;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.05 + rng()*0.14;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.7);
  const h = sz * (0.4 + rng()*0.9);
  // Irregular quad — two triangles, slightly warped
  const twist = (rng()-0.5)*0.15;
  const verts = new Float32Array([
    w*(-0.4+rng()*0.15), h*0.5+twist, 0,
    -w*0.5, h*(-0.1+rng()*0.1), twist*0.5,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.4+rng()*0.15), h*0.5+twist, 0,
    w*(0.2+rng()*0.35), h*(rng()*0.05), -twist*0.3,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.004 + rng()*0.010;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.015),
    transparent: true,
    opacity: 0.12 + rng()*0.20,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    // Place on a thread midpoint
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(eggCenter).add(dir.multiplyScalar(2.5 + rng()*8.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — intimate, claustrophobic. INSIDE the cocoon.
// Narrative: gathering. The camera draws inward from the web's edge,
// circles the egg in tightening proximity, as if pulled by its gravity.
// Never leaves the web — always threads between camera and egg.
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;

  // Spiral-in-orbit: radius oscillates but trends close
  const phase1 = Math.sin(p * 0.4 + 1.2);
  const phase2 = Math.cos(p * 0.7 + 0.3);
  const rBase = 4.2 + phase1 * 1.6 + phase2 * 0.7;
  const rX = rBase * (0.85 + Math.sin(p * 1.3) * 0.12);
  const rZ = rBase * (1.05 + Math.cos(p * 0.9) * 0.15);

  const x = eggCenter.x + Math.sin(p) * rX;
  const z = eggCenter.z + Math.cos(p) * rZ;

  // Vertical: gentle undulation, mostly at egg level
  // Occasional dips below to look up through the web at the egg
  const yBase = eggCenter.y + 0.2;
  const yWave = Math.sin(p * 0.25 + 0.8) * 3.2
    + Math.cos(p * 0.55 + 2.0) * 1.5
    + Math.sin(p * 1.1 + 3.5) * 0.25;
  const y = yBase + yWave;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — barely perceptible, <0.4% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0002 * Math.max(0, 1.0 - dist / 24.0);
    const phase = basePositions[idx]*0.13 + basePositions[idx+1]*0.17 + i*0.0005;
    const breath = Math.sin(t*0.012 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.25;
      arr[vi+1] = basePositions[vi+1] + breath*0.18;
      arr[vi+2] = basePositions[vi+2] + breath*0.22;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — the gathering
  const speed = 0.00035;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the egg — always the gravitational center
  const look = eggCenter.clone();
  look.x += Math.sin(t*0.0014)*0.04;
  look.y += Math.cos(t*0.0011)*0.03;
  look.z += Math.sin(t*0.0017)*0.04;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = 1 + Math.sin(t*0.0007)*0.15;
  pL.position.y = 12 + Math.cos(t*0.0005)*0.08;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
