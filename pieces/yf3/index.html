<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seismic cypress · USGS live quake feed</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070a; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; color:#cdd2dc; letter-spacing:0.06em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .data  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; line-height:1.6; }
</style>
</head>
<body>
<div class="id">yf3</div>
<div class="data" id="dataLabel">USGS earthquake feed · loading…</div>
<div class="src">seismic cypress · 70k particles · live data</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);

/* ── seismic state ── */
const seismic = {
  count: 0, maxMag: 0, totalEnergy: 0, avgDepth: 30,
  quakes: [],   // {mag, depth, lat, lon, time}
  lastFetch: 0
};

/* ── L-system cypress (pose A) ── */
const RULES = {
  'F': [
    { p:0.55, s:'F[+f][-f]F' }, { p:0.25, s:'FF[/f]\\F' },
    { p:0.20, s:'F[+f-f][/f\\f]F' }
  ],
  'f': [ { p:0.6, s:'f[+f][-f]' }, { p:0.4, s:'f' } ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(), h = new THREE.Vector3(0,1,0),
      l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1), gen = 0;
  const rot = (ax, a) => {
    const q = new THREE.Quaternion().setFromAxisAngle(ax, a);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from:pos.clone(), to:next.clone(), gen }); pos = next; break;
      }
      case '+': rot(u, +ANGLE); break; case '-': rot(u, -ANGLE); break;
      case '&': rot(l, +ANGLE); break; case '^': rot(l, -ANGLE); break;
      case '/': rot(h, +ANGLE*1.5); break; case '\\': rot(h, -ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const rng = (()=>{ let s=0xC0FFEE; return ()=>{ s=(s+0x6D2B79F5)|0;
  let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; })();
const cypressSegs = turtle(expand('F', 6, rng));

/* ── art-deco tower (pose B) ── */
function sampleArtDeco(N){
  const out = new Float32Array(N*3), pos = new THREE.Vector3();
  const tiers = [
    {hw:4.5,y0:0,y1:4,ridges:14},{hw:3.4,y0:4,y1:7.5,ridges:12},
    {hw:2.4,y0:7.5,y1:10.5,ridges:10},{hw:1.5,y0:10.5,y1:13,ridges:8},
    {hw:0.85,y0:13,y1:15,ridges:6}
  ];
  const spireBase=0.6,spireTop=18.5,spireApex=20.5;
  const W=Math.floor(N*0.55),B=Math.floor(N*0.25),S=Math.floor(N*0.12),C=N-W-B-S;
  let i=0;
  const tw=tiers.map(t=>8*t.hw*(t.y1-t.y0)),ttl=tw.reduce((a,b)=>a+b,0);
  for(let ti=0;ti<tiers.length;ti++){
    const t=tiers[ti];
    const count=ti===tiers.length-1?W-Math.floor(tw.slice(0,ti).reduce((a,b)=>a+b/ttl*W,0)):Math.max(1,Math.floor(tw[ti]/ttl*W));
    for(let k=0;k<count;k++){
      const face=Math.floor(Math.random()*4);
      const r=Math.floor(Math.random()*t.ridges);
      const rf=(r+0.5)/t.ridges,along=(rf*2-1)*t.hw;
      const y=t.y0+Math.random()*(t.y1-t.y0),j=0.04;
      switch(face){
        case 0:pos.set(t.hw+(Math.random()-.5)*j,y,along);break;
        case 1:pos.set(-t.hw+(Math.random()-.5)*j,y,along);break;
        case 2:pos.set(along,y,t.hw+(Math.random()-.5)*j);break;
        case 3:pos.set(along,y,-t.hw+(Math.random()-.5)*j);break;
      }
      out[i*3]=pos.x;out[i*3+1]=pos.y;out[i*3+2]=pos.z;i++;
    }
  }
  for(let k=0;k<B;k++){
    const ti=Math.floor(Math.random()*tiers.length),t=tiers[ti];
    const edge=Math.random()<0.6?t.y1:t.y0,face=Math.floor(Math.random()*4);
    const along=(Math.random()*2-1)*t.hw,j=0.02;
    switch(face){
      case 0:pos.set(t.hw,edge+(Math.random()-.5)*j,along);break;
      case 1:pos.set(-t.hw,edge+(Math.random()-.5)*j,along);break;
      case 2:pos.set(along,edge+(Math.random()-.5)*j,t.hw);break;
      case 3:pos.set(along,edge+(Math.random()-.5)*j,-t.hw);break;
    }
    out[i*3]=pos.x;out[i*3+1]=pos.y;out[i*3+2]=pos.z;i++;
  }
  for(let k=0;k<S;k++){
    const t=Math.random(),y=spireTop+t*(spireApex-spireTop);
    const r=spireBase*(1-t),th=Math.random()*Math.PI*2;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x;out[i*3+1]=pos.y;out[i*3+2]=pos.z;i++;
  }
  const chevrons=16;
  for(let k=0;k<C;k++){
    const ch=Math.floor(Math.random()*chevrons),th=(ch+0.5)/chevrons*Math.PI*2;
    const along=Math.random(),inner=0.7,outer=2.0,r=inner+along*(outer-inner);
    const y=spireTop-0.4+along*0.8+(Math.random()-.5)*0.05;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x;out[i*3+1]=pos.y;out[i*3+2]=pos.z;i++;
  }
  return out;
}

/* ── build particle arrays ── */
const N = 70000;
const treePos = new Float32Array(N*3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);
const lens = cypressSegs.map(s=>s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const N_SKEL = Math.floor(N*0.55), N_FOL = N-N_SKEL;
let written = 0;
const v = new THREE.Vector3();

for(let i=0;i<cypressSegs.length;i++){
  const share = i===cypressSegs.length-1?N_SKEL-written:Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for(let k=0;k<share&&written<N_SKEL;k++){
    const t=Math.random();
    v.lerpVectors(cypressSegs[i].from,cypressSegs[i].to,t);
    const j=0.05*Math.pow(0.85,cypressSegs[i].gen);
    treePos[written*3]=v.x+(Math.random()-.5)*j;
    treePos[written*3+1]=v.y+(Math.random()-.5)*j;
    treePos[written*3+2]=v.z+(Math.random()-.5)*j;
    seeds[written]=Math.random(); written++;
  }
}
{
  let yMin=Infinity,yMax=-Infinity;
  for(const s of cypressSegs){yMin=Math.min(yMin,s.from.y,s.to.y);yMax=Math.max(yMax,s.from.y,s.to.y);}
  const trunkH=yMax-yMin,haloYStart=yMin+trunkH*0.16;
  const RIDGES=8,SPIRAL=0.9,TUFT_COUNT=24;
  const tuftYs=[],tuftThs=[];
  for(let i=0;i<TUFT_COUNT;i++){
    tuftYs.push(haloYStart+(i+0.5)/TUFT_COUNT*(yMax-haloYStart));
    tuftThs.push(Math.random()*Math.PI*2);
  }
  const NR=Math.floor(N_FOL*0.6),NT=N_FOL-NR;
  for(let k=0;k<NR&&written<N;k++){
    const yt=Math.random(),y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const th=(ridge/RIDGES)*Math.PI*2+y*SPIRAL+(Math.random()-.5)*0.3;
    const r=baseR*(0.55+0.45*Math.random());
    treePos[written*3]=Math.cos(th)*r;treePos[written*3+1]=y+(Math.random()-.5)*0.05;
    treePos[written*3+2]=Math.sin(th)*r;seeds[written]=Math.random();written++;
  }
  for(let k=0;k<NT&&written<N;k++){
    const t=Math.floor(Math.random()*TUFT_COUNT);
    const tuftY=tuftYs[t],tuftTh=tuftThs[t];
    const yt=(tuftY-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper,reach=baseR+0.1+Math.random()*0.35;
    const localY=tuftY+(Math.random()-.5)*0.4;
    const localTh=tuftTh+(Math.random()-.5)*0.4;
    const localR=reach+(Math.random()-.5)*0.18;
    treePos[written*3]=Math.cos(localTh)*localR;treePos[written*3+1]=localY;
    treePos[written*3+2]=Math.sin(localTh)*localR;seeds[written]=Math.random();written++;
  }
}
while(written<N){treePos[written*3]=0;treePos[written*3+1]=0;treePos[written*3+2]=0;seeds[written]=Math.random();written++;}

function fitToHeight(arr,h){
  let minY=Infinity,maxY=-Infinity,cx=0,cz=0;const n=arr.length/3;
  for(let i=0;i<n;i++){minY=Math.min(minY,arr[i*3+1]);maxY=Math.max(maxY,arr[i*3+1]);cx+=arr[i*3];cz+=arr[i*3+2];}
  cx/=n;cz/=n;const s=h/(maxY-minY);
  for(let i=0;i<n;i++){arr[i*3]=(arr[i*3]-cx)*s;arr[i*3+1]=(arr[i*3+1]-minY)*s;arr[i*3+2]=(arr[i*3+2]-cz)*s;}
}
fitToHeight(treePos,16); fitToHeight(towerPos,16);

/* ── shader ── */
const uniforms = {
  uTime:      {value:0},
  uPixel:     {value:renderer.getPixelRatio()},
  uMix:       {value:0},
  uTurbulence:{value:0},     // 0..1, driven by total seismic energy
  uMaxMag:    {value:0},     // strongest quake magnitude (0..~9)
  uDepthWarm: {value:0.5},   // avg depth mapped to color warmth
  uRipples:   {value:new Float32Array(12)}, // up to 4 ripple centers (x,y,mag)
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(),3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos,3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos,3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds,1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uMix, uTurbulence, uMaxMag, uDepthWarm;
    uniform float uRipples[12];
    attribute vec3 treePos, towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    // simple hash
    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      float m = smoothstep(0.0,1.0,uMix);
      vec3 p = mix(treePos, towerPos, m);
      float t = uTime * 0.55 + seed * 6.28;

      // organic sway (stronger when cypress, weaker when tower)
      float swayAmt = (1.0-m) * 0.06 * (p.y/16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t*0.9);

      // seismic turbulence: high-freq displacement driven by earthquake energy
      float turb = uTurbulence;
      float quakeT = uTime * 2.5 + seed * 12.56;
      p.x += turb * 0.4 * sin(quakeT) * (0.5+0.5*sin(p.y*1.2));
      p.y += turb * 0.15 * cos(quakeT * 1.3);
      p.z += turb * 0.35 * cos(quakeT * 0.7 + p.y * 0.8);

      // ripple waves from individual quakes
      for(int i=0; i<4; i++){
        float rx = uRipples[i*3];
        float ry = uRipples[i*3+1];
        float rmag = uRipples[i*3+2];
        if(rmag > 0.01){
          float d = distance(p.xz, vec2(rx, ry));
          float wave = sin(d * 4.0 - uTime * 3.0) * exp(-d * 0.5);
          p.y += wave * rmag * 0.12;
          p.x += wave * rmag * 0.04 * cos(seed * 6.28);
          p.z += wave * rmag * 0.04 * sin(seed * 6.28);
        }
      }

      // color: green cypress ↔ bronze deco, shifted by depth warmth & magnitude
      float hk = clamp(p.y/16.0, 0.0, 1.0);
      // calm palette (low seismic)
      vec3 treeA = vec3(0.18,0.36,0.20);
      vec3 treeB = vec3(0.55,0.78,0.35);
      vec3 decoA = vec3(0.42,0.30,0.18);
      vec3 decoB = vec3(0.92,0.72,0.40);
      vec3 baseCol = mix(mix(treeA,treeB,hk), mix(decoA,decoB,hk), m);

      // seismic heat: deep warm orange-red when strong quakes
      vec3 heatLow  = vec3(0.85,0.45,0.15);
      vec3 heatHigh = vec3(1.0,0.25,0.10);
      float heatMix = smoothstep(0.0,1.0,uTurbulence);
      vec3 heatCol = mix(heatLow, heatHigh, clamp(uMaxMag/7.0, 0.0, 1.0));

      // depth warmth shifts overall hue
      vec3 depthTint = mix(vec3(0.7,0.85,1.0), vec3(1.0,0.75,0.5), uDepthWarm);
      baseCol *= depthTint;

      vCol = mix(baseCol, heatCol, heatMix * 0.6);

      // crown particles glow brighter during seismic activity
      float crownGlow = smoothstep(0.8,1.0,hk) * uTurbulence * 0.5;
      vCol += crownGlow * vec3(1.0,0.6,0.2);

      float energy = 0.5 + 0.5*sin(t*0.8);
      vAlpha = 0.45 + 0.55*energy + turb*0.2;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + 0.7*energy + turb*0.5) * uPixel * (50.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── atmospheric ground glow ── */
const glowGeo = new THREE.PlaneGeometry(40,40);
const glowMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTurbulence:uniforms.uTurbulence },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform float uTurbulence;
    varying vec2 vUv;
    void main(){
      float d = distance(vUv, vec2(0.5));
      float glow = exp(-d*3.5) * 0.08;
      vec3 col = mix(vec3(0.15,0.25,0.12), vec3(0.6,0.25,0.08), uTurbulence);
      gl_FragColor = vec4(col * glow, glow);
    }
  `
});
const glowPlane = new THREE.Mesh(glowGeo, glowMat);
glowPlane.rotation.x = -Math.PI/2;
glowPlane.position.y = -0.1;
scene.add(glowPlane);

/* ── data fetch ── */
const FEED_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson';
const dataLabel = document.getElementById('dataLabel');

async function fetchQuakes(){
  try {
    const res = await fetch(FEED_URL);
    const data = await res.json();
    const features = data.features || [];
    seismic.count = features.length;
    seismic.quakes = features.slice(0,8).map(f => ({
      mag: Math.max(0, f.properties.mag || 0),
      depth: f.geometry.coordinates[2] || 10,
      lon: f.geometry.coordinates[0],
      lat: f.geometry.coordinates[1],
      place: f.properties.place || ''
    }));
    seismic.maxMag = seismic.quakes.reduce((mx,q) => Math.max(mx,q.mag), 0);
    seismic.totalEnergy = seismic.quakes.reduce((s,q) => s + Math.pow(10, 1.5*q.mag), 0);
    seismic.avgDepth = seismic.quakes.length > 0
      ? seismic.quakes.reduce((s,q) => s+q.depth, 0) / seismic.quakes.length : 30;
    seismic.lastFetch = Date.now();

    // update label
    const strongest = seismic.quakes.length > 0
      ? seismic.quakes.reduce((a,b) => a.mag > b.mag ? a : b) : null;
    let label = `USGS past hour · ${seismic.count} quake${seismic.count!==1?'s':''}`;
    if (strongest && strongest.mag >= 0.5) label += `\nmax M${strongest.mag.toFixed(1)} · ${strongest.place}`;
    if (seismic.count === 0) label += '\nearth is quiet';
    dataLabel.textContent = label;
  } catch(e) {
    dataLabel.textContent = 'USGS earthquake feed · offline (fallback)';
  }
}
fetchQuakes();
setInterval(fetchQuakes, 30000);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── render loop ── */
const start = performance.now();
const rippleArr = uniforms.uRipples.value;

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // map seismic data to uniforms with smooth lerp
  const energyNorm = Math.min(1, Math.log10(1 + seismic.totalEnergy) / 12);
  const targetTurb = seismic.count > 0 ? Math.max(0.03, energyNorm) : 0.0;
  uniforms.uTurbulence.value += (targetTurb - uniforms.uTurbulence.value) * 0.02;

  uniforms.uMaxMag.value += (seismic.maxMag - uniforms.uMaxMag.value) * 0.03;

  // morph: quiet earth → cypress (organic), active earth → tower (stressed structure)
  const targetMix = Math.min(1, seismic.maxMag / 5.0);
  uniforms.uMix.value += (targetMix - uniforms.uMix.value) * 0.015;

  // depth warmth: shallow quakes = warm (1.0), deep = cool (0.0)
  const depthTarget = 1.0 - Math.min(1, seismic.avgDepth / 300);
  uniforms.uDepthWarm.value += (depthTarget - uniforms.uDepthWarm.value) * 0.02;

  // ripple centers from top-4 quakes mapped to XZ positions
  for (let i = 0; i < 4; i++){
    if (i < seismic.quakes.length){
      const q = seismic.quakes[i];
      // map lat/lon to local XZ in [-5,5] range using simple wrap
      rippleArr[i*3]   = ((q.lon + 180) % 360 / 360 * 10 - 5);
      rippleArr[i*3+1] = ((q.lat + 90) % 180 / 180 * 10 - 5);
      rippleArr[i*3+2] = q.mag;
    } else {
      rippleArr[i*3+2] = 0;
    }
  }

  // gentle camera orbit
  const ang = t * 0.04;
  const camDist = 22 - uniforms.uTurbulence.value * 3; // camera pulls in during quakes
  camera.position.x = Math.sin(ang) * camDist;
  camera.position.z = Math.cos(ang) * camDist;
  camera.position.y = 6 + uniforms.uTurbulence.value * 2;
  camera.lookAt(0, 8, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
