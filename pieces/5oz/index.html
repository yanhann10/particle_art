<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5oz · candy spill · Felix Gonzalez-Torres</title>
<!-- MOTION: drift, intensity: calm -->
<!-- Palette: soft pink #f0c0d0, pale mint #c8f0d8, cream #f5f0e8, soft gold #f0e0a8 on near-white floor #f8f6f4 -->
<!-- Artist: Felix Gonzalez-Torres — candy spill installations, domestic intimacy, the absent body -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f8f6f4; overflow:hidden;
               color:#8a7060; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.45; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.40; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">5oz</div>
<div class="hint">candy spill — 800 sweets, slowly dispersing</div>
<div class="src">Felix Gonzalez-Torres · "Untitled" (Portrait of Ross in L.A.) · 1991</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Felix Gonzalez-Torres: candy spill installations.
   800 small sphere "candies" piled near center, physics-dispersed over ~2 minutes.
   The pile gradually empties outward — like watching someone's presence dissolve.
   The floor stays warm and domestic. No interaction needed — just witness. */

const TOTAL_DURATION = 120; // 2 minutes
const N = 800;
const COLORS = [
  new THREE.Color('#f0c0d0'), // soft pink
  new THREE.Color('#c8f0d8'), // pale mint
  new THREE.Color('#f5f0e8'), // cream
  new THREE.Color('#f0e0a8'), // soft gold
  new THREE.Color('#e8d0f0'), // lavender
];

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f8f6f4');

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2.5, 5.5);
camera.lookAt(0, 0.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.5, 0);
controls.minPolarAngle = 0.1;
controls.maxPolarAngle = Math.PI * 0.48;

// Lighting: warm ambient + soft directional — domestic, intimate
const ambient = new THREE.AmbientLight(0xfff0e8, 1.4);
scene.add(ambient);
const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.6);
keyLight.position.set(4, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -20;
keyLight.shadow.camera.right = 20;
keyLight.shadow.camera.top = 20;
keyLight.shadow.camera.bottom = -20;
keyLight.shadow.radius = 3;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xe8f4ff, 0.4);
fillLight.position.set(-6, 5, -4);
scene.add(fillLight);

// Floor plane — warm near-white
const floorGeo = new THREE.PlaneGeometry(60, 60);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0xf8f6f4,
  roughness: 0.9,
  metalness: 0.0,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Candy geometry — small spheres r=0.08
const candyGeo = new THREE.SphereGeometry(0.08, 8, 6);

// Physics state
const candies = [];
const positions = []; // THREE.Vector3
const velocities = []; // THREE.Vector3
const angVels = []; // angular velocity for rolling

// Build instanced mesh for performance
const candyInstanced = new THREE.InstancedMesh(
  candyGeo,
  new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.05 }),
  N
);
candyInstanced.castShadow = true;
candyInstanced.receiveShadow = true;
scene.add(candyInstanced);

// Color each candy
const colorAttr = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);
const dummy = new THREE.Object3D();

for (let i = 0; i < N; i++) {
  // Initial position: hemisphere pile near center
  const r = Math.random() * 0.8; // tight pile radius
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.random() * Math.PI * 0.5; // upper hemisphere
  const x = r * Math.sin(phi) * Math.cos(theta);
  const z = r * Math.sin(phi) * Math.sin(theta);
  const y = r * Math.cos(phi) * 0.6 + 0.08; // above floor

  const pos = new THREE.Vector3(x, Math.max(0.08, y), z);
  const vel = new THREE.Vector3(
    (Math.random() - 0.5) * 0.002,
    0,
    (Math.random() - 0.5) * 0.002
  );
  positions.push(pos);
  velocities.push(vel);
  angVels.push(new THREE.Vector3(
    (Math.random() - 0.5) * 0.05,
    (Math.random() - 0.5) * 0.05,
    (Math.random() - 0.5) * 0.05
  ));

  const col = COLORS[Math.floor(Math.random() * COLORS.length)];
  colorAttr.setXYZ(i, col.r, col.g, col.b);

  dummy.position.copy(pos);
  dummy.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, 0);
  dummy.updateMatrix();
  candyInstanced.setMatrixAt(i, dummy.matrix);
  candyInstanced.setColorAt(i, col);
}
candyInstanced.instanceColor.needsUpdate = true;
candyInstanced.instanceMatrix.needsUpdate = true;

// Simple grid-less inter-candy repulsion with neighbor cache
// Update at most 50 pairs/frame for smoothness
const REPEL_R = 0.17;
const REPEL_STR = 0.0006;
const GRAVITY = 0.0018;
const FLOOR_DAMP = 0.38;
const ROLL_DAMP = 0.994;
const SPREAD_FORCE = 0.00008; // very slow outward creep

const TOTAL_FRAMES = TOTAL_DURATION * 60;
let frameCount = 0;

const euler = new THREE.Euler();
const quat = new THREE.Quaternion();
const rotations = [];
for (let i = 0; i < N; i++) {
  rotations.push(new THREE.Euler(
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI * 2
  ));
}

function physicsStep() {
  frameCount++;
  const t = frameCount / TOTAL_FRAMES; // 0 → 1 over 2 minutes

  for (let i = 0; i < N; i++) {
    const p = positions[i];
    const v = velocities[i];

    // Gravity
    v.y -= GRAVITY;

    // Floor bounce
    if (p.y <= 0.08) {
      p.y = 0.08;
      v.y = Math.abs(v.y) * FLOOR_DAMP * (0.3 + Math.random() * 0.3);
      v.x *= 0.98;
      v.z *= 0.98;
    }

    // Very slow outward spread — increases over time as pile relaxes
    const dist2D = Math.sqrt(p.x * p.x + p.z * p.z);
    if (dist2D > 0.01) {
      const nx = p.x / dist2D;
      const nz = p.z / dist2D;
      // spread force increases with time
      const spread = SPREAD_FORCE * (0.2 + t * 3.0);
      v.x += nx * spread * (1 + Math.random() * 0.3);
      v.z += nz * spread * (1 + Math.random() * 0.3);
    }

    // Damping
    v.x *= ROLL_DAMP;
    v.z *= ROLL_DAMP;
    v.y *= 0.998;

    // Integrate
    p.x += v.x;
    p.y += v.y;
    p.z += v.z;

    // Roll rotation
    rotations[i].x += angVels[i].x * 0.5;
    rotations[i].z += angVels[i].z * 0.5;
    angVels[i].multiplyScalar(0.99);
  }

  // Neighbor repulsion — sample random pairs for performance
  const pairCount = 80;
  for (let k = 0; k < pairCount; k++) {
    const i = Math.floor(Math.random() * N);
    const j = Math.floor(Math.random() * N);
    if (i === j) continue;
    const dx = positions[i].x - positions[j].x;
    const dz = positions[i].z - positions[j].z;
    const dy = positions[i].y - positions[j].y;
    const d2 = dx * dx + dz * dz + dy * dy;
    if (d2 < REPEL_R * REPEL_R && d2 > 1e-6) {
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      velocities[i].x += dx * f;
      velocities[i].z += dz * f;
      velocities[j].x -= dx * f;
      velocities[j].z -= dz * f;
    }
  }
}

function updateInstanced() {
  for (let i = 0; i < N; i++) {
    dummy.position.copy(positions[i]);
    euler.copy(rotations[i]);
    quat.setFromEuler(euler);
    dummy.quaternion.copy(quat);
    dummy.scale.setScalar(1);
    dummy.updateMatrix();
    candyInstanced.setMatrixAt(i, dummy.matrix);
  }
  candyInstanced.instanceMatrix.needsUpdate = true;
}

// Pre-warm: let pile settle slightly before first frame (less dispersal)
for (let s = 0; s < 80; s++) physicsStep();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();

function loop() {
  // Run multiple physics steps per frame for smoother motion
  for (let s = 0; s < 2; s++) physicsStep();
  updateInstanced();

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
</html>
