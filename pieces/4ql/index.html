<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: gather, intensity: gentle -->
<title>4ql · nest of you · cyber-nest accretion</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070b; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;

</style>
</head>
<body>
<div class="id">4ql</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Wang & Söderström "Nest of You" mutation ──
   Parent t9w's differential-growth spine becomes the invisible armature
   of a cyber-nest: glossy pearl/lavender/mercury spheres accrete along
   and around the growth curve, clustering where growth is dense,
   shedding residue blobs where it thins. The nest breathes. */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08070b, 0.025);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 250);
camera.position.set(10, 9, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070b, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// lighting — soft, directional, warm-cool split
const keyLight = new THREE.DirectionalLight(0xffe8f0, 0.7);
keyLight.position.set(4, 12, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xb0a8d0, 0.35);
fillLight.position.set(-6, 4, -4);
scene.add(fillLight);
const rimLight = new THREE.PointLight(0xd0d8f0, 0.5, 40);
rimLight.position.set(0, 15, -8);
scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x1a1420, 0.5));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 5, 0);

// ─── differential growth spine (from t9w, simplified as hidden armature) ───
const MAX_VERTS = 800;
const ATTRACT = 0.06, REPEL_R = 0.50, REPEL_STR = 0.13;
const NOISE = 0.003, PRESSURE = 0.0028, RISE = 0.0045, MAX_D = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function findNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of findNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT; dy[i]+=(a.y+b.y-2*v.y)*ATTRACT; dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0, cy2=0, cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x; cy2+=verts[i].y; cz2+=verts[i].z;}
  cx2/=n; cy2/=n; cz2/=n;
  for (let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i=0;i<n;i++){
    const a=verts[i].age;
    const up=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for (let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5, age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
// pre-grow the spine
for (let s = 0; s < 500; s++) step();

// ─── pearl/lavender/mercury palette ───
// 5 hand-picked colors: pearl white, soft lavender, cool mercury, warm blush, deep iris
const PALETTE = [
  new THREE.Color(0.92, 0.90, 0.94),  // pearl
  new THREE.Color(0.72, 0.68, 0.88),  // lavender
  new THREE.Color(0.78, 0.80, 0.84),  // mercury
  new THREE.Color(0.88, 0.76, 0.80),  // blush
  new THREE.Color(0.55, 0.50, 0.72),  // deep iris
];

// ─── instanced nest blobs ───
const BLOB_COUNT = 1200;
const RESIDUE_COUNT = 200;
const TOTAL = BLOB_COUNT + RESIDUE_COUNT;

const blobGeo = new THREE.SphereGeometry(1, 12, 10);
const blobMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0dce8,
  roughness: 0.15,
  metalness: 0.3,
  clearcoat: 0.8,
  clearcoatRoughness: 0.1,
  envMapIntensity: 0.6,
  transparent: true,
  opacity: 0.88,
});

const blobs = new THREE.InstancedMesh(blobGeo, blobMat, TOTAL);
blobs.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(blobs);

// per-blob color
const colorAttr = new THREE.InstancedBufferAttribute(new Float32Array(TOTAL * 3), 3);
blobs.instanceColor = colorAttr;

// blob state
const blobState = [];
for (let i = 0; i < TOTAL; i++){
  const isResidue = i >= BLOB_COUNT;
  // pick a random spine vertex as attractor
  const spineIdx = Math.floor(Math.random() * verts.length);
  const sv = verts[spineIdx];
  // scatter around the spine with some offset
  const ang = Math.random() * Math.PI * 2;
  const rad = 0.3 + Math.random() * (isResidue ? 3.5 : 2.0);
  const yOff = (Math.random() - 0.5) * 1.2;

  const col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  // vary slightly
  const cr = col.r + (Math.random()-0.5)*0.06;
  const cg = col.g + (Math.random()-0.5)*0.06;
  const cb = col.b + (Math.random()-0.5)*0.06;
  colorAttr.setXYZ(i, cr, cg, cb);

  const baseScale = isResidue
    ? 0.03 + Math.random() * 0.06   // residue: tiny
    : 0.08 + Math.random() * 0.28;  // nest blobs: varied

  blobState.push({
    x: sv.x + Math.cos(ang) * rad,
    y: sv.y + yOff,
    z: sv.z + Math.sin(ang) * rad,
    scale: baseScale,
    spineIdx,
    orbitPhase: Math.random() * Math.PI * 2,
    orbitSpeed: (0.15 + Math.random() * 0.35) * (Math.random() < 0.5 ? 1 : -1),
    orbitRadius: 0.2 + Math.random() * 1.6,
    verticalDrift: (Math.random() - 0.5) * 0.003,
    isResidue,
    breathPhase: Math.random() * Math.PI * 2,
    stickiness: 0.3 + Math.random() * 0.7,  // how tightly it clings
    shedTimer: isResidue ? Math.random() * 100 : 0,
    // slight squash/stretch
    scaleY: 0.85 + Math.random() * 0.3,
    scaleXZ: 0.9 + Math.random() * 0.2,
  });
}

// residue trail particles (tiny shed blobs that drift down)
const residueGeo = new THREE.SphereGeometry(1, 6, 5);
const residueMat = new THREE.MeshPhysicalMaterial({
  color: 0xc8c0d8,
  roughness: 0.3,
  metalness: 0.5,
  clearcoat: 0.6,
  transparent: true,
  opacity: 0.45,
});

// ─── thin thread filaments connecting nearby blobs (nest structure) ───
const MAX_THREADS = 600;
const threadPositions = new Float32Array(MAX_THREADS * 6);
const threadGeo = new THREE.BufferGeometry();
threadGeo.setAttribute('position', new THREE.BufferAttribute(threadPositions, 3));
const threadMat = new THREE.LineBasicMaterial({
  color: 0xb8b0c8,
  transparent: true,
  opacity: 0.12,
});
const threads = new THREE.LineSegments(threadGeo, threadMat);
scene.add(threads);

// ─── floor residue plane — subtle reflection ───
const floorGeo = new THREE.PlaneGeometry(60, 60);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0c0a10,
  roughness: 0.85,
  metalness: 0.15,
  transparent: true,
  opacity: 0.6,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.5;
scene.add(floor);

// ─── film grain overlay ───
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 256; grainCanvas.height = 256;
const grainCtx = grainCanvas.getContext('2d');

function updateGrain(){
  const id = grainCtx.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4){
    const v = Math.random() * 20;
    id.data[i] = v; id.data[i+1] = v; id.data[i+2] = v + Math.random()*5;
    id.data[i+3] = 18;
  }
  grainCtx.putImageData(id, 0, 0);
}
updateGrain();
const grainTex = new THREE.CanvasTexture(grainCanvas);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
grainTex.repeat.set(4, 4);
const grainMat = new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, opacity: 0.15, depthWrite: false });
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const dummy = new THREE.Object3D();
const startTime = performance.now();
let grainFrame = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('click', () => { paused = !paused; });

function animate(){
  const t = (performance.now() - startTime) / 1000;

  // grow spine slowly
  for (let s = 0; s < 1; s++) step();

  // breathing: global scale oscillation
  const breathGlobal = 1.0 + 0.04 * Math.sin(t * 0.8);

  // update blob positions — orbit around their spine attractor
  for (let i = 0; i < TOTAL; i++){
    const b = blobState[i];
    // find current attractor position (spine vertex may have moved)
    const si = Math.min(b.spineIdx, verts.length - 1);
    const sv = verts[si];

    if (!b.isResidue){
      // orbit around spine vertex
      b.orbitPhase += b.orbitSpeed * 0.016;
      const targetX = sv.x + Math.cos(b.orbitPhase) * b.orbitRadius;
      const targetZ = sv.z + Math.sin(b.orbitPhase) * b.orbitRadius;
      const targetY = sv.y + Math.sin(b.orbitPhase * 0.7 + b.breathPhase) * 0.3;

      // ease toward target (stickiness controls tightness)
      const ease = 0.01 + b.stickiness * 0.03;
      b.x += (targetX - b.x) * ease;
      b.y += (targetY - b.y) * ease;
      b.z += (targetZ - b.z) * ease;
    } else {
      // residue: slowly drift downward, shed from nest
      b.y -= 0.004;
      b.x += Math.sin(t * 0.3 + b.breathPhase) * 0.002;
      b.z += Math.cos(t * 0.4 + b.breathPhase) * 0.002;
      // fade/shrink
      b.shedTimer += 0.016;
    }

    // per-blob breath
    const localBreath = breathGlobal * (1.0 + 0.08 * Math.sin(t * 1.2 + b.breathPhase));
    const s = b.scale * localBreath;

    dummy.position.set(b.x, b.y, b.z);
    dummy.scale.set(s * b.scaleXZ, s * b.scaleY, s * b.scaleXZ);
    dummy.rotation.set(
      Math.sin(t * 0.3 + i * 0.1) * 0.15,
      t * 0.05 + i * 0.5,
      Math.cos(t * 0.2 + i * 0.2) * 0.1
    );
    dummy.updateMatrix();
    blobs.setMatrixAt(i, dummy.matrix);
  }
  blobs.instanceMatrix.needsUpdate = true;

  // update thread connections (nearest neighbors)
  let threadIdx = 0;
  const CONNECT_DIST = 1.8;
  for (let i = 0; i < BLOB_COUNT && threadIdx < MAX_THREADS; i += 3){
    const a = blobState[i];
    for (let j = i + 1; j < BLOB_COUNT && threadIdx < MAX_THREADS; j += 4){
      const b = blobState[j];
      const dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < CONNECT_DIST * CONNECT_DIST && d2 > 0.01){
        const off = threadIdx * 6;
        threadPositions[off] = a.x; threadPositions[off+1] = a.y; threadPositions[off+2] = a.z;
        threadPositions[off+3] = b.x; threadPositions[off+4] = b.y; threadPositions[off+5] = b.z;
        threadIdx++;
      }
    }
  }
  // zero remaining
  for (let i = threadIdx * 6; i < MAX_THREADS * 6; i++) threadPositions[i] = 0;
  threadGeo.attributes.position.needsUpdate = true;
  threadGeo.setDrawRange(0, threadIdx * 2);

  // camera tracking — follow centroid of nest
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < BLOB_COUNT; i += 5){
    cx += blobState[i].x; cy += blobState[i].y; cz += blobState[i].z; count++;
  }
  if (count > 0){ cx /= count; cy /= count; cz /= count; }
  controls.target.x += (cx - controls.target.x) * 0.02;
  controls.target.y += (Math.max(cy, 2) - controls.target.y) * 0.02;
  controls.target.z += (cz - controls.target.z) * 0.02;

  // gentle automatic orbit when not interacting
  if (!controls.enabled || !paused){
    const camAngle = t * 0.06;
    const camR = 16 + Math.sin(t * 0.1) * 2;
    const desiredX = cx + Math.sin(camAngle) * camR;
    const desiredZ = cz + Math.cos(camAngle) * camR;
    const desiredY = Math.max(cy, 2) + 5 + Math.sin(t * 0.08) * 1.5;
    camera.position.x += (desiredX - camera.position.x) * 0.008;
    camera.position.y += (desiredY - camera.position.y) * 0.008;
    camera.position.z += (desiredZ - camera.position.z) * 0.008;
  }

  // update rim light position
  rimLight.position.set(
    cx + Math.sin(t * 0.15) * 8,
    cy + 10,
    cz + Math.cos(t * 0.15) * 8
  );

  controls.update();
  renderer.render(scene, camera);

  // film grain
  if (++grainFrame % 4 === 0) { updateGrain(); grainTex.needsUpdate = true; }
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(animate);
}

animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
