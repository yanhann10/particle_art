<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d7a · ice crystal tower · Eliasson elemental</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">d7a</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Olafur Eliasson × elemental: the differential-growth tower re-cast as
// an ice-crystal column rising from a dark water mirror. Warm amber light
// bleeds through translucent ice geometry — The Weather Project meets
// Ice Watch. Single amber-to-frost palette. Ground plane reflects.

const BG = 0x04060a;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 250);
camera.position.set(10, 9, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ── differential growth state (from 5gm) ──
const MAX_VERTS = 3600;
const ATTRACT   = 0.055;
const REPEL_R   = 0.44;
const REPEL_STR = 0.11;
const NOISE     = 0.0025;
const PRESSURE  = 0.003;
const RISE      = 0.005;
const MAX_D     = 0.30;
let paused = false;

const verts = [];
for (let i = 0; i < 20; i++){
  const th = i / 20 * Math.PI * 2;
  const r = 1.1 + (Math.random()-0.5)*0.08;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function gkey(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i], k=gkey(v.x,v.y,v.z);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr) for(const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of neighbors(v)){
      if(j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;
    dy[i]+=(oy/d)*PRESSURE*0.35;
    dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const up=RISE*(0.25+1.3*Math.min(a*1.6,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.4+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0013;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.04, z:(a.z+b.z)*0.5, age:Math.max(a.age,b.age)*0.45 });
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}

for(let s=0;s<900;s++) step();
addEventListener('click',()=>{ paused=!paused; });

// ── ice crystal particles ──
const N_RENDER = 50000;
const rPos = new Float32Array(N_RENDER*3);
const rSeed = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
const rHgt = new Float32Array(N_RENDER);
for(let i=0;i<N_RENDER;i++) rSeed[i]=Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos,3));
geom.setAttribute('seed', new THREE.BufferAttribute(rSeed,1));
geom.setAttribute('age', new THREE.BufferAttribute(rAge,1));
geom.setAttribute('hgt', new THREE.BufferAttribute(rHgt,1));

const uniforms = {
  uTime:  {value:0},
  uPixel: {value:renderer.getPixelRatio()},
  uYMax:  {value:1},
  uFogColor: {value:new THREE.Color(BG)},
  uFogDensity: {value:0.032}
};

// Eliasson palette: deep amber core → pale ice-blue edges → frost white tips
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    attribute float seed;
    attribute float age;
    attribute float hgt;
    varying vec3 vCol;
    varying float vFogFactor;
    void main(){
      vec3 p = position;
      float t = uTime*0.35 + seed*6.2831;
      // subtle crystalline shimmer
      p.x += 0.004*sin(t + p.y*0.8);
      p.z += 0.004*cos(t*1.1 + p.y*0.6);

      float h = clamp(hgt / max(uYMax, 0.5), 0.0, 1.0);

      // Eliasson palette: amber glow at base (warmth, sun, Weather Project)
      // → translucent ice-blue mid → frost-white crown
      vec3 amber = vec3(0.96, 0.72, 0.22);
      vec3 ice   = vec3(0.55, 0.78, 0.92);
      vec3 frost = vec3(0.92, 0.95, 0.98);
      vec3 col = mix(amber, ice, smoothstep(0.0, 0.5, h));
      col = mix(col, frost, smoothstep(0.5, 1.0, h));
      // inner glow: particles near the vertical axis glow warmer
      float axDist = length(p.xz);
      col = mix(col, amber*1.3, exp(-axDist*0.6)*0.35);
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.5 * uPixel * (42.0 / -mv.z);
      gl_Position = projectionMatrix * mv;

      // manual fog
      float fogDist = length(mv.xyz);
      vFogFactor = 1.0 - exp(-0.032*0.032*fogDist*fogDist);
    }
  `,
  fragmentShader:`
    uniform vec3 uFogColor;
    varying vec3 vCol;
    varying float vFogFactor;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*16.0)*0.58;
      vec3 c = mix(vCol, uFogColor, vFogFactor);
      gl_FragColor = vec4(c*a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── reflective water-mirror ground plane ──
const N_MIRROR = 18000;
const mPos = new Float32Array(N_MIRROR*3);
const mSeed = new Float32Array(N_MIRROR);
for(let i=0;i<N_MIRROR;i++) mSeed[i]=Math.random();
const mGeom = new THREE.BufferGeometry();
mGeom.setAttribute('position', new THREE.BufferAttribute(mPos,3));
mGeom.setAttribute('seed', new THREE.BufferAttribute(mSeed,1));

const mirrorMat = new THREE.ShaderMaterial({
  uniforms,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vFogFactor;
    void main(){
      vec3 p = position;
      // ripple on the mirror surface
      float t = uTime*0.2 + seed*6.28;
      p.y += 0.015*sin(t + p.x*2.0)*cos(t*0.7 + p.z*1.5);

      // reflection is dimmer, bluer
      vec3 amber = vec3(0.7, 0.5, 0.15);
      vec3 ice   = vec3(0.35, 0.55, 0.72);
      float h = clamp(-p.y / 8.0, 0.0, 1.0);
      vCol = mix(amber, ice, h)*0.45;
      vAlpha = 0.3 * (1.0 - h*0.6);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.2 * uPixel * (36.0 / -mv.z);
      gl_Position = projectionMatrix * mv;

      float fogDist = length(mv.xyz);
      vFogFactor = 1.0 - exp(-0.032*0.032*fogDist*fogDist);
    }
  `,
  fragmentShader:`
    uniform vec3 uFogColor;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vFogFactor;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*14.0)*vAlpha;
      vec3 c = mix(vCol, uFogColor, vFogFactor);
      gl_FragColor = vec4(c*a, a);
    }
  `
});
const mirror = new THREE.Points(mGeom, mirrorMat);
scene.add(mirror);

// ── ambient mist particles (Eliasson fog/atmosphere) ──
const N_MIST = 6000;
const mistPos = new Float32Array(N_MIST*3);
const mistSeed = new Float32Array(N_MIST);
for(let i=0;i<N_MIST;i++){
  mistSeed[i] = Math.random();
  mistPos[i*3]   = (Math.random()-0.5)*30;
  mistPos[i*3+1] = Math.random()*18;
  mistPos[i*3+2] = (Math.random()-0.5)*30;
}
const mistGeom = new THREE.BufferGeometry();
mistGeom.setAttribute('position', new THREE.BufferAttribute(mistPos,3));
mistGeom.setAttribute('seed', new THREE.BufferAttribute(mistSeed,1));

const mistMat = new THREE.ShaderMaterial({
  uniforms,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime*0.08 + seed*50.0;
      p.x += sin(t)*0.8;
      p.y += cos(t*0.7)*0.3;
      p.z += sin(t*0.5+2.0)*0.6;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 2.5 * uPixel * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      float dist = length(mv.xyz);
      vAlpha = 0.04 * exp(-dist*0.04);
    }
  `,
  fragmentShader:`
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*8.0)*vAlpha;
      vec3 c = vec3(0.6, 0.65, 0.72);
      gl_FragColor = vec4(c*a, a);
    }
  `
});
scene.add(new THREE.Points(mistGeom, mistMat));

// ── central amber glow (Weather Project sun reference) ──
const glowGeom = new THREE.BufferGeometry();
const N_GLOW = 3000;
const glowPos = new Float32Array(N_GLOW*3);
const glowSeed = new Float32Array(N_GLOW);
for(let i=0;i<N_GLOW;i++) glowSeed[i]=Math.random();
glowGeom.setAttribute('position', new THREE.BufferAttribute(glowPos,3));
glowGeom.setAttribute('seed', new THREE.BufferAttribute(glowSeed,1));

const glowMat = new THREE.ShaderMaterial({
  uniforms,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime*0.3 + seed*6.28;
      p += 0.06*vec3(sin(t), cos(t*0.8), sin(t*1.2));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 3.0 * uPixel * (50.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vAlpha = 0.12;
    }
  `,
  fragmentShader:`
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*6.0)*vAlpha;
      vec3 c = vec3(0.96, 0.68, 0.18);
      gl_FragColor = vec4(c*a, a);
    }
  `
});
const glow = new THREE.Points(glowGeom, glowMat);
scene.add(glow);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const start = performance.now();
function loop(){
  uniforms.uTime.value = (performance.now()-start)/1000;

  for(let s=0;s<3;s++) step();

  const n = verts.length;
  let yMax=0, yMean=0, xMean=0, zMean=0;

  if(n>1){
    const lengths=[]; let total=0;
    for(let i=0;i<n;i++){
      const a=verts[i], b=verts[(i+1)%n];
      const L=Math.hypot(b.x-a.x, b.y-a.y, b.z-a.z);
      lengths.push(L); total+=L;
      if(a.y>yMax) yMax=a.y;
      yMean+=a.y; xMean+=a.x; zMean+=a.z;
    }
    yMean/=n; xMean/=n; zMean/=n;

    // distribute main particles along polyline
    if(total>0){
      let written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_RENDER-written:Math.max(1,Math.floor(N_RENDER*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_RENDER;k++){
          const u=Math.random();
          rPos[written*3]   = a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.015;
          rPos[written*3+1] = a.y+(b.y-a.y)*u+(Math.random()-0.5)*0.015;
          rPos[written*3+2] = a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.015;
          rAge[written] = Math.max(a.age, b.age);
          rHgt[written] = a.y+(b.y-a.y)*u;
          written++;
        }
      }
      geom.attributes.position.needsUpdate=true;
      geom.attributes.age.needsUpdate=true;
      geom.attributes.hgt.needsUpdate=true;
    }

    // mirror reflection: same particles flipped below y=0, with distortion
    let mWritten=0;
    if(total>0){
      for(let i=0;i<n&&mWritten<N_MIRROR;i++){
        const share=Math.max(1,Math.floor(N_MIRROR*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&mWritten<N_MIRROR;k++){
          const u=Math.random();
          const px=a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.06;
          const py=a.y+(b.y-a.y)*u;
          const pz=a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.06;
          mPos[mWritten*3]   = px;
          mPos[mWritten*3+1] = -py - 0.1; // reflected below water line
          mPos[mWritten*3+2] = pz;
          mWritten++;
        }
      }
      mGeom.attributes.position.needsUpdate=true;
    }

    // glow particles cluster around the core axis
    for(let i=0;i<N_GLOW;i++){
      const h = Math.random()*yMax*0.7;
      const ang = Math.random()*Math.PI*2;
      const r = 0.3+Math.random()*0.8;
      glowPos[i*3]   = xMean + Math.cos(ang)*r;
      glowPos[i*3+1] = h;
      glowPos[i*3+2] = zMean + Math.sin(ang)*r;
    }
    glowGeom.attributes.position.needsUpdate=true;
  }

  uniforms.uYMax.value = Math.max(yMax, 1.0);

  // camera tracks centroid
  const targetY = Math.max(yMean||2, 2.0);
  controls.target.x += (xMean - controls.target.x)*0.03;
  controls.target.y += (targetY - controls.target.y)*0.03;
  controls.target.z += (zMean - controls.target.z)*0.03;
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y)*0.03;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
