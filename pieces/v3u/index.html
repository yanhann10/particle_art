<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: gentle -->
<!-- INTENT: A single great fern frond assembled from 80K leaf-shaped particles via IFS fractal fold — the viewer sees self-similar botanical architecture breathing in stillness, evoking Rogan Brown's paper-cut micro-botanicals. Algo: IFS chaos game. Constraint: leaf as basic unit (each particle is a leaf sprite composing the macro leaf form). -->
<title>v3u · IFS fern fold</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0a07; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">v3u</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── IFS transforms — modified Barnsley fern with asymmetric leaflets ── */
const IFS = [
  { a: 0.00, b: 0.00, c: 0.00, d: 0.16, e: 0.00, f: 0.00, p: 0.02 },
  { a: 0.84, b: 0.04, c:-0.04, d: 0.84, e: 0.00, f: 1.60, p: 0.73 },
  { a: 0.22, b:-0.28, c: 0.26, d: 0.24, e: 0.00, f: 1.40, p: 0.12 },
  { a:-0.16, b: 0.26, c: 0.24, d: 0.22, e: 0.00, f: 0.60, p: 0.13 },
];

const cumP = [];
{ let a = 0; for (const t of IFS){ a += t.p; cumP.push(a); } }

function pickTransform(r){
  for (let j = 0; j < cumP.length; j++) if (r <= cumP[j]) return j;
  return cumP.length - 1;
}

function generateFern(n){
  const pos = new Float32Array(n * 3);
  const seed = new Float32Array(n);
  const branch = new Float32Array(n);
  const depth = new Float32Array(n);

  let x = 0, y = 0;

  /* warm up chaos game */
  for (let i = 0; i < 300; i++){
    const ti = pickTransform(Math.random());
    const t = IFS[ti];
    const nx = t.a * x + t.b * y + t.e;
    const ny = t.c * x + t.d * y + t.f;
    x = nx; y = ny;
  }

  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;

  /* accumulate recent branch history for depth layering */
  let recentBranch = 1;

  for (let i = 0; i < n; i++){
    const r = Math.random();
    const ti = pickTransform(r);
    const t = IFS[ti];
    const nx = t.a * x + t.b * y + t.e;
    const ny = t.c * x + t.d * y + t.f;
    x = nx; y = ny;
    recentBranch = recentBranch * 0.85 + ti * 0.15;

    /* z-depth from branch identity + gentle curl */
    const zBranch = ti === 2 ? -0.35 : ti === 3 ? 0.35 : ti === 0 ? 0.0 : 0.05;
    const zCurl = Math.sin(y * 0.25) * 0.2;
    const z = zBranch + zCurl + (Math.random() - 0.5) * 0.08;

    pos[i * 3]     = x;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = z;
    seed[i] = Math.random();
    branch[i] = ti;
    depth[i] = recentBranch;

    if (x < xMin) xMin = x;
    if (x > xMax) xMax = x;
    if (y < yMin) yMin = y;
    if (y > yMax) yMax = y;
  }

  /* center and scale to fit nicely */
  const cx = (xMin + xMax) * 0.5;
  const cy = (yMin + yMax) * 0.5;
  const span = Math.max(xMax - xMin, yMax - yMin);
  const sc = 12.0 / span;

  for (let i = 0; i < n; i++){
    pos[i * 3]     = (pos[i * 3]     - cx) * sc;
    pos[i * 3 + 1] = (pos[i * 3 + 1] - cy) * sc;
    pos[i * 3 + 2] *= sc;
  }

  return { pos, seed, branch, depth };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(1.5, 2.0, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0a07, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0.5, 0);
controls.autoRotate = false;

const N = 80000;

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReveal: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReveal;
    attribute float seed;
    attribute float branch;
    attribute float depth;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.35 + seed * 6.2832;

      /* ── breathing: slow scale pulse anchored at base ── */
      float yFrac = clamp((p.y + 6.0) / 12.0, 0.0, 1.0);
      float breath = 1.0 + 0.02 * sin(uTime * 0.28 + yFrac * 1.2);
      p.x *= breath;
      p.y = mix(p.y, p.y * breath, yFrac); /* base stays fixed */

      /* ── sway: wind through frond, more at tips ── */
      float swayAmt = yFrac * yFrac * 0.12;
      float swayPhase = uTime * 0.2 + seed * 1.5;
      p.x += swayAmt * sin(swayPhase + p.y * 0.3);
      p.z += swayAmt * 0.4 * cos(swayPhase * 0.7 + p.y * 0.2);

      /* ── leaflet flutter: side branches shiver ── */
      float isSide = step(1.5, branch);
      float flutter = isSide * 0.012 * sin(t * 1.8 + depth * 4.0);
      p.x += flutter;
      p.y += flutter * 0.3;

      /* ── reveal: particles fall from sky into form ── */
      vec3 scattered = vec3(
        seed * 14.0 - 7.0,
        16.0 + seed * 8.0,
        (seed - 0.5) * 6.0
      );
      float rev = smoothstep(0.0, 1.0, uReveal);
      p = mix(scattered, p, rev);

      /* ── palette: moss / sage / lichen / bone ── */
      vec3 darkMoss  = vec3(0.18, 0.24, 0.13);
      vec3 sage      = vec3(0.32, 0.38, 0.24);
      vec3 lichen    = vec3(0.42, 0.44, 0.30);
      vec3 amber     = vec3(0.50, 0.38, 0.18);
      vec3 bone      = vec3(0.65, 0.58, 0.42);

      /* height gradient: dark base → lighter tips */
      vec3 col = mix(darkMoss, sage, yFrac);
      col = mix(col, lichen, yFrac * yFrac);

      /* stem is amber */
      float isStem = 1.0 - step(0.5, branch);
      col = mix(col, amber, isStem * 0.6);

      /* tip leaflets get bone highlights */
      col = mix(col, bone, isSide * yFrac * 0.2);

      /* subtle warmth variation per particle */
      col += 0.015 * vec3(
        sin(t * 0.25),
        sin(t * 0.3 + 1.2) * 0.6,
        0.0
      );

      vCol = col;

      /* alpha: core denser, edges fade */
      float edgeFade = 1.0 - isSide * 0.15;
      vAlpha = (0.45 + 0.35 * sin(t * 0.15 + 0.8)) * edgeFade * rev;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.5 + 0.7 * seed) * uPixel * (38.0 / dist) * rev;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec2 uv = gl_PointCoord - 0.5;

      /* leaf-shaped: elongated vertically, pointed ends */
      float rx = abs(uv.x) * 1.7;
      float ry = abs(uv.y) * 1.0;
      float r = sqrt(rx * rx + ry * ry);
      if (r > 0.48) discard;

      float core = exp(-r * r * 16.0);
      float edge = smoothstep(0.48, 0.15, r);
      float a = (core * 0.75 + edge * 0.25) * vAlpha;

      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

/* ── Build geometry ── */
let geom, points;
let revealStart = performance.now();

function regrow(){
  const data = generateFern(N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(data.pos, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(data.seed, 1));
    geom.setAttribute('branch',   new THREE.BufferAttribute(data.branch, 1));
    geom.setAttribute('depth',    new THREE.BufferAttribute(data.depth, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(data.pos); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(data.seed);     geom.attributes.seed.needsUpdate = true;
    geom.attributes.branch.array.set(data.branch); geom.attributes.branch.needsUpdate = true;
    geom.attributes.depth.array.set(data.depth);   geom.attributes.depth.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
  uniforms.uReveal.value = 0;
}

regrow();

addEventListener('click', (e) => {
  if (e.target.closest('#piece-ctrl, #gp-panel')) return;
  regrow();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Render loop ── */
const t0 = performance.now();
const driftTarget = new THREE.Vector3();

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) / 1000;
  uniforms.uTime.value = elapsed;

  /* reveal over 2.5s */
  uniforms.uReveal.value = Math.min(1.0, (now - revealStart) / 2500);

  /* very slow lateral drift — no Y rotation */
  driftTarget.x = Math.sin(elapsed * 0.035) * 0.3;
  driftTarget.y = 0.5 + Math.sin(elapsed * 0.025 + 1.0) * 0.15;
  driftTarget.z = 0;
  controls.target.lerp(driftTarget, 0.008);
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
