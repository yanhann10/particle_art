<div class="src">Tomás Saraceno · spider web scan · cosmic network</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/* Tomás Saraceno — tension architecture / cosmic web
   An orb-weaver web rendered as silver silk on near-black ink.
   Radial spokes + concentric spiral rings, with deliberate tears
   and asymmetric gaps. Fat lines for silk, point cloud for dew.
   
   Named technique: orb-web topology (radial + spiral graph)
   Contemporary evocation: Saraceno's "Webs of At-tent(s)ion" laser scans
   Creative constraint: web must read in 2 seconds — no growth distortion
   Algo pattern: graph-based radial + Archimedean spiral placement */

const BG = 0x06080a;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);
controls.autoRotate = false;

// ---------- WEB GEOMETRY ----------
const NUM_SPOKES = 24;
const SPOKE_R = 5.2;
const SPIRAL_TURNS = 18;
const SPIRAL_POINTS_PER_TURN = 40;
const CENTER_R = 0.45;

// Spoke angles — slightly irregular (real webs aren't perfect)
const spokeAngles = [];
for (let i = 0; i < NUM_SPOKES; i++) {
  const base = (i / NUM_SPOKES) * Math.PI * 2;
  const jitter = (Math.random() - 0.5) * 0.06;
  spokeAngles.push(base + jitter);
}

// Deliberate tears: some spokes are short (broken), some spiral gaps
const brokenSpokes = new Set();
// Break 4 adjacent spokes on one side (torn section — asymmetry)
const tearStart = Math.floor(Math.random() * NUM_SPOKES);
for (let k = 0; k < 4; k++) {
  brokenSpokes.add((tearStart + k) % NUM_SPOKES);
}
// One lone broken spoke elsewhere
brokenSpokes.add((tearStart + 12) % NUM_SPOKES);

const spokeMaxR = [];
for (let i = 0; i < NUM_SPOKES; i++) {
  if (brokenSpokes.has(i)) {
    spokeMaxR.push(CENTER_R + (SPOKE_R - CENTER_R) * (0.2 + Math.random() * 0.35));
  } else {
    spokeMaxR.push(SPOKE_R * (0.88 + Math.random() * 0.12));
  }
}

// Z-plane variation: web is not perfectly flat (Saraceno's 3D scans)
function webZ(angle, r) {
  return Math.sin(angle * 2.3 + r * 0.8) * 0.15 + Math.cos(angle * 1.7) * 0.1 * r * 0.2;
}

// ---------- BUILD SPOKE LINES ----------
const allLines = [];

function addFatLine(positions, widths, color, opacity) {
  const geom = new LineGeometry();
  geom.setPositions(positions);
  const mat = new LineMaterial({
    color: color,
    linewidth: 1.2,
    transparent: true,
    opacity: opacity,
    alphaToCoverage: false,
    worldUnits: false,
    dashed: false,
    resolution: new THREE.Vector2(innerWidth, innerHeight)
  });
  const line = new Line2(geom, mat);
  line.computeLineDistances();
  scene.add(line);
  allLines.push({ line, mat });
  return line;
}

// Colors: silver, bone, faint steel
const silkColors = [0xa8a8a0, 0xb0aba0, 0x9a9890, 0xc0bab0];

// Spokes
for (let i = 0; i < NUM_SPOKES; i++) {
  const angle = spokeAngles[i];
  const maxR = spokeMaxR[i];
  const pts = [];
  const segs = 20;
  for (let j = 0; j <= segs; j++) {
    const r = CENTER_R + (maxR - CENTER_R) * (j / segs);
    pts.push(
      Math.cos(angle) * r,
      Math.sin(angle) * r,
      webZ(angle, r)
    );
  }
  const col = silkColors[i % silkColors.length];
  const op = brokenSpokes.has(i) ? 0.25 : 0.45;
  addFatLine(pts, null, col, op);
}

// ---------- BUILD SPIRAL RINGS ----------
// Archimedean spiral, but skip sections in the torn region
const spiralSegments = [];
let currentSeg = [];

for (let t = 0; t < SPIRAL_TURNS * SPIRAL_POINTS_PER_TURN; t++) {
  const frac = t / (SPIRAL_TURNS * SPIRAL_POINTS_PER_TURN);
  const r = CENTER_R + (SPOKE_R - CENTER_R) * frac;
  const angle = frac * SPIRAL_TURNS * Math.PI * 2;

  // Check if we're in the torn region
  const normAngle = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const tearAngleStart = spokeAngles[tearStart];
  const tearAngleEnd = spokeAngles[(tearStart + 3) % NUM_SPOKES];
  
  let inTear = false;
  if (r > CENTER_R + 0.8) {
    // Angular distance check for tear region
    const a1 = ((tearAngleStart % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const a2 = ((tearAngleEnd % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    if (a2 > a1) {
      inTear = normAngle > a1 && normAngle < a2;
    } else {
      inTear = normAngle > a1 || normAngle < a2;
    }
    // Fade tear probability with radius
    if (inTear && r < CENTER_R + 1.5) inTear = Math.random() > 0.5;
  }

  const x = Math.cos(angle) * r;
  const y = Math.sin(angle) * r;
  const z = webZ(angle, r);

  if (inTear) {
    if (currentSeg.length >= 6) {
      spiralSegments.push([...currentSeg]);
    }
    currentSeg = [];
  } else {
    currentSeg.push(x, y, z);
  }
}
if (currentSeg.length >= 6) spiralSegments.push(currentSeg);

for (const seg of spiralSegments) {
  const col = silkColors[Math.floor(Math.random() * silkColors.length)];
  addFatLine(seg, null, col, 0.32 + Math.random() * 0.15);
}

// ---------- ANCHOR FRAME (outer structural threads) ----------
const frameAngles = [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5];
for (const fa of frameAngles) {
  const pts = [];
  const r0 = SPOKE_R * 0.9;
  const r1 = SPOKE_R * 1.3;
  for (let j = 0; j <= 8; j++) {
    const r = r0 + (r1 - r0) * (j / 8);
    const wobble = Math.sin(j * 0.8) * 0.15;
    pts.push(
      Math.cos(fa + wobble * 0.05) * r,
      Math.sin(fa + wobble * 0.05) * r,
      webZ(fa, r) + wobble * 0.3
    );
  }
  addFatLine(pts, null, 0x807870, 0.2);
}

// ---------- DEW PARTICLES (points along web threads) ----------
const N_PARTICLES = 30000;
const pPos = new Float32Array(N_PARTICLES * 3);
const pSeed = new Float32Array(N_PARTICLES);
const pBright = new Float32Array(N_PARTICLES);

// Distribute particles along spokes and spiral
let pi = 0;

// Along spokes
for (let i = 0; i < NUM_SPOKES && pi < N_PARTICLES; i++) {
  const angle = spokeAngles[i];
  const maxR = spokeMaxR[i];
  const count = brokenSpokes.has(i) ? 80 : 200;
  for (let k = 0; k < count && pi < N_PARTICLES; k++) {
    const r = CENTER_R + (maxR - CENTER_R) * Math.random();
    const spread = 0.02;
    pPos[pi * 3]     = Math.cos(angle) * r + (Math.random() - 0.5) * spread;
    pPos[pi * 3 + 1] = Math.sin(angle) * r + (Math.random() - 0.5) * spread;
    pPos[pi * 3 + 2] = webZ(angle, r) + (Math.random() - 0.5) * spread;
    pSeed[pi] = Math.random();
    pBright[pi] = 0.4 + Math.random() * 0.6;
    pi++;
  }
}

// Along spiral segments
for (const seg of spiralSegments) {
  const nPts = seg.length / 3;
  const count = Math.min(Math.floor(nPts * 3), Math.floor((N_PARTICLES - pi) / spiralSegments.length));
  for (let k = 0; k < count && pi < N_PARTICLES; k++) {
    const t = Math.random() * (nPts - 1);
    const ti = Math.floor(t);
    const tf = t - ti;
    const ni = Math.min(ti + 1, nPts - 1);
    const spread = 0.015;
    pPos[pi * 3]     = seg[ti * 3] + (seg[ni * 3] - seg[ti * 3]) * tf + (Math.random() - 0.5) * spread;
    pPos[pi * 3 + 1] = seg[ti * 3 + 1] + (seg[ni * 3 + 1] - seg[ti * 3 + 1]) * tf + (Math.random() - 0.5) * spread;
    pPos[pi * 3 + 2] = seg[ti * 3 + 2] + (seg[ni * 3 + 2] - seg[ti * 3 + 2]) * tf + (Math.random() - 0.5) * spread;
    pSeed[pi] = Math.random();
    pBright[pi] = 0.3 + Math.random() * 0.5;
    pi++;
  }
}

// Hub concentration (dense center like real orb web)
while (pi < N_PARTICLES) {
  const angle = Math.random() * Math.PI * 2;
  const r = Math.random() * CENTER_R * 2.5;
  const spread = 0.03;
  pPos[pi * 3]     = Math.cos(angle) * r + (Math.random() - 0.5) * spread;
  pPos[pi * 3 + 1] = Math.sin(angle) * r + (Math.random() - 0.5) * spread;
  pPos[pi * 3 + 2] = webZ(angle, r) + (Math.random() - 0.5) * 0.04;
  pSeed[pi] = Math.random();
  pBright[pi] = 0.5 + Math.random() * 0.5;
  pi++;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(pSeed, 1));
geom.setAttribute('bright', new THREE.BufferAttribute(pBright, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor: { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.028 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float bright;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      // Subtle vibration — web tension tremor (wind on silk)
      float phase = uTime * 0.4 + seed * 6.2831;
      float r = length(p.xy);
      float tremor = sin(phase + r * 2.0) * 0.003 * (0.5 + r * 0.15);
      p.x += tremor;
      p.y += cos(phase * 0.7 + seed * 3.0) * 0.002;
      p.z += sin(phase * 0.5) * 0.004 * (0.3 + r * 0.1);

      // Dew glint: occasional bright flash
      float glint = pow(max(0.0, sin(uTime * 0.8 + seed * 50.0)), 16.0) * 0.4;

      // Silver-bone palette
      vec3 silver = vec3(0.72, 0.71, 0.68);
      vec3 bone   = vec3(0.78, 0.74, 0.68);
      vec3 steel  = vec3(0.62, 0.63, 0.65);
      vec3 col = mix(mix(silver, bone, seed), steel, sin(seed * 12.0) * 0.5 + 0.5);

      vCol = col * (bright + glint);
      vAlpha = (0.35 + bright * 0.35 + glint) * (0.7 + 0.3 * sin(uTime * 0.3 + seed * 4.0));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // Larger near center (hub density), smaller at edges
      float sizeBase = r < 1.0 ? 1.4 : 1.1;
      gl_PointSize = sizeBase * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 28.0);
      float halo = exp(-r * 6.0) * 0.2;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.85);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ---------- PROPAGATION WAVE (scientific: signal traveling the web) ----------
// A subtle brightness wave that propagates outward from center — like Saraceno's
// vibrational studies of spider communication through silk
const waveUniforms = {
  uWaveR: { value: 0 },
  uWaveWidth: { value: 0.6 }
};

// We'll modulate particle brightness via the wave in the animation loop
const baseBright = new Float32Array(pBright);

let paused = false;
addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  paused = !paused;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  for (const { mat } of allLines) {
    mat.resolution.set(innerWidth, innerHeight);
  }
});

const statEl = document.getElementById('stat');
const startT = performance.now();

// Slow camera drift: single gentle pass, not oscillation
const camDriftAngle = { value: 0 };

function loop() {
  const t = (performance.now() - startT) / 1000;
  uniforms.uTime.value = t;

  if (!paused) {
    // Propagation wave: radial pulse every ~8 seconds
    const waveCycle = 8.0;
    const waveT = (t % waveCycle) / waveCycle;
    const waveR = waveT * (SPOKE_R * 1.5);
    const waveW = 0.8;

    // Update particle brightness with wave
    for (let i = 0; i < N_PARTICLES; i++) {
      const x = pPos[i * 3], y = pPos[i * 3 + 1];
      const r = Math.sqrt(x * x + y * y);
      const waveDist = Math.abs(r - waveR);
      const waveBoost = waveDist < waveW ? (1.0 - waveDist / waveW) * 0.35 : 0;
      pBright[i] = baseBright[i] + waveBoost;
    }
    geom.attributes.bright.needsUpdate = true;

    // Gentle web breathing — very subtle Z oscillation of silk lines
    // (Saraceno's studies show webs vibrate as information networks)
  }

  // Single slow drift — camera eases slightly over time, never returns
  if (t < 120) {
    const drift = t * 0.0008;
    camera.position.x = Math.sin(drift) * 0.8;
    camera.position.y = Math.cos(drift * 0.7) * 0.3;
  }

  controls.update();
  renderer.render(scene, camera);
  statEl.textContent = `N=${N_PARTICLES}${paused ? ' · paused' : ''}`;
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
