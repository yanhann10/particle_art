<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9o9 · voronoi shatter · point-cloud tear</title>
<!-- MOTION: shatter, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">9o9</div>
<div class="hint">move mouse to shatter · click to reset</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Real-object point cloud (human bust) that shatters along Voronoi cell boundaries
// when mouse moves. At rest (mouse near center), the figure is recognizable.
// On pointer motion, particles tear apart along their assigned cell edges.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0a0e, 0.035);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a0e, 1);
document.body.appendChild(renderer.domElement);

const light1 = new THREE.DirectionalLight(0xfff5e8, 0.8);
light1.position.set(3, 5, 4);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0x6a8aa3, 0.4);
light2.position.set(-4, 2, -3);
scene.add(light2);
scene.add(new THREE.AmbientLight(0x1a1520, 0.5));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1.5, 0);
controls.enablePan = false;

// ─────────── generate human bust point cloud
function generateBust(){
  const pts = [];
  // head sphere
  for (let i = 0; i < 2400; i++){
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 0.65 + (Math.random() - 0.5) * 0.08;
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = 2.2 + r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);
    pts.push({ x, y, z });
  }
  // neck cylinder
  for (let i = 0; i < 600; i++){
    const th = Math.random() * Math.PI * 2;
    const h = Math.random() * 0.6;
    const r = 0.28 + (Math.random() - 0.5) * 0.04;
    const x = r * Math.cos(th);
    const y = 1.5 + h;
    const z = r * Math.sin(th);
    pts.push({ x, y, z });
  }
  // shoulders ellipsoid
  for (let i = 0; i < 1800; i++){
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const rx = 0.9, ry = 0.35, rz = 0.5;
    const x = rx * Math.sin(phi) * Math.cos(theta);
    const yy = ry * Math.sin(phi) * Math.sin(theta);
    const z = rz * Math.cos(phi);
    if (yy > 0) continue; // top half only
    const y = 1.4 + yy;
    pts.push({ x, y, z });
  }
  // chest partial cylinder
  for (let i = 0; i < 1200; i++){
    const th = (Math.random() - 0.5) * Math.PI * 1.4;
    const h = Math.random() * 0.7;
    const r = 0.65 + (Math.random() - 0.5) * 0.06;
    const x = r * Math.cos(th);
    const y = 0.7 + h;
    const z = r * Math.sin(th);
    pts.push({ x, y, z });
  }
  return pts;
}

const bustPts = generateBust();

// ─────────── Voronoi cell assignment via Lloyd relaxation
const NUM_CELLS = 40;
const centers = [];
for (let i = 0; i < NUM_CELLS; i++){
  const pt = bustPts[Math.floor(Math.random() * bustPts.length)];
  centers.push({ x: pt.x, y: pt.y, z: pt.z });
}

// 3 iterations of Lloyd to stabilize
for (let iter = 0; iter < 3; iter++){
  const assigned = Array(NUM_CELLS).fill(null).map(() => []);
  for (const pt of bustPts){
    let minD = Infinity, bestC = 0;
    for (let c = 0; c < NUM_CELLS; c++){
      const dx = pt.x - centers[c].x, dy = pt.y - centers[c].y, dz = pt.z - centers[c].z;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < minD){ minD = d2; bestC = c; }
    }
    assigned[bestC].push(pt);
  }
  for (let c = 0; c < NUM_CELLS; c++){
    if (assigned[c].length === 0) continue;
    let sx = 0, sy = 0, sz = 0;
    for (const p of assigned[c]){ sx += p.x; sy += p.y; sz += p.z; }
    centers[c].x = sx / assigned[c].length;
    centers[c].y = sy / assigned[c].length;
    centers[c].z = sz / assigned[c].length;
  }
}

// final assignment + store cell index
for (const pt of bustPts){
  let minD = Infinity, bestC = 0;
  for (let c = 0; c < NUM_CELLS; c++){
    const dx = pt.x - centers[c].x, dy = pt.y - centers[c].y, dz = pt.z - centers[c].z;
    const d2 = dx*dx + dy*dy + dz*dz;
    if (d2 < minD){ minD = d2; bestC = c; }
  }
  pt.cell = bestC;
  pt.restX = pt.x;
  pt.restY = pt.y;
  pt.restZ = pt.z;
}

// assign each cell a dispersion vector (direction it will tear away)
for (let c = 0; c < NUM_CELLS; c++){
  const cx = centers[c];
  const th = (c / NUM_CELLS) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
  const ph = (Math.random() - 0.5) * Math.PI * 0.6;
  cx.dx = Math.cos(th) * Math.cos(ph);
  cx.dy = Math.sin(ph);
  cx.dz = Math.sin(th) * Math.cos(ph);
}

// ─────────── render point cloud
const positions = new Float32Array(bustPts.length * 3);
const colors = new Float32Array(bustPts.length * 3);
for (let i = 0; i < bustPts.length; i++){
  const pt = bustPts[i];
  positions[i * 3]     = pt.x;
  positions[i * 3 + 1] = pt.y;
  positions[i * 3 + 2] = pt.z;
  // color per cell — warm clay palette
  const hue = (pt.cell * 17) % 360;
  const c = new THREE.Color().setHSL((hue + 20) / 360, 0.22, 0.45);
  colors[i * 3]     = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.85,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ─────────── pointer input
let mouseX = 0, mouseY = 0;
addEventListener('mousemove', e => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = -(e.clientY / innerHeight) * 2 + 1;
});

let resetFlag = false;
addEventListener('click', () => { resetFlag = true; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;

  if (resetFlag){
    mouseX = 0; mouseY = 0;
    resetFlag = false;
  }

  // shatter intensity from mouse distance from center
  const distFromCenter = Math.sqrt(mouseX * mouseX + mouseY * mouseY);
  const shatterAmt = Math.min(distFromCenter * 1.8, 1.0);

  const posArr = geom.attributes.position.array;
  for (let i = 0; i < bustPts.length; i++){
    const pt = bustPts[i];
    const cell = centers[pt.cell];
    const disperse = shatterAmt * 3.5;
    const targetX = pt.restX + cell.dx * disperse;
    const targetY = pt.restY + cell.dy * disperse;
    const targetZ = pt.restZ + cell.dz * disperse;
    
    pt.x += (targetX - pt.x) * 0.08;
    pt.y += (targetY - pt.y) * 0.08;
    pt.z += (targetZ - pt.z) * 0.08;

    posArr[i * 3]     = pt.x;
    posArr[i * 3 + 1] = pt.y;
    posArr[i * 3 + 2] = pt.z;
  }
  geom.attributes.position.needsUpdate = true;

  // subtle orbit
  camera.position.x = 6 * Math.sin(t * 0.08);
  camera.position.z = 6 * Math.cos(t * 0.08);
  camera.lookAt(0, 1.5, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
