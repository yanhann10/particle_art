<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rgr · coral latent space · large nature model</title>
<!-- MOTION: morph, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1215; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">rgr · coral latent space · large nature model</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Refik Anadol — Echoes of the Earth: Large Nature Model
// AI-hallucinated coral reef: parametric coral primitives morphing through
// 'species latent space' (4D Perlin drift). Subsurface-scattering shader
// for wet biological texture. Plankton particles. Turquoise/coral/lime palette.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a1215, 8, 30);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 6, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1215, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

// underwater lighting
const keyLight = new THREE.DirectionalLight(0x4dffff, 1.6);
keyLight.position.set(3, 8, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88ffcc, 0.7);
rimLight.position.set(-4, 5, -4);
scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x1a3d44, 0.5));

// volumetric fog plane (depth-haze between layers)
const fogPlaneGeo = new THREE.PlaneGeometry(40, 40);
const fogPlaneMat = new THREE.MeshBasicMaterial({
  color: 0x0f2d33,
  transparent: true,
  opacity: 0.15,
  side: THREE.DoubleSide,
  depthWrite: false
});
const fogPlane = new THREE.Mesh(fogPlaneGeo, fogPlaneMat);
fogPlane.rotation.x = -Math.PI / 2;
fogPlane.position.y = 3.5;
scene.add(fogPlane);

// substrate plane (sandy reef floor with hexagonal grid displacement)
const substrateGeo = new THREE.PlaneGeometry(24, 24, 80, 80);
const substratePos = substrateGeo.attributes.position;
for (let i = 0; i < substratePos.count; i++){
  const x = substratePos.getX(i), z = substratePos.getZ(i);
  // hexagonal grid base + Perlin displacement
  const hx = Math.round(x / 1.2) * 1.2, hz = Math.round(z / 1.2) * 1.2;
  const gridDist = Math.hypot(x - hx, z - hz);
  const perlin = (Math.sin(x * 0.8 + z * 0.5) * 0.5 + 0.5) * 0.3;
  const displace = perlin * (1 - Math.min(gridDist / 0.3, 1));
  substratePos.setY(i, displace * 0.6);
}
substrateGeo.computeVertexNormals();
const substrateMat = new THREE.MeshStandardMaterial({
  color: 0x3a4a52,
  roughness: 0.9,
  metalness: 0.0
});
const substrate = new THREE.Mesh(substrateGeo, substrateMat);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = 0;
scene.add(substrate);

// coral species archetypes — morphable parameters
const SPECIES = [
  { type: 'tube',   heightScale: 1.4, radiusScale: 0.3, branchProb: 0.0, color: [1.0, 0.4, 0.35] }, // coral pink
  { type: 'branch', heightScale: 1.0, radiusScale: 0.2, branchProb: 0.6, color: [0.8, 0.9, 0.3]  }, // lime
  { type: 'plate',  heightScale: 0.5, radiusScale: 0.8, branchProb: 0.0, color: [0.3, 0.9, 0.85] }, // turquoise
  { type: 'brain',  heightScale: 0.7, radiusScale: 0.6, branchProb: 0.0, color: [0.95, 0.6, 0.4] }, // warm coral
];

// procedural coral geometry builder
function buildCoralGeometry(params){
  const { heightScale, radiusScale, branchProb } = params;
  const geo = new THREE.BufferGeometry();
  const vertices = [], indices = [];
  const segments = 12, rings = 8;
  const baseRadius = radiusScale * 0.5;
  const height = heightScale * 2.0;
  
  for (let r = 0; r <= rings; r++){
    const y = (r / rings) * height;
    const taper = 1 - (r / rings) * 0.7;
    const wobble = Math.sin(r * 1.3) * 0.15 + 1;
    const rad = baseRadius * taper * wobble;
    for (let s = 0; s <= segments; s++){
      const theta = (s / segments) * Math.PI * 2;
      const x = Math.cos(theta) * rad;
      const z = Math.sin(theta) * rad;
      vertices.push(x, y, z);
    }
  }
  for (let r = 0; r < rings; r++){
    for (let s = 0; s < segments; s++){
      const a = r * (segments + 1) + s;
      const b = a + 1;
      const c = (r + 1) * (segments + 1) + s;
      const d = c + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// subsurface scattering shader (wet coral feel)
const coralVertexShader = `
varying vec3 vNormal;
varying vec3 vPosition;
varying vec3 vViewPosition;
void main(){
  vNormal = normalize(normalMatrix * normal);
  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
  vViewPosition = -mvPos.xyz;
  vPosition = position;
  gl_Position = projectionMatrix * mvPos;
}
`;
const coralFragmentShader = `
uniform vec3 uColor;
uniform float uTime;
varying vec3 vNormal;
varying vec3 vPosition;
varying vec3 vViewPosition;

void main(){
  vec3 lightDir = normalize(vec3(0.5, 1.0, 0.3));
  float NdotL = max(dot(vNormal, lightDir), 0.0);
  
  // subsurface scatter approximation
  vec3 viewDir = normalize(vViewPosition);
  float backScatter = max(0.0, dot(viewDir, -lightDir));
  float thickness = 0.4 + 0.3 * sin(vPosition.y * 2.0 + uTime * 0.5);
  float sss = pow(backScatter, 8.0) * thickness;
  
  vec3 diffuse = uColor * (0.4 + 0.6 * NdotL);
  vec3 scatter = vec3(1.0, 0.8, 0.7) * sss * 0.5;
  
  // wet sheen
  float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 3.0);
  vec3 sheen = vec3(0.3, 0.5, 0.6) * fresnel * 0.4;
  
  gl_FragColor = vec4(diffuse + scatter + sheen, 1.0);
}
`;

// coral colony instances
const CORAL_COUNT = 140;
const coralData = [];
for (let i = 0; i < CORAL_COUNT; i++){
  const angle = (i / CORAL_COUNT) * Math.PI * 2 + Math.random() * 0.4;
  const dist = 1.5 + Math.random() * 7.0;
  const x = Math.cos(angle) * dist;
  const z = Math.sin(angle) * dist;
  // cluster assignment (3 zones)
  const clusterIdx = Math.floor((angle / (Math.PI * 2)) * 3);
  coralData.push({
    pos: new THREE.Vector3(x, 0, z),
    scale: 0.6 + Math.random() * 0.7,
    speciesIdx: Math.floor(Math.random() * SPECIES.length),
    latent: [Math.random(), Math.random(), Math.random(), Math.random()],
    cluster: clusterIdx,
    mesh: null,
    targetParams: null
  });
}

// build initial meshes
for (const coral of coralData){
  const species = SPECIES[coral.speciesIdx];
  const geo = buildCoralGeometry(species);
  const mat = new THREE.ShaderMaterial({
    vertexShader: coralVertexShader,
    fragmentShader: coralFragmentShader,
    uniforms: {
      uColor: { value: new THREE.Vector3(...species.color) },
      uTime: { value: 0 }
    },
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(coral.pos);
  mesh.scale.setScalar(coral.scale);
  mesh.rotation.y = Math.random() * Math.PI * 2;
  scene.add(mesh);
  coral.mesh = mesh;
  coral.targetParams = { ...species };
}

// plankton particles (drift in front)
const planktonCount = 600;
const planktonGeo = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonVel = [];
for (let i = 0; i < planktonCount; i++){
  planktonPos[i * 3] = (Math.random() - 0.5) * 20;
  planktonPos[i * 3 + 1] = Math.random() * 8;
  planktonPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
  planktonVel.push({
    x: (Math.random() - 0.5) * 0.01,
    y: (Math.random() - 0.5) * 0.005,
    z: (Math.random() - 0.5) * 0.01
  });
}
planktonGeo.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
const planktonMat = new THREE.PointsMaterial({
  color: 0xaaffee,
  size: 0.04,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const plankton = new THREE.Points(planktonGeo, planktonMat);
scene.add(plankton);

// 4D Perlin noise for latent-space drift
function noise4D(x, y, z, w){
  const n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164 + w * 94.673) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

// morph logic: drift latent coords → interpolate species params
function morphCorals(t){
  const morphSpeed = 0.08;
  for (let i = 0; i < coralData.length; i++){
    const coral = coralData[i];
    // drift each latent dimension via 4D noise
    for (let d = 0; d < 4; d++){
      const drift = noise4D(
        coral.latent[0] + t * morphSpeed * 0.5,
        coral.latent[1] + t * morphSpeed * 0.6,
        coral.latent[2] + t * morphSpeed * 0.7,
        coral.latent[3] + t * morphSpeed * 0.8 + d * 10
      ) * 0.002;
      coral.latent[d] += drift;
      coral.latent[d] = (coral.latent[d] % 1 + 1) % 1;
    }
    // map latent to species blend (3D slice of 4D)
    const blend = coral.latent[0]; // primary axis
    const speciesFloat = blend * SPECIES.length;
    const idxA = Math.floor(speciesFloat) % SPECIES.length;
    const idxB = (idxA + 1) % SPECIES.length;
    const mix = speciesFloat - Math.floor(speciesFloat);
    const sA = SPECIES[idxA], sB = SPECIES[idxB];
    
    coral.targetParams.heightScale = sA.heightScale * (1 - mix) + sB.heightScale * mix;
    coral.targetParams.radiusScale = sA.radiusScale * (1 - mix) + sB.radiusScale * mix;
    coral.targetParams.branchProb  = sA.branchProb  * (1 - mix) + sB.branchProb  * mix;
    
    // color interpolation
    const cA = sA.color, cB = sB.color;
    const r = cA[0] * (1 - mix) + cB[0] * mix;
    const g = cA[1] * (1 - mix) + cB[1] * mix;
    const b = cA[2] * (1 - mix) + cB[2] * mix;
    coral.mesh.material.uniforms.uColor.value.set(r, g, b);
    
    // rebuild geometry every ~5 seconds for significant morph
    if (i % 40 === Math.floor(t * 0.2) % 40){
      const newGeo = buildCoralGeometry(coral.targetParams);
      coral.mesh.geometry.dispose();
      coral.mesh.geometry = newGeo;
    }
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  morphCorals(t);
  
  // update plankton drift
  const pos = plankton.geometry.attributes.position.array;
  for (let i = 0; i < planktonCount; i++){
    pos[i * 3]     += planktonVel[i].x;
    pos[i * 3 + 1] += planktonVel[i].y;
    pos[i * 3 + 2] += planktonVel[i].z;
    if (Math.abs(pos[i * 3]) > 10) planktonVel[i].x *= -1;
    if (pos[i * 3 + 1] < 0 || pos[i * 3 + 1] > 8) planktonVel[i].y *= -1;
    if (Math.abs(pos[i * 3 + 2]) > 10) planktonVel[i].z *= -1;
  }
  plankton.geometry.attributes.position.needsUpdate = true;
  
  // update shader time
  for (const coral of coralData){
    coral.mesh.material.uniforms.uTime.value = t;
  }
  
  // camera orbit (slow)
  camera.position.x = Math.cos(t * 0.08) * 12;
  camera.position.z = Math.sin(t * 0.08) * 12;
  camera.position.y = 6 + Math.sin(t * 0.05) * 1.5;
  camera.lookAt(controls.target);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
