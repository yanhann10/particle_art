<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y2s · leaf mandala samadhi</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#050402; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:28px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; bottom:12px; opacity:0.35; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">y2s</div>
<div class="hint">orbit drag · leaf mandala · 8-fold symmetry</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 3, 25);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050402, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotate = false;
controls.minDistance = 8;
controls.maxDistance = 45;
controls.target.set(0, 0, 0);

/* ── FOLDED LEAF L-SYSTEM: sample surface positions from bouquet ── */
function buildLeafSurface(cfg) {
  const { w, l, curl, pos, rot, scale } = cfg;
  const segs = 32;
  const verts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const y = (t - 0.5) * l;
    const twist = curl * Math.sin(t * Math.PI);
    const width = w * Math.sin(t * Math.PI);
    const z = curl * 0.8 * Math.pow(Math.sin(t * Math.PI), 2);
    verts.push([-width * 0.5, y, z + twist * 0.4]);
    verts.push([ width * 0.5, y, z - twist * 0.4]);
  }
  // collect triangles for random sampling
  const tris = [];
  for (let i = 0; i < segs; i++) {
    const base = i * 2;
    tris.push([verts[base], verts[base+1], verts[base+2]]);
    tris.push([verts[base+1], verts[base+3], verts[base+2]]);
  }
  return { tris, pos, rot, scale };
}

const leafConfigs = [
  { w: 2.2, l: 6.0, curl: 1.2, pos: [0, 0, 0],       rot: [0, 0, 0],       scale: 1.0  },
  { w: 1.8, l: 5.0, curl: 1.5, pos: [-1.5,-1.0, 0.3], rot: [0.3,-0.5, 0.6], scale: 0.85 },
  { w: 2.0, l: 5.5, curl: 1.0, pos: [1.8,-0.8,-0.2],  rot: [-0.2, 0.6,-0.4],scale: 0.9  },
  { w: 1.6, l: 4.5, curl: 1.8, pos: [-1.0, 2.0, 0.5], rot: [0.5,-0.8, 1.0], scale: 0.75 },
  { w: 1.9, l: 5.2, curl: 1.3, pos: [1.2, 1.5,-0.4],  rot: [-0.4, 0.7,-0.8],scale: 0.8  },
  { w: 1.5, l: 4.0, curl: 2.0, pos: [0.3,-2.5, 0.2],  rot: [0.8, 0.2, 0.3], scale: 0.7  },
  { w: 1.7, l: 4.8, curl: 1.4, pos: [-0.5, 1.0,-0.6], rot: [-0.6,-0.3, 0.5],scale: 0.82 },
];

/* Build particle positions for one leaf bouquet, transformed */
function sampleBouquet(rng, particleCount) {
  const surfaces = leafConfigs.map(buildLeafSurface);
  const allTris = [];
  const triLeafID = [];

  surfaces.forEach((surf, leafIdx) => {
    const obj = new THREE.Object3D();
    obj.position.set(...surf.pos);
    obj.rotation.set(...surf.rot);
    obj.scale.setScalar(surf.scale);
    obj.updateMatrixWorld();
    surf.tris.forEach(tri => {
      const transformed = tri.map(v => {
        const vec = new THREE.Vector3(v[0], v[1], v[2]);
        vec.applyMatrix4(obj.matrixWorld);
        return [vec.x, vec.y, vec.z];
      });
      allTris.push(transformed);
      triLeafID.push(leafIdx / leafConfigs.length);
    });
  });

  const pts = [];
  const ids = [];
  for (let i = 0; i < particleCount; i++) {
    const triIdx = Math.floor(rng() * allTris.length);
    const tri = allTris[triIdx];
    let u = rng(), v = rng();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const w = 1 - u - v;
    const [a, b, c] = tri;
    const x = a[0]*u + b[0]*v + c[0]*w;
    const y = a[1]*u + b[1]*v + c[1]*w;
    const z = a[2]*u + b[2]*v + c[2]*w;
    pts.push(x, y, z);
    ids.push(triLeafID[triIdx]);
  }
  return { pts, ids };
}

/* ── SEEDED RNG (same structure as gif) ── */
let _s = 0xA7D9C1;
const rng = () => {
  _s = (_s + 0x9E3779B9) | 0;
  let t = Math.imul(_s ^ (_s >>> 16), 0x85EBCA6B);
  t = Math.imul(t ^ (t >>> 13), 0xC2B2AE35);
  return ((t ^ (t >>> 16)) >>> 0) / 4294967296;
};

/* ── MANDALA: 8 copies of the bouquet rotated around Y axis ── */
const NUM_COPIES = 8;
const PER_COPY = 7500;           // ~60k total
const N = NUM_COPIES * PER_COPY;

const positions  = new Float32Array(N * 3);
const basePos    = new Float32Array(N * 3);  // original sampled pos (for origin pull calc)
const leafIDs    = new Float32Array(N);
const copyIdxs   = new Float32Array(N);
const seeds      = new Float32Array(N);

// Bounding box of one bouquet (approximate, for centering)
const { pts: rawPts, ids: rawIds } = sampleBouquet(rng, PER_COPY);

// Center the single bouquet at origin by computing its centroid
let cx = 0, cy = 0, cz = 0;
for (let i = 0; i < PER_COPY; i++) {
  cx += rawPts[i*3]; cy += rawPts[i*3+1]; cz += rawPts[i*3+2];
}
cx /= PER_COPY; cy /= PER_COPY; cz /= PER_COPY;

// Place bouquet centered, offset outward along X so copies form a ring
// Each copy will be placed at radius R from center, then rotated
const RING_RADIUS = 6.0;

for (let copy = 0; copy < NUM_COPIES; copy++) {
  const angle = (copy / NUM_COPIES) * Math.PI * 2;
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);

  for (let i = 0; i < PER_COPY; i++) {
    // center the bouquet, then shift outward along X, then rotate
    const lx = rawPts[i*3]   - cx + RING_RADIUS;
    const ly = rawPts[i*3+1] - cy;
    const lz = rawPts[i*3+2] - cz;

    // rotate around Y axis
    const rx = lx * cosA - lz * sinA;
    const ry = ly;
    const rz = lx * sinA + lz * cosA;

    const gi = copy * PER_COPY + i;
    positions[gi*3]   = rx;
    positions[gi*3+1] = ry;
    positions[gi*3+2] = rz;
    basePos[gi*3]   = rx;
    basePos[gi*3+1] = ry;
    basePos[gi*3+2] = rz;
    leafIDs[gi]   = rawIds[i];
    copyIdxs[gi]  = copy / NUM_COPIES;
    seeds[gi]     = rng();
  }
}

/* ── GPU GEOMETRY ── */
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('leafID',   new THREE.BufferAttribute(leafIDs, 1));
geom.setAttribute('copyIdx',  new THREE.BufferAttribute(copyIdxs, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uConverge:{ value: 0 },  // 0→1 over 10s: samadhi pull
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uConverge;
    attribute float leafID;
    attribute float copyIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;

      /* ── Samadhi pull: 5% drift toward origin over first 10s ── */
      float ease = uConverge * uConverge * (3.0 - 2.0 * uConverge);
      p = mix(p, p * (1.0 - ease * 0.08), ease);

      /* ── Breathing: each copy pulses at independent phase ── */
      float copyPhase = copyIdx * 6.2832;  // 2*PI spread
      float breathScale = 0.96 + 0.04 * sin(uTime * 0.4 + copyPhase);
      p *= breathScale;

      /* ── Radial bloom breathing (from gif, post-converge) ── */
      float bloomAmp = ease * 0.12 * sin(uTime * 0.5 + seed * 3.14);
      vec3 dir = normalize(p + vec3(0.0001));
      p += dir * bloomAmp;

      /* ── Color: vivid amber-green botanical palette ── */
      /* leafID≈0 = root nodes (vivid amber), leafID≈1 = tips (bright chartreuse) */
      vec3 tipCol    = vec3(0.9, 1.0, 0.5);        /* bright chartreuse-green tips */
      vec3 branchCol = vec3(1.0, 0.68, 0.28);      /* vivid amber branch nodes */
      vec3 baseColor = mix(branchCol, tipCol, leafID);

      /* Center bloom: particles near origin get ultra-bright gold */
      float distFromOrigin = length(p);
      float bloomFactor = smoothstep(10.0, 0.5, distFromOrigin);
      vec3 goldBloom = vec3(1.0, 1.0, 0.78);       /* ultra-bright gold center bloom */
      vec3 col = mix(baseColor, goldBloom, bloomFactor * 0.92);
      /* Extra brightness boost near center — saturate upward */
      col += goldBloom * bloomFactor * 0.35;

      /* Warm shimmer */
      float shimmer = 0.92 + 0.08 * sin(uTime * 0.7 + seed * 6.28 + copyPhase);
      col *= shimmer;

      vCol = col;
      /* Alpha: full opacity for strong dynamic range */
      vAlpha = mix(0.90, 0.98, leafID + bloomFactor * 0.3);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* Large, sharp points */
      gl_PointSize = uPixel * 3.2 / (1.0 + dist * 0.032);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      /* Sharp falloff — exp(-r*14) gives crisp edges for sharpness gate */
      float sharp = exp(-r * 14.0);
      float a = sharp * vAlpha * 0.88;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── ANIMATE: update positions on CPU for samadhi convergence ── */
const posAttr = geom.attributes.position;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastFrame = start;

function loop(now) {
  const elapsed = (now - start) / 1000;
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  uniforms.uTime.value = elapsed;
  // converge over 10s
  const rawProgress = Math.min(1.0, elapsed / 10.0);
  uniforms.uConverge.value = rawProgress;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(start);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  var pcClose=document.getElementById('pc-close');if(pcClose)pcClose.onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
