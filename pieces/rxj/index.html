<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wake Cartography · Ayoung Kim · submerged city surfacing</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#101520; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">rxj · Wake Cartography · submerged city surfacing</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Ayoung Kim — Porosity Valley / Delivery Dancer's Sphere lineage
// "wake" morph: submerged speculative city surfaces through a radial wake-wave
// Buildings rise from dark water as the wave passes; courier trails become boat-wakes
// Technique: differential-growth-3d-calligraphic-ink → wake-ripple cartography

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 18, 52);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x101520, 1);
document.body.appendChild(renderer.domElement);

/* ─── Voronoi city graph (seeded for consistency) ─── */
const CITY_R = 28;
const N_SITES = 42;
const sites = [];
let seed = 7;
function srand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
for (let i = 0; i < N_SITES; i++){
  const r = Math.sqrt(srand()) * CITY_R;
  const th = srand() * Math.PI * 2;
  sites.push({ x: Math.cos(th)*r, z: Math.sin(th)*r, id: i,
                h: 1.5 + srand() * 4.5, w: 0.6 + srand() * 1.2 });
}

const edges = new Set();
const GRID_RES = 80;
for (let ix = -GRID_RES; ix < GRID_RES; ix++){
  for (let iz = -GRID_RES; iz < GRID_RES; iz++){
    const px = (ix/GRID_RES)*CITY_R, pz = (iz/GRID_RES)*CITY_R;
    const px2 = ((ix+1)/GRID_RES)*CITY_R, pz2 = ((iz+1)/GRID_RES)*CITY_R;
    let s1=0,s2=0,s3=0,d1=1e9,d2=1e9,d3=1e9;
    for (let s = 0; s < N_SITES; s++){
      const sx=sites[s].x, sz=sites[s].z;
      let d;
      d=(px-sx)**2+(pz-sz)**2;   if(d<d1){d1=d;s1=s;}
      d=(px2-sx)**2+(pz-sz)**2;  if(d<d2){d2=d;s2=s;}
      d=(px-sx)**2+(pz2-sz)**2;  if(d<d3){d3=d;s3=s;}
    }
    if(s1!==s2) edges.add(Math.min(s1,s2)+','+Math.max(s1,s2));
    if(s1!==s3) edges.add(Math.min(s1,s3)+','+Math.max(s1,s3));
  }
}
const graph = new Map();
for (let i = 0; i < N_SITES; i++) graph.set(i, []);
for (const e of edges){
  const [a,b] = e.split(',').map(Number);
  graph.get(a).push(b); graph.get(b).push(a);
}

/* ─── Buildings: start submerged, rise with wake ─── */
const buildingGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1));
const buildingGroup = new THREE.Group();
const buildingMeshes = [];
for (const s of sites){
  const mat = new THREE.LineBasicMaterial({ color: 0x1e2a38, transparent: true, opacity: 0.15 });
  const mesh = new THREE.LineSegments(buildingGeo, mat);
  mesh.position.set(s.x, 0, s.z);
  mesh.scale.set(s.w, 0.08, s.w);
  mesh.userData = { targetH: s.h, dist: Math.sqrt(s.x*s.x + s.z*s.z), w: s.w };
  buildingGroup.add(mesh);
  buildingMeshes.push(mesh);
}
scene.add(buildingGroup);

/* ─── Street graph ─── */
const streetPos = [];
for (const e of edges){
  const [a,b] = e.split(',').map(Number);
  streetPos.push(sites[a].x, 0.02, sites[a].z, sites[b].x, 0.02, sites[b].z);
}
const streetGeo = new THREE.BufferGeometry();
streetGeo.setAttribute('position', new THREE.Float32BufferAttribute(streetPos, 3));
const streetMat = new THREE.LineBasicMaterial({ color: 0x2a3545, transparent: true, opacity: 0.12 });
scene.add(new THREE.LineSegments(streetGeo, streetMat));

/* ─── Water surface with wake-ring shader ─── */
const waterMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uTime: { value: 0 },
    uWakeR: { value: 0 }
  },
  vertexShader: `
    varying vec3 vPos;
    void main(){
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform float uWakeR;
    varying vec3 vPos;
    void main(){
      float dist = length(vPos.xz);
      // main wake ring
      float ring = smoothstep(2.5, 0.0, abs(dist - uWakeR)) * 0.4;
      // secondary ripples behind wake
      float ripple = 0.0;
      if(dist < uWakeR){
        float phase = dist * 1.2 - uTime * 1.8;
        ripple = sin(phase) * 0.04 * smoothstep(0.0, 8.0, uWakeR - dist);
      }
      // base dark water
      vec3 base = vec3(0.06, 0.08, 0.12);
      vec3 warm = vec3(0.83, 0.63, 0.31);
      vec3 col = mix(base, warm, ring + max(0.0, ripple));
      float alpha = 0.35 + ring * 0.5;
      gl_FragColor = vec4(col, alpha);
    }`
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(80,80), waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = -0.15;
scene.add(water);

/* ─── Expanding wake ring (geometric) ─── */
const ringGeo = new THREE.TorusGeometry(1, 0.06, 6, 80);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4a050, transparent: true, opacity: 0.55 });
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI/2;
ringMesh.position.y = 0.25;
scene.add(ringMesh);

/* ─── Courier particles with V-wake trails ─── */
const MAX_C = 18;
const couriers = [];

class Courier {
  constructor(){
    this.path = []; this.idx = 0; this.t = 0;
    this.trail = [];
    this.speed = 0.012 + Math.random()*0.008;
    const start = Math.floor(Math.random()*N_SITES);
    let end = start;
    while(end===start) end = Math.floor(Math.random()*N_SITES);
    const queue = [[start]], visited = new Set([start]);
    let found = null;
    while(queue.length && !found){
      const p = queue.shift(), last = p[p.length-1];
      if(last===end){ found=p; break; }
      for(const nb of graph.get(last)){
        if(!visited.has(nb)){ visited.add(nb); queue.push([...p, nb]); }
      }
    }
    this.path = found || [start, end];
  }
  update(){
    if(this.idx >= this.path.length-1) return false;
    this.t += this.speed;
    if(this.t >= 1.0){ this.t=0; this.idx++; }
    if(this.idx >= this.path.length-1) return false;
    const a = sites[this.path[this.idx]], b = sites[this.path[this.idx+1]];
    const x = a.x+(b.x-a.x)*this.t, z = a.z+(b.z-a.z)*this.t;
    const y = 0.3 + Math.sin(this.t*Math.PI)*0.15;
    const dx = b.x-a.x, dz = b.z-a.z;
    const len = Math.sqrt(dx*dx+dz*dz)||1;
    this.trail.push({ x, y, z, age:0, nx: -dz/len, nz: dx/len });
    if(this.trail.length > 70) this.trail.shift();
    for(const p of this.trail) p.age++;
    return true;
  }
}

const trailMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float alpha;
    varying float vA;
    void main(){
      vA = alpha;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec3 col = mix(vec3(0.83,0.63,0.31), vec3(0.72,0.42,0.32), vA);
      gl_FragColor = vec4(col, vA * 0.45);
    }`
});
const maxTV = MAX_C * 70 * 6;
const tPos = new Float32Array(maxTV*3);
const tAlp = new Float32Array(maxTV);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
trailGeo.setAttribute('alpha', new THREE.BufferAttribute(tAlp, 1));
const trailMesh = new THREE.LineSegments(trailGeo, trailMat);
scene.add(trailMesh);

function updateTrails(){
  let o = 0;
  for(const c of couriers){
    for(let i=0; i<c.trail.length-1; i++){
      const p = c.trail[i], q = c.trail[i+1];
      const a = Math.max(0, 1.0 - p.age/70);
      const sp = p.age * 0.035;
      // center line
      tPos[o*3]=p.x; tPos[o*3+1]=p.y; tPos[o*3+2]=p.z; tAlp[o]=a; o++;
      tPos[o*3]=q.x; tPos[o*3+1]=q.y; tPos[o*3+2]=q.z; tAlp[o]=a; o++;
      // left wake arm
      tPos[o*3]=p.x+p.nx*sp; tPos[o*3+1]=0.05; tPos[o*3+2]=p.z+p.nz*sp;
      tAlp[o]=a*0.35; o++;
      tPos[o*3]=p.x; tPos[o*3+1]=p.y; tPos[o*3+2]=p.z;
      tAlp[o]=a*0.35; o++;
      // right wake arm
      tPos[o*3]=p.x-p.nx*sp; tPos[o*3+1]=0.05; tPos[o*3+2]=p.z-p.nz*sp;
      tAlp[o]=a*0.35; o++;
      tPos[o*3]=p.x; tPos[o*3+1]=p.y; tPos[o*3+2]=p.z;
      tAlp[o]=a*0.35; o++;
    }
  }
  trailGeo.setDrawRange(0, o);
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.alpha.needsUpdate = true;
}

/* ─── Ambient light points: "windows" that flicker on after wake ─── */
const windowGroup = new THREE.Group();
const windowGeo = new THREE.PlaneGeometry(0.12, 0.12);
const windowMeshes = [];
for(const s of sites){
  const nw = 2 + Math.floor(srand()*4);
  for(let j=0; j<nw; j++){
    const mat = new THREE.MeshBasicMaterial({
      color: 0xd4a050, transparent: true, opacity: 0, side: THREE.DoubleSide
    });
    const m = new THREE.Mesh(windowGeo, mat);
    const face = Math.floor(srand()*4);
    const fy = 0.3 + srand() * s.h * 0.7;
    const fo = s.w * 0.51;
    if(face===0)      m.position.set(s.x+fo, fy, s.z + (srand()-0.5)*s.w*0.8);
    else if(face===1) m.position.set(s.x-fo, fy, s.z + (srand()-0.5)*s.w*0.8);
    else if(face===2){ m.position.set(s.x + (srand()-0.5)*s.w*0.8, fy, s.z+fo); m.rotation.y=Math.PI/2; }
    else             { m.position.set(s.x + (srand()-0.5)*s.w*0.8, fy, s.z-fo); m.rotation.y=Math.PI/2; }
    m.userData = { dist: Math.sqrt(s.x*s.x+s.z*s.z), flicker: srand()*6.28, targetH: fy };
    windowGroup.add(m);
    windowMeshes.push(m);
  }
}
scene.add(windowGroup);

/* ─── Main loop ─── */
let time = 0, wakeR = 0, spawnTimer = 0, camAngle = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  time += 0.016;

  // Wake wave expands
  if(wakeR < CITY_R + 6) wakeR += 0.07;

  // Update wake ring geometry
  ringMesh.scale.set(wakeR, wakeR, 1);
  ringMat.opacity = wakeR < CITY_R ? 0.5 : Math.max(0, 0.5 - (wakeR-CITY_R)*0.08);

  // Water shader
  waterMat.uniforms.uTime.value = time;
  waterMat.uniforms.uWakeR.value = wakeR;

  // Buildings rise
  for(const m of buildingMeshes){
    const d = m.userData.dist;
    if(d < wakeR){
      const passed = wakeR - d;
      const rise = Math.min(1, passed * 0.12);
      const eased = rise * rise * (3 - 2*rise); // smoothstep
      const h = 0.08 + (m.userData.targetH - 0.08) * eased;
      m.scale.set(m.userData.w, h, m.userData.w);
      m.position.y = h * 0.5;
      m.material.opacity = 0.15 + eased * 0.4;
      m.material.color.setRGB(0.12 + eased*0.55, 0.16 + eased*0.28, 0.22 + eased*0.08);
    }
  }

  // Windows flicker on after wake
  for(const w of windowMeshes){
    if(w.userData.dist < wakeR - 3){
      const target = 0.4 + Math.sin(time*2.5 + w.userData.flicker)*0.15;
      w.material.opacity += (target - w.material.opacity) * 0.05;
    }
  }

  // Streets brighten behind wake
  const streetWake = Math.min(1, wakeR / CITY_R);
  streetMat.opacity = 0.12 + streetWake * 0.15;
  streetMat.color.setRGB(0.17 + streetWake*0.25, 0.21 + streetWake*0.12, 0.27 + streetWake*0.03);

  // Spawn couriers in waked zone
  spawnTimer++;
  if(spawnTimer > 80 && wakeR > 6){
    spawnTimer = 0;
    if(couriers.length < MAX_C) couriers.push(new Courier());
  }
  for(let i = couriers.length-1; i>=0; i--){
    if(!couriers[i].update()) couriers.splice(i, 1);
  }
  updateTrails();

  // Camera: rise from low submerged view to high overview
  camAngle += 0.0006;
  const prog = Math.min(1, time / 25);
  const eP = prog*prog*(3-2*prog);
  const camY = 16 + eP * 34;
  const camR = 54 - eP * 12;
  camera.position.x = Math.cos(camAngle) * camR;
  camera.position.z = Math.sin(camAngle) * camR;
  camera.position.y = camY;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
