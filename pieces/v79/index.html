<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// AUTO{}Construccion: speculative architecture as live-coded L-system growth
// Informal housing assembles itself in voxel grid, then rhythmically dissolves
// walls into falling cubes. Each rebuild uses a stochastic grammar — room sizes,
// adjacency, wall openings all rerolled. Palette: rebar gray, cinder block,
// neon code-flash on collapse events.
//
// L-SYSTEM RULES (stochastic):
//   A → { room, then 0–3 children placed on cardinal faces }
//   room → { foundation box, 4 wall segments (each has 50% door-cutout),
//            ceiling (sometimes missing), floor height ∈ [2, 4] voxels }
//
// MOTION: assembly (grid snap from below), then downbeat-triggered collapse
// (every 2.2s one random room's cubes gain gravity, scatter, fade out).

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0e, 0.009);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(22, 18, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 6, 0);

// ─────────── instanced cube pool
const VOXEL = 1.0;
const MAX_CUBES = 4000;
const cubeGeo = new THREE.BoxGeometry(VOXEL * 0.92, VOXEL * 0.92, VOXEL * 0.92);
const cubeMat = new THREE.MeshLambertMaterial({ color: 0x6a6a6e });
const instancedMesh = new THREE.InstancedMesh(cubeGeo, cubeMat, MAX_CUBES);
instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(instancedMesh);

const cubeStates = [];
for (let i = 0; i < MAX_CUBES; i++){
  cubeStates.push({
    active: false,
    x: 0, y: 0, z: 0,
    vx: 0, vy: 0, vz: 0,
    ty: 0,             // target y for assembly
    assembling: false,
    falling: false,
    life: 1.0,
    flashIntensity: 0.0
  });
}

let nextCubeIndex = 0;
function allocCube(x, y, z, ty){
  if (nextCubeIndex >= MAX_CUBES) return null;
  const idx = nextCubeIndex++;
  const c = cubeStates[idx];
  c.active = true;
  c.x = x * VOXEL;
  c.y = -3 * VOXEL;  // start below ground
  c.z = z * VOXEL;
  c.ty = ty * VOXEL;
  c.assembling = true;
  c.falling = false;
  c.life = 1.0;
  c.vx = 0; c.vy = 0; c.vz = 0;
  c.flashIntensity = 0.0;
  return idx;
}

function resetCubes(){
  nextCubeIndex = 0;
  for (const c of cubeStates){
    c.active = false;
    c.assembling = false;
    c.falling = false;
    c.life = 1.0;
  }
}

// ─────────── L-system room grammar
// A room is a bounding box (ox, oy, oz, w, h, d) in voxel coords.
// We fill walls (4 sides) + floor + ceiling, leaving door cutouts.

const rooms = [];

function randi(n){ return Math.floor(Math.random() * n); }
function randf(a, b){ return a + Math.random() * (b - a); }

function buildRoom(ox, oy, oz, w, h, d, roomId){
  const cubes = [];
  // floor
  for (let x = ox; x < ox + w; x++){
    for (let z = oz; z < oz + d; z++){
      const idx = allocCube(x, oy, z, oy);
      if (idx !== null) cubes.push(idx);
    }
  }
  // walls with door cutouts
  const doorNorth = Math.random() < 0.5 ? randi(w - 2) + 1 : -1;
  const doorSouth = Math.random() < 0.5 ? randi(w - 2) + 1 : -1;
  const doorEast  = Math.random() < 0.5 ? randi(d - 2) + 1 : -1;
  const doorWest  = Math.random() < 0.5 ? randi(d - 2) + 1 : -1;
  for (let y = oy + 1; y < oy + h; y++){
    // north wall (z = oz)
    for (let x = ox; x < ox + w; x++){
      if (y === oy + 1 && (x - ox) === doorNorth) continue;
      const idx = allocCube(x, y, oz, y);
      if (idx !== null) cubes.push(idx);
    }
    // south wall (z = oz + d - 1)
    for (let x = ox; x < ox + w; x++){
      if (y === oy + 1 && (x - ox) === doorSouth) continue;
      const idx = allocCube(x, y, oz + d - 1, y);
      if (idx !== null) cubes.push(idx);
    }
    // west wall (x = ox)
    for (let z = oz; z < oz + d; z++){
      if (y === oy + 1 && (z - oz) === doorWest) continue;
      const idx = allocCube(ox, y, z, y);
      if (idx !== null) cubes.push(idx);
    }
    // east wall (x = ox + w - 1)
    for (let z = oz; z < oz + d; z++){
      if (y === oy + 1 && (z - oz) === doorEast) continue;
      const idx = allocCube(ox + w - 1, y, z, y);
      if (idx !== null) cubes.push(idx);
    }
  }
  // ceiling (50% chance missing for open-air)
  if (Math.random() < 0.5){
    for (let x = ox; x < ox + w; x++){
      for (let z = oz; z < oz + d; z++){
        const idx = allocCube(x, oy + h - 1, z, oy + h - 1);
        if (idx !== null) cubes.push(idx);
      }
    }
  }
  rooms.push({ ox, oy, oz, w, h, d, cubes, roomId });
}

function growLSystem(depth, ox, oy, oz, occupiedSet, roomId){
  if (depth > 3 || nextCubeIndex > MAX_CUBES * 0.85) return;
  const w = randi(3) + 3;  // width 3–5
  const h = randi(3) + 2;  // height 2–4
  const d = randi(3) + 3;  // depth 3–5
  // check collision with occupiedSet
  let collision = false;
  for (let x = ox; x < ox + w; x++){
    for (let y = oy; y < oy + h; y++){
      for (let z = oz; z < oz + d; z++){
        if (occupiedSet.has(`${x},${y},${z}`)){
          collision = true;
          break;
        }
      }
      if (collision) break;
    }
    if (collision) break;
  }
  if (collision) return;
  // mark occupied
  for (let x = ox; x < ox + w; x++){
    for (let y = oy; y < oy + h; y++){
      for (let z = oz; z < oz + d; z++){
        occupiedSet.add(`${x},${y},${z}`);
      }
    }
  }
  buildRoom(ox, oy, oz, w, h, d, roomId);
  // spawn 0–3 children on cardinal faces
  const nChildren = randi(4);
  const faces = ['north', 'south', 'east', 'west'].sort(() => Math.random() - 0.5);
  for (let i = 0; i < nChildren; i++){
    const face = faces[i];
    let cx, cy, cz;
    if (face === 'north'){
      cx = ox + randi(Math.max(1, w - 2));
      cy = oy;
      cz = oz - (randi(3) + 3);
    } else if (face === 'south'){
      cx = ox + randi(Math.max(1, w - 2));
      cy = oy;
      cz = oz + d;
    } else if (face === 'east'){
      cx = ox + w;
      cy = oy;
      cz = oz + randi(Math.max(1, d - 2));
    } else {
      cx = ox - (randi(3) + 3);
      cy = oy;
      cz = oz + randi(Math.max(1, d - 2));
    }
    growLSystem(depth + 1, cx, cy, cz, occupiedSet, roomId + 1 + i);
  }
}

function rebuildStructure(){
  resetCubes();
  rooms.length = 0;
  const occupiedSet = new Set();
  growLSystem(0, -2, 0, -2, occupiedSet, 0);
}

rebuildStructure();

addEventListener('click', rebuildStructure);

// ─────────── lighting
const ambLight = new THREE.AmbientLight(0x404040, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 18, 8);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x6080ff, 0.3);
fillLight.position.set(-6, 4, -5);
scene.add(fillLight);

// ─────────── rhythmic collapse (every 2.2s pick a random room, collapse its cubes)
let lastCollapseTime = performance.now();
const COLLAPSE_INTERVAL = 2200;

function triggerCollapse(){
  if (rooms.length === 0) return;
  const roomIdx = randi(rooms.length);
  const room = rooms[roomIdx];
  for (const idx of room.cubes){
    const c = cubeStates[idx];
    if (!c.active || c.falling) continue;
    c.assembling = false;
    c.falling = true;
    c.vx = randf(-0.04, 0.04);
    c.vy = randf(0.02, 0.08);
    c.vz = randf(-0.04, 0.04);
    c.flashIntensity = 1.0;
  }
  // remove room from list
  rooms.splice(roomIdx, 1);
}

// ─────────── animation loop
const dummy = new THREE.Object3D();
const colorBase = new THREE.Color(0x6a6a6e);
const colorFlash = new THREE.Color(0x00ffcc);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(t){
  const dt = 1 / 60;
  // collapse downbeat
  if (t - lastCollapseTime > COLLAPSE_INTERVAL){
    triggerCollapse();
    lastCollapseTime = t;
  }
  // update cubes
  for (let i = 0; i < nextCubeIndex; i++){
    const c = cubeStates[i];
    if (!c.active) continue;
    if (c.assembling){
      const speed = 0.12;
      c.y += (c.ty - c.y) * speed;
      if (Math.abs(c.y - c.ty) < 0.02){
        c.y = c.ty;
        c.assembling = false;
      }
    }
    if (c.falling){
      c.vx *= 0.98;
      c.vy -= 0.006;  // gravity
      c.vz *= 0.98;
      c.x += c.vx;
      c.y += c.vy;
      c.z += c.vz;
      c.life -= 0.008;
      c.flashIntensity *= 0.92;
      if (c.life <= 0){
        c.active = false;
        continue;
      }
    }
    dummy.position.set(c.x, c.y, c.z);
    dummy.rotation.set(c.vx * 10, c.vy * 10, c.vz * 10);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
    // color flash on collapse
    const col = colorBase.clone().lerp(colorFlash, c.flashIntensity);
    instancedMesh.setColorAt(i, col);
  }
  instancedMesh.instanceMatrix.needsUpdate = true;
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
  // camera track centroid of active cubes
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < nextCubeIndex; i++){
    const c = cubeStates[i];
    if (c.active && !c.falling){
      cx += c.x; cy += c.y; cz += c.z;
      count++;
    }
  }
  if (count > 0){
    cx /= count; cy /= count; cz /= count;
    controls.target.x += (cx - controls.target.x) * 0.02;
    controls.target.y += (cy + 4 - controls.target.y) * 0.02;
    controls.target.z += (cz - controls.target.z) * 0.02;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
