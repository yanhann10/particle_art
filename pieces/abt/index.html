<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>abt · something beneath the grid</title>
<!-- MOTION: pulse, intensity: gentle -->
</head>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f1ec; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
</style>
<body>
<div class="id">abt</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 28;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2, 0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4f1ec, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uRowFreq: { value: 1.4 },
  uColFreq: { value: 1.1 },
  uWaveAmp: { value: 0.5 },
  uTwist:   { value: 0.8 },
  // creature lump
  uLumpPos:    { value: new THREE.Vector2(0, 0) },
  uLumpRadius: { value: 4.0 },
  uBreath:     { value: 0 },
  uBreath2:    { value: 0 },
  // tear event
  uTearPhase:  { value: 0 },  // 0=calm, ramps to 1 during tear
  uTearCenter: { value: new THREE.Vector2(0, 0) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime, uPixel;
    uniform float uRowFreq, uColFreq, uWaveAmp, uTwist;
    uniform vec2  uLumpPos;
    uniform float uLumpRadius, uBreath, uBreath2;
    uniform float uTearPhase;
    uniform vec2  uTearCenter;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity;
    varying float vInfluence;
    varying float vTear;
    varying float vDepth;

    void main(){
      vec2 gp = gridPos;

      // distance to lump center
      vec2 toLump = gp - uLumpPos;
      float dist = length(toLump);
      float influence = smoothstep(uLumpRadius * 1.6, uLumpRadius * 0.2, dist);

      // breathing displacement — strong primary + slow secondary
      float breathZ = influence * uBreath * 0.40;
      float breathZ2 = influence * uBreath2 * 0.25;
      float totalZ = breathZ + breathZ2;

      // lateral fabric stretch as lump pushes up
      vec2 stretch = normalize(toLump + 0.001) * influence * (uBreath * 0.35 + uBreath2 * 0.18);

      // Riley wave interference on the fabric surface
      float twist = uTwist * length(gp) * 0.04;
      float ct = cos(twist), st = sin(twist);
      vec2 twisted = vec2(gp.x*ct - gp.y*st, gp.x*st + gp.y*ct);

      float rowWave = sin(twisted.y * uRowFreq + uTime*0.4) * uWaveAmp;
      float colWave = sin(twisted.x * uColFreq + uTime*0.25) * uWaveAmp;

      // warp grid by lump
      vec2 warped = gp + stretch;
      vec3 p = vec3(warped.x + rowWave, warped.y + colWave, totalZ);

      // tear: scatter particles outward from tear center
      vec2 toTear = gp - uTearCenter;
      float tearDist = length(toTear);
      float tearInfluence = smoothstep(uLumpRadius * 1.2, 0.0, tearDist);
      float tearScatter = tearInfluence * uTearPhase;

      // scatter outward + upward
      vec2 scatterDir = normalize(toTear + 0.001);
      p.xy += scatterDir * tearScatter * 3.5;
      p.z  += tearScatter * 2.0 * (0.5 + seed);

      // wobble scattered particles
      if(tearScatter > 0.05){
        p.x += sin(uTime * 3.0 + seed * 20.0) * tearScatter * 0.4;
        p.y += cos(uTime * 2.7 + seed * 15.0) * tearScatter * 0.3;
      }

      // density for B&W pattern
      float interference = sin(twisted.y * uRowFreq * 2.0 + uTime*0.4) *
                          sin(twisted.x * uColFreq * 2.0 + uTime*0.25);
      vDensity = interference;
      vInfluence = influence;
      vTear = tearScatter;
      vDepth = totalZ;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * (2.2 + totalZ * 0.3);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDensity;
    varying float vInfluence;
    varying float vTear;
    varying float vDepth;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if(r > 0.25) discard;

      // base: hard B&W Riley pattern
      float val = step(0.0, vDensity);
      vec3 bw = vec3(val);

      // terracotta flesh beneath — muted, warm
      vec3 flesh = vec3(0.72, 0.54, 0.46);

      // where lump pushes, bleed terracotta through
      float bleed = smoothstep(0.0, 0.6, vInfluence) * smoothstep(0.0, 0.15, vDepth);
      vec3 col = mix(bw, flesh, bleed * 0.55);

      // torn particles become fully terracotta
      col = mix(col, flesh, vTear * 0.9);

      // slight alpha fade on scattered particles
      float alpha = 1.0 - vTear * 0.3;

      // cream tint on white areas (parchment feel)
      if(val > 0.5 && vTear < 0.1){
        col = mix(col, vec3(0.96, 0.94, 0.89), 0.3);
      }

      gl_FragColor = vec4(col, alpha);
    }
  `
});

// build uniform grid
function buildGrid(){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = 42 >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 100, cols = 100;
  const width = 24, height = 24;
  const cellW = width / cols, cellH = height / rows;

  let idx = 0;
  const ppCell = Math.floor(N / (rows * cols));
  for(let i = 0; i < rows && idx < N; i++){
    for(let j = 0; j < cols && idx < N; j++){
      for(let k = 0; k < ppCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx*3] = x;
        positions[idx*3+1] = y;
        positions[idx*3+2] = 0;
        gridPositions[idx*2] = x;
        gridPositions[idx*2+1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while(idx < N){
    const x = (rng()-0.5)*width, y = (rng()-0.5)*height;
    positions[idx*3]=x; positions[idx*3+1]=y; positions[idx*3+2]=0;
    gridPositions[idx*2]=x; gridPositions[idx*2+1]=y;
    seeds[idx]=rng(); idx++;
  }
  return { positions, gridPositions, seeds };
}

const { positions, gridPositions, seeds } = buildGrid();
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// lump wanders very slowly in a small region
function lumpPath(t){
  return new THREE.Vector2(
    Math.sin(t * 0.07) * 2.5 + Math.sin(t * 0.03) * 1.5,
    Math.cos(t * 0.05) * 2.0 + Math.cos(t * 0.02) * 1.0
  );
}

// tear state machine
let tearState = 'calm';   // calm → building → tearing → settling
let tearTimer = 0;
let nextTearAt = 12 + Math.random() * 8; // first tear 12-20s in
const TEAR_BUILD   = 2.0;  // seconds to build pressure
const TEAR_BURST   = 0.6;  // seconds of burst
const TEAR_SETTLE  = 3.5;  // seconds to re-settle
let tearProgress = 0;

addEventListener('resize', () => {
  const a = innerWidth / innerHeight;
  camera.left = frustumSize * a / -2;
  camera.right = frustumSize * a / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
let lastTime = start;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  uniforms.uTime.value = t;

  // lump position & breathing
  const lp = lumpPath(t);
  uniforms.uLumpPos.value.copy(lp);

  // primary breath: strong, ~5s cycle
  const breath1 = Math.sin(t * 1.2) * 0.5 + Math.sin(t * 1.8) * 0.25;
  // secondary: slower undulation, ~11s
  const breath2 = Math.sin(t * 0.55) * 0.7 + Math.sin(t * 0.35 + 1.0) * 0.3;

  uniforms.uBreath.value = breath1;
  uniforms.uBreath2.value = breath2;

  // tear state machine
  tearTimer += dt;

  if(tearState === 'calm'){
    uniforms.uTearPhase.value = 0;
    if(tearTimer >= nextTearAt){
      tearState = 'building';
      tearTimer = 0;
      // tear happens at current lump position
      uniforms.uTearCenter.value.copy(lp);
    }
  } else if(tearState === 'building'){
    // pressure builds — breath intensifies
    tearProgress = Math.min(tearTimer / TEAR_BUILD, 1.0);
    // amplify breath during build
    uniforms.uBreath.value = breath1 * (1.0 + tearProgress * 1.5);
    uniforms.uTearPhase.value = 0;
    if(tearTimer >= TEAR_BUILD){
      tearState = 'tearing';
      tearTimer = 0;
    }
  } else if(tearState === 'tearing'){
    tearProgress = Math.min(tearTimer / TEAR_BURST, 1.0);
    // sharp ease-out: burst fast then hold
    const eased = 1.0 - Math.pow(1.0 - tearProgress, 3.0);
    uniforms.uTearPhase.value = eased;
    uniforms.uBreath.value = breath1 * 2.0 * (1.0 - tearProgress * 0.5);
    if(tearTimer >= TEAR_BURST){
      tearState = 'settling';
      tearTimer = 0;
    }
  } else if(tearState === 'settling'){
    tearProgress = 1.0 - Math.min(tearTimer / TEAR_SETTLE, 1.0);
    // smooth ease back
    const eased = tearProgress * tearProgress;
    uniforms.uTearPhase.value = eased;
    if(tearTimer >= TEAR_SETTLE){
      tearState = 'calm';
      tearTimer = 0;
      nextTearAt = 10 + Math.random() * 10;
      uniforms.uTearPhase.value = 0;
    }
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
