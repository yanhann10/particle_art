<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: spiral, intensity: gentle -->
<title>e3j · aizawa attractor · posterized riso</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px;
           font-family: ui-monospace, "SF Mono", Menlo, monospace;
           color:#cdd2dc; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">e3j</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0e, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

/* ── Posterized riso palette ──
   Risograph inks: fluorescent pink (#ff5477), teal (#00827f), warm gold (#e8b54d)
   Quantized to 4 discrete luminance steps per channel → flat poster look.
   Technique ref: Tadanori Yokoo's psychedelic poster prints,
   also echoes Riso Club / Stencil risograph zine aesthetics. */
const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying vec2 vScreenPos;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 1.4 * vSpeed) * uPixel * (8.0 / dist);
      gl_Position = projectionMatrix * mv;
      vScreenPos = gl_Position.xy / gl_Position.w;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying vec2 vScreenPos;
    uniform float uTime;

    // hash for grain
    float hash21(vec2 p){
      p = fract(p * vec2(233.34, 851.74));
      p += dot(p, p + 23.45);
      return fract(p.x * p.y);
    }

    // posterize: quantize to N steps
    vec3 posterize(vec3 c, float steps){
      return floor(c * steps + 0.5) / steps;
    }

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);

      // risograph ink palette: fluorescent pink, deep teal, warm gold
      vec3 ink_pink = vec3(1.0, 0.33, 0.47);
      vec3 ink_teal = vec3(0.0, 0.51, 0.50);
      vec3 ink_gold = vec3(0.91, 0.71, 0.30);
      vec3 ink_bone = vec3(0.92, 0.90, 0.85);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      // 3-stop ink blend
      vec3 col = mix(ink_teal, ink_pink, smoothstep(0.0, 0.45, k));
      col = mix(col, ink_gold, smoothstep(0.45, 0.8, k));
      col = mix(col, ink_bone, smoothstep(0.8, 1.0, k));

      // modulate brightness by speed
      col *= 0.5 + vSpeed * 0.8;

      // posterize to 4 discrete steps — the riso look
      col = posterize(col, 3.0);

      // paper grain: subtle noise that shifts per frame
      vec2 grainCoord = gl_FragCoord.xy * 0.8 + uTime * 7.0;
      float grain = hash21(grainCoord) * 0.08 - 0.04;
      col += grain;

      gl_FragColor = vec4(col * a, a * 0.85);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// paper-texture overlay: fullscreen quad with subtle warm grain
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false,
  uniforms: { uTime: { value: 0.0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float h(vec2 p){
      p = fract(p * vec2(443.8975, 397.2973));
      p += dot(p, p.yx + 19.19);
      return fract(p.x * p.y);
    }
    void main(){
      vec2 g = vUv * vec2(1920.0, 1080.0) * 0.5;
      float n = h(g + uTime * 3.1) * 0.035;
      // warm paper tint
      gl_FragColor = vec4(0.95, 0.92, 0.87, n);
    }
  `
});
const grainScene = new THREE.Scene();
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;
  grainMat.uniforms.uTime.value = elapsed;

  // slow camera orbit
  const ang = elapsed * 0.15;
  camera.position.x = Math.sin(ang) * 4;
  camera.position.z = Math.cos(ang) * 4;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 1.0);

  renderer.render(scene, camera);
  // overlay paper grain
  renderer.autoClear = false;
  renderer.render(grainScene, camOrtho);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
