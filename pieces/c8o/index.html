<div class="id">c8o · coral latent-space morph · Anadol</div>
<div class="src">Large Nature Model · Serpentine 2024 · biological hallucination</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1214, 0.022);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 28);
camera.lookAt(0, 2, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1214, 1);
document.body.appendChild(renderer.domElement);

// reef substrate plane
const substrateMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vPos;
    void main(){
      vUv = uv;
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vPos;
    void main(){
      float n = sin(vPos.x * 0.4 + uTime * 0.3) * cos(vPos.z * 0.5 - uTime * 0.2);
      vec3 sand = vec3(0.18, 0.22, 0.24);
      vec3 moss = vec3(0.28, 0.38, 0.32);
      vec3 col = mix(sand, moss, n * 0.5 + 0.5);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const substrateGeom = new THREE.PlaneGeometry(80, 80, 60, 60);
substrateGeom.rotateX(-Math.PI / 2);
const substrate = new THREE.Mesh(substrateGeom, substrateMat);
substrate.position.y = -1.5;
scene.add(substrate);

// coral archetypes: 4 species defined as (branches, height, radiusTop, radiusBase, plateWidth)
const SPECIES = [
  { name: 'tube',     branches: 1,  height: 3.0, radiusTop: 0.15, radiusBase: 0.2,  plateWidth: 0.0 },
  { name: 'branch',   branches: 4,  height: 2.2, radiusTop: 0.08, radiusBase: 0.18, plateWidth: 0.0 },
  { name: 'plate',    branches: 1,  height: 1.4, radiusTop: 0.3,  radiusBase: 0.25, plateWidth: 1.2 },
  { name: 'brain',    branches: 12, height: 1.6, radiusTop: 0.12, radiusBase: 0.22, plateWidth: 0.0 }
];

// per-coral state: position, 4D latent coords, morph targets
const CORAL_COUNT = 180;
const corals = [];
for (let i = 0; i < CORAL_COUNT; i++){
  const angle = (i / CORAL_COUNT) * Math.PI * 2 + Math.random() * 0.4;
  const radius = 8 + Math.random() * 18;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const y = -1.5 + (Math.random() - 0.5) * 0.6;
  const latent = [Math.random(), Math.random(), Math.random(), Math.random()];
  const seed = Math.random();
  corals.push({ pos: new THREE.Vector3(x, y, z), latent, seed, group: new THREE.Group() });
  corals[i].group.position.copy(corals[i].pos);
  scene.add(corals[i].group);
}

// subsurface scattering coral material
function makeCoralMat(color){
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor: { value: new THREE.Color(color) },
      uLightDir: { value: new THREE.Vector3(0.3, 0.8, 0.5).normalize() }
    },
    vertexShader: `
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
        vNormal = normalize(normalMatrix * normal);
        vPos = (modelViewMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      uniform vec3 uLightDir;
      varying vec3 vNormal;
      varying vec3 vPos;
      void main(){
        float ndl = max(0.0, dot(vNormal, uLightDir));
        float rim = pow(1.0 - abs(dot(normalize(vPos), vNormal)), 2.0);
        float subsurface = pow(max(0.0, dot(vNormal, -uLightDir)), 1.5) * 0.6;
        vec3 col = uColor * (0.4 + 0.6 * ndl) + uColor * subsurface + vec3(0.9, 0.95, 1.0) * rim * 0.3;
        float pulse = 0.95 + 0.05 * sin(uTime * 1.2);
        col *= pulse;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
}

// palette: turquoise, coral, lime, magenta
const PALETTE = [
  new THREE.Color(0x2dd4bf), // turquoise
  new THREE.Color(0xfb7185), // coral
  new THREE.Color(0xa3e635), // lime
  new THREE.Color(0xf472b6)  // magenta
];

// build initial coral meshes
function buildCoralMesh(params){
  const group = new THREE.Group();
  const { branches, height, radiusTop, radiusBase, plateWidth } = params;
  const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
  const mat = makeCoralMat(color);
  
  if (plateWidth > 0.1){
    // plate coral: flat disc on top
    const trunk = new THREE.CylinderGeometry(radiusBase, radiusBase, height * 0.5, 8);
    const plate = new THREE.CylinderGeometry(plateWidth, radiusBase, 0.2, 16);
    plate.translate(0, height * 0.25 + 0.1, 0);
    const trunkMesh = new THREE.Mesh(trunk, mat);
    const plateMesh = new THREE.Mesh(plate, mat);
    group.add(trunkMesh, plateMesh);
  } else if (branches === 1){
    // tube coral
    const geom = new THREE.CylinderGeometry(radiusTop, radiusBase, height, 8);
    geom.translate(0, height / 2, 0);
    const mesh = new THREE.Mesh(geom, mat);
    group.add(mesh);
  } else {
    // branching coral
    const trunk = new THREE.CylinderGeometry(radiusBase * 0.8, radiusBase, height * 0.5, 6);
    trunk.translate(0, height * 0.25, 0);
    const trunkMesh = new THREE.Mesh(trunk, mat);
    group.add(trunkMesh);
    for (let b = 0; b < branches; b++){
      const angle = (b / branches) * Math.PI * 2;
      const branchH = height * (0.4 + Math.random() * 0.3);
      const branchGeom = new THREE.CylinderGeometry(radiusTop, radiusBase * 0.5, branchH, 5);
      branchGeom.translate(0, branchH / 2, 0);
      branchGeom.rotateZ(Math.PI / 6 + Math.random() * 0.2);
      branchGeom.rotateY(angle);
      branchGeom.translate(0, height * 0.4, 0);
      const branchMesh = new THREE.Mesh(branchGeom, mat);
      group.add(branchMesh);
    }
  }
  return group;
}

// initialize coral geometry
corals.forEach(c => {
  const archetype = SPECIES[Math.floor(Math.random() * SPECIES.length)];
  const mesh = buildCoralMesh(archetype);
  c.group.add(mesh);
  c.currentArchetype = archetype;
  c.targetArchetype = archetype;
  c.morphT = 0;
});

// perlin-like 4D drift
function perlin4d(x, y, z, w){
  const s = Math.sin(x * 1.4 + y * 1.1) * Math.cos(z * 1.3 - w * 1.2);
  return s * 0.5 + 0.5;
}

// plankton particles
const PLANKTON_COUNT = 800;
const planktonGeom = new THREE.BufferGeometry();
const planktonPos = new Float32Array(PLANKTON_COUNT * 3);
const planktonSeeds = new Float32Array(PLANKTON_COUNT);
for (let i = 0; i < PLANKTON_COUNT; i++){
  planktonPos[i * 3]     = (Math.random() - 0.5) * 60;
  planktonPos[i * 3 + 1] = (Math.random() - 0.5) * 30;
  planktonPos[i * 3 + 2] = (Math.random() - 0.5) * 60;
  planktonSeeds[i] = Math.random();
}
planktonGeom.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
planktonGeom.setAttribute('seed', new THREE.BufferAttribute(planktonSeeds, 1));

const planktonMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vBright;
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      p.x += sin(t * 0.6) * 2.0;
      p.y += cos(t * 0.5) * 1.5;
      p.z += sin(t * 0.7) * 2.5;
      vBright = 0.3 + 0.7 * sin(t);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vBright;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d, d) > 0.25) discard;
      float a = exp(-dot(d, d) * 12.0) * vBright;
      vec3 col = vec3(0.8, 0.95, 1.0);
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const plankton = new THREE.Points(planktonGeom, planktonMat);
scene.add(plankton);

// lighting
const ambient = new THREE.AmbientLight(0x4a5a6a, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastMorphCheck = 0;

function loop(){
  const t = (performance.now() - start) / 1000;
  substrateMat.uniforms.uTime.value = t;
  planktonMat.uniforms.uTime.value = t;

  // drift camera gently
  camera.position.x = Math.sin(t * 0.08) * 6;
  camera.position.z = 28 + Math.cos(t * 0.06) * 4;
  camera.lookAt(0, 2, 0);

  // latent-space drift + morph check every 3s
  if (t - lastMorphCheck > 3.0){
    lastMorphCheck = t;
    corals.forEach(c => {
      // perlin drift in 4D latent space
      c.latent[0] += (perlin4d(c.latent[0] * 2, c.latent[1] * 2, t * 0.1, c.seed) - 0.5) * 0.15;
      c.latent[1] += (perlin4d(c.latent[1] * 2, c.latent[2] * 2, t * 0.1, c.seed + 1) - 0.5) * 0.15;
      c.latent[2] += (perlin4d(c.latent[2] * 2, c.latent[3] * 2, t * 0.1, c.seed + 2) - 0.5) * 0.15;
      c.latent[3] += (perlin4d(c.latent[3] * 2, c.latent[0] * 2, t * 0.1, c.seed + 3) - 0.5) * 0.15;
      c.latent = c.latent.map(x => Math.max(0, Math.min(1, x)));

      // map latent to species via nearest-neighbor in 4D
      let bestIdx = 0, bestDist = Infinity;
      SPECIES.forEach((sp, idx) => {
        const target = [idx / SPECIES.length, sp.height / 3, sp.radiusBase, sp.branches / 12];
        const dist = c.latent.reduce((s, v, i) => s + (v - target[i]) ** 2, 0);
        if (dist < bestDist){ bestDist = dist; bestIdx = idx; }
      });
      if (SPECIES[bestIdx] !== c.targetArchetype){
        c.targetArchetype = SPECIES[bestIdx];
        c.morphT = 0;
      }
    });
  }

  // morph corals toward target archetype
  corals.forEach(c => {
    if (c.morphT < 1.0){
      c.morphT = Math.min(1.0, c.morphT + 0.012);
      if (c.morphT >= 1.0){
        c.group.clear();
        const newMesh = buildCoralMesh(c.targetArchetype);
        c.group.add(newMesh);
        c.currentArchetype = c.targetArchetype;
      } else {
        // visual interpolation: scale morph as proxy
        const scale = 1.0 + Math.sin(c.morphT * Math.PI) * 0.15;
        c.group.scale.set(scale, scale, scale);
      }
    }
    // update material time
    c.group.traverse(obj => {
      if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime){
        obj.material.uniforms.uTime.value = t;
      }
    });
  });

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
