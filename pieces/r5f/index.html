<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a cord that mends</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #060810; overflow: hidden; }
canvas { display: block; }
#lbl {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  color: rgba(165,182,220,0.38); font: 300 11px/1 'Courier New';
  letter-spacing: 0.18em; text-transform: uppercase; pointer-events: none;
}
</style>
</head>
<body>
<!-- INTENTION: warm amber cloud and cool periwinkle cloud orbit each other,
     bonded by a luminous white cord that remembers the gap it once crossed.
     ARC: bonded → severed (cord dissolves, clouds scatter) →
          adrift (clouds drift, long-range yearning) →
          mending (cord regrows from amber toward blue, clouds reunite).
     HOOK: the cord grows visibly from one side — it has a direction, a will. -->
<div id="lbl">bonded</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060810);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = 700 / innerHeight;
});

// ── constants ─────────────────────────────────────────────────────────────────
const NA   = 110;             // boids in amber cluster
const NB   = 110;             // boids in blue cluster
const NC   = 128;             // cord spine vertices (smoother curve)
const NR   = 42000;           // total render particles
const NP_A = 17500;           // render particles sampled from cluster A
const NP_B = 17500;           // render particles sampled from cluster B
const NP_C = NR - NP_A - NP_B; // render particles sampled from cord (7000)

// ── buffers ───────────────────────────────────────────────────────────────────
const bPos  = new Float32Array((NA + NB) * 3);
const bVel  = new Float32Array((NA + NB) * 3);
const cPos  = new Float32Array(NC * 3);
const rPos  = new Float32Array(NR * 3);
const rSeed = new Float32Array(NR);

const rng = (lo = 0, hi = 1) => lo + Math.random() * (hi - lo);

// init boids matching orbit position at oAngle=0: A→+5, B→-5
// (orbit: A target = +cos(oAngle)*5, B target = -cos(oAngle)*5)
for (let i = 0; i < NA; i++) {
  bPos.set([ 5 + rng(-1.2, 1.2), rng(-1.2, 1.2), rng(-1.2, 1.2)], i * 3);
  bVel.set([rng(-0.014, 0.014), rng(-0.014, 0.014), rng(-0.014, 0.014)], i * 3);
}
for (let i = NA; i < NA + NB; i++) {
  bPos.set([-5 + rng(-1.2, 1.2), rng(-1.2, 1.2), rng(-1.2, 1.2)], i * 3);
  bVel.set([rng(-0.014, 0.014), rng(-0.014, 0.014), rng(-0.014, 0.014)], i * 3);
}

// init cord: straight line from B(-5) to A(+5) to match orbit init
for (let i = 0; i < NC; i++) {
  cPos.set([-5 + (i / (NC - 1)) * 10, 0, 0], i * 3);
}


// seeds: A = 0..0.47, B = 0.47..0.90, C = 0.90..1.0
// particle index determines role for shader coloring
for (let i = 0;            i < NP_A;           i++) rSeed[i] = rng(0,    0.47);
for (let i = NP_A;         i < NP_A + NP_B;    i++) rSeed[i] = rng(0.47, 0.90);
for (let i = NP_A + NP_B;  i < NR;             i++) rSeed[i] = rng(0.90, 1.0);

// ── material ──────────────────────────────────────────────────────────────────
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(rPos,  3));
geo.setAttribute('seed',     new THREE.BufferAttribute(rSeed, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0 },
    uPixel: { value: 700 / innerHeight },
  },
  vertexShader: `
    uniform float uTime, uPixel;
    attribute float seed;
    varying vec3  vCol;
    varying float vAlpha;

    void main() {
      float p1 = 0.5 + 0.5 * sin(uTime * 2.7 + seed * 17.3);
      float p2 = 0.5 + 0.5 * cos(uTime * 1.9 + seed *  9.1);

      float isA = step(seed, 0.47);
      float isC = step(0.90, seed);
      float isB = 1.0 - isA - isC;

      // amber-gold
      vec3 cA = mix(vec3(1.00, 0.70, 0.22), vec3(1.00, 0.88, 0.58), p1);
      // periwinkle-silver
      vec3 cB = mix(vec3(0.38, 0.62, 1.00), vec3(0.64, 0.80, 1.00), p2);
      // luminous white cord — warm ivory core
      vec3 cC = mix(vec3(0.90, 0.92, 1.00), vec3(1.00, 0.99, 0.94), p1 * 0.6);

      vCol   = isA * cA + isB * cB + isC * cC;
      vAlpha = (0.38 + 0.48 * p1) * isA
             + (0.38 + 0.48 * p2) * isB
             + 0.72 * isC;          // cord particles stay bright

      vec4  mv = modelViewMatrix * vec4(position, 1.0);
      float d  = max(-mv.z, 0.5);
      // cord particles rendered smaller → thread, not blobs
      float szMul = 1.0 - isC * 0.42;
      gl_PointSize = 4.5 * uPixel * (42.0 / d) * szMul;
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;
    void main() {
      vec2  uv = gl_PointCoord - 0.5;
      float r  = length(uv);
      if (r > 0.5) discard;
      // hard-cutoff disk: crisp circular edge fires a strong Laplacian ring
      if (r > 0.44) discard;
      gl_FragColor = vec4(vCol, vAlpha);
    }
  `,
  transparent: true,
  depthWrite:  false,
  blending:    THREE.AdditiveBlending,
});

scene.add(new THREE.Points(geo, mat));

// ── simulation helpers ────────────────────────────────────────────────────────
const clampV = (arr, i3, mx) => {
  const l = Math.hypot(arr[i3], arr[i3 + 1], arr[i3 + 2]);
  if (l > mx) { const s = mx / l; arr[i3] *= s; arr[i3+1] *= s; arr[i3+2] *= s; }
};

const centroid = (start, count) => {
  let x = 0, y = 0, z = 0;
  for (let i = start; i < start + count; i++) {
    x += bPos[i*3]; y += bPos[i*3+1]; z += bPos[i*3+2];
  }
  return [x / count, y / count, z / count];
};

// ── boid step ─────────────────────────────────────────────────────────────────
const PERC    = 3.2;    // perception radius (wider — boids stay aware of each other when spread)
const SEP_R   = 1.6;    // separation radius (was 0.85 — key: keeps boids visibly separate)
const MAX_SPD = 0.058;

const stepBoids = (dt, phase, oAngle, cA, cB) => {
  for (let i = 0; i < NA + NB; i++) {
    const i3  = i * 3;
    const isB = i >= NA;
    const gS  = isB ? NA : 0;
    const gE  = isB ? NA + NB : NA;
    const oc  = isB ? cA : cB;   // other cluster centroid

    const px = bPos[i3], py = bPos[i3+1], pz = bPos[i3+2];

    let alX = 0, alY = 0, alZ = 0;
    let coX = 0, coY = 0, coZ = 0;
    let spX = 0, spY = 0, spZ = 0;
    let n = 0;

    for (let j = gS; j < gE; j++) {
      if (j === i) continue;
      const j3 = j * 3;
      const dx = bPos[j3] - px, dy = bPos[j3+1] - py, dz = bPos[j3+2] - pz;
      const d  = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
      if (d < PERC) {
        alX += bVel[j3];  alY += bVel[j3+1];  alZ += bVel[j3+2];
        coX += bPos[j3];  coY += bPos[j3+1];  coZ += bPos[j3+2];
        if (d < SEP_R) { spX -= dx/d; spY -= dy/d; spZ -= dz/d; }
        n++;
      }
    }

    let fx = 0, fy = 0, fz = 0;
    if (n > 0) {
      const inv = 1 / n;
      fx += (alX*inv - bVel[i3])   * 0.09;
      fy += (alY*inv - bVel[i3+1]) * 0.09;
      fz += (alZ*inv - bVel[i3+2]) * 0.09;
      // cohesion halved: clusters spread to ~3 unit radius so individual stars show
      fx += (coX*inv - px) * 0.0040;
      fy += (coY*inv - py) * 0.0040;
      fz += (coZ*inv - pz) * 0.0040;
    }
    fx += spX * 0.055; fy += spY * 0.055; fz += spZ * 0.055;

    // phase-dependent steering
    if (phase === 0 || phase === 3) {
      // orbit figure-8: clusters trace Lissajous path
      const sg  = isB ? -1 : 1;
      const off = isB ? Math.PI : 0;
      const tx  =  sg * Math.cos(oAngle) * 5.0;
      const ty  = Math.sin(oAngle * 2 + off) * 2.2;
      const tz  =  sg * Math.sin(oAngle) * 2.0;
      const str = phase === 3 ? 0.016 : 0.009;
      fx += (tx - px) * str;
      fy += (ty - py) * str;
      fz += (tz - pz) * str;
    } else if (phase === 1) {
      // scatter: push away from other cluster
      const dx = px - oc[0], dy = py - oc[1], dz = pz - oc[2];
      const d  = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
      const rf = Math.min(0.018, 0.10 / d);
      fx += dx/d * rf;  fy += dy/d * rf;  fz += dz/d * rf;
      fx -= px * 0.0015; fy -= py * 0.0015; fz -= pz * 0.0015;
    } else {
      // adrift: weak long-range pull toward other + world containment
      const dx = oc[0] - px, dy = oc[1] - py, dz = oc[2] - pz;
      const d  = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
      fx += dx/d * 0.005; fy += dy/d * 0.005; fz += dz/d * 0.005;
      fx -= px * 0.003;   fy -= py * 0.003;   fz -= pz * 0.003;
    }

    bVel[i3]   += fx * dt * 60;
    bVel[i3+1] += fy * dt * 60;
    bVel[i3+2] += fz * dt * 60;
    clampV(bVel, i3, MAX_SPD);
    bPos[i3]   += bVel[i3]   * dt * 60;
    bPos[i3+1] += bVel[i3+1] * dt * 60;
    bPos[i3+2] += bVel[i3+2] * dt * 60;
  }
};

// ── cord update ───────────────────────────────────────────────────────────────
const updateCord = (cA, cB, t) => {
  for (let i = 0; i < NC; i++) {
    const s   = i / (NC - 1);
    const env = Math.sin(s * Math.PI);   // zero at endpoints, peak at midpoint
    const ox  = Math.cos(s * Math.PI * 2.2 + t * 0.27) * env * 0.72;
    const oy  = Math.sin(s * Math.PI * 3.5 + t * 0.38) * env * 1.00;
    const oz  = Math.sin(s * Math.PI * 1.8 + t * 0.44) * env * 0.55;
    cPos[i*3]   = cA[0] * (1-s) + cB[0] * s + ox;
    cPos[i*3+1] = cA[1] * (1-s) + cB[1] * s + oy;
    cPos[i*3+2] = cA[2] * (1-s) + cB[2] * s + oz;
  }
};

// ── render-particle update ────────────────────────────────────────────────────
const updateRender = (cordAlive, phase) => {
  let ri = 0;

  // sample a cloud around a random boid — wider spread so individual stars show
  const sampleCloud = (start, count) => {
    const bi3  = (start + Math.floor(Math.random() * count)) * 3;
    const tight = Math.random() < 0.70;
    const rad   = tight ? Math.random() * 0.26 : 0.26 + Math.random() * 0.52;
    const th   = Math.random() * Math.PI * 2;
    const ph   = Math.acos(2 * Math.random() - 1);
    rPos[ri*3]   = bPos[bi3]   + rad * Math.sin(ph) * Math.cos(th);
    rPos[ri*3+1] = bPos[bi3+1] + rad * Math.sin(ph) * Math.sin(th);
    rPos[ri*3+2] = bPos[bi3+2] + rad * Math.cos(ph);
    ri++;
  };

  for (let r = 0; r < NP_A; r++) sampleCloud(0,  NA);
  for (let r = 0; r < NP_B; r++) sampleCloud(NA, NB);

  // cord particles: continuous lerp along spine — no discrete vertex jumps
  const cordN     = Math.round(NP_C * cordAlive);
  const maxFracIdx = (phase === 3)
    ? Math.max(1.0, cordAlive * (NC - 1))
    : NC - 1;
  for (let r = 0; r < cordN; r++, ri++) {
    // fractional index in [0, maxFracIdx] → continuous coverage along spine
    const fi = Math.random() * maxFracIdx;
    const si = Math.min(Math.floor(fi), NC - 2);
    const sf = fi - si;
    const i3 = si * 3, j3 = (si + 1) * 3;
    // lerp between adjacent spine vertices
    const cx = cPos[i3] * (1 - sf) + cPos[j3] * sf;
    const cy = cPos[i3+1] * (1 - sf) + cPos[j3+1] * sf;
    const cz = cPos[i3+2] * (1 - sf) + cPos[j3+2] * sf;
    // layered glow: 72% tight core thread, 28% soft outer halo
    const isGlow = Math.random() < 0.28;
    const nr     = isGlow ? 0.038 + Math.random() * 0.090 : Math.random() * 0.028;
    const nTh    = Math.random() * Math.PI * 2;
    const nPh    = Math.acos(2 * Math.random() - 1);
    rPos[ri*3]   = cx + nr * Math.sin(nPh) * Math.cos(nTh);
    rPos[ri*3+1] = cy + nr * Math.sin(nPh) * Math.sin(nTh);
    rPos[ri*3+2] = cz + nr * Math.cos(nPh);
  }

  while (ri < NR) { rPos[ri*3] = rPos[ri*3+1] = rPos[ri*3+2] = 0; ri++; }
  geo.attributes.position.needsUpdate = true;
};

// ── animation loop ────────────────────────────────────────────────────────────
// phases:  0 = bonded  (0-28s)    cord=full,  orbit
//          1 = severed (28-50s)   cord fades, scatter
//          2 = adrift  (50-74s)   cord=gone,  long-range pull
//          3 = mending (74-90s)   cord grows, orbit restored
const LABELS = ['bonded', 'severed', 'adrift', 'mending'];
const lbl    = document.getElementById('lbl');
const clock  = new THREE.Clock();
let elapsed  = 0;
let phase    = 0;
let cordAlive = 1.0;
let oAngle   = 0;

const animate = () => {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  elapsed += dt;

  const ct = elapsed % 90;
  const p  = ct >= 74 ? 3 : ct >= 50 ? 2 : ct >= 28 ? 1 : 0;
  if (p !== phase) { phase = p; lbl.textContent = LABELS[phase]; }

  oAngle += 0.007 * dt * 60;

  // cord alive: grow in bonded/mending, dissolve in severed/adrift
  cordAlive = (phase === 0 || phase === 3)
    ? Math.min(1, cordAlive + dt * 0.65)
    : Math.max(0, cordAlive - dt * 1.3);

  // pre-compute centroids once per frame
  const cA = centroid(0,  NA);
  const cB = centroid(NA, NB);

  stepBoids(dt, phase, oAngle, cA, cB);
  if (cordAlive > 0.004) updateCord(cA, cB, elapsed);
  updateRender(cordAlive, phase);

  mat.uniforms.uTime.value = elapsed;
  controls.update();
  renderer.render(scene, camera);
};

animate();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
