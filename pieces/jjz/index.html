<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jjz · oceanic shells</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1218; overflow:hidden;
               color:#9db5c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #0f1f28; color:#9db5c0; border:1px solid #2a4a5a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#1a2f3d; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · speak, breathe</button>
<div class="id">jjz</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1218, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 3, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1218, 1);
document.body.appendChild(renderer.domElement);

// 5 depth layers of particles — foreground to background
const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);

for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    // shells arranged along z-axis with radial spread
    const zBase = -12 + s * 12;
    const r = 8 + s * 3.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
    positions[idx*3+2] = zBase + (Math.random()-0.5) * 6;
    velocities[idx*3] = 0;
    velocities[idx*3+1] = 0;
    velocities[idx*3+2] = 0;
    shellIdx[idx] = s;
    seeds[idx] = Math.random();
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

// smooth band targets
const bandTargets = [0, 0, 0, 0, 0];
const bandCurrent = [0, 0, 0, 0, 0];
const LERP_ALPHA = 0.015;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBand0: { value: 0 },
  uBand1: { value: 0 },
  uBand2: { value: 0 },
  uBand3: { value: 0 },
  uBand4: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, 
  depthWrite: false, 
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBand0, uBand1, uBand2, uBand3, uBand4;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBand0;
      else if (shellIdx < 1.5) e = uBand1;
      else if (shellIdx < 2.5) e = uBand2;
      else if (shellIdx < 3.5) e = uBand3;
      else                     e = uBand4;

      vec3 p = position;
      
      // slow vertical drift driven by energy
      float drift = sin(uTime * 0.08 + seed * 6.28) * (0.3 + e * 0.7);
      p.y += drift;

      // gentle radial pulse
      vec3 dir = normalize(p);
      float pulse = 1.0 + e * 0.15;
      p *= pulse;

      // depth-based color — deep teal in back, cyan-white in front
      float depth = (shellIdx / 4.0);
      vec3 deepTeal = vec3(0.08, 0.22, 0.28);
      vec3 cyanWhite = vec3(0.45, 0.75, 0.82);
      vCol = mix(cyanWhite, deepTeal, depth);
      
      // energy modulates brightness
      vCol *= (0.4 + e * 0.8);
      
      // depth fog attenuation
      vAlpha = 0.35 * (1.0 - depth * 0.6) * (0.6 + e * 0.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + e * 1.0) * uPixel * (60.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float core = exp(-r * 18.0);
      float a = core * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// background depth particles (static fog layer)
const bgGeom = new THREE.BufferGeometry();
const bgN = 800;
const bgPos = new Float32Array(bgN * 3);
for (let i = 0; i < bgN; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 45 + Math.random() * 25;
  bgPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  bgPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  bgPos[i*3+2] = -30 + (Math.random()-0.5) * 40;
}
bgGeom.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
const bgMat = new THREE.PointsMaterial({
  size: 1.2 * renderer.getPixelRatio(),
  color: 0x1a3540,
  transparent: true,
  opacity: 0.15,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const bgPoints = new THREE.Points(bgGeom, bgMat);
scene.add(bgPoints);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.85;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'listening · five oceanic layers';
  } catch (e) {
    hint.textContent = 'mic denied — tidal mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
const posAttr = geom.getAttribute('position');

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // slow environment rotation — camera on a rail
  const angle = t * 0.025;
  camera.position.x = Math.sin(angle) * 38;
  camera.position.z = Math.cos(angle) * 38;
  camera.lookAt(0, 0, 0);

  // slow counter-rotation of particle cloud
  points.rotation.y = -t * 0.018;
  bgPoints.rotation.y = -t * 0.006;

  // update band targets
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    bandTargets[0] = bandEnergy(freqData, 0, Math.floor(n*0.04));
    bandTargets[1] = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    bandTargets[2] = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    bandTargets[3] = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    bandTargets[4] = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    // tidal synthetic motion
    bandTargets[0] = 0.2 + 0.15 * Math.sin(t * 0.3);
    bandTargets[1] = 0.18 + 0.12 * Math.sin(t * 0.25 + 1.2);
    bandTargets[2] = 0.15 + 0.10 * Math.sin(t * 0.2 + 2.4);
    bandTargets[3] = 0.12 + 0.08 * Math.sin(t * 0.18 + 0.8);
    bandTargets[4] = 0.10 + 0.06 * Math.sin(t * 0.15 + 1.8);
  }

  // smooth integration
  for (let i = 0; i < 5; i++){
    bandCurrent[i] += (bandTargets[i] - bandCurrent[i]) * LERP_ALPHA;
  }
  uniforms.uBand0.value = bandCurrent[0];
  uniforms.uBand1.value = bandCurrent[1];
  uniforms.uBand2.value = bandCurrent[2];
  uniforms.uBand3.value = bandCurrent[3];
  uniforms.uBand4.value = bandCurrent[4];

  // physics-driven particle drift
  for (let i = 0; i < N; i++){
    const s = shellIdx[i];
    const e = bandCurrent[Math.floor(s)];
    const seed = seeds[i];
    
    // target drift forces
    const fx = Math.sin(t * 0.1 + seed * 6.28) * 0.003;
    const fy = (e - 0.15) * 0.008;
    const fz = Math.cos(t * 0.08 + seed * 3.14) * 0.002;
    
    // integrate velocity with damping
    velocities[i*3]   += fx;
    velocities[i*3+1] += fy;
    velocities[i*3+2] += fz;
    velocities[i*3]   *= 0.96;
    velocities[i*3+1] *= 0.96;
    velocities[i*3+2] *= 0.96;
    
    // integrate position
    positions[i*3]   += velocities[i*3];
    positions[i*3+1] += velocities[i*3+1];
    positions[i*3+2] += velocities[i*3+2];
    
    // gentle bounds — particles don't escape
    const r = Math.sqrt(positions[i*3]**2 + positions[i*3+1]**2 + positions[i*3+2]**2);
    const maxR = 35 + s * 5;
    if (r > maxR){
      const k = maxR / r;
      positions[i*3] *= k;
      positions[i*3+1] *= k;
      positions[i*3+2] *= k;
      velocities[i*3] *= 0.5;
      velocities[i*3+1] *= 0.5;
      velocities[i*3+2] *= 0.5;
    }
  }
  posAttr.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
