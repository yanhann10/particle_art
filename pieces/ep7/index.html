<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: gentle -->
<title>ep7 · domain-warped tenderness</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0807;overflow:hidden;
    color:#cdd2dc;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  canvas{display:block}
  .id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;letter-spacing:0.06em;color:#cdd2dc}
  .hint{position:fixed;left:14px;top:14px;opacity:0.55;font-size:10px;letter-spacing:0.04em}
  .src{position:fixed;right:14px;top:14px;opacity:0.4;font-size:10px;letter-spacing:0.04em}
</style>

<body>
<div class="id">ep7</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">domain warping · paired light strings · differential growth</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

/*
  Intent: two paired Gonzalez-Torres light-string catenaries, grown via
  differential growth, then domain-warped (warp-of-warp) so the strands
  fold and billow toward each other in a slow breath. The viewer should
  feel tenderness — two luminous arcs reaching, almost touching, retreating.

  Palette: dull amber / bone / ash on near-black — the warmth of old
  incandescent filaments in a dark gallery.

  Named references: Gonzalez-Torres "Untitled" (March 5th) paired clocks;
  Inigo Quilez layered domain warping; Rogan Brown filigree (Line2 strands).
*/

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 24);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -0.5, 0);

/* ── Differential growth ────────────────────────────── */
const MAX_V = 1400;
const ATTRACT = 0.05, REPEL_R = 0.44, REPEL_STR = 0.09;
const NS = 0.002, PRESS = 0.002, GRAV = 0.007, MAX_D = 0.33, ANC = 5;

function makeCurve(y0, zOff) {
  const N0 = 36, vs = [];
  for (let i = 0; i < N0; i++) {
    const t = (i / (N0 - 1)) * 2 - 1;
    vs.push({
      x: t * 5.5,
      y: y0 - Math.abs(t) * 1.1 + Math.sin(t * Math.PI * 2) * 0.25,
      z: zOff + (Math.random() - 0.5) * 0.08,
      pin: i < ANC || i >= N0 - ANC
    });
  }
  return vs;
}
const curves = [makeCurve(3.0, -0.2), makeCurve(-3.0, 0.2)];

function growStep(vs) {
  const n = vs.length; if (n >= MAX_V) return;
  const C = REPEL_R, grid = new Map();
  for (let i = 0; i < n; i++) {
    const k = (vs[i].x / C | 0) + ',' + (vs[i].z / C | 0);
    (grid.get(k) || (grid.set(k, []), grid.get(k))).push(i);
  }
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = vs[i], cx = v.x / C | 0, cz = v.z / C | 0;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const arr = grid.get((cx + a) + ',' + (cz + b)); if (!arr) continue;
      for (const j of arr) {
        if (j === i) continue;
        const ex = v.x - vs[j].x, ez = v.z - vs[j].z, d2 = ex * ex + ez * ez;
        if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), f = REPEL_STR * (1 - d / REPEL_R) / d;
        dx[i] += ex * f; dz[i] += ez * f;
      }
    }
  }
  for (let i = 0; i < n; i++) {
    const v = vs[i];
    if (i > 0) { const p = vs[i - 1]; dx[i] += (p.x - v.x) * ATTRACT; dy[i] += (p.y - v.y) * ATTRACT; dz[i] += (p.z - v.z) * ATTRACT; }
    if (i < n - 1) { const q = vs[i + 1]; dx[i] += (q.x - v.x) * ATTRACT; dy[i] += (q.y - v.y) * ATTRACT; dz[i] += (q.z - v.z) * ATTRACT; }
  }
  let mx = 0, mz = 0;
  for (const v of vs) { mx += v.x; mz += v.z; } mx /= n; mz /= n;
  for (let i = 0; i < n; i++) {
    const ox = vs[i].x - mx, oz = vs[i].z - mz, d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESS; dz[i] += (oz / d) * PRESS;
  }
  for (let i = 0; i < n; i++) {
    vs[i].x += dx[i] + (Math.random() - 0.5) * NS;
    vs[i].z += dz[i] + (Math.random() - 0.5) * NS;
    vs[i].y += dy[i] - (vs[i].pin ? GRAV * 0.05 : GRAV) + (Math.random() - 0.5) * NS * 0.5;
  }
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = vs[i], b = vs[i + 1]; grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && vs.length + grown.length < MAX_V)
      grown.push({ x: (a.x + b.x) / 2 + (Math.random() - 0.5) * 0.02, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 + (Math.random() - 0.5) * 0.02, pin: false });
  }
  grown.push(vs[n - 1]);
  vs.length = 0; for (const v of grown) vs.push(v);
}

// Pre-grow to completion
for (let s = 0; s < 2000; s++) curves.forEach(c => growStep(c));
const counts = curves.map(c => c.length);

/* ── Domain warp (two-layer, Quilez-style) ──────────── */
function warp(px, py, pz, t, amp) {
  const f1 = 0.2, a1 = 1.1 * amp;
  const wx = px + a1 * Math.sin(py * f1 * 1.1 + pz * f1 * 0.7 + t * 0.04);
  const wy = py + a1 * 0.45 * Math.sin(px * f1 * 1.3 + pz * f1 * 0.35 + t * 0.032);
  const wz = pz + a1 * 0.65 * Math.sin(px * f1 * 0.8 + py * f1 * 0.95 + t * 0.042);
  const f2 = 0.38, a2 = 0.35 * amp;
  return [
    wx + a2 * Math.sin(wy * f2 + wz * f2 * 0.6 + t * 0.022),
    wy + a2 * 0.3 * Math.sin(wx * f2 * 1.1 + t * 0.026),
    wz + a2 * 0.5 * Math.sin(wx * f2 * 0.85 + wy * f2 * 0.75 + t * 0.024)
  ];
}

/* ── Line2 — thick warm filaments ───────────────────── */
const lineMats = [
  new LineMaterial({ color: 0xc4a070, linewidth: 2.5, transparent: true, opacity: 0.55 }),
  new LineMaterial({ color: 0xb89860, linewidth: 2.5, transparent: true, opacity: 0.55 })
];
lineMats.forEach(m => m.resolution.set(innerWidth, innerHeight));

// Build initial Line2 from pre-grown raw positions
const lineGeoms = curves.map((vs, ci) => {
  const pos = new Float32Array(vs.length * 3);
  for (let i = 0; i < vs.length; i++) { pos[i * 3] = vs[i].x; pos[i * 3 + 1] = vs[i].y; pos[i * 3 + 2] = vs[i].z; }
  const g = new LineGeometry(); g.setPositions(pos); return g;
});
const lineObjs = lineGeoms.map((g, i) => { const l = new Line2(g, lineMats[i]); scene.add(l); return l; });

// Helper: update Line2 interleaved buffer in-place (no reallocation)
function updateLine(geom, warped, n) {
  const buf = geom.getAttribute('instanceStart').data;
  const arr = buf.array;
  for (let i = 0; i < n - 1; i++) {
    const i3 = i * 3, n3 = (i + 1) * 3, i6 = i * 6;
    arr[i6] = warped[i3]; arr[i6 + 1] = warped[i3 + 1]; arr[i6 + 2] = warped[i3 + 2];
    arr[i6 + 3] = warped[n3]; arr[i6 + 4] = warped[n3 + 1]; arr[i6 + 5] = warped[n3 + 2];
  }
  buf.needsUpdate = true;
}

/* ── Accent particles — warm incandescent glow ──────── */
const NP = 18000, halfP = NP / 2 | 0;
const pp = new Float32Array(NP * 3), ps = new Float32Array(NP);
for (let i = 0; i < NP; i++) ps[i] = Math.random();
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
pg.setAttribute('seed', new THREE.BufferAttribute(ps, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPx: { value: renderer.getPixelRatio() }, uFog: { value: new THREE.Color(BG) }, uFD: { value: 0.032 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPx, uFD;
    attribute float seed;
    varying vec3 vC; varying float vA, vF;
    void main() {
      vec3 p = position;
      float pulse = 0.8 + 0.2 * sin(uTime * 0.7 + seed * 28.0);
      vec3 amber = vec3(0.88, 0.64, 0.30), warm = vec3(0.92, 0.80, 0.62);
      vC = mix(amber, warm, seed) * pulse;
      vA = 0.3 + 0.15 * pulse;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.4 * uPx * (32.0 / max(-mv.z, 0.5));
      gl_Position = projectionMatrix * mv;
      float fd = length(mv.xyz);
      vF = 1.0 - exp(-uFD * uFD * fd * fd);
    }`,
  fragmentShader: `
    varying vec3 vC; varying float vA, vF;
    uniform vec3 uFog;
    void main() {
      vec2 d = gl_PointCoord - 0.5; float r = dot(d, d);
      if (r > 0.25) discard;
      float g = exp(-r * 20.0) + exp(-r * 6.0) * 0.2;
      float a = g * vA * (1.0 - vF * 0.8);
      gl_FragColor = vec4(mix(vC, uFog, vF) * a, a);
    }`
});
scene.add(new THREE.Points(pg, pMat));

/* ── Thin dark wire underneath for structural depth ─── */
const wireGeoms = curves.map(vs => {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vs.length * 3), 3));
  return g;
});
const wireMat = new THREE.LineBasicMaterial({ color: 0x1a1814, transparent: true, opacity: 0.22 });
wireGeoms.forEach(g => scene.add(new THREE.Line(g, wireMat)));

/* ── Resize ─────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  lineMats.forEach(m => m.resolution.set(innerWidth, innerHeight));
});

let paused = false;
addEventListener('click', () => { paused = !paused; });

/* ── Animation loop ─────────────────────────────────── */
const t0 = performance.now();
const wBuf = counts.map(n => new Float32Array(n * 3));

function loop() {
  const t = (performance.now() - t0) / 1000;
  pMat.uniforms.uTime.value = t;

  // Breathing: slow amplitude oscillation (~63s period)
  const breathe = 0.55 + 0.45 * Math.sin(t * 0.1);
  // Reach: strings drawn toward y=0 (toward each other) (~90s period)
  const reach = 0.25 + 0.2 * Math.sin(t * 0.07);

  curves.forEach((vs, ci) => {
    const n = counts[ci], wb = wBuf[ci];
    const dir = ci === 0 ? -1 : 1; // top reaches down, bottom reaches up
    for (let i = 0; i < n; i++) {
      const [wx, wy, wz] = warp(vs[i].x, vs[i].y, vs[i].z, t, breathe);
      const cw = Math.max(0, 1.0 - Math.abs(vs[i].x) / 7.0); // stronger at center
      wb[i * 3] = wx;
      wb[i * 3 + 1] = wy + dir * reach * cw;
      wb[i * 3 + 2] = wz;
    }

    // Update Line2 in-place
    updateLine(lineGeoms[ci], wb, n);

    // Update thin wire
    const wp = wireGeoms[ci].attributes.position;
    for (let i = 0; i < n; i++) { wp.array[i * 3] = wb[i * 3]; wp.array[i * 3 + 1] = wb[i * 3 + 1]; wp.array[i * 3 + 2] = wb[i * 3 + 2]; }
    wireGeoms[ci].setDrawRange(0, n);
    wp.needsUpdate = true;

    // Distribute particles along warped curve
    const st = ci === 0 ? 0 : halfP, ct = ci === 0 ? halfP : NP - halfP;
    for (let k = 0; k < ct; k++) {
      const s = ps[st + k], seg = s * (n - 1);
      const si = Math.min(seg | 0, n - 2), f = seg - si;
      const i0 = si * 3, i1 = (si + 1) * 3, sp = 0.018;
      pp[(st + k) * 3] = wb[i0] + (wb[i1] - wb[i0]) * f + (s - 0.5) * sp;
      pp[(st + k) * 3 + 1] = wb[i0 + 1] + (wb[i1 + 1] - wb[i0 + 1]) * f + (s - 0.5) * sp * 0.4;
      pp[(st + k) * 3 + 2] = wb[i0 + 2] + (wb[i1 + 2] - wb[i0 + 2]) * f + (s - 0.5) * sp;
    }
  });

  pg.attributes.position.needsUpdate = true;

  // Camera tracks centroid gently
  let cx = 0, cy = 0, cz = 0, total = 0;
  for (const ci of [0, 1]) {
    const wb = wBuf[ci], n = counts[ci];
    for (let i = 0; i < n; i++) { cx += wb[i * 3]; cy += wb[i * 3 + 1]; cz += wb[i * 3 + 2]; total++; }
  }
  controls.target.lerp(new THREE.Vector3(cx / total, cy / total, cz / total), 0.012);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();}).then(function(d){var qs='?a='+pid+(d.job_id?'&job='+d.job_id:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){var p=location.pathname.split('/').filter(Boolean);var i=p.indexOf('pieces');if(i>=0&&p[i+1])return p[i+1];var el=document.querySelector('.id');return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';}
  var pid=pieceId(),KEY='pa_cfg_'+pid,G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';document.querySelectorAll('canvas').forEach(function(c){c.style.filter=f;});}
  var tries=0;(function w(){if(document.querySelector('canvas')||tries++>80){applyFilter();return;}setTimeout(w,100);})();
  function bind(k,id){var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);el.addEventListener('input',function(){G[k]=parseFloat(el.value);vl.textContent=fmt(k,G[k]);applyFilter();});}
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};for(var k in G){document.getElementById('gp-'+k).value=G[k];document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);}applyFilter();}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function renderSaved(){var w=document.getElementById('gp-saved');w.innerHTML='';load().forEach(function(c,i){var b=document.createElement('button');b.className='gp-cfg';b.textContent='config '+(i+1);b.onclick=function(){setSliders(c);};b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};w.appendChild(b);});}
  document.getElementById('gp-save').onclick=function(){var a=load();a.push({id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con});store(a);renderSaved();};
  renderSaved();
})();
</script>
