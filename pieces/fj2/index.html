<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fj2 · streamline painting · Tyler Hobbs flow partitioning</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ece1; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#5a4a3a; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; color:#5a4a3a; }
</style>
</head>
<body>
<div class="id">fj2</div>
<div class="src">Tyler Hobbs · non-crossing flow domains · oil painting method</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-25, 25, 25, -25, 0.1, 100);
camera.position.set(0, 0, 20);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ece1, 1);
document.body.appendChild(renderer.domElement);

// Tyler Hobbs principle: domain partitioning for non-crossing flows
// Define 7 distinct flow regions with hand-tuned centers and boundaries
const domains = [
  { cx: -14, cy: 12, r: 7, angle: 0.3, curl: 0.15, density: 0.85 },
  { cx: 8, cy: 15, r: 6.5, angle: -0.6, curl: -0.12, density: 0.75 },
  { cx: -18, cy: -8, r: 8, angle: 1.2, curl: 0.18, density: 0.9 },
  { cx: 10, cy: -12, r: 7.5, angle: 2.1, curl: -0.1, density: 0.8 },
  { cx: -5, cy: 0, r: 5, angle: 0.8, curl: 0.2, density: 0.65 },
  { cx: 18, cy: 2, r: 6, angle: -1.4, curl: 0.14, density: 0.7 },
  { cx: 2, cy: -22, r: 5.5, angle: 1.8, curl: -0.16, density: 0.6 }
];

// Palette: warm earth tones + one cool accent (Prussian blue)
const palette = [
  new THREE.Color(0x6b4423), // raw umber
  new THREE.Color(0xc1440e), // oxide red
  new THREE.Color(0xd4a574), // ochre
  new THREE.Color(0xa0522d), // terracotta
  new THREE.Color(0x8b6f47), // burnt sienna
  new THREE.Color(0x1a3a52), // Prussian blue (cool accent)
  new THREE.Color(0x5c4033)  // dark umber
];

// Assign one palette color per domain
const domainColors = domains.map((d, i) => palette[i % palette.length]);

// Generate particles only within domains, with spacing to prevent overlap
const N = 12000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const ages = new Float32Array(N);

let particleIndex = 0;

for (let di = 0; di < domains.length; di++){
  const d = domains[di];
  const particlesInDomain = Math.floor(N * d.density / domains.reduce((sum, dd) => sum + dd.density, 0));
  
  // Poisson-like sampling with minimum spacing
  const minSpacing = 0.4;
  const attempts = particlesInDomain * 20;
  const placed = [];
  
  for (let a = 0; a < attempts && placed.length < particlesInDomain; a++){
    const angle = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * d.r;
    const px = d.cx + Math.cos(angle) * rad;
    const py = d.cy + Math.sin(angle) * rad;
    
    // Check spacing from existing particles in this domain
    let tooClose = false;
    for (const p of placed){
      const dx = p.x - px;
      const dy = p.y - py;
      if (dx*dx + dy*dy < minSpacing * minSpacing){
        tooClose = true;
        break;
      }
    }
    
    if (!tooClose && particleIndex < N){
      placed.push({ x: px, y: py });
      
      positions[particleIndex * 3] = px;
      positions[particleIndex * 3 + 1] = py;
      positions[particleIndex * 3 + 2] = (Math.random() - 0.5) * 0.5;
      
      // Initial velocity aligned with domain flow angle
      const speed = 0.015 + Math.random() * 0.01;
      velocities[particleIndex * 3] = Math.cos(d.angle) * speed;
      velocities[particleIndex * 3 + 1] = Math.sin(d.angle) * speed;
      velocities[particleIndex * 3 + 2] = 0;
      
      const col = domainColors[di];
      colors[particleIndex * 3] = col.r;
      colors[particleIndex * 3 + 1] = col.g;
      colors[particleIndex * 3 + 2] = col.b;
      
      sizes[particleIndex] = 0.3 + Math.random() * 0.4;
      ages[particleIndex] = Math.random() * 1000;
      
      particleIndex++;
    }
  }
}

// Fill remaining slots if any
while (particleIndex < N){
  const d = domains[Math.floor(Math.random() * domains.length)];
  const angle = Math.random() * Math.PI * 2;
  const rad = Math.sqrt(Math.random()) * d.r;
  positions[particleIndex * 3] = d.cx + Math.cos(angle) * rad;
  positions[particleIndex * 3 + 1] = d.cy + Math.sin(angle) * rad;
  positions[particleIndex * 3 + 2] = 0;
  velocities[particleIndex * 3] = 0;
  velocities[particleIndex * 3 + 1] = 0;
  velocities[particleIndex * 3 + 2] = 0;
  const col = domainColors[Math.floor(Math.random() * domainColors.length)];
  colors[particleIndex * 3] = col.r;
  colors[particleIndex * 3 + 1] = col.g;
  colors[particleIndex * 3 + 2] = col.b;
  sizes[particleIndex] = 0.3;
  ages[particleIndex] = 0;
  particleIndex++;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float size;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vCol = color;
      float pulse = 0.7 + 0.3 * sin(age + uTime * 0.5);
      vAlpha = 0.65 * pulse;
      
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * 120.0 * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      
      // Oil-paint texture: soft edge with radial opacity gradient
      float edge = smoothstep(0.5, 0.3, r);
      float core = smoothstep(0.4, 0.0, r);
      float brush = edge * 0.5 + core * 0.5;
      
      float a = brush * vAlpha;
      gl_FragColor = vec4(vCol * (0.8 + 0.2 * core), a);
    }
  `,
  vertexColors: true
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geom.setAttribute('age', new THREE.BufferAttribute(ages, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const height = 50;
  const width = height * aspect;
  camera.left = -width / 2;
  camera.right = width / 2;
  camera.top = height / 2;
  camera.bottom = -height / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const height = 50;
  const width = height * aspect;
  camera.left = -width / 2;
  camera.right = width / 2;
  camera.top = height / 2;
  camera.bottom = -height / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Flow field: each domain generates its own non-crossing streamlines
function getFlowVector(x, y){
  let fx = 0, fy = 0;
  let totalWeight = 0;
  
  for (const d of domains){
    const dx = x - d.cx;
    const dy = y - d.cy;
    const distSq = dx*dx + dy*dy;
    const rSq = d.r * d.r;
    
    if (distSq < rSq){
      // Inside domain: flow aligned with domain angle + curl
      const weight = 1.0 - distSq / rSq;
      const baseAngle = d.angle;
      const curlAngle = Math.atan2(dy, dx) + Math.PI / 2;
      const finalAngle = baseAngle + d.curl * curlAngle;
      
      fx += Math.cos(finalAngle) * weight;
      fy += Math.sin(finalAngle) * weight;
      totalWeight += weight;
    }
  }
  
  if (totalWeight > 0.01){
    fx /= totalWeight;
    fy /= totalWeight;
  }
  
  return { x: fx, y: fy };
}

function updateParticles(dt){
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    
    const flow = getFlowVector(px, py);
    
    // Gentle acceleration toward flow direction
    velocities[i*3] += (flow.x * 0.02 - velocities[i*3]) * 0.05;
    velocities[i*3+1] += (flow.y * 0.02 - velocities[i*3+1]) * 0.05;
    
    // Update position
    positions[i*3] += velocities[i*3] * dt * 60;
    positions[i*3+1] += velocities[i*3+1] * dt * 60;
    
    // Wrap particles that leave their domain back to domain center with fade
    let inAnyDomain = false;
    for (const d of domains){
      const dx = positions[i*3] - d.cx;
      const dy = positions[i*3+1] - d.cy;
      if (dx*dx + dy*dy < d.r * d.r * 1.5){
        inAnyDomain = true;
        break;
      }
    }
    
    if (!inAnyDomain){
      // Find closest domain and wrap back
      let minDist = Infinity;
      let closestDomain = domains[0];
      for (const d of domains){
        const dx = positions[i*3] - d.cx;
        const dy = positions[i*3+1] - d.cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < minDist){
          minDist = dist;
          closestDomain = d;
        }
      }
      
      const angle = Math.random() * Math.PI * 2;
      const rad = Math.random() * closestDomain.r * 0.3;
      positions[i*3] = closestDomain.cx + Math.cos(angle) * rad;
      positions[i*3+1] = closestDomain.cy + Math.sin(angle) * rad;
      velocities[i*3] = 0;
      velocities[i*3+1] = 0;
    }
    
    ages[i] += dt;
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;
}

let lastTime = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;
  
  uniforms.uTime.value = t;
  updateParticles(dt);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
