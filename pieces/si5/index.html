<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>si5 · dandelion-clock · ribbon dispersal</title>
<!-- MOTION: disperse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0c0a; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>

<body>
<div class="id">si5</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

/* ── risograph posterize shader (inherited from iwd) ── */
const RisographShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime:    { value: 0 },
    uRes:     { value: new THREE.Vector2(1, 1) },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec4 tex = texture2D(tDiffuse, vUv);
      float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
      vec3 shadow = vec3(0.102, 0.078, 0.200);
      vec3 mid    = vec3(0.710, 0.380, 0.227);
      vec3 light  = vec3(0.937, 0.894, 0.800);
      float grain = (hash(vUv * uRes + uTime * 0.3) - 0.5) * 0.06;
      lum += grain;
      vec3 col;
      if      (lum < 0.18) col = shadow;
      else if (lum < 0.52) col = mid;
      else                 col = light;
      vec2 cell = floor(vUv * uRes / 3.0);
      float dot2 = hash(cell + 0.1);
      if (lum > 0.18 && lum < 0.52){ col *= 0.92 + 0.08 * step(0.45, dot2); }
      float paper = hash(vUv * uRes * 0.7 + 99.0) * 0.03;
      col += paper;
      gl_FragColor = vec4(col, 1.0);
    }
  `
};

// ── scene ──
const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x0e0c0a, 0.018);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0c0a, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.4);
lightKey.position.set(6, 14, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.35));
scene.add(new THREE.DirectionalLight(0x405078, 0.25)).position.set(-6, 4, -4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const risoPass = new ShaderPass(RisographShader);
risoPass.uniforms.uRes.value.set(innerWidth * renderer.getPixelRatio(),
                                  innerHeight * renderer.getPixelRatio());
composer.addPass(risoPass);

// ── differential growth ──
const MAX_VERTS = 1400;
const ATTRACT = 0.06, REPEL_R = 0.55, REPEL_STR = 0.14;
const NOISE_S = 0.003, PRESSURE = 0.0030, RISE = 0.0045, MAX_D = 0.42;
const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y:0, z: Math.sin(th)*r, age:0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function getNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for (let i=0;i<n;i++){
    const v=verts[i];
    for (const j of getNeighbors(v)){
      if (j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if (d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for (let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for (let i=0;i<n;i++){ cx2+=verts[i].x; cy2+=verts[i].y; cz2+=verts[i].z; }
  cx2/=n; cy2/=n; cz2/=n;
  for (let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for (let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                   age:Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length=0;
  for (const v of grown) verts.push(v);
}
for (let s=0;s<1200;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

// ── ribbon mesh ──
let ribbonMesh = null;
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0xc9a45a, emissive: 0x2a1a06,
  roughness: 0.32, metalness: 0.7, side: THREE.DoubleSide,
});

// ── SURPRISE: dandelion seeds ──
// At ~12s the ribbon exhales a cloud of seed-pappus particles that drift
// upward like a dandelion clock blown. Seeds float, slow, then gently
// resettle back onto the ribbon. Cyclical — every ~28s.
const SEED_COUNT = 280;
const seedData = [];
const seedPositions = new Float32Array(SEED_COUNT * 3);
const seedAlphas    = new Float32Array(SEED_COUNT);
const seedSizes     = new Float32Array(SEED_COUNT);

for (let i = 0; i < SEED_COUNT; i++){
  seedData.push({
    ox:0, oy:0, oz:0,       // origin on ribbon
    vx:0, vy:0, vz:0,       // velocity
    drift: 0.3 + Math.random()*0.7,  // drift speed multiplier
    wobblePhase: Math.random()*Math.PI*2,
    wobbleFreq: 0.6 + Math.random()*0.8,
    size: 2.5 + Math.random()*3.5,
    delay: Math.random()*1.8,   // staggered release
  });
  seedAlphas[i] = 0;
  seedSizes[i] = 3;
}

const seedGeo = new THREE.BufferGeometry();
seedGeo.setAttribute('position', new THREE.BufferAttribute(seedPositions, 3));
seedGeo.setAttribute('alpha', new THREE.BufferAttribute(seedAlphas, 1));
seedGeo.setAttribute('size', new THREE.BufferAttribute(seedSizes, 1));

const seedMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uPR: { value: renderer.getPixelRatio() } },
  vertexShader: `
    attribute float alpha;
    attribute float size;
    varying float vAlpha;
    uniform float uPR;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPR * (6.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      // pappus shape: radial lines from center
      float r = length(c);
      float angle = atan(c.y, c.x);
      float spokes = abs(sin(angle * 4.0));
      float shape = smoothstep(0.5, 0.15, r) * (0.4 + 0.6 * smoothstep(0.0, 0.3, spokes * (1.0 - r*1.4)));
      // center dot
      shape += smoothstep(0.12, 0.04, r) * 0.8;
      if (shape < 0.01) discard;
      // warm cream color like the riso highlight
      gl_FragColor = vec4(0.92, 0.87, 0.76, shape * vAlpha);
    }
  `
});
const seedPoints = new THREE.Points(seedGeo, seedMat);
scene.add(seedPoints);

// Surprise timing: period=28s, blow starts at phase 0, lasts ~8s, settle ~6s
const PERIOD = 28.0;
const BLOW_START = 0.0;
const BLOW_DUR   = 3.0;   // seconds to release all seeds
const FLOAT_DUR  = 6.0;   // seeds float
const SETTLE_DUR = 5.0;   // seeds fade/settle
const QUIET_DUR  = PERIOD - BLOW_DUR - FLOAT_DUR - SETTLE_DUR; // ribbon alone

function updateSeeds(t, ribbonVerts){
  const cycle = ((t - 10.0) % PERIOD + PERIOD) % PERIOD; // first blow at t≈10s
  const blowing = cycle < BLOW_DUR;
  const floating = cycle >= BLOW_DUR && cycle < BLOW_DUR + FLOAT_DUR;
  const settling = cycle >= BLOW_DUR + FLOAT_DUR && cycle < BLOW_DUR + FLOAT_DUR + SETTLE_DUR;
  const quiet = !blowing && !floating && !settling;

  const nv = ribbonVerts.length;
  if (nv < 10) return;

  for (let i = 0; i < SEED_COUNT; i++){
    const sd = seedData[i];

    if (blowing && cycle >= sd.delay){
      // pick a release point — first frame after delay
      if (seedAlphas[i] < 0.01){
        const vi = Math.floor(Math.random() * nv);
        const rv = ribbonVerts[vi];
        sd.ox = rv.x; sd.oy = rv.y; sd.oz = rv.z;
        // outward + upward velocity like wind-blown pappus
        const ang = Math.random() * Math.PI * 2;
        const upStr = 0.015 + Math.random() * 0.02;
        const outStr = 0.005 + Math.random() * 0.012;
        sd.vx = Math.cos(ang) * outStr;
        sd.vy = upStr;
        sd.vz = Math.sin(ang) * outStr;
      }
      const localT = (cycle - sd.delay) / (BLOW_DUR - sd.delay + 0.01);
      seedAlphas[i] = Math.min(1.0, localT * 3.0);
    }

    if (blowing || floating){
      // drift with wobble
      const wobble = Math.sin(t * sd.wobbleFreq + sd.wobblePhase) * 0.003;
      sd.ox += sd.vx * sd.drift + wobble;
      sd.oy += sd.vy * sd.drift;
      sd.oz += sd.vz * sd.drift + wobble * 0.7;
      // slow deceleration
      sd.vx *= 0.997; sd.vy *= 0.997; sd.vz *= 0.997;
      if (floating) seedAlphas[i] = Math.min(seedAlphas[i], 1.0);
    }

    if (settling){
      const sPhase = (cycle - BLOW_DUR - FLOAT_DUR) / SETTLE_DUR;
      seedAlphas[i] *= 0.97; // fade
      // gentle downward drift
      sd.oy -= 0.002;
    }

    if (quiet){
      seedAlphas[i] = 0;
    }

    seedPositions[i*3]   = sd.ox;
    seedPositions[i*3+1] = sd.oy;
    seedPositions[i*3+2] = sd.oz;
    seedSizes[i] = sd.size * (0.6 + 0.4 * seedAlphas[i]);
  }

  seedGeo.attributes.position.needsUpdate = true;
  seedGeo.attributes.alpha.needsUpdate = true;
  seedGeo.attributes.size.needsUpdate = true;
}

// ── resize ──
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  risoPass.uniforms.uRes.value.set(innerWidth*renderer.getPixelRatio(),
                                    innerHeight*renderer.getPixelRatio());
});

// ── ribbon width modulation: thins during blow, recovers after ──
const start = performance.now();
function loop(){
  const t = (performance.now()-start)/1000;
  for (let s=0;s<4;s++) step();

  // surprise phase for ribbon thinning
  const cycle = ((t - 10.0) % PERIOD + PERIOD) % PERIOD;
  const blowPhase = Math.max(0, Math.min(1, cycle / (BLOW_DUR + FLOAT_DUR)));
  const settlePhase = cycle >= BLOW_DUR + FLOAT_DUR
    ? Math.min(1, (cycle - BLOW_DUR - FLOAT_DUR) / SETTLE_DUR) : 0;
  // ribbon thins to 60% during dispersal, recovers during settle
  const ribbonScale = 1.0 - 0.4 * Math.sin(blowPhase * Math.PI) * (1.0 - settlePhase);

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N = Math.min(1200, verts.length*3);
    const positions = new Float32Array(N*2*3);
    const indices = [];
    const up = new THREE.Vector3(0,1,0);

    for (let i=0;i<N;i++){
      const tt = i/N;
      const p = curve.getPointAt(tt);
      const tangent = curve.getTangentAt(tt).normalize();
      let lateral = new THREE.Vector3().crossVectors(tangent, up);
      if (lateral.lengthSq()<0.001) lateral.set(1,0,0);
      lateral.normalize();
      const width = (0.20+0.16*Math.sin(tt*32.0+t*0.4)) * ribbonScale;
      const left  = p.clone().addScaledVector(lateral, -width);
      const right = p.clone().addScaledVector(lateral,  width);
      positions[i*6]=left.x; positions[i*6+1]=left.y; positions[i*6+2]=left.z;
      positions[i*6+3]=right.x; positions[i*6+4]=right.y; positions[i*6+5]=right.z;
    }
    for (let i=0;i<N;i++){
      const ni=(i+1)%N;
      const a=i*2, b=i*2+1, c=ni*2, d=ni*2+1;
      indices.push(a,b,c); indices.push(b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    g.setIndex(indices);
    g.computeVertexNormals();
    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    scene.add(ribbonMesh);
  }

  // update seeds
  updateSeeds(t, verts);

  // camera tracking
  let yMean=0; for (const v of verts) yMean+=v.y; yMean/=Math.max(verts.length,1);
  // during seed float, nudge camera target slightly upward to follow seeds
  let seedLift = 0;
  if (cycle > BLOW_DUR && cycle < BLOW_DUR + FLOAT_DUR + SETTLE_DUR){
    let maxSeedY = 0;
    for (let i=0; i<SEED_COUNT; i++){
      if (seedAlphas[i] > 0.1 && seedData[i].oy > maxSeedY) maxSeedY = seedData[i].oy;
    }
    seedLift = Math.max(0, (maxSeedY - yMean) * 0.2);
  }
  const targetY = Math.max(yMean + seedLift, 2.0);
  controls.target.y += (targetY-controls.target.y)*0.04;
  camera.position.y += (targetY+4-camera.position.y)*0.04;

  risoPass.uniforms.uTime.value = t;
  controls.update();
  composer.render();
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
