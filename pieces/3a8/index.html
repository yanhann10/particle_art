<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3a8 · folded leaves · organic arrangement</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0805; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">3a8</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0805, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);
controls.maxDistance = 25;
controls.minDistance = 6;

/* ── Folded Leaf Geometry Builder ── */
function createFoldedLeaf(params) {
  const {
    length = 4.0,
    width = 1.8,
    curlAmount = 0.8,
    twistAmount = 0.4,
    segments = 48,
    foldAxis = 'x' // x or z for different curl directions
  } = params;
  
  const geom = new THREE.BufferGeometry();
  const positions = [];
  const uvs = [];
  const indices = [];
  
  const widthSegs = 12;
  const lengthSegs = segments;
  
  for (let i = 0; i <= lengthSegs; i++) {
    const t = i / lengthSegs;
    const y = (t - 0.5) * length;
    
    // Curl function: more curl toward tip
    const curlPhase = Math.pow(t, 1.6) * curlAmount * Math.PI * 1.4;
    const twist = t * twistAmount * Math.PI;
    
    for (let j = 0; j <= widthSegs; j++) {
      const s = j / widthSegs;
      const u = (s - 0.5) * 2; // -1 to 1
      
      // Width taper: narrower at base and tip
      const taper = 1.0 - Math.pow(Math.abs(t * 2 - 1), 2.2) * 0.4;
      const x = u * width * taper;
      
      let px, py, pz;
      
      if (foldAxis === 'x') {
        // Curl in x-z plane (leaf curls around x-axis)
        const radius = Math.abs(x);
        const angle = u * curlPhase;
        pz = radius * Math.sin(angle);
        px = x * Math.cos(angle) * 0.3; // compressed in x
        py = y;
        
        // Add twist
        const ct = Math.cos(twist);
        const st = Math.sin(twist);
        const tx = px * ct - pz * st;
        const tz = px * st + pz * ct;
        px = tx;
        pz = tz;
      } else {
        // Curl in y-z plane (leaf curls around z-axis)
        const radius = Math.abs(x);
        const angle = u * curlPhase;
        py = y * Math.cos(angle) + radius * Math.sin(angle);
        px = x * Math.cos(angle) * 0.4;
        pz = -y * Math.sin(angle) * 0.3;
        
        // Add twist
        const ct = Math.cos(twist);
        const st = Math.sin(twist);
        const ty = py * ct - px * st;
        const tx = py * st + px * ct;
        py = ty;
        px = tx;
      }
      
      positions.push(px, py, pz);
      uvs.push(s, t);
    }
  }
  
  // Build indices
  for (let i = 0; i < lengthSegs; i++) {
    for (let j = 0; j < widthSegs; j++) {
      const a = i * (widthSegs + 1) + j;
      const b = a + widthSegs + 1;
      const c = a + 1;
      const d = b + 1;
      
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  
  return geom;
}

/* ── Leaf Material: warm amber with venation ── */
const leafMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  transparent: true,
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0xc47d3a) }, // ochre
    uColor2: { value: new THREE.Color(0x7d4424) }, // sienna
    uColor3: { value: new THREE.Color(0xe8c090) }, // pale amber
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;
    uniform float uTime;
    
    void main() {
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vPos = position;
      
      // Gentle breathing motion
      vec3 p = position;
      float sway = sin(uTime * 0.6 + position.y * 0.4) * 0.03;
      p.x += sway;
      p.z += cos(uTime * 0.5 + position.y * 0.3) * 0.02;
      
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPos;
    
    // Simple 2D noise for venation
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    
    float noise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    
    void main() {
      // Base gradient: darker at edges, lighter at center
      float centerDist = abs(vUv.x - 0.5) * 2.0;
      float tipDist = vUv.y;
      
      vec3 baseCol = mix(uColor1, uColor2, centerDist * 0.6);
      baseCol = mix(baseCol, uColor3, (1.0 - tipDist) * 0.3);
      
      // Venation pattern: faint lines along length
      float vein1 = abs(vUv.x - 0.5);
      vein1 = smoothstep(0.48, 0.5, vein1); // midvein
      
      float vein2 = noise(vec2(vUv.x * 8.0, vUv.y * 12.0));
      vein2 = smoothstep(0.6, 0.65, vein2) * 0.3;
      
      float veins = vein1 * 0.6 + vein2;
      vec3 veinCol = uColor2 * 0.6;
      vec3 col = mix(baseCol, veinCol, veins);
      
      // Fresnel-like edge glow
      float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0, 0, 1))), 2.0);
      col += uColor3 * fresnel * 0.15;
      
      // Alpha: fade at extreme edges
      float alpha = 0.85;
      alpha *= 1.0 - smoothstep(0.8, 1.0, centerDist);
      alpha *= 1.0 - smoothstep(0.9, 1.0, tipDist);
      
      gl_FragColor = vec4(col, alpha);
    }
  `
});

/* ── Build leaf arrangement: 7 folded leaves in organic cluster ── */
const leafGroup = new THREE.Group();

const leafConfigs = [
  // Central upright uncurling fern
  { length: 5.2, width: 2.0, curlAmount: 1.2, twistAmount: 0.3, axis: 'x',
    pos: [0, -0.5, 0], rot: [0, 0, 0], scale: 1.0 },
  
  // Two flanking palm fronds
  { length: 4.8, width: 1.6, curlAmount: 0.9, twistAmount: 0.5, axis: 'z',
    pos: [-2.2, 0.3, 0.8], rot: [0.3, -0.6, 0.5], scale: 0.9 },
  { length: 4.6, width: 1.5, curlAmount: 0.85, twistAmount: -0.4, axis: 'z',
    pos: [2.0, 0.1, -0.6], rot: [-0.2, 0.7, -0.4], scale: 0.85 },
  
  // Three smaller curling autumn leaves
  { length: 3.2, width: 1.3, curlAmount: 1.5, twistAmount: 0.8, axis: 'x',
    pos: [-1.2, -1.8, 1.2], rot: [0.8, -0.3, 0.9], scale: 0.7 },
  { length: 3.0, width: 1.2, curlAmount: 1.4, twistAmount: -0.7, axis: 'x',
    pos: [1.5, -1.5, -1.0], rot: [-0.6, 0.5, -0.7], scale: 0.65 },
  
  // Two background elements
  { length: 4.2, width: 1.7, curlAmount: 0.7, twistAmount: 0.4, axis: 'z',
    pos: [0.3, 1.2, -1.8], rot: [0.2, 0.1, 0.3], scale: 0.8 },
  { length: 3.8, width: 1.4, curlAmount: 1.1, twistAmount: -0.5, axis: 'x',
    pos: [-0.8, 0.8, 1.5], rot: [-0.4, -0.2, 0.6], scale: 0.75 },
];

for (const cfg of leafConfigs) {
  const geom = createFoldedLeaf({
    length: cfg.length,
    width: cfg.width,
    curlAmount: cfg.curlAmount,
    twistAmount: cfg.twistAmount,
    segments: 52,
    foldAxis: cfg.axis
  });
  const mesh = new THREE.Mesh(geom, leafMat.clone());
  mesh.position.set(...cfg.pos);
  mesh.rotation.set(...cfg.rot);
  mesh.scale.setScalar(cfg.scale);
  leafGroup.add(mesh);
}

scene.add(leafGroup);

/* ── Atmospheric fog ── */
scene.fog = new THREE.FogExp2(0x0a0805, 0.04);

/* ── Warm side light ── */
const ambientLight = new THREE.AmbientLight(0x4a3828, 0.5);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffca90, 1.2);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8a5a3a, 0.6);
rimLight.position.set(-4, 2, -3);
scene.add(rimLight);

/* ── Resize handler ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animation loop ── */
const start = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  // Update material time uniforms
  leafGroup.children.forEach(mesh => {
    mesh.material.uniforms.uTime.value = elapsed;
  });
  
  // Gentle group rotation
  leafGroup.rotation.y = Math.sin(elapsed * 0.15) * 0.12;
  
  // Subtle vertical drift
  leafGroup.position.y = Math.sin(elapsed * 0.2) * 0.3;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
