<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4wa · nautilus leaf spiral</title>
<!-- MOTION: spiral, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">4wa</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
camera.lookAt(0, 0, 0);

const fogColor = 0x0a0806;
scene.fog = new THREE.FogExp2(fogColor, 0.025);

// golden ratio for spiral
const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = 2 * Math.PI * (1 - 1/PHI);

// leaf geometry — curled sheet with midrib
function createLeafGeometry(length, width) {
  const segs = 18;
  const verts = [];
  const indices = [];
  
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const x = t * length;
    const curl = Math.pow(t, 1.8) * 0.3;
    const taper = 1 - Math.pow(t, 2.2);
    
    for (let side = -1; side <= 1; side += 2) {
      const y = side * width * taper * 0.5;
      const z = curl * (1 - Math.abs(side * 0.3));
      verts.push(x, y, z);
    }
  }
  
  for (let i = 0; i < segs; i++) {
    const base = i * 2;
    indices.push(base, base+1, base+2);
    indices.push(base+1, base+3, base+2);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

const baseGeom = createLeafGeometry(1.0, 0.45);

// palette: autumn oxide red, ochre, umber, warm cream, rare olive
const palette = [
  0xa83820, // oxide red
  0xc87030, // burnt ochre
  0x8b5a3c, // umber
  0xe8d8b8, // warm cream
  0x9a824a, // ochre gold
  0x6b5d3f, // dark olive
];

function pickColor(index, total) {
  const t = index / total;
  if (t < 0.3) return palette[0];
  if (t < 0.5) return palette[1];
  if (t < 0.7) return palette[2];
  if (t < 0.85) return palette[4];
  if (t < 0.95) return palette[3];
  return palette[5];
}

// create spiral of leaves
const leafCount = 144;
const leaves = [];

for (let i = 0; i < leafCount; i++) {
  const angle = i * GOLDEN_ANGLE;
  const radius = Math.sqrt(i + 1) * 0.42;
  const scale = 0.18 + Math.pow(i / leafCount, 0.65) * 1.2;
  
  const mat = new THREE.MeshPhongMaterial({
    color: pickColor(i, leafCount),
    side: THREE.DoubleSide,
    flatShading: false,
    shininess: 8,
    emissive: pickColor(i, leafCount),
    emissiveIntensity: 0.08
  });
  
  const mesh = new THREE.Mesh(baseGeom, mat);
  
  mesh.position.x = Math.cos(angle) * radius;
  mesh.position.y = Math.sin(angle) * radius;
  mesh.position.z = -i * 0.008;
  
  mesh.rotation.z = angle + Math.PI * 0.5;
  
  const tiltVariation = (Math.sin(i * 0.7) * 0.3 + Math.cos(i * 1.3) * 0.2);
  mesh.rotation.x = tiltVariation * 0.4;
  mesh.rotation.y = tiltVariation * 0.25;
  
  mesh.scale.set(scale, scale, scale);
  
  mesh.userData = {
    baseAngle: angle,
    baseRadius: radius,
    index: i,
    phaseOffset: Math.random() * Math.PI * 2,
    breathRate: 0.8 + Math.random() * 0.4
  };
  
  scene.add(mesh);
  leaves.push(mesh);
}

// lighting
const ambient = new THREE.AmbientLight(0x3a2818, 0.3);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffead0, 0.7);
key.position.set(3, 4, 5);
scene.add(key);

const fill = new THREE.DirectionalLight(0xa86040, 0.25);
fill.position.set(-2, -1, 3);
scene.add(fill);

const rim = new THREE.PointLight(0xe8d8b8, 0.4, 20);
rim.position.set(0, 0, -3);
scene.add(rim);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;
  
  // very slow spiral rotation + camera orbit
  const spiralRot = elapsed * 0.08;
  
  leaves.forEach((leaf) => {
    const data = leaf.userData;
    const breathPhase = elapsed * data.breathRate + data.phaseOffset;
    const breathAmp = 0.04 * Math.sin(breathPhase);
    
    const newAngle = data.baseAngle + spiralRot;
    leaf.position.x = Math.cos(newAngle) * data.baseRadius;
    leaf.position.y = Math.sin(newAngle) * data.baseRadius;
    
    leaf.rotation.z = newAngle + Math.PI * 0.5;
    
    const scaleBreath = leaf.scale.x + breathAmp;
    leaf.scale.setScalar(scaleBreath);
  });
  
  // camera slow orbit
  const camAngle = elapsed * 0.12;
  camera.position.x = Math.sin(camAngle) * 12;
  camera.position.z = Math.cos(camAngle) * 12;
  camera.position.y = Math.sin(camAngle * 0.4) * 2;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
