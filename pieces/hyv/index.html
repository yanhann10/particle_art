<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hyv · critical stream · data-flow sculpture</title>
<!-- MOTION: flow, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#070a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">hyv · critical stream · robillard flow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Gaëtan Robillard–inspired kinetic data sculpture: climate-data glyphs (text sprites)
// flow along field lines between "truth node" (clean laminar streams) and "distortion node"
// (turbulent vortex). Transparent geometric volumes mark zones of data-integrity. 
// Palette: instrument-panel teal (#44b8a8) on deep black, glyphs white when clean, red when distorted.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a0c, 0.015);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 6, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a0c, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 3, 0);
controls.minDistance = 8;
controls.maxDistance = 32;

// two point lights simulating panel instrumentation
const lightA = new THREE.PointLight(0x44b8a8, 1.2, 25);
lightA.position.set(-5, 7, 3);
scene.add(lightA);
const lightB = new THREE.PointLight(0x88dddd, 0.6, 20);
lightB.position.set(6, 4, -4);
scene.add(lightB);
scene.add(new THREE.AmbientLight(0x0f1a1c, 0.3));

// ─────────── transparent zone volumes (glass instrument casings)
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x44b8a8,
  metalness: 0.1,
  roughness: 0.2,
  transmission: 0.88,
  thickness: 0.5,
  transparent: true,
  opacity: 0.2,
  side: THREE.DoubleSide
});

const truthVolume = new THREE.Mesh(
  new THREE.BoxGeometry(3, 5, 3),
  glassMat
);
truthVolume.position.set(-6, 3, 0);
scene.add(truthVolume);

const distortionVolume = new THREE.Mesh(
  new THREE.CylinderGeometry(2, 2.5, 6, 6, 1, true),
  glassMat
);
distortionVolume.position.set(6, 3.5, 0);
scene.add(distortionVolume);

// node spheres
const nodeMat = new THREE.MeshStandardMaterial({
  color: 0x44b8a8,
  emissive: 0x225544,
  roughness: 0.3,
  metalness: 0.6
});
const truthNode = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), nodeMat);
truthNode.position.copy(truthVolume.position);
scene.add(truthNode);

const distortionNode = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), nodeMat.clone());
distortionNode.material.color.set(0xcc4444);
distortionNode.material.emissive.set(0x442222);
distortionNode.position.copy(distortionVolume.position);
scene.add(distortionNode);

// ─────────── text glyphs as sprites (climate data fragments)
const glyphPool = [
  '+2.4°C', '420ppm', '-18%', 'IPCC', '1.5°C', 'NET-ZERO',
  'ALBEDO', 'CO₂ SINK', 'CH₄ LEAK', 'FEEDBACK', 'ARCTIC',
  'DENIAL', 'FACT', 'MODEL', 'TREND', 'ANOMALY', 'THRESHOLD'
];

function makeGlyphTexture(txt) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.font = 'bold 28px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(txt, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

const glyphMats = glyphPool.map(txt => {
  return new THREE.SpriteMaterial({
    map: makeGlyphTexture(txt),
    transparent: true,
    opacity: 0.85,
    depthWrite: false
  });
});

// ─────────── particle system: each particle carries a glyph sprite + field state
const N_PARTICLES = 120;
const particles = [];
class Particle {
  constructor() {
    // spawn near truth node
    this.pos = new THREE.Vector3(
      truthNode.position.x + (Math.random()-0.5)*2,
      truthNode.position.y + (Math.random()-0.5)*3,
      truthNode.position.z + (Math.random()-0.5)*2
    );
    this.vel = new THREE.Vector3(0, 0, 0);
    this.age = Math.random() * 20;
    this.lifespan = 40 + Math.random() * 30;
    const mat = glyphMats[Math.floor(Math.random() * glyphMats.length)].clone();
    this.sprite = new THREE.Sprite(mat);
    this.sprite.scale.set(1.2, 0.3, 1);
    this.sprite.position.copy(this.pos);
    scene.add(this.sprite);
    this.integrity = 1.0; // 1 = clean, 0 = distorted
  }
  update(dt) {
    this.age += dt;
    if (this.age > this.lifespan) {
      this.reset();
      return;
    }

    // vector field: attract to distortion node with turbulence, repel slightly from truth
    const toTruth = new THREE.Vector3().subVectors(truthNode.position, this.pos);
    const toDist = new THREE.Vector3().subVectors(distortionNode.position, this.pos);
    const dTruth = toTruth.length();
    const dDist = toDist.length();

    // near truth: gentle laminar flow upward + slight outward push
    let force = new THREE.Vector3(0, 0, 0);
    if (dTruth < 4) {
      const laminar = new THREE.Vector3(0, 0.3, 0);
      const pushOut = toTruth.clone().normalize().multiplyScalar(-0.15);
      force.add(laminar).add(pushOut);
      this.integrity = Math.min(1.0, this.integrity + dt * 0.4);
    }

    // near distortion: strong vortex pull + noise
    if (dDist < 6) {
      const pull = toDist.clone().normalize().multiplyScalar(0.8 / (dDist + 0.5));
      const tangent = new THREE.Vector3(-toDist.z, 0, toDist.x).normalize();
      const spin = tangent.multiplyScalar(0.6);
      const noise = new THREE.Vector3(
        (Math.random()-0.5)*0.4,
        (Math.random()-0.5)*0.4,
        (Math.random()-0.5)*0.4
      );
      force.add(pull).add(spin).add(noise);
      this.integrity = Math.max(0.0, this.integrity - dt * 0.7);
    }

    // global upward drift + lateral wander
    force.y += 0.12;
    force.x += Math.sin(this.age * 0.3 + this.pos.z) * 0.05;
    force.z += Math.cos(this.age * 0.25 + this.pos.x) * 0.05;

    this.vel.add(force.multiplyScalar(dt));
    this.vel.multiplyScalar(0.92); // damping
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    this.sprite.position.copy(this.pos);

    // color shift: white → red as integrity drops
    const cleanColor = new THREE.Color(0xffffff);
    const distortColor = new THREE.Color(0xff4444);
    const col = cleanColor.clone().lerp(distortColor, 1 - this.integrity);
    this.sprite.material.color = col;

    // fade out near end of life
    const fadeStart = this.lifespan * 0.8;
    if (this.age > fadeStart) {
      const fadeProgress = (this.age - fadeStart) / (this.lifespan - fadeStart);
      this.sprite.material.opacity = 0.85 * (1 - fadeProgress);
    } else {
      this.sprite.material.opacity = 0.85;
    }

    // respawn if too far from action
    if (this.pos.length() > 30) this.reset();
  }
  reset() {
    this.pos.set(
      truthNode.position.x + (Math.random()-0.5)*2,
      truthNode.position.y + (Math.random()-0.5)*3,
      truthNode.position.z + (Math.random()-0.5)*2
    );
    this.vel.set(0, 0, 0);
    this.age = 0;
    this.lifespan = 40 + Math.random() * 30;
    this.integrity = 1.0;
    this.sprite.position.copy(this.pos);
    // pick new random glyph
    const newMat = glyphMats[Math.floor(Math.random() * glyphMats.length)].clone();
    this.sprite.material.map = newMat.map;
    this.sprite.material.needsUpdate = true;
  }
}

for (let i = 0; i < N_PARTICLES; i++) {
  particles.push(new Particle());
}

// ─────────── connecting flow-lines (splines visualizing vector field)
const flowLineMat = new THREE.LineBasicMaterial({
  color: 0x44b8a8,
  transparent: true,
  opacity: 0.15,
  depthWrite: false
});
const flowLines = [];
const N_FLOW_LINES = 16;
for (let i = 0; i < N_FLOW_LINES; i++) {
  const pts = [];
  const start = new THREE.Vector3(
    truthNode.position.x + (Math.random()-0.5)*3,
    truthNode.position.y + (Math.random()-0.5)*4,
    truthNode.position.z + (Math.random()-0.5)*3
  );
  let p = start.clone();
  for (let s = 0; s < 40; s++) {
    pts.push(p.clone());
    const toDist = new THREE.Vector3().subVectors(distortionNode.position, p);
    const d = toDist.length();
    const dir = toDist.normalize().multiplyScalar(0.3);
    const up = new THREE.Vector3(0, 0.15, 0);
    const tangent = new THREE.Vector3(-toDist.z, 0, toDist.x).normalize().multiplyScalar(0.2);
    p.add(dir).add(up).add(tangent);
    if (p.length() > 20) break;
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(60));
  const line = new THREE.Line(geo, flowLineMat);
  scene.add(line);
  flowLines.push(line);
}

// ─────────── camera framing: track midpoint between nodes
const midpoint = new THREE.Vector3().addVectors(truthNode.position, distortionNode.position).multiplyScalar(0.5);
controls.target.copy(midpoint);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  const t = now / 1000;

  // subtle node drift
  truthNode.position.y = truthVolume.position.y + Math.sin(t * 0.4) * 0.3;
  distortionNode.position.y = distortionVolume.position.y + Math.cos(t * 0.5) * 0.4;

  for (const p of particles) p.update(dt);

  // gentle volume rotation
  truthVolume.rotation.y += dt * 0.1;
  distortionVolume.rotation.y -= dt * 0.15;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
