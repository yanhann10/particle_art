<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nsz · boids murmuration · Reynolds flocking</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0b0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">nsz · boids murmuration · Reynolds flocking</div>
<div class="hint" id="hint">Reynolds 1986 · cohesion + alignment + separation + boundary</div>
<div class="src">Craig Reynolds · emergent behavior from simple rules</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b0f, 1);
document.body.appendChild(renderer.domElement);

const N = 3200;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const trails = new Float32Array(N); // trail intensity per boid

// Initialize boids in a dispersed sphere
for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 12;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  
  const vtheta = Math.random() * Math.PI * 2;
  const vphi = Math.acos(2 * Math.random() - 1);
  const speed = 0.8 + Math.random() * 0.4;
  velocities[i*3]   = speed * Math.sin(vphi) * Math.cos(vtheta);
  velocities[i*3+1] = speed * Math.sin(vphi) * Math.sin(vtheta);
  velocities[i*3+2] = speed * Math.cos(vphi);
  
  seeds[i] = Math.random();
  trails[i] = Math.random() * 0.3;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float trail;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.3;
      float pulse = 0.5 + 0.5 * sin(phase);
      
      // color palette: dawn murmurations — deep indigo → rose → warm gold
      vec3 c0 = vec3(0.22, 0.18, 0.38); // indigo
      vec3 c1 = vec3(0.78, 0.45, 0.52); // rose
      vec3 c2 = vec3(0.92, 0.76, 0.48); // gold
      float blend = smoothstep(0.3, 0.7, pulse);
      vCol = mix(c0, c1, blend);
      vCol = mix(vCol, c2, smoothstep(0.7, 1.0, pulse) * 0.6);
      
      vAlpha = 0.5 + 0.5 * pulse + trail * 0.4;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.8 + 1.2*pulse + trail*2.0) * uPixel * (60.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('trail', new THREE.BufferAttribute(trails, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Reynolds boids parameters
const PERCEPTION = 3.5;      // how far boids can see neighbors
const SEPARATION_DIST = 1.2; // minimum distance to maintain
const COHESION_FORCE = 0.02;
const ALIGNMENT_FORCE = 0.08;
const SEPARATION_FORCE = 0.15;
const BOUNDARY_FORCE = 0.25;
const MAX_SPEED = 1.8;
const MIN_SPEED = 0.6;
const BOUNDARY = 25; // world boundary sphere

const tmpVec = new THREE.Vector3();
const avgVel = new THREE.Vector3();
const avgPos = new THREE.Vector3();
const steering = new THREE.Vector3();

// Spatial hashing for efficient neighbor lookup
const CELL_SIZE = PERCEPTION * 1.5;
let spatialGrid = new Map();

function getSpatialKey(x, y, z){
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  return `${cx},${cy},${cz}`;
}

function rebuildSpatialGrid(){
  spatialGrid.clear();
  for (let i = 0; i < N; i++){
    const key = getSpatialKey(positions[i*3], positions[i*3+1], positions[i*3+2]);
    if (!spatialGrid.has(key)) spatialGrid.set(key, []);
    spatialGrid.get(key).push(i);
  }
}

function getNeighborCells(x, y, z){
  const cells = [];
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  for (let dx = -1; dx <= 1; dx++){
    for (let dy = -1; dy <= 1; dy++){
      for (let dz = -1; dz <= 1; dz++){
        const key = `${cx+dx},${cy+dy},${cz+dz}`;
        if (spatialGrid.has(key)) cells.push(...spatialGrid.get(key));
      }
    }
  }
  return cells;
}

let frameCount = 0;
const hintEl = document.getElementById('hint');

function updateBoids(dt){
  rebuildSpatialGrid();
  
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const vx = velocities[i*3];
    const vy = velocities[i*3+1];
    const vz = velocities[i*3+2];
    
    avgPos.set(0,0,0);
    avgVel.set(0,0,0);
    steering.set(0,0,0);
    let cohesionCount = 0;
    let alignmentCount = 0;
    
    const neighbors = getNeighborCells(px, py, pz);
    
    for (const j of neighbors){
      if (i === j) continue;
      const dx = positions[j*3] - px;
      const dy = positions[j*3+1] - py;
      const dz = positions[j*3+2] - pz;
      const distSq = dx*dx + dy*dy + dz*dz;
      
      if (distSq < PERCEPTION * PERCEPTION && distSq > 0.01){
        const dist = Math.sqrt(distSq);
        
        // Cohesion: steer toward average position of neighbors
        avgPos.x += positions[j*3];
        avgPos.y += positions[j*3+1];
        avgPos.z += positions[j*3+2];
        cohesionCount++;
        
        // Alignment: match velocity with neighbors
        avgVel.x += velocities[j*3];
        avgVel.y += velocities[j*3+1];
        avgVel.z += velocities[j*3+2];
        alignmentCount++;
        
        // Separation: steer away from very close neighbors
        if (dist < SEPARATION_DIST){
          const force = (SEPARATION_DIST - dist) / SEPARATION_DIST;
          steering.x -= (dx / dist) * force * SEPARATION_FORCE;
          steering.y -= (dy / dist) * force * SEPARATION_FORCE;
          steering.z -= (dz / dist) * force * SEPARATION_FORCE;
        }
      }
    }
    
    // Apply cohesion
    if (cohesionCount > 0){
      avgPos.multiplyScalar(1 / cohesionCount);
      const dx = avgPos.x - px;
      const dy = avgPos.y - py;
      const dz = avgPos.z - pz;
      steering.x += dx * COHESION_FORCE;
      steering.y += dy * COHESION_FORCE;
      steering.z += dz * COHESION_FORCE;
    }
    
    // Apply alignment
    if (alignmentCount > 0){
      avgVel.multiplyScalar(1 / alignmentCount);
      steering.x += (avgVel.x - vx) * ALIGNMENT_FORCE;
      steering.y += (avgVel.y - vy) * ALIGNMENT_FORCE;
      steering.z += (avgVel.z - vz) * ALIGNMENT_FORCE;
    }
    
    // Boundary avoidance: soft spherical boundary
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > BOUNDARY * 0.7){
      const force = Math.pow((distFromCenter - BOUNDARY * 0.7) / (BOUNDARY * 0.3), 2);
      steering.x -= (px / distFromCenter) * force * BOUNDARY_FORCE;
      steering.y -= (py / distFromCenter) * force * BOUNDARY_FORCE;
      steering.z -= (pz / distFromCenter) * force * BOUNDARY_FORCE;
    }
    
    // Update velocity
    velocities[i*3]   += steering.x * dt;
    velocities[i*3+1] += steering.y * dt;
    velocities[i*3+2] += steering.z * dt;
    
    // Clamp speed
    const speed = Math.sqrt(
      velocities[i*3]*velocities[i*3] + 
      velocities[i*3+1]*velocities[i*3+1] + 
      velocities[i*3+2]*velocities[i*3+2]
    );
    if (speed > MAX_SPEED){
      velocities[i*3]   *= MAX_SPEED / speed;
      velocities[i*3+1] *= MAX_SPEED / speed;
      velocities[i*3+2] *= MAX_SPEED / speed;
    } else if (speed < MIN_SPEED && speed > 0.01){
      velocities[i*3]   *= MIN_SPEED / speed;
      velocities[i*3+1] *= MIN_SPEED / speed;
      velocities[i*3+2] *= MIN_SPEED / speed;
    }
    
    // Update position
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    // Update trail intensity based on speed
    trails[i] = THREE.MathUtils.lerp(trails[i], speed / MAX_SPEED, 0.1);
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;
  geom.computeBoundingSphere();
}

// Track centroid and adjust camera to follow flock
const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  // Camera looks at centroid, orbits slowly
  const orbitRadius = 45;
  const orbitSpeed = 0.08;
  const angle = performance.now() * 0.00008 * orbitSpeed;
  camera.position.x = centroid.x + Math.cos(angle) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(angle) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(angle * 0.5) * 12;
  camera.lookAt(centroid);
}

let lastTime = performance.now();
const start = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05); // cap dt to prevent explosion
  lastTime = now;
  const t = (now - start) / 1000;
  
  frameCount++;
  if (frameCount % 60 === 0){
    // Compute emergent statistics
    let avgSpeed = 0;
    for (let i = 0; i < N; i++){
      const vx = velocities[i*3];
      const vy = velocities[i*3+1];
      const vz = velocities[i*3+2];
      avgSpeed += Math.sqrt(vx*vx + vy*vy + vz*vz);
    }
    avgSpeed /= N;
    const coherence = (avgSpeed / MAX_SPEED * 100).toFixed(0);
    hintEl.textContent = `murmuration coherence: ${coherence}% · ${N} boids · Reynolds 1986`;
  }
  
  uniforms.uTime.value = t;
  updateBoids(dt * 60); // scale dt for stable simulation
  updateCamera();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
