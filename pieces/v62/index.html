<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v62 · cursive binary ribbon · sasha stiles</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede1; overflow:hidden;
               color:#1a1412; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#1a1412; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; 
          letter-spacing: 0.04em; max-width: 320px; line-height: 1.5; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; 
          letter-spacing: 0.04em; text-align: right; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a1412; color:#f4ede1; border:1px solid #3a3432;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:5; }
  button.start:hover { background:#2a2422; }
</style>
</head>
<body>
<button class="start" id="startBtn">speak to the ribbon</button>
<div class="id">v62 · cursive binary ribbon · sasha stiles</div>
<div class="hint" id="hint">waiting for voice …</div>
<div class="src">technique: sasha stiles · cursive binary · lumen prize 2025</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede1, 1);
document.body.appendChild(renderer.domElement);

// POEM SOURCE TEXT — Sasha Stiles territory: code-poetry hybrid
const POEM_TEXT = `what is language but a loop of light
cascading through the mind's electric night
each letter born a constellation bright
dissolving into zeros ones and flight
we speak in tongues of ancient calculus
the membrane thin between the them and us
a cursive ribbon flowing cursor-fast
the future speaking backward through the past
I am the ghost inside the lexicon
a syllable that never will be gone`;

const words = POEM_TEXT.replace(/\n/g, ' ').split(/\s+/).filter(s => s.length > 0);

// GLYPH SYSTEM — we'll render each character as a small point-sprite with custom SDF
// For simplicity: use geometric shapes per character class (latin letter vs digit vs space)
// Real implementation would use msdf texture atlas; here we fake it with shader pattern

const N_GLYPHS = 800; // total glyph instances
const positions = new Float32Array(N_GLYPHS * 3);
const charCodes = new Float32Array(N_GLYPHS);    // ASCII code
const phases    = new Float32Array(N_GLYPHS);    // temporal offset
const ribbonT   = new Float32Array(N_GLYPHS);    // position along ribbon [0..1]
const collapse  = new Float32Array(N_GLYPHS);    // 0=glyph, 1=binary digits

// Build character sequence from poem text (cycle through)
let fullText = POEM_TEXT.replace(/\n/g, ' ');
for (let i = 0; i < N_GLYPHS; i++){
  const ch = fullText[i % fullText.length];
  charCodes[i] = ch.charCodeAt(0);
  phases[i] = (i / N_GLYPHS) * 6.28;
  ribbonT[i] = i / N_GLYPHS;
  collapse[i] = 0.0;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uVoice: { value: 0.0 },  // 0..1 voice amplitude
  uCollapse: { value: 0.0 } // global collapse wave
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uVoice;
    uniform float uCollapse;
    attribute float charCode;
    attribute float phase;
    attribute float ribbonT;
    attribute float collapse;
    varying float vChar;
    varying float vCollapse;
    varying float vAlpha;

    // 3D Bezier ribbon — a flowing calligraphic arc through space
    vec3 bezier4(float t, vec3 p0, vec3 p1, vec3 p2, vec3 p3){
      float u = 1.0 - t;
      return u*u*u*p0 + 3.0*u*u*t*p1 + 3.0*u*t*t*p2 + t*t*t*p3;
    }

    void main(){
      float t = ribbonT;
      // scroll animation: advance t over time
      t = fract(t + uTime * 0.05);

      // Bezier control points — a graceful S-curve
      vec3 p0 = vec3(-8.0, -3.0, 2.0);
      vec3 p1 = vec3(-2.0,  4.0, -1.0);
      vec3 p2 = vec3( 3.0, -2.0,  1.0);
      vec3 p3 = vec3( 9.0,  2.0, -2.0);
      vec3 pos = bezier4(t, p0, p1, p2, p3);

      // per-glyph vertical offset modulated by voice
      float yOff = sin(phase + uTime * 1.2) * 0.15 * (1.0 + uVoice * 1.5);
      pos.y += yOff;

      // collapse wave — periodic sections of the ribbon dissolve into binary
      float collapseWave = sin(t * 6.28 * 3.0 - uTime * 1.8);
      collapseWave = smoothstep(0.3, 0.7, collapseWave);
      vCollapse = collapseWave * uCollapse;

      // when collapsed: glyphs split into 8 digits horizontally
      if (vCollapse > 0.5) {
        float digitIndex = mod(ribbonT * float(${N_GLYPHS}), 8.0);
        pos.x += (digitIndex - 3.5) * 0.2 * vCollapse;
      }

      vChar = charCode;
      vAlpha = 0.75 + 0.25 * sin(phase + uTime);

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float dist = -mv.z;
      gl_PointSize = (18.0 + 8.0*uVoice) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying float vChar;
    varying float vCollapse;
    varying float vAlpha;

    // SDF approximation — render a glyph-like shape per character
    float glyphSDF(vec2 uv, float ch){
      // For letters: vertical stroke
      if (ch >= 65.0 && ch <= 122.0) {
        float bar = abs(uv.x) - 0.08;
        return bar;
      }
      // For digits (0-9 or binary): circle
      if (ch >= 48.0 && ch <= 57.0) {
        return length(uv) - 0.25;
      }
      // Space / punctuation: dot
      return length(uv) - 0.15;
    }

    void main(){
      vec2 uv = (gl_PointCoord - 0.5) * 2.0;
      float ch = vChar;

      // If collapsed, show binary digits (0 or 1)
      if (vCollapse > 0.5) {
        ch = mix(ch, mod(ch, 2.0) < 1.0 ? 48.0 : 49.0, vCollapse);
      }

      float d = glyphSDF(uv, ch);
      float mask = 1.0 - smoothstep(-0.02, 0.02, d);
      if (mask < 0.01) discard;

      // Ink palette: charcoal on cream
      vec3 col = vec3(0.1, 0.08, 0.07);
      float a = mask * vAlpha * 0.9;
      gl_FragColor = vec4(col, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('charCode', new THREE.BufferAttribute(charCodes, 1));
geom.setAttribute('phase',    new THREE.BufferAttribute(phases, 1));
geom.setAttribute('ribbonT',  new THREE.BufferAttribute(ribbonT, 1));
geom.setAttribute('collapse', new THREE.BufferAttribute(collapse, 1));

const glyphs = new THREE.Points(geom, mat);
scene.add(glyphs);

const startBtn = document.getElementById('startBtn');
const hintEl   = document.getElementById('hint');

let audioCtx, analyser, dataArray;
let voiceActive = false;

async function startVoice(){
  startBtn.style.display = 'none';
  hintEl.textContent = 'requesting microphone…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    voiceActive = true;
    hintEl.textContent = 'speak · the ribbon listens';
  } catch {
    hintEl.textContent = 'mic denied · ribbon flows passively';
  }
}

startBtn.addEventListener('click', startVoice);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // voice input
  if (voiceActive && analyser) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    const avg = sum / dataArray.length / 255;
    uniforms.uVoice.value = THREE.MathUtils.lerp(uniforms.uVoice.value, avg, 0.2);
  } else {
    // passive pulse
    uniforms.uVoice.value = 0.2 + 0.15 * Math.sin(t * 0.6);
  }

  // collapse wave cycles every 8 seconds
  uniforms.uCollapse.value = Math.abs(Math.sin(t * 0.39));

  // gentle camera drift
  camera.position.x = Math.sin(t * 0.1) * 2.0;
  camera.position.y = Math.cos(t * 0.07) * 1.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
