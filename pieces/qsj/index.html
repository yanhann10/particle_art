<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: flocking, intensity: gentle -->
<title>the flock that loses one and finds it again</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      linear-gradient(to bottom,
        #121218 0%,
        #1a1720 22%,
        #251d24 45%,
        #2e2422 68%,
        #3a2e24 88%,
        #453828 100%);
  }
  canvas { display:block; position:absolute; top:0; left:0; }
  .id {
    position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
    letter-spacing:0.06em; color:#cdd2dc; z-index:10;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.65; }
  }
</style>
</head>
<body>
<div class="id">qsj</div>
<canvas id="bg"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── starfield + paper-grain on background canvas
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
function resizeBg(){
  bgCanvas.width = innerWidth;
  bgCanvas.height = innerHeight;
  drawBg();
}
function drawBg(){
  const w = bgCanvas.width, h = bgCanvas.height;
  bgCtx.clearRect(0,0,w,h);
  // starfield specks — sparse, warm-tinted
  const starCount = Math.floor(w * h / 1800);
  for (let i = 0; i < starCount; i++){
    const x = Math.random() * w;
    const y = Math.random() * h;
    const yRatio = y / h;
    // stars fade toward bottom (ground glow washes them out)
    const alpha = (1.0 - yRatio * 0.8) * (0.15 + Math.random() * 0.25);
    const size = Math.random() < 0.08 ? 1.4 : 0.7;
    // slight color variation: blue-white to warm
    const warmth = Math.random();
    const r = Math.round(180 + warmth * 60);
    const g = Math.round(175 + warmth * 40);
    const b = Math.round(190 + (1 - warmth) * 50);
    bgCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    bgCtx.beginPath();
    bgCtx.arc(x, y, size, 0, Math.PI * 2);
    bgCtx.fill();
  }
  // paper grain: very subtle noise overlay
  const imgData = bgCtx.getImageData(0, 0, w, h);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4){
    const noise = (Math.random() - 0.5) * 8;
    d[i]   += noise;
    d[i+1] += noise;
    d[i+2] += noise;
  }
  bgCtx.putImageData(imgData, 0, 0);
  // low ground horizon — warm glow band at ~85% height
  const grd = bgCtx.createLinearGradient(0, h * 0.75, 0, h);
  grd.addColorStop(0, 'rgba(60,42,28,0)');
  grd.addColorStop(0.5, 'rgba(55,38,24,0.12)');
  grd.addColorStop(1, 'rgba(50,34,20,0.18)');
  bgCtx.fillStyle = grd;
  bgCtx.fillRect(0, h * 0.75, w, h * 0.25);
}
resizeBg();

// ────────────── three.js scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x121218, 0.016);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';
renderer.domElement.style.zIndex = '1';
document.body.appendChild(renderer.domElement);

// ────────────── boids with embedded narrative
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r;
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3 + 1] = (Math.random() - 0.5) * 0.3;
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.4;
}
pos[STRAGGLER * 3]     = -1.2;
pos[STRAGGLER * 3 + 1] =  0.6;
pos[STRAGGLER * 3 + 2] =  0.0;

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.9;
const W_COH = 0.018;
const W_ALI = 0.060;
const W_SEP = 0.080;
const MAX_SPEED = 1.4;
const MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';

function step(dt){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3 + 1]; cz += pos[i*3 + 2];
  }
  cx /= (N - 1); cy /= (N - 1); cz /= (N - 1);

  const sx = pos[STRAGGLER*3] - cx;
  const sy = pos[STRAGGLER*3+1] - cy;
  const sz = pos[STRAGGLER*3+2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0.0, Math.min(1.0, 1.0 - stragDist / 8.0));
  cohesion += (targetCohesion - cohesion) * dt * 0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const isStrag = (i === STRAGGLER);
    const perceptionR = isStrag ? PERCEPTION_R * 0.55 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3] - px;
      const dy = pos[j*3+1] - py;
      const dz = pos[j*3+2] - pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > perceptionR * perceptionR || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R * SEPARATION_R){
        const inv = 1.0 / Math.sqrt(d2);
        sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
      }
    }

    if (isStrag){
      const drift = Math.sin(performance.now() * 0.0003) * 0.4;
      acc[i*3]   += drift;
      acc[i*3+1] += -0.25 + Math.cos(performance.now() * 0.0002) * 0.2;
      acc[i*3+2] += drift * 0.6;
    }

    if (!isStrag && (arcStage === 'seeking' || arcStage === 'return')){
      const tx = pos[STRAGGLER*3] - px;
      const ty = pos[STRAGGLER*3+1] - py;
      const tz = pos[STRAGGLER*3+2] - pz;
      const td = Math.sqrt(tx*tx + ty*ty + tz*tz) + 1e-3;
      const seek = arcStage === 'seeking' ? 0.020 : 0.012;
      acc[i*3]   += (tx / td) * seek;
      acc[i*3+1] += (ty / td) * seek;
      acc[i*3+2] += (tz / td) * seek;
    }

    if (cohN > 0){
      acc[i*3]   += (cohX/cohN - px) * W_COH;
      acc[i*3+1] += (cohY/cohN - py) * W_COH;
      acc[i*3+2] += (cohZ/cohN - pz) * W_COH;
    }
    if (aliN > 0){
      acc[i*3]   += (aliX/aliN - vel[i*3])   * W_ALI;
      acc[i*3+1] += (aliY/aliN - vel[i*3+1]) * W_ALI;
      acc[i*3+2] += (aliZ/aliN - vel[i*3+2]) * W_ALI;
    }
    acc[i*3]   += sepX * W_SEP;
    acc[i*3+1] += sepY * W_SEP;
    acc[i*3+2] += sepZ * W_SEP;

    const d2c = px*px + py*py + pz*pz;
    if (d2c > 90){
      const inv = 0.012 / Math.sqrt(d2c);
      acc[i*3]   += -px * inv;
      acc[i*3+1] += -py * inv;
      acc[i*3+2] += -pz * inv;
    }
  }

  const speedMul = (arcStage === 'loss' || arcStage === 'seeking') ? 0.55
                  : arcStage === 'return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++){
    let ax = acc[i*3], ay = acc[i*3+1], az = acc[i*3+2];
    const af = Math.sqrt(ax*ax + ay*ay + az*az);
    if (af > MAX_FORCE){ const s = MAX_FORCE/af; ax*=s; ay*=s; az*=s; }
    vel[i*3]   += ax; vel[i*3+1] += ay; vel[i*3+2] += az;
    let vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const sp = Math.sqrt(vx*vx + vy*vy + vz*vz);
    if (sp > MAX_SPEED){ const s = MAX_SPEED/sp; vel[i*3]*=s; vel[i*3+1]*=s; vel[i*3+2]*=s; }
    pos[i*3]   += vel[i*3]   * dt * speedMul;
    pos[i*3+1] += vel[i*3+1] * dt * speedMul;
    pos[i*3+2] += vel[i*3+2] * dt * speedMul;
  }
}

// ────────────── render
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStragArr = new Float32Array(N);
isStragArr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStragArr, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    varying vec3  vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.6 + 0.8 * sin(t);
      float stragSize = strag * 2.4;
      gl_PointSize = (baseSize + stragSize) * uPixel * (16.0 / dist);
      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);
      vec3 warm  = vec3(0.92, 0.62, 0.30);
      vec3 hot   = vec3(1.00, 0.90, 0.74);
      vec3 cool  = vec3(0.38, 0.50, 0.72);
      vec3 lost  = vec3(0.50, 0.30, 0.58);
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot, smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.18);
      vCol *= (1.0 + strag * 0.4);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vFade;
      gl_FragColor = vec4(vCol * a * 0.95, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  resizeBg();
});

// pre-warm
for (let s = 0; s < 250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = now / 1000;
  uniforms.uCohesion.value = cohesion;
  step(dt);
  geom.attributes.position.needsUpdate = true;

  const ang = now * 0.00010;
  camera.position.x = Math.sin(ang) * 26;
  camera.position.z = Math.cos(ang) * 26;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
