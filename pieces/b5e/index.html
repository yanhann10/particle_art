<div class="src">Marc Da Costa & Matthew Niederhauser · 'Parallels'</div>
<script type="importmap">

    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 45);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// LED amber on black — Lumen Prize installation palette
const AMBER = new THREE.Color(0xff9933);
const DIM_AMBER = new THREE.Color(0x663300);

// Parallel rail system — 60 vertical rails, each containing particles
const RAIL_COUNT = 60;
const RAIL_SPACING = 1.2;
const RAIL_HEIGHT = 50;
const PARTICLES_PER_RAIL = 80;
const TOTAL_PARTICLES = RAIL_COUNT * PARTICLES_PER_RAIL;

const positions = new Float32Array(TOTAL_PARTICLES * 3);
const velocities = new Float32Array(TOTAL_PARTICLES);
const railIndices = new Float32Array(TOTAL_PARTICLES);
const seeds = new Float32Array(TOTAL_PARTICLES);

// Initialize particles on vertical parallel rails
for (let r = 0; r < RAIL_COUNT; r++){
  const railX = (r - RAIL_COUNT / 2) * RAIL_SPACING;
  for (let p = 0; p < PARTICLES_PER_RAIL; p++){
    const idx = r * PARTICLES_PER_RAIL + p;
    positions[idx * 3] = railX;
    positions[idx * 3 + 1] = (Math.random() - 0.5) * RAIL_HEIGHT;
    positions[idx * 3 + 2] = 0;
    velocities[idx] = 0.8 + Math.random() * 0.4;
    railIndices[idx] = r;
    seeds[idx] = Math.random();
  }
}

// Rail displacement state — viewer presence warps rails into figure silhouettes
const railDisplacements = new Float32Array(RAIL_COUNT);
const railTargetDisplacements = new Float32Array(RAIL_COUNT);
const railVelocities = new Float32Array(RAIL_COUNT);

for (let i = 0; i < RAIL_COUNT; i++){
  railDisplacements[i] = 0;
  railTargetDisplacements[i] = 0;
  railVelocities[i] = 0;
}

// Mouse tracking for presence field
let mouseX = 0;
let mouseY = 0;
let mousePresence = 0; // 0 to 1, decays when mouse stops

addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = -(e.clientY / innerHeight) * 2 + 1;
  mousePresence = 1.0;
});

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float railIndex;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // Subtle pulse per particle
      float phase = seed * 6.28 + uTime * 0.4;
      float pulse = 0.4 + 0.6 * (0.5 + 0.5 * sin(phase));
      
      // LED amber gradient — brighter particles toward center of each rail cluster
      float railNorm = railIndex / 60.0;
      float centerDist = abs(railNorm - 0.5) * 2.0;
      vec3 amber = vec3(1.0, 0.6, 0.2);
      vec3 dimAmber = vec3(0.4, 0.19, 0.0);
      vCol = mix(amber, dimAmber, centerDist * 0.6);
      
      vAlpha = 0.3 + 0.5 * pulse;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (2.2 + 1.8 * pulse) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('railIndex', new THREE.BufferAttribute(railIndices, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Connection lines between nearby particles on adjacent rails
const linePositions = [];
const lineColors = [];
const maxConnections = 1200;

for (let i = 0; i < maxConnections; i++){
  linePositions.push(0, 0, 0, 0, 0, 0);
  lineColors.push(1, 0.6, 0.2, 1, 0.6, 0.2);
}

const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
lineGeom.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending
});

const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Update rail warping based on mouse presence — figure-shaped displacement
function updateRailWarping(dt){
  // Decay mouse presence
  mousePresence *= 0.96;
  
  // Convert mouse to world space approximate
  const mouseWorldX = mouseX * 35;
  const mouseWorldY = mouseY * 25;
  
  // Compute target displacements — rails near mouse warp toward viewer (positive Z)
  // Creating a silhouette effect where the figure emerges from parallel structure
  for (let r = 0; r < RAIL_COUNT; r++){
    const railX = (r - RAIL_COUNT / 2) * RAIL_SPACING;
    const dx = railX - mouseWorldX;
    const dy = 0 - mouseWorldY; // vertical center
    const distSq = dx * dx + dy * dy;
    const dist = Math.sqrt(distSq);
    
    // Gaussian falloff centered on mouse position
    const influence = Math.exp(-distSq / 150) * mousePresence;
    
    // Target displacement: warp forward (positive Z) with horizontal sway
    const warpZ = influence * 8.0;
    const warpX = influence * dx * 0.15;
    
    railTargetDisplacements[r] = warpZ;
    
    // Spring physics toward target
    const springForce = (railTargetDisplacements[r] - railDisplacements[r]) * 0.08;
    const damping = railVelocities[r] * 0.85;
    railVelocities[r] += springForce - damping;
    railDisplacements[r] += railVelocities[r] * dt;
    
    // Apply horizontal sway as side-effect
    const railCenterY = 0;
    for (let p = 0; p < PARTICLES_PER_RAIL; p++){
      const idx = r * PARTICLES_PER_RAIL + p;
      const py = positions[idx * 3 + 1];
      const yInfluence = Math.exp(-Math.pow((py - mouseWorldY) / 8, 2));
      positions[idx * 3] = railX + warpX * yInfluence;
      positions[idx * 3 + 2] = railDisplacements[r] * yInfluence;
    }
  }
}

// Drift particles along rails
function updateParticleDrift(dt){
  for (let i = 0; i < TOTAL_PARTICLES; i++){
    // Drift upward along rail
    positions[i * 3 + 1] += velocities[i] * dt * 0.6;
    
    // Wrap at top
    if (positions[i * 3 + 1] > RAIL_HEIGHT / 2){
      positions[i * 3 + 1] -= RAIL_HEIGHT;
    }
  }
  
  geom.attributes.position.needsUpdate = true;
}

// Rebuild connections between adjacent rail particles
function updateConnections(){
  const posAttr = lineGeom.attributes.position;
  const colAttr = lineGeom.attributes.color;
  let connectionCount = 0;
  
  const CONNECTION_THRESHOLD = 3.5;
  
  for (let r = 0; r < RAIL_COUNT - 1 && connectionCount < maxConnections; r++){
    for (let p = 0; p < PARTICLES_PER_RAIL && connectionCount < maxConnections; p++){
      const idx1 = r * PARTICLES_PER_RAIL + p;
      
      // Check a few particles on adjacent rail
      for (let pp = Math.max(0, p - 4); pp < Math.min(PARTICLES_PER_RAIL, p + 4) && connectionCount < maxConnections; pp++){
        const idx2 = (r + 1) * PARTICLES_PER_RAIL + pp;
        
        const dx = positions[idx2 * 3] - positions[idx1 * 3];
        const dy = positions[idx2 * 3 + 1] - positions[idx1 * 3 + 1];
        const dz = positions[idx2 * 3 + 2] - positions[idx1 * 3 + 2];
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        
        if (dist < CONNECTION_THRESHOLD){
          const baseIdx = connectionCount * 6;
          posAttr.array[baseIdx] = positions[idx1 * 3];
          posAttr.array[baseIdx + 1] = positions[idx1 * 3 + 1];
          posAttr.array[baseIdx + 2] = positions[idx1 * 3 + 2];
          posAttr.array[baseIdx + 3] = positions[idx2 * 3];
          posAttr.array[baseIdx + 4] = positions[idx2 * 3 + 1];
          posAttr.array[baseIdx + 5] = positions[idx2 * 3 + 2];
          
          // Fade color based on distance
          const fade = 1.0 - (dist / CONNECTION_THRESHOLD);
          const colorIdx = connectionCount * 6;
          colAttr.array[colorIdx] = 1.0 * fade;
          colAttr.array[colorIdx + 1] = 0.6 * fade;
          colAttr.array[colorIdx + 2] = 0.2 * fade;
          colAttr.array[colorIdx + 3] = 1.0 * fade;
          colAttr.array[colorIdx + 4] = 0.6 * fade;
          colAttr.array[colorIdx + 5] = 0.2 * fade;
          
          connectionCount++;
        }
      }
    }
  }
  
  // Hide unused connections
  for (let i = connectionCount; i < maxConnections; i++){
    const baseIdx = i * 6;
    posAttr.array[baseIdx] = 0;
    posAttr.array[baseIdx + 1] = 0;
    posAttr.array[baseIdx + 2] = 0;
    posAttr.array[baseIdx + 3] = 0;
    posAttr.array[baseIdx + 4] = 0;
    posAttr.array[baseIdx + 5] = 0;
  }
  
  posAttr.needsUpdate = true;
  colAttr.needsUpdate = true;
}

// Slow camera orbit
function updateCamera(t){
  const orbitRadius = 45;
  const orbitSpeed = 0.05;
  const angle = t * orbitSpeed;
  camera.position.x = Math.cos(angle) * orbitRadius * 0.3;
  camera.position.y = Math.sin(angle * 0.7) * 8;
  camera.position.z = 45 + Math.sin(angle * 0.4) * 5;
  camera.lookAt(0, 0, 0);
}

let lastTime = performance.now();
const start = performance.now();
let frameCount = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;
  
  uniforms.uTime.value = t;
  
  updateRailWarping(dt * 60);
  updateParticleDrift(dt * 60);
  
  frameCount++;
  if (frameCount % 3 === 0){
    updateConnections();
  }
  
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
