<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aw6 · Shiota — The Key in the Hand</title>
<!-- MOTION: gather, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">aw6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0018);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080101, 0.003));
const warmL = new THREE.PointLight(0xff3810, 0.015, 35, 2.0);
warmL.position.set(-0.5, 7.0, 0.8);
scene.add(warmL);

let seed = 4829173;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:26, h:20, d:22 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── BOAT HULL — Uncertain Journey (2016), Blain|Southern Berlin:
// skeletal boat hulls beneath 750,000 meters of red yarn. The vessel
// is passage, memory, the body that carries you between lives.
// Two boats: the ones you leave and the ones that carry you forward.
const boatCenter = new THREE.Vector3(0.0, -0.3, 0.0);

// Hull form — a stretched ellipsoid, the ghost of a vessel
const boatMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1.0, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xddd4be, emissive: 0xddd4be, emissiveIntensity: 0.65,
    roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.25, fog: true
  })
);
boatMesh.scale.set(3.2, 0.9, 1.3);
boatMesh.position.copy(boatCenter);
boatMesh.rotation.z = 0.04;
scene.add(boatMesh);

// Boat ribs — wireframe skeleton suggesting naval architecture
const ribPts = [];
for(let r=0; r<9; r++){
  const rx = -2.6 + (r/8)*5.2;
  const ribW = 1.2 * Math.sin(((r+0.5)/9)*Math.PI);
  const ribH = 0.8 * Math.sin(((r+0.5)/9)*Math.PI);
  const segs = 8;
  for(let s=0; s<segs; s++){
    const a0 = -Math.PI*0.5 + (s/segs)*Math.PI;
    const a1 = -Math.PI*0.5 + ((s+1)/segs)*Math.PI;
    ribPts.push(
      boatCenter.x+rx, boatCenter.y+Math.sin(a0)*ribH, boatCenter.z+Math.cos(a0)*ribW,
      boatCenter.x+rx, boatCenter.y+Math.sin(a1)*ribH, boatCenter.z+Math.cos(a1)*ribW
    );
  }
}
// Keel line
ribPts.push(boatCenter.x-3.2, boatCenter.y-0.1, boatCenter.z, boatCenter.x+3.2, boatCenter.y-0.1, boatCenter.z);
// Gunwale lines
for(let side=-1; side<=1; side+=2){
  for(let s=0; s<12; s++){
    const t0=s/12, t1=(s+1)/12;
    const x0=-3.0+t0*6.0, x1=-3.0+t1*6.0;
    const w0=1.2*Math.sin(t0*Math.PI)*0.95, w1=1.2*Math.sin(t1*Math.PI)*0.95;
    ribPts.push(
      boatCenter.x+x0, boatCenter.y+0.15, boatCenter.z+side*w0,
      boatCenter.x+x1, boatCenter.y+0.15, boatCenter.z+side*w1
    );
  }
}
const ribGeo = new THREE.BufferGeometry();
ribGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(ribPts),3));
scene.add(new THREE.LineSegments(ribGeo, new THREE.LineBasicMaterial({
  color:0x1a0a06, transparent:true, opacity:0.35
})));

function hullSurfPt(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  return new THREE.Vector3(
    boatCenter.x+Math.sin(v)*Math.cos(u)*3.2*(0.96+rng()*0.08),
    boatCenter.y+Math.sin(v)*Math.sin(u)*0.9*(0.96+rng()*0.08),
    boatCenter.z+Math.cos(v)*1.3*(0.96+rng()*0.08)
  );
}

// ── DARK FRAGMENTS — 18 small shapes: charred paper, memories burnt
// In Silence (2002): a burned piano and burned chairs. These fragments
// are the residue of what fire took.
const fragments = [];
for(let i=0; i<18; i++){
  const pts = [];
  const ks = 0.06+rng()*0.12;
  if(rng()<0.5){
    // Irregular quadrilateral — charred paper
    const dx=ks*(0.5+rng()*0.5), dy=ks*(0.6+rng()*0.4);
    pts.push(-dx,-dy,0, dx,-dy*0.8,0);
    pts.push(dx,-dy*0.8,0, dx*0.7,dy,0);
    pts.push(dx*0.7,dy,0, -dx*0.9,dy*0.6,0);
    pts.push(-dx*0.9,dy*0.6,0, -dx,-dy,0);
  } else {
    // Small cross/key — memory of a lock
    pts.push(-ks,0,0, ks,0,0);
    pts.push(0,-ks*1.4,0, 0,ks*0.5,0);
    if(rng()>0.4) pts.push(-ks*0.35,-ks*1.2,0, -ks*0.35,-ks*1.4,0);
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0503, transparent:true, opacity:0.38
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=3.0+rng()*7.0;
  fMesh.position.set(
    boatCenter.x+Math.sin(v)*Math.cos(u)*r*1.1,
    boatCenter.y+Math.sin(v)*Math.sin(u)*r*0.7,
    boatCenter.z+Math.cos(v)*r*0.9
  );
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID CHANNELS — deliberate negative space to look through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.9;
  const vr=4.5+rng()*4.0;
  voids.push({
    x:boatCenter.x+Math.cos(a)*vr,
    z:boatCenter.z+Math.sin(a)*vr,
    r:1.0+rng()*0.9
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ANCHOR TOPOLOGY — truncated icosahedron shells + wall points
// Manfred Mohr: geometry generates the connection topology
const icoGeo = new THREE.IcosahedronGeometry(1, 2);
const icoPos = icoGeo.attributes.position;
const icoNormals = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNormals.push(v); }
}

const anchors = [];
const shellRadii = [2.8, 4.8, 7.2, 10.0, 12.5];
for(const sr of shellRadii){
  for(const n of icoNormals){
    const pt = new THREE.Vector3(
      boatCenter.x + n.x*sr*1.15,
      boatCenter.y + n.y*sr*0.78,
      boatCenter.z + n.z*sr*0.95
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw-0.3 && Math.abs(pt.y)<hh-0.3 && Math.abs(pt.z)<hd-0.3){
      anchors.push(pt);
    }
  }
}
for(let i=0; i<60; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── BUILD THREAD NETWORK — 20,000 segments max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-boatCenter.x)**2+(my-boatCenter.y)**2+(mz-boatCenter.z)**2);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION — taut threads from ceiling to hull top
// Saraceno: the physics of hanging must be visible
for(let i=0; i<12; i++){
  const t=i/12;
  const bx = boatCenter.x + (-2.8+t*5.6);
  const bw = 1.1*Math.sin(t*Math.PI);
  for(let side=-1; side<=1; side+=2){
    const topX = bx + (rng()-0.5)*0.6;
    const topZ = boatCenter.z + side*bw*2.5 + (rng()-0.5)*0.4;
    setLine(
      new THREE.Vector3(topX, hh, topZ),
      new THREE.Vector3(bx, boatCenter.y+0.85, boatCenter.z+side*bw*0.3),
      0
    );
  }
}

// ── RULE 1: CONVERGENCE — all threads lean toward the vessel
// The room gathers around the remembered form — a boat that carried
// someone between two home countries
for(let i=0; i<anchors.length && li<NUM_LINES; i++){
  const a = anchors[i];
  const dx=a.x-boatCenter.x, dy=a.y-boatCenter.y, dz=a.z-boatCenter.z;
  const d = Math.sqrt(dx*dx+dy*dy*1.5+dz*dz);
  const count = d<3.5?4 : d<6?3 : d<9?2 : 1;
  for(let j=0; j<count && li<NUM_LINES; j++){
    const target = hullSurfPt();
    // 12% yearning threads — reaching but not arriving
    if(rng()<0.12){
      const dir = a.clone().sub(target).normalize();
      const gap = 0.15+rng()*1.0;
      setLine(a, target.clone().add(dir.multiplyScalar(gap)), 1);
    } else {
      setLine(a, target, 0);
    }
  }
}

// ── RULE 2: PROXIMITY — anchor-to-anchor within threshold
// The web thickens where connections are short — tissue of relation
const THRESH = 5.0;
let lat=0, att=0;
while(lat<5500 && li<NUM_LINES && att<45000){
  att++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<14; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  lat++;
}

// ── DENDRITIC BRANCHING — short chains forking near inner anchors
// Entangled Others: the web is not just point-to-point, it grows
for(let i=0; i<180 && li<NUM_LINES-10; i++){
  const ai=Math.floor(rng()*anchors.length);
  const root=anchors[ai];
  if(root.distanceTo(boatCenter)>9) continue;
  let cur=root.clone();
  const baseDir=boatCenter.clone().sub(cur).normalize();
  for(let gen=0; gen<3 && li<NUM_LINES; gen++){
    const len=0.6+rng()*1.2;
    const jitter=new THREE.Vector3((rng()-0.5)*0.7,(rng()-0.5)*0.5,(rng()-0.5)*0.7);
    const dir=baseDir.clone().add(jitter).normalize();
    const next=cur.clone().add(dir.multiplyScalar(len));
    setLine(cur, next, 3);
    cur=next;
    if(gen===1 && rng()<0.4){
      // Fork
      const forkDir=baseDir.clone().add(new THREE.Vector3((rng()-0.5),(rng()-0.5)*0.4,(rng()-0.5))).normalize();
      const forkEnd=cur.clone().add(forkDir.multiplyScalar(0.5+rng()*0.8));
      setLine(cur, forkEnd, 3);
    }
  }
}

// ── GRAVITY DRAPE — threads drooping from hull underside
// Weight made visible, the pull of what's below
for(let i=0; i<1000 && li<NUM_LINES; i++){
  const t=rng();
  const bx = boatCenter.x + (-2.8+t*5.6);
  const bw = 1.1*Math.sin(t*Math.PI);
  const u=rng()*Math.PI*2;
  const sp = new THREE.Vector3(
    bx + Math.cos(u)*bw*0.3,
    boatCenter.y - 0.7 - rng()*0.3,
    boatCenter.z + Math.sin(u)*bw*0.4
  );
  const dropLen=0.8+rng()*4.0;
  const drift=(rng()-0.5)*0.5;
  setLine(sp, new THREE.Vector3(sp.x+drift, sp.y-dropLen, sp.z+(rng()-0.5)*0.3), 3);
}

// ── FILL — remaining budget: long wall-to-hull spans
while(li<NUM_LINES){
  const a=wallPt();
  const b=rng()<0.35 ? hullSurfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — arterial red #c20018, opacity by category
// Lia Halloran: depth through material differentiation
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.09, 0.06, 0.04, 0.035];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.1, 1.0-d*0.03);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  const warmShift = d<4.0 ? 0.02*(1.0-d/4.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.45;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — a crossing: you board the web from one shore,
// pass beneath the hull, rise through the rigging, look back
// from the far shore. Two Home Countries: the departure and the arrival.
const pathLen = 3200;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=boatCenter.x, cy=boatCenter.y, cz=boatCenter.z;
  let x, y, z;

  if(t<0.08){
    // Shore 1 — distant, the web is a dark cathedral ahead
    const lt=t/0.08;
    x = cx-10.0+lt*2.0;
    y = cy+1.5+lt*0.5;
    z = cz+5.0-lt*1.0;
  } else if(t<0.20){
    // Wade in — threads close around you from the sides
    const lt=(t-0.08)/0.12;
    x = cx-8.0+lt*4.5;
    y = cy+2.0-lt*0.8;
    z = cz+4.0-lt*2.5;
  } else if(t<0.34){
    // Alongside the hull — seeing the ribs, the convergence zone
    const lt=(t-0.20)/0.14;
    const rH=3.5+Math.sin(lt*Math.PI)*0.8;
    const angle=lt*Math.PI*0.6-0.3;
    x = cx+Math.cos(angle)*rH;
    y = cy+1.2-lt*1.8;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.46){
    // Beneath — looking up through the drape at the hull's belly
    const lt=(t-0.34)/0.12;
    x = cx+Math.sin(lt*Math.PI*0.5+0.8)*3.2;
    y = cy-5.5+lt*1.0;
    z = cz+Math.cos(lt*Math.PI*0.5+0.8)*2.8;
  } else if(t<0.58){
    // Crossing under — the keel line above, gravity threads around you
    const lt=(t-0.46)/0.12;
    x = cx-2.5+lt*5.0;
    y = cy-4.5+lt*2.0;
    z = cz+Math.sin(lt*Math.PI)*1.5;
  } else if(t<0.72){
    // Rising — ascending through the web's body toward the light
    const lt=(t-0.58)/0.14;
    const rH=2.5+lt*2.0;
    const angle=lt*Math.PI*0.8+2.0;
    x = cx+Math.cos(angle)*rH;
    y = cy-2.5+lt*8.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.84){
    // Above — the hull below is a seed in a nest of thread
    const lt=(t-0.72)/0.12;
    x = cx+Math.sin(lt*Math.PI*0.5+3.0)*4.0;
    y = cy+6.0-lt*1.5;
    z = cz+Math.cos(lt*Math.PI*0.5+3.0)*3.5;
  } else {
    // Shore 2 — receding, the web and hull dissolving into distance
    const lt=(t-0.84)/0.16;
    x = cx+8.0+lt*3.5;
    y = cy+2.0+lt*1.0;
    z = cz-3.0-lt*3.0;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, nearly imperceptible
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.035+i*0.0001;
    const breath = Math.sin(elapsed*0.001+phase)*0.00002;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.06;
      arr[vi+1] = basePositions[vi+1] + breath*0.04;
      arr[vi+2] = basePositions[vi+2] + breath*0.05;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Hull glow — slow pulse, a heartbeat in the dark
  boatMesh.material.emissiveIntensity = 0.65+Math.sin(elapsed*0.0004)*0.05;

  // Camera dolly
  const speed = 0.00004;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = boatCenter.clone();
  look.x += Math.sin(elapsed*0.00015)*0.08;
  look.y += Math.cos(elapsed*0.0002)*0.06;
  look.z += Math.sin(elapsed*0.0003+0.7)*0.05;
  camera.lookAt(look);

  warmL.intensity = 0.015+Math.sin(elapsed*0.0001)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
