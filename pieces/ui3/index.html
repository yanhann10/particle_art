<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamboa Naon — geometric textile</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a12; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">ui3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Palette: 5 flat colors — Naon-inspired editorial
const PALETTE = [
  new THREE.Color(0xe63946), // coral red
  new THREE.Color(0xf1faee), // off-white
  new THREE.Color(0x1d3557), // deep navy
  new THREE.Color(0xe9c46a), // gold
  new THREE.Color(0x2a9d8f), // teal
];

// Deterministic RNG
let rngState = 55781234;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// Geometry primitives
function makeTriangleGeo(size){
  const s = size;
  const shape = new THREE.Shape();
  shape.moveTo(0, s);
  shape.lineTo(-s * 0.866, -s * 0.5);
  shape.lineTo(s * 0.866, -s * 0.5);
  shape.closePath();
  return new THREE.ShapeGeometry(shape);
}

function makeRingGeo(inner, outer, segs){
  return new THREE.RingGeometry(inner, outer, segs || 32);
}

function makeHexGeo(size){
  const shape = new THREE.Shape();
  for(let i = 0; i < 6; i++){
    const a = (Math.PI / 3) * i - Math.PI / 6;
    const x = Math.cos(a) * size;
    const y = Math.sin(a) * size;
    if(i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  return new THREE.ShapeGeometry(shape);
}

function makeHalfCircleGeo(r){
  const shape = new THREE.Shape();
  shape.absarc(0, 0, r, 0, Math.PI, false);
  shape.lineTo(-r, 0);
  return new THREE.ShapeGeometry(shape);
}

// Grid layout — structured placement with intentional clusters
const elements = [];
const GRID_COLS = 14;
const GRID_ROWS = 10;
const CELL_W = 2.8;
const CELL_H = 2.8;
const OFFSET_X = -(GRID_COLS - 1) * CELL_W * 0.5;
const OFFSET_Y = -(GRID_ROWS - 1) * CELL_H * 0.5;

// Define 3 density clusters (Naon: intentional grouping)
const clusters = [
  { cx: -8, cy: 4, r: 9, density: 0.92 },
  { cx: 6, cy: -3, r: 7, density: 0.88 },
  { cx: -2, cy: -6, r: 6, density: 0.80 },
];

function inCluster(x, y){
  for(const c of clusters){
    const d = Math.sqrt((x - c.cx)**2 + (y - c.cy)**2);
    if(d < c.r) return c.density;
  }
  return 0.15; // sparse outside clusters — negative space
}

// Build composition
const group = new THREE.Group();
scene.add(group);

for(let row = 0; row < GRID_ROWS; row++){
  for(let col = 0; col < GRID_COLS; col++){
    const x = OFFSET_X + col * CELL_W;
    const y = OFFSET_Y + row * CELL_H;

    const density = inCluster(x, y);
    if(rng() > density) continue;

    // Displacement from grid (Vera Molnár-style order→chaos)
    const dx = (rng() - 0.5) * CELL_W * 0.4;
    const dy = (rng() - 0.5) * CELL_H * 0.4;

    const px = x + dx;
    const py = y + dy;

    // Pick primitive type deterministically based on position
    const typeIdx = Math.floor(rng() * 5);
    const size = 0.4 + rng() * 0.9;
    const colorIdx = Math.floor(rng() * PALETTE.length);
    const color = PALETTE[colorIdx];

    let geo;
    switch(typeIdx){
      case 0: geo = makeTriangleGeo(size); break;
      case 1: geo = makeRingGeo(size * 0.4, size * 0.7, 32); break;
      case 2: geo = makeHexGeo(size * 0.7); break;
      case 3: geo = makeHalfCircleGeo(size * 0.6); break;
      case 4: // line/rectangle
        geo = new THREE.PlaneGeometry(size * 1.8, size * 0.12);
        break;
    }

    const mat = new THREE.MeshBasicMaterial({
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85 + rng() * 0.15
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(px, py, (rng() - 0.5) * 2);

    // Quantized rotation: 0, 30, 60, 90, 120... (no arbitrary angles)
    const rotSteps = Math.floor(rng() * 12);
    mesh.rotation.z = rotSteps * (Math.PI / 6);

    elements.push({
      mesh,
      basePos: new THREE.Vector3(px, py, mesh.position.z),
      baseRot: mesh.rotation.z,
      phaseX: col * 0.3 + row * 0.7,
      phaseY: row * 0.4 + col * 0.2,
      phaseR: (col + row) * 0.15,
      scaleBase: 1.0,
      type: typeIdx
    });

    group.add(mesh);
  }
}

// Add structural line network connecting nearby elements (geometric web)
const linePositions = [];
const lineColors = [];
const lineColor = new THREE.Color(0xf1faee);

for(let i = 0; i < elements.length; i++){
  const a = elements[i];
  let connections = 0;
  for(let j = i + 1; j < elements.length && connections < 2; j++){
    const b = elements[j];
    const d = a.basePos.distanceTo(b.basePos);
    if(d < 4.5 && d > 1.5 && rng() < 0.3){
      linePositions.push(a.basePos.x, a.basePos.y, a.basePos.z - 0.5);
      linePositions.push(b.basePos.x, b.basePos.y, b.basePos.z - 0.5);
      lineColors.push(0.94, 0.98, 0.93, 0.94, 0.98, 0.93);
      connections++;
    }
  }
}

if(linePositions.length > 0){
  const lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  lGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
  const lMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  });
  const lines = new THREE.LineSegments(lGeo, lMat);
  group.add(lines);
}

// Large background geometric anchors — compositional hierarchy
const bgShapes = [];
for(let i = 0; i < 5; i++){
  const size = 3 + rng() * 4;
  const geo = i % 2 === 0
    ? makeRingGeo(size * 0.6, size * 0.75, 6)
    : makeTriangleGeo(size);
  const ci = Math.floor(rng() * PALETTE.length);
  const mat = new THREE.MeshBasicMaterial({
    color: PALETTE[ci],
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.08 + rng() * 0.07
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(
    (rng() - 0.5) * 24,
    (rng() - 0.5) * 18,
    -4 - rng() * 3
  );
  mesh.rotation.z = Math.floor(rng() * 6) * (Math.PI / 3);
  group.add(mesh);
  bgShapes.push({ mesh, phase: rng() * Math.PI * 2 });
}

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate — deterministic structured motion, no noise
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;

  // Elements: structured pulse — scale and translate on integer-ratio sine waves
  for(const el of elements){
    const sx = Math.sin(t * 0.4 + el.phaseX) * 0.15;
    const sy = Math.sin(t * 0.3 + el.phaseY) * 0.12;

    el.mesh.position.x = el.basePos.x + sx;
    el.mesh.position.y = el.basePos.y + sy;

    // Scale pulse: gentle breathing per element type
    const sPulse = 1.0 + Math.sin(t * 0.5 + el.phaseR) * 0.08;
    el.mesh.scale.setScalar(sPulse);

    // Rotation: only lines and triangles rotate, and only in 30° snaps over time
    if(el.type === 0 || el.type === 4){
      const step = Math.floor((t * 0.1 + el.phaseR) * 2) / 2;
      el.mesh.rotation.z = el.baseRot + step * (Math.PI / 6);
    }
  }

  // Background shapes: slow drift
  for(const bg of bgShapes){
    bg.mesh.rotation.z += 0.0003;
    const p = Math.sin(t * 0.15 + bg.phase) * 0.5;
    bg.mesh.position.x += Math.sin(t * 0.02 + bg.phase) * 0.002;
  }

  // Camera: very slow structured lateral drift
  camera.position.x = Math.sin(t * 0.04) * 2.5;
  camera.position.y = Math.cos(t * 0.03) * 1.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
