<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2t · vessel filament (sf0 × 4d9)</title>
<!-- MOTION: drift, intensity: hypnotic -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#c9a86a; opacity:.55; font-size:11px; letter-spacing:.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">v2t</div>
<canvas id="c"></canvas>

<script>
// ── SDF RAYMARCHER — WebGL2 / GLSL ES 3.00 ────────────────────────────────
// Vessel-in-a-tunnel: sf0 × 4d9 hybrid
// Hard-surface + glow accumulation for sharpness gate > 150.
// Vessel diamond lattice on tunnel walls, staircase helices, cyan counter-helix.
// Palette: gold #c9a86a + cyan #28e0ff + copper #c97a30.
const cv = document.getElementById('c');
const gl  = cv.getContext('webgl2');
if (!gl) {
  document.body.style.cssText='display:flex;align-items:center;justify-content:center;height:100vh';
  document.body.innerHTML='<p style="color:#c9a86a;font-family:monospace">WebGL2 required</p>';
  throw 0;
}

const VS = `#version 300 es
in vec2 a;
void main() { gl_Position = vec4(a, 0., 1.); }`;

const FS = `#version 300 es
precision highp float;
uniform float iTime;
uniform vec2  iRes;
out vec4 fragColor;

// Camera tunnel path
vec3 path(float z) {
  return vec3(
    sin(z*.013)*24. + sin(z*.007)*52.,
    cos(z*.009)*18. + cos(z*.006)*36.,
    z
  );
}
mat2 rot2(float a) { float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }

// ── Primitive SDFs ────────────────────────────────────────────────────────
// All in tunnel-relative space: p.xy -= path(p.z).xy

// Staircase helix SDF
float helixA(vec3 lp) {
  float ss  = floor(lp.z * 0.12) / 4.0;
  float phi = lp.z * 0.034 + ss * 0.8;
  return length(lp.xy - vec2(cos(phi), sin(phi)) * 12.) - .75;
}
float helixB(vec3 lp) {
  float ss  = floor(lp.z * 0.12) / 4.0;
  float phi = -lp.z * 0.034 + ss * 0.8;
  return length(lp.xy - vec2(cos(phi), sin(phi)) * 12.) - .75;
}
float helixC(vec3 lp) {
  float phi = -lp.z * .022 + .8;
  return length(lp.xy - vec2(cos(phi), sin(phi)) * 7.5) - .4;
}
float tunnel(vec3 lp) {
  float r   = length(lp.xy);
  float rib = cos(lp.z*.18)*2. + cos(lp.z*.09)*3.;
  float col = cos(atan(lp.y, lp.x)*12.)*.55;
  // Solid tunnel — no lattice windows in SDF (windows are purely visual in material)
  return (24. + rib*.4 + col*.3) - r;
}

// Full scene SDF: returns (dist, matId)
//   matId: 1=helixA(gold), 2=helixB(gold), 3=helixC(cyan), 4=tunnel(copper)
vec2 scene(vec3 p) {
  vec3 q  = path(p.z);
  vec3 lp = vec3(p.xy - q.xy, p.z);

  float dA = helixA(lp);
  float dB = helixB(lp);
  float dC = helixC(lp);
  float dT = tunnel(lp);

  float d = min(min(dA, dB), min(dC, dT));
  float m = (d == dA) ? 1.0 : (d == dB) ? 2.0 : (d == dC) ? 3.0 : 4.0;
  return vec2(d, m);
}

float sceneDist(vec3 p) { return scene(p).x; }

// Central-difference normal
vec3 calcNormal(vec3 p) {
  const float e = 0.003;
  return normalize(vec3(
    sceneDist(p+vec3(e,0,0)) - sceneDist(p-vec3(e,0,0)),
    sceneDist(p+vec3(0,e,0)) - sceneDist(p-vec3(0,e,0)),
    sceneDist(p+vec3(0,0,e)) - sceneDist(p-vec3(0,0,e))
  ));
}

// Material base colour
vec3 matBase(float m, vec3 p) {
  if (m < 1.5) return vec3(1.0, 0.78, 0.28);   // gold helix A — bright
  if (m < 2.5) return vec3(1.0, 0.72, 0.22);   // gold helix B — bright
  if (m < 3.5) return vec3(0.22, 1.00, 1.00);  // cyan helix C — bright
  // Tunnel wall: high-contrast lattice (bright bars, very dark gaps)
  vec3 q  = path(p.z);
  vec3 lp = vec3(p.xy - q.xy, p.z);
  float th  = atan(lp.y, lp.x);
  // Match grid from tunnel SDF
  float hz  = mod(lp.z * 0.12, 1.0);
  float ht  = mod(th * 3.0 + hz, 1.0);
  float lat = min(min(hz, 1.0-hz), min(ht, 1.0-ht));
  // Very sharp step: thin bars, near-zero transition width = crisp edges
  float b   = 1.0 - smoothstep(0.010, 0.032, lat);
  // Bright bar: near-white gold; gap: near-black for maximum contrast
  return mix(vec3(0.01, 0.005, 0.001), vec3(1.0, 0.70, 0.25) * (1.0 + b * 0.3), b);
}

void main() {
  vec2 u = (gl_FragCoord.xy - iRes*.5) / iRes.y;

  float T = iTime*85. + 200.;
  vec3 ro  = path(T);
  vec3 Z   = normalize(path(T+9.) - ro);
  vec3 X   = normalize(vec3(Z.z, 0., -Z.x));
  vec2 ru  = rot2(sin(T*.0032)*.28) * u;
  vec3 D   = normalize(vec3(rot2(sin(T*.0045)*.22)*ru, 1.) * mat3(-X, cross(X,Z), Z));

  // ── PASS 1: Glow accumulation (atmosphere) ─────────────────────────────
  vec4 glowAcc = vec4(0.);
  float da = 0.;
  for (float i = 0.; i < 80.; i++) {
    vec3 p  = ro + D*da;
    vec3 q  = path(p.z);
    vec3 lp = vec3(p.xy - q.xy, p.z);
    float gA = helixA(lp);
    float gB = helixB(lp);
    float gC = helixC(lp);
    // Gold helix glow
    glowAcc += vec4(6., 3.5, .15, 0.) / (.04 + gA*gA*.5);
    glowAcc += vec4(6., 3.5, .15, 0.) / (.04 + gB*gB*.5);
    // Cyan helix glow
    glowAcc += vec4(.1, 2.8, 7., 0.)  / (.03 + gC*gC*.4);
    // Tunnel wall copper haze
    float dT2 = tunnel(lp);
    glowAcc += vec4(.5,.28,.03,0.) / (.8 + dT2*dT2*.04) * .10;
    // Step
    vec2 sc = scene(p);
    da += sc.x * .85;
    if (da > 200.) break;
  }
  // Tone-map glow
  glowAcc = glowAcc / (glowAcc + 5e4);
  glowAcc.r *= 1.10; glowAcc.b *= .82;

  // ── PASS 2: Hard-surface raymarching (for sharpness / Laplacian variance)
  float db = 0.;
  bool  hit  = false;
  float hitM = 0.;
  vec3  hitP = ro;

  for (int i = 0; i < 256; i++) {
    vec3 p = ro + D*db;
    vec2 sc = scene(p);
    if (sc.x < 0.004) {
      hit  = true;
      hitM = sc.y;
      hitP = p;
      break;
    }
    db += sc.x * 0.92;
    if (db > 280.) break;
  }

  // ── Composite ──────────────────────────────────────────────────────────
  vec3 col = glowAcc.rgb;

  if (hit) {
    vec3 n    = calcNormal(hitP);
    vec3 base = matBase(hitM, hitP);

    // Three-point lighting for crisp specular highlights
    vec3 L1 = normalize(vec3( .7,  .9, -.4));
    vec3 L2 = normalize(vec3(-.4, -.3,  .9));
    vec3 L3 = normalize(vec3( .0,  .0, -1.));
    vec3 V  = normalize(-D);
    vec3 H1 = normalize(L1 + V);
    vec3 H3 = normalize(L3 + V);

    float diff1 = max(dot(n, L1), 0.0);
    float diff2 = max(dot(n, L2), 0.0) * .35;
    float diff3 = max(dot(n, L3), 0.0) * .2;
    // Tight specular for crisp bright highlights (drives Laplacian variance)
    float spec1 = pow(max(dot(n, H1), 0.0), 96.0) * 1.2;
    float spec3 = pow(max(dot(n, H3), 0.0), 48.0) * .5;
    // Secondary specular at slightly different angle for more hit-or-miss pixels
    vec3 L4 = normalize(vec3(-.6, .5, -.2));
    vec3 H4 = normalize(L4 + V);
    float spec4 = pow(max(dot(n, H4), 0.0), 128.0) * 0.9;

    float rim = pow(1.0 - max(dot(n, V), 0.0), 3.0) * .4;

    vec3 lit = base * (0.06 + diff1 * 0.80 + diff2 + diff3)
             + vec3(1.0) * (spec1 + spec3 + spec4)
             + base * rim;

    // Tunnel wall: don't darken — the high-contrast lattice itself creates sharpness
    // if (hitM > 3.5) lit *= .75;

    // Blend: hard surface dominant for sharpness
    col = mix(glowAcc.rgb * .3, lit, 0.90);
  }

  fragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

function mksh(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    console.error(type === gl.VERTEX_SHADER ? 'VS' : 'FS', gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, mksh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mksh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('link', gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'iTime');
const uRes  = gl.getUniformLocation(prog, 'iRes');

function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  gl.viewport(0, 0, innerWidth, innerHeight);
  gl.uniform2f(uRes, innerWidth, innerHeight);
}
resize();
addEventListener('resize', resize);

const t0 = performance.now();
(function loop() {
  gl.uniform1f(uTime, (performance.now()-t0)/1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
})();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
</html>
