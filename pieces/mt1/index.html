<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>mt1 — tilted planes</title>
  <style>
    *{margin:0;padding:0}
    body{background:#c8d8e8;overflow:hidden}
    canvas{display:block}
  </style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Deterministic seeded RNG (mulberry32) ─────────────────────────────────
function seededRNG(seed) {
  let s = seed >>> 0;
  return () => {
    s += 0x6D2B79F5;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = seededRNG(0xA3F1C2E7);
const rand = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc8d8e8);
scene.fog = new THREE.Fog(0xc8d8e8, 350, 600);

const W = innerWidth, H = innerHeight;
const camera = new THREE.PerspectiveCamera(42, W / H, 0.5, 800);
camera.position.set(0, 80, 200);
camera.lookAt(0, 30, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 30, 0);

// ── Lighting ──────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xfff8f0, 0.3);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff5e0, 2.4);
key.position.set(-120, 200, 80);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left  = -200; key.shadow.camera.right = 200;
key.shadow.camera.top   = 200;  key.shadow.camera.bottom = -200;
key.shadow.camera.near  = 10;   key.shadow.camera.far   = 600;
key.shadow.bias = -0.001;
scene.add(key);

const fill = new THREE.DirectionalLight(0xe0e8ff, 0.7);
fill.position.set(150, 100, -50);
scene.add(fill);

const sky = new THREE.HemisphereLight(0xd6e8f5, 0xd4c8a0, 0.4);
scene.add(sky);

// ── Ground plane ──────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(800, 800, 1, 1);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0xe8e0d0, roughness: 0.92, metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ── Painted steel palette ─────────────────────────────────────────────────
const PALETTE = [
  0xc0392b, // red
  0x2980b9, // blue
  0xe67e22, // orange
  0x27ae60, // green
  0x8e44ad, // purple
  0x2c3e50, // near-black
  0xd35400, // burnt orange
  0x16a085, // teal
];

function steelMat(col) {
  return new THREE.MeshStandardMaterial({
    color: col,
    roughness: 0.35,
    metalness: 0.55,
    side: THREE.DoubleSide,
  });
}

// ── Shape vocabulary ──────────────────────────────────────────────────────

function makeDisk(R, thickness = 2.5) {
  return new THREE.CylinderGeometry(R, R, thickness, 64, 1);
}

function makeRing(R, tubeR) {
  // torus: major radius R, tube radius tubeR
  return new THREE.TorusGeometry(R, tubeR, 10, 72);
}

function makePlate(w, h, depth = 2) {
  return new THREE.BoxGeometry(w, h, depth);
}

function makeArc(R, tubeR, arcAngle) {
  // partial torus via TorusGeometry arc parameter
  return new THREE.TorusGeometry(R, tubeR, 10, 72, arcAngle);
}

function makeOrganicPlate(scale = 1) {
  // Leaf/kidney shape via CatmullRom spline
  const pts = [
    new THREE.Vector2(0,    1.0),
    new THREE.Vector2(0.6,  0.7),
    new THREE.Vector2(0.9,  0.2),
    new THREE.Vector2(0.7, -0.3),
    new THREE.Vector2(0.2, -0.7),
    new THREE.Vector2(-0.3,-0.8),
    new THREE.Vector2(-0.7,-0.4),
    new THREE.Vector2(-0.9, 0.2),
    new THREE.Vector2(-0.6, 0.7),
    new THREE.Vector2(0,    1.0),
  ].map(v => v.multiplyScalar(scale));

  const shape = new THREE.Shape();
  shape.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) {
    shape.lineTo(pts[i].x, pts[i].y);
  }
  shape.closePath();
  return new THREE.ExtrudeGeometry(shape, { depth: 2.5, bevelEnabled: false });
}

function makeStackedDisks(R, count, spacing) {
  // Returns a group of thin disks stacked with slight angle variation
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const diskR = R * (0.7 + 0.3 * Math.sin(t * Math.PI));
    const geo = makeDisk(diskR, 1.8);
    const col = PALETTE[Math.floor(rng() * PALETTE.length)];
    const mesh = new THREE.Mesh(geo, steelMat(col));
    mesh.position.y = i * spacing;
    mesh.rotation.z = rand(-0.15, 0.15);
    mesh.rotation.x = rand(-0.08, 0.08);
    mesh.castShadow = true;
    group.add(mesh);
  }
  return group;
}

// ── Composition: 8 shapes ─────────────────────────────────────────────────
// Each gets bold tilt angles, spread position, one color

const shapes = []; // {mesh or group, breatheFreq, breathePhase, clickOffset, clickTarget, clickCurrent}

function addShape(geo, color, pos, rot, scl = 1) {
  const mesh = new THREE.Mesh(geo, steelMat(color));
  mesh.position.set(pos[0], pos[1], pos[2]);
  mesh.rotation.set(rot[0], rot[1], rot[2]);
  mesh.scale.setScalar(scl);
  mesh.castShadow = true;
  mesh.receiveShadow = false;
  scene.add(mesh);
  return mesh;
}

// 1. Large tilted red disk — centerpiece, leaning dramatically
{
  const geo = makeDisk(52, 3);
  const mesh = addShape(geo, 0xc0392b,
    [10, 55, 0],
    [Math.PI * 0.42, 0.15, -0.3],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.7, breathePhase: 0.0, baseScale: 1.0, clickExtra: 0 });
}

// 2. Blue ring (torus) tilted on edge — like a di Suvero ring
{
  const geo = makeRing(38, 4.5);
  const mesh = addShape(geo, 0x2980b9,
    [-70, 45, 20],
    [Math.PI * 0.5, 0.2, Math.PI * 0.15],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.5, breathePhase: 1.2, baseScale: 1.0, clickExtra: 0 });
}

// 3. Orange tall plate — sheet steel propped at angle
{
  const geo = makePlate(18, 90, 3);
  const mesh = addShape(geo, 0xe67e22,
    [80, 50, -30],
    [-0.4, 0.5, Math.PI * 0.25],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.9, breathePhase: 2.1, baseScale: 1.0, clickExtra: 0 });
}

// 4. Green arc (270° torus) — bold tilt
{
  const geo = makeArc(44, 5, Math.PI * 1.5);
  const mesh = addShape(geo, 0x27ae60,
    [-20, 60, -60],
    [Math.PI * 0.55, -0.3, Math.PI * 0.1],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.6, breathePhase: 0.8, baseScale: 1.0, clickExtra: 0 });
}

// 5. Purple organic leaf plate — tilted into the light
{
  const geo = makeOrganicPlate(45);
  const mesh = addShape(geo, 0x8e44ad,
    [50, 30, 50],
    [Math.PI * 0.35, -0.4, 0.6],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.4, breathePhase: 3.5, baseScale: 1.0, clickExtra: 0 });
}

// 6. Near-black wide plate — like a steel panel on edge
{
  const geo = makePlate(80, 12, 2.5);
  const mesh = addShape(geo, 0x2c3e50,
    [-90, 35, -20],
    [Math.PI * 0.18, -0.6, Math.PI * 0.45],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 1.1, breathePhase: 1.7, baseScale: 1.0, clickExtra: 0 });
}

// 7. Stacked disks group — teal/orange disks, multiple pancakes
{
  const group = makeStackedDisks(30, 4, 14);
  group.position.set(-40, 10, 60);
  group.rotation.set(Math.PI * 0.08, 0.4, -0.25);
  group.castShadow = true;
  scene.add(group);
  shapes.push({ obj: group, breatheFreq: 0.8, breathePhase: 4.2, baseScale: 1.0, clickExtra: 0, isGroup: true });
}

// 8. Burnt-orange small ring close to ground — resting against implied support
{
  const geo = makeRing(24, 3.5);
  const mesh = addShape(geo, 0xd35400,
    [30, 20, 70],
    [Math.PI * 0.6, 0.1, -0.5],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 1.3, breathePhase: 0.4, baseScale: 1.0, clickExtra: 0 });
}

// 9. Teal wide arc (180°) — sweeping arc leaning at sky
{
  const geo = makeArc(55, 6.5, Math.PI);
  const mesh = addShape(geo, 0x16a085,
    [120, 70, -10],
    [Math.PI * 0.3, 0.7, Math.PI * 0.2],
    1.0
  );
  shapes.push({ obj: mesh, breatheFreq: 0.55, breathePhase: 2.9, baseScale: 1.0, clickExtra: 0 });
}

// ── Raycasting for click interaction ─────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const CLICK_TILT = 0.4;
const CLICK_RETURN = 0.04; // return speed per frame

// Build flat list of meshes for raycasting
function collectMeshes() {
  const meshes = [];
  for (const s of shapes) {
    if (s.isGroup) {
      s.obj.traverse(c => { if (c.isMesh) meshes.push({ mesh: c, shape: s }); });
    } else {
      meshes.push({ mesh: s.obj, shape: s });
    }
  }
  return meshes;
}
const clickables = collectMeshes();

renderer.domElement.addEventListener('click', e => {
  mouse.x =  (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickables.map(c => c.mesh));
  if (hits.length > 0) {
    const hit = hits[0];
    const entry = clickables.find(c => c.mesh === hit.object);
    if (entry) entry.shape.clickExtra = CLICK_TILT;
  }
});

// ── Slow world rotation ───────────────────────────────────────────────────
const worldGroup = new THREE.Group();
// Re-parent all shape objects into worldGroup for collective rotation
for (const s of shapes) {
  scene.remove(s.obj);
  worldGroup.add(s.obj);
}
scene.remove(ground); // keep ground outside rotation
scene.add(ground);
scene.add(worldGroup);

// ── Animation loop ────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let totalTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  totalTime += dt;

  // Slow collective Y-rotation
  worldGroup.rotation.y += 0.0003;

  for (const s of shapes) {
    // Subtle breathe
    const breathe = 1.0 + 0.015 * Math.sin(totalTime * s.breatheFreq + s.breathePhase);
    const extraTilt = s.clickExtra;

    if (!s.isGroup) {
      s.obj.scale.setScalar(breathe);
      // Apply click tilt as extra rotation.x on the object
      s.obj.rotation.x += extraTilt * 0.5; // apply fraction of extra tilt
    } else {
      s.obj.scale.setScalar(breathe);
      s.obj.rotation.x += extraTilt * 0.5;
    }

    // Return click extra toward 0
    if (s.clickExtra > 0.001) {
      s.clickExtra *= (1 - CLICK_RETURN);
    } else {
      s.clickExtra = 0;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
