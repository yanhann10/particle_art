<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o2x · Shiota — The Key in the Hand</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">o2x</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0018);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060101, 0.003));
const warmL = new THREE.PointLight(0xff2808, 0.01, 40, 2.0);
warmL.position.set(-2.0, 9.0, 1.0);
scene.add(warmL);

let seed = 4829173;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:26, h:20, d:22 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── SPHERE — pale moon, the still center
// Venice 2015: 50,000 keys hung in red thread above two boats.
// Here the sphere is the memory those keys unlock — formless, luminous.
const sphereCenter = new THREE.Vector3(-0.3, 0.8, 0.5);
const sphereR = 1.4;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8d8,
    emissive: 0xf0e8d8,
    emissiveIntensity: 0.6,
    roughness: 0.95,
    transparent: true,
    opacity: 0.28
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const glowL = new THREE.PointLight(0xfff0d8, 0.006, 7, 2);
glowL.position.copy(sphereCenter);
scene.add(glowL);

function sphereSurfPt(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

// ── KEYS — dark wireframe keys suspended in the web
// The Key in the Hand (2015): each key carries a memory of a home.
// Here they hang asymmetric, caught in thread like insects in silk.
const keyPositions = [];
for(let i=0; i<11; i++){
  const u2=rng()*Math.PI*2, v2=Math.acos(2*rng()-1);
  const r=2.8+rng()*7.0;
  const pos = new THREE.Vector3(
    sphereCenter.x+Math.sin(v2)*Math.cos(u2)*r,
    sphereCenter.y+Math.sin(v2)*Math.sin(u2)*r*0.65,
    sphereCenter.z+Math.cos(v2)*r
  );
  keyPositions.push(pos);
}

// Draw each key as a small wireframe silhouette
for(const kp of keyPositions){
  const s = 0.12+rng()*0.1;
  const pts = [];
  // Key bow (ring)
  const bowSegs = 6;
  for(let c=0; c<bowSegs; c++){
    const a1 = (c/bowSegs)*Math.PI*2;
    const a2 = ((c+1)/bowSegs)*Math.PI*2;
    const br = s*0.4;
    pts.push(Math.cos(a1)*br, Math.sin(a1)*br+s*0.6, 0);
    pts.push(Math.cos(a2)*br, Math.sin(a2)*br+s*0.6, 0);
  }
  // Shaft
  pts.push(0, s*0.25, 0,  0, -s*0.6, 0);
  // Teeth
  pts.push(0, -s*0.6, 0,  s*0.2, -s*0.6, 0);
  pts.push(0, -s*0.45, 0,  s*0.15, -s*0.45, 0);
  pts.push(0, -s*0.3, 0,  s*0.18, -s*0.3, 0);

  const kGeo = new THREE.BufferGeometry();
  kGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const kMesh = new THREE.LineSegments(kGeo, new THREE.LineBasicMaterial({
    color:0x1a1210, transparent:true, opacity:0.5
  }));
  kMesh.position.copy(kp);
  kMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(kMesh);
}

// ── VOID ZONES — negative space channels for the camera to breathe through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.8;
  const vr=5.5+rng()*3.5;
  voids.push({
    x:sphereCenter.x+Math.cos(a)*vr,
    z:sphereCenter.z+Math.sin(a)*vr,
    r:1.3+rng()*0.7
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── SPIRAL ANCHOR TOPOLOGY
// Arterial helices radiating from the sphere — blood-vessel geometry.
// Not Mohr's polyhedra but Shiota's circulatory logic:
// threads follow the body's branching, not the crystal's symmetry.
const anchors = [];

// Helical shells — 5 double helices spiraling outward
for(let h=0; h<5; h++){
  const baseR = 2.5 + h*2.2;
  const turns = 2.5 + h*0.5;
  const ptsPerHelix = 18 + h*4;
  const ySpread = ROOM.h*0.35;
  const phaseOff = h*0.618*Math.PI*2; // golden angle offset between shells

  for(let strand=0; strand<2; strand++){
    const strandOff = strand*Math.PI;
    for(let j=0; j<ptsPerHelix; j++){
      const t = j/ptsPerHelix;
      const angle = t*turns*Math.PI*2 + phaseOff + strandOff;
      const r = baseR + Math.sin(t*Math.PI)*0.6;
      const pt = new THREE.Vector3(
        sphereCenter.x + Math.cos(angle)*r,
        sphereCenter.y + (t-0.5)*ySpread,
        sphereCenter.z + Math.sin(angle)*r
      );
      if(!inVoid(pt) && Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
        anchors.push(pt);
      }
    }
  }
}

// Wall anchors — sparser than parent, asymmetric
for(let i=0; i<45; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
// Key positions as anchors
for(const kp of keyPositions) anchors.push(kp.clone());

// ── BUILD THREAD NETWORK
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return false;
  if(inVoid(a)||inVoid(b)) return false;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li]=cat;
  li++;
  return true;
}

// ── SUSPENSION — threads from ceiling, the hanging made visible
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.3;
  const spread=0.4+rng()*0.6;
  const top = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*spread*2.0, hh, sphereCenter.z+Math.sin(a)*spread*2.0
  );
  const bot = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*0.08, sphereCenter.y+sphereR-0.1, sphereCenter.z+Math.sin(a)*0.08
  );
  setLine(top, bot, 0);
}

// ── KEY SUSPENSION — each key hangs from 2-3 threads to ceiling/walls
for(const kp of keyPositions){
  const nThreads = 2+Math.floor(rng()*2);
  for(let j=0; j<nThreads; j++){
    if(rng()<0.6){
      const top = new THREE.Vector3(
        kp.x+(rng()-0.5)*2.0, hh, kp.z+(rng()-0.5)*2.0
      );
      setLine(top, kp, 0);
    } else {
      setLine(wallPt(), kp, 0);
    }
  }
}

// ── CONVERGENCE — anchors reaching toward sphere
// The vascular system: everything flows toward the heart
for(let i=0; i<anchors.length && li<NUM_LINES-2000; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  const count = d<3.5?4 : d<6.0?2 : d<9?1 : (rng()<0.3?1:0);
  for(let j=0; j<count && li<NUM_LINES-2000; j++){
    const target = sphereSurfPt();
    // 12% stop short — presence-in-absence, the thread that yearns
    if(rng()<0.12){
      const dir = a.clone().sub(target).normalize();
      const gap = 0.3+rng()*1.0;
      setLine(a, target.clone().add(dir.multiplyScalar(gap)), 1);
    } else {
      setLine(a, target, 1);
    }
  }
}

// ── KEY CONVERGENCE — threads from web toward keys
// Each key pulls threads from nearby anchors — smaller gravity wells
for(const kp of keyPositions){
  for(let j=0; j<8 && li<NUM_LINES-1500; j++){
    const nearIdx = Math.floor(rng()*anchors.length);
    const a = anchors[nearIdx];
    if(a.distanceTo(kp)<8.0){
      setLine(a, kp, 1);
    }
  }
}

// ── PROXIMITY WEB — anchor-to-anchor, density from proximity
const THRESH = 4.8;
let webCount=0, attempts=0;
while(webCount<4800 && li<NUM_LINES-800 && attempts<35000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<10; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  webCount++;
}

// ── DENDRITIC BRANCHES — short forking chains
for(let i=0; i<120 && li<NUM_LINES-10; i++){
  const root = anchors[Math.floor(rng()*anchors.length)];
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.4+rng()*0.7;
  let cur = root.clone();
  for(let g=0; g<3 && li<NUM_LINES; g++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen*(0.65**g)));
    dir.x += (rng()-0.5)*0.8;
    dir.y += (rng()-0.5)*0.4;
    dir.z += (rng()-0.5)*0.8;
    dir.normalize();
    if(Math.abs(next.x)<hw && Math.abs(next.y)<hh && Math.abs(next.z)<hd){
      setLine(cur, next, 3);
      if(g===1 && rng()>0.5){
        const fk = dir.clone();
        fk.x += (rng()-0.5)*1.5;
        fk.z += (rng()-0.5)*1.5;
        fk.normalize();
        setLine(cur, cur.clone().add(fk.multiplyScalar(segLen*0.3)), 3);
      }
      cur = next;
    }
  }
}

// ── RADIAL FILAMENTS — sphere exhales outward
for(let i=0; i<600 && li<NUM_LINES; i++){
  const sp = sphereSurfPt();
  const dir = sp.clone().sub(sphereCenter).normalize();
  dir.x += (rng()-0.5)*0.25;
  dir.y += (rng()-0.5)*0.25;
  dir.z += (rng()-0.5)*0.25;
  dir.normalize();
  const len = 1.2+rng()*3.8;
  const end = sp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(sp, end, 3);
  }
}

// ── FILL remaining with wall spans
while(li<NUM_LINES){
  const a=wallPt();
  const b=rng()<0.25 ? sphereSurfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — arterial red #c20018, opacity by category and distance
// Suspension: boldest. Convergence: medium. Web: faint. Filament: whisper.
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.12, 0.065, 0.038, 0.03];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0-d*0.03);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  // Arterial warmth near sphere
  const warmShift = d<3.5 ? 0.02*(1.0-d/3.5) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.35;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.1,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — The Key in the Hand: a journey of remembering
// Begin very close to sphere (the memory), retreat into the web (the world),
// discover keys hanging in silence, return to the sphere transformed.
const pathLen = 3200;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;
  let x, y, z;

  if(t<0.08){
    // Intimate — breath-close to sphere, threads frame it like veins
    const lt=t/0.08;
    const rH=2.2+lt*0.3;
    const angle=lt*Math.PI*0.15+0.8;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.2+lt*0.4;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.2){
    // Slow retreat — sphere recedes, web thickens around you
    const lt=(t-0.08)/0.12;
    const rH=2.5+lt*3.5;
    const angle=lt*Math.PI*0.5+1.0;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.6+lt*1.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.32){
    // Wander among keys — horizontal drift through hanging field
    const lt=(t-0.2)/0.12;
    const rH=5.5+Math.sin(lt*Math.PI)*1.0;
    const angle=lt*Math.PI*0.8+1.6;
    x = cx+Math.cos(angle)*rH;
    y = cy+2.0+Math.sin(lt*Math.PI*0.5)*1.2;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.42){
    // Pause near a key — contemplation of what it locked/unlocked
    const lt=(t-0.32)/0.10;
    const rH=5.0-lt*0.5;
    const angle=lt*Math.PI*0.1+3.0;
    x = cx+Math.cos(angle)*rH;
    y = cy+2.5-lt*0.8;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.54){
    // Descend — below the sphere, looking up through arterial canopy
    const lt=(t-0.42)/0.12;
    x = cx+Math.sin(lt*Math.PI*0.3+3.2)*4.2;
    y = cy-lt*7.0;
    z = cz+Math.cos(lt*Math.PI*0.3+3.2)*3.8;
  } else if(t<0.65){
    // Below — in the root system, sphere is a distant moon above
    const lt=(t-0.54)/0.11;
    const rH=4.0+lt*1.0;
    const angle=lt*Math.PI*0.6+3.5;
    x = cx+Math.cos(angle)*rH;
    y = cy-7.0+lt*4.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.78){
    // Rise through the web — threads everywhere, sphere growing
    const lt=(t-0.65)/0.13;
    x = cx+Math.sin(lt*Math.PI*0.8+4.2)*3.2;
    y = cy-3.0+lt*12.0;
    z = cz+Math.cos(lt*Math.PI*0.8+4.2)*3.5;
  } else if(t<0.88){
    // Above — cathedral ceiling of thread, suspension lines visible
    const lt=(t-0.78)/0.10;
    const rH=3.5+lt*1.5;
    const angle=lt*Math.PI*0.4+5.5;
    x = cx+Math.cos(angle)*rH;
    y = cy+9.0-lt*4.0;
    z = cz+Math.sin(angle)*rH;
  } else {
    // Return — approach sphere again, completing the circle
    const lt=(t-0.88)/0.12;
    const rH=5.0-lt*2.8;
    const angle=lt*Math.PI*0.3+6.0;
    x = cx+Math.cos(angle)*rH;
    y = cy+5.0-lt*4.8;
    z = cz+Math.sin(angle)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — barely perceptible sway
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.035+i*0.0001;
    const breath = Math.sin(elapsed*0.0006+phase)*0.00002;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.04;
      arr[vi+1] = basePositions[vi+1] + breath*0.025;
      arr[vi+2] = basePositions[vi+2] + breath*0.035;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.00003;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at sphere with glacial drift
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0001)*0.04;
  look.y += Math.cos(elapsed*0.00009)*0.05;
  look.z += Math.sin(elapsed*0.0002+0.7)*0.03;
  camera.lookAt(look);

  // Light pulse — the sphere's slow heartbeat
  warmL.intensity = 0.01+Math.sin(elapsed*0.00007)*0.003;
  glowL.intensity = 0.006+Math.sin(elapsed*0.00005+1.0)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
