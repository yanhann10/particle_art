<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MOTION: propagate, intensity: gentle -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ua3 · physarum venation · Sage Jenson</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#060810; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        z-index:10; }
</style>
</head>
<body>
<div class="id">ua3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Config ────────────────────────────────────────── */
const TRAIL_RES   = 1024;
const AGENT_SZ    = 256;          // 256×256 = 65 536 agents
const N           = AGENT_SZ * AGENT_SZ;
const SENSOR_DIST = 9.0;
const SENSOR_ANG  = 0.32;
const TURN_SPD    = 0.18;
const MOVE_SPD    = 1.0;
const DEPOSIT_AMT = 0.35;
const DECAY       = 0.965;
const DIFFUSE_W   = 0.22;

/* ── Renderer ──────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

/* ── Helpers ───────────────────────────────────────── */
const fsGeom   = new THREE.PlaneGeometry(2, 2);
const fsCam    = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fsScene  = new THREE.Scene();
const fsQuad   = new THREE.Mesh(fsGeom, null);
fsScene.add(fsQuad);

function pass(mat, rt) {
  fsQuad.material = mat;
  renderer.setRenderTarget(rt);
  renderer.render(fsScene, fsCam);
}

function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: false
  });
}

/* ── Render targets (ping-pong) ────────────────────── */
let agentA = makeRT(AGENT_SZ, AGENT_SZ);
let agentB = makeRT(AGENT_SZ, AGENT_SZ);
let trailA = makeRT(TRAIL_RES, TRAIL_RES);
let trailB = makeRT(TRAIL_RES, TRAIL_RES);

/* ── Initialize agents: three seed clusters ────────── */
const initData = new Float32Array(N * 4);
const centers = [
  [0.35, 0.40], [0.65, 0.55], [0.50, 0.70]
];
for (let i = 0; i < N; i++) {
  const ci  = i % 3;
  const cx  = centers[ci][0], cy = centers[ci][1];
  const a   = Math.random() * Math.PI * 2;
  const r   = 0.03 + Math.random() * 0.14;
  initData[i*4]     = cx + Math.cos(a) * r;
  initData[i*4 + 1] = cy + Math.sin(a) * r;
  initData[i*4 + 2] = Math.random();                 // angle (0-1 → 0-2π)
  initData[i*4 + 3] = 0.7 + Math.random() * 0.6;    // speed factor
}
const initTex = new THREE.DataTexture(initData, AGENT_SZ, AGENT_SZ,
  THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const copyMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: initTex } },
  vertexShader:   `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; varying vec2 v;
    void main(){ gl_FragColor=texture2D(t,v); }`
});
pass(copyMat, agentA);
copyMat.dispose();

// Clear trails
renderer.setRenderTarget(trailA); renderer.clear();
renderer.setRenderTarget(trailB); renderer.clear();

/* ── 1. Agent sense → steer → move ────────────────── */
const agentMat = new THREE.ShaderMaterial({
  uniforms: {
    uA:    { value: null },
    uT:    { value: null },
    uTR:   { value: TRAIL_RES },
    uSD:   { value: SENSOR_DIST },
    uSA:   { value: SENSOR_ANG },
    uTS:   { value: TURN_SPD },
    uMS:   { value: MOVE_SPD },
    uRnd:  { value: 0 },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uA, uT;
    uniform float uTR, uSD, uSA, uTS, uMS, uRnd, uTime;
    varying vec2 v;

    float h(vec2 p){ return fract(sin(dot(p+uRnd, vec2(127.1,311.7)))*43758.5453); }

    float sense(vec2 pos, float ang, float off){
      float a = ang + off;
      vec2 d = vec2(cos(a), sin(a)) * uSD / uTR;
      return texture2D(uT, fract(pos + d)).r;
    }

    void main(){
      vec4 ag = texture2D(uA, v);
      vec2 pos   = ag.rg;
      float ang  = ag.b * 6.28318;
      float spd  = ag.a;

      float sC = sense(pos, ang, 0.0);
      float sL = sense(pos, ang, uSA);
      float sR = sense(pos, ang,-uSA);

      float rn = (h(v) - 0.5) * 0.06;
      if (sC >= sL && sC >= sR) {
        ang += rn;
      } else if (sL > sR) {
        ang += uTS + rn;
      } else if (sR > sL) {
        ang -= uTS + rn;
      } else {
        ang += (h(v * 3.1) - 0.5) * uTS * 2.0;
      }

      vec2 vel = vec2(cos(ang), sin(ang)) * uMS / uTR * spd;
      pos = fract(pos + vel + 1.0);
      ang = fract(ang / 6.28318);

      gl_FragColor = vec4(pos, ang, spd);
    }
  `
});

/* ── 2. Deposit: render agent positions as points ──── */
const depUvs  = new Float32Array(N * 2);
const depPos  = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  depUvs[i*2]   = ((i % AGENT_SZ) + 0.5) / AGENT_SZ;
  depUvs[i*2+1] = (Math.floor(i / AGENT_SZ) + 0.5) / AGENT_SZ;
}
const depGeom = new THREE.BufferGeometry();
depGeom.setAttribute('position', new THREE.BufferAttribute(depPos, 3));
depGeom.setAttribute('aUv',     new THREE.BufferAttribute(depUvs, 2));

const depMat = new THREE.ShaderMaterial({
  uniforms: { uA: { value: null }, uDep: { value: DEPOSIT_AMT } },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false, depthWrite: false,
  vertexShader: `
    uniform sampler2D uA;
    attribute vec2 aUv;
    void main(){
      vec4 ag = texture2D(uA, aUv);
      gl_Position = vec4(ag.rg * 2.0 - 1.0, 0.0, 1.0);
      gl_PointSize = 1.0;
    }`,
  fragmentShader: `
    uniform float uDep;
    void main(){ gl_FragColor = vec4(uDep, uDep * 0.85, uDep * 0.6, 1.0); }`
});

const depPts   = new THREE.Points(depGeom, depMat);
const depScene = new THREE.Scene();
depScene.add(depPts);
const depCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* ── 3. Diffuse + decay ───────────────────────────── */
const diffMat = new THREE.ShaderMaterial({
  uniforms: {
    uT:  { value: null },
    uDc: { value: DECAY },
    uDf: { value: DIFFUSE_W },
    uR:  { value: TRAIL_RES }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uT;
    uniform float uDc, uDf, uR;
    varying vec2 v;
    void main(){
      float px = 1.0 / uR;
      vec3 sum = vec3(0.0);
      for(int x=-1; x<=1; x++)
        for(int y=-1; y<=1; y++)
          sum += texture2D(uT, v + vec2(float(x),float(y))*px).rgb;
      vec3 center = texture2D(uT, v).rgb;
      vec3 blurred = mix(center, sum / 9.0, uDf);
      gl_FragColor = vec4(blurred * uDc, 1.0);
    }
  `
});

/* ── 4. Display: trail → color ─────────────────────── */
const dispMat = new THREE.ShaderMaterial({
  uniforms: {
    uT:    { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uT;
    uniform float uTime;
    varying vec2 v;

    float grain(vec2 uv, float t){
      return fract(sin(dot(uv*437.2+t*91.0, vec2(12.9898,78.233)))*43758.5453)*0.035-0.0175;
    }

    void main(){
      vec3 raw = texture2D(uT, v).rgb;
      float lum = dot(raw, vec3(0.35, 0.45, 0.20));

      /* non-linear tonemap — expose the fine filaments */
      float t = pow(clamp(lum, 0.0, 1.0), 0.48);
      t = smoothstep(0.008, 0.85, t);

      /* hand-tuned 4-stop palette:
         midnight-blue → deep olive-teal → ember amber → parchment */
      vec3 c0 = vec3(0.025, 0.028, 0.048);   // midnight
      vec3 c1 = vec3(0.06,  0.10,  0.055);    // olive-teal
      vec3 c2 = vec3(0.76,  0.46,  0.14);     // ember
      vec3 c3 = vec3(1.00,  0.93,  0.80);     // parchment

      vec3 col = t < 0.22 ? mix(c0, c1, t / 0.22)
               : t < 0.52 ? mix(c1, c2, (t - 0.22) / 0.30)
                           : mix(c2, c3, (t - 0.52) / 0.48);

      /* subtle channel separation for organic warmth */
      col.r += raw.r * 0.08;
      col.b += raw.b * 0.04;

      /* vignette */
      vec2 vc = v - 0.5;
      col *= smoothstep(0.0, 1.0, 1.0 - dot(vc,vc) * 1.3);

      /* film grain — photochemical texture */
      col += grain(v, uTime);

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `
});

/* ── Resize ────────────────────────────────────────── */
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

/* ── Loop ──────────────────────────────────────────── */
let frame = 0;

function loop(){
  requestAnimationFrame(loop);
  frame++;

  /* more steps early so structure is visible at 5 s render-gate */
  const steps = frame < 120 ? 10 : 5;

  for (let s = 0; s < steps; s++){
    /* 1 — agent update */
    agentMat.uniforms.uA.value    = agentA.texture;
    agentMat.uniforms.uT.value    = trailA.texture;
    agentMat.uniforms.uRnd.value  = Math.random() * 9999;
    agentMat.uniforms.uTime.value = frame;
    pass(agentMat, agentB);
    [agentA, agentB] = [agentB, agentA];

    /* 2 — deposit (additive, no clear) */
    depMat.uniforms.uA.value = agentA.texture;
    renderer.setRenderTarget(trailA);
    renderer.render(depScene, depCam);

    /* 3 — diffuse + decay */
    diffMat.uniforms.uT.value = trailA.texture;
    pass(diffMat, trailB);
    [trailA, trailB] = [trailB, trailA];
  }

  /* 4 — display */
  dispMat.uniforms.uT.value    = trailA.texture;
  dispMat.uniforms.uTime.value = frame * 0.016;
  pass(dispMat, null);
}

loop();
</script>
</body>
</html>
