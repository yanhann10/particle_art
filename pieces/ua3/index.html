<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Config ────────────────────────────────────────── */
const TRAIL_RES   = 1024;
const AGENT_SZ    = 256;          // 256×256 = 65 536 agents
const N           = AGENT_SZ * AGENT_SZ;
const SENSOR_DIST = 9.0;
const SENSOR_ANG  = 0.32;
const TURN_SPD    = 0.18;
const MOVE_SPD    = 1.0;
const DEPOSIT_AMT = 0.35;
const DECAY       = 0.965;
const DIFFUSE_W   = 0.22;

/* ── Renderer ──────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

/* ── Helpers ───────────────────────────────────────── */
const fsGeom   = new THREE.PlaneGeometry(2, 2);
const fsCam    = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fsScene  = new THREE.Scene();
const fsQuad   = new THREE.Mesh(fsGeom, null);
fsScene.add(fsQuad);

function pass(mat, rt) {
  fsQuad.material = mat;
  renderer.setRenderTarget(rt);
  renderer.render(fsScene, fsCam);
}

function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: false
  });
}

/* ── Render targets (ping-pong) ────────────────────── */
let agentA = makeRT(AGENT_SZ, AGENT_SZ);
let agentB = makeRT(AGENT_SZ, AGENT_SZ);
let trailA = makeRT(TRAIL_RES, TRAIL_RES);
let trailB = makeRT(TRAIL_RES, TRAIL_RES);

/* ── Initialize agents: three seed clusters ────────── */
const initData = new Float32Array(N * 4);
const centers = [
  [0.35, 0.40], [0.65, 0.55], [0.50, 0.70]
];
for (let i = 0; i < N; i++) {
  const ci  = i % 3;
  const cx  = centers[ci][0], cy = centers[ci][1];
  const a   = Math.random() * Math.PI * 2;
  const r   = 0.03 + Math.random() * 0.14;
  initData[i*4]     = cx + Math.cos(a) * r;
  initData[i*4 + 1] = cy + Math.sin(a) * r;
  initData[i*4 + 2] = Math.random();                 // angle (0-1 → 0-2π)
  initData[i*4 + 3] = 0.7 + Math.random() * 0.6;    // speed factor
}
const initTex = new THREE.DataTexture(initData, AGENT_SZ, AGENT_SZ,
  THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const copyMat = new THREE.ShaderMaterial({
  uniforms: { t: { value: initTex } },
  vertexShader:   `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D t; varying vec2 v;
    void main(){ gl_FragColor=texture2D(t,v); }`
});
pass(copyMat, agentA);
copyMat.dispose();

// Clear trails
renderer.setRenderTarget(trailA); renderer.clear();
renderer.setRenderTarget(trailB); renderer.clear();

/* ── 1. Agent sense → steer → move ────────────────── */
const agentMat = new THREE.ShaderMaterial({
  uniforms: {
    uA:    { value: null },
    uT:    { value: null },
    uTR:   { value: TRAIL_RES },
    uSD:   { value: SENSOR_DIST },
    uSA:   { value: SENSOR_ANG },
    uTS:   { value: TURN_SPD },
    uMS:   { value: MOVE_SPD },
    uRnd:  { value: 0 },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uA, uT;
    uniform float uTR, uSD, uSA, uTS, uMS, uRnd, uTime;
    varying vec2 v;

    float h(vec2 p){ return fract(sin(dot(p+uRnd, vec2(127.1,311.7)))*43758.5453); }

    float sense(vec2 pos, float ang, float off){
      float a = ang + off;
      vec2 d = vec2(cos(a), sin(a)) * uSD / uTR;
      return texture2D(uT, fract(pos + d)).r;
    }

    void main(){
      vec4 ag = texture2D(uA, v);
      vec2 pos   = ag.rg;
      float ang  = ag.b * 6.28318;
      float spd  = ag.a;

      float sC = sense(pos, ang, 0.0);
      float sL = sense(pos, ang, uSA);
      float sR = sense(pos, ang,-uSA);

      float rn = (h(v) - 0.5) * 0.06;
      if (sC >= sL && sC >= sR) {
        ang += rn;
      } else if (sL > sR) {
        ang += uTS + rn;
      } else if (sR > sL) {
        ang -= uTS + rn;
      } else {
        ang += (h(v * 3.1) - 0.5) * uTS * 2.0;
      }

      vec2 vel = vec2(cos(ang), sin(ang)) * uMS / uTR * spd;
      pos = fract(pos + vel + 1.0);
      ang = fract(ang / 6.28318);

      gl_FragColor = vec4(pos, ang, spd);
    }
  `
});

/* ── 2. Deposit: render agent positions as points ──── */
const depUvs  = new Float32Array(N * 2);
const depPos  = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  depUvs[i*2]   = ((i % AGENT_SZ) + 0.5) / AGENT_SZ;
  depUvs[i*2+1] = (Math.floor(i / AGENT_SZ) + 0.5) / AGENT_SZ;
}
const depGeom = new THREE.BufferGeometry();
depGeom.setAttribute('position', new THREE.BufferAttribute(depPos, 3));
depGeom.setAttribute('aUv',     new THREE.BufferAttribute(depUvs, 2));

const depMat = new THREE.ShaderMaterial({
  uniforms: { uA: { value: null }, uDep: { value: DEPOSIT_AMT } },
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthTest: false, depthWrite: false,
  vertexShader: `
    uniform sampler2D uA;
    attribute vec2 aUv;
    void main(){
      vec4 ag = texture2D(uA, aUv);
      gl_Position = vec4(ag.rg * 2.0 - 1.0, 0.0, 1.0);
      gl_PointSize = 1.0;
    }`,
  fragmentShader: `
    uniform float uDep;
    void main(){ gl_FragColor = vec4(uDep, uDep * 0.85, uDep * 0.6, 1.0); }`
});

const depPts   = new THREE.Points(depGeom, depMat);
const depScene = new THREE.Scene();
depScene.add(depPts);
const depCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* ── 3. Diffuse + decay ───────────────────────────── */
const diffMat = new THREE.ShaderMaterial({
  uniforms: {
    uT:  { value: null },
    uDc: { value: DECAY },
    uDf: { value: DIFFUSE_W },
    uR:  { value: TRAIL_RES }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uT;
    uniform float uDc, uDf, uR;
    varying vec2 v;
    void main(){
      float px = 1.0 / uR;
      vec3 sum = vec3(0.0);
      for(int x=-1; x<=1; x++)
        for(int y=-1; y<=1; y++)
          sum += texture2D(uT, v + vec2(float(x),float(y))*px).rgb;
      vec3 center = texture2D(uT, v).rgb;
      vec3 blurred = mix(center, sum / 9.0, uDf);
      gl_FragColor = vec4(blurred * uDc, 1.0);
    }
  `
});

/* ── 4. Display: trail → color ─────────────────────── */
const dispMat = new THREE.ShaderMaterial({
  uniforms: {
    uT:    { value: null },
    uTime: { value: 0 }
  },
  vertexShader: `varying vec2 v; void main(){ v=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D uT;
    uniform float uTime;
    varying vec2 v;

    float grain(vec2 uv, float t){
      return fract(sin(dot(uv*437.2+t*91.0, vec2(12.9898,78.233)))*43758.5453)*0.035-0.0175;
    }

    void main(){
      vec3 raw = texture2D(uT, v).rgb;
      float lum = dot(raw, vec3(0.35, 0.45, 0.20));

      /* non-linear tonemap — expose the fine filaments */
      float t = pow(clamp(lum, 0.0, 1.0), 0.48);
      t = smoothstep(0.008, 0.85, t);

      /* hand-tuned 4-stop palette:
         midnight-blue → deep olive-teal → ember amber → parchment */
      vec3 c0 = vec3(0.025, 0.028, 0.048);   // midnight
      vec3 c1 = vec3(0.06,  0.10,  0.055);    // olive-teal
      vec3 c2 = vec3(0.76,  0.46,  0.14);     // ember
      vec3 c3 = vec3(1.00,  0.93,  0.80);     // parchment

      vec3 col = t < 0.22 ? mix(c0, c1, t / 0.22)
               : t < 0.52 ? mix(c1, c2, (t - 0.22) / 0.30)
                           : mix(c2, c3, (t - 0.52) / 0.48);

      /* subtle channel separation for organic warmth */
      col.r += raw.r * 0.08;
      col.b += raw.b * 0.04;

      /* vignette */
      vec2 vc = v - 0.5;
      col *= smoothstep(0.0, 1.0, 1.0 - dot(vc,vc) * 1.3);

      /* film grain — photochemical texture */
      col += grain(v, uTime);

      gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
    }
  `
});

/* ── Resize ────────────────────────────────────────── */
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

/* ── Loop ──────────────────────────────────────────── */
let frame = 0;

function loop(){
  requestAnimationFrame(loop);
  frame++;

  /* more steps early so structure is visible at 5 s render-gate */
  const steps = frame < 120 ? 10 : 5;

  for (let s = 0; s < steps; s++){
    /* 1 — agent update */
    agentMat.uniforms.uA.value    = agentA.texture;
    agentMat.uniforms.uT.value    = trailA.texture;
    agentMat.uniforms.uRnd.value  = Math.random() * 9999;
    agentMat.uniforms.uTime.value = frame;
    pass(agentMat, agentB);
    [agentA, agentB] = [agentB, agentA];

    /* 2 — deposit (additive, no clear) */
    depMat.uniforms.uA.value = agentA.texture;
    renderer.setRenderTarget(trailA);
    renderer.render(depScene, depCam);

    /* 3 — diffuse + decay */
    diffMat.uniforms.uT.value = trailA.texture;
    pass(diffMat, trailB);
    [trailA, trailB] = [trailB, trailA];
  }

  /* 4 — display */
  dispMat.uniforms.uT.value    = trailA.texture;
  dispMat.uniforms.uTime.value = frame * 0.016;
  pass(dispMat, null);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

  #gp-save:hover{border-color:rgba(201,168,106,0.7);}

    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
