<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qm4 · Shiota — Two Home Countries</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">qm4</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0018);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060101, 0.003));
const warmL = new THREE.PointLight(0xff3010, 0.01, 40, 2.0);
warmL.position.set(0, 9, -1);
scene.add(warmL);

let seed = 4829173;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:26, h:20, d:22 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── TWO SPHERES — Two Home Countries (Shiota, 2017)
// Osaka and Berlin, two moons suspended in the same circulatory sky.
// The thread-web bridges them — memory, distance, belonging.
// Neither sphere is the center; the SPACE BETWEEN is.
const sphereA = new THREE.Vector3(-3.8, 0.4, -0.3);
const sphereB = new THREE.Vector3(3.5, -0.1, 0.5);
const midpoint = sphereA.clone().add(sphereB).multiplyScalar(0.5);
const rA = 1.3, rB = 1.1;

const sMat = new THREE.MeshStandardMaterial({
  color: 0xede4d0, emissive: 0xede4d0, emissiveIntensity: 0.7,
  roughness: 0.92, transparent: true, opacity: 0.30
});
const sA = new THREE.Mesh(new THREE.SphereGeometry(rA, 24, 16), sMat);
sA.position.copy(sphereA);
scene.add(sA);
const sB = new THREE.Mesh(new THREE.SphereGeometry(rB, 24, 16), sMat.clone());
sB.position.copy(sphereB);
scene.add(sB);

const glowA = new THREE.PointLight(0xfff0e0, 0.007, 7, 2);
glowA.position.copy(sphereA);
scene.add(glowA);
const glowB = new THREE.PointLight(0xfff0e0, 0.006, 6, 2);
glowB.position.copy(sphereB);
scene.add(glowB);

function sphereSurf(center, r){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    center.x+Math.sin(v)*Math.cos(u)*r,
    center.y+Math.sin(v)*Math.sin(u)*r,
    center.z+Math.cos(v)*r
  );
}

// ── FRAGMENTS — charred paper, torn diary pages caught in the web
const fragments = [];
for(let i=0; i<18; i++){
  const t = rng();
  const base = t<0.4 ? sphereA : t<0.8 ? sphereB : midpoint;
  const u2=rng()*Math.PI*2, v2=Math.acos(2*rng()-1);
  const r=2.5+rng()*5.5;
  const pos = new THREE.Vector3(
    base.x+Math.sin(v2)*Math.cos(u2)*r,
    base.y+Math.sin(v2)*Math.sin(u2)*r*0.6,
    base.z+Math.cos(v2)*r
  );
  fragments.push(pos);
}

for(const fp of fragments){
  const s = 0.07+rng()*0.14;
  const pts = [];
  const corners = [];
  for(let c=0; c<4+Math.floor(rng()*3); c++){
    const n2 = corners.length || 5;
    const ca = (c/n2)*Math.PI*2+rng()*0.5;
    const cr = s*(0.3+rng());
    corners.push(new THREE.Vector3(Math.cos(ca)*cr, Math.sin(ca)*cr, (rng()-0.5)*s*0.2));
  }
  for(let c=0; c<corners.length; c++){
    const n=(c+1)%corners.length;
    pts.push(corners[c].x,corners[c].y,corners[c].z, corners[n].x,corners[n].y,corners[n].z);
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0604, transparent:true, opacity:0.35
  }));
  fMesh.position.copy(fp);
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  scene.add(fMesh);
}

// ── VOID ZONES — negative space for camera to breathe through
const voids = [];
for(let i=0; i<2; i++){
  const a=(i/2)*Math.PI+rng()*0.8;
  const vr=5.0+rng()*2.5;
  voids.push({ x:midpoint.x+Math.cos(a)*vr, z:midpoint.z+Math.sin(a)*vr, r:1.3+rng()*0.6 });
}
function inVoid(p){
  for(const v of voids){ const dx=p.x-v.x, dz=p.z-v.z; if(dx*dx+dz*dz<v.r*v.r) return true; }
  return false;
}

// ── ANCHOR POINTS — icosahedral shells around EACH sphere + bridge zone
const icoGeo2 = new THREE.IcosahedronGeometry(1, 1);
const icoPos = icoGeo2.attributes.position;
const icoNorms = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNorms.push(v); }
}

const anchors = [];
const shellRadii = [2.5, 4.5, 7.0, 9.5, 12.0];
for(const center of [sphereA, sphereB]){
  for(const sr of shellRadii){
    for(const n of icoNorms){
      const pt = new THREE.Vector3(
        center.x+n.x*sr, center.y+n.y*sr*0.7, center.z+n.z*sr
      );
      if(!inVoid(pt) && Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
        anchors.push(pt);
      }
    }
  }
}
// Bridge anchors — extra density in the space between
for(let i=0; i<80; i++){
  const t = 0.15+rng()*0.7;
  const base = sphereA.clone().lerp(sphereB, t);
  base.x += (rng()-0.5)*3.0;
  base.y += (rng()-0.5)*2.5;
  base.z += (rng()-0.5)*3.0;
  if(!inVoid(base) && Math.abs(base.x)<hw && Math.abs(base.y)<hh && Math.abs(base.z)<hd){
    anchors.push(base);
  }
}
// Wall anchors
for(let i=0; i<50; i++){ const wp=wallPt(); if(!inVoid(wp)) anchors.push(wp); }
// Fragment anchors
for(const fp of fragments) anchors.push(fp.clone());

// ── BUILD THREAD NETWORK — 20,000 line segments max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  const dA=Math.sqrt((mx-sphereA.x)**2+(my-sphereA.y)**2+(mz-sphereA.z)**2);
  const dB=Math.sqrt((mx-sphereB.x)**2+(my-sphereB.y)**2+(mz-sphereB.z)**2);
  lineDist[li]=Math.min(dA,dB);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION — vertical threads from ceiling to each sphere
for(const [center, r] of [[sphereA, rA],[sphereB, rB]]){
  for(let i=0; i<7; i++){
    const a=(i/7)*Math.PI*2+(rng()-0.5)*0.3;
    const spread = 0.3+rng()*0.4;
    const top = new THREE.Vector3(center.x+Math.cos(a)*spread*2.0, hh, center.z+Math.sin(a)*spread*2.0);
    const bot = new THREE.Vector3(center.x+Math.cos(a)*0.08, center.y+r-0.05, center.z+Math.sin(a)*0.08);
    setLine(top, bot, 0);
  }
}

// ── BRIDGE THREADS — sphere A surface ↔ sphere B surface
// The arterial bridge: memory traveling between two homes
for(let i=0; i<3500 && li<NUM_LINES; i++){
  const ptA = sphereSurf(sphereA, rA);
  const ptB = sphereSurf(sphereB, rB);
  // Some threads sag slightly — gravity's whisper
  if(rng()<0.12){
    const sagMid = ptA.clone().lerp(ptB, 0.4+rng()*0.2);
    sagMid.y -= 0.3+rng()*0.6;
    setLine(ptA, sagMid, 1);
    setLine(sagMid, ptB, 1);
  } else {
    setLine(ptA, ptB, 1);
  }
}

// ── CONVERGENCE — anchors reaching toward nearest sphere
for(let i=0; i<anchors.length && li<NUM_LINES; i++){
  const a = anchors[i];
  const dA = a.distanceTo(sphereA);
  const dB = a.distanceTo(sphereB);
  const nearCenter = dA<dB ? sphereA : sphereB;
  const nearR = dA<dB ? rA : rB;
  const d = Math.min(dA, dB);
  const count = d<3.5?3 : d<6.0?2 : 1;
  for(let j=0; j<count && li<NUM_LINES; j++){
    const target = sphereSurf(nearCenter, nearR);
    if(rng()<0.08){
      const dir = a.clone().sub(target).normalize();
      setLine(a, target.clone().add(dir.multiplyScalar(0.15+rng()*0.9)), 2);
    } else {
      setLine(a, target, 2);
    }
  }
}

// ── PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 4.8;
let webCount=0, attempts=0;
while(webCount<4800 && li<NUM_LINES && attempts<35000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<10; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 3);
  webCount++;
}

// ── DENDRITIC BRANCHES — short Y-forking chains
for(let i=0; i<120 && li<NUM_LINES-6; i++){
  const root = anchors[Math.floor(rng()*anchors.length)];
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.4+rng()*0.7;
  let cur = root.clone();
  for(let g=0; g<3 && li<NUM_LINES; g++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen*(0.7**g)));
    dir.x+=(rng()-0.5)*0.8; dir.y+=(rng()-0.5)*0.5; dir.z+=(rng()-0.5)*0.8;
    dir.normalize();
    if(Math.abs(next.x)<hw && Math.abs(next.y)<hh && Math.abs(next.z)<hd){
      setLine(cur, next, 3);
      if(g===1 && rng()>0.5){
        const fd=dir.clone(); fd.x+=(rng()-0.5)*1.2; fd.z+=(rng()-0.5)*1.2; fd.normalize();
        setLine(cur, cur.clone().add(fd.multiplyScalar(segLen*0.3)), 3);
      }
      cur=next;
    }
  }
}

// ── RADIAL FILAMENTS from each sphere
for(const [center, r] of [[sphereA, rA],[sphereB, rB]]){
  for(let i=0; i<500 && li<NUM_LINES; i++){
    const sp = sphereSurf(center, r);
    const dir = sp.clone().sub(center).normalize();
    dir.x+=(rng()-0.5)*0.25; dir.y+=(rng()-0.5)*0.25; dir.z+=(rng()-0.5)*0.25;
    dir.normalize();
    const len = 1.2+rng()*3.5;
    const end = sp.clone().add(dir.multiplyScalar(len));
    if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
      setLine(sp, end, 3);
    }
  }
}

// ── FILL remaining with wall spans
while(li<NUM_LINES){
  const a=wallPt();
  const t=rng();
  const b = t<0.2 ? sphereSurf(sphereA,rA) : t<0.4 ? sphereSurf(sphereB,rB) : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single arterial red, category-differentiated opacity
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.11, 0.08, 0.06, 0.04];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0-d*0.025);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  const warmShift = d<3.0 ? 0.015*(1.0-d/3.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.35;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.09,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// ── CAMERA PATH — a journey between two homes
// Narrative: discover sphere A in darkness → travel through the bridge →
// arrive at sphere B → orbit the gap between → descend into the web →
// rise to see both suspended above → recede into the dark room
const pathLen = 3000;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.08){
    // Approach sphere A from darkness
    const lt=t/0.08;
    x = sphereA.x-9.0+lt*3.5;
    y = sphereA.y+2.5-lt*1.0;
    z = sphereA.z+5.0-lt*1.5;
  } else if(t<0.20){
    // Orbit sphere A close — discovering the first home
    const lt=(t-0.08)/0.12;
    const rH=3.2+Math.sin(lt*Math.PI)*0.3;
    const angle=lt*Math.PI*1.1-0.5;
    x = sphereA.x+Math.cos(angle)*rH;
    y = sphereA.y+0.4+Math.sin(lt*Math.PI*0.6)*0.7;
    z = sphereA.z+Math.sin(angle)*rH;
  } else if(t<0.28){
    // Hold — contemplation of A, threads crossing vision
    const lt=(t-0.20)/0.08;
    x = sphereA.x+Math.sin(lt*0.3+1.5)*3.0;
    y = sphereA.y+0.3;
    z = sphereA.z+Math.cos(lt*0.3+1.5)*2.8;
  } else if(t<0.45){
    // TRAVERSE THE BRIDGE — the journey between homes
    // Camera travels along the thread axis from A to B
    const lt=(t-0.28)/0.17;
    const eased = lt*lt*(3-2*lt); // smoothstep
    const pos = sphereA.clone().lerp(sphereB, eased);
    // Spiral slightly around the axis
    const perp = new THREE.Vector3(0,1,0).cross(sphereB.clone().sub(sphereA).normalize()).normalize();
    const perp2 = sphereB.clone().sub(sphereA).normalize().cross(perp).normalize();
    const spiralR = 2.8+Math.sin(lt*Math.PI)*1.2;
    const spiralA = lt*Math.PI*2.5;
    x = pos.x + perp.x*Math.cos(spiralA)*spiralR + perp2.x*Math.sin(spiralA)*spiralR;
    y = pos.y + Math.cos(spiralA)*spiralR*0.4 + 0.5;
    z = pos.z + perp.z*Math.cos(spiralA)*spiralR + perp2.z*Math.sin(spiralA)*spiralR;
  } else if(t<0.57){
    // Arrive at sphere B — the other home
    const lt=(t-0.45)/0.12;
    const rH=3.0+Math.sin(lt*Math.PI)*0.4;
    const angle=lt*Math.PI*1.0+2.0;
    x = sphereB.x+Math.cos(angle)*rH;
    y = sphereB.y+0.3+Math.sin(lt*Math.PI*0.5)*0.6;
    z = sphereB.z+Math.sin(angle)*rH;
  } else if(t<0.67){
    // Orbit the midpoint — seeing BOTH spheres, the space between
    const lt=(t-0.57)/0.10;
    const rH=5.5;
    const angle=lt*Math.PI*0.8+3.5;
    x = midpoint.x+Math.cos(angle)*rH;
    y = midpoint.y+1.5+lt*1.5;
    z = midpoint.z+Math.sin(angle)*rH;
  } else if(t<0.76){
    // Descend below — look up through the web at both moons
    const lt=(t-0.67)/0.09;
    x = midpoint.x+Math.sin(lt*0.5+4.0)*3.5;
    y = midpoint.y-lt*6.0;
    z = midpoint.z+Math.cos(lt*0.5+4.0)*3.5;
  } else if(t<0.87){
    // Rise through threads — the web as atmosphere
    const lt=(t-0.76)/0.11;
    x = midpoint.x+Math.sin(lt*Math.PI+4.5)*2.5;
    y = midpoint.y-6.0+lt*14.0;
    z = midpoint.z+Math.cos(lt*Math.PI+4.5)*2.8;
  } else {
    // Recede — both spheres fade into the web's body
    const lt=(t-0.87)/0.13;
    const rH=5.0+lt*8.0;
    x = midpoint.x+Math.cos(lt*Math.PI*0.3+5.5)*rH;
    y = midpoint.y+8.0-lt*5.0;
    z = midpoint.z+Math.sin(lt*Math.PI*0.3+5.5)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
let lookTarget = midpoint.clone();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, near-imperceptible
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.03+basePositions[idx+1]*0.04+i*0.00015;
    const breath = Math.sin(elapsed*0.0007+phase)*0.00004;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.04;
      arr[vi+1] = basePositions[vi+1] + breath*0.025;
      arr[vi+2] = basePositions[vi+2] + breath*0.035;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000032;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target drifts between spheres based on proximity
  const dA = camera.position.distanceTo(sphereA);
  const dB = camera.position.distanceTo(sphereB);
  const blend = Math.max(0, Math.min(1, (dA-dB)/(dA+dB)*1.5+0.5));
  lookTarget.lerpVectors(sphereA, sphereB, blend);
  lookTarget.x += Math.sin(elapsed*0.00015)*0.04;
  lookTarget.y += Math.cos(elapsed*0.00013)*0.05;
  camera.lookAt(lookTarget);

  // Light breathing
  warmL.intensity = 0.01+Math.sin(elapsed*0.00007)*0.003;
  glowA.intensity = 0.007+Math.sin(elapsed*0.00006)*0.002;
  glowB.intensity = 0.006+Math.sin(elapsed*0.00008+1.5)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
