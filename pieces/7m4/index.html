<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7m4 · suminagashi marbling field</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede0; overflow:hidden;
               color:#2a2520; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">7m4</div>
<div class="hint">drag to comb · surface tension ink</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
camera.position.z = 1;
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede0, 1);
document.body.appendChild(renderer.domElement);

// Fluid grid resolution
const RES = 512;
const dt = 0.016;

// Ping-pong render targets for velocity and dye
const rtOptions = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: THREE.FloatType, format: THREE.RGBAFormat };
let velocityRT0 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let velocityRT1 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let dyeRT0 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let dyeRT1 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);

const quadGeom = new THREE.PlaneGeometry(2, 2);

// Initialize dye field with concentric rings (Suminagashi signature)
const initDyeMat = new THREE.ShaderMaterial({
  uniforms: { uSeed: { value: Math.random() * 100 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uSeed;
    void main(){
      vec2 p = vUv * 2.0 - 1.0;
      float d = length(p);
      float rings = sin(d * 35.0 + uSeed);
      // Traditional Suminagashi: black ink on cream
      float ink = smoothstep(0.0, 0.06, rings);
      // Layered rings with slight offset
      float rings2 = sin(d * 28.0 + uSeed * 1.3 + 0.7);
      float ink2 = smoothstep(0.0, 0.08, rings2);
      // Combine two ink drops
      float combined = max(ink, ink2 * 0.6);
      // Traditional palette: indigo/black on cream, ebru accent colors
      vec3 indigo = vec3(0.15, 0.20, 0.35);
      vec3 rust = vec3(0.78, 0.32, 0.18);
      vec3 ochre = vec3(0.85, 0.65, 0.25);
      vec3 cream = vec3(0.96, 0.93, 0.88);
      float k = fract(d * 12.0 + uSeed * 0.5);
      vec3 col = cream;
      if (combined > 0.5) {
        if (k < 0.33) col = indigo;
        else if (k < 0.66) col = rust;
        else col = ochre;
      }
      gl_FragColor = vec4(col, combined);
    }
  `
});
const initQuad = new THREE.Mesh(quadGeom, initDyeMat);
const initScene = new THREE.Scene();
initScene.add(initQuad);
renderer.setRenderTarget(dyeRT0);
renderer.render(initScene, camera);
renderer.setRenderTarget(null);

// Advection shader (semi-Lagrangian)
const advectMat = new THREE.ShaderMaterial({
  uniforms: {
    uField: { value: null },
    uVelocity: { value: null },
    uDt: { value: dt },
    uRes: { value: RES }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D uField;
    uniform sampler2D uVelocity;
    uniform float uDt;
    uniform float uRes;
    void main(){
      vec2 vel = texture2D(uVelocity, vUv).xy;
      vec2 backTrace = vUv - vel * uDt;
      gl_FragColor = texture2D(uField, backTrace);
    }
  `
});

// Add velocity impulse (drag stylus)
const addImpulseMat = new THREE.ShaderMaterial({
  uniforms: {
    uVelocity: { value: null },
    uPoint: { value: new THREE.Vector2(0.5, 0.5) },
    uForce: { value: new THREE.Vector2(0, 0) },
    uRadius: { value: 0.02 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform vec2 uPoint;
    uniform vec2 uForce;
    uniform float uRadius;
    void main(){
      vec2 vel = texture2D(uVelocity, vUv).xy;
      float d = length(vUv - uPoint);
      float splat = exp(-d * d / (uRadius * uRadius));
      vel += uForce * splat;
      gl_FragColor = vec4(vel, 0.0, 1.0);
    }
  `
});

// Decay velocity (minimal, keep ink boundaries sharp — no viscosity diffusion)
const decayMat = new THREE.ShaderMaterial({
  uniforms: {
    uVelocity: { value: null },
    uDecay: { value: 0.996 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D uVelocity;
    uniform float uDecay;
    void main(){
      vec2 vel = texture2D(uVelocity, vUv).xy;
      gl_FragColor = vec4(vel * uDecay, 0.0, 1.0);
    }
  `
});

const advectQuad = new THREE.Mesh(quadGeom, advectMat);
const impulseQuad = new THREE.Mesh(quadGeom, addImpulseMat);
const decayQuad = new THREE.Mesh(quadGeom, decayMat);
const fluidScene = new THREE.Scene();

// Display the dye field in 3D, slightly tilted as if viewing paper surface
const displayScene = new THREE.Scene();
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    uDye: { value: dyeRT0.texture },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vUv = uv;
      // Slight wave distortion to suggest fluid surface
      vec3 p = position;
      float wave = sin(uv.x * 6.28 + uTime * 0.3) * 0.01 + sin(uv.y * 8.0 + uTime * 0.4) * 0.008;
      p.z += wave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D uDye;
    void main(){
      vec4 dye = texture2D(uDye, vUv);
      gl_FragColor = vec4(dye.rgb, 1.0);
    }
  `
});
const displayPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2, 32, 32), displayMat);
displayScene.add(displayPlane);

// Tilt the display plane slightly
displayPlane.rotation.x = -0.15;
displayPlane.rotation.z = 0.05;
const displayCamera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 10);
displayCamera.position.set(0, 0.3, 2.5);
displayCamera.lookAt(0, 0, 0);

// Mouse interaction
let mouseDown = false;
let lastMouse = new THREE.Vector2();
let currentMouse = new THREE.Vector2();
addEventListener('mousedown', (e) => {
  mouseDown = true;
  lastMouse.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  currentMouse.copy(lastMouse);
});
addEventListener('mousemove', (e) => {
  if (mouseDown) {
    currentMouse.set(e.clientX / innerWidth, 1 - e.clientY / innerHeight);
  }
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('touchstart', (e) => {
  mouseDown = true;
  const t = e.touches[0];
  lastMouse.set(t.clientX / innerWidth, 1 - t.clientY / innerHeight);
  currentMouse.copy(lastMouse);
  e.preventDefault();
}, { passive: false });
addEventListener('touchmove', (e) => {
  if (mouseDown && e.touches.length > 0) {
    const t = e.touches[0];
    currentMouse.set(t.clientX / innerWidth, 1 - t.clientY / innerHeight);
  }
  e.preventDefault();
}, { passive: false });
addEventListener('touchend', () => { mouseDown = false; });

addEventListener('resize', () => {
  displayCamera.aspect = innerWidth/innerHeight;
  displayCamera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  displayMat.uniforms.uTime.value = t;

  // Gentle autonomous drift (ambient flow field)
  const ambientX = Math.sin(t * 0.3) * 0.0008;
  const ambientY = Math.cos(t * 0.4) * 0.0006;
  addImpulseMat.uniforms.uVelocity.value = velocityRT0.texture;
  addImpulseMat.uniforms.uPoint.value.set(0.5 + Math.sin(t * 0.5) * 0.2, 0.5 + Math.cos(t * 0.7) * 0.2);
  addImpulseMat.uniforms.uForce.value.set(ambientX, ambientY);
  addImpulseMat.uniforms.uRadius.value = 0.08;
  fluidScene.clear();
  fluidScene.add(impulseQuad);
  renderer.setRenderTarget(velocityRT1);
  renderer.render(fluidScene, camera);
  [velocityRT0, velocityRT1] = [velocityRT1, velocityRT0];

  // User drag impulse
  if (mouseDown) {
    const delta = new THREE.Vector2().subVectors(currentMouse, lastMouse);
    if (delta.length() > 0.0001) {
      addImpulseMat.uniforms.uVelocity.value = velocityRT0.texture;
      addImpulseMat.uniforms.uPoint.value.copy(currentMouse);
      addImpulseMat.uniforms.uForce.value.copy(delta).multiplyScalar(0.5);
      addImpulseMat.uniforms.uRadius.value = 0.03;
      fluidScene.clear();
      fluidScene.add(impulseQuad);
      renderer.setRenderTarget(velocityRT1);
      renderer.render(fluidScene, camera);
      [velocityRT0, velocityRT1] = [velocityRT1, velocityRT0];
    }
    lastMouse.copy(currentMouse);
  }

  // Decay velocity
  decayMat.uniforms.uVelocity.value = velocityRT0.texture;
  fluidScene.clear();
  fluidScene.add(decayQuad);
  renderer.setRenderTarget(velocityRT1);
  renderer.render(fluidScene, camera);
  [velocityRT0, velocityRT1] = [velocityRT1, velocityRT0];

  // Advect velocity
  advectMat.uniforms.uField.value = velocityRT0.texture;
  advectMat.uniforms.uVelocity.value = velocityRT0.texture;
  fluidScene.clear();
  fluidScene.add(advectQuad);
  renderer.setRenderTarget(velocityRT1);
  renderer.render(fluidScene, camera);
  [velocityRT0, velocityRT1] = [velocityRT1, velocityRT0];

  // Advect dye (NO diffusion — sharp boundaries)
  advectMat.uniforms.uField.value = dyeRT0.texture;
  advectMat.uniforms.uVelocity.value = velocityRT0.texture;
  fluidScene.clear();
  fluidScene.add(advectQuad);
  renderer.setRenderTarget(dyeRT1);
  renderer.render(fluidScene, camera);
  [dyeRT0, dyeRT1] = [dyeRT1, dyeRT0];

  // Display
  displayMat.uniforms.uDye.value = dyeRT0.texture;
  renderer.setRenderTarget(null);
  renderer.render(displayScene, displayCamera);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;

  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
