<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x82 · Delivery Dancer's Sphere</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background: linear-gradient(180deg, #1a1f26 0%, #0d1117 60%, #050709 100%);
    color: #cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background: radial-gradient(ellipse 120% 60% at 50% -10%, rgba(180,255,210,0.08), transparent 50%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; font-family: ui-monospace; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">x82 · Delivery Dancer's Sphere — Ayoung Kim / speculative cartography / courier-path heatmap</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Ayoung Kim: fictive city from above, courier trails as glowing graph paths
// Voronoi building footprints, wireframe extrusions, AI-courier particles traverse
// the street network — their trails accumulate into a heatmap of navigated routes.
// High-angle orbital camera, chartreuse + magenta on slate, low city hum.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1117, 8, 28);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 18, 14);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1117);
document.body.appendChild(renderer.domElement);

// ──────────────────────────────── CITY GRAPH: Voronoi building footprints
const N_BUILDINGS = 60;
const CITY_RADIUS = 10;
const sites = [];
for (let i = 0; i < N_BUILDINGS; i++){
  const r = Math.sqrt(Math.random()) * CITY_RADIUS;
  const th = Math.random() * Math.PI * 2;
  sites.push({ x: r * Math.cos(th), y: r * Math.sin(th), idx: i });
}

// Delaunay edges form the street graph
function distSq(a, b){ return (a.x - b.x)**2 + (a.y - b.y)**2; }
const edges = [];
for (let i = 0; i < sites.length; i++){
  for (let j = i + 1; j < sites.length; j++){
    const d = Math.sqrt(distSq(sites[i], sites[j]));
    if (d < 3.5) edges.push({ a: i, b: j, len: d });
  }
}

// Buildings: wireframe box extrusions
const buildingGroup = new THREE.Group();
sites.forEach((s, i) => {
  const h = 0.4 + Math.random() * 1.8;
  const w = 0.3 + Math.random() * 0.4;
  const geom = new THREE.BoxGeometry(w, h, w);
  const edges = new THREE.EdgesGeometry(geom);
  const mat = new THREE.LineBasicMaterial({ color: 0x3a4a5a, transparent: true, opacity: 0.55 });
  const mesh = new THREE.LineSegments(edges, mat);
  mesh.position.set(s.x, h * 0.5, s.y);
  buildingGroup.add(mesh);
});
scene.add(buildingGroup);

// Street graph: static wireframe
const streetGeom = new THREE.BufferGeometry();
const streetPos = [];
edges.forEach(e => {
  const a = sites[e.a], b = sites[e.b];
  streetPos.push(a.x, 0.02, a.y);
  streetPos.push(b.x, 0.02, b.y);
});
streetGeom.setAttribute('position', new THREE.Float32BufferAttribute(streetPos, 3));
const streetMat = new THREE.LineBasicMaterial({ color: 0x2a3540, transparent: true, opacity: 0.35 });
const streetLines = new THREE.LineSegments(streetGeom, streetMat);
scene.add(streetLines);

// Ground plane: misty dark terrain
const groundGeom = new THREE.PlaneGeometry(CITY_RADIUS * 2.6, CITY_RADIUS * 2.6, 40, 40);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshBasicMaterial({ 
  color: 0x0a0f14, 
  transparent: true, 
  opacity: 0.75,
  side: THREE.DoubleSide
});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.y = -0.05;
scene.add(ground);

// ──────────────────────────────── COURIER PARTICLES
const N_COURIERS = 180;
const couriers = [];
for (let i = 0; i < N_COURIERS; i++){
  const start = sites[Math.floor(Math.random() * sites.length)];
  const end = sites[Math.floor(Math.random() * sites.length)];
  if (start.idx === end.idx) continue;
  // Find path (simple: direct edge if exists, else via nearest common neighbor)
  let path = [start];
  const hasDirectEdge = edges.some(e => 
    (e.a === start.idx && e.b === end.idx) || (e.a === end.idx && e.b === start.idx)
  );
  if (hasDirectEdge){
    path.push(end);
  } else {
    // route via nearest neighbor
    let nearest = null;
    let minD = Infinity;
    sites.forEach(s => {
      if (s.idx === start.idx || s.idx === end.idx) return;
      const d1 = distSq(start, s);
      const d2 = distSq(end, s);
      if (d1 < 12 && d2 < 12 && d1 + d2 < minD){
        minD = d1 + d2;
        nearest = s;
      }
    });
    if (nearest){
      path.push(nearest);
      path.push(end);
    } else {
      path.push(end);
    }
  }
  couriers.push({
    path,
    segIdx: 0,
    t: Math.random(),
    speed: 0.15 + Math.random() * 0.20,
    color: Math.random() < 0.5 ? 0xb4ffd2 : 0xff69b4, // chartreuse / magenta
    trail: []
  });
}

// Trail line geometry
const MAX_TRAIL = 1200;
const trailPos = new Float32Array(MAX_TRAIL * 3);
const trailColors = new Float32Array(MAX_TRAIL * 3);
const trailGeom = new THREE.BufferGeometry();
trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeom.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
const trailMat = new THREE.LineBasicMaterial({ 
  vertexColors: true, 
  transparent: true, 
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const trailLines = new THREE.LineSegments(trailGeom, trailMat);
scene.add(trailLines);

let trailWriteIdx = 0;

function updateCouriers(dt){
  couriers.forEach(c => {
    if (c.segIdx >= c.path.length - 1){
      // restart
      c.segIdx = 0;
      c.t = 0;
      const start = sites[Math.floor(Math.random() * sites.length)];
      const end = sites[Math.floor(Math.random() * sites.length)];
      c.path = [start];
      const hasDirectEdge = edges.some(e => 
        (e.a === start.idx && e.b === end.idx) || (e.a === end.idx && e.b === end.idx)
      );
      if (hasDirectEdge){
        c.path.push(end);
      } else {
        let nearest = null;
        let minD = Infinity;
        sites.forEach(s => {
          if (s.idx === start.idx || s.idx === end.idx) return;
          const d1 = distSq(start, s);
          const d2 = distSq(end, s);
          if (d1 < 12 && d2 < 12 && d1 + d2 < minD){
            minD = d1 + d2;
            nearest = s;
          }
        });
        if (nearest){
          c.path.push(nearest);
          c.path.push(end);
        } else {
          c.path.push(end);
        }
      }
      return;
    }
    const prev = c.trail[c.trail.length - 1];
    const a = c.path[c.segIdx];
    const b = c.path[c.segIdx + 1];
    c.t += c.speed * dt;
    if (c.t >= 1.0){
      c.t = 0;
      c.segIdx++;
      if (c.segIdx >= c.path.length - 1) return;
    }
    const x = a.x + (b.x - a.x) * c.t;
    const z = a.y + (b.y - a.y) * c.t;
    const y = 0.08;
    const curr = { x, y, z };
    if (prev){
      const dx = curr.x - prev.x;
      const dy = curr.y - prev.y;
      const dz = curr.z - prev.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist > 0.05){
        // write trail segment
        const col = new THREE.Color(c.color);
        trailPos[trailWriteIdx * 3] = prev.x;
        trailPos[trailWriteIdx * 3 + 1] = prev.y;
        trailPos[trailWriteIdx * 3 + 2] = prev.z;
        trailColors[trailWriteIdx * 3] = col.r;
        trailColors[trailWriteIdx * 3 + 1] = col.g;
        trailColors[trailWriteIdx * 3 + 2] = col.b;
        trailWriteIdx++;
        if (trailWriteIdx >= MAX_TRAIL / 2) trailWriteIdx = 0;
        trailPos[trailWriteIdx * 3] = curr.x;
        trailPos[trailWriteIdx * 3 + 1] = curr.y;
        trailPos[trailWriteIdx * 3 + 2] = curr.z;
        trailColors[trailWriteIdx * 3] = col.r;
        trailColors[trailWriteIdx * 3 + 1] = col.g;
        trailColors[trailWriteIdx * 3 + 2] = col.b;
        trailWriteIdx++;
        if (trailWriteIdx >= MAX_TRAIL / 2) trailWriteIdx = 0;
        trailGeom.attributes.position.needsUpdate = true;
        trailGeom.attributes.color.needsUpdate = true;
        c.trail.push(curr);
        if (c.trail.length > 80) c.trail.shift();
      }
    } else {
      c.trail.push(curr);
    }
  });
}

// ──────────────────────────────── AMBIENT PARTICLE MOTES (volumetric city hum)
const N_MOTES = 400;
const motesGeom = new THREE.BufferGeometry();
const motesPos = new Float32Array(N_MOTES * 3);
const motesSeed = new Float32Array(N_MOTES);
for (let i = 0; i < N_MOTES; i++){
  motesPos[i*3] = (Math.random() - 0.5) * CITY_RADIUS * 2.5;
  motesPos[i*3 + 1] = Math.random() * 8;
  motesPos[i*3 + 2] = (Math.random() - 0.5) * CITY_RADIUS * 2.5;
  motesSeed[i] = Math.random();
}
motesGeom.setAttribute('position', new THREE.BufferAttribute(motesPos, 3));
motesGeom.setAttribute('seed', new THREE.BufferAttribute(motesSeed, 1));
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const motesMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.12 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 20.0) * 0.3;
      p.z += cos(t * 0.9 + seed * 15.0) * 0.3;
      p.y -= mod(uTime * 0.05 + seed * 5.0, 8.0);
      vAlpha = 0.15 + 0.25 * sin(t * 2.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + 0.6 * vAlpha) * uPixel * (3.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0);
      vec3 col = vec3(0.70, 0.82, 0.78);
      gl_FragColor = vec4(col, a * vAlpha * 0.5);
    }
  `
});
const motes = new THREE.Points(motesGeom, motesMat);
scene.add(motes);

// ──────────────────────────────── ANIMATION
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = start;
function loop(now){
  const t = (now - start) / 1000;
  const dt = (now - lastT) / 1000;
  lastT = now;
  uniforms.uTime.value = t;
  updateCouriers(dt);
  // slow orbital drift, high-angle view
  const orbitR = 20;
  const orbitSpeed = 0.08;
  camera.position.x = Math.cos(t * orbitSpeed) * orbitR;
  camera.position.z = Math.sin(t * orbitSpeed) * orbitR;
  camera.position.y = 16 + Math.sin(t * 0.05) * 2;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(start);
</script>
</body>
