<!-- MOTION: drift, intensity: calm -->

  body {
    background: linear-gradient(180deg, #1a1f26 0%, #0d1117 60%, #050709 100%);

<body>
<div class="id">x82 · Delivery Dancer's Sphere — Ayoung Kim / speculative cartography / courier-path heatmap</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Ayoung Kim: fictive city from above, courier trails as glowing graph paths
// Voronoi building footprints, wireframe extrusions, AI-courier particles traverse
// the street network — their trails accumulate into a heatmap of navigated routes.
// High-angle orbital camera, chartreuse + magenta on slate, low city hum.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1117, 8, 28);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 18, 14);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d1117);
document.body.appendChild(renderer.domElement);

// ──────────────────────────────── CITY GRAPH: Voronoi building footprints
const N_BUILDINGS = 60;
const CITY_RADIUS = 10;
const sites = [];
for (let i = 0; i < N_BUILDINGS; i++){
  const r = Math.sqrt(Math.random()) * CITY_RADIUS;
  const th = Math.random() * Math.PI * 2;
  sites.push({ x: r * Math.cos(th), y: r * Math.sin(th), idx: i });
}

// Delaunay edges form the street graph
function distSq(a, b){ return (a.x - b.x)**2 + (a.y - b.y)**2; }
const edges = [];
for (let i = 0; i < sites.length; i++){
  for (let j = i + 1; j < sites.length; j++){
    const d = Math.sqrt(distSq(sites[i], sites[j]));
    if (d < 3.5) edges.push({ a: i, b: j, len: d });
  }
}

// Buildings: wireframe box extrusions
const buildingGroup = new THREE.Group();
sites.forEach((s, i) => {
  const h = 0.4 + Math.random() * 1.8;
  const w = 0.3 + Math.random() * 0.4;
  const geom = new THREE.BoxGeometry(w, h, w);
  const edges = new THREE.EdgesGeometry(geom);
  const mat = new THREE.LineBasicMaterial({ color: 0x3a4a5a, transparent: true, opacity: 0.55 });
  const mesh = new THREE.LineSegments(edges, mat);
  mesh.position.set(s.x, h * 0.5, s.y);
  buildingGroup.add(mesh);
});
scene.add(buildingGroup);

// Street graph: static wireframe
const streetGeom = new THREE.BufferGeometry();
const streetPos = [];
edges.forEach(e => {
  const a = sites[e.a], b = sites[e.b];
  streetPos.push(a.x, 0.02, a.y);
  streetPos.push(b.x, 0.02, b.y);
});
streetGeom.setAttribute('position', new THREE.Float32BufferAttribute(streetPos, 3));
const streetMat = new THREE.LineBasicMaterial({ color: 0x2a3540, transparent: true, opacity: 0.35 });
const streetLines = new THREE.LineSegments(streetGeom, streetMat);
scene.add(streetLines);

// Ground plane: misty dark terrain
const groundGeom = new THREE.PlaneGeometry(CITY_RADIUS * 2.6, CITY_RADIUS * 2.6, 40, 40);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshBasicMaterial({ 
  color: 0x0a0f14, 
  transparent: true, 
  opacity: 0.75,
  side: THREE.DoubleSide
});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.y = -0.05;
scene.add(ground);

// ──────────────────────────────── COURIER PARTICLES
const N_COURIERS = 180;
const couriers = [];
for (let i = 0; i < N_COURIERS; i++){
  const start = sites[Math.floor(Math.random() * sites.length)];
  const end = sites[Math.floor(Math.random() * sites.length)];
  if (start.idx === end.idx) continue;
  // Find path (simple: direct edge if exists, else via nearest common neighbor)
  let path = [start];
  const hasDirectEdge = edges.some(e => 
    (e.a === start.idx && e.b === end.idx) || (e.a === end.idx && e.b === start.idx)
  );
  if (hasDirectEdge){
    path.push(end);
  } else {
    // route via nearest neighbor
    let nearest = null;
    let minD = Infinity;
    sites.forEach(s => {
      if (s.idx === start.idx || s.idx === end.idx) return;
      const d1 = distSq(start, s);
      const d2 = distSq(end, s);
      if (d1 < 12 && d2 < 12 && d1 + d2 < minD){
        minD = d1 + d2;
        nearest = s;
      }
    });
    if (nearest){
      path.push(nearest);
      path.push(end);
    } else {
      path.push(end);
    }
  }
  couriers.push({
    path,
    segIdx: 0,
    t: Math.random(),
    speed: 0.15 + Math.random() * 0.20,
    color: Math.random() < 0.5 ? 0xb4ffd2 : 0xff69b4, // chartreuse / magenta
    trail: []
  });
}

// Trail line geometry
const MAX_TRAIL = 1200;
const trailPos = new Float32Array(MAX_TRAIL * 3);
const trailColors = new Float32Array(MAX_TRAIL * 3);
const trailGeom = new THREE.BufferGeometry();
trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeom.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
const trailMat = new THREE.LineBasicMaterial({ 
  vertexColors: true, 
  transparent: true, 
  opacity: 0.75,
  blending: THREE.AdditiveBlending
});
const trailLines = new THREE.LineSegments(trailGeom, trailMat);
scene.add(trailLines);

let trailWriteIdx = 0;

function updateCouriers(dt){
  couriers.forEach(c => {
    if (c.segIdx >= c.path.length - 1){
      // restart
      c.segIdx = 0;
      c.t = 0;
      const start = sites[Math.floor(Math.random() * sites.length)];
      const end = sites[Math.floor(Math.random() * sites.length)];
      c.path = [start];
      const hasDirectEdge = edges.some(e => 
        (e.a === start.idx && e.b === end.idx) || (e.a === end.idx && e.b === end.idx)
      );
      if (hasDirectEdge){
        c.path.push(end);
      } else {
        let nearest = null;
        let minD = Infinity;
        sites.forEach(s => {
          if (s.idx === start.idx || s.idx === end.idx) return;
          const d1 = distSq(start, s);
          const d2 = distSq(end, s);
          if (d1 < 12 && d2 < 12 && d1 + d2 < minD){
            minD = d1 + d2;
            nearest = s;
          }
        });
        if (nearest){
          c.path.push(nearest);
          c.path.push(end);
        } else {
          c.path.push(end);
        }
      }
      return;
    }
    const prev = c.trail[c.trail.length - 1];
    const a = c.path[c.segIdx];
    const b = c.path[c.segIdx + 1];
    c.t += c.speed * dt;
    if (c.t >= 1.0){
      c.t = 0;
      c.segIdx++;
      if (c.segIdx >= c.path.length - 1) return;
    }
    const x = a.x + (b.x - a.x) * c.t;
    const z = a.y + (b.y - a.y) * c.t;
    const y = 0.08;
    const curr = { x, y, z };
    if (prev){
      const dx = curr.x - prev.x;
      const dy = curr.y - prev.y;
      const dz = curr.z - prev.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist > 0.05){
        // write trail segment
        const col = new THREE.Color(c.color);
        trailPos[trailWriteIdx * 3] = prev.x;
        trailPos[trailWriteIdx * 3 + 1] = prev.y;
        trailPos[trailWriteIdx * 3 + 2] = prev.z;
        trailColors[trailWriteIdx * 3] = col.r;
        trailColors[trailWriteIdx * 3 + 1] = col.g;
        trailColors[trailWriteIdx * 3 + 2] = col.b;
        trailWriteIdx++;
        if (trailWriteIdx >= MAX_TRAIL / 2) trailWriteIdx = 0;
        trailPos[trailWriteIdx * 3] = curr.x;
        trailPos[trailWriteIdx * 3 + 1] = curr.y;
        trailPos[trailWriteIdx * 3 + 2] = curr.z;
        trailColors[trailWriteIdx * 3] = col.r;
        trailColors[trailWriteIdx * 3 + 1] = col.g;
        trailColors[trailWriteIdx * 3 + 2] = col.b;
        trailWriteIdx++;
        if (trailWriteIdx >= MAX_TRAIL / 2) trailWriteIdx = 0;
        trailGeom.attributes.position.needsUpdate = true;
        trailGeom.attributes.color.needsUpdate = true;
        c.trail.push(curr);
        if (c.trail.length > 80) c.trail.shift();
      }
    } else {
      c.trail.push(curr);
    }
  });
}

// ──────────────────────────────── AMBIENT PARTICLE MOTES (volumetric city hum)
const N_MOTES = 400;
const motesGeom = new THREE.BufferGeometry();
const motesPos = new Float32Array(N_MOTES * 3);
const motesSeed = new Float32Array(N_MOTES);
for (let i = 0; i < N_MOTES; i++){
  motesPos[i*3] = (Math.random() - 0.5) * CITY_RADIUS * 2.5;
  motesPos[i*3 + 1] = Math.random() * 8;
  motesPos[i*3 + 2] = (Math.random() - 0.5) * CITY_RADIUS * 2.5;
  motesSeed[i] = Math.random();
}
motesGeom.setAttribute('position', new THREE.BufferAttribute(motesPos, 3));
motesGeom.setAttribute('seed', new THREE.BufferAttribute(motesSeed, 1));
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const motesMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.12 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 20.0) * 0.3;
      p.z += cos(t * 0.9 + seed * 15.0) * 0.3;
      p.y -= mod(uTime * 0.05 + seed * 5.0, 8.0);
      vAlpha = 0.15 + 0.25 * sin(t * 2.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + 0.6 * vAlpha) * uPixel * (3.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0);
      vec3 col = vec3(0.70, 0.82, 0.78);
      gl_FragColor = vec4(col, a * vAlpha * 0.5);
    }
  `
});
const motes = new THREE.Points(motesGeom, motesMat);
scene.add(motes);

// ──────────────────────────────── ANIMATION
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = start;
function loop(now){
  const t = (now - start) / 1000;
  const dt = (now - lastT) / 1000;
  lastT = now;
  uniforms.uTime.value = t;
  updateCouriers(dt);
  // slow orbital drift, high-angle view
  const orbitR = 20;
  const orbitSpeed = 0.08;
  camera.position.x = Math.cos(t * orbitSpeed) * orbitR;
  camera.position.z = Math.sin(t * orbitSpeed) * orbitR;
  camera.position.y = 16 + Math.sin(t * 0.05) * 2;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(start);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
