<title>w1f · hash-seed choreography · cryptographic dance</title>
<!-- MOTION: sway, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0604; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .hash  { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 9px; 
           letter-spacing: 0.08em; font-family: monospace; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">w1f · hash-seed choreography</div>
<div class="hint">click to regenerate · cryptographic dance</div>
<div class="hash" id="hashDisplay"></div>
<div class="src">lumen prize 2023 · operator · on-chain motion</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Human-readable choreography derived from 256-bit hash seed.
// 5 skeletal dancers, each 8 joints, spring-coupled motion where ALL parameters
// (phase offset, amplitude, spring stiffness, rest angles) come from the seed.
// Click → new hash → instant re-choreograph. Stage cyclorama warm gradient.

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0604, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0604, 0.035);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 11);
camera.lookAt(0, 1.5, 0);

// cyclorama gradient backdrop (warm stage lighting)
const cycGeo = new THREE.PlaneGeometry(28, 16, 1, 1);
const cycMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  side: THREE.DoubleSide, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float y = vUv.y;
      vec3 bottom = vec3(0.85, 0.42, 0.18) * 0.12;
      vec3 top = vec3(0.08, 0.06, 0.04);
      vec3 col = mix(bottom, top, smoothstep(0.0, 0.7, y));
      // subtle time pulse
      col *= 0.95 + 0.05 * sin(uTime * 0.4);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const cyclorama = new THREE.Mesh(cycGeo, cycMat);
cyclorama.position.set(0, 4, -8);
scene.add(cyclorama);

// floor (dark stage)
const floorGeo = new THREE.PlaneGeometry(30, 20);
const floorMat = new THREE.MeshBasicMaterial({ color: 0x0d0806, side: THREE.DoubleSide });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
scene.add(floor);

// stage lights (warm points)
const light1 = new THREE.PointLight(0xffaa66, 1.2, 18);
light1.position.set(-5, 6, 3);
scene.add(light1);
const light2 = new THREE.PointLight(0xff9955, 1.0, 16);
light2.position.set(5, 5, 2);
scene.add(light2);
const ambLight = new THREE.AmbientLight(0x332211, 0.3);
scene.add(ambLight);

// ────────── hash-seeded RNG ──────────
let hashBytes = new Uint8Array(32);
function generateHash(){
  for (let i = 0; i < 32; i++) hashBytes[i] = Math.floor(Math.random() * 256);
}
generateHash();

let byteIdx = 0;
function hashFloat(){
  const b = hashBytes[byteIdx % 32];
  byteIdx++;
  return b / 255.0;
}
function hashRange(a, b){
  return a + hashFloat() * (b - a);
}

const hashDisplay = document.getElementById('hashDisplay');
function updateHashDisplay(){
  const hex = Array.from(hashBytes).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
  hashDisplay.textContent = `0x${hex}...`;
}
updateHashDisplay();

// ────────── skeleton structure ──────────
// 8 joints per figure: pelvis, spine_low, spine_mid, neck, head, l_shoulder, r_shoulder, crown
const JOINT_COUNT = 8;
const NUM_DANCERS = 5;

// rest-pose structure (local offsets)
const REST_STRUCTURE = [
  [0, 0, 0],          // 0: pelvis (root)
  [0, 0.35, 0],       // 1: spine_low
  [0, 0.70, 0],       // 2: spine_mid
  [0, 1.05, 0],       // 3: neck
  [0, 1.35, 0],       // 4: head
  [-0.25, 0.90, 0],   // 5: l_shoulder
  [0.25, 0.90, 0],    // 6: r_shoulder
  [0, 1.60, 0]        // 7: crown
];

// bone connections for rendering
const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4], [4, 7],  // spine chain
  [2, 5], [2, 6]                            // shoulders
];

class Dancer {
  constructor(xPos, seed){
    this.xPos = xPos;
    byteIdx = seed * 32 % 256;  // re-seed per dancer
    
    this.joints = [];
    for (let i = 0; i < JOINT_COUNT; i++){
      this.joints.push({
        pos: new THREE.Vector3(xPos + REST_STRUCTURE[i][0], REST_STRUCTURE[i][1], REST_STRUCTURE[i][2]),
        vel: new THREE.Vector3(0, 0, 0),
        restOffset: new THREE.Vector3(...REST_STRUCTURE[i]),
        phase: hashRange(0, Math.PI * 2),
        ampX: hashRange(0.02, 0.18),
        ampY: hashRange(0.02, 0.22),
        ampZ: hashRange(0.01, 0.12),
        freqX: hashRange(0.4, 1.8),
        freqY: hashRange(0.5, 2.0),
        freqZ: hashRange(0.3, 1.5),
        stiffness: hashRange(0.08, 0.25),
        damping: hashRange(0.85, 0.95)
      });
    }
    
    // line geometry for bones
    this.lineGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(BONES.length * 6);
    this.lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const lineMat = new THREE.LineBasicMaterial({ 
      color: 0xffddaa, 
      transparent: true, 
      opacity: 0.85,
      linewidth: 1
    });
    this.lineObj = new THREE.LineSegments(this.lineGeo, lineMat);
    scene.add(this.lineObj);
    
    // sphere joints
    this.jointMeshes = [];
    const jointGeo = new THREE.SphereGeometry(0.04, 8, 8);
    const jointMat = new THREE.MeshBasicMaterial({ color: 0xffcc88 });
    for (let i = 0; i < JOINT_COUNT; i++){
      const m = new THREE.Mesh(jointGeo, jointMat);
      this.jointMeshes.push(m);
      scene.add(m);
    }
  }
  
  update(t, dt){
    // phase-driven target positions (hash-seeded sinusoids)
    for (let i = 0; i < JOINT_COUNT; i++){
      const j = this.joints[i];
      const tx = this.xPos + j.restOffset.x + j.ampX * Math.sin(t * j.freqX + j.phase);
      const ty = j.restOffset.y + j.ampY * Math.sin(t * j.freqY + j.phase * 1.3);
      const tz = j.restOffset.z + j.ampZ * Math.sin(t * j.freqZ + j.phase * 0.7);
      
      const target = new THREE.Vector3(tx, ty, tz);
      const delta = target.clone().sub(j.pos);
      const force = delta.multiplyScalar(j.stiffness);
      
      j.vel.add(force.multiplyScalar(dt));
      j.vel.multiplyScalar(j.damping);
      j.pos.add(j.vel.clone().multiplyScalar(dt));
    }
    
    // spring coupling between adjacent joints (soft IK)
    for (let iter = 0; iter < 2; iter++){
      for (let i = 1; i < JOINT_COUNT; i++){
        const a = this.joints[i - 1];
        const b = this.joints[i];
        const d = b.pos.clone().sub(a.pos);
        const len = d.length();
        const restLen = a.restOffset.distanceTo(b.restOffset);
        if (len > 0.001){
          const correction = d.multiplyScalar((len - restLen) / len * 0.5);
          a.pos.add(correction.clone().multiplyScalar(0.3));
          b.pos.sub(correction.clone().multiplyScalar(0.3));
        }
      }
    }
    
    // update visuals
    const pos = this.lineGeo.attributes.position.array;
    for (let i = 0; i < BONES.length; i++){
      const [ai, bi] = BONES[i];
      const a = this.joints[ai].pos;
      const b = this.joints[bi].pos;
      pos[i*6]   = a.x; pos[i*6+1] = a.y; pos[i*6+2] = a.z;
      pos[i*6+3] = b.x; pos[i*6+4] = b.y; pos[i*6+5] = b.z;
    }
    this.lineGeo.attributes.position.needsUpdate = true;
    
    for (let i = 0; i < JOINT_COUNT; i++){
      this.jointMeshes[i].position.copy(this.joints[i].pos);
    }
  }
  
  dispose(){
    scene.remove(this.lineObj);
    this.lineGeo.dispose();
    this.jointMeshes.forEach(m => {
      scene.remove(m);
      m.geometry.dispose();
    });
  }
}

let dancers = [];
function createDancers(){
  dancers.forEach(d => d.dispose());
  dancers = [];
  byteIdx = 0;
  const spacing = 2.8;
  const startX = -(NUM_DANCERS - 1) * spacing / 2;
  for (let i = 0; i < NUM_DANCERS; i++){
    dancers.push(new Dancer(startX + i * spacing, i));
  }
}
createDancers();

addEventListener('click', () => {
  generateHash();
  updateHashDisplay();
  createDancers();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  
  cycMat.uniforms.uTime.value = t;
  
  dancers.forEach(d => d.update(t, dt));
  
  // subtle camera sway
  camera.position.x = Math.sin(t * 0.12) * 0.5;
  camera.position.y = 2.2 + Math.sin(t * 0.18) * 0.15;
  camera.lookAt(0, 1.5, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);

  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
