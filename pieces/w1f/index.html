<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w1f · hash-seed choreography · cryptographic dance</title>
<!-- MOTION: sway, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0604; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .hash  { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 9px; 
           letter-spacing: 0.08em; font-family: monospace; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">w1f · hash-seed choreography</div>
<div class="hint">click to regenerate · cryptographic dance</div>
<div class="hash" id="hashDisplay"></div>
<div class="src">lumen prize 2023 · operator · on-chain motion</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Human-readable choreography derived from 256-bit hash seed.
// 5 skeletal dancers, each 8 joints, spring-coupled motion where ALL parameters
// (phase offset, amplitude, spring stiffness, rest angles) come from the seed.
// Click → new hash → instant re-choreograph. Stage cyclorama warm gradient.

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0604, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0604, 0.035);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 11);
camera.lookAt(0, 1.5, 0);

// cyclorama gradient backdrop (warm stage lighting)
const cycGeo = new THREE.PlaneGeometry(28, 16, 1, 1);
const cycMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  side: THREE.DoubleSide, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float y = vUv.y;
      vec3 bottom = vec3(0.85, 0.42, 0.18) * 0.12;
      vec3 top = vec3(0.08, 0.06, 0.04);
      vec3 col = mix(bottom, top, smoothstep(0.0, 0.7, y));
      // subtle time pulse
      col *= 0.95 + 0.05 * sin(uTime * 0.4);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const cyclorama = new THREE.Mesh(cycGeo, cycMat);
cyclorama.position.set(0, 4, -8);
scene.add(cyclorama);

// floor (dark stage)
const floorGeo = new THREE.PlaneGeometry(30, 20);
const floorMat = new THREE.MeshBasicMaterial({ color: 0x0d0806, side: THREE.DoubleSide });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
scene.add(floor);

// stage lights (warm points)
const light1 = new THREE.PointLight(0xffaa66, 1.2, 18);
light1.position.set(-5, 6, 3);
scene.add(light1);
const light2 = new THREE.PointLight(0xff9955, 1.0, 16);
light2.position.set(5, 5, 2);
scene.add(light2);
const ambLight = new THREE.AmbientLight(0x332211, 0.3);
scene.add(ambLight);

// ────────── hash-seeded RNG ──────────
let hashBytes = new Uint8Array(32);
function generateHash(){
  for (let i = 0; i < 32; i++) hashBytes[i] = Math.floor(Math.random() * 256);
}
generateHash();

let byteIdx = 0;
function hashFloat(){
  const b = hashBytes[byteIdx % 32];
  byteIdx++;
  return b / 255.0;
}
function hashRange(a, b){
  return a + hashFloat() * (b - a);
}

const hashDisplay = document.getElementById('hashDisplay');
function updateHashDisplay(){
  const hex = Array.from(hashBytes).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
  hashDisplay.textContent = `0x${hex}...`;
}
updateHashDisplay();

// ────────── skeleton structure ──────────
// 8 joints per figure: pelvis, spine_low, spine_mid, neck, head, l_shoulder, r_shoulder, crown
const JOINT_COUNT = 8;
const NUM_DANCERS = 5;

// rest-pose structure (local offsets)
const REST_STRUCTURE = [
  [0, 0, 0],          // 0: pelvis (root)
  [0, 0.35, 0],       // 1: spine_low
  [0, 0.70, 0],       // 2: spine_mid
  [0, 1.05, 0],       // 3: neck
  [0, 1.35, 0],       // 4: head
  [-0.25, 0.90, 0],   // 5: l_shoulder
  [0.25, 0.90, 0],    // 6: r_shoulder
  [0, 1.60, 0]        // 7: crown
];

// bone connections for rendering
const BONES = [
  [0, 1], [1, 2], [2, 3], [3, 4], [4, 7],  // spine chain
  [2, 5], [2, 6]                            // shoulders
];

class Dancer {
  constructor(xPos, seed){
    this.xPos = xPos;
    byteIdx = seed * 32 % 256;  // re-seed per dancer
    
    this.joints = [];
    for (let i = 0; i < JOINT_COUNT; i++){
      this.joints.push({
        pos: new THREE.Vector3(xPos + REST_STRUCTURE[i][0], REST_STRUCTURE[i][1], REST_STRUCTURE[i][2]),
        vel: new THREE.Vector3(0, 0, 0),
        restOffset: new THREE.Vector3(...REST_STRUCTURE[i]),
        phase: hashRange(0, Math.PI * 2),
        ampX: hashRange(0.02, 0.18),
        ampY: hashRange(0.02, 0.22),
        ampZ: hashRange(0.01, 0.12),
        freqX: hashRange(0.4, 1.8),
        freqY: hashRange(0.5, 2.0),
        freqZ: hashRange(0.3, 1.5),
        stiffness: hashRange(0.08, 0.25),
        damping: hashRange(0.85, 0.95)
      });
    }
    
    // line geometry for bones
    this.lineGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(BONES.length * 6);
    this.lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    
    const lineMat = new THREE.LineBasicMaterial({ 
      color: 0xffddaa, 
      transparent: true, 
      opacity: 0.85,
      linewidth: 1
    });
    this.lineObj = new THREE.LineSegments(this.lineGeo, lineMat);
    scene.add(this.lineObj);
    
    // sphere joints
    this.jointMeshes = [];
    const jointGeo = new THREE.SphereGeometry(0.04, 8, 8);
    const jointMat = new THREE.MeshBasicMaterial({ color: 0xffcc88 });
    for (let i = 0; i < JOINT_COUNT; i++){
      const m = new THREE.Mesh(jointGeo, jointMat);
      this.jointMeshes.push(m);
      scene.add(m);
    }
  }
  
  update(t, dt){
    // phase-driven target positions (hash-seeded sinusoids)
    for (let i = 0; i < JOINT_COUNT; i++){
      const j = this.joints[i];
      const tx = this.xPos + j.restOffset.x + j.ampX * Math.sin(t * j.freqX + j.phase);
      const ty = j.restOffset.y + j.ampY * Math.sin(t * j.freqY + j.phase * 1.3);
      const tz = j.restOffset.z + j.ampZ * Math.sin(t * j.freqZ + j.phase * 0.7);
      
      const target = new THREE.Vector3(tx, ty, tz);
      const delta = target.clone().sub(j.pos);
      const force = delta.multiplyScalar(j.stiffness);
      
      j.vel.add(force.multiplyScalar(dt));
      j.vel.multiplyScalar(j.damping);
      j.pos.add(j.vel.clone().multiplyScalar(dt));
    }
    
    // spring coupling between adjacent joints (soft IK)
    for (let iter = 0; iter < 2; iter++){
      for (let i = 1; i < JOINT_COUNT; i++){
        const a = this.joints[i - 1];
        const b = this.joints[i];
        const d = b.pos.clone().sub(a.pos);
        const len = d.length();
        const restLen = a.restOffset.distanceTo(b.restOffset);
        if (len > 0.001){
          const correction = d.multiplyScalar((len - restLen) / len * 0.5);
          a.pos.add(correction.clone().multiplyScalar(0.3));
          b.pos.sub(correction.clone().multiplyScalar(0.3));
        }
      }
    }
    
    // update visuals
    const pos = this.lineGeo.attributes.position.array;
    for (let i = 0; i < BONES.length; i++){
      const [ai, bi] = BONES[i];
      const a = this.joints[ai].pos;
      const b = this.joints[bi].pos;
      pos[i*6]   = a.x; pos[i*6+1] = a.y; pos[i*6+2] = a.z;
      pos[i*6+3] = b.x; pos[i*6+4] = b.y; pos[i*6+5] = b.z;
    }
    this.lineGeo.attributes.position.needsUpdate = true;
    
    for (let i = 0; i < JOINT_COUNT; i++){
      this.jointMeshes[i].position.copy(this.joints[i].pos);
    }
  }
  
  dispose(){
    scene.remove(this.lineObj);
    this.lineGeo.dispose();
    this.jointMeshes.forEach(m => {
      scene.remove(m);
      m.geometry.dispose();
    });
  }
}

let dancers = [];
function createDancers(){
  dancers.forEach(d => d.dispose());
  dancers = [];
  byteIdx = 0;
  const spacing = 2.8;
  const startX = -(NUM_DANCERS - 1) * spacing / 2;
  for (let i = 0; i < NUM_DANCERS; i++){
    dancers.push(new Dancer(startX + i * spacing, i));
  }
}
createDancers();

addEventListener('click', () => {
  generateHash();
  updateHashDisplay();
  createDancers();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  
  cycMat.uniforms.uTime.value = t;
  
  dancers.forEach(d => d.update(t, dt));
  
  // subtle camera sway
  camera.position.x = Math.sin(t * 0.12) * 0.5;
  camera.position.y = 2.2 + Math.sin(t * 0.18) * 0.15;
  camera.lookAt(0, 1.5, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
