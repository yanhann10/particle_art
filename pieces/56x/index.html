<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>56x · nautilus-chambers</title>
<!-- MOTION: spiral, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c11; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">56x</div>
<div class="hint">nautilus chambers · logarithmic spiral · IKB monochrome</div>
<div class="src">nautilus pompilius growth law · Yves Klein blue</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c11, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c11, 0.008);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 12, 38);
camera.lookAt(0, 0, 0);

// Nautilus logarithmic spiral: r = a * e^(b*theta)
// Golden angle growth with chamber septum walls
const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = Math.PI * 2 / (PHI * PHI);
const GROWTH_RATE = 0.07;   // reduced to keep spiral within view (was 0.18)
const NUM_CHAMBERS = 22;    // fewer outer chambers (they'd be off-screen anyway)
const SCALE = 0.4;          // global scale so chambers fill scene nicely

// International Klein Blue #002FA7 — boosted for visibility
const IKB = new THREE.Color(0.0, 0.35, 1.0);
const IKB_DARK = new THREE.Color(0.0, 0.18, 0.55);
const IKB_BRIGHT = new THREE.Color(0.4, 0.65, 1.0);

const particles = [];
const particleGeometry = new THREE.BufferGeometry();
const positions = [];
const colors = [];
const sizes = [];
const ages = [];

// Generate particles along chamber walls and fill
for (let chamberIdx = 0; chamberIdx < NUM_CHAMBERS; chamberIdx++) {  // NUM_CHAMBERS = 22
  const theta = chamberIdx * GOLDEN_ANGLE;
  const r = SCALE * 1.5 * Math.exp(GROWTH_RATE * theta);

  // Chamber center in spiral
  const cx = r * Math.cos(theta);
  const cy = r * Math.sin(theta);

  // Chamber width grows with radius
  const chamberWidth = r * 0.35;

  // Next chamber position for septum wall orientation
  const nextTheta = (chamberIdx + 1) * GOLDEN_ANGLE;
  const nextR = SCALE * 1.5 * Math.exp(GROWTH_RATE * nextTheta);
  const nextCx = nextR * Math.cos(nextTheta);
  const nextCy = nextR * Math.sin(nextTheta);
  
  // Wall normal (perpendicular to growth direction)
  const dx = nextCx - cx;
  const dy = nextCy - cy;
  const wallNormX = -dy;
  const wallNormY = dx;
  const wallLen = Math.sqrt(wallNormX * wallNormX + wallNormY * wallNormY);
  const wnx = wallNormX / wallLen;
  const wny = wallNormY / wallLen;
  
  // Particles per chamber — capped to avoid OOM on outer chambers
  const densityFactor = Math.min(4.0, Math.max(1.0, Math.log(r + 1) * 0.9));
  const particlesInChamber = Math.floor(180 * densityFactor);
  
  for (let i = 0; i < particlesInChamber; i++) {
    // Fill chamber interior
    const localR = Math.sqrt(Math.random()) * chamberWidth;
    const localTheta = Math.random() * Math.PI * 2;
    const px = cx + localR * Math.cos(localTheta);
    const py = cy + localR * Math.sin(localTheta);
    
    // Z-height follows chamber depth curve
    const depthCurve = 1.0 - Math.pow(localR / chamberWidth, 1.5);
    const pz = (Math.random() - 0.5) * 4.0 * depthCurve;
    
    positions.push(px, py, pz);
    
    // Color variation: older chambers darker (Klein depth)
    const ageFactor = chamberIdx / NUM_CHAMBERS;
    const colorMix = 0.3 + ageFactor * 0.4 + Math.random() * 0.3;
    const baseColor = IKB_DARK.clone().lerp(IKB, colorMix);
    
    colors.push(baseColor.r, baseColor.g, baseColor.b);
    
    // Size varies with chamber age and local position — larger for visibility
    const sizeFactor = 2.5 + ageFactor * 2.0 + Math.random() * 1.5;
    sizes.push(sizeFactor);
    
    ages.push(Math.random());
    
    particles.push({ baseX: px, baseY: py, baseZ: pz, chamber: chamberIdx });
  }
  
  // Septum wall particles (bright boundary)
  const wallParticles = Math.floor(40 * densityFactor);
  for (let i = 0; i < wallParticles; i++) {
    const t = (i / wallParticles) * 2 - 1;
    const wallDist = t * chamberWidth * 0.9;
    const px = cx + wnx * wallDist;
    const py = cy + wny * wallDist;
    const pz = (Math.random() - 0.5) * 3.0;
    
    positions.push(px, py, pz);
    
    // Septum walls are bright IKB
    const brightColor = IKB.clone().lerp(IKB_BRIGHT, 0.6 + Math.random() * 0.4);
    colors.push(brightColor.r, brightColor.g, brightColor.b);
    
    sizes.push(3.5 + Math.random() * 2.0);
    ages.push(Math.random());
    
    particles.push({ baseX: px, baseY: py, baseZ: pz, chamber: chamberIdx, wall: true });
  }
}

particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
particleGeometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
particleGeometry.setAttribute('age', new THREE.Float32BufferAttribute(ages, 1));

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
    uPulse: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 color;
    attribute float size;
    attribute float age;
    uniform float uTime;
    uniform float uPixelRatio;
    uniform float uPulse;
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vColor = color;
      
      vec3 pos = position;
      
      // Gentle breathing motion along spiral
      float breathe = sin(uTime * 0.4 + age * 6.28) * 0.15;
      pos.z += breathe;
      
      // Pulse during chamber reveal
      float pulseScale = 1.0 + uPulse * 0.3 * (1.0 - age);
      
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      float dist = -mvPosition.z;
      
      gl_PointSize = size * uPixelRatio * (60.0 / dist) * pulseScale;
      gl_Position = projectionMatrix * mvPosition;
      
      // Opacity modulation — high for contrast
      vAlpha = 0.75 + age * 0.25 + uPulse * 0.15;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    
    void main() {
      vec2 center = gl_PointCoord - 0.5;
      float dist = dot(center, center);
      if (dist > 0.25) discard;
      
      // Sharper core with less falloff for contrast
      float alpha = exp(-dist * 6.0) * vAlpha;

      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const pointCloud = new THREE.Points(particleGeometry, particleMaterial);
scene.add(pointCloud);

// Ambient light for subtle volume
const ambientLight = new THREE.AmbientLight(0x0a1a3a, 0.3);
scene.add(ambientLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Slow reveal pulse: every 12 seconds a chamber lights up
function pulseCurve(t) {
  const cycle = t % 12.0;
  if (cycle < 10.0) return 0.0;
  if (cycle < 11.0) {
    // Rise
    const f = cycle - 10.0;
    return f * f * (3.0 - 2.0 * f); // smoothstep
  }
  // Fall
  const f = (cycle - 11.0);
  return 1.0 - f;
}

function loop(time) {
  const t = time * 0.001;
  
  particleMaterial.uniforms.uTime.value = t;
  particleMaterial.uniforms.uPulse.value = pulseCurve(t);
  
  // Camera: slow orbital drift revealing the spiral structure
  const angle = t * 0.06;
  camera.position.x = Math.sin(angle) * 38;
  camera.position.z = Math.cos(angle) * 38;
  camera.position.y = 12 + Math.sin(t * 0.08) * 4;
  camera.lookAt(0, 0, 0);
  
  // Rotate shell slowly to show chambered structure
  pointCloud.rotation.z = t * 0.03;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop(0);
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
