<body>
<div class="id">80z</div>
<div class="hint">click to advance phase · drag to tilt</div>
<div class="state" id="stateLabel">i · seed</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Five phases of a living form ──
   Narrative arc: seed → root → bloom → fruit → scatter
   Each phase is a distinct particle distribution + motion law.
   Inspired by Andy Goldsworthy's ephemeral land-art lifecycles
   and Ernst Haeckel's Kunstformen der Natur radiolarian plates.
   Biomorphic motion throughout: breathing, peristalsis, tidal.
*/

const STATES = [
  { name: 'seed',    label: 'i · seed' },
  { name: 'root',    label: 'ii · root' },
  { name: 'bloom',   label: 'iii · bloom' },
  { name: 'fruit',   label: 'iv · fruit' },
  { name: 'scatter', label: 'v · scatter' }
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const posA   = new Float32Array(N * 3);
const posB   = new Float32Array(N * 3);
const seedA  = new Float32Array(N);

// ── deterministic RNG
function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── State builders ──

function buildSeed(buf, seeds, rng) {
  // Dense compressed sphere — a dormant seed breathing slowly
  // Particles packed in concentric shells with slight angular gaps (like a pomegranate)
  let w = 0, att = 0;
  while (w < N && att < N * 10) {
    att++;
    const r = Math.pow(rng(), 0.45) * 1.8;
    const th = rng() * Math.PI * 2;
    const phi = Math.acos(2 * rng() - 1);
    const x = r * Math.sin(phi) * Math.cos(th);
    const y = r * Math.sin(phi) * Math.sin(th);
    const z = r * Math.cos(phi);
    // carve internal chambers — pomegranate cross-section
    const chamberAngle = Math.atan2(y, x);
    const chamberR = Math.sqrt(x*x + y*y);
    const gap = Math.sin(chamberAngle * 5.0 + z * 2.0) * 0.3;
    if (chamberR > 0.3 && Math.abs(gap) < 0.08 * (1.0 + r)) { continue; }
    buf[w*3] = x; buf[w*3+1] = y; buf[w*3+2] = z;
    seeds[w] = rng(); w++;
  }
  for (let i = w; i < N; i++) { buf[i*3]=0; buf[i*3+1]=-5; buf[i*3+2]=0; seeds[i]=0; }
}

function buildRoot(buf, seeds, rng) {
  // Downward branching tendrils — dendritic vascular network
  // Main tap root + lateral roots spreading
  let w = 0;
  const nBranches = 12;
  const branches = [];
  for (let b = 0; b < nBranches; b++) {
    const angle = (b / nBranches) * Math.PI * 2 + rng() * 0.3;
    const tilt = 0.3 + rng() * 0.7; // how far from vertical
    const twist = rng() * 2.0 - 1.0;
    branches.push({ angle, tilt, twist, len: 2.0 + rng() * 2.5 });
  }
  while (w < N && w < N) {
    const bi = Math.floor(rng() * nBranches);
    const br = branches[bi];
    const t = rng(); // 0..1 along branch
    const depth = t * br.len;
    // branch curves outward + downward
    const spread = t * t * br.tilt * 2.5;
    const ax = Math.cos(br.angle + br.twist * t) * spread;
    const az = Math.sin(br.angle + br.twist * t) * spread;
    const ay = -depth - 0.2;
    // thicken near base, thin at tips
    const rad = (1.0 - t * 0.85) * 0.35;
    const jx = (rng() - 0.5) * rad;
    const jy = (rng() - 0.5) * rad * 0.5;
    const jz = (rng() - 0.5) * rad;
    // add fine root hairs at tips
    let hx = 0, hy = 0, hz = 0;
    if (t > 0.7 && rng() < 0.4) {
      const hairLen = rng() * 0.6;
      const ha = rng() * Math.PI * 2;
      hx = Math.cos(ha) * hairLen;
      hz = Math.sin(ha) * hairLen;
      hy = -rng() * 0.3;
    }
    buf[w*3]   = ax + jx + hx;
    buf[w*3+1] = ay + jy + hy + 1.5; // shift up so centroid ~0
    buf[w*3+2] = az + jz + hz;
    seeds[w] = rng(); w++;
  }
}

function buildBloom(buf, seeds, rng) {
  // Full Riley-interference calyx — inherited from parent ere
  const w1 = { ang: rng()*Math.PI*2, k: 1.6+rng()*1.2, phase: rng()*Math.PI*2 };
  const w2 = { ang: rng()*Math.PI*2, k: 2.1+rng()*1.4, phase: rng()*Math.PI*2 };
  const w3 = { ang: rng()*Math.PI*2, k: 0.8+rng()*0.6, phase: rng()*Math.PI*2 };
  const radK = 1.3 + rng() * 0.6;
  let w = 0, att = 0;
  while (w < N && att < N * 16) {
    att++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th), z = r * Math.sin(th);
    const v1 = Math.sin(x*Math.cos(w1.ang)*w1.k + z*Math.sin(w1.ang)*w1.k + w1.phase);
    const v2 = Math.sin(x*Math.cos(w2.ang)*w2.k + z*Math.sin(w2.ang)*w2.k + w2.phase);
    const v3 = Math.sin(x*Math.cos(w3.ang)*w3.k + z*Math.sin(w3.ang)*w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r*r*0.10);
    if (!(f > 0 && rng() < fall * (0.4 + 0.6 * f))) continue;
    const scallop = Math.cos(th * 6) * 0.18 * (r / 4);
    buf[w*3] = x; buf[w*3+1] = -0.15*r*r + scallop; buf[w*3+2] = z;
    seeds[w] = rng(); w++;
  }
  for (let i = w; i < N; i++) { buf[i*3]=0; buf[i*3+1]=-2; buf[i*3+2]=0; seeds[i]=0; }
}

function buildFruit(buf, seeds, rng) {
  // Clustered hanging pods — 7 fruit bodies on drooping stems
  const nPods = 7;
  const pods = [];
  for (let i = 0; i < nPods; i++) {
    const angle = (i / nPods) * Math.PI * 2 + rng() * 0.4;
    const dist = 1.0 + rng() * 2.0;
    const dropY = -1.5 - rng() * 1.5;
    const podR = 0.5 + rng() * 0.6;
    pods.push({ cx: Math.cos(angle)*dist, cy: dropY, cz: Math.sin(angle)*dist, r: podR });
  }
  let w = 0;
  while (w < N) {
    const pi = Math.floor(rng() * nPods);
    const pod = pods[pi];
    if (rng() < 0.12) {
      // stem particles — thin line from origin area down to pod
      const t = rng();
      const stemX = pod.cx * t;
      const stemY = pod.cy * t + (1.0 - t) * 0.5;
      const stemZ = pod.cz * t;
      const jr = 0.03;
      buf[w*3] = stemX + (rng()-0.5)*jr;
      buf[w*3+1] = stemY + (rng()-0.5)*jr;
      buf[w*3+2] = stemZ + (rng()-0.5)*jr;
    } else {
      // pod body — oblate sphere, denser at surface
      const r = Math.pow(rng(), 0.3) * pod.r;
      const th = rng() * Math.PI * 2;
      const phi = Math.acos(2 * rng() - 1);
      buf[w*3]   = pod.cx + r * Math.sin(phi) * Math.cos(th);
      buf[w*3+1] = pod.cy + r * Math.sin(phi) * Math.sin(th) * 0.7; // oblate
      buf[w*3+2] = pod.cz + r * Math.cos(phi);
    }
    seeds[w] = rng(); w++;
  }
}

function buildScatter(buf, seeds, rng) {
  // Dispersal — particles spreading outward like seeds on wind
  // Radial burst with spiral trailing + a few lingering at center
  let w = 0;
  while (w < N) {
    const t = rng();
    if (t < 0.08) {
      // remnant core — tiny cluster at center
      const r = rng() * 0.4;
      const th = rng() * Math.PI * 2;
      const phi = Math.acos(2*rng()-1);
      buf[w*3] = r*Math.sin(phi)*Math.cos(th);
      buf[w*3+1] = r*Math.sin(phi)*Math.sin(th);
      buf[w*3+2] = r*Math.cos(phi);
    } else {
      // dispersing seeds — spiraling outward like maple samaras
      const r = 0.5 + Math.pow(rng(), 0.6) * 4.5;
      const th = rng() * Math.PI * 2 + r * 0.8; // spiral
      const phi = Math.acos(2*rng()-1);
      // flatten vertically — seeds drift horizontally
      const spreadY = 0.25;
      buf[w*3]   = r * Math.sin(phi) * Math.cos(th);
      buf[w*3+1] = r * Math.cos(phi) * spreadY + (rng()-0.5)*0.3;
      buf[w*3+2] = r * Math.sin(phi) * Math.sin(th);
    }
    seeds[w] = rng(); w++;
  }
}

const builders = [buildSeed, buildRoot, buildBloom, buildFruit, buildScatter];
let currentState = 0;
let masterSeed = 42;

function generateState(index, targetBuf, seedBuf) {
  const rng = mkRng(masterSeed + index * 7919);
  builders[index](targetBuf, seedBuf, rng);
}

// Initialize: posA = seed state, posB = seed state
generateState(0, posA, seedA);
posB.set(posA);

const geom = new THREE.BufferGeometry();
geom.setAttribute('posA',  new THREE.BufferAttribute(posA, 3));
geom.setAttribute('posB',  new THREE.BufferAttribute(posB, 3));
geom.setAttribute('seed',  new THREE.BufferAttribute(seedA, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uMix:     { value: 1.0 },
  uState:   { value: 0.0 }  // 0..4 for per-state color/motion variation
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uMix;
    uniform float uState;
    attribute vec3 posA;
    attribute vec3 posB;
    attribute float seed;
    varying float vDepth;
    varying float vSeed;
    varying float vState;
    void main(){
      vec3 p = mix(posA, posB, uMix);
      // pointer tilt
      float tiltX = uPointer.y * 0.18;
      float tiltZ = -uPointer.x * 0.18;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);
      // biomorphic motion per state
      float t = uTime * 0.22 + seed * 6.28;
      float r = length(p.xz);
      // peristaltic wave: radial breathing that travels outward
      float wave = sin(t * 1.2 - r * 1.5) * 0.04;
      // vascular pulse: rhythmic contraction
      float pulse = sin(t * 0.8) * 0.02 * (1.0 + r * 0.3);
      q.y += wave + pulse;
      // tidal expansion/contraction
      float tidal = 1.0 + sin(uTime * 0.15) * 0.03;
      q.xz *= tidal;
      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      vState = uState;
      float sz = (1.3 + 0.6 * sin(t * 0.7)) * uPixel * (5.0 / vDepth);
      // scatter state: slightly larger points
      sz *= 1.0 + step(3.5, uState) * 0.4;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vState;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);
      // 5 ink palettes — each state has its own tonal range
      // seed: deep walnut
      vec3 c0a = vec3(0.12, 0.07, 0.04); vec3 c0b = vec3(0.22, 0.14, 0.06);
      // root: umber earth
      vec3 c1a = vec3(0.14, 0.08, 0.03); vec3 c1b = vec3(0.35, 0.20, 0.08);
      // bloom: sumi black + warm amber
      vec3 c2a = vec3(0.10, 0.06, 0.04); vec3 c2b = vec3(0.30, 0.18, 0.08);
      // fruit: dark plum
      vec3 c3a = vec3(0.15, 0.05, 0.08); vec3 c3b = vec3(0.32, 0.12, 0.14);
      // scatter: faded ochre
      vec3 c4a = vec3(0.18, 0.12, 0.06); vec3 c4b = vec3(0.40, 0.28, 0.12);
      float s = vState;
      vec3 cA = c0a, cB = c0b;
      if (s > 0.5 && s < 1.5) { cA = c1a; cB = c1b; }
      else if (s > 1.5 && s < 2.5) { cA = c2a; cB = c2b; }
      else if (s > 2.5 && s < 3.5) { cA = c3a; cB = c3b; }
      else if (s > 3.5) { cA = c4a; cB = c4b; }
      vec3 col = mix(cA, cB, smoothstep(0.0, 1.0, vSeed));
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      gl_FragColor = vec4(col, a * 0.78 * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── DUST MOTES
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3] = (Math.random()-0.5)*14;
  dustPos[i*3+1] = (Math.random()-0.5)*8;
  dustPos[i*3+2] = (Math.random()-0.5)*8;
  dustSeed[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime; uniform float uPixel;
    attribute float seed; varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime*0.10 + seed*6.28;
      p.x += sin(t*1.3+seed*30.0)*0.4;
      p.y -= mod(uTime*0.08+seed*7.0, 4.0)-2.0;
      p.z += cos(t*1.1+seed*22.0)*0.3;
      float sx = -p.x/7.0; float sy = p.y/4.0;
      vGlow = clamp(0.30+0.55*smoothstep(-0.2,0.6,sx+sy),0.0,1.0);
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = (1.0+1.4*vGlow)*uPixel*(4.0/-mv.z);
      gl_Position = projectionMatrix*mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord-0.5; float r = dot(d,d);
      if(r>0.25) discard;
      float a = exp(-r*24.0);
      vec3 col = vec3(1.00,0.94,0.78)*vGlow;
      gl_FragColor = vec4(col, a*0.70*vGlow);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

// ── TRANSITION
let transitionStart = -10;
const TRANS_DUR = 1.8; // seconds

function advanceState() {
  // Snapshot current interpolated positions into posA
  const mix = Math.min((performance.now()/1000 - transitionStart) / TRANS_DUR, 1.0);
  for (let i = 0; i < N*3; i++) {
    posA[i] = posA[i] + (posB[i] - posA[i]) * mix;
  }
  geom.attributes.posA.needsUpdate = true;
  // Advance
  currentState = (currentState + 1) % 5;
  // Build new target into posB
  const tmpSeeds = new Float32Array(N);
  generateState(currentState, posB, tmpSeeds);
  geom.attributes.posB.needsUpdate = true;
  transitionStart = performance.now() / 1000;
  // Update label
  const el = document.getElementById('stateLabel');
  el.style.opacity = '0';
  setTimeout(() => {
    el.textContent = STATES[currentState].label;
    el.style.opacity = '0.50';
  }, 300);
}

// ── INPUT
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX/innerWidth)*2-1, (e.clientY/innerHeight)*2-1
  );
});
addEventListener('click', advanceState);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── LOOP
const startT = performance.now();
function loop(){
  const t = (performance.now() - startT) / 1000;
  uniforms.uTime.value = t;
  // cross-fade mix
  const rawMix = (t - transitionStart) / TRANS_DUR;
  const mix = Math.min(Math.max(rawMix, 0), 1);
  // ease-in-out
  uniforms.uMix.value = mix < 0.5 ? 2*mix*mix : 1-Math.pow(-2*mix+2,2)/2;
  // state uniform for fragment color
  const prevState = (currentState - 1 + 5) % 5;
  uniforms.uState.value = prevState + (currentState - prevState + 5) % 5 * uniforms.uMix.value;
  // fix: just use discrete state after transition completes
  uniforms.uState.value = mix < 1.0
    ? prevState + ((currentState - prevState + 5) % 5) * uniforms.uMix.value
    : currentState;
  // camera: slow breathing drift, tracks centroid
  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
