<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ed7 · Shiota — Interior Landscape (Two Hearts)</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">ed7</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0000, 0.003));
const keyL = new THREE.PointLight(0xff0800, 0.012, 32, 2.0);
keyL.position.set(-4, 7, 3);
scene.add(keyL);

let seed = 829301;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// TWO SUSPENDED OBJECTS — Shiota's 'Two Home Countries' / dual-center web
const sphereA = new THREE.Vector3(-3.2, 1.5, 0.8);
const sphereB = new THREE.Vector3(3.8, 0.6, -1.2);
const radiusA = 1.6;
const radiusB = 1.3;

const geoA = new THREE.SphereGeometry(radiusA, 24, 16);
const matA = new THREE.MeshStandardMaterial({
  color: 0xf5ebe0, emissive: 0xfff8f0, emissiveIntensity: 0.6,
  roughness: 0.88, transparent: true, opacity: 0.42
});
const meshA = new THREE.Mesh(geoA, matA);
meshA.position.copy(sphereA);
scene.add(meshA);

const geoB = new THREE.SphereGeometry(radiusB, 24, 16);
const matB = new THREE.MeshStandardMaterial({
  color: 0xede5d8, emissive: 0xfff5ed, emissiveIntensity: 0.55,
  roughness: 0.90, transparent: true, opacity: 0.38
});
const meshB = new THREE.Mesh(geoB, matB);
meshB.position.copy(sphereB);
scene.add(meshB);

const glowA = new THREE.PointLight(0xfff0e8, 0.006, 6, 2.4);
glowA.position.copy(sphereA);
scene.add(glowA);

const glowB = new THREE.PointLight(0xfff5ed, 0.005, 5, 2.2);
glowB.position.copy(sphereB);
scene.add(glowB);

// ROOM VOLUME — asymmetric chamber, architectural
const ROOM = { w: 22, h: 18, d: 20 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHOR GENERATION — wall grid + dual-center spirals
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.9; y=(rng()-0.5)*ROOM.h*0.9; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.9; y=(rng()-0.5)*ROOM.h*0.9; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<80; i++) anchors.push(wallPt());

// Spiral anchors around each sphere (like Shiota's radial convergence)
function spiralAnchors(center, count, baseR, coils){
  const pts = [];
  for(let i=0; i<count; i++){
    const t = i/count;
    const angle = t*Math.PI*2*coils;
    const r = baseR + t*(baseR*1.8);
    const yOffset = (t-0.5)*5.0;
    const x = center.x + Math.cos(angle)*r;
    const y = center.y + yOffset;
    const z = center.z + Math.sin(angle)*r;
    pts.push(new THREE.Vector3(x, y, z));
  }
  return pts;
}

const spiralA = spiralAnchors(sphereA, 28, 2.8, 3.5);
const spiralB = spiralAnchors(sphereB, 24, 2.4, 3.2);
anchors.push(...spiralA, ...spiralB);

// Meridian surface points on both spheres
const meridianA = [];
const meridianB = [];
const phiSteps = 14;
const thetaSteps = 7;

function generateMeridian(center, radius, arr){
  for(let p=0; p<phiSteps; p++){
    for(let t=0; t<thetaSteps; t++){
      const phi = (p/phiSteps)*Math.PI*2;
      const theta = (t/thetaSteps)*Math.PI;
      const x = center.x + Math.sin(theta)*Math.cos(phi)*radius;
      const y = center.y + Math.cos(theta)*radius;
      const z = center.z + Math.sin(theta)*Math.sin(phi)*radius;
      arr.push(new THREE.Vector3(x, y, z));
    }
  }
}

generateMeridian(sphereA, radiusA, meridianA);
generateMeridian(sphereB, radiusB, meridianB);

// THREAD NETWORK — 20,000 line segments (hard limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to sphere tops
const topA = meridianA.filter(p => p.y > sphereA.y + radiusA*0.45);
const topB = meridianB.filter(p => p.y > sphereB.y + radiusB*0.45);

for(const mp of topA){
  const ceiling = new THREE.Vector3(mp.x + (rng()-0.5)*1.0, hh, mp.z + (rng()-0.5)*0.8);
  setLine(ceiling, mp);
}

for(const mp of topB){
  const ceiling = new THREE.Vector3(mp.x + (rng()-0.5)*0.9, hh, mp.z + (rng()-0.5)*0.7);
  setLine(ceiling, mp);
}

// CONVERGENCE A — anchors to nearest sphere A meridian
for(let i=0; i<anchors.length*0.45 && li<NUM_LINES-8000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dA = a.distanceTo(sphereA);
  if(dA < radiusA*1.15) continue;
  
  let closest = meridianA[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<8; k++){
    const candidate = meridianA[Math.floor(rng()*meridianA.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  setLine(a, closest);
}

// CONVERGENCE B — anchors to nearest sphere B meridian
for(let i=0; i<anchors.length*0.45 && li<NUM_LINES-7000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dB = a.distanceTo(sphereB);
  if(dB < radiusB*1.15) continue;
  
  let closest = meridianB[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<8; k++){
    const candidate = meridianB[Math.floor(rng()*meridianB.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  setLine(a, closest);
}

// INTER-SPHERE THREADS — connecting the two hearts (Shiota's dual-center theme)
for(let i=0; i<120 && li<NUM_LINES-6000; i++){
  const mpA = meridianA[Math.floor(rng()*meridianA.length)];
  const mpB = meridianB[Math.floor(rng()*meridianB.length)];
  const d = mpA.distanceTo(mpB);
  if(d > 4.0 && d < 11.0){
    setLine(mpA, mpB);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 5.2;
let webCount = 0, attempts = 0;
while(webCount<3500 && li<NUM_LINES-4000 && attempts<25000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.6 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans (architectural tautness)
let wallSpans = 0;
while(wallSpans<1400 && li<NUM_LINES-2000){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>2.5 && d<18.0){
    setLine(a, b);
    wallSpans++;
  }
}

// RADIAL THREADS outward from sphere A (threads that stop short — the gap)
for(let i=0; i<400 && li<NUM_LINES-1200; i++){
  const mp = meridianA[Math.floor(rng()*meridianA.length)];
  const dir = mp.clone().sub(sphereA).normalize();
  dir.x += (rng()-0.5)*0.3;
  dir.y += (rng()-0.5)*0.25;
  dir.z += (rng()-0.5)*0.3;
  dir.normalize();
  const len = 1.8 + rng()*3.5;
  const end = mp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(mp, end);
  }
}

// RADIAL THREADS outward from sphere B
for(let i=0; i<350 && li<NUM_LINES-600; i++){
  const mp = meridianB[Math.floor(rng()*meridianB.length)];
  const dir = mp.clone().sub(sphereB).normalize();
  dir.x += (rng()-0.5)*0.28;
  dir.y += (rng()-0.5)*0.22;
  dir.z += (rng()-0.5)*0.28;
  dir.normalize();
  const len = 1.6 + rng()*3.2;
  const end = mp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(mp, end);
  }
}

// FILL remaining capacity
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>1.2 && d<14.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.07,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, moving between the two hearts
const pathLen = 2800;
const dollyPath = [];
const midpoint = new THREE.Vector3().lerpVectors(sphereA, sphereB, 0.5);

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.18){
    // Enter from side, sphereA visible right
    const lt = t/0.18;
    x = sphereA.x - 8.0 + lt*3.0;
    y = sphereA.y + 1.0 + Math.sin(lt*Math.PI)*0.6;
    z = sphereA.z + 6.0 - lt*2.0;
  } else if(t<0.38){
    // Pass through midpoint, both spheres visible
    const lt = (t-0.18)/0.20;
    x = sphereA.x + lt*(sphereB.x - sphereA.x)*1.2;
    y = midpoint.y + 0.5 + Math.sin(lt*Math.PI*2.0)*0.8;
    z = midpoint.z + 4.5 + Math.cos(lt*Math.PI*1.5)*2.0;
  } else if(t<0.58){
    // Orbit sphereB close
    const lt = (t-0.38)/0.20;
    const angle = lt*Math.PI*1.3 + 0.5;
    const r = 4.2 + Math.sin(lt*Math.PI)*0.5;
    x = sphereB.x + Math.cos(angle)*r;
    y = sphereB.y + 0.2 + Math.sin(lt*Math.PI*0.7)*0.4;
    z = sphereB.z + Math.sin(angle)*r;
  } else if(t<0.76){
    // Descend below both, looking up through web
    const lt = (t-0.58)/0.18;
    x = midpoint.x + Math.sin(lt*Math.PI*0.6)*3.5;
    y = midpoint.y - lt*7.0;
    z = midpoint.z + Math.cos(lt*Math.PI*0.8)*4.0;
  } else {
    // Rise back toward sphereA, recede
    const lt = (t-0.76)/0.24;
    const r = 5.5 + lt*4.0;
    const angle = lt*Math.PI*0.5 + 3.0;
    x = sphereA.x + Math.cos(angle)*r;
    y = sphereA.y + 1.5 - lt*0.8;
    z = sphereA.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.4%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025 + basePositions[idx+1]*0.035 + i*0.00008;
    const breath = Math.sin(elapsed*0.0005 + phase)*0.000018;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.018;
      arr[vi+1] = basePositions[vi+1] + breath*0.012;
      arr[vi+2] = basePositions[vi+2] + breath*0.020;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000022;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward midpoint with slight drift
  camera.lookAt(
    midpoint.x + Math.sin(elapsed*0.00012)*0.1,
    midpoint.y + Math.cos(elapsed*0.00009)*0.08,
    midpoint.z + Math.sin(elapsed*0.00007)*0.06
  );

  keyL.intensity = 0.012 + Math.sin(elapsed*0.00006)*0.003;
  glowA.intensity = 0.006 + Math.sin(elapsed*0.00008)*0.002;
  glowB.intensity = 0.005 + Math.cos(elapsed*0.00009)*0.0018;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
