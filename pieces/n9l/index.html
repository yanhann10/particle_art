<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n9l · Shiota — Accumulated Letters</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">n9l</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.004));
const keyL = new THREE.PointLight(0x1a0808, 0.012, 28, 2.6);
keyL.position.set(-5, 7, 6);
scene.add(keyL);

let seed = 847362;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// SUSPENDED OBJECT — accumulated letters (stacked rectangles forming a paper-mass)
const letterPos = new THREE.Vector3(0, 0.4, 0);
const letterStack = new THREE.Group();

// Paper rectangles — 24 overlapping slightly rotated sheets
for(let i=0; i<24; i++){
  const w = 1.8 + rng()*0.4;
  const h = 1.2 + rng()*0.3;
  const sheetGeo = new THREE.PlaneGeometry(w, h);
  const sheetMat = new THREE.MeshStandardMaterial({
    color: 0xd8d2c8,
    emissive: 0xc8c0b4,
    emissiveIntensity: 0.35,
    side: THREE.DoubleSide,
    roughness: 0.92,
    metalness: 0
  });
  const sheet = new THREE.Mesh(sheetGeo, sheetMat);
  
  sheet.position.y = i*0.015 - 0.18;
  sheet.rotation.x = (rng()-0.5)*0.12;
  sheet.rotation.y = (rng()-0.5)*0.35;
  sheet.rotation.z = (rng()-0.5)*0.15;
  
  letterStack.add(sheet);
}

letterStack.position.copy(letterPos);
scene.add(letterStack);

// Subtle glow near letters
const letterGlow = new THREE.PointLight(0x1a0606, 0.006, 6, 2.8);
letterGlow.position.copy(letterPos);
scene.add(letterGlow);

// ROOM VOLUME
const ROOM = { w: 22, h: 16, d: 20 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHORS — wall grid
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<72; i++) anchors.push(wallPt());

// LETTER PERIMETER POINTS — attachment points around letter stack edges
const letterPts = [];
const edgeSteps = 7;
const stackW = 2.0, stackH = 0.4, stackD = 1.4;

// Top edge loop
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*stackW,
    letterPos.y + stackH/2,
    letterPos.z - stackD/2
  ));
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*stackW,
    letterPos.y + stackH/2,
    letterPos.z + stackD/2
  ));
}

// Side edges
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  letterPts.push(new THREE.Vector3(
    letterPos.x - stackW/2,
    letterPos.y + (t-0.5)*stackH,
    letterPos.z - stackD/2
  ));
  letterPts.push(new THREE.Vector3(
    letterPos.x + stackW/2,
    letterPos.y + (t-0.5)*stackH,
    letterPos.z + stackD/2
  ));
}

// Front/back edges
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*stackW,
    letterPos.y - stackH/2,
    letterPos.z + stackD/2
  ));
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*stackW,
    letterPos.y - stackH/2,
    letterPos.z - stackD/2
  ));
}

// RED THREAD NETWORK — 20,000 line segments (hard limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to letter stack top
const ceilingAnchors = [];
for(let i=0; i<10; i++){
  const t = i/10;
  const cx = letterPos.x + (t-0.5)*stackW*1.6 + (rng()-0.5)*0.7;
  const cz = letterPos.z + (rng()-0.5)*stackD*1.4;
  ceilingAnchors.push(new THREE.Vector3(cx, hh, cz));
}

for(const ca of ceilingAnchors){
  let closest = letterPts[0];
  let closestD = ca.distanceTo(closest);
  for(const pp of letterPts){
    const d = ca.distanceTo(pp);
    if(d < closestD && pp.y > letterPos.y){ closestD=d; closest=pp; }
  }
  setLine(ca, closest);
}

// CONVERGENCE — anchors to letter perimeter (circulatory threads)
for(let i=0; i<anchors.length*0.80 && li<NUM_LINES-16000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dLetter = a.distanceTo(letterPos);
  if(dLetter < 2.4) continue;
  
  let closest = letterPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<9; k++){
    const candidate = letterPts[Math.floor(rng()*letterPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 15% of converging threads stop short (the gap)
  if(rng()<0.15){
    const shortDir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.35 + rng()*0.55);
    const shortEnd = a.clone().add(shortDir.multiplyScalar(shortLen));
    setLine(a, shortEnd);
  } else {
    setLine(a, closest);
  }
}

// RADIAL THREADS FROM LETTERS — threads radiating outward
for(let i=0; i<380 && li<NUM_LINES-13000; i++){
  const pp = letterPts[Math.floor(rng()*letterPts.length)];
  const dir = pp.clone().sub(letterPos).normalize();
  dir.x += (rng()-0.5)*0.5;
  dir.y += (rng()-0.5)*0.35;
  dir.z += (rng()-0.5)*0.5;
  dir.normalize();
  const len = 2.0 + rng()*5.5;
  const end = pp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(pp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 5.2;
let webCount = 0, attempts = 0;
while(webCount<4200 && li<NUM_LINES-8000 && attempts<28000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.9 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans (architectural cage)
let wallSpans = 0;
while(wallSpans<1600 && li<NUM_LINES-5000){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>3.2 && d<17.0){
    setLine(a, b);
    wallSpans++;
  }
}

// Y-FORKING DENDRITIC CHAINS near letters
for(let i=0; i<180 && li<NUM_LINES-3500; i++){
  const startDist = 2.8 + rng()*5.0;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.65;
  const start = letterPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.0,
    (rng()-0.5)*1.6,
    (rng()-0.5)*2.0
  ).normalize();
  
  const segLen = 0.85 + rng()*0.65;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-12 && rng()<0.68){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.55 + rng()*0.45
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.7));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-10 && rng()<0.48){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.55 - rng()*0.45
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.65));
      setLine(p1, p2b);
      
      if(li<NUM_LINES-8 && rng()<0.28){
        const fork3 = fork1.clone().applyAxisAngle(
          new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
          0.38 + rng()*0.28
        ).normalize();
        const p3 = p2a.clone().add(fork3.multiplyScalar(segLen*0.55));
        setLine(p2a, p3);
      }
    }
  }
}

// HORIZONTAL CROSSING THREADS — multiple height layers
for(let i=0; i<320 && li<NUM_LINES-1800; i++){
  const y = letterPos.y + (rng()-0.5)*4.8;
  const x1 = -hw + rng()*2.8;
  const z1 = (rng()-0.5)*ROOM.d*0.88;
  const x2 = hw - rng()*2.8;
  const z2 = (rng()-0.5)*ROOM.d*0.88;
  const a = new THREE.Vector3(x1, y, z1);
  const b = new THREE.Vector3(x2, y, z2);
  setLine(a, b);
}

// FILL remaining capacity with sparse long spans
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>4.2 && d<14.5){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.082,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, orbiting letters slowly
const pathLen = 2600;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.20){
    // Approach from front-right, descending
    const lt = t/0.20;
    const angle = Math.PI*0.3 + lt*Math.PI*0.28;
    const r = 9.0 - lt*2.2;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 4.8 - lt*3.2;
    z = letterPos.z + Math.sin(angle)*r;
  } else if(t<0.42){
    // Descend below letters, looking up through red canopy
    const lt = (t-0.20)/0.22;
    const angle = Math.PI*0.58 + lt*Math.PI*0.65;
    const r = 7.2 + Math.sin(lt*Math.PI)*1.0;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y - lt*5.0;
    z = letterPos.z + Math.sin(angle)*r;
  } else if(t<0.66){
    // Orbit close on left side, mid-height
    const lt = (t-0.42)/0.24;
    const angle = Math.PI*1.23 + lt*Math.PI*0.75;
    const r = 5.5 + Math.cos(lt*Math.PI*1.6)*0.85;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 0.6 + Math.sin(lt*Math.PI*1.3)*0.55;
    z = letterPos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, letters centered and silhouetted
    const lt = (t-0.66)/0.34;
    const angle = Math.PI*1.98 + lt*Math.PI*0.48;
    const r = 5.8 + lt*4.2;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 1.8 + lt*2.8;
    z = letterPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.35%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.016 + basePositions[idx+1]*0.024 + i*0.00005;
    const breath = Math.sin(elapsed*0.00035 + phase)*0.000010;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.012;
      arr[vi+1] = basePositions[vi+1] + breath*0.008;
      arr[vi+2] = basePositions[vi+2] + breath*0.014;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Letter stack subtle rotation
  letterStack.rotation.y = Math.sin(elapsed*0.00004)*0.008;
  letterStack.rotation.x = Math.cos(elapsed*0.00003)*0.006;

  // Camera dolly
  const speed = 0.000022;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward letters with subtle drift
  camera.lookAt(
    letterPos.x + Math.sin(elapsed*0.00008)*0.12,
    letterPos.y + Math.cos(elapsed*0.00006)*0.10,
    letterPos.z + Math.sin(elapsed*0.00004)*0.08
  );

  keyL.intensity = 0.012 + Math.sin(elapsed*0.00005)*0.004;
  letterGlow.intensity = 0.006 + Math.sin(elapsed*0.00007)*0.0025;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
