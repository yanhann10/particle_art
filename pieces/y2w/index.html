<!-- MOTION: drift, intensity: gentle -->
<title>y2w · Klein vessel — threads through topology</title>
<style>

.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">y2w</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Scene ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);
scene.fog = new THREE.FogExp2(0x040404, 0.032);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ── Lights — single warm source, Shiota archive darkness ── */
const ambLight = new THREE.AmbientLight(0x180808, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffe8d0, 0.45);
dirLight.position.set(-4, 6, 3);
scene.add(dirLight);

/* ── Deterministic RNG (mulberry32) ── */
let rngState = 55738291;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

/* ── Classical Klein bottle immersion (Dickson parametrization) ──
   Ref: Stewart, "How to Cut a Klein Bottle in Half" — the iconic
   bottle-with-neck-through-body form, maximally recognizable. */
const SCALE = 0.22;
const CENTER = new THREE.Vector3(0, 0, 0);

function kleinPoint(u, v){
  const cosu = Math.cos(u), sinu = Math.sin(u);
  const cosv = Math.cos(v), sinv = Math.sin(v);
  const half = 1 - cosu * 0.5;
  let x, y, z;
  if(u <= Math.PI){
    x = 6*cosu*(1+sinu) + 4*half*cosu*cosv;
    y = 16*sinu + 4*half*sinu*cosv;
  } else {
    x = 6*cosu*(1+sinu) + 4*half*Math.cos(v + Math.PI);
    y = 16*sinu;
  }
  z = 4*half*sinv;
  return new THREE.Vector3(x*SCALE, y*SCALE, z*SCALE);
}

/* ── Compute centroid of form for camera tracking ── */
let cx=0, cy=0, cz=0, nSamp=0;
for(let i=0; i<200; i++){
  const p = kleinPoint(rng()*Math.PI*2, rng()*Math.PI*2);
  cx += p.x; cy += p.y; cz += p.z; nSamp++;
}
CENTER.set(cx/nSamp, cy/nSamp, cz/nSamp);

/* ── Generate surface anchor points on the Klein bottle ── */
const NUM_SURFACE = 800;
const surfAnchors = [];
for(let i=0; i<NUM_SURFACE; i++){
  const u = rng()*Math.PI*2;
  const v = rng()*Math.PI*2;
  const p = kleinPoint(u, v);
  // slight normal jitter for thread thickness
  const nu = u + 0.01, nv = v + 0.01;
  const pu = kleinPoint(nu, v).sub(p).normalize();
  const pv = kleinPoint(u, nv).sub(p).normalize();
  const normal = new THREE.Vector3().crossVectors(pu, pv).normalize();
  const offset = (rng()-0.5)*0.12;
  p.add(normal.multiplyScalar(offset));
  surfAnchors.push({ pos: p, u, v });
}

/* ── Room walls for installation context ── */
const ROOM = { w: 24, h: 16, d: 36 };
function wallPoint(){
  const face = Math.floor(rng()*6);
  const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;
  let x,y,z;
  switch(face){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    case 5: z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

/* ── Build thread segments ── */
const NUM_LINES = 22000;
const linePositions = new Float32Array(NUM_LINES * 6);
const lineAlphas = new Float32Array(NUM_LINES * 2); // per-vertex alpha
let li = 0;

/* Cat A: surface-to-surface threads revealing topology (~45%) */
const catA = Math.floor(NUM_LINES * 0.45);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const ai = Math.floor(rng()*surfAnchors.length);
  const a = surfAnchors[ai].pos;
  // find nearby surface point (geodesic proximity via parameter space)
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*surfAnchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(surfAnchors[bi].pos);
    if(d < bestD && d > 0.05){ bestD = d; best = surfAnchors[bi].pos; }
  }
  if(!best || bestD > 2.8) { continue; }
  const idx = li*6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = best.x; linePositions[idx+4] = best.y; linePositions[idx+5] = best.z;
  // shorter threads = higher alpha (reveals local structure)
  const alpha = Math.max(0.04, Math.min(0.18, 0.22 - bestD*0.06));
  lineAlphas[li*2] = alpha; lineAlphas[li*2+1] = alpha;
  li++;
}

/* Cat B: wall-to-surface threads — installation context (~30%) */
const catB = Math.floor(NUM_LINES * 0.30);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPoint();
  const si = Math.floor(rng()*surfAnchors.length);
  const b = surfAnchors[si].pos.clone();
  b.x += (rng()-0.5)*0.3;
  b.y += (rng()-0.5)*0.3;
  b.z += (rng()-0.5)*0.3;
  const idx = li*6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  lineAlphas[li*2] = 0.035; lineAlphas[li*2+1] = 0.07;
  li++;
}

/* Cat C: threads tracing the self-intersection seam — topological emphasis (~15%) */
const catC = Math.floor(NUM_LINES * 0.15);
for(let i=0; i<catC && li<NUM_LINES; i++){
  // self-intersection region: u near π, tube passes through body
  const u1 = Math.PI + (rng()-0.5)*0.8;
  const v1 = rng()*Math.PI*2;
  const u2 = u1 + (rng()-0.5)*0.4;
  const v2 = v1 + (rng()-0.5)*1.2;
  const a = kleinPoint(u1, v1);
  const b = kleinPoint(u2, v2);
  const d = a.distanceTo(b);
  if(d > 2.0 || d < 0.02) { continue; }
  const idx = li*6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  lineAlphas[li*2] = 0.12; lineAlphas[li*2+1] = 0.12;
  li++;
}

/* Cat D: suspension threads from ceiling — physical legibility (~10%) */
const catD = Math.floor(NUM_LINES * 0.10);
const ceilingY = ROOM.h / 2;
for(let i=0; i<catD && li<NUM_LINES; i++){
  const si = Math.floor(rng()*surfAnchors.length);
  const b = surfAnchors[si].pos;
  // ceiling point roughly above
  const a = new THREE.Vector3(b.x + (rng()-0.5)*3, ceilingY, b.z + (rng()-0.5)*3);
  const idx = li*6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  lineAlphas[li*2] = 0.025; lineAlphas[li*2+1] = 0.06;
  li++;
}

const basePositions = new Float32Array(linePositions.slice(0, li*6));

/* ── Custom shader material for per-vertex alpha ── */
const threadMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0xb8001a) },
    uTime: { value: 0 },
    fogColor: { value: new THREE.Color(0x040404) },
    fogDensity: { value: 0.032 }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float fogDensity;
    void main(){
      vAlpha = alpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float fogDist = length(mvPos.xyz);
      vFogFactor = 1.0 - exp(-fogDensity * fogDensity * fogDist * fogDist);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform vec3 fogColor;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      vec3 col = mix(uColor, fogColor, vFogFactor);
      float a = vAlpha * (1.0 - vFogFactor * 0.7);
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions.slice(0, li*6), 3));
lineGeo.setAttribute('alpha', new THREE.BufferAttribute(lineAlphas.slice(0, li*2), 1));
const threads = new THREE.LineSegments(lineGeo, threadMat);
scene.add(threads);

/* ── Dense surface point-cloud for silhouette fill ── */
const NUM_DOTS = 50000;
const dotPos = new Float32Array(NUM_DOTS * 3);
const dotAlpha = new Float32Array(NUM_DOTS);
for(let i=0; i<NUM_DOTS; i++){
  const u = rng()*Math.PI*2;
  const v = rng()*Math.PI*2;
  const p = kleinPoint(u, v);
  // slight surface jitter
  p.x += (rng()-0.5)*0.06;
  p.y += (rng()-0.5)*0.06;
  p.z += (rng()-0.5)*0.06;
  dotPos[i*3]   = p.x;
  dotPos[i*3+1] = p.y;
  dotPos[i*3+2] = p.z;
  // higher alpha near self-intersection for emphasis
  const distFromSeam = Math.abs(u - Math.PI);
  dotAlpha[i] = distFromSeam < 0.6 ? 0.25 + rng()*0.15 : 0.08 + rng()*0.1;
}

const dotGeo = new THREE.BufferGeometry();
dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
dotGeo.setAttribute('alpha', new THREE.BufferAttribute(dotAlpha, 1));

const dotMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0xd4a08a) },
    fogColor: { value: new THREE.Color(0x040404) },
    fogDensity: { value: 0.032 },
    uSize: { value: 1.8 * renderer.getPixelRatio() }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float fogDensity;
    uniform float uSize;
    void main(){
      vAlpha = alpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float fogDist = length(mvPos.xyz);
      vFogFactor = 1.0 - exp(-fogDensity * fogDensity * fogDist * fogDist);
      gl_PointSize = uSize * (6.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform vec3 fogColor;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float falloff = 1.0 - smoothstep(0.2, 0.5, d);
      vec3 col = mix(uColor, fogColor, vFogFactor);
      float a = vAlpha * falloff * (1.0 - vFogFactor * 0.8);
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const dots = new THREE.Points(dotGeo, dotMat);
scene.add(dots);

/* ── Dark fragments caught in the web ── */
const NUM_FRAGMENTS = 14;
for(let i=0; i<NUM_FRAGMENTS; i++){
  const u = rng()*Math.PI*2, v = rng()*Math.PI*2;
  const p = kleinPoint(u, v);
  // push slightly off surface
  p.x += (rng()-0.5)*0.6;
  p.y += (rng()-0.5)*0.6;
  p.z += (rng()-0.5)*0.6;
  const size = 0.04 + rng()*0.12;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(size, size*(0.3+rng()*1.5), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04+rng()*0.05, 0.02+rng()*0.02, 0.02+rng()*0.01),
    transparent: true, opacity: 0.55+rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(p);
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

/* ── Faint glow at the self-intersection — topological heart ── */
const glowGeo = new THREE.SphereGeometry(0.8, 12, 8);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xc2001a,
  transparent: true,
  opacity: 0.04,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glowSphere = new THREE.Mesh(glowGeo, glowMat);
// place at the self-intersection region (u≈π)
const seamPt = kleinPoint(Math.PI, 0);
glowSphere.position.copy(seamPt);
scene.add(glowSphere);

/* ── Camera drift path — gentle exploration, not orbit ── */
const camRadius = 8.5;
const camDrift = { speed: 0.012, yAmp: 2.0, yBase: 0.5 };

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Animate ── */
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  /* Breathing: subtle displacement of thread vertices */
  const breathAmp = 0.012;
  const breathFreq = 0.25;
  const posAttr = lineGeo.attributes.position;
  const arr = posAttr.array;
  for(let i=0; i<li*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.9 + by*1.3 + bz*0.6;
    const b = Math.sin(elapsed*breathFreq + phase) * breathAmp;
    arr[i]   = bx + b;
    arr[i+1] = by + b*0.6;
    arr[i+2] = bz + b*0.4;
  }
  posAttr.needsUpdate = true;

  /* Glow pulse at self-intersection */
  glowMat.opacity = 0.03 + Math.sin(elapsed*0.4)*0.015;

  /* Camera: figure-8 drift path around the form */
  const t = elapsed * camDrift.speed;
  const cx = Math.sin(t) * camRadius;
  const cy = CENTER.y + camDrift.yBase + Math.sin(elapsed*0.008*Math.PI*2)*camDrift.yAmp;
  const cz = Math.sin(t*0.7 + 1.2) * camRadius * 0.8;
  camera.position.set(cx, cy, cz);

  /* Look toward centroid with gentle wander */
  const lookTarget = CENTER.clone();
  lookTarget.x += Math.sin(elapsed*0.03)*0.4;
  lookTarget.y += Math.cos(elapsed*0.025)*0.3;
  camera.lookAt(lookTarget);

  threadMat.uniforms.uTime.value = elapsed;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
