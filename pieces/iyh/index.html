<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iyh · Shiota — State of Being (Thread Drawing)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">iyh</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0022);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050101, 0.004));
const warmL = new THREE.PointLight(0xff2808, 0.012, 35, 2.2);
warmL.position.set(-2, 8, 1);
scene.add(warmL);

let seed = 8291647;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ── SINGLE SUSPENDED OBJECT — white sphere, the ONLY form in the void
// Shiota never places an object arbitrarily — it's always a REMEMBERED thing
// Here: a single pale sphere — a moon, a pearl, a memory held
const sphereCenter = new THREE.Vector3(0, 0.2, 0);
const sphereR = 1.5;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.6,
  roughness: 0.88, transparent: true, opacity: 0.85
});
const sphere = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 24, 16), sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0xfff8f0, 0.008, 9, 2.1);
sphereGlow.position.copy(sphereCenter);
scene.add(sphereGlow);

// ── ROOM VOLUME — architectural container
const ROOM = { w:22, h:18, d:20 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z+Math.cos(v)*sphereR
  );
}

// ── ANCHOR POINTS — icosahedral shells around sphere + wall scatter
const icoGeo = new THREE.IcosahedronGeometry(1, 1);
const icoPos = icoGeo.attributes.position;
const icoNorms = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNorms.push(v); }
}

const anchors = [];
const shellRadii = [2.8, 4.5, 6.8, 9.2, 11.8];
for(const sr of shellRadii){
  for(const n of icoNorms){
    const pt = new THREE.Vector3(
      sphereCenter.x+n.x*sr,
      sphereCenter.y+n.y*sr*0.75,
      sphereCenter.z+n.z*sr
    );
    if(Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
      anchors.push(pt);
    }
  }
}

// Wall anchors — threads terminate at room boundaries
for(let i=0; i<80; i++){
  anchors.push(wallPt());
}

// ── SUSPENSION THREADS — 8 vertical threads from ceiling to sphere crown
const suspensionAnchors = [];
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.2;
  const spread = 0.4+rng()*0.5;
  const top = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*spread*2.2,
    hh,
    sphereCenter.z+Math.sin(a)*spread*2.2
  );
  const bot = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*0.12,
    sphereCenter.y+sphereR-0.08,
    sphereCenter.z+Math.sin(a)*0.12
  );
  suspensionAnchors.push({ top, bot });
}

// ── THREAD NETWORK — 20,000 line segments max (hard budget)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  li++;
}

// ── 1. SUSPENSION
for(const {top, bot} of suspensionAnchors){
  setLine(top, bot);
}

// ── 2. RADIAL CONVERGENCE — anchors → sphere surface
// Every anchor in the volume SEES the sphere — threads converge like sight lines
for(let i=0; i<anchors.length && li<NUM_LINES-1000; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  const count = d<4.0?4 : d<7.0?3 : d<10.0?2 : 1;
  for(let j=0; j<count && li<NUM_LINES-500; j++){
    const target = sphereSurf();
    // 6% of threads stop short — threads that almost reach
    if(rng()<0.06){
      const dir = a.clone().sub(target).normalize();
      const shortfall = 0.2+rng()*1.1;
      setLine(a, target.clone().add(dir.multiplyScalar(shortfall)));
    } else {
      setLine(a, target);
    }
  }
}

// ── 3. PROXIMITY WEB — anchor-to-anchor
const THRESH = 5.2;
let webCount=0, attempts=0;
while(webCount<3500 && li<NUM_LINES-500 && attempts<25000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<8; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// ── 4. RADIAL FILAMENTS — threads radiating outward from sphere surface
for(let i=0; i<800 && li<NUM_LINES; i++){
  const sp = sphereSurf();
  const dir = sp.clone().sub(sphereCenter).normalize();
  dir.x+=(rng()-0.5)*0.3; dir.y+=(rng()-0.5)*0.3; dir.z+=(rng()-0.5)*0.3;
  dir.normalize();
  const len = 1.5+rng()*4.0;
  const end = sp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(sp, end);
  }
}

// ── 5. WALL SPANS — fill remaining budget with long room-spanning threads
while(li<NUM_LINES-1){
  const a=wallPt();
  const t=rng();
  const b = t<0.3 ? sphereSurf() : t<0.6 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single arterial red, opacity varies by distance to sphere
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.10, 1.0-d*0.032);
  const a = 0.075*distFade;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = bR*a;
    colors[i*6+v*3+1] = bG*a*0.4;
    colors[i*6+v*3+2] = bB*a*0.25;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.085,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// ── CAMERA PATH — slow walk INSIDE the network
// Narrative: approach from darkness → orbit close to sphere seeing threads cross →
// descend below looking up through the web → rise through dense thread layer →
// pull back to architectural view → recede into void
const pathLen = 2500;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.12){
    // Approach from side darkness
    const lt=t/0.12;
    x = sphereCenter.x-8.5+lt*3.5;
    y = sphereCenter.y+1.8-lt*0.6;
    z = sphereCenter.z+4.5-lt*1.2;
  } else if(t<0.28){
    // Close orbit — threads crossing vision
    const lt=(t-0.12)/0.16;
    const rH=3.5+Math.sin(lt*Math.PI)*0.4;
    const angle=lt*Math.PI*1.3+0.3;
    x = sphereCenter.x+Math.cos(angle)*rH;
    y = sphereCenter.y+0.5+Math.sin(lt*Math.PI*0.7)*0.6;
    z = sphereCenter.z+Math.sin(angle)*rH;
  } else if(t<0.42){
    // Descend below — look up through converging threads
    const lt=(t-0.28)/0.14;
    const rH=3.2+lt*0.8;
    const angle=lt*Math.PI*0.5+1.6;
    x = sphereCenter.x+Math.cos(angle)*rH;
    y = sphereCenter.y-lt*5.5;
    z = sphereCenter.z+Math.sin(angle)*rH;
  } else if(t<0.56){
    // Rise through dense layer — threads as atmosphere
    const lt=(t-0.42)/0.14;
    x = sphereCenter.x+Math.sin(lt*Math.PI*0.6+2.5)*2.8;
    y = sphereCenter.y-5.5+lt*12.0;
    z = sphereCenter.z+Math.cos(lt*Math.PI*0.6+2.5)*3.2;
  } else if(t<0.72){
    // Architectural overhead — see the installation as volume
    const lt=(t-0.56)/0.16;
    const rH=6.5+lt*2.5;
    const angle=lt*Math.PI*0.7+3.8;
    x = sphereCenter.x+Math.cos(angle)*rH;
    y = sphereCenter.y+6.0+lt*2.0;
    z = sphereCenter.z+Math.sin(angle)*rH;
  } else {
    // Recede into void — form dissolves into darkness
    const lt=(t-0.72)/0.28;
    const rH=9.0+lt*8.0;
    x = sphereCenter.x+Math.cos(lt*Math.PI*0.4+4.5)*rH;
    y = sphereCenter.y+8.0-lt*4.0;
    z = sphereCenter.z+Math.sin(lt*Math.PI*0.4+4.5)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
let lookTarget = sphereCenter.clone();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — anchor jitter <0.3% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.032+i*0.00012;
    const breath = Math.sin(elapsed*0.0005+phase)*0.00003;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.025;
      arr[vi+1] = basePositions[vi+1] + breath*0.018;
      arr[vi+2] = basePositions[vi+2] + breath*0.022;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000028;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target drifts slightly around sphere
  lookTarget.x = sphereCenter.x + Math.sin(elapsed*0.00011)*0.08;
  lookTarget.y = sphereCenter.y + Math.cos(elapsed*0.00009)*0.06;
  lookTarget.z = sphereCenter.z + Math.sin(elapsed*0.00013+1.2)*0.07;
  camera.lookAt(lookTarget);

  // Light breathing
  warmL.intensity = 0.012+Math.sin(elapsed*0.00006)*0.004;
  sphereGlow.intensity = 0.008+Math.sin(elapsed*0.00007+0.8)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
