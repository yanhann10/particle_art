<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

// Quayola — LiDAR orchard tree with scan errors preserved: missing blocks (occlusion),
// depth-proportional noise (laser falloff), pale gray-on-near-black. The tree is
// generated via L-system skeleton → point-sampled cylinders → Gaussian noise.
// Camera orbit reveals the form as a failing scan, not a botanical model.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0a0b, 8, 28);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 12);
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0b);
document.body.appendChild(renderer.domElement);

// ────────────── L-system tree skeleton
// rules: F → F[+F]F[-F]F   (bracketed branching)
// angle: 22.5°, 5 iterations
function lsystem(axiom, rules, iters){
  let s = axiom;
  for (let i = 0; i < iters; i++){
    let next = '';
    for (let c of s){
      next += rules[c] !== undefined ? rules[c] : c;
    }
    s = next;
  }
  return s;
}
const axiom = 'F';
const rules = { 'F': 'F[+F]F[-F]F' };
const instruction = lsystem(axiom, rules, 5);

// turtle-walk the L-string to build skeleton segments
const angle = 22.5 * Math.PI / 180;
const stepLen = 0.18;
const segments = [];
const stack = [];
let pos = new THREE.Vector3(0, 0, 0);
let dir = new THREE.Vector3(0, 1, 0);  // up
let radius = 0.08;
for (let c of instruction){
  if (c === 'F'){
    const end = pos.clone().add(dir.clone().multiplyScalar(stepLen));
    segments.push({ start: pos.clone(), end: end.clone(), r: radius });
    pos = end;
    radius *= 0.96;  // taper
  } else if (c === '+'){
    // rotate dir around z-axis
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const x = dir.x * ca - dir.y * sa;
    const y = dir.x * sa + dir.y * ca;
    dir.set(x, y, dir.z);
  } else if (c === '-'){
    const ca = Math.cos(-angle), sa = Math.sin(-angle);
    const x = dir.x * ca - dir.y * sa;
    const y = dir.x * sa + dir.y * ca;
    dir.set(x, y, dir.z);
  } else if (c === '['){
    stack.push({ pos: pos.clone(), dir: dir.clone(), r: radius });
  } else if (c === ']'){
    const state = stack.pop();
    pos = state.pos; dir = state.dir; radius = state.r;
  }
}

// ────────────── convert skeleton to noisy point cloud
const rng = new Uint32Array(1);
rng[0] = 0x6d2b79f5;
function rand(){
  rng[0] = Math.imul(rng[0] ^ (rng[0] >>> 16), 0x85ebca6b);
  rng[0] = Math.imul(rng[0] ^ (rng[0] >>> 13), 0xc2b2ae35);
  return ((rng[0] ^ (rng[0] >>> 16)) >>> 0) / 4294967296;
}
function randn(){ return Math.sqrt(-2*Math.log(rand())) * Math.cos(2*Math.PI*rand()); }

const pointsPerSeg = 220;
const positions = [];
const occlusionBlocks = [];
// deterministically mark 30% of segments as occluded
for (let i = 0; i < segments.length; i++){
  rng[0] = i + 12345;
  if (rand() < 0.30) occlusionBlocks.push(i);
}
const occSet = new Set(occlusionBlocks);

segments.forEach((seg, idx) => {
  if (occSet.has(idx)) return;  // occlusion — no points
  const len = seg.start.distanceTo(seg.end);
  const axis = new THREE.Vector3().subVectors(seg.end, seg.start).normalize();
  const perp1 = new THREE.Vector3();
  if (Math.abs(axis.y) < 0.9){
    perp1.crossVectors(axis, new THREE.Vector3(0,1,0)).normalize();
  } else {
    perp1.crossVectors(axis, new THREE.Vector3(1,0,0)).normalize();
  }
  const perp2 = new THREE.Vector3().crossVectors(axis, perp1).normalize();
  for (let i = 0; i < pointsPerSeg; i++){
    const t = rand();
    const pos = seg.start.clone().lerp(seg.end, t);
    // sample on cylinder surface
    const th = rand() * Math.PI * 2;
    const rr = seg.r * Math.sqrt(rand());
    pos.add(perp1.clone().multiplyScalar(rr * Math.cos(th)));
    pos.add(perp2.clone().multiplyScalar(rr * Math.sin(th)));
    positions.push(pos.x, pos.y, pos.z);
  }
});

const N = positions.length / 3;
const posArr = new Float32Array(positions);
const depthNoise = new Float32Array(N);
for (let i = 0; i < N; i++){
  depthNoise[i] = rand();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geom.setAttribute('depthNoise', new THREE.BufferAttribute(depthNoise, 1));
geom.computeBoundingBox();
const center = new THREE.Vector3();
geom.boundingBox.getCenter(center);

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value:0 },
    uPixel: { value: renderer.getPixelRatio() },
    uCamPos: { value: camera.position }
  },
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec3 uCamPos;
    attribute float depthNoise;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // camera distance
      float dist = distance(p, uCamPos);
      // LiDAR noise increases with depth — Gaussian displacement
      float noiseAmt = 0.012 + 0.10 * smoothstep(6.0, 18.0, dist);
      // pseudo-Gaussian offset (stored depthNoise is uniform [0,1], we treat it as seed)
      float ang = depthNoise * 6.2832;
      float mag = sqrt(-2.0 * log(max(0.001, depthNoise))) * noiseAmt;
      p.x += cos(ang) * mag;
      p.y += sin(ang) * mag;
      p.z += cos(ang + 1.57) * mag;
      // slow pulsing breath — biomorphic, not mechanical
      float breath = sin(uTime * 0.18 + depthNoise * 6.28) * 0.005;
      p.y += breath;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      // alpha falloff with depth (scan degrades farther from sensor)
      vAlpha = clamp(1.0 - (depth - 6.0) / 22.0, 0.05, 0.85);
      gl_PointSize = (1.2 + 0.4 * depthNoise) * uPixel * (6.0 / depth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0);
      // pale gray — Quayola's signature near-monochrome
      vec3 col = vec3(0.78, 0.80, 0.82);
      gl_FragColor = vec4(col, a * vAlpha * 0.75);
    }
  `
});
const points = new THREE.Points(geom, mat);
points.position.sub(center);  // center the tree at origin
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  mat.uniforms.uTime.value = t;
  // slow camera orbit — revealing the 3D scan structure
  const orbitRadius = 12;
  const orbitSpeed = 0.08;
  camera.position.x = Math.sin(t * orbitSpeed) * orbitRadius;
  camera.position.z = Math.cos(t * orbitSpeed) * orbitRadius;
  camera.position.y = 3 + Math.sin(t * 0.05) * 0.8;
  camera.lookAt(0, 2, 0);
  mat.uniforms.uCamPos.value.copy(camera.position);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
