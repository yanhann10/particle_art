<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o5o · doris salcedo · ghostly</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading …</div>
<div class="id">o5o</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const BG = 0x0d0c0a;
const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 0.5, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;

const N = 65000;
const restPos = new Float32Array(N * 3);
const seeds   = new Float32Array(N);
const normals = new Float32Array(N * 3);

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReady:  { value: 0 },
  uErode:  { value: 0 },
  uBg:     { value: new THREE.Color(BG) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uErode;
    attribute vec3 rest;
    attribute vec3 norm;
    attribute float seed;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vGhost;

    // simple hash
    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec3 p = rest;
      float t = uTime;

      // each particle has an erosion threshold based on position + randomness
      // erosion sweeps downward like concrete crumbling
      float erodeY = mix(4.5, -5.0, uErode);
      float yFactor = smoothstep(erodeY + 1.5, erodeY - 0.5, p.y);
      float erodeThresh = yFactor * (0.3 + 0.7 * hash(seed * 137.0));

      // once eroded, particle detaches and falls like ash
      float detached = smoothstep(0.0, 0.15, erodeThresh);
      vGhost = detached;

      // detached particles drift down and outward along normal
      float fallTime = max(0.0, uErode - (1.0 - (p.y + 4.0) / 8.0)) * 8.0;
      float drift = detached * fallTime;
      vec3 fallDir = normalize(norm + vec3(0.0, -0.6, 0.0));
      // add slight horizontal wander
      fallDir.x += 0.15 * sin(seed * 31.0 + t * 0.3);
      fallDir.z += 0.15 * cos(seed * 47.0 + t * 0.2);
      p += fallDir * drift * (0.3 + 0.4 * hash(seed * 97.0));

      // gravity pull on detached
      p.y -= detached * drift * drift * 0.02;

      // remaining particles: very subtle breathing, heavy, slow
      float breathe = (1.0 - detached) * 0.005 * sin(t * 0.4 + seed * 6.28);
      p += norm * breathe;

      // reveal: fade in from nothing, slow emergence
      float th = seed * 6.28;
      vec3 entry = p + norm * 2.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // color: concrete, ash, bone — Salcedo palette
      // warm concrete gray base
      vec3 concrete = vec3(0.58, 0.54, 0.50);
      // ash / dust
      vec3 ash = vec3(0.72, 0.68, 0.64);
      // bone white for highlights
      vec3 bone = vec3(0.82, 0.78, 0.72);
      // dark graphite for shadows
      vec3 graphite = vec3(0.28, 0.26, 0.25);

      float k = hash(seed * 73.0);
      vec3 col = mix(concrete, graphite, smoothstep(0.0, 0.4, k));
      col = mix(col, ash, smoothstep(0.4, 0.7, k));
      col = mix(col, bone, smoothstep(0.8, 1.0, k) * 0.4);

      // detached particles become paler, more ghostly
      col = mix(col, ash * 1.1, detached * 0.6);

      // fade detached particles over time
      float fadeOut = 1.0 - smoothstep(1.5, 4.0, drift);
      // remaining particles dim slightly at edges
      float stayAlpha = (1.0 - detached) * (0.35 + 0.25 * (0.5 + 0.5 * sin(t * 0.3 + seed * 4.0)));

      vAlpha = mix(stayAlpha, 0.18 * fadeOut, detached) * uReady;
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = mix(0.8, 0.5, detached);
      gl_PointSize = baseSize * uPixel * (40.0 / dist) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;

      // cull fully faded
      if (vAlpha < 0.005) gl_Position = vec4(9999.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uBg;
    varying float vAlpha;
    varying vec3 vCol;
    varying float vGhost;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      // softer falloff for ghostly particles, sharper for solid
      float falloff = mix(14.0, 8.0, vGhost);
      float a = exp(-r * falloff) * vAlpha;
      // fog: manual linear fog toward background
      vec3 col = vCol;
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

// — dust motes floating in space — the absent, the trace —
const DUST_N = 3000;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustSeed = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 20;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 16;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
  dustSeed[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uErode;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      float t = uTime;
      // slow drift
      p.y += sin(t * 0.08 + seed * 6.28) * 0.3;
      p.x += cos(t * 0.05 + seed * 3.14) * 0.2;
      // only appear as erosion progresses
      vA = smoothstep(0.1, 0.5, uErode) * (0.04 + 0.03 * sin(t * 0.5 + seed * 20.0));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.2 * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      vec3 col = vec3(0.65, 0.60, 0.55);
      gl_FragColor = vec4(col * vA, vA);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

let revealStart = 0;
const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';

new GLTFLoader().load(HEAD_URL,
  (gltf) => {
    let target = null;
    gltf.scene.traverse(o => { if (!target && o.isMesh && o.geometry?.attributes?.position) target = o; });
    if (!target) { document.getElementById('loading').textContent = 'no mesh'; return; }
    target.updateMatrixWorld(true);

    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    g.computeVertexNormals();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const scl = 8 / Math.max(size.x, size.y, size.z);
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    sampleMesh.geometry.computeVertexNormals();
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const tmp = new THREE.Vector3();
    const tmpN = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      sampler.sample(tmp, tmpN);
      restPos[i * 3]     = tmp.x;
      restPos[i * 3 + 1] = tmp.y;
      restPos[i * 3 + 2] = tmp.z;
      normals[i * 3]     = tmpN.x;
      normals[i * 3 + 1] = tmpN.y;
      normals[i * 3 + 2] = tmpN.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(restPos.slice(), 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('norm',     new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    const since = (performance.now() - revealStart) / 1000;
    // slow reveal over 4 seconds
    uniforms.uReady.value = Math.min(1.0, since / 4.0);
    // erosion begins after 6s, progresses very slowly over 40s
    // then holds and cycles gently — the absence breathes
    const erodeStart = 6.0;
    if (since > erodeStart) {
      const erodeT = (since - erodeStart) / 45.0;
      // oscillate between 0.0 and 0.85 — never fully gone
      const cycle = Math.min(erodeT, 1.0);
      uniforms.uErode.value = 0.85 * (0.5 - 0.5 * Math.cos(cycle * Math.PI));
    }
  }

  // very slow camera drift — contemplative distance
  const camT = elapsed * 0.02;
  camera.position.x = Math.sin(camT) * 1.2;
  camera.position.y = 0.5 + Math.sin(camT * 0.7) * 0.3;
  camera.lookAt(0, 0, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
