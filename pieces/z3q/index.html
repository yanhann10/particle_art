<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z3q · tender paired forms</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a09; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">z3q</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · paired absence · tender drift</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* Tender paired forms — two identical robot figures slowly
   orbit each other, surrounded by warm drifting light particles.
   Felix Gonzalez-Torres signature: the paired object, the absent
   lover, the slow domestic ritual of proximity. */

const BG = 0x0d0a09;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.8, 9);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.8, 0);

let paused = false;
addEventListener('click', () => { paused = !paused; });

// load robot model — two instances, paired
const loader = new GLTFLoader();
const robots = [];
let modelLoaded = false;

loader.load(
  'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
  (gltf) => {
    const model = gltf.scene;
    
    // compute bounding box to scale uniformly
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const targetSize = 1.8;
    const scale = targetSize / maxDim;
    
    // create two instances
    for (let i = 0; i < 2; i++) {
      const clone = model.clone();
      clone.scale.setScalar(scale);
      
      // position them facing each other, separated
      const x = (i === 0 ? -1.5 : 1.5);
      clone.position.set(x, 0, 0);
      clone.rotation.y = (i === 0 ? Math.PI * 0.25 : -Math.PI * 0.75);
      
      // muted warm material — tender, not bright
      clone.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xc9b8a0,
            metalness: 0.1,
            roughness: 0.85,
            emissive: 0x3a2f28,
            emissiveIntensity: 0.15
          });
        }
      });
      
      scene.add(clone);
      robots.push(clone);
    }
    
    modelLoaded = true;
  },
  undefined,
  (err) => {
    console.error('Model load failed:', err);
    // fallback: two simple boxes as paired forms
    for (let i = 0; i < 2; i++) {
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.6, 0.6),
        new THREE.MeshStandardMaterial({
          color: 0xc9b8a0,
          metalness: 0.1,
          roughness: 0.85,
          emissive: 0x3a2f28,
          emissiveIntensity: 0.15
        })
      );
      const x = (i === 0 ? -1.5 : 1.5);
      box.position.set(x, 0.8, 0);
      box.rotation.y = (i === 0 ? Math.PI * 0.25 : -Math.PI * 0.75);
      scene.add(box);
      robots.push(box);
    }
    modelLoaded = true;
  }
);

// gentle ambient light from above
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

// one warm directional light — soft side-lighting
const dirLight = new THREE.DirectionalLight(0xffddbb, 0.55);
dirLight.position.set(-4, 6, 3);
scene.add(dirLight);

// --- particles: 40k warm drift around the paired figures ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rPhase = new Float32Array(N_RENDER);

// initialize: toroidal distribution around the center, gentle spread
const R_INNER = 2.5;
const R_OUTER = 6.0;
for (let i = 0; i < N_RENDER; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = R_INNER + Math.random() * (R_OUTER - R_INNER);
  const h = (Math.random() - 0.5) * 3.5;
  rPos[i * 3]     = Math.cos(theta) * r;
  rPos[i * 3 + 1] = h;
  rPos[i * 3 + 2] = Math.sin(theta) * r;
  rSeeds[i] = Math.random();
  rPhase[i] = Math.random() * Math.PI * 2;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('phase',    new THREE.BufferAttribute(rPhase, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.025 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float phase;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float uFogDensity;

    void main() {
      vec3 p = position;

      // very slow circular drift — particles orbit the pair
      float t = uTime * 0.08 + phase;
      float rot = 0.015;
      float c = cos(t * rot), s = sin(t * rot);
      float px = p.x * c - p.z * s;
      float pz = p.x * s + p.z * c;
      p.x = px;
      p.z = pz;

      // gentle vertical drift — rising warm air
      p.y += sin(uTime * 0.2 + seed * 6.28) * 0.08;

      // slight radial breathing
      float breath = 1.0 + sin(uTime * 0.15 + seed * 3.14) * 0.02;
      p.x *= breath;
      p.z *= breath;

      // pulse per particle — very gentle
      float pulse = 0.88 + 0.12 * sin(uTime * 0.5 + seed * 20.0);

      // palette: warm amber → soft peach → pale cream
      // domestic warmth, not gallery brightness
      vec3 amber = vec3(1.0, 0.68, 0.30);
      vec3 peach = vec3(1.0, 0.82, 0.65);
      vec3 cream = vec3(1.0, 0.94, 0.88);
      
      float k = seed;
      vCol = mix(amber, peach, k);
      vCol = mix(vCol, cream, smoothstep(0.6, 1.0, k) * 0.4);
      vCol *= pulse;

      vAlpha = 0.45 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // small particle size — subtle presence
      gl_PointSize = 1.5 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;

      // fog
      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // soft glow falloff
      float core = exp(-r * 20.0);
      float halo = exp(-r * 7.0) * 0.3;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.75);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (!paused && modelLoaded && robots.length === 2) {
    // very slow counter-rotation of the two figures
    // they orbit each other like a binary star — tender, not dramatic
    const orbitSpeed = 0.03;
    const orbitAngle = t * orbitSpeed;
    
    robots[0].position.x = -1.5 * Math.cos(orbitAngle);
    robots[0].position.z = -1.5 * Math.sin(orbitAngle);
    robots[0].rotation.y = -orbitAngle + Math.PI * 0.25;
    
    robots[1].position.x = 1.5 * Math.cos(orbitAngle);
    robots[1].position.z = 1.5 * Math.sin(orbitAngle);
    robots[1].rotation.y = -orbitAngle - Math.PI * 0.75;
  }

  // camera tracks the midpoint between the two figures
  if (robots.length === 2) {
    const cx = (robots[0].position.x + robots[1].position.x) * 0.5;
    const cy = (robots[0].position.y + robots[1].position.y) * 0.5 + 0.8;
    const cz = (robots[0].position.z + robots[1].position.z) * 0.5;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
  }

  statEl.textContent = `N=${N_RENDER}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
