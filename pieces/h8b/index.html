<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h8b · yo-yo descent through atmosphere</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">h8b</div>
<div class="hint">watch the descent · click to reset</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// SURPRISE: The Riley calyx form becomes a yo-yo — two disks connected by an axle,
// slowly descending through the atmosphere. The form oscillates gently (like a yo-yo
// on a string) as it falls. At random intervals (every 4-7 seconds), it suddenly
// BOUNCES UP briefly before resuming descent — the yo-yo reaching the end of its
// string and rebounding. The surprise is the comic timing of the bounce: orderly
// fall → sudden upward jerk → resume fall. Playful, not chaotic.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;
function buildYoYo(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w2 = { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 };
  const w3 = { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0;
  let attempts = 0;
  // Build TWO disks (top and bottom of yo-yo) + axle
  while (written < N && attempts < N * 16){
    attempts++;
    const diskChoice = rng() < 0.92 ? (rng() < 0.5 ? 0 : 1) : 2; // 92% disks, 8% axle
    
    if (diskChoice < 2) {
      // disk (top=0, bottom=1)
      const r = Math.sqrt(rng()) * 3.2;
      const th = rng() * Math.PI * 2;
      const x = r * Math.cos(th);
      const z = r * Math.sin(th);
      const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
      const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
      const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
      const vR = Math.sin(r * radK);
      const f  = (v1 + v2 + v3 + vR) * 0.25;
      const fall = Math.exp(-r * r * 0.12);
      const accept = (f > 0) && (rng() < fall * (0.4 + 0.6 * f));
      if (!accept) continue;
      const petals = 6;
      const scallop = Math.cos(th * petals) * 0.10 * (r / 3.2);
      const yBase = diskChoice === 0 ? 1.8 : -1.8; // separation between disks
      const y = yBase + (-0.08 * r * r + scallop);
      positions[written*3]     = x;
      positions[written*3 + 1] = y;
      positions[written*3 + 2] = z;
      seeds[written]           = rng();
      written++;
    } else {
      // axle — thin cylinder connecting the two disks
      const r = 0.20 + rng() * 0.15;
      const th = rng() * Math.PI * 2;
      const x = r * Math.cos(th);
      const z = r * Math.sin(th);
      const y = (rng() - 0.5) * 3.4; // spans between disks
      positions[written*3]     = x;
      positions[written*3 + 1] = y;
      positions[written*3 + 2] = z;
      seeds[written]           = rng();
      written++;
    }
  }
  for (let i = written; i < N; i++){
    positions[i*3] = 0; positions[i*3+1] = -100; positions[i*3+2] = 0;
    seeds[i] = 0;
  }
}
buildYoYo(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uYPos:   { value: 0 },  // global y-offset for descent
  uSpin:   { value: 0 }   // rotation around vertical axis
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYPos;
    uniform float uSpin;
    attribute float seed;
    varying float vDepth;
    varying float vSeed;
    void main(){
      vec3 p = position;
      // rotate around y-axis (yo-yo spinning as it descends)
      float c = cos(uSpin);
      float s = sin(uSpin);
      vec3 q = vec3(p.x * c - p.z * s, p.y, p.x * s + p.z * c);
      // apply global descent
      q.y += uYPos;
      // subtle wobble (yo-yo oscillating on string)
      float t = uTime * 0.7 + seed * 6.28;
      q.x += sin(t * 1.5) * 0.08;
      q.z += cos(t * 1.3) * 0.08;
      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      gl_PointSize = (1.4 + 0.8 * sin(t * 0.7)) * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      gl_FragColor = vec4(col, a * 0.78 * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// dust motes
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 14;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildYoYo(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  yPos = 0;
  yVel = 0;
  nextBounceTime = start + (4 + Math.random() * 3) * 1000;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let yPos = 0;
let yVel = 0;
const gravity = 0.8;      // descent rate
const bounceVel = 2.5;    // upward velocity on bounce
let nextBounceTime = start + (4 + Math.random() * 3) * 1000;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  
  // yo-yo descent physics
  yVel -= gravity * 0.016;  // gravity pulls down
  yPos += yVel * 0.016;
  
  // SURPRISE: random bounce (yo-yo hits end of string and jerks back up)
  if (now >= nextBounceTime && yVel < 0) {
    yVel = bounceVel;  // sudden upward velocity
    nextBounceTime = now + (4 + Math.random() * 3) * 1000;  // next bounce in 4-7 sec
  }
  
  // reset if fallen too far
  if (yPos < -20) {
    yPos = 0;
    yVel = 0;
  }
  
  uniforms.uYPos.value = yPos;
  uniforms.uSpin.value = t * 1.2;  // yo-yo spins as it descends
  
  camera.position.y = yPos * 0.8;  // camera follows descent (not locked)
  camera.lookAt(0, yPos, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
