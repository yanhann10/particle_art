<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g9l · calyx marbling</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede1; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#2d2d2d; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; color:#2d2d2d; }
</style>
</head>
<body>
<div class="id">g9l · calyx marbling</div>
<div class="hint">drag to comb · suminagashi → calyx</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 1024, H = 1024;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede1, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping,
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: calyx-shaped dye — 5-fold radial sepals with curved marbling veins
const init = new Float32Array(W * H * 4);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = (y * W + x) * 4;
  const px = (x / W - 0.5) * 2;
  const py = (y / H - 0.5) * 2;
  const r = Math.sqrt(px * px + py * py);
  const angle = Math.atan2(py, px);

  // 5-fold sepal lobes
  const nPetals = 5.0;
  const petalAngle = angle * nPetals;
  const petalShape = Math.cos(petalAngle) * 0.5 + 0.5;

  // calyx envelope — tapers at edge, cups in center
  const envelope = Math.max(0, 1.0 - r * 1.1) * (0.4 + petalShape * 0.6);

  // marbling veins within calyx: concentric rings modulated by sepal lobes
  const veinFreq = r * 22.0 + Math.sin(petalAngle) * 1.5 + Math.sin(angle * 2.0) * 0.8;
  const veinPhase = veinFreq % 1.0;
  const vein = veinPhase < 0.12 ? 1.0 : 0.0;

  // radial veins along sepal midribs
  const midribAngle = ((angle / Math.PI * nPetals * 0.5) + 0.5) % 1.0;
  const midrib = (midribAngle < 0.03 || midribAngle > 0.97) && r > 0.15 && r < 0.85 ? 0.7 : 0.0;

  const inkStrength = Math.max(vein, midrib) * envelope;

  // subtle green-sepal hue variation
  const hueVar = Math.sin(angle * nPetals + r * 4.0) * 0.5 + 0.5;

  init[i]     = 0.0;
  init[i + 1] = 0.0;
  init[i + 2] = inkStrength * (0.85 + hueVar * 0.15);
  init[i + 3] = inkStrength * hueVar * 0.5;
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// advection
const advectUniforms = {
  state: { value: rtA.texture },
  uDt: { value: 0.016 },
  uTexelSize: { value: new THREE.Vector2(1/W, 1/H) },
  uDissipation: { value: 0.9994 },
  uDyeDecay: { value: 0.9997 }
};
const advectMat = new THREE.ShaderMaterial({
  uniforms: advectUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uDt;
    uniform vec2 uTexelSize;
    uniform float uDissipation;
    uniform float uDyeDecay;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 coord = vUv - s.xy * uDt * uTexelSize * 80.0;
      vec4 adv = texture2D(state, coord);
      gl_FragColor = vec4(adv.xy * uDissipation, adv.zw * uDyeDecay);
    }
  `
});
const advectScene = new THREE.Scene();
advectScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), advectMat));

// impulse — velocity splat
const impulseUniforms = {
  state: { value: rtB.texture },
  uPoint: { value: new THREE.Vector2(0.5, 0.5) },
  uForce: { value: new THREE.Vector2(0, 0) },
  uRadius: { value: 0.018 }
};
const impulseMat = new THREE.ShaderMaterial({
  uniforms: impulseUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform vec2 uPoint;
    uniform vec2 uForce;
    uniform float uRadius;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      float dist = length(vUv - uPoint);
      float falloff = exp(-dist * dist / (uRadius * uRadius));
      s.xy += uForce * falloff * 0.8;
      gl_FragColor = s;
    }
  `
});
const impulseScene = new THREE.Scene();
impulseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), impulseMat));

// autonomous breathing — gentle radial pulses like a calyx opening/closing
const breathUniforms = {
  state: { value: rtA.texture },
  uTime: { value: 0.0 },
  uTexelSize: { value: new THREE.Vector2(1/W, 1/H) }
};
const breathMat = new THREE.ShaderMaterial({
  uniforms: breathUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uTime;
    uniform vec2 uTexelSize;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 center = vec2(0.5);
      vec2 toCenter = center - vUv;
      float r = length(toCenter);
      float angle = atan(toCenter.y, toCenter.x);
      // 5-fold breathing pulse
      float pulse = sin(uTime * 0.4) * 0.3 + sin(uTime * 0.17) * 0.2;
      float sepalMod = cos(angle * 5.0) * 0.5 + 0.5;
      float radialForce = pulse * sepalMod * smoothstep(0.6, 0.1, r) * 0.0012;
      vec2 breathForce = normalize(toCenter + 0.0001) * radialForce;
      s.xy += breathForce;
      gl_FragColor = s;
    }
  `
});
const breathScene = new THREE.Scene();
breathScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), breathMat));

// display: cupped calyx geometry
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 3.2);
camera.lookAt(0, 0.15, 0);

const calyxGeom = new THREE.PlaneGeometry(2.6, 2.6, 128, 128);
const calyxMat = new THREE.ShaderMaterial({
  uniforms: {
    dyeMap: { value: rtA.texture },
    uTime: { value: 0 },
    uCup: { value: 0.0 }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uCup;
    varying vec2 vUv;
    void main(){
      vUv = uv;
      vec3 pos = position;
      // cup the plane into a calyx bowl shape
      vec2 c = uv - 0.5;
      float r = length(c) * 2.0;
      float angle = atan(c.y, c.x);
      // 5-fold sepal ridges
      float sepal = cos(angle * 5.0) * 0.5 + 0.5;
      // bowl cupping — edges rise, center stays
      float cup = r * r * uCup * (0.6 + sepal * 0.4);
      // slight sepal tip lift at the rim
      float tipLift = smoothstep(0.7, 1.0, r) * sepal * uCup * 0.3;
      pos.z += cup + tipLift;
      // gentle breathing displacement
      float breathe = sin(uTime * 0.4) * 0.02 * sepal * r;
      pos.z += breathe;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dyeMap;
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(dyeMap, vUv);
      vec2 dye = s.zw;
      float inkDensity = dye.x;
      // calyx palette: deep green-black ink on warm cream
      vec3 inkBase = vec3(0.08, 0.14, 0.10);
      // sepal green tint from dye.y channel
      vec3 sepalGreen = vec3(0.12, 0.28, 0.15);
      vec3 finalInk = mix(inkBase, sepalGreen, dye.y * 0.7);
      vec3 paperColor = vec3(0.96, 0.93, 0.88);
      vec3 col = mix(paperColor, finalInk, inkDensity);
      // subtle vein darkening at high density
      col -= vec3(0.03) * smoothstep(0.6, 1.0, inkDensity);
      // paper grain
      float noise = fract(sin(dot(vUv * 512.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (noise - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const calyxMesh = new THREE.Mesh(calyxGeom, calyxMat);
calyxMesh.rotation.x = -0.35;
scene.add(calyxMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let prevPointer = { x: 0.5, y: 0.5 };
let currentPointer = { x: 0.5, y: 0.5 };
let isDragging = false;

addEventListener('pointerdown', (e) => {
  isDragging = true;
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { x, y };
  currentPointer = { x, y };
});
addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { ...currentPointer };
  currentPointer = { x, y };
});
addEventListener('pointerup', () => { isDragging = false; });

let lastTime = performance.now();
let cupAmount = 0.0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  const t = now / 1000;

  // slowly cup open over first 8 seconds
  cupAmount = Math.min(0.55, cupAmount + dt * 0.07);

  // breathing pass — autonomous calyx pulse
  breathUniforms.state.value = rtA.texture;
  breathUniforms.uTime.value = t;
  renderer.setRenderTarget(rtB);
  renderer.render(breathScene, camOrtho);

  let tmp = rtA; rtA = rtB; rtB = tmp;

  // advection pass
  advectUniforms.state.value = rtA.texture;
  advectUniforms.uDt.value = dt;
  renderer.setRenderTarget(rtB);
  renderer.render(advectScene, camOrtho);

  // impulse pass if dragging
  if (isDragging) {
    const dx = currentPointer.x - prevPointer.x;
    const dy = currentPointer.y - prevPointer.y;
    if (Math.abs(dx) > 0.0001 || Math.abs(dy) > 0.0001) {
      impulseUniforms.state.value = rtB.texture;
      impulseUniforms.uPoint.value.set(currentPointer.x, currentPointer.y);
      impulseUniforms.uForce.value.set(dx * 5.0, dy * 5.0);
      renderer.setRenderTarget(rtA);
      renderer.render(impulseScene, camOrtho);
      // re-advect
      advectUniforms.state.value = rtA.texture;
      renderer.setRenderTarget(rtB);
      renderer.render(advectScene, camOrtho);
    }
  }

  tmp = rtA; rtA = rtB; rtB = tmp;

  renderer.setRenderTarget(null);

  // animate cupping and gentle rotation
  calyxMat.uniforms.dyeMap.value = rtA.texture;
  calyxMat.uniforms.uTime.value = t;
  calyxMat.uniforms.uCup.value = cupAmount;

  calyxMesh.rotation.x = -0.35 + Math.sin(t * 0.25) * 0.06;
  calyxMesh.rotation.z = Math.sin(t * 0.18) * 0.03;

  // camera gently follows the rising form
  camera.position.y = 1.2 + cupAmount * 0.3;
  camera.lookAt(0, cupAmount * 0.15, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
