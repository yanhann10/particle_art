<html lang="en">

<style>

               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#2d2d2d; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; color:#2d2d2d; }

<body>
<div class="id">g9l · calyx marbling</div>
<div class="hint">drag to comb · suminagashi → calyx</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 1024, H = 1024;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede1, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping,
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: calyx-shaped dye — 5-fold radial sepals with curved marbling veins
const init = new Float32Array(W * H * 4);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = (y * W + x) * 4;
  const px = (x / W - 0.5) * 2;
  const py = (y / H - 0.5) * 2;
  const r = Math.sqrt(px * px + py * py);
  const angle = Math.atan2(py, px);

  // 5-fold sepal lobes
  const nPetals = 5.0;
  const petalAngle = angle * nPetals;
  const petalShape = Math.cos(petalAngle) * 0.5 + 0.5;

  // calyx envelope — tapers at edge, cups in center
  const envelope = Math.max(0, 1.0 - r * 1.1) * (0.4 + petalShape * 0.6);

  // marbling veins within calyx: concentric rings modulated by sepal lobes
  const veinFreq = r * 22.0 + Math.sin(petalAngle) * 1.5 + Math.sin(angle * 2.0) * 0.8;
  const veinPhase = veinFreq % 1.0;
  const vein = veinPhase < 0.12 ? 1.0 : 0.0;

  // radial veins along sepal midribs
  const midribAngle = ((angle / Math.PI * nPetals * 0.5) + 0.5) % 1.0;
  const midrib = (midribAngle < 0.03 || midribAngle > 0.97) && r > 0.15 && r < 0.85 ? 0.7 : 0.0;

  const inkStrength = Math.max(vein, midrib) * envelope;

  // subtle green-sepal hue variation
  const hueVar = Math.sin(angle * nPetals + r * 4.0) * 0.5 + 0.5;

  init[i]     = 0.0;
  init[i + 1] = 0.0;
  init[i + 2] = inkStrength * (0.85 + hueVar * 0.15);
  init[i + 3] = inkStrength * hueVar * 0.5;
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// advection
const advectUniforms = {
  state: { value: rtA.texture },
  uDt: { value: 0.016 },
  uTexelSize: { value: new THREE.Vector2(1/W, 1/H) },
  uDissipation: { value: 0.9994 },
  uDyeDecay: { value: 0.9997 }
};
const advectMat = new THREE.ShaderMaterial({
  uniforms: advectUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uDt;
    uniform vec2 uTexelSize;
    uniform float uDissipation;
    uniform float uDyeDecay;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 coord = vUv - s.xy * uDt * uTexelSize * 80.0;
      vec4 adv = texture2D(state, coord);
      gl_FragColor = vec4(adv.xy * uDissipation, adv.zw * uDyeDecay);
    }
  `
});
const advectScene = new THREE.Scene();
advectScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), advectMat));

// impulse — velocity splat
const impulseUniforms = {
  state: { value: rtB.texture },
  uPoint: { value: new THREE.Vector2(0.5, 0.5) },
  uForce: { value: new THREE.Vector2(0, 0) },
  uRadius: { value: 0.018 }
};
const impulseMat = new THREE.ShaderMaterial({
  uniforms: impulseUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform vec2 uPoint;
    uniform vec2 uForce;
    uniform float uRadius;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      float dist = length(vUv - uPoint);
      float falloff = exp(-dist * dist / (uRadius * uRadius));
      s.xy += uForce * falloff * 0.8;
      gl_FragColor = s;
    }
  `
});
const impulseScene = new THREE.Scene();
impulseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), impulseMat));

// autonomous breathing — gentle radial pulses like a calyx opening/closing
const breathUniforms = {
  state: { value: rtA.texture },
  uTime: { value: 0.0 },
  uTexelSize: { value: new THREE.Vector2(1/W, 1/H) }
};
const breathMat = new THREE.ShaderMaterial({
  uniforms: breathUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uTime;
    uniform vec2 uTexelSize;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 center = vec2(0.5);
      vec2 toCenter = center - vUv;
      float r = length(toCenter);
      float angle = atan(toCenter.y, toCenter.x);
      // 5-fold breathing pulse
      float pulse = sin(uTime * 0.4) * 0.3 + sin(uTime * 0.17) * 0.2;
      float sepalMod = cos(angle * 5.0) * 0.5 + 0.5;
      float radialForce = pulse * sepalMod * smoothstep(0.6, 0.1, r) * 0.0012;
      vec2 breathForce = normalize(toCenter + 0.0001) * radialForce;
      s.xy += breathForce;
      gl_FragColor = s;
    }
  `
});
const breathScene = new THREE.Scene();
breathScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), breathMat));

// display: cupped calyx geometry
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 3.2);
camera.lookAt(0, 0.15, 0);

const calyxGeom = new THREE.PlaneGeometry(2.6, 2.6, 128, 128);
const calyxMat = new THREE.ShaderMaterial({
  uniforms: {
    dyeMap: { value: rtA.texture },
    uTime: { value: 0 },
    uCup: { value: 0.0 }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uCup;
    varying vec2 vUv;
    void main(){
      vUv = uv;
      vec3 pos = position;
      // cup the plane into a calyx bowl shape
      vec2 c = uv - 0.5;
      float r = length(c) * 2.0;
      float angle = atan(c.y, c.x);
      // 5-fold sepal ridges
      float sepal = cos(angle * 5.0) * 0.5 + 0.5;
      // bowl cupping — edges rise, center stays
      float cup = r * r * uCup * (0.6 + sepal * 0.4);
      // slight sepal tip lift at the rim
      float tipLift = smoothstep(0.7, 1.0, r) * sepal * uCup * 0.3;
      pos.z += cup + tipLift;
      // gentle breathing displacement
      float breathe = sin(uTime * 0.4) * 0.02 * sepal * r;
      pos.z += breathe;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dyeMap;
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(dyeMap, vUv);
      vec2 dye = s.zw;
      float inkDensity = dye.x;
      // calyx palette: deep green-black ink on warm cream
      vec3 inkBase = vec3(0.08, 0.14, 0.10);
      // sepal green tint from dye.y channel
      vec3 sepalGreen = vec3(0.12, 0.28, 0.15);
      vec3 finalInk = mix(inkBase, sepalGreen, dye.y * 0.7);
      vec3 paperColor = vec3(0.96, 0.93, 0.88);
      vec3 col = mix(paperColor, finalInk, inkDensity);
      // subtle vein darkening at high density
      col -= vec3(0.03) * smoothstep(0.6, 1.0, inkDensity);
      // paper grain
      float noise = fract(sin(dot(vUv * 512.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (noise - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const calyxMesh = new THREE.Mesh(calyxGeom, calyxMat);
calyxMesh.rotation.x = -0.35;
scene.add(calyxMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let prevPointer = { x: 0.5, y: 0.5 };
let currentPointer = { x: 0.5, y: 0.5 };
let isDragging = false;

addEventListener('pointerdown', (e) => {
  isDragging = true;
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { x, y };
  currentPointer = { x, y };
});
addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { ...currentPointer };
  currentPointer = { x, y };
});
addEventListener('pointerup', () => { isDragging = false; });

let lastTime = performance.now();
let cupAmount = 0.0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  const t = now / 1000;

  // slowly cup open over first 8 seconds
  cupAmount = Math.min(0.55, cupAmount + dt * 0.07);

  // breathing pass — autonomous calyx pulse
  breathUniforms.state.value = rtA.texture;
  breathUniforms.uTime.value = t;
  renderer.setRenderTarget(rtB);
  renderer.render(breathScene, camOrtho);

  let tmp = rtA; rtA = rtB; rtB = tmp;

  // advection pass
  advectUniforms.state.value = rtA.texture;
  advectUniforms.uDt.value = dt;
  renderer.setRenderTarget(rtB);
  renderer.render(advectScene, camOrtho);

  // impulse pass if dragging
  if (isDragging) {
    const dx = currentPointer.x - prevPointer.x;
    const dy = currentPointer.y - prevPointer.y;
    if (Math.abs(dx) > 0.0001 || Math.abs(dy) > 0.0001) {
      impulseUniforms.state.value = rtB.texture;
      impulseUniforms.uPoint.value.set(currentPointer.x, currentPointer.y);
      impulseUniforms.uForce.value.set(dx * 5.0, dy * 5.0);
      renderer.setRenderTarget(rtA);
      renderer.render(impulseScene, camOrtho);
      // re-advect
      advectUniforms.state.value = rtA.texture;
      renderer.setRenderTarget(rtB);
      renderer.render(advectScene, camOrtho);
    }
  }

  tmp = rtA; rtA = rtB; rtB = tmp;

  renderer.setRenderTarget(null);

  // animate cupping and gentle rotation
  calyxMat.uniforms.dyeMap.value = rtA.texture;
  calyxMat.uniforms.uTime.value = t;
  calyxMat.uniforms.uCup.value = cupAmount;

  calyxMesh.rotation.x = -0.35 + Math.sin(t * 0.25) * 0.06;
  calyxMesh.rotation.z = Math.sin(t * 0.18) * 0.03;

  // camera gently follows the rising form
  camera.position.y = 1.2 + cupAmount * 0.3;
  camera.lookAt(0, cupAmount * 0.15, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
