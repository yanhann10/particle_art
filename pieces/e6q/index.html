<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calyx · Menkman DCT glitch</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<div class="id">e6q</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* --- Background: warm gallery wall gradient via a fullscreen quad --- */
const bgScene = new THREE.Scene();
const bgCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      // Warm gallery wall — subtle vertical gradient, linen-to-clay
      vec3 top = vec3(0.92, 0.88, 0.83);    // warm linen
      vec3 bot = vec3(0.82, 0.76, 0.70);    // clay shadow
      vec3 col = mix(bot, top, vUv.y);
      // subtle paper grain
      float grain = fract(sin(dot(vUv*1000.0, vec2(12.9898,78.233)))*43758.5453);
      col += (grain - 0.5) * 0.018;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bgPlane = new THREE.PlaneGeometry(2,2);
bgScene.add(new THREE.Mesh(bgPlane, bgMat));

const N = 80000;
let geom, points;

const uniforms = {
  uTime:      { value: 0 },
  uPhase:     { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uRowFreq:   { value: 1.2 },
  uColFreq:   { value: 1.0 },
  uWaveAmp:   { value: 0.5 },
  uTwist:     { value: 0.0 },
  uMorph:     { value: 0.0 },
  uPetals:    { value: 5.0 },
  uCupDepth:  { value: 4.0 },
  uLightDir:  { value: new THREE.Vector3(1, 0.5, 0.3) },
  uGlitchSeed:{ value: 0.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uMorph;
    uniform float uPetals;
    uniform float uCupDepth;
    uniform float uGlitchSeed;

    attribute vec2 gridPos;
    attribute float seed;
    attribute float blockId;

    varying float vDensity;
    varying float vHeight;
    varying float vLight;
    varying float vBlock;
    varying vec2 vGP;

    // Pseudo-random
    float hash(float n){ return fract(sin(n)*43758.5453); }
    float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
      vec2 gp = gridPos;

      /* --- 8x8 macroblock quantization (Menkman DCT grid) --- */
      float blockSize = 0.75;  // world-space block size
      vec2 blockCoord = floor(gp / blockSize);
      vec2 blockCenter = (blockCoord + 0.5) * blockSize;
      float bid = hash2(blockCoord);
      vBlock = bid;

      /* --- Bit-flip glitch: occasionally teleport whole blocks --- */
      float glitchPhase = floor(uTime * 0.8 + uGlitchSeed);
      float glitchChance = hash(bid * 137.0 + glitchPhase);
      vec2 glitchOffset = vec2(0.0);
      float isGlitched = 0.0;
      if (glitchChance > 0.92) {
        // Block teleports: shift by DCT-harmonic amounts
        float gdir = hash(bid * 53.0 + glitchPhase) * 6.2832;
        float gdist = (1.0 + floor(hash(bid * 91.0 + glitchPhase) * 4.0)) * blockSize;
        glitchOffset = vec2(cos(gdir), sin(gdir)) * gdist;
        isGlitched = 1.0;
      }

      /* --- Snap particle toward block lattice (partial quantization) --- */
      float snapStrength = 0.35 + 0.15 * sin(uTime * 0.3);
      vec2 snapped = mix(gp, blockCenter, snapStrength) + glitchOffset;

      /* --- Riley wave interference (2x speed per user request) --- */
      float rowWave = sin(snapped.y * uRowFreq + uTime * 1.2 + uPhase) * uWaveAmp;
      float colWave = sin(snapped.x * uColFreq + uTime * 0.7) * uWaveAmp;

      /* --- DCT cosine-basis ripple overlay --- */
      float dctU = 3.0, dctV = 2.0;
      float dctRipple = 0.3 * cos(snapped.x * dctU * 0.5 + uTime * 0.9)
                             * cos(snapped.y * dctV * 0.5 + uTime * 0.6);
      rowWave += dctRipple;

      float twist = uTwist * length(snapped) * 0.04;
      float ct = cos(twist); float st = sin(twist);
      vec2 twisted = vec2(snapped.x * ct - snapped.y * st, snapped.x * st + snapped.y * ct);

      /* --- Calyx morph --- */
      float r = length(snapped);
      float maxR = 12.0;
      float nr = clamp(r / maxR, 0.0, 1.0);
      float theta = atan(snapped.y, snapped.x);

      float petalShape = 0.5 + 0.5 * cos(theta * uPetals);
      float cupProfile = uCupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      float flare = 1.0 + 0.15 * nr * nr * uMorph;

      float m = uMorph;
      vec3 flatPos = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);

      float cx = twisted.x * flare + rowWave * (1.0 - 0.5 * m);
      float cy = twisted.y * flare + colWave * (1.0 - 0.5 * m);
      float cz = cupProfile * m;

      vec3 p = mix(flatPos, vec3(cx, cy, cz), m);

      // DCT block banding: add slight z-offset per block for stepped surface
      p.z += isGlitched * 0.4 * sin(uTime * 3.0 + bid * 20.0) * m;

      /* --- Interference + vein pattern --- */
      float interference = sin(snapped.y * uRowFreq * 2.0 + uTime * 1.2)
                         * sin(snapped.x * uColFreq * 2.0 + uTime * 0.7);
      float vein = sin(theta * uPetals * 3.0 + r * 1.5 + uTime * 0.4);
      vDensity = mix(interference, interference * 0.6 + vein * 0.4, m);
      vDensity += isGlitched * 0.5;  // glitched blocks read brighter
      vHeight = cz;
      vGP = snapped;

      /* --- Turrell light: soft directional that drifts --- */
      vec3 surfNormal = normalize(vec3(-2.0*nr*cos(theta), -2.0*nr*sin(theta), 1.0));
      float lightAngle = uTime * 0.15;
      vec3 lightDir = normalize(vec3(cos(lightAngle)*0.7, 0.5, sin(lightAngle)*0.7));
      vLight = max(0.0, dot(surfNormal, lightDir));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * max(1.8, 3.5 - dist * 0.05);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDensity;
    varying float vHeight;
    varying float vLight;
    varying float vBlock;
    varying vec2 vGP;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      /* --- Menkman chroma-subsampled palette --- */
      // Three chroma channels: magenta, cyan, yellow on artifact-gray
      vec3 magenta = vec3(0.82, 0.12, 0.52);
      vec3 cyan    = vec3(0.10, 0.72, 0.78);
      vec3 yellow  = vec3(0.92, 0.85, 0.18);
      vec3 warmGray= vec3(0.55, 0.52, 0.50);
      vec3 darkGray= vec3(0.18, 0.16, 0.15);

      // Block-based chroma assignment (simulates chroma subsampling)
      float chromaSelect = fract(vBlock * 3.0);
      vec3 chroma;
      if (chromaSelect < 0.33) chroma = magenta;
      else if (chromaSelect < 0.66) chroma = cyan;
      else chroma = yellow;

      // Interference pattern drives density → dark vs chroma
      float val = smoothstep(-0.3, 0.3, vDensity);

      // Base: dark artifact gray. Bright areas get chroma.
      vec3 col = mix(darkGray, chroma, val * 0.7);

      // Ringing artifact: add warm gray bands at block edges
      float blockEdge = smoothstep(0.0, 0.12, fract(vGP.x / 0.75))
                      * smoothstep(0.0, 0.12, fract(vGP.y / 0.75));
      float ringArtifact = 1.0 - blockEdge;
      col = mix(col, warmGray, ringArtifact * 0.35);

      /* --- Turrell light projection: warm glow on curvature --- */
      vec3 turrellWarm = vec3(1.0, 0.85, 0.65);
      vec3 turrellCool = vec3(0.65, 0.72, 0.92);
      vec3 lightCol = mix(turrellCool, turrellWarm, vLight);
      col = mix(col, lightCol, vLight * 0.45 * smoothstep(0.0, 3.0, vHeight));

      // Height-based atmospheric fade (deeper in cup = slightly darker)
      col *= 0.85 + 0.15 * smoothstep(0.0, 5.0, vHeight);

      float alpha = (1.0 - smoothstep(0.18, 0.25, r)) * 0.92;
      gl_FragColor = vec4(col, alpha);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);
  const blockIds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24, height = 24;
  const cellW = width / cols, cellH = height / rows;
  const blockSize = 0.75;

  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        const bx = Math.floor((x + width*0.5) / blockSize);
        const by = Math.floor((y + height*0.5) / blockSize);
        blockIds[idx] = bx * 100 + by;
        idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    const bx = Math.floor((x + width*0.5) / blockSize);
    const by = Math.floor((y + height*0.5) / blockSize);
    blockIds[idx] = bx * 100 + by;
    idx++;
  }
  return { positions, gridPositions, seeds, blockIds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.5;
  uniforms.uTwist.value = rng() * 4.0;
  uniforms.uPhase.value = rng() * 6.28;
  uniforms.uPetals.value = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value = 0.0;
  uniforms.uGlitchSeed.value = rng() * 1000.0;

  const { positions, gridPositions, seeds, blockIds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('blockId', new THREE.BufferAttribute(blockIds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
    geom.attributes.blockId.array.set(blockIds);
    geom.attributes.blockId.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', (e) => {
  if (e.target.tagName === 'CANVAS') regenerate();
});

/* --- Orbit drag --- */
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.0, orbitPhi = 0.55;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.4, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  // Morph: flat → calyx over first 4 seconds
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.02;

  // Auto-orbit + manual
  const autoTheta = t * 0.08;
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;
  const radius = 22;

  const centroidY = 1.5 * uniforms.uMorph.value;
  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    centroidY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, centroidY, 0);

  // Render background then scene
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, bgCamera);
  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
