<title>ebm · non-Newtonian coral</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
html,body{margin:0;padding:0;height:100%;background:#080c09;overflow:hidden;
  color:#dde6d8;font-family:ui-monospace,"SF Mono",Menlo,monospace}
canvas{display:block}

</style>

<body>
<div class="id">ebm · non-Newtonian coral</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">shear-thickening morphogenesis · differential growth</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(0,7,20);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x080c09,1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.target.set(0,0,0);

/* simulation parameters */
const MAX_VERTS=4000;
const ATTRACT=0.055, REPEL_R=0.42, REPEL_STR=0.12;
const NOISE=0.003, PRESSURE=0.003, MAX_D=0.32;
const FREEZE_CYCLE=12;
const STRESS_DECAY=0.994;

/* vertex state: 3D positions + age + stress */
const verts=[];
const NV0=28;
for(let i=0;i<NV0;i++){
  const th=i/NV0*Math.PI*2, r=1.2+(Math.random()-0.5)*0.1;
  verts.push({x:Math.cos(th)*r, y:(Math.random()-0.5)*0.12, z:Math.sin(th)*r, age:0, stress:0});
}

/* 3D spatial hash */
const CELL=REPEL_R;
const grid=new Map();
function gkey(a,b,c){return a+','+b+','+c}
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i];
    const k=gkey(Math.floor(v.x/CELL),Math.floor(v.y/CELL),Math.floor(v.z/CELL));
    let arr=grid.get(k); if(!arr){arr=[];grid.set(k,arr);} arr.push(i);
  }
}
function neighbors3D(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const arr=grid.get(gkey(cx+dx,cy+dy,cz+dz));
    if(arr)for(const idx of arr)out.push(idx);
  }
  return out;
}

let paused=false;
addEventListener('click',()=>{paused=!paused});

/* non-Newtonian freeze pulse: dense regions crystallize */
function freezePulse(){
  const n=verts.length;
  rebuildGrid();
  const density=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i], cands=neighbors3D(v);
    let cnt=0;
    for(const j of cands){
      if(j===i)continue;
      const u=verts[j];
      if((v.x-u.x)**2+(v.y-u.y)**2+(v.z-u.z)**2<REPEL_R*REPEL_R)cnt++;
    }
    density[i]=cnt;
  }
  const sorted=[...density].sort((a,b)=>b-a);
  const thresh=sorted[Math.floor(n*0.35)]||1;
  for(let i=0;i<n;i++){
    if(density[i]>=thresh)verts[i].stress=1.0;
  }
}

function step(){
  if(paused)return;
  const n=verts.length;
  if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);

  // repulsion in 3D
  for(let i=0;i<n;i++){
    const v=verts[i], cands=neighbors3D(v);
    for(const j of cands){
      if(j===i)continue;
      const u=verts[j];
      const ex=v.x-u.x,ey=v.y-u.y,ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;
      const d=Math.sqrt(d2), f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  // attraction to curve neighbors in 3D
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n],b=verts[(i+1)%n],v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  // pressure: outward from centroid + upward bias for coral cup
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=verts[i].x;cy+=verts[i].y;cz+=verts[i].z;}
  cx/=n;cy/=n;cz/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx,oy=verts[i].y-cy,oz=verts[i].z-cz;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE; dz[i]+=(oz/d)*PRESSURE;
    const radial=Math.hypot(ox,oz);
    dy[i]+=PRESSURE*0.6*Math.min(radial*0.25,1.0);
  }
  // apply with stress-reduced mobility
  for(let i=0;i<n;i++){
    const mob=1-verts[i].stress*0.93;
    verts[i].x+=dx[i]*mob+(Math.random()-0.5)*NOISE*mob;
    verts[i].y+=dy[i]*mob+(Math.random()-0.5)*NOISE*0.5*mob;
    verts[i].z+=dz[i]*mob+(Math.random()-0.5)*NOISE*mob;
    verts[i].age+=0.0006;
    verts[i].stress*=STRESS_DECAY;
  }
  // subdivide
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i],b=verts[(i+1)%n];
    grown.push(a);
    const d2=(b.x-a.x)**2+(b.y-a.y)**2+(b.z-a.z)**2;
    if(d2>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5+(Math.random()-0.5)*0.02,
        z:(a.z+b.z)*0.5,age:Math.max(a.age,b.age)*0.85,stress:Math.max(a.stress,b.stress)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown)verts.push(v);
}

/* particle rendering — 40k tightly bound to curve */
const N_RENDER=40000;
const rPos=new Float32Array(N_RENDER*3);
const rSeeds=new Float32Array(N_RENDER);
const rAge=new Float32Array(N_RENDER);
const rStress=new Float32Array(N_RENDER);
for(let i=0;i<N_RENDER;i++)rSeeds[i]=Math.random();

const geom=new THREE.BufferGeometry();
geom.setAttribute('position',new THREE.BufferAttribute(rPos,3));
geom.setAttribute('seed',new THREE.BufferAttribute(rSeeds,1));
geom.setAttribute('age',new THREE.BufferAttribute(rAge,1));
geom.setAttribute('aStress',new THREE.BufferAttribute(rStress,1));

const uniforms={uTime:{value:0},uPixel:{value:renderer.getPixelRatio()}};
const mat=new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel;
    attribute float seed, age, aStress;
    varying vec3 vCol;
    varying float vDist;
    void main(){
      vec3 p=position;
      float t=uTime*0.4+seed*6.28;
      float mob=1.0-aStress*0.9;
      p+=0.004*mob*vec3(sin(t),0.0,cos(t));
      // palette: sage(young)→dark moss(old), bone when frozen
      vec3 young=vec3(0.35,0.44,0.29);
      vec3 old=vec3(0.22,0.30,0.18);
      float k=clamp(age*0.8,0.0,1.0);
      vec3 fluid=mix(young,old,k);
      vec3 frozen=vec3(0.78,0.72,0.54);
      vCol=mix(fluid,frozen,aStress);
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      vDist=-mv.z;
      gl_PointSize=1.3*uPixel*(40.0/vDist);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying vec3 vCol;
    varying float vDist;
    void main(){
      vec2 d=gl_PointCoord-0.5;
      float r=dot(d,d);
      if(r>0.25)discard;
      float a=exp(-r*18.0)*0.6;
      vec3 col=vCol*a;
      float fogF=exp(-0.028*0.028*vDist*vDist);
      col=mix(vec3(0.031,0.047,0.035),col,fogF);
      gl_FragColor=vec4(col,a*fogF);
    }`
});
scene.add(new THREE.Points(geom,mat));

/* Line2 backbone — structural definition, widens during freeze */
const lineMat=new LineMaterial({
  color:0xffffff, linewidth:1.5, vertexColors:true,
  transparent:true, opacity:0.4, depthWrite:false,
  resolution:new THREE.Vector2(innerWidth,innerHeight)
});
let lineGeo=new LineGeometry();
lineGeo.setPositions([0,0,0,1,0,0]);
lineGeo.setColors([1,1,1,1,1,1]);
const line=new Line2(lineGeo,lineMat);
scene.add(line);
let lineFrame=0;

function updateLine(){
  const n=verts.length, pos=[], col=[];
  let avgS=0;
  for(let i=0;i<n;i++){
    pos.push(verts[i].x,verts[i].y,verts[i].z);
    const s=verts[i].stress; avgS+=s;
    col.push(0.22+s*0.56, 0.30+s*0.42, 0.18+s*0.36);
  }
  pos.push(verts[0].x,verts[0].y,verts[0].z);
  col.push(col[0],col[1],col[2]);
  avgS/=n;
  const ng=new LineGeometry();
  ng.setPositions(pos); ng.setColors(col);
  line.geometry.dispose(); line.geometry=ng;
  lineMat.linewidth=1.2+avgS*4;
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  lineMat.resolution.set(innerWidth,innerHeight);
});

/* pre-grow 800 steps for visible 3D form at open */
for(let s=0;s<800;s++)step();

const statEl=document.getElementById('stat');
const start=performance.now();
let lastFreeze=-5;
const _tv=new THREE.Vector3();

function loop(){
  const t=(performance.now()-start)/1000;
  uniforms.uTime.value=t;

  if(t-lastFreeze>FREEZE_CYCLE&&!paused){freezePulse();lastFreeze=t;}
  for(let s=0;s<4;s++)step();

  // distribute particles tightly along curve
  const n=verts.length;
  const lengths=[]; let total=0;
  for(let i=0;i<n;i++){
    const a=verts[i],b=verts[(i+1)%n];
    const L=Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2+(b.z-a.z)**2);
    lengths.push(L); total+=L;
  }
  if(total>0){
    let w=0;
    for(let i=0;i<n;i++){
      const share=i===n-1?N_RENDER-w:Math.max(1,Math.floor(N_RENDER*lengths[i]/total));
      const a=verts[i],b=verts[(i+1)%n];
      for(let k=0;k<share&&w<N_RENDER;k++){
        const u=Math.random();
        rPos[w*3]=a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.01;
        rPos[w*3+1]=a.y+(b.y-a.y)*u+(Math.random()-0.5)*0.005;
        rPos[w*3+2]=a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.01;
        rAge[w]=Math.max(a.age,b.age);
        rStress[w]=a.stress+(b.stress-a.stress)*u;
        w++;
      }
    }
    geom.attributes.position.needsUpdate=true;
    geom.attributes.age.needsUpdate=true;
    geom.attributes.aStress.needsUpdate=true;
  }

  lineFrame++;
  if(lineFrame%12===0)updateLine();

  // camera tracks centroid
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=verts[i].x;cy+=verts[i].y;cz+=verts[i].z;}
  _tv.set(cx/n,cy/n,cz/n);
  controls.target.lerp(_tv,0.015);
  controls.update();

  const avgS=verts.reduce((s,v)=>s+v.stress,0)/n;
  statEl.textContent='vertices='+n+(avgS>0.1?' · crystallized':'')+(paused?' · paused':'');
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
</body>
</html>
