<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25d · awe — the bird that became its own cathedral of light</title>
<!-- MOTION: expand, intensity: transcendent -->
<!-- Technique: Andy Goldsworthy's ephemeral land-art logic — natural units composing a form that feels larger than itself -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#06060a;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }

<body>
<div class="id">25d</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 150);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05050a, 1);
document.body.appendChild(renderer.domElement);

// ── Background: very subdued gradient, no god-rays, no aureole
const bgScene = new THREE.Scene();
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec3 top = vec3(0.03, 0.03, 0.06);
      vec3 bot = vec3(0.05, 0.03, 0.03);
      vec3 col = mix(top, bot, vUv.y);
      // sparse starfield
      float star = hash(floor(vUv * 500.0));
      star = step(0.998, star) * (0.08 + 0.04 * sin(uTime * 0.4 + star * 20.0));
      col += vec3(star * 0.4, star * 0.35, star * 0.5);
      // subtle grain
      float grain = (hash(vUv * 900.0 + uTime * 0.01) - 0.5) * 0.008;
      col += grain;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat));

// ── Leaf geometry
function makeLeafGeom(segsU, segsV){
  const positions = [], normals = [], uvs = [], indices = [];
  for(let j = 0; j <= segsV; j++){
    const v = j / segsV;
    for(let i = 0; i <= segsU; i++){
      const u = i / segsU;
      const width = 0.5 * Math.sin(v * Math.PI) * (1.0 - 0.3 * v);
      const x = (u - 0.5) * width;
      const y = v - 0.5;
      const curl = 0.12 * Math.sin(v * Math.PI * 1.2) * (1.0 - Math.abs(u - 0.5) * 0.6);
      const edgeCurl = 0.06 * Math.pow(Math.abs(u - 0.5) * 2.0, 2.0) * Math.sin(v * Math.PI);
      const z = curl + edgeCurl;
      positions.push(x, y, z);
      normals.push(0, 0, 1);
      uvs.push(u, v);
    }
  }
  for(let j = 0; j < segsV; j++){
    for(let i = 0; i < segsU; i++){
      const a = j * (segsU+1) + i;
      indices.push(a, a+(segsU+1), a+1, a+1, a+(segsU+1), a+(segsU+2));
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

const leafGeom = makeLeafGeom(6, 10);
const LEAF_COUNT = 320;

// ── Deterministic parametric bird using Bézier spines
// Cubic Bézier helper
function bezier3(p0, p1, p2, p3, t){
  const u = 1 - t;
  return p0 * u*u*u + p1 * 3*u*u*t + p2 * 3*u*t*t + p3 * t*t*t;
}

// Bird shape: body spine + two wing spines + tail fan
function birdPoint(idx, total){
  // deterministic seeding per index
  const seed1 = Math.sin(idx * 127.1 + 311.7) * 43758.5453;
  const rng = () => { const v = Math.sin(seed1 + idx * 0.7123) * 43758.5453; return fract(v); };
  function fract(x){ return x - Math.floor(x); }
  const h1 = fract(Math.sin(idx * 12.9898 + 78.233) * 43758.5453);
  const h2 = fract(Math.sin(idx * 39.346 + 11.135) * 43758.5453);
  const h3 = fract(Math.sin(idx * 73.156 + 53.891) * 43758.5453);

  const t = idx / total;
  let x, y, z;

  if(t < 0.08){
    // Head: tight cluster at front
    const s = t / 0.08;
    x = bezier3(3.2, 3.6, 3.9, 4.1, s);
    y = bezier3(0.0, 0.15, 0.1, 0.0, s) + (h1 - 0.5) * 0.15;
    z = (h2 - 0.5) * 0.2;
  } else if(t < 0.25){
    // Body: dense fusiform shape along spine
    const s = (t - 0.08) / 0.17;
    x = bezier3(3.2, 1.8, 0.5, -0.8, s);
    const bodyWidth = Math.sin(s * Math.PI) * 0.45;
    y = (h1 - 0.5) * bodyWidth;
    z = (h2 - 0.5) * bodyWidth * 0.7;
  } else if(t < 0.60){
    // Left wing: Bézier spine with deterministic spread
    const s = (t - 0.25) / 0.35;
    // wing leading edge curves up and back
    const spineX = bezier3(1.5, 0.5, -0.8, -2.0, s);
    const spineY = bezier3(0.4, 2.0, 3.5, 4.8, s);
    // chord width narrows toward tip
    const chord = (1.0 - s * 0.7) * 1.2;
    const chordPos = h1 * chord - chord * 0.3;
    // feather-like layering: leaves align along chord direction
    const angle = Math.atan2(spineY - 0.4, spineX - 1.5) + Math.PI * 0.5;
    x = spineX + Math.cos(angle) * chordPos * 0.3;
    y = spineY + Math.sin(angle) * chordPos * 0.15 + (h2 - 0.5) * 0.12;
    z = -s * 0.3 + (h3 - 0.5) * 0.15;
  } else if(t < 0.92){
    // Right wing: mirror of left
    const s = (t - 0.60) / 0.32;
    const spineX = bezier3(1.5, 0.5, -0.8, -2.0, s);
    const spineY = bezier3(-0.4, -2.0, -3.5, -4.8, s);
    const chord = (1.0 - s * 0.7) * 1.2;
    const chordPos = h1 * chord - chord * 0.3;
    const angle = Math.atan2(spineY + 0.4, spineX - 1.5) - Math.PI * 0.5;
    x = spineX + Math.cos(angle) * chordPos * 0.3;
    y = spineY + Math.sin(angle) * chordPos * 0.15 + (h2 - 0.5) * 0.12;
    z = -s * 0.3 + (h3 - 0.5) * 0.15;
  } else {
    // Tail: fan spreading backward
    const s = (t - 0.92) / 0.08;
    x = bezier3(-0.8, -1.5, -2.0, -2.8, s);
    const fan = s * 1.4;
    y = (h1 - 0.5) * fan * 2.0;
    z = (h2 - 0.5) * 0.3 - s * 0.2;
  }
  return new THREE.Vector3(x, y, z);
}

// ── Leaf material: awe = inner luminance, subsurface glow intensifies
const leafMat = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  transparent: true,
  depthWrite: true,
  uniforms: {
    uTime: { value: 0 },
    uGlow: { value: 0.0 },
    uCohesion: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    void main(){
      vUv = uv;
      vNormal = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform float uGlow;
    uniform float uCohesion;
    void main(){
      // midrib vein
      float midrib = 1.0 - smoothstep(0.0, 0.04, abs(vUv.x - 0.5));
      // side veins
      float veinAngle = vUv.y * 12.0 + vUv.x * 3.0;
      float sideVein = smoothstep(0.02, 0.0, abs(fract(veinAngle) - 0.5) - 0.46) * 0.3;
      // lighting
      vec3 lightDir = normalize(vec3(0.4, 0.8, 0.6));
      float diff = max(dot(vNormal, lightDir), 0.0) * 0.6 + 0.4;
      // subsurface: intensifies with awe-glow
      float ss = max(dot(-vNormal, lightDir), 0.0) * (0.25 + uGlow * 0.5);
      // color seed from position
      float cs = fract(vWorldPos.x * 0.13 + vWorldPos.y * 0.17);
      // palette shifts toward luminous gold/white with glow
      vec3 warm = mix(vec3(0.92,0.58,0.22), vec3(1.0,0.95,0.80), uGlow * 0.6);
      vec3 cool = mix(vec3(0.45,0.22,0.08), vec3(0.75,0.50,0.25), uGlow * 0.5);
      vec3 col = mix(cool, warm, cs * 0.6 + 0.4);
      col *= diff + ss;
      col += midrib * vec3(0.15, 0.08, 0.02) * (1.0 + uGlow);
      col += sideVein * vec3(0.1, 0.05, 0.01);
      // awe: inner luminance — leaves emit light
      float pulse = sin(uTime * 0.3 + vWorldPos.x * 0.5 + vWorldPos.y * 0.3) * 0.5 + 0.5;
      col += uGlow * vec3(0.35, 0.22, 0.08) * (0.4 + pulse * 0.3);
      // edge fade
      float edgeFade = smoothstep(0.0, 0.08, vUv.x) * smoothstep(1.0, 0.92, vUv.x);
      float tipFade = smoothstep(0.0, 0.05, vUv.y) * smoothstep(1.0, 0.92, vUv.y);
      float alpha = edgeFade * tipFade * (0.88 + uGlow * 0.12);
      gl_FragColor = vec4(col, alpha);
    }
  `
});

// ── Create leaves
const leaves = [];
for(let i = 0; i < LEAF_COUNT; i++){
  const mesh = new THREE.Mesh(leafGeom, leafMat);
  const target = birdPoint(i, LEAF_COUNT);
  const h = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
  const hf = h - Math.floor(h);
  const scale = 0.24 + hf * 0.18;
  mesh.scale.set(scale, scale * (0.9 + hf * 0.25), scale);
  // start at 70% expansion toward target — critic fix
  const startPos = target.clone().multiplyScalar(0.7);
  mesh.position.copy(startPos);
  const tNorm = i / LEAF_COUNT;
  const wingFac = (tNorm > 0.25 && tNorm < 0.92) ? 1.0 : 0.0;
  mesh.rotation.set(
    (hf - 0.5) * 0.4,
    (Math.sin(i * 0.37) * 0.5 - 0.25) * 0.3,
    hf * Math.PI * 0.3 - 0.15
  );
  scene.add(mesh);
  leaves.push({
    mesh,
    target: target.clone(),
    current: startPos.clone(),
    phase: hf * Math.PI * 2,
    baseScale: scale,
    rotSpeed: (Math.sin(i * 7.13) * 0.5) * 0.2,
    detached: false,
    detachTimer: 12 + hf * 25,
    returnTimer: 0,
    driftVel: new THREE.Vector3(),
    wingFactor: wingFac,
    expandT: 0.7 // start at 70%
  });
}

// ── Lighting: warm, the bird glows
const ambLight = new THREE.AmbientLight(0x1a1410, 0.3);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffe0b0, 0.6);
dirLight.position.set(3, 5, 4);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x3a2518, 0.25);
rimLight.position.set(-3, -2, -3);
scene.add(rimLight);

// ── Dust motes — reduced
const dustCount = 50;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
for(let i = 0; i < dustCount; i++){
  dustPos[i*3] = (Math.random()-0.5) * 18;
  dustPos[i*3+1] = (Math.random()-0.5) * 10;
  dustPos[i*3+2] = (Math.random()-0.5) * 8;
}
dustGeom.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.03, color: 0xc09050, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const dustPoints = new THREE.Points(dustGeom, dustMat);
scene.add(dustPoints);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Awe arc: glow builds over ~20s from 0 to 1, stays
let glowTarget = 0.0;
let glow = 0.0;
let detachedCount = 0;
const MAX_DETACHED = 30;

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  bgMat.uniforms.uTime.value = t;
  leafMat.uniforms.uTime.value = t;

  // Awe glow builds slowly — the sublime dawning
  glowTarget = Math.min(1.0, t / 25.0);
  glow += (glowTarget - glow) * dt * 0.3;
  leafMat.uniforms.uGlow.value = glow;

  // centroid tracking
  let cx = 0, cy = 0, cz = 0;
  detachedCount = 0;

  for(let i = 0; i < leaves.length; i++){
    const L = leaves[i];
    // expand from 70% to 100% over first 5 seconds
    if(L.expandT < 1.0){
      L.expandT = Math.min(1.0, L.expandT + dt * 0.06);
    }

    if(!L.detached){
      L.detachTimer -= dt;
      if(L.detachTimer <= 0 && detachedCount < MAX_DETACHED){
        L.detached = true;
        L.returnTimer = 3 + Math.sin(i * 3.7) * 4 + 4;
        const ha = Math.sin(i * 17.3) * 0.5;
        const hb = Math.cos(i * 23.1) * 0.5;
        L.driftVel.set(ha * 1.2, hb * 0.6 - 0.25, Math.sin(i * 7.9) * 0.5);
      }
    }
    if(L.detached){
      detachedCount++;
      L.returnTimer -= dt;
      if(L.returnTimer <= 0){
        const diff = L.target.clone().multiplyScalar(L.expandT).sub(L.current);
        const d = diff.length();
        if(d < 0.08){
          L.detached = false;
          L.detachTimer = 12 + Math.abs(Math.sin(i * 5.3)) * 18;
          L.current.copy(L.target.clone().multiplyScalar(L.expandT));
        } else {
          L.current.add(diff.normalize().multiplyScalar(dt * 2.2));
        }
      } else {
        L.driftVel.y -= dt * 0.12;
        L.current.add(L.driftVel.clone().multiplyScalar(dt));
      }
    } else {
      const expanded = L.target.clone().multiplyScalar(L.expandT);
      const breath = Math.sin(t * 0.7 + L.phase) * 0.05;
      const wingBeat = L.wingFactor * Math.sin(t * 1.0 + L.phase * 0.5) * 0.15;
      L.current.x = expanded.x + Math.sin(t * 0.25 + L.phase) * 0.02;
      L.current.y = expanded.y + breath + wingBeat;
      L.current.z = expanded.z + Math.cos(t * 0.35 + L.phase) * 0.015;
    }
    L.mesh.position.lerp(L.current, dt * 3.5);
    L.mesh.rotation.z += L.rotSpeed * dt * (L.detached ? 2.5 : 0.2);
    if(L.detached) L.mesh.rotation.x += dt * 0.4;

    cx += L.mesh.position.x;
    cy += L.mesh.position.y;
    cz += L.mesh.position.z;
  }

  const cohesion = 1.0 - (detachedCount / MAX_DETACHED) * 0.6;
  leafMat.uniforms.uCohesion.value = cohesion;

  // centroid
  cx /= LEAF_COUNT; cy /= LEAF_COUNT; cz /= LEAF_COUNT;

  // dust drift
  for(let i = 0; i < dustCount; i++){
    dustPos[i*3] += Math.sin(t * 0.15 + i) * dt * 0.04;
    dustPos[i*3+1] += dt * 0.015;
    if(dustPos[i*3+1] > 5) dustPos[i*3+1] = -5;
  }
  dustGeom.attributes.position.needsUpdate = true;

  // camera: slow orbit tracking centroid — not fixed
  const ang = t * 0.055;
  const camR = 14 + Math.sin(t * 0.08) * 1.5;
  camera.position.x = cx + Math.sin(ang) * camR;
  camera.position.z = cz + Math.cos(ang) * camR;
  camera.position.y = cy + Math.sin(t * 0.07) * 1.2 + 1.5;
  camera.lookAt(cx, cy, cz);

  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
