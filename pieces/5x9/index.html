<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: morph, intensity: gentle -->
<title>5x9 · cypress ↔ tower ↔ …koi?</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#06070a;overflow:hidden;
  color:#d6cab2;font-family:ui-monospace,"SF Mono",Menlo,monospace}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;letter-spacing:0.06em;color:#cdd2dc}
.hint{position:fixed;left:14px;top:14px;opacity:0.55;font-size:10px;letter-spacing:0.04em}
.src{position:fixed;right:14px;top:14px;opacity:0.4;font-size:10px;letter-spacing:0.04em}

</style>

<body>
<div class="id">5x9</div>
<div class="hint">click to flip · wait for the visitor</div>
<div class="src">Magritte non-sequitur · 70k particles · three poses</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.016);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(18, 8, 18);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x06070a,1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);
controls.autoRotate = false;

/* ── pose A: cypress (L-system) ── */
const RULES = {
  'F':[{p:0.55,s:'F[+f][-f]F'},{p:0.25,s:'FF[/f]\\F'},{p:0.20,s:'F[+f-f][/f\\f]F'}],
  'f':[{p:0.6,s:'f[+f][-f]'},{p:0.4,s:'f'}]
};
const ANG=THREE.MathUtils.degToRad(13), STEP=0.55;
function expand(ax,d,rng){
  let s=ax;
  for(let i=0;i<d;i++){let o='';for(const c of s){if(c in RULES){const r=rng();let a=0;
    for(const opt of RULES[c]){a+=opt.p;if(r<=a){o+=opt.s;break;}}}else o+=c;}s=o;}return s;}
function turtle(str){
  const stk=[],segs=[];
  let pos=new THREE.Vector3(),h=new THREE.Vector3(0,1,0),
      l=new THREE.Vector3(-1,0,0),u=new THREE.Vector3(0,0,1),gen=0;
  const rot=(ax,a)=>{const q=new THREE.Quaternion().setFromAxisAngle(ax,a);
    h.applyQuaternion(q);l.applyQuaternion(q);u.applyQuaternion(q);};
  for(const c of str){switch(c){
    case'F':case'f':{const st=STEP*Math.pow(0.85,gen);const nx=pos.clone().addScaledVector(h,st);
      segs.push({from:pos.clone(),to:nx,gen});pos=nx;break;}
    case'+':rot(u,+ANG);break;case'-':rot(u,-ANG);break;
    case'&':rot(l,+ANG);break;case'^':rot(l,-ANG);break;
    case'/':rot(h,+ANG*1.5);break;case'\\':rot(h,-ANG*1.5);break;
    case'[':stk.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen});gen++;break;
    case']':{const f=stk.pop();pos=f.pos;h=f.h;l=f.l;u=f.u;gen=f.gen;break;}
  }}return segs;}
const rng=(()=>{let s=0xC0FFEE;return()=>{s=(s+0x6D2B79F5)|0;
  let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;};})();
const cypressSegs=turtle(expand('F',6,rng));

/* ── pose B: art-deco tower ── */
function sampleArtDeco(N){
  const out=new Float32Array(N*3);
  const tiers=[{hw:4.5,y0:0,y1:4,ri:14},{hw:3.4,y0:4,y1:7.5,ri:12},
    {hw:2.4,y0:7.5,y1:10.5,ri:10},{hw:1.5,y0:10.5,y1:13,ri:8},{hw:0.85,y0:13,y1:15,ri:6}];
  const W=Math.floor(N*0.55),B=Math.floor(N*0.25),S=Math.floor(N*0.12),C=N-W-B-S;
  let idx=0;
  const tw=tiers.map(t=>8*t.hw*(t.y1-t.y0)),tt=tw.reduce((a,b)=>a+b,0);
  for(let ti=0;ti<tiers.length;ti++){
    const t=tiers[ti],cnt=ti===tiers.length-1?(W-tw.slice(0,ti).reduce((a,_,j)=>a+Math.floor(tw[j]/tt*W),0)):Math.floor(tw[ti]/tt*W);
    for(let k=0;k<cnt;k++){const f=Math.floor(Math.random()*4),r=Math.floor(Math.random()*t.ri),
      rf=(r+.5)/t.ri,al=(rf*2-1)*t.hw,y=t.y0+Math.random()*(t.y1-t.y0),j=.04,p=[0,0,0];
      if(f===0){p[0]=t.hw+(Math.random()-.5)*j;p[1]=y;p[2]=al;}
      else if(f===1){p[0]=-t.hw+(Math.random()-.5)*j;p[1]=y;p[2]=al;}
      else if(f===2){p[0]=al;p[1]=y;p[2]=t.hw+(Math.random()-.5)*j;}
      else{p[0]=al;p[1]=y;p[2]=-t.hw+(Math.random()-.5)*j;}
      out[idx*3]=p[0];out[idx*3+1]=p[1];out[idx*3+2]=p[2];idx++;}}
  for(let k=0;k<B;k++){const ti=Math.floor(Math.random()*tiers.length),t=tiers[ti],
    edge=Math.random()<.6?t.y1:t.y0,f=Math.floor(Math.random()*4),al=(Math.random()*2-1)*t.hw,j=.02,p=[0,0,0];
    if(f===0){p[0]=t.hw;p[1]=edge+(Math.random()-.5)*j;p[2]=al;}
    else if(f===1){p[0]=-t.hw;p[1]=edge+(Math.random()-.5)*j;p[2]=al;}
    else if(f===2){p[0]=al;p[1]=edge+(Math.random()-.5)*j;p[2]=t.hw;}
    else{p[0]=al;p[1]=edge+(Math.random()-.5)*j;p[2]=-t.hw;}
    out[idx*3]=p[0];out[idx*3+1]=p[1];out[idx*3+2]=p[2];idx++;}
  for(let k=0;k<S;k++){const t=Math.random(),y=15+t*5.5,r=.6*(1-t),th=Math.random()*Math.PI*2;
    out[idx*3]=Math.cos(th)*r;out[idx*3+1]=y;out[idx*3+2]=Math.sin(th)*r;idx++;}
  for(let k=0;k<C;k++){const ch=Math.floor(Math.random()*16),th=(ch+.5)/16*Math.PI*2,
    al=Math.random(),r=.7+al*1.3,y=14.6+al*.8+(Math.random()-.5)*.05;
    out[idx*3]=Math.cos(th)*r;out[idx*3+1]=y;out[idx*3+2]=Math.sin(th)*r;idx++;}
  return out;}

/* ── pose C: koi fish (vertical — the Magritte non-sequitur) ── */
function sampleKoi(N){
  const out=new Float32Array(N*3);
  // profile: X half-width at normalized height t (0=tail, 1=mouth)
  function hw(t){
    if(t<.07) return 3.2*(1-t/.07)+.2;       // tail fan
    if(t<.12) return .2+(t-.07)/.05*1.3;      // caudal peduncle
    if(t<.55){const s=(t-.12)/.43; return 1.5+2.3*Math.sin(s*Math.PI);} // body
    if(t<.82){const s=(t-.55)/.27; return 3.8*(1-s*.62);}               // head
    const s=(t-.82)/.18; return 1.44*(1-s*.92); // snout
  }
  const DR=.38;
  const BODY=Math.floor(N*.65),TAIL=Math.floor(N*.12),DFIN=Math.floor(N*.07),
        PFIN=Math.floor(N*.08),EYE=N-BODY-TAIL-DFIN-PFIN;
  let i=0;
  for(let k=0;k<BODY;k++){
    const t=.12+Math.random()*.88,y=t*16,w=hw(t),th=Math.random()*Math.PI*2,
      sf=.88+Math.random()*.12;
    out[i*3]=Math.cos(th)*w*sf;out[i*3+1]=y;out[i*3+2]=Math.sin(th)*w*DR*sf;i++;}
  for(let k=0;k<TAIL;k++){
    const t=Math.random()*.07,y=t*16,w=hw(t);
    out[i*3]=(Math.random()*2-1)*w;out[i*3+1]=y;out[i*3+2]=(Math.random()-.5)*.5;i++;}
  for(let k=0;k<DFIN;k++){
    const t=.25+Math.random()*.35,y=t*16,fh=2.*Math.sin((t-.25)/.35*Math.PI);
    out[i*3]=(Math.random()-.5)*.25;out[i*3+1]=y;out[i*3+2]=-(hw(t)*DR+Math.random()*fh);i++;}
  for(let k=0;k<PFIN;k++){
    const side=k%2===0?1:-1,t=.38+Math.random()*.08,y=t*16,
      ext=hw(t)+.5+Math.random()*1.8;
    out[i*3]=side*ext;out[i*3+1]=y-Math.random()*.4;out[i*3+2]=(Math.random()-.5)*.4;i++;}
  for(let k=0;k<EYE;k++){
    const side=k%2===0?1:-1,th=Math.random()*Math.PI*2,r=Math.random()*.35;
    out[i*3]=side*1.6+Math.cos(th)*r;out[i*3+1]=12.5+Math.sin(th)*r*.6;
    out[i*3+2]=side*.4+(Math.random()-.5)*.1;i++;}
  return out;}

/* ── build particle correspondence ── */
const N=70000;
const treePos=new Float32Array(N*3),towerPos=sampleArtDeco(N),fishPos=sampleKoi(N);
const seeds=new Float32Array(N);
const lens=cypressSegs.map(s=>s.from.distanceTo(s.to)),totalLen=lens.reduce((a,b)=>a+b,0);
const N_SKEL=Math.floor(N*.55);
let wr=0;const v=new THREE.Vector3();
for(let i=0;i<cypressSegs.length;i++){
  const share=i===cypressSegs.length-1?(N_SKEL-wr):Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for(let k=0;k<share&&wr<N_SKEL;k++){const t=Math.random();
    v.lerpVectors(cypressSegs[i].from,cypressSegs[i].to,t);
    const j=.05*Math.pow(.85,cypressSegs[i].gen);
    treePos[wr*3]=v.x+(Math.random()-.5)*j;treePos[wr*3+1]=v.y+(Math.random()-.5)*j;
    treePos[wr*3+2]=v.z+(Math.random()-.5)*j;seeds[wr]=Math.random();wr++;}}
{
  let yMin=Infinity,yMax=-Infinity;
  for(const s of cypressSegs){yMin=Math.min(yMin,s.from.y,s.to.y);yMax=Math.max(yMax,s.from.y,s.to.y);}
  const haloY=yMin+(yMax-yMin)*.16,RIDGES=8,SPIRAL=.9;
  const TN=24,tuftYs=[],tuftThs=[];
  for(let i=0;i<TN;i++){tuftYs.push(haloY+((i+.5)/TN)*(yMax-haloY));tuftThs.push(Math.random()*Math.PI*2);}
  const N_FOL=N-N_SKEL,NR=Math.floor(N_FOL*.6),NT=N_FOL-NR;
  for(let k=0;k<NR&&wr<N_SKEL+NR;k++){
    const yt=Math.random(),y=haloY+yt*(yMax-haloY),
      tap=Math.max(.18,1-1.5*Math.pow(yt-.45,2)),br=.05+.95*tap,
      ri=Math.floor(Math.random()*RIDGES),rth=(ri/RIDGES)*Math.PI*2+y*SPIRAL,
      th=rth+(Math.random()-.5)*.3,r=br*(.55+.45*Math.random());
    treePos[wr*3]=Math.cos(th)*r;treePos[wr*3+1]=y+(Math.random()-.5)*.05;
    treePos[wr*3+2]=Math.sin(th)*r;seeds[wr]=Math.random();wr++;}
  for(let k=0;k<NT&&wr<N;k++){
    const ti=Math.floor(Math.random()*TN),ty=tuftYs[ti],tth=tuftThs[ti],
      yt=(ty-haloY)/(yMax-haloY),tap=Math.max(.18,1-1.5*Math.pow(yt-.45,2)),
      br=.05+.95*tap,reach=br+.1+Math.random()*.35;
    treePos[wr*3]=Math.cos(tth+(Math.random()-.5)*.4)*(reach+(Math.random()-.5)*.18);
    treePos[wr*3+1]=ty+(Math.random()-.5)*.4;
    treePos[wr*3+2]=Math.sin(tth+(Math.random()-.5)*.4)*(reach+(Math.random()-.5)*.18);
    seeds[wr]=Math.random();wr++;}
}
while(wr<N){treePos[wr*3]=0;treePos[wr*3+1]=0;treePos[wr*3+2]=0;seeds[wr]=Math.random();wr++;}

function fitH(arr,h){
  let mn=Infinity,mx=-Infinity,cx=0,cz=0;const n=arr.length/3;
  for(let i=0;i<n;i++){mn=Math.min(mn,arr[i*3+1]);mx=Math.max(mx,arr[i*3+1]);cx+=arr[i*3];cz+=arr[i*3+2];}
  cx/=n;cz/=n;const s=h/(mx-mn||1);
  for(let i=0;i<n;i++){arr[i*3]=(arr[i*3]-cx)*s;arr[i*3+1]=(arr[i*3+1]-mn)*s;arr[i*3+2]=(arr[i*3+2]-cz)*s;}}
fitH(treePos,16);fitH(towerPos,16);fitH(fishPos,16);

/* ── shader ── */
const uniforms={uTime:{value:0},uPixel:{value:renderer.getPixelRatio()},uMix:{value:0},uFish:{value:0}};
const geom=new THREE.BufferGeometry();
geom.setAttribute('position',new THREE.BufferAttribute(treePos.slice(),3));
geom.setAttribute('treePos',new THREE.BufferAttribute(treePos,3));
geom.setAttribute('towerPos',new THREE.BufferAttribute(towerPos,3));
geom.setAttribute('fishPos',new THREE.BufferAttribute(fishPos,3));
geom.setAttribute('seed',new THREE.BufferAttribute(seeds,1));

const mat=new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime,uPixel,uMix,uFish;
    attribute vec3 treePos,towerPos,fishPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      float m=smoothstep(0.,1.,uMix);
      float f=smoothstep(0.,1.,uFish);
      vec3 base=mix(treePos,towerPos,m);
      vec3 p=mix(base,fishPos,f);
      float t=uTime*.55+seed*6.28;
      // organic sway (cypress only)
      float sw=(1.-max(m,f))*.06*(p.y/16.);
      p.x+=sw*sin(t); p.z+=sw*cos(t*.9);
      // koi: gentle tail undulation propagating upward
      float tail=f*.35*sin(p.y*.8-uTime*1.2)*smoothstep(0.,8.,16.-p.y);
      p.x+=tail;
      vEnergy=.5+.5*sin(t*.8);
      float hk=clamp(p.y/16.,0.,1.);
      // cypress palette: forest greens
      vec3 tC=mix(vec3(.18,.36,.20),vec3(.55,.78,.35),hk);
      tC=mix(tC,vec3(.85,.92,.55),smoothstep(.7,1.,hk)*.6);
      // deco palette: bronze/cream
      vec3 dC=mix(vec3(.42,.30,.18),vec3(.92,.72,.40),hk);
      dC=mix(dC,vec3(.99,.94,.84),smoothstep(.85,1.,hk)*.7);
      // koi palette: ink-wash silver + rust markings
      vec3 kBase=mix(vec3(.72,.70,.66),vec3(.48,.42,.38),hk);
      vec3 kMark=vec3(.58,.34,.22);
      vec3 kC=seed>.65?mix(kBase,kMark,.55):kBase;
      // eye glint
      kC=mix(kC,vec3(.90,.88,.82),step(.75,hk)*step(.92,seed)*.7);
      vec3 baseCol=mix(tC,dC,m);
      vCol=mix(baseCol,kC,f);
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=(.9+.7*vEnergy)*uPixel*(50./-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d=gl_PointCoord-.5;
      float r=dot(d,d);
      if(r>.25)discard;
      float a=exp(-r*18.)*(.45+.55*vEnergy);
      gl_FragColor=vec4(vCol*a,a);
    }`
});
scene.add(new THREE.Points(geom,mat));

/* ── timing & loop ── */
let clickTarget=0;
addEventListener('click',e=>{if(e.target.tagName==='CANVAS')clickTarget=1-clickTarget;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const phaseLabel=document.getElementById('phaseLabel');
const t0=performance.now();
let morphPhase=0, fishPhase=0;

function loop(){
  const t=(performance.now()-t0)/1e3;
  uniforms.uTime.value=t;

  // cypress ↔ tower auto-toggle every ~12s
  const autoT=(Math.floor(t/12)%2===1)?1:0;
  const desired=clickTarget^autoT;
  morphPhase+=(desired-morphPhase)*.02;

  // koi surprise: 7s window every 42s (Magritte beat)
  const tMod=t%42;
  const fishT=(tMod>33&&tMod<40)?1:0;
  fishPhase+=(fishT-fishPhase)*.025;

  uniforms.uMix.value=morphPhase;
  uniforms.uFish.value=fishPhase;

  if(fishPhase>.3){
    phaseLabel.textContent='\u2026koi?';
    phaseLabel.style.opacity=String(.3+fishPhase*.5);
  }else{
    phaseLabel.style.opacity='0.65';
    const pct=Math.round((1-morphPhase)*100);
    phaseLabel.textContent=morphPhase<.5?`cypress ${pct}%`:`art\u2011deco ${100-pct}%`;
  }

  // fixed camera with gentle vertical breathing — NO Y-axis rotation
  camera.position.y=8+Math.sin(t*.08)*1.5;
  controls.target.y=8+Math.sin(t*.08)*.5;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
<button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,.7);cursor:pointer;font-size:13px;line-height:1">\u2665</button>
<button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,.7);cursor:pointer;font-size:13px;line-height:1">\u2715</button>
<input id="pc-input" type="text" maxlength="200" placeholder="What to change\u2026" style="width:160px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,.6)'" onblur="this.style.borderColor='rgba(255,255,255,.13)'">
<button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,.55);border:1px solid rgba(201,168,106,.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,.9);cursor:pointer;font-size:11px;line-height:1">\u2192</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return!dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();if(!txt)return;
    var btn=this;btn.textContent='\u2026';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){var qs='?a='+pid+(d.job_id?'&job='+d.job_id:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});};
})();
</script>

<style>
#gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
  background:rgba(8,12,18,.82);border:1px solid rgba(205,210,220,.12);border-radius:6px;
  padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
#gp-panel .gp-h{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(205,210,220,.45);margin-bottom:8px;}
#gp-panel label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.04em;color:rgba(205,210,220,.6);margin-bottom:2px;}
#gp-panel label span{color:rgba(205,210,220,.85);font-variant-numeric:tabular-nums;}
#gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
  background:rgba(205,210,220,.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
#gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
  border-radius:50%;background:rgba(205,210,220,.55);border:none;cursor:pointer;}
#gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
  background:rgba(205,210,220,.55);border:none;cursor:pointer;}
#gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,.5);
  border:1px solid rgba(201,168,106,.4);border-radius:3px;padding:5px 6px;
  color:rgba(201,168,106,.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:.04em;}
#gp-save:hover{border-color:rgba(201,168,106,.7);}
#gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,.4);
  border:1px solid rgba(205,210,220,.15);border-radius:3px;padding:4px 6px;
  color:rgba(205,210,220,.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
#gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){var p=location.pathname.split('/').filter(Boolean);var i=p.indexOf('pieces');
    if(i>=0&&p[i+1]&&p[i+1]!=='index.html')return p[i+1];var l=p.pop();
    if((l==='index.html'||!l)&&p.length)l=p.pop();if(l)return l;
    var el=document.querySelector('.id');return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';}
  var pid=pieceId(),KEY='pa_cfg_'+pid,G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');for(var i=0;i<cs.length;i++)cs[i].style.filter=f;}
  var tries=0;(function wc(){if(document.querySelector('canvas')||tries++>80){applyFilter();return;}setTimeout(wc,100);})();
  function bind(key,id){var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});}
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){document.getElementById('gp-'+k).value=G[k];document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);}applyFilter();}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function renderSaved(){var w=document.getElementById('gp-saved');w.innerHTML='';
    load().forEach(function(c,i){var b=document.createElement('button');b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};w.appendChild(b);});}
  document.getElementById('gp-save').onclick=function(){var a=load();a.push({id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con});store(a);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,config:a[a.length-1]})}).catch(function(){});};
  renderSaved();
})();
</script>
</body>
</html>
