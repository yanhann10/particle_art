<title>piu · aizawa DCT corruption</title>
<style>

  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;

<div class="id">piu</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*  Rosa Menkman / Vernacular of File Formats —
    Aizawa attractor seen through a corrupted JPEG decoder.
    Particles quantize onto a 3-D macroblock lattice, displaced
    by DCT cosine-basis ripples. Periodic bit-flip events teleport
    whole blocks. Chroma is 4:2:0-subsampled: magenta / cyan / yellow
    smear across block boundaries on a ringing-artifact warm gray.  */

const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
document.body.appendChild(renderer.domElement);

/* ── GPGPU plumbing ─────────────────────────────────── */
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
              minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
              wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
              depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader:   `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
                   void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ── Aizawa simulation shader ───────────────────────── */
const simU = {
  prev: { value: rtA.texture },
  uDt:  { value: 0.012 },
  uA:   { value: 0.95 }, uB: { value: 0.70 },
  uC:   { value: 0.60 }, uD: { value: 3.50 },
  uE:   { value: 0.25 }, uF: { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz; float age = s.w;
      vec3 dp = vec3(
        (p.z - uB)*p.x - uD*p.y,
        uD*p.x + (p.z - uB)*p.y,
        uC + uA*p.z - p.z*p.z*p.z/3.0
          - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
          + uF*p.z*p.x*p.x*p.x
      );
      p += dp * uDt;
      age = mod(age + uDt*0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }`
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

/* ── Point rendering ────────────────────────────────── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);

const geom = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdx[i*2]   = (x + 0.5) / W;
  uvIdx[i*2+1] = (y + 0.5) / H;
}
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
geom.setAttribute('uvIdx',    new THREE.BufferAttribute(uvIdx, 2));

const ptMat = new THREE.ShaderMaterial({
  uniforms: {
    state:   { value: rtB.texture },
    uPixel:  { value: renderer.getPixelRatio() },
    uTime:   { value: 0 },
    uGlitch: { value: 0.15 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime, uGlitch;
    attribute vec2 uvIdx;
    varying float vChroma;
    varying float vSnap;
    varying float vCorrupt;
    varying float vAge;

    /* cheap hash */
    float hash(vec3 v){ return fract(sin(dot(v, vec3(127.1,311.7,74.7)))*43758.5453); }
    float hash2(float a, float b){ return fract(sin(a*127.1+b*311.7)*43758.5453); }

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;

      /* ── macroblock quantization ── */
      float bk = 0.14;
      vec3 bIdx = floor(p / bk);
      vec3 bCtr = (bIdx + 0.5) * bk;
      float bH = hash(bIdx);

      /* snap strength: per-block phase + global glitch */
      float snapPhase = uTime * 0.35 + bH * 6.2832;
      float rawSnap = smoothstep(0.25, 0.75, sin(snapPhase)*0.5+0.5);
      float snap = rawSnap * uGlitch;
      vSnap = snap;

      vec3 qp = mix(p, bCtr, snap);

      /* ── DCT cosine-basis displacement ── */
      vec3 inB = (p - bCtr) / bk;          /* -0.5..0.5 */
      float PI = 3.14159265;
      float k1 = 2.0, k2 = 5.0;
      float dctA = 0.018 * uGlitch;
      qp.x += cos(PI*(2.0*inB.x+1.0)*k1/16.0) * dctA;
      qp.y += cos(PI*(2.0*inB.y+1.0)*k2/16.0) * dctA;
      qp.z += cos(PI*(2.0*inB.z+1.0)*k1/16.0) * dctA * 0.5;

      /* ── bit-flip event ── */
      float flipEpoch = floor(uTime * 0.7);
      float fH = hash2(bH * 1000.0, flipEpoch);
      vCorrupt = 0.0;
      if (fH < 0.035 * uGlitch) {
        /* teleport block: mirror + shift */
        qp = -qp + vec3(sin(flipEpoch*1.3), cos(flipEpoch*0.9), 0.0) * 0.35;
        vCorrupt = 1.0;
      }

      /* ── chroma subsampling: 4:2:0 ── */
      vec3 cBlock = floor(bIdx / 2.0);
      float cH = hash(cBlock);
      vChroma = cH;

      vec4 mv = modelViewMatrix * vec4(qp, 1.0);
      float dist = max(-mv.z, 0.1);
      gl_PointSize = (1.0 + snap * 2.0) * uPixel * (7.5 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vChroma;
    varying float vSnap;
    varying float vCorrupt;
    varying float vAge;

    void main(){
      vec2 d = gl_PointCoord - 0.5;

      /* shape: circle → square as snap increases */
      float rC = length(d) * 2.0;
      float rS = max(abs(d.x), abs(d.y)) * 2.0;
      float r = mix(rC, rS, vSnap * 0.7 + vCorrupt * 0.3);
      if (r > 1.0) discard;

      float falloff = exp(-r * r * 3.5);

      /* ── palette: warm gray base, chroma smears ── */
      vec3 gray    = vec3(0.62, 0.58, 0.55);
      vec3 magenta = vec3(0.88, 0.22, 0.58);
      vec3 cyan    = vec3(0.22, 0.82, 0.78);
      vec3 yellow  = vec3(0.88, 0.82, 0.22);

      /* chroma channel assignment per block (subsampled) */
      vec3 chroma = vChroma < 0.33 ? magenta
                  : vChroma < 0.66 ? cyan
                  : yellow;

      /* color mix: gray unless snapped or corrupted */
      float chromaStrength = vSnap * 0.55 + vCorrupt * 0.9;
      vec3 col = mix(gray, chroma, chromaStrength);

      /* corrupted blocks: brighter, desaturated edge ring */
      if (vCorrupt > 0.5) {
        float ring = smoothstep(0.5, 0.85, r);
        col = mix(col, vec3(0.95, 0.92, 0.88), ring * 0.6);
      }

      /* ringing artifact: faint cosine ripple near block edges */
      float ring = sin(r * 18.0) * 0.08 * vSnap;

      float alpha = falloff * (0.35 + vSnap * 0.35 + vCorrupt * 0.5);
      alpha += ring;
      alpha = clamp(alpha, 0.0, 1.0);

      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});
const pts = new THREE.Points(geom, ptMat);
scene.add(pts);

/* ── scanline overlay (faint horizontal lines) ──────── */
const scanGeo = new THREE.PlaneGeometry(2, 2);
const scanMat = new THREE.ShaderMaterial({
  uniforms: { uGlitch: { value: 0.15 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uGlitch;
    uniform vec2 uRes;
    varying vec2 vUv;
    void main(){
      float y = gl_FragCoord.y;
      /* 8-pixel scanline bands */
      float band = mod(floor(y / 8.0), 2.0);
      float a = band * 0.025 * uGlitch;
      gl_FragColor = vec4(0.0, 0.0, 0.0, a);
    }
  `
});
const scanScene = new THREE.Scene();
const scanCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
scanScene.add(new THREE.Mesh(scanGeo, scanMat));

/* ── resize ─────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  scanMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

/* ── pointer interaction (same as parent) ───────────── */
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  target.a = 0.95 + ((e.clientX / innerWidth) - 0.5) * 0.08;
  target.c = 0.60 + ((e.clientY / innerHeight) - 0.5) * 0.10;
});

/* ── animation ──────────────────────────────────────── */
const t0 = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - t0) * 0.001;

  /* smooth parameter nudge */
  simU.uA.value += (target.a - simU.uA.value) * 0.04;
  simU.uC.value += (target.c - simU.uC.value) * 0.04;

  /* 4 substeps */
  for (let i = 0; i < 4; i++) {
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  /* glitch pulse: base level + periodic surges */
  const g1 = Math.sin(t * 0.7);
  const g2 = Math.sin(t * 1.13);
  const gRaw = Math.max(0, g1 + g2 - 0.6);
  const glitch = Math.min(1.0, 0.15 + gRaw * gRaw * 1.8);

  ptMat.uniforms.state.value = rtA.texture;
  ptMat.uniforms.uTime.value = t;
  ptMat.uniforms.uGlitch.value = glitch;

  scanMat.uniforms.uGlitch.value = glitch;

  /* camera orbit with micro-stutter during high glitch */
  const ang = t * 0.15;
  let cx = Math.sin(ang) * 4.0;
  let cz = Math.cos(ang) * 4.0;
  let cy = Math.sin(ang * 0.7) * 1.0;
  if (glitch > 0.5) {
    const jitter = (glitch - 0.5) * 0.12;
    cx += (Math.random() - 0.5) * jitter;
    cy += (Math.random() - 0.5) * jitter;
  }
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 0, 1.0);

  renderer.render(scene, camera);

  /* scanline overlay */
  renderer.autoClear = false;
  renderer.render(scanScene, scanCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
