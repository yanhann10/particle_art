<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4vd · cypress ↔ art-deco tower · naïve hand</title>
<!-- MOTION: breathe, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08090d; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; color:#cdd2dc;
           font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing:0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">4vd</div>
<div class="hint">drag to orbit · click to flip · naïve-hand mutation</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08090d, 0.015);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08090d, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

/* ── repeatable rng ── */
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

/* ── L-system cypress (pose A) ── */
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = new THREE.Vector3(0,1,0);
  let l = new THREE.Vector3(-1,0,0);
  let u = new THREE.Vector3(0,0,1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

const cypressSegs = turtle(expand('F', 6, rng));

/* ── Art-deco tower (pose B) — with deliberate asymmetric lean ── */
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();
  // slight lean: tower leans 0.6 units in +x by the top (like a hand-drawn tower)
  const LEAN_X = 0.6, LEAN_Z = -0.25;

  const tiers = [
    { hw: 4.5, y0: 0.0,  y1: 4.0,  ridges: 14 },
    { hw: 3.4, y0: 4.0,  y1: 7.5,  ridges: 12 },
    { hw: 2.4, y0: 7.5,  y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8  },
    { hw: 0.85,y0: 13.0, y1: 15.0, ridges: 6  },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;

  const W = Math.floor(N * 0.55);
  const B = Math.floor(N * 0.25);
  const S = Math.floor(N * 0.12);
  const C = N - W - B - S;
  let i = 0;

  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b,0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0,ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      const face = Math.floor(Math.random() * 4);
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;
      const along = (ridgeFrac * 2 - 1) * t.hw;
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      // asymmetric jitter: bigger on +x face (like painter pushed harder on one side)
      const jitterBase = 0.04;
      const jitter = face === 0 ? jitterBase * 2.5 : jitterBase;
      const yNorm = y / 20.5;
      const leanOff = yNorm * LEAN_X;
      const leanOffZ = yNorm * LEAN_Z;
      switch(face){
        case 0: pos.set( t.hw + (Math.random()-0.5)*jitter + leanOff, y, along + leanOffZ); break;
        case 1: pos.set(-t.hw + (Math.random()-0.5)*jitter + leanOff, y, along + leanOffZ); break;
        case 2: pos.set(along + leanOff, y,  t.hw + (Math.random()-0.5)*jitter + leanOffZ); break;
        case 3: pos.set(along + leanOff, y, -t.hw + (Math.random()-0.5)*jitter + leanOffZ); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }

  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const along = (Math.random() * 2 - 1) * t.hw;
    const j = 0.02;
    const yNorm = edge / 20.5;
    const leanOff = yNorm * LEAN_X;
    const leanOffZ = yNorm * LEAN_Z;
    switch(face){
      case 0: pos.set( t.hw + leanOff, edge + (Math.random()-0.5)*j, along + leanOffZ); break;
      case 1: pos.set(-t.hw + leanOff, edge + (Math.random()-0.5)*j, along + leanOffZ); break;
      case 2: pos.set(along + leanOff, edge + (Math.random()-0.5)*j,  t.hw + leanOffZ); break;
      case 3: pos.set(along + leanOff, edge + (Math.random()-0.5)*j, -t.hw + leanOffZ); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  for (let k = 0; k < S; k++){
    const t = Math.random();
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    const yNorm = y / 20.5;
    pos.set(Math.cos(th)*r + yNorm*LEAN_X, y, Math.sin(th)*r + yNorm*LEAN_Z);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5)*0.05;
    const yNorm = y / 20.5;
    pos.set(Math.cos(th)*r + yNorm*LEAN_X, y, Math.sin(th)*r + yNorm*LEAN_Z);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

/* ── build particle attributes ── */
const N = 70000;
const treePos  = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds    = new Float32Array(N);
// "brushstroke" flag: ~7% of particles are big mark-making strokes
const markSize = new Float32Array(N);
// per-particle hand-jitter direction (persistent, not per-frame)
const handJitter = new Float32Array(N * 3);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N * SKELETON_FRAC);
const N_FOLIAGE = N - N_SKEL;

let written = 0;
const v = new THREE.Vector3();

for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written)
    : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    written++;
  }
}

{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8;
  const SPIRAL = 0.9;
  const TUFT_COUNT = 24;
  const tuftYs = [], tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    tuftYs.push(haloYStart + ((i+0.5)/TUFT_COUNT) * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }
  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT  = N_FOLIAGE - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random()-0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    treePos[written*3]   = Math.cos(th) * r;
    treePos[written*3+1] = y + (Math.random()-0.5)*0.05;
    treePos[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random();
    written++;
  }
  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t], tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const tuftSize = 0.18;
    const localY = tuftY + (Math.random()-0.5)*0.4;
    const localTh = tuftTh + (Math.random()-0.5)*0.4;
    const localR = reach + (Math.random()-0.5)*tuftSize;
    treePos[written*3]   = Math.cos(localTh) * localR;
    treePos[written*3+1] = localY;
    treePos[written*3+2] = Math.sin(localTh) * localR;
    seeds[written] = Math.random();
    written++;
  }
}
while (written < N){
  treePos[written*3] = 0; treePos[written*3+1] = 0; treePos[written*3+2] = 0;
  seeds[written] = Math.random(); written++;
}

/* ── assign mark-making sizes + hand-jitter vectors ── */
// "brushstroke" particles: 7% get 2.5-5x size. Another 4% get 1.5-2x (medium marks).
// jitter: every particle gets a persistent directional push (like hand tremor pulling NE)
const TREMOR_DIR = new THREE.Vector3(0.6, 0.15, -0.3).normalize();
for (let i = 0; i < N; i++){
  const r = Math.random();
  if (r < 0.03)       markSize[i] = 3.5 + Math.random() * 1.5;  // bold strokes
  else if (r < 0.07)  markSize[i] = 2.0 + Math.random() * 1.0;  // medium marks
  else if (r < 0.11)  markSize[i] = 1.3 + Math.random() * 0.5;  // slight emphasis
  else                 markSize[i] = 0.7 + Math.random() * 0.5;  // normal (varied, not uniform!)

  // hand jitter: 8-12% of position, biased in tremor direction
  const jAmt = 0.08 + Math.random() * 0.04; // 8-12%
  const jDir = Math.random() < 0.65
    ? TREMOR_DIR.clone().multiplyScalar(jAmt * (0.5 + Math.random()))
    : new THREE.Vector3(
        (Math.random()-0.5) * jAmt,
        (Math.random()-0.5) * jAmt * 0.4,
        (Math.random()-0.5) * jAmt
      );
  handJitter[i*3]   = jDir.x;
  handJitter[i*3+1] = jDir.y;
  handJitter[i*3+2] = jDir.z;
}

/* ── fit both poses ── */
function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity, cx = 0, cz = 0;
  const n = arr.length / 3;
  for (let i = 0; i < n; i++){
    minY = Math.min(minY, arr[i*3+1]); maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= n; cz /= n;
  const s = targetH / (maxY - minY);
  for (let i = 0; i < n; i++){
    arr[i*3]   = (arr[i*3] - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

/* ── shader material ── */
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uMix:    { value: 0 },
  uBreath: { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',   new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',    new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos',   new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',       new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('markSize',   new THREE.BufferAttribute(markSize, 1));
geom.setAttribute('handJitter', new THREE.BufferAttribute(handJitter, 3));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    uniform float uBreath;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    attribute float markSize;
    attribute vec3 handJitter;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vIsMark;

    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // apply persistent hand-jitter (scales with form height — more jitter at top)
      float heightScale = 0.5 + 1.5 * clamp(p.y / 16.0, 0.0, 1.0);
      p += handJitter * heightScale;

      // breathing: whole form scale modulates gently (3-7s cycle)
      float breathScale = 1.0 + uBreath * 0.035;
      p.xz *= breathScale;

      // organic sway (cypress side) — deliberately uneven
      float t = uTime * 0.45 + seed * 6.28;
      float swayAmt = (1.0 - m) * 0.07 * (p.y / 16.0);
      // asymmetric sway: more in +x than -x (like wind from one side)
      p.x += swayAmt * sin(t) * (1.0 + 0.3 * step(0.0, sin(t)));
      p.z += swayAmt * 0.6 * cos(t * 0.7);

      // palette: muddied, hand-mixed feel
      // cypress: olive-umber-sage (not clean greens)
      vec3 treeA = vec3(0.22, 0.28, 0.15);  // dark olive-umber
      vec3 treeB = vec3(0.42, 0.52, 0.28);  // sage
      vec3 treeC = vec3(0.72, 0.75, 0.42);  // warm yellow-green highlight
      vec3 treeD = vec3(0.35, 0.22, 0.14);  // umber undertone (some particles)
      // tower: tarnished bronze-cream-charcoal
      vec3 decoA = vec3(0.30, 0.24, 0.16);  // dark tarnished bronze
      vec3 decoB = vec3(0.68, 0.52, 0.30);  // warm bronze
      vec3 decoC = vec3(0.92, 0.85, 0.72);  // aged cream
      vec3 decoD = vec3(0.18, 0.16, 0.14);  // charcoal shadow

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      float energy = 0.5 + 0.5 * sin(t * 0.6);

      // mix color with seed-based variation (hand-mixed, not gradient)
      vec3 treeCol;
      if (seed < 0.12) treeCol = treeD; // some particles are umber
      else treeCol = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.65, 1.0, hk) * 0.5);

      vec3 decoCol;
      if (seed < 0.08) decoCol = decoD; // some charcoal shadow particles
      else decoCol = mix(decoA, decoB, hk);
      decoCol = mix(decoCol, decoC, smoothstep(0.8, 1.0, hk) * 0.6);

      vCol = mix(treeCol, decoCol, m);
      // mark-making particles: slightly warmer push
      vIsMark = step(1.8, markSize);
      vCol = mix(vCol, vCol * vec3(1.15, 1.05, 0.9), vIsMark * 0.4);

      vAlpha = (0.35 + 0.45 * energy) * (1.0 - 0.15 * vIsMark);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // mark-making: big particles get markSize multiplier
      float baseSize = (0.6 + 0.5 * energy) * markSize;
      gl_PointSize = baseSize * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vIsMark;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      // mark particles: softer falloff (like a loaded brush), normal: sharper
      float falloff = mix(18.0, 8.0, vIsMark);
      float a = exp(-r * falloff) * vAlpha;
      // slight grain: modulate alpha by a high-freq pattern
      float grain = 0.92 + 0.08 * fract(sin(dot(gl_PointCoord, vec2(12.9898, 78.233))) * 43758.5453);
      a *= grain;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── interaction + animation ── */
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // breathing: slow sinusoidal scale ~5s cycle
  uniforms.uBreath.value = Math.sin(t * 1.256);

  // auto-toggle every ~12s
  const auto = (Math.floor(t / 12) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100-pct}%`;

  // camera: slow orbit with slight wobble (hand-held feel, not tripod-smooth)
  const ang = t * 0.05;
  const wobbleX = Math.sin(t * 0.37) * 0.4;
  const wobbleY = Math.sin(t * 0.23) * 0.25;
  camera.position.x = Math.sin(ang) * 22 + wobbleX;
  camera.position.z = Math.cos(ang) * 22;
  camera.position.y = 6 + wobbleY;
  camera.lookAt(0, 8, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
