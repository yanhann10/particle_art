<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1o5 · Riley disrupted weave (intentional breaks)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#998; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#998; }
</style>
</head>
<body>
<div class="id">1o5</div>
<div class="hint">click to regenerate · intentional breaks</div>
<div class="src">Riley · disrupted weave · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 30;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points, mat;

const uniforms = {
  uTime: { value: 0 },
  uPhase: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uRowFreq: { value: 0 },
  uColFreq: { value: 0 },
  uWaveAmp: { value: 0 },
  uTwist: { value: 0 },
  uBreak1Center: { value: new THREE.Vector2() },
  uBreak2Center: { value: new THREE.Vector2() },
  uBreak3Center: { value: new THREE.Vector2() },
  uBreak4Center: { value: new THREE.Vector2() },
  uColor1: { value: new THREE.Color() },
  uColor2: { value: new THREE.Color() },
  uColor3: { value: new THREE.Color() },
};

mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform vec2 uBreak1Center;
    uniform vec2 uBreak2Center;
    uniform vec2 uBreak3Center;
    uniform vec2 uBreak4Center;
    
    attribute vec2 gridPos;
    attribute float seed;
    attribute float breakZone;
    
    varying float vDensity;
    varying float vPhase;
    varying float vBreakZone;
    varying vec2 vGridPos;
    
    void main(){
      vec2 gp = gridPos;
      vGridPos = gp;
      vBreakZone = breakZone;
      
      // Distance to break centers
      float d1 = length(gp - uBreak1Center);
      float d2 = length(gp - uBreak2Center);
      float d3 = length(gp - uBreak3Center);
      float d4 = length(gp - uBreak4Center);
      
      // Break 1: void zone (particles removed)
      float void1 = smoothstep(3.5, 4.0, d1);
      
      // Break 2: density spike (particles cluster)
      float spike2 = smoothstep(2.5, 0.5, d2);
      
      // Break 3: pulled threads (particles displaced radially)
      vec2 pull3Dir = normalize(gp - uBreak3Center);
      float pull3Str = smoothstep(5.0, 2.0, d3) * 2.5;
      
      // Break 4: phase disruption zone
      float phaseDisrupt = smoothstep(4.0, 1.5, d4);
      
      // Apply wave interference
      float rowWave = sin(gp.y * uRowFreq + uTime * 0.4 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.3) * uWaveAmp;
      
      // Twist
      float twist = uTwist * length(gp) * 0.05;
      float ct = cos(twist);
      float st = sin(twist);
      vec2 twisted = vec2(
        gp.x * ct - gp.y * st,
        gp.x * st + gp.y * ct
      );
      
      vec3 p = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);
      
      // Apply break 3 pull
      p.xy += pull3Dir * pull3Str * 0.8;
      
      // Apply break 2 clustering
      vec2 toSpike = uBreak2Center - p.xy;
      p.xy += toSpike * spike2 * 0.6;
      
      // Interference pattern
      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 0.4 + phaseDisrupt * 3.14) * 
                          sin(gp.x * uColFreq * 2.0 + uTime * 0.3);
      
      vDensity = interference;
      vPhase = phaseDisrupt;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      
      // Size variation at breaks
      float baseSize = 2.2;
      float sizeVar = mix(1.0, 1.8, spike2) * mix(1.0, 0.6, pull3Str / 2.5);
      gl_PointSize = uPixel * baseSize * sizeVar * void1;
      
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    
    varying float vDensity;
    varying float vPhase;
    varying float vBreakZone;
    varying vec2 vGridPos;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Three-color palette based on wave phase
      float val = vDensity * 0.5 + 0.5;
      
      vec3 col;
      if (val < 0.33) {
        col = mix(uColor1, uColor2, val / 0.33);
      } else if (val < 0.66) {
        col = mix(uColor2, uColor3, (val - 0.33) / 0.33);
      } else {
        col = mix(uColor3, uColor1, (val - 0.66) / 0.34);
      }
      
      // Phase disruption shifts toward color1
      col = mix(col, uColor1, vPhase * 0.4);
      
      // Soft edge
      float alpha = smoothstep(0.25, 0.18, r) * 0.65;
      
      gl_FragColor = vec4(col, alpha);
    }
  `
});

function buildGrid(rows, cols, seed, break1, break2, break3, break4){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);
  const breakZones = new Float32Array(N);
  
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const width = 24;
  const height = 24;
  const cellW = width / cols;
  const cellH = height / rows;
  
  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        
        // Check if in break zones
        const d1 = Math.hypot(x - break1.x, y - break1.y);
        const d2 = Math.hypot(x - break2.x, y - break2.y);
        const d3 = Math.hypot(x - break3.x, y - break3.y);
        const d4 = Math.hypot(x - break4.x, y - break4.y);
        
        // Skip particles in void zone (break 1)
        if (d1 < 3.5 && rng() < 0.95) continue;
        
        // Add extra particles in spike zone (break 2)
        const inSpike = d2 < 2.0;
        
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        
        seeds[idx] = rng();
        
        // Mark break zones
        let zone = 0;
        if (d1 < 5.0) zone = 1;
        if (d2 < 3.0) zone = 2;
        if (d3 < 5.0) zone = 3;
        if (d4 < 4.0) zone = 4;
        breakZones[idx] = zone;
        
        idx++;
        
        // Duplicate particles in spike zone
        if (inSpike && idx < N && rng() < 0.4){
          const ox = x + (rng() - 0.5) * 0.3;
          const oy = y + (rng() - 0.5) * 0.3;
          positions[idx * 3] = ox;
          positions[idx * 3 + 1] = oy;
          positions[idx * 3 + 2] = 0;
          gridPositions[idx * 2] = ox;
          gridPositions[idx * 2 + 1] = oy;
          seeds[idx] = rng();
          breakZones[idx] = 2;
          idx++;
        }
      }
    }
  }
  
  // Fill remainder
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    
    const d1 = Math.hypot(x - break1.x, y - break1.y);
    if (d1 < 3.5 && rng() < 0.95) continue;
    
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    breakZones[idx] = 0;
    idx++;
  }
  
  return { positions, gridPositions, seeds, breakZones };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);
  
  uniforms.uRowFreq.value = 0.8 + rng() * 1.2;
  uniforms.uColFreq.value = 0.8 + rng() * 1.2;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.7;
  uniforms.uTwist.value = rng() * 6.28;
  uniforms.uPhase.value = rng() * 6.28;
  
  // Position breaks deliberately off-center and asymmetric
  const break1 = { x: -6 + rng() * 4, y: 4 + rng() * 4 };
  const break2 = { x: 3 + rng() * 5, y: -5 + rng() * 4 };
  const break3 = { x: -8 + rng() * 3, y: -6 + rng() * 4 };
  const break4 = { x: 5 + rng() * 4, y: 5 + rng() * 5 };
  
  uniforms.uBreak1Center.value.set(break1.x, break1.y);
  uniforms.uBreak2Center.value.set(break2.x, break2.y);
  uniforms.uBreak3Center.value.set(break3.x, break3.y);
  uniforms.uBreak4Center.value.set(break4.x, break4.y);
  
  // Three-color palette: warm cream, burnt sienna, deep teal
  const palettes = [
    [new THREE.Color(0xf4e8d8), new THREE.Color(0xc84b31), new THREE.Color(0x1a4d5e)],
    [new THREE.Color(0xe8dcc4), new THREE.Color(0x8b3a3a), new THREE.Color(0x2d5a5a)],
    [new THREE.Color(0xf0e5cf), new THREE.Color(0xa0522d), new THREE.Color(0x234858)],
  ];
  const pal = palettes[Math.floor(rng() * palettes.length)];
  uniforms.uColor1.value.copy(pal[0]);
  uniforms.uColor2.value.copy(pal[1]);
  uniforms.uColor3.value.copy(pal[2]);
  
  const { positions, gridPositions, seeds, breakZones } = buildGrid(rows, cols, seed, break1, break2, break3, break4);
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('breakZone', new THREE.BufferAttribute(breakZones, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
    geom.attributes.breakZone.array.set(breakZones);
    geom.attributes.breakZone.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', regenerate);

addEventListener('resize', () => {
  const newAspect = innerWidth / innerHeight;
  camera.left = frustumSize * newAspect / -2;
  camera.right = frustumSize * newAspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
