<!DOCTYPE html>
<!-- MOTION: breathe, intensity: gentle -->
<!-- PIECE: bhs — Anadol Biophilia Coral -->
<!-- PALETTE: bioluminescent cyan #00e8d0 on midnight blue #04080f -->
<!-- CONCEPT: Channel Refik Anadol Large Nature Model: Coral. 12 coral polyp structures.
     Each polyp: recursive 3-level LineSegments tree. All polyps breathe (1.2x↔0.9x scale,
     ~0.05 Hz, random phase offset). Depth atmosphere via vertex shader distance falloff
     (NOT fog:true — avoids silent shader compile failure). Camera drifts around colony. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>bhs · anadol coral</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #04080f; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04080f);

const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 300);
camera.position.set(0, 5, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.target.set(0, 5, 0);

// Minimal ambient (emissive materials only need slight ambient to avoid pitch black)
scene.add(new THREE.AmbientLight(0x051010, 2.0));
// Subtle point light at top for gleam on tips
const tipLight = new THREE.PointLight(0x00ffee, 2.5, 60);
tipLight.position.set(0, 22, 0);
scene.add(tipLight);
// Fill from below
const fillLight = new THREE.PointLight(0x004040, 1.0, 30);
fillLight.position.set(0, -2, 8);
scene.add(fillLight);

// ── Vertex + Fragment shaders with manual distance falloff ──────────────────
// (NO fog: true — that injects fogColor/fogDensity which breaks ShaderMaterial)
const vertShader = `
varying float vDepth;
varying vec3 vWorldPos;

void main() {
  vec4 worldPos = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPos.xyz;
  vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
  vDepth = -mvPos.z;   // positive = farther
  gl_Position = projectionMatrix * mvPos;
}
`;

const fragShader = `
uniform vec3 baseColor;  // bioluminescent cyan
uniform vec3 bgColor;    // midnight
uniform float fogNear;
uniform float fogFar;

varying float vDepth;
varying vec3 vWorldPos;

void main() {
  // Manual exponential fog: attenuates color toward bgColor with depth
  float fogFactor = 1.0 - clamp((fogFar - vDepth) / (fogFar - fogNear), 0.0, 1.0);
  // Height-based brightness: tips glow brighter
  float heightGlow = clamp(vWorldPos.y / 15.0, 0.0, 1.0);
  vec3 col = mix(baseColor * 0.55, baseColor, heightGlow);
  col = mix(col, bgColor, fogFactor * fogFactor);
  gl_FragColor = vec4(col, 1.0);
}
`;

// One shared shader material for all coral lines (kept for potential fallback)
const coralMat = new THREE.ShaderMaterial({
  uniforms: {
    baseColor: { value: new THREE.Color(0x00e8d0) },
    bgColor:   { value: new THREE.Color(0x04080f) },
    fogNear:   { value: 15.0 },
    fogFar:    { value: 55.0 },
  },
  vertexShader: vertShader,
  fragmentShader: fragShader,
  transparent: false,
});

// MeshStandardMaterial for TubeGeometry coral branches
// Emissive so they glow without needing complex lighting
const coralMat2 = new THREE.MeshStandardMaterial({
  color: 0x00e8d0,
  emissive: 0x00b090,
  emissiveIntensity: 0.8,
  metalness: 0.1,
  roughness: 0.5,
  side: THREE.DoubleSide,
});

// ── Build one polyp as a group of TubeGeometry branches ──────────────────────
// TubeGeometry gives visible width unlike 1px LineSegments
function buildPolyp(x0, y0, z0, height, spread) {
  const group = new THREE.Group();
  const segments = [];

  function branch(ox, oy, oz, dx, dy, dz, len, depth) {
    if (depth <= 0 || len < 0.3) return;
    const ex = ox + dx * len;
    const ey = oy + dy * len;
    const ez = oz + dz * len;
    segments.push({ ox, oy, oz, ex, ey, ez, len, depth });
    if (depth > 1) {
      const nFork = 3;
      for (let k = 0; k < nFork; k++) {
        const angle = (k / nFork) * Math.PI * 2 + Math.random() * 0.5;
        const tilt  = 0.35 + Math.random() * 0.25;
        const ndx = dx * Math.cos(tilt) + Math.cos(angle) * Math.sin(tilt) * spread;
        const ndy = dy * Math.cos(tilt) + Math.sin(angle) * Math.sin(tilt) * 0.4 + Math.random() * 0.1;
        const ndz = dz * Math.cos(tilt) + Math.cos(angle + 1.57) * Math.sin(tilt) * spread;
        const nl  = Math.sqrt(ndx*ndx + ndy*ndy + ndz*ndz);
        branch(ex, ey, ez, ndx/nl, ndy/nl, ndz/nl, len * 0.6, depth - 1);
      }
    }
  }

  // Trunk
  branch(x0, y0, z0, 0, 1, 0, height * 0.45, 3);
  // Lateral sub-trunks for bushy look
  for (let k = 0; k < 3; k++) {
    const angle = (k / 3) * Math.PI * 2;
    branch(
      x0, y0 + height * 0.2, z0,
      Math.cos(angle) * 0.4, 0.9, Math.sin(angle) * 0.4,
      height * 0.35, 2
    );
  }

  // Build TubeGeometry for each segment — radius proportional to depth
  segments.forEach(({ ox, oy, oz, ex, ey, ez, len, depth }) => {
    const r = depth === 3 ? 0.055 : depth === 2 ? 0.035 : 0.018;
    const curve = new THREE.LineCurve3(
      new THREE.Vector3(ox, oy, oz),
      new THREE.Vector3(ex, ey, ez)
    );
    const tubeGeo = new THREE.TubeGeometry(curve, 4, r, 5, false);
    const mesh = new THREE.Mesh(tubeGeo, coralMat2);
    group.add(mesh);
  });

  return group;
}

// ── Place 12 polyps in a colony arrangement ─────────────────────────────────
const polyps = [];
const N_POLYPS = 12;

// Tighter cluster, tall polyps, camera close
const polyp_metadata = [
  { x:  0,   z:  0,   h: 11.0, s: 0.55 },
  { x:  2.5, z:  0.5, h:  9.0, s: 0.48 },
  { x: -2.2, z:  1.0, h: 10.0, s: 0.52 },
  { x:  1.2, z: -2.5, h:  8.0, s: 0.44 },
  { x: -3.2, z: -0.8, h:  9.0, s: 0.50 },
  { x:  3.8, z: -1.0, h:  7.0, s: 0.38 },
  { x: -1.0, z:  3.0, h:  7.5, s: 0.42 },
  { x:  0.5, z:  3.5, h:  6.5, s: 0.36 },
  { x: -3.5, z:  2.0, h:  6.0, s: 0.32 },
  { x:  3.2, z:  2.5, h:  6.0, s: 0.35 },
  { x: -2.5, z: -3.0, h:  7.0, s: 0.40 },
  { x:  2.0, z: -3.5, h:  6.0, s: 0.33 },
];

polyp_metadata.forEach((pm, idx) => {
  const mesh = buildPolyp(pm.x, 0, pm.z, pm.h, pm.s);
  mesh.userData = {
    baseScale: 1.0,
    phase: Math.random() * Math.PI * 2, // random breathing phase
    baseY: 0,
  };
  scene.add(mesh);
  polyps.push(mesh);
});

// ── Camera drift path ────────────────────────────────────────────────────────
// Slow Lissajous-like drift
const CAM_RADIUS = 10;
const CAM_HEIGHT_BASE = 5;

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.004;

  // Breathe each polyp
  polyps.forEach((p) => {
    const ph = p.userData.phase;
    const FREQ = 0.05 * Math.PI * 2; // ~0.05 Hz
    const breathe = 0.9 + 0.3 * (0.5 + 0.5 * Math.sin(t * FREQ * 8 + ph));
    // breathe oscillates 0.9 ↔ 1.2
    const scale = 0.9 + (1.2 - 0.9) * ((breathe - 0.9) / 0.3);
    p.scale.set(1.0, scale, 1.0);
  });

  // Slow camera orbit (different from autoRotate — more organic path)
  camera.position.x = Math.sin(t * 0.12) * CAM_RADIUS;
  camera.position.z = Math.cos(t * 0.12) * CAM_RADIUS;
  camera.position.y = CAM_HEIGHT_BASE + Math.sin(t * 0.07) * 3;
  camera.lookAt(controls.target);

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const W2 = window.innerWidth, H2 = window.innerHeight;
  camera.aspect = W2 / H2;
  camera.updateProjectionMatrix();
  renderer.setSize(W2, H2);
});
</script>
<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
