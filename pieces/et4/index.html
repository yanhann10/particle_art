<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>et4 · Shiota — After the Dream</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">et4</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.002);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060202, 0.01));

const pL = new THREE.PointLight(0xffd0a0, 0.03, 50, 1.8);
pL.position.set(-2, 18, 3);
scene.add(pL);

let seed = 73819264;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 34, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — the remembered form, presence-in-absence
// A dress Shiota hung in her grandmother's house after she passed.
// Not the body. The memory of the body.
const dressCenter = new THREE.Vector3(0.4, 0, -0.2);
const dressTop = 4.2;
const dressBot = -2.8;
const dressH = dressTop - dressBot;

// Dress profile: [t (0=top, 1=bottom), radius]
const dressProfile = [
  [0.00, 0.01], // hanger tip
  [0.04, 0.08], // hanger wire
  [0.08, 0.32], // shoulders
  [0.15, 0.38], // upper chest
  [0.25, 0.34], // chest taper
  [0.35, 0.28], // waist
  [0.45, 0.34], // hip begin
  [0.55, 0.50], // hip
  [0.70, 0.72], // mid skirt
  [0.85, 0.95], // lower skirt
  [1.00, 1.15], // hem — slightly flared
];

function dressRadius(t){
  t = Math.max(0, Math.min(1, t));
  for(let i = 1; i < dressProfile.length; i++){
    if(t <= dressProfile[i][0]){
      const [t0, r0] = dressProfile[i-1];
      const [t1, r1] = dressProfile[i];
      const f = (t - t0) / (t1 - t0);
      return r0 + (r1 - r0) * f;
    }
  }
  return dressProfile[dressProfile.length-1][1];
}

// Build dress mesh via LatheGeometry
const profilePts = [];
for(let i = 0; i <= 24; i++){
  const t = i / 24;
  const r = dressRadius(t);
  const y = dressTop - t * dressH;
  profilePts.push(new THREE.Vector2(r, y));
}
const dressGeo = new THREE.LatheGeometry(profilePts, 16);
const dressMat = new THREE.MeshStandardMaterial({
  color: 0xf0e6d6, emissive: 0xe8dcc8, emissiveIntensity: 0.55,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide
});
const dress = new THREE.Mesh(dressGeo, dressMat);
dress.position.copy(dressCenter);
scene.add(dress);

// Inner luminance — warmth where the body once was
const innerGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.5, dressH * 0.6, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf0e0, transparent: true, opacity: 0.025 })
);
innerGlow.position.set(dressCenter.x, dressCenter.y + 0.5, dressCenter.z);
scene.add(innerGlow);

// ── Sample dress surface parametrically
function dressSurf(){
  const t = rng();
  const r = dressRadius(t) * (0.95 + rng()*0.1);
  const a = rng() * Math.PI * 2;
  const y = dressTop - t * dressH;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(a) * r,
    y,
    dressCenter.z + Math.sin(a) * r
  );
}

// ── Suspension threads — 10 fine lines from ceiling to dress hanger
const suspPts = [];
for(let i = 0; i < 10; i++){
  const a = (i / 10) * Math.PI * 2 + (rng()-0.5)*0.3;
  const spreadTop = 0.8 + rng()*1.5;
  const spreadBot = 0.02 + rng()*0.06;
  suspPts.push(
    dressCenter.x + Math.cos(a)*spreadTop, hh, dressCenter.z + Math.sin(a)*spreadTop,
    dressCenter.x + Math.cos(a)*spreadBot, dressTop - 0.02, dressCenter.z + Math.sin(a)*spreadBot
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.5
})));

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — concentric shells around the dress
const anchors = [];
const shellRadii = [2.5, 4.5, 7, 10, 14];
for(const sr of shellRadii){
  const nPts = Math.floor(12 + sr * 2.2);
  for(let i = 0; i < nPts; i++){
    const u = rng() * Math.PI * 2;
    const v = Math.acos(2*rng()-1);
    const r = sr * (0.85 + rng()*0.3);
    anchors.push(new THREE.Vector3(
      dressCenter.x + Math.sin(v)*Math.cos(u) * r + (rng()-0.5)*0.5,
      dressCenter.y + Math.sin(v)*Math.sin(u) * r * 0.8 + (rng()-0.5)*0.4,
      dressCenter.z + Math.cos(v) * r + (rng()-0.5)*0.5
    ));
  }
}
while(anchors.length < 480){
  const p = rng() < 0.3 ? wallPt() : wallPt().lerp(dressCenter, 0.03 + rng()*0.18);
  anchors.push(p);
}

// Void zones — negative space the camera breathes through
const voids = [
  { pos: new THREE.Vector3(dressCenter.x - 4, dressCenter.y - 6, dressCenter.z + 5), r: 2.6 },
  { pos: new THREE.Vector3(dressCenter.x + 5, dressCenter.y + 4, dressCenter.z - 4), r: 2.0 },
  { pos: new THREE.Vector3(dressCenter.x + 2, dressCenter.y - 7, dressCenter.z - 5), r: 2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — two rules only (Casey Reas reduction)
// Rule 1: anchor/wall → nearest dress surface point (convergence)
// Rule 2: anchor → anchor within proximity threshold (connective tissue)
// Plus: gravitational drape from hem and architectural wall spans

const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-dressCenter.x)**2+(my-dressCenter.y)**2+(mz-dressCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE — threads reaching for the dress
// The web is an extension of the body's memory, each thread a nerve ending
// seeking the form that once wore it
const catA = Math.floor(NUM_LINES * 0.52);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = dressSurf();

  // 12% stop short — threads that almost reach the dress but can't
  // the gap between memory and presence
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng() * 1.1;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: PROXIMITY — anchor-to-anchor within threshold
// Density emerges from proximity alone — the connective tissue of memory
const THRESH = 5.5;
const catBtarget = Math.floor(NUM_LINES * 0.30);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 80000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.35 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// GRAVITATIONAL DRAPE — threads falling from the hem toward the floor
// Weight pulling the web earthward, gravity as grief
const catC = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const t = 0.7 + rng() * 0.3; // sample from lower dress only
  const r = dressRadius(t) * (0.9 + rng()*0.2);
  const a = rng() * Math.PI * 2;
  const y = dressTop - t * dressH;
  const spt = new THREE.Vector3(
    dressCenter.x + Math.cos(a) * r,
    y,
    dressCenter.z + Math.sin(a) * r
  );
  const floorPt = new THREE.Vector3(
    spt.x + (rng()-0.5)*3.5,
    -hh,
    spt.z + (rng()-0.5)*3.5
  );
  if(!inVoid(spt)) setLine(spt, floorPt, 2);
}

// Fill remainder: architectural wall-to-wall spans — the room as container
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.15 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity by category:
// convergence (brightest), proximity (mid), drape (mid-warm), architectural (faintest)
const catOpacity = [0.075, 0.048, 0.06, 0.024];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.025;
  const bright = op / 0.075;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, old letters, identity documents
// caught in the web like insects in amber
const NUM_FRAGMENTS = 22;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.065;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.4 + rng()*0.6);
  const h = sz * (0.5 + rng()*0.8);
  const verts = new Float32Array([
    w*(-0.25+rng()*0.12), h*0.5, 0,
    -w*0.5, h*(-0.08+rng()*0.06), 0,
    w*(0.08-rng()*0.2), -h*0.5, 0,
    w*(-0.25+rng()*0.12), h*0.5, 0,
    w*(0.12+rng()*0.25), h*(rng()*0.03), 0,
    w*(0.08-rng()*0.2), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.03, d*0.01),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.55){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(1.8 + rng()*5.5));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative arc:
// Begin below and behind the dress, looking up through the hem's drape threads.
// Rise slowly alongside, level with the waist — intimate, human-scale.
// Continue upward past the shoulders, seeing the hanger's suspension lines.
// Finally ascend to see the full web radiating outward — the nervous system revealed.
// The arc: from beneath (supplication) → alongside (recognition) → above (comprehension).
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;

  let rH, y;
  if(t < 0.2){
    // Phase 1: below and behind — looking up through drape threads
    const lt = t / 0.2;
    rH = 7.0 + Math.sin(lt * Math.PI * 0.5) * 1.5;
    y = cy - 6 + lt * 2;
  } else if(t < 0.45){
    // Phase 2: rising alongside — the dress is a person-height away
    const lt = (t - 0.2) / 0.25;
    rH = 6.5 - lt * 1.5;
    y = cy - 4 + lt * 5.5;
  } else if(t < 0.7){
    // Phase 3: intimate orbit at waist-height — inside the densest web
    const lt = (t - 0.45) / 0.25;
    rH = 5.0 + Math.sin(lt * Math.PI) * 0.5;
    y = cy + 1.5 + Math.sin(lt * Math.PI) * 1.2;
  } else {
    // Phase 4: ascending above — the architecture of memory
    const lt = (t - 0.7) / 0.3;
    rH = 5.5 + lt * 3.5;
    y = cy + 2.7 + lt * 6 + Math.sin(lt * Math.PI) * 1.5;
  }

  const x = cx + Math.sin(p * 1.08) * rH + Math.cos(p * 0.35 + 1.1) * 0.3;
  const z = cz + Math.cos(p * 1.08) * (rH * 1.02) + Math.sin(p * 0.4 + 0.6) * 0.25;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible, as if the room inhales around the dress
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0001 * Math.max(0, 1.0 - dist / 22.0);
    const phase = basePositions[idx]*0.1 + basePositions[idx+1]*0.12 + i*0.00025;
    const breath = Math.sin(t*0.007 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.08;
      arr[vi+2] = basePositions[vi+2] + breath*0.16;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera dolly
  const speed = 0.0003;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress — the absence at the center
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.0009)*0.025;
  look.y += Math.cos(t*0.0007)*0.015 + 0.6;
  look.z += Math.sin(t*0.001)*0.02;
  camera.lookAt(look);

  // Subtle warm light drift
  pL.position.x = -2 + Math.sin(t*0.0004)*0.08;
  pL.position.y = 18 + Math.cos(t*0.00025)*0.04;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
