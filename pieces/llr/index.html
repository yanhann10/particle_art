<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llr · crystal lattice bonk</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0D1B2A; overflow:hidden;
               color:#FFD166; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#FFD166; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">llr</div>
<div class="hint">drag to orbit · click to bonk</div>
<div class="src">straight lines · smooth LERP · joy-palette</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────── LERP constant
const LERP = 0.08;

// ─────────── Joy palette
const JOY_COLORS = [
  new THREE.Color(0xFFD166), // gold
  new THREE.Color(0xFF6B9D), // pink
  new THREE.Color(0xFF8C69), // coral
];
const BG = 0x0D1B2A;

// ─────────── Scene setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.022);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(10, 9, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── Crystal lattice structure
// Each "branch" is a set of straight-line segments from a root to leaves.
// Branches fan out in fractal-like angular steps — all edges are straight rods.

const NUM_LEVELS   = 5;      // branching depth
const BRANCH_COUNT = 6;      // top-level branches
const CHILDREN     = 3;      // children per node
const BASE_LEN     = 2.8;    // root segment length
const LEN_DECAY    = 0.62;   // length multiplier per level
const SPREAD_ANG   = 0.52;   // radians spread from parent direction

// A node: world position (current & target), parent index, color index, level
const nodes = [];   // { x, y, z, tx, ty, tz, colorIdx, level, parentIdx }
const edges = [];   // [nodeIdxA, nodeIdxB, colorIdx]

function buildLattice() {
  // Origin anchor
  nodes.push({ x:0, y:0, z:0, tx:0, ty:0, tz:0, colorIdx:0, level:0, parentIdx:-1 });

  function addBranch(parentIdx, dir, length, level, colorIdx) {
    if (level > NUM_LEVELS) return;
    const p = nodes[parentIdx];
    const nx = p.x + dir.x * length;
    const ny = p.y + dir.y * length;
    const nz = p.z + dir.z * length;
    const cIdx = colorIdx % 3;
    const nodeIdx = nodes.length;
    nodes.push({ x: nx, y: ny, z: nz, tx: nx, ty: ny, tz: nz, colorIdx: cIdx, level, parentIdx });
    edges.push([parentIdx, nodeIdx, cIdx]);

    if (level === NUM_LEVELS) return;
    const childLen = length * LEN_DECAY;

    // Build child directions: rotate around dir by CHILDREN evenly spaced azimuth angles,
    // tilted by SPREAD_ANG from parent direction
    const up = new THREE.Vector3(0, 1, 0.01).normalize();
    const right = new THREE.Vector3().crossVectors(dir, up).normalize();
    const forward = new THREE.Vector3().copy(dir);

    for (let c = 0; c < CHILDREN; c++) {
      const az = (c / CHILDREN) * Math.PI * 2 + level * 0.3;
      const childDir = new THREE.Vector3()
        .copy(forward)
        .addScaledVector(right, Math.cos(az) * Math.tan(SPREAD_ANG))
        .addScaledVector(up.clone().cross(right), Math.sin(az) * Math.tan(SPREAD_ANG))
        .normalize();
      addBranch(nodeIdx, childDir, childLen, level + 1, colorIdx + c + level);
    }
  }

  for (let b = 0; b < BRANCH_COUNT; b++) {
    const az = (b / BRANCH_COUNT) * Math.PI * 2;
    const tilt = 0.22 + (b % 2) * 0.15;
    const dir = new THREE.Vector3(
      Math.cos(az) * tilt,
      1.0 - tilt * 0.3,
      Math.sin(az) * tilt
    ).normalize();
    addBranch(0, dir, BASE_LEN, 1, b);
  }
}

buildLattice();

// ─────────── Rest positions (stored for bonk recovery)
const restPos = nodes.map(n => ({ x: n.x, y: n.y, z: n.z }));

// ─────────── Line geometry
// One LineSegments object per color group for joy-palette separation
const lineGeoms = [null, null, null];
const lineMeshes = [null, null, null];

// Each color group holds its flat position buffer
function buildLineBuffers() {
  const posByColor = [[], [], []];

  for (const [ai, bi, cIdx] of edges) {
    const a = nodes[ai], b = nodes[bi];
    posByColor[cIdx % 3].push(a.x, a.y, a.z, b.x, b.y, b.z);
  }

  for (let c = 0; c < 3; c++) {
    const arr = new Float32Array(posByColor[c]);
    if (!lineGeoms[c]) {
      lineGeoms[c] = new THREE.BufferGeometry();
      lineGeoms[c].setAttribute('position', new THREE.BufferAttribute(arr.slice(), 3));
      const mat = new THREE.LineBasicMaterial({
        color: JOY_COLORS[c].clone(),
        linewidth: 1,
        fog: true,
      });
      lineMeshes[c] = new THREE.LineSegments(lineGeoms[c], mat);
      scene.add(lineMeshes[c]);
    } else {
      // update existing buffer
      const buf = lineGeoms[c].getAttribute('position');
      if (buf.array.length === arr.length) {
        buf.array.set(arr);
        buf.needsUpdate = true;
      } else {
        lineGeoms[c].setAttribute('position', new THREE.BufferAttribute(arr, 3));
      }
    }
  }
}

buildLineBuffers();

// ─────────── Small node spheres at junctions (straight-line octahedra)
// Use tiny wireframe octahedra as joints — all straight edges, fits theme
const nodeGeomBase = new THREE.OctahedronGeometry(0.06, 0);
const nodeMats = JOY_COLORS.map(c => new THREE.MeshBasicMaterial({ color: c, wireframe: true }));
const nodeMeshes = nodes.map((n, i) => {
  const m = new THREE.Mesh(nodeGeomBase, nodeMats[n.colorIdx % 3]);
  m.position.set(n.x, n.y, n.z);
  scene.add(m);
  return m;
});

// ─────────── BONK mechanics
let bonkTime = -999;
let bonkActive = false;

// Per-node bonk displacement (lerped in, then lerped out)
const bonkDx = new Float32Array(nodes.length);
const bonkDy = new Float32Array(nodes.length);
const bonkDz = new Float32Array(nodes.length);

// Target bonk displacement (applied on trigger, then zeroed for recovery)
const bonkTargetDx = new Float32Array(nodes.length);
const bonkTargetDy = new Float32Array(nodes.length);
const bonkTargetDz = new Float32Array(nodes.length);

function triggerBonk() {
  bonkTime = performance.now() / 1000;
  bonkActive = true;

  // Find height range
  let yMin = Infinity, yMax = -Infinity;
  for (const n of nodes) { if (n.y < yMin) yMin = n.y; if (n.y > yMax) yMax = n.y; }
  const yRange = Math.max(yMax - yMin, 0.1);

  for (let i = 0; i < nodes.length; i++) {
    const hFrac = (nodes[i].y - yMin) / yRange; // 0=base, 1=top
    // Squash top down, bulge sides at mid-height
    const squash = hFrac * hFrac * 2.2;
    const bulgeFrac = Math.exp(-Math.pow((hFrac - 0.5) * 3.5, 2));
    const lateral = bulgeFrac * 0.7;
    const dx = nodes[i].x, dz = nodes[i].z;
    const dLen = Math.hypot(dx, dz) + 1e-6;
    bonkTargetDx[i] = (dx / dLen) * lateral;
    bonkTargetDy[i] = -squash * 0.6;
    bonkTargetDz[i] = (dz / dLen) * lateral;
  }
}

renderer.domElement.addEventListener('click', (e) => {
  if (e.detail === 1) triggerBonk();
});

// Auto-bonk at start
setTimeout(triggerBonk, 2500);

// ─────────── LERP helpers
function lerpVal(cur, target, rate, dt) {
  return cur + (target - cur) * Math.min(1, rate * dt * 60);
}

// ─────────── Color LERP state
// Each color group material lerps toward a bonk-flash target
const baseColors = JOY_COLORS.map(c => c.clone());
const bonkFlash  = new THREE.Color(0xFFFFFF);  // brief white flash
const colorLerp  = [0, 0, 0]; // 0=rest, 1=bonk flash

// ─────────── Animation
const startT = performance.now();
let prevT = startT;

function loop() {
  const nowMs = performance.now();
  const t = (nowMs - startT) / 1000;
  const dt = Math.min((nowMs - prevT) / 1000, 0.05);
  prevT = nowMs;

  const elapsed = t - bonkTime;

  // Bonk envelope — fast decay controls displacement amount, slow decay controls color
  const envFast = Math.exp(-elapsed * 2.5);   // displacement envelope
  const envSlow = Math.exp(-elapsed * 1.2);   // color envelope

  // Phase: if within 0–0.12s of bonk, push displacement targets in; after that, recover to zero
  const phase = elapsed < 0.08 ? 1.0 : 0.0;  // snap in fast, lerp out slowly

  for (let i = 0; i < nodes.length; i++) {
    const targetX = bonkTargetDx[i] * phase * envFast;
    const targetY = bonkTargetDy[i] * phase * envFast;
    const targetZ = bonkTargetDz[i] * phase * envFast;

    bonkDx[i] = lerpVal(bonkDx[i], targetX, LERP, dt);
    bonkDy[i] = lerpVal(bonkDy[i], targetY, LERP, dt);
    bonkDz[i] = lerpVal(bonkDz[i], targetZ, LERP, dt);
  }

  // Slow ambient sway — straight lines gently oscillate node positions
  const swayAmp = 0.08;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const swayX = Math.sin(t * 0.7 + i * 0.31) * swayAmp * (n.level || 0) * 0.2;
    const swayZ = Math.cos(t * 0.5 + i * 0.19) * swayAmp * (n.level || 0) * 0.2;
    // LERP current position toward rest+sway+bonk
    n.x = lerpVal(n.x, restPos[i].x + swayX + bonkDx[i], LERP * 0.4, dt);
    n.y = lerpVal(n.y, restPos[i].y + bonkDy[i], LERP * 0.5, dt);
    n.z = lerpVal(n.z, restPos[i].z + swayZ + bonkDz[i], LERP * 0.4, dt);
  }

  // Update node mesh positions
  for (let i = 0; i < nodes.length; i++) {
    nodeMeshes[i].position.set(nodes[i].x, nodes[i].y, nodes[i].z);
  }

  // Rebuild line segment buffers from updated node positions
  buildLineBuffers();

  // Color LERP: flash toward white on bonk, recover to joy colors
  const flashAmt = Math.pow(envSlow, 0.6) * (elapsed < 1.5 ? 1 : 0);
  for (let c = 0; c < 3; c++) {
    const targetColor = baseColors[c].clone().lerp(bonkFlash, flashAmt * 0.55);
    lineMeshes[c].material.color.lerp(targetColor, LERP * 2);
    nodeMats[c].color.lerp(targetColor, LERP * 2);
  }

  // Camera LERP toward structure center
  const camTargetY = 5.0;
  controls.target.y = lerpVal(controls.target.y, camTargetY, LERP * 0.3, dt);

  // Camera shake on bonk impact
  if (envFast > 0.05 && elapsed < 0.4) {
    const shake = envFast * 0.09;
    camera.position.x += Math.sin(t * 43) * shake;
    camera.position.z += Math.cos(t * 31) * shake;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
