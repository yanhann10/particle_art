<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1co · Shiota — Red Circulatory</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">1co</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0038);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.018));
const key1 = new THREE.PointLight(0x2a0808, 0.028, 36, 1.6);
key1.position.set(-14, 16, 10);
scene.add(key1);

let seed = 736281;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 52, h: 36, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED SPHERE — the pale center, the remembered object
const spherePos = new THREE.Vector3(2.4, 0.8, -1.2);
const sphereGeo = new THREE.SphereGeometry(3.2, 24, 16);
const sphereMesh = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
  color: 0xf8f2e8,
  emissive: 0xd4c8b8,
  emissiveIntensity: 0.72,
  metalness: 0.0,
  roughness: 0.92
}));
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

const sphereGlow = new THREE.PointLight(0x1c0606, 0.022, 20, 2.0);
sphereGlow.position.copy(spherePos);
scene.add(sphereGlow);

// ANCHOR POINT GENERATION — distributed across three zones

const anchors = [];

// ZONE 1: Dense shell around sphere — threads will converge here
const innerCount = 220;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 4.2 + rng()*2.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 2: Mid-distance orbital shell
const midCount = 280;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 10.0 + rng()*6.4;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 3: Far shell — outer boundary
const outerCount = 180;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 18.0 + rng()*8.0;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 4: Wall anchors — sparse attachment points
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*1.6;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*1.6;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.86, ROOM.d*0.86, 3));
anchors.push(...wallGrid('x', hw, ROOM.h*0.86, ROOM.d*0.86, 3));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.86, ROOM.d*0.86, 4));
anchors.push(...wallGrid('y', hh, ROOM.w*0.86, ROOM.d*0.86, 4));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.86, ROOM.h*0.86, 3));
anchors.push(...wallGrid('z', hd, ROOM.w*0.86, ROOM.h*0.86, 3));

// ZONE 5: Volume scatter — cloud of interior anchors
for(let i=0; i<320; i++){
  const x = (rng()-0.5)*ROOM.w*0.82;
  const y = (rng()-0.5)*ROOM.h*0.82;
  const z = (rng()-0.5)*ROOM.d*0.82;
  anchors.push(new THREE.Vector3(x, y, z));
}

// RED THREAD NETWORK — 20,000 segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Radial threads converging toward sphere surface
const convergeCount = 8400;
for(let i=0; i<convergeCount && li<NUM_LINES-11600; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(spherePos);
  if(dSphere < 4.0) continue;
  
  const dir = spherePos.clone().sub(a).normalize();
  const targetDist = dSphere - 3.2 - rng()*0.8;
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Sphere surface radiants — threads extending outward from sphere
const radialCount = 2800;
for(let i=0; i<radialCount && li<NUM_LINES-8800; i++){
  const y = 1 - (i / radialCount) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*3.2, y*3.2, z*3.2).add(spherePos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 6.8 + rng()*10.4;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY C: Circumferential rings — horizontal orbital threads
const circumLevels = 11;
const threadsPerLevel = 86;
for(let l=0; l<circumLevels && li<NUM_LINES-7854; l++){
  const r = 7.2 + l*2.0;
  const yBase = spherePos.y + (l-circumLevels/2)*2.6;
  
  for(let i=0; i<threadsPerLevel && li<NUM_LINES-7854; i++){
    const t0 = (i/threadsPerLevel) * Math.PI*2;
    const t1 = t0 + Math.PI*2/threadsPerLevel;
    
    const x0 = spherePos.x + Math.cos(t0)*r;
    const z0 = spherePos.z + Math.sin(t0)*r;
    const x1 = spherePos.x + Math.cos(t1)*r;
    const z1 = spherePos.z + Math.sin(t1)*r;
    
    const y0 = yBase + Math.sin(t0*5)*0.6;
    const y1 = yBase + Math.sin(t1*5)*0.6;
    
    setLine(
      new THREE.Vector3(x0, y0, z0),
      new THREE.Vector3(x1, y1, z1)
    );
  }
}

// CATEGORY D: Meridian arcs — vertical loops through sphere
const meridians = 42;
const ptsPerMeridian = 14;
for(let m=0; m<meridians && li<NUM_LINES-7308; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 11.2 + (m%5)*1.6;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-7308; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      spherePos.x + Math.cos(theta)*Math.cos(phi0)*r,
      spherePos.y + Math.sin(phi0)*r,
      spherePos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      spherePos.x + Math.cos(theta)*Math.cos(phi1)*r,
      spherePos.y + Math.sin(phi1)*r,
      spherePos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Wall-to-wall spans — long architectural threads
let wallSpans = 0;
while(wallSpans<2200 && li<NUM_LINES-5108){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>16.0 && d<42.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY F: Horizontal crossing threads
for(let i=0; i<1100 && li<NUM_LINES-4008; i++){
  const y = spherePos.y + (rng()-0.5)*20.0;
  const x0 = -hw + rng()*7.0;
  const z0 = (rng()-0.5)*ROOM.d*0.84;
  const x1 = hw - rng()*7.0;
  const z1 = (rng()-0.5)*ROOM.d*0.84;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY G: Vertical suspension threads — ceiling to floor
for(let i=0; i<520 && li<NUM_LINES-3488; i++){
  const x = (rng()-0.5)*ROOM.w*0.82;
  const z = (rng()-0.5)*ROOM.d*0.82;
  const y0 = -hh + rng()*3.0;
  const y1 = hh - rng()*3.0;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY H: Proximity web — local neighborhood connections
const THRESH = 10.4;
let webCount = 0, attempts = 0;
while(webCount<2000 && li<NUM_LINES-1488 && attempts<14000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<5; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.8 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY I: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>8.0 && d<22.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.068,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow walk inside the circulatory web
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.28){
    const lt = t/0.28;
    const angle = Math.PI*0.22 + lt*Math.PI*1.08;
    const r = 22.0 - lt*8.6;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 12.4 - lt*7.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.54){
    const lt = (t-0.28)/0.26;
    const angle = Math.PI*1.30 + lt*Math.PI*1.52;
    const r = 13.4 + Math.sin(lt*Math.PI*2.0)*3.2;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 4.6 + Math.cos(lt*Math.PI*1.4)*2.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.54)/0.24;
    const angle = Math.PI*2.82 + lt*Math.PI*1.06;
    const r = 11.8 + Math.cos(lt*Math.PI)*2.2;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y - 1.8 - lt*8.6;
    z = spherePos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*3.88 + lt*Math.PI*0.68;
    const r = 9.6 + lt*11.8;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 5.2 + lt*7.4;
    z = spherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Sphere subtle breath
  const breathScale = 1.0 + Math.sin(elapsed*0.00032)*0.006;
  sphereMesh.scale.setScalar(breathScale);

  // Camera dolly along path
  const speed = 0.0000062;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    spherePos.x + Math.sin(elapsed*0.000028)*0.18,
    spherePos.y + Math.cos(elapsed*0.000034)*0.16,
    spherePos.z + Math.sin(elapsed*0.000024)*0.14
  );

  key1.intensity = 0.028 + Math.sin(elapsed*0.000048)*0.008;
  sphereGlow.intensity = 0.022 + Math.sin(elapsed*0.000056)*0.006;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
