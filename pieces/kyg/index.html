<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kyg · data pour · Anadol flow sculpture</title>
<!-- MOTION: pour, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050508; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">kyg</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SIZE = 512; // 512x512 = 262144 particles
const COUNT = SIZE * SIZE;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 2, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ─── GPGPU via render targets ───
function createRT(){
  return new THREE.WebGLRenderTarget(SIZE, SIZE, {
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    format: THREE.RGBAFormat, type: THREE.FloatType
  });
}

let rtPos0 = createRT(), rtPos1 = createRT();
let rtVel0 = createRT(), rtVel1 = createRT();

// Initialize positions: fill a torus-like volume
const initPosData = new Float32Array(COUNT * 4);
const initVelData = new Float32Array(COUNT * 4);
for (let i = 0; i < COUNT; i++){
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.random() * Math.PI * 2;
  const R = 6 + Math.random() * 4;
  const r = 1.5 + Math.random() * 2.5;
  initPosData[i*4]   = (R + r * Math.cos(theta)) * Math.cos(phi) * (0.6 + Math.random()*0.4);
  initPosData[i*4+1] = r * Math.sin(theta) * 1.8 + (Math.random()-0.5)*2;
  initPosData[i*4+2] = (R + r * Math.cos(theta)) * Math.sin(phi) * (0.6 + Math.random()*0.4);
  initPosData[i*4+3] = 1;
  initVelData[i*4]   = (Math.random()-0.5)*0.01;
  initVelData[i*4+1] = (Math.random()-0.5)*0.01;
  initVelData[i*4+2] = (Math.random()-0.5)*0.01;
  initVelData[i*4+3] = 0;
}

const initPosTex = new THREE.DataTexture(initPosData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
initPosTex.needsUpdate = true;
const initVelTex = new THREE.DataTexture(initVelData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
initVelTex.needsUpdate = true;

// Seed the FBOs
const seedScene = new THREE.Scene();
const seedCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const seedMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const seedQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), seedMat);
seedScene.add(seedQuad);

function seedRT(rt, tex){
  seedMat.uniforms.tex.value = tex;
  renderer.setRenderTarget(rt);
  renderer.render(seedScene, seedCam);
  renderer.setRenderTarget(null);
}
seedRT(rtPos0, initPosTex);
seedRT(rtVel0, initVelTex);

// ─── Simulation shader ───
const simVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`;

const simFrag = `
uniform sampler2D tPos;
uniform sampler2D tVel;
uniform float uTime;
uniform float uDt;
varying vec2 vUv;

// smooth 3D flow field — layered sin/cos, no noise
vec3 flowField(vec3 p, float t){
  float s = 0.12;
  float t2 = t * 0.15;
  vec3 f;
  f.x = sin(p.y*s + t2*1.1) * cos(p.z*s*0.7 + t2*0.8) * 0.8
      + sin(p.z*s*1.3 - t2*0.6) * 0.4;
  f.y = cos(p.x*s*0.9 + t2*0.9) * sin(p.z*s*0.8 - t2*1.2) * 0.6
      + cos(p.x*s*1.1 + p.y*s*0.5 + t2*0.4) * 0.3;
  f.z = sin(p.x*s*1.1 - t2*0.7) * cos(p.y*s*0.6 + t2*1.0) * 0.8
      + sin(p.y*s*0.9 + t2*0.5) * 0.35;
  // secondary slow vortex
  float r = length(p.xz);
  float ang = atan(p.z, p.x);
  f.x += cos(ang + t2*0.3) * 0.25 / (1.0 + r*0.1);
  f.z += -sin(ang + t2*0.3) * 0.25 / (1.0 + r*0.1);
  return f;
}

void main(){
  vec4 pos = texture2D(tPos, vUv);
  vec4 vel = texture2D(tVel, vUv);

  vec3 field = flowField(pos.xyz, uTime);

  // blend velocity toward field
  vec3 newVel = vel.xyz * 0.96 + field * uDt * 0.8;

  // gentle attractor back toward origin to keep form coherent
  float dist = length(pos.xyz);
  vec3 toCenter = -pos.xyz / (dist + 0.1);
  float pull = smoothstep(8.0, 16.0, dist) * 0.3;
  newVel += toCenter * pull * uDt;

  // speed limit
  float spd = length(newVel);
  if(spd > 0.15) newVel = newVel / spd * 0.15;

  vec3 newPos = pos.xyz + newVel * uDt * 60.0;

  gl_FragColor = vec4(newPos, pos.w);
}
`;

const velFrag = `
uniform sampler2D tPos;
uniform sampler2D tVel;
uniform float uTime;
uniform float uDt;
varying vec2 vUv;

vec3 flowField(vec3 p, float t){
  float s = 0.12;
  float t2 = t * 0.15;
  vec3 f;
  f.x = sin(p.y*s + t2*1.1) * cos(p.z*s*0.7 + t2*0.8) * 0.8
      + sin(p.z*s*1.3 - t2*0.6) * 0.4;
  f.y = cos(p.x*s*0.9 + t2*0.9) * sin(p.z*s*0.8 - t2*1.2) * 0.6
      + cos(p.x*s*1.1 + p.y*s*0.5 + t2*0.4) * 0.3;
  f.z = sin(p.x*s*1.1 - t2*0.7) * cos(p.y*s*0.6 + t2*1.0) * 0.8
      + sin(p.y*s*0.9 + t2*0.5) * 0.35;
  float r = length(p.xz);
  float ang = atan(p.z, p.x);
  f.x += cos(ang + t2*0.3) * 0.25 / (1.0 + r*0.1);
  f.z += -sin(ang + t2*0.3) * 0.25 / (1.0 + r*0.1);
  return f;
}

void main(){
  vec4 pos = texture2D(tPos, vUv);
  vec4 vel = texture2D(tVel, vUv);
  vec3 field = flowField(pos.xyz, uTime);
  vec3 newVel = vel.xyz * 0.96 + field * uDt * 0.8;
  float dist = length(pos.xyz);
  vec3 toCenter = -pos.xyz / (dist + 0.1);
  float pull = smoothstep(8.0, 16.0, dist) * 0.3;
  newVel += toCenter * pull * uDt;
  float spd = length(newVel);
  if(spd > 0.15) newVel = newVel / spd * 0.15;
  gl_FragColor = vec4(newVel, 0.0);
}
`;

const simPosMat = new THREE.ShaderMaterial({
  uniforms: { tPos:{value:null}, tVel:{value:null}, uTime:{value:0}, uDt:{value:0.016} },
  vertexShader: simVert, fragmentShader: simFrag
});
const simVelMat = new THREE.ShaderMaterial({
  uniforms: { tPos:{value:null}, tVel:{value:null}, uTime:{value:0}, uDt:{value:0.016} },
  vertexShader: simVert, fragmentShader: velFrag
});
const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), simPosMat);
const simScene = new THREE.Scene();
simScene.add(simQuad);

function simulate(time, dt){
  // Update velocity
  simQuad.material = simVelMat;
  simVelMat.uniforms.tPos.value = rtPos0.texture;
  simVelMat.uniforms.tVel.value = rtVel0.texture;
  simVelMat.uniforms.uTime.value = time;
  simVelMat.uniforms.uDt.value = dt;
  renderer.setRenderTarget(rtVel1);
  renderer.render(simScene, seedCam);

  // Update position
  simQuad.material = simPosMat;
  simPosMat.uniforms.tPos.value = rtPos0.texture;
  simPosMat.uniforms.tVel.value = rtVel1.texture;
  simPosMat.uniforms.uTime.value = time;
  simPosMat.uniforms.uDt.value = dt;
  renderer.setRenderTarget(rtPos1);
  renderer.render(simScene, seedCam);

  renderer.setRenderTarget(null);

  // Swap
  [rtPos0, rtPos1] = [rtPos1, rtPos0];
  [rtVel0, rtVel1] = [rtVel1, rtVel0];
}

// ─── Particle rendering ───
const particleVert = `
uniform sampler2D tPos;
uniform float uSize;
attribute vec2 reference;
varying float vDist;
varying float vSpeed;
uniform sampler2D tVel;

void main(){
  vec4 pos = texture2D(tPos, reference);
  vec4 vel = texture2D(tVel, reference);
  vDist = length(pos.xyz);
  vSpeed = length(vel.xyz);
  vec4 mvPos = modelViewMatrix * vec4(pos.xyz, 1.0);
  gl_PointSize = uSize * (12.0 / -mvPos.z) * (0.5 + vSpeed * 8.0);
  gl_Position = projectionMatrix * mvPos;
}
`;

const particleFrag = `
varying float vDist;
varying float vSpeed;
uniform float uTime;

void main(){
  float d = length(gl_PointCoord - 0.5) * 2.0;
  if(d > 1.0) discard;
  float alpha = (1.0 - d*d) * 0.6;

  // Pearlescent cyan-violet with white-hot core
  float t = vDist * 0.08;
  // cyan: 0.4, 0.9, 1.0 → violet: 0.6, 0.2, 0.9
  vec3 cyan = vec3(0.45, 0.88, 1.0);
  vec3 violet = vec3(0.62, 0.25, 0.92);
  vec3 col = mix(cyan, violet, clamp(t + sin(uTime*0.2 + vDist*0.3)*0.15, 0.0, 1.0));

  // white-hot core for fast / central particles
  float hotness = smoothstep(0.04, 0.14, vSpeed) + smoothstep(5.0, 1.0, vDist) * 0.4;
  col = mix(col, vec3(1.0, 0.97, 0.95), clamp(hotness * 0.7, 0.0, 1.0));

  // additive-style boost
  alpha *= (1.0 + hotness * 0.5);
  alpha *= 0.45;

  gl_FragColor = vec4(col * (0.8 + hotness*0.4), alpha);
}
`;

const refs = new Float32Array(COUNT * 2);
for (let i = 0; i < COUNT; i++){
  refs[i*2]   = (i % SIZE + 0.5) / SIZE;
  refs[i*2+1] = (Math.floor(i / SIZE) + 0.5) / SIZE;
}

const pGeom = new THREE.BufferGeometry();
pGeom.setAttribute('reference', new THREE.BufferAttribute(refs, 2));
// dummy position attribute required by three.js
pGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(COUNT*3), 3));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    tPos: { value: null },
    tVel: { value: null },
    uSize: { value: 2.8 },
    uTime: { value: 0 }
  },
  vertexShader: particleVert,
  fragmentShader: particleFrag,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(pGeom, pMat);
scene.add(particles);

// ─── Atmospheric depth: volumetric fog plane ───
const fogGeo = new THREE.PlaneGeometry(80, 80);
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      float d = length(vUv - 0.5) * 2.0;
      float alpha = (1.0 - smoothstep(0.0, 1.0, d)) * 0.035;
      vec3 col = mix(vec3(0.15, 0.06, 0.25), vec3(0.05, 0.15, 0.22), vUv.y + sin(uTime*0.1)*0.1);
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.position.z = -15;
scene.add(fogPlane);

// ─── Resize ───
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Loop ───
let prevTime = performance.now() * 0.001;
function loop(){
  const now = performance.now() * 0.001;
  const dt = Math.min(now - prevTime, 0.05);
  prevTime = now;

  simulate(now, dt);

  pMat.uniforms.tPos.value = rtPos0.texture;
  pMat.uniforms.tVel.value = rtVel0.texture;
  pMat.uniforms.uTime.value = now;
  fogMat.uniforms.uTime.value = now;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
