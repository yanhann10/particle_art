<title>j8c · Saraceno scan — how to entangle the universe</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">j8c</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.008);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.05, 180);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Deterministic RNG
let rngState = 47219838;
function rng(){ rngState |= 0; rngState = rngState + 0x9e3779b9 | 0;
  let t = Math.imul(rngState ^ rngState >>> 16, 0x21f0aaad);
  t = t + Math.imul(t ^ t >>> 15, 0x735a2d97) ^ t;
  return ((t ^ t >>> 15) >>> 0) / 4294967296;
}

// ── Generate anchor nodes in bounded volume
// Sparse, non-uniform distribution mimicking spider anchor points
const NUM_ANCHORS = 280;
const anchors = [];
const anchorVelocities = [];
const BOUND = { x: 16, y: 12, z: 22 };

// Cluster bias: generate a few dense local clusters
const clusterCenters = [];
for (let i = 0; i < 5; i++){
  clusterCenters.push(new THREE.Vector3(
    (rng()-0.5) * BOUND.x * 0.7,
    (rng()-0.5) * BOUND.y * 0.7,
    (rng()-0.5) * BOUND.z * 0.7
  ));
}

for (let i = 0; i < NUM_ANCHORS; i++){
  let pos;
  if (rng() < 0.6){
    // cluster member
    const center = clusterCenters[Math.floor(rng() * clusterCenters.length)];
    const r = 0.5 + rng() * 2.5;
    const theta = rng() * Math.PI * 2;
    const phi = Math.acos(rng() * 2 - 1);
    pos = new THREE.Vector3(
      center.x + r * Math.sin(phi) * Math.cos(theta),
      center.y + r * Math.sin(phi) * Math.sin(theta),
      center.z + r * Math.cos(phi)
    );
  } else {
    // outlier
    pos = new THREE.Vector3(
      (rng()-0.5) * BOUND.x,
      (rng()-0.5) * BOUND.y,
      (rng()-0.5) * BOUND.z
    );
  }
  anchors.push(pos);
  anchorVelocities.push(new THREE.Vector3(0, 0, 0));
}

// ── Build graph edges: each anchor connects to 2–4 nearest neighbors + occasional long-range
const edges = [];
const visited = new Set();

function edgeKey(a, b){ return a < b ? `${a}_${b}` : `${b}_${a}`; }

for (let i = 0; i < anchors.length; i++){
  const a = anchors[i];
  // Find nearest neighbors
  const neighbors = [];
  for (let j = 0; j < anchors.length; j++){
    if (i === j) continue;
    const dist = a.distanceTo(anchors[j]);
    neighbors.push({ idx: j, dist });
  }
  neighbors.sort((p, q) => p.dist - q.dist);
  
  // Connect to 2–4 nearest with probability
  const numLocal = 2 + Math.floor(rng() * 3);
  for (let k = 0; k < numLocal && k < neighbors.length; k++){
    const j = neighbors[k].idx;
    const key = edgeKey(i, j);
    if (!visited.has(key)){
      edges.push([i, j]);
      visited.add(key);
    }
  }
  
  // 15% chance of long-range connection (guy-line)
  if (rng() < 0.15){
    const far = Math.floor(rng() * anchors.length);
    if (far !== i){
      const key = edgeKey(i, far);
      if (!visited.has(key)){
        edges.push([i, far]);
        visited.add(key);
      }
    }
  }
}

// ── Render edges as luminous filaments
const linePositions = new Float32Array(edges.length * 6);
for (let i = 0; i < edges.length; i++){
  const [ai, bi] = edges[i];
  const a = anchors[ai];
  const b = anchors[bi];
  const idx = i * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
}

const baseLinePositions = new Float32Array(linePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

// Pearlescent metallic thread — faint color shift
const lineMat = new THREE.LineBasicMaterial({
  color: 0xd4dce8,
  transparent: true,
  opacity: 0.28,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const webLines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(webLines);

// ── Render anchor nodes as tiny sprites
const nodeSpriteGeo = new THREE.SphereGeometry(0.03, 6, 4);
const nodeSpriteMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.55,
  fog: true
});

const nodeInstances = new THREE.InstancedMesh(nodeSpriteGeo, nodeSpriteMat, anchors.length);
const dummy = new THREE.Object3D();
for (let i = 0; i < anchors.length; i++){
  dummy.position.copy(anchors[i]);
  dummy.updateMatrix();
  nodeInstances.setMatrixAt(i, dummy.matrix);
}
scene.add(nodeInstances);

// ── Wind field parameters for breathing web
const windField = {
  time: 0,
  strength: 0.006,
  turbulence: 0.003,
  damping: 0.92
};

// ── Camera path: slow stereoscopic dolly through the web
const cameraPath = {
  radius: 14.0,
  height: 1.2,
  speed: 0.012,
  lookAheadDist: 6.0
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  windField.time = elapsed;

  // ── Soft spring + wind perturbation on anchor positions
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i];
    const base = new THREE.Vector3(
      baseLinePositions[edges.findIndex(e => e[0] === i || e[1] === i) * 6],
      baseLinePositions[edges.findIndex(e => e[0] === i || e[1] === i) * 6 + 1],
      baseLinePositions[edges.findIndex(e => e[0] === i || e[1] === i) * 6 + 2]
    );
    
    // Wind force: layered sinusoids
    const wx = Math.sin(elapsed * 0.3 + a.x * 0.1) * windField.strength;
    const wy = Math.cos(elapsed * 0.25 + a.y * 0.12) * windField.strength * 0.7;
    const wz = Math.sin(elapsed * 0.28 + a.z * 0.09) * windField.strength;
    
    // Turbulence: higher-frequency noise-like term
    const tx = Math.sin(elapsed * 1.7 + i * 0.5) * windField.turbulence;
    const ty = Math.cos(elapsed * 1.9 + i * 0.7) * windField.turbulence;
    const tz = Math.sin(elapsed * 2.1 + i * 0.3) * windField.turbulence;
    
    anchorVelocities[i].x += wx + tx;
    anchorVelocities[i].y += wy + ty;
    anchorVelocities[i].z += wz + tz;
    
    anchorVelocities[i].multiplyScalar(windField.damping);
    
    a.add(anchorVelocities[i]);
    
    // Update line positions
    for (let j = 0; j < edges.length; j++){
      if (edges[j][0] === i){
        const idx = j * 6;
        linePositions[idx]   = a.x;
        linePositions[idx+1] = a.y;
        linePositions[idx+2] = a.z;
      }
      if (edges[j][1] === i){
        const idx = j * 6 + 3;
        linePositions[idx]   = a.x;
        linePositions[idx+1] = a.y;
        linePositions[idx+2] = a.z;
      }
    }
    
    // Update node sprite
    dummy.position.copy(a);
    dummy.updateMatrix();
    nodeInstances.setMatrixAt(i, dummy.matrix);
  }
  
  lineGeo.attributes.position.needsUpdate = true;
  nodeInstances.instanceMatrix.needsUpdate = true;

  // ── Camera dolly path — walking through the web
  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  camera.position.set(
    Math.cos(angle) * cr,
    cameraPath.height + Math.sin(elapsed * 0.015) * 2.5,
    Math.sin(angle) * cr
  );
  
  // Look ahead along path
  const lookAngle = angle + 0.4;
  const lookTarget = new THREE.Vector3(
    Math.cos(lookAngle) * cameraPath.lookAheadDist,
    cameraPath.height + Math.sin(elapsed * 0.018 + 1.5) * 1.8,
    Math.sin(lookAngle) * cameraPath.lookAheadDist
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
