<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: calm -->
<title>n87 · tender chair</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">n87</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres × Shiota · light strings on empty chair · differential growth</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* An empty chair draped in warm light strings —
   Gonzalez-Torres' incandescent intimacy meets Shiota's
   domestic-object-as-vessel. The strings grow differentially,
   pulled by gravity, anchored at the chair's silhouette.
   The chair is absence made visible; the lights are
   what remains when someone has left the room. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(3.5, 2.8, 6.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0.8, 0);

// --- chair loading with fallback ---
let chairMesh = null;
let chairBBox = new THREE.Box3(
  new THREE.Vector3(-0.4, 0, -0.4),
  new THREE.Vector3(0.4, 1.6, 0.4)
);
let chairCenter = new THREE.Vector3(0, 0.8, 0);
let chairSurfacePoints = [];

// fallback: a simple box chair silhouette
function createFallbackChair() {
  const g = new THREE.Group();
  const seatG = new THREE.BoxGeometry(0.8, 0.06, 0.8);
  const backG = new THREE.BoxGeometry(0.8, 0.9, 0.06);
  const legG  = new THREE.BoxGeometry(0.06, 0.7, 0.06);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x1a1612, transparent: true, opacity: 0.25, wireframe: true
  });
  const seat = new THREE.Mesh(seatG, mat); seat.position.set(0, 0.7, 0);
  const back = new THREE.Mesh(backG, mat); back.position.set(0, 1.18, -0.37);
  const positions = [[-0.34,0.35,-0.34],[0.34,0.35,-0.34],[-0.34,0.35,0.34],[0.34,0.35,0.34]];
  g.add(seat, back);
  for (const p of positions) {
    const leg = new THREE.Mesh(legG, mat);
    leg.position.set(p[0], p[1], p[2]);
    g.add(leg);
  }
  return g;
}

function sampleMeshSurface(mesh, count) {
  const pts = [];
  mesh.traverse(child => {
    if (!child.isMesh) return;
    const geo = child.geometry;
    const pos = geo.attributes.position;
    const idx = geo.index;
    child.updateMatrixWorld();
    const m = child.matrixWorld;
    const triCount = idx ? idx.count / 3 : pos.count / 3;
    for (let i = 0; i < count && pts.length < count; i++) {
      const tri = Math.floor(Math.random() * triCount);
      const i0 = idx ? idx.getX(tri*3) : tri*3;
      const i1 = idx ? idx.getX(tri*3+1) : tri*3+1;
      const i2 = idx ? idx.getX(tri*3+2) : tri*3+2;
      const a = new THREE.Vector3().fromBufferAttribute(pos, i0).applyMatrix4(m);
      const b = new THREE.Vector3().fromBufferAttribute(pos, i1).applyMatrix4(m);
      const c = new THREE.Vector3().fromBufferAttribute(pos, i2).applyMatrix4(m);
      let u = Math.random(), v = Math.random();
      if (u + v > 1) { u = 1 - u; v = 1 - v; }
      pts.push(new THREE.Vector3().addScaledVector(a, 1-u-v).addScaledVector(b, u).addScaledVector(c, v));
    }
  });
  return pts;
}

function sampleFallbackSurface(count) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const r = Math.random();
    if (r < 0.3) { // seat top
      pts.push(new THREE.Vector3((Math.random()-0.5)*0.8, 0.73, (Math.random()-0.5)*0.8));
    } else if (r < 0.5) { // back
      pts.push(new THREE.Vector3((Math.random()-0.5)*0.8, 0.73+Math.random()*0.9, -0.37));
    } else { // legs
      const lx = Math.random() > 0.5 ? 0.34 : -0.34;
      const lz = Math.random() > 0.5 ? 0.34 : -0.34;
      pts.push(new THREE.Vector3(lx, Math.random()*0.7, lz));
    }
  }
  return pts;
}

const fallback = createFallbackChair();
scene.add(fallback);
chairSurfacePoints = sampleFallbackSurface(200);

const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb',
  (gltf) => {
    scene.remove(fallback);
    const model = gltf.scene;
    // make the chair ghostly, translucent
    model.traverse(child => {
      if (child.isMesh) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0x1a1612,
          transparent: true,
          opacity: 0.18,
          roughness: 0.9,
          metalness: 0.0,
          emissive: 0x0d0a08,
          emissiveIntensity: 0.3,
          side: THREE.DoubleSide
        });
      }
    });
    // fit chair: compute bbox, scale to ~1.6 units tall
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 1.6 / maxDim;
    model.scale.setScalar(scale);
    // recompute after scale
    const box2 = new THREE.Box3().setFromObject(model);
    const center = box2.getCenter(new THREE.Vector3());
    model.position.sub(new THREE.Vector3(center.x, box2.min.y, center.z));
    scene.add(model);
    chairMesh = model;
    // recompute bbox
    chairBBox = new THREE.Box3().setFromObject(model);
    chairCenter = chairBBox.getCenter(new THREE.Vector3());
    chairSurfacePoints = sampleMeshSurface(model, 200);
  },
  undefined,
  () => { /* keep fallback */ }
);

// subtle warm point light near the chair
const warmLight = new THREE.PointLight(0xffc878, 0.4, 12);
warmLight.position.set(0.5, 2.5, 1.0);
scene.add(warmLight);
const ambLight = new THREE.AmbientLight(0x0d0a08, 0.15);
scene.add(ambLight);

// --- differential growth strings that drape over the chair ---
const MAX_VERTS = 2800;
const ATTRACT   = 0.045;
const REPEL_R   = 0.42;
const REPEL_STR = 0.09;
const NOISE     = 0.0018;
const PRESSURE  = 0.0015;
const GRAVITY   = 0.007;
const MAX_D     = 0.34;
const N_STRINGS = 4; // multiple strings draped at different angles

const strings = [];
for (let s = 0; s < N_STRINGS; s++) {
  const verts = [];
  const NV0 = 30;
  const angle = (s / N_STRINGS) * Math.PI * 2;
  const radius = 1.2;
  for (let i = 0; i < NV0; i++) {
    const t = (i / (NV0 - 1)) * 2 - 1;
    // drape from above the chair, arcing over it
    const x = Math.cos(angle) * t * radius * 1.8 + Math.sin(angle) * 0.1;
    const z = Math.sin(angle) * t * radius * 1.8 - Math.cos(angle) * 0.1;
    const y = 2.2 - Math.abs(t) * 0.8 + Math.sin(t * Math.PI) * 0.3;
    const pinY = i < 3 || i >= NV0 - 3;
    verts.push({ x, z, y, age: 0, pinY });
  }
  strings.push(verts);
}

// spatial hash
const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return (x|0) + ',' + (z|0); }
function rebuildGrid(verts) {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const kx = Math.floor(v.x / CELL), kz = Math.floor(v.z / CELL);
    const k = kx + ',' + kz;
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', e => {
  if (e.target.tagName === 'CANVAS') paused = !paused;
});

// chair surface attraction: gently pull nearby vertices toward chair surface
function chairAttract(v, strength) {
  if (chairSurfacePoints.length === 0) return { x: 0, y: 0, z: 0 };
  let closest = null, minD2 = Infinity;
  // sample a few random surface points for efficiency
  for (let i = 0; i < 20; i++) {
    const sp = chairSurfacePoints[Math.floor(Math.random() * chairSurfacePoints.length)];
    const d2 = (v.x-sp.x)**2 + (v.y-sp.y)**2 + (v.z-sp.z)**2;
    if (d2 < minD2) { minD2 = d2; closest = sp; }
  }
  const d = Math.sqrt(minD2);
  if (d > 2.5 || d < 0.05) return { x: 0, y: 0, z: 0 };
  // gentle attraction that fades with distance
  const f = strength * Math.exp(-d * 1.5);
  return {
    x: (closest.x - v.x) * f,
    y: (closest.y - v.y) * f * 0.3,
    z: (closest.z - v.z) * f
  };
}

function stepString(verts) {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS / N_STRINGS) return;
  rebuildGrid(verts);
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
    // chair surface attraction
    const ca = chairAttract(v, 0.012);
    dx[i] += ca.x; dy[i] += ca.y; dz[i] += ca.z;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.04 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0003;
  }
  const grown = [];
  const maxPerString = MAX_VERTS / N_STRINGS;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex*ex + ez*ez + ey*ey > MAX_D * MAX_D && verts.length + grown.length < maxPerString) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- rendering: warm incandescent bulb particles ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge   = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.032 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float uFogDensity;

    void main() {
      vec3 p = position;
      float t = uTime * 0.25 + seed * 6.28;
      float sway = sin(t) * 0.006 * (1.0 + seed);
      p.x += sway;
      p.z += cos(t * 0.7) * 0.004;

      float pulse = 0.82 + 0.18 * sin(uTime * 0.9 + seed * 40.0);

      // palette: warm filament → soft peach → gentle white
      vec3 amber  = vec3(1.0, 0.70, 0.30);
      vec3 peach  = vec3(1.0, 0.84, 0.65);
      vec3 cream  = vec3(1.0, 0.94, 0.88);
      float k = clamp(age * 1.3, 0.0, 1.0);
      vCol = mix(amber, peach, k);
      vCol = mix(vCol, cream, smoothstep(0.6, 1.0, k) * 0.35);
      vCol *= pulse;

      vAlpha = 0.5 + 0.22 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.6 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 26.0);
      float halo = exp(-r * 7.0) * 0.3;
      float a = (core + halo) * vAlpha;
      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// faint wires for each string
const wireLines = [];
for (let s = 0; s < N_STRINGS; s++) {
  const wg = new THREE.BufferGeometry();
  const wp = new Float32Array((MAX_VERTS / N_STRINGS) * 3);
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  const wm = new THREE.LineBasicMaterial({
    color: 0x2a2018, transparent: true, opacity: 0.22
  });
  const wl = new THREE.Line(wg, wm);
  scene.add(wl);
  wireLines.push({ geom: wg, positions: wp });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 400; s++) {
  for (const sv of strings) stepString(sv);
}

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 2; s++) {
    for (const sv of strings) stepString(sv);
  }

  // total vertex count
  let totalVerts = 0;
  for (const sv of strings) totalVerts += sv.length;

  // update wires
  for (let s = 0; s < N_STRINGS; s++) {
    const sv = strings[s];
    const wp = wireLines[s].positions;
    for (let i = 0; i < sv.length; i++) {
      wp[i*3] = sv[i].x; wp[i*3+1] = sv[i].y; wp[i*3+2] = sv[i].z;
    }
    wireLines[s].geom.setDrawRange(0, sv.length);
    wireLines[s].geom.attributes.position.needsUpdate = true;
  }

  // camera tracks centroid gently
  let cx = 0, cy = 0, cz = 0;
  for (const sv of strings) for (const v of sv) { cx += v.x; cy += v.y; cz += v.z; }
  cx /= totalVerts; cy /= totalVerts; cz /= totalVerts;
  // blend toward chair center
  const tx = cx * 0.4 + chairCenter.x * 0.6;
  const ty = cy * 0.4 + chairCenter.y * 0.6;
  const tz = cz * 0.4 + chairCenter.z * 0.6;
  controls.target.lerp(new THREE.Vector3(tx, ty, tz), 0.015);

  // distribute particles across all strings
  const allSegments = [];
  let totalLen = 0;
  for (const sv of strings) {
    for (let i = 0; i < sv.length - 1; i++) {
      const a = sv[i], b = sv[i+1];
      const L = Math.sqrt((b.x-a.x)**2 + (b.z-a.z)**2 + (b.y-a.y)**2);
      allSegments.push({ a, b, L });
      totalLen += L;
    }
  }

  if (totalLen > 0) {
    let written = 0;
    for (let si = 0; si < allSegments.length; si++) {
      const seg = allSegments[si];
      const share = (si === allSegments.length - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * seg.L / totalLen));
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1-u) * (1-u) * 2;
        const spread = 0.013;
        rPos[written*3]   = seg.a.x + (seg.b.x - seg.a.x) * cu + (Math.random()-0.5) * spread;
        rPos[written*3+1] = seg.a.y + (seg.b.y - seg.a.y) * cu + (Math.random()-0.5) * spread * 0.5;
        rPos[written*3+2] = seg.a.z + (seg.b.z - seg.a.z) * cu + (Math.random()-0.5) * spread;
        rAge[written] = Math.max(seg.a.age, seg.b.age);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
  }

  statEl.textContent = `vertices=${totalVerts}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
