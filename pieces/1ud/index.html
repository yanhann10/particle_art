<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1ud · tidal ink · brushstroke driven by tide height</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .data { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; line-height: 1.5; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">1ud · tidal ink · brushstroke driven by tide height</div>
<div class="data" id="dataDisplay">fetching tide data...</div>
<div class="src">descended from 2iy · NOAA tide station 8518750 · The Battery, NY</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Fetch real-time tide height from NOAA API (The Battery, NYC station 8518750).
// Map tide data to ink parameters:
//   - tide height → vertical rise rate (high tide = faster climb)
//   - tide velocity → repulsion strength (strong flow = more chaotic growth)
//   - time-to-high-tide → hue shift in ink (approaching high = warmer)
// Update every 30s. The brushstroke becomes a living recorder of oceanic rhythm.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.014);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── tide data state
let tideHeight = 0.0;      // meters relative to MLLW
let tideVelocity = 0.0;    // meters/sec
let nextHighTime = null;
let lastFetch = 0;
const FETCH_INTERVAL = 30000;

async function fetchTideData(){
  try {
    const now = new Date();
    const dateStr = now.toISOString().split('T')[0].replace(/-/g, '');
    // NOAA CO-OPS API: 6-minute water level + predictions
    const url = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?date=latest&station=8518750&product=water_level&datum=MLLW&units=metric&time_zone=gmt&format=json`;
    const predUrl = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?begin_date=${dateStr}&range=24&station=8518750&product=predictions&datum=MLLW&units=metric&time_zone=gmt&format=json&interval=hilo`;
    
    const [levelResp, predResp] = await Promise.all([fetch(url), fetch(predUrl)]);
    const levelData = await levelResp.json();
    const predData = await predResp.json();
    
    if (levelData.data && levelData.data.length > 0){
      const latest = levelData.data[levelData.data.length - 1];
      tideHeight = parseFloat(latest.v);
      // velocity proxy: height difference over 6 minutes
      if (levelData.data.length > 1){
        const prev = levelData.data[levelData.data.length - 2];
        const dt = (new Date(latest.t) - new Date(prev.t)) / 1000; // seconds
        tideVelocity = (parseFloat(latest.v) - parseFloat(prev.v)) / dt;
      }
    }
    
    if (predData.predictions){
      const highs = predData.predictions.filter(p => p.type === 'H');
      if (highs.length > 0){
        const upcoming = highs.find(h => new Date(h.t) > now);
        if (upcoming) nextHighTime = new Date(upcoming.t);
      }
    }
    
    updateDataDisplay();
  } catch (err){
    console.warn('Tide fetch failed, using fallback:', err);
    // fallback: synthetic sine wave
    const t = Date.now() / 60000; // minutes
    tideHeight = 1.2 + 0.8 * Math.sin(t * Math.PI / 360); // ~12h period
    tideVelocity = 0.8 * Math.cos(t * Math.PI / 360) * (Math.PI / 360) / 60;
    updateDataDisplay();
  }
}

function updateDataDisplay(){
  const el = document.getElementById('dataDisplay');
  let hoursToHigh = '—';
  if (nextHighTime){
    const mins = (nextHighTime - new Date()) / 60000;
    hoursToHigh = `${(mins / 60).toFixed(1)}h`;
  }
  el.innerHTML = `tide height: ${tideHeight.toFixed(2)}m<br>velocity: ${(tideVelocity * 100).toFixed(1)} cm/s<br>next high: ${hoursToHigh}`;
}

fetchTideData();
setInterval(fetchTideData, FETCH_INTERVAL);

// ─────────── differential growth (tide-modulated)
const MAX_VERTS = 1800;
let ATTRACT   = 0.06;
let REPEL_R   = 0.46;
let REPEL_STR = 0.13;
const NOISE     = 0.003;
let RISE      = 0.0042;
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  
  // modulate growth parameters from tide data
  // high tide → faster rise, calmer repulsion
  // low tide → slower rise, stronger turbulence
  const heightNorm = Math.max(0, Math.min(1, tideHeight / 2.5)); // normalize to ~0–1
  RISE = 0.003 + 0.005 * heightNorm;
  REPEL_STR = 0.10 + 0.08 * Math.abs(tideVelocity) * 50; // velocity drives chaos
  
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  const PRESSURE = 0.0028 * (0.7 + 0.6 * heightNorm);
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

for (let s = 0; s < 700; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── ink-tube renderer (tide-modulated color)
let tubeMesh = null;
const tubeMat = new THREE.MeshBasicMaterial({
  color: 0xe8dcc0,
  transparent: true,
  opacity: 0.88,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  for (let s = 0; s < 2; s++) step();

  // tide-driven ink color: cooler (blue-gray) at low tide, warmer (sepia) approaching high
  let hueShift = 0.5; // default mid
  if (nextHighTime){
    const minsToHigh = (nextHighTime - new Date()) / 60000;
    hueShift = Math.max(0, Math.min(1, 1 - minsToHigh / 360)); // 0=far, 1=near high
  }
  const baseColor = new THREE.Color(0x5a6a7a).lerp(new THREE.Color(0xe8dcc0), hueShift);
  tubeMat.color.copy(baseColor);

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const radiiList = new Array(N_SAMPLES);
    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const dt = 1 / N_SAMPLES;
      const t1 = curve.getTangent((t - dt + 1) % 1);
      const t2 = curve.getTangent(t);
      const t3 = curve.getTangent((t + dt) % 1);
      const cosAB = t1.dot(t2);
      const cosBC = t2.dot(t3);
      const curvature = (2 - cosAB - cosBC) * 0.5;
      const pressure = Math.min(1.0, curvature * 8);
      // tide velocity modulates base thickness: faster flow = thinner ink line
      const baseThickness = 0.018 * (1.2 - Math.abs(tideVelocity) * 20);
      const r = baseThickness + 0.10 * pressure;
      radiiList[i] = r;
    }

    const RADIAL = 6;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      const r = radiiList[i];
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i * RADIAL + j) * 3]     = v.x;
        positions[(i * RADIAL + j) * 3 + 1] = v.y;
        positions[(i * RADIAL + j) * 3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
