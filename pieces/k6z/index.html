<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: surge, intensity: gentle -->
<title>k6z · vascular tower · naïve imperfection</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0907; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">k6z</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Naïve-painting mutation of t9w's vascular tower.
// Inspired by the 2025-2026 "anti-polish" counter-trend (cf. Genieve Figgis,
// Flora Yukhnovich's smeared baroque) — deliberate imperfection layered on
// differential growth. Mark-making via oversized daub-spheres, wobbly tube
// radii, asymmetric seeding, per-vertex jitter, and scratchy sketch lines.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0907, 0.032);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 9, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0907, 1);
document.body.appendChild(renderer.domElement);

// Warm, slightly off-axis key light — like a desk lamp in a studio
const lightKey = new THREE.DirectionalLight(0xffe4c8, 0.85);
lightKey.position.set(4, 12, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x1a0e12, 0.7));
const lightRim = new THREE.DirectionalLight(0x7799bb, 0.3);
lightRim.position.set(-6, 2, -4);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── seeded RNG for reproducible "hand"
let _seed = 7319;
function srand(){ _seed = (_seed * 16807 + 11) % 2147483647; return (_seed & 0x7fffffff) / 0x7fffffff; }

// ─────────── differential growth (3D) — ASYMMETRIC seed
const MAX_VERTS = 1400;
const ATTRACT   = 0.058;
const REPEL_R   = 0.52;
const REPEL_STR = 0.12;
const NOISE     = 0.004;
const PRESSURE  = 0.003;
const RISE      = 0.005;
const MAX_D     = 0.42;

const verts = [];
// Deliberately lopsided initial ring — more points on one side
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  // Asymmetry: radius varies 1.0–1.8, not centered
  const r = 1.2 + 0.6 * Math.sin(th * 1.3 + 0.7) + (srand() - 0.5) * 0.3;
  const offX = 0.15; // off-center
  verts.push({ x: Math.cos(th)*r + offX, y: 0, z: Math.sin(th)*r - 0.1, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function getNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of getNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for (let i=0;i<n;i++){
    const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    // Heavier noise — hand-tremor
    verts[i].x += dx[i] + (srand()-0.5)*NOISE*1.8;
    verts[i].y += dy[i] + (srand()-0.5)*NOISE*0.7 + upward;
    verts[i].z += dz[i] + (srand()-0.5)*NOISE*1.8;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5 + (srand()-0.5)*0.06,
        y:(a.y+b.y)*0.5 - 0.04,
        z:(a.z+b.z)*0.5 + (srand()-0.5)*0.06,
        age: Math.max(a.age,b.age)*0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s=0;s<580;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

// ─────────── palette: 4 hand-picked colors — arterial, venous, ochre, bone
const PAL = [0xb04438, 0x8a2a3a, 0xc47a3c, 0xd4c4a8];

// ─────────── per-vertex jitter table (stable across frames)
const jitterMap = new Float32Array(MAX_VERTS * 3);
for (let i=0; i<jitterMap.length; i++) jitterMap[i] = (srand()-0.5);

// ─────────── "daub" marks — oversized spheres at random vertices
const daubGroup = new THREE.Group();
scene.add(daubGroup);
const daubGeo = new THREE.IcosahedronGeometry(1, 1); // low-poly on purpose
const daubCount = 18;
const daubIndices = [];
for (let i=0;i<daubCount;i++) daubIndices.push(Math.floor(srand()*verts.length));
const daubs = [];
for (let i=0;i<daubCount;i++){
  const col = PAL[Math.floor(srand()*PAL.length)];
  const mat = new THREE.MeshStandardMaterial({
    color: col, roughness: 0.7+srand()*0.3, metalness: 0.0,
    emissive: col, emissiveIntensity: 0.08
  });
  const m = new THREE.Mesh(daubGeo, mat);
  // Deliberately varied sizes — some big "brushstrokes", some small
  const sc = 0.12 + srand()*0.35;
  m.scale.set(sc, sc*(0.6+srand()*0.8), sc);
  // Random rotation — not aligned
  m.rotation.set(srand()*Math.PI, srand()*Math.PI, srand()*Math.PI);
  daubGroup.add(m);
  daubs.push(m);
}

// ─────────── sketch lines — scratchy strokes along the form
const sketchMat = new THREE.LineBasicMaterial({
  color: 0x3a2220, transparent: true, opacity: 0.35
});
let sketchLines = null;

// ─────────── tube renderer with imperfection
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xb04438, emissive: 0x200606,
  roughness: 0.55, metalness: 0.03,
  flatShading: true // faceted = hand-carved feel
});

let tubeMesh = null;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now()-start)/1000;
  for (let s=0;s<2;s++) step();

  if (verts.length > 10){
    let yMin=Infinity, yMax=-Infinity;
    for (const v of verts){ if(v.y<yMin)yMin=v.y; if(v.y>yMax)yMax=v.y; }
    const yRange = Math.max(yMax-yMin,0.1);

    // Apply 8-12% positional jitter per vertex (stable per-vertex, wobbles gently)
    const pts = verts.map((v,i)=>{
      const jx = jitterMap[(i*3)%jitterMap.length];
      const jy = jitterMap[(i*3+1)%jitterMap.length];
      const jz = jitterMap[(i*3+2)%jitterMap.length];
      const jitterAmt = 0.08 + 0.04 * Math.sin(t*0.3 + i*0.7); // 8-12%
      return new THREE.Vector3(
        v.x + jx * jitterAmt * 2.0,
        v.y + jy * jitterAmt * 1.2,
        v.z + jz * jitterAmt * 2.0
      );
    });
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.4);

    const N_SAMPLES = Math.min(600, verts.length*2);
    const RADIAL = 7; // odd number = no perfect symmetry
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const colors = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0,1,0);
    // Irregular pulse — not a clean sine
    const pulse = 1.0 + 0.08*Math.sin(t*1.6) + 0.04*Math.sin(t*3.7+1.2);
    const tmpCol = new THREE.Color();

    for (let i=0;i<N_SAMPLES;i++){
      const tt = i/N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0,Math.min(1,(p.y-yMin)/yRange));

      // Taper with wobble — hand-drawn radius variation
      let r = 0.38*(1 - heightFrac*0.75);
      // Per-ring jitter: ±10% radius variation
      const ringJitter = 1.0 + (jitterMap[(i*7)%jitterMap.length])*0.10;
      r *= ringJitter;
      // Vessel nodes — irregular spacing
      const node = Math.sin(tt*19.0 + 2.3)*0.5+0.5;
      r *= (1.0 + 0.22*Math.pow(node,5));
      // Occasional thick "brushstroke" bulge
      const bulge = Math.sin(tt*67.0)*0.5+0.5;
      if (bulge > 0.92) r *= 1.4;
      r *= pulse;

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent,up).normalize();
      if (normal.lengthSq()<0.001) normal.set(1,0,0);
      const binormal = new THREE.Vector3().crossVectors(tangent,normal).normalize();

      // Pick color based on height — warm ochre at base, deep red middle, bone at tips
      const hf = heightFrac;
      if (hf < 0.3) tmpCol.setHex(0xc47a3c).lerp(new THREE.Color(0xb04438), hf/0.3);
      else if (hf < 0.7) tmpCol.setHex(0xb04438).lerp(new THREE.Color(0x8a2a3a), (hf-0.3)/0.4);
      else tmpCol.setHex(0x8a2a3a).lerp(new THREE.Color(0xd4c4a8), (hf-0.7)/0.3);
      // Per-ring color jitter
      const cj = jitterMap[(i*5+2)%jitterMap.length]*0.06;
      tmpCol.r = Math.max(0,Math.min(1,tmpCol.r+cj));
      tmpCol.g = Math.max(0,Math.min(1,tmpCol.g+cj*0.5));

      for (let j=0;j<RADIAL;j++){
        const ang = (j/RADIAL)*Math.PI*2;
        // Per-vertex radial jitter — wobbly cross-section
        const rj = r * (1.0 + jitterMap[((i*RADIAL+j)*3)%jitterMap.length]*0.12);
        const vv = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang)*rj)
          .add(binormal.clone().multiplyScalar(Math.sin(ang)*rj))
          .add(p);
        const idx = (i*RADIAL+j)*3;
        positions[idx]=vv.x; positions[idx+1]=vv.y; positions[idx+2]=vv.z;
        colors[idx]=tmpCol.r; colors[idx+1]=tmpCol.g; colors[idx+2]=tmpCol.b;
      }
    }
    for (let i=0;i<N_SAMPLES;i++){
      const ni=(i+1)%N_SAMPLES;
      for (let j=0;j<RADIAL;j++){
        const nj=(j+1)%RADIAL;
        const a=i*RADIAL+j, b=i*RADIAL+nj, c=ni*RADIAL+j, d=ni*RADIAL+nj;
        indices.push(a,b,c); indices.push(b,d,c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    g.setAttribute('color', new THREE.BufferAttribute(colors,3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    const mat = tubeMat.clone();
    mat.vertexColors = true;
    tubeMesh = new THREE.Mesh(g, mat);
    scene.add(tubeMesh);

    // Update daub positions
    for (let i=0;i<daubCount;i++){
      const vi = daubIndices[i] % verts.length;
      const v = verts[vi];
      daubs[i].position.set(
        v.x + jitterMap[(vi*3)%jitterMap.length]*0.15,
        v.y + jitterMap[(vi*3+1)%jitterMap.length]*0.1,
        v.z + jitterMap[(vi*3+2)%jitterMap.length]*0.15
      );
    }

    // Sketch lines — re-draw every ~30 frames for performance
    if (Math.floor(t*30)%15===0 || !sketchLines){
      if (sketchLines){ scene.remove(sketchLines); sketchLines.geometry.dispose(); }
      const skPts = [];
      const stride = Math.max(3, Math.floor(verts.length/60));
      for (let i=0;i<verts.length;i+=stride){
        const v = verts[i];
        const next = verts[(i+stride)%verts.length];
        // Scratchy offset lines beside the main form
        const offX = (srand()-0.5)*0.6;
        const offZ = (srand()-0.5)*0.6;
        skPts.push(new THREE.Vector3(v.x+offX, v.y+0.05, v.z+offZ));
        skPts.push(new THREE.Vector3(
          next.x+offX*0.7+(srand()-0.5)*0.2,
          next.y+0.05,
          next.z+offZ*0.7+(srand()-0.5)*0.2
        ));
      }
      const skGeo = new THREE.BufferGeometry().setFromPoints(skPts);
      sketchLines = new THREE.LineSegments(skGeo, sketchMat);
      scene.add(sketchLines);
    }
  }

  // Camera follows centroid — slightly off-center (painter framing)
  let yMean=0,xMean=0;
  for (const v of verts){ yMean+=v.y; xMean+=v.x; }
  yMean /= Math.max(verts.length,1);
  xMean /= Math.max(verts.length,1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y)*0.035;
  controls.target.x += (xMean*0.3 - controls.target.x)*0.02; // off-center drift
  camera.position.y += (targetY+4 - camera.position.y)*0.035;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
