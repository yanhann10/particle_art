<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mrx · physarum network · slime-mold agents</title>
<!-- MOTION: crawl, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">mrx</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Sage Jenson (mxsage) physarum slime-mold simulation — agents deposit
// pheromone, sense ahead-left/center/right, steer toward strongest signal.
// Feedback texture with diffusion+decay gives organic neural webs on midnight.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080d);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const W = 1024, H = 1024;
const N_AGENTS = 18000;

// Agent state CPU-side
const agents = new Float32Array(N_AGENTS * 4); // x, y, angle, species
for (let i = 0; i < N_AGENTS; i++){
  const th = Math.random() * Math.PI * 2;
  const r = 0.18 + Math.random() * 0.06;
  agents[i*4]   = 0.5 + Math.cos(th) * r;
  agents[i*4+1] = 0.5 + Math.sin(th) * r;
  agents[i*4+2] = Math.random() * Math.PI * 2;
  agents[i*4+3] = Math.floor(Math.random() * 3); // 3 species for color
}

// Ping-pong render targets for pheromone field
const rtA = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType
});
const rtB = rtA.clone();
let trailRead = rtA, trailWrite = rtB;

// ─────────── deposit shader: agents write small blobs into trail texture
const depositGeo = new THREE.BufferGeometry();
const depositPos = new Float32Array(N_AGENTS * 3);
const depositColor = new Float32Array(N_AGENTS * 3);
for (let i = 0; i < N_AGENTS; i++){
  depositPos[i*3]   = agents[i*4];
  depositPos[i*3+1] = agents[i*4+1];
  depositPos[i*3+2] = 0;
  const sp = agents[i*4+3];
  if (sp === 0){ depositColor[i*3] = 0.7; depositColor[i*3+1] = 0.4; depositColor[i*3+2] = 0.1; }
  else if (sp === 1){ depositColor[i*3] = 0.1; depositColor[i*3+1] = 0.6; depositColor[i*3+2] = 0.7; }
  else { depositColor[i*3] = 0.7; depositColor[i*3+1] = 0.2; depositColor[i*3+2] = 0.5; }
}
depositGeo.setAttribute('position', new THREE.BufferAttribute(depositPos, 3));
depositGeo.setAttribute('color', new THREE.BufferAttribute(depositColor, 3));

const depositMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute vec3 color;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec2 uv = position.xy * 2.0 - 1.0;
      gl_Position = vec4(uv, 0.0, 1.0);
      gl_PointSize = 3.2;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = 0.14 * (1.0 - d*2.0);
      gl_FragColor = vec4(vColor * alpha, 1.0);
    }
  `,
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false,
  transparent: true
});
const depositPoints = new THREE.Points(depositGeo, depositMat);
const depositScene = new THREE.Scene();
depositScene.add(depositPoints);

// ─────────── diffusion/decay shader: blur + fade the pheromone field
const diffuseMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null },
    uRes: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform vec2 uRes;
    varying vec2 vUv;
    void main(){
      vec2 px = 1.0 / uRes;
      vec3 sum = texture2D(tTrail, vUv).rgb;
      sum += texture2D(tTrail, vUv + vec2(px.x, 0)).rgb;
      sum += texture2D(tTrail, vUv - vec2(px.x, 0)).rgb;
      sum += texture2D(tTrail, vUv + vec2(0, px.y)).rgb;
      sum += texture2D(tTrail, vUv - vec2(0, px.y)).rgb;
      sum += texture2D(tTrail, vUv + vec2(px.x, px.y)).rgb;
      sum += texture2D(tTrail, vUv - vec2(px.x, px.y)).rgb;
      sum += texture2D(tTrail, vUv + vec2(-px.x, px.y)).rgb;
      sum += texture2D(tTrail, vUv + vec2(px.x, -px.y)).rgb;
      vec3 avg = sum / 9.0;
      avg *= 0.92; // decay
      gl_FragColor = vec4(avg, 1.0);
    }
  `,
  depthTest: false,
  depthWrite: false
});
const diffuseQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), diffuseMat);
const diffuseScene = new THREE.Scene();
diffuseScene.add(diffuseQuad);
const diffuseCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ─────────── display shader: render trail to screen with color grading
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    tTrail: { value: null }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    varying vec2 vUv;
    void main(){
      vec3 col = texture2D(tTrail, vUv).rgb;
      col = pow(col, vec3(1.3)); // darken base
      col = col * 2.8; // amplify bright trails
      col = mix(col, vec3(0.95, 0.88, 0.75), 0.05); // slight warm tint
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  depthTest: false,
  depthWrite: false
});
const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
scene.add(displayQuad);

// ─────────── agent step logic (CPU-side)
const SENSOR_ANGLE = 0.36;   // radians offset for left/right sensors
const SENSOR_DIST  = 0.007;  // distance ahead to sense
const TURN_SPEED   = 0.12;   // radians per frame
const STEP_SIZE    = 0.0012; // movement per frame

const trailData = new Uint8Array(W * H * 4);
function sampleTrail(x, y, species){
  const ix = Math.floor(x * W), iy = Math.floor(y * H);
  if (ix < 0 || ix >= W || iy < 0 || iy >= H) return 0;
  const idx = (iy * W + ix) * 4;
  return trailData[idx + Math.floor(species)] / 255;
}

function stepAgents(){
  // Read current trail texture to CPU for sensing
  renderer.readRenderTargetPixels(trailRead, 0, 0, W, H, trailData);

  for (let i = 0; i < N_AGENTS; i++){
    const idx = i * 4;
    let x = agents[idx], y = agents[idx+1], angle = agents[idx+2];
    const species = agents[idx+3];

    // Sense ahead-left, ahead, ahead-right
    const aL = angle - SENSOR_ANGLE;
    const aC = angle;
    const aR = angle + SENSOR_ANGLE;
    const xL = x + Math.cos(aL) * SENSOR_DIST;
    const yL = y + Math.sin(aL) * SENSOR_DIST;
    const xC = x + Math.cos(aC) * SENSOR_DIST;
    const yC = y + Math.sin(aC) * SENSOR_DIST;
    const xR = x + Math.cos(aR) * SENSOR_DIST;
    const yR = y + Math.sin(aR) * SENSOR_DIST;

    const sL = sampleTrail(xL, yL, species);
    const sC = sampleTrail(xC, yC, species);
    const sR = sampleTrail(xR, yR, species);

    // Steer toward strongest signal
    if (sC > sL && sC > sR){
      // continue straight
    } else if (sL > sR){
      angle -= TURN_SPEED * (0.7 + Math.random() * 0.6);
    } else if (sR > sL){
      angle += TURN_SPEED * (0.7 + Math.random() * 0.6);
    } else {
      // equal: random turn
      angle += (Math.random() - 0.5) * TURN_SPEED * 2;
    }

    // Move forward
    x += Math.cos(angle) * STEP_SIZE;
    y += Math.sin(angle) * STEP_SIZE;

    // Boundary bounce
    if (x < 0.01){ x = 0.01; angle = Math.PI - angle + (Math.random()-0.5)*0.3; }
    if (x > 0.99){ x = 0.99; angle = Math.PI - angle + (Math.random()-0.5)*0.3; }
    if (y < 0.01){ y = 0.01; angle = -angle + (Math.random()-0.5)*0.3; }
    if (y > 0.99){ y = 0.99; angle = -angle + (Math.random()-0.5)*0.3; }

    agents[idx]   = x;
    agents[idx+1] = y;
    agents[idx+2] = angle;
  }

  // Update GPU buffer
  for (let i = 0; i < N_AGENTS; i++){
    depositPos[i*3]   = agents[i*4];
    depositPos[i*3+1] = agents[i*4+1];
  }
  depositGeo.attributes.position.needsUpdate = true;
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  stepAgents();

  // Deposit pheromone
  renderer.setRenderTarget(trailWrite);
  renderer.render(depositScene, camera);

  // Diffuse + decay
  diffuseMat.uniforms.tTrail.value = trailWrite.texture;
  renderer.setRenderTarget(trailRead);
  renderer.render(diffuseScene, diffuseCamera);

  // Swap buffers
  [trailRead, trailWrite] = [trailWrite, trailRead];

  // Display to screen
  displayMat.uniforms.tTrail.value = trailRead.texture;
  renderer.setRenderTarget(null);
  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
