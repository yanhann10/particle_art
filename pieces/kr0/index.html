<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kr0 · Shiota — Gathering Leaves</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">kr0</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0022);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 160);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.003));
const dim1 = new THREE.PointLight(0x1c0606, 0.008, 38, 2.4);
dim1.position.set(-8, 12, 7);
scene.add(dim1);

const dim2 = new THREE.PointLight(0x160404, 0.005, 34, 2.2);
dim2.position.set(6, -7, -6);
scene.add(dim2);

let seed = 918742;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ROOM VOLUME
const ROOM = { w: 30, h: 20, d: 26 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED LEAF SPHERE — the gathered core
const leafSpherePos = new THREE.Vector3(0.5, 1.8, -1.2);
const leafSphereRadius = 2.8;

const leafSphereMat = new THREE.MeshStandardMaterial({
  color: 0xe4dccf,
  emissive: 0xc8b89e,
  emissiveIntensity: 0.62,
  roughness: 0.88,
  metalness: 0.04
});

const leafSphereGeo = new THREE.SphereGeometry(leafSphereRadius, 24, 16);
const leafSphere = new THREE.Mesh(leafSphereGeo, leafSphereMat);
leafSphere.position.copy(leafSpherePos);
scene.add(leafSphere);

const sphereGlow = new THREE.PointLight(0x1a0505, 0.006, 10, 2.6);
sphereGlow.position.copy(leafSpherePos);
scene.add(sphereGlow);

// LEAF ATTACHMENT POINTS — distribute on sphere surface
const leafAttachPts = [];
const LEAF_ATTACH_COUNT = 180;

for(let i=0; i<LEAF_ATTACH_COUNT; i++){
  const phi = Math.acos(2*rng() - 1);
  const theta = rng() * Math.PI * 2;
  const r = leafSphereRadius + rng()*0.15;
  
  const x = leafSpherePos.x + r * Math.sin(phi) * Math.cos(theta);
  const y = leafSpherePos.y + r * Math.sin(phi) * Math.sin(theta);
  const z = leafSpherePos.z + r * Math.cos(phi);
  
  leafAttachPts.push(new THREE.Vector3(x, y, z));
}

// WALL ANCHORS
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.90; z=(rng()-0.5)*ROOM.d*0.90; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.90; z=(rng()-0.5)*ROOM.d*0.90; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.90; z=(rng()-0.5)*ROOM.d*0.90; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.90; z=(rng()-0.5)*ROOM.d*0.90; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.90; y=(rng()-0.5)*ROOM.h*0.90; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.90; y=(rng()-0.5)*ROOM.h*0.90; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<96; i++) anchors.push(wallPt());

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to sphere top
const suspPts = [];
for(let i=0; i<8; i++){
  const angle = (i/8)*Math.PI*2;
  const r = 0.8 + rng()*0.5;
  const x = leafSpherePos.x + Math.cos(angle)*r;
  const z = leafSpherePos.z + Math.sin(angle)*r;
  const y = leafSpherePos.y + leafSphereRadius + 0.2 + rng()*0.3;
  suspPts.push(new THREE.Vector3(x, y, z));
}

for(const sp of suspPts){
  const ceilX = sp.x + (rng()-0.5)*1.2;
  const ceilZ = sp.z + (rng()-0.5)*1.2;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sp);
}

// CONVERGENCE THREADS — anchors to leaf-sphere surface (gathering)
const convergeBudget = 8400;
for(let i=0; i<convergeBudget && li<NUM_LINES-10600; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(leafSpherePos);
  if(dSphere < leafSphereRadius*1.8) continue;
  
  let closest = leafAttachPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<6; k++){
    const candidate = leafAttachPts[Math.floor(rng()*leafAttachPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 12% stop short — threads that almost reach the gathered leaves
  if(rng()<0.12){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.40 + rng()*0.48);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// RADIATING THREADS FROM SPHERE — outward release
for(let i=0; i<520 && li<NUM_LINES-9200; i++){
  const lp = leafAttachPts[Math.floor(rng()*leafAttachPts.length)];
  const dir = lp.clone().sub(leafSpherePos).normalize();
  dir.x += (rng()-0.5)*0.6;
  dir.y += (rng()-0.5)*0.5;
  dir.z += (rng()-0.5)*0.6;
  dir.normalize();
  const len = 4.2 + rng()*9.5;
  const end = lp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(lp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor membrane
const THRESH = 7.2;
let webCount = 0, attempts = 0;
while(webCount<4800 && li<NUM_LINES-4000 && attempts<32000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>1.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// DENDRITIC BRANCHES near sphere — morphogenetic growth
for(let i=0; i<240 && li<NUM_LINES-2800; i++){
  const startDist = 4.5 + rng()*8.0;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.75;
  const start = leafSpherePos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.2,
    (rng()-0.5)*1.8,
    (rng()-0.5)*2.2
  ).normalize();
  
  const segLen = 1.2 + rng()*0.9;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-18 && rng()<0.62){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.50 + rng()*0.65
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.72));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-16 && rng()<0.44){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.50 - rng()*0.65
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.68));
      setLine(p1, p2b);
    }
  }
}

// HORIZONTAL CROSSING THREADS
for(let i=0; i<380 && li<NUM_LINES-1800; i++){
  const y = leafSpherePos.y + (rng()-0.5)*7.0;
  const x1 = -hw + rng()*4.5;
  const z1 = (rng()-0.5)*ROOM.d*0.85;
  const x2 = hw - rng()*4.5;
  const z2 = (rng()-0.5)*ROOM.d*0.85;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS — floor to ceiling
for(let i=0; i<260 && li<NUM_LINES-1200; i++){
  const x = (rng()-0.5)*ROOM.w*0.82;
  const z = (rng()-0.5)*ROOM.d*0.82;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.4, hh, z + (rng()-0.5)*1.4);
  setLine(a, b);
}

// WALL-TO-WALL SPANS
let wallSpans = 0;
while(wallSpans<1800 && li<NUM_LINES-800){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>5.0 && d<20.0){
    setLine(a, b);
    wallSpans++;
  }
}

// FILL remaining capacity
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>6.0 && d<17.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.072,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, slow dolly around the gathered sphere
const pathLen = 3400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.24){
    // Approach from upper-left front
    const lt = t/0.24;
    const angle = Math.PI*1.15 + lt*Math.PI*0.40;
    const r = 13.5 - lt*4.0;
    x = leafSpherePos.x + Math.cos(angle)*r;
    y = leafSpherePos.y + 7.0 - lt*3.8;
    z = leafSpherePos.z + Math.sin(angle)*r;
  } else if(t<0.48){
    // Circle right side at mid-height
    const lt = (t-0.24)/0.24;
    const angle = Math.PI*1.55 + lt*Math.PI*0.95;
    const r = 9.5 + Math.sin(lt*Math.PI*1.4)*1.2;
    x = leafSpherePos.x + Math.cos(angle)*r;
    y = leafSpherePos.y + 1.2 + Math.cos(lt*Math.PI*1.5)*0.9;
    z = leafSpherePos.z + Math.sin(angle)*r;
  } else if(t<0.70){
    // Descend below, looking up through red lattice
    const lt = (t-0.48)/0.22;
    const angle = Math.PI*2.50 + lt*Math.PI*0.70;
    const r = 8.8 + Math.cos(lt*Math.PI)*1.3;
    x = leafSpherePos.x + Math.cos(angle)*r;
    y = leafSpherePos.y - lt*8.5;
    z = leafSpherePos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, sphere silhouetted
    const lt = (t-0.70)/0.30;
    const angle = Math.PI*3.20 + lt*Math.PI*0.55;
    const r = 8.5 + lt*7.0;
    x = leafSpherePos.x + Math.cos(angle)*r;
    y = leafSpherePos.y + 3.5 + lt*5.0;
    z = leafSpherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.42%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.018 + basePositions[idx+1]*0.026 + i*0.000045;
    const breath = Math.sin(elapsed*0.00032 + phase)*0.000012;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.011;
      arr[vi+1] = basePositions[vi+1] + breath*0.009;
      arr[vi+2] = basePositions[vi+2] + breath*0.013;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere subtle rotation
  leafSphere.rotation.y = Math.sin(elapsed*0.000036)*0.010;
  leafSphere.rotation.x = Math.cos(elapsed*0.000028)*0.008;

  // Camera dolly
  const speed = 0.000016;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with drift
  camera.lookAt(
    leafSpherePos.x + Math.sin(elapsed*0.000072)*0.18,
    leafSpherePos.y + Math.cos(elapsed*0.000056)*0.15,
    leafSpherePos.z + Math.sin(elapsed*0.000042)*0.14
  );

  dim1.intensity = 0.008 + Math.sin(elapsed*0.000048)*0.0036;
  sphereGlow.intensity = 0.006 + Math.sin(elapsed*0.000062)*0.0028;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
