<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qfb · spiral congregation</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0916; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: radial-gradient(ellipse at center, #1a1428 0%, #0d0916 70%);
  }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">qfb</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Hilma af Klint — esoteric geometry, spiritual cosmology, color-coded meaning.
// She painted spirals as paths of spiritual evolution, mandalas as maps of the
// invisible world. Her work was diagrammatic but not sterile — it pulsed with
// conviction that geometry was revelation.
//
// Taking sav's flock as raw material: the birds are no longer biological entities.
// They are SOULS in a SPIRAL CONGREGATION. The piece becomes a mandala that
// BREATHES — particles orbit in nested golden-ratio spirals, phasing through
// Hilma's color cosmology:
//   - white-gold: spiritual ascent, divine light
//   - rose-pink: earthly love, the feminine principle
//   - blue-violet: transcendence, the invisible
//   - cream-yellow: warmth, life force
//
// The spirals pulse inward and outward like a living organism. The camera slowly
// rotates, tracking the centroid as the mandala evolves through phases of
// expansion and contraction — the breath of the cosmos.
//
// This is NOT literal pastiche of "Group IV, The Ten Largest" or "Altarpieces."
// It's Hilma's SENSIBILITY applied to particle-art: geometry as prayer, color as
// cosmology, the piece as a diagram of forces we cannot see but can feel.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0916, 0.012);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── spiral congregation
const N = 481;  // keep parent count — the souls
const PHI = (1.0 + Math.sqrt(5.0)) / 2.0;  // golden ratio — Hilma's geometry
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const spiralPhase = new Float32Array(N);   // each soul's phase in the spiral
const spiralRadius = new Float32Array(N);  // distance from center
const spiralArm = new Float32Array(N);     // which of 5 arms (pentagram)

// Initialize: nested golden spirals, five arms (pentagram — sacred geometry)
for (let i = 0; i < N; i++){
  const arm = i % 5;
  const layer = Math.floor(i / 5);
  const r = 0.5 + layer * 0.28 * PHI;  // golden spacing
  const theta = (layer * PHI * 2.0 * Math.PI) + (arm * 2.0 * Math.PI / 5.0);
  spiralPhase[i] = theta;
  spiralRadius[i] = r;
  spiralArm[i] = arm;
  pos[i*3]     = Math.cos(theta) * r;
  pos[i*3 + 1] = Math.sin(theta) * r;
  pos[i*3 + 2] = (Math.random() - 0.5) * 0.4;  // slight depth variation
  vel[i*3] = vel[i*3+1] = vel[i*3+2] = 0;
}

// Breath cycle: the mandala expands and contracts
let breathPhase = 0.0;
let cosmicTime = 0.0;

function step(dt){
  cosmicTime += dt;
  breathPhase += dt * 0.35;  // slow breath — 9-second cycle
  const breath = Math.sin(breathPhase) * 0.5 + 0.5;  // 0..1
  const expansion = 0.7 + breath * 0.6;  // mandala grows/shrinks

  // Rotation: spirals slowly revolve, creating living mandala
  const rotation = cosmicTime * 0.08;

  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < N; i++){
    const r = spiralRadius[i] * expansion;
    const theta = spiralPhase[i] + rotation + (spiralArm[i] * 0.04 * cosmicTime);
    // Z-axis gentle wave — the mandala isn't flat, it has dimensionality
    const z = Math.sin(theta * 3.0 + cosmicTime * 0.4) * 0.8 * (r / 14.0);
    pos[i*3]     = Math.cos(theta) * r;
    pos[i*3 + 1] = Math.sin(theta) * r;
    pos[i*3 + 2] = z;
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= N; cy /= N; cz /= N;

  // Camera tracks centroid (always does — user principle)
  camera.position.x = Math.sin(cosmicTime * 0.045) * 32 + cx * 0.2;
  camera.position.y = cy * 0.3;
  camera.position.z = Math.cos(cosmicTime * 0.045) * 32;
  camera.lookAt(cx, cy, cz);
}

// ────────────── render
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const armAttr = new Float32Array(N);
const radiusAttr = new Float32Array(N);
for (let i = 0; i < N; i++){
  armAttr[i] = spiralArm[i];
  radiusAttr[i] = spiralRadius[i];
}
geom.setAttribute('arm', new THREE.BufferAttribute(armAttr, 1));
geom.setAttribute('radius', new THREE.BufferAttribute(radiusAttr, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uBreath: { value: 0.5 },
  fogColor: { value: scene.fog.color },
  fogDensity: { value: scene.fog.density }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBreath;
    attribute float arm;
    attribute float radius;
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // Size: outer souls larger (more radiant), inner souls concentrated
      float sizeByRadius = 1.0 + (radius / 14.0) * 1.4;
      float pulse = 0.8 + 0.3 * sin(uTime * 1.2 + radius * 0.8);
      gl_PointSize = sizeByRadius * pulse * uPixel * (18.0 / dist);

      vAlpha = clamp(1.0 - (dist - 28.0) / 32.0, 0.0, 1.0);

      // Hilma's color cosmology — each arm is a different spiritual principle
      vec3 white   = vec3(0.98, 0.95, 0.88);  // divine light
      vec3 rose    = vec3(0.96, 0.52, 0.62);  // earthly love
      vec3 violet  = vec3(0.52, 0.38, 0.72);  // transcendence
      vec3 gold    = vec3(0.98, 0.82, 0.42);  // life force
      vec3 blue    = vec3(0.42, 0.58, 0.85);  // cosmic order

      // Each arm corresponds to a color principle
      vec3 armCol;
      if (arm < 0.5)      armCol = white;
      else if (arm < 1.5) armCol = rose;
      else if (arm < 2.5) armCol = violet;
      else if (arm < 3.5) armCol = gold;
      else                armCol = blue;

      // Breath modulates color intensity — expansion = brighter (spiritual ascent)
      float intensity = 0.7 + uBreath * 0.5;
      // Inner souls glow more intensely (center = source)
      float centerGlow = smoothstep(6.0, 0.5, radius);
      vCol = armCol * intensity * (1.0 + centerGlow * 0.6);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // Soft glow — not harsh dot, but radiant presence
      float core = exp(-r * 18.0);
      float halo = exp(-r * 6.0) * 0.4;
      float a = (core + halo) * vAlpha;
      vec3 col = vCol * a;
      // Manual fog mixing (no auto-inject)
      float depth = gl_FragCoord.z / gl_FragCoord.w;
      float fogFactor = exp(-fogDensity * fogDensity * depth * depth);
      fogFactor = clamp(fogFactor, 0.0, 1.0);
      col = mix(fogColor, col, fogFactor);
      gl_FragColor = vec4(col, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pre-warm: let the mandala breathe into a visible state
for (let s = 0; s < 180; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = cosmicTime;
  uniforms.uBreath.value = Math.sin(breathPhase) * 0.5 + 0.5;
  step(dt);
  geom.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
