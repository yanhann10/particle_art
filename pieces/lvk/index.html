<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: calm -->
<title>lvk · aizawa attractor (naïve)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  #grain { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none;
           mix-blend-mode:overlay; opacity:0.08; z-index:10; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           font-family: ui-monospace, "SF Mono", Menlo, monospace;
           letter-spacing:0.06em; color:#cdd2dc; z-index:20; }
</style>
</head>
<body>
<div class="id">lvk</div>
<canvas id="grain"></canvas>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* --- film grain overlay (photochemical imperfection, lia_halloran) --- */
const grainC = document.getElementById('grain');
const grainCtx = grainC.getContext('2d');
function drawGrain(){
  grainC.width = window.innerWidth / 2;
  grainC.height = window.innerHeight / 2;
  const img = grainCtx.createImageData(grainC.width, grainC.height);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    const v = Math.random()*255|0;
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  grainCtx.putImageData(img,0,0);
}
drawGrain(); setInterval(drawGrain, 120);

/* --- GPGPU setup --- */
const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0c0a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

/* init: asymmetric scatter — deliberate off-center seeding */
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.55 + 0.08;
  init[i*4+1] = (Math.random()*2-1) * 0.65 - 0.04;
  init[i*4+2] = (Math.random()*2-1) * 0.50 + 0.06;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* --- simulation: Aizawa with slight asymmetry in params --- */
const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 },
  uTime: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      /* slight breathing modulation on a and c — the form inhales/exhales */
      float breathA = uA + 0.015 * sin(uTime * 0.4);
      float breathC = uC + 0.012 * sin(uTime * 0.31 + 1.2);
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        breathC + breathA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

/* --- render: points with per-particle jitter + mark-making --- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
/* per-particle random seeds baked at init for jitter + size variation */
const rndArr = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
  rndArr[i] = Math.random();
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));
pointsGeom.setAttribute('aRand',    new THREE.BufferAttribute(rndArr, 1));

/* hand-chosen palette — raw sienna, indigo, warm cream, muted sage
   inspired by Cy Twombly's late paintings: gestural marks on warm ground */
const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    attribute float aRand;
    varying float vAge;
    varying float vSpeed;
    varying float vRand;

    /* deterministic hash for jitter */
    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;

      /* --- per-particle position jitter: 8-12% of local scale --- */
      float jAmt = 0.08 + 0.04 * aRand;
      float h1 = hash(aRand * 1234.5 + uTime * 0.03);
      float h2 = hash(aRand * 5678.9 + uTime * 0.025);
      float h3 = hash(aRand * 9012.3 + uTime * 0.035);
      p.x += (h1 - 0.5) * jAmt;
      p.y += (h2 - 0.5) * jAmt;
      p.z += (h3 - 0.5) * jAmt;

      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vRand = aRand;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      /* --- mark-making: ~3% of particles are 3-5x larger (brushstrokes) --- */
      float isBrush = step(0.97, aRand);
      float brushScale = mix(1.0, 3.0 + 2.0 * hash(aRand * 333.0), isBrush);
      /* base size varies more than parent: 0.8-2.0 range for organic feel */
      float baseSize = 0.8 + 1.2 * hash(aRand * 777.0);
      float sz = baseSize * brushScale * (1.0 + 0.8 * vSpeed);
      gl_PointSize = sz * uPixel * (8.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vRand;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;

      /* softer falloff for brush particles — less perfect circle */
      float isBrush = step(0.97, vRand);
      float falloff = mix(14.0, 6.0, isBrush);
      float a = exp(-r * falloff);

      /* Cy Twombly palette: raw sienna, deep indigo, warm cream, sage green */
      vec3 sienna  = vec3(0.76, 0.47, 0.09);  /* #C17817 */
      vec3 indigo  = vec3(0.17, 0.11, 0.33);  /* #2B1B54 */
      vec3 cream   = vec3(0.95, 0.91, 0.84);  /* #F2E8D5 */
      vec3 sage    = vec3(0.29, 0.49, 0.44);  /* #4A7C6F */
      vec3 charred = vec3(0.42, 0.18, 0.12);  /* burnt accent */

      float k = mod(vAge + vSpeed * 0.35, 1.0);
      vec3 col;
      if(k < 0.25){
        col = mix(sienna, sage, k * 4.0);
      } else if(k < 0.50){
        col = mix(sage, cream, (k - 0.25) * 4.0);
      } else if(k < 0.75){
        col = mix(cream, charred, (k - 0.5) * 4.0);
      } else {
        col = mix(charred, indigo, (k - 0.75) * 4.0);
      }

      /* brush particles are denser, more opaque — deliberate marks */
      float opacity = mix(0.35 + vSpeed * 0.7, 0.6 + vSpeed * 0.4, isBrush);
      gl_FragColor = vec4(col * a * opacity, a * opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  drawGrain();
});

/* pointer perturbations kept from parent */
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;

  /* breathing camera: slow drift with wobble, NOT perfect rotation
     deliberate asymmetry in period ratios (golden-ratio-ish) */
  const breathScale = 1.0 + 0.06 * Math.sin(elapsed * 0.37);
  const driftX = Math.sin(elapsed * 0.062) * 1.8 + Math.sin(elapsed * 0.101) * 0.5;
  const driftZ = Math.cos(elapsed * 0.071) * 2.2 + Math.cos(elapsed * 0.113) * 0.4;
  const driftY = Math.sin(elapsed * 0.043) * 0.7 + 0.3;

  camera.position.set(
    driftX * breathScale,
    driftY * breathScale,
    (2.8 + driftZ) * breathScale
  );
  /* look slightly off-center — asymmetric framing */
  camera.lookAt(0.05, 0.08, 0.9);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
