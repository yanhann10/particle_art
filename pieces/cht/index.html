<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cht · ink patience · slow reveal through leaf-scales</title>
<!-- MOTION: emerge, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#07070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .breath{ position:fixed; right:14px; bottom:12px; opacity:0.0; font-size:10px; letter-spacing:0.04em; color:#cdd2dc;
           transition: opacity 4s ease; }
  .breath.show { opacity:0.35; }
</style>
</head>
<body>
<div class="id">cht</div>
<div class="breath" id="breath">breaths: 0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Concept ──
   Slow Art: a calligraphic differential-growth stroke rendered as overlapping
   leaf-scales (like scales on a koi or serpent). For the first 30s it appears
   nearly frozen — a dark form barely distinguishable from the ground. Then,
   imperceptibly, leaves begin to separate, warm color bleeds through gaps,
   the form extends upward. The viewer who waits 90s sees the full warmth.
   Inspired by Lee Ufan's "Dialogue" paintings — a single mark, infinite time.
   Leaf = basic unit. Each leaf is a pointed ellipse oriented along the stroke. */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 250);
camera.position.set(6, 7, 13);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07070b, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 4, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.08; // glacial

// ── palette: 5 hand-picked colors ──
// #12111a near-black indigo (initial leaf), #2e2233 dark plum (mid reveal),
// #6b4a3a burnt sienna (warm emerge), #c4956a amber ochre (peak),
// #d8c895 parchment (final glow at edges)
const C0 = new THREE.Color(0x12111a);
const C1 = new THREE.Color(0x2e2233);
const C2 = new THREE.Color(0x6b4a3a);
const C3 = new THREE.Color(0xc4956a);
const C4 = new THREE.Color(0xd8c895);

function lerpPalette(t){
  t = Math.max(0, Math.min(1, t));
  if (t < 0.25) return C0.clone().lerp(C1, t / 0.25);
  if (t < 0.5)  return C1.clone().lerp(C2, (t - 0.25) / 0.25);
  if (t < 0.75) return C2.clone().lerp(C3, (t - 0.5) / 0.25);
  return C3.clone().lerp(C4, (t - 0.75) / 0.25);
}

// ── differential growth (from parent 2iy) ──
const MAX_VERTS = 1400;
const ATTRACT = 0.06, REPEL_R = 0.46, REPEL_STR = 0.13;
const NOISE = 0.003, PRESSURE = 0.0028, RISE = 0.0042, MAX_D = 0.36;
const verts = [];
for (let i = 0; i < 18; i++){
  const th = i/18*Math.PI*2, r = 1.4+(Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y:0, z: Math.sin(th)*r, age:0 });
}
const CELL = REPEL_R, grid = new Map();
function key3(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i],k=key3(v.x,v.y,v.z);
    if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);
  }
}
function nbrs(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL),out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const a=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));if(a)for(const i of a)out.push(i);
  } return out;
}
function step(){
  const n=verts.length; if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);
  for(let i=0;i<n;i++){const v=verts[i];for(const j of nbrs(v)){if(j===i)continue;
    const u=verts[j],ex=v.x-u.x,ey=v.y-u.y,ez=v.z-u.z,d2=ex*ex+ey*ey+ez*ez;
    if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;const d=Math.sqrt(d2),f=REPEL_STR*(1-d/REPEL_R)/d;
    dx[i]+=ex*f;dy[i]+=ey*f;dz[i]+=ez*f;}}
  for(let i=0;i<n;i++){const a=verts[(i-1+n)%n],b=verts[(i+1)%n],v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;}
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for(let i=0;i<n;i++){const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;dy[i]+=(oy/d)*PRESSURE*0.4;dz[i]+=(oz/d)*PRESSURE;}
  for(let i=0;i<n;i++){const a=verts[i].age,up=RISE*(0.3+1.2*Math.min(a*1.5,1));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;verts[i].age+=0.0014;}
  const grown=[];
  for(let i=0;i<n;i++){const a=verts[i],b=verts[(i+1)%n];grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS)
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,age:Math.max(a.age,b.age)*0.5});}
  verts.length=0;for(const v of grown)verts.push(v);
}
// pre-grow so form is visible immediately
for(let s=0;s<700;s++) step();

// ── leaf geometry (pointed ellipse) ──
const leafShape = new THREE.Shape();
leafShape.moveTo(0, -0.5);
leafShape.bezierCurveTo(0.18, -0.25, 0.22, 0.15, 0, 0.5);
leafShape.bezierCurveTo(-0.22, 0.15, -0.18, -0.25, 0, -0.5);
const leafGeo = new THREE.ShapeGeometry(leafShape, 4);
leafGeo.scale(0.14, 0.22, 1);

// ── instanced leaves ──
const MAX_LEAVES = 2400;
const leafMat = new THREE.MeshBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 1.0,
  side: THREE.DoubleSide, depthWrite: false
});
const instMesh = new THREE.InstancedMesh(leafGeo, leafMat, MAX_LEAVES);
instMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(MAX_LEAVES*3), 3);
instanceColor.setUsage(THREE.DynamicDrawUsage);
instMesh.instanceColor = instanceColor;
scene.add(instMesh);

// ── ambient atmosphere: thin fog particles ──
const dustGeo = new THREE.BufferGeometry();
const dustCount = 300;
const dustPos = new Float32Array(dustCount * 3);
for(let i=0;i<dustCount;i++){
  dustPos[i*3] = (Math.random()-0.5)*20;
  dustPos[i*3+1] = Math.random()*16;
  dustPos[i*3+2] = (Math.random()-0.5)*20;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0x1a1820, size: 0.08, transparent: true, opacity: 0.3 });
scene.add(new THREE.Points(dustGeo, dustMat));

// ── breath counter ──
const breathEl = document.getElementById('breath');
let breathCount = 0;
const BREATH_CYCLE = 4.5; // seconds per breath
let lastBreathTime = 0;

// ── time tracking ──
const t0 = performance.now();
let frameCount = 0;
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

function buildLeaves(elapsed){
  if(verts.length < 8) return;
  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  // reveal progress: 0→1 over 120 seconds
  const reveal = Math.min(1, elapsed / 120);
  // separation progress: leaves spread apart slowly
  const separation = reveal * 0.12;
  // color warmth: 0→1
  const warmth = reveal;

  const nLeaves = Math.min(MAX_LEAVES, verts.length * 2);
  let leafIdx = 0;

  for(let i = 0; i < nLeaves; i++){
    const t = i / nLeaves;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();

    // curvature proxy for thickness
    const dt = 1/nLeaves;
    const t1 = curve.getTangentAt(((t-dt)%1+1)%1);
    const t2 = curve.getTangentAt(((t+dt)%1+1)%1);
    const curvature = Math.min(1, (2 - t1.dot(tangent) - tangent.dot(t2)) * 4);

    // per-leaf phase for subtle individual timing
    const leafPhase = (Math.sin(i * 1.618 * 6.283) * 0.5 + 0.5);
    // each leaf reveals at slightly different time
    const leafReveal = Math.max(0, Math.min(1, (reveal - leafPhase * 0.3) / 0.7));

    // separation: leaves drift outward from curve normal
    const up = new THREE.Vector3(0,1,0);
    let normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
    if(normal.lengthSq() < 0.01) normal.set(1,0,0);
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

    const sepAngle = (i * 2.399) % (Math.PI * 2); // golden angle scatter
    const sepDist = separation * (0.3 + curvature * 0.7) * (0.5 + leafPhase * 0.5);
    const offset = normal.clone().multiplyScalar(Math.cos(sepAngle) * sepDist)
      .add(binormal.clone().multiplyScalar(Math.sin(sepAngle) * sepDist));

    dummy.position.copy(p).add(offset);

    // orient leaf along tangent
    dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tangent);
    // slight individual tilt that increases with reveal
    const tiltAmt = leafReveal * 0.3 * (leafPhase - 0.5);
    dummy.rotateZ(tiltAmt);
    dummy.rotateX(sepAngle * 0.1 * leafReveal);

    // scale: base + curvature swell, slightly growing with reveal
    const baseScale = 0.8 + curvature * 1.2;
    const growScale = 1.0 + leafReveal * 0.15;
    dummy.scale.setScalar(baseScale * growScale);

    dummy.updateMatrix();
    instMesh.setMatrixAt(leafIdx, dummy.matrix);

    // color: starts near-background, warms with time
    // position along curve and curvature both influence warmth
    const posWarmth = (Math.sin(t * Math.PI * 3 + elapsed * 0.005) * 0.5 + 0.5);
    const colorT = warmth * (0.3 + 0.7 * posWarmth) * (0.6 + 0.4 * curvature);
    const c = lerpPalette(colorT);
    // opacity: starts very close to background, slowly separates
    const alpha = 0.35 + leafReveal * 0.55;
    // darken by alpha (since we use MeshBasicMaterial, fake opacity via color)
    c.multiplyScalar(alpha);
    instanceColor.setXYZ(leafIdx, c.r, c.g, c.b);
    leafIdx++;
  }
  instMesh.count = leafIdx;
  instMesh.instanceMatrix.needsUpdate = true;
  instanceColor.needsUpdate = true;
}

// ── dust drift ──
function animateDust(elapsed){
  const pos = dustGeo.attributes.position;
  for(let i=0;i<dustCount;i++){
    pos.array[i*3+1] += 0.0003 + Math.sin(i*0.7+elapsed*0.1)*0.0001;
    if(pos.array[i*3+1] > 16) pos.array[i*3+1] = -1;
  }
  pos.needsUpdate = true;
  // dust warms with reveal
  const reveal = Math.min(1, elapsed/120);
  dustMat.color.copy(C0).lerp(C1, reveal * 0.6);
  dustMat.opacity = 0.15 + reveal * 0.2;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) / 1000;
  frameCount++;

  // very slow growth: 1 step every 30 frames (~0.5s)
  if(frameCount % 30 === 0) step();

  // breath counter
  if(elapsed - lastBreathTime > BREATH_CYCLE){
    breathCount++;
    lastBreathTime = elapsed;
    breathEl.textContent = `breaths: ${breathCount}`;
    if(breathCount >= 2 && !breathEl.classList.contains('show')){
      breathEl.classList.add('show');
    }
  }

  // background color: extremely slow warm shift
  const bgReveal = Math.min(1, elapsed / 150);
  const bgR = 0.027 + bgReveal * 0.015;
  const bgG = 0.027 + bgReveal * 0.008;
  const bgB = 0.043 + bgReveal * 0.003;
  renderer.setClearColor(new THREE.Color(bgR, bgG, bgB), 1);

  buildLeaves(elapsed);
  animateDust(elapsed);

  // camera follow centroid
  let yMean = 0; for(const v of verts) yMean += v.y; yMean /= Math.max(verts.length,1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.01; // very slow follow
  const desiredCamY = targetY + 3;
  camera.position.y += (desiredCamY - camera.position.y) * 0.008;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
