<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: gentle -->
<title>eby · relational tree</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; }
  .pulse { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; text-align:right; line-height:1.6; }
</style>
</head>
<body>
<div class="id">eby</div>
<div class="hint">drag to orbit · open more tabs to gather · click to regrow</div>
<div class="pulse" id="stats">peers: 1<br>pulses: 0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── relational layer ── */
const myId = Math.random().toString(36).slice(2,8);
let peerCount = 1, pulseTotal = 0, lastPulseTime = 0, pulseWave = 0;
let peerPhases = {}; // each peer contributes a phase offset to the breathing
const statsEl = document.getElementById('stats');

// BroadcastChannel — multi-tab social field
const bc = new BroadcastChannel('relational-tree-794');
const peers = new Map();

function broadcastHeartbeat(){
  bc.postMessage({ type:'heartbeat', id: myId, t: performance.now() });
}
bc.onmessage = (e) => {
  const d = e.data;
  if (d.type === 'heartbeat'){
    peers.set(d.id, performance.now());
    peerPhases[d.id] = (Object.keys(peerPhases).length + 1) * 1.618;
  }
  if (d.type === 'regrow'){
    // another tab regrew — send a sympathetic pulse
    pulseTotal++;
    pulseWave = 1.0;
    lastPulseTime = performance.now();
  }
};
setInterval(broadcastHeartbeat, 1500);
setInterval(() => {
  const now = performance.now();
  for (const [id, t] of peers) if (now - t > 5000) { peers.delete(id); delete peerPhases[id]; }
  peerCount = peers.size + 1;
}, 2000);

// Binance WebSocket — external world pulse (BTC trades)
let ws = null, wsRetry = 0;
function connectWS(){
  try {
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onmessage = () => {
      pulseTotal++;
      pulseWave = Math.min(pulseWave + 0.15, 1.0);
      lastPulseTime = performance.now();
    };
    ws.onclose = () => { if (wsRetry < 3){ wsRetry++; setTimeout(connectWS, 4000); } };
    ws.onerror = () => { ws.close(); };
  } catch(e){}
}
connectWS();

/* ── L-system ── */
const RULES = {
  'F': [
    { p: 0.40, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F' },
    { p: 0.18, s: 'F[/F][\\F]F' },
    { p: 0.12, s: 'F[+F-F]F[\\F/F]' },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(24);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0,1,0), L = new THREE.Vector3(-1,0,0), U = new THREE.Vector3(0,0,1);
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone(), gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(depthFactor, gen);
        const np = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: np.clone(), gen });
        pos = np; break;
      }
      case '+': rotate(u, +ANGLE); break; case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break; case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break; case '\\': rotate(h, -ANGLE); break;
      case '[': stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN);
  const lengthTs = new Float32Array(totalN);
  const isLeaf = new Float32Array(totalN); // 1 = leaf tip particle
  const v = new THREE.Vector3();
  let written = 0;
  // find tip segments (segments whose 'to' isn't another segment's 'from')
  const tipSet = new Set();
  const fromSet = new Set();
  segments.forEach(s => fromSet.add(`${s.from.x.toFixed(3)},${s.from.y.toFixed(3)},${s.from.z.toFixed(3)}`));
  segments.forEach((s,i) => {
    const k = `${s.to.x.toFixed(3)},${s.to.y.toFixed(3)},${s.to.z.toFixed(3)}`;
    if (!fromSet.has(k)) tipSet.add(i);
  });

  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1 ? totalN-written : Math.max(1, Math.floor(totalN * lens[i] / total));
    const isTip = tipSet.has(i);
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = (isTip && t > 0.7) ? 0.18 : 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      positions[written*3]=v.x; positions[written*3+1]=v.y; positions[written*3+2]=v.z;
      seeds[written] = Math.random();
      gens[written] = segments[i].gen;
      lengthTs[written] = t;
      isLeaf[written] = (isTip && t > 0.5) ? 1.0 : 0.0;
      written++;
    }
  }
  return { positions, seeds, gens, lengthTs, isLeaf };
}

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 5, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0807, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uPeers: { value: 1 },
  uPulse: { value: 0 },
  uBreath:{ value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uReady, uPeers, uPulse, uBreath;
    attribute float seed, gen, lengthT, isLeaf;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vIsLeaf;
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;

      // breathing: collective inhale/exhale, amplitude grows with peer count
      float breathAmp = 0.03 + 0.015 * min(uPeers, 8.0);
      float breathFreq = 0.35 + 0.05 * min(uPeers, 6.0);
      float breath = sin(uTime * breathFreq + gen * 0.3) * breathAmp * gen;
      p.x += breath * sin(t * 0.3 + p.y * 0.2);
      p.z += breath * cos(t * 0.4 + p.y * 0.2);

      // pulse wave from external data — ripple from trunk outward
      float pulsePhase = uPulse * sin(uTime * 3.0 - gen * 0.8) * 0.12;
      p.y += pulsePhase * isLeaf;

      // leaf particles spread slightly when more peers present
      if (isLeaf > 0.5){
        float spread = 0.08 * min(uPeers - 1.0, 5.0);
        p.x += (seed - 0.5) * spread;
        p.z += (seed - 0.5) * spread;
      }

      // reveal
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // palette — Nicolas Bourriaud warmth: encounter, gathering
      // trunk: deep umber, branches: warm copper, leaves: amber-gold
      // pulse adds brief flush of warm coral
      vec3 trunk  = vec3(0.42, 0.26, 0.15);  // #6B4226 deep umber
      vec3 branch = vec3(0.76, 0.47, 0.25);  // #C17840 copper
      vec3 leaf   = vec3(0.91, 0.77, 0.28);  // #E8C547 amber gold
      vec3 flush  = vec3(0.83, 0.33, 0.23);  // #D4553A warm coral — pulse color

      float k = clamp(gen * 0.2, 0.0, 1.0);
      vCol = mix(trunk, branch, k);
      vCol = mix(vCol, leaf, smoothstep(0.6, 1.0, k) * (0.7 + 0.3 * isLeaf));
      // pulse flush
      vCol = mix(vCol, flush, uPulse * 0.4 * (0.5 + 0.5*sin(uTime*4.0 - gen*1.2)));

      // peers tint: more peers = slightly warmer overall
      vCol += vec3(0.04, 0.02, 0.0) * min(uPeers - 1.0, 5.0);

      float energy = 0.5 + 0.5 * sin(t * 0.5);
      vAlpha = (0.5 + 0.5 * energy) * (0.6 + 0.4 * uReady);
      vIsLeaf = isLeaf;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (1.0 + 0.5*energy + 0.3*isLeaf) * uPixel * (40.0/dist) * (0.4 + 0.6*uReady);
      // leaves get bigger with more peers — the gathering makes it bloom
      sz += isLeaf * min(uPeers - 1.0, 4.0) * 0.4 * uPixel * (40.0/dist);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vIsLeaf;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      // leaf particles: slightly elongated oval; trunk: round
      float aspect = mix(1.0, 0.7, vIsLeaf);
      vec2 dd = vec2(d.x, d.y * aspect);
      float r = dot(dd, dd);
      if (r > 0.25) discard;
      float falloff = mix(17.0, 12.0, vIsLeaf);
      float a = exp(-r * falloff) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s>>>15, 1|s);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str, 0.76);
  const bb = new THREE.Box3();
  for (const sg of segs){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segs){
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }
  const data = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(data.seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(data.gens, 1));
    geom.setAttribute('lengthT',  new THREE.BufferAttribute(data.lengthTs, 1));
    geom.setAttribute('isLeaf',   new THREE.BufferAttribute(data.isLeaf, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(data.positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(data.seeds); geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(data.gens); geom.attributes.gen.needsUpdate = true;
    geom.attributes.lengthT.array.set(data.lengthTs); geom.attributes.lengthT.needsUpdate = true;
    geom.attributes.isLeaf.array.set(data.isLeaf); geom.attributes.isLeaf.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
  // notify other tabs
  bc.postMessage({ type:'regrow', id: myId });
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── ambient dust motes — atmosphere ── */
const dustN = 600;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustN * 3);
const dustSeed = new Float32Array(dustN);
for (let i = 0; i < dustN; i++){
  dustPos[i*3]   = (Math.random()-0.5)*30;
  dustPos[i*3+1] = Math.random()*20 - 5;
  dustPos[i*3+2] = (Math.random()-0.5)*30;
  dustSeed[i] = Math.random();
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      p.y += sin(uTime*0.15 + seed*6.28)*0.8;
      p.x += cos(uTime*0.1 + seed*3.14)*0.5;
      vA = 0.12 + 0.08*sin(uTime*0.5 + seed*6.28);
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_PointSize = 1.5 * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r>0.25) discard;
      float a = exp(-r*14.0)*vA;
      gl_FragColor = vec4(vec3(0.9,0.82,0.65)*a, a);
    }
  `
});
scene.add(new THREE.Points(dustGeo, dustMat));

/* ── warm side light gradient via a subtle fog plane ── */
const fogGeo = new THREE.PlaneGeometry(60, 40);
const fogMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float g = smoothstep(0.0, 0.7, vUv.y);
      vec3 warm = vec3(0.25, 0.12, 0.05);
      vec3 cool = vec3(0.04, 0.06, 0.10);
      vec3 c = mix(cool, warm, g);
      float a = 0.06 * (1.0 - abs(vUv.x - 0.5)*1.4);
      gl_FragColor = vec4(c*a, a);
    }
  `
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.position.set(0, 5, -8);
scene.add(fogPlane);

/* ── render loop ── */
const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  if (revealStart > 0) uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);

  // decay pulse
  pulseWave *= 0.97;
  uniforms.uPulse.value = pulseWave;
  uniforms.uPeers.value = peerCount;

  // update stats display
  if (Math.floor(elapsed * 2) % 2 === 0){
    statsEl.innerHTML = `peers: ${peerCount}<br>pulses: ${Math.min(pulseTotal, 99999)}`;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
