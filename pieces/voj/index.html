<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.006);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.04));

const pL = new THREE.PointLight(0xffe0c0, 0.15, 50, 1.6);
pL.position.set(2.0, 18.0, -3.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0xc20018, 0.03, 28, 2.0);
pL2.position.set(-5.0, -6.0, 4.0);
scene.add(pL2);

let seed = 73519426;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 44, h: 36, d: 50 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center
const sphereCenter = new THREE.Vector3(0.8, 0.4, -0.3);
const SPHERE_R = 2.5;

const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8dc,
    emissive: 0xf0e8dc,
    emissiveIntensity: 0.85,
    roughness: 0.92,
    metalness: 0.0,
    transparent: true,
    opacity: 0.32
  })
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.72, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xf8f2ea, transparent: true, opacity: 0.08 })
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

// Suspension wires — 6 threads from ceiling to sphere top, physically legible
const suspPts = [];
for(let i = 0; i < 6; i++){
  const ang = (i / 6) * Math.PI * 2 + rng() * 0.3;
  const rx = 0.15 + rng() * 0.35;
  suspPts.push(
    sphereCenter.x + Math.cos(ang) * rx, hh, sphereCenter.z + Math.sin(ang) * rx,
    sphereCenter.x + Math.cos(ang) * 0.04, sphereCenter.y + SPHERE_R - rng() * 0.1, sphereCenter.z + Math.sin(ang) * 0.04
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.50
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const th = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  const jR = SPHERE_R + (rng() - 0.5) * 0.06;
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi) * Math.cos(th) * jR,
    sphereCenter.y + Math.sin(phi) * Math.sin(th) * jR,
    sphereCenter.z + Math.cos(phi) * jR
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — truncated icosahedron vertices projected into room volume
// Manfred Mohr: let geometry generate the topology
const anchors = [];

// Truncated icosahedron vertices (soccer ball geometry) — 60 vertices
// Golden ratio
const PHI = (1 + Math.sqrt(5)) / 2;
const icoVerts = [];
// Permutations of (0, ±1, ±3φ)
const perms3 = [[0,1,3*PHI],[0,1,-3*PHI],[0,-1,3*PHI],[0,-1,-3*PHI]];
// Permutations of (±2, ±(1+2φ), ±φ)
// Permutations of (±1, ±(2+φ), ±2φ)
// Using simplified approach: icosahedron vertices scaled to shells
const icoBase = [];
for(let i = 0; i < 12; i++){
  const lat = (i === 0) ? Math.PI/2 : (i === 11) ? -Math.PI/2 :
    ((i <= 5) ? Math.atan(0.5) : -Math.atan(0.5));
  const lon = (i === 0 || i === 11) ? 0 :
    ((i <= 5) ? (i-1) * 2*Math.PI/5 : (i-6) * 2*Math.PI/5 + Math.PI/5);
  icoBase.push(new THREE.Vector3(
    Math.cos(lat)*Math.cos(lon),
    Math.sin(lat),
    Math.cos(lat)*Math.sin(lon)
  ));
}

// Project icosahedron vertices at multiple radii
const anchorRadii = [4.0, 7.5, 12.0, 18.0, 24.0];
for(const R of anchorRadii){
  for(const v of icoBase){
    anchors.push(new THREE.Vector3(
      sphereCenter.x + v.x * R + (rng()-0.5)*0.6,
      sphereCenter.y + v.y * R + (rng()-0.5)*0.6,
      sphereCenter.z + v.z * R + (rng()-0.5)*0.6
    ));
  }
  // Midpoints of icosahedron edges at this shell
  for(let i = 0; i < icoBase.length; i++){
    for(let j = i+1; j < icoBase.length; j++){
      if(icoBase[i].distanceTo(icoBase[j]) < 1.2){
        const mid = icoBase[i].clone().add(icoBase[j]).multiplyScalar(0.5).normalize();
        anchors.push(new THREE.Vector3(
          sphereCenter.x + mid.x * R + (rng()-0.5)*0.5,
          sphereCenter.y + mid.y * R + (rng()-0.5)*0.5,
          sphereCenter.z + mid.z * R + (rng()-0.5)*0.5
        ));
      }
    }
  }
}

// Fill remaining with wall-biased points
while(anchors.length < 700){
  const p = rng() < 0.4 ? wallPt() : wallPt().lerp(sphereCenter, 0.1 + rng()*0.35);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 8, sphereCenter.y + 7, sphereCenter.z + 9), r: 3.0 },
  { pos: new THREE.Vector3(sphereCenter.x + 9, sphereCenter.y - 6, sphereCenter.z - 8), r: 2.6 },
  { pos: new THREE.Vector3(sphereCenter.x + 4, sphereCenter.y + 11, sphereCenter.z + 4), r: 2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── RADIAL QUANTIZATION — Vera Molnar
// Threads near the sphere snap to 15° angular increments; threads at walls are free
const QUANT_ANGLE = Math.PI / 12; // 15 degrees
function quantizeNearSphere(pt){
  const d = pt.distanceTo(sphereCenter);
  if(d > 8.0) return pt; // far = free
  const blend = Math.max(0, 1.0 - d / 8.0);
  const dx = pt.x - sphereCenter.x, dz = pt.z - sphereCenter.z;
  const ang = Math.atan2(dz, dx);
  const qAng = Math.round(ang / QUANT_ANGLE) * QUANT_ANGLE;
  const lerpAng = ang + (qAng - ang) * blend * 0.7;
  const horiz = Math.sqrt(dx*dx + dz*dz);
  return new THREE.Vector3(
    sphereCenter.x + Math.cos(lerpAng) * horiz,
    pt.y,
    sphereCenter.z + Math.sin(lerpAng) * horiz
  );
}

// ── BUILD THREADS — max 19,500 segments
const NUM_LINES = 19500;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES); // category for opacity differentiation
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const qa = quantizeNearSphere(a);
  const qb = quantizeNearSphere(b);
  const idx = li * 6;
  positions[idx]=qa.x; positions[idx+1]=qa.y; positions[idx+2]=qa.z;
  positions[idx+3]=qb.x; positions[idx+4]=qb.y; positions[idx+5]=qb.z;
  const mx = (qa.x+qb.x)*0.5, my = (qa.y+qb.y)*0.5, mz = (qa.z+qb.z)*0.5;
  const dx = mx-sphereCenter.x, dy = my-sphereCenter.y, dz = mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  lineCat[li] = cat;
  li++;
}

// Cat A: CONVERGENCE — threads reaching toward the sphere
// ~52% of threads. Circulatory cosmos around the heart.
const catA = Math.floor(NUM_LINES * 0.52);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.4){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 12% stop short — threads that almost reach but fail (the gap)
  if(rng() < 0.12){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.25 + rng()*1.6));
    setLine(a, target, 0);
  } else {
    setLine(a, sphereSurf(), 0);
  }
}

// Cat B: STRUCTURAL WEB — anchor-to-anchor proximity
const THRESHOLD = 6.5;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.20);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 120000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;

  setLine(a, best, 1);
  catBcount++;

  // Dendritic branching — Y-forks
  if(rng() < 0.20 && li < NUM_LINES - 5){
    const mid = a.clone().lerp(best, 0.15 + rng()*0.55);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.25 + rng()*0.7));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 1);
      catBcount++;
      // Second generation
      if(rng() < 0.30 && li < NUM_LINES - 2){
        const mid2 = mid.clone().lerp(bEnd, 0.4 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.08 + rng()*0.35));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2, 1);
          catBcount++;
        }
      }
      // Third generation — finer tendrils
      if(rng() < 0.12 && li < NUM_LINES - 1){
        const mid3 = mid.clone().lerp(bEnd, 0.7 + rng()*0.2);
        const bDir3 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd3 = mid3.clone().add(bDir3.multiplyScalar(0.04 + rng()*0.2));
        if(!inVoid(bEnd3)){
          setLine(mid3, bEnd3, 1);
          catBcount++;
        }
      }
    }
  }
}

// Cat C: HALO — dense orbit threads wrapping tight around the sphere
const catC = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const dir1 = s1.clone().sub(sphereCenter).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.1 + rng()*1.8));
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.1 + rng()*1.8))
    .add(tangent.multiplyScalar(0.5 + rng()*1.5));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB, 2);
}

// Cat D: GRAVITY — vertical threads from sphere to floor
const catD = Math.floor(NUM_LINES * 0.04);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  if(sp.y > sphereCenter.y) sp.y = sphereCenter.y - (sp.y - sphereCenter.y);
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*2.5,
    -hh,
    sp.z + (rng()-0.5)*2.5
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 3);
}

// Cat E: LONG SPANS — wall-to-wall or wall-to-sphere, architectural web
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.45 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color for opacity differentiation via alpha in color
// Lia Halloran: sphere-converging 0.08, wall-to-wall 0.04, halo 0.06, local 0.05
const catOpacity = [0.075, 0.05, 0.065, 0.055, 0.04];
const colors = new Float32Array(li * 6);
const baseR = 0xc2/255, baseG = 0x00/255, baseB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.05;
  // Encode opacity variation via color brightness
  const bright = op / 0.075; // normalize to cat A
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = baseR * bright;
    colors[i*6+v*3+1] = baseG * bright;
    colors[i*6+v*3+2] = baseB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred matter, memory residue
const NUM_FRAGMENTS = 42;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.14;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.25 + rng()*0.55);
  const h = sz * (0.4 + rng()*1.0);
  const verts = new Float32Array([
    w*(-0.35+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.1-rng()*0.35), -h*0.5, 0,
    w*(-0.35+rng()*0.2), h*0.5, 0,
    w*(0.2+rng()*0.35), h*(rng()*0.06), 0,
    w*(0.1-rng()*0.35), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.08, d*0.03),
    transparent: true,
    opacity: 0.10 + rng()*0.28,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.65){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(1.8 + rng()*9.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate proximity to sphere
// Narrative arc: approach from above, descend into the web, orbit close,
// dip below to look up through the threads, rise again
const pathLen = 1200;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  // Breathing orbit — tighter, asymmetric, viewer inside the installation
  const rX = 4.5 + Math.sin(p * 0.6) * 1.8 + Math.cos(p * 1.1 + 0.5) * 0.5;
  const rZ = 6.0 + Math.cos(p * 0.4) * 2.2 + Math.sin(p * 0.8 + 1.2) * 0.6;

  const x = cx + Math.sin(p) * rX;
  // Vertical: slow descent, hover below, rise to look down — emotional pacing
  const yBase = cy + 0.3;
  const yWave = Math.sin(p * 0.3 + 0.6) * 5.5
    + Math.cos(p * 0.65 + 1.8) * 1.8
    + Math.sin(p * 1.2 + 3.0) * 0.4;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible, < 0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0004 * Math.max(0, 1.0 - dist / 32.0);
    const phase = basePositions[idx]*0.18 + basePositions[idx+1]*0.22 + i*0.0008;
    const breath = Math.sin(t*0.018 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.30;
      arr[vi+1] = basePositions[vi+1] + breath*0.20;
      arr[vi+2] = basePositions[vi+2] + breath*0.26;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0006;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — gravitational center, with subtle wander
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.002)*0.10;
  look.y += Math.cos(t*0.0018)*0.08;
  look.z += Math.sin(t*0.0024)*0.06;
  camera.lookAt(look);

  // Light drift — glacial
  pL.position.x = 2.0 + Math.sin(t*0.001)*0.35;
  pL.position.y = 18.0 + Math.cos(t*0.0008)*0.15;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
