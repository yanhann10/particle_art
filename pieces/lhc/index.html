<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lhc · attractor cycler · motion streaks</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cfe1d4; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .stage { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 11px; letter-spacing: 0.08em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">lhc</div>
<div class="hint">click to cycle stage · auto-cycles every 14s</div>
<div class="stage" id="stage">stage 1/4 · lorenz</div>
<div class="src">100k GPGPU · motion-aligned streaks</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const MODES = [
  { id: 'lorenz',    basinCenter: [0, 0, 27],  basinSize: 8,
    normCenter:[0, 0, 25],  normScale: 25,  pal: [[0.20,0.32,0.78],[0.85,0.32,0.62],[0.98,0.86,0.50]] },
  { id: 'aizawa',    basinCenter: [0.1, 0, 0], basinSize: 0.6,
    normCenter:[0, 0, 0],   normScale: 1.6, pal: [[0.20,0.62,0.45],[0.55,0.30,0.78],[0.92,0.95,0.98]] },
  { id: 'thomas',    basinCenter: [0.5, 0, 0.5], basinSize: 1.2,
    normCenter:[0, 0, 0],   normScale: 5.0, pal: [[0.92,0.55,0.20],[0.98,0.78,0.32],[0.55,0.20,0.05]] },
  { id: 'halvorsen', basinCenter: [-1, -1, -1], basinSize: 1.8,
    normCenter:[0, 0, 0],   normScale: 7.0, pal: [[0.42,0.78,0.92],[0.88,0.42,0.62],[0.92,0.92,0.85]] },
];

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);
// previous frame for velocity
let rtPrev = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(modeIdx){
  const m = MODES[modeIdx];
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    init[i*4]   = m.basinCenter[0] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+1] = m.basinCenter[1] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+2] = m.basinCenter[2] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture(0) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

function reinitTo(modeIdx){
  blitMat.uniforms.tex.value = makeInitTexture(modeIdx);
  renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(rtPrev); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(null);
}
reinitTo(0);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:   { value: 0.0 },
  uMode: { value: 0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform int uMode;
    varying vec2 vUv;

    vec3 lorenz(vec3 p){
      return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y - (8.0/3.0)*p.z);
    }
    vec3 aizawa(vec3 p){
      const float a=0.95, b=0.7, c=0.6, d=3.5, e=0.25, f=0.1;
      return vec3((p.z-b)*p.x - d*p.y, d*p.x + (p.z-b)*p.y,
                  c + a*p.z - p.z*p.z*p.z/3.0 - (p.x*p.x + p.y*p.y)*(1.0+e*p.z) + f*p.z*p.x*p.x*p.x);
    }
    vec3 thomasA(vec3 p){
      const float B = 0.208186;
      return vec3(sin(p.y)-B*p.x, sin(p.z)-B*p.y, sin(p.x)-B*p.z);
    }
    vec3 halvorsen(vec3 p){
      const float a = 1.4;
      return vec3(-a*p.x - 4.0*p.y - 4.0*p.z - p.y*p.y,
                  -a*p.y - 4.0*p.z - 4.0*p.x - p.z*p.z,
                  -a*p.z - 4.0*p.x - 4.0*p.y - p.x*p.x);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 dp;
      if (uMode == 0)      dp = lorenz(p);
      else if (uMode == 1) dp = aizawa(p);
      else if (uMode == 2) dp = thomasA(p);
      else                 dp = halvorsen(p);

      float dt = uDt;
      if (uMode == 0) dt *= 0.15;
      else if (uMode == 3) dt *= 0.4;

      p += dp * dt;
      age = mod(age + dt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ─────────────────────────── render scene ───────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.6, 5);
camera.lookAt(0, 0, 0);

// volumetric beam
const beamGeom = new THREE.ConeGeometry(1.2, 11, 24, 1, true);
beamGeom.translate(0, 5.5, 0);
const beamMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.85, 0.92, 1.0) } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vLocal; varying float vYNorm;
    void main(){ vLocal=position; vYNorm=position.y/11.0;
                 gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; uniform vec3 uColor;
    varying vec3 vLocal; varying float vYNorm;
    void main(){
      float radial = length(vec2(vLocal.x, vLocal.z));
      float r = 1.0 - smoothstep(0.0, 1.2*(1.0-vYNorm), radial);
      float vert = 1.0 - smoothstep(0.0, 1.0, vYNorm);
      float a = r * vert * 0.20 * (0.95 + 0.05*sin(uTime*0.7));
      gl_FragColor = vec4(uColor*a, a);
    }`
});
const beam = new THREE.Mesh(beamGeom, beamMat);
beam.position.set(-2.4, -3.0, -1.0);
beam.rotation.z = -0.18;
scene.add(beam);

// points geometry — using line segments for streaks
// We'll use instanced mesh with tiny quads, but simpler: use points with
// velocity direction passed as varying to shape the fragment
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    statePrev: { value: rtPrev.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uRes:   { value: new THREE.Vector2(innerWidth, innerHeight) },
    uPalA:  { value: new THREE.Vector3(...MODES[0].pal[0]) },
    uPalB:  { value: new THREE.Vector3(...MODES[0].pal[1]) },
    uPalC:  { value: new THREE.Vector3(...MODES[0].pal[2]) },
    uNormCenter: { value: new THREE.Vector3(...MODES[0].normCenter) },
    uNormScale:  { value: MODES[0].normScale },
    uFade:       { value: 1.0 },
    uBeamPos:    { value: new THREE.Vector3(-2.4, 0.0, -1.0) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform sampler2D statePrev;
    uniform float uPixel;
    uniform vec2  uRes;
    uniform vec3  uPalA, uPalB, uPalC;
    uniform vec3  uNormCenter;
    uniform float uNormScale;
    uniform float uFade;
    uniform vec3  uBeamPos;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vBeam;
    varying float vAlpha;
    varying float vFogDepth;
    varying vec2 vVelDir;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec4 sp = texture2D(statePrev, uvIdx);
      vec3 p = s.xyz;
      vec3 pp = sp.xyz;
      float age = s.w;

      vec3 disp = (p - uNormCenter) / uNormScale;
      vec3 dispPrev = (pp - uNormCenter) / uNormScale;

      // compute screen-space velocity direction
      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      vec4 mvPrev = modelViewMatrix * vec4(dispPrev, 1.0);
      vec4 clip = projectionMatrix * mv;
      vec4 clipPrev = projectionMatrix * mvPrev;
      vec2 screen = (clip.xy / clip.w) * uRes * 0.5;
      vec2 screenPrev = (clipPrev.xy / clipPrev.w) * uRes * 0.5;
      vec2 vel = screen - screenPrev;
      float spd = length(vel);
      vSpeed = min(spd, 12.0);
      vVelDir = spd > 0.01 ? vel / spd : vec2(0.0, 1.0);

      // beam proximity
      vec2 toBeam = disp.xz - vec2(uBeamPos.x, uBeamPos.z);
      float beamProx = exp(-dot(toBeam, toBeam) * 3.5);
      vBeam = beamProx;

      // palette
      float k = mod(age, 1.0);
      vec3 col = mix(uPalA, uPalB, smoothstep(0.0, 0.5, k));
      col = mix(col, uPalC, smoothstep(0.5, 1.0, k));
      col = mix(col, col*1.5 + vec3(0.05,0.08,0.12), beamProx*0.6);
      vCol = col;
      vAlpha = uFade;

      vFogDepth = -mv.z;
      // streak size: elongated based on speed
      float baseSize = (2.2 + 1.4 * beamProx) * uPixel * (3.0 / vFogDepth);
      gl_PointSize = baseSize + min(spd * 0.5, 6.0);
      gl_Position = clip;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vBeam;
    varying float vAlpha;
    varying float vFogDepth;
    varying vec2 vVelDir;
    varying float vSpeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;

      // rotate point coord into velocity-aligned frame
      vec2 dir = vVelDir;
      // d in velocity frame: along = dot(d, dir), across = cross(d, dir)
      float along = d.x * dir.x + d.y * dir.y;
      float across = d.x * dir.y - d.y * dir.x;

      // streak shape: elongated ellipse, aspect ratio based on speed
      float aspect = 1.0 + vSpeed * 0.35;
      float r = (along * along) / (aspect * aspect) + across * across;
      // sharper falloff for streak look
      float threshold = 0.06;
      if (r > threshold) discard;
      float a = exp(-r * 45.0);

      // depth fog
      float fogF = 1.0 - exp(-0.0035 * vFogDepth * vFogDepth);
      vec3 col = mix(vCol, vec3(0.025, 0.030, 0.040), fogF);
      // brighter core along the streak
      float core = exp(-across * across * 180.0);
      col += col * core * 0.3;
      gl_FragColor = vec4(col * a * (0.6 + vBeam*0.6) * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ─────────────────────────── mode-switch wipe ───────────────────────────
let mode = 0;
let switching = false;
let switchStartT = 0;
let switchTargetMode = 0;
const SWITCH_S = 1.4;

const stageEl = document.getElementById('stage');
function setStageText(){ stageEl.textContent = `stage ${mode+1}/4 · ${MODES[mode].id}`; }
setStageText();

function updateUniformsForMode(m){
  pointsMat.uniforms.uPalA.value.set(...MODES[m].pal[0]);
  pointsMat.uniforms.uPalB.value.set(...MODES[m].pal[1]);
  pointsMat.uniforms.uPalC.value.set(...MODES[m].pal[2]);
  pointsMat.uniforms.uNormCenter.value.set(...MODES[m].normCenter);
  pointsMat.uniforms.uNormScale.value = MODES[m].normScale;
  simUniforms.uMode.value = m;
}

function startSwitch(target){
  if (switching) return;
  switching = true;
  switchStartT = performance.now();
  switchTargetMode = target;
}

addEventListener('click', () => startSwitch((mode + 1) % MODES.length));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  pointsMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

setInterval(() => { if (!switching) startSwitch((mode + 1) % MODES.length); }, 14000);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  beamMat.uniforms.uTime.value = now / 1000;
  simUniforms.uDt.value = dt;

  if (switching){
    const u = (now - switchStartT) / (SWITCH_S * 1000);
    if (u < 0.5){
      pointsMat.uniforms.uFade.value = 1.0 - u * 2.0;
    } else if (u < 1.0){
      if (pointsMat.uniforms.uFade.value <= 0.05 && mode !== switchTargetMode){
        mode = switchTargetMode;
        updateUniformsForMode(mode);
        reinitTo(mode);
        setStageText();
      }
      pointsMat.uniforms.uFade.value = (u - 0.5) * 2.0;
    } else {
      pointsMat.uniforms.uFade.value = 1.0;
      switching = false;
    }
  }

  // save current state as previous before simulating
  // copy rtA → rtPrev
  blitMat.uniforms.tex.value = rtA.texture;
  renderer.setRenderTarget(rtPrev);
  renderer.render(blitScene, camOrtho);

  // sim 4 substeps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.statePrev.value = rtPrev.texture;

  // slow camera orbit
  const ang = now * 0.00018;
  camera.position.x = Math.sin(ang) * 5;
  camera.position.z = Math.cos(ang) * 5;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
