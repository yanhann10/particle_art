<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60o · critical climate stream · data reified as kinetic sculpture</title>
<!-- MOTION: flow, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050508; overflow:hidden;
               color:#4ac9d6; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">60o</div>
<div class="hint">drag to orbit · streams split at nodes labeled truth/distortion</div>
<div class="src">inspired by Gaëtan Robillard · Lumen Prize 2023 BCS Futures · Climate Misinformation Machine</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Climate-misinformation text streams reified as kinetic sculpture:
// - Vector field with labeled 'truth' (teal sphere) and 'distortion' (orange cube) nodes
// - Text glyphs (canvas sprites) flow along the field
// - Field bends near nodes: smooth laminar flow near truth, turbulent vortex near distortion
// - Streams split visibly — one branch stays clean, the other corrupts
// - Palette: instrument-panel teal on near-black, distortion node in warning orange

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050508, 0.018);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 12, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0x4ac9d6, 0.6);
lightKey.position.set(8, 14, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x0a0a12, 0.8));
const lightFill = new THREE.DirectionalLight(0xff6633, 0.3);
lightFill.position.set(-6, 4, -8);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 6, 0);

// ─────────── NODES (field attractors/repellers)
const truthNode = {
  pos: new THREE.Vector3(-4, 8, 2),
  type: 'truth',
  strength: 0.6,
  radius: 2.5
};
const distortionNode = {
  pos: new THREE.Vector3(5, 4, -3),
  type: 'distortion',
  strength: 1.2,
  radius: 3.0
};
const nodes = [truthNode, distortionNode];

// Truth node: transparent teal sphere with glyph label
const truthGeo = new THREE.SphereGeometry(0.6, 16, 12);
const truthMat = new THREE.MeshStandardMaterial({
  color: 0x4ac9d6, emissive: 0x1a4a52, transparent: true, opacity: 0.35, roughness: 0.3, metalness: 0.5
});
const truthMesh = new THREE.Mesh(truthGeo, truthMat);
truthMesh.position.copy(truthNode.pos);
scene.add(truthMesh);

// Distortion node: transparent orange cube
const distGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
const distMat = new THREE.MeshStandardMaterial({
  color: 0xff6633, emissive: 0x4a1a0a, transparent: true, opacity: 0.4, roughness: 0.4, metalness: 0.6
});
const distMesh = new THREE.Mesh(distGeo, distMat);
distMesh.position.copy(distortionNode.pos);
scene.add(distMesh);

// Add wire-frame cages around nodes for instrument-panel aesthetic
const truthWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(truthGeo),
  new THREE.LineBasicMaterial({ color: 0x4ac9d6, opacity: 0.5, transparent: true })
);
truthWire.position.copy(truthNode.pos);
scene.add(truthWire);
const distWire = new THREE.LineSegments(
  new THREE.EdgesGeometry(distGeo),
  new THREE.LineBasicMaterial({ color: 0xff6633, opacity: 0.6, transparent: true })
);
distWire.position.copy(distortionNode.pos);
scene.add(distWire);

// ─────────── TEXT CORPUS (climate-misinformation terms)
const corpus = [
  '2.1°C', 'DATA', 'HOAX', 'CONSENSUS', 'CHERRY-PICK', '97%', 'MODELS',
  'FUNDING', 'AGENDA', 'CYCLICAL', 'CO₂', 'NATURAL', 'POLAR', 'FAKE',
  'RECORD', 'SUNSPOTS', 'GRANT', 'BIAS', 'WARMING', 'ICE', 'MELT',
  'PAUSE', 'HIDE', 'DECLINE', 'URBAN', 'HEAT', 'ISLAND', 'PROXY'
];

// ─────────── GLYPH SPRITE GENERATOR (canvas-based text)
function makeGlyphSprite(text, color) {
  const canvas = document.createElement('canvas');
  const size = 128;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, size, size);
  ctx.font = 'bold 18px ui-monospace, monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, size/2, size/2);
  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.85 });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(1.2, 1.2, 1);
  return sprite;
}

// ─────────── PARTICLE STREAM SYSTEM
// Each particle: {pos, vel, glyph (sprite), age, corruption (0=clean, 1=turbulent)}
const particles = [];
const MAX_PARTICLES = 180;
const SPAWN_RATE = 3; // per frame

function spawnParticle() {
  if (particles.length >= MAX_PARTICLES) return;
  const text = corpus[Math.floor(Math.random() * corpus.length)];
  const sprite = makeGlyphSprite(text, '#4ac9d6');
  scene.add(sprite);
  const theta = Math.random() * Math.PI * 2;
  const r = 2 + Math.random() * 1.5;
  particles.push({
    pos: new THREE.Vector3(Math.cos(theta)*r, 0.5 + Math.random()*0.5, Math.sin(theta)*r),
    vel: new THREE.Vector3(0, 0.08, 0),
    glyph: sprite,
    age: 0,
    corruption: 0
  });
}

// Vector field: blend base upward flow + node influences
function evalField(pos, t) {
  let fx = 0, fy = 0.06, fz = 0; // base upward drift
  for (const node of nodes) {
    const delta = new THREE.Vector3().subVectors(pos, node.pos);
    const dist = delta.length();
    if (dist < 0.1) continue;
    const falloff = Math.max(0, 1 - dist / node.radius);
    if (node.type === 'truth') {
      // Attractor: smooth inward pull
      const strength = node.strength * falloff * 0.05;
      fx -= delta.x * strength;
      fy -= delta.y * strength;
      fz -= delta.z * strength;
    } else {
      // Repeller + vortex: turbulent spiral
      const strength = node.strength * falloff * 0.08;
      const cross = new THREE.Vector3(delta.z, 0, -delta.x).normalize();
      fx += (delta.x * strength * 1.2 + cross.x * strength * 1.5);
      fy += delta.y * strength * 0.3;
      fz += (delta.z * strength * 1.2 + cross.z * strength * 1.5);
    }
  }
  // Add time-dependent curl noise for organic flow
  const curl = Math.sin(pos.x * 0.4 + t * 0.3) * Math.cos(pos.z * 0.4 - t * 0.2) * 0.015;
  fx += curl * Math.cos(t * 0.5);
  fz += curl * Math.sin(t * 0.5);
  return new THREE.Vector3(fx, fy, fz);
}

function updateParticles(t) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const field = evalField(p.pos, t);
    p.vel.add(field);
    p.vel.multiplyScalar(0.98); // drag
    p.pos.add(p.vel);
    p.age += 0.016;
    
    // Corruption accumulation near distortion node
    const distToDist = p.pos.distanceTo(distortionNode.pos);
    if (distToDist < distortionNode.radius) {
      const corrupt = 1 - distToDist / distortionNode.radius;
      p.corruption = Math.min(1, p.corruption + corrupt * 0.04);
    }
    
    // Update glyph sprite position + color shift by corruption
    p.glyph.position.copy(p.pos);
    const cleanColor = new THREE.Color(0x4ac9d6);
    const corruptColor = new THREE.Color(0xff6633);
    const blended = cleanColor.lerp(corruptColor, p.corruption);
    p.glyph.material.color.copy(blended);
    p.glyph.material.opacity = 0.85 * (1 - p.age / 12);
    
    // Cull old or out-of-bounds
    if (p.age > 12 || p.pos.y > 20 || p.pos.length() > 35) {
      scene.remove(p.glyph);
      p.glyph.material.map.dispose();
      p.glyph.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─────────── TRANSPARENT GEOMETRIC VOLUMES (data-cage aesthetic)
// Add a few semi-transparent polyhedra scattered in space to anchor the composition
function addCage(pos, size, color, opacity) {
  const geo = new THREE.IcosahedronGeometry(size, 0);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.2,
    transparent: true, opacity, roughness: 0.5, metalness: 0.3, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  scene.add(mesh);
  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, opacity: opacity * 1.5, transparent: true })
  );
  wire.position.copy(pos);
  scene.add(wire);
}
addCage(new THREE.Vector3(0, 10, 0), 2.5, 0x1a3a44, 0.12);
addCage(new THREE.Vector3(-6, 5, -5), 1.8, 0x2a1a0a, 0.10);
addCage(new THREE.Vector3(8, 7, 4), 2.0, 0x1a2a3a, 0.11);

// ─────────── SPLINE VISUALIZATION (field lines)
// Draw a few representative streamlines from spawn zone upward to show the split
function drawStreamline(startPos, color, steps) {
  const points = [];
  let p = startPos.clone();
  for (let s = 0; s < steps; s++) {
    points.push(p.clone());
    const f = evalField(p, 0);
    p.add(f.multiplyScalar(0.4));
  }
  const curve = new THREE.CatmullRomCurve3(points, false);
  const tubeGeo = new THREE.TubeGeometry(curve, steps, 0.02, 4, false);
  const tubeMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  scene.add(tube);
}
drawStreamline(new THREE.Vector3(2, 0.5, 0), 0x4ac9d6, 80);
drawStreamline(new THREE.Vector3(-2, 0.5, 1), 0x4ac9d6, 80);
drawStreamline(new THREE.Vector3(0, 0.5, -2), 0xff6633, 70);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let frameCount = 0;
function loop() {
  const t = (performance.now() - start) / 1000;
  frameCount++;
  
  // Spawn particles
  if (frameCount % 2 === 0) {
    for (let s = 0; s < SPAWN_RATE; s++) spawnParticle();
  }
  
  updateParticles(t);
  
  // Rotate node indicators slowly
  truthMesh.rotation.y += 0.003;
  truthWire.rotation.y += 0.003;
  distMesh.rotation.x += 0.004;
  distMesh.rotation.y += 0.005;
  distWire.rotation.x += 0.004;
  distWire.rotation.y += 0.005;
  
  // Track particle centroid for camera
  if (particles.length > 0) {
    let cx = 0, cy = 0, cz = 0;
    for (const p of particles) {
      cx += p.pos.x; cy += p.pos.y; cz += p.pos.z;
    }
    cx /= particles.length; cy /= particles.length; cz /= particles.length;
    const targetY = Math.max(cy, 6);
    controls.target.y += (targetY - controls.target.y) * 0.02;
  }
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
