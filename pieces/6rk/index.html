<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6rk · streamlines (Tyler Hobbs)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4ede3; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#3d3028; }
</style>
</head>
<body>
<div class="id">6rk</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Tyler Hobbs approach: structured flow field with non-crossing streamlines,
// warm earth palette, compositional grouping, significant negative space.
// 8 color regions, each with ~800 particles following smooth paths.

const W = 40, H = 40;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede3, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-8, 8, 8 * innerHeight/innerWidth, -8 * innerHeight/innerWidth, 0.01, 100);
camera.position.z = 10;
camera.lookAt(0, 0, 0);

// 8 color regions — earth tones + one cool accent
const regions = [
  { center: new THREE.Vector2(-4.5, 3.0), radius: 2.2, color: new THREE.Color(0x6b4423) }, // raw umber
  { center: new THREE.Vector2(1.2, 4.5), radius: 1.8, color: new THREE.Color(0xc65d3b) }, // terracotta
  { center: new THREE.Vector2(4.8, 1.2), radius: 2.0, color: new THREE.Color(0xd4a373) }, // ochre
  { center: new THREE.Vector2(-2.0, -1.5), radius: 2.5, color: new THREE.Color(0x8b4513) }, // saddle brown
  { center: new THREE.Vector2(2.5, -3.8), radius: 1.6, color: new THREE.Color(0xa0522d) }, // sienna
  { center: new THREE.Vector2(-5.2, -4.0), radius: 1.9, color: new THREE.Color(0x964B00) }, // oxide red
  { center: new THREE.Vector2(5.5, -4.2), radius: 1.5, color: new THREE.Color(0x483C32) }, // taupe
  { center: new THREE.Vector2(-1.0, 1.2), radius: 1.3, color: new THREE.Color(0x4a7c7e) }  // teal accent
];

// Assign each particle to a region
const assignments = [];
for (let i = 0; i < N; i++) {
  const rx = (Math.random() - 0.5) * 16;
  const ry = (Math.random() - 0.5) * 16;
  let bestRegion = 0;
  let bestDist = 1e9;
  for (let r = 0; r < regions.length; r++) {
    const dx = rx - regions[r].center.x;
    const dy = ry - regions[r].center.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d < bestDist) {
      bestDist = d;
      bestRegion = r;
    }
  }
  // Only spawn if within region radius (creates negative space)
  if (bestDist < regions[bestRegion].radius) {
    assignments.push({ region: bestRegion, x: rx, y: ry });
  }
}

// Flow field: curl noise derivative + radial bias away from region centers
function flowField(x, y) {
  const freq = 0.8;
  const nx = x * freq;
  const ny = y * freq;
  
  // Curl noise approximation via offset sampling
  const eps = 0.01;
  const n1 = Math.sin(nx * 2.1 + Math.cos(ny * 1.7)) * Math.cos(ny * 2.3);
  const n2 = Math.sin((nx+eps) * 2.1 + Math.cos(ny * 1.7)) * Math.cos(ny * 2.3);
  const n3 = Math.sin(nx * 2.1 + Math.cos((ny+eps) * 1.7)) * Math.cos((ny+eps) * 2.3);
  
  const dx = (n3 - n1) / eps;
  const dy = -(n2 - n1) / eps;
  
  // Add slow radial drift away from nearest region center
  let closestRegion = regions[0];
  let minDist = 1e9;
  for (const r of regions) {
    const d = Math.hypot(x - r.center.x, y - r.center.y);
    if (d < minDist) {
      minDist = d;
      closestRegion = r;
    }
  }
  const rx = x - closestRegion.center.x;
  const ry = y - closestRegion.center.y;
  const rd = Math.max(0.01, Math.hypot(rx, ry));
  
  return {
    x: dx * 0.7 + (rx / rd) * 0.15,
    y: dy * 0.7 + (ry / rd) * 0.15
  };
}

// Particle state
const particles = assignments.map(a => ({
  x: a.x,
  y: a.y,
  region: a.region,
  age: Math.random(),
  trail: [] // store last 40 positions
}));

// Lines for streamlines
const lineMaterials = regions.map(r => 
  new THREE.LineBasicMaterial({ 
    color: r.color, 
    opacity: 0.65, 
    transparent: true,
    linewidth: 1
  })
);

const lineGroups = regions.map(() => new THREE.Group());
lineGroups.forEach(g => scene.add(g));

// Update trails and render
function updateParticles(dt) {
  for (const p of particles) {
    const flow = flowField(p.x, p.y);
    p.x += flow.x * dt * 0.08;
    p.y += flow.y * dt * 0.08;
    p.age += dt * 0.02;
    
    // Keep in bounds with soft wrap
    if (Math.abs(p.x) > 9) p.x *= 0.95;
    if (Math.abs(p.y) > 9) p.y *= 0.95;
    
    // Store trail
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 40) p.trail.shift();
  }
  
  // Rebuild line geometries every 3 frames (performance)
  if (Math.random() < 0.33) {
    lineGroups.forEach(g => {
      g.children.forEach(c => {
        c.geometry.dispose();
      });
      g.clear();
    });
    
    for (const p of particles) {
      if (p.trail.length < 2) continue;
      
      const points = p.trail.map(t => new THREE.Vector3(t.x, t.y, 0));
      const geom = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geom, lineMaterials[p.region]);
      lineGroups[p.region].add(line);
    }
  }
}

// Dots at particle heads
const dotGeom = new THREE.CircleGeometry(0.08, 8);
const dotMeshes = particles.map(p => {
  const mat = new THREE.MeshBasicMaterial({ 
    color: regions[p.region].color.clone().multiplyScalar(1.3),
    transparent: true,
    opacity: 0.85
  });
  const mesh = new THREE.Mesh(dotGeom, mat);
  mesh.position.set(p.x, p.y, 0.01);
  scene.add(mesh);
  return mesh;
});

addEventListener('resize', () => {
  camera.right = 8;
  camera.left = -8;
  camera.top = 8 * innerHeight / innerWidth;
  camera.bottom = -8 * innerHeight / innerWidth;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min((now - t0) * 0.001, 0.1);
  t0 = now;
  
  updateParticles(dt);
  
  // Update dot positions
  particles.forEach((p, i) => {
    dotMeshes[i].position.x = p.x;
    dotMeshes[i].position.y = p.y;
  });
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
