<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: ascend, intensity: gentle -->
<title>llh · Shiota web — threads releasing upward</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">llh</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.038);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x221111, 0.7);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.5);
dirLight.position.set(-3, 8, 2);
scene.add(dirLight);

// Warm uplight from below — amber glow on ascending threads
const upLight = new THREE.PointLight(0xd4a060, 0.4, 30);
upLight.position.set(2.8, -4, -3);
scene.add(upLight);

// ── Deterministic RNG
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Suspended sphere — the still center, anchor that remains
const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(2.8, 0.6, -3.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.35,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.85
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── Room geometry for wall anchors
const ROOM = { w: 18, h: 12, d: 28 };
const anchors = [];

function wallPoint(){
  const face = Math.floor(rng() * 6);
  let x, y, z;
  const hw = ROOM.w / 2, hh = ROOM.h / 2, hd = ROOM.d / 2;
  switch(face){
    case 0: x = -hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 1: x =  hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 2: y = -hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 3: y =  hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 4: z = -hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
    case 5: z =  hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

const NUM_ANCHORS = 600;
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.1 + rng() * 2.5;
    const p = sphereCenter.clone().add(dir.multiplyScalar(dist));
    anchors.push(p);
  } else {
    anchors.push(wallPoint());
  }
}

// ── Build line segments
const NUM_LINES = 20000;
const linePositions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurfacePoint(from){
  const dir = sphereCenter.clone().sub(from).normalize();
  return sphereCenter.clone().add(dir.multiplyScalar(-sphereRadius * (0.98 + rng()*0.04)));
}

// Category 1: wall-to-wall threads (~40%)
const catA = Math.floor(NUM_LINES * 0.4);
for (let i = 0; i < catA && li < NUM_LINES; i++){
  const a = wallPoint();
  const b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereCenter) > 12 && rng() > 0.3) { i--; continue; }
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  li++;
}

// Category 2: threads converging on sphere (~35%)
const catB = Math.floor(NUM_LINES * 0.35);
for (let i = 0; i < catB && li < NUM_LINES; i++){
  const a = anchors[Math.floor(rng() * anchors.length)];
  const nearSphere = sphereSurfacePoint(a);
  nearSphere.x += (rng()-0.5) * 0.5;
  nearSphere.y += (rng()-0.5) * 0.5;
  nearSphere.z += (rng()-0.5) * 0.5;
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = nearSphere.x; linePositions[idx+4] = nearSphere.y; linePositions[idx+5] = nearSphere.z;
  li++;
}

// Category 3: short local threads (~25%)
const catC = NUM_LINES - li;
for (let i = 0; i < catC && li < NUM_LINES; i++){
  const ai = Math.floor(rng() * anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 8; j++){
    const bi = Math.floor(rng() * anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.2){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) best = wallPoint();
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = best.x; linePositions[idx+4] = best.y; linePositions[idx+5] = best.z;
  li++;
}

const basePositions = new Float32Array(linePositions);

// ── Per-vertex ascension parameters
// Each vertex has a unique ascension rate, delay, and detach threshold
const vertexCount = li * 2;
const ascendRate = new Float32Array(vertexCount);    // units/sec upward
const ascendDelay = new Float32Array(vertexCount);   // seconds before ascension begins
const ascendJitterX = new Float32Array(vertexCount); // gentle lateral drift
const ascendJitterZ = new Float32Array(vertexCount);
const vertexDetached = new Float32Array(vertexCount); // 0 = tethered, 1 = will detach

// Seed: threads below sphere detach first, threads above later
// Creates a wave of release rising from floor to ceiling
for (let i = 0; i < vertexCount; i++){
  const baseY = basePositions[i * 3 + 1];
  const distToSphere = Math.sqrt(
    (basePositions[i*3] - sphereCenter.x)**2 +
    (basePositions[i*3+1] - sphereCenter.y)**2 +
    (basePositions[i*3+2] - sphereCenter.z)**2
  );

  // Vertices near sphere stay tethered longer (the web clings to what it holds)
  // Vertices far from sphere and below it release first
  const nearSphere = distToSphere < sphereRadius + 2.0;

  if (nearSphere) {
    ascendRate[i] = 0.005 + rng() * 0.015; // very slow near sphere
    ascendDelay[i] = 25 + rng() * 40;       // long delay
    vertexDetached[i] = rng() < 0.3 ? 1 : 0;
  } else {
    // Normalize y position: lower = earlier release
    const yNorm = (baseY + ROOM.h/2) / ROOM.h; // 0 at floor, 1 at ceiling
    ascendRate[i] = 0.02 + rng() * 0.06;
    ascendDelay[i] = yNorm * 30 + rng() * 15;   // floor threads go first
    vertexDetached[i] = rng() < 0.7 ? 1 : 0;
  }

  // Gentle lateral wander — each thread drifts slightly sideways as it rises
  const wanderAngle = rng() * Math.PI * 2;
  ascendJitterX[i] = Math.cos(wanderAngle) * (0.003 + rng() * 0.008);
  ascendJitterZ[i] = Math.sin(wanderAngle) * (0.003 + rng() * 0.008);
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Dark fragments — these will ascend too, like released memories
const NUM_FRAGMENTS = 22;
const fragments = [];
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.05 + rng() * 0.15;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(size, size * (0.3 + rng()*1.4), size * (0.3 + rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04 + rng()*0.06, 0.02 + rng()*0.03, 0.02 + rng()*0.02),
    transparent: true,
    opacity: 0.6 + rng() * 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = rng();
  const segIdx = Math.floor(rng() * li) * 6;
  mesh.position.set(
    basePositions[segIdx] * (1-t) + basePositions[segIdx+3] * t,
    basePositions[segIdx+1] * (1-t) + basePositions[segIdx+4] * t,
    basePositions[segIdx+2] * (1-t) + basePositions[segIdx+5] * t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);

  // Fragment ascension: each fragment rises at its own pace
  const fragDistToSphere = mesh.position.distanceTo(sphereCenter);
  fragments.push({
    mesh,
    baseY: mesh.position.y,
    rate: 0.015 + rng() * 0.045,
    delay: (fragDistToSphere < 4 ? 20 : 5) + rng() * 25,
    driftX: (rng() - 0.5) * 0.006,
    driftZ: (rng() - 0.5) * 0.006,
    rotSpeed: (rng() - 0.5) * 0.15
  });
}

// ── Faint rising dust motes — atmospheric particles ascending
const dustCount = 400;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustBaseY = new Float32Array(dustCount);
const dustRate = new Float32Array(dustCount);
const dustPhase = new Float32Array(dustCount);
for (let i = 0; i < dustCount; i++){
  dustPos[i*3]   = (rng()-0.5) * ROOM.w * 0.7;
  dustPos[i*3+1] = (rng()-0.5) * ROOM.h;
  dustPos[i*3+2] = sphereCenter.z + (rng()-0.5) * 14;
  dustBaseY[i] = dustPos[i*3+1];
  dustRate[i] = 0.04 + rng() * 0.12;
  dustPhase[i] = rng() * Math.PI * 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xd4a874,
  size: 0.04,
  transparent: true,
  opacity: 0.12,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const dustMotes = new THREE.Points(dustGeo, dustMat);
scene.add(dustMotes);

// ── Camera: slow upward drift, tracking the ascending centroid
const camStart = new THREE.Vector3(
  sphereCenter.x + 6.5,
  sphereCenter.y - 0.5,
  sphereCenter.z + 3
);
camera.position.copy(camStart);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Compute ascending centroid for camera tracking
function computeAscendCentroid(elapsed){
  // Weighted average of where detached threads have drifted
  let sumY = 0, count = 0;
  for (let i = 0; i < vertexCount; i += 40){ // sample every 40th vertex
    if (vertexDetached[i] > 0.5 && elapsed > ascendDelay[i]){
      const dt = elapsed - ascendDelay[i];
      sumY += basePositions[i*3+1] + dt * ascendRate[i];
      count++;
    }
  }
  const avgRise = count > 0 ? sumY / count : sphereCenter.y;
  // Blend between sphere center and ascending mass
  const blend = Math.min(1, count / 50);
  return sphereCenter.y * (1 - blend * 0.3) + avgRise * blend * 0.3;
}

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // ── Thread ascension: vertices lift based on delay and rate
  const posAttr = lineGeo.attributes.position;
  const arr = posAttr.array;
  for (let i = 0; i < li * 2; i++){
    const i3 = i * 3;
    const bx = basePositions[i3];
    const by = basePositions[i3+1];
    const bz = basePositions[i3+2];

    if (vertexDetached[i] > 0.5 && elapsed > ascendDelay[i]){
      // This vertex is ascending
      const dt = elapsed - ascendDelay[i];
      // Ease in: slow start, then steady rise
      const easeIn = 1 - Math.exp(-dt * 0.15);
      const rise = dt * ascendRate[i] * easeIn;
      // Gentle lateral wander
      const wx = Math.sin(elapsed * 0.2 + bx * 0.3) * ascendJitterX[i] * dt;
      const wz = Math.cos(elapsed * 0.17 + bz * 0.4) * ascendJitterZ[i] * dt;

      arr[i3]   = bx + wx;
      arr[i3+1] = by + rise;
      arr[i3+2] = bz + wz;
    } else {
      // Still tethered — subtle breathing only
      const phase = bx * 0.7 + by * 1.1 + bz * 0.5;
      const b = Math.sin(elapsed * 0.3 + phase) * 0.01;
      arr[i3]   = bx + b;
      arr[i3+1] = by + b * 0.7;
      arr[i3+2] = bz + b * 0.5;
    }
  }
  posAttr.needsUpdate = true;

  // ── Fragment ascension
  for (const f of fragments){
    if (elapsed > f.delay){
      const dt = elapsed - f.delay;
      const easeIn = 1 - Math.exp(-dt * 0.12);
      f.mesh.position.y = f.baseY + dt * f.rate * easeIn;
      f.mesh.position.x += f.driftX * easeIn * 0.3;
      f.mesh.position.z += f.driftZ * easeIn * 0.3;
      // Slow contemplative tumble as they rise
      f.mesh.rotation.x += f.rotSpeed * 0.016 * easeIn;
      f.mesh.rotation.z += f.rotSpeed * 0.008 * easeIn;
    }
  }

  // ── Dust motes ascending continuously (loop when they reach top)
  const dArr = dustGeo.attributes.position.array;
  for (let i = 0; i < dustCount; i++){
    const newY = dustBaseY[i] + (elapsed * dustRate[i] + dustPhase[i]) % (ROOM.h * 1.2) - ROOM.h * 0.1;
    dArr[i*3+1] = newY;
    // Gentle sinusoidal lateral drift
    dArr[i*3] += Math.sin(elapsed * 0.1 + dustPhase[i]) * 0.0003;
  }
  dustGeo.attributes.position.needsUpdate = true;

  // ── Camera: slow upward drift + gentle orbit, tracking the rising mass
  const ascendY = computeAscendCentroid(elapsed);
  const camAngle = elapsed * 0.012; // very slow orbit
  const camRadius = 7.0 - Math.min(elapsed * 0.005, 1.0); // slowly tighten
  const camRise = Math.min(elapsed * 0.02, 4.0); // camera rises with the threads

  camera.position.set(
    sphereCenter.x + Math.cos(camAngle) * camRadius,
    sphereCenter.y + camRise + Math.sin(elapsed * 0.015) * 0.8,
    sphereCenter.z + Math.sin(camAngle) * camRadius
  );

  // Look: blend between sphere (anchor) and ascending centroid
  const lookBlend = Math.min(elapsed / 60, 0.4); // gradually look more upward
  const lookY = sphereCenter.y * (1 - lookBlend) + ascendY * lookBlend;
  camera.lookAt(
    sphereCenter.x + Math.sin(elapsed * 0.025) * 0.3,
    lookY,
    sphereCenter.z
  );

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
