<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o50 · critical foliage machine</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">o50</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Folded Leaf Geometry Builder ── */
function createFoldedLeaf(width, length, curvature, veinTwist, segments = 32){
  const positions = [];
  const uvs = [];
  const indices = [];
  
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const x = (t - 0.5) * width;
    const y = t * length;
    
    // Parabolic taper toward tip
    const taper = 1.0 - Math.pow(t, 1.6) * 0.75;
    const xTapered = x * taper;
    
    // Curl along length — leaf curling inward
    const curlAngle = curvature * t * t;
    const curlRadius = width * 0.5;
    const curlX = xTapered * Math.cos(curlAngle);
    const curlZ = xTapered * Math.sin(curlAngle);
    
    // Twist along the vein axis
    const twistAngle = veinTwist * t;
    const ct = Math.cos(twistAngle);
    const st = Math.sin(twistAngle);
    const finalX = curlX * ct - curlZ * st;
    const finalZ = curlX * st + curlZ * ct;
    
    positions.push(finalX, y, finalZ);
    uvs.push(t, (x / width) + 0.5);
    
    if (i < segments){
      const base = i;
      indices.push(base, base + 1, base);
    }
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

/* ── Particle Text Glyph System (climate data streams) ── */
const CLIMATE_GLYPHS = [
  '+1.5°C', '+2.8°C', '410ppm', '420ppm', 'CO₂↑', 'CH₄↑',
  '2050', '2100', 'TRUTH', 'MODEL', 'DATA', 'CLAIM',
  'IPCC', 'RCP8.5', 'SSP5', 'NET-ZERO', 'OFFSET',
  'FOREST', 'CARBON', 'SINK', 'SOURCE', 'TIPPING'
];

function generateTextParticles(count, bounds){
  const positions = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  const glyphIDs = new Float32Array(count);
  const streamIDs = new Float32Array(count); // 0=truth stream, 1=distortion stream
  
  for (let i = 0; i < count; i++){
    const stream = Math.random() < 0.5 ? 0 : 1;
    streamIDs[i] = stream;
    
    // Truth stream: left side, calm flow
    // Distortion stream: right side, turbulent
    if (stream === 0){
      positions[i*3]   = bounds.xMin + Math.random() * (bounds.xMid - bounds.xMin);
      positions[i*3+1] = bounds.yMin + Math.random() * (bounds.yMax - bounds.yMin);
      positions[i*3+2] = (Math.random() - 0.5) * bounds.zSpread * 0.6;
    } else {
      positions[i*3]   = bounds.xMid + Math.random() * (bounds.xMax - bounds.xMid);
      positions[i*3+1] = bounds.yMin + Math.random() * (bounds.yMax - bounds.yMin);
      positions[i*3+2] = (Math.random() - 0.5) * bounds.zSpread;
    }
    
    seeds[i] = Math.random();
    glyphIDs[i] = Math.floor(Math.random() * CLIMATE_GLYPHS.length);
  }
  
  return { positions, seeds, glyphIDs, streamIDs };
}

/* ── Scene Setup ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0e, 0.015);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 1, 0);
controls.minDistance = 8;
controls.maxDistance = 30;

/* ── Lighting ── */
const keyLight = new THREE.DirectionalLight(0x4a9fb5, 1.2);
keyLight.position.set(-4, 6, 3);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x1a2a35, 0.6);
fillLight.position.set(3, 2, -4);
scene.add(fillLight);

const ambientLight = new THREE.AmbientLight(0x0e1820, 0.3);
scene.add(ambientLight);

/* ── Create Folded Leaf Cluster ── */
const leafGroup = new THREE.Group();

const leafConfigs = [
  // center large fern-uncurling
  { width: 2.2, length: 5.5, curvature: 1.8, veinTwist: 0.9, pos: [0, 0, 0], rot: [0, 0, 0], color: 0x78a385 },
  // left palm-frond twist
  { width: 1.6, length: 4.2, curvature: -2.2, veinTwist: -1.3, pos: [-2.5, 0.8, 0.5], rot: [0.3, -0.6, 0.2], color: 0x5d8a6f },
  // right autumn-curl
  { width: 1.8, length: 4.8, curvature: 2.5, veinTwist: 1.6, pos: [2.3, 0.5, -0.3], rot: [-0.2, 0.8, -0.3], color: 0x8b9a7e },
  // upper-left smaller twist
  { width: 1.3, length: 3.5, curvature: -1.6, veinTwist: 1.1, pos: [-1.8, 2.5, 0.8], rot: [0.5, -0.4, 0.4], color: 0x6a9076 },
  // lower-right tight curl
  { width: 1.5, length: 3.8, curvature: 3.0, veinTwist: -1.8, pos: [1.9, -1.2, 0.6], rot: [-0.4, 0.6, 0.5], color: 0x748c7a },
  // back layer soft wave
  { width: 1.7, length: 4.5, curvature: 1.2, veinTwist: 0.6, pos: [0.3, 1.8, -1.5], rot: [0.1, 0.2, -0.1], color: 0x829888 },
  // forward accent leaf
  { width: 1.4, length: 3.6, curvature: -2.0, veinTwist: 1.4, pos: [-0.8, -0.5, 1.8], rot: [0.3, 0.3, -0.2], color: 0x6f957d },
];

leafConfigs.forEach(cfg => {
  const geom = createFoldedLeaf(cfg.width, cfg.length, cfg.curvature, cfg.veinTwist);
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color,
    roughness: 0.75,
    metalness: 0.15,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.88,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(...cfg.pos);
  mesh.rotation.set(...cfg.rot);
  leafGroup.add(mesh);
});

scene.add(leafGroup);

/* ── Text Particle Stream (climate data flow) ── */
const TEXT_COUNT = 1800;
const bounds = {
  xMin: -8, xMid: 0, xMax: 8,
  yMin: -3, yMax: 6,
  zSpread: 5
};

const textData = generateTextParticles(TEXT_COUNT, bounds);
const textGeom = new THREE.BufferGeometry();
textGeom.setAttribute('position', new THREE.BufferAttribute(textData.positions, 3));
textGeom.setAttribute('seed', new THREE.BufferAttribute(textData.seeds, 1));
textGeom.setAttribute('glyphID', new THREE.BufferAttribute(textData.glyphIDs, 1));
textGeom.setAttribute('streamID', new THREE.BufferAttribute(textData.streamIDs, 1));

const textUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uTruthBend: { value: 0 },
  uDistortionBend: { value: 0 },
};

const textMat = new THREE.ShaderMaterial({
  uniforms: textUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uTruthBend;
    uniform float uDistortionBend;
    attribute float seed;
    attribute float glyphID;
    attribute float streamID;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      
      // Flow direction: upward
      p.y += uTime * (0.6 + seed * 0.4);
      p.y = mod(p.y + 3.0, 9.0) - 3.0;
      
      // Truth stream (left): calm, teal, organized
      if (streamID < 0.5){
        float bend = uTruthBend;
        p.x += sin(p.y * 0.5 + t * 0.3) * 0.4 * bend;
        p.z += cos(p.y * 0.4 + t * 0.25) * 0.3 * bend;
        vCol = vec3(0.29, 0.62, 0.71); // instrument teal
        vAlpha = 0.65 + 0.25 * sin(t);
      }
      // Distortion stream (right): turbulent, orange-red, chaotic
      else {
        float bend = uDistortionBend;
        float chaos = 2.5 * bend;
        p.x += sin(p.y * 1.8 + t * 1.2 + seed * 10.0) * chaos;
        p.z += cos(p.y * 2.1 + t * 0.9 + seed * 8.0) * chaos;
        // Turbulent drift outward
        p.x += sign(p.x) * bend * 0.8;
        vCol = vec3(0.85, 0.45, 0.28); // alarm orange
        vAlpha = 0.5 + 0.4 * sin(t * 1.3);
      }
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 2.8 * uPixel * (32.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      
      // Square glyph hint
      float box = max(abs(d.x), abs(d.y)) * 2.0;
      float alpha = smoothstep(0.5, 0.3, box) * vAlpha;
      
      gl_FragColor = vec4(vCol * alpha, alpha);
    }
  `
});

const textPoints = new THREE.Points(textGeom, textMat);
scene.add(textPoints);

/* ── Animation Loop ── */
const centroid = new THREE.Vector3();
const targetCentroid = new THREE.Vector3(0, 1, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  textUniforms.uTime.value = elapsed;
  
  // Bend modulation: truth stream stays calm, distortion ramps up
  textUniforms.uTruthBend.value = 0.3 + 0.2 * Math.sin(elapsed * 0.15);
  textUniforms.uDistortionBend.value = 0.6 + 0.35 * Math.sin(elapsed * 0.22 + 1.5);
  
  // Gentle leaf cluster breathing
  leafGroup.rotation.y = Math.sin(elapsed * 0.08) * 0.12;
  leafGroup.scale.setScalar(1.0 + Math.sin(elapsed * 0.11) * 0.03);
  
  // Camera tracks centroid with slight drift
  leafGroup.getWorldPosition(centroid);
  targetCentroid.lerp(centroid, 0.02);
  controls.target.lerp(targetCentroid, 0.04);
  controls.update();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
