<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5dm · concentric shells · interference spheres</title>
<!-- MOTION: rotation, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">5dm</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 15, 75);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// Shell configuration
// Radii, colors, rotation speeds (rad/s), rotation axis tilts, point sizes
const SHELLS = [
  { radius: 7,  color: [0.04, 0.10, 0.60], speed: 0.18,  axisTilt: [0.0, 1.0, 0.1],  ptSize: 5.0, count: 3200 },
  { radius: 13, color: [0.10, 0.30, 0.90], speed: -0.12, axisTilt: [0.15, 1.0, -0.1], ptSize: 5.5, count: 3600 },
  { radius: 20, color: [0.10, 0.70, 0.40], speed: 0.08,  axisTilt: [-0.1, 1.0, 0.2],  ptSize: 7.0, count: 4200 },
  { radius: 28, color: [0.50, 0.70, 0.90], speed: -0.05, axisTilt: [0.2, 1.0, -0.15], ptSize: 6.0, count: 3800 },
  { radius: 37, color: [0.80, 0.85, 0.90], speed: 0.03,  axisTilt: [-0.05, 1.0, 0.05],ptSize: 4.5, count: 4000 }
];

const TOTAL = SHELLS.reduce((s, sh) => s + sh.count, 0);
const positions = new Float32Array(TOTAL * 3);
const shellIdx = new Float32Array(TOTAL);
const seedAttr = new Float32Array(TOTAL);
const basePos = new Float32Array(TOTAL * 3); // original positions for rotation

let offset = 0;
for (let si = 0; si < SHELLS.length; si++) {
  const sh = SHELLS[si];
  for (let i = 0; i < sh.count; i++) {
    // Fibonacci sphere distribution for even coverage
    const golden = (1 + Math.sqrt(5)) / 2;
    const theta = 2 * Math.PI * i / golden;
    const phi = Math.acos(1 - 2 * (i + 0.5) / sh.count);
    
    // Add slight radial variation for organic feel
    const rVar = sh.radius * (0.96 + Math.random() * 0.08);
    const x = rVar * Math.sin(phi) * Math.cos(theta);
    const y = rVar * Math.sin(phi) * Math.sin(theta);
    const z = rVar * Math.cos(phi);
    
    const idx = offset + i;
    positions[idx * 3]     = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;
    basePos[idx * 3]       = x;
    basePos[idx * 3 + 1]   = y;
    basePos[idx * 3 + 2]   = z;
    shellIdx[idx] = si;
    seedAttr[idx] = Math.random();
  }
  offset += sh.count;
}

// Pack shell data into uniforms
const shellColors = new Float32Array(SHELLS.length * 3);
const shellSpeeds = new Float32Array(SHELLS.length);
const shellAxes = new Float32Array(SHELLS.length * 3);
const shellSizes = new Float32Array(SHELLS.length);

for (let i = 0; i < SHELLS.length; i++) {
  shellColors[i*3]   = SHELLS[i].color[0];
  shellColors[i*3+1] = SHELLS[i].color[1];
  shellColors[i*3+2] = SHELLS[i].color[2];
  shellSpeeds[i] = SHELLS[i].speed;
  // Normalize axis
  const ax = SHELLS[i].axisTilt;
  const len = Math.sqrt(ax[0]*ax[0]+ax[1]*ax[1]+ax[2]*ax[2]);
  shellAxes[i*3]   = ax[0]/len;
  shellAxes[i*3+1] = ax[1]/len;
  shellAxes[i*3+2] = ax[2]/len;
  shellSizes[i] = SHELLS[i].ptSize;
}

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uColors:  { value: shellColors },
  uSpeeds:  { value: shellSpeeds },
  uAxes:    { value: shellAxes },
  uSizes:   { value: shellSizes }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uColors[15];
    uniform float uSpeeds[5];
    uniform float uAxes[15];
    uniform float uSizes[5];
    
    attribute float shell;
    attribute float seed;
    attribute vec3 basePosition;
    
    varying vec3 vCol;
    varying float vAlpha;
    
    // Rodrigues rotation
    vec3 rotateAxis(vec3 v, vec3 axis, float angle) {
      float c = cos(angle);
      float s = sin(angle);
      return v * c + cross(axis, v) * s + axis * dot(axis, v) * (1.0 - c);
    }
    
    void main() {
      int si = int(shell);
      
      // Get shell parameters
      vec3 col = vec3(uColors[si*3], uColors[si*3+1], uColors[si*3+2]);
      float speed = uSpeeds[si];
      vec3 axis = vec3(uAxes[si*3], uAxes[si*3+1], uAxes[si*3+2]);
      float ptSize = uSizes[si];
      
      // Rotate around shell-specific axis
      float angle = uTime * speed;
      vec3 rotP = rotateAxis(basePosition, axis, angle);
      
      // Subtle breathing per shell — slight radial pulse
      float breathPhase = uTime * (0.3 + float(si) * 0.07) + seed * 6.28;
      float breathAmp = 1.0 + 0.015 * sin(breathPhase);
      rotP *= breathAmp;
      
      // Slight individual jitter for hand-placed feel
      float jitter = sin(seed * 431.7 + uTime * 0.5) * 0.12;
      rotP += normalize(rotP) * jitter;
      
      vCol = col;
      
      // Alpha: high base, slight variation per particle
      float baseAlpha = 0.75 + 0.15 * sin(seed * 173.3 + uTime * 0.4);
      // Shell 2 (aurora green, si=2) is brightest
      if (si == 2) baseAlpha = min(baseAlpha + 0.1, 0.95);
      vAlpha = baseAlpha;
      
      vec4 mv = modelViewMatrix * vec4(rotP, 1.0);
      float dist = -mv.z;
      gl_PointSize = (ptSize + seed * 1.5) * uPixel * (80.0 / max(dist, 1.0));
      gl_PointSize = clamp(gl_PointSize, 1.5, 22.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      
      // Soft glow falloff — brighter center
      float glow = 1.0 - smoothstep(0.0, 0.5, r);
      glow = pow(glow, 1.3);
      
      // Core brightening
      float core = exp(-r * r * 18.0) * 0.4;
      
      float a = (glow + core) * vAlpha;
      gl_FragColor = vec4(vCol * (1.0 + core * 0.5), a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('basePosition', new THREE.BufferAttribute(basePos, 3));
geom.setAttribute('shell', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seedAttr, 1));

const points = new THREE.Points(geom, mat);
scene.add(points);

// Resize handler
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Camera: slow elliptical orbit, slightly elevated
function updateCamera(t) {
  const orbitSpeed = 0.04;
  const cx = Math.sin(t * orbitSpeed) * 68;
  const cz = Math.cos(t * orbitSpeed) * 72;
  const cy = 12 + Math.sin(t * orbitSpeed * 0.7) * 8;
  
  camera.position.x += (cx - camera.position.x) * 0.015;
  camera.position.y += (cy - camera.position.y) * 0.015;
  camera.position.z += (cz - camera.position.z) * 0.015;
  camera.lookAt(0, 0, 0);
}

let lastTime = performance.now();

function loop() {
  const now = performance.now();
  lastTime = now;
  const t = now / 1000;
  
  uniforms.uTime.value = t;
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
