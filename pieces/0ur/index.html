<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0ur · erasure landscape · winger-bearskin</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#010712; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">0ur · erasure landscape · winger-bearskin</div>
<div class="hint">drag to orbit · infrastructure dissolves into sky</div>
<div class="src">amelia winger-bearskin · 2025 lumen prize · indigenous commons · shared celestial witness</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// AMELIA WINGER-BEARSKIN — 'I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY'
// Concept: A landscape where all human infrastructure (grid roads, power-line towers,
// fences, parking lots) progressively erases itself over 180 seconds — the built
// geometry dissolves particle-by-particle into the deep star-field sky above.
// The sodium-orange light pollution fades to reveal cobalt night + starfield white.
// TWO PARTICLE CLOUDS: (1) BUILT layer — orthogonal grid infrastructure, warm
// orange emission, y=0..5, fades out 0→1 over cycle. (2) SKY layer — star-field
// points, slow upward drift, cold blue-white, alpha fades in 0→1 as built erases.
// The camera starts LOW (looking across the built grid) and slowly lifts + tilts
// upward to frame the emerging celestial commons. The piece is one continuous
// DISSOLUTION act: infrastructure → shared sky. No literal text labels, the
// narrative is in the motion law alone.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010712, 0.012);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(28, 3.5, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x010712, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 2, 0);
controls.maxPolarAngle = Math.PI * 0.65;
controls.minDistance = 15;
controls.maxDistance = 90;

// ─────────── BUILT LAYER: infrastructure grid (roads, towers, fences)
// Orthogonal placement, sodium-orange glow, y=0..5
const BUILT_COUNT = 18000;
const builtPositions = new Float32Array(BUILT_COUNT * 3);
const builtColors = new Float32Array(BUILT_COUNT * 3);
const builtSizes = new Float32Array(BUILT_COUNT);
const builtTypes = new Uint8Array(BUILT_COUNT); // 0=road, 1=tower, 2=fence, 3=lot

for (let i = 0; i < BUILT_COUNT; i++){
  const type = Math.floor(Math.random() * 4);
  builtTypes[i] = type;

  let x, y, z, size;
  const orange = 0.88 + Math.random() * 0.12;
  const yellowShift = 0.32 + Math.random() * 0.15;
  
  if (type === 0){
    // ROAD — long orthogonal strips (grid roads)
    const axis = Math.random() < 0.5 ? 0 : 1;
    const lane = Math.floor(Math.random() * 12) * 6 - 36;
    if (axis === 0){
      x = Math.random() * 100 - 50;
      z = lane + (Math.random() - 0.5) * 3.5;
    } else {
      x = lane + (Math.random() - 0.5) * 3.5;
      z = Math.random() * 100 - 50;
    }
    y = 0.02 + Math.random() * 0.08;
    size = 0.08 + Math.random() * 0.05;
    builtColors[i*3] = orange;
    builtColors[i*3+1] = yellowShift;
    builtColors[i*3+2] = 0.05;
  } else if (type === 1){
    // TOWER — tall vertical structures (power-line pylons, cell towers)
    x = (Math.floor(Math.random() * 8) - 4) * 14 + (Math.random() - 0.5) * 2;
    z = (Math.floor(Math.random() * 8) - 4) * 14 + (Math.random() - 0.5) * 2;
    y = Math.random() * 5.5;
    size = 0.12 + Math.random() * 0.08;
    builtColors[i*3] = orange * 0.95;
    builtColors[i*3+1] = yellowShift * 0.9;
    builtColors[i*3+2] = 0.08;
  } else if (type === 2){
    // FENCE — perimeter lines around parcels
    const parcelX = (Math.floor(Math.random() * 10) - 5) * 9;
    const parcelZ = (Math.floor(Math.random() * 10) - 5) * 9;
    const side = Math.floor(Math.random() * 4);
    const t = Math.random();
    if (side < 2){
      x = parcelX + (side === 0 ? -4.5 : 4.5);
      z = parcelZ + (t - 0.5) * 9;
    } else {
      x = parcelX + (t - 0.5) * 9;
      z = parcelZ + (side === 2 ? -4.5 : 4.5);
    }
    y = 0.8 + Math.random() * 1.2;
    size = 0.06 + Math.random() * 0.04;
    builtColors[i*3] = orange * 0.85;
    builtColors[i*3+1] = yellowShift * 0.75;
    builtColors[i*3+2] = 0.03;
  } else {
    // LOT — parking-lot scatter (dense patches)
    const lotX = (Math.floor(Math.random() * 6) - 3) * 12;
    const lotZ = (Math.floor(Math.random() * 6) - 3) * 12;
    x = lotX + (Math.random() - 0.5) * 10;
    z = lotZ + (Math.random() - 0.5) * 10;
    y = 0.01 + Math.random() * 0.05;
    size = 0.05 + Math.random() * 0.03;
    builtColors[i*3] = orange * 0.92;
    builtColors[i*3+1] = yellowShift * 0.88;
    builtColors[i*3+2] = 0.06;
  }
  
  builtPositions[i*3] = x;
  builtPositions[i*3+1] = y;
  builtPositions[i*3+2] = z;
  builtSizes[i] = size;
}

const builtGeom = new THREE.BufferGeometry();
builtGeom.setAttribute('position', new THREE.BufferAttribute(builtPositions, 3));
builtGeom.setAttribute('color', new THREE.BufferAttribute(builtColors, 3));
builtGeom.setAttribute('size', new THREE.BufferAttribute(builtSizes, 1));

const builtMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  uniforms: {
    erosion: { value: 0.0 }
  },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    varying float vErosion;
    uniform float erosion;
    void main(){
      vColor = color;
      vErosion = erosion;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vErosion;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv);
      if (r > 0.5) discard;
      float alpha = (1.0 - r * 2.0) * (1.0 - vErosion);
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const builtPoints = new THREE.Points(builtGeom, builtMat);
scene.add(builtPoints);

// ─────────── SKY LAYER: deep star-field (cobalt + white)
// Slow upward drift, fades in as built erases
const SKY_COUNT = 12000;
const skyPositions = new Float32Array(SKY_COUNT * 3);
const skyColors = new Float32Array(SKY_COUNT * 3);
const skySizes = new Float32Array(SKY_COUNT);
const skyVelocities = new Float32Array(SKY_COUNT * 3);

for (let i = 0; i < SKY_COUNT; i++){
  // Spherical scatter biased toward upper hemisphere
  const theta = Math.acos(Math.random() * 0.6 + 0.4);
  const phi = Math.random() * Math.PI * 2;
  const r = 60 + Math.random() * 80;
  skyPositions[i*3]   = r * Math.sin(theta) * Math.cos(phi);
  skyPositions[i*3+1] = r * Math.cos(theta) + 10;
  skyPositions[i*3+2] = r * Math.sin(theta) * Math.sin(phi);
  
  const brightness = Math.random();
  const blue = 0.25 + brightness * 0.75;
  skyColors[i*3]   = blue * 0.35;
  skyColors[i*3+1] = blue * 0.52;
  skyColors[i*3+2] = blue;
  
  skySizes[i] = 0.08 + Math.random() * 0.15;
  
  skyVelocities[i*3]   = (Math.random() - 0.5) * 0.002;
  skyVelocities[i*3+1] = 0.006 + Math.random() * 0.008;
  skyVelocities[i*3+2] = (Math.random() - 0.5) * 0.002;
}

const skyGeom = new THREE.BufferGeometry();
skyGeom.setAttribute('position', new THREE.BufferAttribute(skyPositions, 3));
skyGeom.setAttribute('color', new THREE.BufferAttribute(skyColors, 3));
skyGeom.setAttribute('size', new THREE.BufferAttribute(skySizes, 1));

const skyMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  uniforms: {
    revelation: { value: 0.0 }
  },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    varying float vRevelation;
    uniform float revelation;
    void main(){
      vColor = color;
      vRevelation = revelation;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (300.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vRevelation;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv);
      if (r > 0.5) discard;
      float core = smoothstep(0.5, 0.1, r);
      float alpha = core * vRevelation;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const skyPoints = new THREE.Points(skyGeom, skyMat);
scene.add(skyPoints);

// ─────────── ground plane (subtle, erodes with built layer)
const groundGeom = new THREE.PlaneGeometry(200, 200, 1, 1);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshBasicMaterial({
  color: 0x0a0e18,
  transparent: true,
  opacity: 0.3
});
const ground = new THREE.Mesh(groundGeom, groundMat);
scene.add(ground);

// ─────────── ambient light (fades from warm to cold)
const ambientLight = new THREE.AmbientLight(0xffa040, 0.4);
scene.add(ambientLight);

// ─────────── EROSION CYCLE: 180 seconds (3 minutes)
const CYCLE_DURATION = 180;
let cycleTime = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  cycleTime = Math.min(elapsed / CYCLE_DURATION, 1.0);
  
  // EROSION CURVE: slow start, accelerating middle, slow end (ease-in-out)
  const erosion = cycleTime < 0.5
    ? 2 * cycleTime * cycleTime
    : 1 - Math.pow(-2 * cycleTime + 2, 2) / 2;
  
  builtMat.uniforms.erosion.value = erosion;
  skyMat.uniforms.revelation.value = erosion;
  
  // fade ground plane with built layer
  groundMat.opacity = 0.3 * (1 - erosion);
  
  // ambient light shifts from warm orange to cold blue
  const warmColor = new THREE.Color(0xffa040);
  const coldColor = new THREE.Color(0x0a1a3a);
  ambientLight.color.lerpColors(warmColor, coldColor, erosion);
  ambientLight.intensity = 0.4 - erosion * 0.25;
  
  // SKY DRIFT: particles move slowly upward + lateral
  const skyPos = skyGeom.attributes.position.array;
  for (let i = 0; i < SKY_COUNT; i++){
    skyPos[i*3]   += skyVelocities[i*3];
    skyPos[i*3+1] += skyVelocities[i*3+1];
    skyPos[i*3+2] += skyVelocities[i*3+2];
  }
  skyGeom.attributes.position.needsUpdate = true;
  
  // CAMERA MOTION: starts low (looking across infrastructure), lifts and tilts
  // upward over the cycle to frame the emerging celestial field
  const startY = 3.5, endY = 18;
  const startTargetY = 2, endTargetY = 25;
  camera.position.y = startY + (endY - startY) * erosion;
  controls.target.y = startTargetY + (endTargetY - startTargetY) * erosion;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
