<title>9rd · saudade</title>
<style>

               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<body>
<div class="id">9rd</div>
<div class="hint">drag to orbit · memory cycles slowly · Boltanski — absence as material</div>
<div class="src">cypress → leaf → tower (incomplete) · 70k · saudade</div>
<div class="label" id="phaseLabel">remembering</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c12, 0.012);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c12, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 8, 0);

/* ── L-system cypress (pose A) ── */
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = new THREE.Vector3(0,1,0), l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE*1.5); break;
      case '\\': rotate(h, -ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s=(s+0x6D2B79F5)|0;
  let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; })();

const cypressSegs = turtle(expand('F', 6, rng));

/* ── art-deco tower (pose C) — the thing longed for ── */
function sampleArtDeco(N){
  const out = new Float32Array(N*3), pos = new THREE.Vector3();
  const tiers = [
    {hw:4.5, y0:0.0, y1:4.0, ridges:14},
    {hw:3.4, y0:4.0, y1:7.5, ridges:12},
    {hw:2.4, y0:7.5, y1:10.5,ridges:10},
    {hw:1.5, y0:10.5,y1:13.0,ridges:8},
    {hw:0.85,y0:13.0,y1:15.0,ridges:6},
  ];
  const spireBase=0.6, spireTop=18.5, spireApex=20.5;
  const W=Math.floor(N*0.55), B=Math.floor(N*0.25), S=Math.floor(N*0.12), C=N-W-B-S;
  let i=0;
  const tierWeights = tiers.map(t=>8*t.hw*(t.y1-t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b,0);
  for (let ti=0; ti<tiers.length; ti++){
    const t=tiers[ti];
    const count = ti===tiers.length-1 ? (W-tierWeights.slice(0,ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti]/tw_total*W);
    for (let k=0; k<count; k++){
      const face=Math.floor(Math.random()*4);
      const r=Math.floor(Math.random()*t.ridges);
      const ridgeFrac=(r+0.5)/t.ridges;
      const along=(ridgeFrac*2-1)*t.hw;
      const y=t.y0+Math.random()*(t.y1-t.y0);
      const j=0.04;
      switch(face){
        case 0: pos.set(t.hw+(Math.random()-0.5)*j,y,along); break;
        case 1: pos.set(-t.hw+(Math.random()-0.5)*j,y,along); break;
        case 2: pos.set(along,y,t.hw+(Math.random()-0.5)*j); break;
        case 3: pos.set(along,y,-t.hw+(Math.random()-0.5)*j); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k=0; k<B; k++){
    const ti=Math.floor(Math.random()*tiers.length), t=tiers[ti];
    const edge=Math.random()<0.6?t.y1:t.y0;
    const face=Math.floor(Math.random()*4);
    const along=(Math.random()*2-1)*t.hw;
    const j=0.02;
    switch(face){
      case 0: pos.set(t.hw,edge+(Math.random()-0.5)*j,along); break;
      case 1: pos.set(-t.hw,edge+(Math.random()-0.5)*j,along); break;
      case 2: pos.set(along,edge+(Math.random()-0.5)*j,t.hw); break;
      case 3: pos.set(along,edge+(Math.random()-0.5)*j,-t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k=0; k<S; k++){
    const t=Math.random(), y=spireTop+t*(spireApex-spireTop);
    const r=spireBase*(1-t), th=Math.random()*Math.PI*2;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  const chevrons=16;
  for (let k=0; k<C; k++){
    const ch=Math.floor(Math.random()*chevrons);
    const th=(ch+0.5)/chevrons*Math.PI*2;
    const along=Math.random(), inner=0.7, outer=2.0;
    const r=inner+along*(outer-inner);
    const y=spireTop-0.4+along*0.8+(Math.random()-0.5)*0.05;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

/* ── build 70k particle positions for both poses ── */
const N = 70000;
const treePos = new Float32Array(N*3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);
const driftSeeds = new Float32Array(N*3); // per-particle drift direction for dissolution

const lens = cypressSegs.map(s=>s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N*SKELETON_FRAC);
const N_FOLIAGE = N - N_SKEL;
let written = 0;
const v = new THREE.Vector3();

for (let i=0; i<cypressSegs.length; i++){
  const share = i===cypressSegs.length-1 ? (N_SKEL-written) : Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for (let k=0; k<share && written<N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05*Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x+(Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y+(Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z+(Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    // drift: mostly upward, slight horizontal wander
    driftSeeds[written*3]   = (Math.random()-0.5)*0.6;
    driftSeeds[written*3+1] = 0.5 + Math.random()*0.5;
    driftSeeds[written*3+2] = (Math.random()-0.5)*0.6;
    written++;
  }
}
{
  let yMin=Infinity, yMax=-Infinity;
  for (const s of cypressSegs){ yMin=Math.min(yMin,s.from.y,s.to.y); yMax=Math.max(yMax,s.from.y,s.to.y); }
  const trunkH = yMax-yMin;
  const haloYStart = yMin+trunkH*0.16;
  const RIDGES=8, SPIRAL=0.9, TUFT_COUNT=24;
  const tuftYs=[], tuftThetas=[];
  for (let i=0; i<TUFT_COUNT; i++){
    tuftYs.push(haloYStart+((i+0.5)/TUFT_COUNT)*(yMax-haloYStart));
    tuftThetas.push(Math.random()*Math.PI*2);
  }
  const N_RIDGE=Math.floor(N_FOLIAGE*0.60), N_TUFT=N_FOLIAGE-N_RIDGE;
  for (let k=0; k<N_RIDGE && written<N; k++){
    const yt=Math.random(), y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(0.18, 1.0-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const ridgeTh=(ridge/RIDGES)*Math.PI*2+y*SPIRAL;
    const th=ridgeTh+(Math.random()-0.5)*0.30;
    const r=baseR*(0.55+0.45*Math.random());
    treePos[written*3]=Math.cos(th)*r; treePos[written*3+1]=y+(Math.random()-0.5)*0.05;
    treePos[written*3+2]=Math.sin(th)*r; seeds[written]=Math.random();
    driftSeeds[written*3]=(Math.random()-0.5)*0.6;
    driftSeeds[written*3+1]=0.5+Math.random()*0.5;
    driftSeeds[written*3+2]=(Math.random()-0.5)*0.6;
    written++;
  }
  for (let k=0; k<N_TUFT && written<N; k++){
    const t=Math.floor(Math.random()*TUFT_COUNT);
    const tuftY=tuftYs[t], tuftTh=tuftThetas[t];
    const yt=(tuftY-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(0.18,1.0-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const reach=baseR+0.1+Math.random()*0.35;
    const localY=tuftY+(Math.random()-0.5)*0.4;
    const localTh=tuftTh+(Math.random()-0.5)*0.4;
    const localR=reach+(Math.random()-0.5)*0.18;
    treePos[written*3]=Math.cos(localTh)*localR; treePos[written*3+1]=localY;
    treePos[written*3+2]=Math.sin(localTh)*localR; seeds[written]=Math.random();
    driftSeeds[written*3]=(Math.random()-0.5)*0.6;
    driftSeeds[written*3+1]=0.5+Math.random()*0.5;
    driftSeeds[written*3+2]=(Math.random()-0.5)*0.6;
    written++;
  }
}
while(written<N){
  treePos[written*3]=0; treePos[written*3+1]=0; treePos[written*3+2]=0;
  seeds[written]=Math.random();
  driftSeeds[written*3]=(Math.random()-0.5)*0.6;
  driftSeeds[written*3+1]=0.5+Math.random()*0.5;
  driftSeeds[written*3+2]=(Math.random()-0.5)*0.6;
  written++;
}

function fitToHeight(arr, targetH){
  let minY=Infinity, maxY=-Infinity, cx=0, cz=0;
  const n3=arr.length/3;
  for (let i=0; i<n3; i++){ minY=Math.min(minY,arr[i*3+1]); maxY=Math.max(maxY,arr[i*3+1]); cx+=arr[i*3]; cz+=arr[i*3+2]; }
  cx/=n3; cz/=n3;
  const s=targetH/(maxY-minY);
  for (let i=0; i<n3; i++){ arr[i*3]=(arr[i*3]-cx)*s; arr[i*3+1]=(arr[i*3+1]-minY)*s; arr[i*3+2]=(arr[i*3+2]-cz)*s; }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

/* ── shader ── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPhase: { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('drift',    new THREE.BufferAttribute(driftSeeds, 3));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute vec3 drift;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      /*
        Saudade cycle (uPhase 0→1, period ~55s):
        0.00–0.30  cypress present, solid
        0.30–0.45  cypress dissolving → leaf (memory surfaces)
        0.45–0.55  leaf lingers (the ache of remembering)
        0.55–0.72  leaf → tower (reaching for what's gone)
        0.72–0.82  tower almost-there (never fully solid)
        0.82–1.00  dissolution — particles drift upward, scatter
      */
      float ph = uPhase;

      // morph factor: 0=cypress, 0.5=leaf, 1.0=tower
      float morphTo;
      if (ph < 0.30) morphTo = 0.0;
      else if (ph < 0.45) morphTo = smoothstep(0.30, 0.45, ph) * 0.5;
      else if (ph < 0.55) morphTo = 0.5;
      else if (ph < 0.72) morphTo = 0.5 + smoothstep(0.55, 0.72, ph) * 0.5;
      else morphTo = 1.0;

      float m = morphTo;

      /* ── leaf intermediate pose ── */
      float lv = fract(seed * 137.508);
      float lSeed2 = fract(seed * 73.137);
      float lSeed3 = fract(seed * 31.17);
      float sinV = sin(lv * 3.14159);
      float leafEnv = pow(max(sinV, 0.0), 0.55) * (1.0 - 0.48 * lv * lv);
      float leafHW = leafEnv * 5.2;
      float onMidrib = step(lSeed3, 0.22);
      float rawU = lSeed2 * 2.0 - 1.0;
      float lu = mix(rawU, rawU * 0.025, onMidrib);
      float onSecVein = step(0.22, lSeed3) * step(lSeed3, 0.38);
      float veinIdx = floor(fract(seed * 19.3) * 7.0);
      float veinAttach = (veinIdx + 1.0) / 8.0;
      float veinProg = fract(seed * 41.7);
      float veinLv = mix(lv, veinAttach + veinProg * 0.07, onSecVein);
      float veinLu = mix(lu, veinProg * 0.82 * sign(rawU + 0.001), onSecVein);
      float vSinV = sin(veinLv * 3.14159);
      float vLeafEnv = pow(max(vSinV, 0.0), 0.55) * (1.0 - 0.48 * veinLv * veinLv);
      float vLeafHW = vLeafEnv * 5.2;
      float finalLu = mix(lu, veinLu, onSecVein);
      float finalLv = mix(lv, veinLv, onSecVein);
      float finalHW = mix(leafHW, vLeafHW, onSecVein);
      float leafX = finalLu * finalHW;
      float leafYp = finalLv * 16.0;
      float midDist = abs(finalLu);
      float midribZ = (1.0 - midDist) * 0.38;
      float laminaZ = (1.0 - midDist * midDist) * 0.12;
      float veinZ = (1.0 - veinProg) * 0.18 * onSecVein;
      float leafZ = mix(laminaZ, midribZ, onMidrib) + veinZ + (lSeed3 - 0.5) * 0.05;
      vec3 leafP = vec3(leafX, leafYp, leafZ);

      /* ── three-way morph ── */
      float phase1 = smoothstep(0.0, 0.5, m);
      float phase2 = smoothstep(0.5, 1.0, m);
      vec3 p = mix(mix(treePos, leafP, phase1), towerPos, phase2);

      /* ── dissolution: particles drift away in tower phase ── */
      // each particle has a departure threshold based on seed
      float departTime = 0.72 + seed * 0.28; // staggered departure 0.72–1.0
      float dissolved = smoothstep(departTime - 0.06, departTime + 0.06, ph);

      // tower incompleteness: even at peak, some particles waver
      float towerWaver = smoothstep(0.65, 0.82, ph) * (1.0 - dissolved);
      float waverAmt = towerWaver * 0.3 * sin(uTime * 0.2 + seed * 40.0);
      p += vec3(waverAmt * 0.5, waverAmt * 0.2, waverAmt * 0.3);

      // dissolved particles drift upward slowly
      float driftT = dissolved * (ph - departTime + 0.06) * 8.0;
      p += drift * driftT * 3.5;

      // leaf visibility for color
      float leafVis = max(0.0, 1.0 - 2.0 * abs(m - 0.5));
      leafVis = smoothstep(0.0, 0.55, leafVis);

      // gentle sway — mournful, like a candle flame
      float t = uTime * 0.25 + seed * 6.2832;
      float swayScale = (1.0 - dissolved) * 0.03 * (p.y / 16.0);
      p.x += swayScale * sin(t);
      p.z += swayScale * cos(t * 0.73);

      /* ── saudade palette: twilight indigo, faded amber, dusty rose ── */
      // cypress: deep twilight blue-grey (present, rooted)
      vec3 treeA  = vec3(0.12, 0.14, 0.22);   // deep indigo
      vec3 treeB  = vec3(0.22, 0.26, 0.35);   // twilight blue

      // leaf: amber-sepia (the warmth of memory)
      vec3 leafA  = vec3(0.38, 0.30, 0.18);   // dark amber
      vec3 leafB  = vec3(0.52, 0.42, 0.26);   // warm sepia

      // tower: dusty rose-grey (the unreachable)
      vec3 decoA  = vec3(0.30, 0.22, 0.24);   // dusty mauve
      vec3 decoB  = vec3(0.48, 0.38, 0.40);   // faded rose

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol = mix(treeA, treeB, hk);
      vec3 leafCol = mix(leafA, leafB, hk + max(onMidrib, onSecVein) * 0.1);
      vec3 decoCol = mix(decoA, decoB, hk);

      vec3 col1 = mix(treeCol, leafCol, phase1);
      vCol = mix(col1, decoCol, phase2);

      // dissolving particles fade toward pale ash
      vec3 ashCol = vec3(0.38, 0.40, 0.45);
      vCol = mix(vCol, ashCol, dissolved * 0.7);

      // vein highlight at leaf phase
      float veinHighlight = max(onMidrib, onSecVein * 0.6);
      vCol += veinHighlight * leafVis * vec3(0.04, 0.05, 0.01);

      // alpha: solid when present, fading when dissolved
      float energy = 0.5 + 0.5 * sin(t * 0.3);
      float baseAlpha = 0.38 + 0.22 * energy + leafVis * 0.06;
      // tower phase: slightly transparent (never fully here)
      baseAlpha *= mix(1.0, 0.7, phase2 * (1.0 - dissolved));
      // dissolving: fade out
      vAlpha = baseAlpha * (1.0 - dissolved * 0.85);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (0.75 + 0.35 * energy + leafVis * 0.18) * uPixel * (50.0 / dist);
      // dissolving particles shrink slightly
      sz *= (1.0 - dissolved * 0.4);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();
const CYCLE = 55; // seconds per full saudade cycle

const phaseNames = [
  [0.00, 'remembering'],
  [0.30, 'it surfaces'],
  [0.45, 'the leaf lingers'],
  [0.55, 'reaching'],
  [0.72, 'almost there'],
  [0.82, 'letting go'],
  [0.95, 'absence'],
];

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // slow one-directional phase, wrapping
  const raw = (t % CYCLE) / CYCLE;
  // ease: slow at endpoints, gentle middle
  const ph = raw * raw * (3.0 - 2.0 * raw);
  uniforms.uPhase.value = ph;

  // update label
  let label = 'remembering';
  for (const [threshold, name] of phaseNames) {
    if (ph >= threshold) label = name;
  }
  phaseLabel.textContent = label;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
<button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
<button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
<input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
<button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;

  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0°</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){
      document.getElementById('gp-'+k).value=G[k];
      document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
})();
</script>

</body>
