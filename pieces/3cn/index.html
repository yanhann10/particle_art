<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3cn · process compendium trace</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f8f6f4; overflow:hidden;
               color:#1a1816; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#1a1816; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">3cn</div>
<div class="hint">click to pause/resume</div>
<div class="src">Casey Reas · Process 18 · sphere agents · contact quads</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Casey Reas Process 18 lifted to 3D sphere:
   N agents trace circular paths on a sphere surface.
   When two agents come within threshold, a quad connects their current positions
   with opacity that grows over contact duration.
   Quads accumulate to build a dense interlocking field. */

const BG = 0xf8f6f4;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
renderer.autoClear = false; // accumulate drawing
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

const N_AGENTS = 400;
const SPHERE_R = 5.0;
const CONTACT_DIST = 0.35;
const QUAD_MAX_ALPHA = 0.08;
const FADE_RATE = 0.0008; // slow canvas fade to white

// agent: moves on sphere surface in a circular path
// position is stored as (theta, phi) spherical coords
// circular path defined by a rotation axis and angular velocity
class Agent {
  constructor() {
    this.theta = Math.random() * Math.PI;
    this.phi = Math.random() * Math.PI * 2;
    // random rotation axis (unit vector)
    const u = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    this.axis = new THREE.Vector3(
      Math.sin(v) * Math.cos(u),
      Math.sin(v) * Math.sin(u),
      Math.cos(v)
    );
    this.omega = 0.002 + Math.random() * 0.004; // angular velocity
    this.seed = Math.random();
  }
  
  step() {
    // current cartesian position
    const p = new THREE.Vector3(
      SPHERE_R * Math.sin(this.theta) * Math.cos(this.phi),
      SPHERE_R * Math.sin(this.theta) * Math.sin(this.phi),
      SPHERE_R * Math.cos(this.theta)
    );
    // rotate p around axis by omega
    p.applyAxisAngle(this.axis, this.omega);
    // convert back to spherical
    this.theta = Math.acos(Math.max(-1, Math.min(1, p.z / SPHERE_R)));
    this.phi = Math.atan2(p.y, p.x);
  }
  
  pos() {
    return new THREE.Vector3(
      SPHERE_R * Math.sin(this.theta) * Math.cos(this.phi),
      SPHERE_R * Math.sin(this.theta) * Math.sin(this.phi),
      SPHERE_R * Math.cos(this.theta)
    );
  }
}

const agents = [];
for (let i = 0; i < N_AGENTS; i++) agents.push(new Agent());

// contact memory: map of agent-pair -> {age, quadMesh}
const contacts = new Map();

function pairKey(i, j) { return i < j ? `${i},${j}` : `${j},${i}`; }

// quad geometry: 4 vertices, 2 triangles
function makeQuadMesh(p0, p1, seed) {
  const geom = new THREE.BufferGeometry();
  // we'll morph the quad: p0 and p1 are current positions
  // spread slightly perpendicular to line segment
  const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(p1, p0);
  const len = dir.length();
  dir.normalize();
  // perpendicular direction on sphere surface: cross with radial
  const radial = mid.clone().normalize();
  const perp = new THREE.Vector3().crossVectors(dir, radial).normalize();
  const w = Math.min(len * 0.4, 0.2); // quad width
  
  const v0 = p0.clone().add(perp.clone().multiplyScalar(w * (0.5 + seed * 0.3)));
  const v1 = p0.clone().add(perp.clone().multiplyScalar(-w * (0.5 + seed * 0.3)));
  const v2 = p1.clone().add(perp.clone().multiplyScalar(-w * (0.5 + seed * 0.3)));
  const v3 = p1.clone().add(perp.clone().multiplyScalar(w * (0.5 + seed * 0.3)));
  
  const pos = new Float32Array([
    v0.x, v0.y, v0.z,
    v1.x, v1.y, v1.z,
    v2.x, v2.y, v2.z,
    v3.x, v3.y, v3.z
  ]);
  const idx = new Uint16Array([0,1,2, 0,2,3]);
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setIndex(new THREE.BufferAttribute(idx, 1));
  geom.computeVertexNormals();
  
  // ink-black, additive blending for accumulation
  const mat = new THREE.MeshBasicMaterial({
    color: 0x1a1816,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const mesh = new THREE.Mesh(geom, mat);
  return mesh;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// agent dots (optional, subtle)
const agentGeom = new THREE.BufferGeometry();
const agentPos = new Float32Array(N_AGENTS * 3);
agentGeom.setAttribute('position', new THREE.BufferAttribute(agentPos, 3));
const agentMat = new THREE.PointsMaterial({
  color: 0x1a1816,
  size: 2.0,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.4
});
const agentPoints = new THREE.Points(agentGeom, agentMat);
scene.add(agentPoints);

const statEl = document.getElementById('stat');
const start = performance.now();
let frameCount = 0;
let lastClear = 0;

function loop() {
  const t = (performance.now() - start) / 1000;
  frameCount++;
  
  if (!paused) {
    // step agents
    for (let i = 0; i < N_AGENTS; i++) {
      agents[i].step();
      const p = agents[i].pos();
      agentPos[i * 3] = p.x;
      agentPos[i * 3 + 1] = p.y;
      agentPos[i * 3 + 2] = p.z;
    }
    agentGeom.attributes.position.needsUpdate = true;
    
    // check contacts
    const activeKeys = new Set();
    for (let i = 0; i < N_AGENTS; i++) {
      for (let j = i + 1; j < N_AGENTS; j++) {
        const pi = agents[i].pos();
        const pj = agents[j].pos();
        const d = pi.distanceTo(pj);
        if (d < CONTACT_DIST) {
          const k = pairKey(i, j);
          activeKeys.add(k);
          if (!contacts.has(k)) {
            // new contact: create quad
            const seed = (agents[i].seed + agents[j].seed) * 0.5;
            const mesh = makeQuadMesh(pi, pj, seed);
            scene.add(mesh);
            contacts.set(k, { age: 0, mesh });
          } else {
            // existing contact: grow opacity
            const c = contacts.get(k);
            c.age += 1;
            c.mesh.material.opacity = Math.min(QUAD_MAX_ALPHA, c.age * 0.0002);
          }
        }
      }
    }
    
    // decay quads that lost contact
    for (const [k, c] of contacts.entries()) {
      if (!activeKeys.has(k)) {
        c.age = Math.max(0, c.age - 2);
        c.mesh.material.opacity = Math.min(QUAD_MAX_ALPHA, c.age * 0.0002);
        if (c.age === 0) {
          scene.remove(c.mesh);
          c.mesh.geometry.dispose();
          c.mesh.material.dispose();
          contacts.delete(k);
        }
      }
    }
  }
  
  // slow fade to white every 120 frames
  if (frameCount - lastClear > 120) {
    lastClear = frameCount;
    renderer.setClearColor(BG, FADE_RATE);
    renderer.clear();
    renderer.setClearColor(BG, 0);
  }
  
  statEl.textContent = `agents=${N_AGENTS} quads=${contacts.size}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
