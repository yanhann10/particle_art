<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3tf · 5-formation line field</title>
<!-- MOTION: trace, intensity: gentle -->
<!-- Palette: warm cream #f0ead0 on deep charcoal #101010 — restrained, intimate -->
<!-- Artist: Agnes Martin grid drawings · Bridget Riley line fields · structured geometry -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#101010; overflow:hidden;
               color:#c0b898; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.50; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.40; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; }
  .formation { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size:10px; letter-spacing:0.08em; color:#d8c8a0; text-transform:uppercase; }
</style>
</head>
<body>
<div class="id">3tf</div>
<div class="hint">1200 line segments · 5 formations · smooth morph between each</div>
<div class="src">Agnes Martin · Bridget Riley · structured line field</div>
<div class="formation" id="formation">GRID</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* 1200 LineSegments transitioning between 5 geometric formations.
   Each formation holds for 10s, 5s smooth LERP morph between them.
   Formations: GRID · RADIAL · FLOW · SCATTER · WEAVE
   Palette: warm cream #f0ead0 on deep charcoal #101010.
   Each segment is a short line with precomputed target geometry per formation. */

const N = 1200; // line segments
const SEG_LEN = 0.35; // half-length of each segment

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101010);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Formation timing
const HOLD = 10;   // seconds to hold each formation
const MORPH = 5;   // seconds to morph
const PERIOD = HOLD + MORPH; // 15s per formation
const FORMATIONS = ['GRID', 'RADIAL', 'FLOW', 'SCATTER', 'WEAVE'];
const N_FORM = FORMATIONS.length;

// Each formation stores: for each segment i, the center (cx,cy) and angle
// We'll compute positions for start/end of each segment from center + angle
function buildFormations() {
  const forms = [];

  // 1. GRID: uniform grid, horizontal lines alternating with vertical
  {
    const f = { cx: new Float32Array(N), cy: new Float32Array(N), angle: new Float32Array(N) };
    const cols = Math.ceil(Math.sqrt(N * 1.4));
    const rows = Math.ceil(N / cols);
    const spacingX = 18 / cols;
    const spacingY = 14 / rows;
    for (let i = 0; i < N; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      f.cx[i] = -9 + col * spacingX + spacingX * 0.5;
      f.cy[i] = -7 + row * spacingY + spacingY * 0.5;
      // Alternate horizontal (0) and vertical (π/2) by row
      f.angle[i] = (row % 2 === 0) ? 0 : Math.PI / 2;
    }
    forms.push(f);
  }

  // 2. RADIAL: all segments point toward/away from center
  {
    const f = { cx: new Float32Array(N), cy: new Float32Array(N), angle: new Float32Array(N) };
    for (let i = 0; i < N; i++) {
      // Distribute radially
      const r = 1.5 + (i / N) * 7.0;
      const theta = (i / N) * Math.PI * 2 * 13; // many turns
      f.cx[i] = Math.cos(theta) * r;
      f.cy[i] = Math.sin(theta) * r;
      // Angle: perpendicular to radial direction → points radially
      f.angle[i] = theta; // points away from center
    }
    forms.push(f);
  }

  // 3. FLOW: horizontal laminar wind field from left
  {
    const f = { cx: new Float32Array(N), cy: new Float32Array(N), angle: new Float32Array(N) };
    const cols = Math.ceil(Math.sqrt(N * 2));
    const rows = Math.ceil(N / cols);
    const spacingX = 20 / cols;
    const spacingY = 14 / rows;
    for (let i = 0; i < N; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      f.cx[i] = -10 + col * spacingX;
      f.cy[i] = -7 + row * spacingY + spacingY * 0.5;
      // Slight downward tilt based on position — laminar with shear
      const shear = (f.cy[i] / 14) * 0.15;
      f.angle[i] = shear; // nearly horizontal
    }
    forms.push(f);
  }

  // 4. SCATTER: random positions and orientations
  {
    const f = { cx: new Float32Array(N), cy: new Float32Array(N), angle: new Float32Array(N) };
    // Use a seeded-like pattern (deterministic) for consistency
    for (let i = 0; i < N; i++) {
      const seed1 = (i * 1.618033) % 1;
      const seed2 = (i * 2.718281) % 1;
      const seed3 = (i * 3.141592) % 1;
      f.cx[i] = (seed1 * 2 - 1) * 9;
      f.cy[i] = (seed2 * 2 - 1) * 7;
      f.angle[i] = seed3 * Math.PI;
    }
    forms.push(f);
  }

  // 5. WEAVE: diagonal interlocking ±45°, alternating
  {
    const f = { cx: new Float32Array(N), cy: new Float32Array(N), angle: new Float32Array(N) };
    const cols = Math.ceil(Math.sqrt(N));
    const rows = Math.ceil(N / cols);
    const spacingX = 18 / cols;
    const spacingY = 14 / rows;
    for (let i = 0; i < N; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      f.cx[i] = -9 + col * spacingX + spacingX * 0.5;
      f.cy[i] = -7 + row * spacingY + spacingY * 0.5;
      // Checkerboard of +45° and -45°
      const checker = (col + row) % 2;
      f.angle[i] = checker === 0 ? Math.PI / 4 : -Math.PI / 4;
    }
    forms.push(f);
  }

  return forms;
}

const FORM_DATA = buildFormations();

// Build LineSegments geometry
// Each segment = 2 vertices (start, end)
const segPositions = new Float32Array(N * 2 * 3);
const segGeo = new THREE.BufferGeometry();
const posAttr = new THREE.BufferAttribute(segPositions, 3);
segGeo.setAttribute('position', posAttr);

// Color: warm cream with slight per-segment variation
const segColors = new Float32Array(N * 2 * 3);
const baseR = 0.941, baseG = 0.914, baseB = 0.816; // #f0ead0
for (let i = 0; i < N; i++) {
  const variation = (i / N) * 0.08 - 0.04;
  const r = Math.max(0, Math.min(1, baseR + variation * 0.5));
  const g = Math.max(0, Math.min(1, baseG + variation * 0.4));
  const b = Math.max(0, Math.min(1, baseB + variation * 0.3));
  segColors[(i * 2)     * 3]     = r;
  segColors[(i * 2)     * 3 + 1] = g;
  segColors[(i * 2)     * 3 + 2] = b;
  segColors[(i * 2 + 1) * 3]     = r;
  segColors[(i * 2 + 1) * 3 + 1] = g;
  segColors[(i * 2 + 1) * 3 + 2] = b;
}
const colAttr = new THREE.BufferAttribute(segColors, 3);
segGeo.setAttribute('color', colAttr);

const segMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.88,
});
const lineSegs = new THREE.LineSegments(segGeo, segMat);
scene.add(lineSegs);

// Current interpolated state (cx, cy, angle per segment)
const curCX    = new Float32Array(N);
const curCY    = new Float32Array(N);
const curAngle = new Float32Array(N);

// Initialize to GRID
for (let i = 0; i < N; i++) {
  curCX[i]    = FORM_DATA[0].cx[i];
  curCY[i]    = FORM_DATA[0].cy[i];
  curAngle[i] = FORM_DATA[0].angle[i];
}

function lerp(a, b, t) { return a + (b - a) * t; }
// Angle lerp — shortest path
function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > Math.PI)  diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

function updatePositions() {
  for (let i = 0; i < N; i++) {
    const cx = curCX[i], cy = curCY[i], ang = curAngle[i];
    const dx = Math.cos(ang) * SEG_LEN;
    const dy = Math.sin(ang) * SEG_LEN;
    segPositions[(i * 2)     * 3]     = cx - dx;
    segPositions[(i * 2)     * 3 + 1] = cy - dy;
    segPositions[(i * 2)     * 3 + 2] = 0;
    segPositions[(i * 2 + 1) * 3]     = cx + dx;
    segPositions[(i * 2 + 1) * 3 + 1] = cy + dy;
    segPositions[(i * 2 + 1) * 3 + 2] = 0;
  }
  posAttr.needsUpdate = true;
}

// Initialize positions
updatePositions();

const formEl = document.getElementById('formation');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const LERP_ALPHA = 0.04;

let lastTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;

  // Determine which formation and blend alpha
  const totalPhase = t / PERIOD;
  const formIdx = Math.floor(totalPhase) % N_FORM;
  const nextIdx = (formIdx + 1) % N_FORM;
  const cycleT = (totalPhase - Math.floor(totalPhase)) * PERIOD;

  let blendAlpha = 0;
  if (cycleT >= HOLD) {
    blendAlpha = Math.min(1, (cycleT - HOLD) / MORPH);
  }

  // Smoothstep blend
  blendAlpha = blendAlpha * blendAlpha * (3 - 2 * blendAlpha);

  // Target = lerp between formIdx and nextIdx
  const fA = FORM_DATA[formIdx];
  const fB = FORM_DATA[nextIdx];

  // LERP toward target per frame
  for (let i = 0; i < N; i++) {
    const targetCX    = lerp(fA.cx[i],    fB.cx[i],    blendAlpha);
    const targetCY    = lerp(fA.cy[i],    fB.cy[i],    blendAlpha);
    const targetAngle = lerpAngle(fA.angle[i], fB.angle[i], blendAlpha);

    curCX[i]    += (targetCX    - curCX[i])    * LERP_ALPHA;
    curCY[i]    += (targetCY    - curCY[i])    * LERP_ALPHA;
    curAngle[i] += (lerpAngle(curAngle[i], targetAngle, 1) - curAngle[i]) * LERP_ALPHA;
  }

  updatePositions();

  // Update formation label
  const displayForm = blendAlpha > 0.5 ? FORMATIONS[nextIdx] : FORMATIONS[formIdx];
  formEl.textContent = displayForm;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
</body>
</html>
