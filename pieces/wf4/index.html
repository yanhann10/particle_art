<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

/* ── Intent: a glass snow-globe containing a tiered pagoda of flowing data-
   particles. Every ~22 s the globe "shakes" — particles scatter upward like
   snow, then gently settle back into the architectural tiers. The surprise
   is the first shake: orderly flow → chaos → slow beautiful resolution.
   Evokes Refik Anadol's data sculptures trapped inside a Joseph Cornell box. ── */

const W = 512, H = 512, N = W * H;
const GLOBE_R = 18.0, GLOBE_CY = 1.0;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080b11, 1);
document.body.appendChild(renderer.domElement);

// ── ping-pong GPGPU targets ──
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

// ── seed particles on 6 pagoda tiers ──
const tiers = [[-10,8.5],[-5,7],[0,5.5],[5,4],[9,2.8],[13,1.5]];
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  const ti = Math.floor(Math.random() * tiers.length);
  const [ty, tr] = tiers[ti];
  const a = Math.random() * Math.PI * 2;
  const r = tr * (0.3 + Math.random() * 0.7);
  init[i*4]   = Math.cos(a) * r;
  init[i*4+1] = ty + (Math.random() - 0.5) * 2.0 + GLOBE_CY;
  init[i*4+2] = Math.sin(a) * r;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
})));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ── simulation shader ──
const simU = { prev:{value:rtA.texture}, uDt:{value:0.016},
               uTime:{value:0}, uShake:{value:0.0} };
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D prev;
    uniform float uDt, uTime, uShake;
    varying vec2 vUv;

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

    /* nearest pagoda tier (y-level, target radius) */
    void nearestTier(float py, out float tY, out float tR){
      tY=-10.0; tR=8.5; float bd=abs(py-tY);
      float d;
      d=abs(py-(-5.0)); if(d<bd){bd=d;tY=-5.0;tR=7.0;}
      d=abs(py-0.0);    if(d<bd){bd=d;tY= 0.0;tR=5.5;}
      d=abs(py-5.0);    if(d<bd){bd=d;tY= 5.0;tR=4.0;}
      d=abs(py-9.0);    if(d<bd){bd=d;tY= 9.0;tR=2.8;}
      d=abs(py-13.0);   if(d<bd){bd=d;tY=13.0;tR=1.5;}
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float phase = s.w;

      vec3 local = p - vec3(0.0, 1.0, 0.0); // globe-local coords
      float h1 = hash(vUv);
      float h2 = hash(vUv * 1.3 + 0.7);

      // ── tier attraction ──
      float tY, tR;
      nearestTier(local.y, tY, tR);
      float targetR = tR * (0.45 + h1 * 0.55); // per-particle ring radius
      float dyTier = tY - local.y;
      float xzDist = length(local.xz);

      vec3 attract = vec3(0.0);
      attract.y = dyTier * 2.5;
      if (xzDist > 0.05){
        vec2 radDir = normalize(local.xz);
        attract.xz = radDir * (targetR - xzDist) * 1.4;
      }

      // ── tangential orbit (slow, contemplative) ──
      vec3 orbit = vec3(0.0);
      if (xzDist > 0.1){
        vec2 tang = vec2(-local.z, local.x) / xzDist;
        float spd = 0.35 + h2 * 0.3;
        // alternate directions per tier for visual interest
        float dir = mod(floor((tY + 12.0) * 0.2), 2.0) < 1.0 ? 1.0 : -1.0;
        orbit.xz = tang * spd * dir;
      }

      // ── dampen attraction during shake, add burst ──
      float shakeAmt = uShake;
      attract *= (1.0 - shakeAmt * 0.92);
      orbit   *= (1.0 - shakeAmt * 0.8);

      vec3 shakeF = vec3(0.0);
      if (shakeAmt > 0.01){
        float seed = floor(uTime / 22.0);
        float hr = hash(vUv + vec2(seed * 7.13, seed * 3.71));
        float ha = hash(vUv + vec2(seed * 1.37, seed * 9.17));
        shakeF.y = shakeAmt * (10.0 + hr * 14.0);
        float ang = ha * 6.2832;
        float mag = shakeAmt * (hr * 5.0 + 2.0);
        shakeF.x = cos(ang) * mag;
        shakeF.z = sin(ang) * mag;
      }

      // ── gravity (gentle snow-fall) ──
      vec3 grav = vec3(0.0, -0.6, 0.0);

      // ── gentle convective wobble (makes tiers breathe) ──
      vec3 wobble = vec3(0.0);
      wobble.y = sin(uTime*0.25 + local.x*0.15 + local.z*0.12) * 0.12;
      wobble.x = cos(uTime*0.2 + local.y*0.1) * 0.08;

      vec3 vel = attract + orbit + shakeF + grav + wobble;
      p += vel * uDt;

      // ── globe containment ──
      vec3 fromC = p - vec3(0.0, 1.0, 0.0);
      float dist = length(fromC);
      if (dist > 17.1){ // 95% of globe radius
        p = vec3(0.0,1.0,0.0) + normalize(fromC) * 17.0;
      }
      // floor
      if (p.y < 1.0 - 17.5) p.y = 1.0 - 17.5;

      phase = fract(phase + uDt * 0.012);
      gl_FragColor = vec4(p, phase);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ── render scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 6, 54);
camera.lookAt(0, GLOBE_CY, 0);

// ── particle points ──
const pGeom = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y*W+x;
  uvIdx[i*2]   = (x+0.5)/W;
  uvIdx[i*2+1] = (y+0.5)/H;
}
pGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pGeom.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdx, 2));

const pMat = new THREE.ShaderMaterial({
  uniforms: { state:{value:rtB.texture}, uPixel:{value:renderer.getPixelRatio()} },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vPhase;
    varying float vH;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vPhase = s.w;
      vH = clamp((p.y + 10.0) / 26.0, 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float d = -mv.z;
      gl_PointSize = (0.5 + vH * 0.7) * uPixel * (65.0 / max(d, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vPhase;
    varying float vH;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float r2 = dot(c,c);
      if (r2 > 0.25) discard;
      float a = exp(-r2 * 16.0) * 0.32;

      // ash-cyan → muted lavender → bone at peaks
      vec3 ashCyan  = vec3(0.40, 0.58, 0.64);
      vec3 lavender = vec3(0.52, 0.44, 0.60);
      vec3 bone     = vec3(0.82, 0.79, 0.74);

      vec3 col = mix(ashCyan, lavender, smoothstep(0.15, 0.7, vH));
      col = mix(col, bone, smoothstep(0.65, 1.0, vH) * 0.45);
      col += vec3(0.03) * sin(vPhase * 6.2832);

      gl_FragColor = vec4(col * a, a);
    }
  `
});
const pts = new THREE.Points(pGeom, pMat);
pts.renderOrder = 0;
scene.add(pts);

// ── glass globe (strong fresnel rim + window specular) ──
const globeGeo = new THREE.SphereGeometry(GLOBE_R, 64, 48);
const globeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vNorm;
    varying vec3 vViewDir;
    void main(){
      vec3 n = normalize(normalMatrix * normal);
      vNorm = n;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vViewDir = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vNorm;
    varying vec3 vViewDir;
    void main(){
      vec3 n = gl_FrontFacing ? vNorm : -vNorm;
      float fresnel = 1.0 - abs(dot(n, vViewDir));
      fresnel = pow(fresnel, 1.9);

      vec3 rimCol = vec3(0.48, 0.58, 0.68);
      float alpha = fresnel * 0.42;

      // window specular highlight (upper-right)
      vec3 lightDir = normalize(vec3(0.4, 0.9, 0.5));
      vec3 refl = reflect(-lightDir, n);
      float spec = pow(max(dot(refl, vViewDir), 0.0), 50.0);
      rimCol += vec3(0.90, 0.92, 0.88) * spec * 0.7;
      alpha += spec * 0.35;

      // secondary fill light (lower-left)
      vec3 ld2 = normalize(vec3(-0.3, -0.4, 0.6));
      float s2 = pow(max(dot(reflect(-ld2,n), vViewDir), 0.0), 80.0);
      rimCol += vec3(0.6, 0.65, 0.7) * s2 * 0.25;
      alpha += s2 * 0.12;

      // back-face is dimmer
      if (!gl_FrontFacing) alpha *= 0.3;

      gl_FragColor = vec4(rimCol, alpha);
    }
  `
});
const globe = new THREE.Mesh(globeGeo, globeMat);
globe.position.y = GLOBE_CY;
globe.renderOrder = 2;
scene.add(globe);

// ── base / pedestal ──
const baseGeo = new THREE.CylinderGeometry(7.5, 8.5, 3.2, 32);
const baseMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vPos; varying vec3 vNorm;
    void main(){
      vPos = position; vNorm = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos; varying vec3 vNorm;
    void main(){
      vec3 dark = vec3(0.07, 0.05, 0.04);
      vec3 mid  = vec3(0.13, 0.09, 0.06);
      float t = smoothstep(-1.6, 1.6, vPos.y);
      vec3 col = mix(dark, mid, t);
      float rim = 1.0 - abs(dot(vNorm, vec3(0,0,1)));
      col += vec3(0.08, 0.06, 0.05) * pow(rim, 3.0);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.y = GLOBE_CY - GLOBE_R - 1.6;
scene.add(base);

// ── inner ambient glow ──
const glowMesh = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R * 0.55, 24, 24),
  new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.BackSide,
    vertexShader: `varying vec3 vN; void main(){
      vN=normalize(normalMatrix*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader: `varying vec3 vN; void main(){
      float f=pow(1.0-abs(dot(vN,vec3(0,0,1))),2.2);
      vec3 c=vec3(0.30,0.42,0.50);
      gl_FragColor=vec4(c*f*0.07,f*0.07);}`
  })
);
glowMesh.position.y = GLOBE_CY;
glowMesh.renderOrder = 1;
scene.add(glowMesh);

// ── resize ──
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── animation loop ──
let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;

  // shake cycle: 22s total — 18s calm, 2s ramp-up shake, 2s decay
  const cycle = t % 22.0;
  let shake = 0.0;
  if (cycle > 18.0 && cycle < 20.0){
    const st = (cycle - 18.0) / 2.0;
    shake = Math.sin(st * Math.PI) * 0.75;
  } else if (cycle >= 20.0){
    const st = (cycle - 20.0) / 2.0;
    shake = Math.max(0, 0.15 * (1.0 - st)); // gentle tail
  }

  simU.uTime.value = t;
  simU.uDt.value = dt;
  simU.uShake.value = shake;

  // step simulation
  simU.prev.value = rtA.texture;
  renderer.setRenderTarget(rtB);
  renderer.render(simScene, camOrtho);
  const tmp = rtA; rtA = rtB; rtB = tmp;
  renderer.setRenderTarget(null);

  pMat.uniforms.state.value = rtA.texture;

  // very gentle camera sway (no Y rotation)
  const cx = Math.sin(t * 0.035) * 2.5;
  const cy = 6.0 + Math.sin(t * 0.028) * 1.2;
  camera.position.set(cx, cy, 54);
  camera.lookAt(0, GLOBE_CY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
