<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6ip · qualia strings</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080a0d; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">6ip</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>
<div class="src">James Turrell · perceptual field · L-system armature · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system (inherited from w20, slightly denser branching) ── */
const RULES = {
  'F': [
    { p: 0.38, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.28, s: 'F[+F][-F]F'             },
    { p: 0.20, s: 'F[/F][\\F]F'            },
    { p: 0.14, s: 'F[+F-F]F[\\F/F]'        },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(24);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0,1,0), L = new THREE.Vector3(-1,0,0), U = new THREE.Vector3(0,0,1);
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone(), gen = 0, maxGen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(depthFactor, gen);
        const np = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: np.clone(), gen });
        if (gen > maxGen) maxGen = gen;
        pos = np; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[': stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return { segments, maxGen };
}

/* ── Particle builder ── */
function buildParticles(segments, totalN, maxGen){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds     = new Float32Array(totalN);
  const gens      = new Float32Array(totalN);
  const quals     = new Float32Array(totalN); // individual qualia phase
  const v = new THREE.Vector3();
  let written = 0;

  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.03 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written] = Math.random();
      gens[written]  = segments[i].gen;
      quals[written] = Math.random(); // each particle's private experiential offset
      written++;
    }
  }
  return { positions, seeds, gens, quals };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(6, 3, 20);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080a0d,1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0,2,0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:         { value: 0 },
  uPixel:        { value: renderer.getPixelRatio() },
  uReady:        { value: 0 },
  uTipThreshold: { value: 3.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uTipThreshold;
    attribute float seed;
    attribute float gen;
    attribute float qual;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vGlow;

    // attempt to convey qualia: each particle has its own private color cycle
    // they all see the same tree but experience it differently
    vec3 qualiaColor(float phase, float t){
      // Turrell-inspired: deep violet → rose → warm peach → pale blue → violet
      // each particle traverses this at its own tempo
      float q = fract(phase + t * 0.02 + seed * 0.1);
      vec3 c0 = vec3(0.28, 0.12, 0.45); // deep violet
      vec3 c1 = vec3(0.72, 0.22, 0.38); // rose
      vec3 c2 = vec3(0.95, 0.68, 0.45); // warm peach
      vec3 c3 = vec3(0.55, 0.72, 0.88); // pale blue
      vec3 c4 = vec3(0.35, 0.18, 0.52); // violet return

      float seg = q * 4.0;
      if (seg < 1.0) return mix(c0, c1, seg);
      else if (seg < 2.0) return mix(c1, c2, seg - 1.0);
      else if (seg < 3.0) return mix(c2, c3, seg - 2.0);
      else return mix(c3, c4, seg - 3.0);
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.3 + seed * 6.28;

      // inherited sway — tender, slow breathing
      float sway = 0.03 * gen * (0.5 + 0.5*sin(t * 0.35));
      p.x += sway * sin(t * 0.45 + p.y * 0.2);
      p.z += sway * cos(t * 0.4 + p.y * 0.2);

      // catenary sag
      float sagAmount = 0.10 * gen * sin(seed * 3.14);
      p.y -= sagAmount * (1.0 - step(uTipThreshold, gen));

      // qualia breathing: each particle pulses in size at its own rate
      // like neurons firing at different frequencies
      float personalBreath = sin(uTime * (0.4 + qual * 0.6) + qual * 6.28);

      // reveal
      vec3 entry = vec3(seed*3.0-1.5, 20.0+seed*6.0, seed*3.0-1.5);
      p = mix(entry, p, smoothstep(0.0,1.0,uReady));

      // each particle's subjective color experience
      float isTip = step(uTipThreshold, gen);
      float bulbPhase = fract(seed * 7.0 + gen * 0.3);
      float isBulb = step(0.65, bulbPhase);
      isBulb = max(isBulb, isTip);

      // wire particles: very dim, barely colored
      vec3 wireCol = vec3(0.15, 0.12, 0.18);
      // bulb/tip particles: full qualia color
      vec3 qCol = qualiaColor(qual, uTime);

      vCol = mix(wireCol, qCol, isBulb);

      // awareness waves: periodically, groups of particles sync their color
      // like shared consciousness moments — then diverge again
      float syncWave = sin(uTime * 0.15 + p.y * 0.3) * 0.5 + 0.5;
      // when syncWave peaks, nearby particles converge toward a shared hue
      vec3 sharedHue = qualiaColor(0.0, uTime * 0.5); // the "consensus" experience
      vCol = mix(vCol, sharedHue, syncWave * 0.25 * isBulb);

      // alpha
      float baseA = mix(0.12, 0.55, isBulb);
      float pulse = 0.1 * personalBreath;
      vAlpha = (baseA + pulse * isBulb) * (0.3 + 0.7*uReady);

      vGlow = isBulb;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = mix(1.0, 3.2, isBulb);
      sz = mix(sz, 4.2, isTip * 0.5);
      // personal breath affects size — each particle's own rhythm
      sz += 0.6 * personalBreath * isBulb;
      gl_PointSize = sz * uPixel * (40.0/dist) * (0.3 + 0.7*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float sharpness = mix(18.0, 4.5, vGlow);
      float a = exp(-r * sharpness) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;
let centroid = new THREE.Vector3(0,2,0);

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const { segments, maxGen } = turtle(str, 0.78);

  const bb = new THREE.Box3();
  for (const sg of segments){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segments){
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }

  const { positions, seeds, gens, quals } = buildParticles(segments, N, maxGen);
  uniforms.uTipThreshold.value = Math.max(1, maxGen - 1);

  let cx=0, cy=0, cz=0;
  for (let i=0; i<N; i++){ cx+=positions[i*3]; cy+=positions[i*3+1]; cz+=positions[i*3+2]; }
  centroid.set(cx/N, cy/N, cz/N);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('qual',     new THREE.BufferAttribute(quals, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
    geom.attributes.qual.array.set(quals);          geom.attributes.qual.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random()*1e9));
addEventListener('click', () => regrow(Math.floor(Math.random()*1e9)));
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 3000);
  }

  controls.target.lerp(centroid, 0.01);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

loop();
</script>
</body>
</html>
