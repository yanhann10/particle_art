<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b5n · cypress ↔ art-deco tower · naïve hand</title>
<!-- MOTION: tremble, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#07080b; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">b5n</div>
<div class="hint">drag to orbit · click to flip · auto-morphs ~12s</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07080b, 0.016);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07080b, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ────────────── repeatable rng
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

// ────────────── L-system cypress
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let h = new THREE.Vector3(0, 1, 0);
  let l = new THREE.Vector3(-1, 0, 0);
  let u = new THREE.Vector3(0, 0, 1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

const cypressSegs = turtle(expand('F', 6, rng));

// ────────────── art-deco tower (with deliberate asymmetry)
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();
  // asymmetric setbacks — each tier slightly off-center (naïve hand)
  const tiers = [
    { hw: 4.5, y0: 0.0,  y1: 4.0,  ridges: 14, ox: 0.15, oz: -0.08 },
    { hw: 3.4, y0: 4.0,  y1: 7.5,  ridges: 12, ox: -0.1, oz: 0.12 },
    { hw: 2.4, y0: 7.5,  y1: 10.5, ridges: 10, ox: 0.08, oz: -0.05 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8,  ox: -0.06, oz: 0.09 },
    { hw: 0.85,y0: 13.0, y1: 15.0, ridges: 6,  ox: 0.04, oz: -0.03 },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;
  const W = Math.floor(N * 0.55);
  const B = Math.floor(N * 0.25);
  const S = Math.floor(N * 0.12);
  const C = N - W - B - S;
  let i = 0;

  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b, 0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0, ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      const face = Math.floor(Math.random() * 4);
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;
      const along = (ridgeFrac * 2 - 1) * t.hw;
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      const jitter = 0.04;
      switch(face){
        case 0: pos.set( t.hw + (Math.random()-0.5)*jitter + t.ox, y, along + t.oz); break;
        case 1: pos.set(-t.hw + (Math.random()-0.5)*jitter + t.ox, y, along + t.oz); break;
        case 2: pos.set(along + t.ox, y,  t.hw + (Math.random()-0.5)*jitter + t.oz); break;
        case 3: pos.set(along + t.ox, y, -t.hw + (Math.random()-0.5)*jitter + t.oz); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }

  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const along = (Math.random() * 2 - 1) * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set( t.hw + t.ox, edge + (Math.random()-0.5)*j, along + t.oz); break;
      case 1: pos.set(-t.hw + t.ox, edge + (Math.random()-0.5)*j, along + t.oz); break;
      case 2: pos.set(along + t.ox, edge + (Math.random()-0.5)*j,  t.hw + t.oz); break;
      case 3: pos.set(along + t.ox, edge + (Math.random()-0.5)*j, -t.hw + t.oz); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // spire — slightly tilted
  for (let k = 0; k < S; k++){
    const t = Math.random();
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th) * r + t * 0.12, y, Math.sin(th) * r - t * 0.08);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5) * 0.05;
    pos.set(Math.cos(th) * r, y, Math.sin(th) * r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ────────────── build N particles
const N = 70000;
const treePos  = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);
// "brushstroke" factor — 0 for most particles, >0 for ~7% that act as bold marks
const brushMark = new Float32Array(N);
// hand-jitter offset baked per particle (deliberate imperfection)
const handJitter = new Float32Array(N * 3);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N * SKELETON_FRAC);
const N_FOLIAGE = N - N_SKEL;

let written = 0;
const v = new THREE.Vector3();
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written)
    : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    // 7% chance of being a "brushstroke" particle
    brushMark[written] = Math.random() < 0.07 ? 0.6 + Math.random() * 0.8 : 0.0;
    // per-particle hand jitter: 10% of local scale
    const hj = 0.10;
    handJitter[written*3]   = (Math.random()-0.5) * hj;
    handJitter[written*3+1] = (Math.random()-0.5) * hj * 0.6;
    handJitter[written*3+2] = (Math.random()-0.5) * hj;
    written++;
  }
}

// foliage pass — with deliberate asymmetry (lean +x slightly)
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8;
  const SPIRAL = 0.9;
  const TUFT_COUNT = 24;
  const tuftYs = [], tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    tuftYs.push(haloYStart + ((i + 0.5) / TUFT_COUNT) * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }

  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT  = N_FOLIAGE - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    // asymmetric: +x side slightly fatter (lean)
    const leanX = 0.08 * yt;
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random() - 0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    treePos[written*3]   = Math.cos(th) * r + leanX;
    treePos[written*3+1] = y + (Math.random() - 0.5) * 0.05;
    treePos[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random();
    brushMark[written] = Math.random() < 0.07 ? 0.6 + Math.random() * 0.8 : 0.0;
    const hj = 0.10;
    handJitter[written*3]   = (Math.random()-0.5) * hj;
    handJitter[written*3+1] = (Math.random()-0.5) * hj * 0.6;
    handJitter[written*3+2] = (Math.random()-0.5) * hj;
    written++;
  }
  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t];
    const tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const tuftSize = 0.18;
    const localY = tuftY + (Math.random() - 0.5) * 0.4;
    const localTh = tuftTh + (Math.random() - 0.5) * 0.4;
    const localR = reach + (Math.random() - 0.5) * tuftSize;
    treePos[written*3]   = Math.cos(localTh) * localR;
    treePos[written*3+1] = localY;
    treePos[written*3+2] = Math.sin(localTh) * localR;
    seeds[written] = Math.random();
    brushMark[written] = Math.random() < 0.07 ? 0.6 + Math.random() * 0.8 : 0.0;
    const hj = 0.10;
    handJitter[written*3]   = (Math.random()-0.5) * hj;
    handJitter[written*3+1] = (Math.random()-0.5) * hj * 0.6;
    handJitter[written*3+2] = (Math.random()-0.5) * hj;
    written++;
  }
}
while (written < N){
  treePos[written*3] = 0; treePos[written*3+1] = 0; treePos[written*3+2] = 0;
  seeds[written] = Math.random(); brushMark[written] = 0;
  handJitter[written*3] = 0; handJitter[written*3+1] = 0; handJitter[written*3+2] = 0;
  written++;
}

function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity;
  let cx = 0, cz = 0;
  for (let i = 0; i < arr.length / 3; i++){
    minY = Math.min(minY, arr[i*3+1]);
    maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= arr.length / 3; cz /= arr.length / 3;
  const h = maxY - minY;
  const s = targetH / h;
  for (let i = 0; i < arr.length / 3; i++){
    arr[i*3]   = (arr[i*3]   - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

// ────────────── shader material
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',   new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',    new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos',   new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',       new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('brush',      new THREE.BufferAttribute(brushMark, 1));
geom.setAttribute('handJitter', new THREE.BufferAttribute(handJitter, 3));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    attribute float brush;
    attribute vec3 handJitter;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vBrush;
    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // apply baked hand-jitter (deliberate imperfection)
      p += handJitter * (1.0 + 0.3 * sin(uTime * 0.4 + seed * 12.0));

      // tremble: small per-particle shake (not smooth sway — jittery, hand-like)
      float t = uTime * 0.7 + seed * 6.28;
      float trembleAmt = 0.025 + brush * 0.015;
      p.x += trembleAmt * sin(t * 3.7 + seed * 19.0);
      p.y += trembleAmt * 0.5 * cos(t * 2.9 + seed * 23.0);
      p.z += trembleAmt * sin(t * 3.1 + seed * 31.0);

      // organic sway (reduced — tremble replaces some)
      float swayAmt = (1.0 - m) * 0.04 * (p.y / 16.0);
      p.x += swayAmt * sin(t * 0.55);
      p.z += swayAmt * cos(t * 0.45);

      vBrush = brush;
      float energy = 0.5 + 0.5 * sin(t * 0.8);

      // palette: muted, slightly dirty — not clean gradients
      // cypress: sage greens with ochre dust
      vec3 treeA = vec3(0.16, 0.30, 0.18);
      vec3 treeB = vec3(0.48, 0.68, 0.30);
      vec3 treeC = vec3(0.72, 0.78, 0.42);
      vec3 treeDust = vec3(0.55, 0.45, 0.28); // ochre marks
      // deco: tarnished bronze, not polished gold
      vec3 deco_a = vec3(0.35, 0.26, 0.15);
      vec3 deco_b = vec3(0.78, 0.60, 0.32);
      vec3 deco_c = vec3(0.90, 0.82, 0.65);
      vec3 decoPatina = vec3(0.30, 0.52, 0.42); // verdigris marks

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.7, 1.0, hk) * 0.5);
      // brushstroke particles get the ochre/patina accent
      treeCol = mix(treeCol, treeDust, brush * 0.7);

      vec3 decoCol = mix(deco_a, deco_b, hk);
      decoCol = mix(decoCol, deco_c, smoothstep(0.85, 1.0, hk) * 0.6);
      decoCol = mix(decoCol, decoPatina, brush * 0.5);

      vCol = mix(treeCol, decoCol, m);

      // size: brushstroke particles are 2-4x larger (visible marks)
      float baseSize = 0.8 + 0.5 * energy;
      float brushBoost = 1.0 + brush * 2.5;
      float sizeVariation = 0.7 + 0.6 * fract(seed * 7.31); // per-particle size randomness

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = baseSize * brushBoost * sizeVariation * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;

      // alpha: brush marks slightly more opaque
      vAlpha = (0.4 + 0.5 * energy) * (1.0 + brush * 0.4);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vBrush;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      // brush marks: less perfect circles — sharper edges, less gaussian
      float falloff = vBrush > 0.1 ? exp(-r * 10.0) : exp(-r * 18.0);
      float a = falloff * vAlpha;
      // slight color roughness on brush marks
      vec3 col = vCol;
      if (vBrush > 0.1) {
        col *= 0.85 + 0.3 * fract(dot(d, vec2(12.9898, 78.233)));
      }
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── interaction
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  const auto = (Math.floor(t / 12) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  // camera: slightly irregular orbit (not perfect circle — hand-drawn path)
  const ang = t * 0.048;
  const wobble = Math.sin(t * 0.13) * 0.8 + Math.sin(t * 0.31) * 0.4;
  const camR = 22 + wobble;
  camera.position.x = Math.sin(ang) * camR + Math.sin(t * 0.07) * 0.5;
  camera.position.z = Math.cos(ang) * camR;
  camera.position.y = 6 + Math.sin(t * 0.09) * 0.6;
  camera.lookAt(0.1, 8.0, -0.1); // slightly off-center lookAt
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
