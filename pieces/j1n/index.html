<script type="module">
import * as THREE from 'three';

// Gaëtan Robillard 'Critical Climate Machine' — text glyphs flow through transparent
// geometric volumes along splines distorted by 'truth' / 'distortion' nodes. Clean
// streams vs turbulent split branches. Instrument-panel teal on near-black.

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050608, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 3, 12);
camera.lookAt(0, 0, 0);

// node positions: 'truth' nodes pull flow straight; 'distortion' nodes bend and split
const nodes = [
  { pos: new THREE.Vector3(-4, 2, 0), type: 'truth', strength: 1.0 },
  { pos: new THREE.Vector3(4, -1.5, 0), type: 'distortion', strength: 1.6 },
  { pos: new THREE.Vector3(0, -3, -2), type: 'distortion', strength: 1.4 },
  { pos: new THREE.Vector3(-2, 0, 2), type: 'truth', strength: 0.9 }
];

// node visualization
nodes.forEach(n => {
  const geom = new THREE.SphereGeometry(0.18, 16, 16);
  const mat = new THREE.MeshBasicMaterial({
    color: n.type === 'truth' ? 0x3ea89f : 0xa83e4f,
    transparent: true,
    opacity: 0.75,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(n.pos);
  scene.add(mesh);

  const ringGeom = new THREE.TorusGeometry(0.4, 0.02, 8, 24);
  const ringMat = new THREE.MeshBasicMaterial({
    color: n.type === 'truth' ? 0x3ea89f : 0xa83e4f,
    transparent: true,
    opacity: 0.35,
    depthWrite: false
  });
  const ring = new THREE.Mesh(ringGeom, ringMat);
  ring.position.copy(n.pos);
  ring.rotation.x = Math.PI / 2;
  scene.add(ring);
});

// transparent geometric volumes — three cubes/boxes framing the space
const boxMat = new THREE.MeshBasicMaterial({
  color: 0x1a2533,
  transparent: true,
  opacity: 0.08,
  side: THREE.DoubleSide,
  depthWrite: false,
  wireframe: false
});
const boxEdgeMat = new THREE.LineBasicMaterial({ color: 0x2e4a5e, transparent: true, opacity: 0.35 });

function addBox(w, h, d, px, py, pz) {
  const geom = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geom, boxMat);
  mesh.position.set(px, py, pz);
  scene.add(mesh);
  const edges = new THREE.EdgesGeometry(geom);
  const line = new THREE.LineSegments(edges, boxEdgeMat);
  line.position.set(px, py, pz);
  scene.add(line);
}
addBox(6, 4, 3, -2, 0, 0);
addBox(5, 5, 2, 3, -1, -1);
addBox(4, 3, 4, 0, 2, 1);

// climate misinformation vocabulary
const vocab = [
  '97%', 'HOAX', 'SUN', 'CO₂', 'PAUSE', '1.5°C', 'IPCC', 'FRAUD',
  'NATURAL', 'CYCLE', 'ARCTIC', 'DATA', 'MODELS', 'POLAR', 'VORTEX',
  'ADJUST', 'COOLING', 'MEDIEVAL', 'WARM', 'PERIOD', 'HOCKEY', 'STICK',
  'GATE', 'EMAIL', 'FUNDING', 'AGENDA', 'CONSENSUS', '2050', 'NET-ZERO',
  'PPM', 'CH₄', 'ALBEDO', 'FEEDBACK', 'TIPPING', 'POINT'
];

// create text glyphs as sprites
const glyphCanvas = document.createElement('canvas');
glyphCanvas.width = 128;
glyphCanvas.height = 64;
const glyphCtx = glyphCanvas.getContext('2d');
const glyphTextures = vocab.map(word => {
  glyphCtx.clearRect(0, 0, 128, 64);
  glyphCtx.fillStyle = '#3ea89f';
  glyphCtx.font = 'bold 20px ui-monospace, monospace';
  glyphCtx.textAlign = 'center';
  glyphCtx.textBaseline = 'middle';
  glyphCtx.fillText(word, 64, 32);
  const tex = new THREE.CanvasTexture(glyphCanvas);
  tex.needsUpdate = true;
  return tex;
});

// particle system — each glyph flows along a spline path influenced by nodes
const N_GLYPHS = 480;
const glyphs = [];

class Glyph {
  constructor() {
    this.spawnT = Math.random() * 1000;
    this.word = vocab[Math.floor(Math.random() * vocab.length)];
    this.texIdx = vocab.indexOf(this.word);
    
    // start position and direction
    this.spawn = new THREE.Vector3(
      (Math.random() - 0.5) * 10,
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 6
    );
    this.baseVel = new THREE.Vector3(
      (Math.random() - 0.5) * 0.3,
      (Math.random() - 0.5) * 0.2,
      (Math.random() - 0.5) * 0.15
    );
    this.pos = this.spawn.clone();
    this.vel = this.baseVel.clone();
    this.age = 0;
    this.lifespan = 18 + Math.random() * 12;
    
    // which nodes affect this glyph
    this.affinity = Math.random();
    
    const spriteMat = new THREE.SpriteMaterial({
      map: glyphTextures[this.texIdx],
      transparent: true,
      opacity: 0,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    this.sprite = new THREE.Sprite(spriteMat);
    this.sprite.scale.set(0.8, 0.4, 1);
    scene.add(this.sprite);
  }
  
  update(dt, t) {
    this.age += dt;
    if (this.age > this.lifespan) {
      this.age = 0;
      this.pos.copy(this.spawn);
      this.vel.copy(this.baseVel);
    }
    
    // node influence
    const force = new THREE.Vector3(0, 0, 0);
    nodes.forEach(n => {
      const toNode = new THREE.Vector3().subVectors(n.pos, this.pos);
      const dist = toNode.length();
      if (dist < 0.01) return;
      
      const influence = Math.exp(-dist * 0.35) * n.strength;
      
      if (n.type === 'truth') {
        // truth nodes pull toward themselves, straighten flow
        toNode.normalize().multiplyScalar(influence * 0.5);
        force.add(toNode);
      } else {
        // distortion nodes push away with turbulence
        const perpendicular = new THREE.Vector3(-toNode.y, toNode.x, toNode.z * 0.5);
        perpendicular.normalize();
        const turbulence = Math.sin(t * 2.0 + this.pos.x * 0.5) * Math.cos(t * 1.7 + this.pos.z * 0.3);
        perpendicular.multiplyScalar(influence * 0.8 * (1.0 + turbulence * 0.6));
        force.add(perpendicular);
        
        // slight repulsion
        toNode.normalize().multiplyScalar(-influence * 0.15);
        force.add(toNode);
      }
    });
    
    // apply force with damping
    this.vel.add(force.multiplyScalar(dt * 0.5));
    this.vel.multiplyScalar(0.98);
    
    // baseline drift
    this.vel.x += Math.sin(t * 0.3 + this.age) * 0.008;
    this.vel.y += Math.cos(t * 0.4 + this.age * 0.7) * 0.006;
    
    this.pos.add(this.vel.clone().multiplyScalar(dt * 1.2));
    
    // bounds wrapping
    if (Math.abs(this.pos.x) > 8) this.pos.x = -Math.sign(this.pos.x) * 8;
    if (Math.abs(this.pos.y) > 6) this.pos.y = -Math.sign(this.pos.y) * 6;
    if (Math.abs(this.pos.z) > 5) this.pos.z = -Math.sign(this.pos.z) * 5;
    
    this.sprite.position.copy(this.pos);
    
    // fade in/out
    const fadeIn = Math.min(1.0, this.age * 0.8);
    const fadeOut = Math.min(1.0, (this.lifespan - this.age) * 0.8);
    const alpha = Math.min(fadeIn, fadeOut) * 0.75;
    
    // proximity to distortion nodes reduces opacity (obscured by turbulence)
    let distortionProx = 0;
    nodes.forEach(n => {
      if (n.type === 'distortion') {
        const d = this.pos.distanceTo(n.pos);
        distortionProx += Math.exp(-d * 0.8) * 0.4;
      }
    });
    
    this.sprite.material.opacity = alpha * (1.0 - Math.min(0.7, distortionProx));
    
    // color shift near distortion nodes
    const teal = new THREE.Color(0x3ea89f);
    const red = new THREE.Color(0xa83e4f);
    this.sprite.material.color.lerpColors(teal, red, Math.min(1.0, distortionProx * 2.0));
  }
}

for (let i = 0; i < N_GLYPHS; i++) {
  glyphs.push(new Glyph());
}

// ambient light
const ambient = new THREE.AmbientLight(0x1a2533, 0.4);
scene.add(ambient);

// directional rim light
const dirLight = new THREE.DirectionalLight(0x3ea89f, 0.6);
dirLight.position.set(5, 8, 4);
scene.add(dirLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  
  glyphs.forEach(g => g.update(dt, t));
  
  // slow camera orbit
  const ang = t * 0.08;
  camera.position.x = Math.sin(ang) * 12;
  camera.position.z = Math.cos(ang) * 12;
  camera.position.y = 3 + Math.sin(ang * 0.6) * 1.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
