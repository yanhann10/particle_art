<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3pv — chop and rearrange</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0d10; overflow: hidden; }
    #info {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.30); font: 11px/1.6 'SF Mono', monospace;
      letter-spacing: 0.08em; text-align: center; pointer-events: none;
    }
    #highlight-label {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(220,200,180,0.0); font: 12px/1 'SF Mono', monospace;
      letter-spacing: 0.12em; text-align: center; pointer-events: none;
      transition: color 0.4s;
    }
  </style>
</head>
<body>
<div id="info">chop and rearrange · click fragment to isolate</div>
<div id="highlight-label"></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────────────────────────────────────────────
// SCENE SETUP
// ─────────────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d10);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 1000);
camera.position.set(0, 100, 380);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.6;
document.body.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.06;
ctrl.target.set(0, 0, 0);
ctrl.minDistance = 80;
ctrl.maxDistance = 600;

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTING — industrial high-contrast: strong key, dim fill, warm rim
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x303040, 0.20));

const key = new THREE.DirectionalLight(0xfff8f0, 5.0);
key.position.set(200, 300, 180);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 1000;
key.shadow.camera.left = -350; key.shadow.camera.right = 350;
key.shadow.camera.top = 350; key.shadow.camera.bottom = -350;
scene.add(key);

const fill = new THREE.DirectionalLight(0x4060a0, 0.6);
fill.position.set(-200, 80, -120);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff8830, 1.3);
rim.position.set(60, -200, -220);
scene.add(rim);

// ─────────────────────────────────────────────────────────────────────────────
// STEP 1 — define_base_shape()
// Donor volume: a thick-walled hollow tube (industrial column)
// Represented as a torus-like solid: rInner=28, rOuter=52, height=130
// We build arc-segment geometries ANALYTICALLY so no clip planes needed.
// ─────────────────────────────────────────────────────────────────────────────

const R_INNER = 28;
const R_OUTER = 52;
const H_HALF  = 65;   // half-height of the tube

// ─────────────────────────────────────────────────────────────────────────────
// STEP 2 + 3 — compute_cuts() + extract_fragments()
// Each fragment is an arc-segment (pie-slice) of the tube, built analytically:
// - aStart..aEnd: azimuthal angular range
// - Full height (the "cut" here is purely angular, like a saw running radially)
// BufferGeometry built from scratch: front face, back face, inner wall, outer wall
// ─────────────────────────────────────────────────────────────────────────────

function build_arc_segment(aStart, aEnd, rInner, rOuter, yBot, yTop, radialSegs) {
  // Build a closed arc-segment (pie wedge of the tube wall)
  // Faces: outer curved wall, inner curved wall, top cap, bottom cap,
  //        two flat radial end-walls (where the cuts are)

  const positions = [];
  const normals   = [];
  const indices   = [];

  let vIdx = 0;

  // Helper: add a quad (two triangles) from 4 positions + normals
  function addQuad(p0, n0, p1, n1, p2, n2, p3, n3) {
    const base = vIdx;
    [p0,p1,p2,p3].forEach((p,i) => {
      positions.push(p.x, p.y, p.z);
      const n = [n0,n1,n2,n3][i];
      normals.push(n.x, n.y, n.z);
    });
    indices.push(base,base+1,base+2, base,base+2,base+3);
    vIdx += 4;
  }

  // Helper: add a triangle
  function addTri(p0,n0, p1,n1, p2,n2) {
    positions.push(p0.x,p0.y,p0.z, p1.x,p1.y,p1.z, p2.x,p2.y,p2.z);
    normals.push(n0.x,n0.y,n0.z, n1.x,n1.y,n1.z, n2.x,n2.y,n2.z);
    indices.push(vIdx, vIdx+1, vIdx+2);
    vIdx += 3;
  }

  const N = Math.max(radialSegs, 3);
  const aStep = (aEnd - aStart) / N;

  // — OUTER curved wall (normal pointing outward radially) —
  for (let i = 0; i < N; i++) {
    const a0 = aStart + i * aStep;
    const a1 = aStart + (i+1) * aStep;
    const c0 = Math.cos(a0), s0 = Math.sin(a0);
    const c1 = Math.cos(a1), s1 = Math.sin(a1);

    const p00 = new THREE.Vector3(c0*rOuter, yBot, s0*rOuter);
    const p01 = new THREE.Vector3(c0*rOuter, yTop, s0*rOuter);
    const p10 = new THREE.Vector3(c1*rOuter, yBot, s1*rOuter);
    const p11 = new THREE.Vector3(c1*rOuter, yTop, s1*rOuter);

    const nMid = new THREE.Vector3(Math.cos((a0+a1)/2), 0, Math.sin((a0+a1)/2)).normalize();
    const n0v  = new THREE.Vector3(c0, 0, s0);
    const n1v  = new THREE.Vector3(c1, 0, s1);

    addQuad(p00, n0v, p10, n1v, p11, n1v, p01, n0v);
  }

  // — INNER curved wall (normal pointing inward) —
  for (let i = 0; i < N; i++) {
    const a0 = aStart + i * aStep;
    const a1 = aStart + (i+1) * aStep;
    const c0 = Math.cos(a0), s0 = Math.sin(a0);
    const c1 = Math.cos(a1), s1 = Math.sin(a1);

    const p00 = new THREE.Vector3(c0*rInner, yBot, s0*rInner);
    const p01 = new THREE.Vector3(c0*rInner, yTop, s0*rInner);
    const p10 = new THREE.Vector3(c1*rInner, yBot, s1*rInner);
    const p11 = new THREE.Vector3(c1*rInner, yTop, s1*rInner);

    const n0v = new THREE.Vector3(-c0, 0, -s0);
    const n1v = new THREE.Vector3(-c1, 0, -s1);

    // Reversed winding for inward face
    addQuad(p01, n0v, p11, n1v, p10, n1v, p00, n0v);
  }

  // — TOP cap (annular ring, normal = +Y) —
  for (let i = 0; i < N; i++) {
    const a0 = aStart + i * aStep;
    const a1 = aStart + (i+1) * aStep;
    const c0 = Math.cos(a0), s0 = Math.sin(a0);
    const c1 = Math.cos(a1), s1 = Math.sin(a1);

    const up = new THREE.Vector3(0, 1, 0);
    addQuad(
      new THREE.Vector3(c0*rInner, yTop, s0*rInner), up,
      new THREE.Vector3(c1*rInner, yTop, s1*rInner), up,
      new THREE.Vector3(c1*rOuter, yTop, s1*rOuter), up,
      new THREE.Vector3(c0*rOuter, yTop, s0*rOuter), up
    );
  }

  // — BOTTOM cap (normal = -Y) —
  for (let i = 0; i < N; i++) {
    const a0 = aStart + i * aStep;
    const a1 = aStart + (i+1) * aStep;
    const c0 = Math.cos(a0), s0 = Math.sin(a0);
    const c1 = Math.cos(a1), s1 = Math.sin(a1);

    const dn = new THREE.Vector3(0, -1, 0);
    addQuad(
      new THREE.Vector3(c0*rOuter, yBot, s0*rOuter), dn,
      new THREE.Vector3(c1*rOuter, yBot, s1*rOuter), dn,
      new THREE.Vector3(c1*rInner, yBot, s1*rInner), dn,
      new THREE.Vector3(c0*rInner, yBot, s0*rInner), dn
    );
  }

  // — SIDE walls (flat radial planes at aStart and aEnd) —
  // Wall at aStart (normal pointing tangentially, clockwise side)
  {
    const a = aStart;
    const c = Math.cos(a), s = Math.sin(a);
    // Normal: tangent at aStart pointing "out" (perpendicular to radius, clockwise)
    const n = new THREE.Vector3(-s, 0, c); // CCW tangent → CW normal for start face
    addQuad(
      new THREE.Vector3(c*rInner, yBot, s*rInner), n,
      new THREE.Vector3(c*rOuter, yBot, s*rOuter), n,
      new THREE.Vector3(c*rOuter, yTop, s*rOuter), n,
      new THREE.Vector3(c*rInner, yTop, s*rInner), n
    );
  }
  // Wall at aEnd (opposite normal)
  {
    const a = aEnd;
    const c = Math.cos(a), s = Math.sin(a);
    const n = new THREE.Vector3(s, 0, -c);
    addQuad(
      new THREE.Vector3(c*rInner, yBot, s*rInner), n,
      new THREE.Vector3(c*rInner, yTop, s*rInner), n,
      new THREE.Vector3(c*rOuter, yTop, s*rOuter), n,
      new THREE.Vector3(c*rOuter, yBot, s*rOuter), n
    );
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals,   3));
  geo.setIndex(indices);
  geo.computeBoundingBox();
  return geo;
}

// ─────────────────────────────────────────────────────────────────────────────
// STEP 4 — arrange_composition()
// Radially spread fragments with vertical stagger + slight yaw rotation
// ─────────────────────────────────────────────────────────────────────────────
const N_FRAGS = 6;
const aStep   = (Math.PI * 2) / N_FRAGS;

// High-contrast palette: alternating warm light / dark cool
const PALETTE = [
  { color: 0xe0d0b8, roughness: 0.55, metalness: 0.30 },  // warm cream
  { color: 0x1e2838, roughness: 0.70, metalness: 0.18 },  // dark steel
  { color: 0xc8b888, roughness: 0.60, metalness: 0.25 },  // bronze sand
  { color: 0x182030, roughness: 0.68, metalness: 0.14 },  // deep indigo
  { color: 0xd8c8a8, roughness: 0.50, metalness: 0.38 },  // pale stone
  { color: 0x283020, roughness: 0.75, metalness: 0.10 },  // dark olive
];

const yOffsets   = [50, -35, 60, -50, 25, -45];
const orbitRadii = [115, 130, 108, 125, 120, 112];
const zExtras    = [15, -25, 30, -15, 22, -30];
const twistDir   = [+1, -1, +1, -1, +1, -1];

const fragments = [];
const fragmentGroup = new THREE.Group();

for (let i = 0; i < N_FRAGS; i++) {
  const a0 = i * aStep;
  const a1 = (i + 1) * aStep;
  const midA = (a0 + a1) / 2;

  // Build arc-segment geometry (mathematical fragment — no clip planes)
  const geo = build_arc_segment(a0, a1, R_INNER, R_OUTER, -H_HALF, H_HALF, 14);

  const p = PALETTE[i];
  const mat = new THREE.MeshStandardMaterial({
    color: p.color,
    roughness: p.roughness,
    metalness: p.metalness,
    side: THREE.FrontSide,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Arrange: place fragment outward along its mid-angle
  const r = orbitRadii[i];
  const tx = Math.sin(midA) * r;
  const tz = Math.cos(midA) * r + zExtras[i];
  const ty = yOffsets[i];

  // Slight yaw: turn fragment to face outward (away from center)
  const rotY = midA + twistDir[i] * 0.20;
  const rotZ = (i % 3 - 1) * 0.09;

  mesh.position.set(tx, ty, tz);
  mesh.rotation.y = rotY;
  mesh.rotation.z = rotZ;

  mesh.userData = {
    fragmentIndex: i,
    midA,
    homePos: new THREE.Vector3(tx, ty, tz),
    homeRotY: rotY,
    homeRotZ: rotZ,
    breathPhase: (i / N_FRAGS) * Math.PI * 2,
    palette: p,
  };

  fragmentGroup.add(mesh);
  fragments.push(mesh);
}

scene.add(fragmentGroup);

// ─────────────────────────────────────────────────────────────────────────────
// GHOST — faint wireframe tube at origin showing the original "donor" form
// ─────────────────────────────────────────────────────────────────────────────
{
  const pts = [
    new THREE.Vector2(R_INNER, -H_HALF),
    new THREE.Vector2(R_OUTER, -H_HALF),
    new THREE.Vector2(R_OUTER,  H_HALF),
    new THREE.Vector2(R_INNER,  H_HALF),
    new THREE.Vector2(R_INNER, -H_HALF),
  ];
  const ghostGeo = new THREE.LatheGeometry(pts, 48);
  const ghostMat = new THREE.MeshBasicMaterial({
    color: 0x556677,
    wireframe: true,
    transparent: true,
    opacity: 0.08,
  });
  scene.add(new THREE.Mesh(ghostGeo, ghostMat));
}

// ─────────────────────────────────────────────────────────────────────────────
// CLICK INTERACTION
// ─────────────────────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const label = document.getElementById('highlight-label');
const NAMES = ['fragment I','fragment II','fragment III','fragment IV','fragment V','fragment VI'];
let isolatedIdx = -1;

function setIsolated(idx) {
  isolatedIdx = idx;
  fragments.forEach((f, i) => {
    const m = f.material;
    if (idx === -1) {
      m.opacity = 1; m.transparent = false;
      m.emissive = new THREE.Color(0x000000); m.emissiveIntensity = 0;
    } else if (i === idx) {
      m.opacity = 1; m.transparent = false;
      m.emissive = new THREE.Color(0x3a2010); m.emissiveIntensity = 0.45;
    } else {
      m.opacity = 0.08; m.transparent = true;
      m.emissive = new THREE.Color(0x000000); m.emissiveIntensity = 0;
    }
  });
  if (idx === -1) {
    label.style.color = 'rgba(220,200,180,0.0)';
    label.textContent = '';
  } else {
    label.style.color = 'rgba(220,200,180,0.80)';
    label.textContent = NAMES[idx] + ' · click to release';
  }
}

renderer.domElement.addEventListener('click', e => {
  mouse.x =  (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(fragments);
  if (hits.length > 0) {
    const idx = hits[0].object.userData.fragmentIndex;
    setIsolated(isolatedIdx === idx ? -1 : idx);
  } else if (isolatedIdx !== -1) {
    setIsolated(-1);
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// ANIMATION
// ─────────────────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Slow collective rotation
  fragmentGroup.rotation.y = t * 0.017;

  // Per-fragment: breathing scale + vertical float
  fragments.forEach(f => {
    const ph = f.userData.breathPhase;
    const breath = 1.0 + Math.sin(t * 0.30 * Math.PI * 2 + ph) * 0.025;
    f.scale.setScalar(breath);
    f.position.y = f.userData.homePos.y
      + Math.sin(t * 0.18 * Math.PI * 2 + ph * 0.65) * 4.5;
  });

  ctrl.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
