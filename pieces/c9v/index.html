<html lang="en">

<title>c9v · Shiota — Gathering Home</title>
<!-- MOTION: gather, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">c9v</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.0022);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.012));
const pL = new THREE.PointLight(0xffd0a0, 0.035, 50, 1.8);
pL.position.set(-2, 14, 3);
scene.add(pL);

let seed = 73019284;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

const ROOM = { w:36, h:30, d:40 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

// ── THE SPHERE — suspended between two countries, a pale embryo
// in a womb of red thread. Shiota: "I am always in-between."
const sphereCenter = new THREE.Vector3(0.0, 0.4, -0.3);
const sphereR = 1.8;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8d8, emissive: 0xe0d4b8, emissiveIntensity: 0.65,
    roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.3
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Core warmth — memory stored as light
const core = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.35, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xfcf2e2, transparent: true, opacity: 0.04 })
);
core.position.copy(sphereCenter);
scene.add(core);

// ── Suspension threads — gravity's evidence, 10 dark lines
const suspPts = [];
for(let i = 0; i < 10; i++){
  const a = (i/10)*Math.PI*2 + (rng()-0.5)*0.5;
  const topR = 0.5 + rng()*1.4;
  const botR = 0.02 + rng()*0.06;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*topR, hh, sphereCenter.z + Math.sin(a)*topR,
    sphereCenter.x + Math.cos(a)*botR, sphereCenter.y + sphereR - 0.04, sphereCenter.z + Math.sin(a)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x080202, transparent: true, opacity: 0.5
})));

function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR*0.93,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ANCHORS — truncated icosahedron vertices projected into concentric shells
// (Mohr: let geometry generate the topology)
// Then scattered with hand-placed irregularity
const anchors = [];

// Golden ratio vertices for icosahedral symmetry
const phi = (1+Math.sqrt(5))/2;
const icoVerts = [
  [0,1,phi*3],[0,-1,phi*3],[0,1,-phi*3],[0,-1,-phi*3],
  [1,phi*3,0],[-1,phi*3,0],[1,-phi*3,0],[-1,-phi*3,0],
  [phi*3,0,1],[phi*3,0,-1],[-phi*3,0,1],[-phi*3,0,-1]
];
const shells = [3.2, 5.8, 9.0, 13, 17];
for(const sr of shells){
  // Place icosahedral vertices at each shell radius
  for(const iv of icoVerts){
    const len = Math.sqrt(iv[0]**2+iv[1]**2+iv[2]**2);
    const scale = sr / len * (0.85 + rng()*0.3);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + iv[0]*scale + (rng()-0.5)*sr*0.08,
      sphereCenter.y + iv[1]*scale*0.82 + (rng()-0.5)*sr*0.06,
      sphereCenter.z + iv[2]*scale + (rng()-0.5)*sr*0.08
    ));
  }
  // Fill with random points on the shell
  const extra = Math.floor(8 + sr*1.8);
  for(let i = 0; i < extra; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.8+rng()*0.4);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.8,
      sphereCenter.z + Math.cos(v)*r
    ));
  }
}
// Wall-pinned anchors
for(let i = anchors.length; i < 400; i++){
  anchors.push(rng()<0.2 ? wallPt() : wallPt().lerp(sphereCenter, 0.01+rng()*0.12));
}

// Void zones — breathing room, windows into the dark
const voids = [
  { pos: new THREE.Vector3(-5, -4, 7), r:2.6 },
  { pos: new THREE.Vector3(7, 4, -4), r:2.0 },
  { pos: new THREE.Vector3(2, -9, -5), r:2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos)<v.r) return true;
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Near the sphere, threads snap to 15° radial increments (Molnár: order near center)
// Farther out, they go free (chaos at the periphery)
function quantizeAngle(origin, target){
  const d = origin.distanceTo(sphereCenter);
  if(d > 6.0) return target; // free
  const quantStrength = Math.max(0, 1.0 - d/6.0);
  const dir = target.clone().sub(sphereCenter);
  const theta = Math.atan2(dir.z, dir.x);
  const step = Math.PI/12; // 15°
  const snapped = Math.round(theta/step)*step;
  const blended = theta + (snapped - theta)*quantStrength*0.6;
  const horiz = Math.sqrt(dir.x**2 + dir.z**2);
  return new THREE.Vector3(
    sphereCenter.x + Math.cos(blended)*horiz,
    target.y,
    sphereCenter.z + Math.sin(blended)*horiz
  );
}

// RULE 1: CONVERGENCE — 55% of lines reach for the sphere
// The web gathers. Every thread is a question about belonging.
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  let target = sphereSurf();
  target = quantizeAngle(origin, target);

  // 12% stop short — threads that almost reach but fail
  // the gap between wanting to arrive and arriving
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng()*1.2;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: PROXIMITY — anchor-to-anchor if within 4.5 units
// The bonds between places: lateral connections, not just radial
const THRESH = 4.5;
const catBtarget = Math.floor(NUM_LINES * 0.25);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 60000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.25 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// DENDRITIC FILAMENTS — branching chains radiating from the sphere
// morphogenetic: each new anchor at midpoint of parent, 3 generations
for(let i = 0; i < 160 && li < NUM_LINES; i++){
  let pt = sphereSurf();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.35 + rng()*0.8;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    if(!inVoid(next)) setLine(pt, next, 2);
    // Fork at midpoint — morphogenetic branching
    if(rng() < 0.4 && li < NUM_LINES){
      const mid = pt.clone().lerp(next, 0.5);
      const fDir = dir.clone().add(new THREE.Vector3(
        (rng()-0.5)*1.4, (rng()-0.5)*1.4, (rng()-0.5)*1.4
      )).normalize();
      const fEnd = mid.clone().add(fDir.multiplyScalar(0.25+rng()*0.5));
      if(!inVoid(fEnd)) setLine(mid, fEnd, 2);
    }
    pt = next;
    prevDir = dir;
  }
}

// Fill remainder: sparse architectural spans (wall-to-wall)
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.15 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
// convergence (warm bright), proximity (mid), filament (warm), architectural (ghost)
const catOpacity = [0.085, 0.05, 0.065, 0.02];
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.02;
  const bright = op / 0.085;
  // Threads nearer the sphere are slightly warmer
  const distFade = Math.max(0.5, 1.0 - lineDist[i]*0.015);
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright * distFade;
    colors[i*6+v*3+1] = bG * bright * distFade;
    colors[i*6+v*3+2] = bB * bright * distFade * 0.85;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.085,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred letters, old keys, passport corners
// caught in transit between two home countries
const NUM_FRAGMENTS = 22;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.06;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.35+rng()*0.8);
  const h = sz*(0.4+rng()*1.0);
  // Irregular quadrilateral — hand-torn edges
  const verts = new Float32Array([
    w*(-0.35+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.1,
    -w*0.5, h*(-0.15+rng()*0.1), (rng()-0.5)*sz*0.1,
    w*(0.05-rng()*0.25), -h*0.5, (rng()-0.5)*sz*0.1,
    w*(-0.35+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.1,
    w*(0.2+rng()*0.15), h*(rng()*0.05), (rng()-0.5)*sz*0.1,
    w*(0.05-rng()*0.25), -h*0.5, (rng()-0.5)*sz*0.1
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.03, d*0.01),
    transparent: true,
    opacity: 0.12 + rng()*0.22,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  // Place along convergence threads
  if(rng()<0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15+rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t)+basePositions[si+3]*t,
      basePositions[si+1]*(1-t)+basePositions[si+4]*t,
      basePositions[si+2]*(1-t)+basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.8+rng()*5));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA — narrative of gathering
// Phase 1: The viewer wakes inside the web, face-to-face with the sphere.
//          Dense red fills the peripheral vision. Disorientation.
// Phase 2: Slow lateral drift — sliding along the threads like a hand
//          tracing yarn. The sphere shifts from center to edge of frame.
// Phase 3: Descent — dropping below the sphere, looking up through the
//          convergence. The capillaries of memory overhead.
// Phase 4: Rising return — gathering upward, the sphere re-enters frame.
//          The gathering never completes. The loop is the longing.
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y, xOff=0, zOff=0;
  if(t < 0.3){
    // Phase 1: intimate proximity — just outside the thread cloud
    const lt = t/0.3;
    rH = 3.0 + lt*1.0;
    y = cy - 0.5 + lt*1.5;
    xOff = Math.sin(lt*Math.PI*0.5)*0.8;
  } else if(t < 0.5){
    // Phase 2: lateral drift — sliding sideways through the web
    const lt = (t-0.3)/0.2;
    rH = 4.0 + lt*2.5;
    y = cy + 1.0 + Math.sin(lt*Math.PI)*1.5;
    xOff = Math.sin(lt*Math.PI)*2.0;
    zOff = Math.cos(lt*Math.PI*0.7)*1.2;
  } else if(t < 0.7){
    // Phase 3: descent — dropping below, looking up into the web canopy
    const lt = (t-0.5)/0.2;
    rH = 6.5 + Math.sin(lt*Math.PI)*2.0;
    y = cy + 2.5 - lt*6.0;
    xOff = Math.cos(lt*Math.PI)*0.5;
  } else {
    // Phase 4: gathering return — rising, pulled back toward the sphere
    const lt = (t-0.7)/0.3;
    rH = 6.5 - lt*3.5;
    y = cy - 3.5 + lt*3.0;
    zOff = Math.sin(lt*Math.PI)*0.6;
  }

  const x = cx + Math.sin(p*1.08)*rH + xOff;
  const z = cz + Math.cos(p*1.08)*(rH*1.05) + zOff;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — anchor jitter < 0.5% of length
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.0001 * Math.max(0, 1.0-dist/18.0);
    const phase = basePositions[idx]*0.09 + basePositions[idx+1]*0.11 + i*0.00025;
    const breath = Math.sin(elapsed*0.005+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.09;
      arr[vi+2] = basePositions[vi+2] + breath*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — glacial, contemplative
  const speed = 0.0002;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — always the gravitational center
  // But with slow vertical wander: sometimes looking slightly above,
  // sometimes below — as if searching for it
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0007)*0.04;
  look.y += Math.cos(elapsed*0.0005)*0.3 + 0.1;
  look.z += Math.sin(elapsed*0.0008+0.5)*0.03;
  camera.lookAt(look);

  // Light drift — archive darkness, not gallery ambiance
  pL.position.x = -2 + Math.sin(elapsed*0.0003)*0.08;
  pL.position.y = 14 + Math.cos(elapsed*0.00018)*0.04;
  pL.intensity = 0.035 + Math.sin(elapsed*0.0004)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
