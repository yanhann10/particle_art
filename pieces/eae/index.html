<title>eae · Cold Dark Matter (tree)</title>
<!-- MOTION: shatter, intensity: explosive -->
<!-- Cornelia Parker's "Cold Dark Matter: An Exploded View" — a garden shed suspended mid-detonation.
     Here an L-system tree perpetually shatters and reforms: leaves blast outward, hang in space,
     then are drawn back by invisible threads. Separation/return as narrative arc. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0906; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">eae</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F' },
    { p: 0.15, s: 'F[/F][\\F]F' },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]' },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0,1,0), L = new THREE.Vector3(-1,0,0), U = new THREE.Vector3(0,0,1);
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone(), gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(depthFactor, gen);
        const np = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: np.clone(), gen });
        pos = np; break;
      }
      case '+': rotate(u, +ANGLE); break; case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break; case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break; case '\\': rotate(h, -ANGLE); break;
      case '[': stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

/* ── Build particle data ── */
const N = 80000;

function buildParticles(segments){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b, 0);
  const homePos = new Float32Array(N*3);
  const seeds   = new Float32Array(N);
  const gens    = new Float32Array(N);
  const blastDir= new Float32Array(N*3); // per-particle shatter direction
  const v = new THREE.Vector3();
  let written = 0;

  // Find tree centroid for blast directions
  const ctr = new THREE.Vector3();
  for (const s of segments){ ctr.add(s.from); ctr.add(s.to); }
  ctr.divideScalar(segments.length * 2);

  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1 ? N - written : Math.max(1, Math.floor(N * lens[i] / total));
    for (let k = 0; k < share && written < N; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      homePos[written*3]   = v.x;
      homePos[written*3+1] = v.y;
      homePos[written*3+2] = v.z;

      // blast direction: outward from centroid + upward bias for leaves, random for trunk
      const dx = v.x - ctr.x, dy = v.y - ctr.y, dz = v.z - ctr.z;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.001;
      const genNorm = segments[i].gen / 5.0;
      // leaves get radial blast + upward; trunk gets random tumble
      const rx = (Math.random()-0.5)*0.6, ry = Math.random()*0.4, rz = (Math.random()-0.5)*0.6;
      blastDir[written*3]   = dx/dist * (0.5+genNorm) + rx;
      blastDir[written*3+1] = dy/dist * (0.3+genNorm) + ry + genNorm*0.8;
      blastDir[written*3+2] = dz/dist * (0.5+genNorm) + rz;

      seeds[written] = Math.random();
      gens[written]  = segments[i].gen;
      written++;
    }
  }
  return { homePos, seeds, gens, blastDir };
}

function makeTree(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s>>>15, 1|s); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; };
  const str = expand('F', 5, rng);
  const segs = turtle(str, 0.78);
  const bb = new THREE.Box3();
  for (const s of segs){ bb.expandByPoint(s.from); bb.expandByPoint(s.to); }
  const c = bb.getCenter(new THREE.Vector3()), mn = bb.min;
  for (const s of segs){
    s.from.x -= c.x; s.from.z -= c.z; s.from.y -= mn.y - (-7);
    s.to.x   -= c.x; s.to.z   -= c.z; s.to.y   -= mn.y - (-7);
  }
  return buildParticles(segs);
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 5, 24);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0906, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

/* ── Shatter cycle timing ──
   Phase 0 (0-7s):   tree whole, gentle sway
   Phase 1 (7-7.4s): BLAST — particles explode outward
   Phase 2 (7.4-13s): suspended in space, slow drift (Cornelia Parker moment)
   Phase 3 (13-16s): particles drawn back, reform tree
   Total cycle: 16s */
const CYCLE = 16.0;
const T_BLAST = 7.0;
const T_HANG  = 7.4;
const T_RETURN = 13.0;

const uniforms = {
  uTime:  { value: 0 },
  uPhase: { value: 0 },  // 0=whole, 1=blasting, 2=hanging, 3=returning
  uBlend: { value: 0 },  // 0=home, 1=fully shattered
  uPixel: { value: renderer.getPixelRatio() },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uBlend;
    uniform float uPixel;
    attribute float seed;
    attribute float gen;
    attribute vec3 blastDir;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 home = position;
      float t = uTime * 0.5 + seed * 6.28;

      // gentle sway at home position
      float sway = 0.04 * gen * (0.5 + 0.5*sin(t * 0.7));
      vec3 swayed = home;
      swayed.x += sway * sin(t + home.y * 0.3);
      swayed.z += sway * cos(t * 0.9 + home.y * 0.3);

      // shattered position: home + blast * distance factor
      // leaves (high gen) fly farther; trunk barely moves
      float blastMag = 4.0 + gen * 3.5 + seed * 2.0;
      vec3 scattered = home + blastDir * blastMag;
      // add slow drift while suspended
      scattered.x += sin(t * 0.3 + seed * 3.0) * 0.4;
      scattered.y += cos(t * 0.2 + seed * 5.0) * 0.3 + 0.15; // slight rise
      scattered.z += sin(t * 0.25 + seed * 7.0) * 0.4;

      vec3 p = mix(swayed, scattered, uBlend);

      // palette: Cornelia Parker palette — charcoal trunk, ember orange, ash white
      // 5 hand-picked colors:
      // #3D2B1F bistre (deep bark)
      // #C75B12 burnt orange (mid branches)
      // #D4A017 old gold (outer leaves)
      // #E8D5B7 parchment (tips catching light)
      // #1A1612 deep shadow (trunk core)
      vec3 c0 = vec3(0.10, 0.09, 0.07);  // deep shadow trunk
      vec3 c1 = vec3(0.24, 0.17, 0.12);  // bistre bark
      vec3 c2 = vec3(0.78, 0.36, 0.07);  // burnt orange
      vec3 c3 = vec3(0.83, 0.63, 0.09);  // old gold
      vec3 c4 = vec3(0.91, 0.84, 0.72);  // parchment tip

      float k = clamp(gen / 5.0, 0.0, 1.0);
      vec3 col = mix(c0, c1, smoothstep(0.0, 0.2, k));
      col = mix(col, c2, smoothstep(0.2, 0.5, k));
      col = mix(col, c3, smoothstep(0.5, 0.8, k));
      col = mix(col, c4, smoothstep(0.8, 1.0, k));

      // when shattered: leaves glow brighter (embers)
      col = mix(col, col * (1.2 + 0.3 * sin(t)), uBlend * k);

      vCol = col;
      // alpha: trunk stays visible, leaves fade slightly when far
      vAlpha = mix(0.7, 0.4 + 0.5 * (1.0 - k), uBlend);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // leaves are slightly larger when scattered (catching light)
      float sizeMult = mix(1.0, 1.3 + 0.4*k, uBlend);
      gl_PointSize = sizeMult * uPixel * (38.0 / dist) * (0.5 + 0.5*k + 0.3*seed);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // leaf-like: slightly elongated falloff
      float shape = exp(-r * 14.0);
      float a = shape * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

/* ── Background gradient: warm amber top → deep shadow bottom (Olafur Eliasson) ── */
const bgGeom = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      // warm amber glow from upper right, deep charcoal base
      vec3 top = vec3(0.08, 0.05, 0.03);
      vec3 bot = vec3(0.03, 0.03, 0.02);
      vec3 col = mix(bot, top, vUv.y);
      // subtle vignette
      vec2 c = vUv - 0.5;
      col *= 1.0 - dot(c,c) * 0.5;
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bgMesh = new THREE.Mesh(bgGeom, bgMat);
bgMesh.frustumCulled = false;
bgMesh.renderOrder = -1;
scene.add(bgMesh);

/* ── Dust motes (atmosphere) ── */
const DUST_N = 800;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_N * 3);
const dustSeeds = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++){
  dustPos[i*3]   = (Math.random()-0.5)*30;
  dustPos[i*3+1] = Math.random()*20 - 5;
  dustPos[i*3+2] = (Math.random()-0.5)*30;
  dustSeeds[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeeds, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      p.y += sin(uTime*0.1 + seed*20.0)*0.3;
      p.x += sin(uTime*0.08 + seed*15.0)*0.2;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_PointSize = (1.5 + seed) * (20.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vA = 0.12 + 0.08*sin(uTime*0.5 + seed*6.28);
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r>0.25) discard;
      float a = exp(-r*12.0) * vA;
      gl_FragColor = vec4(vec3(0.9,0.8,0.6)*a, a);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

/* ── Main tree ── */
let geom, points;
function regrow(seed){
  const data = makeTree(seed);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(data.homePos, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(data.seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(data.gens, 1));
    geom.setAttribute('blastDir', new THREE.BufferAttribute(data.blastDir, 3));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(data.homePos); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(data.seeds); geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(data.gens); geom.attributes.gen.needsUpdate = true;
    geom.attributes.blastDir.array.set(data.blastDir); geom.attributes.blastDir.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Camera: slowly pull back during shatter, push in during reform ── */
const baseRadius = 26;
const basePhi = 0.35;

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  // Shatter cycle
  const cyc = elapsed % CYCLE;
  let blend = 0;
  if (cyc < T_BLAST){
    // whole: gentle sway
    blend = 0;
  } else if (cyc < T_HANG){
    // blasting outward: fast ease-out
    const t = (cyc - T_BLAST) / (T_HANG - T_BLAST);
    blend = 1.0 - Math.pow(1.0 - t, 3); // ease-out cubic
  } else if (cyc < T_RETURN){
    // hanging in space
    blend = 1.0;
  } else {
    // returning: slow ease-in-out
    const t = (cyc - T_RETURN) / (CYCLE - T_RETURN);
    blend = 1.0 - t * t * (3.0 - 2.0 * t); // smoothstep
  }
  uniforms.uBlend.value = blend;

  // Camera breathes with the cycle: pulls back during shatter to show the explosion
  const camDist = baseRadius + blend * 8.0;
  const angle = elapsed * 0.03; // very slow orbit
  if (!controls._userInteracting){
    controls.target.set(0, 2 + blend * 1.5, 0);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Track user interaction to not fight orbit controls
controls._userInteracting = false;
renderer.domElement.addEventListener('pointerdown', () => { controls._userInteracting = true; });

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
