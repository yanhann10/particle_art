<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 220);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050101, 0.003));
const warmL = new THREE.PointLight(0xff3010, 0.015, 50, 2.0);
warmL.position.set(0.5, 9, -1.5);
scene.add(warmL);

let seed = 4829173;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:30, h:24, d:26 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ONE SPHERE — The Key in the Hand: 50,000 keys suspended in red thread
// over two boats at Venice 2015. Here: one luminous sphere — the remembered
// thing, the key to a home that no longer exists, held aloft by thread alone.
const sphereCenter = new THREE.Vector3(0.6, 0.8, 0.0);
const sphereR = 1.65;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e4d2, emissive: 0xf0e4d2, emissiveIntensity: 0.75,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.32, fog: true
});
const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

function surfPt(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=sphereR*(0.96+rng()*0.08);
  return new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r,
    sphereCenter.z+Math.cos(v)*r
  );
}

// ── DARK FRAGMENTS — keys, charred paper, diary pages
const fragments = [];
for(let i=0; i<18; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3+Math.floor(rng()*4);
  const fSize = 0.025+rng()*0.12;
  for(let j=0; j<nPts; j++){
    verts.push((rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.2,
               (rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.2);
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x080604, transparent:true, opacity:0.35
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=3.0+rng()*8.0;
  fMesh.position.set(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.8,
    sphereCenter.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — breathing spaces
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*1.0;
  const vr=4.5+rng()*3.0;
  voids.push({
    x:sphereCenter.x+Math.cos(a)*vr,
    y:sphereCenter.y+(rng()-0.5)*3.0,
    z:sphereCenter.z+Math.sin(a)*vr,
    r:1.3+rng()*1.0
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dy=p.y-v.y, dz=p.z-v.z;
    if(dx*dx+dy*dy+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ANCHORS — concentric shells around the sphere
const anchors = [];
const shells = [2.8, 4.5, 6.5, 9.0, 12.0];
for(const sr of shells){
  const count = Math.floor(14+sr*1.1);
  for(let i=0; i<count; i++){
    const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
    const r=sr*(0.82+rng()*0.36);
    const pt=new THREE.Vector3(
      sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.85,
      sphereCenter.z+Math.cos(v)*r
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
}
for(let i=0; i<55; i++){ const wp=wallPt(); if(!inVoid(wp)) anchors.push(wp); }
for(const f of fragments) anchors.push(f.position.clone());

// ── SUSPENSION — 8 threads from ceiling to sphere top
const suspPts = [];
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.15;
  const topR=0.06+rng()*0.25;
  suspPts.push(
    sphereCenter.x+Math.cos(a)*topR*3.0, hh, sphereCenter.z+Math.sin(a)*topR*3.0,
    sphereCenter.x+Math.cos(a+rng()*0.03)*0.04, sphereCenter.y+sphereR+0.03, sphereCenter.z+Math.sin(a+rng()*0.03)*0.04
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts),3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color:0x0c0303, transparent:true, opacity:0.2
})));

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Angular quantization near sphere — ordered web dissolving into chaos at distance
function quantAngle(pt){
  const d = pt.distanceTo(sphereCenter);
  if(d > 7.0) return pt;
  const strength = Math.max(0, 1.0-d/7.0);
  const quant = Math.PI/12;
  const dx=pt.x-sphereCenter.x, dy=pt.y-sphereCenter.y, dz=pt.z-sphereCenter.z;
  const theta = Math.atan2(dy, dx);
  const phi = Math.atan2(dz, Math.sqrt(dx*dx+dy*dy));
  const qTheta = Math.round(theta/quant)*quant;
  const qPhi = Math.round(phi/quant)*quant;
  const thetaF = theta*(1-strength*0.55)+qTheta*strength*0.55;
  const phiF = phi*(1-strength*0.55)+qPhi*strength*0.55;
  const r2d = Math.sqrt(dx*dx+dy*dy+dz*dz);
  return new THREE.Vector3(
    sphereCenter.x+Math.cos(thetaF)*Math.cos(phiF)*r2d,
    sphereCenter.y+Math.sin(thetaF)*Math.cos(phiF)*r2d,
    sphereCenter.z+Math.sin(phiF)*r2d
  );
}

// RULE 1: CONVERGENCE — 6,000 threads from walls/anchors toward sphere
// The central gesture: every thread in the room reaches toward the remembered thing
for(let i=0; i<6000 && li<NUM_LINES; i++){
  const target = surfPt();
  let origin;
  if(rng()<0.4){ origin = wallPt(); }
  else { origin = anchors[Math.floor(rng()*anchors.length)]; }
  origin = quantAngle(origin);
  // 12% yearning threads — stop short, presence-in-absence
  if(rng()<0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25+rng()*1.4;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)), 1);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: CORONA — 2,400 radial threads emanating outward from the sphere
// The sphere pushes back, radiating presence into the dark
for(let i=0; i<2400 && li<NUM_LINES; i++){
  const sp = surfPt();
  const radial = sp.clone().sub(sphereCenter).normalize();
  const len = 1.0+rng()*5.5;
  const dev = new THREE.Vector3((rng()-0.5)*0.08,(rng()-0.5)*0.08,(rng()-0.5)*0.08);
  const dir = radial.clone().add(dev).normalize();
  setLine(sp, sp.clone().add(dir.multiplyScalar(len)), 2);
}

// RULE 3: LATERAL WEB — 3,500 anchor-to-nearest-anchor threads
// The tissue of connection, independent of the center
const THRESH = 7.0;
let lat=0, att=0;
while(lat<3500 && li<NUM_LINES && att<45000){
  att++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<14; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 3);
  lat++;
}

// RULE 4: DENDRITIC CHAINS — 150 branching thread-chains from sphere
// Nervous system, branching memory pathways
for(let i=0; i<150 && li<NUM_LINES; i++){
  let pt = surfPt();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3+Math.floor(rng()*5);
  let prevDir = radial.clone();
  for(let c=0; c<chainLen && li<NUM_LINES; c++){
    const len = 0.25+rng()*0.6;
    const dev = new THREE.Vector3((rng()-0.5)*0.45,(rng()-0.5)*0.45,(rng()-0.5)*0.45);
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next, 2);
    // Y-fork at second segment
    if(c===1 && rng()<0.5 && li<NUM_LINES){
      const fDev = new THREE.Vector3((rng()-0.5)*0.7,(rng()-0.5)*0.7,(rng()-0.5)*0.7);
      const fDir = prevDir.clone().add(fDev).normalize();
      setLine(pt, pt.clone().add(fDir.multiplyScalar(0.2+rng()*0.45)), 2);
    }
    pt=next; prevDir=dir;
  }
}

// RULE 5: GRAVITY — 800 threads hanging from lower hemisphere
// Weight, grief, the pull downward
for(let i=0; i<800 && li<NUM_LINES; i++){
  const u=rng()*Math.PI*2;
  const v=Math.PI*0.5+rng()*Math.PI*0.5;
  const sp = new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y+Math.cos(v)*sphereR,
    sphereCenter.z+Math.sin(v)*Math.sin(u)*sphereR
  );
  const dropLen = 1.5+rng()*5.0;
  const drift = (rng()-0.5)*0.5;
  setLine(sp, new THREE.Vector3(sp.x+drift, sp.y-dropLen, sp.z+(rng()-0.5)*0.35), 3);
}

// RULE 6: ASCENDING — 700 floor threads rising
for(let i=0; i<700 && li<NUM_LINES; i++){
  const a=rng()*Math.PI*2;
  const floorR = 0.8+rng()*11.0;
  const floorPt = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*floorR,
    -hh+rng()*0.15,
    sphereCenter.z+Math.sin(a)*floorR
  );
  let target;
  if(rng()<0.3){ target = surfPt(); }
  else {
    const midA=rng()*Math.PI*2, midR=2.0+rng()*5.5;
    target = new THREE.Vector3(
      sphereCenter.x+Math.cos(midA)*midR,
      sphereCenter.y+(rng()-0.5)*7.0,
      sphereCenter.z+Math.sin(midA)*midR
    );
  }
  setLine(floorPt, target, 3);
}

// RULE 7: WALL-TO-WALL long spans — the architecture of the room itself
for(let i=0; i<1200 && li<NUM_LINES; i++){
  const a = wallPt();
  const b = rng()<0.5 ? wallPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 3);
}

// Fill remainder — wall-to-sphere spans
while(li<NUM_LINES){
  const a = wallPt();
  const b = rng()<0.45 ? surfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single saturated red #c20018
// Cat 0 convergence: strongest, cat 1 yearning: slightly dimmer,
// cat 2 corona/dendritic: medium, cat 3 lateral/gravity/fill: subtle
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.09, 0.075, 0.055, 0.035];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0-d*0.035);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  // Slight warm shift near sphere center
  const toCenter = lineDist[i];
  const warmShift = toCenter<5.0 ? 0.015*(1.0-toCenter/5.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.55;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — the viewer walks through the web toward the sphere,
// circles it, descends beneath, rises above, returns — a pilgrimage
const pathLen = 2800;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;
  let x, y, z;

  if(t<0.12){
    // Approach from distance — the web is vast, the sphere a faint glow
    const lt=t/0.12;
    x = cx+12.0-lt*5.0;
    y = cy-1.5+lt*2.0;
    z = cz+8.0-lt*3.0;
  } else if(t<0.28){
    // Enter the web — closer, threads thicken, sphere clarifies
    const lt=(t-0.12)/0.16;
    const rH = 7.0-lt*2.5;
    const angle = lt*Math.PI*0.6+0.3;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.5+lt*2.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.42){
    // Circle the sphere — intimate distance, inside the dense convergence zone
    const lt=(t-0.28)/0.14;
    const rH = 4.2+Math.sin(lt*Math.PI)*0.8;
    const angle = lt*Math.PI*1.3+1.2;
    x = cx+Math.cos(angle)*rH;
    y = cy+3.0+Math.sin(lt*Math.PI*0.8)*1.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.52){
    // Rise above — see the web as canopy, the sphere below like a heart
    const lt=(t-0.42)/0.10;
    const rH = 4.5+lt*1.5;
    const angle = lt*Math.PI*0.5+2.8;
    x = cx+Math.cos(angle)*rH;
    y = cy+3.0+lt*5.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.64){
    // Descend through the center — surrounded, the gravity threads hang around you
    const lt=(t-0.52)/0.12;
    x = cx+Math.sin(lt*Math.PI+3.5)*3.0;
    y = cy+8.5-lt*12.0;
    z = cz+Math.cos(lt*Math.PI+3.5)*3.2;
  } else if(t<0.76){
    // Below the sphere — looking up through gravity threads at the luminous form
    const lt=(t-0.64)/0.12;
    const rH = 3.5+lt*2.0;
    const angle = lt*Math.PI*0.9+4.2;
    x = cx+Math.cos(angle)*rH;
    y = cy-4.5+lt*2.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.88){
    // Slow orbit at medium distance — the full web visible as architecture
    const lt=(t-0.76)/0.12;
    const rH = 5.5;
    const angle = lt*Math.PI*0.8+5.5;
    x = cx+Math.cos(angle)*rH;
    y = cy-2.5+lt*4.0;
    z = cz+Math.sin(angle)*rH;
  } else {
    // Recede — the sphere dims into the web, presence fading to absence
    const lt=(t-0.88)/0.12;
    const rH = 5.5+lt*6.5;
    x = cx+Math.cos(lt*Math.PI*0.3+6.5)*rH;
    y = cy-1.5+lt*1.0;
    z = cz+Math.sin(lt*Math.PI*0.3+6.5)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, <0.5% variation
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const dist = lineDist[i];
    const amp = 0.000025*Math.max(0, 1.0-dist/22.0);
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.035+i*0.0001;
    const breath = Math.sin(elapsed*0.0015+phase)*amp;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.08;
      arr[vi+1] = basePositions[vi+1] + breath*0.06;
      arr[vi+2] = basePositions[vi+2] + breath*0.07;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere pulse — a single heartbeat
  sphereMat.emissiveIntensity = 0.75+Math.sin(elapsed*0.0004)*0.05;

  // Camera dolly
  const speed = 0.000048;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle sway
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00025)*0.06;
  look.y += Math.cos(elapsed*0.0002)*0.12-0.05;
  look.z += Math.sin(elapsed*0.0004+0.5)*0.05;
  camera.lookAt(look);

  warmL.intensity = 0.015+Math.sin(elapsed*0.00015)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>

    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
