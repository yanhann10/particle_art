<!-- MOTION: drag, intensity: gentle -->
<style>

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#2d2d2d; }

<body>
<div class="id">gu1 · suminagashi marbling</div>
<div class="hint">drag to comb • Amanda Ghassaei 2022</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 1024, H = 1024;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede1, 1);
document.body.appendChild(renderer.domElement);

// ping-pong RTs for fluid state: velocity (RG) + dye (BA)
const rtParams = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping,
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: concentric rings of dye, no velocity
const init = new Float32Array(W * H * 4);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = (y * W + x) * 4;
  const px = (x / W - 0.5) * 2;
  const py = (y / H - 0.5) * 2;
  const r = Math.sqrt(px * px + py * py);
  
  // black ink rings (Suminagashi) — concentric bands at intervals
  const ringPhase = (r * 18.0 + Math.sin(Math.atan2(py, px) * 3.0) * 0.3) % 1.0;
  const inkStrength = ringPhase < 0.15 ? 1.0 : 0.0;
  
  // add some subtle color variance for Ebru-like layering
  const angle = Math.atan2(py, px);
  const hue = (angle / Math.PI + 1.0) * 0.5;
  const colorVariant = Math.sin(hue * 6.28 * 3.0) * 0.5 + 0.5;
  
  init[i]     = 0.0; // vx
  init[i + 1] = 0.0; // vy
  init[i + 2] = inkStrength * (0.8 + colorVariant * 0.2); // dye channel 1 (black)
  init[i + 3] = inkStrength * colorVariant * 0.4;          // dye channel 2 (color tint)
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// advection shader: semi-Lagrangian backtracing with NO diffusion (keeps edges sharp)
const advectUniforms = {
  state: { value: rtA.texture },
  uDt: { value: 0.016 },
  uTexelSize: { value: new THREE.Vector2(1/W, 1/H) },
  uDissipation: { value: 0.9995 }, // very slow velocity decay
  uDyeDecay: { value: 0.9998 }     // dye persists
};
const advectMat = new THREE.ShaderMaterial({
  uniforms: advectUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uDt;
    uniform vec2 uTexelSize;
    uniform float uDissipation;
    uniform float uDyeDecay;
    varying vec2 vUv;
    
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 vel = s.xy;
      vec2 dye = s.zw;
      
      // semi-Lagrangian advection: trace back along velocity
      vec2 coord = vUv - vel * uDt * uTexelSize * 80.0;
      vec4 advected = texture2D(state, coord);
      
      // advect velocity and dye separately
      vec2 newVel = advected.xy * uDissipation;
      vec2 newDye = advected.zw * uDyeDecay;
      
      gl_FragColor = vec4(newVel, newDye);
    }
  `
});
const advectScene = new THREE.Scene();
advectScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), advectMat));

// impulse shader: add Gaussian velocity splat at pointer position
const impulseUniforms = {
  state: { value: rtB.texture },
  uPoint: { value: new THREE.Vector2(0.5, 0.5) },
  uForce: { value: new THREE.Vector2(0, 0) },
  uRadius: { value: 0.015 }
};
const impulseMat = new THREE.ShaderMaterial({
  uniforms: impulseUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D state;
    uniform vec2 uPoint;
    uniform vec2 uForce;
    uniform float uRadius;
    varying vec2 vUv;
    
    void main(){
      vec4 s = texture2D(state, vUv);
      vec2 diff = vUv - uPoint;
      float dist = length(diff);
      float falloff = exp(-dist * dist / (uRadius * uRadius));
      s.xy += uForce * falloff * 0.8;
      gl_FragColor = s;
    }
  `
});
const impulseScene = new THREE.Scene();
impulseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), impulseMat));

// render scene: display dye field on a slightly tilted plane
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.8, 3.5);
camera.lookAt(0, 0, 0);

const planeGeom = new THREE.PlaneGeometry(2.6, 2.6, 1, 1);
const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    dyeMap: { value: rtA.texture },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D dyeMap;
    uniform float uTime;
    varying vec2 vUv;
    
    void main(){
      vec4 s = texture2D(dyeMap, vUv);
      vec2 dye = s.zw;
      
      // suminagashi palette: black ink on cream paper
      float inkDensity = dye.x;
      vec3 inkColor = vec3(0.12, 0.12, 0.15);
      
      // subtle color tint (ebru influence)
      vec3 tintColor = vec3(0.25, 0.35, 0.55);
      vec3 finalInk = mix(inkColor, tintColor, dye.y * 0.6);
      
      vec3 paperColor = vec3(0.96, 0.93, 0.88);
      vec3 col = mix(paperColor, finalInk, inkDensity);
      
      // subtle paper texture
      float noise = fract(sin(dot(vUv * 512.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (noise - 0.5) * 0.015;
      
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const plane = new THREE.Mesh(planeGeom, planeMat);
plane.rotation.x = -0.08;
scene.add(plane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer interaction: drag to add velocity impulse
let prevPointer = { x: 0.5, y: 0.5 };
let currentPointer = { x: 0.5, y: 0.5 };
let isDragging = false;

addEventListener('pointerdown', (e) => {
  isDragging = true;
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { x, y };
  currentPointer = { x, y };
});

addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth;
  const y = 1.0 - (e.clientY / innerHeight);
  prevPointer = { ...currentPointer };
  currentPointer = { x, y };
});

addEventListener('pointerup', () => {
  isDragging = false;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  
  // advection pass
  advectUniforms.state.value = rtA.texture;
  advectUniforms.uDt.value = dt;
  renderer.setRenderTarget(rtB);
  renderer.render(advectScene, camOrtho);
  
  // impulse pass if dragging
  if (isDragging) {
    const dx = currentPointer.x - prevPointer.x;
    const dy = currentPointer.y - prevPointer.y;
    if (Math.abs(dx) > 0.0001 || Math.abs(dy) > 0.0001) {
      impulseUniforms.state.value = rtB.texture;
      impulseUniforms.uPoint.value.set(currentPointer.x, currentPointer.y);
      impulseUniforms.uForce.value.set(dx * 5.0, dy * 5.0);
      renderer.setRenderTarget(rtA);
      renderer.render(impulseScene, camOrtho);
      renderer.setRenderTarget(rtB);
      renderer.render(advectScene, camOrtho);
    }
  }
  
  // swap
  const tmp = rtA; rtA = rtB; rtB = tmp;
  
  renderer.setRenderTarget(null);
  
  // slow tilt animation
  plane.rotation.x = -0.08 + Math.sin(now * 0.0003) * 0.04;
  plane.rotation.z = Math.sin(now * 0.0002) * 0.02;
  
  planeMat.uniforms.dyeMap.value = rtA.texture;
  planeMat.uniforms.uTime.value = now / 1000;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
