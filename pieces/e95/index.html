<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e95 · 1% de Désordre (vertical entropy gradient)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #f4f1e8;
  }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px;
        letter-spacing: 0.06em; color:#2a2a2a; }
</style>
</head>
<body>
<div class="id">e95 · 1% de Désordre (vertical entropy gradient)</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Vera Molnar — Désordres (1976), (Dés)Ordres series
// A 32×32 grid of nested squares; order at top, increasing disorder toward bottom
// Each square starts orthogonal, parameters perturbed by chaos_amount = smoothstep(0,1,y)
// Black plotter ink on cream paper; camera orbits so disorder reads as 3D wave

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf4f1e8, 28, 65);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 12, 38);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4f1e8);
document.body.appendChild(renderer.domElement);

// Grid parameters
const GRID_W = 32;
const GRID_H = 32;
const CELL_SIZE = 1.1;
const TOTAL_W = GRID_W * CELL_SIZE;
const TOTAL_H = GRID_H * CELL_SIZE;

// Each cell contains 3 nested squares rendered as line-segment particles
// We'll use InstancedMesh with custom geometry for the segments
const segmentsPerSquare = 4;  // 4 edges per square
const squaresPerCell = 3;     // 3 nested
const instanceCount = GRID_W * GRID_H * squaresPerCell * segmentsPerSquare;

// Seed RNG for stable disorder gradient
function seededRandom(seed) {
  let s = seed;
  return function() {
    s = Math.sin(s) * 10000;
    return s - Math.floor(s);
  };
}

// Build a single line segment geometry (thin tube for plotter feel)
const segGeom = new THREE.CylinderGeometry(0.012, 0.012, 1, 3);
segGeom.rotateZ(Math.PI / 2);

const mat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, fog: true });
const mesh = new THREE.InstancedMesh(segGeom, mat, instanceCount);

const dummy = new THREE.Object3D();
let idx = 0;

for (let gy = 0; gy < GRID_H; gy++) {
  for (let gx = 0; gx < GRID_W; gx++) {
    const cellX = (gx - GRID_W * 0.5) * CELL_SIZE;
    const cellY = (gy - GRID_H * 0.5) * CELL_SIZE;
    
    // Chaos amount: 0 at top (gy=0), 1 at bottom (gy=GRID_H-1)
    const chaos = Math.pow(gy / (GRID_H - 1), 1.2);
    
    const rng = seededRandom(gx * 1000 + gy);
    
    // 3 nested squares per cell
    for (let sq = 0; sq < squaresPerCell; sq++) {
      const sqSize = 0.42 - sq * 0.12;
      
      // Per-square disorder offsets
      const posOffsetX = (rng() - 0.5) * chaos * 0.26;
      const posOffsetY = (rng() - 0.5) * chaos * 0.26;
      const rotOffset = (rng() - 0.5) * chaos * Math.PI * 0.18;
      const scaleJitter = 1.0 + (rng() - 0.5) * chaos * 0.15;
      
      // 4 edges
      const edges = [
        { x0: -sqSize, y0: -sqSize, x1:  sqSize, y1: -sqSize }, // bottom
        { x0:  sqSize, y0: -sqSize, x1:  sqSize, y1:  sqSize }, // right
        { x0:  sqSize, y0:  sqSize, x1: -sqSize, y1:  sqSize }, // top
        { x0: -sqSize, y0:  sqSize, x1: -sqSize, y1: -sqSize }  // left
      ];
      
      for (let e = 0; e < 4; e++) {
        const edge = edges[e];
        const cx = (edge.x0 + edge.x1) * 0.5;
        const cy = (edge.y0 + edge.y1) * 0.5;
        const dx = edge.x1 - edge.x0;
        const dy = edge.y1 - edge.y0;
        const len = Math.sqrt(dx*dx + dy*dy);
        const angle = Math.atan2(dy, dx);
        
        // Per-edge micro-jitter
        const edgeRotJitter = (rng() - 0.5) * chaos * Math.PI * 0.08;
        const edgePosJitterX = (rng() - 0.5) * chaos * 0.08;
        const edgePosJitterY = (rng() - 0.5) * chaos * 0.08;
        
        dummy.position.set(
          cellX + (cx + posOffsetX + edgePosJitterX) * scaleJitter,
          cellY + (cy + posOffsetY + edgePosJitterY) * scaleJitter,
          0
        );
        dummy.rotation.z = angle + rotOffset + edgeRotJitter;
        dummy.scale.set(len * scaleJitter, 1, 1);
        dummy.updateMatrix();
        mesh.setMatrixAt(idx++, dummy.matrix);
      }
    }
  }
}

mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);

// Add subtle ground plane for depth
const groundGeom = new THREE.PlaneGeometry(TOTAL_W + 8, TOTAL_H + 8);
const groundMat = new THREE.MeshBasicMaterial({ color: 0xe8e5dc, fog: true });
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.z = -0.15;
scene.add(ground);

// Add a few ambient light specks (dust motes) for inhabited feel
const moteCount = 180;
const motePositions = new Float32Array(moteCount * 3);
const moteSeeds = new Float32Array(moteCount);
for (let i = 0; i < moteCount; i++) {
  motePositions[i*3]     = (Math.random() - 0.5) * TOTAL_W * 1.4;
  motePositions[i*3 + 1] = (Math.random() - 0.5) * TOTAL_H * 1.4;
  motePositions[i*3 + 2] = Math.random() * 6 - 1;
  moteSeeds[i] = Math.random();
}
const moteGeom = new THREE.BufferGeometry();
moteGeom.setAttribute('position', new THREE.BufferAttribute(motePositions, 3));
moteGeom.setAttribute('seed', new THREE.BufferAttribute(moteSeeds, 1));
const moteUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const moteMat = new THREE.ShaderMaterial({
  uniforms: moteUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  fog: true,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      float drift = sin(uTime * 0.3 + seed * 6.28) * 0.4;
      p.x += drift;
      p.y += cos(uTime * 0.25 + seed * 3.14) * 0.3;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.8 + seed * 0.6) * uPixel * (18.0 / dist);
      vAlpha = smoothstep(40.0, 20.0, dist) * 0.15;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 8.0) * vAlpha;
      gl_FragColor = vec4(0.6, 0.58, 0.54, a);
    }
  `
});
const motes = new THREE.Points(moteGeom, moteMat);
scene.add(motes);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
function loop() {
  const now = performance.now();
  const t = (now - t0) / 1000;
  moteUniforms.uTime.value = t;
  
  // Slow camera orbit (calm drift) — the disorder gradient becomes a 3D wave
  const angle = t * 0.08;
  const radius = 38;
  camera.position.x = Math.sin(angle) * radius;
  camera.position.z = Math.cos(angle) * radius;
  camera.position.y = 12 + Math.sin(t * 0.05) * 2.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
