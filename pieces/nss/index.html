<!-- MOTION: flow, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #ede8dc;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(250,248,242,0.4) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(245,242,235,0.3) 0%, transparent 35%),
      url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' /%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#3a3a3a; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; 
          letter-spacing: 0.04em; color:#4a4a4a; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.38; font-size: 10px; 
          letter-spacing: 0.04em; color:#5a5a5a; }
</style>
</head>
<body>
<div class="id">nss · suminagashi — the ink that remembers where it came from</div>
<div class="hint">mouse/touch drags the surface · watch the rings bloom and comb</div>
<div class="src">amanda ghassaei digital marbling · descended from sav</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Suminagashi: ink dropped onto water, ripples outward, then dragged with a stylus.
// Sharp boundaries, layered rings, combed peacock-eye spirals.
// 
// TECHNICAL: Semi-Lagrangian fluid solver on 2D grid with NO diffusion (keeps edges sharp).
// advect(velocity, velocity), advect(velocity, dye) — dye is multi-channel (R,G,B,A each
// a separate ink color). User/camera motion adds Gaussian impulses to velocity field.
// Periodic drops of new ink rings keep the composition evolving.
// Render the dye field as a textured plane with slight wave displacement so it reads
// as liquid surface, not flat print.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xede8dc, 14, 32);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 9, 12);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xede8dc, 1);
document.body.appendChild(renderer.domElement);

// ────────────── 2D fluid simulation (ping-pong render targets)
const RES = 256;
const rtOptions = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
                    format: THREE.RGBAFormat, type: THREE.FloatType };
let velocityRT = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let velocityRT2 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let dyeRT = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
let dyeRT2 = new THREE.WebGLRenderTarget(RES, RES, rtOptions);

const quadGeom = new THREE.PlaneGeometry(2, 2);
const fluidScene = new THREE.Scene();
const fluidCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// advection shader — semi-Lagrangian, no diffusion
const advectShader = {
  uniforms: {
    uTexture: { value: null },
    uVelocity: { value: null },
    uDt: { value: 0.016 },
    uDissipation: { value: 1.0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uTexture;
    uniform sampler2D uVelocity;
    uniform float uDt;
    uniform float uDissipation;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(uVelocity, vUv).xy;
      vec2 coord = vUv - vel * uDt;
      vec4 val = texture2D(uTexture, coord);
      gl_FragColor = val * uDissipation;
    }
  `
};

// splat shader — add Gaussian impulse to field
const splatShader = {
  uniforms: {
    uTexture: { value: null },
    uCenter: { value: new THREE.Vector2(0.5, 0.5) },
    uRadius: { value: 0.04 },
    uValue: { value: new THREE.Vector4(0, 0, 0, 0) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uTexture;
    uniform vec2 uCenter;
    uniform float uRadius;
    uniform vec4 uValue;
    varying vec2 vUv;
    void main(){
      vec4 base = texture2D(uTexture, vUv);
      float d = distance(vUv, uCenter);
      float splat = exp(-d * d / (uRadius * uRadius));
      gl_FragColor = base + uValue * splat;
    }
  `
};

const advectMat = new THREE.ShaderMaterial(advectShader);
const splatMat = new THREE.ShaderMaterial(splatShader);
const quad = new THREE.Mesh(quadGeom, advectMat);
fluidScene.add(quad);

function advect(source, velocity, dest, dissipation = 1.0){
  advectMat.uniforms.uTexture.value = source.texture;
  advectMat.uniforms.uVelocity.value = velocity.texture;
  advectMat.uniforms.uDissipation.value = dissipation;
  quad.material = advectMat;
  renderer.setRenderTarget(dest);
  renderer.render(fluidScene, fluidCam);
}

function splat(target, center, radius, value){
  splatMat.uniforms.uTexture.value = target.texture;
  splatMat.uniforms.uCenter.value.copy(center);
  splatMat.uniforms.uRadius.value = radius;
  splatMat.uniforms.uValue.value.copy(value);
  quad.material = splatMat;
  const temp = new THREE.WebGLRenderTarget(RES, RES, rtOptions);
  renderer.setRenderTarget(temp);
  renderer.render(fluidScene, fluidCam);
  [target.texture, temp.texture] = [temp.texture, target.texture];
  temp.dispose();
}

// ────────────── display plane
const planeW = 12, planeH = 12;
const planeGeom = new THREE.PlaneGeometry(planeW, planeH, 128, 128);
const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    uDye: { value: dyeRT.texture },
    uTime: { value: 0 }
  },
  vertexShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying float vElevation;
    void main(){
      vUv = uv;
      vec3 p = position;
      // gentle wave displacement so it reads as liquid, not print
      float wave = sin(p.x * 0.8 + uTime * 0.3) * cos(p.y * 0.6 + uTime * 0.25) * 0.08;
      p.z += wave;
      vElevation = wave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uDye;
    varying vec2 vUv;
    varying float vElevation;
    void main(){
      vec4 dye = texture2D(uDye, vUv);
      // paper-cream base with ink overlay
      vec3 paper = vec3(0.93, 0.91, 0.86);
      vec3 col = mix(paper, dye.rgb, dye.a);
      // slight specular on wave peaks
      float spec = smoothstep(0.04, 0.08, vElevation) * 0.12;
      col += vec3(spec);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});
const plane = new THREE.Mesh(planeGeom, planeMat);
plane.rotation.x = -Math.PI * 0.12;
scene.add(plane);

// ambient + directional light
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xfff8f0, 0.5);
dir.position.set(3, 6, 4);
scene.add(dir);

// ────────────── drop ink rings periodically
const inkColors = [
  new THREE.Vector4(0.12, 0.14, 0.18, 0.75),  // indigo
  new THREE.Vector4(0.08, 0.08, 0.10, 0.85),  // black
  new THREE.Vector4(0.18, 0.10, 0.08, 0.65),  // burnt sienna
  new THREE.Vector4(0.10, 0.16, 0.14, 0.70)   // deep teal
];
let lastDrop = 0;
function dropInkRing(time){
  if (time - lastDrop < 2200) return;
  lastDrop = time;
  const x = 0.3 + Math.random() * 0.4;
  const y = 0.3 + Math.random() * 0.4;
  const color = inkColors[Math.floor(Math.random() * inkColors.length)];
  // series of concentric rings
  for (let i = 0; i < 4; i++){
    setTimeout(() => {
      splat(dyeRT, new THREE.Vector2(x, y), 0.02 + i * 0.015, color);
    }, i * 180);
  }
}

// ────────────── user interaction (drag = stylus comb)
let mouse = new THREE.Vector2(-1, -1);
let mousePrev = new THREE.Vector2(-1, -1);
let mouseDown = false;

function onPointer(e){
  const x = (e.clientX / innerWidth);
  const y = 1.0 - (e.clientY / innerHeight);
  mousePrev.copy(mouse);
  mouse.set(x, y);
  if (e.type === 'pointerdown') mouseDown = true;
  if (e.type === 'pointerup') mouseDown = false;
}
addEventListener('pointerdown', onPointer);
addEventListener('pointermove', onPointer);
addEventListener('pointerup', onPointer);

function applyMouseDrag(){
  if (!mouseDown || mousePrev.x < 0) return;
  const dx = mouse.x - mousePrev.x;
  const dy = mouse.y - mousePrev.y;
  if (Math.abs(dx) < 1e-5 && Math.abs(dy) < 1e-5) return;
  // add velocity impulse
  splat(velocityRT, mouse.clone(), 0.035, new THREE.Vector4(dx * 8, dy * 8, 0, 0));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm: drop a few ink rings so thumbnail isn't blank
splat(dyeRT, new THREE.Vector2(0.5, 0.5), 0.05, inkColors[0]);
splat(dyeRT, new THREE.Vector2(0.38, 0.62), 0.04, inkColors[1]);
splat(dyeRT, new THREE.Vector2(0.65, 0.45), 0.045, inkColors[2]);
// add gentle initial velocity field — diagonal combing
for (let i = 0; i < 8; i++){
  const x = 0.2 + i * 0.1;
  const y = 0.3 + i * 0.08;
  splat(velocityRT, new THREE.Vector2(x, y), 0.06, new THREE.Vector4(0.15, -0.12, 0, 0));
}

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.033, (now - lastT) / 1000);
  lastT = now;

  // drop new ink rings
  dropInkRing(now);

  // apply mouse drag
  applyMouseDrag();

  // fluid step
  advectMat.uniforms.uDt.value = dt * 0.5;
  advect(velocityRT, velocityRT, velocityRT2, 0.998);
  [velocityRT, velocityRT2] = [velocityRT2, velocityRT];
  advect(dyeRT, velocityRT, dyeRT2, 0.9995);
  [dyeRT, dyeRT2] = [dyeRT2, dyeRT];

  // update display
  planeMat.uniforms.uDye.value = dyeRT.texture;
  planeMat.uniforms.uTime.value = now / 1000;

  // gentle auto-orbit
  const ang = now * 0.00008;
  camera.position.x = Math.sin(ang) * 12;
  camera.position.z = Math.cos(ang) * 12;
  camera.lookAt(0, 0, 0);

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
