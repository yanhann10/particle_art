<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xik · Shiota — Two Home Countries (After Soul Trembles)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">xik</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.007);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.06));

const pL = new THREE.PointLight(0xffe0c0, 0.20, 50, 1.6);
pL.position.set(3.0, 18.0, -2.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0xc20018, 0.04, 30, 2.0);
pL2.position.set(-6.0, -4.0, 5.0);
scene.add(pL2);

let seed = 48291657;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 42, h: 34, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a contained world
// Shiota: one remembered object, presence-in-absence
// Off-white, cottony, like a seed or a moon held in place by memory
const sphereCenter = new THREE.Vector3(1.2, 0.6, -0.5);
const SPHERE_R = 2.4;

const sphereGeo = new THREE.SphereGeometry(SPHERE_R, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0,
  emissive: 0xf2ebe0,
  emissiveIntensity: 0.6,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.28
});
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

// Inner sphere — denser core glow
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.78, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xf8f3ec, transparent: true, opacity: 0.10 })
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

// Suspension wires — 4 threads from ceiling to sphere top
const suspGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  sphereCenter.x + 0.1, hh, sphereCenter.z,
  sphereCenter.x, sphereCenter.y + SPHERE_R, sphereCenter.z,
  sphereCenter.x - 0.4, hh, sphereCenter.z - 0.3,
  sphereCenter.x - 0.08, sphereCenter.y + SPHERE_R - 0.05, sphereCenter.z + 0.02,
  sphereCenter.x + 0.5, hh, sphereCenter.z + 0.4,
  sphereCenter.x + 0.06, sphereCenter.y + SPHERE_R - 0.02, sphereCenter.z - 0.04,
  sphereCenter.x - 0.2, hh, sphereCenter.z + 0.5,
  sphereCenter.x + 0.03, sphereCenter.y + SPHERE_R - 0.08, sphereCenter.z + 0.06,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const th = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  const jR = SPHERE_R + (rng() - 0.5) * 0.08;
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi) * Math.cos(th) * jR,
    sphereCenter.y + Math.sin(phi) * Math.sin(th) * jR,
    sphereCenter.z + Math.cos(phi) * jR
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — Fibonacci shells radiating from sphere
const NUM_ANCHORS = 680;
const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [3.6, 7.0, 11.5, 17.0, 23.0];
const ptsPerShell = [35, 50, 60, 55, 45];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + r * Math.cos(th) * R + (rng()-0.5)*0.8,
      sphereCenter.y + y * R + (rng()-0.5)*0.8,
      sphereCenter.z + r * Math.sin(th) * R + (rng()-0.5)*0.8
    ));
  }
}

while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.5 ? wallPt() : wallPt().lerp(sphereCenter, 0.12 + rng()*0.4);
  anchors.push(p);
}

// Void zones — deliberate negative space the camera can peer through
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 7, sphereCenter.y + 6, sphereCenter.z + 8), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 8, sphereCenter.y - 5, sphereCenter.z - 7), r: 2.4 },
  { pos: new THREE.Vector3(sphereCenter.x + 5, sphereCenter.y + 10, sphereCenter.z + 3), r: 2.1 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — max 20,000 segments
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-sphereCenter.x, dy = my-sphereCenter.y, dz = mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Cat A: CONVERGENCE — threads reaching toward the sphere like blood vessels to a heart
// ~55% of threads. This is the circulatory cosmos.
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.35){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 10% stop short — threads that almost reach but fail (presence-in-absence)
  if(rng() < 0.10){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.8));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: STRUCTURAL WEB — anchor-to-anchor proximity connections
const THRESHOLD = 7.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.22);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;

  setLine(a, best);
  catBcount++;

  // Dendritic branching — Y-forks, 2–3 generations
  if(rng() < 0.18 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.3 + rng()*0.8));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      catBcount++;
      if(rng() < 0.25 && li < NUM_LINES - 1){
        const mid2 = mid.clone().lerp(bEnd, 0.45 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.1 + rng()*0.4));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          catBcount++;
        }
      }
    }
  }
}

// Cat C: HALO — dense orbit threads wrapping tight around the sphere
const catC = Math.floor(NUM_LINES * 0.09);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const dir1 = s1.clone().sub(sphereCenter).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.15 + rng()*2.0));
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.15 + rng()*2.0))
    .add(tangent.multiplyScalar(0.6 + rng()*1.8));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB);
}

// Cat D: GRAVITY — vertical threads from sphere to floor
const catD = Math.floor(NUM_LINES * 0.03);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  // Bias to lower hemisphere
  if(sp.y > sphereCenter.y) sp.y = sphereCenter.y - (sp.y - sphereCenter.y);
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*3.0,
    -hh,
    sp.z + (rng()-0.5)*3.0
  );
  if(!inVoid(sp)) setLine(sp, floorPt);
}

// Cat E: LONG SPANS — wall-to-wall or wall-to-sphere, architectural web
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.40 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred matter, old paper, memory residue caught in the mesh
const NUM_FRAGMENTS = 38;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.04 + rng()*0.12;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.5 + rng()*0.9);
  // Irregular torn shapes
  const verts = new Float32Array([
    w*(-0.3+rng()*0.25), h*0.5, 0,
    -w*0.45, h*(-0.08+rng()*0.12), 0,
    w*(0.08-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.25), h*0.5, 0,
    w*(0.25+rng()*0.3), h*(rng()*0.08), 0,
    w*(0.08-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.015;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.1, d*0.04),
    transparent: true,
    opacity: 0.12 + rng()*0.30,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.0 + rng()*10.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, close to the sphere, slow vertical drift
// Narrative: descend into the web, orbit close, rise to look down through threads at the sphere
const pathLen = 900;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;
  // Tighter orbit — viewer is inside the web, not outside
  const rX = 5.0 + Math.sin(p * 0.7) * 1.5 + Math.cos(p * 1.3 + 0.8) * 0.6;
  const rZ = 7.0 + Math.cos(p * 0.5) * 2.0 + Math.sin(p * 0.9 + 1.5) * 0.7;
  const x = cx + Math.sin(p) * rX;
  // Vertical: descends to below sphere, rises above to look down through web
  const yBase = cy + 0.5;
  const yWave = Math.sin(p * 0.35 + 0.8) * 6.0 + Math.cos(p * 0.75 + 2.0) * 1.5;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible jitter < 0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0005 * Math.max(0, 1.0 - dist / 30.0);
    const phase = basePositions[idx]*0.2 + basePositions[idx+1]*0.25 + i*0.001;
    const breath = Math.sin(t*0.02 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.28;
      arr[vi+1] = basePositions[vi+1] + breath*0.22;
      arr[vi+2] = basePositions[vi+2] + breath*0.25;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0007;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — gravitational center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0025)*0.12;
  look.y += Math.cos(t*0.002)*0.10;
  look.z += Math.sin(t*0.0028)*0.08;
  camera.lookAt(look);

  // Light drift
  pL.position.x = 3.0 + Math.sin(t*0.0012)*0.4;
  pL.position.y = 18.0 + Math.cos(t*0.001)*0.2;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
