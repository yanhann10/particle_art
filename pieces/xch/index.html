<body>
<div class="id">xch</div>
<div class="hint">drag to orbit · scroll to zoom · click to pause/resume</div>
<div class="src">from twz · Anadol cosmic data pillar · differential growth</div>
<div class="stat" id="stat">vertices=0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BG = 0x03050a;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.025);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─── differential growth spine (from twz/5gm lineage)
const MAX_VERTS = 4000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE = 0.0028;
const RISE     = 0.0045;
const MAX_D    = 0.32;
let paused = false;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function gkey(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = gkey(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++)
    for (let dy=-1; dy<=1; dy++)
      for (let dz=-1; dz<=1; dz++){
        const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if (arr) for (const idx of arr) out.push(idx);
      }
  return out;
}

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let ccx=0, ccy=0, ccz=0;
  for (let i = 0; i < n; i++){ ccx+=verts[i].x; ccy+=verts[i].y; ccz+=verts[i].z; }
  ccx/=n; ccy/=n; ccz/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-ccx, oy=verts[i].y-ccy, oz=verts[i].z-ccz;
    const d = Math.hypot(ox,oy,oz)+1e-6;
    dx[i] += (ox/d)*PRESSURE;
    dy[i] += (oy/d)*PRESSURE*0.4;
    dz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                   age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

for (let s = 0; s < 800; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─── Anadol flow-field lookup: smooth sine-layered 3D displacement
// Creates the undulating, data-stream surface feel
function flowField(x, y, z, t){
  const fx = Math.sin(y*0.8 + t*0.4) * 0.35 + Math.sin(z*1.2 + t*0.3) * 0.15;
  const fy = Math.sin(x*0.6 + t*0.25) * 0.12;
  const fz = Math.cos(y*0.7 + t*0.35) * 0.35 + Math.cos(x*1.1 + t*0.28) * 0.15;
  return { fx, fy, fz };
}

// ─── data-stream intensity: clustered brightness along the curve
const STREAM_SIZE = 512;
const streamTable = new Float32Array(STREAM_SIZE);
for (let i = 0; i < STREAM_SIZE; i++){
  const t = i / STREAM_SIZE * Math.PI * 2;
  let v = 0.5 * Math.sin(t * 5.0 + 0.9) + 0.3 * Math.sin(t * 11.0 + 2.1)
        + 0.2 * Math.sin(t * 19.0 + 3.7);
  v = Math.max(0, v);
  v = Math.pow(v, 2.0);
  streamTable[i] = v;
}
function sampleStream(u){
  const fi = ((u % 1.0) + 1.0) % 1.0 * STREAM_SIZE;
  const i0 = Math.floor(fi) % STREAM_SIZE;
  const i1 = (i0 + 1) % STREAM_SIZE;
  const frac = fi - Math.floor(fi);
  return streamTable[i0] * (1 - frac) + streamTable[i1] * frac;
}

// ─── main particle cloud: 50k on the growth spine
const N_RENDER = 50000;
const rPos = new Float32Array(N_RENDER * 3);
const rSeed = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
const rHeight = new Float32Array(N_RENDER);
const rStream = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeed[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeed, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('hgt',      new THREE.BufferAttribute(rHeight, 1));
geom.setAttribute('stream',   new THREE.BufferAttribute(rStream, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uYMax:  { value: 1 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    attribute float seed;
    attribute float age;
    attribute float hgt;
    attribute float stream;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // Anadol-style undulation: slow wave displacement
      float phase = seed * 6.28 + uTime * 0.3;
      p.x += 0.006 * sin(phase + p.y * 0.5);
      p.z += 0.006 * cos(phase * 0.7 + p.y * 0.4);

      float h = clamp(hgt / max(uYMax, 0.5), 0.0, 1.0);

      // Anadol cosmic palette: deep indigo base → blue mid → bright cyan/white crest
      vec3 deep   = vec3(0.04, 0.06, 0.18);   // deep space indigo
      vec3 mid    = vec3(0.10, 0.18, 0.42);   // nebula blue
      vec3 bright = vec3(0.30, 0.55, 0.85);   // cosmic cyan
      vec3 white  = vec3(0.70, 0.82, 0.95);   // data-light white-blue
      vec3 col = mix(deep, mid, smoothstep(0.0, 0.4, h));
      col = mix(col, bright, smoothstep(0.35, 0.75, h));
      col = mix(col, white, smoothstep(0.8, 1.0, h));

      // data-stream highlights: bright cyan-white veins
      float streamPulse = stream * (0.6 + 0.4 * sin(uTime * 1.5 + seed * 12.0));
      vec3 dataCol = vec3(0.55, 0.85, 1.0);
      float streamMask = streamPulse * smoothstep(0.2, 0.6, h);
      col = mix(col, dataCol, clamp(streamMask * 1.5, 0.0, 0.7));

      vCol = col;
      vAlpha = mix(0.35, 0.65, h) + streamMask * 0.35;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.2 + streamMask * 1.0) * uPixel * (40.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      // manual fog: deep space background
      vec3 fogCol = vec3(0.012, 0.020, 0.039);
      float fogDist = gl_FragCoord.z / gl_FragCoord.w;
      float fogF = exp(-0.025 * 0.025 * fogDist * fogDist);
      gl_FragColor = vec4(mix(fogCol, vCol, clamp(fogF, 0.0, 1.0)) * a, a);
    }
  `
});
const towerPts = new THREE.Points(geom, mat);
scene.add(towerPts);

// ─── orbiting data-motes: 10k particles that spiral around the pillar
// Anadol's signature: particles in orbital flow around the main form
const N_ORBIT = 10000;
const oPos   = new Float32Array(N_ORBIT * 3);
const oSeed  = new Float32Array(N_ORBIT);
const oPhase = new Float32Array(N_ORBIT);
const oRadius = new Float32Array(N_ORBIT);
const oY     = new Float32Array(N_ORBIT);
const oSpeed = new Float32Array(N_ORBIT);

for (let i = 0; i < N_ORBIT; i++){
  oSeed[i]   = Math.random();
  oPhase[i]  = Math.random() * Math.PI * 2;
  oRadius[i] = 2.0 + Math.random() * 4.5;
  oY[i]      = Math.random() * 12.0;
  oSpeed[i]  = 0.15 + Math.random() * 0.35;
}

const oGeom = new THREE.BufferGeometry();
oGeom.setAttribute('position', new THREE.BufferAttribute(oPos, 3));
oGeom.setAttribute('seed',     new THREE.BufferAttribute(oSeed, 1));

const oUniforms = { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uYMax: uniforms.uYMax };
const oMat = new THREE.ShaderMaterial({
  uniforms: oUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    attribute float seed;
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec3 p = position;
      // subtle wobble
      float t = uTime * 0.2 + seed * 6.28;
      p.x += 0.01 * sin(t * 1.3);
      p.z += 0.01 * cos(t * 0.9);

      float h = clamp(p.y / max(uYMax, 1.0), 0.0, 1.0);
      // faint blue-white motes
      vec3 c1 = vec3(0.12, 0.22, 0.45);
      vec3 c2 = vec3(0.40, 0.65, 0.90);
      vCol = mix(c1, c2, h);
      vA = 0.18 + 0.12 * sin(seed * 20.0 + uTime);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 0.9 * uPixel * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vA;
      vec3 fogCol = vec3(0.012, 0.020, 0.039);
      gl_FragColor = vec4(mix(fogCol, vCol, 0.95) * a, a);
    }
  `
});
const orbitPts = new THREE.Points(oGeom, oMat);
scene.add(orbitPts);

function updateOrbits(time, yMax){
  for (let i = 0; i < N_ORBIT; i++){
    const angle = oPhase[i] + time * oSpeed[i];
    const r = oRadius[i] + 0.5 * Math.sin(time * 0.3 + oSeed[i] * 10);
    // slowly drift upward, wrap
    oY[i] += 0.004 * oSpeed[i];
    if (oY[i] > yMax + 2) oY[i] = -1.0 + Math.random() * 2;
    oPos[i*3]   = Math.cos(angle) * r;
    oPos[i*3+1] = oY[i];
    oPos[i*3+2] = Math.sin(angle) * r;
  }
  oGeom.attributes.position.needsUpdate = true;
}

// ─── dust veil: 6k particles near the base — cosmic dust settling
const N_DUST = 6000;
const dPos  = new Float32Array(N_DUST * 3);
const dSeed = new Float32Array(N_DUST);
const dLife = new Float32Array(N_DUST);

for (let i = 0; i < N_DUST; i++){
  dSeed[i] = Math.random();
  dLife[i]  = Math.random();
  const ang = Math.random() * Math.PI * 2;
  const r = 1.5 + Math.random() * 5.0;
  dPos[i*3]   = Math.cos(ang) * r;
  dPos[i*3+1] = -0.5 + Math.random() * 2.0;
  dPos[i*3+2] = Math.sin(ang) * r;
}

const dGeom = new THREE.BufferGeometry();
dGeom.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dGeom.setAttribute('seed',     new THREE.BufferAttribute(dSeed, 1));
dGeom.setAttribute('life',     new THREE.BufferAttribute(dLife, 1));

const dMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float life;
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec3 p = position;
      float t = uTime * 0.15 + seed * 6.28;
      p.x += 0.02 * sin(t);
      p.z += 0.02 * cos(t * 0.8);
      // cosmic dust: very faint deep indigo
      vCol = vec3(0.08, 0.10, 0.22);
      vA = 0.15 * (1.0 - life);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.4 * uPixel * (25.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vA;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const dustPts = new THREE.Points(dGeom, dMat);
scene.add(dustPts);

function updateDust(time){
  for (let i = 0; i < N_DUST; i++){
    dLife[i] += 0.001;
    if (dLife[i] > 1.0){
      dLife[i] = 0;
      const ang = Math.random() * Math.PI * 2;
      const r = 1.5 + Math.random() * 5.0;
      dPos[i*3]   = Math.cos(ang) * r;
      dPos[i*3+1] = -0.5 + Math.random() * 2.0;
      dPos[i*3+2] = Math.sin(ang) * r;
    }
  }
  dGeom.attributes.position.needsUpdate = true;
  dGeom.attributes.life.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();
let lastT = 0;
let flowTime = 0;

function loop(){
  const now = (performance.now() - start) / 1000;
  const dt = Math.min(now - lastT, 0.05);
  lastT = now;
  uniforms.uTime.value = now;
  flowTime = now;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;
  let yMax = 0;
  if (n > 1){
    const lengths = []; let total = 0;
    for (let i = 0; i < n; i++){
      const a = verts[i], b = verts[(i+1)%n];
      const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
      const L = Math.sqrt(ex*ex+ey*ey+ez*ez);
      lengths.push(L); total += L;
      if (a.y > yMax) yMax = a.y;
    }
    if (total > 0){
      let written = 0;
      let cumLen = 0;
      for (let i = 0; i < n; i++){
        const share = (i === n-1) ? N_RENDER - written
                    : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
        const a = verts[i], b = verts[(i+1)%n];
        const curveU = cumLen / total;
        const nextU  = (cumLen + lengths[i]) / total;
        for (let k = 0; k < share && written < N_RENDER; k++){
          const u = Math.random();
          let px = a.x+(b.x-a.x)*u;
          let py = a.y+(b.y-a.y)*u;
          let pz = a.z+(b.z-a.z)*u;
          // Anadol flow-field displacement: particles undulate around spine
          const ff = flowField(px, py, pz, flowTime);
          px += ff.fx * 0.12 + (Math.random()-0.5)*0.02;
          py += ff.fy * 0.06 + (Math.random()-0.5)*0.02;
          pz += ff.fz * 0.12 + (Math.random()-0.5)*0.02;
          rPos[written*3]   = px;
          rPos[written*3+1] = py;
          rPos[written*3+2] = pz;
          rAge[written]     = Math.max(a.age, b.age);
          rHeight[written]  = py;
          const localU = curveU + (nextU - curveU) * u;
          rStream[written] = sampleStream(localU);
          written++;
        }
        cumLen += lengths[i];
      }
      geom.attributes.position.needsUpdate = true;
      geom.attributes.age.needsUpdate = true;
      geom.attributes.hgt.needsUpdate = true;
      geom.attributes.stream.needsUpdate = true;
    }
  }
  uniforms.uYMax.value = Math.max(yMax, 1.0);

  updateOrbits(now, yMax);
  updateDust(now);

  // camera tracking: follow centroid
  let yMean = 0;
  if (n > 0){ for (let i = 0; i < n; i++) yMean += verts[i].y; yMean /= n; }
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  const totalP = N_RENDER + N_ORBIT + N_DUST;
  statEl.textContent = `vertices=${n} · height=${yMax.toFixed(1)} · particles=${totalP}${paused?' · paused':''}`;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
