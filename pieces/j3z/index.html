<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>j3z · désordres · entropy gradient</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#f0ebe3; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">j3z</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════════════════════════════════════════════════════
   Vera Molnár — Désordres (1976) / (Dés)Ordres series
   ─────────────────────────────────────────────────────────────────
   32 × 40 grid of short line-segments on a cream ground.
   Top rows: perfect orthogonal order (rotation 0, position on-grid).
   Bottom rows: every parameter perturbed by Gaussian noise scaled
   by chaos_amount = pow(row/rows, 1.7).
   Z-displacement grows with chaos so the 3D orbit reveals the
   disorder as a physical relief — order is flat, chaos buckles.
   Palette: ink #1a1a1e (near-black), cobalt #182b5e accents in
   the disordered zone only (≈12% of segments). Cream #f0ebe3 ground.
   A slow undulating wave modulates chaos over time — drift motion.
   ═══════════════════════════════════════════════════════════════════ */

const COLS = 32, ROWS = 40, TOTAL = COLS * ROWS;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ebe3);

const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 52);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.035;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.target.set(0, 0, 0);
controls.minDistance = 20;
controls.maxDistance = 90;

/* ── lighting: even, gallery-flat ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const key = new THREE.DirectionalLight(0xfff6ee, 0.45);
key.position.set(4, 8, 18);
scene.add(key);
const fill = new THREE.DirectionalLight(0xe8e0d8, 0.2);
fill.position.set(-6, -2, 10);
scene.add(fill);

/* ── segment geometry: flat-nib plotter mark ── */
const segLen = 0.55;
const segH   = 0.032;
const segD   = 0.018;
const segGeo = new THREE.BoxGeometry(segLen, segH, segD);

const mat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.0,
});

const mesh = new THREE.InstancedMesh(segGeo, mat, TOTAL);
scene.add(mesh);

/* ── Gaussian random (Box-Muller) ── */
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/* ── per-instance seed table ── */
const spacing = 0.68;
const ox = -(COLS - 1) * spacing * 0.5;
const oy =  (ROWS - 1) * spacing * 0.5;

const inkBlack  = new THREE.Color(0x1a1a1e);
const inkCobalt = new THREE.Color(0x182b5e);

const seeds = new Array(TOTAL);
const colorArr = new Float32Array(TOTAL * 3);

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    const chaos = Math.pow(r / (ROWS - 1), 1.7);
    const useCobalt = chaos > 0.35 && Math.random() < 0.12;
    const col = useCobalt ? inkCobalt : inkBlack;
    colorArr[i * 3]     = col.r;
    colorArr[i * 3 + 1] = col.g;
    colorArr[i * 3 + 2] = col.b;
    seeds[i] = {
      bx: ox + c * spacing,
      by: oy - r * spacing,
      chaos,
      rSeed:  gauss(),
      dxSeed: gauss(),
      dySeed: gauss(),
      dzSeed: gauss(),
      lSeed:  gauss(),
      phase:  Math.random() * Math.PI * 2,
      row: r,
    };
  }
}
mesh.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);

/* ── paper grain: subtle screen-space overlay ── */
const grainRes = 256;
const gc = document.createElement('canvas');
gc.width = gc.height = grainRes;
const gx = gc.getContext('2d');
const id = gx.createImageData(grainRes, grainRes);
for (let p = 0; p < id.data.length; p += 4) {
  const n = 128 + (Math.random() - 0.5) * 50;
  id.data[p] = id.data[p + 1] = id.data[p + 2] = n;
  id.data[p + 3] = 14;
}
gx.putImageData(id, 0, 0);
const grainTex = new THREE.CanvasTexture(gc);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;

/* grain rendered as a second pass via an orthographic overlay */
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const grainMat = new THREE.MeshBasicMaterial({
  map: grainTex, transparent: true, depthTest: false, depthWrite: false
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
grainScene.add(grainQuad);

/* ── update instances ── */
const dummy = new THREE.Object3D();

function updateInstances(t) {
  for (let i = 0; i < TOTAL; i++) {
    const s = seeds[i];
    /* animated wave of chaos propagation */
    const wave = Math.sin(t * 0.22 + s.phase + s.row * 0.12) * 0.08;
    const ch = Math.min(1, Math.max(0, s.chaos + wave * s.chaos));

    const px = s.bx + s.dxSeed * ch * 0.32;
    const py = s.by + s.dySeed * ch * 0.32;
    const pz = s.dzSeed * ch * 0.7;

    dummy.position.set(px, py, pz);
    dummy.rotation.set(0, 0, s.rSeed * ch * Math.PI * 0.42);
    const ls = 1 + s.lSeed * ch * 0.28;
    dummy.scale.set(ls, 1, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── render loop ── */
const t0 = performance.now();
updateInstances(0);

function loop() {
  const t = (performance.now() - t0) / 1000;
  updateInstances(t);

  /* grain texture scroll for film-like flicker */
  grainTex.offset.set(Math.random(), Math.random());

  controls.update();
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
