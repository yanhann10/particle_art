<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>552 · naïve ink · trembling growth</title>
<!-- MOTION: tremor, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; font-family:ui-monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">552</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.011);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 7, 13);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0.3, 5, -0.2);

// ─── differential growth (3D) with deliberate asymmetry
const MAX_VERTS = 1600;
const ATTRACT   = 0.055;
const REPEL_R   = 0.48;
const REPEL_STR = 0.12;
const NOISE     = 0.004;
const PRESSURE  = 0.003;
const RISE      = 0.0045;
const MAX_D     = 0.38;

const verts = [];
// Deliberately asymmetric seed — not a circle, more like a wobbly blob
for (let i = 0; i < 15; i++){
  const th = i / 15 * Math.PI * 2;
  const r = 1.2 + Math.sin(th*2.3)*0.4 + (Math.random()-0.5)*0.3;
  verts.push({ x: Math.cos(th)*r + (Math.random()-0.5)*0.15,
               y: (Math.random()-0.5)*0.1,
               z: Math.sin(th)*r + (Math.random()-0.5)*0.15,
               age: Math.random()*0.01,
               weight: 0.7 + Math.random()*0.6 }); // per-vertex "ink weight"
}

const CELL = REPEL_R, grid = new Map();
function key3(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function getNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of getNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1-d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d = Math.hypot(ox,oy,oz)+1e-6;
    // asymmetric pressure — stronger on one side
    const asym = 1.0 + 0.3*Math.sin(Math.atan2(oz,ox)*1.7);
    dx[i] += (ox/d)*PRESSURE*asym;
    dy[i] += (oy/d)*PRESSURE*0.35;
    dz[i] += (oz/d)*PRESSURE*asym;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2*Math.min(a*1.5, 1.0));
    // deliberate jitter — 10% position noise each step (hand tremor)
    const jitter = 0.0025;
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE + (Math.random()-0.5)*jitter;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE + (Math.random()-0.5)*jitter;
    verts[i].age += 0.0013;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5 + (Math.random()-0.5)*0.06,
        y:(a.y+b.y)*0.5 - 0.04 + (Math.random()-0.5)*0.03,
        z:(a.z+b.z)*0.5 + (Math.random()-0.5)*0.06,
        age: Math.max(a.age,b.age)*0.5,
        weight: (a.weight+b.weight)*0.5 + (Math.random()-0.5)*0.15
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 650; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─── ink tube renderer with hand-drawn imperfections
let tubeMesh = null;
const tubeMat = new THREE.MeshBasicMaterial({
  color: 0xe2d4aa,
  transparent: true,
  opacity: 0.85,
});

// Ink splats — larger marks at random vertices
const splatGroup = new THREE.Group();
scene.add(splatGroup);

// Stray drip marks — disconnected from main form
const dripGroup = new THREE.Group();
scene.add(dripGroup);
const dripMat = new THREE.MeshBasicMaterial({ color: 0xd4c48a, transparent: true, opacity: 0.5 });

function buildDrips(){
  // 6-10 stray ink drips near the form but not on it
  for (let i = 0; i < 8; i++){
    const srcIdx = Math.floor(Math.random()*verts.length);
    const sv = verts[srcIdx];
    const offset = new THREE.Vector3(
      (Math.random()-0.5)*2.5,
      (Math.random()-0.5)*1.5 - 0.5,
      (Math.random()-0.5)*2.5
    );
    // irregular shape — not a sphere, a squished ellipsoid
    const sx = 0.02 + Math.random()*0.06;
    const sy = 0.01 + Math.random()*0.04;
    const sz = 0.02 + Math.random()*0.05;
    const geo = new THREE.SphereGeometry(1, 5, 4);
    geo.scale(sx, sy, sz);
    // rotate randomly
    geo.rotateX(Math.random()*Math.PI);
    geo.rotateZ(Math.random()*Math.PI);
    const m = new THREE.Mesh(geo, dripMat);
    m.position.set(sv.x+offset.x, sv.y+offset.y, sv.z+offset.z);
    dripGroup.add(m);
  }
}

// Film grain overlay — full-screen noise quad
const grainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthTest: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float rand(vec2 co){ return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      float n = rand(vUv*1000.0 + uTime*7.3);
      gl_FragColor = vec4(vec3(n), 0.04);
    }
  `
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat);
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

let dripsBuilt = false;
let frameCount = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  frameCount++;
  for (let s = 0; s < 2; s++) step();

  if (verts.length > 10){
    // Add per-frame tremor jitter to visual positions (not simulation)
    const time = performance.now() * 0.001;
    const pts = verts.map((v, i) => {
      // 8-12% positional jitter for hand-drawn feel
      const jAmp = 0.008 + v.weight * 0.012;
      const jx = Math.sin(time*2.3 + i*0.7) * jAmp + (Math.random()-0.5)*0.005;
      const jy = Math.cos(time*1.7 + i*1.1) * jAmp * 0.6;
      const jz = Math.sin(time*1.9 + i*0.9) * jAmp + (Math.random()-0.5)*0.005;
      return new THREE.Vector3(v.x + jx, v.y + jy, v.z + jz);
    });
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(700, verts.length * 2);
    const RADIAL = 5; // fewer sides = more angular/rough look
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      // curvature proxy for pressure
      const dt = 1/N_SAMPLES;
      const t1 = curve.getTangent((t-dt+1)%1);
      const t2 = curve.getTangent(t);
      const curvature = (1 - t1.dot(t2)) * 4;
      const pressure = Math.min(1.0, curvature * 6);

      // per-vertex weight from nearest simulation vertex
      const vIdx = Math.floor(t * verts.length) % verts.length;
      const w = verts[vIdx] ? verts[vIdx].weight : 1.0;

      // base radius with weight modulation + deliberate irregularity
      const baseR = 0.015 + 0.09 * pressure * w;
      // wobble the cross-section — not a perfect circle
      const wobblePhase = i * 0.37 + time * 0.5;

      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        // per-vertex radius variation (10% wobble)
        const r = baseR * (1.0 + 0.12 * Math.sin(ang*2.3 + wobblePhase));
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i*RADIAL+j)*3]     = v.x;
        positions[(i*RADIAL+j)*3 + 1] = v.y;
        positions[(i*RADIAL+j)*3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i+1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j+1) % RADIAL;
        const a = i*RADIAL+j, b = i*RADIAL+nj;
        const c = ni*RADIAL+j, d = ni*RADIAL+nj;
        indices.push(a,b,c); indices.push(b,d,c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);

    // Build splats — heavy ink marks at high-weight vertices
    if (frameCount % 30 === 1){
      while(splatGroup.children.length > 0){
        splatGroup.children[0].geometry.dispose();
        splatGroup.remove(splatGroup.children[0]);
      }
      for (let i = 0; i < verts.length; i += Math.floor(3 + Math.random()*8)){
        const v = verts[i];
        if (!v || v.weight < 0.9) continue;
        const size = 0.03 + v.weight * 0.05 + Math.random()*0.03;
        // Use low-poly sphere for rough mark
        const sg = new THREE.SphereGeometry(size, 4, 3);
        sg.rotateX(Math.random()*Math.PI);
        sg.rotateY(Math.random()*Math.PI);
        const sm = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({
          color: 0xdbc98a,
          transparent: true,
          opacity: 0.4 + Math.random()*0.3
        }));
        sm.position.set(
          v.x + (Math.random()-0.5)*0.08,
          v.y + (Math.random()-0.5)*0.06,
          v.z + (Math.random()-0.5)*0.08
        );
        splatGroup.add(sm);
      }
    }

    if (!dripsBuilt && verts.length > 200){
      buildDrips();
      dripsBuilt = true;
    }
  }

  // camera follow with slight drift
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.035;
  controls.target.x += (0.2 - controls.target.x) * 0.01; // slight off-center
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y) * 0.035;

  controls.update();
  renderer.render(scene, camera);
  // grain pass
  grainMat.uniforms.uTime.value = performance.now() * 0.001;
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
