<div class="id">pgn</div>
<div class="hint" id="hint">Wang &amp; Söderström · Matins of You · ascending</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 38);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a090d, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

/* ── lights ── */
const amb = new THREE.AmbientLight(0x1a1520, 0.6);
scene.add(amb);
const keyLight = new THREE.DirectionalLight(0xe8dff0, 1.8);
keyLight.position.set(8, 15, 10);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x9080b0, 1.2, 60);
rimLight.position.set(-12, 5, -8);
scene.add(rimLight);
const fillLight = new THREE.PointLight(0xc0b8d0, 0.6, 50);
fillLight.position.set(5, -8, 12);
scene.add(fillLight);

/* dawn light — fades in slowly */
const dawnLight = new THREE.DirectionalLight(0xf0c870, 0.0);
dawnLight.position.set(-5, 20, 8);
scene.add(dawnLight);

/* ── fog ── */
scene.fog = new THREE.FogExp2(0x0a090d, 0.016);

/* ── instanced spheres ── */
const N = 900;
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const nestMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uDawn: { value: 0 },
    uLightPos: { value: keyLight.position },
    uCamPos: { value: camera.position },
  },
  vertexShader: `
    uniform float uTime;
    attribute float aPhase;
    attribute float aAccreted;
    attribute float aScale;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vPhase;
    varying float vAccreted;
    void main(){
      vPhase = aPhase;
      vAccreted = aAccreted;
      vec3 transformed = position * aScale;
      vec4 iPos = instanceMatrix * vec4(transformed, 1.0);
      vWorldPos = iPos.xyz;
      vNormal = normalize(mat3(instanceMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * iPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uDawn;
    uniform vec3 uLightPos;
    uniform vec3 uCamPos;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vPhase;
    varying float vAccreted;

    vec3 pearl    = vec3(0.90, 0.88, 0.92);
    vec3 lavender = vec3(0.72, 0.62, 0.82);
    vec3 mercury  = vec3(0.78, 0.80, 0.84);
    vec3 blush    = vec3(0.88, 0.75, 0.80);
    vec3 amber    = vec3(0.95, 0.82, 0.55);
    vec3 dawn     = vec3(0.92, 0.78, 0.60);

    void main(){
      vec3 N = normalize(vNormal);
      vec3 L = normalize(uLightPos - vWorldPos);
      vec3 V = normalize(uCamPos - vWorldPos);
      vec3 H = normalize(L + V);

      float NdL = max(dot(N, L), 0.0);
      float NdH = max(dot(N, H), 0.0);
      float NdV = max(dot(N, V), 0.0);

      float fresnel = pow(1.0 - NdV, 3.0);
      float iriShift = sin(vPhase * 6.28 + NdV * 4.0 + uTime * 0.3) * 0.5 + 0.5;

      vec3 baseCol = mix(pearl, lavender, smoothstep(0.3, 0.7, iriShift));
      baseCol = mix(baseCol, mercury, fresnel * 0.5);
      baseCol = mix(baseCol, blush, smoothstep(0.7, 1.0, iriShift) * 0.3);

      /* dawn warmth seeps into upper spheres */
      float heightFactor = smoothstep(0.0, 12.0, vWorldPos.y);
      baseCol = mix(baseCol, mix(dawn, amber, heightFactor * 0.4), uDawn * heightFactor * 0.45);

      float diff = NdL * 0.6 + 0.25;
      float spec = pow(NdH, 64.0) * 1.2;
      float rim  = pow(fresnel, 2.0) * 0.4;

      vec3 col = baseCol * diff + vec3(1.0) * spec + lavender * rim;

      /* accreted glow — warmer with dawn */
      vec3 accGlow = mix(vec3(1.05, 1.0, 0.95), vec3(1.08, 1.0, 0.9), uDawn);
      col = mix(col, col * accGlow, vAccreted * 0.3);

      /* choral pulse: accreted spheres brighten in vertical waves */
      float choralWave = sin(vWorldPos.y * 0.8 - uTime * 1.2 + vPhase * 1.5) * 0.5 + 0.5;
      col += amber * choralWave * vAccreted * uDawn * 0.12;

      float sss = max(dot(-L, V), 0.0) * 0.15;
      col += blush * sss * (1.0 - vAccreted * 0.5);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  transparent: false,
});

const mesh = new THREE.InstancedMesh(sphereGeo, nestMat, N);
scene.add(mesh);

/* ── boid state ── */
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const phase = new Float32Array(N);
const accreted = new Float32Array(N);
const scale = new Float32Array(N);
const accretedTime = new Float32Array(N);
const dummy = new THREE.Object3D();

const NEST_RADIUS = 6.0;
const NEST_Y = 0;

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 14 + Math.random() * 10;
  pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta) + 3;
  pos[i*3+2] = r * Math.cos(phi);

  const sp = 0.3 + Math.random() * 0.5;
  vel[i*3]   = (Math.random()-0.5) * sp;
  vel[i*3+1] = (Math.random()-0.5) * sp;
  vel[i*3+2] = (Math.random()-0.5) * sp;

  phase[i] = Math.random();
  accreted[i] = 0;
  scale[i] = 0.28 + Math.random() * 0.32;
  accretedTime[i] = 0;
}

const phaseAttr = new THREE.InstancedBufferAttribute(phase, 1);
const accAttr   = new THREE.InstancedBufferAttribute(accreted, 1);
const scaleAttr = new THREE.InstancedBufferAttribute(scale, 1);
mesh.geometry.setAttribute('aPhase', phaseAttr);
mesh.geometry.setAttribute('aAccreted', accAttr);
mesh.geometry.setAttribute('aScale', scaleAttr);

/* ── residue trail particles ── */
const TRAIL_N = 4000;
const trailPos = new Float32Array(TRAIL_N * 3);
const trailAlpha = new Float32Array(TRAIL_N);
let trailHead = 0;
for (let i = 0; i < TRAIL_N; i++){
  trailPos[i*3] = 0; trailPos[i*3+1] = -100; trailPos[i*3+2] = 0;
  trailAlpha[i] = 0;
}
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('alpha', new THREE.BufferAttribute(trailAlpha, 1));
const trailMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uDawn: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float alpha;
    varying float vA;
    varying float vY;
    void main(){
      vA = alpha;
      vY = position.y;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = max(1.0, 2.5 * (30.0 / -mv.z));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uDawn;
    varying float vA;
    varying float vY;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vA;
      /* trail color warms with dawn, higher particles catch light first */
      float warmth = uDawn * smoothstep(-2.0, 10.0, vY);
      vec3 cool = vec3(0.72, 0.65, 0.82);
      vec3 warm = vec3(0.90, 0.75, 0.50);
      vec3 col = mix(cool, warm, warmth * 0.6);
      gl_FragColor = vec4(col, a * 0.6);
    }
  `
});
const trailPts = new THREE.Points(trailGeo, trailMat);
scene.add(trailPts);

/* ── spatial hash ── */
const CELL = 3.0;
let grid = new Map();
function gridKey(x,y,z){ return `${Math.floor(x/CELL)},${Math.floor(y/CELL)},${Math.floor(z/CELL)}`; }
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<N;i++){
    const k = gridKey(pos[i*3], pos[i*3+1], pos[i*3+2]);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(x,y,z){
  const r=[];
  const cx=Math.floor(x/CELL), cy=Math.floor(y/CELL), cz=Math.floor(z/CELL);
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const k=`${cx+dx},${cy+dy},${cz+dz}`;
    if(grid.has(k)) r.push(...grid.get(k));
  }
  return r;
}

/* ── simulation ── */
const centroid = new THREE.Vector3();
const steer = new THREE.Vector3();
let accretedCount = 0;
let elapsed = 0;

/* matins: dawn phase starts after ~40% accreted, peaks by ~80% */
function dawnFactor(){
  const ratio = accretedCount / N;
  return smoothstep(0.3, 0.75, ratio);
}
function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function simulate(dt){
  elapsed += dt;
  rebuildGrid();

  const nestPull = Math.min(0.04, 0.005 + elapsed * 0.0004);
  const accretionThreshold = Math.max(0.15, 0.5 - elapsed * 0.003);
  const dawn = dawnFactor();

  /* matins: as dawn grows, nest ring lifts and narrows into a spire/chalice */
  const liftAmt = dawn * 4.0;
  const narrowAmt = dawn * 0.35; // ring contracts slightly

  accretedCount = 0;
  centroid.set(0,0,0);

  for(let i=0;i<N;i++){
    const px=pos[i*3], py=pos[i*3+1], pz=pos[i*3+2];
    centroid.x += px; centroid.y += py; centroid.z += pz;

    if(accreted[i] > 0.5){
      accretedCount++;
      accretedTime[i] += dt;

      /* matins: accreted spheres slowly rise — higher ones rise faster (aspiration) */
      const heightAboveBase = Math.max(0, py - NEST_Y);
      const riseRate = dawn * 0.008 * (1.0 + heightAboveBase * 0.06);
      pos[i*3+1] += riseRate * dt;

      /* choral breathing: vertical wave synchronized like voices in rounds */
      const choralPhase = elapsed * 0.8 + phase[i] * 6.28;
      const wavePhase = py * 0.3 - elapsed * 0.6; // wave travels upward
      const breath = Math.sin(choralPhase) * 0.003 + Math.sin(wavePhase) * 0.002 * dawn;

      /* slight inward contraction as form rises (chalice narrowing) */
      const radDist = Math.sqrt(px*px + pz*pz);
      if(radDist > 0.1){
        const contract = dawn * 0.001 * heightAboveBase * dt;
        pos[i*3]   -= (px / radDist) * contract;
        pos[i*3+2] -= (pz / radDist) * contract;
      }

      pos[i*3]   += pos[i*3]   * breath * 0.01;
      pos[i*3+1] += py * breath * 0.01;
      pos[i*3+2] += pz * breath * 0.01;
      continue;
    }

    steer.set(0,0,0);

    /* attract toward nest — ring lifts with dawn */
    const angle = Math.atan2(pz, px);
    const currentRadius = NEST_RADIUS * (1.0 - narrowAmt);
    const tx = Math.cos(angle) * currentRadius;
    const tz = Math.sin(angle) * currentRadius;
    const ty = NEST_Y + liftAmt + Math.sin(angle * 3.0 + elapsed * 0.2) * 1.2;
    steer.x += (tx - px) * nestPull;
    steer.y += (ty - py) * nestPull;
    steer.z += (tz - pz) * nestPull;

    /* matins: free spheres feel gentle upward pull as dawn comes */
    steer.y += dawn * 0.012;

    /* flocking */
    const nbrs = neighbors(px, py, pz);
    let cCount = 0;
    const avgP = { x:0, y:0, z:0 };
    for(const j of nbrs){
      if(i===j) continue;
      const dx=pos[j*3]-px, dy=pos[j*3+1]-py, dz=pos[j*3+2]-pz;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2 < 9.0 && d2 > 0.01){
        const d=Math.sqrt(d2);
        avgP.x += pos[j*3]; avgP.y += pos[j*3+1]; avgP.z += pos[j*3+2];
        cCount++;
        if(d < 1.0){
          const f = (1.0 - d) * 0.12;
          steer.x -= (dx/d)*f; steer.y -= (dy/d)*f; steer.z -= (dz/d)*f;
        }
      }
    }
    if(cCount > 0){
      steer.x += (avgP.x/cCount - px) * 0.015;
      steer.y += (avgP.y/cCount - py) * 0.015;
      steer.z += (avgP.z/cCount - pz) * 0.015;
    }

    /* orbital drift, diminishes as dawn rises (stillness of prayer) */
    const radial = Math.sqrt(px*px + pz*pz) + 0.001;
    const tangX = -pz / radial;
    const tangZ =  px / radial;
    const orbitStr = 0.15 * Math.max(0, 1.0 - accretedCount / (N * 0.6)) * (1.0 - dawn * 0.6);
    steer.x += tangX * orbitStr;
    steer.z += tangZ * orbitStr;

    vel[i*3]   += steer.x * dt;
    vel[i*3+1] += steer.y * dt;
    vel[i*3+2] += steer.z * dt;

    vel[i*3]   *= 0.985;
    vel[i*3+1] *= 0.985;
    vel[i*3+2] *= 0.985;

    const spd = Math.sqrt(vel[i*3]**2 + vel[i*3+1]**2 + vel[i*3+2]**2);
    const maxSpd = 1.4;
    if(spd > maxSpd){
      vel[i*3]   *= maxSpd/spd;
      vel[i*3+1] *= maxSpd/spd;
      vel[i*3+2] *= maxSpd/spd;
    }

    pos[i*3]   += vel[i*3]   * dt;
    pos[i*3+1] += vel[i*3+1] * dt;
    pos[i*3+2] += vel[i*3+2] * dt;

    /* accretion */
    const distToNest = Math.sqrt((px-tx)**2 + (py-ty)**2 + (pz-tz)**2);
    if(spd < accretionThreshold && distToNest < 2.5 && elapsed > 2.0){
      accreted[i] = 1.0;
      vel[i*3] = vel[i*3+1] = vel[i*3+2] = 0;
      for(let t=0; t<3; t++){
        const ti = (trailHead++) % TRAIL_N;
        trailPos[ti*3]   = px + (Math.random()-0.5)*0.5;
        trailPos[ti*3+1] = py + (Math.random()-0.5)*0.5;
        trailPos[ti*3+2] = pz + (Math.random()-0.5)*0.5;
        trailAlpha[ti] = 0.8;
      }
    }

    if(spd > 0.3 && Math.random() < 0.03){
      const ti = (trailHead++) % TRAIL_N;
      trailPos[ti*3]   = px;
      trailPos[ti*3+1] = py;
      trailPos[ti*3+2] = pz;
      trailAlpha[ti] = 0.4 + spd * 0.3;
    }
  }

  centroid.multiplyScalar(1/N);

  for(let i=0;i<TRAIL_N;i++){
    trailAlpha[i] *= 0.994;
    /* trails drift upward slightly during dawn — like incense */
    if(trailAlpha[i] > 0.01 && trailPos[i*3+1] > -50){
      trailPos[i*3+1] += dawn * 0.02 * dt;
    }
    if(trailAlpha[i] < 0.01){ trailPos[i*3+1] = -100; trailAlpha[i] = 0; }
  }

  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.alpha.needsUpdate = true;
  accAttr.needsUpdate = true;
}

function updateMatrices(){
  for(let i=0;i<N;i++){
    dummy.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
    const s = scale[i];
    const sw = accreted[i] > 0.5 ? 1.0 + Math.sin(elapsed*0.5 + phase[i]*6.28)*0.06 : 1.0;
    dummy.scale.setScalar(s * sw);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

/* ── camera: tracks centroid, rises with the form ── */
function updateCamera(){
  const t = elapsed;
  const dawn = dawnFactor();
  const camR = 28 - Math.min(8, elapsed * 0.15);
  const angle = t * 0.06;
  /* camera elevation rises as form ascends */
  const elevBoost = dawn * 5.0;
  const cy = centroid.y + 6 + Math.sin(t * 0.12) * 3 + elevBoost;
  const targetX = centroid.x + Math.cos(angle) * camR;
  const targetZ = centroid.z + Math.sin(angle) * camR;

  camera.position.x += (targetX - camera.position.x) * 0.02;
  camera.position.y += (cy - camera.position.y) * 0.02;
  camera.position.z += (targetZ - camera.position.z) * 0.02;
  camera.lookAt(centroid.x, centroid.y + elevBoost * 0.3, centroid.z);
}

/* ── dawn lighting transition ── */
function updateLighting(){
  const dawn = dawnFactor();
  /* key light warms */
  keyLight.color.setRGB(
    0.91 + dawn * 0.05,
    0.87 - dawn * 0.02,
    0.94 - dawn * 0.12
  );
  /* dawn light fades in */
  dawnLight.intensity = dawn * 1.4;
  /* ambient warms very slightly */
  amb.color.setRGB(0.10 + dawn * 0.04, 0.08 + dawn * 0.02, 0.12 - dawn * 0.02);
  /* background lightens barely toward deep indigo */
  const bgR = 0.04 + dawn * 0.02;
  const bgG = 0.035 + dawn * 0.01;
  const bgB = 0.05 + dawn * 0.03;
  renderer.setClearColor(new THREE.Color(bgR, bgG, bgB), 1);
  if(scene.fog) scene.fog.color.setRGB(bgR, bgG, bgB);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
const hintEl = document.getElementById('hint');
let fc = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastT) / 1000, 0.05) * 60;
  lastT = now;

  simulate(dt);
  updateMatrices();
  updateCamera();
  updateLighting();

  const dawn = dawnFactor();
  nestMat.uniforms.uTime.value = elapsed;
  nestMat.uniforms.uDawn.value = dawn;
  nestMat.uniforms.uCamPos.value.copy(camera.position);
  trailMat.uniforms.uTime.value = elapsed;
  trailMat.uniforms.uDawn.value = dawn;

  renderer.render(scene, camera);

  fc++;
  if(fc % 90 === 0){
    const pct = (accretedCount / N * 100).toFixed(0);
    const dawnPct = (dawn * 100).toFixed(0);
    hintEl.textContent = `matins: ${pct}% gathered · dawn ${dawnPct}% · Wang & Söderström`;
  }

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
