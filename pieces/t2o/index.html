<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t2o · topographic pins · Tara Donovan</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0a0a0e;overflow:hidden}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#cdd2dc;letter-spacing:0.06em}
</style>
</head>
<body>
<div class="id">t2o</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Tara Donovan × topographic ──────────────────────────────
   Millions of identical pins accumulate into a breathing
   topographic landscape. Contour rings are generated via
   differential growth (inherited from ajo/5gm), then scanline-
   rasterised into a heightfield. Every pin is the same tiny
   cylinder — the terrain emerges purely from placement density
   and height. Warm bone-white on near-black.                  */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.3);
keyLight.position.set(5, 22, 8);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0x1a1520, 0.55));
const fillLight = new THREE.DirectionalLight(0xe0d8cc, 0.3);
fillLight.position.set(-8, 10, -6);
scene.add(fillLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;

/* ── differential growth engine (2-D, from ajo lineage) ───── */
function growRing(baseRadius, steps) {
  const ATT = 0.05, REP_R = 0.5, REP_S = 0.12, PRES = 0.003, MAX_D = 0.38, MAX_V = 900;
  const vs = [];
  const nI = 12 + Math.floor(baseRadius * 2.5);
  for (let i = 0; i < nI; i++) {
    const th = i / nI * Math.PI * 2;
    const r = baseRadius + (Math.random() - 0.5) * 0.15;
    vs.push({ x: Math.cos(th) * r, z: Math.sin(th) * r });
  }
  const CELL = REP_R;
  for (let s = 0; s < steps; s++) {
    const n = vs.length; if (n >= MAX_V) break;
    const grid = new Map();
    for (let i = 0; i < n; i++) {
      const k = Math.floor(vs[i].x / CELL) + ',' + Math.floor(vs[i].z / CELL);
      if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i);
    }
    const dx = new Float32Array(n), dz = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = vs[i];
      const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
      for (let gx = -1; gx <= 1; gx++) for (let gz = -1; gz <= 1; gz++) {
        const arr = grid.get((cx + gx) + ',' + (cz + gz));
        if (!arr) continue;
        for (const j of arr) {
          if (j === i) continue;
          const ex = v.x - vs[j].x, ez = v.z - vs[j].z;
          const d2 = ex * ex + ez * ez;
          if (d2 > REP_R * REP_R || d2 < 1e-6) continue;
          const d = Math.sqrt(d2);
          const f = REP_S * (1 - d / REP_R) / d;
          dx[i] += ex * f; dz[i] += ez * f;
        }
      }
    }
    for (let i = 0; i < n; i++) {
      const a = vs[(i - 1 + n) % n], b = vs[(i + 1) % n], v = vs[i];
      dx[i] += (a.x + b.x - 2 * v.x) * ATT;
      dz[i] += (a.z + b.z - 2 * v.z) * ATT;
    }
    let mx = 0, mz = 0;
    for (const v of vs) { mx += v.x; mz += v.z; }
    mx /= n; mz /= n;
    for (let i = 0; i < n; i++) {
      const ox = vs[i].x - mx, oz = vs[i].z - mz;
      const d = Math.hypot(ox, oz) + 1e-6;
      dx[i] += (ox / d) * PRES; dz[i] += (oz / d) * PRES;
      vs[i].x += dx[i] + (Math.random() - 0.5) * 0.002;
      vs[i].z += dz[i] + (Math.random() - 0.5) * 0.002;
    }
    const grown = [];
    for (let i = 0; i < vs.length; i++) {
      const a = vs[i], b = vs[(i + 1) % vs.length];
      grown.push(a);
      const ex = b.x - a.x, ez = b.z - a.z;
      if (ex * ex + ez * ez > MAX_D * MAX_D && vs.length + grown.length < MAX_V) {
        grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5 });
      }
    }
    vs.length = 0;
    for (const v of grown) vs.push(v);
  }
  return vs;
}

/* ── generate 9 contour rings ─────────────────────────────── */
const N_RINGS = 9;
const rings = [];
for (let r = 0; r < N_RINGS; r++) {
  const baseR = 0.8 + r * 1.3;
  rings.push(growRing(baseR, 550 + r * 80));
}

/* ── scanline-rasterise rings into heightfield ────────────── */
const G = 256, EXT = 16;
const hmap = new Float32Array(G * G);
const cellSize = 2 * EXT / G;

for (let r = 0; r < N_RINGS; r++) {
  const ring = rings[r], n = ring.length;
  const layerH = 0.40;
  for (let gy = 0; gy < G; gy++) {
    const pz = -EXT + (gy + 0.5) * cellSize;
    const xs = [];
    for (let i = 0; i < n; i++) {
      const a = ring[i], b = ring[(i + 1) % n];
      if ((a.z <= pz && b.z > pz) || (b.z <= pz && a.z > pz)) {
        const t = (pz - a.z) / (b.z - a.z);
        xs.push(a.x + t * (b.x - a.x));
      }
    }
    xs.sort((a, b) => a - b);
    for (let p = 0; p + 1 < xs.length; p += 2) {
      const gx0 = Math.max(0, Math.floor((xs[p] + EXT) / cellSize));
      const gx1 = Math.min(G - 1, Math.floor((xs[p + 1] + EXT) / cellSize));
      for (let gx = gx0; gx <= gx1; gx++) hmap[gy * G + gx] += layerH;
    }
  }
}

function sampleH(px, pz) {
  const gx = (px + EXT) / cellSize, gz = (pz + EXT) / cellSize;
  const ix = Math.floor(gx), iz = Math.floor(gz);
  if (ix < 0 || ix >= G - 1 || iz < 0 || iz >= G - 1) return 0;
  const fx = gx - ix, fz = gz - iz;
  return hmap[iz * G + ix] * (1 - fx) * (1 - fz) +
         hmap[iz * G + ix + 1] * fx * (1 - fz) +
         hmap[(iz + 1) * G + ix] * (1 - fx) * fz +
         hmap[(iz + 1) * G + ix + 1] * fx * fz;
}

/* ── place pins on filled interior ────────────────────────── */
const MAX_PINS = 26000;
const PIN_R = 0.012;
const spacing = 2 * EXT / Math.sqrt(MAX_PINS * 1.4);
const pins = [];
for (let z = -EXT; z < EXT; z += spacing) {
  for (let x = -EXT; x < EXT; x += spacing) {
    const px = x + (Math.random() - 0.5) * spacing * 0.55;
    const pz = z + (Math.random() - 0.5) * spacing * 0.55;
    const h = sampleH(px, pz);
    if (h > 0.15) pins.push({ x: px, z: pz, h });
  }
}
if (pins.length > MAX_PINS) pins.length = MAX_PINS;

/* ── instanced mesh with custom shader for GPU breathing ──── */
const pinGeo = new THREE.CylinderGeometry(PIN_R, PIN_R, 1, 5, 1);
pinGeo.translate(0, 0.5, 0);

const pinMat = new THREE.MeshStandardMaterial({
  color: 0xf0ebe0,
  roughness: 0.58,
  metalness: 0.04,
});

/* inject breathing into vertex shader via onBeforeCompile */
pinMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    `#include <begin_vertex>
     // breathing: scale Y based on world position encoded in instance matrix
     vec3 wPos = (instanceMatrix * vec4(0.,0.,0.,1.)).xyz;
     float phase = (wPos.x + wPos.z) * 0.12;
     float breath = sin(uTime * 0.3 + phase) * 0.18 + sin(uTime * 0.17 + phase * 0.7) * 0.10;
     transformed.y *= 1.0 + breath;
    `
  );
  pinMat.userData.shader = shader;
};

const mesh = new THREE.InstancedMesh(pinGeo, pinMat, pins.length);
const mat4 = new THREE.Matrix4();
const scl = new THREE.Matrix4();

let cenX = 0, cenZ = 0, peakH = 0;
for (const p of pins) { cenX += p.x; cenZ += p.z; if (p.h > peakH) peakH = p.h; }
cenX /= pins.length; cenZ /= pins.length;

for (let i = 0; i < pins.length; i++) {
  const p = pins[i];
  mat4.makeTranslation(p.x, 0, p.z);
  scl.makeScale(1, p.h, 1);
  mat4.multiply(scl);
  mesh.setMatrixAt(i, mat4);
}
mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);

/* ── camera framing ───────────────────────────────────────── */
controls.target.set(cenX, peakH * 0.35, cenZ);
camera.position.set(cenX + 10, peakH + 14, cenZ + 18);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── render loop ──────────────────────────────────────────── */
const t0 = performance.now();
(function animate() {
  const t = (performance.now() - t0) / 1000;
  if (pinMat.userData.shader) pinMat.userData.shader.uniforms.uTime.value = t;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
})();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
