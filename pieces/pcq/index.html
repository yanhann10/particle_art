<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pcq · Thread States — Shiota presence cycle</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; cursor:pointer; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
.state { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">pcq</div>
<div class="state" id="stateLabel">convergence</div>
<!-- MOTION: suspension, intensity: calm -->
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.045);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x221111, 0.8);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
dirLight.position.set(-3, 5, 2);
scene.add(dirLight);

let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(2.8, 0.6, -3.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.35,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.85
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const ROOM = { w: 18, h: 12, d: 28 };
const anchors = [];

function wallPoint(){
  const face = Math.floor(rng() * 6);
  let x, y, z;
  const hw = ROOM.w / 2, hh = ROOM.h / 2, hd = ROOM.d / 2;
  switch(face){
    case 0: x = -hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 1: x =  hw; y = (rng()-0.5)*ROOM.h; z = (rng()-0.5)*ROOM.d; break;
    case 2: y = -hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 3: y =  hh; x = (rng()-0.5)*ROOM.w; z = (rng()-0.5)*ROOM.d; break;
    case 4: z = -hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
    case 5: z =  hd; x = (rng()-0.5)*ROOM.w; y = (rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

const NUM_ANCHORS = 600;
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.1 + rng() * 2.5;
    const p = sphereCenter.clone().add(dir.multiplyScalar(dist));
    anchors.push(p);
  } else {
    anchors.push(wallPoint());
  }
}

function sphereSurfacePoint(from){
  const dir = sphereCenter.clone().sub(from).normalize();
  return sphereCenter.clone().add(dir.multiplyScalar(-sphereRadius * (0.98 + rng()*0.04)));
}

// State definitions
const states = [
  { name: 'convergence', build: buildConvergence },
  { name: 'dispersal', build: buildDispersal },
  { name: 'suspension', build: buildSuspension },
  { name: 'lattice', build: buildLattice },
  { name: 'dissolution', build: buildDissolution }
];
let currentState = 0;

const NUM_LINES = 20000;
let linePositions = new Float32Array(NUM_LINES * 6);
let targetPositions = new Float32Array(NUM_LINES * 6);
let basePositions = new Float32Array(NUM_LINES * 6);
let transitionProgress = 1.0;
let li = 0;

// STATE 1: Convergence — threads radiating to sphere
function buildConvergence(){
  li = 0;
  const positions = new Float32Array(NUM_LINES * 6);
  
  for (let i = 0; i < NUM_LINES && li < NUM_LINES; i++){
    const a = anchors[Math.floor(rng() * anchors.length)];
    const nearSphere = sphereSurfacePoint(a);
    nearSphere.x += (rng()-0.5) * 0.5;
    nearSphere.y += (rng()-0.5) * 0.5;
    nearSphere.z += (rng()-0.5) * 0.5;
    const idx = li * 6;
    positions[idx]   = a.x; positions[idx+1] = a.y; positions[idx+2] = a.z;
    positions[idx+3] = nearSphere.x; positions[idx+4] = nearSphere.y; positions[idx+5] = nearSphere.z;
    li++;
  }
  return positions;
}

// STATE 2: Dispersal — threads fleeing outward from sphere
function buildDispersal(){
  li = 0;
  const positions = new Float32Array(NUM_LINES * 6);
  
  for (let i = 0; i < NUM_LINES && li < NUM_LINES; i++){
    const nearSphere = sphereSurfacePoint(new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5));
    const dir = nearSphere.clone().sub(sphereCenter).normalize();
    const far = nearSphere.clone().add(dir.multiplyScalar(8 + rng() * 15));
    const idx = li * 6;
    positions[idx]   = nearSphere.x; positions[idx+1] = nearSphere.y; positions[idx+2] = nearSphere.z;
    positions[idx+3] = far.x; positions[idx+4] = far.y; positions[idx+5] = far.z;
    li++;
  }
  return positions;
}

// STATE 3: Suspension — horizontal threads with vertical hangers
function buildSuspension(){
  li = 0;
  const positions = new Float32Array(NUM_LINES * 6);
  const hh = ROOM.h / 2;
  
  // Horizontal threads at various heights
  const numHoriz = Math.floor(NUM_LINES * 0.6);
  for (let i = 0; i < numHoriz && li < NUM_LINES; i++){
    const y = (rng() - 0.5) * ROOM.h * 0.8;
    const a = wallPoint();
    const b = wallPoint();
    a.y = y;
    b.y = y + (rng()-0.5) * 0.5;
    const idx = li * 6;
    positions[idx]   = a.x; positions[idx+1] = a.y; positions[idx+2] = a.z;
    positions[idx+3] = b.x; positions[idx+4] = b.y; positions[idx+5] = b.z;
    li++;
  }
  
  // Vertical hangers
  while (li < NUM_LINES){
    const x = (rng()-0.5) * ROOM.w * 0.7;
    const z = (rng()-0.5) * ROOM.d * 0.7;
    const top = hh - rng() * 2;
    const bottom = top - (1.5 + rng() * 5);
    const idx = li * 6;
    positions[idx]   = x; positions[idx+1] = top; positions[idx+2] = z;
    positions[idx+3] = x + (rng()-0.5)*0.3; positions[idx+4] = bottom; positions[idx+5] = z + (rng()-0.5)*0.3;
    li++;
  }
  
  return positions;
}

// STATE 4: Lattice — cubic grid structure
function buildLattice(){
  li = 0;
  const positions = new Float32Array(NUM_LINES * 6);
  const grid = 12;
  const spacing = ROOM.w / grid;
  
  // Generate grid points
  const gridPoints = [];
  for (let ix = 0; ix < grid; ix++){
    for (let iy = 0; iy < grid; iy++){
      for (let iz = 0; iz < grid; iz++){
        gridPoints.push(new THREE.Vector3(
          (ix - grid/2) * spacing,
          (iy - grid/2) * spacing * 0.67,
          (iz - grid/2) * spacing * 1.5
        ));
      }
    }
  }
  
  // Connect each point to 2-4 neighbors
  for (let i = 0; i < gridPoints.length && li < NUM_LINES; i++){
    const a = gridPoints[i];
    const numConnections = 2 + Math.floor(rng() * 3);
    for (let j = 0; j < numConnections && li < NUM_LINES; j++){
      let best = null, bestDist = Infinity;
      for (let k = 0; k < 8; k++){
        const bi = Math.floor(rng() * gridPoints.length);
        if (bi === i) continue;
        const d = a.distanceTo(gridPoints[bi]);
        if (d < bestDist && d > spacing * 0.5 && d < spacing * 2.5){ 
          bestDist = d; best = gridPoints[bi]; 
        }
      }
      if (best){
        const idx = li * 6;
        positions[idx]   = a.x; positions[idx+1] = a.y; positions[idx+2] = a.z;
        positions[idx+3] = best.x; positions[idx+4] = best.y; positions[idx+5] = best.z;
        li++;
      }
    }
  }
  
  return positions;
}

// STATE 5: Dissolution — sparse random threads in void
function buildDissolution(){
  li = 0;
  const positions = new Float32Array(NUM_LINES * 6);
  const numSparse = Math.floor(NUM_LINES * 0.15);
  
  for (let i = 0; i < numSparse && li < NUM_LINES; i++){
    const a = new THREE.Vector3(
      (rng()-0.5) * ROOM.w * 1.2,
      (rng()-0.5) * ROOM.h * 1.2,
      (rng()-0.5) * ROOM.d * 1.2
    );
    const b = new THREE.Vector3(
      a.x + (rng()-0.5) * 3,
      a.y + (rng()-0.5) * 3,
      a.z + (rng()-0.5) * 3
    );
    const idx = li * 6;
    positions[idx]   = a.x; positions[idx+1] = a.y; positions[idx+2] = a.z;
    positions[idx+3] = b.x; positions[idx+4] = b.y; positions[idx+5] = b.z;
    li++;
  }
  
  // Fill rest with transparent placeholders far away
  while (li < NUM_LINES){
    const idx = li * 6;
    positions[idx] = positions[idx+1] = positions[idx+2] = 1000;
    positions[idx+3] = positions[idx+4] = positions[idx+5] = 1000;
    li++;
  }
  
  return positions;
}

// Initialize with first state
basePositions = buildConvergence();
linePositions.set(basePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

const NUM_FRAGMENTS = 18;
const fragments = [];
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.05 + rng() * 0.15;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(size, size * (0.3 + rng()*1.4), size * (0.3 + rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04 + rng()*0.06, 0.02 + rng()*0.03, 0.02 + rng()*0.02),
    transparent: true,
    opacity: 0.6 + rng() * 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = rng();
  const segIdx = Math.floor(rng() * li) * 6;
  mesh.position.set(
    basePositions[segIdx] * (1-t) + basePositions[segIdx+3] * t,
    basePositions[segIdx+1] * (1-t) + basePositions[segIdx+4] * t,
    basePositions[segIdx+2] * (1-t) + basePositions[segIdx+5] * t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  mesh.userData.basePos = mesh.position.clone();
  mesh.userData.baseRot = mesh.rotation.clone();
  fragments.push(mesh);
  scene.add(mesh);
}

const cameraPath = {
  radius: 6.5,
  height: 0.8,
  speed: 0.018,
  lookBias: new THREE.Vector3(0.5, 0.3, 0)
};

// Click handler
document.body.addEventListener('click', () => {
  currentState = (currentState + 1) % states.length;
  targetPositions = states[currentState].build();
  transitionProgress = 0;
  document.getElementById('stateLabel').textContent = states[currentState].name;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Transition between states
  if (transitionProgress < 1.0){
    transitionProgress += 0.012;
    if (transitionProgress > 1.0) transitionProgress = 1.0;
    
    const t = transitionProgress;
    const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
    
    for (let i = 0; i < li * 6; i++){
      linePositions[i] = basePositions[i] * (1 - eased) + targetPositions[i] * eased;
    }
    
    if (transitionProgress >= 1.0){
      basePositions.set(targetPositions);
    }
  } else {
    // Breathing
    const breathAmp = 0.015;
    const breathFreq = 0.3;
    for (let i = 0; i < li * 6; i += 3){
      const bx = basePositions[i];
      const by = basePositions[i+1];
      const bz = basePositions[i+2];
      const phase = bx * 0.7 + by * 1.1 + bz * 0.5;
      const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;
      linePositions[i]   = bx + b;
      linePositions[i+1] = by + b * 0.7;
      linePositions[i+2] = bz + b * 0.5;
    }
  }
  
  lineGeo.attributes.position.needsUpdate = true;

  // Update fragment positions during transition
  if (transitionProgress < 1.0){
    const eased = transitionProgress < 0.5 ? 2*transitionProgress*transitionProgress : 1 - Math.pow(-2*transitionProgress + 2, 2)/2;
    fragments.forEach((frag, i) => {
      const segIdx = Math.floor((i / NUM_FRAGMENTS) * li) * 6;
      const t = 0.5;
      const newX = linePositions[segIdx] * (1-t) + linePositions[segIdx+3] * t;
      const newY = linePositions[segIdx+1] * (1-t) + linePositions[segIdx+4] * t;
      const newZ = linePositions[segIdx+2] * (1-t) + linePositions[segIdx+5] * t;
      
      frag.position.x = frag.userData.basePos.x * (1-eased) + newX * eased;
      frag.position.y = frag.userData.basePos.y * (1-eased) + newY * eased;
      frag.position.z = frag.userData.basePos.z * (1-eased) + newZ * eased;
    });
  }

  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  camera.position.set(
    sphereCenter.x + Math.cos(angle) * cr,
    sphereCenter.y + cameraPath.height + Math.sin(elapsed * 0.012) * 1.5,
    sphereCenter.z + Math.sin(angle) * cr
  );
  const lookTarget = sphereCenter.clone();
  lookTarget.x += Math.sin(elapsed * 0.04) * cameraPath.lookBias.x;
  lookTarget.y += Math.cos(elapsed * 0.03) * cameraPath.lookBias.y;
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
