<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>674 · biological · Eva Hesse cellular curtain</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f0e8dd; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">674</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf0e8dd, 1);
document.body.appendChild(renderer.domElement);

/* --- RNG --- */
let seed = 91827;
function rng() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function gauss() { return (rng()+rng()+rng()+rng()-2.0)/1.2; }

/* --- Hesse-like irregular cell placement via Poisson-ish scatter --- */
const STRAND_COUNT = 220;
const cellCenters = [];

// Irregular cluster regions — organic, not gridded
const clusterCount = 5 + Math.floor(rng() * 4);
const clusters = [];
for (let i = 0; i < clusterCount; i++) {
  clusters.push({
    x: (rng() - 0.5) * 8,
    y: (rng() - 0.5) * 6,
    r: 1.2 + rng() * 2.5,
    density: 0.4 + rng() * 0.6
  });
}

// Scatter cells biased toward clusters with gaps
for (let i = 0; i < STRAND_COUNT; i++) {
  // Pick a random cluster weighted by density
  const ci = Math.floor(rng() * clusterCount);
  const c = clusters[ci];
  const angle = rng() * Math.PI * 2;
  const dist = Math.sqrt(rng()) * c.r * c.density;
  const cx = c.x + Math.cos(angle) * dist + gauss() * 0.6;
  const cy = c.y + Math.sin(angle) * dist + gauss() * 0.4;
  cellCenters.push({ x: cx, y: cy });
}

/* --- Build hanging strands as catenary curves with organic bulges --- */
const SEGS_PER_STRAND = 36;
const totalVerts = STRAND_COUNT * SEGS_PER_STRAND;

const positions = new Float32Array(totalVerts * 3);
const colors = new Float32Array(totalVerts * 3);
const alphas = new Float32Array(totalVerts);
const strandIds = new Float32Array(totalVerts);
const vertPhase = new Float32Array(totalVerts);

// Palette: warm latex amber, translucent fiberglass resin, milky tip
const colLatex = new THREE.Color(0xc49a6c);
const colResin = new THREE.Color(0xd4b896);
const colMilky = new THREE.Color(0xece4d8);

const centroid = new THREE.Vector3();

for (let s = 0; s < STRAND_COUNT; s++) {
  const cx = cellCenters[s].x;
  const cy = cellCenters[s].y;

  // Each strand hangs downward with catenary sag + asymmetric bulge
  const hangLength = 2.0 + rng() * 4.5;
  const sagAmount = 0.3 + rng() * 0.8;
  const bulgePos = 0.3 + rng() * 0.4; // where bulge peaks along strand
  const bulgeAmp = 0.15 + rng() * 0.5;
  const bulgeDir = (rng() - 0.5) * 2; // lateral direction
  const twistRate = (rng() - 0.5) * 2.0;
  const thickness = 0.6 + rng() * 0.5; // for alpha modulation

  // Color choice per strand
  const colorChoice = rng();

  for (let v = 0; v < SEGS_PER_STRAND; v++) {
    const idx = s * SEGS_PER_STRAND + v;
    const t = v / (SEGS_PER_STRAND - 1);

    // Catenary hang
    const catenaryY = cy - t * hangLength;
    // Lateral sag (catenary shape: cosh-like)
    const sag = sagAmount * (Math.cosh((t - 0.5) * 2.5) - Math.cosh(0)) / (Math.cosh(1.25) - Math.cosh(0));
    // Organic bulge — asymmetric Gaussian
    const bulgeT = Math.exp(-((t - bulgePos) ** 2) / 0.02);
    const bx = bulgeDir * bulgeAmp * bulgeT;
    const bz = bulgeAmp * 0.5 * bulgeT * Math.sin(twistRate * t * Math.PI);

    const px = cx + sag * 0.5 + bx;
    const py = catenaryY;
    const pz = sag * 0.3 + bz;

    positions[idx * 3] = px;
    positions[idx * 3 + 1] = py;
    positions[idx * 3 + 2] = pz;

    centroid.x += px; centroid.y += py; centroid.z += pz;

    // Color gradient along strand: latex body, milky tips
    const tipBlend = Math.pow(t, 2.5);
    let col;
    if (colorChoice < 0.45) {
      col = colLatex.clone().lerp(colMilky, tipBlend);
    } else if (colorChoice < 0.75) {
      col = colResin.clone().lerp(colMilky, tipBlend * 0.8);
    } else {
      // Some strands are more translucent/milky throughout
      col = colMilky.clone().lerp(colLatex, (1 - t) * 0.3);
    }
    colors[idx * 3] = col.r;
    colors[idx * 3 + 1] = col.g;
    colors[idx * 3 + 2] = col.b;

    // Alpha: thicker in middle, thinner at ends, varies per strand
    const endFade = Math.sin(t * Math.PI);
    alphas[idx] = (0.35 + thickness * 0.5) * (0.3 + endFade * 0.7);
    strandIds[idx] = s;
    vertPhase[idx] = t;
  }
}

centroid.divideScalar(totalVerts);

/* --- Geometry --- */
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
geom.setAttribute('aStrandId', new THREE.BufferAttribute(strandIds, 1));
geom.setAttribute('aPhase', new THREE.BufferAttribute(vertPhase, 1));

/* --- ShaderMaterial — no fog: true, handle manually --- */
const mat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aColor;
    attribute float aAlpha;
    attribute float aStrandId;
    attribute float aPhase;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vPhase;
    varying float vStrandId;
    uniform float uTime;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha;
      vPhase = aPhase;
      vStrandId = aStrandId;
      // Gentle sway animation — biological breathing
      float swayFreq = 0.4 + fract(aStrandId * 0.137) * 0.3;
      float swayAmp = 0.06 + aPhase * 0.12;
      float swayDelay = fract(aStrandId * 0.271) * 6.28;
      vec3 pos = position;
      pos.x += sin(uTime * swayFreq + swayDelay + aPhase * 2.0) * swayAmp;
      pos.z += cos(uTime * swayFreq * 0.7 + swayDelay + aPhase * 1.5) * swayAmp * 0.5;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      gl_PointSize = mix(2.8, 1.2, aPhase) * (1.0 + 0.15 * sin(uTime * 0.3 + aStrandId));
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    varying float vPhase;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float soft = 1.0 - d * d;
      gl_FragColor = vec4(vColor, vAlpha * soft);
    }
  `,
  uniforms: {
    uTime: { value: 0 }
  }
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* --- Also draw thin connecting lines within each strand for fiber feel --- */
const lineIndices = [];
for (let s = 0; s < STRAND_COUNT; s++) {
  for (let v = 0; v < SEGS_PER_STRAND - 1; v++) {
    lineIndices.push(s * SEGS_PER_STRAND + v, s * SEGS_PER_STRAND + v + 1);
  }
}
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(positions.slice(), 3));
lineGeom.setAttribute('aColor', new THREE.BufferAttribute(colors.slice(), 3));
lineGeom.setAttribute('aAlpha', new THREE.BufferAttribute(alphas.slice(), 1));
lineGeom.setAttribute('aStrandId', new THREE.BufferAttribute(strandIds.slice(), 1));
lineGeom.setAttribute('aPhase', new THREE.BufferAttribute(vertPhase.slice(), 1));
lineGeom.setIndex(lineIndices);

const lineMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute vec3 aColor;
    attribute float aAlpha;
    attribute float aStrandId;
    attribute float aPhase;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uTime;
    void main() {
      vColor = aColor;
      vAlpha = aAlpha * 0.45;
      float swayFreq = 0.4 + fract(aStrandId * 0.137) * 0.3;
      float swayAmp = 0.06 + aPhase * 0.12;
      float swayDelay = fract(aStrandId * 0.271) * 6.28;
      vec3 pos = position;
      pos.x += sin(uTime * swayFreq + swayDelay + aPhase * 2.0) * swayAmp;
      pos.z += cos(uTime * swayFreq * 0.7 + swayDelay + aPhase * 1.5) * swayAmp * 0.5;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      gl_FragColor = vec4(vColor, vAlpha);
    }
  `,
  uniforms: {
    uTime: { value: 0 }
  }
});

const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

/* --- Horizontal cross-threads between nearby strands (Hesse woven feel) --- */
const crossPositions = [];
const crossColors = [];
const crossAlphas = [];

for (let s = 0; s < STRAND_COUNT; s++) {
  // Find 1-2 nearest neighbors
  const cx = cellCenters[s].x, cy = cellCenters[s].y;
  let nearest = [];
  for (let j = 0; j < STRAND_COUNT; j++) {
    if (j === s) continue;
    const dx = cellCenters[j].x - cx, dy = cellCenters[j].y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 2.5) nearest.push({ idx: j, dist });
  }
  nearest.sort((a, b) => a.dist - b.dist);
  nearest = nearest.slice(0, 2);

  for (const nb of nearest) {
    // Connect at a random height along both strands
    const tv = 0.1 + rng() * 0.5;
    const vi = Math.floor(tv * (SEGS_PER_STRAND - 1));
    const idxA = s * SEGS_PER_STRAND + vi;
    const idxB = nb.idx * SEGS_PER_STRAND + vi;

    crossPositions.push(
      positions[idxA * 3], positions[idxA * 3 + 1], positions[idxA * 3 + 2],
      positions[idxB * 3], positions[idxB * 3 + 1], positions[idxB * 3 + 2]
    );
    const c = colResin;
    crossColors.push(c.r, c.g, c.b, c.r, c.g, c.b);
    const a = 0.12 + rng() * 0.1;
    crossAlphas.push(a, a);
  }
}

if (crossPositions.length > 0) {
  const crossGeom = new THREE.BufferGeometry();
  crossGeom.setAttribute('position', new THREE.Float32BufferAttribute(crossPositions, 3));
  crossGeom.setAttribute('aColor', new THREE.Float32BufferAttribute(crossColors, 3));
  crossGeom.setAttribute('aAlpha', new THREE.Float32BufferAttribute(crossAlphas, 1));
  const crossMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    vertexShader: `
      attribute vec3 aColor;
      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        vColor = aColor;
        vAlpha = aAlpha;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        gl_FragColor = vec4(vColor, vAlpha);
      }
    `
  });
  const crossLines = new THREE.LineSegments(crossGeom, crossMat);
  scene.add(crossLines);
}

/* --- Camera tracking centroid, tight framing --- */
let orbitTheta = 0, orbitPhi = 1.3;
let isDragging = false, prevX = 0, prevY = 0;
const radius = 16;

renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY; e.preventDefault();
});
addEventListener('pointermove', e => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.3, Math.min(1.57, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

// Click to regenerate with new seed
renderer.domElement.addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9);
  // Reloading is simplest for full regen
  location.reload();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;

  mat.uniforms.uTime.value = t;
  lineMat.uniforms.uTime.value = t;

  // Update line positions to match sway
  const lPos = lineGeom.attributes.position.array;
  const pPos = geom.attributes.position.array;
  // Sync sway into line geometry
  for (let s = 0; s < STRAND_COUNT; s++) {
    for (let v = 0; v < SEGS_PER_STRAND; v++) {
      const idx = s * SEGS_PER_STRAND + v;
      const phase = vertPhase[idx];
      const sid = strandIds[idx];
      const swayFreq = 0.4 + ((sid * 0.137) % 1) * 0.3;
      const swayAmp = 0.06 + phase * 0.12;
      const swayDelay = ((sid * 0.271) % 1) * 6.28;
      lPos[idx * 3] = positions[idx * 3] + Math.sin(t * swayFreq + swayDelay + phase * 2.0) * swayAmp;
      lPos[idx * 3 + 2] = positions[idx * 3 + 2] + Math.cos(t * swayFreq * 0.7 + swayDelay + phase * 1.5) * swayAmp * 0.5;
    }
  }
  lineGeom.attributes.position.needsUpdate = true;

  // Slow auto-orbit + tracking centroid
  const autoTheta = t * 0.03;
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;

  camera.position.set(
    centroid.x + radius * Math.sin(theta) * Math.sin(phi),
    centroid.y + radius * Math.cos(phi),
    centroid.z + radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
