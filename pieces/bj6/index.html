<script type="module">
import * as THREE from 'three';

// Morakana Cumulus — satellite view of clouds over Mexico-US border.
// Volumetric raymarched clouds (worley+perlin) drifting westward. Below:
// earth-toned terrain with a single red contour line marking the border.
// Politically-loaded atmospheric work; zero rotation, pure drift.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0806);
const camera = new THREE.OrthographicCamera(-12, 12, 9, -9, 0.1, 200);
camera.position.set(0, 40, 0);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ──────── Terrain plane
const terrainGeo = new THREE.PlaneGeometry(30, 24, 120, 96);
terrainGeo.rotateX(-Math.PI / 2);
const pos = terrainGeo.attributes.position;
for (let i = 0; i < pos.count; i++){
  const x = pos.getX(i), z = pos.getZ(i);
  const n = (Math.sin(x * 0.4) * Math.cos(z * 0.3)) * 0.12 +
            (Math.sin(x * 1.2 + z * 0.9) * 0.06);
  pos.setY(i, n);
}
pos.needsUpdate = true;
terrainGeo.computeVertexNormals();
const terrainMat = new THREE.MeshStandardMaterial({
  color: 0x5a4a38,
  roughness: 0.92,
  metalness: 0.0,
  flatShading: false,
});
const terrainMesh = new THREE.Mesh(terrainGeo, terrainMat);
scene.add(terrainMesh);

// ──────── Border contour line (red, thin)
const borderPoints = [];
const borderY = 0.08;
for (let i = 0; i <= 200; i++){
  const t = i / 200;
  const x = (t - 0.5) * 30;
  const z = Math.sin(t * Math.PI * 3.2) * 0.6 + (Math.random() - 0.5) * 0.08;
  borderPoints.push(new THREE.Vector3(x, borderY, z));
}
const borderCurve = new THREE.CatmullRomCurve3(borderPoints, false);
const borderGeo = new THREE.TubeGeometry(borderCurve, 240, 0.02, 3, false);
const borderMat = new THREE.MeshBasicMaterial({ color: 0xc72a28 });
const borderMesh = new THREE.Mesh(borderGeo, borderMat);
scene.add(borderMesh);

// ──────── Lighting (minimal, from top)
const hemiLight = new THREE.HemisphereLight(0xf0ebe0, 0x3a2d1e, 0.7);
scene.add(hemiLight);
const dirLight = new THREE.DirectionalLight(0xfff8e8, 0.4);
dirLight.position.set(2, 20, 3);
scene.add(dirLight);

// ──────── Volumetric clouds (raymarched ShaderMaterial planes)
// 4 overlapping translucent planes at different heights, each with
// raymarched worley+perlin noise. Drift via time offset.
const cloudVert = `
varying vec2 vUv;
varying vec3 vWorldPos;
void main(){
  vUv = uv;
  vec4 worldPos = modelMatrix * vec4(position, 1.0);
  vWorldPos = worldPos.xyz;
  gl_Position = projectionMatrix * viewMatrix * worldPos;
}
`;
const cloudFrag = `
uniform float uTime;
uniform float uLayer;
varying vec2 vUv;
varying vec3 vWorldPos;

// 3D worley noise
vec3 hash3(vec3 p){
  p = fract(p * vec3(443.897, 441.423, 437.195));
  p += dot(p, p.yxz + 19.19);
  return fract((p.xxy + p.yxx) * p.zyx);
}
float worley(vec3 p){
  vec3 id = floor(p);
  vec3 fd = fract(p);
  float minDist = 1.0;
  for(int x = -1; x <= 1; x++){
    for(int y = -1; y <= 1; y++){
      for(int z = -1; z <= 1; z++){
        vec3 coord = vec3(float(x), float(y), float(z));
        vec3 cellId = id + coord;
        vec3 rand = hash3(cellId);
        vec3 r = coord + rand - fd;
        float d = length(r);
        minDist = min(minDist, d);
      }
    }
  }
  return minDist;
}

// simple perlin-like noise
float noise3(vec3 p){
  vec3 i = floor(p);
  vec3 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = dot(hash3(i), vec3(1.0));
  float b = dot(hash3(i + vec3(1,0,0)), vec3(1.0));
  float c = dot(hash3(i + vec3(0,1,0)), vec3(1.0));
  float d = dot(hash3(i + vec3(1,1,0)), vec3(1.0));
  float e = dot(hash3(i + vec3(0,0,1)), vec3(1.0));
  float f2 = dot(hash3(i + vec3(1,0,1)), vec3(1.0));
  float g = dot(hash3(i + vec3(0,1,1)), vec3(1.0));
  float h = dot(hash3(i + vec3(1,1,1)), vec3(1.0));
  float x1 = mix(a, b, f.x);
  float x2 = mix(c, d, f.x);
  float x3 = mix(e, f2, f.x);
  float x4 = mix(g, h, f.x);
  float y1 = mix(x1, x2, f.y);
  float y2 = mix(x3, x4, f.y);
  return mix(y1, y2, f.z);
}

void main(){
  // drift: clouds move westward (negative x)
  float windOffset = uTime * 0.08 * (1.0 + uLayer * 0.2);
  vec3 samplePos = vec3(vWorldPos.x - windOffset, vWorldPos.y * 0.5, vWorldPos.z) * 0.3;
  
  float w = worley(samplePos * 1.4);
  float n = noise3(samplePos * 2.2 + vec3(0, uTime * 0.03, 0));
  float density = smoothstep(0.3, 0.7, 1.0 - w) * (0.5 + n * 0.5);
  
  // layered fbm
  density += noise3(samplePos * 4.0) * 0.15;
  density = clamp(density, 0.0, 1.0);
  
  // fluffy white clouds with soft edges
  vec3 cloudColor = vec3(0.96, 0.95, 0.94);
  float alpha = density * 0.65;
  
  // slight blue-gray tint in shadow areas
  if (density < 0.3){
    cloudColor = mix(cloudColor, vec3(0.82, 0.84, 0.86), 0.3);
  }
  
  gl_FragColor = vec4(cloudColor, alpha);
}
`;

const cloudLayers = [];
for (let i = 0; i < 4; i++){
  const y = 3.0 + i * 1.2;
  const cloudGeo = new THREE.PlaneGeometry(28, 22, 1, 1);
  cloudGeo.rotateX(-Math.PI / 2);
  cloudGeo.translate(0, y, 0);
  const cloudMat = new THREE.ShaderMaterial({
    vertexShader: cloudVert,
    fragmentShader: cloudFrag,
    uniforms: {
      uTime: { value: 0 },
      uLayer: { value: i * 0.25 },
    },
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
  });
  const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
  scene.add(cloudMesh);
  cloudLayers.push(cloudMat);
}

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const zoom = 9;
  camera.left = -zoom * aspect;
  camera.right = zoom * aspect;
  camera.top = zoom;
  camera.bottom = -zoom;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const zoom = 9;
  camera.left = -zoom * aspect;
  camera.right = zoom * aspect;
  camera.top = zoom;
  camera.bottom = -zoom;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
{
  const aspect = innerWidth / innerHeight;
  const zoom = 9;
  camera.left = -zoom * aspect;
  camera.right = zoom * aspect;
  camera.top = zoom;
  camera.bottom = -zoom;
  camera.updateProjectionMatrix();
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  for (const mat of cloudLayers){
    mat.uniforms.uTime.value = t;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
