<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nkl · explosive lucy · cai guo-qiang</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a0f; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  #cam { position:fixed; right:14px; bottom:14px; width:240px; height:160px;
         border:1px solid #2a2025; border-radius:4px; transform:scaleX(-1); opacity:0.85; }
  #cam.hidden { display:none; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a141d; color:#e5dcd2; border:1px solid #4a3a44;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:5; }
  button.start:hover { background:#26202a; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · stanford 3d scanning repo …</div>
<button class="start" id="startBtn" style="display:none">ignite · grant camera</button>
<video id="cam" class="hidden" autoplay playsinline muted></video>
<div class="id">nkl</div>
<div class="hint" id="hint"></div>
<div class="src">after cai guo-qiang · gunpowder drawings · ephemeral pyrotechnics</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a0f, 1);
document.body.appendChild(renderer.domElement);

const N = 60000;
const positions    = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const velocities   = new Float32Array(N * 3);
const seeds        = new Float32Array(N);
const ignitionTimes = new Float32Array(N);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uHand:  { value: new THREE.Vector3(0,0,0) },
  uActive:{ value: 0.0 },
  uReady: { value: 0.0 },
  uIgnite: { value: 0.0 }  // 0→1 on gesture trigger
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec3  uHand;
    uniform float uActive;
    uniform float uReady;
    uniform float uIgnite;
    attribute vec3  rest;
    attribute vec3  vel;
    attribute float seed;
    attribute float ignitionTime;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vEnergy;
    
    void main(){
      vec3 p = rest;
      float localTime = uTime - ignitionTime;
      
      // Cai's pyrotechnic signature: rapid flash, char, dissipate
      // Each particle ignites at staggered time (ignitionTime)
      float ignited = step(ignitionTime, uTime) * uIgnite;
      
      // Three phases: 
      // 0-0.4s: flash (bright expansion)
      // 0.4-1.2s: char (cooling ember)
      // 1.2s+: dissipate (fade to smoke)
      float phase = localTime;
      
      // explosion vector: radial + velocity field
      vec3 dir = normalize(rest + vel * 0.3);
      float explosionRadius = smoothstep(0.0, 0.4, phase) * (4.0 + seed * 6.0);
      explosionRadius *= (1.0 - smoothstep(1.2, 2.5, phase)); // collapse after peak
      
      p += dir * explosionRadius * ignited;
      
      // gravity pull down during dissipation
      float gravity = smoothstep(0.8, 2.0, phase) * phase * 0.8;
      p.y -= gravity * ignited;
      
      // hand interaction: pull toward hand when active, trigger ignition on pinch
      vec3 toHand = uHand - p;
      float handPull = uActive * 0.03;
      p += toHand * handPull;
      
      // energy states for color
      float flashEnergy = exp(-phase * 8.0); // sharp flash decay
      float charEnergy = exp(-max(0.0, phase - 0.4) * 2.0) * (1.0 - flashEnergy); // ember glow
      float smokePhase = smoothstep(1.2, 2.5, phase);
      
      vEnergy = flashEnergy + charEnergy * 0.5;
      
      // Cai's palette: gunpowder flash (white-yellow) → char (orange-red) → smoke (gray)
      vec3 flash = vec3(1.0, 0.98, 0.92);
      vec3 ember = vec3(0.95, 0.4, 0.15);
      vec3 char_black = vec3(0.18, 0.12, 0.08);
      vec3 smoke = vec3(0.35, 0.33, 0.30);
      
      vCol = mix(flash, ember, smoothstep(0.0, 0.4, phase));
      vCol = mix(vCol, char_black, smoothstep(0.4, 1.2, phase));
      vCol = mix(vCol, smoke, smokePhase);
      
      // Assembly: particles start as sculpture, await ignition
      float assembled = smoothstep(0.0, 1.0, uReady);
      vec3 entry = rest * 0.1; // start condensed
      p = mix(entry, p, assembled * (1.0 - ignited * 0.3));
      
      // alpha: bright flash → dim char → fade smoke
      vAlpha = 1.0 - smoothstep(0.0, 2.5, phase);
      vAlpha *= (0.3 + 0.7 * assembled);
      vAlpha *= (flashEnergy * 2.0 + charEnergy + smokePhase * 0.2);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.2 + seed * 0.8;
      float flashSize = 1.0 + flashEnergy * 4.0; // bright flash blooms large
      gl_PointSize = baseSize * flashSize * uPixel * (50.0/dist) * (0.4 + 0.6*assembled);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vEnergy;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      
      // sharp flash core, softer ember/smoke
      float core = exp(-r * 20.0) * vEnergy;
      float glow = exp(-r * 8.0) * (1.0 - vEnergy) * 0.6;
      float a = (core + glow) * vAlpha;
      
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');
const startBtn  = document.getElementById('startBtn');
const hintEl    = document.getElementById('hint');
const camEl     = document.getElementById('cam');

const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 15 / maxAxis;
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp = new THREE.Vector3();
    const norm = new THREE.Vector3();
    
    for (let i = 0; i < N; i++){
      sampler.sample(tmp, norm);
      restPositions[i*3]   = tmp.x;
      restPositions[i*3+1] = tmp.y;
      restPositions[i*3+2] = tmp.z;
      
      // velocity field: mix of surface normal + turbulence
      velocities[i*3]   = norm.x + (Math.random()-0.5) * 0.8;
      velocities[i*3+1] = norm.y + (Math.random()-0.5) * 0.8;
      velocities[i*3+2] = norm.z + (Math.random()-0.5) * 0.8;
      
      seeds[i] = Math.random();
      // stagger ignition across 0.8s for wave propagation effect
      ignitionTimes[i] = Math.random() * 0.8;
    }
    
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('vel',      new THREE.BufferAttribute(velocities, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('ignitionTime', new THREE.BufferAttribute(ignitionTimes, 1));

    loadingEl.style.display = 'none';
    startBtn.style.display = 'inline-block';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading lucy · ${pct}% · stanford 3d scanning repo`;
    }
  },
  (err) => {
    loadingEl.textContent = 'load failed — check network';
    console.error(err);
  });

let revealStart = 0;
let ignitionStart = -1;
let lastPinch = 2.0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let handsActive = false;
async function loadMP(){
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js');
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js');
}

async function startHands(){
  startBtn.style.display = 'none';
  hintEl.textContent = 'requesting camera…';
  try { await loadMP(); }
  catch { hintEl.textContent = 'mediapipe load failed — auto-ignite mode'; autoIgnite(); return; }
  
  const hands = new window.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  hands.onResults((res) => {
    if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0){
      uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 0.0, 0.05);
      lastPinch = 2.0;
      return;
    }
    uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 1.0, 0.1);
    const lm = res.multiHandLandmarks[0];
    const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y, dz = lm[4].z - lm[8].z;
    const pinch = Math.min(2.5, Math.sqrt(dx*dx+dy*dy+dz*dz) * 6.0);
    
    // trigger ignition on pinch gesture (pinch < 0.4)
    if (pinch < 0.4 && lastPinch >= 0.4 && ignitionStart < 0 && uniforms.uReady.value > 0.9) {
      ignitionStart = performance.now();
      hintEl.textContent = 'ignited!';
    }
    
    lastPinch = pinch;
    const palm = lm[9];
    const wx = (0.5 - palm.x) * 24;
    const wy = (0.5 - palm.y) * 16;
    uniforms.uHand.value.set(wx, wy, 0.0);
    
    if (ignitionStart < 0) {
      hintEl.textContent = 'pinch to ignite';
    }
  });
  
  camEl.classList.remove('hidden');
  const cam = new window.Camera(camEl, {
    onFrame: async () => { await hands.send({ image: camEl }); },
    width: 320, height: 240
  });
  cam.start();
  handsActive = true;
}

function autoIgnite(){
  // passive mode: auto-ignite after 3s assembly
  setTimeout(() => {
    if (ignitionStart < 0 && uniforms.uReady.value > 0.9) {
      ignitionStart = performance.now();
      hintEl.textContent = 'auto-ignited';
    }
  }, 3000);
}

startBtn.addEventListener('click', startHands);

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2500);
  }
  
  if (ignitionStart > 0) {
    const igniteProgress = Math.min(1.0, (now - ignitionStart) / 800);
    uniforms.uIgnite.value = igniteProgress;
  }
  
  // camera tracks centroid with subtle drift
  const drift = Math.sin(t * 0.3) * 2.0;
  camera.position.x = drift;
  camera.lookAt(0, 0, 0);
  
  // slow rotation pre-ignition, faster post
  const rotSpeed = ignitionStart < 0 ? 0.03 : 0.08;
  points.rotation.y = t * rotSpeed;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
