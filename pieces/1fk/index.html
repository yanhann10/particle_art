<html lang="en">
<head>

<title>1fk · Number 30 (Pollock)</title>
<!-- MOTION: accumulate, intensity: gentle -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#1a1612;overflow:hidden;
    color:#cdd2dc;font-family:ui-monospace,"SF Mono",Menlo,monospace}
  canvas{display:block}
  .id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;letter-spacing:0.06em;z-index:10}
</style>
</head>
<body>
<div class="id">1fk</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';

/* ─── Intent: accumulating Pollock drip field — three archaeological
       gesture layers (umber wash, lamp-black enamel, ochre accent)
       build an all-over composition in real-time. ─── */

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x1a1612,1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
let asp = innerWidth/innerHeight;
const cam = new THREE.OrthographicCamera(-asp,asp,1,-1,0.1,10);
cam.position.z=5;

/* ─── Autumn Rhythm palette: earth + lamp black ─── */
const PAL=[
  [0.11,0.09,0.08],[0.11,0.09,0.08], // lamp black (2× weight)
  [0.34,0.23,0.13],                    // raw umber
  [0.68,0.53,0.24],                    // yellow ochre
  [0.50,0.19,0.15],                    // oxide red
  [0.75,0.69,0.58],                    // titanium buff
  [0.56,0.40,0.26],                    // burnt sienna
];

/* ─── three process layers: wash → enamel → accent ─── */
const LAYERS=[
  {w:5.5, n:3, pal:[2,6,2], len:[180,280], delay:0},
  {w:2.5, n:3, pal:[0,1,0], len:[120,220], delay:180},
  {w:1.1, n:2, pal:[3,4,5], len:[60,150],  delay:380},
];

/* ─── Drip agent: pendulum arm-swing across canvas ─── */
class Drip{
  constructor(L,i){
    this.L=L;
    this.w=L.w*(0.8+Math.random()*0.4);
    const c=PAL[L.pal[i%L.pal.length]];
    this.rgb=[c[0],c[1],c[2]];
    this.sMax=L.len[0]+Math.random()*(L.len[1]-L.len[0]);
    this.wait=L.delay+Math.floor(i*35+Math.random()*25);
    this.reset();
  }
  reset(){
    this.x=(Math.random()-0.5)*asp*1.7;
    this.y=(Math.random()-0.5)*1.6;
    this.wx=0.7+Math.random()*1.0;
    this.wy=0.4+Math.random()*0.7;
    this.px=Math.random()*6.28;
    this.py=Math.random()*6.28;
    this.ax=0.18+Math.random()*0.35;
    this.ay=0.08+Math.random()*0.18;
    this.dx=(Math.random()-0.5)*0.0028;
    this.dy=(Math.random()-0.5)*0.0008;
    this.t=Math.random()*80;
    this.pts=[];this.cols=[];this.s=0;
    this.sMax=this.L.len[0]+Math.random()*(this.L.len[1]-this.L.len[0]);
  }
  tick(){
    if(this.wait>0){this.wait--;return null;}
    this.t+=0.04; this.s++;
    const px=this.x,py=this.y;
    this.x+=Math.sin(this.wx*this.t+this.px)*this.ax*0.02+this.dx;
    this.y+=Math.sin(this.wy*this.t+this.py)*this.ay*0.02+this.dy-0.00025;
    if(Math.random()<0.015)this.px+=(Math.random()-0.5)*0.6;
    if(Math.random()<0.01) this.py+=(Math.random()-0.5)*0.4;
    this.x+=(Math.random()-0.5)*0.0015;
    this.y+=(Math.random()-0.5)*0.001;
    const spd=Math.hypot(this.x-px,this.y-py);
    this.pts.push(this.x,this.y,0);
    const fade=1.0-(this.s/this.sMax)*0.25;
    this.cols.push(this.rgb[0]*fade,this.rgb[1]*fade,this.rgb[2]*fade);
    const done=this.s>=this.sMax||Math.abs(this.x)>asp+0.15||Math.abs(this.y)>1.15;
    if(done){
      const out={pts:this.pts,cols:this.cols,w:this.w};
      this.reset();
      this.wait=8+Math.floor(Math.random()*35);
      return out;
    }
    if(spd>0.007&&Math.random()<0.35)scatter(this.x,this.y,spd,this.rgb);
    return null;
  }
}

/* ─── stroke pool: Line2 fat-line skeins, oldest retired ─── */
const MAX_STK=80;
const stks=[];
function commitStroke(d){
  if(d.pts.length<12)return;
  const g=new LineGeometry();
  g.setPositions(d.pts);
  g.setColors(d.cols);
  const m=new LineMaterial({
    linewidth:d.w, vertexColors:true, transparent:true, opacity:0.88,
    resolution:new THREE.Vector2(innerWidth,innerHeight), worldUnits:false,
  });
  const l=new Line2(g,m);
  scene.add(l); stks.push(l);
  while(stks.length>MAX_STK){
    const old=stks.shift();
    scene.remove(old);old.geometry.dispose();old.material.dispose();
  }
}

/* ─── splatter: viscous drip-impact dots (ring buffer, 1600) ─── */
const MAXD=1600;
const dP=new Float32Array(MAXD*3);
const dC=new Float32Array(MAXD*3);
const dS=new Float32Array(MAXD);
let dI=0;
const dGeo=new THREE.BufferGeometry();
dGeo.setAttribute('position',new THREE.BufferAttribute(dP,3));
dGeo.setAttribute('color',new THREE.BufferAttribute(dC,3));
dGeo.setAttribute('size',new THREE.BufferAttribute(dS,1));
dGeo.setDrawRange(0,0);
const dpr=Math.min(devicePixelRatio,2).toFixed(1);
const dMat=new THREE.ShaderMaterial({
  vertexShader:`attribute float size;attribute vec3 color;varying vec3 vC;
    void main(){vC=color;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
    gl_PointSize=size*${dpr};}`,
  fragmentShader:`varying vec3 vC;void main(){
    float d=length(gl_PointCoord-0.5)*2.0;if(d>1.0)discard;
    gl_FragColor=vec4(vC,smoothstep(1.0,0.2,d)*0.82);}`,
  transparent:true,depthWrite:false,
});
scene.add(new THREE.Points(dGeo,dMat));

function scatter(x,y,spd,rgb){
  const n=2+Math.floor(Math.random()*4);
  for(let i=0;i<n;i++){
    const k=dI%MAXD;
    const a=Math.random()*6.28,r=spd*(8+Math.random()*25);
    dP[k*3]=x+Math.cos(a)*r;dP[k*3+1]=y+Math.sin(a)*r;dP[k*3+2]=0;
    const v=0.7+Math.random()*0.3;
    dC[k*3]=rgb[0]*v;dC[k*3+1]=rgb[1]*v;dC[k*3+2]=rgb[2]*v;
    dS[k]=1.0+Math.random()*2.2;
    dI++;
  }
  dGeo.attributes.position.needsUpdate=true;
  dGeo.attributes.color.needsUpdate=true;
  dGeo.attributes.size.needsUpdate=true;
  dGeo.setDrawRange(0,Math.min(dI,MAXD));
}

/* ─── init drippers ─── */
const drips=[];
LAYERS.forEach(L=>{for(let i=0;i<L.n;i++)drips.push(new Drip(L,i));});

/* ─── pre-seed: lay down initial wash so canvas has weight ─── */
for(let p=0;p<5;p++){
  const d=new Drip(LAYERS[0],p%LAYERS[0].n);
  d.wait=0;
  while(true){const out=d.tick();if(out){commitStroke(out);break;}}
}

/* ─── animate: no fade — strokes persist permanently ─── */
function loop(){
  requestAnimationFrame(loop);
  drips.forEach(d=>{const out=d.tick();if(out)commitStroke(out);});
  renderer.render(scene,cam);
}
loop();

/* ─── resize ─── */
addEventListener('resize',()=>{
  const w=innerWidth,h=innerHeight;
  asp=w/h;cam.left=-asp;cam.right=asp;
  cam.updateProjectionMatrix();renderer.setSize(w,h);
  stks.forEach(s=>s.material.resolution.set(w,h));
});
dispatchEvent(new Event('resize'));
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
  <button id="pc-like" title="keep" style="background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
  <button id="pc-dismiss" title="drop" style="background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
  <input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,.6)'" onblur="this.style.borderColor='rgba(255,255,255,.13)'">
  <button id="pc-submit" title="iterate" style="background:rgba(0,0,0,.55);border:1px solid rgba(201,168,106,.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var pid='1fk';
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(k,id){try{var s=new Set(JSON.parse(localStorage.getItem(k)||'[]'));s.add(id);localStorage.setItem(k,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(a){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:a})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){var dis=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var ps=(d.pieces||[]).filter(function(p){return!dis.has(p.id);});var i=ps.findIndex(function(p){return p.id===pid;});var nx=i>=0&&i+1<ps.length?ps[i+1]:null;if(nx)location.href='/pieces/'+nx.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();}).then(function(d){var qs='?a='+pid+(d.job_id?'&job='+d.job_id:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  var pid='1fk';
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){
      document.getElementById('gp-'+k).value=G[k];
      document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var a=load();a.push({id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con});store(a);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:a[a.length-1]})}).catch(function(){});
  };
  renderSaved();
})();
</script>
