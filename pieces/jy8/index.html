<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jy8 · Shiota — Diaphanous Veil</title>
<!-- MOTION: gather, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#020204; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">jy8</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020204);
scene.fog = new THREE.FogExp2(0x06050a, 0.0028);

const camera = new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0810, 0.04));

const pL = new THREE.PointLight(0xf0e0f8, 0.09, 50, 1.8);
pL.position.set(3, 16, -2);
scene.add(pL);

const pL2 = new THREE.PointLight(0xe8d8f0, 0.04, 35, 2.0);
pL2.position.set(-4, 2, 5);
scene.add(pL2);

let seed = 48210537;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 42, h: 34, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — now a luminous ghost, barely there
const sphereCenter = new THREE.Vector3(0.6, 4.2, -1.0);
const SPHERE_R = 1.8;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 28, 18),
  new THREE.MeshStandardMaterial({
    color: 0xf8f0fc,
    emissive: 0xf0e8f8,
    emissiveIntensity: 0.7,
    roughness: 0.96,
    metalness: 0.0,
    transparent: true,
    opacity: 0.18
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.7, 14, 10),
  new THREE.MeshBasicMaterial({ color: 0xfcf4ff, transparent: true, opacity: 0.06 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// Outer halo — diaphanous bloom
const outerHalo = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 1.6, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xe8d8f0, transparent: true, opacity: 0.015, side: THREE.BackSide })
);
outerHalo.position.copy(sphereCenter);
scene.add(outerHalo);

// Suspension threads — thinner, paler
const suspPts = [];
for(let i = 0; i < 7; i++){
  const ox = (rng()-0.5)*0.4;
  const oz = (rng()-0.5)*0.35;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.03, sphereCenter.y + SPHERE_R + 0.04, sphereCenter.z + oz*0.03
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x201828, transparent: true, opacity: 0.3
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi)*Math.cos(theta) * SPHERE_R,
    sphereCenter.y + Math.sin(phi)*Math.sin(theta) * SPHERE_R,
    sphereCenter.z + Math.cos(phi) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — same concentric structure, the skeleton beneath the veil
const anchors = [];

const ringHeights = [-14, -10, -6, -3, 0, 3, 6, 9, 12];
for(const ry of ringHeights){
  const distFromSphere = Math.abs(ry - sphereCenter.y);
  const ringR = 2.5 + distFromSphere * 0.65;
  const nPts = 8 + Math.floor(distFromSphere * 1.2);
  for(let i = 0; i < nPts; i++){
    const a = (i / nPts) * Math.PI * 2 + (rng()-0.5)*0.15;
    const r = ringR * (0.85 + rng()*0.3);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.cos(a) * r + (rng()-0.5)*0.6,
      ry + (rng()-0.5)*0.8,
      sphereCenter.z + Math.sin(a) * r + (rng()-0.5)*0.6
    ));
  }
}

while(anchors.length < 550){
  const p = rng() < 0.4 ? wallPt() : wallPt().lerp(sphereCenter, 0.06 + rng()*0.3);
  anchors.push(p);
}

const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 5, sphereCenter.y - 3, sphereCenter.z + 6), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y + 5, sphereCenter.z - 5), r: 2.2 },
  { pos: new THREE.Vector3(sphereCenter.x + 3, sphereCenter.y - 8, sphereCenter.z - 4), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — same rules, diaphanous palette
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — threads now feel like silk strands falling through air
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  const target = sphereSurf();

  // 15% stop short — more threads dissolving before arrival (diaphanous = dissolving edges)
  if(rng() < 0.15){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.4 + rng() * 2.2;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — gossamer connections between nearby anchors
const THRESH = 6.0;
const catBtarget = Math.floor(NUM_LINES * 0.28);
let catBcount = 0;
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Rule 1b: DRAPE — threads falling like sheer curtain folds
const catD = Math.floor(NUM_LINES * 0.09);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  if(sp.y > sphereCenter.y + SPHERE_R * 0.3) sp.y = sphereCenter.y - rng() * SPHERE_R;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*6.0,
    -hh,
    sp.z + (rng()-0.5)*6.0
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 2);
}

// Fill remainder: long architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.3 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Diaphanous palette — pale lavender-rose, shifting with distance from sphere
// Near sphere: warmer (blush), far: cooler (lavender-silver)
const catOpacity = [0.065, 0.04, 0.05, 0.025];
const colors = new Float32Array(li * 6);
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat];
  const bright = op / 0.065;
  const dist = lineDist[i];
  const nearness = Math.max(0, 1.0 - dist / 30.0);

  // Blend from cool lavender-silver (far) to warm blush-rose (near)
  const rC = (0.72 + nearness * 0.16) * bright;
  const gC = (0.58 + nearness * 0.06) * bright;
  const bC = (0.78 - nearness * 0.08) * bright;

  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = rC;
    colors[i*6+v*3+1] = gC;
    colors[i*6+v*3+2] = bC;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── VEIL LAYERS — translucent curved planes suggesting draped fabric near the sphere
const veilMat = new THREE.MeshBasicMaterial({
  color: 0xd8c8e0,
  transparent: true,
  opacity: 0.008,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

for(let i = 0; i < 5; i++){
  const angle = (i / 5) * Math.PI * 2 + rng() * 0.4;
  const dist = 3.5 + rng() * 3.0;
  const veilGeo = new THREE.PlaneGeometry(6 + rng()*4, 14 + rng()*8, 1, 12);
  const posArr = veilGeo.attributes.position.array;
  // Add gentle curvature — like fabric billowing
  for(let j = 0; j < posArr.length; j += 3){
    const ly = posArr[j+1];
    const curve = Math.sin(ly * 0.15 + i) * 1.2;
    posArr[j+2] += curve;
    posArr[j] += Math.sin(ly * 0.08 + i * 1.3) * 0.5;
  }
  const veil = new THREE.Mesh(veilGeo, veilMat.clone());
  veil.position.set(
    sphereCenter.x + Math.cos(angle) * dist,
    sphereCenter.y - 2 + rng() * 4,
    sphereCenter.z + Math.sin(angle) * dist
  );
  veil.rotation.y = angle + Math.PI * 0.5;
  veil.userData = { baseAngle: angle, dist: dist, idx: i };
  scene.add(veil);
}

// ── MOTES — tiny luminous specks drifting like dust in light, replacing dark fragments
const NUM_MOTES = 40;
const motes = [];
for(let i = 0; i < NUM_MOTES; i++){
  const sz = 0.015 + rng()*0.04;
  const mGeo = new THREE.SphereGeometry(sz, 4, 3);
  const lum = 0.5 + rng()*0.5;
  const mMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(lum*0.9, lum*0.8, lum),
    transparent: true,
    opacity: 0.08 + rng()*0.15
  });
  const mote = new THREE.Mesh(mGeo, mMat);

  if(rng() < 0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    mote.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    mote.position.copy(sphereCenter).add(dir.multiplyScalar(2.5 + rng()*8.0));
  }
  mote.userData = {
    baseY: mote.position.y,
    drift: (rng()-0.5)*0.0003,
    phase: rng()*Math.PI*2,
    floatAmp: 0.002 + rng()*0.005
  };
  motes.push(mote);
  scene.add(mote);
}

// ── CAMERA PATH — same narrative arc, slightly more ethereal sway
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  const phase1 = t < 0.35;
  const phase2 = t >= 0.35 && t < 0.7;
  const phase3 = t >= 0.7;

  let rH, y;
  if(phase1){
    const lt = t / 0.35;
    rH = 8.0 - lt * 2.0;
    y = cy - 10 + lt * 8;
  } else if(phase2){
    const lt = (t - 0.35) / 0.35;
    rH = 6.0 - lt * 1.5;
    y = cy - 2 + lt * 5 + Math.sin(lt * Math.PI) * 1.5;
  } else {
    const lt = (t - 0.7) / 0.3;
    rH = 4.5 + Math.sin(lt * Math.PI * 2) * 0.8;
    y = cy + 3 + Math.sin(lt * Math.PI * 3) * 2.5;
  }

  const x = cx + Math.sin(p * 1.15) * rH + Math.cos(p * 0.4 + 1.7) * 0.7;
  const z = cz + Math.cos(p * 1.15) * (rH * 1.15) + Math.sin(p * 0.55 + 0.8) * 0.6;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread breathing — gentler, like fabric in a draft
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.00035 * Math.max(0, 1.0 - dist / 28.0);
    const phase = basePositions[idx]*0.11 + basePositions[idx+1]*0.14 + i*0.0004;
    const breath = Math.sin(t*0.01 + phase) * amp;
    const sway = Math.sin(t*0.006 + phase*1.3) * amp * 0.5;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.3 + sway*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.15;
      arr[vi+2] = basePositions[vi+2] + breath*0.25 + sway*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Motes drift slowly
  for(const m of motes){
    const ud = m.userData;
    m.position.y = ud.baseY + Math.sin(t * 0.008 + ud.phase) * ud.floatAmp * 60;
    m.position.x += ud.drift;
  }

  // Sphere pulse — very subtle luminance breathing
  sphere.material.opacity = 0.18 + Math.sin(t * 0.005) * 0.03;
  outerHalo.material.opacity = 0.015 + Math.sin(t * 0.004 + 1.0) * 0.005;

  // Camera dolly
  const speed = 0.00042;
  const pathT = (t * speed) % 1.0;
  const cIdx = pathT * (pathLen - 1);
  const i0 = Math.floor(cIdx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = cIdx - Math.floor(cIdx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0012)*0.06;
  look.y += Math.cos(t*0.0009)*0.04;
  look.z += Math.sin(t*0.0015)*0.05;
  camera.lookAt(look);

  // Subtle light wander
  pL.position.x = 3 + Math.sin(t*0.0006)*0.2;
  pL.position.y = 16 + Math.cos(t*0.0004)*0.1;
  pL2.position.x = -4 + Math.sin(t*0.0005+2.0)*0.15;
  pL2.position.z = 5 + Math.cos(t*0.0007)*0.1;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
