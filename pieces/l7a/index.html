<!doctype html>
<html lang="en">
<head>

<title>l7a · ochre · Cai Guo-Qiang → earth pigment</title>
<style>

               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>

<body>
<div class="id">l7a</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// CHAIN from 0bb (Cai Guo-Qiang explosive tower) + OCHRE:
// The explosive tower has cooled and aged — fire becomes earth pigment.
// The ember palette shifts to ochre, raw sienna, burnt umber — the colors
// of iron-oxide cave paintings (Lascaux, Aboriginal ochre). Bursts become
// slower dust eruptions — earth thrown upward rather than gunpowder flash,
// settling with gravity like pigment powder. The tower itself reads as a
// geological formation now: sedimentary, layered, ancient. Same differential
// growth spine, same single-burst-at-a-time discipline, but the whole
// register has shifted from pyrotechnic to mineral/archaeological.
// Technique reference: Cai Guo-Qiang's gunpowder drawings on paper —
// but here the powder is ochre pigment, not black powder.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0c0a07, 0.028);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 7, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0a07, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// ─────────────────────────── tower growth (from 5gm → 0bb, preserved)
const MAX_VERTS = 3200;
const ATTRACT = 0.06, REPEL_R = 0.42, REPEL_STR = 0.12, NOISE = 0.003;
const PRESSURE = 0.0028, RISE = 0.0045, MAX_D = 0.32;
let paused = false;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2, r = 1.3 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i=0; i<verts.length; i++){
    const v=verts[i], k=key(v.x,v.y,v.z);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++)
    for(let dy=-1;dy<=1;dy++)
      for(let dz=-1;dz<=1;dz++){
        const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if(arr) for(const idx of arr) out.push(idx);
      }
  return out;
}

function stepTower(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i], cands=neighbors(v);
    for(const j of cands){
      if(j===i) continue;
      const u=verts[j], ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2), f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){ cx2+=verts[i].x; cy2+=verts[i].y; cz2+=verts[i].z; }
  cx2/=n; cy2/=n; cz2/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;
    dy[i]+=(oy/d)*PRESSURE*0.4;
    dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0012;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5, age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}

for(let s=0;s<800;s++) stepTower();

addEventListener('click',()=>{ paused=!paused; });

// ─────────────────────────── tower particles — ochre earth palette
const N_TOWER=32000;
const tPos=new Float32Array(N_TOWER*3);
const tSeed=new Float32Array(N_TOWER);
const tHeight=new Float32Array(N_TOWER);
for(let i=0;i<N_TOWER;i++) tSeed[i]=Math.random();

const geomT=new THREE.BufferGeometry();
geomT.setAttribute('position', new THREE.BufferAttribute(tPos,3));
geomT.setAttribute('seed', new THREE.BufferAttribute(tSeed,1));
geomT.setAttribute('hgt', new THREE.BufferAttribute(tHeight,1));

const unifT={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uYMax:{value:1}};
const matT=new THREE.ShaderMaterial({
  uniforms:unifT, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime; uniform float uPixel; uniform float uYMax;
    attribute float seed; attribute float hgt;
    varying vec3 vCol;
    void main(){
      vec3 p=position;
      float t=uTime*0.35+seed*6.28;
      p.x+=0.004*sin(t); p.z+=0.004*cos(t);
      float h=clamp(hgt/max(uYMax,0.5),0.,1.);
      // ochre gradient: yellow ochre base → raw sienna mid → burnt umber top
      vec3 yellowOchre=vec3(0.85,0.65,0.22);
      vec3 rawSienna=vec3(0.72,0.42,0.16);
      vec3 burntUmber=vec3(0.32,0.18,0.08);
      vec3 col=mix(yellowOchre,rawSienna,smoothstep(0.,0.5,h));
      col=mix(col,burntUmber,smoothstep(0.5,1.,h));
      // slight seed variation for mineral texture
      col*=0.85+0.15*seed;
      vCol=col;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=1.2*uPixel*(40./-mv.z);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*18.)*0.55;
      // manual fog
      float fogDist=gl_FragCoord.z/gl_FragCoord.w;
      float fogFactor=exp(-0.028*0.028*fogDist*fogDist);
      vec3 fogCol=vec3(0.047,0.039,0.027);
      vec3 col=mix(fogCol,vCol,clamp(fogFactor,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsT=new THREE.Points(geomT,matT);
scene.add(pointsT);

// ─────────────────────────── settling dust particles (ochre sediment at base)
const N_DUST=10000;
const dPos=new Float32Array(N_DUST*3);
const dSeed=new Float32Array(N_DUST);
const dLife=new Float32Array(N_DUST);
for(let i=0;i<N_DUST;i++){
  dSeed[i]=Math.random();
  dLife[i]=Math.random(); // start at random life phases
  const th=Math.random()*Math.PI*2;
  const r=0.5+Math.random()*3.0;
  dPos[i*3]=Math.cos(th)*r;
  dPos[i*3+1]=Math.random()*0.6;
  dPos[i*3+2]=Math.sin(th)*r;
}

const geomD=new THREE.BufferGeometry();
geomD.setAttribute('position', new THREE.BufferAttribute(dPos,3));
geomD.setAttribute('seed', new THREE.BufferAttribute(dSeed,1));
geomD.setAttribute('life', new THREE.BufferAttribute(dLife,1));

const unifD={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}};
const matD=new THREE.ShaderMaterial({
  uniforms:unifD, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime; uniform float uPixel;
    attribute float seed; attribute float life;
    varying float vAlpha;
    varying vec3 vCol;
    void main(){
      vec3 p=position;
      float t=uTime*0.15+seed*6.28;
      p.x+=0.02*sin(t*1.3+seed*4.);
      p.z+=0.02*cos(t*0.9+seed*3.);
      p.y+=0.01*sin(t*0.7);
      // dusty ochre
      vec3 col=mix(vec3(0.75,0.55,0.2),vec3(0.5,0.35,0.12),seed);
      vCol=col;
      vAlpha=life*0.3;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=0.8*uPixel*(30./-mv.z);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying float vAlpha; varying vec3 vCol;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*14.)*vAlpha;
      vec3 fogCol=vec3(0.047,0.039,0.027);
      float fogDist=gl_FragCoord.z/gl_FragCoord.w;
      float fogFactor=exp(-0.028*0.028*fogDist*fogDist);
      vec3 col=mix(fogCol,vCol,clamp(fogFactor,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsD=new THREE.Points(geomD,matD);
scene.add(pointsD);

// ─────────────────────────── burst system — dust eruptions (slower, heavier than fire)
const MAX_BURST=8000;
const bPos=new Float32Array(MAX_BURST*3);
const bVel=new Float32Array(MAX_BURST*3);
const bLife=new Float32Array(MAX_BURST);
const bSeed=new Float32Array(MAX_BURST);
for(let i=0;i<MAX_BURST;i++) bSeed[i]=Math.random();

const geomB=new THREE.BufferGeometry();
geomB.setAttribute('position', new THREE.BufferAttribute(bPos,3));
geomB.setAttribute('life', new THREE.BufferAttribute(bLife,1));
geomB.setAttribute('seed', new THREE.BufferAttribute(bSeed,1));

const unifB={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}};
const matB=new THREE.ShaderMaterial({
  uniforms:unifB, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime; uniform float uPixel;
    attribute float life; attribute float seed;
    varying vec3 vCol; varying float vAlpha;
    void main(){
      vec3 p=position;
      float phase=1.-life;
      // ochre dust palette: bright ochre flash → dusty sienna → settled earth
      vec3 flash=vec3(0.95,0.78,0.35);
      vec3 dust=vec3(0.78,0.50,0.18);
      vec3 earth=vec3(0.22,0.14,0.06);
      vec3 col=mix(flash,dust,smoothstep(0.,0.35,phase));
      col=mix(col,earth,smoothstep(0.35,1.,phase));
      vCol=col;
      vAlpha=life*life*0.9;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      float sz=1.8*uPixel*(45./-mv.z);
      gl_PointSize=sz*(0.5+0.5*life);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol; varying float vAlpha;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float core=exp(-r*14.);
      float a=core*vAlpha*0.75;
      vec3 fogCol=vec3(0.047,0.039,0.027);
      float fogDist=gl_FragCoord.z/gl_FragCoord.w;
      float fogFactor=exp(-0.028*0.028*fogDist*fogDist);
      vec3 col=mix(fogCol,vCol,clamp(fogFactor,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsB=new THREE.Points(geomB,matB);
scene.add(pointsB);

let burstActive=false;
let burstTimer=0;
let nextBurstIn=3.0;

function triggerBurst(yCenter){
  burstActive=true; burstTimer=0;
  for(let i=0;i<MAX_BURST;i++){
    const y=yCenter+(Math.random()-0.5)*0.9;
    const th=Math.random()*Math.PI*2, phi=Math.acos(1-2*Math.random());
    // slower, heavier eruption than fire
    const speed=0.2+Math.random()*0.18;
    const vx=Math.sin(phi)*Math.cos(th)*speed;
    const vy=Math.abs(Math.cos(phi))*speed*0.9+0.08; // upward bias, dust thrown up
    const vz=Math.sin(phi)*Math.sin(th)*speed;
    const r=1.1+Math.random()*0.4;
    bPos[i*3]=Math.cos(th)*r; bPos[i*3+1]=y; bPos[i*3+2]=Math.sin(th)*r;
    bVel[i*3]=vx; bVel[i*3+1]=vy; bVel[i*3+2]=vz;
    bLife[i]=1.0;
  }
  geomB.attributes.position.needsUpdate=true;
  geomB.attributes.life.needsUpdate=true;
}

function stepBurst(dt){
  if(!burstActive) return;
  burstTimer+=dt;
  const BURST_DURATION=1.2; // longer than fire — dust lingers
  if(burstTimer>BURST_DURATION){
    burstActive=false; burstTimer=0;
    for(let i=0;i<MAX_BURST;i++) bLife[i]=0;
    geomB.attributes.life.needsUpdate=true;
    return;
  }
  const decay=dt*1.4; // slower fade than fire
  for(let i=0;i<MAX_BURST;i++){
    bPos[i*3]+=bVel[i*3]*dt;
    bPos[i*3+1]+=bVel[i*3+1]*dt;
    bPos[i*3+2]+=bVel[i*3+2]*dt;
    // heavier gravity — earth falls
    bVel[i*3+1]-=dt*0.55;
    // air drag on dust
    bVel[i*3]*=1-dt*0.8;
    bVel[i*3+2]*=1-dt*0.8;
    bLife[i]=Math.max(0,bLife[i]-decay);
  }
  geomB.attributes.position.needsUpdate=true;
  geomB.attributes.life.needsUpdate=true;
}

// ─────────────────────────── dust drift (settled burst particles feed base layer)
function feedDust(yCenter){
  // After a burst, refresh some base dust particles near the burst origin
  for(let i=0;i<N_DUST;i++){
    if(dLife[i]<0.2){
      const th=Math.random()*Math.PI*2;
      const r=0.8+Math.random()*2.5;
      dPos[i*3]=Math.cos(th)*r;
      dPos[i*3+1]=Math.random()*Math.min(yCenter,1.5);
      dPos[i*3+2]=Math.sin(th)*r;
      dLife[i]=0.5+Math.random()*0.5;
    }
  }
  geomD.attributes.position.needsUpdate=true;
  geomD.attributes.life.needsUpdate=true;
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const start=performance.now();
let lastT=start;
let lastBurstY=2;

function loop(){
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  const elapsed=(now-start)/1000;
  unifT.uTime.value=elapsed;
  unifB.uTime.value=elapsed;
  unifD.uTime.value=elapsed;

  for(let s=0;s<3;s++) stepTower();

  // distribute tower particles
  const n=verts.length;
  let yMax=0, yMean=0;
  if(n>1){
    const lengths=[]; let total=0;
    for(let i=0;i<n;i++){
      const a=verts[i], b=verts[(i+1)%n];
      const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
      const L=Math.sqrt(ex*ex+ey*ey+ez*ez);
      lengths.push(L); total+=L;
      if(a.y>yMax) yMax=a.y;
      yMean+=a.y;
    }
    yMean/=n;
    if(total>0){
      let written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_TOWER-written:Math.max(1,Math.floor(N_TOWER*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_TOWER;k++){
          const u=Math.random();
          tPos[written*3]=a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.02;
          tPos[written*3+1]=a.y+(b.y-a.y)*u+(Math.random()-0.5)*0.02;
          tPos[written*3+2]=a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.02;
          tHeight[written]=a.y+(b.y-a.y)*u;
          written++;
        }
      }
      geomT.attributes.position.needsUpdate=true;
      geomT.attributes.hgt.needsUpdate=true;
    }
  }
  unifT.uYMax.value=Math.max(yMax,1);

  // camera tracks centroid
  const targetY=Math.max(yMean,3);
  controls.target.y+=(targetY-controls.target.y)*0.03;
  const desiredCamY=targetY+4.5;
  camera.position.y+=(desiredCamY-camera.position.y)*0.03;

  // dust eruptions: one at a time, 3-5s spacing
  if(!burstActive && !paused){
    nextBurstIn-=dt;
    if(nextBurstIn<=0 && yMax>1){
      lastBurstY=Math.random()*(yMax-0.5)+0.5;
      triggerBurst(lastBurstY);
      nextBurstIn=3.0+Math.random()*2.0;
    }
  }
  stepBurst(dt);

  // when burst ends, feed settled dust
  if(!burstActive && burstTimer===0){
    feedDust(lastBurstY);
  }

  // slowly cycle base dust life
  for(let i=0;i<N_DUST;i++){
    dLife[i]-=dt*0.04;
    if(dLife[i]<0) dLife[i]=0;
  }
  geomD.attributes.life.needsUpdate=true;

  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
