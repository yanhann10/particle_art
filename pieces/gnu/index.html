<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: flow, intensity: gentle -->
<!-- technique: rare attractor (Thomas b=0.208186) + arabesque harmonic scrollwork -->
<!-- parent: 6nl · thomas basin -->
<!-- intent: The Thomas attractor's orbit dressed in leaf-particles that flow in arabesque scrollwork — an ornamental garden grown from a strange attractor. The viewer should see vine-like tendrils of golden leaves tracing the attractor's hidden geometry. -->
<title>&lt;NEW_ID&gt; · arabesque basin</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0a07; overflow:hidden;
               color:#c8bfae; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">&lt;NEW_ID&gt;</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ─────────────────────────────────────────────── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);
camera.position.set(14, 9, 18);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0a07, 1);
document.body.appendChild(renderer.domElement);

/* ── Thomas attractor ──────────────────────────────────── */
const B = 0.208186;
const DT = 0.04;
const TEX_W = 256, TEX_H = 64;
const TRAIL_LEN = TEX_W * TEX_H;
const raw = [];
let tx = 1.1, ty = 1.1, tz = -0.01;

for (let i = 0; i < 8000; i++) {
  const dx = Math.sin(ty) - B * tx;
  const dy = Math.sin(tz) - B * ty;
  const dz = Math.sin(tx) - B * tz;
  tx += dx * DT; ty += dy * DT; tz += dz * DT;
}

let mnX=1e9, mxX=-1e9, mnY=1e9, mxY=-1e9, mnZ=1e9, mxZ=-1e9;
for (let i = 0; i < TRAIL_LEN; i++) {
  raw.push(tx, ty, tz);
  if (tx < mnX) mnX = tx; if (tx > mxX) mxX = tx;
  if (ty < mnY) mnY = ty; if (ty > mxY) mxY = ty;
  if (tz < mnZ) mnZ = tz; if (tz > mxZ) mxZ = tz;
  const dx = Math.sin(ty) - B * tx;
  const dy = Math.sin(tz) - B * ty;
  const dz = Math.sin(tx) - B * tz;
  tx += dx * DT; ty += dy * DT; tz += dz * DT;
}

const cx = (mnX + mxX) * 0.5, cy = (mnY + mxY) * 0.5, cz = (mnZ + mxZ) * 0.5;
const span = Math.max(mxX - mnX, mxY - mnY, mxZ - mnZ);
const sc = 18.0 / span;
const trailData = new Float32Array(TRAIL_LEN * 4);
for (let i = 0; i < TRAIL_LEN; i++) {
  trailData[i * 4]     = (raw[i * 3]     - cx) * sc;
  trailData[i * 4 + 1] = (raw[i * 3 + 1] - cy) * sc;
  trailData[i * 4 + 2] = (raw[i * 3 + 2] - cz) * sc;
  trailData[i * 4 + 3] = 1.0;
}
const trailTex = new THREE.DataTexture(trailData, TEX_W, TEX_H,
  THREE.RGBAFormat, THREE.FloatType);
trailTex.minFilter = THREE.NearestFilter;
trailTex.magFilter = THREE.NearestFilter;
trailTex.needsUpdate = true;

/* ── leaf particles ────────────────────────────────────── */
const N = 18000;
const phases = new Float32Array(N);
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) {
  phases[i] = Math.random();
  seedArr[i] = Math.random();
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geom.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
geom.setAttribute('aSeed',  new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime:     { value: 0 },
  uTrail:    { value: trailTex },
  uPixel:    { value: renderer.getPixelRatio() },
  uTexW:     { value: TEX_W },
  uTexH:     { value: TEX_H },
  uTrailLen: { value: TRAIL_LEN }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform sampler2D uTrail;
    uniform float uTexW;
    uniform float uTexH;
    uniform float uTrailLen;
    attribute float aPhase;
    attribute float aSeed;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;

    vec3 sampleTrail(float idx) {
      float u = (mod(idx, uTexW) + 0.5) / uTexW;
      float v = (floor(idx / uTexW) + 0.5) / uTexH;
      return texture2D(uTrail, vec2(u, v)).xyz;
    }

    void main() {
      // drift along attractor — slightly slower than parent for contemplation
      float phase = fract(aPhase + uTime * 0.005);
      float idx = phase * uTrailLen;
      vec3 pos = sampleTrail(idx);

      // tangent from neighboring trail samples
      float idx2 = mod(idx + 12.0, uTrailLen);
      vec3 pos2 = sampleTrail(idx2);
      vec3 tang = pos2 - pos;
      vec3 tNorm = normalize(tang + vec3(0.0001));

      // perpendicular frame for arabesque scroll displacement
      vec3 up = abs(tNorm.y) > 0.9 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
      vec3 side = normalize(cross(tNorm, up));
      vec3 perp = cross(side, tNorm);

      // arabesque scrollwork: sinusoidal vine-curl around the attractor spine
      float scrollFreq = 24.0 + aSeed * 8.0; // varied frequency per particle
      float scrollPhase = phase * scrollFreq + aSeed * 6.2832;
      float scrollR = 0.15 + 0.12 * sin(aSeed * 47.0 + phase * 5.0);
      // secondary harmonic for ornamental complexity
      float scroll2 = 0.06 * sin(scrollPhase * 2.3 + 1.7);
      pos += side * (cos(scrollPhase) * scrollR + scroll2);
      pos += perp * (sin(scrollPhase) * scrollR * 0.8);

      // per-particle jitter for volume — very small, deliberate
      float ang = aSeed * 6.2832;
      float rad = 0.03 + 0.02 * sin(aSeed * 37.0);
      pos += vec3(cos(ang) * rad, sin(ang) * rad, sin(ang * 1.3) * rad * 0.5);

      // subtle breathing
      float breath = 1.0 + 0.01 * sin(uTime * 0.25 + aSeed * 12.0);
      pos *= breath;

      // leaf orientation from projected tangent + scroll tangent
      vec4 mvTang = modelViewMatrix * vec4(tNorm, 0.0);
      vLeafAngle = atan(mvTang.y, mvTang.x) + aSeed * 0.4 + sin(uTime * 0.15 + aSeed * 8.0) * 0.2;

      // palette: aged gold → warm ochre → bone → dark patina by height
      vec3 gold   = vec3(0.55, 0.42, 0.20);
      vec3 ochre  = vec3(0.58, 0.36, 0.14);
      vec3 bone   = vec3(0.72, 0.67, 0.59);
      vec3 patina = vec3(0.24, 0.30, 0.26);
      float h = (pos.y + 9.0) / 18.0;
      h = clamp(h, 0.0, 1.0);
      vCol = mix(ochre, gold, smoothstep(0.1, 0.35, h));
      vCol = mix(vCol, bone, smoothstep(0.4, 0.65, h));
      vCol = mix(vCol, patina, smoothstep(0.72, 0.92, h));
      // warm inner glow — subtle
      vCol += vec3(0.04, 0.02, 0.0) * (1.0 - h) * aSeed;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float dist = -mv.z;
      gl_PointSize = max(2.0, 3.8 * uPixel * (42.0 / dist));
      gl_Position = projectionMatrix * mv;

      vAlpha = smoothstep(90.0, 15.0, dist) * 0.55;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLeafAngle;

    void main() {
      vec2 uv = gl_PointCoord * 2.0 - 1.0;

      // rotate into leaf-local frame
      float ca = cos(vLeafAngle), sa = sin(vLeafAngle);
      vec2 p = vec2(ca * uv.x + sa * uv.y, -sa * uv.x + ca * uv.y);

      // leaf SDF: width varies along length, tapers at both ends
      float lx = p.x;
      float ly = abs(p.y);
      // leaf envelope: zero at tips (-1, +1), widest slightly past center
      float envelope = (1.0 - lx * lx) * (1.0 + 0.15 * lx);
      float w = envelope * 0.52;
      if (ly > w || abs(lx) > 0.96 || w < 0.01) discard;

      // central vein — thin bright line
      float vein = exp(-ly * ly * 60.0) * 0.12;
      // secondary veins — diagonal striations
      float veinAngle = abs(p.y) * 6.0 - (p.x + 1.0) * 2.0;
      float secVein = exp(-pow(mod(veinAngle, 1.0) - 0.5, 2.0) * 40.0) * 0.05;

      // soft edge falloff
      float edge = smoothstep(w, w * 0.35, ly);
      float tipFade = smoothstep(0.96, 0.7, abs(lx));
      float a = edge * tipFade * vAlpha;

      vec3 col = vCol + vec3(vein * 0.3 + secVein * 0.15, vein * 0.2, 0.0);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const pts = new THREE.Points(geom, mat);
scene.add(pts);

/* ── atmosphere: faint dust overlay ────────────────────── */
const dustN = 500;
const dustPos = new Float32Array(dustN * 3);
const dustSeed = new Float32Array(dustN);
for (let i = 0; i < dustN; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 50;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 40;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
  dustSeed[i] = Math.random();
}
const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    attribute float aSeed;
    varying float vA;
    void main() {
      vec3 p = position;
      p.y += sin(uTime * 0.06 + aSeed * 20.0) * 0.35;
      p.x += cos(uTime * 0.04 + aSeed * 14.0) * 0.25;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.1;
      gl_Position = projectionMatrix * mv;
      vA = 0.10 * smoothstep(60.0, 10.0, -mv.z);
    }
  `,
  fragmentShader: `
    varying float vA;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.25) discard;
      gl_FragColor = vec4(0.60, 0.55, 0.45, vA);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

/* ── warm side-light gradient (atmosphere) ─────────────── */
const gradGeom = new THREE.PlaneGeometry(2, 2);
const gradMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.999, 1.0); }`,
  fragmentShader: `
    void main() {
      vec2 uv = gl_FragCoord.xy / vec2(${innerWidth}.0, ${innerHeight}.0);
      // warm amber glow from lower left
      float g = exp(-length(uv - vec2(-0.2, -0.1)) * 1.4) * 0.03;
      // cool vignette at edges
      float vig = 1.0 - smoothstep(0.4, 1.1, length(uv - 0.5) * 1.3);
      gl_FragColor = vec4(0.45, 0.32, 0.15, g * vig);
    }
  `
});
const gradMesh = new THREE.Mesh(gradGeom, gradMat);
gradMesh.frustumCulled = false;
gradMesh.renderOrder = -1;
scene.add(gradMesh);

/* ── resize ────────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── render loop ───────────────────────────────────────── */
const t0 = performance.now();
function loop() {
  const t = (performance.now() - t0) / 1000;
  uniforms.uTime.value = t;

  // very slow lateral drift — single direction, no Y-rotate
  camera.position.x = 14 + t * 0.012;
  camera.position.y = 9 + Math.sin(t * 0.025) * 0.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">

  <button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
</body>
