<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: swarm, intensity: gentle -->
<title>32p · the flock that loses one and finds it again</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      linear-gradient(to bottom,
        #131320 0%,
        #1e1928 22%,
        #2a2028 45%,
        #3a2e28 68%,
        #4a3828 88%,
        #564030 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size:10px; letter-spacing:0.06em;
          color:#9a7855; }
</style>
</head>
<body>
<div class="id">32p</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── starfield: subtle specks to break the empty gradient
const STARS = 320;
const starPos = new Float32Array(STARS * 3);
const starAlpha = new Float32Array(STARS);
for (let i = 0; i < STARS; i++){
  starPos[i*3]     = (Math.random() - 0.5) * 120;
  starPos[i*3 + 1] = (Math.random() - 0.5) * 80;
  starPos[i*3 + 2] = -30 - Math.random() * 40;
  starAlpha[i] = 0.15 + Math.random() * 0.45;
}
const starGeom = new THREE.BufferGeometry();
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeom.setAttribute('aAlpha', new THREE.BufferAttribute(starAlpha, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  vertexShader: `
    attribute float aAlpha;
    varying float vA;
    void main(){
      vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = (0.8 + aAlpha * 1.2) * ${renderer.getPixelRatio().toFixed(1)};
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vA;
      gl_FragColor = vec4(0.75, 0.78, 0.85, a);
    }
  `
});
scene.add(new THREE.Points(starGeom, starMat));

// ── low horizon haze plane
const hazeGeom = new THREE.PlaneGeometry(200, 30);
const hazeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float g = smoothstep(0.0, 0.7, vUv.y);
      float a = (1.0 - g) * 0.12;
      gl_FragColor = vec4(0.45, 0.32, 0.22, a);
    }
  `
});
const hazePlane = new THREE.Mesh(hazeGeom, hazeMat);
hazePlane.position.set(0, -12, -20);
scene.add(hazePlane);

// ── boids with embedded narrative
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3 + 1] = Math.sin(ph) * r;
  pos[i*3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3 + 1] = (Math.random() - 0.5) * 0.3;
  vel[i*3 + 2] = (Math.random() - 0.5) * 0.4;
}
pos[0] = -1.2; pos[1] = 0.6; pos[2] = 0.0;

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.9;
const W_COH = 0.018, W_ALI = 0.060, W_SEP = 0.080;
const MAX_SPEED = 1.4, MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

function step(dt){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= (N-1); cy /= (N-1); cz /= (N-1);

  const sx = pos[0] - cx, sy = pos[1] - cy, sz = pos[2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0, Math.min(1, 1 - stragDist / 8));
  cohesion += (targetCohesion - cohesion) * dt * 0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';
  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX=0,cohY=0,cohZ=0,cohN=0;
    let aliX=0,aliY=0,aliZ=0,aliN=0;
    let sepX=0,sepY=0,sepZ=0;
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const isS = (i === STRAGGLER);
    const pR = isS ? PERCEPTION_R * 0.55 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx = pos[j*3]-px, dy = pos[j*3+1]-py, dz = pos[j*3+2]-pz;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 > pR*pR || d2 < 1e-6) continue;
      cohX += pos[j*3]; cohY += pos[j*3+1]; cohZ += pos[j*3+2]; cohN++;
      aliX += vel[j*3]; aliY += vel[j*3+1]; aliZ += vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R*SEPARATION_R){
        const inv = 1 / Math.sqrt(d2);
        sepX -= dx*inv; sepY -= dy*inv; sepZ -= dz*inv;
      }
    }

    if (isS){
      const drift = Math.sin(performance.now() * 0.0003) * 0.4;
      acc[i*3] += drift;
      acc[i*3+1] += -0.25 + Math.cos(performance.now() * 0.0002) * 0.2;
      acc[i*3+2] += drift * 0.6;
    }

    if (!isS && (arcStage === 'seeking' || arcStage === 'return')){
      const tx = pos[0]-px, ty = pos[1]-py, tz = pos[2]-pz;
      const td = Math.sqrt(tx*tx+ty*ty+tz*tz) + 1e-3;
      const seek = arcStage === 'seeking' ? 0.020 : 0.012;
      acc[i*3] += (tx/td)*seek; acc[i*3+1] += (ty/td)*seek; acc[i*3+2] += (tz/td)*seek;
    }

    if (cohN > 0){
      acc[i*3] += (cohX/cohN - px) * W_COH;
      acc[i*3+1] += (cohY/cohN - py) * W_COH;
      acc[i*3+2] += (cohZ/cohN - pz) * W_COH;
    }
    if (aliN > 0){
      acc[i*3] += (aliX/aliN - vel[i*3]) * W_ALI;
      acc[i*3+1] += (aliY/aliN - vel[i*3+1]) * W_ALI;
      acc[i*3+2] += (aliZ/aliN - vel[i*3+2]) * W_ALI;
    }
    acc[i*3] += sepX*W_SEP; acc[i*3+1] += sepY*W_SEP; acc[i*3+2] += sepZ*W_SEP;

    const d2c = px*px + py*py + pz*pz;
    if (d2c > 90){
      const inv = 0.012 / Math.sqrt(d2c);
      acc[i*3] += -px*inv; acc[i*3+1] += -py*inv; acc[i*3+2] += -pz*inv;
    }
  }

  const speedMul = (arcStage==='loss'||arcStage==='seeking') ? 0.55
                 : arcStage==='return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++){
    let ax=acc[i*3], ay=acc[i*3+1], az=acc[i*3+2];
    const af = Math.sqrt(ax*ax+ay*ay+az*az);
    if (af > MAX_FORCE){ const s = MAX_FORCE/af; ax*=s; ay*=s; az*=s; }
    vel[i*3] += ax; vel[i*3+1] += ay; vel[i*3+2] += az;
    let vx=vel[i*3], vy=vel[i*3+1], vz=vel[i*3+2];
    const sp = Math.sqrt(vx*vx+vy*vy+vz*vz);
    if (sp > MAX_SPEED){ const s=MAX_SPEED/sp; vel[i*3]*=s; vel[i*3+1]*=s; vel[i*3+2]*=s; }
    pos[i*3]   += vel[i*3]   * dt * speedMul;
    pos[i*3+1] += vel[i*3+1] * dt * speedMul;
    pos[i*3+2] += vel[i*3+2] * dt * speedMul;
  }
}

// ── render: velocity-aligned streaks via screen-space direction in point sprite
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('aVel', new THREE.BufferAttribute(vel, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const stragArr = new Float32Array(N);
stragArr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(stragArr, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 },
  uAspect:   { value: innerWidth / innerHeight }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    uniform float uAspect;
    attribute float seed;
    attribute float strag;
    attribute vec3 aVel;
    varying vec3  vCol;
    varying float vFade;
    varying vec2  vDir;  // screen-space velocity direction for streak alignment

    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // compute screen-space velocity direction
      vec3 velNorm = length(aVel) > 0.001 ? normalize(aVel) : vec3(1.0, 0.0, 0.0);
      vec4 mvAhead = modelViewMatrix * vec4(p + velNorm * 0.5, 1.0);
      vec4 clip0 = projectionMatrix * mv;
      vec4 clip1 = projectionMatrix * mvAhead;
      vec2 s0 = clip0.xy / clip0.w;
      vec2 s1 = clip1.xy / clip1.w;
      vec2 screenVel = s1 - s0;
      // correct for aspect ratio so streaks look right
      screenVel.x *= uAspect;
      float sLen = length(screenVel);
      vDir = sLen > 0.0001 ? screenVel / sLen : vec2(1.0, 0.0);

      // size: streaks are elongated, so base size is larger
      float speed = length(aVel);
      float baseSize = 2.2 + speed * 1.8 + 0.5 * sin(t);
      float stragSize = strag * 3.0;
      gl_PointSize = (baseSize + stragSize) * uPixel * (18.0 / dist);
      gl_PointSize = min(gl_PointSize, 64.0);

      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);

      // color: cohesion-driven palette
      vec3 warm  = vec3(0.92, 0.62, 0.30);   // muted dawn amber
      vec3 hot   = vec3(0.98, 0.88, 0.72);   // cream
      vec3 cool  = vec3(0.38, 0.50, 0.72);   // steel blue
      vec3 lost  = vec3(0.50, 0.30, 0.58);   // violet
      vec3 cohCol  = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot,  smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.18);
      vCol *= (1.0 + strag * 0.4);

      gl_Position = clip0;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vFade;
    varying vec2  vDir;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      // rotate point coord into velocity-aligned frame
      vec2 perp = vec2(-vDir.y, vDir.x);
      float along  = dot(d, vDir);
      float across = dot(d, perp);
      // streak: elongated along velocity, narrow across
      // along is stretched (low weight), across is compressed (high weight)
      float r = along * along * 1.8 + across * across * 18.0;
      if (r > 0.25) discard;
      float core = exp(-r * 18.0);
      // subtle outer glow
      float glow = exp(-r * 6.0) * 0.3;
      float a = (core + glow) * vFade;
      gl_FragColor = vec4(vCol * a * 0.9, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ── paper grain overlay via screen-space noise plane
const grainGeom = new THREE.PlaneGeometry(2, 2);
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    // simple hash
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    void main(){
      vec2 uv = gl_FragCoord.xy;
      float n = hash(uv + fract(uTime * 0.7) * 100.0);
      // very subtle grain
      gl_FragColor = vec4(vec3(n > 0.5 ? 0.06 : 0.0), 0.04);
    }
  `
});
const grainQuad = new THREE.Mesh(grainGeom, grainMat);
grainQuad.frustumCulled = false;
grainQuad.renderOrder = 999;
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uAspect.value = innerWidth / innerHeight;
});

// pre-warm
for (let s = 0; s < 250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = now / 1000;
  uniforms.uCohesion.value = cohesion;
  grainMat.uniforms.uTime.value = now / 1000;

  step(dt);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.aVel.needsUpdate = true;

  // slow auto-orbit, tracking flock centroid
  let fcx=0, fcy=0, fcz=0;
  for (let i = 0; i < N; i++){
    fcx += pos[i*3]; fcy += pos[i*3+1]; fcz += pos[i*3+2];
  }
  fcx /= N; fcy /= N; fcz /= N;
  const ang = now * 0.00010;
  camera.position.x = fcx + Math.sin(ang) * 26;
  camera.position.y = fcy + 1.5;
  camera.position.z = fcz + Math.cos(ang) * 26;
  camera.lookAt(fcx, fcy, fcz);

  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
