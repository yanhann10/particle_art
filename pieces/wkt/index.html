<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wkt · yugen — profound grace in the unseen</title>
<!-- MOTION: drift, intensity: quietude -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">wkt</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.038);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080b0f, 0.6));
const dL = new THREE.DirectionalLight(0x9db4c8, 0.18);
dL.position.set(-4, 6, 3);
scene.add(dL);

let seed = 33719201;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── THE SUSPENDED KEY — now dissolving into suggestion
const keyGroup = new THREE.Group();
const keyRingGeo = new THREE.TorusGeometry(0.85, 0.14, 12, 20);
const keyMat = new THREE.MeshStandardMaterial({ 
  color: 0xa8bcc8, 
  emissive: 0x6a7c88, 
  emissiveIntensity: 0.32,
  roughness: 0.95, 
  metalness: 0.05,
  transparent: true,
  opacity: 0.48
});
const keyRing = new THREE.Mesh(keyRingGeo, keyMat);
keyGroup.add(keyRing);

const shaftGeo = new THREE.BoxGeometry(0.18, 2.6, 0.10);
const keyShaft = new THREE.Mesh(shaftGeo, keyMat);
keyShaft.position.y = -1.65;
keyGroup.add(keyShaft);

const tooth1Geo = new THREE.BoxGeometry(0.38, 0.18, 0.10);
const tooth1 = new THREE.Mesh(tooth1Geo, keyMat);
tooth1.position.set(0.16, -2.65, 0);
keyGroup.add(tooth1);

const tooth2Geo = new THREE.BoxGeometry(0.30, 0.16, 0.10);
const tooth2 = new THREE.Mesh(tooth2Geo, keyMat);
tooth2.position.set(0.13, -2.35, 0);
keyGroup.add(tooth2);

const tooth3Geo = new THREE.BoxGeometry(0.25, 0.14, 0.10);
const tooth3 = new THREE.Mesh(tooth3Geo, keyMat);
tooth3.position.set(0.10, -2.05, 0);
keyGroup.add(tooth3);

keyGroup.position.set(0, 1.5, 0);
keyGroup.rotation.set(0.15, 0.25, 0.08);
scene.add(keyGroup);

const keyPos = keyGroup.position;

// ── ROOM BOUNDARIES — expanded void, atmosphere deepens
const ROOM = { w: 38, h: 32, d: 52 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — sparse constellation
const NUM_ANCHORS = 620;
const anchors = [];
for(let i=0; i<NUM_ANCHORS; i++){
  if(rng() < 0.42){
    // Around key — more diffuse halo
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = 1.2 + rng()*6.5;
    anchors.push(keyPos.clone().add(dir.multiplyScalar(dist)));
  } else if(rng() < 0.30){
    // Mid-field
    const p = wallPt();
    p.lerp(keyPos, 0.15 + rng()*0.40);
    anchors.push(p);
  } else {
    anchors.push(wallPt());
  }
}

// ── BUILD 12,000 THREADS — fewer, paler, more suggestion
const NUM_LINES = 12000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function keySurf(){
  const choice = Math.floor(rng()*5);
  if(choice === 0){
    const ang = rng() * Math.PI * 2;
    const r = 0.85;
    return keyPos.clone().add(new THREE.Vector3(
      Math.cos(ang) * r,
      Math.sin(ang) * r,
      (rng()-0.5)*0.14
    ));
  } else if(choice === 1){
    return keyPos.clone().add(new THREE.Vector3(
      (rng()-0.5)*0.18,
      -1.65 + (rng()-0.5)*2.6,
      (rng()-0.5)*0.10
    ));
  } else {
    return keyPos.clone().add(new THREE.Vector3(
      (rng()-0.5)*0.38,
      -2.35 + (rng()-0.5)*0.6,
      (rng()-0.5)*0.10
    ));
  }
}

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Category A: distant threads converging — more tentative
const catA = Math.floor(NUM_LINES * 0.35);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, keySurf());
}

// Category B: long threads through space — implied connection
const catB = Math.floor(NUM_LINES * 0.38);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(keyPos) > 14 && rng() > 0.18){ i--; continue; }
  setLine(a, b);
}

// Category C: subtle local web
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.2 && d < 7.0){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0x495a68,
  transparent: true,
  opacity: 0.035,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── MEMORY FRAGMENTS — nearly dissolved
const NUM_FRAGS = 18;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03 + rng()*0.10;
  const geo = rng()>0.7
    ? new THREE.BoxGeometry(sz*(1.0+rng()*1.5), sz*0.015, sz*(0.7+rng()*0.8))
    : new THREE.TetrahedronGeometry(sz*0.8, 0);
  const d = 0.012 + rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d*0.8, d*0.85, d*0.92),
    transparent: true, opacity: 0.18 + rng()*0.22
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.25 + rng()*0.50;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI*2, rng()*Math.PI*2, rng()*Math.PI*2);
  scene.add(mesh);
}

// ── CAMERA PATH — slower, more distant contemplation
const dollyPath = [];
const pathLen = 200;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;
  
  const x = keyPos.x + Math.sin(phase) * 8.5 + Math.sin(phase*1.4)*1.8;
  const y = keyPos.y + Math.sin(phase*0.5 + 1.0) * 5.0 + Math.cos(phase*0.9)*1.2;
  const z = keyPos.z + Math.cos(phase) * 11.0 + Math.sin(phase*0.3)*3.5;
  
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Slower breath — almost imperceptible
  const breathAmp = 0.004;
  const breathFreq = 0.10;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.3 + by*0.7 + bz*0.15 + (i/6)*0.008;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.5;
    arr[i+2] = bz + s*0.3;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera — even slower drift
  const speed = 0.0032;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const lookTarget = keyPos.clone();
  lookTarget.x += Math.sin(t*0.015)*0.6;
  lookTarget.y += Math.cos(t*0.011)*0.4;
  camera.lookAt(lookTarget);

  // Key — barely present rotation, fading gesture
  keyGroup.rotation.y += 0.00012;
  keyGroup.rotation.x += 0.00005;
  
  // Yugen fade pulse — key opacity breathes between barely-there states
  const opacityPhase = Math.sin(t * 0.08) * 0.12 + 0.48;
  keyMat.opacity = opacityPhase;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
