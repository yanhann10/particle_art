<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>d4t · folded leaves</title>
<!-- MOTION: gathering, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">d4t</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

/* ── vascular tree: constructive constraint optimization ── */
function buildVascularTree(leafNodes, iterations){
  const nodes = leafNodes.map(p => ({ pos: p.clone(), parent: null, children: [], isLeaf: true, radius: 0.05 }));
  const root = new THREE.Vector3(0, -6, 0);
  const rootNode = { pos: root, parent: null, children: [], isLeaf: false, radius: 0.3 };
  
  for (let iter = 0; iter < iterations; iter++){
    for (let i = 0; i < nodes.length; i++){
      if (nodes[i].parent) continue;
      let bestJ = -1, bestDist = Infinity;
      for (let j = 0; j < nodes.length; j++){
        if (j === i) continue;
        const d = nodes[i].pos.distanceTo(nodes[j].parent ? nodes[j].parent.pos : rootNode.pos);
        if (d < bestDist){ bestDist = d; bestJ = j; }
      }
      const distToRoot = nodes[i].pos.distanceTo(rootNode.pos);
      if (bestDist < distToRoot && bestJ >= 0){
        const parentNode = nodes[bestJ].parent || rootNode;
        nodes[i].parent = parentNode;
        parentNode.children.push(nodes[i]);
      } else {
        nodes[i].parent = rootNode;
        rootNode.children.push(nodes[i]);
      }
    }
  }
  
  function collectSegments(node, segs = []){
    for (const child of node.children){
      segs.push({ from: node.pos, to: child.pos, radius: child.radius });
      collectSegments(child, segs);
    }
    return segs;
  }
  return collectSegments(rootNode);
}

/* ── folded leaf geometry: curved strip with mid-vein ── */
function createLeafGeometry(length, width, curvature, twist){
  const segs = 32;
  const positions = [];
  const indices = [];
  
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const x = (t - 0.5) * length;
    const curveY = curvature * Math.sin(t * Math.PI);
    const twistAngle = twist * t * Math.PI;
    
    for (let side = -1; side <= 1; side += 2){
      const z = side * width * 0.5 * (1 - t * 0.3);
      const xRot = x;
      const yRot = curveY + z * Math.sin(twistAngle);
      const zRot = z * Math.cos(twistAngle);
      positions.push(xRot, yRot, zRot);
    }
  }
  
  for (let i = 0; i < segs; i++){
    const base = i * 2;
    indices.push(base, base+1, base+2);
    indices.push(base+1, base+3, base+2);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

/* ── leaf cluster configuration ── */
const leafConfigs = [
  { length: 3.2, width: 1.8, curvature: 0.8, twist: 0.6, pos: new THREE.Vector3(0, 0.5, 0), rot: new THREE.Euler(0.2, 0, 0) },
  { length: 2.8, width: 1.5, curvature: 1.1, twist: -0.8, pos: new THREE.Vector3(-1.2, -0.3, 0.5), rot: new THREE.Euler(0.3, 0.8, 0.4) },
  { length: 3.5, width: 2.0, curvature: 0.6, twist: 0.9, pos: new THREE.Vector3(1.5, 0.2, -0.8), rot: new THREE.Euler(-0.2, -0.6, -0.3) },
  { length: 2.5, width: 1.3, curvature: 1.3, twist: -0.5, pos: new THREE.Vector3(-0.8, 1.2, -0.6), rot: new THREE.Euler(0.5, 1.2, 0.2) },
  { length: 3.0, width: 1.6, curvature: 0.9, twist: 0.7, pos: new THREE.Vector3(0.9, -0.8, 0.9), rot: new THREE.Euler(-0.4, -0.9, 0.6) },
  { length: 2.6, width: 1.4, curvature: 1.0, twist: -0.7, pos: new THREE.Vector3(0.3, 1.8, 0.3), rot: new THREE.Euler(0.6, 0.3, -0.2) },
  { length: 3.3, width: 1.7, curvature: 0.7, twist: 0.8, pos: new THREE.Vector3(-1.6, 0.8, 0.2), rot: new THREE.Euler(0.1, 1.5, 0.5) },
];

const leafMeshes = [];
const leafTargets = [];
const ochre = new THREE.Color(0.78, 0.58, 0.30);
const sienna = new THREE.Color(0.52, 0.34, 0.22);
const rust = new THREE.Color(0.65, 0.38, 0.24);

for (let i = 0; i < leafConfigs.length; i++){
  const cfg = leafConfigs[i];
  const geom = createLeafGeometry(cfg.length, cfg.width, cfg.curvature, cfg.twist);
  const colorMix = i / leafConfigs.length;
  const leafColor = new THREE.Color().lerpColors(sienna, ochre, colorMix);
  if (i % 3 === 0) leafColor.lerp(rust, 0.3);
  
  const mat = new THREE.MeshStandardMaterial({
    color: leafColor,
    roughness: 0.8,
    metalness: 0.1,
    side: THREE.DoubleSide,
    emissive: leafColor,
    emissiveIntensity: 0.08,
  });
  
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(cfg.pos).multiplyScalar(0);
  mesh.rotation.copy(cfg.rot);
  mesh.scale.setScalar(0.01);
  scene.add(mesh);
  leafMeshes.push(mesh);
  leafTargets.push({ pos: cfg.pos.clone(), scale: 1.0 });
}

/* ── vascular network as particle substrate ── */
const leafTipPositions = leafConfigs.map(cfg => {
  const tip = new THREE.Vector3(cfg.length * 0.5, 0, 0);
  tip.applyEuler(cfg.rot);
  tip.add(cfg.pos);
  return tip;
});

const vascularSegs = buildVascularTree(leafTipPositions, 8);

const totalN = 60000;
const positions = new Float32Array(totalN * 3);
const seeds = new Float32Array(totalN);
const segIds = new Float32Array(totalN);

let idx = 0;
for (let i = 0; i < vascularSegs.length; i++){
  const seg = vascularSegs[i];
  const len = seg.from.distanceTo(seg.to);
  const count = Math.max(1, Math.floor((len / 10) * totalN));
  const v = new THREE.Vector3();
  
  for (let k = 0; k < count && idx < totalN; k++){
    const t = Math.random();
    v.lerpVectors(seg.from, seg.to, t);
    const jitter = 0.08;
    v.x += (Math.random() - 0.5) * jitter;
    v.y += (Math.random() - 0.5) * jitter;
    v.z += (Math.random() - 0.5) * jitter;
    positions[idx * 3] = v.x;
    positions[idx * 3 + 1] = v.y;
    positions[idx * 3 + 2] = v.z;
    seeds[idx] = Math.random();
    segIds[idx] = i / vascularSegs.length;
    idx++;
  }
}

while (idx < totalN){
  positions[idx * 3] = (Math.random() - 0.5) * 2;
  positions[idx * 3 + 1] = (Math.random() - 0.5) * 2;
  positions[idx * 3 + 2] = (Math.random() - 0.5) * 2;
  seeds[idx] = Math.random();
  segIds[idx] = 0;
  idx++;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('segId', new THREE.BufferAttribute(segIds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uGrowth: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uGrowth;
    attribute float seed;
    attribute float segId;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      
      float growPhase = smoothstep(0.0, 1.0, uGrowth - segId * 0.2);
      p *= growPhase;
      
      float sway = 0.04 * sin(t * 0.6 + p.y * 0.5) * growPhase;
      p.x += sway;
      p.z += sway * 0.6;
      
      float energy = 0.5 + 0.5 * sin(t * 0.5);
      
      vec3 ochre = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 rust = vec3(0.65, 0.38, 0.24);
      
      vec3 col = mix(sienna, ochre, segId);
      col = mix(col, rust, 0.2 * sin(seed * 6.28));
      
      vCol = col;
      vAlpha = (0.4 + 0.3 * energy) * growPhase;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.4 * energy) * uPixel * (35.0 / dist) * growPhase;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

const ambientLight = new THREE.AmbientLight(0x2a1f18, 0.6);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffead0, 1.2);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x4a3020, 0.4);
fillLight.position.set(-2, 2, -3);
scene.add(fillLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  const growthDuration = 4.0;
  uniforms.uGrowth.value = Math.min(1.0, elapsed / growthDuration);
  
  for (let i = 0; i < leafMeshes.length; i++){
    const mesh = leafMeshes[i];
    const target = leafTargets[i];
    const delay = i * 0.15;
    const localGrowth = Math.max(0, Math.min(1, (elapsed - delay) / 2.5));
    
    const curveGrowth = localGrowth * localGrowth * (3 - 2 * localGrowth);
    mesh.position.lerp(target.pos, curveGrowth);
    const targetScale = target.scale * (0.8 + 0.2 * Math.sin(elapsed * 0.3 + i));
    mesh.scale.setScalar(THREE.MathUtils.lerp(mesh.scale.x, targetScale * curveGrowth, 0.05));
    
    const breathe = 0.015 * Math.sin(elapsed * 0.4 + i * 0.8);
    mesh.rotation.x += breathe * 0.5;
    mesh.rotation.z += breathe * 0.3;
  }
  
  const centroid = new THREE.Vector3();
  for (const leaf of leafMeshes){
    centroid.add(leaf.position);
  }
  centroid.divideScalar(leafMeshes.length);
  controls.target.lerp(centroid, 0.02);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
