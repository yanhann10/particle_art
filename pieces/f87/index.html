<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 500);
camera.position.set(0, 0, 4.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a080c, 1);
document.body.appendChild(renderer.domElement);

const N = 60000;
const positions     = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const seeds         = new Float32Array(N);
const distFromCore  = new Float32Array(N); // 0=insect, 1=amber shell

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uPinch:  { value: 1.0 },
  uHand:   { value: new THREE.Vector3(0,0,0) },
  uActive: { value: 0.0 },
  uReady:  { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPinch;
    uniform vec3  uHand;
    uniform float uActive;
    uniform float uReady;
    attribute vec3  rest;
    attribute float seed;
    attribute float layer;
    varying vec3  vCol;
    varying float vEnergy;
    void main(){
      vec3 p = rest;
      float t = uTime * 0.35 + seed * 6.28;

      // breathing — subtle, trapped-in-amber pulse
      vec3 dir = normalize(p);
      float breathAmp = 0.03 * (1.0 - layer * 0.6);
      p += dir * sin(t) * breathAmp * (1.0 + 0.4*sin(seed*9.0));

      // gesture: open hand disperses, fist collapses
      vec3 fromCenter = p;
      float disperse = mix(0.0, 0.8, uPinch * 0.5) * uActive;
      p += fromCenter * disperse;

      // hand pull — gentler for amber
      vec3 toHand = uHand - p;
      p += toHand * uActive * 0.03;

      // assembly reveal
      vec3 entry = vec3(sin(seed*40.0), cos(seed*30.0), sin(seed*22.0)) * 8.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.4 + 0.6*sin(t*0.7);

      // palette: deep amber core → honey → pale resin shell
      // insect (layer≈0): dark amber-brown, warm
      vec3 insectA = vec3(0.72, 0.38, 0.12);  // burnt sienna
      vec3 insectB = vec3(0.85, 0.52, 0.18);  // raw amber
      vec3 insectC = vec3(0.42, 0.18, 0.08);  // dark ember

      // amber shell (layer≈1): golden translucent
      vec3 amberA = vec3(0.95, 0.82, 0.45);   // pale honey
      vec3 amberB = vec3(0.88, 0.65, 0.25);   // deep honey
      vec3 amberC = vec3(0.98, 0.92, 0.72);   // cream highlight

      vec3 colInsect = mix(insectA, insectB, vEnergy);
      colInsect = mix(colInsect, insectC, smoothstep(0.78, 1.0, vEnergy) * 0.5);

      vec3 colAmber = mix(amberA, amberB, vEnergy);
      colAmber = mix(colAmber, amberC, smoothstep(0.82, 1.0, vEnergy) * 0.4);

      vCol = mix(colInsect, colAmber, layer);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (1.0 + 1.2*vEnergy) * uPixel * (18.0/dist) * (0.4 + 0.6*uReady);
      // amber-shell particles slightly larger, more diffuse
      sz *= mix(1.0, 1.6, layer);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.35 + 0.55*vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');
const startBtn  = document.getElementById('startBtn');
const hintEl    = document.getElementById('hint');
const camEl     = document.getElementById('cam');

let modelCenter = new THREE.Vector3();
let revealStart = 0;
let modelLoaded = false;

function initGeometry(samplers, weights){
  // samplers: [{sampler, isShell}], weights: proportion per sampler
  const tmp = new THREE.Vector3();
  let idx = 0;
  for (let s = 0; s < samplers.length; s++){
    const count = Math.floor(N * weights[s]);
    const { sampler, isShell } = samplers[s];
    for (let i = 0; i < count && idx < N; i++, idx++){
      sampler.sample(tmp);
      restPositions[idx*3]   = tmp.x;
      restPositions[idx*3+1] = tmp.y;
      restPositions[idx*3+2] = tmp.z;
      seeds[idx] = Math.random();
      distFromCore[idx] = isShell ? (0.6 + Math.random()*0.4) : Math.random()*0.3;
    }
  }
  // fill any remaining
  for (; idx < N; idx++){
    samplers[0].sampler.sample(tmp);
    restPositions[idx*3]   = tmp.x;
    restPositions[idx*3+1] = tmp.y;
    restPositions[idx*3+2] = tmp.z;
    seeds[idx] = Math.random();
    distFromCore[idx] = Math.random();
  }

  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
  geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
  geom.setAttribute('layer',    new THREE.BufferAttribute(distFromCore, 1));

  loadingEl.style.display = 'none';
  startBtn.style.display = 'inline-block';
  revealStart = performance.now();
  modelLoaded = true;
}

function buildFallback(){
  // fallback: icosahedron as amber lump
  const ico = new THREE.IcosahedronGeometry(1.2, 4);
  const mesh = new THREE.Mesh(ico, new THREE.MeshBasicMaterial());
  const sampler = new MeshSurfaceSampler(mesh).build();
  initGeometry([{ sampler, isShell: true }], [1.0]);
}

// Load MosquitoInAmber
const GLB_URL = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/MosquitoInAmber/glTF-Binary/MosquitoInAmber.glb';
const loader = new GLTFLoader();

// fallback timer
const fallbackTimer = setTimeout(() => {
  if (!modelLoaded) {
    loadingEl.textContent = 'model timeout — fallback amber';
    buildFallback();
  }
}, 8000);

loader.load(GLB_URL,
  (gltf) => {
    clearTimeout(fallbackTimer);
    if (modelLoaded) return;

    const root = gltf.scene;
    // compute total bounding box
    const box = new THREE.Box3().setFromObject(root);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 2.5 / maxAxis; // fit to ~2.5 unit radius
    root.position.sub(center);
    root.scale.multiplyScalar(scale);
    root.updateMatrixWorld(true);
    modelCenter.copy(center).multiplyScalar(0); // centered at origin now

    // collect meshes, classify as shell (translucent/amber) vs insect
    const samplers = [];
    const weights = [];
    let totalArea = 0;
    const meshes = [];

    root.traverse((child) => {
      if (child.isMesh && child.geometry){
        const g = child.geometry.clone();
        g.applyMatrix4(child.matrixWorld);
        if (!g.index && g.attributes.position.count < 3) return;
        const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial());
        // heuristic: if material is transparent or name contains amber/resin → shell
        const mat = child.material;
        const isShell = (mat && (mat.transparent || mat.opacity < 0.95)) ||
                        (child.name && /amber|resin|shell|glass/i.test(child.name));
        try {
          const sampler = new MeshSurfaceSampler(m).build();
          // estimate area by vertex count as rough proxy
          const area = g.attributes.position.count;
          meshes.push({ sampler, isShell: !!isShell, area });
          totalArea += area;
        } catch(e) { /* skip degenerate meshes */ }
      }
    });

    if (meshes.length === 0){
      buildFallback();
      return;
    }

    // assign more particles to insect parts for detail
    for (const m of meshes){
      const baseProp = m.area / totalArea;
      // boost insect parts
      const w = m.isShell ? baseProp * 0.7 : baseProp * 1.5;
      samplers.push({ sampler: m.sampler, isShell: m.isShell });
      weights.push(w);
    }
    // normalize weights
    const wSum = weights.reduce((a,b) => a+b, 0);
    for (let i = 0; i < weights.length; i++) weights[i] /= wSum;

    initGeometry(samplers, weights);

    // adjust camera to frame object
    camera.position.set(0, 0.3, 4.5);
    camera.lookAt(0, 0, 0);
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading mosquito in amber · ${pct}%`;
    }
  },
  (err) => {
    clearTimeout(fallbackTimer);
    console.error(err);
    loadingEl.textContent = 'load failed — fallback amber';
    buildFallback();
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// MediaPipe Hands
let handsActive = false;
async function loadMP(){
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js');
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js');
}
async function startHands(){
  startBtn.style.display = 'none';
  hintEl.textContent = 'requesting camera…';
  try { await loadMP(); }
  catch { hintEl.textContent = 'mediapipe load failed — passive mode'; return; }
  const hands = new window.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  hands.onResults((res) => {
    if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0){
      uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 0.0, 0.05);
      return;
    }
    uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 1.0, 0.1);
    const lm = res.multiHandLandmarks[0];
    const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y, dz = lm[4].z - lm[8].z;
    const pinch = Math.min(2.0, Math.sqrt(dx*dx+dy*dy+dz*dz) * 6.0);
    uniforms.uPinch.value = THREE.MathUtils.lerp(uniforms.uPinch.value, pinch, 0.15);
    const palm = lm[9];
    const wx = (0.5 - palm.x) * 6;
    const wy = (0.5 - palm.y) * 4;
    uniforms.uHand.value.set(wx, wy, 0.0);
    hintEl.textContent = `hand · pinch=${pinch.toFixed(2)}`;
  });
  camEl.classList.remove('hidden');
  const cam = new window.Camera(camEl, {
    onFrame: async () => { await hands.send({ image: camEl }); },
    width: 320, height: 240
  });
  cam.start();
  handsActive = true;
}
startBtn.addEventListener('click', startHands);

// slow drift orbit — examining the specimen
const startTime = performance.now();
function loop(){
  const t = (performance.now() - startTime) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3000);
  }

  // gentle orbital drift — like turning amber in your hand
  const orbitR = 4.5;
  const orbitSpeed = 0.06;
  const vertDrift = Math.sin(t * 0.03) * 0.4;
  points.rotation.y = t * orbitSpeed;
  points.rotation.x = Math.sin(t * 0.025) * 0.08;

  if (!handsActive && uniforms.uReady.value > 0.95) {
    uniforms.uPinch.value = 1.0 + 0.15 * Math.sin(t * 0.3);
    uniforms.uActive.value = 0.2;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
