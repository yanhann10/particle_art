<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b27 · coral polyp colony reaching for light</title>
<!-- MOTION: growth, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: radial-gradient(ellipse at 50% 20%, #0a1418 0%, #050a0d 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">b27 · coral polyp colony reaching for light</div>
<div class="hint">DLA aggregation biased toward sunlight gradient · growth emerges from local feedback</div>
<div class="src">descended from sav · biological-systems-emergence · Andrew Adamatzky, reaction-diffusion</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Coral polyp colony as DLA (diffusion-limited aggregation) with phototaxis.
// Each polyp is a particle that:
//   1. random-walks in a confined volume (the substrate reef box)
//   2. sticks to existing polyps when it touches them (aggregation)
//   3. biases its walk UPWARD + toward a lateral light source (phototaxis)
//   4. once stuck, it becomes part of the colony scaffold
// Growth is EMERGENT: no blueprint, just local rules + environmental gradient.
// Over ~90 seconds the colony accumulates from a seed cluster into a branching
// form that leans toward the light. Organic timescales: slow aggregation,
// occasional bursts when walkers converge near a branch tip.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050a0d, 18, 42);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(14, 8, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// starfield backdrop — subtle texture so background isn't blank void
const starsGeom = new THREE.BufferGeometry();
const starsPos = [];
for (let i = 0; i < 800; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(Math.random() * 2 - 1);
  const r = 45 + Math.random() * 10;
  starsPos.push(
    Math.sin(phi) * Math.cos(theta) * r,
    Math.sin(phi) * Math.sin(theta) * r,
    Math.cos(phi) * r
  );
}
starsGeom.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
const starsMat = new THREE.PointsMaterial({ color: 0x3a4a5a, size: 0.5, transparent: true, opacity: 0.3, fog: false });
const stars = new THREE.Points(starsGeom, starsMat);
scene.add(stars);

// ground horizon — low dark plane
const groundGeom = new THREE.PlaneGeometry(60, 60);
groundGeom.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x0a0f12, fog: true, transparent: true, opacity: 0.4 });
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.position.y = -1.5;
scene.add(ground);

// directional light from upper-right (phototaxis target)
const light = new THREE.DirectionalLight(0xffddb8, 1.2);
light.position.set(8, 12, 6);
scene.add(light);
const ambLight = new THREE.AmbientLight(0x1a2a3a, 0.35);
scene.add(ambLight);

// DLA system state
const MAX_POLYPS = 1200;
const polyps = [];         // { pos: vec3, stuck: bool, age: float }
const stuckPolyps = [];    // only stuck ones (for collision checks)
const SUBSTRATE_Y = 0.0;
const BOX_W = 10.0;
const BOX_H = 12.0;
const STICK_DIST = 0.45;
const WALK_SPEED = 0.12;

// seed cluster: 8 polyps at substrate center
for (let i = 0; i < 8; i++){
  const ang = (i / 8) * Math.PI * 2;
  const r = 0.3 + Math.random() * 0.2;
  const p = {
    pos: new THREE.Vector3(Math.cos(ang) * r, SUBSTRATE_Y + 0.1, Math.sin(ang) * r),
    stuck: true,
    age: 0
  };
  polyps.push(p);
  stuckPolyps.push(p);
}

// spawn a walker polyp at random position in volume
function spawnWalker(){
  if (polyps.length >= MAX_POLYPS) return;
  const x = (Math.random() - 0.5) * BOX_W * 0.8;
  const y = SUBSTRATE_Y + Math.random() * BOX_H * 0.6;
  const z = (Math.random() - 0.5) * BOX_W * 0.8;
  polyps.push({ pos: new THREE.Vector3(x, y, z), stuck: false, age: 0 });
}

// initial walkers
for (let i = 0; i < 40; i++) spawnWalker();

// phototaxis vector: light is at (8,12,6) — normalized toward that direction
const lightDir = new THREE.Vector3(8, 12, 6).normalize();

function stepDLA(dt){
  // spawn new walkers occasionally (growth pulse)
  if (Math.random() < 0.08 && polyps.length < MAX_POLYPS) spawnWalker();

  for (let p of polyps){
    p.age += dt;
    if (p.stuck) continue;

    // random walk biased upward + toward light
    const rand = new THREE.Vector3(
      (Math.random() - 0.5),
      (Math.random() - 0.5) + 0.8,   // upward bias
      (Math.random() - 0.5)
    );
    rand.normalize().multiplyScalar(WALK_SPEED * dt);
    // phototaxis component
    const photo = lightDir.clone().multiplyScalar(0.06 * dt);
    p.pos.add(rand).add(photo);

    // boundary reflect
    if (p.pos.y < SUBSTRATE_Y){ p.pos.y = SUBSTRATE_Y; }
    if (p.pos.y > SUBSTRATE_Y + BOX_H){ p.pos.y = SUBSTRATE_Y + BOX_H; }
    if (Math.abs(p.pos.x) > BOX_W * 0.5){ p.pos.x = Math.sign(p.pos.x) * BOX_W * 0.5; }
    if (Math.abs(p.pos.z) > BOX_W * 0.5){ p.pos.z = Math.sign(p.pos.z) * BOX_W * 0.5; }

    // check collision with stuck polyps
    for (let sp of stuckPolyps){
      if (p.pos.distanceTo(sp.pos) < STICK_DIST){
        p.stuck = true;
        stuckPolyps.push(p);
        break;
      }
    }
  }
}

// render: instanced mesh for all polyps
const polypGeom = new THREE.SphereGeometry(0.18, 8, 6);
const polypMat = new THREE.MeshStandardMaterial({
  color: 0xd8a070,
  emissive: 0x3a1a10,
  roughness: 0.8,
  metalness: 0.1,
  fog: true
});
const polypInstances = new THREE.InstancedMesh(polypGeom, polypMat, MAX_POLYPS);
polypInstances.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(polypInstances);

const dummyMat = new THREE.Matrix4();
function updateInstancedMesh(){
  const count = Math.min(polyps.length, MAX_POLYPS);
  polypInstances.count = count;
  for (let i = 0; i < count; i++){
    const p = polyps[i];
    dummyMat.makeTranslation(p.pos.x, p.pos.y, p.pos.z);
    // stuck polyps are larger + slightly varied in scale
    const sc = p.stuck ? (0.9 + Math.sin(p.age * 0.6 + i) * 0.15) : 0.7;
    dummyMat.scale(new THREE.Vector3(sc, sc, sc));
    polypInstances.setMatrixAt(i, dummyMat);
  }
  polypInstances.instanceMatrix.needsUpdate = true;
}

// camera tracks colony centroid
function updateCamera(){
  if (stuckPolyps.length === 0) return;
  const c = new THREE.Vector3(0,0,0);
  for (let sp of stuckPolyps) c.add(sp.pos);
  c.divideScalar(stuckPolyps.length);
  // smooth track
  const target = new THREE.Vector3(c.x, c.y + 1.5, c.z);
  camera.position.lerp(new THREE.Vector3(target.x + 14, target.y + 6, target.z + 18), 0.02);
  camera.lookAt(target);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;

  stepDLA(dt);
  updateInstancedMesh();
  updateCamera();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
