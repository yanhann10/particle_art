<!doctype html>
<html lang="en">
<head>

<title>e5c · Gloaming tissues</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 50% 85%, #c4864a 0%, #6b4231 28%, #2a2240 62%, #0e0d1a 100%),
      #0e0d1a;
    background-blend-mode: normal;
    color: #d4c8b8; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0 0.10  0 0 0 0.35 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.50'/></svg>");
    mix-blend-mode: multiply; opacity: 0.45;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 80% 60% at 50% 90%, rgba(210,140,70,0.18), rgba(210,140,70,0) 60%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:5; color:#8a7e72; }
  .state { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#8a7e72; font-family:ui-monospace,"SF Mono",Menlo,monospace; transition: opacity 0.4s; }
</style>

<body>
<div class="id">e5c</div>
<div class="hint">click to cycle tissue · drag to tilt</div>
<div class="state" id="stateLabel">i · ember vessels</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const posA = new Float32Array(N * 3);
const posB = new Float32Array(N * 3);
const posCur = new Float32Array(N * 3);
const seedsArr = new Float32Array(N);
const stateLabel = document.getElementById('stateLabel');

const STATES = [
  { name: 'i · ember vessels', mode: 0 },
  { name: 'ii · dusk veins', mode: 1 },
  { name: 'iii · night pulse', mode: 2 }
];
let currentState = 0;
let nextState = -1;

function rngFrom(seed) {
  let s = seed >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// STATE 0: Vascular — Riley wave-interference on cupped surface with radial pulse channels
function buildVascular(out, seeds, baseSeed) {
  const rng = rngFrom(baseSeed);
  const w1 = { ang: rng()*Math.PI*2, k: 1.6+rng()*1.2, ph: rng()*Math.PI*2 };
  const w2 = { ang: rng()*Math.PI*2, k: 2.1+rng()*1.4, ph: rng()*Math.PI*2 };
  const w3 = { ang: rng()*Math.PI*2, k: 0.8+rng()*0.6, ph: rng()*Math.PI*2 };
  const radK = 1.3 + rng()*0.6;
  const channels = [];
  for (let c = 0; c < 5; c++) channels.push(rng()*Math.PI*2);

  let written = 0, attempts = 0;
  while (written < N && attempts < N*16) {
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th), z = r * Math.sin(th);
    const v1 = Math.sin(x*Math.cos(w1.ang)*w1.k + z*Math.sin(w1.ang)*w1.k + w1.ph);
    const v2 = Math.sin(x*Math.cos(w2.ang)*w2.k + z*Math.sin(w2.ang)*w2.k + w2.ph);
    const v3 = Math.sin(x*Math.cos(w3.ang)*w3.k + z*Math.sin(w3.ang)*w3.k + w3.ph);
    const vR = Math.sin(r * radK);
    const f = (v1+v2+v3+vR)*0.25;
    let chBoost = 0;
    for (let c = 0; c < channels.length; c++) {
      const da = Math.abs(((th - channels[c]) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI);
      chBoost = Math.max(chBoost, Math.exp(-da*da*8) * 0.4);
    }
    const fall = Math.exp(-r*r*0.10);
    const accept = (f > -chBoost) && (rng() < fall * (0.4 + 0.6*Math.max(f,0) + chBoost));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th*petals)*0.18*(r/4);
    const y = -0.15*r*r + scallop;
    out[written*3] = x; out[written*3+1] = y; out[written*3+2] = z;
    seeds[written] = rng();
    written++;
  }
  for (let i = written; i < N; i++) { out[i*3]=0; out[i*3+1]=-5; out[i*3+2]=0; seeds[i]=0; }
}

// STATE 1: Venation — leaf vein network
function buildVenation(out, seeds, baseSeed) {
  const rng = rngFrom(baseSeed);
  const veins = [];
  const midLen = 3.5;
  veins.push({ x0:0, y0:-midLen, x1:0, y1:midLen, w:0.35 });
  const nLat = 7;
  for (let i = 0; i < nLat; i++) {
    const t = (i+1)/(nLat+1);
    const yBase = -midLen + t*midLen*2;
    const side = (i%2===0)?1:-1;
    const ang = (0.35+rng()*0.25)*side;
    const len = (1.8+rng()*1.2)*(1-Math.abs(t-0.5)*0.8);
    const ex = Math.sin(ang)*len, ey = Math.cos(ang)*len*0.3;
    veins.push({ x0:0, y0:yBase, x1:ex, y1:yBase+ey, w:0.18 });
    const nSec = 2+Math.floor(rng()*3);
    for (let j = 0; j < nSec; j++) {
      const s = (j+1)/(nSec+1);
      const bx = ex*s, by = yBase+ey*s;
      const a2 = ang + (0.3+rng()*0.3)*side;
      const l2 = len*0.4*(1-s*0.5);
      veins.push({ x0:bx, y0:by, x1:bx+Math.sin(a2)*l2, y1:by+Math.cos(a2)*l2*0.3, w:0.09 });
    }
  }
  let written = 0;
  while (written < N) {
    const v = veins[Math.floor(rng()*veins.length)];
    const t = rng();
    const px = v.x0 + (v.x1-v.x0)*t;
    const py = v.y0 + (v.y1-v.y0)*t;
    const u1 = rng(), u2 = rng();
    const g = Math.sqrt(-2*Math.log(u1+1e-9))*Math.cos(6.2832*u2);
    const spread = v.w * g;
    const dx = v.y1-v.y0, dy = -(v.x1-v.x0);
    const nl = Math.sqrt(dx*dx+dy*dy)+1e-6;
    const fx = px + (dx/nl)*spread;
    const fy = py + (dy/nl)*spread;
    if ((fx*fx)/(3.2*3.2) + (fy*fy)/(midLen*midLen) > 1) continue;
    const rd = Math.sqrt(fx*fx+fy*fy);
    const fz = -0.06*rd*rd;
    out[written*3]=fx; out[written*3+1]=fy; out[written*3+2]=fz;
    seeds[written]=rng();
    written++;
  }
}

// STATE 2: Peristalsis — tubular vessel with traveling contraction waves
function buildPeristalsis(out, seeds, baseSeed) {
  const rng = rngFrom(baseSeed);
  const tubeLen = 7.0;
  const baseR = 1.2;
  for (let i = 0; i < N; i++) {
    const t = rng();
    const y = (t - 0.5) * tubeLen;
    const th = rng() * Math.PI * 2;
    const constrict = 1.0 - 0.3*Math.sin(t*Math.PI*3 + rng()*0.2);
    const rWall = baseR * constrict * (0.85 + rng()*0.3);
    const x = Math.cos(th) * rWall;
    const z = Math.sin(th) * rWall;
    const twist = t * 0.8;
    const xr = x*Math.cos(twist) - z*Math.sin(twist);
    const zr = x*Math.sin(twist) + z*Math.cos(twist);
    out[i*3] = xr; out[i*3+1] = y; out[i*3+2] = zr;
    seeds[i] = rng();
  }
}

const builders = [buildVascular, buildVenation, buildPeristalsis];
const baseSeed = Math.floor(Math.random()*1e9);

builders[0](posA, seedsArr, baseSeed);
for (let i = 0; i < N*3; i++) posCur[i] = posA[i];

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(posCur, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seedsArr, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0,0) },
  uMode: { value: 0.0 },
  uGloam: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2 uPointer;
    uniform float uMode;
    uniform float uGloam;
    attribute float seed;
    varying float vDepth;
    varying float vSeed;
    varying float vMode;
    varying float vGloam;
    varying float vHeight;
    void main(){
      vec3 p = position;
      float tiltX = uPointer.y * 0.18;
      float tiltZ = -uPointer.x * 0.18;
      float ca=cos(tiltX), sa=sin(tiltX), cb=cos(tiltZ), sb=sin(tiltZ);
      vec3 q = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      float t = uTime * 0.18 + seed * 6.28;

      // Mode 0 (vascular): radial pulsing slowed for dusk
      float r0 = length(p.xz);
      float vascPulse = sin(r0 * 2.5 - uTime * 0.5 + seed * 1.2) * 0.06;
      vec3 qVasc = q;
      qVasc.y += vascPulse;
      qVasc.xz *= 1.0 + vascPulse * 0.3;

      // Mode 1 (venation): slow tidal, the leaf curling inward at dusk
      vec3 qVein = q;
      float leafBreath = sin(uTime * 0.2) * 0.06;
      qVein.y *= 1.0 + leafBreath;
      qVein.x *= 1.0 + leafBreath * 0.5;
      qVein.x += sin(uTime * 0.1 + q.y * 0.4) * 0.06;
      // gloaming curl: edges droop slightly
      float edgeDist = length(p.xz) / 3.2;
      qVein.y -= edgeDist * edgeDist * 0.15 * uGloam;

      // Mode 2 (peristalsis): slower night pulse
      vec3 qPeri = q;
      float tubeT = (p.y / 3.5 + 0.5);
      float wave = sin(tubeT * 6.2832 * 2.0 - uTime * 0.7);
      float squeeze = 1.0 - 0.12 * max(wave, 0.0);
      qPeri.xz *= squeeze;
      qPeri.y += sin(uTime * 0.12 + seed * 3.0) * 0.02;

      vec3 finalP;
      if (uMode < 0.5) { finalP = qVasc; }
      else if (uMode < 1.5) { finalP = qVein; }
      else { finalP = qPeri; }

      // gloaming settling: particles drift downward slightly over time
      finalP.y -= uGloam * seed * 0.25;

      vec4 mv = modelViewMatrix * vec4(finalP, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      vMode = uMode;
      vGloam = uGloam;
      vHeight = finalP.y;
      gl_PointSize = (1.3 + 0.5*sin(t*0.5)) * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vMode;
    varying float vGloam;
    varying float vHeight;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);

      // gloaming palette: each tissue state shifts from warm ember to cool indigo
      // 0 ember vessels: amber-ochre → dusky violet
      vec3 dayA0 = vec3(0.55, 0.28, 0.08);
      vec3 dayB0 = vec3(0.72, 0.42, 0.12);
      vec3 duskA0 = vec3(0.18, 0.10, 0.22);
      vec3 duskB0 = vec3(0.40, 0.18, 0.30);

      // 1 dusk veins: olive-gold → deep teal
      vec3 dayA1 = vec3(0.32, 0.30, 0.08);
      vec3 dayB1 = vec3(0.50, 0.42, 0.14);
      vec3 duskA1 = vec3(0.06, 0.12, 0.18);
      vec3 duskB1 = vec3(0.14, 0.22, 0.28);

      // 2 night pulse: warm rose → deep carmine-black
      vec3 dayA2 = vec3(0.42, 0.12, 0.10);
      vec3 dayB2 = vec3(0.55, 0.20, 0.16);
      vec3 duskA2 = vec3(0.14, 0.04, 0.08);
      vec3 duskB2 = vec3(0.28, 0.06, 0.14);

      vec3 dayA, dayB, dA, dB;
      if (vMode < 0.5) { dayA=dayA0; dayB=dayB0; dA=duskA0; dB=duskB0; }
      else if (vMode < 1.5) { dayA=dayA1; dayB=dayB1; dA=duskA1; dB=duskB1; }
      else { dayA=dayA2; dayB=dayB2; dA=duskA2; dB=duskB2; }

      // height-based gloaming: upper particles darken first (light drains from top)
      float heightFade = smoothstep(-2.0, 3.0, vHeight);
      float localGloam = clamp(vGloam + heightFade * 0.3, 0.0, 1.0);

      vec3 inkA = mix(dayA, dA, localGloam);
      vec3 inkB = mix(dayB, dB, localGloam);
      vec3 col = mix(inkA, inkB, smoothstep(0.0, 1.0, vSeed));

      // atmospheric haze shifts to cool blue at depth in gloaming
      vec3 hazeDay = vec3(0.85, 0.78, 0.62);
      vec3 hazeDusk = vec3(0.15, 0.14, 0.24);
      vec3 hazeCol = mix(hazeDay, hazeDusk, vGloam);
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, hazeCol, haze);

      // slight ember glow on bottom particles
      float emberGlow = (1.0 - heightFade) * vGloam * 0.15;
      col += vec3(0.5, 0.2, 0.05) * emberGlow;

      float alphaFade = 1.0 - vGloam * 0.15;
      gl_FragColor = vec4(col, a * 0.78 * alphaFade * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── FIREFLY DUST — replaces bright dust motes with intermittent warm sparks
const N_DUST = 300;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST*3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]=(Math.random()-0.5)*14;
  dustPos[i*3+1]=(Math.random()-0.5)*8;
  dustPos[i*3+2]=(Math.random()-0.5)*8;
  dustSeed[i]=Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uGloam: uniforms.uGloam },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime; uniform float uPixel; uniform float uGloam;
    attribute float seed; varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime*0.08 + seed*6.28;
      p.x += sin(t*1.1+seed*30.0)*0.5;
      p.y -= mod(uTime*0.06+seed*7.0,4.0)-2.0;
      p.z += cos(t*0.9+seed*22.0)*0.4;
      // firefly blink: intermittent glow
      float blink = pow(max(sin(uTime*0.8+seed*43.7),0.0), 6.0);
      float ambient = 0.08;
      vGlow = mix(ambient, ambient + blink * 0.9, uGloam);
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = (0.8+2.0*vGlow)*uPixel*(4.0/-mv.z);
      gl_Position = projectionMatrix*mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*20.0);
      // warm amber firefly color
      vec3 col = vec3(1.0, 0.72, 0.28) * vGlow;
      gl_FragColor=vec4(col, a*0.85*vGlow);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

// ── CROSSFADE + STATE CYCLING
const FADE_DUR = 1.4;
let fadeStart = 0;
let fading = false;

function startTransition() {
  nextState = (currentState + 1) % 3;
  const tempSeeds = new Float32Array(N);
  builders[nextState](posB, tempSeeds, baseSeed + nextState * 7919);
  for (let i = 0; i < N*3; i++) posA[i] = posCur[i];
  for (let i = 0; i < N; i++) seedsArr[i] = tempSeeds[i];
  geom.attributes.seed.needsUpdate = true;
  fading = true;
  fadeStart = performance.now()/1000;
  stateLabel.style.opacity = '0.25';
}

function updateCrossfade(t) {
  if (!fading) return;
  const elapsed = t - fadeStart;
  const alpha = Math.min(elapsed / FADE_DUR, 1.0);
  const s = alpha * alpha * (3 - 2 * alpha);
  for (let i = 0; i < N*3; i++) {
    posCur[i] = posA[i] + (posB[i] - posA[i]) * s;
  }
  geom.attributes.position.needsUpdate = true;
  uniforms.uMode.value = STATES[currentState].mode + (STATES[nextState].mode - STATES[currentState].mode) * s;
  if (alpha >= 1.0) {
    fading = false;
    currentState = nextState;
    uniforms.uMode.value = STATES[currentState].mode;
    stateLabel.textContent = STATES[currentState].name;
    stateLabel.style.opacity = '0.55';
  }
}

addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX/innerWidth)*2-1, (e.clientY/innerHeight)*2-1
  );
});
addEventListener('click', () => { if (!fading) startTransition(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now()-start)/1000;
  uniforms.uTime.value = t;

  // gloaming cycle: slow 60s breathing between late-afternoon and deep dusk
  // James Turrell twilight observation — light changes imperceptibly
  const gloamCycle = (Math.sin(t * 0.1047 - 1.57) + 1.0) * 0.5; // ~60s period, starts dim
  uniforms.uGloam.value = 0.3 + gloamCycle * 0.7;

  updateCrossfade(t);

  // camera drift — slower, more contemplative for gloaming
  camera.position.x = Math.sin(t*0.035)*0.5;
  camera.position.y = 0.15 + Math.sin(t*0.028+1.0)*0.2;
  camera.position.z = 11.5 + Math.sin(t*0.02)*0.5;
  camera.lookAt(0, -0.1, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
