<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vi9 · Shiota — the heart remembers</title>
<!-- MOTION: sway, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">vi9</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040101, 0.014);

const camera = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.25));

const pL = new THREE.PointLight(0xffe4cc, 0.5, 45, 1.6);
pL.position.set(-2.0, 10.0, 3.0);
scene.add(pL);

let seed = 47291836;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — architectural volume
const ROOM = { w: 32, h: 22, d: 40 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a moon within the circulatory cosmos
const spherePos = new THREE.Vector3(0.8, 0.5, -0.5);
const sphereRadius = 1.85;
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece0,
  emissive: 0xf2ece0,
  emissiveIntensity: 0.6,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.55
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

// Suspension wires — thin dark lines from ceiling to sphere top
const suspWireGeo = new THREE.BufferGeometry();
const swPts = new Float32Array([
  spherePos.x - 0.3, hh, spherePos.z + 0.1,
  spherePos.x, spherePos.y + sphereRadius, spherePos.z,
  spherePos.x + 0.25, hh, spherePos.z - 0.15,
  spherePos.x, spherePos.y + sphereRadius, spherePos.z
]);
suspWireGeo.setAttribute('position', new THREE.BufferAttribute(swPts, 3));
suspWireGeo.setIndex([0,1, 2,3]);
scene.add(new THREE.LineSegments(suspWireGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a06, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    spherePos.x + Math.sin(phi)*Math.cos(theta)*sphereRadius,
    spherePos.y + Math.cos(phi)*sphereRadius,
    spherePos.z + Math.sin(phi)*Math.sin(theta)*sphereRadius
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — icosahedral skeleton + dense shell around sphere
const NUM_ANCHORS = 1100;
const anchors = [];

const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  anchors.push(new THREE.Vector3(
    v[0]*8.0 + spherePos.x,
    v[1]*6.0 + spherePos.y,
    v[2]*8.0 + spherePos.z
  ));
}

// Suspension ceiling anchors
const suspAnchors = [];
for(let i=0; i<12; i++){
  const p = new THREE.Vector3(
    spherePos.x + (rng()-0.5)*7.0,
    hh,
    spherePos.z + (rng()-0.5)*7.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [];
for(let i=0; i<3; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*14,
      spherePos.y + (rng()-0.5)*10,
      spherePos.z + (rng()-0.5)*14
    ),
    r: 2.2 + rng()*2.0
  });
}
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense shell anchors around sphere at varying distances
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.45){
    // Radial shell around sphere — blood vessels converging
    p = sphereSurf();
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p.add(dir.multiplyScalar(1.0 + rng()*6.5));
  } else if(r < 0.72){
    p = wallPt();
    p.lerp(spherePos, 0.15 + rng()*0.5);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// Radial quantization near sphere (Molnár)
function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 9) return p;
  const strength = Math.max(0, 1 - d/9);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snapAngle = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snapAngle) * snapAngle;
  const blended = theta + (snapped - theta) * strength * 0.45;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-spherePos.x, dy = my-spherePos.y, dz = mz-spherePos.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Suspension threads — ceiling to sphere top hemisphere
for(const sa of suspAnchors){
  for(let j=0; j<6; j++){
    const target = sphereSurf();
    if(target.y < spherePos.y) target.y = spherePos.y + rng()*sphereRadius;
    setLine(sa, target);
  }
}

// Cat A: threads converging on sphere (52%) — blood vessels to the heart
const catA = Math.floor(NUM_LINES * 0.52);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  // 8% stop short — almost touching but failing to reach (Quayola gap)
  if(rng() < 0.08){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng()*1.5));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: wall-to-wall structural web (20%)
const catB = Math.floor(NUM_LINES * 0.20);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 16 && rng() > 0.05){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat C: dendritic branching — short local filaments
while(li < NUM_LINES - 60){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < 5.0){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Y-fork branching — dendritic growth
  if(rng() < 0.28 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.25 + rng()*0.4);
    const branchDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branchEnd = mid.clone().add(branchDir.multiplyScalar(0.7 + rng()*2.0));
    if(!inVoid(branchEnd)){
      setLine(mid, branchEnd);
      if(rng() < 0.22 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(branchEnd, 0.5);
        const dir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const end2 = mid2.clone().add(dir2.multiplyScalar(0.4 + rng()*0.9));
        if(!inVoid(end2)) setLine(mid2, end2);
      }
    }
  }
}

// Fill remaining toward sphere
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)) setLine(a, sphereSurf());
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred matter, stones, memory debris caught in the web
const NUM_FRAGS = 32;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.025 + rng()*0.1;
  const geo = rng()>0.55
    ? new THREE.BoxGeometry(sz*(1.4+rng()*2.0), sz*0.015, sz*(0.5+rng()*1.0))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.18),
    transparent: true,
    opacity: 0.22 + rng()*0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Scatter through the web volume, clustered nearer sphere
  if(rng() < 0.6){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    mesh.position.copy(spherePos).add(dir.multiplyScalar(2.5 + rng()*6.0));
  } else {
    const si = Math.floor(rng()*li)*6;
    const t = 0.2 + rng()*0.6;
    mesh.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  }
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — slow drift inside the web, intimate proximity
const pathLen = 480;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = spherePos.x, cy = spherePos.y, cz = spherePos.z;
  // Elliptical orbit with height variation — inside the web, not outside
  const x = cx + Math.sin(p)*6.5 + Math.sin(p*1.4+0.7)*2.0;
  const y = cy + 0.3 + Math.sin(p*0.4+0.5)*4.2 + Math.cos(p*0.3)*0.8;
  const z = cz + Math.cos(p)*8.0 + Math.cos(p*0.65+1.2)*2.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── THREAD MICRO-BREATHING — imperceptible anchor jitter (<0.5% variation)
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0018 * Math.max(0, 1.0 - dist / 18.0);
    const phase = basePositions[idx]*0.25 + basePositions[idx+1]*0.45 + i*0.0025;
    const breath = Math.sin(t*0.05 + phase) * amp;
    for(let v=0; v<2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.55;
      arr[vi+1] = basePositions[vi+1] + breath*0.3;
      arr[vi+2] = basePositions[vi+2] + breath*0.4;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — inside the web
  const speed = 0.0018;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at sphere center with slow wander
  const look = spherePos.clone();
  look.x += Math.sin(t*0.007)*0.4;
  look.y += Math.cos(t*0.005)*0.3;
  camera.lookAt(look);

  // Light slow wander — one warm source, darkness is the primary material
  pL.position.x = -2.0 + Math.sin(t*0.004)*1.2;
  pL.position.y = 10.0 + Math.cos(t*0.003)*0.5;
  pL.position.z = 3.0 + Math.cos(t*0.006)*0.9;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
