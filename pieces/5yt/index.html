<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import {Line2} from 'three/addons/lines/Line2.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
import {LineGeometry} from 'three/addons/lines/LineGeometry.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,200);
camera.position.set(3,-9,22);
camera.lookAt(0,-1,0);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x050610,1);
document.body.appendChild(renderer.domElement);

/* ── web topology (from v0f) ── */
const N_RAD=20, N_SP=7, WEB_R=12, DOME=2.8, PPR=12;
const SP_T=[0.10,0.20,0.33,0.46,0.60,0.76,0.92];

const anchors=[];
for(let i=0;i<N_RAD;i++){
  const a=i/N_RAD*Math.PI*2;
  const r=WEB_R*(0.93+0.07*Math.sin(i*2.9+1.1));
  anchors.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));
}

const hubBase=new THREE.Vector3(0,-DOME,0);
const hub=hubBase.clone();

function rp(i,t,h){
  const a=anchors[i];
  return[h.x*(1-t)+a.x*t, h.y*(1-t)+a.y*t, h.z*(1-t)+a.z*t];
}

/* ── radial threads ── */
const radMat=new THREE.LineBasicMaterial({color:0xb0aaa0,transparent:true,opacity:0.35});
const rads=[];
for(let i=0;i<N_RAD;i++){
  const pos=new Float32Array((PPR+1)*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const l=new THREE.Line(g,radMat);
  scene.add(l); rads.push({pos,g});
}

function updateRads(h){
  for(let i=0;i<N_RAD;i++){
    const{pos,g}=rads[i];
    for(let j=0;j<=PPR;j++){
      const t=j/PPR;
      const[x,y,z]=rp(i,t,h);
      pos[j*3]=x;pos[j*3+1]=y;pos[j*3+2]=z;
    }
    g.attributes.position.needsUpdate=true;
  }
}

/* ── spiral capture threads ── */
const spN=N_SP*N_RAD, spPos=new Float32Array(spN*6);
const spG=new THREE.BufferGeometry();
spG.setAttribute('position',new THREE.BufferAttribute(spPos,3));
const spMat=new THREE.LineBasicMaterial({color:0xa8a290,transparent:true,opacity:0.18});
scene.add(new THREE.LineSegments(spG,spMat));

function updateSpirals(h){
  let k=0;
  for(let s=0;s<N_SP;s++){
    const t=SP_T[s];
    for(let i=0;i<N_RAD;i++){
      const[x1,y1,z1]=rp(i,t,h);
      const[x2,y2,z2]=rp((i+1)%N_RAD,t,h);
      spPos[k++]=x1;spPos[k++]=y1;spPos[k++]=z1;
      spPos[k++]=x2;spPos[k++]=y2;spPos[k++]=z2;
    }
  }
  spG.attributes.position.needsUpdate=true;
}

/* ── second web plane (background depth) ── */
const web2=new THREE.Group();
web2.position.set(5,3,-7);
web2.rotation.x=0.55; web2.rotation.z=0.3;
web2.scale.setScalar(0.45);
const w2Mat=new THREE.LineBasicMaterial({color:0x556680,transparent:true,opacity:0.06});
for(let i=0;i<N_RAD;i+=2){
  const pts=[];
  for(let j=0;j<=PPR;j++){
    const t=j/PPR;
    const[x,y,z]=rp(i,t,hubBase);
    pts.push(new THREE.Vector3(x,y,z));
  }
  web2.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),w2Mat));
}
for(let s=0;s<N_SP;s+=2){
  const t=SP_T[s];
  for(let i=0;i<N_RAD;i++){
    const[x1,y1,z1]=rp(i,t,hubBase);
    const[x2,y2,z2]=rp((i+1)%N_RAD,t,hubBase);
    const g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x1,y1,z1),new THREE.Vector3(x2,y2,z2)]);
    web2.add(new THREE.Line(g,w2Mat));
  }
}
scene.add(web2);

/* ── anchor cables ── */
const cabMat=new LineMaterial({
  color:0x7a7668,linewidth:0.06,worldUnits:true,
  transparent:true,opacity:0.3
});
cabMat.resolution.set(innerWidth,innerHeight);
const wallPts=[[18,8,14],[-16,10,-12],[14,12,-16],[-12,6,18],[0,14,0],[10,11,10]];
for(let c=0;c<wallPts.length;c++){
  const ai=Math.floor(c*N_RAD/wallPts.length);
  const a=anchors[ai];
  const[wx,wy,wz]=wallPts[c];
  const mx=(a.x+wx)/2, my=(a.y+wy)/2-1.2, mz=(a.z+wz)/2;
  const cg=new LineGeometry();
  cg.setPositions([wx,wy,wz, mx,my,mz, a.x,a.y,a.z]);
  scene.add(new Line2(cg,cabMat));
}

/* ── dew drops (star-like, with twinkle) ── */
const dewN=N_SP*N_RAD, dewPos=new Float32Array(dewN*3);
const dewG=new THREE.BufferGeometry();
dewG.setAttribute('position',new THREE.BufferAttribute(dewPos,3));
const dewMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0}},
  vertexShader:`
    uniform float uTime;
    varying float vP;
    varying float vId;
    void main(){
      float id=float(gl_VertexID);
      vId=id;
      float phase=id*0.618+sin(id*1.31)*2.7;
      float slow=sin(uTime*0.4+phase)*0.5+0.5;
      float flicker=sin(uTime*2.3+id*3.7)*0.5+0.5;
      vP=slow*0.7+flicker*0.3;
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=mix(1.5,5.0,vP)*(280.0/-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying float vP;
    varying float vId;
    void main(){
      float d=length(gl_PointCoord-0.5)*2.0;
      float core=smoothstep(1.0,0.1,d);
      float halo=smoothstep(1.0,0.4,d)*0.3;
      float a=(core+halo)*mix(0.15,0.6,vP);
      vec3 warm=vec3(0.78,0.70,0.52);
      vec3 cool=vec3(0.65,0.72,0.80);
      float mix_t=sin(vId*0.37)*0.5+0.5;
      vec3 c=mix(warm,cool,mix_t);
      gl_FragColor=vec4(c*1.1,a);
    }`
});
scene.add(new THREE.Points(dewG,dewMat));

function updateDew(h){
  let k=0;
  for(let s=0;s<N_SP;s++){
    const t=SP_T[s];
    for(let i=0;i<N_RAD;i++){
      const[x,y,z]=rp(i,t,h);
      dewPos[k++]=x;dewPos[k++]=y;dewPos[k++]=z;
    }
  }
  dewG.attributes.position.needsUpdate=true;
}

/* ── hub glow ── */
const glwG=new THREE.BufferGeometry();
glwG.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3),3));
scene.add(new THREE.Points(glwG,new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:`void main(){
    vec4 mv=modelViewMatrix*vec4(position,1.0);
    gl_PointSize=140.0*(280.0/-mv.z);
    gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`void main(){
    float d=length(gl_PointCoord-0.5)*2.0;
    gl_FragColor=vec4(vec3(0.55,0.52,0.42),smoothstep(1.0,0.0,d)*0.025);}`
})));

/* ── ghost reflection ── */
const ghostMat=new THREE.LineBasicMaterial({color:0x445566,transparent:true,opacity:0.04});
const ghost=new THREE.Group();
ghost.scale.set(0.82,0.82,0.82);
ghost.position.y=-6;
for(let i=0;i<N_RAD;i+=3){
  const pts=[];
  for(let j=0;j<=PPR;j++){
    const t=j/PPR;
    const[x,y,z]=rp(i,t,hubBase);
    pts.push(new THREE.Vector3(x,-y,z));
  }
  ghost.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),ghostMat));
}
scene.add(ghost);

/* ── background star field (very faint, deep) ── */
const starN=80, starArr=new Float32Array(starN*3);
for(let i=0;i<starN;i++){
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=35+Math.random()*40;
  starArr[i*3]=Math.sin(phi)*Math.cos(theta)*r;
  starArr[i*3+1]=Math.sin(phi)*Math.sin(theta)*r-5;
  starArr[i*3+2]=Math.cos(phi)*r;
}
const starG=new THREE.BufferGeometry();
starG.setAttribute('position',new THREE.BufferAttribute(starArr,3));
scene.add(new THREE.Points(starG,new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0}},
  vertexShader:`
    uniform float uTime;
    varying float vB;
    void main(){
      float id=float(gl_VertexID);
      vB=0.3+0.7*(sin(uTime*0.15+id*2.13)*0.5+0.5);
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=mix(0.8,2.0,vB)*(200.0/-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying float vB;
    void main(){
      float d=length(gl_PointCoord-0.5)*2.0;
      float a=smoothstep(1.0,0.2,d)*0.08*vB;
      gl_FragColor=vec4(vec3(0.7,0.72,0.78),a);
    }`
})));

/* ── silk-caught dust ── */
const dustN=40, dustArr=new Float32Array(dustN*3);
for(let i=0;i<dustN;i++){
  const a=Math.random()*Math.PI*2, r=2+Math.random()*10;
  dustArr[i*3]=Math.cos(a)*r;
  dustArr[i*3+1]=-DOME*0.4+(Math.random()-0.5)*1.2;
  dustArr[i*3+2]=Math.sin(a)*r;
}
const dustG=new THREE.BufferGeometry();
dustG.setAttribute('position',new THREE.BufferAttribute(dustArr,3));
scene.add(new THREE.Points(dustG,new THREE.PointsMaterial({
  color:0x445566,size:0.4,transparent:true,opacity:0.08})));

/* ── APOPHENIA: constellation traces ── */
// Each group: array of [spiral_idx, radial_idx] pairs
// Sparse, ambiguous figures the mind might read as something
const cGroups=[
  [[3,5],[5,7],[6,10],[5,13],[3,15]],          // bird? wings spread?
  [[4,0],[5,2],[5,5],[4,7]],                    // eye? crescent?
  [[2,10],[3,8],[4,10],[3,12],[2,10]],          // diamond? pupil?
  [[1,15],[3,14],[5,13],[6,15]],                // reach? hand?
  [[3,3],[4,5],[5,4],[5,2],[4,1],[3,3]],        // pentagon? skull?
  [[2,17],[4,18],[6,19],[4,0],[2,1]],           // arrow? fish?
  [[1,7],[2,5],[3,4],[4,5],[5,7],[4,9],[3,9]],  // question mark? serpent?
];

const CYCLE=58, DRAW_T=10, HOLD_T=7, FADE_T=8;
const cLines=[];

for(let ci=0;ci<cGroups.length;ci++){
  const grp=cGroups[ci];
  const n=grp.length;
  const pos=new Float32Array(n*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setDrawRange(0,0);
  const mat=new THREE.LineBasicMaterial({
    color:0xc9a86a,transparent:true,opacity:0,
    depthWrite:false,blending:THREE.AdditiveBlending
  });
  const line=new THREE.Line(g,mat);
  scene.add(line);
  // Highlight points at constellation vertices
  const hPos=new Float32Array(n*3);
  const hG=new THREE.BufferGeometry();
  hG.setAttribute('position',new THREE.BufferAttribute(hPos,3));
  const hMat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uOp:{value:0}},
    vertexShader:`
      uniform float uOp;
      void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_PointSize=mix(3.0,7.0,uOp)*(280.0/-mv.z);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform float uOp;
      void main(){
        float d=length(gl_PointCoord-0.5)*2.0;
        float a=smoothstep(1.0,0.0,d)*uOp*0.4;
        gl_FragColor=vec4(vec3(0.82,0.72,0.45),a);
      }`
  });
  const hPts=new THREE.Points(hG,hMat);
  scene.add(hPts);
  cLines.push({pos,g,mat,grp,hPos,hG,hMat,hPts});
}

function updateConstellations(t,h){
  let maxOp=0;
  for(let ci=0;ci<cGroups.length;ci++){
    const cl=cLines[ci];
    const grp=cl.grp;
    const n=grp.length;
    // Update positions
    for(let j=0;j<n;j++){
      const[s,i]=grp[j];
      const[x,y,z]=rp(i,SP_T[s],h);
      cl.pos[j*3]=x; cl.pos[j*3+1]=y; cl.pos[j*3+2]=z;
      cl.hPos[j*3]=x; cl.hPos[j*3+1]=y; cl.hPos[j*3+2]=z;
    }
    cl.g.attributes.position.needsUpdate=true;
    cl.hG.attributes.position.needsUpdate=true;
    // Phase: stagger each constellation
    const phase=ci*CYCLE/cGroups.length;
    const localT=((t-phase)%CYCLE+CYCLE)%CYCLE;
    let opacity=0, drawCount=0;
    if(localT<DRAW_T){
      const f=localT/DRAW_T;
      const ef=f*f*(3-2*f); // smoothstep ease
      drawCount=Math.max(2,Math.floor(ef*n));
      opacity=0.12*ef;
    }else if(localT<DRAW_T+HOLD_T){
      drawCount=n;
      const holdF=(localT-DRAW_T)/HOLD_T;
      opacity=0.12+0.06*Math.sin(holdF*Math.PI); // gentle pulse at peak
    }else if(localT<DRAW_T+HOLD_T+FADE_T){
      const f=1-(localT-DRAW_T-HOLD_T)/FADE_T;
      drawCount=n;
      opacity=0.12*f*f;
    }
    cl.mat.opacity=opacity;
    cl.hMat.uniforms.uOp.value=opacity/0.12;
    cl.g.setDrawRange(0,drawCount);
    if(opacity>maxOp) maxOp=opacity;
  }
  return maxOp;
}

/* ── double pendulum ODE (from v0f) ── */
let th1=2.8,th2=2.1,w1=0,w2=0;
const GP=9.81,L1=1,L2=1,m1=1,m2=1,gam=0.12;

function dv(t1,t2,o1,o2){
  const d=t1-t2,s=Math.sin(d),c=Math.cos(d);
  const den1=L1*(2*m1+m2-m2*Math.cos(2*d));
  const den2=L2*(2*m1+m2-m2*Math.cos(2*d));
  return[o1,o2,
    (-GP*(2*m1+m2)*Math.sin(t1)-m2*GP*Math.sin(t1-2*t2)
     -2*s*m2*(o2*o2*L2+o1*o1*L1*c))/den1-gam*o1,
    (2*s*(o1*o1*L1*(m1+m2)+GP*(m1+m2)*Math.cos(t1)
     +o2*o2*L2*m2*c))/den2-gam*o2];
}

function rk4(t1,t2,o1,o2,dt){
  const a=dv(t1,t2,o1,o2);
  const b=dv(t1+a[0]*dt/2,t2+a[1]*dt/2,o1+a[2]*dt/2,o2+a[3]*dt/2);
  const c=dv(t1+b[0]*dt/2,t2+b[1]*dt/2,o1+b[2]*dt/2,o2+b[3]*dt/2);
  const d=dv(t1+c[0]*dt,t2+c[1]*dt,o1+c[2]*dt,o2+c[3]*dt);
  return[t1+(a[0]+2*b[0]+2*c[0]+d[0])*dt/6,
         t2+(a[1]+2*b[1]+2*c[1]+d[1])*dt/6,
         o1+(a[2]+2*b[2]+2*c[2]+d[2])*dt/6,
         o2+(a[3]+2*b[3]+2*c[3]+d[3])*dt/6];
}

for(let i=0;i<600;i++)[th1,th2,w1,w2]=rk4(th1,th2,w1,w2,0.016);

updateRads(hubBase); updateSpirals(hubBase); updateDew(hubBase);

/* ── resize ── */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  cabMat.resolution.set(innerWidth,innerHeight);
});

/* ── loop ── */
const DRIFT=0.35, paramEl=document.getElementById('param');
let lastT=performance.now();

function loop(){
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;

  for(let s=0;s<3;s++)[th1,th2,w1,w2]=rk4(th1,th2,w1,w2,dt*0.004);

  hub.set(
    Math.sin(th1)*DRIFT,
    -DOME+Math.sin(th1+th2)*DRIFT*0.3,
    Math.sin(th2)*DRIFT
  );

  updateRads(hub); updateSpirals(hub); updateDew(hub);

  const pa=glwG.attributes.position.array;
  pa[0]=hub.x;pa[1]=hub.y;pa[2]=hub.z;
  glwG.attributes.position.needsUpdate=true;

  const tSec=now/1000;
  dewMat.uniforms.uTime.value=tSec;

  const recog=updateConstellations(tSec,hub);
  paramEl.textContent='recognition: '+(recog/0.18).toFixed(3);

  const ct=now*0.000025;
  camera.position.x=3+Math.sin(ct)*1.4;
  camera.position.y=-9+Math.sin(ct*0.6)*0.4;
  camera.position.z=22;
  camera.lookAt(0,-1,0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
})();
</script>
</body>
</html>
