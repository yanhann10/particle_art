<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MOTION: sway, intensity: gentle -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t36 · thread memory (shiota)</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#08060a; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">t36</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

/* ─── renderer ─── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08060a, 1);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 15);
camera.lookAt(0, 0.4, 0);

/* ─── dress silhouette (LatheGeometry) ─── */
const profile = [
  new THREE.Vector2(0.00,  3.30),
  new THREE.Vector2(0.10,  3.15),
  new THREE.Vector2(0.26,  2.75),
  new THREE.Vector2(0.40,  2.30),
  new THREE.Vector2(0.36,  1.80),
  new THREE.Vector2(0.30,  1.20),
  new THREE.Vector2(0.36,  0.55),
  new THREE.Vector2(0.60, -0.20),
  new THREE.Vector2(1.00, -1.20),
  new THREE.Vector2(1.35, -2.20),
  new THREE.Vector2(1.50, -2.85),
];
const dressGeo = new THREE.LatheGeometry(profile, 28);
const dressMesh = new THREE.Mesh(dressGeo, new THREE.MeshBasicMaterial());

/* subtle ghost of the dress — dark, barely there */
const dressVis = new THREE.Mesh(dressGeo, new THREE.MeshBasicMaterial({
  color: 0x1c0909, transparent: true, opacity: 0.10, side: THREE.DoubleSide
}));
scene.add(dressVis);

/* ─── sample dress surface ─── */
const sampler = new MeshSurfaceSampler(dressMesh).build();
const _p = new THREE.Vector3();
const NSAMP = 2400;
const dressPoints = [];
for (let i = 0; i < NSAMP; i++) {
  sampler.sample(_p);
  dressPoints.push(_p.clone());
}

/* ─── room anchors ─── */
const RX = 9.5, RZ = 9.5, YF = -5.5, YC = 9.0;
function roomAnchor() {
  const r = Math.random();
  if (r < 0.38) {                         /* floor */
    return new THREE.Vector3((Math.random()*2-1)*RX, YF+Math.random()*0.4, (Math.random()*2-1)*RZ);
  } else if (r < 0.78) {                  /* walls */
    const y = YF + Math.random()*(YC-YF);
    const s = Math.floor(Math.random()*4);
    if (s===0) return new THREE.Vector3(-RX, y, (Math.random()*2-1)*RZ);
    if (s===1) return new THREE.Vector3( RX, y, (Math.random()*2-1)*RZ);
    if (s===2) return new THREE.Vector3((Math.random()*2-1)*RX, y, -RZ);
    return new THREE.Vector3((Math.random()*2-1)*RX, y, RZ);
  } else {                                /* ceiling */
    return new THREE.Vector3((Math.random()*2-1)*RX*0.5, YC-Math.random()*0.3, (Math.random()*2-1)*RZ*0.5);
  }
}

/* ─── build thread geometry ─── */
const N_LONG = 10000, N_SHORT = 3200, N_SUSP = 250;
const TOTAL = N_LONG + N_SHORT + N_SUSP;
const pos  = new Float32Array(TOTAL * 6);
const flex = new Float32Array(TOTAL * 2);
const ph   = new Float32Array(TOTAL * 2);
const alV  = new Float32Array(TOTAL * 2);   /* per-vertex alpha variation */

let pi = 0, vi = 0;
function pushSeg(a, b, fA, fB) {
  pos[pi++]=a.x; pos[pi++]=a.y; pos[pi++]=a.z;
  pos[pi++]=b.x; pos[pi++]=b.y; pos[pi++]=b.z;
  const aVar = 0.45 + Math.random()*0.55;
  flex[vi]=fA; ph[vi]=Math.random(); alV[vi]=aVar; vi++;
  flex[vi]=fB; ph[vi]=Math.random(); alV[vi]=aVar; vi++;
}
function rDress() { return dressPoints[Math.floor(Math.random()*NSAMP)]; }

/* A: dress → room */
for (let i=0; i<N_LONG; i++) pushSeg(rDress(), roomAnchor(), 0.35, 0.04);
/* B: dress → dress */
for (let i=0; i<N_SHORT; i++) pushSeg(rDress(), rDress(), 0.22, 0.22);
/* C: suspension (top of dress → ceiling) */
for (let i=0; i<N_SUSP; i++) {
  let dp = rDress();
  for (let t=0; t<40; t++) { dp = rDress(); if(dp.y > 1.5) break; }
  const cp = new THREE.Vector3(
    dp.x*0.25+(Math.random()-0.5)*0.4, YC, dp.z*0.25+(Math.random()-0.5)*0.4);
  pushSeg(dp, cp, 0.12, 0.0);
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('flex',     new THREE.BufferAttribute(flex, 1));
geo.setAttribute('phase',    new THREE.BufferAttribute(ph, 1));
geo.setAttribute('alphaV',   new THREE.BufferAttribute(alV, 1));

/* ─── thread material: crimson on void ─── */
const threadMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0 },
    uPointer: { value: new THREE.Vector2(0, 0) },
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float flex;
    attribute float phase;
    attribute float alphaV;
    uniform float uTime;
    uniform vec2  uPointer;
    varying float vAlpha;

    void main() {
      vec3 p = position;
      float t = uTime * 0.35;
      float ph = phase * 6.2832;

      /* breathing sway — sinusoidal, small, distinct per strand */
      p.x += sin(t + ph + p.y*0.28) * flex * 0.14;
      p.z += cos(t*0.65 + ph + p.y*0.22) * flex * 0.11;
      p.y += sin(t*0.45 + ph) * flex * 0.035;

      /* pointer push */
      p.x += uPointer.x * flex * 0.45;
      p.z += uPointer.y * flex * 0.35;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* depth fade */
      vAlpha = alphaV * smoothstep(45.0, 3.0, dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      /* crimson #9c1f1f — shifted slightly warm */
      vec3 col = vec3(0.612, 0.122, 0.122);
      gl_FragColor = vec4(col, 0.065 * vAlpha);
    }
  `
});
const threads = new THREE.LineSegments(geo, threadMat);
scene.add(threads);

/* ─── vignette + grain overlay ─── */
const hudScene  = new THREE.Scene();
const hudCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const vigMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c = vUv - 0.5;
      float vig = dot(c, c);
      /* film grain — animated */
      float g = fract(sin(dot(vUv*vec2(1347.17,2491.63)+uTime*0.7, vec2(12.9898,78.233)))*43758.5453);
      g = (g - 0.5) * 0.025;
      float a = smoothstep(0.12, 0.72, vig) * 0.48;
      gl_FragColor = vec4(vec3(g*0.4), a + abs(g)*0.35);
    }
  `
});
hudScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), vigMat));

/* ─── pointer ─── */
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
addEventListener('pointermove', e => {
  ptr.tx = (e.clientX / innerWidth  - 0.5) * 2;
  ptr.ty = (e.clientY / innerHeight - 0.5) * 2;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── loop ─── */
function loop(now) {
  const t = now * 0.001;

  /* ease pointer */
  ptr.x += (ptr.tx - ptr.x) * 0.04;
  ptr.y += (ptr.ty - ptr.y) * 0.04;

  threadMat.uniforms.uTime.value = t;
  threadMat.uniforms.uPointer.value.set(ptr.x * 0.25, ptr.y * 0.25);
  vigMat.uniforms.uTime.value = t;

  /* very slow orbit — architectural contemplation */
  const ang = t * 0.05;
  const rad = 14.5;
  camera.position.x = Math.sin(ang) * rad;
  camera.position.z = Math.cos(ang) * rad;
  camera.position.y = 1.0 + Math.sin(t * 0.025) * 0.6;
  camera.lookAt(0, 0.3, 0);

  renderer.clear();
  renderer.render(scene, camera);
  renderer.render(hudScene, hudCamera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
