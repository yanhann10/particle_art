<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w7k · winking vessel · surprise turn</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">w7k · winking vessel · peristaltic surprise</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from t9w · vascular tower + wink</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Inherited vascular tower from t9w. SURPRISE: a peristaltic "wink" —
// a traveling constriction squeezes the vessel shut at one height, then
// releases, like a Meret Oppenheim fur-cup moment: biological form
// suddenly does something intimate and disarming. The pinch travels
// upward every ~5s, briefly blushes warm pink at the squeeze point,
// then the tower recovers its composure.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.04);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff0e8, 0.9);
lightKey.position.set(5, 10, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const lightRim = new THREE.DirectionalLight(0x88aacc, 0.4);
lightRim.position.set(-5, 3, -5);
scene.add(lightRim);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (3D, inherited from 5gm→t9w)
const MAX_VERTS = 1500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── vascular tube with WINK (peristaltic pinch)
// Technique ref: Meret Oppenheim's uncanny biological surprise —
// the form is orderly, then briefly intimate, then recovers.

let tubeMesh = null;

// Custom material: vertex colors allow the wink blush
const tubeMat = new THREE.MeshStandardMaterial({
  color:        0xb04438,
  emissive:     0x2a0808,
  roughness:    0.5,
  metalness:    0.05,
  vertexColors: true,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Wink timing: 5.5s cycle. The pinch travels from bottom to top over ~1.2s,
// then 4.3s of calm before the next wink. Asymmetric timing = comic beat.
const WINK_CYCLE   = 5.5;
const WINK_TRAVEL  = 1.2;   // seconds for pinch to traverse full height
const WINK_WIDTH   = 0.12;  // fraction of height the pinch spans
const WINK_DEPTH   = 0.92;  // how much radius is removed at max squeeze (0–1)

function winkFactor(heightFrac, t){
  // Returns 0 = no squeeze, 1 = full squeeze
  const phase = (t % WINK_CYCLE) / WINK_CYCLE;
  const travelPhase = WINK_TRAVEL / WINK_CYCLE;
  if (phase > travelPhase) return 0; // calm period

  const pinchCenter = phase / travelPhase; // 0→1 as it travels up
  const dist = Math.abs(heightFrac - pinchCenter);
  if (dist > WINK_WIDTH) return 0;
  // smooth bell-curve squeeze
  const x = dist / WINK_WIDTH;
  return Math.pow(Math.cos(x * Math.PI * 0.5), 2);
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 2; s++) step();

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){ if (v.y < yMin) yMin = v.y; if (v.y > yMax) yMax = v.y; }
    const yRange = Math.max(yMax - yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(700, verts.length * 2);
    const RADIAL = 8;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const colors    = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices   = [];
    const up = new THREE.Vector3(0, 1, 0);
    const pulse = 1.0 + 0.10 * Math.sin(t * 1.6);

    // base color (arterial red) and blush color (warm pink)
    const baseR = 1.0, baseG = 0.85, baseB = 0.82;
    const blushR = 1.0, blushG = 0.55, blushB = 0.65;

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));

      // base taper
      let r = 0.40 * (1 - heightFrac * 0.78);
      // vessel nodes
      const node = Math.sin(tt * 22.0) * 0.5 + 0.5;
      r *= (1.0 + 0.18 * Math.pow(node, 6));
      r *= pulse;

      // THE WINK: peristaltic squeeze
      const wk = winkFactor(heightFrac, t);
      const squeeze = 1.0 - wk * WINK_DEPTH;
      r *= squeeze;

      // slight lateral asymmetry during wink (it's a *wink*, not a blink)
      // one side pinches more than the other
      const asymmetry = wk * 0.35;

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      // color: blend toward blush at squeeze
      const cr = baseR + (blushR - baseR) * wk * 0.6;
      const cg = baseG + (blushG - baseG) * wk * 0.6;
      const cb = baseB + (blushB - baseB) * wk * 0.6;

      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        // asymmetric squeeze: cos(ang) side pinches more
        const localR = r * (1.0 - asymmetry * Math.max(0, Math.cos(ang)));
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * localR)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * localR))
          .add(p);
        const idx = (i * RADIAL + j);
        positions[idx * 3]     = v.x;
        positions[idx * 3 + 1] = v.y;
        positions[idx * 3 + 2] = v.z;
        colors[idx * 3]     = cr;
        colors[idx * 3 + 1] = cg;
        colors[idx * 3 + 2] = cb;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
