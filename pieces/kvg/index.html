<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kvg · selcouth ghost fold</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#050a0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">kvg</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050a0e, 1);
document.body.appendChild(renderer.domElement);

/* ── ping-pong state textures ── */
const rtParams = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 8.0;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 8.0;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 8.0 + 25.0;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ── simulation: Lorenz with selcouth spatial fold ── */
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0 / 3.0 },
  uTime:  { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta, uTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      // selcouth fold — subtle spatial warp estranges the familiar butterfly
      float fold = sin(uTime * 0.3) * 0.12;
      p.x += sin(p.z * 0.07 + uTime * 0.2) * fold;
      p.y += cos(p.x * 0.05 + uTime * 0.15) * fold * 0.7;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ── shared instance UV index ── */
const uvIdxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const i = y * W + x;
    uvIdxArr[i * 2]     = (x + 0.5) / W;
    uvIdxArr[i * 2 + 1] = (y + 0.5) / H;
  }
}

function makeInstGeo() {
  const bp = new THREE.PlaneGeometry(1, 1);
  const g = new THREE.InstancedBufferGeometry();
  g.index = bp.index;
  g.setAttribute('position', bp.getAttribute('position'));
  g.setAttribute('uv', bp.getAttribute('uv'));
  g.setAttribute('uvIdx', new THREE.InstancedBufferAttribute(uvIdxArr, 2));
  g.instanceCount = N;
  return g;
}

/* ── shared shader fragments ── */
const vertBase = (mirror) => `
  uniform sampler2D state;
  uniform float uTime;
  attribute vec2 uvIdx;
  varying float vAge;
  varying float vSpeed;
  varying vec2 vPuv;

  void main(){
    vec4 s = texture2D(state, uvIdx);
    vec3 p = s.xyz;
    float age = s.w;

    vec3 vel = vec3(
      10.0 * (p.y - p.x),
      p.x * 28.0 - p.y - p.x * p.z,
      p.x * p.y - (8.0 / 3.0) * p.z
    );
    float spd = length(vel);
    vSpeed = clamp(spd * 0.003, 0.0, 1.0);
    vAge = age;
    vPuv = uv;

    p.z -= 25.0;
    ${mirror ? `
    // Roni Horn doubling — the uncanny mirror self
    p.y = -p.y;
    p.x += sin(uTime * 0.13) * 1.8;
    p.z += cos(uTime * 0.11) * 1.2;
    vel.y = -vel.y;
    ` : ''}

    vec3 fwd = spd > 0.001 ? normalize(vel) : vec3(0.0, 0.0, 1.0);
    vec3 rr = abs(fwd.y) > 0.95 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
    vec3 right = normalize(cross(fwd, rr));
    vec3 up    = cross(right, fwd);

    float rot = age * 6.2832 * 5.0;
    float cr = cos(rot), sr = sin(rot);
    vec2 lp = vec2(
      position.x * cr - position.y * sr,
      position.x * sr + position.y * cr
    );

    float breath = 1.0 + sin(uTime * 0.7 + age * 6.28 ${mirror ? '+ 3.14' : ''}) * 0.08;
    float sz = (${mirror ? '0.22' : '0.30'} + vSpeed * ${mirror ? '0.14' : '0.18'}) * breath;

    vec3 worldPos = p + (lp.x * right + lp.y * up) * sz;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
  }
`;

const fragBase = (ghost) => `
  varying float vAge;
  varying float vSpeed;
  varying vec2 vPuv;

  void main(){
    float r = length(vPuv - 0.5) * 2.0;
    float soft = 1.0 - smoothstep(${ghost ? '0.45' : '0.5'}, 1.0, r);

    // selcouth palette: deep teal → silver-blue → pale amber
    vec3 a_col = vec3(${ghost ? '0.08, 0.22, 0.35' : '0.10, 0.28, 0.42'});
    vec3 b_col = vec3(${ghost ? '0.40, 0.58, 0.72' : '0.55, 0.72, 0.82'});
    vec3 c_col = vec3(${ghost ? '0.72, 0.65, 0.45' : '0.92, 0.78, 0.45'});
    float k = mod(vAge + vSpeed * 0.4, 1.0);
    vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
    col = mix(col, c_col, smoothstep(0.65, 1.0, k));

    float alpha = soft * (${ghost ? '0.012 + vSpeed * 0.028' : '0.022 + vSpeed * 0.05'});
    col *= ${ghost ? '0.7' : '0.8'} + vSpeed * ${ghost ? '0.4' : '0.5'};

    gl_FragColor = vec4(col, alpha);
  }
`;

/* ── primary attractor mesh ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 85);
camera.lookAt(0, 0, 0);

const matOpts = {
  transparent: true, depthWrite: false, depthTest: true,
  blending: THREE.AdditiveBlending, side: THREE.DoubleSide
};

const planeMat = new THREE.ShaderMaterial({
  uniforms: { state: { value: rtA.texture }, uTime: { value: 0 } },
  vertexShader: vertBase(false),
  fragmentShader: fragBase(false),
  ...matOpts
});

const mesh = new THREE.Mesh(makeInstGeo(), planeMat);
mesh.frustumCulled = false;
scene.add(mesh);

/* ── ghost double — mirrored attractor (the selcouth other) ── */
const ghostMat = new THREE.ShaderMaterial({
  uniforms: { state: { value: rtA.texture }, uTime: { value: 0 } },
  vertexShader: vertBase(true),
  fragmentShader: fragBase(true),
  ...matOpts
});

const ghostMesh = new THREE.Mesh(makeInstGeo(), ghostMat);
ghostMesh.frustumCulled = false;
scene.add(ghostMesh);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── pointer nudge ── */
const target = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.0;
  target.sigma = 10.0 + nx * 2.5;
});

/* ── loop ── */
function loop(){
  const now = performance.now();
  const t = now / 1000;

  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;
  simUniforms.uTime.value   = t;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  planeMat.uniforms.state.value = rtA.texture;
  planeMat.uniforms.uTime.value = t;
  ghostMat.uniforms.state.value = rtA.texture;
  ghostMat.uniforms.uTime.value = t;

  // slow orbit with gentle vertical sway
  const ang = now * 0.0001;
  const r = 85 + Math.sin(now * 0.00007) * 10;
  camera.position.x = Math.sin(ang) * r;
  camera.position.z = Math.cos(ang) * r;
  camera.position.y = Math.sin(now * 0.00015) * 12;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
