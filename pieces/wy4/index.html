<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: sway, intensity: gentle -->
<title>wy4 · Rousseau canopy (naïve jungle gaze)</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#081208;overflow:hidden;
  color:#333;font-family:ui-monospace,"SF Mono",Menlo,monospace}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
    letter-spacing:0.06em;color:#cdd2dc;font-family:ui-monospace,"SF Mono",Menlo,monospace}
.src{position:fixed;right:14px;top:14px;opacity:0.4;font-size:10px;letter-spacing:0.04em;color:#666}
</style>
</head>
<body>
<div class="id">wy4</div>
<div class="src">Rousseau · naïve jungle gaze · 20k leaves</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x081208);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 80);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* --- RNG --- */
let sd = 7919;
const rng = () => { sd=(sd*1664525+1013904223)&0x7fffffff; return sd/0x7fffffff; };

/* --- Palette: Rousseau jungle mutes --- */
const greens = [
  [0.09,0.22,0.07],[0.14,0.30,0.09],[0.07,0.18,0.05],
  [0.19,0.34,0.11],[0.11,0.25,0.06],[0.22,0.36,0.14],
  [0.06,0.15,0.04]
];

/* --- Eye positions (mid-depth gaps in canopy) --- */
const NUM_EYES = 8;
const eyes = [];
for(let i=0;i<NUM_EYES;i++){
  eyes.push({
    x:(rng()-0.5)*13, y:(rng()-0.5)*8.5,
    z:-0.3+rng()*0.4, size:0.28+rng()*0.22,
    phase:rng()*Math.PI*2, irisHue:0.07+rng()*0.05
  });
}

/* --- LEAVES (InstancedBufferGeometry + flat quad) --- */
const LEAF_N = 20000;
const baseGeo = new THREE.PlaneGeometry(1,1);
const leafGeo = new THREE.InstancedBufferGeometry();
leafGeo.index = baseGeo.index;
leafGeo.setAttribute('position', baseGeo.getAttribute('position'));
leafGeo.setAttribute('uv', baseGeo.getAttribute('uv'));

const aOff = new Float32Array(LEAF_N*3);
const aPar = new Float32Array(LEAF_N*4);
const aCol = new Float32Array(LEAF_N*3);

for(let i=0;i<LEAF_N;i++){
  let x=(rng()-0.5)*22, y=(rng()-0.5)*15, z=-6+rng()*10;

  // push leaves away from eye centres — peek-holes
  for(const e of eyes){
    const dx=x-e.x, dy=y-e.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d<e.size*2.8 && Math.abs(z-e.z)<1.8 && d>0.01){
      const push=(e.size*2.8-d)*0.65;
      x+=(dx/d)*push; y+=(dy/d)*push;
    }
  }

  aOff[i*3]=x; aOff[i*3+1]=y; aOff[i*3+2]=z;
  aPar[i*4]=(rng()-0.5)*Math.PI*0.7;          // rot
  aPar[i*4+1]=0.25+rng()*0.65;                // scale
  aPar[i*4+2]=rng()*Math.PI*2;                // swayPhase
  aPar[i*4+3]=(z+6)/10;                       // depthNorm 0..1

  const ci=Math.floor(rng()*greens.length), v=0.85+rng()*0.3;
  aCol[i*3]=greens[ci][0]*v;
  aCol[i*3+1]=greens[ci][1]*v;
  aCol[i*3+2]=greens[ci][2]*v;
}

leafGeo.setAttribute('aOff', new THREE.InstancedBufferAttribute(aOff,3));
leafGeo.setAttribute('aPar', new THREE.InstancedBufferAttribute(aPar,4));
leafGeo.setAttribute('aCol', new THREE.InstancedBufferAttribute(aCol,3));
leafGeo.instanceCount = LEAF_N;

const leafMat = new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  side: THREE.DoubleSide, depthWrite:true, transparent:false,
  vertexShader:`
    attribute vec3 aOff;
    attribute vec4 aPar;
    attribute vec3 aCol;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vCol;
    varying float vDepth;
    void main(){
      vUv=uv; vCol=aCol;
      float rot=aPar.x, sc=aPar.y, phase=aPar.z;
      vDepth=aPar.w;
      float sw=sin(uTime*0.35+phase)*0.07*sc;
      float sr=sin(uTime*0.25+phase*1.3)*0.05;
      float r=rot+sr, cr=cos(r), s=sin(r);
      vec2 p=position.xy*sc; p.y*=1.7;
      vec2 rp=vec2(p.x*cr-p.y*s, p.x*s+p.y*cr);
      vec3 w=vec3(rp.x+aOff.x+sw, rp.y+aOff.y, aOff.z);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(w,1.0);
    }`,
  fragmentShader:`
    varying vec2 vUv;
    varying vec3 vCol;
    varying float vDepth;
    void main(){
      vec2 c=vUv-0.5;
      float lx=c.x*2.6, ly=c.y*2.0;
      float taper=1.0-pow(abs(ly),1.6);
      if(taper<0.01) discard;
      float edge=abs(lx)/(taper*0.75);
      if(edge>1.0) discard;
      // midrib
      float mid=1.0-smoothstep(0.0,0.07,abs(lx));
      // secondary veins
      float vy=ly*7.0;
      float vein=(1.0-smoothstep(0.38,0.48,abs(fract(vy)-0.5)))
                 *0.15*step(0.04,abs(lx));
      vec3 col=vCol;
      col=mix(col,col*0.4,mid*0.5);
      col=mix(col,col*0.65,vein);
      col*=mix(0.25,1.0,vDepth);
      gl_FragColor=vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(leafGeo, leafMat));

/* --- EYES (InstancedBufferGeometry) --- */
const eyeBase = new THREE.PlaneGeometry(1,1);
const eyeGeo = new THREE.InstancedBufferGeometry();
eyeGeo.index = eyeBase.index;
eyeGeo.setAttribute('position', eyeBase.getAttribute('position'));
eyeGeo.setAttribute('uv', eyeBase.getAttribute('uv'));

const eOff=new Float32Array(NUM_EYES*3);
const ePar=new Float32Array(NUM_EYES*3);
for(let i=0;i<NUM_EYES;i++){
  eOff[i*3]=eyes[i].x; eOff[i*3+1]=eyes[i].y; eOff[i*3+2]=eyes[i].z;
  ePar[i*3]=eyes[i].size; ePar[i*3+1]=eyes[i].phase; ePar[i*3+2]=eyes[i].irisHue;
}
eyeGeo.setAttribute('eOff', new THREE.InstancedBufferAttribute(eOff,3));
eyeGeo.setAttribute('ePar', new THREE.InstancedBufferAttribute(ePar,3));
eyeGeo.instanceCount = NUM_EYES;

const eyeMat = new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  transparent:true, depthWrite:false,
  vertexShader:`
    attribute vec3 eOff;
    attribute vec3 ePar;
    varying vec2 vUv;
    varying float vSize, vPhase, vIrisHue;
    void main(){
      vUv=uv; vSize=ePar.x; vPhase=ePar.y; vIrisHue=ePar.z;
      vec2 p=position.xy*vSize*2.2;
      p.y*=0.6;
      vec3 w=vec3(p.x+eOff.x, p.y+eOff.y, eOff.z+0.01);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(w,1.0);
    }`,
  fragmentShader:`
    varying vec2 vUv;
    varying float vSize, vPhase, vIrisHue;
    uniform float uTime;
    vec3 hsv2rgb(vec3 c){
      vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
      vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
      return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
    }
    void main(){
      vec2 c=(vUv-0.5)*2.0;
      // almond eye shape
      float ey=c.y*1.6;
      float r=length(vec2(c.x,ey));
      if(r>1.0) discard;
      // pointed corners
      float almondMask=1.0-pow(abs(c.x),2.5)*1.8;
      if(abs(ey)>almondMask) discard;

      float dist=length(c);
      float irisR=0.62;
      float pupilBase=0.20;
      // pupil dilation: slow ±0.04
      float pupilR=pupilBase+sin(uTime*0.3+vPhase)*0.04;

      // sclera (warm off-white)
      vec3 col=vec3(0.82,0.80,0.74);

      // iris
      if(dist<irisR){
        vec3 irisCol=hsv2rgb(vec3(vIrisHue,0.65,0.50));
        float detail=sin(atan(c.y,c.x)*9.0+dist*14.0)*0.08;
        col=irisCol+detail;
        float edg=smoothstep(irisR*0.45,irisR,dist);
        col=mix(col,irisCol*0.35,edg*0.65);
      }

      // pupil
      if(dist<pupilR) col=vec3(0.02,0.01,0.0);

      // highlight
      float hlD=length(c-vec2(-0.13,0.10));
      col=mix(col,vec3(0.92),
        (1.0-smoothstep(0.03,0.08,hlD))*0.75);

      // soft outer edge
      float outerR=length(vec2(c.x,ey));
      float alpha=1.0-smoothstep(0.82,1.0,outerR);

      // subtle warm glow
      col+=vec3(0.7,0.5,0.15)*exp(-r*r*3.5)*0.06;

      gl_FragColor=vec4(col,alpha);
    }`
});
scene.add(new THREE.Mesh(eyeGeo, eyeMat));

/* --- Subtle ambient particles (dust motes, atmosphere) --- */
const DUST=1200;
const dustGeo = new THREE.BufferGeometry();
const dPos=new Float32Array(DUST*3), dSeed=new Float32Array(DUST);
for(let i=0;i<DUST;i++){
  dPos[i*3]=(rng()-0.5)*20;
  dPos[i*3+1]=(rng()-0.5)*14;
  dPos[i*3+2]=-4+rng()*8;
  dSeed[i]=rng()*Math.PI*2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos,3));
dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dSeed,1));

const dustMat = new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  transparent:true, depthWrite:false,
  vertexShader:`
    attribute float aSeed;
    uniform float uTime;
    varying float vAlpha;
    void main(){
      vec3 p=position;
      p.x+=sin(uTime*0.15+aSeed)*0.3;
      p.y+=sin(uTime*0.12+aSeed*1.7)*0.2;
      vAlpha=0.15+0.1*sin(uTime*0.2+aSeed*2.3);
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      gl_PointSize=1.5;
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying float vAlpha;
    void main(){
      vec2 d=gl_PointCoord-0.5;
      if(dot(d,d)>0.25) discard;
      gl_FragColor=vec4(0.35,0.45,0.25,vAlpha);
    }`
});
scene.add(new THREE.Points(dustGeo, dustMat));

/* --- Resize --- */
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --- Animate --- */
const t0=performance.now();
(function loop(){
  const t=(performance.now()-t0)/1000;
  leafMat.uniforms.uTime.value=t;
  eyeMat.uniforms.uTime.value=t;
  dustMat.uniforms.uTime.value=t;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
