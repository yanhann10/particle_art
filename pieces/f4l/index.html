<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f4l · physarum shells</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #150a25; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:10; }
  button.start:hover { background:#22113a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">f4l</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 2);
camera.position.z = 1;
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
const W = Math.min(1024, innerWidth);
const H = Math.min(1024, innerHeight);
renderer.setSize(W, H);
document.body.appendChild(renderer.domElement);

// agent system: 5 shells × 4000 agents = 20000
const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;

// agent state: position (xy in [0,1]), angle, shell index
const agents = [];
for (let s = 0; s < SHELLS; s++) {
  const r = 0.15 + s * 0.12; // radial shell in normalized space
  for (let i = 0; i < PER_SHELL; i++) {
    const theta = Math.random() * Math.PI * 2;
    agents.push({
      x: 0.5 + r * Math.cos(theta),
      y: 0.5 + r * Math.sin(theta),
      angle: theta + Math.PI,
      shell: s,
      seed: Math.random()
    });
  }
}

// pheromone field: two render targets (ping-pong)
const trailRT = [
  new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType, format: THREE.RGBAFormat }),
  new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType, format: THREE.RGBAFormat })
];
let trailIdx = 0;

// deposit material: writes agent positions as small additive splats
const depositGeom = new THREE.BufferGeometry();
const depositPos = new Float32Array(N * 3);
const depositShellIdx = new Float32Array(N);
for (let i = 0; i < N; i++) {
  depositPos[i*3] = 0;
  depositPos[i*3+1] = 0;
  depositPos[i*3+2] = 0;
  depositShellIdx[i] = agents[i].shell;
}
depositGeom.setAttribute('position', new THREE.BufferAttribute(depositPos, 3));
depositGeom.setAttribute('shellIdx', new THREE.BufferAttribute(depositShellIdx, 1));

const depositMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float shellIdx;
    varying vec3 vCol;
    void main(){
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan = vec3(0.25, 0.85, 0.95);
      float k = shellIdx / 4.0;
      vCol = mix(amber, cyan, k);
      gl_PointSize = 2.0;
      gl_Position = vec4(position.xy * 2.0 - 1.0, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 8.0) * 0.05;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const depositPoints = new THREE.Points(depositGeom, depositMat);
const depositScene = new THREE.Scene();
depositScene.add(depositPoints);

// diffuse/decay pass: reads trail, applies blur + decay, writes back
const diffuseMat = new THREE.ShaderMaterial({
  uniforms: { uTrail: { value: null }, uPixel: { value: new THREE.Vector2(1/W, 1/H) } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D uTrail;
    uniform vec2 uPixel;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(uTrail, vUv);
      vec4 s = vec4(0.0);
      s += texture2D(uTrail, vUv + uPixel * vec2(-1,0));
      s += texture2D(uTrail, vUv + uPixel * vec2(1,0));
      s += texture2D(uTrail, vUv + uPixel * vec2(0,-1));
      s += texture2D(uTrail, vUv + uPixel * vec2(0,1));
      c = mix(c, s * 0.25, 0.5);
      c *= 0.985; // decay
      gl_FragColor = c;
    }
  `
});
const diffuseQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), diffuseMat);
const diffuseScene = new THREE.Scene();
diffuseScene.add(diffuseQuad);

// display material: shows the trail texture fullscreen
const displayMat = new THREE.ShaderMaterial({
  uniforms: { uTrail: { value: null }, uGamma: { value: 1.6 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D uTrail;
    uniform float uGamma;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(uTrail, vUv);
      c.rgb = pow(c.rgb, vec3(1.0 / uGamma));
      gl_FragColor = vec4(c.rgb, 1.0);
    }
  `
});
const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), displayMat);
const displayScene = new THREE.Scene();
displayScene.add(displayQuad);

addEventListener('resize', () => {
  const nW = Math.min(1024, innerWidth);
  const nH = Math.min(1024, innerHeight);
  renderer.setSize(nW, nH);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 physarum colonies';
  } catch (e) {
    hint.textContent = 'mic denied — passive mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const bandEnergies = [0,0,0,0,0];

// read pheromone at position
const canvas2d = document.createElement('canvas');
canvas2d.width = W;
canvas2d.height = H;
const ctx2d = canvas2d.getContext('2d', { willReadFrequently: true });
let pixelData = null;

function sampleTrail(x, y){
  if (!pixelData) return 0;
  const px = Math.floor(x * W);
  const py = Math.floor(y * H);
  if (px < 0 || px >= W || py < 0 || py >= H) return 0;
  const idx = (py * W + px) * 4;
  return (pixelData[idx] + pixelData[idx+1] + pixelData[idx+2]) / 3;
}

const start = performance.now();
let frameCount = 0;

function loop(){
  const t = (performance.now() - start) / 1000;
  frameCount++;

  // update audio bands
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    bandEnergies[0] = bandEnergy(freqData, 0, Math.floor(n*0.04));
    bandEnergies[1] = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    bandEnergies[2] = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    bandEnergies[3] = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    bandEnergies[4] = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    bandEnergies[0] = 0.35 + 0.35 * Math.sin(t*1.3);
    bandEnergies[1] = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    bandEnergies[2] = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    bandEnergies[3] = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    bandEnergies[4] = 0.18 + 0.18 * Math.sin(t*7.0);
  }

  // read trail texture into 2d canvas every 3 frames
  if (frameCount % 3 === 0){
    renderer.readRenderTargetPixels(trailRT[trailIdx], 0, 0, W, H, canvas2d);
    ctx2d.putImageData(new ImageData(new Uint8ClampedArray(canvas2d.getContext('2d').getImageData(0,0,W,H).data), W, H), 0, 0);
    pixelData = ctx2d.getImageData(0, 0, W, H).data;
  }

  // update agents: sense → rotate → move
  const sensorDist = 0.008;
  const sensorAngle = 0.5;
  const turnSpeed = 0.3;
  const moveSpeed = 0.003;

  for (let i = 0; i < N; i++){
    const ag = agents[i];
    const energy = bandEnergies[ag.shell];
    const speed = moveSpeed * (0.5 + energy * 1.5);

    // sense three directions
    const fwdX = ag.x + Math.cos(ag.angle) * sensorDist;
    const fwdY = ag.y + Math.sin(ag.angle) * sensorDist;
    const leftX = ag.x + Math.cos(ag.angle - sensorAngle) * sensorDist;
    const leftY = ag.y + Math.sin(ag.angle - sensorAngle) * sensorDist;
    const rightX = ag.x + Math.cos(ag.angle + sensorAngle) * sensorDist;
    const rightY = ag.y + Math.sin(ag.angle + sensorAngle) * sensorDist;

    const fwd = sampleTrail(fwdX, fwdY);
    const left = sampleTrail(leftX, leftY);
    const right = sampleTrail(rightX, rightY);

    // steer toward strongest
    if (fwd > left && fwd > right){
      // continue straight
    } else if (fwd < left && fwd < right){
      ag.angle += (Math.random() - 0.5) * turnSpeed * 2;
    } else if (left > right){
      ag.angle -= turnSpeed;
    } else if (right > left){
      ag.angle += turnSpeed;
    } else {
      ag.angle += (Math.random() - 0.5) * turnSpeed;
    }

    // move forward
    ag.x += Math.cos(ag.angle) * speed;
    ag.y += Math.sin(ag.angle) * speed;

    // wrap boundaries
    if (ag.x < 0) ag.x += 1;
    if (ag.x > 1) ag.x -= 1;
    if (ag.y < 0) ag.y += 1;
    if (ag.y > 1) ag.y -= 1;

    // update deposit buffer
    depositPos[i*3] = ag.x;
    depositPos[i*3+1] = ag.y;
  }
  depositGeom.attributes.position.needsUpdate = true;

  // deposit pheromone
  renderer.setRenderTarget(trailRT[trailIdx]);
  renderer.render(depositScene, camera);

  // diffuse/decay
  const nextIdx = 1 - trailIdx;
  diffuseMat.uniforms.uTrail.value = trailRT[trailIdx].texture;
  renderer.setRenderTarget(trailRT[nextIdx]);
  renderer.render(diffuseScene, camera);
  trailIdx = nextIdx;

  // display
  displayMat.uniforms.uTrail.value = trailRT[trailIdx].texture;
  renderer.setRenderTarget(null);
  renderer.render(displayScene, camera);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
