<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Amelia Winger-Bearskin — "I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY"
// Two-layer boid flock: a 'built' layer (grid-snapped, sodium-orange, light pollution)
// progressively erodes into the 'sky' layer (free drift, cobalt + starfield white).
// The straggler is the first particle to become sky — it pulls the flock
// from infrastructure into shared celestial commons.
//
// Narrative arc preserved from parent sav:
//   TOGETHER (built world, gridded, sodium glow)
//   → LOSS (infrastructure crumbling, one particle drifts free)
//   → SEEKING (flock dissolves toward sky)
//   → RETURN (reunited as midnight — a new togetherness, not the old grid)
//
// Palette: sodium-orange #e89040, amber #c07030, cobalt #1a3068,
//          midnight-blue #0c1428, starfield white #d0d8e8

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06060f, 1);
document.body.appendChild(renderer.domElement);

// ── starfield background (static, 600 tiny specks) ──
const STARS = 600;
const starPos = new Float32Array(STARS * 3);
const starBri = new Float32Array(STARS);
for (let i = 0; i < STARS; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r = 60 + Math.random() * 80;
  starPos[i * 3]     = Math.sin(ph) * Math.cos(th) * r;
  starPos[i * 3 + 1] = Math.sin(ph) * Math.sin(th) * r;
  starPos[i * 3 + 2] = Math.cos(ph) * r;
  starBri[i] = 0.15 + Math.random() * 0.85;
}
const starGeom = new THREE.BufferGeometry();
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
starGeom.setAttribute('bri', new THREE.BufferAttribute(starBri, 1));
const starMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 }, uPx: { value: renderer.getPixelRatio() },
              uReveal: { value: 0.0 } },
  vertexShader: `
    attribute float bri;
    uniform float uPx;
    uniform float uReveal;
    varying float vA;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.8 + bri * 1.6) * uPx * (20.0 / dist);
      // stars fade in as the built layer erodes
      vA = bri * mix(0.08, 0.7, uReveal);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vA;
      gl_FragColor = vec4(0.82, 0.85, 0.92, a);
    }
  `
});
scene.add(new THREE.Points(starGeom, starMat));

// ── ground horizon haze (subtle, low) ──
const hazeGeom = new THREE.PlaneGeometry(200, 40);
const hazeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide,
  uniforms: { uCoh: { value: 1.0 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uCoh;
    void main(){
      // warm sodium haze when built, fades to cool atmospheric scatter when sky
      float h = smoothstep(0.0, 0.6, vUv.y) * smoothstep(1.0, 0.4, vUv.y);
      vec3 warm = vec3(0.18, 0.10, 0.05);
      vec3 cool = vec3(0.04, 0.06, 0.12);
      vec3 col = mix(cool, warm, uCoh);
      float a = h * 0.18 * (0.4 + 0.6 * uCoh);
      gl_FragColor = vec4(col, a);
    }
  `
});
const hazeMesh = new THREE.Mesh(hazeGeom, hazeMat);
hazeMesh.position.y = -8;
hazeMesh.rotation.x = -0.15;
scene.add(hazeMesh);

// ── grain overlay (fullscreen quad) ──
const grainGeom = new THREE.PlaneGeometry(2, 2);
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, depthTest: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      float n = hash(vUv * 800.0 + uTime * 3.7);
      gl_FragColor = vec4(vec3(n), 0.035);
    }
  `
});
const grainMesh = new THREE.Mesh(grainGeom, grainMat);
grainMesh.renderOrder = 999;
grainMesh.frustumCulled = false;
scene.add(grainMesh);

// ── boids with narrative ──
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
// grid memory: each boid remembers a "built" grid position
const gridPos = new Float32Array(N * 3);
const GRID_SPACING = 0.9;

// init: grid-ish cluster (the "built world")
{
  const cols = 24, rows = 20;
  for (let i = 0; i < N; i++) {
    const gi = i % cols, gj = Math.floor(i / cols) % rows;
    const gx = (gi - cols / 2) * GRID_SPACING + (Math.random() - 0.5) * 0.15;
    const gy = (gj - rows / 2) * GRID_SPACING * 0.7 + (Math.random() - 0.5) * 0.15;
    const gz = (Math.random() - 0.5) * 1.2;
    gridPos[i * 3] = gx; gridPos[i * 3 + 1] = gy; gridPos[i * 3 + 2] = gz;
    pos[i * 3] = gx + (Math.random() - 0.5) * 0.3;
    pos[i * 3 + 1] = gy + (Math.random() - 0.5) * 0.3;
    pos[i * 3 + 2] = gz + (Math.random() - 0.5) * 0.3;
    vel[i * 3]     = (Math.random() - 0.5) * 0.15;
    vel[i * 3 + 1] = (Math.random() - 0.5) * 0.15;
    vel[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
  }
}

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.85;
const W_COH = 0.016, W_ALI = 0.055, W_SEP = 0.075;
const MAX_SPEED = 1.3, MAX_FORCE = 0.028;

let cohesion = 1.0;
let arcStage = 'built';
let builtness = 1.0; // 1=full grid, 0=full sky
const arcEl = document.getElementById('arc');

function step(dt) {
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++) {
    cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2];
  }
  cx /= (N - 1); cy /= (N - 1); cz /= (N - 1);

  const sx = pos[0] - cx, sy = pos[1] - cy, sz = pos[2] - cz;
  const stragDist = Math.sqrt(sx * sx + sy * sy + sz * sz);
  const targetCoh = Math.max(0, Math.min(1, 1 - stragDist / 9.0));
  cohesion += (targetCoh - cohesion) * dt * 0.4;

  // builtness tracks cohesion but with hysteresis — the grid doesn't snap back
  const targetBuilt = cohesion * cohesion; // faster decay
  builtness += (targetBuilt - builtness) * dt * 0.25;

  if (cohesion > 0.82) arcStage = 'built';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'eroding';
  else if (cohesion < 0.5) arcStage = 'sky';
  else if (arcStage === 'sky' && cohesion > 0.6) arcStage = 'midnight';

  const labels = { built: 'built', eroding: 'eroding', sky: 'becoming sky', midnight: 'midnight' };
  arcEl.textContent = `${labels[arcStage]} · ${Math.round(cohesion * 100)}%`;
  arcEl.style.color = cohesion > 0.5 ? '#c08040' : '#4060a0';

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let cohX = 0, cohY = 0, cohZ = 0, cohN = 0;
    let aliX = 0, aliY = 0, aliZ = 0, aliN = 0;
    let sepX = 0, sepY = 0, sepZ = 0;
    const px = pos[i * 3], py = pos[i * 3 + 1], pz = pos[i * 3 + 2];
    const isS = (i === STRAGGLER);
    const pR = isS ? PERCEPTION_R * 0.5 : PERCEPTION_R;

    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const dx = pos[j * 3] - px, dy = pos[j * 3 + 1] - py, dz = pos[j * 3 + 2] - pz;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > pR * pR || d2 < 1e-6) continue;
      cohX += pos[j * 3]; cohY += pos[j * 3 + 1]; cohZ += pos[j * 3 + 2]; cohN++;
      aliX += vel[j * 3]; aliY += vel[j * 3 + 1]; aliZ += vel[j * 3 + 2]; aliN++;
      if (d2 < SEPARATION_R * SEPARATION_R) {
        const inv = 1 / Math.sqrt(d2);
        sepX -= dx * inv; sepY -= dy * inv; sepZ -= dz * inv;
      }
    }

    // grid-snap force: pull toward remembered grid position, scaled by builtness
    const gx = gridPos[i * 3] - px, gy = gridPos[i * 3 + 1] - py, gz = gridPos[i * 3 + 2] - pz;
    const gridForce = builtness * 0.025;
    acc[i * 3] += gx * gridForce;
    acc[i * 3 + 1] += gy * gridForce;
    acc[i * 3 + 2] += gz * gridForce;

    // straggler: the first to become sky — drifts upward and outward
    if (isS) {
      const t = performance.now() * 0.001;
      acc[i * 3]     += Math.sin(t * 0.3) * 0.35;
      acc[i * 3 + 1] += 0.15 + Math.cos(t * 0.2) * 0.2;
      acc[i * 3 + 2] += Math.cos(t * 0.35) * 0.25;
    }

    // seeking behavior
    if (!isS && (arcStage === 'sky' || arcStage === 'midnight')) {
      const tx = pos[0] - px, ty = pos[1] - py, tz = pos[2] - pz;
      const td = Math.sqrt(tx * tx + ty * ty + tz * tz) + 1e-3;
      const seek = arcStage === 'sky' ? 0.018 : 0.010;
      acc[i * 3] += (tx / td) * seek;
      acc[i * 3 + 1] += (ty / td) * seek;
      acc[i * 3 + 2] += (tz / td) * seek;
    }

    if (cohN > 0) {
      acc[i * 3]     += (cohX / cohN - px) * W_COH;
      acc[i * 3 + 1] += (cohY / cohN - py) * W_COH;
      acc[i * 3 + 2] += (cohZ / cohN - pz) * W_COH;
    }
    if (aliN > 0) {
      acc[i * 3]     += (aliX / aliN - vel[i * 3]) * W_ALI;
      acc[i * 3 + 1] += (aliY / aliN - vel[i * 3 + 1]) * W_ALI;
      acc[i * 3 + 2] += (aliZ / aliN - vel[i * 3 + 2]) * W_ALI;
    }
    acc[i * 3] += sepX * W_SEP;
    acc[i * 3 + 1] += sepY * W_SEP;
    acc[i * 3 + 2] += sepZ * W_SEP;

    // soft bounds
    const d2c = px * px + py * py + pz * pz;
    if (d2c > 120) {
      const inv = 0.014 / Math.sqrt(d2c);
      acc[i * 3] -= px * inv; acc[i * 3 + 1] -= py * inv; acc[i * 3 + 2] -= pz * inv;
    }
  }

  const speedMul = (arcStage === 'eroding' || arcStage === 'sky') ? 0.6
                 : arcStage === 'midnight' ? 0.8 : 1.0;
  for (let i = 0; i < N; i++) {
    let ax = acc[i * 3], ay = acc[i * 3 + 1], az = acc[i * 3 + 2];
    const af = Math.sqrt(ax * ax + ay * ay + az * az);
    if (af > MAX_FORCE) { const s = MAX_FORCE / af; ax *= s; ay *= s; az *= s; }
    vel[i * 3] += ax; vel[i * 3 + 1] += ay; vel[i * 3 + 2] += az;
    let vx = vel[i * 3], vy = vel[i * 3 + 1], vz = vel[i * 3 + 2];
    const sp = Math.sqrt(vx * vx + vy * vy + vz * vz);
    if (sp > MAX_SPEED) {
      const s = MAX_SPEED / sp;
      vel[i * 3] *= s; vel[i * 3 + 1] *= s; vel[i * 3 + 2] *= s;
    }
    pos[i * 3]     += vel[i * 3]     * dt * speedMul;
    pos[i * 3 + 1] += vel[i * 3 + 1] * dt * speedMul;
    pos[i * 3 + 2] += vel[i * 3 + 2] * dt * speedMul;
  }
}

// ── main particle rendering ──
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const stragAttr = new Float32Array(N);
stragAttr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(stragAttr, 1));

const uTime = { value: 0 };
const uPx = { value: renderer.getPixelRatio() };
const uCoh = { value: 1.0 };
const uBuilt = { value: 1.0 };

const mat = new THREE.ShaderMaterial({
  uniforms: { uTime, uPx, uCoh, uBuilt },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime, uPx, uCoh, uBuilt;
    attribute float seed;
    attribute float strag;
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // size: when built, uniform small; when sky, varied + larger for the straggler
      float builtSize = 1.2;
      float skySize = 1.4 + 0.9 * sin(t);
      float baseSize = mix(skySize, builtSize, uBuilt);
      float stragBonus = strag * mix(2.8, 0.5, uBuilt);
      gl_PointSize = (baseSize + stragBonus) * uPx * (16.0 / dist);
      vFade = clamp(1.0 - (dist - 26.0) / 30.0, 0.0, 1.0);

      // palette: 5 specific colors with justification
      // sodium:    #e89040 — streetlight, light-pollution, the built world
      // amber:     #c07030 — warm infrastructure glow
      // cobalt:    #1a3068 — deep sky freed from sodium
      // midnight:  #2838608 — the commons, the shared sky
      // starwhite: #d0d8e8 — individual star-points when fully sky

      vec3 sodium    = vec3(0.91, 0.565, 0.25);
      vec3 amber     = vec3(0.753, 0.439, 0.188);
      vec3 cobalt    = vec3(0.102, 0.188, 0.408);
      vec3 midblue   = vec3(0.157, 0.22, 0.376);
      vec3 starwhite = vec3(0.816, 0.847, 0.91);

      // built: sodium/amber mix; sky: cobalt/starwhite mix
      vec3 builtCol = mix(amber, sodium, 0.5 + 0.3 * sin(seed * 12.0));
      vec3 skyCol   = mix(cobalt, midblue, 0.5 + 0.4 * sin(seed * 8.0));
      // some particles become star-bright when fully sky
      skyCol = mix(skyCol, starwhite, smoothstep(0.85, 1.0, sin(t * 0.3 + seed * 20.0)) * 0.6);

      vec3 col = mix(skyCol, builtCol, uBuilt);

      // straggler: always slightly ahead — more sky than the flock
      float stragShift = strag * 0.4;
      col = mix(col, mix(starwhite, cobalt, 0.3), stragShift);
      col *= (1.0 + strag * 0.3);

      vCol = col;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vFade;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── subtle atmospheric scatter (large soft particles at mid-distance) ──
const ATMO = 40;
const atmoPos = new Float32Array(ATMO * 3);
for (let i = 0; i < ATMO; i++) {
  atmoPos[i * 3]     = (Math.random() - 0.5) * 50;
  atmoPos[i * 3 + 1] = (Math.random() - 0.5) * 30;
  atmoPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
}
const atmoGeom = new THREE.BufferGeometry();
atmoGeom.setAttribute('position', new THREE.BufferAttribute(atmoPos, 3));
const atmoMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
  uniforms: { uPx: { value: renderer.getPixelRatio() }, uCoh },
  vertexShader: `
    uniform float uPx;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = uPx * 120.0 / (-mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uCoh;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 6.0) * 0.012;
      vec3 warm = vec3(0.3, 0.15, 0.06);
      vec3 cool = vec3(0.06, 0.08, 0.18);
      gl_FragColor = vec4(mix(cool, warm, uCoh) * a, a);
    }
  `
});
scene.add(new THREE.Points(atmoGeom, atmoMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 200; s++) step(0.05);

let lastT = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  uTime.value = t;
  uCoh.value = cohesion;
  uBuilt.value = builtness;
  starMat.uniforms.uTime.value = t;
  starMat.uniforms.uReveal.value = 1.0 - builtness;
  hazeMat.uniforms.uCoh.value = builtness;
  grainMat.uniforms.uTime.value = t;

  step(dt);
  geom.attributes.position.needsUpdate = true;

  // camera: track flock centroid with slow orbit
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < N; i++) {
    cx += pos[i * 3]; cy += pos[i * 3 + 1]; cz += pos[i * 3 + 2];
  }
  cx /= N; cy /= N; cz /= N;

  const ang = t * 0.06;
  const camR = 28 + builtness * 4; // closer when sky
  camera.position.x = cx + Math.sin(ang) * camR;
  camera.position.y = cy + 2 + Math.sin(t * 0.04) * 3;
  camera.position.z = cz + Math.cos(ang) * camR;
  camera.lookAt(cx, cy, cz);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
