<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0907);
scene.fog = new THREE.FogExp2(0x0a0907, 0.06);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xf5e6c8, 0.15));
const pL = new THREE.PointLight(0xffecd2, 0.6, 30, 1.5);
pL.position.set(2, 4, 3);
scene.add(pL);
const pL2 = new THREE.PointLight(0xd4c4a0, 0.3, 20, 1.8);
pL2.position.set(-3, -1, -2);
scene.add(pL2);

let seed = 73019284;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const toothCenter = new THREE.Vector3(0, 0, 0);

const toothProfile = [];
const SEGMENTS = 32;
for(let i = 0; i <= SEGMENTS; i++){
  const t = i / SEGMENTS;
  let r;
  if(t < 0.08) r = t / 0.08 * 0.25;
  else if(t < 0.35){ const lt = (t - 0.08) / 0.27; r = 0.25 + lt * 0.75; }
  else if(t < 0.75){ const lt = (t - 0.35) / 0.4; r = 1.0 + Math.sin(lt * Math.PI) * 0.15; }
  else { const lt = (t - 0.75) / 0.25; r = 1.15 - lt * 0.35; }
  const y = -2.5 + t * 5.0;
  const xOff = Math.sin(t * Math.PI) * 0.15;
  toothProfile.push(new THREE.Vector2(r + xOff, y));
}

const toothGeo = new THREE.LatheGeometry(toothProfile, 48);
const toothMat = new THREE.MeshStandardMaterial({
  color: 0xf0e4c8, emissive: 0xd8c8a0, emissiveIntensity: 0.12,
  roughness: 0.85, metalness: 0.02, transparent: true, opacity: 0.35
});
const tooth = new THREE.Mesh(toothGeo, toothMat);
tooth.position.copy(toothCenter);
tooth.rotation.z = 0.12; tooth.rotation.x = -0.08;
scene.add(tooth);

const coreGeo = new THREE.LatheGeometry(
  toothProfile.map(p => new THREE.Vector2(p.x * 0.4, p.y)), 16
);
const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({
  color: 0xfcf2e2, transparent: true, opacity: 0.06
}));
core.position.copy(toothCenter);
core.rotation.copy(tooth.rotation);
scene.add(core);

// ── OOMPAH BELL — a tuba bell that emerges from the tooth tip during surprise
const bellProfile = [];
for(let i = 0; i <= 20; i++){
  const t = i / 20;
  const r = 0.05 + Math.pow(t, 2.2) * 1.8;
  bellProfile.push(new THREE.Vector2(r, -2.5 - t * 2.5));
}
const bellGeo = new THREE.LatheGeometry(bellProfile, 32);
const bellMat = new THREE.MeshStandardMaterial({
  color: 0xc8a030, emissive: 0xb89020, emissiveIntensity: 0.15,
  roughness: 0.3, metalness: 0.7, transparent: true, opacity: 0.0
});
const bell = new THREE.Mesh(bellGeo, bellMat);
bell.position.copy(toothCenter);
bell.rotation.copy(tooth.rotation);
scene.add(bell);

// ── SOUND RINGS — concentric torus rings that burst from the bell
const NUM_RINGS = 5;
const rings = [];
for(let i = 0; i < NUM_RINGS; i++){
  const ringGeo = new THREE.TorusGeometry(0.3 + i * 0.25, 0.02, 8, 32);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xd4a840, transparent: true, opacity: 0.0, side: THREE.DoubleSide
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.set(0, -3.5, 0);
  ring.rotation.x = Math.PI * 0.5 + 0.12;
  scene.add(ring);
  rings.push({ mesh: ring, baseScale: 0.3 + i * 0.25, delay: i * 0.12 });
}

function toothSurface(u, v){
  const idx = Math.min(SEGMENTS, Math.floor(v * SEGMENTS));
  const idx2 = Math.min(SEGMENTS, idx + 1);
  const frac = v * SEGMENTS - idx;
  const p1 = toothProfile[idx]; const p2 = toothProfile[idx2];
  const r = p1.x + (p2.x - p1.x) * frac;
  const y = p1.y + (p2.y - p1.y) * frac;
  const angle = u * Math.PI * 2;
  const nr = r + 0.015;
  return new THREE.Vector3(
    Math.cos(angle) * nr, y, Math.sin(angle) * nr
  ).applyEuler(tooth.rotation).add(toothCenter);
}

function makeWhale(uCenter, vCenter, scale, flip){
  const pts = [];
  const outline = [
    [-1.0, 0.0], [-0.9, 0.15], [-0.7, 0.22], [-0.4, 0.25],
    [-0.1, 0.23], [0.1, 0.2], [0.3, 0.22], [0.5, 0.18],
    [0.65, 0.12], [0.75, 0.05], [0.85, 0.12], [1.0, 0.25],
    [0.95, 0.2], [0.85, 0.0], [0.75, -0.05],
    [0.5, -0.1], [0.3, -0.12], [0.0, -0.15],
    [-0.3, -0.18], [-0.5, -0.2], [-0.7, -0.18],
    [-0.85, -0.12], [-1.0, 0.0]
  ];
  const dir = flip ? -1 : 1;
  for(const [ox, oy] of outline){
    const u = uCenter + ox * scale * 0.06 * dir;
    const v = vCenter + oy * scale * 0.08;
    pts.push(toothSurface(((u % 1) + 1) % 1, Math.max(0.05, Math.min(0.95, v))));
  }
  return pts;
}

function makeShip(uCenter, vCenter, scale){
  const pts = [];
  const hull = [
    [-0.8, 0.0], [-0.6, -0.12], [-0.2, -0.18], [0.2, -0.18],
    [0.6, -0.12], [0.9, 0.0], [0.6, 0.02], [-0.6, 0.02], [-0.8, 0.0]
  ];
  for(const [ox, oy] of hull){
    const u = uCenter + ox * scale * 0.05;
    const v = vCenter + oy * scale * 0.06;
    pts.push(toothSurface(((u%1)+1)%1, Math.max(0.05,Math.min(0.95,v))));
  }
  const mast = [
    [0.0, 0.02], [0.0, 0.35], [-0.15, 0.25], [0.15, 0.25], [0.0, 0.35],
    [0.0, 0.2], [-0.2, 0.12], [0.2, 0.12], [0.0, 0.2]
  ];
  for(const [ox,oy] of mast){
    const u = uCenter + ox * scale * 0.05;
    const v = vCenter + oy * scale * 0.06;
    pts.push(toothSurface(((u%1)+1)%1, Math.max(0.05,Math.min(0.95,v))));
  }
  return pts;
}

// ── TUBA PLAYER engraving — surprise addition on the back of the tooth
function makeTubaPlayer(uCenter, vCenter, scale){
  const pts = [];
  // Seated figure holding tuba — simplified silhouette
  const figure = [
    // body
    [0.0, -0.3], [-0.15, -0.25], [-0.2, -0.1], [-0.18, 0.05],
    [-0.12, 0.15], [-0.08, 0.2], [0.0, 0.25], [0.05, 0.2],
    // arms reaching to tuba
    [0.1, 0.15], [0.2, 0.2], [0.3, 0.3], [0.35, 0.35],
    // tuba bell curve
    [0.4, 0.32], [0.5, 0.2], [0.55, 0.05], [0.5, -0.1],
    [0.4, -0.15], [0.3, -0.1], [0.25, 0.0], [0.2, 0.1],
    [0.15, 0.05], [0.1, -0.05], [0.05, -0.15], [0.0, -0.3]
  ];
  for(const [ox, oy] of figure){
    const u = uCenter + ox * scale * 0.06;
    const v = vCenter + oy * scale * 0.08;
    pts.push(toothSurface(((u%1)+1)%1, Math.max(0.05,Math.min(0.95,v))));
  }
  return pts;
}

const engravings = [];
engravings.push(...makeWhale(0.0, 0.45, 1.2, false));
engravings.push(...makeWhale(0.15, 0.6, 0.8, true));
engravings.push(...makeShip(0.5, 0.5, 1.0));
// Tuba player on the back — the hidden surprise engraving
engravings.push(...makeTubaPlayer(0.7, 0.55, 1.0));

function makeCrossHatch(uStart, uEnd, vStart, vEnd, density){
  const lines = [];
  for(let i = 0; i < density; i++){
    const t = i / density;
    const u1 = uStart + t * (uEnd - uStart);
    const v1 = vStart + rng() * 0.01;
    const u2 = u1 + 0.008 + rng() * 0.012;
    const v2 = vEnd - rng() * 0.01;
    const p1 = toothSurface(((u1%1)+1)%1, Math.max(0.05,Math.min(0.95,v1)));
    const p2 = toothSurface(((u2%1)+1)%1, Math.max(0.05,Math.min(0.95,v2)));
    lines.push(p1, p2);
  }
  return lines;
}

const hatchPts = [];
hatchPts.push(...makeCrossHatch(0.85, 1.0, 0.35, 0.42, 20));
hatchPts.push(...makeCrossHatch(0.0, 0.25, 0.35, 0.42, 30));
hatchPts.push(...makeCrossHatch(0.0, 0.25, 0.68, 0.75, 30));

function makeBorderRing(v, uStart, uEnd, segs){
  const pts = [];
  for(let i = 0; i <= segs; i++){
    const u = uStart + (i/segs) * (uEnd - uStart);
    pts.push(toothSurface(((u%1)+1)%1, Math.max(0.05,Math.min(0.95,v))));
  }
  return pts;
}
const borderPts = [];
borderPts.push(...makeBorderRing(0.3, 0.0, 1.0, 80));
borderPts.push(...makeBorderRing(0.78, 0.0, 1.0, 80));

const engPos = [];
for(let i = 0; i < engravings.length - 1; i++){
  engPos.push(engravings[i].x, engravings[i].y, engravings[i].z);
  engPos.push(engravings[i+1].x, engravings[i+1].y, engravings[i+1].z);
}
for(let i = 0; i < hatchPts.length; i += 2){
  engPos.push(hatchPts[i].x, hatchPts[i].y, hatchPts[i].z);
  engPos.push(hatchPts[i+1].x, hatchPts[i+1].y, hatchPts[i+1].z);
}
for(let i = 0; i < borderPts.length - 1; i++){
  engPos.push(borderPts[i].x, borderPts[i].y, borderPts[i].z);
  engPos.push(borderPts[i+1].x, borderPts[i+1].y, borderPts[i+1].z);
}

const engGeo = new THREE.BufferGeometry();
engGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(engPos), 3));
const engMat = new THREE.LineBasicMaterial({
  color: 0x1a1208, transparent: true, opacity: 0.85, depthWrite: true
});
const engLines = new THREE.LineSegments(engGeo, engMat);
scene.add(engLines);

// ── SUSPENSION THREADS
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.4;
  const topR = 0.3 + rng()*0.8;
  const botR = 0.01 + rng()*0.04;
  suspPts.push(
    toothCenter.x + Math.cos(a)*topR, 8, toothCenter.z + Math.sin(a)*topR,
    toothCenter.x + Math.cos(a)*botR, 2.4, toothCenter.z + Math.sin(a)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x2a2018, transparent: true, opacity: 0.35
})));

// ── WEB THREADS
const NUM_LINES = 8000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt(mx*mx+my*my+mz*mz);
  lineCat[li] = cat;
  li++;
}

function toothSurfRand(){
  const u = rng(); const v = 0.05 + rng()*0.9;
  return toothSurface(u, v);
}

const ROOM = { w:10, h:10, d:10 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;
function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

const anchors = [];
const shells = [2.0, 3.2, 4.5];
for(const sr of shells){
  const n = Math.floor(12 + sr*3);
  for(let i = 0; i < n; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.85+rng()*0.3);
    anchors.push(new THREE.Vector3(
      Math.sin(v)*Math.cos(u)*r, Math.sin(v)*Math.sin(u)*r*1.3, Math.cos(v)*r
    ));
  }
}
for(let i = anchors.length; i < 120; i++){
  anchors.push(wallPt().lerp(toothCenter, 0.05+rng()*0.15));
}

const catA = Math.floor(NUM_LINES * 0.5);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  const origin = rng()<0.4 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(origin, toothSurfRand(), 0);
}
const catB = Math.floor(NUM_LINES * 0.25);
for(let i = 0; i < catB && li < NUM_LINES; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  let best=null, bestD=Infinity;
  for(let j=0;j<8;j++){
    const b=anchors[Math.floor(rng()*anchors.length)];
    const d=a.distanceTo(b);
    if(d<bestD && d>0.2 && d<3.5){bestD=d;best=b;}
  }
  if(best) setLine(a,best,1);
}
for(let i = 0; i < 120 && li < NUM_LINES; i++){
  let pt = toothSurfRand();
  const radial = pt.clone().sub(toothCenter).normalize();
  const chainLen = 2 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.2 + rng()*0.5;
    const dev = new THREE.Vector3((rng()-0.5)*0.4,(rng()-0.5)*0.4,(rng()-0.5)*0.4);
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.clone().multiplyScalar(len));
    setLine(pt, next, 2);
    pt = next; prevDir = dir;
  }
}
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.2 ? toothSurfRand() : wallPt();
  setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const catOpacity = [0.06, 0.04, 0.055, 0.015];
const bR=0xc8/255, bG=0xb0/255, bB=0x78/255;
const colors = new Float32Array(li*6);
const baseColors = new Float32Array(li*6);
const linePhase = new Float32Array(li);

for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.015;
  const bright = op / 0.06;
  const distFade = Math.max(0.4, 1.0 - lineDist[i]*0.06);
  linePhase[i] = lineDist[i];
  for(let v = 0; v < 2; v++){
    baseColors[i*6+v*3]   = bR * bright * distFade;
    baseColors[i*6+v*3+1] = bG * bright * distFade;
    baseColors[i*6+v*3+2] = bB * bright * distFade;
  }
}
colors.set(baseColors);
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.07,
  blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(threads);

// ── DARK FRAGMENTS
const NUM_FRAGMENTS = 15;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.02 + rng()*0.05;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.3+rng()*0.7); const h = sz*(0.4+rng()*0.9);
  const verts = new Float32Array([
    w*(-0.35+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.1,
    -w*0.5, h*(-0.15+rng()*0.1), (rng()-0.5)*sz*0.1,
    w*(0.05-rng()*0.25), -h*0.5, (rng()-0.5)*sz*0.1,
    w*(-0.35+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.1,
    w*(0.2+rng()*0.15), h*(rng()*0.05), (rng()-0.5)*sz*0.1,
    w*(0.05-rng()*0.25), -h*0.5, (rng()-0.5)*sz*0.1
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.08 + rng()*0.06;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.85, d*0.55),
    transparent: true, opacity: 0.08 + rng()*0.15, side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  const si = Math.floor(rng()*li)*6;
  const t = 0.2+rng()*0.6;
  frag.position.set(
    basePositions[si]*(1-t)+basePositions[si+3]*t,
    basePositions[si+1]*(1-t)+basePositions[si+4]*t,
    basePositions[si+2]*(1-t)+basePositions[si+5]*t
  );
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA
const pathLen = 1200;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const rH = 4.0 + Math.sin(t * Math.PI * 4) * 0.8;
  const y = Math.sin(t * Math.PI * 2 + 0.3) * 1.5 + 0.5;
  dollyPath.push(new THREE.Vector3(Math.sin(p)*rH, y, Math.cos(p)*rH));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
const PULSE_COUNT = 3;
const PULSE_SPEED = [5.5, 6.0, 6.6];
const PULSE_WIDTH = 1.8;
const PULSE_BOOST = [1.6, 1.3, 1.05];
const MAX_DIST = 8.0;

// ── OOMPAH TIMING — Jean Tinguely-inspired mechanical surprise
// Cycle: 12 seconds. "oom" = slow swell (2s), "pah" = snap release (0.4s), recover (1s)
const OOMPAH_PERIOD = 12.0;
const OOM_START = 8.0;
const OOM_DURATION = 2.0;
const PAH_TIME = OOM_START + OOM_DURATION;
const PAH_DURATION = 0.4;
const RECOVER_DURATION = 1.2;

function oompahEnvelope(elapsed){
  const phase = elapsed % OOMPAH_PERIOD;
  if(phase < OOM_START) return { swell: 0, pah: 0, brass: 0 };
  if(phase < PAH_TIME){
    // OOM: slow inhale
    const t = (phase - OOM_START) / OOM_DURATION;
    const ease = t * t * (3 - 2 * t); // smoothstep
    return { swell: ease * 0.18, pah: 0, brass: ease * 0.4 };
  }
  if(phase < PAH_TIME + PAH_DURATION){
    // PAH: snap!
    const t = (phase - PAH_TIME) / PAH_DURATION;
    const snap = Math.sin(t * Math.PI);
    return { swell: 0.18 * (1 - t * 3), pah: snap, brass: 0.4 + snap * 0.6 };
  }
  if(phase < PAH_TIME + PAH_DURATION + RECOVER_DURATION){
    // Recovery — gentle bounce back
    const t = (phase - PAH_TIME - PAH_DURATION) / RECOVER_DURATION;
    const bounce = Math.sin(t * Math.PI * 2.5) * Math.exp(-t * 4);
    return { swell: bounce * 0.04, pah: 0, brass: (1 - t) * 0.15 };
  }
  return { swell: 0, pah: 0, brass: 0 };
}

// Bone color and brass color for lerp
const boneColor = new THREE.Color(0xf0e4c8);
const brassColor = new THREE.Color(0xd4a030);
const boneEmissive = new THREE.Color(0xd8c8a0);
const brassEmissive = new THREE.Color(0xc89020);

function loop(){
  const elapsed = (performance.now()-t0)/1000;
  const oompah = oompahEnvelope(elapsed);

  // ── OOMPAH: tooth scale swell
  const sc = 1.0 + oompah.swell;
  tooth.scale.set(sc, 1.0 + oompah.swell * 0.3, sc);
  core.scale.copy(tooth.scale);

  // Color shift: bone → brass
  const lerpT = oompah.brass;
  toothMat.color.copy(boneColor).lerp(brassColor, lerpT);
  toothMat.emissive.copy(boneEmissive).lerp(brassEmissive, lerpT);
  toothMat.metalness = 0.02 + lerpT * 0.5;
  toothMat.roughness = 0.85 - lerpT * 0.5;

  // Bell emerges from tip during oompah
  const bellVis = Math.max(0, oompah.brass - 0.1) / 0.9;
  bellMat.opacity = bellVis * 0.6;
  const bellSc = 0.3 + bellVis * 0.7;
  bell.scale.set(bellSc, bellSc * (1 + oompah.pah * 0.5), bellSc);
  bell.position.y = toothCenter.y - oompah.pah * 0.3;

  // Sound rings burst on "pah"
  const pahPhase = elapsed % OOMPAH_PERIOD;
  for(let i = 0; i < NUM_RINGS; i++){
    const r = rings[i];
    const ringT = pahPhase - PAH_TIME - r.delay;
    if(ringT > 0 && ringT < 1.5){
      const expand = ringT / 1.5;
      const fade = 1.0 - expand;
      r.mesh.material.opacity = fade * 0.4 * oompah.pah + fade * 0.15;
      const s = 1.0 + expand * 3.0;
      r.mesh.scale.set(s, s, s);
      r.mesh.position.y = -3.5 - expand * 2.0;
    } else {
      r.mesh.material.opacity = 0;
      r.mesh.scale.set(1,1,1);
    }
  }

  // Ostinato color pulse — with brass tint during oompah
  const colArr = lineGeo.attributes.color.array;
  const brassR = 0xd4/255, brassG = 0xa0/255, brassB = 0x30/255;
  for(let i = 0; i < li; i++){
    const dist = linePhase[i];
    let boost = 1.0;
    for(let p = 0; p < PULSE_COUNT; p++){
      const pulsePos = (elapsed * PULSE_SPEED[p]) % (MAX_DIST + PULSE_WIDTH*2);
      const delta = Math.abs(dist - pulsePos);
      if(delta < PULSE_WIDTH){
        const t = delta / PULSE_WIDTH;
        const envelope = Math.cos(t * Math.PI * 0.5);
        boost += envelope * envelope * (PULSE_BOOST[p] - 1.0) * Math.max(0.3, 1.0 - dist/MAX_DIST);
      }
    }
    // Oompah: stronger pulse during swell, add brass tint
    const oBoost = 1.0 + oompah.pah * 2.0 * Math.max(0, 1.0 - dist / 4.0);
    for(let v = 0; v < 2; v++){
      const vi = i*6+v*3;
      const r0 = baseColors[vi], g0 = baseColors[vi+1], b0 = baseColors[vi+2];
      colArr[vi]   = Math.min(1.0, (r0 + lerpT * brassR * 0.3) * boost * oBoost);
      colArr[vi+1] = Math.min(1.0, (g0 + lerpT * brassG * 0.15) * boost * oBoost);
      colArr[vi+2] = Math.min(1.0, (b0 - lerpT * 0.02) * boost * oBoost);
    }
  }
  lineGeo.attributes.color.needsUpdate = true;

  // Thread micro-breathing — amplified during oompah
  const breathAmpMul = 1.0 + oompah.pah * 8.0;
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const baseAmp = 0.00008 * Math.max(0, 1.0-dist/8.0);
    const pulsePos0 = (elapsed * PULSE_SPEED[0]) % (MAX_DIST + PULSE_WIDTH*2);
    const pDelta = Math.abs(dist - pulsePos0);
    const tugAmp = pDelta < PULSE_WIDTH
      ? Math.cos(pDelta/PULSE_WIDTH * Math.PI*0.5) * 0.008 * Math.max(0, 1.0-dist/MAX_DIST) : 0.0;
    const amp = (baseAmp + tugAmp) * breathAmpMul;
    const phase = basePositions[idx]*0.09 + basePositions[idx+1]*0.11 + i*0.00025;
    const breath = Math.sin(elapsed*0.8+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.09;
      arr[vi+2] = basePositions[vi+2] + breath*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Tooth heartbeat — accelerates during oompah
  const beatRate = 0.8 + oompah.brass * 1.5;
  const beatPhase = (elapsed * PULSE_SPEED[0] * beatRate) % (Math.PI * 2);
  const heartbeat = 0.5 + 0.5 * Math.sin(beatPhase);
  toothMat.opacity = 0.3 + heartbeat * 0.1 + oompah.brass * 0.15;
  toothMat.emissiveIntensity = 0.1 + heartbeat * 0.08 + oompah.brass * 0.2;
  core.material.opacity = 0.04 + heartbeat * 0.03 + oompah.pah * 0.08;

  engMat.opacity = 0.7 + heartbeat * 0.2;

  // Camera — slight shake on pah
  const speed = 0.00025;
  const pathT = (elapsed*speed)%1.0;
  const cIdx = pathT*(pathLen-1);
  const i0 = Math.floor(cIdx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = cIdx-Math.floor(cIdx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Pah shake — brief camera wobble like a brass instrument's recoil
  if(oompah.pah > 0.1){
    const shakeAmp = oompah.pah * 0.08;
    camera.position.x += Math.sin(elapsed*47) * shakeAmp;
    camera.position.y += Math.cos(elapsed*53) * shakeAmp * 0.6;
  }

  const look = toothCenter.clone();
  look.y += Math.cos(elapsed*0.0005)*0.2 + 0.1;
  camera.lookAt(look);

  pL.position.x = 2 + Math.sin(elapsed*0.0003)*0.1;
  pL.position.y = 4 + Math.cos(elapsed*0.00018)*0.06;
  pL.intensity = 0.55 + heartbeat*0.08 + oompah.brass * 0.3;

  // During oompah, second light warms to brass
  pL2.color.setHex(lerpT > 0.1 ? 0xe8b850 : 0xd4c4a0);
  pL2.intensity = 0.3 + oompah.brass * 0.4;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
