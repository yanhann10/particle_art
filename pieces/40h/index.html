<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40h · thread installation · shiota convergence</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">40h</div>
<div class="hint">8000 crimson threads · converge to memory</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 35);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

const N_THREADS = 8000;
const ANCHORS = [
  new THREE.Vector3(0, -2, 0),
  new THREE.Vector3(-3, 1, -2),
  new THREE.Vector3(3, 1, 2),
  new THREE.Vector3(0, 4, 0),
  new THREE.Vector3(0, -5, 3)
];

// thread endpoints: one end on anchor, other end scattered in volume
const threadData = [];
for (let i = 0; i < N_THREADS; i++){
  const anchorIdx = Math.floor(Math.random() * ANCHORS.length);
  const anchor = ANCHORS[anchorIdx].clone();
  
  // scatter endpoints in architectural volume: wider horizontally, taller vertically
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.acos(Math.random() * 2 - 1);
  const radius = 8 + Math.random() * 14;
  
  const x = radius * Math.sin(theta) * Math.cos(phi);
  const y = radius * Math.sin(theta) * Math.sin(phi) * 0.7 - 4; // bias downward
  const z = radius * Math.cos(theta);
  
  const endpoint = new THREE.Vector3(x, y, z);
  
  threadData.push({
    anchor: anchor.clone(),
    endpoint: endpoint.clone(),
    restAnchor: anchor.clone(),
    restEndpoint: endpoint.clone(),
    seed: Math.random(),
    phase: Math.random() * Math.PI * 2,
    anchorIdx
  });
}

const material = new THREE.LineBasicMaterial({
  color: 0x9c1f1f, // crimson
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lines = [];
threadData.forEach(thread => {
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(6);
  pos[0] = thread.anchor.x;
  pos[1] = thread.anchor.y;
  pos[2] = thread.anchor.z;
  pos[3] = thread.endpoint.x;
  pos[4] = thread.endpoint.y;
  pos[5] = thread.endpoint.z;
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.Line(geom, material);
  scene.add(line);
  lines.push({ line, thread });
});

// pointer interaction
const pointer = new THREE.Vector2();
const pointerWorld = new THREE.Vector3();
let pointerActive = false;

addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  pointerActive = true;
  
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  raycaster.ray.intersectPlane(plane, pointerWorld);
});

addEventListener('pointerleave', () => {
  pointerActive = false;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  lines.forEach(({ line, thread }) => {
    const pos = line.geometry.attributes.position.array;
    
    // gentle breathing motion on endpoints
    const breathe = Math.sin(t * 0.5 + thread.phase) * 0.15;
    const breatheDir = new THREE.Vector3()
      .subVectors(thread.restEndpoint, thread.restAnchor)
      .normalize();
    
    thread.endpoint.copy(thread.restEndpoint).addScaledVector(breatheDir, breathe);
    
    // subtle perpendicular sway
    const swayX = Math.sin(t * 0.3 + thread.seed * 6.28) * 0.08;
    const swayZ = Math.cos(t * 0.4 + thread.seed * 9.42) * 0.08;
    thread.endpoint.x += swayX;
    thread.endpoint.z += swayZ;
    
    // pointer pull on endpoints (gentle)
    if (pointerActive) {
      const dist = thread.endpoint.distanceTo(pointerWorld);
      if (dist < 12) {
        const pull = (1.0 - dist / 12) * 0.15;
        thread.endpoint.lerp(pointerWorld, pull);
      }
    }
    
    // anchor subtle rotation around Y (convergence breathes)
    const anchorBase = ANCHORS[thread.anchorIdx];
    const rotY = Math.sin(t * 0.15 + thread.anchorIdx) * 0.05;
    thread.anchor.copy(anchorBase);
    const dx = thread.anchor.x - anchorBase.x;
    const dz = thread.anchor.z - anchorBase.z;
    thread.anchor.x = anchorBase.x + dx * Math.cos(rotY) - dz * Math.sin(rotY);
    thread.anchor.z = anchorBase.z + dx * Math.sin(rotY) + dz * Math.cos(rotY);
    
    pos[0] = thread.anchor.x;
    pos[1] = thread.anchor.y;
    pos[2] = thread.anchor.z;
    pos[3] = thread.endpoint.x;
    pos[4] = thread.endpoint.y;
    pos[5] = thread.endpoint.z;
    
    line.geometry.attributes.position.needsUpdate = true;
  });
  
  // camera slow orbit to reveal depth
  camera.position.x = Math.sin(t * 0.04) * 35;
  camera.position.z = Math.cos(t * 0.04) * 35;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
