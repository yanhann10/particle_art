<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40h · thread installation · shiota convergence</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">40h</div>
<div class="hint">8000 crimson threads · converge to memory</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 35);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

const N_THREADS = 8000;
const ANCHORS = [
  new THREE.Vector3(0, -2, 0),
  new THREE.Vector3(-3, 1, -2),
  new THREE.Vector3(3, 1, 2),
  new THREE.Vector3(0, 4, 0),
  new THREE.Vector3(0, -5, 3)
];

// thread endpoints: one end on anchor, other end scattered in volume
const threadData = [];
for (let i = 0; i < N_THREADS; i++){
  const anchorIdx = Math.floor(Math.random() * ANCHORS.length);
  const anchor = ANCHORS[anchorIdx].clone();
  
  // scatter endpoints in architectural volume: wider horizontally, taller vertically
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.acos(Math.random() * 2 - 1);
  const radius = 8 + Math.random() * 14;
  
  const x = radius * Math.sin(theta) * Math.cos(phi);
  const y = radius * Math.sin(theta) * Math.sin(phi) * 0.7 - 4; // bias downward
  const z = radius * Math.cos(theta);
  
  const endpoint = new THREE.Vector3(x, y, z);
  
  threadData.push({
    anchor: anchor.clone(),
    endpoint: endpoint.clone(),
    restAnchor: anchor.clone(),
    restEndpoint: endpoint.clone(),
    seed: Math.random(),
    phase: Math.random() * Math.PI * 2,
    anchorIdx
  });
}

const material = new THREE.LineBasicMaterial({
  color: 0x9c1f1f, // crimson
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const lines = [];
threadData.forEach(thread => {
  const geom = new THREE.BufferGeometry();
  const pos = new Float32Array(6);
  pos[0] = thread.anchor.x;
  pos[1] = thread.anchor.y;
  pos[2] = thread.anchor.z;
  pos[3] = thread.endpoint.x;
  pos[4] = thread.endpoint.y;
  pos[5] = thread.endpoint.z;
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const line = new THREE.Line(geom, material);
  scene.add(line);
  lines.push({ line, thread });
});

// pointer interaction
const pointer = new THREE.Vector2();
const pointerWorld = new THREE.Vector3();
let pointerActive = false;

addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  pointerActive = true;
  
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  raycaster.ray.intersectPlane(plane, pointerWorld);
});

addEventListener('pointerleave', () => {
  pointerActive = false;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  lines.forEach(({ line, thread }) => {
    const pos = line.geometry.attributes.position.array;
    
    // gentle breathing motion on endpoints
    const breathe = Math.sin(t * 0.5 + thread.phase) * 0.15;
    const breatheDir = new THREE.Vector3()
      .subVectors(thread.restEndpoint, thread.restAnchor)
      .normalize();
    
    thread.endpoint.copy(thread.restEndpoint).addScaledVector(breatheDir, breathe);
    
    // subtle perpendicular sway
    const swayX = Math.sin(t * 0.3 + thread.seed * 6.28) * 0.08;
    const swayZ = Math.cos(t * 0.4 + thread.seed * 9.42) * 0.08;
    thread.endpoint.x += swayX;
    thread.endpoint.z += swayZ;
    
    // pointer pull on endpoints (gentle)
    if (pointerActive) {
      const dist = thread.endpoint.distanceTo(pointerWorld);
      if (dist < 12) {
        const pull = (1.0 - dist / 12) * 0.15;
        thread.endpoint.lerp(pointerWorld, pull);
      }
    }
    
    // anchor subtle rotation around Y (convergence breathes)
    const anchorBase = ANCHORS[thread.anchorIdx];
    const rotY = Math.sin(t * 0.15 + thread.anchorIdx) * 0.05;
    thread.anchor.copy(anchorBase);
    const dx = thread.anchor.x - anchorBase.x;
    const dz = thread.anchor.z - anchorBase.z;
    thread.anchor.x = anchorBase.x + dx * Math.cos(rotY) - dz * Math.sin(rotY);
    thread.anchor.z = anchorBase.z + dx * Math.sin(rotY) + dz * Math.cos(rotY);
    
    pos[0] = thread.anchor.x;
    pos[1] = thread.anchor.y;
    pos[2] = thread.anchor.z;
    pos[3] = thread.endpoint.x;
    pos[4] = thread.endpoint.y;
    pos[5] = thread.endpoint.z;
    
    line.geometry.attributes.position.needsUpdate = true;
  });
  
  // camera slow orbit to reveal depth
  camera.position.x = Math.sin(t * 0.04) * 35;
  camera.position.z = Math.cos(t * 0.04) * 35;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
