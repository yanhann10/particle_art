<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>63t · rising vascular tower</title>
<!-- MOTION: ascend, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1108; overflow:hidden;
               color:#FFD166; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">63t</div>
<div class="hint">drag to orbit · membrane climbs upward as it grows</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const LERP = 0.035;
const JOY_COLORS = [
  new THREE.Color(0xFFD166), // gold
  new THREE.Color(0xFFB3BA), // soft pink
  new THREE.Color(0xFFAA88), // coral
  new THREE.Color(0xFFF4E0), // cream
];
const BG = 0x1a1108;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.015);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 300);
camera.position.set(12, 14, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 8, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Differential growth membrane — vertices climb with age-based upward velocity
const INITIAL_RING_COUNT = 10;
const INITIAL_POINTS_PER_RING = 24;
const MAX_VERTICES = 60000;
const SPLIT_THRESHOLD = 0.45;
const COHESION_RADIUS = 0.6;
const REPULSION_RADIUS = 0.28;
const REPULSION_FORCE = 0.022;
const COHESION_FORCE = 0.014;
const GROWTH_RATE = 0.0015;

// age = time since vertex was created; older vertices rise faster
const vertices = [];
const edges = [];

function initMembrane() {
  const baseRadius = 4.5;
  for (let r = 0; r < INITIAL_RING_COUNT; r++) {
    const radius = baseRadius * (r / (INITIAL_RING_COUNT - 1));
    const vertexRing = [];
    for (let i = 0; i < INITIAL_POINTS_PER_RING; i++) {
      const angle = (i / INITIAL_POINTS_PER_RING) * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const y = 0;
      const colorIdx = Math.floor(Math.random() * JOY_COLORS.length);
      const age = 0;
      const anchorStrength = (r === 0) ? 1.0 : 0.0; // bottom ring anchored
      vertices.push({ x, y, z, vx:0, vy:0, vz:0, colorIdx, age, anchorStrength, restY: y });
      vertexRing.push(vertices.length - 1);
    }
    if (r > 0) {
      const prevRingStart = vertices.length - INITIAL_POINTS_PER_RING * 2;
      for (let i = 0; i < INITIAL_POINTS_PER_RING; i++) {
        const curr = vertexRing[i];
        const next = vertexRing[(i + 1) % INITIAL_POINTS_PER_RING];
        const prevA = prevRingStart + i;
        const prevB = prevRingStart + ((i + 1) % INITIAL_POINTS_PER_RING);
        edges.push([curr, next]);
        edges.push([curr, prevA]);
        edges.push([curr, prevB]);
      }
    } else {
      for (let i = 0; i < INITIAL_POINTS_PER_RING; i++) {
        const curr = vertexRing[i];
        const next = vertexRing[(i + 1) % INITIAL_POINTS_PER_RING];
        edges.push([curr, next]);
      }
    }
  }
}

initMembrane();

const lineGeometry = new THREE.BufferGeometry();
const posArray = new Float32Array(MAX_VERTICES * 6);
const colorArray = new Float32Array(MAX_VERTICES * 6);
lineGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
lineGeometry.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true, fog: true });
const lineMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(lineMesh);

function updateGeometry() {
  let idx = 0;
  const usedEdges = Math.min(edges.length, MAX_VERTICES / 2);
  for (let i = 0; i < usedEdges; i++) {
    const [ai, bi] = edges[i];
    const a = vertices[ai];
    const b = vertices[bi];
    const avgColorIdx = Math.floor((a.colorIdx + b.colorIdx) / 2) % JOY_COLORS.length;
    const col = JOY_COLORS[avgColorIdx];
    posArray[idx * 3 + 0] = a.x;
    posArray[idx * 3 + 1] = a.y;
    posArray[idx * 3 + 2] = a.z;
    colorArray[idx * 3 + 0] = col.r;
    colorArray[idx * 3 + 1] = col.g;
    colorArray[idx * 3 + 2] = col.b;
    idx++;
    posArray[idx * 3 + 0] = b.x;
    posArray[idx * 3 + 1] = b.y;
    posArray[idx * 3 + 2] = b.z;
    colorArray[idx * 3 + 0] = col.r;
    colorArray[idx * 3 + 1] = col.g;
    colorArray[idx * 3 + 2] = col.b;
    idx++;
  }
  lineGeometry.setDrawRange(0, idx);
  lineGeometry.attributes.position.needsUpdate = true;
  lineGeometry.attributes.color.needsUpdate = true;
}

function differentialGrowthStep(dt) {
  const edgeSet = new Set(edges.map(e => `${e[0]}-${e[1]}`));
  
  // Age all vertices
  for (const v of vertices) {
    v.age += dt;
  }

  // Repulsion + cohesion forces
  for (let i = 0; i < vertices.length; i++) {
    const vi = vertices[i];
    let fx = 0, fy = 0, fz = 0;
    for (let j = 0; j < vertices.length; j++) {
      if (i === j) continue;
      const vj = vertices[j];
      const dx = vi.x - vj.x;
      const dy = vi.y - vj.y;
      const dz = vi.z - vj.z;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (dist < REPULSION_RADIUS && dist > 0.01) {
        const force = REPULSION_FORCE / (dist * dist);
        fx += (dx / dist) * force;
        fy += (dy / dist) * force;
        fz += (dz / dist) * force;
      }
      if (dist < COHESION_RADIUS && dist > REPULSION_RADIUS) {
        const force = COHESION_FORCE * (dist - REPULSION_RADIUS);
        fx -= (dx / dist) * force;
        fy -= (dy / dist) * force;
        fz -= (dz / dist) * force;
      }
    }
    vi.vx += fx;
    vi.vy += fy;
    vi.vz += fz;
  }

  // Upward drift based on age — older vertices climb faster
  for (const v of vertices) {
    const driftSpeed = 0.8 * (1 - Math.exp(-v.age * 0.4)); // asymptotic approach to max speed
    v.vy += driftSpeed * dt * 2.0;
  }

  // Apply velocities with LERP damping and anchor constraint
  for (const v of vertices) {
    v.vx *= 0.92;
    v.vy *= 0.94;
    v.vz *= 0.92;
    const maxVel = 0.15;
    const velMag = Math.sqrt(v.vx * v.vx + v.vy * v.vy + v.vz * v.vz);
    if (velMag > maxVel) {
      v.vx = (v.vx / velMag) * maxVel;
      v.vy = (v.vy / velMag) * maxVel;
      v.vz = (v.vz / velMag) * maxVel;
    }
    const targetX = v.x + v.vx;
    const targetY = v.y + v.vy;
    const targetZ = v.z + v.vz;
    v.x += (targetX - v.x) * LERP * 60 * dt;
    v.y += (targetY - v.y) * LERP * 60 * dt;
    v.z += (targetZ - v.z) * LERP * 60 * dt;

    // Anchor bottom vertices
    if (v.anchorStrength > 0) {
      v.y += (v.restY - v.y) * v.anchorStrength * 0.5;
    }
  }

  // Edge splitting
  if (vertices.length < MAX_VERTICES - 100) {
    const edgesToSplit = [];
    for (const [ai, bi] of edges) {
      const a = vertices[ai];
      const b = vertices[bi];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dz = a.z - b.z;
      const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (len > SPLIT_THRESHOLD && Math.random() < GROWTH_RATE) {
        edgesToSplit.push([ai, bi, len]);
      }
    }
    for (const [ai, bi, len] of edgesToSplit) {
      if (vertices.length >= MAX_VERTICES - 10) break;
      const a = vertices[ai];
      const b = vertices[bi];
      const mx = (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.05;
      const my = (a.y + b.y) * 0.5 + (Math.random() - 0.5) * 0.05;
      const mz = (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.05;
      const avgAge = (a.age + b.age) * 0.5;
      const colorIdx = Math.random() < 0.5 ? a.colorIdx : b.colorIdx;
      const midIdx = vertices.length;
      vertices.push({ x: mx, y: my, z: mz, vx:0, vy:0, vz:0, colorIdx, age: avgAge, anchorStrength:0, restY: my });
      const edgeIdx = edges.findIndex(e => (e[0] === ai && e[1] === bi) || (e[0] === bi && e[1] === ai));
      if (edgeIdx >= 0) {
        edges.splice(edgeIdx, 1);
      }
      edges.push([ai, midIdx]);
      edges.push([midIdx, bi]);
    }
  }
}

// Ambient lighting
const ambientLight = new THREE.AmbientLight(0xFFD166, 0.35);
scene.add(ambientLight);
const topLight = new THREE.DirectionalLight(0xFFB3BA, 0.6);
topLight.position.set(3, 18, 5);
scene.add(topLight);
const sideLight = new THREE.DirectionalLight(0xFFAA88, 0.4);
sideLight.position.set(-8, 6, -4);
scene.add(sideLight);

const startT = performance.now();
let prevT = startT;

function loop() {
  const nowMs = performance.now();
  const t = (nowMs - startT) / 1000;
  const dt = Math.min((nowMs - prevT) / 1000, 0.033);
  prevT = nowMs;

  differentialGrowthStep(dt);
  updateGeometry();

  // Track centroid for camera
  let sumX = 0, sumY = 0, sumZ = 0;
  for (const v of vertices) {
    sumX += v.x;
    sumY += v.y;
    sumZ += v.z;
  }
  const centroidY = sumY / vertices.length;
  controls.target.y += (centroidY - controls.target.y) * LERP * 0.8;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
