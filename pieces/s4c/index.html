<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s4c · data-flow dream</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050510; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #0a0520; color:#e5d6f0; border:1px solid #2a1550;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#150a35; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">s4c</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050510, 1);
document.body.appendChild(renderer.domElement);

// GPGPU setup for 200k+ particles
const SQRT = 512;
const N = SQRT * SQRT;

// position FBO (rg=xy, ba=zw for extended precision if needed, here just xyz)
const posTex = new THREE.DataTexture(
  new Float32Array(SQRT*SQRT*4),
  SQRT, SQRT, THREE.RGBAFormat, THREE.FloatType
);
posTex.needsUpdate = true;
const posData = posTex.image.data;
for (let i=0; i<N; i++){
  const theta = Math.random()*Math.PI*2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 10 + Math.random()*50;
  posData[i*4]   = r*Math.sin(phi)*Math.cos(theta);
  posData[i*4+1] = r*Math.sin(phi)*Math.sin(theta);
  posData[i*4+2] = r*Math.cos(phi);
  posData[i*4+3] = Math.random();
}

// velocity FBO
const velTex = new THREE.DataTexture(
  new Float32Array(SQRT*SQRT*4),
  SQRT, SQRT, THREE.RGBAFormat, THREE.FloatType
);
velTex.needsUpdate = true;

const posTarget = new THREE.WebGLRenderTarget(SQRT, SQRT, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});
const velTarget = new THREE.WebGLRenderTarget(SQRT, SQRT, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});
const posTarget2 = posTarget.clone();
const velTarget2 = velTarget.clone();

const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const simQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.ShaderMaterial({
    uniforms: {
      tPos: { value: posTex },
      tVel: { value: velTex },
      uTime: { value: 0 },
      uDelta: { value: 0.016 },
      uBass: { value: 0 },
      uMid: { value: 0 },
      uHigh: { value: 0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tPos;
      uniform sampler2D tVel;
      uniform float uTime;
      uniform float uDelta;
      uniform float uBass;
      uniform float uMid;
      uniform float uHigh;
      varying vec2 vUv;

      vec3 flowField(vec3 p, float t){
        float scale = 0.04;
        float px = p.x*scale + t*0.1;
        float py = p.y*scale + t*0.15;
        float pz = p.z*scale + t*0.12;
        vec3 f;
        f.x = sin(py*1.3 + cos(pz*1.7))*cos(px*1.1 + sin(pz*0.9));
        f.y = cos(pz*1.5 + sin(px*1.4))*sin(py*1.2 + cos(px*0.8));
        f.z = sin(px*1.6 + cos(py*1.3))*cos(pz*0.9 + sin(py*1.1));
        return normalize(f);
      }

      void main(){
        vec4 pos = texture2D(tPos, vUv);
        vec4 vel = texture2D(tVel, vUv);
        vec3 p = pos.xyz;
        vec3 v = vel.xyz;

        vec3 flow = flowField(p, uTime);
        float energy = (uBass + uMid + uHigh) / 3.0;
        float drift = 2.0 + energy * 8.0;
        vec3 acc = flow * drift;

        // attractor toward origin with audio modulation
        float dist = length(p);
        vec3 toCenter = -normalize(p);
        acc += toCenter * (0.5 + uBass * 2.0) * max(0.0, (dist-20.0)*0.02);

        v += acc * uDelta;
        v *= 0.96;
        p += v * uDelta;

        gl_FragColor = vec4(p, pos.w);
      }
    `
  })
);
simScene.add(simQuad);

const velSimQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.ShaderMaterial({
    uniforms: {
      tPos: { value: null },
      tVel: { value: null },
      uTime: { value: 0 },
      uDelta: { value: 0.016 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tPos;
      uniform sampler2D tVel;
      uniform float uTime;
      uniform float uDelta;
      varying vec2 vUv;
      void main(){
        vec4 vel = texture2D(tVel, vUv);
        gl_FragColor = vel;
      }
    `
  })
);

// render particles
const uvs = new Float32Array(N*2);
for (let i=0; i<SQRT; i++){
  for (let j=0; j<SQRT; j++){
    const idx = i*SQRT + j;
    uvs[idx*2]   = j/(SQRT-1);
    uvs[idx*2+1] = i/(SQRT-1);
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const uBands = new THREE.Vector4(0,0,0,0);
const mat = new THREE.ShaderMaterial({
  uniforms: {
    tPos: { value: posTarget.texture },
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() },
    uBass: { value: 0 },
    uMid: { value: 0 },
    uHigh: { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D tPos;
    uniform float uTime;
    uniform float uPixel;
    uniform float uBass;
    uniform float uMid;
    uniform float uHigh;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec4 pos = texture2D(tPos, uv);
      vec3 p = pos.xyz;
      float seed = pos.w;

      float dist = length(p);
      float energy = (uBass*0.5 + uMid*0.3 + uHigh*0.2);
      vEnergy = energy;

      // pearlescent cyan-violet duotone with white-hot core
      vec3 cyan = vec3(0.4, 0.85, 0.95);
      vec3 violet = vec3(0.7, 0.45, 0.9);
      vec3 white = vec3(1.0, 0.98, 1.0);
      float coreProx = 1.0 - smoothstep(0.0, 30.0, dist);
      float hotness = coreProx * energy * 2.0;
      vec3 base = mix(violet, cyan, sin(seed*6.28 + uTime*0.3)*0.5+0.5);
      vCol = mix(base, white, clamp(hotness, 0.0, 0.8));
      vCol *= (0.7 + energy * 1.3);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      float sz = (0.8 + energy * 1.8) * uPixel * (120.0 / depth);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float core = exp(-r * 20.0);
      float glow = exp(-r * 6.0);
      float a = (core * 0.6 + glow * 0.4) * (0.5 + vEnergy * 0.5);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 262k particles · refik anadol flow';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic flow mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
let lastT = start;

// copy initial textures
renderer.setRenderTarget(posTarget);
renderer.render(new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.MeshBasicMaterial({map: posTex})
), simCam);
renderer.setRenderTarget(velTarget);
renderer.render(new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.MeshBasicMaterial({map: velTex})
), simCam);
renderer.setRenderTarget(null);

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  let bass=0, mid=0, high=0;
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    bass = bandEnergy(freqData, 0, Math.floor(n*0.1));
    mid = bandEnergy(freqData, Math.floor(n*0.1), Math.floor(n*0.4));
    high = bandEnergy(freqData, Math.floor(n*0.4), n);
  } else {
    bass = 0.3 + 0.2 * Math.sin(t*1.1);
    mid = 0.25 + 0.15 * Math.sin(t*1.7 + 1.0);
    high = 0.2 + 0.1 * Math.sin(t*2.3 + 2.0);
  }

  // update simulation
  simQuad.material.uniforms.tPos.value = posTarget.texture;
  simQuad.material.uniforms.tVel.value = velTarget.texture;
  simQuad.material.uniforms.uTime.value = t;
  simQuad.material.uniforms.uDelta.value = dt;
  simQuad.material.uniforms.uBass.value = bass;
  simQuad.material.uniforms.uMid.value = mid;
  simQuad.material.uniforms.uHigh.value = high;

  renderer.setRenderTarget(posTarget2);
  renderer.render(simScene, simCam);

  // swap
  [posTarget, posTarget2].forEach((rt, i) => {
    const temp = posTarget;
    posTarget = posTarget2;
    posTarget2 = temp;
  });

  mat.uniforms.tPos.value = posTarget.texture;
  mat.uniforms.uTime.value = t;
  mat.uniforms.uBass.value = bass;
  mat.uniforms.uMid.value = mid;
  mat.uniforms.uHigh.value = high;

  // camera drift
  camera.position.x = Math.sin(t*0.05) * 15;
  camera.position.y = Math.cos(t*0.07) * 10;
  camera.lookAt(0,0,0);

  renderer.setRenderTarget(null);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
