<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u2e · aizawa attractor (disrupted grid)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">u2e</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Aizawa attractor with deliberate grid disruption: the GPGPU simulation runs 
// 102400 particles but we CULL specific zones to create voids, concentrate others
// into density spikes, and offset the camera framing to break symmetry.
// Inspired by Agnes Martin's late work where grid breaks = points of meaning.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init with four disruptions embedded in the initial distribution
const init = new Float32Array(N * 4);
const voidA = { cx: 0.8, cy: -0.3, cz: 0.5, r: 0.55 }; // empty sphere
const voidB = { cx: -0.7, cy: 0.4, cz: -0.2, r: 0.35 }; // smaller void
const spikeZone = { cx: 0.0, cy: 0.0, cz: 1.2, r: 0.25 }; // density peak
const edgeCull = { xMin: 0.5, xMax: 1.0, yMin: -1.0, yMax: -0.5 }; // missing quadrant

for (let i = 0; i < N; i++){
  let x, y, z, attempts = 0;
  do {
    x = (Math.random()*2-1) * 0.6;
    y = (Math.random()*2-1) * 0.6;
    z = (Math.random()*2-1) * 0.6;
    attempts++;
    if (attempts > 50) break; // prevent infinite loop
  } while (
    // cull voidA
    (Math.pow(x - voidA.cx, 2) + Math.pow(y - voidA.cy, 2) + Math.pow(z - voidA.cz, 2) < voidA.r * voidA.r) ||
    // cull voidB
    (Math.pow(x - voidB.cx, 2) + Math.pow(y - voidB.cy, 2) + Math.pow(z - voidB.cz, 2) < voidB.r * voidB.r) ||
    // cull edge quadrant
    (x > edgeCull.xMin && x < edgeCull.xMax && y > edgeCull.yMin && y < edgeCull.yMax)
  );
  
  // 18% of particles get pulled into spike zone
  if (Math.random() < 0.18) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    const rr = Math.random() * spikeZone.r;
    x = spikeZone.cx + rr * Math.sin(phi) * Math.cos(theta);
    y = spikeZone.cy + rr * Math.sin(phi) * Math.sin(theta);
    z = spikeZone.cz + rr * Math.cos(phi);
  }
  
  init[i*4]   = x;
  init[i*4+1] = y;
  init[i*4+2] = z;
  init[i*4+3] = Math.random();
}

const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0.6, -0.4, 4.2); // off-center framing to break symmetry
camera.lookAt(0.15, 0.1, 0.8);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying vec3 vPos;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vPos = p;
      
      // runtime culling to maintain disrupted zones even as particles flow
      float dx1 = p.x - 0.8, dy1 = p.y + 0.3, dz1 = p.z - 0.5;
      float distVoidA = sqrt(dx1*dx1 + dy1*dy1 + dz1*dz1);
      float dx2 = p.x + 0.7, dy2 = p.y - 0.4, dz2 = p.z + 0.2;
      float distVoidB = sqrt(dx2*dx2 + dy2*dy2 + dz2*dz2);
      
      if (distVoidA < 0.55 || distVoidB < 0.35 || (p.x > 0.5 && p.y < -0.5)) {
        gl_Position = vec4(0.0, 0.0, -999.0, 1.0);
        gl_PointSize = 0.0;
        return;
      }
      
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      // density spike particles get 2.2× larger
      float dx3 = p.x, dy3 = p.y, dz3 = p.z - 1.2;
      float distSpike = sqrt(dx3*dx3 + dy3*dy3 + dz3*dz3);
      float sizeMult = distSpike < 0.25 ? 2.2 : 1.0;
      
      gl_PointSize = sizeMult * (1.1 + 1.5 * vSpeed) * uPixel * (8.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying vec3 vPos;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      
      // three-color palette: charcoal, rust, ice-blue — Agnes Martin's late restricted chroma
      vec3 col1 = vec3(0.18, 0.18, 0.20); // charcoal
      vec3 col2 = vec3(0.62, 0.28, 0.18); // rust
      vec3 col3 = vec3(0.75, 0.85, 0.92); // ice
      
      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(col1, col2, smoothstep(0.0, 0.5, k));
      col = mix(col, col3, smoothstep(0.5, 1.0, k));
      
      // brighten spike zone particles
      float dx = vPos.x, dy = vPos.y, dz = vPos.z - 1.2;
      float distSpike = sqrt(dx*dx + dy*dy + dz*dz);
      float brightMult = distSpike < 0.25 ? 1.6 : 1.0;
      
      gl_FragColor = vec4(col * a * brightMult * (0.45 + vSpeed * 0.9), a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;
  
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;
  
  // asymmetric drift: camera circles but off-axis, the orbit itself is broken
  const ang = elapsed * 0.12;
  const orbitR = 4.2 + Math.sin(ang * 0.7) * 0.3;
  const orbitPhase = ang + Math.sin(ang * 0.4) * 0.6; // phase distortion
  camera.position.x = 0.6 + Math.sin(orbitPhase) * orbitR * 0.85;
  camera.position.z = Math.cos(orbitPhase) * orbitR;
  camera.position.y = -0.4 + Math.sin(ang * 0.5) * 0.6;
  camera.lookAt(0.15, 0.1, 0.8);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
