<!-- PATTERN: html-head-boilerplate
     Every piece opens with this block.
     TUNABLE:
       {{PIECE_ID}}   — 3-char piece code, e.g. z1b
       {{TITLE}}      — human title after the ·, e.g. "Shiota — Arterial Cathedral"
       {{MOTION}}     — MOTION comment value, e.g. "gather"
       {{INTENSITY}}  — intensity comment value, e.g. "calm"
       {{BG_HEX}}     — CSS hex for html/body background, e.g. #000000
       {{LABEL_COLOR}}— CSS hex for the .id label, e.g. #cdd2dc
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PIECE_ID}} · {{TITLE}}</title>
<!-- MOTION: {{MOTION}}, intensity: {{INTENSITY}} -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:{{BG_HEX}}; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:{{LABEL_COLOR}}; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">{{PIECE_ID}}</div>
