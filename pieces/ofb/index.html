<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ofb · Frankenthaler soak-stain (fluid pigment pools)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#faf6f0; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#666; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#666; z-index:10; }
</style>
</head>
<body>
<div class="id">ofb</div>
<div class="hint">click to pour new stain</div>
<div class="src">Frankenthaler · soak-stain flow · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const frustumSize = 28;
let aspect = innerWidth / innerHeight;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2, 0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xfaf6f0, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;

/* Frankenthaler palette: diluted, luminous, transparent washes
   ochre-rose, sage-teal, diluted cerulean, warm umber */
const PALETTE = [
  [0.82, 0.52, 0.38],  // diluted terra rosa
  [0.55, 0.68, 0.58],  // sage green wash
  [0.42, 0.56, 0.72],  // diluted cerulean
  [0.78, 0.65, 0.42],  // raw sienna wash
  [0.68, 0.44, 0.52],  // muted mauve
];

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPour:  { value: 0 },   // animation progress of current pour
  uCentX: { value: 0 },
  uCentY: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPour;

    attribute vec2 home;
    attribute vec2 vel;
    attribute float phase;
    attribute vec3 col;
    attribute float poolId;

    varying vec3 vCol;
    varying float vAlpha;
    varying float vLife;

    // simplex-ish 2D hash for flow field
    vec2 hash2(vec2 p){
      p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
      return -1.0 + 2.0 * fract(sin(p)*43758.5453123);
    }

    void main(){
      // stain spread: particles start at home and soak outward
      float t = uPour;
      float spawn = phase * 0.7;  // stagger particle appearance
      float life = clamp((t - spawn) / (1.0 - spawn), 0.0, 1.0);
      vLife = life;

      // soak-stain flow: gravity pulls down gently, capillary action spreads laterally
      float spread = life * life;  // accelerating soak
      vec2 flowDir = vel;

      // organic flow field perturbation (like pigment finding canvas grain)
      float slowT = uTime * 0.08;
      vec2 grain = hash2(home * 0.4 + slowT) * 0.6;
      flowDir += grain * spread;

      // gravity pull (Frankenthaler poured; pigment flows down)
      flowDir.y -= 0.15 * spread;

      vec2 pos = home + flowDir * spread * 6.0;

      // pooling: particles slow and gather at low points
      float poolGather = sin(pos.x * 0.5 + poolId * 3.14) * 0.3;
      pos.y += poolGather * spread * spread;

      // gentle breathing oscillation (pigment settling into canvas)
      pos += vec2(
        sin(uTime * 0.3 + phase * 6.28) * 0.04,
        cos(uTime * 0.25 + phase * 4.0) * 0.03
      ) * life;

      vCol = col;
      // Frankenthaler transparency: build up layers, edges fade
      float edgeFade = 1.0 - smoothstep(0.6, 1.0, length(flowDir) * spread * 0.8);
      vAlpha = life * edgeFade * 0.6;

      vec4 mv = modelViewMatrix * vec4(pos.x, pos.y, 0.0, 1.0);
      // slightly larger points for wash effect
      gl_PointSize = uPixel * (2.0 + life * 1.5);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vLife;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if(r2 > 0.25) discard;

      // soft-edged wash dot
      float soft = 1.0 - smoothstep(0.1, 0.25, r2);
      float alpha = vAlpha * soft;
      if(alpha < 0.01) discard;

      gl_FragColor = vec4(vCol, alpha);
    }
  `
});

let geom, points;

function rngFactory(seed) {
  let s = seed >>> 0;
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  const rng = rngFactory(seed);

  // Create 4-6 pour pools (like Frankenthaler's distinct color areas)
  const numPools = 4 + Math.floor(rng() * 3);
  const pools = [];
  for (let i = 0; i < numPools; i++){
    const colIdx = Math.floor(rng() * PALETTE.length);
    const base = PALETTE[colIdx];
    pools.push({
      cx: (rng() - 0.5) * 16,
      cy: (rng() - 0.3) * 14,  // bias upward (pour from top)
      radius: 2.5 + rng() * 4,
      col: base,
      flowAngle: rng() * Math.PI * 2,
      flowStrength: 0.3 + rng() * 0.7,
    });
  }

  const positions = new Float32Array(N * 3);
  const homes = new Float32Array(N * 2);
  const vels = new Float32Array(N * 2);
  const phases = new Float32Array(N);
  const colors = new Float32Array(N * 3);
  const poolIds = new Float32Array(N);

  // Distribute particles across pools
  const perPool = Math.floor(N / numPools);
  let idx = 0;

  for (let p = 0; p < numPools; p++){
    const pool = pools[p];
    const count = (p === numPools - 1) ? N - idx : perPool;

    for (let k = 0; k < count && idx < N; k++){
      // organic cluster shape (not circular — use overlapping ellipses)
      const angle = rng() * Math.PI * 2;
      const dist = Math.sqrt(rng()) * pool.radius;
      const stretch = 0.6 + rng() * 0.8;

      const hx = pool.cx + Math.cos(angle) * dist * stretch;
      const hy = pool.cy + Math.sin(angle) * dist;

      homes[idx * 2] = hx;
      homes[idx * 2 + 1] = hy;
      positions[idx * 3] = hx;
      positions[idx * 3 + 1] = hy;
      positions[idx * 3 + 2] = 0;

      // flow velocity: main direction + variation (capillary spread)
      const fa = pool.flowAngle + (rng() - 0.5) * 1.5;
      vels[idx * 2] = Math.cos(fa) * pool.flowStrength;
      vels[idx * 2 + 1] = Math.sin(fa) * pool.flowStrength;

      phases[idx] = rng();
      poolIds[idx] = p;

      // slight color variation within pool (pigment concentration)
      const vary = 0.06;
      colors[idx * 3]     = Math.min(1, Math.max(0, pool.col[0] + (rng() - 0.5) * vary));
      colors[idx * 3 + 1] = Math.min(1, Math.max(0, pool.col[1] + (rng() - 0.5) * vary));
      colors[idx * 3 + 2] = Math.min(1, Math.max(0, pool.col[2] + (rng() - 0.5) * vary));

      idx++;
    }
  }

  // Compute centroid for camera tracking
  let cx = 0, cy = 0;
  for (let i = 0; i < numPools; i++){ cx += pools[i].cx; cy += pools[i].cy; }
  cx /= numPools; cy /= numPools;
  uniforms.uCentX.value = cx;
  uniforms.uCentY.value = cy;

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('home', new THREE.BufferAttribute(homes, 2));
    geom.setAttribute('vel', new THREE.BufferAttribute(vels, 2));
    geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
    geom.setAttribute('col', new THREE.BufferAttribute(colors, 3));
    geom.setAttribute('poolId', new THREE.BufferAttribute(poolIds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.home.array.set(homes);
    geom.attributes.home.needsUpdate = true;
    geom.attributes.vel.array.set(vels);
    geom.attributes.vel.needsUpdate = true;
    geom.attributes.phase.array.set(phases);
    geom.attributes.phase.needsUpdate = true;
    geom.attributes.col.array.set(colors);
    geom.attributes.col.needsUpdate = true;
    geom.attributes.poolId.array.set(poolIds);
    geom.attributes.poolId.needsUpdate = true;
  }
  geom.computeBoundingSphere();

  pourStart = performance.now();
}

let pourStart = 0;

regenerate();
addEventListener('click', regenerate);

addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  camera.left   = frustumSize * aspect / -2;
  camera.right  = frustumSize * aspect /  2;
  camera.top    = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const globalStart = performance.now();

function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - globalStart) / 1000;

  // Pour animation: 6 seconds to fully soak
  const pourElapsed = (now - pourStart) / 1000;
  uniforms.uPour.value = Math.min(1.0, pourElapsed / 6.0);

  // Gentle camera drift toward centroid (Frankenthaler's compositions breathe)
  const targetX = uniforms.uCentX.value;
  const targetY = uniforms.uCentY.value;
  camera.position.x += (targetX - camera.position.x) * 0.01;
  camera.position.y += (targetY - camera.position.y) * 0.01;
  camera.lookAt(camera.position.x, camera.position.y, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
