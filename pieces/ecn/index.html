<div class="src">descended from tje · deus-ex-machina · Rebecca Horn 1991</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────────────────────────────────────────────────────────────────────────
   Deus ex machina — Rebecca Horn's mechanical pendulums & descending forms.
   Parent tje's gold arabesque ribbon grows organically via differential
   growth. Every ~14 s a perfect wireframe icosahedron descends from above
   into the ribbon's heart. On contact the ribbon briefly crystallizes —
   vertices snap toward perfect concentric rings, color shifts from antique
   gold to cool platinum-white. The machine god imposes order. After ~3 s
   the icosahedron ascends and dissolves; organic chaos reasserts itself.
   Like Horn's Concert for Anarchy: the piano plays itself, then suddenly
   all the keys splay open, then composure returns.
   ─────────────────────────────────────────────────────────────────────────── */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.014);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(6, 12, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.1);
lightKey.position.set(6, 14, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.5));
const lightFill = new THREE.DirectionalLight(0x405078, 0.4);
lightFill.position.set(-6, 4, -4);
scene.add(lightFill);

// descent light — cool white, follows the icosahedron
const descentLight = new THREE.PointLight(0xd0d8ff, 0, 35, 1.5);
scene.add(descentLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 6, 0);

// ─────────── differential growth (from parent chain)
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE     = 0.003;
const PRESSURE  = 0.0030;
const RISE      = 0.013;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  const helixY = Math.sin(th * 2) * 0.4;
  verts.push({ x: Math.cos(th)*r, y: helixY, z: Math.sin(th)*r, age: 0 });
}

// store "crystallized" target positions
const crystalTargets = [];

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearbyIndices(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(crystallize){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const fx = new Float32Array(n), fy = new Float32Array(n), fz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of nearbyIndices(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      fx[i]+=ex*f; fy[i]+=ey*f; fz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    fx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    fy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    fz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx=0, cy=0, cz=0;
  for (let i=0;i<n;i++){ cx+=verts[i].x; cy+=verts[i].y; cz+=verts[i].z; }
  cx/=n; cy/=n; cz/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-cx, oy=verts[i].y-cy, oz=verts[i].z-cz;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    fx[i]+=(ox/d)*PRESSURE;
    fy[i]+=(oy/d)*PRESSURE*0.4;
    fz[i]+=(oz/d)*PRESSURE;
  }
  // helical twist
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const ox = v.x-cx, oz = v.z-cz;
    const rd = Math.hypot(ox, oz)+1e-6;
    const tx = -oz/rd, tz = ox/rd;
    const twist = 0.0015 * Math.sin(v.y * 0.7);
    fx[i] += tx*twist;
    fz[i] += tz*twist;
  }

  // crystallize pull: during intervention, pull vertices toward perfect rings
  if (crystallize > 0.05){
    computeCrystalTargets(cx, cy, cz);
    for (let i = 0; i < n; i++){
      const ct = crystalTargets[i];
      if (!ct) continue;
      const pull = crystallize * 0.12;
      fx[i] += (ct.x - verts[i].x) * pull;
      fy[i] += (ct.y - verts[i].y) * pull * 0.5;
      fz[i] += (ct.z - verts[i].z) * pull;
    }
  }

  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2*Math.min(a*1.5, 1.0));
    verts[i].x += fx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y += fy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z += fz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                    age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

function computeCrystalTargets(cx, cy, cz){
  crystalTargets.length = 0;
  const n = verts.length;
  // sort by height, assign to rings
  const sorted = verts.map((v,i) => ({i, y: v.y})).sort((a,b) => a.y - b.y);
  const ringSize = Math.max(8, Math.floor(n / 12));
  for (let si = 0; si < sorted.length; si++){
    const ringIdx = Math.floor(si / ringSize);
    const posInRing = si % ringSize;
    const ringCount = Math.min(ringSize, sorted.length - ringIdx * ringSize);
    const angle = (posInRing / ringCount) * Math.PI * 2;
    // ring radius based on average distance from center at this height
    const origIdx = sorted[si].i;
    const v = verts[origIdx];
    const curR = Math.hypot(v.x - cx, v.z - cz);
    const r = Math.max(curR * 0.85, 1.2);
    crystalTargets[origIdx] = {
      x: cx + Math.cos(angle) * r,
      y: v.y,
      z: cz + Math.sin(angle) * r
    };
  }
}

for (let s = 0; s < 1200; s++) step(0);

addEventListener('click', () => { paused = !paused; });

// ─────────── deus ex machina timing
const CYCLE    = 14.0;   // seconds between interventions
const DESCENT  = 2.5;    // descent duration
const HOLD     = 3.0;    // crystallize hold
const ASCENT   = 2.0;    // ascent duration
const TOTAL_EV = DESCENT + HOLD + ASCENT;

function machinePhase(t){
  const ph = t % CYCLE;
  if (ph >= TOTAL_EV) return { descent: 0, crystallize: 0, ascent: 0, active: false };
  if (ph < DESCENT){
    const p = ph / DESCENT;
    return { descent: p, crystallize: 0, ascent: 0, active: true };
  }
  if (ph < DESCENT + HOLD){
    const p = (ph - DESCENT) / HOLD;
    return { descent: 1, crystallize: Math.pow(Math.sin(p * Math.PI), 0.6), ascent: 0, active: true };
  }
  const p = (ph - DESCENT - HOLD) / ASCENT;
  return { descent: 0, crystallize: 0, ascent: p, active: true };
}

// ─────────── icosahedron (the machine/god)
const icoGeo = new THREE.IcosahedronGeometry(1.8, 0);
const icoEdges = new THREE.EdgesGeometry(icoGeo);
const icoMat = new THREE.LineBasicMaterial({ color: 0xd0d8ff, transparent: true, opacity: 0 });
const icoLines = new THREE.LineSegments(icoEdges, icoMat);
scene.add(icoLines);

// solid faces — very faint fill
const icoFillMat = new THREE.MeshBasicMaterial({
  color: 0xb0b8dd, transparent: true, opacity: 0, side: THREE.DoubleSide
});
const icoFill = new THREE.Mesh(icoGeo, icoFillMat);
scene.add(icoFill);

// ─────────── ribbon builder
const GOLD     = new THREE.Color(0xc9a45a);
const PLATINUM = new THREE.Color(0xc8cce0);
let ribbonMesh = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startT = performance.now();
function loop(){
  const t = (performance.now() - startT) / 1000;
  const phase = machinePhase(t);

  for (let s = 0; s < 4; s++) step(phase.crystallize);

  // centroid
  let cxP=0, cyP=0, czP=0;
  for (const v of verts){ cxP+=v.x; cyP+=v.y; czP+=v.z; }
  const nv = Math.max(verts.length, 1);
  cxP/=nv; cyP/=nv; czP/=nv;

  // icosahedron position & visibility
  if (phase.active){
    let yOff, opacity;
    if (phase.descent > 0){
      // descending from above
      const ease = 1 - Math.pow(1 - phase.descent, 3); // ease-out
      yOff = THREE.MathUtils.lerp(25, 0, ease);
      opacity = phase.descent;
    } else if (phase.crystallize > 0){
      yOff = 0;
      opacity = 0.7 + 0.3 * Math.sin(t * 4); // gentle pulse
    } else {
      // ascending
      const ease = Math.pow(phase.ascent, 2); // ease-in
      yOff = THREE.MathUtils.lerp(0, 28, ease);
      opacity = 1 - phase.ascent;
    }
    const icoY = cyP + yOff;
    icoLines.position.set(cxP, icoY, czP);
    icoFill.position.set(cxP, icoY, czP);

    // slow majestic rotation
    const rotSpeed = phase.crystallize > 0 ? 0.3 : 0.12;
    icoLines.rotation.y = t * rotSpeed;
    icoLines.rotation.x = t * rotSpeed * 0.7;
    icoFill.rotation.copy(icoLines.rotation);

    // scale pulse during hold
    const sc = phase.crystallize > 0 ? 1.0 + 0.08 * Math.sin(t * 3) : 1.0;
    icoLines.scale.setScalar(sc);
    icoFill.scale.setScalar(sc);

    icoMat.opacity = Math.min(opacity, 0.85);
    icoFillMat.opacity = Math.min(opacity * 0.08, 0.08);

    // descent light follows icosahedron
    descentLight.position.set(cxP, icoY, czP);
    descentLight.intensity = opacity * 2.5;
  } else {
    icoMat.opacity = 0;
    icoFillMat.opacity = 0;
    descentLight.intensity = 0;
  }

  // ribbon
  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N = Math.min(1200, verts.length * 3);

    const positions = new Float32Array(N * 2 * 3);
    const colors    = new Float32Array(N * 2 * 3);
    const indices   = [];
    const up = new THREE.Vector3(0, 1, 0);

    const cryst = phase.crystallize;

    for (let i = 0; i < N; i++){
      const tt = i / N;
      const p  = curve.getPointAt(tt);
      const tan = curve.getTangentAt(tt).normalize();
      let lat = new THREE.Vector3().crossVectors(tan, up);
      if (lat.lengthSq() < 0.001) lat.set(1, 0, 0);
      lat.normalize();

      const flare = 0.30 + 0.10 * Math.sin(tt * 32.0 + t * 0.4);

      // during crystallization, ribbon flattens slightly (more uniform width)
      const w = cryst > 0 ? THREE.MathUtils.lerp(flare, 0.32, cryst * 0.6) : flare;

      const left  = p.clone().addScaledVector(lat, -w);
      const right = p.clone().addScaledVector(lat,  w);

      positions[i*6]   = left.x;  positions[i*6+1] = left.y;  positions[i*6+2] = left.z;
      positions[i*6+3] = right.x; positions[i*6+4] = right.y; positions[i*6+5] = right.z;

      // color: gold → platinum during crystallization
      const baseCol = new THREE.Color().copy(GOLD);
      if (cryst > 0.01) baseCol.lerp(PLATINUM, cryst * 0.7);

      // onset shimmer: cool sparkle propagates along ribbon during descent
      if (phase.descent > 0 && phase.descent < 1){
        const wave = Math.sin(tt * 20 + t * 6) * 0.5 + 0.5;
        const shimmer = wave * phase.descent * 0.2;
        baseCol.lerp(new THREE.Color(0xe0e8ff), shimmer);
      }

      colors[i*6]   = baseCol.r; colors[i*6+1] = baseCol.g; colors[i*6+2] = baseCol.b;
      colors[i*6+3] = baseCol.r; colors[i*6+4] = baseCol.g; colors[i*6+5] = baseCol.b;
    }
    for (let i = 0; i < N; i++){
      const ni = (i+1) % N;
      indices.push(i*2, i*2+1, ni*2);
      indices.push(i*2+1, ni*2+1, ni*2);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); ribbonMesh.material.dispose(); }

    // emissive: warm gold normally, cool during crystallization
    const emCol = new THREE.Color(0x2a1a06);
    if (cryst > 0.01) emCol.lerp(new THREE.Color(0x1a1a30), cryst * 0.6);

    // metalness increases during crystallization (more reflective, machine-like)
    const met = cryst > 0 ? THREE.MathUtils.lerp(0.72, 0.92, cryst) : 0.72;
    const rough = cryst > 0 ? THREE.MathUtils.lerp(0.28, 0.12, cryst) : 0.28;

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      emissive: emCol,
      roughness: rough,
      metalness: met,
      side: THREE.DoubleSide,
    });
    ribbonMesh = new THREE.Mesh(g, mat);
    scene.add(ribbonMesh);
  }

  // camera tracking centroid
  const targetY = Math.max(cyP, 2.0);
  controls.target.x += (cxP - controls.target.x) * 0.03;
  controls.target.y += (targetY - controls.target.y) * 0.04;
  controls.target.z += (czP - controls.target.z) * 0.03;
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  // gentle camera pull-back during descent (dramatic widening, like theater)
  if (phase.descent > 0.3 && phase.descent < 1){
    const pullBack = (phase.descent - 0.3) * 0.015;
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.addScaledVector(dir, pullBack);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
