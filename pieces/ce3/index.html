<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ce3 · Shiota web × differential growth — tangled emergent membrane</title>
<!-- MOTION: growth, intensity: gentle -->
<!-- Cross-pollinate: borrowing '7ea' differential growth visual signature — membrane expansion + repulsion-driven wrinkles -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0706; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">ce3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0706);
scene.fog = new THREE.FogExp2(0x0a0706, 0.032);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 140);
camera.position.set(0, 1.2, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x3d1612, 0.4);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.7);
dirLight.position.set(-4, 6, 3);
scene.add(dirLight);

// RNG
let rngState = 71934;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Sphere center (as in parent)
const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(0, 0.2, -2);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 28, 20);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xdecfc4,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.2,
  roughness: 0.85,
  metalness: 0.05,
  transparent: true,
  opacity: 0.95
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── Differential growth membrane wrapping the sphere
// Start with icosphere vertices around the sphere, then iteratively grow + repel
class DiffGrowthNode {
  constructor(pos){
    this.pos = pos.clone();
    this.vel = new THREE.Vector3();
    this.neighbors = [];
  }
}

// Generate initial nodes in a rough sphere shell
const nodes = [];
const initialRadius = sphereRadius + 0.6;
const initialCount = 180;
for (let i = 0; i < initialCount; i++){
  const phi = Math.acos(1 - 2 * (i + 0.5) / initialCount);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const x = Math.cos(theta) * Math.sin(phi) * initialRadius;
  const y = Math.sin(theta) * Math.sin(phi) * initialRadius;
  const z = Math.cos(phi) * initialRadius;
  nodes.push(new DiffGrowthNode(new THREE.Vector3(x, y, z).add(sphereCenter)));
}

// Build initial triangulation (simplified: connect to 5 nearest)
for (let i = 0; i < nodes.length; i++){
  const sorted = nodes.map((n, idx) => ({ n, idx, d: n.pos.distanceTo(nodes[i].pos) }))
    .filter(x => x.idx !== i)
    .sort((a, b) => a.d - b.d)
    .slice(0, 5);
  nodes[i].neighbors = sorted.map(x => x.idx);
}

// Growth parameters (from 7ea signature)
const params = {
  maxEdgeLen: 0.35,
  minEdgeLen: 0.12,
  repulsionRadius: 0.28,
  repulsionStrength: 0.012,
  attractionStrength: 0.006,
  splitChance: 0.08,
  maxNodes: 2400
};

// ── Build thread segments from membrane edges
function buildThreads(){
  const positions = [];
  const visited = new Set();
  for (let i = 0; i < nodes.length; i++){
    for (const ni of nodes[i].neighbors){
      const key = i < ni ? `${i}-${ni}` : `${ni}-${i}`;
      if (visited.has(key)) continue;
      visited.add(key);
      const a = nodes[i].pos;
      const b = nodes[ni].pos;
      positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
    }
  }
  return new Float32Array(positions);
}

let lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(buildThreads(), 3));
const lineMat = new THREE.LineBasicMaterial({
  color: 0xd81825,
  transparent: true,
  opacity: 0.14,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Differential growth step
function growthStep(){
  if (nodes.length >= params.maxNodes) return;

  // Repulsion between nearby nodes
  for (let i = 0; i < nodes.length; i++){
    nodes[i].vel.set(0, 0, 0);
    for (let j = 0; j < nodes.length; j++){
      if (i === j) continue;
      const diff = nodes[i].pos.clone().sub(nodes[j].pos);
      const dist = diff.length();
      if (dist < params.repulsionRadius && dist > 0.01){
        const force = params.repulsionStrength * (params.repulsionRadius - dist) / params.repulsionRadius;
        diff.normalize().multiplyScalar(force);
        nodes[i].vel.add(diff);
      }
    }
  }

  // Attraction along edges + splitting
  const toSplit = [];
  for (let i = 0; i < nodes.length; i++){
    const node = nodes[i];
    for (const ni of node.neighbors){
      if (ni >= nodes.length) continue;
      const neighbor = nodes[ni];
      const diff = neighbor.pos.clone().sub(node.pos);
      const dist = diff.length();
      
      // Attraction to maintain edge
      if (dist > params.minEdgeLen){
        const force = params.attractionStrength * (dist - params.minEdgeLen);
        diff.normalize().multiplyScalar(force);
        node.vel.add(diff);
      }

      // Mark for splitting if too long
      if (dist > params.maxEdgeLen && rng() < params.splitChance && nodes.length < params.maxNodes){
        toSplit.push([i, ni]);
      }
    }
  }

  // Apply velocity
  for (let i = 0; i < nodes.length; i++){
    nodes[i].pos.add(nodes[i].vel);
    // Bias away from sphere core slightly
    const toCore = sphereCenter.clone().sub(nodes[i].pos);
    const coreDist = toCore.length();
    if (coreDist < sphereRadius + 0.3){
      toCore.normalize().multiplyScalar(-0.02);
      nodes[i].pos.add(toCore);
    }
  }

  // Execute splits
  for (const [i, ni] of toSplit){
    if (nodes.length >= params.maxNodes) break;
    const mid = nodes[i].pos.clone().add(nodes[ni].pos).multiplyScalar(0.5);
    const newNode = new DiffGrowthNode(mid);
    const newIdx = nodes.length;
    nodes.push(newNode);
    
    // Rewire neighbors
    nodes[i].neighbors = nodes[i].neighbors.filter(x => x !== ni);
    nodes[i].neighbors.push(newIdx);
    nodes[ni].neighbors = nodes[ni].neighbors.filter(x => x !== i);
    nodes[ni].neighbors.push(newIdx);
    newNode.neighbors = [i, ni];
  }

  // Rebuild geometry
  lineGeo.setAttribute('position', new THREE.BufferAttribute(buildThreads(), 3));
}

// ── Add fiber fragments caught in membrane wrinkles
const fragments = [];
const NUM_FRAGMENTS = 35;
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.04 + rng() * 0.12;
  const geo = rng() > 0.6
    ? new THREE.BoxGeometry(size * 0.3, size * 2.8, size * 0.4)
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(0.08 + rng()*0.04, 0.03 + rng()*0.02, 0.02 + rng()*0.02),
    roughness: 0.9,
    metalness: 0.1,
    transparent: true,
    opacity: 0.7 + rng() * 0.2
  });
  const mesh = new THREE.Mesh(geo, mat);
  const nodeIdx = Math.floor(rng() * nodes.length);
  mesh.position.copy(nodes[nodeIdx].pos);
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  mesh.userData.nodeIdx = nodeIdx;
  scene.add(mesh);
  fragments.push(mesh);
}

// ── Camera tracking centroid
function updateCamera(){
  const centroid = new THREE.Vector3();
  for (const n of nodes) centroid.add(n.pos);
  centroid.multiplyScalar(1 / nodes.length);
  
  const elapsed = performance.now() / 1000;
  const angle = elapsed * 0.025;
  const radius = 7.5 + Math.sin(elapsed * 0.04) * 1.2;
  camera.position.set(
    centroid.x + Math.cos(angle) * radius,
    centroid.y + 2.5 + Math.sin(elapsed * 0.018) * 0.8,
    centroid.z + Math.sin(angle) * radius
  );
  camera.lookAt(centroid);
}

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
let frameCount = 0;
function loop(){
  frameCount++;
  
  // Growth iteration every 3 frames for first 600 frames
  if (frameCount % 3 === 0 && frameCount < 600){
    growthStep();
  }

  // Update fragment positions to follow their nodes
  for (const frag of fragments){
    if (frag.userData.nodeIdx < nodes.length){
      const target = nodes[frag.userData.nodeIdx].pos;
      frag.position.lerp(target, 0.08);
    }
  }

  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
