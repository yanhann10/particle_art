<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i23 · Shiota — After the Dream</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">i23</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.003);

const camera = new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// One warm point light near the dress — darkness is the primary material
scene.add(new THREE.AmbientLight(0x0a0202, 0.006));
const pL = new THREE.PointLight(0xff9060, 0.035, 50, 2.0);
pL.position.set(-2, 8, 3);
scene.add(pL);

let seed = 73629104;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── THE DRESS — the sole suspended object, a remembered garment
// Shiota: "In absence, the dress remembers the body that wore it."
const dressCenter = new THREE.Vector3(0, 0, 0);
const dressGroup = new THREE.Group();

const dressMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.55,
  roughness: 0.96, metalness: 0, side: THREE.DoubleSide,
  transparent: true, opacity: 0.82
});

// Skirt — open cone, wider at bottom
const skirt = new THREE.Mesh(
  new THREE.ConeGeometry(1.0, 2.6, 12, 1, true), dressMat
);
skirt.position.y = -0.7;
dressGroup.add(skirt);

// Bodice — tapered cylinder
const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.58, 1.1, 8, 1, true), dressMat
);
bodice.position.y = 0.75;
dressGroup.add(bodice);

// Hanger — dark crossbar
const hangerMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const hangerBar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.015, 0.015, 0.7, 4), hangerMat
);
hangerBar.position.y = 1.48;
hangerBar.rotation.z = Math.PI/2;
dressGroup.add(hangerBar);
const hangerHook = new THREE.Mesh(
  new THREE.CylinderGeometry(0.01, 0.01, 0.35, 4), hangerMat
);
hangerHook.position.y = 1.65;
dressGroup.add(hangerHook);

dressGroup.position.copy(dressCenter);
scene.add(dressGroup);

// ── ARCHITECTURAL VOLUME — 26×22×30 unit room
const ROOM = { w:26, h:22, d:30 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// Sample points on the dress surface (cone + cylinder)
function dressSurf(){
  const t = rng();
  if(t < 0.7){
    // Skirt cone: apex at top (y=0.6), base at bottom (y=-2.0)
    const h = rng();
    const r = (0.05 + h*0.95) * 1.0;
    const a = rng()*Math.PI*2;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(a)*r,
      dressCenter.y + 0.6 - h*2.6,
      dressCenter.z + Math.sin(a)*r
    );
  } else {
    // Bodice cylinder
    const h = rng();
    const rBot = 0.58, rTop = 0.22;
    const r = rBot + (rTop-rBot)*h;
    const a = rng()*Math.PI*2;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(a)*r,
      dressCenter.y + 0.2 + h*1.1,
      dressCenter.z + Math.sin(a)*r
    );
  }
}

// ── ANCHOR POINTS — concentric shells around the dress
const anchors = [];

// Inner shells
const shells = [2.5, 4.0, 5.8, 8.0, 10.5];
for(const sr of shells){
  const count = Math.floor(16 + sr*1.4);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.88+rng()*0.24);
    anchors.push(new THREE.Vector3(
      dressCenter.x + Math.sin(v)*Math.cos(u)*r,
      dressCenter.y + Math.sin(v)*Math.sin(u)*r*0.85,
      dressCenter.z + Math.cos(v)*r
    ));
  }
}

// Wall anchors
for(let i = 0; i < 90; i++) anchors.push(wallPt());

// ── VOID ZONES — 3 cylindrical gaps for negative space
const voids = [];
for(let i = 0; i < 3; i++){
  const a = (i/3)*Math.PI*2 + rng()*1.2;
  const dist = 3.5 + rng()*3.0;
  voids.push({
    x: dressCenter.x + Math.cos(a)*dist,
    z: dressCenter.z + Math.sin(a)*dist,
    r: 1.5 + rng()*1.0
  });
}

function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── SUSPENSION THREADS — vertical lines from ceiling to hanger
const suspPts = [];
for(let i = 0; i < 7; i++){
  const a = (i/7)*Math.PI*2 + (rng()-0.5)*0.5;
  const topR = 0.3 + rng()*0.8;
  const botR = 0.01 + rng()*0.03;
  suspPts.push(
    dressCenter.x + Math.cos(a)*topR, hh, dressCenter.z + Math.sin(a)*topR,
    dressCenter.x + Math.cos(a)*botR, dressCenter.y + 1.82, dressCenter.z + Math.sin(a)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0303, transparent: true, opacity: 0.55
})));

// ── BUILD THE NETWORK — 20,000 line segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES); // category for opacity variation
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  // Reject lines whose midpoint falls in a void zone
  const mx=(a.x+b.x)*0.5, mz=(a.z+b.z)*0.5;
  if(inVoid({x:mx, z:mz})) return;

  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const my=(a.y+b.y)*0.5;
  lineDist[li] = Math.sqrt((mx-dressCenter.x)**2+(my-dressCenter.y)**2+(mz-dressCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE — threads reach toward the dress from anchors/walls
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.5){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  const target = dressSurf();

  // 12% stop short — threads that almost reach but don't touch
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.12 + rng()*1.2;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: LATERAL BONDS — anchor-to-anchor within threshold
const THRESH = 5.5;
const catBtarget = Math.floor(NUM_LINES * 0.25);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 45000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 1);
  catBcount++;
}

// RULE 3: DENDRITIC FILAMENTS — branching chains from dress surface
// Each chain Y-forks once, giving the web a biological feel
for(let i = 0; i < 100 && li < NUM_LINES; i++){
  let pt = dressSurf();
  const radial = pt.clone().sub(dressCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.35 + rng()*0.6;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.35, (rng()-0.5)*0.35, (rng()-0.5)*0.35
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next, 2);
    // Y-fork at generation 1 or 2
    if(c === 1 && rng() < 0.5){
      const forkDev = new THREE.Vector3(
        (rng()-0.5)*0.6, (rng()-0.5)*0.4, (rng()-0.5)*0.6
      );
      const forkDir = dir.clone().add(forkDev).normalize();
      const forkPt = pt.clone().add(forkDir.multiplyScalar(len*0.8));
      setLine(pt, forkPt, 2);
    }
    pt = next;
    prevDir = dir;
  }
}

// Fill remainder: sparse wall-to-wall architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.15 ? dressSurf() : wallPt();
  setLine(a, b, 1);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Single arterial red — #c20018
// Opacity varies by category and distance from dress
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const colors = new Float32Array(li*6);
// Category opacities: convergence=0.08, lateral=0.045, filament=0.065
const catOp = [0.08, 0.045, 0.065];
for(let i = 0; i < li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.35, 1.0 - d*0.06);
  const op = catOp[lineCat[i]] * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * op;
    colors[i*6+v*3+1] = bG * op;
    colors[i*6+v*3+2] = bB * op * 0.85;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, small keys, passport edges
// Caught in the web, held between two countries
const NUM_FRAGMENTS = 22;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.02 + rng()*0.06;
  const fGeo = new THREE.BufferGeometry();
  const isKey = rng() < 0.3;
  let verts;
  if(isKey){
    // Key silhouette — elongated
    const kw = sz*0.3, kh = sz*1.4;
    verts = new Float32Array([
      -kw, kh*0.5, 0,  kw, kh*0.5, 0,  kw*0.5, -kh*0.5, 0,
      -kw, kh*0.5, 0,  kw*0.5, -kh*0.5, 0,  -kw*0.5, -kh*0.5, 0
    ]);
  } else {
    // Irregular paper fragment
    const w = sz*(0.4+rng()*0.7);
    const h = sz*(0.5+rng()*0.9);
    verts = new Float32Array([
      w*(-0.4+rng()*0.2), h*0.5, 0,
      -w*0.5, h*(-0.1+rng()*0.1), 0,
      w*(0.1-rng()*0.2), -h*0.5, 0,
      w*(-0.4+rng()*0.2), h*0.5, 0,
      w*(0.2+rng()*0.15), h*(rng()*0.1), 0,
      w*(0.1-rng()*0.2), -h*0.5, 0
    ]);
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.003 + rng()*0.008;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  // Position along a random thread
  const si = Math.floor(rng()*li)*6;
  const t = 0.15+rng()*0.7;
  frag.position.set(
    basePositions[si]*(1-t)+basePositions[si+3]*t,
    basePositions[si+1]*(1-t)+basePositions[si+4]*t,
    basePositions[si+2]*(1-t)+basePositions[si+5]*t
  );
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — slow walk inside the web
// Narrative: approach → orbit close → descend below → rise and retreat
// "I walked through her memory and the threads parted for me"
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=dressCenter.x, cy=dressCenter.y, cz=dressCenter.z;

  let rH, y;
  if(t < 0.2){
    // Approach from side, slightly above
    const lt = t/0.2;
    rH = 8.0 - lt*4.5;
    y = cy + 1.0 + lt*0.5;
  } else if(t < 0.45){
    // Intimate orbit, eye-level with the dress
    const lt = (t-0.2)/0.25;
    rH = 3.5 + Math.sin(lt*Math.PI)*0.8;
    y = cy + 1.5 - lt*1.0;
  } else if(t < 0.65){
    // Descend below — looking up through the web at the dress
    const lt = (t-0.45)/0.2;
    rH = 4.3 + lt*2.0;
    y = cy + 0.5 - lt*5.5;
  } else if(t < 0.85){
    // Rise slowly — the return
    const lt = (t-0.65)/0.2;
    rH = 6.3 - lt*1.0;
    y = cy - 5.0 + lt*7.5;
  } else {
    // Retreat outward
    const lt = (t-0.85)/0.15;
    rH = 5.3 + lt*2.7;
    y = cy + 2.5 - lt*1.5;
  }

  const x = cx + Math.sin(p*0.85)*rH;
  const z = cz + Math.cos(p*0.85)*rH*1.05;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — <0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00006 * Math.max(0, 1.0-dist/14.0);
    const phase = basePositions[idx]*0.07 + basePositions[idx+1]*0.09 + i*0.00025;
    const breath = Math.sin(elapsed*0.005+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.09;
      arr[vi+2] = basePositions[vi+2] + breath*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — glacial drift through the web
  const speed = 0.00015;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress — presence in absence
  const look = dressCenter.clone();
  look.x += Math.sin(elapsed*0.0007)*0.04;
  look.y += 0.3 + Math.cos(elapsed*0.0005)*0.2;
  look.z += Math.sin(elapsed*0.0008+0.3)*0.03;
  camera.lookAt(look);

  // Light drift — barely perceptible
  pL.position.x = -2 + Math.sin(elapsed*0.0003)*0.08;
  pL.position.y = 8 + Math.cos(elapsed*0.00015)*0.06;
  pL.intensity = 0.035 + Math.sin(elapsed*0.0004)*0.005;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
