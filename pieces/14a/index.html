<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14a · computational lucy · after vera molnar</title>
<!-- MOTION: breathe, intensity: calm -->
<style>
html,body{margin:0;padding:0;height:100%;background:#f0ebe1;overflow:hidden}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;
    color:#cdd2dc;opacity:0.55;font-size:11px;letter-spacing:0.06em}
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
         font-family:ui-monospace,"SF Mono",Menlo,monospace;
         font-size:13px;color:#3a3530;opacity:0.6;letter-spacing:0.06em}
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy …</div>
<div class="id">14a</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

/* ── scene ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ebe1);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ── geometry constants ── */
const N = 35000;          // line segments
const V = N * 2;          // vertices (2 per segment)

const centerArr    = new Float32Array(V * 3);
const tangArr      = new Float32Array(V * 3);
const bitangArr    = new Float32Array(V * 3);
const sideArr      = new Float32Array(V);
const seedArr      = new Float32Array(V);
const qAngleArr    = new Float32Array(V);

/* ── uniforms ── */
const uniforms = {
  uTime:    { value: 0 },
  uReady:   { value: 0 },
  uHalfLen: { value: 0.13 }
};

/* ── shader material ── */
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uReady;
    uniform float uHalfLen;
    attribute vec3 center;
    attribute vec3 tang;
    attribute vec3 bitang;
    attribute float side;
    attribute float seed;
    attribute float qAngle;
    varying float vAlpha;

    void main() {
      /* ── breathing deviation with spatial coherence ── */
      float globalBreathe = sin(uTime * 0.25) * 0.5 + 0.5;
      float spatial = sin(center.x * 0.4 + center.y * 0.3 + uTime * 0.08)
                     * cos(center.z * 0.35 - uTime * 0.06);
      float localDev = globalBreathe * (0.35 + 0.65 * (spatial * 0.5 + 0.5));

      /* per-segment wobble */
      float wobble = sin(seed * 47.3 + uTime * 0.12) * localDev * 0.55;
      float angle = qAngle + wobble;

      /* direction in tangent plane */
      vec3 dir = cos(angle) * tang + sin(angle) * bitang;

      /* half-length with per-segment variation */
      float hl = uHalfLen * (0.65 + 0.7 * (sin(seed * 17.3) * 0.5 + 0.5));
      vec3 p = center + dir * side * hl;

      /* ── reveal: bottom-to-top plotter sweep ── */
      float normY = (center.y + 8.5) / 17.0;
      float revealT = normY * 0.75 + seed * 0.25;
      float reveal = smoothstep(revealT - 0.04, revealT + 0.04, uReady);
      p = mix(center, p, reveal);

      /* ── alpha: per-segment density variation + depth fade ── */
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = clamp((-mv.z - 20.0) / 20.0, 0.0, 1.0);
      float baseAlpha = 0.32 + 0.42 * (sin(seed * 29.1) * 0.5 + 0.5);
      vAlpha = reveal * baseAlpha * (1.0 - depth * 0.45);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying float vAlpha;
    void main() {
      gl_FragColor = vec4(0.11, 0.09, 0.07, vAlpha);
    }
  `
});

/* ── load Lucy ── */
const loadingEl = document.getElementById('loading');
const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
let revealStart = 0;
let lines;

new PLYLoader().load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const cen = bb.getCenter(new THREE.Vector3());
    const sz  = bb.getSize(new THREE.Vector3());
    const sc  = 15 / Math.max(sz.x, sz.y, sz.z);
    geometry.translate(-cen.x, -cen.y, -cen.z);
    geometry.scale(sc, sc, sc);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();

    const tmpP = new THREE.Vector3();
    const tmpN = new THREE.Vector3();
    const up   = new THREE.Vector3(0, 1, 0);
    const rt   = new THREE.Vector3(1, 0, 0);
    const T    = new THREE.Vector3();
    const B    = new THREE.Vector3();

    /* Molnar quantisation: 4 systematic angles */
    const QANGLES = [0, Math.PI / 4, Math.PI / 2, Math.PI * 3 / 4];

    for (let i = 0; i < N; i++) {
      sampler.sample(tmpP, tmpN);

      /* tangent basis on surface */
      if (Math.abs(tmpN.dot(up)) > 0.95) {
        T.crossVectors(tmpN, rt).normalize();
      } else {
        T.crossVectors(tmpN, up).normalize();
      }
      B.crossVectors(tmpN, T).normalize();

      const seed = Math.random();
      /* position-based hash → quantised angle index */
      const h = Math.abs(Math.sin(tmpP.x * 12.9898 + tmpP.y * 78.233 + tmpP.z * 45.164));
      const qA = QANGLES[Math.floor(h * 4) % 4];

      for (let s = 0; s < 2; s++) {
        const vi = i * 2 + s;
        const v3 = vi * 3;
        centerArr[v3]     = tmpP.x;
        centerArr[v3 + 1] = tmpP.y;
        centerArr[v3 + 2] = tmpP.z;
        tangArr[v3]       = T.x;
        tangArr[v3 + 1]   = T.y;
        tangArr[v3 + 2]   = T.z;
        bitangArr[v3]     = B.x;
        bitangArr[v3 + 1] = B.y;
        bitangArr[v3 + 2] = B.z;
        sideArr[vi]       = s === 0 ? -1 : 1;
        seedArr[vi]       = seed;
        qAngleArr[vi]     = qA;
      }
    }

    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(V * 3), 3));
    geom.setAttribute('center',   new THREE.BufferAttribute(centerArr, 3));
    geom.setAttribute('tang',     new THREE.BufferAttribute(tangArr, 3));
    geom.setAttribute('bitang',   new THREE.BufferAttribute(bitangArr, 3));
    geom.setAttribute('side',     new THREE.BufferAttribute(sideArr, 1));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seedArr, 1));
    geom.setAttribute('qAngle',   new THREE.BufferAttribute(qAngleArr, 1));
    geom.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 20);

    lines = new THREE.LineSegments(geom, mat);
    scene.add(lines);

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      loadingEl.textContent = `loading lucy · ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  () => { loadingEl.textContent = 'load failed'; }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation ── */
const t0 = performance.now();

function loop() {
  const t = (performance.now() - t0) / 1000;
  uniforms.uTime.value = t;

  /* reveal over 3.5 s */
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1, (performance.now() - revealStart) / 3500);
  }

  /* very slow single drift: slight upward movement, then still */
  const drift = Math.min(t / 60, 1);
  camera.position.y = THREE.MathUtils.lerp(-0.4, 0.9, drift);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<!-- piece-ctrl: gallery interaction chrome -->
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
  <button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
  <button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
  <input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
  <button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel (injected by scripts/inject_grade_panel.py) -->
<style>
#gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
  background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
  padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
#gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
  color:rgba(205,210,220,0.45);margin-bottom:8px;}
#gp-panel label{display:flex;justify-content:space-between;font-size:9px;
  letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
#gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
#gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
  background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
#gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
  border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
#gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
  background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
#gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
  border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
  color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
#gp-save:hover{border-color:rgba(201,168,106,0.7);}
#gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
  border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
  color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
#gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){
      document.getElementById('gp-'+k).value=G[k];
      document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();arr.push({id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con});
    store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:arr[arr.length-1]})}).catch(function(){});
  };
  renderSaved();
})();
</script>
</body>
</html>
