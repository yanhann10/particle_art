<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uk3 · ridged erosion · fBm terrain</title>
<!-- MOTION: emerge, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0b09; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.30; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">uk3</div>
<div class="hint">fBm ridged erosion · Musgrave ridged multifractal · grazing light</div>
<div class="src">technique · ridged fBm erosion after Musgrave</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── intent ──────────────────────────────────────────────────────
   An eroded mesa ridge seen at a steep grazing angle — thousands
   of leaf-like particles displaced by ridged fBm form sharp
   erosion channels that slowly deepen over geological time.
   The viewer recognizes a weathered mountain range at dusk.
   Evokes Andreas Gursky's Rhine II compression + Olafur Eliasson's
   riverbed materiality.
   ──────────────────────────────────────────────────────────────── */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 800);
camera.position.set(0, 28, 95);
camera.lookAt(0, 6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b09, 1);
document.body.appendChild(renderer.domElement);

scene.fog = new THREE.Fog(0x0d0b09, 60, 260);

/* ── particle grid ───────────────────────────────────────────── */
const COLS = 220;
const ROWS = 120;
const N = COLS * ROWS;
const SPAN_X = 140;
const SPAN_Z = 70;

const positions = new Float32Array(N * 3);
const gridUV = new Float32Array(N * 2); // normalised grid coords
const seeds = new Float32Array(N);

for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const i = r * COLS + c;
    const u = c / (COLS - 1);
    const v = r / (ROWS - 1);
    positions[i * 3]     = (u - 0.5) * SPAN_X;
    positions[i * 3 + 1] = 0;
    positions[i * 3 + 2] = (v - 0.5) * SPAN_Z;
    gridUV[i * 2]     = u;
    gridUV[i * 2 + 1] = v;
    seeds[i] = Math.random();
  }
}

/* ── shader ──────────────────────────────────────────────────── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uErosionDepth: { value: 0 } // 0→1 over first 20 seconds
};

const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uErosionDepth;
  attribute vec2 gridUV;
  attribute float seed;
  varying vec3 vCol;
  varying float vAlpha;

  /* ── simple 3-d value noise (original) ─────────────────────── */
  float h31(vec3 p){
    p = fract(p * vec3(443.897, 441.423, 437.195));
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
  }
  float vnoise(vec3 p){
    vec3 i = floor(p), f = fract(p);
    f = f*f*(3.0 - 2.0*f);
    float a = h31(i), b = h31(i+vec3(1,0,0)),
          c = h31(i+vec3(0,1,0)), d = h31(i+vec3(1,1,0)),
          e = h31(i+vec3(0,0,1)), g = h31(i+vec3(1,0,1)),
          h = h31(i+vec3(0,1,1)), k = h31(i+vec3(1,1,1));
    return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),
               mix(mix(e,g,f.x),mix(h,k,f.x),f.y),f.z);
  }

  /* ── ridged noise (Musgrave-style) ─────────────────────────── */
  float ridged(vec3 p){
    float v = vnoise(p);
    return 1.0 - abs(v * 2.0 - 1.0);
  }

  float ridgedFBM(vec3 p){
    float sum = 0.0, amp = 1.0, freq = 1.0, weight = 1.0;
    for(int i = 0; i < 6; i++){
      float n = ridged(p * freq);
      n *= n; // sharpen creases
      n *= weight;
      weight = clamp(n * 2.5, 0.0, 1.0);
      sum += n * amp;
      freq *= 2.04;
      amp *= 0.48;
    }
    return sum;
  }

  void main(){
    vec3 p = position;

    /* terrain displacement via ridged fBm */
    float terrainScale = 0.038;
    float slowTime = uTime * 0.006;
    vec3 samplePos = vec3(p.x * terrainScale, slowTime, p.z * terrainScale * 1.3);

    float h = ridgedFBM(samplePos);

    /* erosion deepens over first 20s */
    float heightScale = 18.0 + uErosionDepth * 12.0;
    p.y = h * heightScale - 4.0;

    /* per-particle jitter for organic feel (small, deliberate) */
    float jx = (seed - 0.5) * 0.25;
    float jz = (fract(seed * 7.13) - 0.5) * 0.25;
    p.x += jx;
    p.z += jz;

    /* ── palette: sandstone / dark-earth / ash / bone ─────── */
    float normH = clamp(h, 0.0, 1.0);

    vec3 darkEarth  = vec3(0.22, 0.17, 0.13); // erosion channels
    vec3 sandstone  = vec3(0.58, 0.48, 0.38); // mid slopes
    vec3 duskAsh    = vec3(0.52, 0.46, 0.42); // weathered face
    vec3 bone       = vec3(0.76, 0.72, 0.66); // ridge peaks

    vec3 col;
    if(normH < 0.3){
      col = mix(darkEarth, sandstone, normH / 0.3);
    } else if(normH < 0.6){
      col = mix(sandstone, duskAsh, (normH - 0.3) / 0.3);
    } else {
      col = mix(duskAsh, bone, (normH - 0.6) / 0.4);
    }

    /* warm side-light from left */
    float lightBias = smoothstep(-0.5, 0.5, sin(gridUV.x * 3.14159));
    vec3 warmLight = vec3(0.72, 0.52, 0.34);
    col = mix(col, col * warmLight * 1.4, lightBias * 0.3);

    /* slight depth fade for atmosphere */
    float depth = smoothstep(0.0, 1.0, gridUV.y);
    col = mix(col, vec3(0.14, 0.12, 0.10), depth * 0.45);

    vCol = col;
    vAlpha = 0.6 + 0.3 * normH - depth * 0.2;

    /* leaf-like elongated point size */
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float dist = -mv.z;
    float baseSize = 2.8 + seed * 1.8 + normH * 1.2;
    gl_PointSize = baseSize * uPixel * (90.0 / max(dist, 1.0));
    gl_Position = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying vec3 vCol;
  varying float vAlpha;

  void main(){
    vec2 d = gl_PointCoord - 0.5;
    /* leaf-shaped falloff: elliptical, slightly pointed */
    float rx = d.x * 1.6;
    float ry = d.y;
    float r = length(vec2(rx, ry));
    if(r > 0.5) discard;

    float soft = 1.0 - smoothstep(0.15, 0.5, r);
    soft = pow(soft, 1.3);

    /* subtle grain texture */
    float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
    float grainAmt = 0.04;

    vec3 col = vCol + (grain - 0.5) * grainAmt;
    float a = soft * vAlpha;

    /* fog mixing (manual, no fog:true) */
    float fogFactor = smoothstep(260.0, 60.0, gl_FragCoord.z / gl_FragCoord.w);
    vec3 fogColor = vec3(0.051, 0.043, 0.035);
    col = mix(fogColor, col, fogFactor);

    gl_FragColor = vec4(col, a);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('gridUV', new THREE.BufferAttribute(gridUV, 2));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── dust motes for atmosphere ───────────────────────────────── */
const DUST_N = 800;
const dustPos = new Float32Array(DUST_N * 3);
const dustSeeds = new Float32Array(DUST_N);
for (let i = 0; i < DUST_N; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * SPAN_X * 0.8;
  dustPos[i * 3 + 1] = Math.random() * 30 + 2;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * SPAN_Z * 0.6;
  dustSeeds[i] = Math.random();
}

const dustUniforms = {
  uTime: uniforms.uTime,
  uPixel: uniforms.uPixel
};

const dustMat = new THREE.ShaderMaterial({
  uniforms: dustUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.08;
      p.x += sin(phase) * 1.5;
      p.y += cos(phase * 0.7) * 0.8;
      p.z += sin(phase * 0.5 + 1.0) * 1.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + seed * 1.5) * uPixel * (60.0 / max(dist, 1.0));
      vAlpha = (0.08 + seed * 0.12) * smoothstep(200.0, 40.0, dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if(r > 0.5) discard;
      float soft = 1.0 - smoothstep(0.0, 0.5, r);
      gl_FragColor = vec4(0.72, 0.62, 0.50, soft * vAlpha);
    }
  `
});

const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeeds, 1));
const dustPoints = new THREE.Points(dustGeom, dustMat);
scene.add(dustPoints);

/* ── background gradient plane ───────────────────────────────── */
const bgGeom = new THREE.PlaneGeometry(600, 300);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 top = vec3(0.12, 0.09, 0.07);
      vec3 mid = vec3(0.18, 0.13, 0.10);
      vec3 bot = vec3(0.051, 0.043, 0.035);
      float t = vUv.y;
      vec3 col = t > 0.5 ? mix(mid, top, (t - 0.5) * 2.0) : mix(bot, mid, t * 2.0);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const bgPlane = new THREE.Mesh(bgGeom, bgMat);
bgPlane.position.set(0, 15, -120);
bgPlane.renderOrder = -1;
scene.add(bgPlane);

/* ── resize ──────────────────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ──────────────────────────────────────────── */
const startTime = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - startTime) / 1000;
  uniforms.uTime.value = elapsed;

  // Erosion deepens over first 25 seconds then holds
  uniforms.uErosionDepth.value = Math.min(elapsed / 25, 1.0);

  // Slow camera drift — single pass, not oscillating
  const driftT = elapsed * 0.012;
  camera.position.x = Math.sin(driftT * 0.3) * 8;
  camera.position.y = 28 + Math.sin(driftT * 0.15) * 3;
  camera.position.z = 95 - driftT * 0.8; // very slow push-in
  camera.position.z = Math.max(camera.position.z, 65); // clamp
  camera.lookAt(0, 6, -5);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
