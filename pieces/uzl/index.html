<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uzl · parallels (line-field silhouette)</title>
<!-- MOTION: contraction, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">uzl</div>
<div class="hint">move pointer · figure emerges, dissolves</div>
<div class="src">Marc Da Costa & Matthew Niederhauser · Parallels · Lumen Prize 2024</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// 480 horizontal line segments (rails) — each line starts planar (z=0 ± small noise)
// pointer creates a local warp field that bends lines toward camera in figure-shaped region
// when pointer leaves, lines relax back to flat plane — perception slips between figure and pattern

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 35);
camera.lookAt(0, 0, 0);

const LINE_COUNT = 480;
const LINE_WIDTH = 50;
const LINE_SPACING = 0.22;

// geometry: instanced line segments (two vertices per line, instanced LINE_COUNT times)
const lineGeom = new THREE.InstancedBufferGeometry();
const basePos = new Float32Array([
  -LINE_WIDTH * 0.5, 0, 0,
   LINE_WIDTH * 0.5, 0, 0
]);
lineGeom.setAttribute('position', new THREE.BufferAttribute(basePos, 3));

// per-instance: Y offset, initial z-noise, UV for warp lookup
const offsets = new Float32Array(LINE_COUNT);
const zNoises = new Float32Array(LINE_COUNT);
const lineUVs = new Float32Array(LINE_COUNT);
for (let i = 0; i < LINE_COUNT; i++){
  const y = (i - LINE_COUNT * 0.5) * LINE_SPACING;
  offsets[i] = y;
  zNoises[i] = (Math.random() - 0.5) * 0.05;  // subtle z-variance at rest
  lineUVs[i] = i / LINE_COUNT;
}
lineGeom.setAttribute('yOffset', new THREE.InstancedBufferAttribute(offsets, 1));
lineGeom.setAttribute('zNoise', new THREE.InstancedBufferAttribute(zNoises, 1));
lineGeom.setAttribute('lineUV',  new THREE.InstancedBufferAttribute(lineUVs, 1));

const lineMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:       { value: 0 },
    uPointer:    { value: new THREE.Vector2(0, 0) },
    uPresence:   { value: 0.0 },
    uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform vec2 uPointer;
    uniform float uPresence;
    attribute float yOffset;
    attribute float zNoise;
    attribute float lineUV;
    varying float vAlpha;
    varying float vDist;

    void main(){
      vec3 pos = position;
      pos.y += yOffset;

      // warp field: distance from pointer in screen-projected XY
      vec2 screenPos = vec2(pos.x, pos.y);
      float dist = length(screenPos - uPointer);
      float warpRadius = 8.0;
      float warpFalloff = smoothstep(warpRadius, 0.0, dist);

      // Z displacement — pull lines toward camera in figure region
      float zWarp = warpFalloff * uPresence * (6.0 + sin(lineUV * 31.41) * 2.5);
      pos.z += zWarp + zNoise;

      // slight wave so lines aren't perfectly static
      pos.z += sin(uTime * 0.6 + lineUV * 6.28) * 0.08 * (1.0 - uPresence * 0.5);

      // edge endpoints bend slightly inward when warped
      float edgeFactor = abs(position.x) / (25.0);
      pos.z -= warpFalloff * uPresence * edgeFactor * 1.2;

      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPos;

      vAlpha = 0.55 + warpFalloff * uPresence * 0.45;
      vDist = dist;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying float vAlpha;
    varying float vDist;
    void main(){
      // LED amber (#e8a03f) on black
      vec3 col = vec3(0.91, 0.63, 0.25);
      float alpha = vAlpha * (0.85 + sin(uTime * 3.2 + vDist * 0.5) * 0.15);
      gl_FragColor = vec4(col, alpha * 0.7);
    }
  `
});

const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

// pointer tracking
let pointerX = 0, pointerY = 0;
let pointerPresence = 0;
let pointerLastMove = 0;
addEventListener('pointermove', (e) => {
  pointerX = (e.clientX / innerWidth) * 2 - 1;
  pointerY = -(e.clientY / innerHeight) * 2 + 1;
  pointerPresence = 1.0;
  pointerLastMove = performance.now();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  lineMat.uniforms.uResolution.value.set(innerWidth, innerHeight);
});

function loop(){
  const now = performance.now();
  const elapsed = now / 1000;

  // decay presence when pointer is idle
  const idleTime = (now - pointerLastMove) / 1000;
  const targetPresence = idleTime < 1.5 ? 1.0 : Math.max(0, 1.0 - (idleTime - 1.5) * 0.6);
  pointerPresence += (targetPresence - pointerPresence) * 0.08;

  // map pointer screen coords to world XY
  const aspect = innerWidth / innerHeight;
  const fov = camera.fov * Math.PI / 180;
  const vHeight = 2 * Math.tan(fov / 2) * camera.position.z;
  const vWidth = vHeight * aspect;
  const worldX = pointerX * vWidth * 0.5;
  const worldY = pointerY * vHeight * 0.5;

  lineMat.uniforms.uTime.value = elapsed;
  lineMat.uniforms.uPointer.value.set(worldX, worldY);
  lineMat.uniforms.uPresence.value = pointerPresence;

  // subtle camera drift
  camera.position.x = Math.sin(elapsed * 0.08) * 1.8;
  camera.position.y = Math.cos(elapsed * 0.11) * 1.2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
