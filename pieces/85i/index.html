<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>85i · Shiota — soft-erupt</title>
<!-- MOTION: sway + periodic eruption, intensity: calm with surprise -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">85i</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.006);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.25));

const pL = new THREE.PointLight(0xffe0c0, 0.5, 50, 1.6);
pL.position.set(2.0, 10.0, -1.5);
scene.add(pL);

let seed = 47291583;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 34, h: 22, d: 40 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

const spherePos = new THREE.Vector3(0.6, 0.8, -0.5);
const SPHERE_R = 2.4;
const sphereGeo = new THREE.SphereGeometry(SPHERE_R, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece4,
  emissive: 0xf2ece4,
  emissiveIntensity: 0.08,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.55,
  side: THREE.DoubleSide
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

// Suspension wires
const suspWireGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  spherePos.x - 0.3, hh, spherePos.z + 0.2,
  spherePos.x - 0.3, spherePos.y + SPHERE_R, spherePos.z + 0.2,
  spherePos.x + 0.4, hh, spherePos.z - 0.3,
  spherePos.x + 0.4, spherePos.y + SPHERE_R, spherePos.z - 0.3,
  spherePos.x, hh, spherePos.z,
  spherePos.x, spherePos.y + SPHERE_R, spherePos.z
]);
suspWireGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
suspWireGeo.setIndex([0,1, 2,3, 4,5]);
scene.add(new THREE.LineSegments(suspWireGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a06, transparent: true, opacity: 0.5
})));

function sphereSurf(){
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2 * rng() - 1);
  return new THREE.Vector3(
    spherePos.x + Math.sin(v)*Math.cos(u)*SPHERE_R,
    spherePos.y + Math.sin(v)*Math.sin(u)*SPHERE_R,
    spherePos.z + Math.cos(v)*SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

const NUM_ANCHORS = 900;
const anchors = [];

const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  anchors.push(new THREE.Vector3(
    v[0]*8.0 + spherePos.x,
    v[1]*6.0 + spherePos.y,
    v[2]*8.0 + spherePos.z
  ));
}

const suspAnchors = [];
for(let i=0; i<8; i++){
  const p = new THREE.Vector3(
    spherePos.x + (rng()-0.5)*6.0,
    hh,
    spherePos.z + (rng()-0.5)*6.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}

const voids = [];
for(let i=0; i<3; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*14,
      spherePos.y + (rng()-0.5)*9,
      spherePos.z + (rng()-0.5)*14
    ),
    r: 2.2 + rng()*2.0
  });
}
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Thinner shell near sphere — critic: reduce density 30% near surface
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.35){
    p = sphereSurf();
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p.add(dir.multiplyScalar(1.0 + rng()*6.0));
    // Skip 30% of near-sphere anchors for crisp silhouette
    if(p.distanceTo(spherePos) < SPHERE_R + 3.0 && rng() < 0.30){ continue; }
  } else if(r < 0.65){
    p = wallPt();
    p.lerp(spherePos, 0.15 + rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 10) return p;
  const strength = Math.max(0, 1 - d/10);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snapAngle = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snapAngle) * snapAngle;
  const blended = theta + (snapped - theta) * strength * 0.45;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
// Store distance of each endpoint from sphere for eruption droop
const lineEndDist = new Float32Array(NUM_LINES * 2);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-spherePos.x, dy = my-spherePos.y, dz = mz-spherePos.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  lineEndDist[li*2] = a.distanceTo(spherePos);
  lineEndDist[li*2+1] = b.distanceTo(spherePos);
  li++;
}

// Suspension threads
for(const sa of suspAnchors){
  for(let j=0; j<6; j++){
    const target = sphereSurf();
    if(target.y > spherePos.y) setLine(sa, target);
    else {
      const t2 = sphereSurf();
      t2.y = spherePos.y + Math.abs(t2.y - spherePos.y);
      setLine(sa, t2);
    }
  }
}

// Cat A: threads converging on sphere (52%)
const catA = Math.floor(NUM_LINES * 0.52);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  if(rng() < 0.08){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng()*1.5));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: wall-to-wall structural web (20%)
const catB = Math.floor(NUM_LINES * 0.20);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 16 && rng() > 0.05){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat C: dendritic branching — reduced fork chance near sphere (critic: -30%)
let dendroAttempts = 0;
while(li < NUM_LINES - 60 && dendroAttempts < 60000){
  dendroAttempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.0){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Reduce fork probability near sphere for crisp silhouette
  const nearSphere = a.distanceTo(spherePos) < SPHERE_R + 4.0;
  const forkChance = nearSphere ? 0.18 : 0.28;
  if(rng() < forkChance && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.3 + rng()*0.35);
    const branchDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branchEnd = mid.clone().add(branchDir.multiplyScalar(0.7 + rng()*1.6));
    if(!inVoid(branchEnd)){
      setLine(mid, branchEnd);
      if(rng() < 0.22 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(branchEnd, 0.5);
        const dir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const end2 = mid2.clone().add(dir2.multiplyScalar(0.4 + rng()*0.9));
        if(!inVoid(end2)) setLine(mid2, end2);
      }
    }
  }
}

while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)) setLine(a, sphereSurf());
  else setLine(wallPt(), sphereSurf());
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// Dark fragments
const NUM_FRAGS = 32;
const frags = [];
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03 + rng()*0.14;
  const geo = rng()>0.45
    ? new THREE.BoxGeometry(sz*(1.5+rng()*2.4), sz*0.015, sz*(0.5+rng()*1.3))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.15),
    transparent: true,
    opacity: 0.2 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  if(rng() < 0.55){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    mesh.position.copy(spherePos).add(dir.multiplyScalar(SPHERE_R + 0.5 + rng()*5.0));
  } else {
    const si = Math.floor(rng()*li)*6;
    const t = 0.2 + rng()*0.6;
    mesh.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  }
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  mesh.userData.basePosY = mesh.position.y;
  mesh.userData.distFromSphere = mesh.position.distanceTo(spherePos);
  frags.push(mesh);
  scene.add(mesh);
}

// Camera dolly path
const pathLen = 480;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = spherePos.x, cy = spherePos.y, cz = spherePos.z;
  const x = cx + Math.sin(p)*6.5 + Math.sin(p*1.4+0.7)*2.0;
  const y = cy + 0.3 + Math.sin(p*0.4+0.5)*4.0 + Math.cos(p*0.3)*0.8;
  const z = cz + Math.cos(p)*8.0 + Math.cos(p*0.65+1.2)*2.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

// ── ERUPTION STATE — soft-erupt surprise
// Every ~14s the sphere exhales: fast rise (~0.4s), slow decay (~1.5s)
// Threads near sphere slacken downward during bloom, then snap taut
const ERUPT_INTERVAL = 14.0;
const ERUPT_RISE = 0.4;
const ERUPT_FALL = 1.5;
const ERUPT_TOTAL = ERUPT_RISE + ERUPT_FALL;

function eruptEnvelope(t){
  const cycle = t % ERUPT_INTERVAL;
  if(cycle > ERUPT_TOTAL) return 0;
  if(cycle < ERUPT_RISE){
    // Fast exponential rise
    const r = cycle / ERUPT_RISE;
    return r * r;
  }
  // Slow exponential decay
  const d = (cycle - ERUPT_RISE) / ERUPT_FALL;
  return Math.exp(-3.5 * d);
}

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── ERUPTION INTENSITY
  const erupt = eruptEnvelope(t);

  // Sphere emissive: rests at 0.08, blooms to 0.9
  sphereMat.emissiveIntensity = 0.08 + erupt * 0.82;
  // Sphere opacity subtly pulses during erupt — becomes more present
  sphereMat.opacity = 0.55 + erupt * 0.25;

  // Thread opacity: base 0.06, during erupt briefly brightens near-sphere threads
  // We modulate via the material (uniform effect) — warm pulse
  threads.material.opacity = 0.06 + erupt * 0.03;

  // Light intensity bloom during eruption
  pL.intensity = 0.5 + erupt * 0.6;

  // ── THREAD BREATHING + ERUPTION DROOP
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0018 * Math.max(0, 1.0 - dist / 18.0);
    const phase = basePositions[idx]*0.25 + basePositions[idx+1]*0.4 + i*0.002;
    const breath = Math.sin(t*0.05 + phase) * amp;

    for(let v=0; v<2; v++){
      const vi = idx + v*3;
      const eDist = lineEndDist[i*2+v];
      // Eruption droop: threads near sphere sag downward, proportional to proximity
      const droopZone = Math.max(0, 1.0 - eDist / 12.0);
      const droop = erupt * droopZone * 0.35;
      // Threads also sway slightly outward during eruption — exhale push
      const toCenter = eDist > 0.01 ? 1.0 : 0;
      const pushOut = erupt * droopZone * 0.08 * toCenter;

      arr[vi]   = basePositions[vi]   + breath*0.5 + pushOut * (basePositions[vi] - spherePos.x) * 0.02;
      arr[vi+1] = basePositions[vi+1] + breath*0.3 - droop;
      arr[vi+2] = basePositions[vi+2] + breath*0.4 + pushOut * (basePositions[vi+2] - spherePos.z) * 0.02;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Fragments tremble slightly during eruption
  for(const frag of frags){
    const proximity = Math.max(0, 1.0 - frag.userData.distFromSphere / 10.0);
    frag.position.y = frag.userData.basePosY - erupt * proximity * 0.12;
  }

  // Glacial camera drift
  const speed = 0.0018;
  const pathT = (t * speed) % 1.0;
  const cidx = pathT * (pathLen - 1);
  const i0 = Math.floor(cidx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = cidx - Math.floor(cidx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = spherePos.clone();
  look.x += Math.sin(t*0.007)*0.4;
  look.y += Math.cos(t*0.005)*0.3;
  camera.lookAt(look);

  pL.position.x = 2.0 + Math.sin(t*0.004)*1.2;
  pL.position.y = 10.0 + Math.cos(t*0.003)*0.5;
  pL.position.z = -1.5 + Math.cos(t*0.006)*0.9;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
