<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8i3 · speculative scaffold</title>
<!-- MOTION: construction, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0A0A0A; overflow:hidden;
               color:#F5F5F0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; color:#999; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a1a1a; color:#F5F5F0; border:1px solid #FF6B2B;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#FF6B2B; color:#0A0A0A; }

  /* HUD: 5-band bar chart */
  #hud {
    position: fixed;
    left: 14px;
    bottom: 32px;
    display: flex;
    align-items: flex-end;
    gap: 4px;
    opacity: 0.72;
    pointer-events: none;
  }
  .hud-band {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .hud-bar-wrap {
    width: 10px;
    height: 48px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .hud-bar {
    width: 100%;
    border-radius: 2px 2px 0 0;
    transition: height 0.05s linear;
  }
  .hud-label {
    font-size: 7px;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.45);
    text-align: center;
    line-height: 1;
  }
  /* band colors */
  .hud-bar-0 { background: #FF2244; }  /* sub-bass: red   */
  .hud-bar-1 { background: #FF6B2B; }  /* bass:     orange */
  .hud-bar-2 { background: #FFD700; }  /* mid:      gold  */
  .hud-bar-3 { background: #00FFCC; }  /* hi-mid:   cyan  */
  .hud-bar-4 { background: #CC88FF; }  /* presence: violet */
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · build with sound</button>
<div class="id">8i3</div>
<div class="hint" id="hint"></div>

<!-- HUD: real-time band meters -->
<div id="hud">
  <div class="hud-band">
    <div class="hud-bar-wrap"><div class="hud-bar hud-bar-0" id="hb0" style="height:0%"></div></div>
    <div class="hud-label">SUB<br>SCALE</div>
  </div>
  <div class="hud-band">
    <div class="hud-bar-wrap"><div class="hud-bar hud-bar-1" id="hb1" style="height:0%"></div></div>
    <div class="hud-label">BASS<br>BLAST</div>
  </div>
  <div class="hud-band">
    <div class="hud-bar-wrap"><div class="hud-bar hud-bar-2" id="hb2" style="height:0%"></div></div>
    <div class="hud-label">MID<br>RISE</div>
  </div>
  <div class="hud-band">
    <div class="hud-bar-wrap"><div class="hud-bar hud-bar-3" id="hb3" style="height:0%"></div></div>
    <div class="hud-label">HI-M<br>COLOR</div>
  </div>
  <div class="hud-band">
    <div class="hud-bar-wrap"><div class="hud-bar hud-bar-4" id="hb4" style="height:0%"></div></div>
    <div class="hud-label">PRES<br>SPIN</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ─── BAND → VISUAL MAPPING (5 FFT bands) ────────────────────────────────────
//  BAND_0  sub-bass  ~0–80 Hz    → overall SWARM SCALE (all blocks grow/shrink)
//  BAND_1  bass      ~80–250 Hz  → SCATTER / explosion radius (blocks burst outward)
//  BAND_2  mid       ~250–2kHz   → Y-axis COLUMN HEIGHT ceiling (stacks rise/fall)
//  BAND_3  hi-mid    ~2–6kHz     → COLOR SHIFT: orange (#FF6B2B) → white (#F5F5F0)
//  BAND_4  presence  ~6–16kHz    → RING ROTATION SPEED (camera orbit rate)
// ────────────────────────────────────────────────────────────────────────────

const scene = new THREE.Scene();
// Pure black — no frosted haze
scene.fog = new THREE.Fog(0x0A0A0A, 40, 110);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(28, 22, 28);
camera.lookAt(0, 8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0A0A0A, 1);
document.body.appendChild(renderer.domElement);

const GRID = 1.2;
const MAX_BLOCKS = 800;
let blocks = [];
let nextSpawnTime = 0;

// ─── SHADER: solid opaque geometry, vivid palette ───────────────────────────
const cubeGeo = new THREE.BoxGeometry(GRID*0.90, GRID*0.90, GRID*0.90);
const cubeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0 },
    uBand0:   { value: 0 },   // sub-bass  → scale (applied CPU-side, but sent for edge pulse)
    uBand1:   { value: 0 },   // bass      → scatter (applied CPU-side)
    uBand2:   { value: 0 },   // mid       → height  (applied CPU-side)
    uBand3:   { value: 0 },   // hi-mid    → color shift orange→white
    uBand4:   { value: 0 },   // presence  → rotation speed (applied CPU-side)
  },
  vertexShader: `
    uniform float uTime;
    uniform float uBand0;
    uniform float uBand1;
    varying vec3 vPos;
    varying vec3 vNormal;
    void main(){
      vPos = (instanceMatrix * vec4(position, 1.0)).xyz;
      vNormal = normalize(mat3(instanceMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uBand3;
    uniform float uBand1;
    varying vec3 vPos;
    varying vec3 vNormal;

    void main(){
      // BASE: rebar orange, solid and opaque
      vec3 colOrange  = vec3(1.0,  0.42, 0.17);   // #FF6B2B
      vec3 colWhite   = vec3(0.96, 0.96, 0.94);   // #F5F5F0  (concrete white)
      vec3 colNeon    = vec3(0.0,  1.0,  0.80);   // #00FFCC
      vec3 colRed     = vec3(1.0,  0.13, 0.27);   // #FF2244  (sub flash)

      // BAND_3 hi-mid: color shifts orange → white as hi-mid rises
      vec3 baseCol = mix(colOrange, colWhite, clamp(uBand3 * 2.2, 0.0, 1.0));

      // BAND_1 bass: neon flash on strong bass hit
      float bassPunch = smoothstep(0.45, 0.85, uBand1);
      baseCol = mix(baseCol, colNeon, bassPunch * 0.65);

      // directional diffuse — hard, not glossy
      vec3 lightDir = normalize(vec3(0.5, 1.0, 0.3));
      float ndl = max(0.0, dot(vNormal, lightDir));
      vec3 col = baseCol * (0.35 + 0.65 * ndl);

      // crisp edge highlight (rim) — no specular shimmer/frosted look
      vec3 camDir = normalize(-vPos);
      float rim = pow(1.0 - max(dot(normalize(vNormal), camDir), 0.0), 4.0);
      // rim uses neon when bass punches, else warm white
      vec3 rimCol = mix(colWhite, colNeon, bassPunch);
      col += rimCol * rim * 0.4;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const instancedMesh = new THREE.InstancedMesh(cubeGeo, cubeMat, MAX_BLOCKS);
instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(instancedMesh);

// floor grid lines — concrete white, very dim
const gridHelper = new THREE.GridHelper(48, 40, 0x222222, 0x1a1a1a);
scene.add(gridHelper);

// occupied grid cells for collision
const occupied = new Set();
function gridKey(x,y,z){ return `${Math.round(x*10)},${Math.round(y*10)},${Math.round(z*10)}`; }
function snapGrid(v){ return Math.round(v/GRID)*GRID; }

// ─── L-SYSTEM GROWTH ─────────────────────────────────────────────────────────
// BAND_2 (mid) controls the max Y ceiling → columns rise when you sing mid-range
function maxHeight(band2){ return GRID * (6 + band2 * 18); }

function trySpawn(parentPos, parentDir, age, energy, band2){
  if (blocks.length >= MAX_BLOCKS) return;
  let candidates = [];

  // vertical growth — only up to band2-driven ceiling
  if (energy > 0.25 && Math.random() < 0.65 && parentPos[1] < maxHeight(band2)){
    candidates.push({ dx:0, dy:GRID, dz:0 });
  }
  // horizontal branching
  if (Math.random() < 0.35 + energy * 0.3){
    const dirs = [[GRID,0,0],[-GRID,0,0],[0,0,GRID],[0,0,-GRID]];
    const pick = dirs[Math.floor(Math.random()*dirs.length)];
    candidates.push({ dx:pick[0], dy:pick[1], dz:pick[2] });
  }

  candidates.forEach(c => {
    const nx = snapGrid(parentPos[0] + c.dx);
    const ny = snapGrid(parentPos[1] + c.dy);
    const nz = snapGrid(parentPos[2] + c.dz);
    const key = gridKey(nx,ny,nz);
    if (!occupied.has(key) && ny >= 0 && ny < maxHeight(band2)){
      occupied.add(key);
      blocks.push({
        pos: [nx,ny,nz],
        basePos: [nx,ny,nz],     // home position for scatter
        dir: new THREE.Vector3(c.dx, c.dy, c.dz).normalize(),
        age: 0,
        state: 'grow',
        vel: new THREE.Vector3(0,0,0)
      });
    }
  });
}

// ─── BASS COLLAPSE ────────────────────────────────────────────────────────────
let lastBand1 = 0;
function collapseOnDownbeat(band1){
  if (band1 > 0.60 && lastBand1 < 0.45){
    const toFall = blocks.filter(b => b.state === 'solid' && Math.random() < 0.28);
    toFall.forEach(b => {
      b.state = 'falling';
      b.vel.set((Math.random()-0.5)*0.04, 0.02 + Math.random()*0.06, (Math.random()-0.5)*0.04);
      occupied.delete(gridKey(snapGrid(b.pos[0]), snapGrid(b.pos[1]), snapGrid(b.pos[2])));
    });
  }
  lastBand1 = band1;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── AUDIO ────────────────────────────────────────────────────────────────────
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.70;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · hum=columns · clap=blast · sing=color';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic build cycle';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi - lo)) / 255;
}

// band state (5 bands)
let band0=0, band1=0, band2=0, band3=0, band4=0;

// HUD elements
const hb = [0,1,2,3,4].map(i => document.getElementById('hb'+i));

const start = performance.now();
const dummy = new THREE.Object3D();

function loop(){
  const t = (performance.now() - start) / 1000;
  cubeMat.uniforms.uTime.value = t;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    // 5 bands spanning 0–~16kHz (512-bin FFT at 44100Hz → ~43Hz/bin)
    // BAND_0: 0–80Hz   bins 0..1
    // BAND_1: 80–250Hz bins 2..5
    // BAND_2: 250–2kHz bins 6..46
    // BAND_3: 2–6kHz   bins 47..139
    // BAND_4: 6–16kHz  bins 140..372
    band0 = bandEnergy(freqData, 0,   2);
    band1 = bandEnergy(freqData, 2,   6);
    band2 = bandEnergy(freqData, 6,   47);
    band3 = bandEnergy(freqData, 47,  140);
    band4 = bandEnergy(freqData, 140, Math.min(373, n));
  } else {
    // synthetic envelopes — make each band clearly distinct
    band0 = 0.40 + 0.40 * Math.sin(t * 0.7);                    // slow pulse  → scale
    band1 = 0.30 * Math.max(0, Math.sin(t * 2.1)) ** 3;          // sharp kick  → blast
    band2 = 0.35 + 0.35 * Math.sin(t * 1.4 + 1.0);              // medium wave → height
    band3 = 0.30 + 0.30 * Math.sin(t * 2.8 + 0.4);              // faster wave → color
    band4 = 0.25 + 0.25 * Math.sin(t * 4.2 + 0.9);              // fast         → spin
  }

  // Update HUD bars (0–100%)
  hb[0].style.height = (band0 * 100).toFixed(1) + '%';
  hb[1].style.height = (band1 * 100).toFixed(1) + '%';
  hb[2].style.height = (band2 * 100).toFixed(1) + '%';
  hb[3].style.height = (band3 * 100).toFixed(1) + '%';
  hb[4].style.height = (band4 * 100).toFixed(1) + '%';

  // Push band values to shader (band3 drives color shift; band1 drives neon flash)
  cubeMat.uniforms.uBand0.value = band0;
  cubeMat.uniforms.uBand1.value = band1;
  cubeMat.uniforms.uBand2.value = band2;
  cubeMat.uniforms.uBand3.value = band3;
  cubeMat.uniforms.uBand4.value = band4;

  // ── BAND_2 (mid): spawn rate — more mid → faster growth ──────────────────
  const spawnRate = 0.18 - band2 * 0.10;   // faster when mid is loud
  if (t > nextSpawnTime && blocks.length < MAX_BLOCKS){
    nextSpawnTime = t + Math.max(0.04, spawnRate);
    if (blocks.length === 0){
      // seed foundation
      for (let s = 0; s < 4; s++){
        const fx = snapGrid((Math.random()-0.5)*6*GRID);
        const fz = snapGrid((Math.random()-0.5)*6*GRID);
        const key = gridKey(fx, 0, fz);
        if (!occupied.has(key)){
          occupied.add(key);
          blocks.push({ pos:[fx,0,fz], basePos:[fx,0,fz],
            dir:new THREE.Vector3(0,1,0), age:0, state:'grow',
            vel:new THREE.Vector3(0,0,0) });
        }
      }
    } else {
      const solids = blocks.filter(b => b.state === 'solid' && b.age > 0.5);
      if (solids.length > 0){
        const parent = solids[Math.floor(Math.random()*solids.length)];
        trySpawn(parent.pos, parent.dir, parent.age, band1 + band2*0.5, band2);
      }
    }
  }

  // ── BAND_1 (bass): downbeat collapse ─────────────────────────────────────
  collapseOnDownbeat(band1);

  // update block states
  const dt = 1/60;
  const gravity = -0.22;
  blocks = blocks.filter(b => {
    if (b.state === 'grow'){
      b.age += dt * 2.2;
      if (b.age > 1.0){ b.age = 1.0; b.state = 'solid'; }
    } else if (b.state === 'falling'){
      b.vel.y += gravity * dt;
      b.pos[0] += b.vel.x;
      b.pos[1] += b.vel.y;
      b.pos[2] += b.vel.z;
      if (b.pos[1] < -GRID*3) return false;
    }
    return true;
  });

  // ── Render instances ──────────────────────────────────────────────────────
  // BAND_0 (sub-bass): scale the ENTIRE swarm — big signal = big boxes
  const swarmScale = 0.70 + band0 * 0.60;   // 0.70× quiet → 1.30× loud

  // BAND_1 (bass): scatter — offset solid blocks radially outward from centroid
  const scatterRadius = band1 * 3.8;         // 0 quiet → ~3.8 units loud

  // Compute centroid for scatter origin
  let cx=0, cy=0, cz=0;
  if (blocks.length > 0){
    blocks.forEach(b => { cx+=b.basePos[0]; cy+=b.basePos[1]; cz+=b.basePos[2]; });
    cx/=blocks.length; cy/=blocks.length; cz/=blocks.length;
  }

  let count = 0;
  blocks.forEach(b => {
    if (count >= MAX_BLOCKS) return;

    let px = b.pos[0], py = b.pos[1], pz = b.pos[2];

    // Apply scatter offset for solid blocks (BAND_1)
    if (b.state === 'solid' && scatterRadius > 0.1){
      const dx = b.basePos[0] - cx;
      const dz = b.basePos[2] - cz;
      const dist = Math.sqrt(dx*dx + dz*dz) + 0.001;
      px = b.basePos[0] + (dx/dist) * scatterRadius;
      pz = b.basePos[2] + (dz/dist) * scatterRadius;
      py = b.basePos[1];
    }

    dummy.position.set(px, py, pz);

    // BAND_0: swarm scale — blocks literally grow with sub-bass
    const growFrac = b.state === 'grow' ? b.age : 1.0;
    const s = GRID * 0.90 * growFrac * swarmScale;
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(count, dummy.matrix);
    count++;
  });
  instancedMesh.count = count;
  instancedMesh.instanceMatrix.needsUpdate = true;

  // ── BAND_4 (presence): camera orbit speed ────────────────────────────────
  const orbitSpeed = 0.06 + band4 * 0.28;   // 0.06 quiet → 0.34 fast
  const camRadius = 30 + Math.sin(t*0.25)*5;
  camera.position.x = camRadius * Math.cos(t * orbitSpeed);
  camera.position.z = camRadius * Math.sin(t * orbitSpeed);
  camera.position.y = 20 + Math.sin(t*0.18)*7;

  // track centroid
  if (blocks.length > 0){
    camera.lookAt(cx, Math.max(cy, 6), cz);
  } else {
    camera.lookAt(0, 8, 0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
