<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>gj6 · delivery sphere · speculative cartography</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#12141c; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">gj6</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   Ayoung Kim — Delivery Dancer's Sphere / speculative cartography
   A fictive Seoul-that-folds: Voronoi-displaced city blocks as
   wireframe extrusions on undulating terrain; motorbike-courier
   particles traverse the street graph, depositing glowing trail
   heatmaps. Chartreuse streets, magenta couriers, slate towers.
   High-angle slow orbit. Film-grain photochemical overlay.
   Narrative arc: gathering — invisible labor paths accumulate
   into a luminous map that outshines the architecture it serves.
   ═══════════════════════════════════════════════════════════════ */

const BG = 0x12141c;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.008);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 58, 40);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1e2030, 0.5));
const keyLight = new THREE.DirectionalLight(0xdde8ff, 0.35);
keyLight.position.set(15, 40, 10);
scene.add(keyLight);

// ─── seeded hash ───
function hash(a, b) {
  let h = (a * 374761393 + b * 668265263 + 1013) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) & 0x7fffffff) / 0x7fffffff;
}

// ─── terrain height ───
function terrainY(x, z) {
  return Math.sin(x * 0.09) * Math.cos(z * 0.07) * 2.8
       + Math.sin(x * 0.17 + z * 0.13) * 1.1;
}

// ─── generate city graph ───
const GRID = 16, SP = 3.8, HALF = (GRID - 1) * SP * 0.5;
const nodes = [], nodeMap = new Map();
for (let gx = 0; gx < GRID; gx++) {
  for (let gz = 0; gz < GRID; gz++) {
    if (hash(gx * 7, gz * 13) < 0.10) continue; // negative space
    const bx = gx * SP - HALF + (hash(gx + 1, gz + 2) - 0.5) * 2.0;
    const bz = gz * SP - HALF + (hash(gz + 3, gx + 4) - 0.5) * 2.0;
    const by = terrainY(bx, bz);
    const dist = Math.sqrt(bx * bx + bz * bz);
    const h = 0.6 + hash(gx + 5, gz + 9) * 5.0 + Math.max(0, 1 - dist / 22) * 5;
    const idx = nodes.length;
    nodes.push({ x: bx, y: by, z: bz, h, gx, gz, idx, nb: [] });
    nodeMap.set(gx + ',' + gz, idx);
  }
}

const edges = [], eSet = new Set();
function tryEdge(ai, bi) {
  const k = Math.min(ai, bi) + '-' + Math.max(ai, bi);
  if (eSet.has(k)) return;
  eSet.add(k);
  edges.push([ai, bi]);
  nodes[ai].nb.push(bi);
  nodes[bi].nb.push(ai);
}
for (const nd of nodes) {
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    if (!dx && !dz) continue;
    if (Math.abs(dx) + Math.abs(dz) > 1 && hash(nd.gx + dx * 3, nd.gz + dz * 5) < 0.55) continue;
    const key = (nd.gx + dx) + ',' + (nd.gz + dz);
    if (nodeMap.has(key)) tryEdge(nd.idx, nodeMap.get(key));
  }
}

// ─── wireframe buildings ───
const bldgMat = new THREE.LineBasicMaterial({ color: 0x3a3f50, transparent: true, opacity: 0.55 });
const bldgGroup = new THREE.Group();
for (const nd of nodes) {
  const w = 0.9 + hash(nd.gx + 11, nd.gz + 17) * 1.2;
  const d = 0.9 + hash(nd.gx + 23, nd.gz + 31) * 1.2;
  const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, nd.h, d));
  const seg = new THREE.LineSegments(geo, bldgMat);
  seg.position.set(nd.x, nd.y + nd.h * 0.5, nd.z);
  bldgGroup.add(seg);
}
scene.add(bldgGroup);

// ─── streets (chartreuse glow) ───
const stPos = [];
for (const [ai, bi] of edges) {
  const a = nodes[ai], b = nodes[bi];
  stPos.push(a.x, a.y + 0.08, a.z, b.x, b.y + 0.08, b.z);
}
const stGeo = new THREE.BufferGeometry();
stGeo.setAttribute('position', new THREE.Float32BufferAttribute(stPos, 3));
scene.add(new THREE.LineSegments(stGeo,
  new THREE.LineBasicMaterial({ color: 0x5a7a18, transparent: true, opacity: 0.35 })));
// brighter street layer (additive)
scene.add(new THREE.LineSegments(stGeo.clone(),
  new THREE.LineBasicMaterial({ color: 0xbfff00, transparent: true, opacity: 0.08,
    blending: THREE.AdditiveBlending, depthWrite: false })));

// ─── terrain mesh ───
const tSize = 72, tSeg = 48;
const tGeo = new THREE.PlaneGeometry(tSize, tSize, tSeg, tSeg);
tGeo.rotateX(-Math.PI / 2);
const tVerts = tGeo.attributes.position;
for (let i = 0; i < tVerts.count; i++) {
  const x = tVerts.getX(i), z = tVerts.getZ(i);
  tVerts.setY(i, terrainY(x, z) - 0.4);
}
tGeo.computeVertexNormals();
const terrainWire = new THREE.LineSegments(
  new THREE.WireframeGeometry(tGeo),
  new THREE.LineBasicMaterial({ color: 0x1e2230, transparent: true, opacity: 0.25 })
);
scene.add(terrainWire);

// ─── trail shaders ───
const trailVS = `
  attribute float alpha;
  varying float vA;
  void main() { vA = alpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
`;
const trailFS = `
  uniform vec3 uColor;
  uniform float uOpacity;
  varying float vA;
  void main() { gl_FragColor = vec4(uColor, vA * uOpacity); }
`;

// ─── courier particles ───
const NUM_COURIERS = 50, TRAIL_LEN = 100;

class Courier {
  constructor() {
    this.cur = (Math.random() * nodes.length) | 0;
    this.tgt = -1;
    this.t = 0;
    this.spd = 0.006 + Math.random() * 0.014;
    this.trail = [];
    this.pickNext();

    const mix = Math.random();
    const col = new THREE.Color(0xbfff00).lerp(new THREE.Color(0xff2080), mix);

    const pos = new Float32Array(TRAIL_LEN * 6);
    const alp = new Float32Array(TRAIL_LEN * 2);
    this.geo = new THREE.BufferGeometry();
    this.geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    this.geo.setAttribute('alpha', new THREE.BufferAttribute(alp, 1));
    this.geo.setDrawRange(0, 0);
    this.mesh = new THREE.LineSegments(this.geo, new THREE.ShaderMaterial({
      vertexShader: trailVS, fragmentShader: trailFS,
      uniforms: { uColor: { value: col }, uOpacity: { value: 0.8 } },
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    scene.add(this.mesh);

    // glowing dot
    const dGeo = new THREE.SphereGeometry(0.18, 5, 3);
    this.dot = new THREE.Mesh(dGeo, new THREE.MeshBasicMaterial({ color: col }));
    scene.add(this.dot);
  }

  pickNext() {
    const nb = nodes[this.cur].nb;
    this.tgt = nb.length ? nb[(Math.random() * nb.length) | 0] : this.cur;
    this.t = 0;
  }

  update() {
    this.t += this.spd;
    const a = nodes[this.cur], b = nodes[this.tgt];
    const f = Math.min(this.t, 1);
    const px = a.x + (b.x - a.x) * f;
    const py = a.y + (b.y - a.y) * f + 0.35;
    const pz = a.z + (b.z - a.z) * f;
    this.dot.position.set(px, py, pz);

    if (this.trail.length === 0 || (() => {
      const l = this.trail[this.trail.length - 1];
      return (px - l[0]) ** 2 + (pz - l[2]) ** 2 > 0.04;
    })()) this.trail.push([px, py, pz]);
    if (this.trail.length > TRAIL_LEN + 1) this.trail.shift();

    const pos = this.geo.attributes.position.array;
    const alp = this.geo.attributes.alpha.array;
    const sc = Math.max(0, this.trail.length - 1);
    for (let i = 0; i < sc; i++) {
      const p0 = this.trail[i], p1 = this.trail[i + 1];
      const o = i * 6;
      pos[o] = p0[0]; pos[o + 1] = p0[1]; pos[o + 2] = p0[2];
      pos[o + 3] = p1[0]; pos[o + 4] = p1[1]; pos[o + 5] = p1[2];
      const fade = (i / sc) ** 1.5;
      alp[i * 2] = fade; alp[i * 2 + 1] = fade;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.alpha.needsUpdate = true;
    this.geo.setDrawRange(0, sc * 2);

    if (this.t >= 1) { this.cur = this.tgt; this.pickNext(); }
    return [px, py, pz];
  }
}

const couriers = Array.from({ length: NUM_COURIERS }, () => new Courier());

// ─── accumulated heatmap layer ───
const ACCUM = 12000;
const aPos = new Float32Array(ACCUM * 6);
const aAlp = new Float32Array(ACCUM * 2);
let aCount = 0, aHead = 0;
const aGeo = new THREE.BufferGeometry();
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('alpha', new THREE.BufferAttribute(aAlp, 1));
aGeo.setDrawRange(0, 0);
const aMesh = new THREE.LineSegments(aGeo, new THREE.ShaderMaterial({
  vertexShader: trailVS, fragmentShader: trailFS,
  uniforms: { uColor: { value: new THREE.Color(0x99cc22) }, uOpacity: { value: 0.12 } },
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(aMesh);

let lastDep = 0;
function deposit(t) {
  if (t - lastDep < 0.4) return;
  lastDep = t;
  for (const c of couriers) {
    if (c.trail.length < 4) continue;
    const s = Math.max(0, c.trail.length - 5);
    for (let i = s; i < c.trail.length - 1; i++) {
      const p0 = c.trail[i], p1 = c.trail[i + 1];
      const idx = aHead % ACCUM, o = idx * 6;
      aPos[o] = p0[0]; aPos[o + 1] = p0[1] - 0.08; aPos[o + 2] = p0[2];
      aPos[o + 3] = p1[0]; aPos[o + 4] = p1[1] - 0.08; aPos[o + 5] = p1[2];
      aAlp[idx * 2] = 1; aAlp[idx * 2 + 1] = 1;
      aHead++;
      aCount = Math.min(aCount + 1, ACCUM);
    }
  }
  for (let i = 0; i < aCount * 2; i++) aAlp[i] *= 0.994;
  aGeo.attributes.position.needsUpdate = true;
  aGeo.attributes.alpha.needsUpdate = true;
  aGeo.setDrawRange(0, aCount * 2);
}

// ─── film grain (cyanotype) ───
const grainCv = document.createElement('canvas');
grainCv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0.05;mix-blend-mode:overlay;z-index:5;';
document.body.appendChild(grainCv);
const gCtx = grainCv.getContext('2d');
function grain() {
  grainCv.width = (innerWidth / 3) | 0;
  grainCv.height = (innerHeight / 3) | 0;
  const img = gCtx.createImageData(grainCv.width, grainCv.height);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = (Math.random() * 255) | 0;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  gCtx.putImageData(img, 0, 0);
}

// ─── vertical color-temperature gradient (warm top → cold teal bottom) ───
const gradGeo = new THREE.PlaneGeometry(140, 80);
const gradMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 warm = vec3(0.28, 0.18, 0.08);
      vec3 cold = vec3(0.04, 0.10, 0.14);
      vec3 c = mix(cold, warm, vUv.y);
      gl_FragColor = vec4(c, 0.15);
    }
  `,
  transparent: true, depthWrite: false, side: THREE.DoubleSide
});
const gradPlane = new THREE.Mesh(gradGeo, gradMat);
gradPlane.position.set(0, 15, -30);
scene.add(gradPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── animate ───
const t0 = performance.now();
let gT = 0;
(function loop() {
  const t = (performance.now() - t0) / 1000;

  // slow orbit — the city rotating beneath
  const ang = t * 0.025;
  const r = 52 + Math.sin(t * 0.04) * 6;
  camera.position.set(Math.sin(ang) * r * 0.6, 44 + Math.sin(t * 0.06) * 4, Math.cos(ang) * r * 0.6);
  camera.lookAt(0, 1, 0);

  for (const c of couriers) c.update();
  deposit(t);

  if (t - gT > 0.12) { gT = t; grain(); }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
