<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: calm -->
<title>xk0 · translucent creatures</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#12110f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; width:100vw; height:100vh; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
<style id="art-clean-ui-hide">
  .id { display:none !important; }
</style>
</head>
<body>
<div class="id">i80</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

function qp(n){ return new URL(location.href).searchParams.get(n); }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }

const N = 90000;
const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frust = 28;
const camera = new THREE.OrthographicCamera(frust*aspect/-2, frust*aspect/2, frust/2, frust/-2, 0.1, 2000);
camera.position.set(0, 0, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", precision: "highp" });
const resMult = parseFloat(qp('res')) || 2.2;
const DPR = Math.min(devicePixelRatio, 1.6);
renderer.setPixelRatio(DPR * resMult);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x12110f, 1);
document.body.appendChild(renderer.domElement);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: DPR * resMult },
  uYarnShow: { value: 0.74 },
  uBreath: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uYarnShow, uBreath;
    attribute vec2 birthPos;
    attribute float seed, strokeId, birthZ, creatureR, creatureAng;
    varying vec3 vColor;
    varying float vAlpha;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x),
                 mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
    }

    void main(){
      float t = uTime * 0.3;
      t += 0.18 * sin(uTime * 0.017) + 0.09 * sin(uTime * 0.041 + seed * 6.28318);
      vec2 p = birthPos;
      float bz = birthZ;

      // Creature-local coordinates for translucency effects
      float cR = creatureR;   // 0..1 along strand
      float cAng = creatureAng;

      // Gentle curl flow - simplified from parent
      float eps = 0.01;
      float NS = 0.30;
      vec2 pn = p * NS;
      float d1 = noise(pn + vec2(eps, 0.0) + t * 0.15);
      float d2 = noise(pn - vec2(eps, 0.0) + t * 0.15);
      float d3 = noise(pn + vec2(0.0, eps) + t * 0.15);
      float d4 = noise(pn - vec2(0.0, eps) + t * 0.15);
      vec2 curl = vec2(d3 - d4, -(d1 - d2)) / (2.0 * eps);

      // Slow pulse: creatures breathe - expanding and contracting gently
      float creaturePhase = seed * 6.28318 + strokeId * 0.73;
      float pulse = sin(uTime * 0.12 + creaturePhase) * 0.5 + 0.5; // 0..1
      float breathAmt = 0.06 + 0.04 * sin(uTime * 0.07 + strokeId * 1.37);

      // Radial breathing from each creature's center
      vec2 radDir = normalize(p + vec2(0.0001));
      float rr = length(p);

      // Apply gentle breath expansion
      p *= 1.0 + breathAmt * pulse * (0.5 + 0.5 * cR);

      // Soft curl drift - very slow, contemplative
      float flowAmt = mix(0.0, 0.26, 1.0 - uYarnShow);
      p += curl * flowAmt * (0.8 + 0.4 * noise(p * 0.4 + t * 0.08));

      // Blend toward birth position (yarn structure)
      vec3 pos = vec3(
        mix(p, birthPos, uYarnShow),
        mix(0.0, bz * 3.5, uYarnShow)
      );

      // Tentacle z-reach oscillation
      float tentacleWave = sin(uTime * 0.08 + cR * 4.0 + creaturePhase) * 0.3;
      pos.z += tentacleWave * cR * 2.0;

      // === TRANSLUCENCY ===

      // Fresnel-like rim effect: particles at edges of creature silhouette
      // glow brighter; interior particles become more transparent.
      // Approximate "edge" by: particles far along strand (high cR) = edge/tip,
      // and by angular variation within creature.
      float edgeness = pow(cR, 1.2); // tips are edges
      float interiorness = 1.0 - edgeness;

      // Depth-layered translucency: deeper z = more transparent
      float depthFactor = smoothstep(-4.0, 4.0, pos.z);
      float translucency = mix(0.15, 0.55, interiorness) * mix(0.6, 1.0, depthFactor);

      // Nacre / mother-of-pearl iridescence
      // Subtle hue shift based on creature-local angle + depth
      float iridescentPhase = cAng * 2.0 + pos.z * 0.3 + uTime * 0.02;
      float iriShift = sin(iridescentPhase) * 0.5 + 0.5;
      float iriShift2 = sin(iridescentPhase * 1.618 + 1.2) * 0.5 + 0.5;

      // Palette: nacre whites, pearl pink, translucent amber, shell interior
      // All desaturated, restrained - Roni Horn glass sculpture tones
      vec3 nacreWhite = vec3(0.86, 0.84, 0.80);
      vec3 pearlBlush = vec3(0.78, 0.68, 0.64);
      vec3 amberGlow  = vec3(0.68, 0.54, 0.38);
      vec3 shellDeep  = vec3(0.40, 0.36, 0.32);
      vec3 rimLight   = vec3(0.92, 0.90, 0.86);

      // Layer the palette based on depth and position
      vec3 baseColor = mix(shellDeep, nacreWhite, depthFactor);
      baseColor = mix(baseColor, pearlBlush, iriShift * 0.35);
      baseColor = mix(baseColor, amberGlow, iriShift2 * 0.25 * (1.0 - edgeness));

      // Rim glow on edges - the translucent rim-light effect
      float rimStrength = pow(edgeness, 2.0) * (0.4 + 0.3 * pulse);
      baseColor = mix(baseColor, rimLight, rimStrength * 0.5);

      // Interior light gathering - deeper interior particles catch scattered light
      float scatterGlow = interiorness * depthFactor * 0.3;
      baseColor += vec3(0.12, 0.10, 0.07) * scatterGlow;

      // Fluid noise for organic variation
      float fluid = smoothstep(0.4, 0.6, noise(p * 2.0 + t * 0.2));
      baseColor = mix(baseColor, nacreWhite, fluid * 0.08);

      vColor = baseColor;

      // Alpha: translucent interior, brighter edges, depth-aware
      float baseAlpha = mix(0.18, 0.52, fluid);
      // Translucency core: interior is see-through
      baseAlpha *= mix(0.35, 0.85, edgeness);
      // Depth contribution
      baseAlpha *= mix(0.55, 1.0, depthFactor);
      // Rim boost
      baseAlpha += rimStrength * 0.25;
      // Pulse modulation - gentle alpha breathing
      baseAlpha *= 0.85 + 0.15 * pulse;
      // Strand lifecycle
      float age = mod(seed * 100.0 + t * 0.4, 1.0);
      baseAlpha *= smoothstep(0.0, 0.1, age) * smoothstep(1.0, 0.9, age);

      vAlpha = clamp(baseAlpha, 0.0, 0.88);

      // Point size: translucent pieces benefit from slightly larger, softer particles
      float baseSize = mix(3.4, 2.0, fluid);
      gl_PointSize = floor(uPixel * baseSize * 2.0) / 2.0;

      // Tilt for 3D tentacle parallax
      float tiltA = 0.42 + 0.08 * sin(uTime * 0.04);
      float ca = cos(tiltA), sa = sin(tiltA);
      vec3 tp = pos;
      tp.yz = mat2(ca, -sa, sa, ca) * tp.yz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(tp, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      // Softer falloff for translucent feel - gaussian-ish
      float edge = exp(-d * d * 8.0);
      // Slight inner glow to simulate subsurface scattering
      float sss = exp(-d * d * 3.0) * 0.15;
      vec3 col = vColor + vec3(0.08, 0.06, 0.04) * sss;
      gl_FragColor = vec4(col, vAlpha * edge);
    }
  `
});

let geom, points;

function build(seedVal){
  const pos = new Float32Array(N*3), bpos = new Float32Array(N*2);
  const seeds = new Float32Array(N), ids = new Float32Array(N);
  const bz = new Float32Array(N);
  const cRadius = new Float32Array(N);  // creature-local radial progress 0..1
  const cAngle = new Float32Array(N);   // creature-local angle

  let s = seedVal >>> 0;
  const rng = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const h2 = (x, y) => { const n = Math.sin(x*127.1 + y*311.7) * 43758.5453; return n - Math.floor(n); };
  function vnoise(x, y){
    const xi = Math.floor(x), yi = Math.floor(y), xf = x-xi, yf = y-yi;
    const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
    const a = h2(xi,yi), b = h2(xi+1,yi), c = h2(xi+1,yi+1), d = h2(xi,yi+1);
    return a*(1-u)*(1-v) + b*u*(1-v) + d*(1-u)*v + c*u*v;
  }
  const NS = 0.30;
  function curl(x, y){
    const e = 0.15;
    const dy = (vnoise(x, y+e) - vnoise(x, y-e)) / (2*e);
    const dx = (vnoise(x+e, y) - vnoise(x-e, y)) / (2*e);
    let vx = dy, vy = -dx; const m = Math.hypot(vx,vy) + 1e-5;
    return [vx/m, vy/m];
  }

  const ns = Math.max(55, Math.min(110, 78 + Math.floor(rng() * 28)));
  const pps = Math.floor(N / ns);
  const RDISK = 10.4;
  const centers = [];
  let attempts = 0;
  while (centers.length < ns && attempts < ns * 8){
    attempts++;
    const rr = Math.sqrt(rng()) * RDISK;
    const aa = rng() * 6.2831853;
    const cx = Math.cos(aa) * rr, cy = Math.sin(aa) * rr;
    if (vnoise(cx*0.26 + 5.0, cy*0.26 + 5.0) < 0.26 && rng() < 0.40) continue;
    centers.push([cx, cy]);
  }
  const realNs = Math.min(ns, centers.length);
  let idx = 0;
  for (let i = 0; i < realNs && idx < N; i++){
    const cx0 = centers[i][0], cy0 = centers[i][1];
    let px = cx0, py = cy0;
    const len = 2.4 + rng() * 4.4;
    const thick = 0.035 + rng() * 0.085;
    const flip = rng() < 0.5 ? 1.0 : -1.0;
    const stepLen = len / pps;
    const reach = (rng() < 0.5 ? -1.0 : 1.0) * (1.2 + rng() * 2.8);
    const wig = 0.2 + rng() * 0.55, wph = rng() * 6.2831853;
    const creatureAngle = Math.atan2(cy0, cx0);

    for (let j = 0; j < pps && idx < N; j++){
      const tt = j / pps;
      let [vx, vy] = curl(px*NS, py*NS); vx *= flip; vy *= flip;
      px += vx * stepLen; py += vy * stepLen;
      const nx = -vy, ny = vx, off = (rng()-0.5) * thick;
      const x = px + nx*off, y = py + ny*off;
      const z = reach * Math.pow(tt, 1.6) + Math.sin(tt*6.0 + wph) * wig * tt;
      pos[idx*3]=x; pos[idx*3+1]=y; pos[idx*3+2]=z;
      bpos[idx*2]=x; bpos[idx*2+1]=y;
      bz[idx]=z;
      seeds[idx]=rng();
      ids[idx]=i;
      cRadius[idx]=tt;
      cAngle[idx]=creatureAngle;
      idx++;
    }
  }
  while (idx < N) {
    pos[idx*3]=99999.0; pos[idx*3+1]=99999.0; pos[idx*3+2]=0.0;
    bpos[idx*2]=99999.0; bpos[idx*2+1]=99999.0;
    seeds[idx]=0.0; ids[idx]=-1.0; bz[idx]=0; cRadius[idx]=0; cAngle[idx]=0;
    idx++;
  }
  return { pos, bpos, seeds, ids, bz, cRadius, cAngle };
}

function regenerate(){
  const d = build(Math.floor(Math.random()*1e9));
  if (!geom) {
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(d.pos, 3));
    geom.setAttribute('birthPos', new THREE.BufferAttribute(d.bpos, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(d.seeds, 1));
    geom.setAttribute('strokeId', new THREE.BufferAttribute(d.ids, 1));
    geom.setAttribute('birthZ', new THREE.BufferAttribute(d.bz, 1));
    geom.setAttribute('creatureR', new THREE.BufferAttribute(d.cRadius, 1));
    geom.setAttribute('creatureAng', new THREE.BufferAttribute(d.cAngle, 1));
    points = new THREE.Points(geom, mat); scene.add(points);
  } else {
    geom.attributes.position.array.set(d.pos); geom.attributes.position.needsUpdate = true;
    geom.attributes.birthPos.array.set(d.bpos); geom.attributes.birthPos.needsUpdate = true;
    geom.attributes.seed.array.set(d.seeds); geom.attributes.seed.needsUpdate = true;
    geom.attributes.strokeId.array.set(d.ids); geom.attributes.strokeId.needsUpdate = true;
    geom.attributes.birthZ.array.set(d.bz); geom.attributes.birthZ.needsUpdate = true;
    geom.attributes.creatureR.array.set(d.cRadius); geom.attributes.creatureR.needsUpdate = true;
    geom.attributes.creatureAng.array.set(d.cAngle); geom.attributes.creatureAng.needsUpdate = true;
  }
}

const start = performance.now();

function loop(){
  const dt = (performance.now() - start) / 1000;
  uniforms.uTime.value = dt;

  // Gentle global breath cycle
  const breathCycle = Math.sin(dt * 0.1) * 0.5 + 0.5;
  uniforms.uBreath.value = breathCycle;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

if (qp('yarn') !== null) uniforms.uYarnShow.value = clamp01(parseFloat(qp('yarn')));
regenerate();
loop();
addEventListener('click', regenerate);
addEventListener('resize', () => {
  const na = innerWidth/innerHeight;
  camera.left=frust*na/-2; camera.right=frust*na/2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = DPR * resMult;
});
</script>
</body>
</html>
