<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>92o · relational web — presence makes the thread</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#040303; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
.pulse-counter { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.04em; z-index:5; text-align:right; line-height:1.6; }
</style>
</head>
<body>
<div class="id">92o</div>
<div class="pulse-counter" id="counter">viewers: 1<br>pulses: 0</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Relational state ── */
const relState = {
  viewers: 1,
  pulseCount: 0,
  pulseRate: 0,       // pulses per second (smoothed)
  lastPulseTime: 0,
  ripples: [],        // {time, origin, strength}
  warmth: 0,          // 0=alone/cold, 1=connected/warm — smoothed
  targetWarmth: 0
};

/* ── BroadcastChannel — cross-tab presence ── */
const channel = new BroadcastChannel('relational-web-7cb');
const tabId = Math.random().toString(36).slice(2, 8);
const knownTabs = new Map(); // id → lastSeen

channel.onmessage = (e) => {
  const d = e.data;
  if (d.type === 'heartbeat') {
    knownTabs.set(d.id, performance.now());
    relState.viewers = knownTabs.size + 1;
    relState.targetWarmth = Math.min(1, relState.viewers / 4);
  }
  if (d.type === 'pulse') {
    addRipple(d.origin, d.strength * 0.6);
  }
};

// Heartbeat every 2s
setInterval(() => {
  channel.postMessage({ type: 'heartbeat', id: tabId });
  // prune stale tabs
  const now = performance.now();
  for (const [id, t] of knownTabs) {
    if (now - t > 6000) knownTabs.delete(id);
  }
  relState.viewers = knownTabs.size + 1;
  relState.targetWarmth = Math.min(1, relState.viewers / 4);
}, 2000);
channel.postMessage({ type: 'heartbeat', id: tabId });

/* ── WebSocket — Binance BTC trade stream as external pulse ── */
let ws = null;
let wsRetry = 0;
function connectWS() {
  try {
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onopen = () => { wsRetry = 0; };
    ws.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        const qty = parseFloat(d.q) || 0;
        const strength = Math.min(1, qty / 0.5);
        if (strength > 0.05) {
          relState.pulseCount++;
          relState.lastPulseTime = performance.now();
          const angle = (parseFloat(d.p) % 360) * Math.PI / 180;
          addRipple(
            new THREE.Vector3(Math.cos(angle) * 4, Math.sin(angle) * 2, -3),
            strength
          );
          channel.postMessage({
            type: 'pulse',
            origin: [Math.cos(angle)*4, Math.sin(angle)*2, -3],
            strength
          });
        }
      } catch(_){}
    };
    ws.onclose = () => {
      if (wsRetry < 5) { wsRetry++; setTimeout(connectWS, 3000 * wsRetry); }
      else { startFallbackPulse(); }
    };
    ws.onerror = () => { ws.close(); };
  } catch(_) { startFallbackPulse(); }
}
connectWS();

/* Fallback pulse if WS unavailable — slow internal heartbeat */
let fallbackInterval = null;
function startFallbackPulse() {
  if (fallbackInterval) return;
  fallbackInterval = setInterval(() => {
    relState.pulseCount++;
    relState.lastPulseTime = performance.now();
    const a = relState.pulseCount * 1.3;
    addRipple(new THREE.Vector3(Math.sin(a)*5, Math.cos(a)*3, -3), 0.3 + Math.random()*0.3);
  }, 2500);
}

function addRipple(origin, strength) {
  if (origin instanceof Array) origin = new THREE.Vector3(origin[0], origin[1], origin[2]);
  relState.ripples.push({ time: performance.now() / 1000, origin, strength });
  if (relState.ripples.length > 20) relState.ripples.shift();
}

/* ── Three.js setup ── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040303);
scene.fog = new THREE.FogExp2(0x040303, 0.04);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x1a0a0a, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.4);
dirLight.position.set(-3, 5, 2);
scene.add(dirLight);

/* ── Deterministic RNG ── */
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

/* ── Sphere — the gathering point ── */
const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(2.8, 0.6, -3.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.25,
  roughness: 0.9, metalness: 0, transparent: true, opacity: 0.8
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

/* ── Room + anchors ── */
const ROOM = { w: 18, h: 12, d: 28 };
const anchors = [];
function wallPoint(){
  const face = Math.floor(rng()*6);
  let x,y,z;
  const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;
  switch(face){
    case 0: x=-hw; y=(rng()-.5)*ROOM.h; z=(rng()-.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-.5)*ROOM.h; z=(rng()-.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-.5)*ROOM.w; z=(rng()-.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-.5)*ROOM.w; z=(rng()-.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-.5)*ROOM.w; y=(rng()-.5)*ROOM.h; break;
    case 5: z= hd; x=(rng()-.5)*ROOM.w; y=(rng()-.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

const NUM_ANCHORS = 600;
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-.5, rng()-.5, rng()-.5).normalize();
    const dist = sphereRadius + 0.1 + rng() * 2.5;
    anchors.push(sphereCenter.clone().add(dir.multiplyScalar(dist)));
  } else {
    anchors.push(wallPoint());
  }
}

/* ── Build threads ── */
const NUM_LINES = 22000;
const linePositions = new Float32Array(NUM_LINES * 6);
const lineAlphas = new Float32Array(NUM_LINES * 2); // per-vertex alpha
let li = 0;

function sphereSurfacePoint(from){
  const dir = sphereCenter.clone().sub(from).normalize();
  return sphereCenter.clone().add(dir.multiplyScalar(-sphereRadius*(0.98+rng()*0.04)));
}

// Cat A: wall-to-wall ~35%
const catA = Math.floor(NUM_LINES * 0.35);
for (let i = 0; i < catA && li < NUM_LINES; i++){
  const a = wallPoint(), b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereCenter) > 12 && rng() > 0.3) { i--; continue; }
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=b.x; linePositions[idx+4]=b.y; linePositions[idx+5]=b.z;
  const baseA = 0.03 + rng() * 0.03;
  lineAlphas[li*2] = baseA; lineAlphas[li*2+1] = baseA;
  li++;
}

// Cat B: converging on sphere ~40%
const catB = Math.floor(NUM_LINES * 0.40);
for (let i = 0; i < catB && li < NUM_LINES; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const ns = sphereSurfacePoint(a);
  ns.x += (rng()-.5)*.5; ns.y += (rng()-.5)*.5; ns.z += (rng()-.5)*.5;
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=ns.x; linePositions[idx+4]=ns.y; linePositions[idx+5]=ns.z;
  const baseA = 0.04 + rng() * 0.04;
  lineAlphas[li*2] = baseA; lineAlphas[li*2+1] = baseA;
  li++;
}

// Cat C: short local threads ~25%
const catC = NUM_LINES - li;
for (let i = 0; i < catC && li < NUM_LINES; i++){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.2){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) best = wallPoint();
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=best.x; linePositions[idx+4]=best.y; linePositions[idx+5]=best.z;
  const baseA = 0.04 + rng() * 0.05;
  lineAlphas[li*2] = baseA; lineAlphas[li*2+1] = baseA;
  li++;
}

const basePositions = new Float32Array(linePositions);
const baseAlphas = new Float32Array(lineAlphas);

/* ── Custom shader material for per-vertex alpha + relational color ── */
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('alpha', new THREE.BufferAttribute(lineAlphas, 1));

const threadUniforms = {
  uWarmth: { value: 0 },
  uPulse: { value: 0 },
  uFogColor: { value: new THREE.Color(0x040303) },
  uFogDensity: { value: 0.04 }
};

const lineMat = new THREE.ShaderMaterial({
  uniforms: threadUniforms,
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float uFogDensity;
    void main(){
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mvPos;
      vAlpha = alpha;
      float fogDist = length(mvPos.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDist * fogDist);
    }
  `,
  fragmentShader: `
    uniform float uWarmth;
    uniform float uPulse;
    uniform vec3 uFogColor;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      // Cold: steel blue-white. Warm: Shiota red
      vec3 cold = vec3(0.55, 0.58, 0.72);
      vec3 warm = vec3(0.76, 0.0, 0.09);
      vec3 col = mix(cold, warm, uWarmth);
      // Pulse brightens
      col += vec3(0.12, 0.06, 0.03) * uPulse;
      float a = vAlpha;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor);
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

/* ── Fragments caught in web ── */
const NUM_FRAGMENTS = 14;
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.05 + rng()*0.15;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(size, size*(0.3+rng()*1.4), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04+rng()*0.06, 0.02+rng()*0.03, 0.02+rng()*0.02),
    transparent: true, opacity: 0.5 + rng()*0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = rng();
  const si = Math.floor(rng()*li)*6;
  mesh.position.set(
    basePositions[si]*(1-t)+basePositions[si+3]*t,
    basePositions[si+1]*(1-t)+basePositions[si+4]*t,
    basePositions[si+2]*(1-t)+basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

/* ── Suspension threads — ceiling to sphere ── */
for (let i = 0; i < 6; i++){
  const angle = (i / 6) * Math.PI * 2 + rng() * 0.3;
  const r = sphereRadius * (0.3 + rng() * 0.5);
  const top = new THREE.Vector3(
    sphereCenter.x + Math.cos(angle) * r,
    ROOM.h / 2,
    sphereCenter.z + Math.sin(angle) * r
  );
  const bot = new THREE.Vector3(
    sphereCenter.x + Math.cos(angle) * r * 0.3,
    sphereCenter.y + sphereRadius * 0.9,
    sphereCenter.z + Math.sin(angle) * r * 0.3
  );
  const sg = new THREE.BufferGeometry().setFromPoints([top, bot]);
  const sm = new THREE.LineBasicMaterial({
    color: 0x886666, transparent: true, opacity: 0.08,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.LineSegments(sg, sm));
}

/* ── Camera ── */
const cameraPath = { radius: 6.5, height: 0.8, speed: 0.015 };

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Counter update ── */
const counterEl = document.getElementById('counter');
let lastCounterUpdate = 0;

/* ── Animation ── */
const start = performance.now();
const tmpV = new THREE.Vector3();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;

  // Smooth warmth
  relState.warmth += (relState.targetWarmth - relState.warmth) * 0.01;

  // Compute pulse intensity (decays from last pulse)
  const sincePulse = (now - relState.lastPulseTime) / 1000;
  const pulseIntensity = Math.max(0, 1 - sincePulse * 1.5) * 0.8;

  // Update uniforms
  threadUniforms.uWarmth.value = relState.warmth;
  threadUniforms.uPulse.value = pulseIntensity;

  // Sphere responds: emissive intensity and slight scale pulse
  const baseEmissive = 0.25;
  const viewerBoost = Math.min(0.6, relState.viewers * 0.12);
  sphereMat.emissiveIntensity = baseEmissive + viewerBoost + pulseIntensity * 0.3;
  // Color shifts warm with presence
  const sc = new THREE.Color().lerpColors(
    new THREE.Color(0xd8d0c8), new THREE.Color(0xf0e8dc), relState.warmth
  );
  sphereMat.color.copy(sc);
  sphereMat.emissive.copy(sc);
  const pulseScale = 1 + pulseIntensity * 0.03;
  sphere.scale.setScalar(pulseScale);

  // Thread breathing + ripple response
  const posAttr = lineGeo.attributes.position;
  const alphaAttr = lineGeo.attributes.alpha;
  const pArr = posAttr.array;
  const aArr = alphaAttr.array;
  const breathAmp = 0.012;
  const breathFreq = 0.3;

  for (let i = 0; i < li; i++){
    const i6 = i * 6;
    const i2 = i * 2;
    for (let v = 0; v < 2; v++){
      const off = i6 + v * 3;
      const bx = basePositions[off];
      const by = basePositions[off+1];
      const bz = basePositions[off+2];

      // Breathing
      const phase = bx * 0.7 + by * 1.1 + bz * 0.5;
      const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;

      // Ripple displacement
      let rippleDisp = 0;
      let rippleAlpha = 0;
      tmpV.set(bx, by, bz);

      for (let r = 0; r < relState.ripples.length; r++){
        const rip = relState.ripples[r];
        const age = elapsed - rip.time;
        if (age > 3) continue;
        const dist = tmpV.distanceTo(rip.origin);
        const wavePos = age * 8; // wave speed
        const waveDelta = Math.abs(dist - wavePos);
        if (waveDelta < 2.5){
          const envelope = rip.strength * Math.exp(-age * 1.2) * Math.exp(-waveDelta * 0.8);
          rippleDisp += Math.sin(dist * 2 - age * 12) * envelope * 0.08;
          rippleAlpha += envelope * 0.15;
        }
      }

      pArr[off]   = bx + b + rippleDisp;
      pArr[off+1] = by + b * 0.7 + rippleDisp * 0.5;
      pArr[off+2] = bz + b * 0.5 + rippleDisp * 0.3;

      // Alpha: base + viewer presence boost + ripple highlight
      const presenceBoost = Math.min(0.06, relState.viewers * 0.015);
      aArr[i2+v] = baseAlphas[i2+v] + presenceBoost + rippleAlpha;
    }
  }
  posAttr.needsUpdate = true;
  alphaAttr.needsUpdate = true;

  // Prune old ripples
  while (relState.ripples.length > 0 && elapsed - relState.ripples[0].time > 3.5){
    relState.ripples.shift();
  }

  // Camera
  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  camera.position.set(
    sphereCenter.x + Math.cos(angle) * cr,
    sphereCenter.y + cameraPath.height + Math.sin(elapsed * 0.012) * 1.5,
    sphereCenter.z + Math.sin(angle) * cr
  );
  const lookTarget = sphereCenter.clone();
  lookTarget.x += Math.sin(elapsed * 0.04) * 0.5;
  lookTarget.y += Math.cos(elapsed * 0.03) * 0.3;
  camera.lookAt(lookTarget);

  // Update counter text (throttled)
  if (now - lastCounterUpdate > 500){
    lastCounterUpdate = now;
    counterEl.textContent = `viewers: ${relState.viewers}\npulses: ${relState.pulseCount}`;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
