<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glitch merge · Rosa Menkman · error is information</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070a; overflow:hidden;
               color:#e6dcd6; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,monospace; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="loading" id="loading">loading head scan · glitch channel…</div>
<div class="id">c0x</div>
<div class="hint">drag to orbit · click to corrupt merge</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 16);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Post-processing: glitch shader (Rosa Menkman style)
const GlitchShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uGlitchIntensity: { value: 0 },
    uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uImpact: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform float uGlitchIntensity;
    uniform vec2 uResolution;
    uniform float uImpact;
    varying vec2 vUv;

    // pseudo-random
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float hash1(float n){ return fract(sin(n)*43758.5453); }

    // posterize to 5-color palette
    vec3 quantize(vec3 c){
      // 5-color glitch palette: black, deep magenta, cyan, hot white, dull green
      vec3 pal[5];
      pal[0] = vec3(0.04, 0.02, 0.06);
      pal[1] = vec3(0.85, 0.12, 0.45);
      pal[2] = vec3(0.15, 0.92, 0.85);
      pal[3] = vec3(0.95, 0.95, 0.88);
      pal[4] = vec3(0.22, 0.55, 0.18);
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      float minD = 100.0;
      vec3 best = pal[0];
      for(int i=0; i<5; i++){
        float d = distance(c, pal[i]);
        if(d < minD){ minD = d; best = pal[i]; }
      }
      return best;
    }

    void main(){
      vec2 uv = vUv;
      float t = uTime;
      float gi = uGlitchIntensity;

      // 8x8 block quantization coords
      vec2 blockSize = vec2(8.0) / uResolution;
      vec2 blockUV = floor(uv / blockSize) * blockSize;
      float blockHash = hash(blockUV + floor(t * 3.0));

      // frame skip / jitter bursts (Rosa Menkman scrubbing)
      float burstPhase = hash1(floor(t * 2.7));
      bool isBurst = burstPhase > 0.82;
      if(isBurst){
        float skip = floor(hash1(floor(t*11.0)) * 6.0) - 3.0;
        uv.y += skip * blockSize.y * 4.0 * gi;
      }

      // zalgo vertical stretch on impact
      if(uImpact > 0.1){
        float stretchZone = step(0.7, hash(blockUV * 3.1 + 0.5));
        if(stretchZone > 0.0){
          float stretch = (hash(blockUV + t) - 0.5) * uImpact * 0.15;
          uv.y += stretch;
        }
      }

      // RGB channel separation (aggressive chromatic aberration)
      float abAmount = (0.003 + gi * 0.012) * (1.0 + uImpact * 3.0);
      // shift direction varies per block row
      float rowShift = sin(blockUV.y * 40.0 + t) * abAmount;
      float rOff = abAmount + rowShift * 0.5;
      float bOff = -abAmount - rowShift * 0.3;

      vec3 col;
      col.r = texture2D(tDiffuse, uv + vec2(rOff, 0.0)).r;
      col.g = texture2D(tDiffuse, uv).g;
      col.b = texture2D(tDiffuse, uv + vec2(bOff, 0.0)).b;

      // 8x8 JPEG block artifact: some blocks get displaced or color-shifted
      if(blockHash > 0.88 && gi > 0.1){
        vec2 displaced = blockUV + vec2(hash(blockUV + t*0.1) - 0.5, 0.0) * 0.04;
        col = texture2D(tDiffuse, displaced).rgb;
        col.rb = col.br; // channel swap in corrupted blocks
      }

      // block-boundary scanlines
      vec2 blockFrac = fract(uv / blockSize);
      float edge = step(0.94, blockFrac.x) + step(0.94, blockFrac.y);
      if(edge > 0.0 && gi > 0.3){
        col *= 0.4;
      }

      // posterization (visible quantization to palette)
      float posterMix = 0.35 + gi * 0.45;
      vec3 quant = quantize(col);
      col = mix(col, quant, posterMix);

      // horizontal tearing lines
      float tearLine = step(0.97, hash(vec2(floor(uv.y * uResolution.y * 0.25), floor(t*4.0))));
      if(tearLine > 0.0){
        uv.x += (hash1(uv.y * 100.0 + t) - 0.5) * 0.06 * gi;
        col = texture2D(tDiffuse, uv).rgb;
        col = quantize(col);
      }

      // vignette with digital noise at edges
      float vig = 1.0 - smoothstep(0.4, 1.4, length(vUv - 0.5) * 1.8);
      col *= vig;

      // static noise grain
      float noise = (hash(vUv * uResolution + t * 100.0) - 0.5) * 0.06 * (1.0 + gi);
      col += noise;

      gl_FragColor = vec4(col, 1.0);
    }
  `
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const glitchPass = new ShaderPass(GlitchShader);
composer.addPass(glitchPass);

const N = 50000;
const PER = N / 2;
const APART_OFFSET = 5.0;

const restMerged = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const headArr = new Float32Array(N);

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 },
  uReady: { value: 0 },
  uGlitch: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    uniform float uReady;
    uniform float uGlitch;
    attribute vec3 restFar;
    attribute vec3 restMerged;
    attribute float seed;
    attribute float head;
    varying vec3  vCol;
    varying float vEnergy;
    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(restFar, restMerged, m);

      // glitch displacement: some particles jump to wrong positions
      float glitchSeed = fract(sin(seed * 43758.5 + floor(uTime * 3.0)) * 2345.6);
      if(glitchSeed > (1.0 - uGlitch * 0.15)){
        // datamosh: particle snaps to neighbor's old position
        p.x += (fract(sin(seed * 12.9898 + uTime) * 43758.5) - 0.5) * 2.0;
        p.y += (fract(sin(seed * 78.233 + uTime) * 43758.5) - 0.5) * 1.5;
      }

      float t = uTime * 0.4 + seed * 6.28;
      p += 0.012 * vec3(sin(t), cos(t*1.1), sin(t*0.8));

      // reveal spiral
      float th = seed * 6.28;
      vec3 entry = vec3(cos(th)*15.0, 0.0, sin(th)*15.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.5 + 0.5 * sin(t * 0.8);

      // glitch palette: magenta vs cyan instead of bone vs steel
      vec3 colA = vec3(0.85, 0.12, 0.45);   // hot magenta
      vec3 colB = vec3(0.15, 0.92, 0.85);   // digital cyan
      vec3 base = (head < 0.5) ? colA : colB;
      // at merge, flash toward overexposed white
      vec3 mergeCol = vec3(0.98, 0.95, 0.88);
      vCol = mix(base, mergeCol, m * 0.6);
      // energy variation
      vCol *= (0.7 + 0.5 * vEnergy);

      // occasional posterization snap in vertex color
      if(glitchSeed > 0.92){
        vCol = floor(vCol * 4.0) / 4.0;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // particles get blockier (larger) during glitch
      float sizeBoost = 1.0 + uGlitch * 0.5 * step(0.9, glitchSeed);
      gl_PointSize = sizeBoost * (1.0 + 0.6 * vEnergy) * uPixel * (40.0 / dist) * (0.4 + 0.6 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      // squarer particles for glitch aesthetic — less soft falloff
      float a = smoothstep(0.25, 0.05, r) * (0.5 + 0.4 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

let revealStart = 0;
let impactTime = 0;

const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';
const loader = new GLTFLoader();
loader.load(HEAD_URL,
  (gltf) => {
    const meshes = [];
    gltf.scene.traverse(o => { if(o.isMesh && o.geometry?.attributes?.position) meshes.push(o); });
    if(meshes.length === 0){ document.getElementById('loading').textContent = 'no mesh'; return; }
    let target = meshes[0];
    for(const m of meshes){
      if(m.geometry.attributes.position.count > target.geometry.attributes.position.count) target = m;
    }
    target.updateMatrixWorld(true);

    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const scl = 5 / Math.max(size.x, size.y, size.z);
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const tmp = new THREE.Vector3();
    for(let i = 0; i < N; i++){
      sampler.sample(tmp);
      restMerged[i*3]   = tmp.x;
      restMerged[i*3+1] = tmp.y;
      restMerged[i*3+2] = tmp.z;
      seeds[i] = Math.random();
    }

    // complementary holes
    const holes = [];
    for(let h = 0; h < 6; h++){
      holes.push({
        x: (Math.random()-0.5)*4, y: (Math.random()-0.5)*4,
        z: (Math.random()-0.5)*4, r: 0.7 + Math.random()*0.7
      });
    }
    function inAnyHole(x,y,z){
      for(const h of holes){
        const dx=x-h.x, dy=y-h.y, dz=z-h.z;
        if(dx*dx+dy*dy+dz*dz < h.r*h.r) return true;
      }
      return false;
    }

    for(let i = 0; i < N; i++){
      headArr[i] = inAnyHole(restMerged[i*3], restMerged[i*3+1], restMerged[i*3+2]) ? 1 : 0;
    }

    const tmpV = new THREE.Vector3();
    const rotA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI/2);
    const rotB = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -Math.PI/2);
    const restFar = new Float32Array(N * 3);
    for(let i = 0; i < N; i++){
      tmpV.set(restMerged[i*3], restMerged[i*3+1], restMerged[i*3+2]);
      tmpV.applyQuaternion(headArr[i] === 0 ? rotA : rotB);
      tmpV.x += headArr[i] === 0 ? -APART_OFFSET : APART_OFFSET;
      restFar[i*3]   = tmpV.x;
      restFar[i*3+1] = tmpV.y;
      restFar[i*3+2] = tmpV.z;
    }

    geom.setAttribute('position',   new THREE.BufferAttribute(restFar.slice(), 3));
    geom.setAttribute('restFar',    new THREE.BufferAttribute(restFar, 3));
    geom.setAttribute('restMerged', new THREE.BufferAttribute(restMerged, 3));
    geom.setAttribute('seed',       new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('head',       new THREE.BufferAttribute(headArr, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if(xhr.lengthComputable){
      document.getElementById('loading').textContent = `loading · ${(xhr.loaded/xhr.total*100).toFixed(0)}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; });

// Interaction
let targetMix = 0;
let mix = 0;
addEventListener('click', () => {
  targetMix = 1 - targetMix;
  impactTime = performance.now();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  glitchPass.uniforms.uResolution.value.set(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  if(revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2400);
  }

  // auto-oscillate with glitch timing (faster, more erratic)
  const auto = (Math.floor(t / 7) % 2 === 1) ? 1 : 0;
  const desired = targetMix ^ auto;
  mix += (desired - mix) * 0.022;
  uniforms.uMix.value = mix;

  // glitch intensity ramps during transitions
  const transitionSpeed = Math.abs(desired - mix);
  const baseGlitch = 0.2 + transitionSpeed * 3.0;
  // impact burst decays
  const impactDecay = Math.max(0, 1.0 - (now - impactTime) / 800);
  const glitchLevel = Math.min(1.0, baseGlitch + impactDecay * 0.8);

  uniforms.uGlitch.value = glitchLevel;
  glitchPass.uniforms.uTime.value = t;
  glitchPass.uniforms.uGlitchIntensity.value = glitchLevel;
  glitchPass.uniforms.uImpact.value = impactDecay;

  controls.update();
  composer.render();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
