<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7zb · Calder — Playful Balance</title>
<!-- MOTION: suspend, intensity: playful -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1e8; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">7zb</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1e8);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sunLight = new THREE.DirectionalLight(0xfff5e0, 0.4);
sunLight.position.set(5, 8, 3);
scene.add(sunLight);

let seed = 87234;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// Calder's palette — primary colors plus black
const palette = [0xe8202c, 0xfcd116, 0x0066b2, 0x000000];

// Mobile structure — hierarchy of balanced arms
// Each arm has: pivot point, length, angle, weight distribution
class MobileArm {
  constructor(pivot, length, angle, depth, maxDepth) {
    this.pivot = pivot;
    this.length = length;
    this.angle = angle; // rotation around pivot
    this.depth = depth;
    this.tiltPhase = rng() * Math.PI * 2;
    this.swingPhase = rng() * Math.PI * 2;
    this.children = [];
    
    if (depth < maxDepth && rng() > 0.15) {
      // Branch into 2-3 sub-arms
      const numBranches = rng() > 0.6 ? 3 : 2;
      const branchPoints = [];
      
      for (let i = 0; i < numBranches; i++) {
        const t = (i + 0.5) / numBranches;
        const pos = t * 0.7 + 0.15; // 0.15 to 0.85 along arm
        branchPoints.push(pos);
      }
      
      for (let i = 0; i < branchPoints.length; i++) {
        const pos = branchPoints[i];
        const offsetAngle = (i / branchPoints.length) * Math.PI * 2 + rng() * 0.3;
        const branchLen = length * (0.5 + rng() * 0.4);
        const branchPivot = new THREE.Vector3(
          pivot.x + Math.cos(angle) * length * pos,
          pivot.y - length * pos * 0.3,
          pivot.z + Math.sin(angle) * length * pos
        );
        
        this.children.push(new MobileArm(branchPivot, branchLen, offsetAngle, depth + 1, maxDepth));
      }
    } else {
      // Terminal — create shape particle cloud
      this.isTerminal = true;
      this.shapeType = Math.floor(rng() * 4);
      this.color = palette[Math.floor(rng() * palette.length)];
      this.shapeScale = 0.4 + rng() * 0.6;
    }
  }
  
  getEndpoint() {
    return new THREE.Vector3(
      this.pivot.x + Math.cos(this.angle) * this.length,
      this.pivot.y - this.length * 0.3,
      this.pivot.z + Math.sin(this.angle) * this.length
    );
  }
}

// Build mobile from ceiling
const mobileRoot = new MobileArm(new THREE.Vector3(0, 6, 0), 4.5, 0, 0, 4);

// Collect all terminal arms and their positions
const terminals = [];
function collectTerminals(arm) {
  if (arm.isTerminal) {
    terminals.push(arm);
  }
  for (const child of arm.children) {
    collectTerminals(child);
  }
}
collectTerminals(mobileRoot);

// Generate particles for each terminal shape
const MAX_PARTICLES = 80000;
const particlesPerTerminal = Math.floor(MAX_PARTICLES / terminals.length);
const positions = new Float32Array(MAX_PARTICLES * 3);
const colors = new Float32Array(MAX_PARTICLES * 3);
let pIdx = 0;

for (const term of terminals) {
  const endpoint = term.getEndpoint();
  const color = new THREE.Color(term.color);
  const scale = term.shapeScale;
  
  for (let i = 0; i < particlesPerTerminal && pIdx < MAX_PARTICLES; i++) {
    let x, y, z;
    
    switch (term.shapeType) {
      case 0: // Disc
        const discAngle = rng() * Math.PI * 2;
        const discR = Math.sqrt(rng()) * scale * 1.2;
        x = endpoint.x + Math.cos(discAngle) * discR;
        y = endpoint.y + (rng() - 0.5) * 0.08;
        z = endpoint.z + Math.sin(discAngle) * discR;
        break;
      
      case 1: // Sphere
        const theta = Math.acos(2 * rng() - 1);
        const phi = rng() * Math.PI * 2;
        const r = Math.pow(rng(), 0.33) * scale * 0.8;
        x = endpoint.x + r * Math.sin(theta) * Math.cos(phi);
        y = endpoint.y + r * Math.sin(theta) * Math.sin(phi);
        z = endpoint.z + r * Math.cos(theta);
        break;
      
      case 2: // Crescent
        const crescAngle = (rng() * 0.7 + 0.15) * Math.PI * 2;
        const crescR = (0.3 + rng() * 0.7) * scale * 1.1;
        const crescThick = Math.pow(rng(), 2) * 0.15;
        x = endpoint.x + Math.cos(crescAngle) * crescR;
        y = endpoint.y + Math.sin(crescAngle) * crescR + (rng() - 0.5) * crescThick;
        z = endpoint.z + (rng() - 0.5) * crescThick;
        break;
      
      case 3: // Triangle
        const u = rng();
        const v = rng();
        const sqrtU = Math.sqrt(u);
        const triScale = scale * 1.3;
        const p1 = [0, triScale * 0.8];
        const p2 = [-triScale * 0.7, -triScale * 0.5];
        const p3 = [triScale * 0.7, -triScale * 0.5];
        const px = (1 - sqrtU) * p1[0] + sqrtU * (1 - v) * p2[0] + sqrtU * v * p3[0];
        const py = (1 - sqrtU) * p1[1] + sqrtU * (1 - v) * p2[1] + sqrtU * v * p3[1];
        x = endpoint.x + px;
        y = endpoint.y + py;
        z = endpoint.z + (rng() - 0.5) * 0.1;
        break;
    }
    
    positions[pIdx * 3] = x;
    positions[pIdx * 3 + 1] = y;
    positions[pIdx * 3 + 2] = z;
    colors[pIdx * 3] = color.r;
    colors[pIdx * 3 + 1] = color.g;
    colors[pIdx * 3 + 2] = color.b;
    pIdx++;
  }
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMat = new THREE.PointsMaterial({
  size: 0.035,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  sizeAttenuation: true
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// Wire armature (thin black lines)
const wirePositions = [];
function addWireSegment(arm) {
  const start = arm.pivot;
  const end = arm.getEndpoint();
  wirePositions.push(start.x, start.y, start.z);
  wirePositions.push(end.x, end.y, end.z);
  
  for (const child of arm.children) {
    const childStart = child.pivot;
    wirePositions.push(end.x, end.y, end.z);
    wirePositions.push(childStart.x, childStart.y, childStart.z);
    addWireSegment(child);
  }
}
addWireSegment(mobileRoot);

const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.Float32BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, opacity: 0.6, transparent: true });
const wireLines = new THREE.LineSegments(wireGeo, wireMat);
scene.add(wireLines);

// Store base positions for animation
const basePositions = new Float32Array(positions);
const baseWirePositions = new Float32Array(wirePositions);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

// Animation function — subtle breathing, gentle rotation
function animateArm(arm, time, parentTilt = 0, parentSwing = 0) {
  // Each arm has gentle pendulum motion
  const tilt = Math.sin(time * 0.0003 + arm.tiltPhase) * 0.08 * (5 - arm.depth) / 5;
  const swing = Math.sin(time * 0.0004 + arm.swingPhase) * 0.12 * (5 - arm.depth) / 5;
  
  const totalTilt = parentTilt + tilt;
  const totalSwing = parentSwing + swing;
  
  const rotationMatrix = new THREE.Matrix4();
  rotationMatrix.makeRotationY(totalSwing);
  const tiltMatrix = new THREE.Matrix4();
  tiltMatrix.makeRotationZ(totalTilt);
  rotationMatrix.multiply(tiltMatrix);
  
  return { tilt: totalTilt, swing: totalSwing, matrix: rotationMatrix };
}

function updateMobilePositions(arm, time, parentTilt, parentSwing, parentMatrix) {
  const anim = animateArm(arm, time, parentTilt, parentSwing);
  
  // Transform endpoint
  const endpoint = arm.getEndpoint();
  const localEnd = new THREE.Vector3(
    endpoint.x - arm.pivot.x,
    endpoint.y - arm.pivot.y,
    endpoint.z - arm.pivot.z
  );
  localEnd.applyMatrix4(anim.matrix);
  const transformedEnd = new THREE.Vector3(
    arm.pivot.x + localEnd.x,
    arm.pivot.y + localEnd.y,
    arm.pivot.z + localEnd.z
  );
  
  if (arm.isTerminal) {
    return transformedEnd;
  }
  
  const childEnds = [];
  for (const child of arm.children) {
    childEnds.push(updateMobilePositions(child, time, anim.tilt, anim.swing, anim.matrix));
  }
  
  return transformedEnd;
}

function loop(){
  const elapsed = performance.now() - t0;
  
  // Update particle positions based on mobile animation
  let termIdx = 0;
  const posArr = particleGeo.attributes.position.array;
  
  for (const term of terminals) {
    const anim = animateArm(term, elapsed, 0, 0);
    
    for (let i = 0; i < particlesPerTerminal && termIdx * particlesPerTerminal + i < pIdx; i++) {
      const idx = (termIdx * particlesPerTerminal + i) * 3;
      const base = new THREE.Vector3(
        basePositions[idx] - term.pivot.x,
        basePositions[idx + 1] - term.pivot.y,
        basePositions[idx + 2] - term.pivot.z
      );
      base.applyMatrix4(anim.matrix);
      
      posArr[idx] = term.pivot.x + base.x;
      posArr[idx + 1] = term.pivot.y + base.y;
      posArr[idx + 2] = term.pivot.z + base.z;
    }
    termIdx++;
  }
  particleGeo.attributes.position.needsUpdate = true;
  
  // Update wire positions
  let wireIdx = 0;
  const wireArr = wireGeo.attributes.position.array;
  function updateWireArm(arm, parentMatrix) {
    const start = arm.pivot;
    const localEnd = new THREE.Vector3(
      arm.getEndpoint().x - start.x,
      arm.getEndpoint().y - start.y,
      arm.getEndpoint().z - start.z
    );
    const anim = animateArm(arm, elapsed, 0, 0);
    localEnd.applyMatrix4(anim.matrix);
    const end = new THREE.Vector3(start.x + localEnd.x, start.y + localEnd.y, start.z + localEnd.z);
    
    wireArr[wireIdx++] = start.x;
    wireArr[wireIdx++] = start.y;
    wireArr[wireIdx++] = start.z;
    wireArr[wireIdx++] = end.x;
    wireArr[wireIdx++] = end.y;
    wireArr[wireIdx++] = end.z;
    
    for (const child of arm.children) {
      wireArr[wireIdx++] = end.x;
      wireArr[wireIdx++] = end.y;
      wireArr[wireIdx++] = end.z;
      wireArr[wireIdx++] = child.pivot.x;
      wireArr[wireIdx++] = child.pivot.y;
      wireArr[wireIdx++] = child.pivot.z;
      updateWireArm(child, anim.matrix);
    }
  }
  updateWireArm(mobileRoot, new THREE.Matrix4());
  wireGeo.attributes.position.needsUpdate = true;
  
  // Slow camera orbit
  const orbitAngle = elapsed * 0.00008;
  camera.position.x = Math.sin(orbitAngle) * 18;
  camera.position.z = Math.cos(orbitAngle) * 18;
  camera.position.y = 2 + Math.sin(elapsed * 0.00006) * 1.5;
  camera.lookAt(0, 1, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
