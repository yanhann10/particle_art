<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ca8 · deep-time ribbon · mass extinction hyperobject</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1814; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .counter { position:fixed; right:14px; bottom:12px; opacity:0.42; font-size: 10px; 
             letter-spacing: 0.04em; text-align: right; line-height: 1.5; }
  .counter .label { opacity: 0.5; }
</style>
</head>
<body>
<div class="id">ca8</div>
<div class="counter">
  <div><span class="label">geological time:</span> <span id="time">0</span> mya</div>
  <div><span class="label">ribbon segments:</span> <span id="segs">0</span></div>
  <div><span class="label">mass extinctions:</span> <span id="extinctions">0</span></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Timothy Morton DARK ECOLOGY mutation of ajo arabesque ribbon.
// The ribbon traces 541 million years of geological time (Cambrian → present),
// deforming through the five major mass extinctions. Each extinction event
// culls a percentage of the ribbon segments irreversibly. The piece runs at
// 1 million years per 3 seconds — viewer cannot hold the scale, only witness
// the slow erasure. Color shifts from warm Cambrian ochre through dead grey
// at each extinction boundary. No orbit control — camera is fixed, the object
// drifts past on deep-time current. A Morton hyperobject: viscous (sticks to you),
// nonlocal (can't see all at once), phased (appears in traces).

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1814, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 6, 18);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1814, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0x9d8b6f, 0.7);
lightKey.position.set(8, 14, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a2419, 0.4));

// ─────────── geological timeline (mya = million years ago)
// Cambrian explosion: 541 mya → present (0 mya)
// Major mass extinctions (% species lost):
// Ordovician-Silurian: 443 mya (86%)
// Late Devonian: 375 mya (75%)
// Permian-Triassic: 252 mya (96%) — "The Great Dying"
// Triassic-Jurassic: 201 mya (80%)
// Cretaceous-Paleogene: 66 mya (76%)

const EXTINCTIONS = [
  { mya: 443, severity: 0.86, name: 'Ordovician-Silurian' },
  { mya: 375, severity: 0.75, name: 'Late Devonian' },
  { mya: 252, severity: 0.96, name: 'Permian-Triassic' },
  { mya: 201, severity: 0.80, name: 'Triassic-Jurassic' },
  { mya: 66,  severity: 0.76, name: 'Cretaceous-Paleogene' },
];

const START_MYA = 541;
const END_MYA = 0;
const MYA_PER_SEC = 1.0 / 3.0; // 1 million years per 3 seconds

let currentMYA = START_MYA;
let extinctionCount = 0;

// ─────────── ribbon structure
// Build a curve through 3D space that represents geological strata.
// Start with a slowly rising helix that deforms at each extinction boundary.
// Segments can be individually culled (marked dead) and fade to grey-brown.

class RibbonSegment {
  constructor(mya, x, y, z, width) {
    this.mya = mya;
    this.pos = new THREE.Vector3(x, y, z);
    this.width = width;
    this.alive = true;
    this.color = new THREE.Color();
    this.extinctionFade = 0; // 0 = alive color, 1 = dead grey
  }
}

const segments = [];
const N_SEGMENTS = 800;

for (let i = 0; i < N_SEGMENTS; i++) {
  const frac = i / N_SEGMENTS;
  const mya = START_MYA - frac * (START_MYA - END_MYA);
  
  // Helix rising through time
  const theta = frac * Math.PI * 8;
  const radius = 3.5 - frac * 1.2;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const y = frac * 12;
  
  // Width varies with geological period energy
  const width = 0.18 + 0.08 * Math.sin(frac * 22);
  
  segments.push(new RibbonSegment(mya, x, y, z, width));
}

// ─────────── color mapping: warm Cambrian ochre → dead grey
function getColorForMYA(mya, extinctionFade) {
  const frac = 1.0 - (mya / START_MYA); // 0 = ancient, 1 = recent
  
  // Base palette: deep earth tones
  const ancient = new THREE.Color(0x8b6f47); // Cambrian ochre
  const mid = new THREE.Color(0x5c4a33);     // Devonian brown
  const recent = new THREE.Color(0x3d3328);  // Holocene dark earth
  
  let base;
  if (frac < 0.5) {
    base = ancient.clone().lerp(mid, frac * 2);
  } else {
    base = mid.clone().lerp(recent, (frac - 0.5) * 2);
  }
  
  // Extinction fade to dead grey
  const dead = new THREE.Color(0x4a4540);
  return base.lerp(dead, extinctionFade);
}

// ─────────── extinction processor
function processExtinctions() {
  for (const ext of EXTINCTIONS) {
    if (currentMYA <= ext.mya && ext.mya < currentMYA + MYA_PER_SEC * (1/60)) {
      // Extinction event triggered
      extinctionCount++;
      
      // Cull segments near this time period
      for (const seg of segments) {
        if (Math.abs(seg.mya - ext.mya) < 30 && seg.alive) {
          if (Math.random() < ext.severity) {
            seg.alive = false;
            seg.extinctionFade = 0;
          }
        }
      }
    }
  }
  
  // Fade dead segments toward grey over time
  for (const seg of segments) {
    if (!seg.alive && seg.extinctionFade < 1) {
      seg.extinctionFade += 0.008;
    }
  }
}

// ─────────── ribbon mesh builder
let ribbonMesh = null;
const ribbonMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.85,
  metalness: 0.12,
  side: THREE.DoubleSide,
});

function rebuildRibbon() {
  const aliveSegs = segments.filter(s => s.alive);
  if (aliveSegs.length < 2) return;
  
  const positions = [];
  const colors = [];
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);
  
  let vertIndex = 0;
  for (let i = 0; i < aliveSegs.length; i++) {
    const seg = aliveSegs[i];
    const nextSeg = aliveSegs[(i + 1) % aliveSegs.length];
    
    const tangent = new THREE.Vector3().subVectors(nextSeg.pos, seg.pos).normalize();
    let lateral = new THREE.Vector3().crossVectors(tangent, up);
    if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
    lateral.normalize();
    
    const left = seg.pos.clone().addScaledVector(lateral, -seg.width);
    const right = seg.pos.clone().addScaledVector(lateral, seg.width);
    
    const col = getColorForMYA(seg.mya, seg.extinctionFade);
    
    positions.push(left.x, left.y, left.z);
    positions.push(right.x, right.y, right.z);
    colors.push(col.r, col.g, col.b);
    colors.push(col.r, col.g, col.b);
    
    if (i < aliveSegs.length - 1) {
      const a = vertIndex;
      const b = vertIndex + 1;
      const c = vertIndex + 2;
      const d = vertIndex + 3;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
    
    vertIndex += 2;
  }
  
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  
  if (ribbonMesh) {
    scene.remove(ribbonMesh);
    ribbonMesh.geometry.dispose();
  }
  ribbonMesh = new THREE.Mesh(g, ribbonMat);
  scene.add(ribbonMesh);
}

rebuildRibbon();

// ─────────── deep-time drift
// The ribbon slowly rotates and translates as if suspended in geological current
const ribbonGroup = new THREE.Group();
scene.add(ribbonGroup);
if (ribbonMesh) {
  scene.remove(ribbonMesh);
  ribbonGroup.add(ribbonMesh);
}

// ─────────── counter updates
const timeEl = document.getElementById('time');
const segsEl = document.getElementById('segs');
const extEl = document.getElementById('extinctions');

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastRebuild = 0;

function loop() {
  const elapsed = (performance.now() - start) / 1000;
  
  // Advance geological time
  currentMYA = START_MYA - elapsed * MYA_PER_SEC;
  if (currentMYA < END_MYA) currentMYA = END_MYA;
  
  processExtinctions();
  
  // Rebuild ribbon every 0.5 seconds to update colors and culled segments
  if (elapsed - lastRebuild > 0.5) {
    rebuildRibbon();
    if (ribbonMesh) {
      ribbonGroup.children.length = 0;
      ribbonGroup.add(ribbonMesh);
    }
    lastRebuild = elapsed;
  }
  
  // Deep-time drift: slow rotation and vertical oscillation
  ribbonGroup.rotation.y = elapsed * 0.03;
  ribbonGroup.position.y = Math.sin(elapsed * 0.08) * 0.4;
  
  // Update counters
  timeEl.textContent = Math.max(0, currentMYA).toFixed(1);
  segsEl.textContent = segments.filter(s => s.alive).length;
  extEl.textContent = extinctionCount;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
