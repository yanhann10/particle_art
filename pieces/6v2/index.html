<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6v2 · living archive coral latent</title>
<!-- MOTION: morph, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#041618; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; color:#7dd3d8; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #0a2a2c; color:#7dd3d8; border:1px solid #1a4a4c;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#153a3c; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · ambient audio</button>
<div class="id">6v2</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a2c32, 0.028);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(-12, 8, 18);
camera.lookAt(0, 2, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x041618, 1);
document.body.appendChild(renderer.domElement);

// substrate plane with caustic-like vertex displacement
const subGeo = new THREE.PlaneGeometry(60, 60, 80, 80);
subGeo.rotateX(-Math.PI/2);
const subMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uAudioLow: { value: 0 }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uAudioLow;
    varying vec3 vPos;
    varying float vWave;
    void main(){
      vec3 p = position;
      float w1 = sin(p.x * 0.12 + uTime * 0.3) * cos(p.z * 0.1 + uTime * 0.25);
      float w2 = sin(p.x * 0.08 - uTime * 0.2) * sin(p.z * 0.14 + uTime * 0.35);
      float wave = (w1 + w2) * 0.4 * (1.0 + uAudioLow * 0.6);
      p.y += wave;
      vWave = wave;
      vPos = p;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vPos;
    varying float vWave;
    void main(){
      float d = length(vPos.xz);
      vec3 sand = vec3(0.15, 0.22, 0.24);
      vec3 teal = vec3(0.08, 0.28, 0.32);
      vec3 col = mix(sand, teal, smoothstep(0.0, 30.0, d));
      col += vec3(0.02, 0.06, 0.08) * (vWave * 0.5 + 0.5);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const substrate = new THREE.Mesh(subGeo, subMat);
scene.add(substrate);

// 4 coral archetypes: tube, branching, plate, brain
// each archetype is a procedural THREE.BufferGeometry
function makeTube(){
  const g = new THREE.CylinderGeometry(0.3, 0.4, 2.5, 8, 6, true);
  g.translate(0, 1.25, 0);
  return g;
}
function makeBranching(){
  const g = new THREE.BufferGeometry();
  const verts = [];
  const N = 12;
  for (let i = 0; i < N; i++){
    const t = i / (N-1);
    const angle = t * Math.PI * 4 + Math.sin(t*9)*0.8;
    const r = 0.3 + t * 0.7;
    verts.push(Math.cos(angle)*r, t*3, Math.sin(angle)*r);
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  return g;
}
function makePlate(){
  const g = new THREE.CylinderGeometry(1.2, 0.6, 0.3, 10, 1, false);
  g.translate(0, 1.5, 0);
  return g;
}
function makeBrain(){
  const g = new THREE.IcosahedronGeometry(0.8, 2);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n = Math.sin(x*5) * Math.cos(z*5) * 0.15;
    pos.setXYZ(i, x + n*x, y + n*y, z + n*z);
  }
  g.translate(0, 1.2, 0);
  return g;
}

const archetypes = [makeTube(), makeBranching(), makePlate(), makeBrain()];

// cluster positions on substrate
const COLONIES = 24;
const coralData = [];
for (let i = 0; i < COLONIES; i++){
  const angle = (i / COLONIES) * Math.PI * 2 + Math.random()*0.8;
  const radius = 4 + Math.random()*10;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const archetype = Math.floor(Math.random()*4);
  coralData.push({
    x, z,
    archetype,
    seed: Math.random(),
    morphPhase: Math.random() * Math.PI * 2,
    scaleBase: 0.7 + Math.random()*0.8
  });
}

// instanced mesh per archetype
const meshes = archetypes.map((geo, idx) => {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uAudioLow: { value: 0 },
      uMorphFactor: { value: 0 }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uAudioLow;
      uniform float uMorphFactor;
      varying vec3 vNormal;
      varying vec3 vPos;
      varying float vMorph;
      
      attribute vec3 instancePosition;
      attribute float instanceSeed;
      attribute float instanceMorphPhase;
      attribute float instanceScaleBase;
      
      void main(){
        vNormal = normalize(normalMatrix * normal);
        float phase = instanceMorphPhase + uTime * 0.15 * (1.0 + uAudioLow * 0.8);
        float morph = (sin(phase) * 0.5 + 0.5) * uMorphFactor;
        vMorph = morph;
        
        vec3 p = position;
        // species morph: distort geometry via latent drift
        float nx = sin(p.x * 3.0 + phase) * 0.15 * morph;
        float ny = cos(p.y * 2.5 + phase * 1.3) * 0.12 * morph;
        float nz = sin(p.z * 3.2 - phase * 0.9) * 0.14 * morph;
        p += vec3(nx, ny, nz);
        
        float s = instanceScaleBase * (1.0 + sin(uTime * 0.5 + instanceSeed * 6.28) * 0.15);
        p *= s;
        p += instancePosition;
        vPos = p;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec3 vNormal;
      varying vec3 vPos;
      varying float vMorph;
      
      void main(){
        // subsurface scattering approximation
        vec3 lightDir = normalize(vec3(0.4, 1.0, 0.3));
        float ndl = max(0.0, dot(vNormal, lightDir));
        float backlight = max(0.0, dot(vNormal, -lightDir)) * 0.6;
        float sss = backlight + ndl * 0.7;
        
        // palette: coral pink, turquoise, lime kelp
        vec3 coral = vec3(0.95, 0.45, 0.38);
        vec3 turq = vec3(0.25, 0.82, 0.75);
        vec3 lime = vec3(0.62, 0.88, 0.32);
        
        float k = vMorph;
        vec3 base = mix(coral, turq, k);
        base = mix(base, lime, k * k * 0.6);
        
        vec3 col = base * (0.5 + sss * 0.9);
        col += vec3(0.15, 0.25, 0.22) * pow(1.0 - abs(dot(vNormal, vec3(0,0,1))), 2.0);
        
        gl_FragColor = vec4(col, 1.0);
      }
    `
  });
  
  const count = coralData.filter(c => c.archetype === idx).length;
  const m = new THREE.InstancedMesh(geo, mat, count);
  const dummy = new THREE.Object3D();
  let j = 0;
  coralData.forEach(c => {
    if (c.archetype === idx){
      dummy.position.set(c.x, 0, c.z);
      dummy.rotation.y = c.seed * Math.PI * 2;
      dummy.updateMatrix();
      m.setMatrixAt(j, dummy.matrix);
      j++;
    }
  });
  m.instanceMatrix.needsUpdate = true;
  
  // add per-instance attributes
  const instancePosition = new Float32Array(count * 3);
  const instanceSeed = new Float32Array(count);
  const instanceMorphPhase = new Float32Array(count);
  const instanceScaleBase = new Float32Array(count);
  j = 0;
  coralData.forEach(c => {
    if (c.archetype === idx){
      instancePosition[j*3] = c.x;
      instancePosition[j*3+1] = 0;
      instancePosition[j*3+2] = c.z;
      instanceSeed[j] = c.seed;
      instanceMorphPhase[j] = c.morphPhase;
      instanceScaleBase[j] = c.scaleBase;
      j++;
    }
  });
  geo.setAttribute('instancePosition', new THREE.InstancedBufferAttribute(instancePosition, 3));
  geo.setAttribute('instanceSeed', new THREE.InstancedBufferAttribute(instanceSeed, 1));
  geo.setAttribute('instanceMorphPhase', new THREE.InstancedBufferAttribute(instanceMorphPhase, 1));
  geo.setAttribute('instanceScaleBase', new THREE.InstancedBufferAttribute(instanceScaleBase, 1));
  
  return m;
});
meshes.forEach(m => scene.add(m));

// plankton particles drifting in front
const planktonCount = 800;
const planktonGeo = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonSeeds = new Float32Array(planktonCount);
for (let i = 0; i < planktonCount; i++){
  planktonPos[i*3] = (Math.random()-0.5)*40;
  planktonPos[i*3+1] = Math.random()*12 - 2;
  planktonPos[i*3+2] = (Math.random()-0.5)*40;
  planktonSeeds[i] = Math.random();
}
planktonGeo.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
planktonGeo.setAttribute('seed', new THREE.BufferAttribute(planktonSeeds, 1));

const planktonMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() },
    uAudioHigh: { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uAudioHigh;
    attribute float seed;
    varying float vBright;
    void main(){
      vec3 p = position;
      float drift = uTime * (0.2 + seed * 0.3);
      p.x += sin(drift + seed * 6.28) * 2.0;
      p.y += cos(drift * 1.3 + seed * 3.0) * 1.5;
      p.z += sin(drift * 0.9 - seed * 4.0) * 2.0;
      
      vBright = 0.6 + 0.4 * sin(uTime * 3.0 + seed * 12.0);
      vBright *= (1.0 + uAudioHigh * 0.5);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + seed * 0.8) * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vBright;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vBright * 0.6;
      vec3 col = vec3(0.85, 0.95, 0.92);
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const plankton = new THREE.Points(planktonGeo, planktonMat);
scene.add(plankton);

// light
const ambient = new THREE.AmbientLight(0x5599aa, 0.4);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0x88ddcc, 0.9);
dirLight.position.set(4, 10, 6);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x44aa99, 0.3);
backLight.position.set(-3, 2, -5);
scene.add(backLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · latent coral morph';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  
  let audioLow = 0, audioHigh = 0;
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    audioLow = bandEnergy(freqData, 0, Math.floor(n*0.15));
    audioHigh = bandEnergy(freqData, Math.floor(n*0.6), n);
  } else {
    audioLow = 0.25 + 0.2 * Math.sin(t * 0.6);
    audioHigh = 0.15 + 0.15 * Math.sin(t * 1.8);
  }
  
  subMat.uniforms.uTime.value = t;
  subMat.uniforms.uAudioLow.value = audioLow;
  
  meshes.forEach(m => {
    m.material.uniforms.uTime.value = t;
    m.material.uniforms.uAudioLow.value = audioLow;
    m.material.uniforms.uMorphFactor.value = 0.6 + audioLow * 0.4;
  });
  
  planktonMat.uniforms.uTime.value = t;
  planktonMat.uniforms.uAudioHigh.value = audioHigh;
  
  // slow camera orbit
  const orbitRadius = 18;
  camera.position.x = Math.cos(t * 0.08) * orbitRadius;
  camera.position.z = Math.sin(t * 0.08) * orbitRadius;
  camera.position.y = 8 + Math.sin(t * 0.12) * 2;
  camera.lookAt(0, 2, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
