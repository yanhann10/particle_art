<div class="id">e6e</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── KOMOREBI: sunlight filtering through leaves
// Morph parent's vertical streamline lanes into DAPPLED LIGHT COLUMNS.
// Each lane now has particles that pulse with light intensity (shadows moving as leaves sway).
// Palette shifts to forest greens + golden sunbeams. Particle sizes vary rapidly (light flickering).
// Background darkens to forest floor. Lanes become visible as shafts of light, not paint strokes.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e08);  // dark forest floor
const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const LANES = 8;
const PARTICLES_PER_LANE = 8750;
const N = LANES * PARTICLES_PER_LANE;

// flow curves from parent (vertical dominance preserved)
const flowCurves = [
  (t) => new THREE.Vector3(-8.5 + 0.6 * Math.sin(t * Math.PI * 2), -9 + t * 18, 0),
  (t) => new THREE.Vector3(-6.2 + 0.3 * Math.sin(t * Math.PI * 4.5), -9 + t * 18, 0),
  (t) => new THREE.Vector3(-4.0 + 1.2 * Math.sin(t * Math.PI), -9 + t * 18, 0),
  (t) => new THREE.Vector3(-1.8 + 0.8 * Math.sin(t * Math.PI * 5), -9 + t * 18, 0),
  (t) => new THREE.Vector3(0.5 - 1.0 * Math.cos(t * Math.PI), -9 + t * 18, 0),
  (t) => new THREE.Vector3(2.8 + 1.4 * (Math.sin(t * Math.PI * 1.5) - 0.3 * t), -9 + t * 18, 0),
  (t) => new THREE.Vector3(5.0 + 0.5 * Math.cos(t * Math.PI * 3), -9 + t * 18, 0),
  (t) => new THREE.Vector3(7.5, -9 + t * 18, 0),
];

// KOMOREBI palette: shadow greens → sunbeam gold, each lane has intensity variance
const lanePalettes = [
  // deep shadow
  { shadow: new THREE.Color(0.08, 0.12, 0.08), light: new THREE.Color(0.85, 0.78, 0.42), intensity: 0.3 },
  // filtered green
  { shadow: new THREE.Color(0.12, 0.18, 0.10), light: new THREE.Color(0.92, 0.88, 0.52), intensity: 0.6 },
  // bright shaft
  { shadow: new THREE.Color(0.15, 0.22, 0.12), light: new THREE.Color(0.98, 0.95, 0.68), intensity: 0.85 },
  // mid green-gold
  { shadow: new THREE.Color(0.10, 0.16, 0.08), light: new THREE.Color(0.88, 0.82, 0.48), intensity: 0.5 },
  // strongest beam (center)
  { shadow: new THREE.Color(0.18, 0.25, 0.15), light: new THREE.Color(1.0, 0.98, 0.75), intensity: 0.95 },
  // dappled medium
  { shadow: new THREE.Color(0.12, 0.18, 0.11), light: new THREE.Color(0.90, 0.85, 0.55), intensity: 0.65 },
  // soft glow
  { shadow: new THREE.Color(0.14, 0.20, 0.13), light: new THREE.Color(0.94, 0.90, 0.62), intensity: 0.7 },
  // edge shadow
  { shadow: new THREE.Color(0.06, 0.10, 0.06), light: new THREE.Color(0.80, 0.72, 0.38), intensity: 0.35 },
];

const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const progress = new Float32Array(N);
const speeds = new Float32Array(N);
const phases = new Float32Array(N);  // individual flicker phase
const baseSizes = new Float32Array(N);  // store base size for pulsing

let idx = 0;
for (let lane = 0; lane < LANES; lane++) {
  const pal = lanePalettes[lane];
  const curve = flowCurves[lane];
  
  for (let i = 0; i < PARTICLES_PER_LANE; i++) {
    const t0 = 0.15 + Math.pow(Math.random(), 1.5) * 0.70;
    progress[idx] = t0;
    speeds[idx] = 0.004 + Math.random() * 0.008;  // slower drift (light is more static)
    phases[idx] = Math.random() * Math.PI * 2;  // unique flicker phase
    
    const p = curve(t0);
    const perpOffset = (Math.random() - 0.5) * 0.40;
    const dx = curve(Math.min(t0 + 0.01, 1)).x - p.x;
    const dy = curve(Math.min(t0 + 0.01, 1)).y - p.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    const perpX = -dy / len * perpOffset;
    const perpY =  dx / len * perpOffset;
    
    positions[idx * 3]     = p.x + perpX;
    positions[idx * 3 + 1] = p.y + perpY;
    positions[idx * 3 + 2] = 0;
    
    // color: shadow to light based on lane intensity + vertical gradient (light stronger at top)
    const verticalGrad = Math.pow(t0, 0.5);  // brighter toward top (sky)
    const colorMix = pal.intensity * verticalGrad * 0.7 + Math.random() * 0.3;
    const col = pal.shadow.clone().lerp(pal.light, colorMix);
    colors[idx * 3]     = col.r;
    colors[idx * 3 + 1] = col.g;
    colors[idx * 3 + 2] = col.b;
    
    // base size: brighter particles (closer to light shaft center) are larger
    const centerDist = Math.abs(perpOffset);
    baseSizes[idx] = (2.8 - centerDist * 2.0) * (0.5 + Math.random() * 0.8);
    sizes[idx] = baseSizes[idx];
    
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: { 
    uPixel: { value: renderer.getPixelRatio() },
    uTime: { value: 0 }
  },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,  // light beams are additive
  vertexShader: `
    uniform float uPixel;
    attribute float size;
    varying vec3 vColor;
    varying float vSize;
    void main() {
      vColor = color;
      vSize = size;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPixel * 10.0;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vSize;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      // soft glow (light particle, not solid disc)
      float core = smoothstep(0.5, 0.1, r);
      float glow = exp(-r * 6.0) * 0.6;
      float alpha = core + glow;
      if (alpha < 0.01) discard;
      // brightness increases toward center (hotspot)
      vec3 finalColor = vColor * (1.0 + core * 0.4);
      gl_FragColor = vec4(finalColor, alpha * 0.85);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── animation: light flickers as leaves sway overhead
let time = 0;
function animate() {
  time += 0.016;
  mat.uniforms.uTime.value = time;
  
  const posArr = geom.attributes.position.array;
  const sizeArr = geom.attributes.size.array;
  
  for (let lane = 0; lane < LANES; lane++) {
    const curve = flowCurves[lane];
    const start = lane * PARTICLES_PER_LANE;
    const end = start + PARTICLES_PER_LANE;
    const laneIntensity = lanePalettes[lane].intensity;
    
    // global leaf-sway: each lane pulses at different rate
    const laneSway = Math.sin(time * (0.6 + lane * 0.15)) * 0.5 + 0.5;
    
    for (let i = start; i < end; i++) {
      progress[i] += speeds[i];
      if (progress[i] > 1.0) progress[i] -= 1.0;
      
      const p = curve(progress[i]);
      const seed = i / N;
      const perpOffset = (seed - 0.5) * 0.40;
      const t0 = progress[i];
      const dx = curve(Math.min(t0 + 0.01, 1)).x - p.x;
      const dy = curve(Math.min(t0 + 0.01, 1)).y - p.y;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const perpX = -dy / len * perpOffset;
      const perpY =  dx / len * perpOffset;
      
      posArr[i * 3]     = p.x + perpX;
      posArr[i * 3 + 1] = p.y + perpY;
      posArr[i * 3 + 2] = 0;
      
      // KOMOREBI FLICKER: size pulses with individual phase + global sway
      const flicker = Math.sin(time * 3.0 + phases[i]) * 0.3 + 0.7;
      const intensity = laneIntensity * laneSway * flicker;
      sizeArr[i] = baseSizes[i] * (0.5 + intensity * 0.8);
    }
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.size.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const h = 10;
  const w = h * aspect;
  camera.left = -w;
  camera.right = w;
  camera.top = h;
  camera.bottom = -h;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

{
  const aspect = innerWidth / innerHeight;
  const h = 10;
  const w = h * aspect;
  camera.left = -w;
  camera.right = w;
  camera.top = h;
  camera.bottom = -h;
  camera.updateProjectionMatrix();
}

animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
