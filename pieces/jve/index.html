<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jve · geometric ink · hard-edge calligraphy</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">jve</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Manolo Gamboa Naon — geometric abstraction, no randomness in motion.
// The brushstroke is now a SEQUENCE of hard-edged geometric shapes:
// triangles, hexagons, rings, half-circles, stacked in deliberate visual
// hierarchy. 3-5 flat colors, no gradients. The growth is DETERMINISTIC
// placement along a computed spline.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 12, 18);
camera.lookAt(0, 6, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Color palette — Manolo Gamboa Naon: flat, poster-like, limited
const PALETTE = [
  0xe8dcc0,  // warm cream
  0xd4483b,  // rust red
  0x2a4a6b,  // deep blue
  0xf2a74b,  // amber
  0x1a1a22,  // near-black accent
];

// Generate deterministic spline — no noise, just mathematical curves
const SPLINE_POINTS = [];
const SEGMENTS = 48;
for (let i = 0; i < SEGMENTS; i++){
  const t = i / SEGMENTS;
  // Lissajous-like 3D curve for deterministic elegance
  const theta = t * Math.PI * 4;
  const phi = t * Math.PI * 2.4;
  const r = 2.5;
  const x = r * Math.cos(theta) * (0.5 + 0.5 * Math.sin(phi * 0.7));
  const y = t * 16;  // upward growth
  const z = r * Math.sin(theta) * (0.5 + 0.5 * Math.cos(phi * 0.5));
  SPLINE_POINTS.push(new THREE.Vector3(x, y, z));
}
const curve = new THREE.CatmullRomCurve3(SPLINE_POINTS, false, 'catmullrom', 0.3);

// Geometric primitive library
function createTriangle(size, color){
  const shape = new THREE.Shape();
  const h = size * Math.sqrt(3) / 2;
  shape.moveTo(0, h * 0.66);
  shape.lineTo(-size/2, -h * 0.33);
  shape.lineTo(size/2, -h * 0.33);
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createHexagon(size, color){
  const shape = new THREE.Shape();
  for (let i = 0; i < 6; i++){
    const angle = (i / 6) * Math.PI * 2;
    const x = Math.cos(angle) * size;
    const y = Math.sin(angle) * size;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createRing(outerR, innerR, color){
  const shape = new THREE.Shape();
  for (let i = 0; i <= 32; i++){
    const angle = (i / 32) * Math.PI * 2;
    const x = Math.cos(angle) * outerR;
    const y = Math.sin(angle) * outerR;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  const hole = new THREE.Path();
  for (let i = 0; i <= 32; i++){
    const angle = (i / 32) * Math.PI * 2;
    const x = Math.cos(angle) * innerR;
    const y = Math.sin(angle) * innerR;
    if (i === 0) hole.moveTo(x, y);
    else hole.lineTo(x, y);
  }
  shape.holes.push(hole);
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createHalfCircle(radius, color){
  const shape = new THREE.Shape();
  shape.moveTo(-radius, 0);
  shape.absarc(0, 0, radius, Math.PI, 0, true);
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createRectangle(w, h, color){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, -h/2);
  shape.lineTo(w/2, -h/2);
  shape.lineTo(w/2, h/2);
  shape.lineTo(-w/2, h/2);
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

// Deterministic shape sequence — no randomness
const SHAPE_SEQUENCE = [
  { type: 'triangle', size: 0.8, color: PALETTE[0] },
  { type: 'hexagon', size: 0.5, color: PALETTE[1] },
  { type: 'ring', outerR: 0.7, innerR: 0.4, color: PALETTE[2] },
  { type: 'halfCircle', radius: 0.6, color: PALETTE[3] },
  { type: 'rectangle', w: 1.2, h: 0.4, color: PALETTE[0] },
  { type: 'triangle', size: 0.6, color: PALETTE[4] },
  { type: 'hexagon', size: 0.7, color: PALETTE[3] },
  { type: 'ring', outerR: 0.9, innerR: 0.5, color: PALETTE[1] },
  { type: 'halfCircle', radius: 0.5, color: PALETTE[0] },
  { type: 'rectangle', w: 0.8, h: 0.6, color: PALETTE[2] },
  { type: 'triangle', size: 0.9, color: PALETTE[1] },
  { type: 'hexagon', size: 0.4, color: PALETTE[0] },
];

const shapes = [];
let shapeIndex = 0;
const MAX_SHAPES = 80;

function addShape(){
  if (shapes.length >= MAX_SHAPES) return;
  
  const t = shapes.length / MAX_SHAPES;
  const pos = curve.getPointAt(t);
  const tangent = curve.getTangentAt(t);
  
  const spec = SHAPE_SEQUENCE[shapeIndex % SHAPE_SEQUENCE.length];
  shapeIndex++;
  
  let mesh;
  switch(spec.type){
    case 'triangle':
      mesh = createTriangle(spec.size, spec.color);
      break;
    case 'hexagon':
      mesh = createHexagon(spec.size, spec.color);
      break;
    case 'ring':
      mesh = createRing(spec.outerR, spec.innerR, spec.color);
      break;
    case 'halfCircle':
      mesh = createHalfCircle(spec.radius, spec.color);
      break;
    case 'rectangle':
      mesh = createRectangle(spec.w, spec.h, spec.color);
      break;
  }
  
  mesh.position.copy(pos);
  
  // Orient shape to tangent — billboard perpendicular to curve
  const up = new THREE.Vector3(0, 1, 0);
  const right = new THREE.Vector3().crossVectors(tangent, up).normalize();
  const localUp = new THREE.Vector3().crossVectors(right, tangent).normalize();
  const matrix = new THREE.Matrix4();
  matrix.makeBasis(right, localUp, tangent);
  mesh.rotation.setFromRotationMatrix(matrix);
  
  // Deterministic rotation offset based on position in sequence
  const rotOffset = (shapes.length * 0.618) * Math.PI * 2;  // golden angle
  mesh.rotateZ(rotOffset);
  
  scene.add(mesh);
  shapes.push({ mesh, t });
}

// Build initial composition
for (let i = 0; i < 60; i++){
  addShape();
}

// Camera tracking
let cameraT = 0;
function updateCamera(){
  cameraT += 0.0008;
  if (cameraT > 1) cameraT = 1;
  
  const lookPoint = curve.getPointAt(Math.min(cameraT + 0.3, 1.0));
  camera.lookAt(lookPoint.x, lookPoint.y, lookPoint.z);
  
  // Orbit deterministically around the form
  const angle = performance.now() * 0.00008;
  const radius = 18;
  camera.position.x = Math.cos(angle) * radius;
  camera.position.z = Math.sin(angle) * radius;
  camera.position.y = lookPoint.y + 6;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let frameCount = 0;
function loop(){
  frameCount++;
  
  // Slow deterministic growth
  if (frameCount % 12 === 0){
    addShape();
  }
  
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
