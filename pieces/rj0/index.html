<title>rj0 · semiotic collapse</title>
<style>

  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;

<div class="id">rj0</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ── Sasha Stiles · Semiotic Collapse ──────────────────────────
   Aizawa attractor particles rendered as glyphs that evolve
   through alphabetic systems over 90 seconds:
   Latin → Arabic → Devanagari → CJK → geometric primitives → noise → Latin
   Each script uses its own texture atlas; GPGPU shader lerps between
   atlas indices. The full cycle is one translation — language
   collapsing into symbol, then back to word.
   ───────────────────────────────────────────────────────────── */

const W = 160, H = 160;
const N = W * H;

const CYCLE_DURATION = 90.0; // seconds for full alphabet cycle

/* ── Build 6 glyph atlases ── */
const ACOLS = 10, AROWS = 6, CELL = 64;
const NUM_ATLASES = 6;

const scripts = [
  // Latin
  ['W','O','R','D','S','B','E','Y','O','N',
   'T','E','C','H','N','E','L','E','G','Y',
   'C','U','R','S','I','V','E','B','I','N',
   'M','E','M','O','R','Y','C','O','D','E',
   'L','A','N','G','U','A','G','E','P','O',
   'E','M','S','D','R','E','A','M','0','1'],
  // Arabic (simplified selection)
  ['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر',
   'ز','س','ش','ص','ض','ط','ظ','ع','غ','ف',
   'ق','ك','ل','م','ن','ه','و','ي','ء','ى',
   'ة','آ','أ','إ','ؤ','ئ','ً','ٌ','ٍ','َ',
   'ُ','ِ','ّ','ْ','٠','١','٢','٣','٤','٥'],
  // Devanagari
  ['अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ',
   'औ','क','ख','ग','घ','च','छ','ज','झ','ञ',
   'ट','ठ','ड','ढ','ण','त','थ','द','ध','न',
   'प','फ','ब','भ','म','य','र','ल','व','श',
   'ष','स','ह','ा','ि','ी','ु','ू','े','ै'],
  // CJK
  ['語','言','文','字','詩','夢','記','憶','碼','道',
   '心','光','影','風','雨','火','水','土','金','木',
   '天','地','人','思','想','意','識','知','學','問',
   '書','讀','寫','說','聽','見','看','感','覺','理',
   '真','美','善','愛','和','平','靜','動','生','死'],
  // Geometric primitives
  ['△','○','□','◇','◎','◐','◑','◒','◓','◔',
   '◕','◖','◗','◘','◙','◚','◛','◜','◝','◞',
   '◟','◠','◡','◢','◣','◤','◥','◦','◧','◨',
   '◩','◪','◫','◬','◭','◮','◯','◰','◱','◲',
   '◳','◴','◵','◶','◷','◸','◹','◺','◻','◼'],
  // Pure noise (will be generated procedurally)
  []
];

const atlasTextures = [];

for (let s = 0; s < NUM_ATLASES; s++) {
  const aC = document.createElement('canvas');
  aC.width = ACOLS * CELL;
  aC.height = AROWS * CELL;
  const ax = aC.getContext('2d');
  
  ax.fillStyle = '#000';
  ax.fillRect(0, 0, aC.width, aC.height);
  
  if (s === 5) {
    // Noise atlas — random pixel clusters
    for (let r = 0; r < AROWS; r++) {
      for (let c = 0; c < ACOLS; c++) {
        const cx = c * CELL + CELL / 2;
        const cy = r * CELL + CELL / 2;
        for (let i = 0; i < 80; i++) {
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.random() * CELL * 0.35;
          const px = cx + Math.cos(ang) * rad;
          const py = cy + Math.sin(ang) * rad;
          const sz = 1 + Math.random() * 2;
          ax.fillStyle = `rgba(255,255,255,${0.6 + Math.random() * 0.4})`;
          ax.fillRect(px, py, sz, sz);
        }
      }
    }
  } else {
    ax.textAlign = 'center';
    ax.textBaseline = 'middle';
    const fontSz = s === 1 ? CELL * 0.68 : s === 2 ? CELL * 0.62 : s === 3 ? CELL * 0.70 : CELL * 0.72;
    ax.font = `bold ${fontSz}px ${s === 1 ? 'Arial' : s === 2 ? 'Noto Sans Devanagari, Arial' : s === 3 ? 'Noto Sans CJK, Arial' : 'ui-monospace, SF Mono, Menlo, monospace'}`;
    
    for (let r = 0; r < AROWS; r++) {
      for (let c = 0; c < ACOLS; c++) {
        const i = r * ACOLS + c;
        const glyph = scripts[s][i] || (s === 4 ? '○' : '·');
        const w = 0.75 + Math.sin(i * 5.7) * 0.25;
        ax.fillStyle = `rgba(255,255,255,${w})`;
        ax.fillText(glyph, c * CELL + CELL / 2, r * CELL + CELL / 2);
      }
    }
  }
  
  const tex = new THREE.CanvasTexture(aC);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  atlasTextures.push(tex);
}

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

/* ── GPGPU ── */
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camO = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitS = new THREE.Scene();
blitS.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitS, camO);
renderer.setRenderTarget(null);

const simU = {
  prev: { value: rtA.texture },
  uDt: { value: 0.006 },
  uA: { value: 0.95 }, uB: { value: 0.70 },
  uC: { value: 0.60 }, uD: { value: 3.50 },
  uE: { value: 0.25 }, uF: { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz; float age = s.w;
      vec3 dp = vec3(
        (p.z - uB)*p.x - uD*p.y,
        uD*p.x + (p.z - uB)*p.y,
        uC + uA*p.z - p.z*p.z*p.z/3.
          - (p.x*p.x + p.y*p.y)*(1. + uE*p.z)
          + uF*p.z*p.x*p.x*p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.03, 1.);
      gl_FragColor = vec4(p, age);
    }`
});
const simS = new THREE.Scene();
simS.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ── Point rendering ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0, 0, 5.8);

const geom = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
const aGlyph = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdx[i * 2]     = (x + 0.5) / W;
  uvIdx[i * 2 + 1] = (y + 0.5) / H;
  aGlyph[i] = Math.floor(Math.random() * ACOLS * AROWS);
}
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geom.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdx, 2));
geom.setAttribute('aGlyph', new THREE.BufferAttribute(aGlyph, 1));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    state:     { value: rtB.texture },
    uAtlas0:   { value: atlasTextures[0] },
    uAtlas1:   { value: atlasTextures[1] },
    uAtlas2:   { value: atlasTextures[2] },
    uAtlas3:   { value: atlasTextures[3] },
    uAtlas4:   { value: atlasTextures[4] },
    uAtlas5:   { value: atlasTextures[5] },
    uTime:     { value: 0 },
    uPx:       { value: renderer.getPixelRatio() },
    uACols:    { value: ACOLS },
    uARows:    { value: AROWS },
    uCycleProg: { value: 0.0 }
  },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPx, uTime;
    attribute vec2 uvIdx;
    attribute float aGlyph;
    varying float vAge;
    varying float vGlyphIdx;
    varying float vDepth;
    varying vec2 vPC;

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vGlyphIdx = aGlyph;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      gl_PointSize = 5.2 * uPx * (11.0 / max(vDepth, 0.6));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uAtlas0, uAtlas1, uAtlas2, uAtlas3, uAtlas4, uAtlas5;
    uniform float uACols, uARows, uTime, uCycleProg;
    varying float vAge, vGlyphIdx, vDepth;

    void main(){
      vec2 pc = gl_PointCoord;

      float idx = vGlyphIdx;
      float c = mod(idx, uACols);
      float r = floor(idx / uACols);
      vec2 atlasUV = vec2((c + pc.x) / uACols, (r + pc.y) / uARows);

      /* cycle through 6 stages: 0→1→2→3→4→5→0 */
      float stage = uCycleProg * 6.0;
      int stageA = int(floor(stage));
      int stageB = int(mod(floor(stage) + 1.0, 6.0));
      float blend = fract(stage);

      float gA, gB;
      if (stageA == 0) gA = texture2D(uAtlas0, atlasUV).r;
      else if (stageA == 1) gA = texture2D(uAtlas1, atlasUV).r;
      else if (stageA == 2) gA = texture2D(uAtlas2, atlasUV).r;
      else if (stageA == 3) gA = texture2D(uAtlas3, atlasUV).r;
      else if (stageA == 4) gA = texture2D(uAtlas4, atlasUV).r;
      else gA = texture2D(uAtlas5, atlasUV).r;

      if (stageB == 0) gB = texture2D(uAtlas0, atlasUV).r;
      else if (stageB == 1) gB = texture2D(uAtlas1, atlasUV).r;
      else if (stageB == 2) gB = texture2D(uAtlas2, atlasUV).r;
      else if (stageB == 3) gB = texture2D(uAtlas3, atlasUV).r;
      else if (stageB == 4) gB = texture2D(uAtlas4, atlasUV).r;
      else gB = texture2D(uAtlas5, atlasUV).r;

      float g = mix(gA, gB, blend);

      /* palette — shift through spectrum as cycle progresses */
      vec3 cream  = vec3(0.92, 0.86, 0.76);
      vec3 amber  = vec3(0.88, 0.72, 0.52);
      vec3 ochre  = vec3(0.82, 0.68, 0.44);
      vec3 rust   = vec3(0.76, 0.54, 0.38);
      vec3 steel  = vec3(0.62, 0.68, 0.78);
      vec3 slate  = vec3(0.52, 0.58, 0.66);

      vec3 col;
      if (stage < 1.0) col = mix(cream, amber, stage);
      else if (stage < 2.0) col = mix(amber, ochre, stage - 1.0);
      else if (stage < 3.0) col = mix(ochre, rust, stage - 2.0);
      else if (stage < 4.0) col = mix(rust, steel, stage - 3.0);
      else if (stage < 5.0) col = mix(steel, slate, stage - 4.0);
      else col = mix(slate, cream, stage - 5.0);

      float depthFade = smoothstep(14.0, 1.5, vDepth);
      float shimmer = 0.60 + 0.40 * sin(vAge * 6.2832 + uTime * 0.22);

      float a = g * depthFade * shimmer * 0.78;
      if (a < 0.012) discard;

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const pts = new THREE.Points(geom, pMat);
scene.add(pts);

const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      float glow = exp(-d * d * 3.2) * 0.03;
      vec3 warm = vec3(0.12, 0.09, 0.06);
      vec3 cool = vec3(0.05, 0.06, 0.09);
      vec3 col = mix(cool, warm, vUv.y) * glow * 7.0 + vec3(glow * 0.5, glow * 0.4, glow * 0.28);
      gl_FragColor = vec4(col, glow);
    }
  `
});
const bgScene = new THREE.Scene();
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
(function loop() {
  const now = performance.now();
  const t = (now - t0) * 0.001;

  for (let i = 0; i < 3; i++) {
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simS, camO);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pMat.uniforms.state.value = rtA.texture;
  pMat.uniforms.uTime.value = t;
  bgMat.uniforms.uTime.value = t;

  const cycleProg = (t % CYCLE_DURATION) / CYCLE_DURATION;
  pMat.uniforms.uCycleProg.value = cycleProg;

  const ang = t * 0.055;
  camera.position.x = Math.sin(ang) * 5.8;
  camera.position.z = Math.cos(ang) * 5.8;
  camera.position.y = Math.sin(ang * 0.45) * 0.6;
  camera.lookAt(0, 0, 0);

  renderer.render(bgScene, camO);
  renderer.autoClear = false;
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
})();
</script>
