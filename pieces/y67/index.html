<div class="id">y67</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Wang & Söderström "Nest of You" mutation:
// Differential-growth skeleton from parent 2iy, but rendered as
// hundreds of leaf-shaped instances accreting into a biomorphic nest.
// Each leaf is a curved petal — the leaf-as-basic-unit principle.
// Palette: pearl, lavender, mercury. Motion: gathering (gentle).
// Leaves accumulate along the growth curve over time, building volume.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a10, 0.018);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 9, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a10, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 4, 0);

// ─── lighting: warm above, cool below (Eliasson gradient feel)
const ambLight = new THREE.AmbientLight(0x252030, 0.6);
scene.add(ambLight);

const topLight = new THREE.DirectionalLight(0xf0e0d0, 0.9);
topLight.position.set(3, 15, 5);
scene.add(topLight);

const sideLight = new THREE.DirectionalLight(0x9080b0, 0.4);
sideLight.position.set(-8, 2, -4);
scene.add(sideLight);

const rimLight = new THREE.PointLight(0xb0a8c8, 0.5, 30);
rimLight.position.set(0, 8, -10);
scene.add(rimLight);

// ─── differential growth (inherited from 2iy/5gm)
const MAX_VERTS = 1400;
const ATTRACT = 0.055;
const REPEL_R = 0.48;
const REPEL_STR = 0.12;
const NOISE = 0.003;
const PRESSURE = 0.003;
const RISE = 0.005;
const MAX_D = 0.38;

const verts = [];
for (let i = 0; i < 16; i++) {
  const th = (i / 16) * Math.PI * 2;
  const r = 1.2 + (Math.random() - 0.5) * 0.15;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key3(x, y, z) { return (Math.floor(x / CELL)) + ',' + (Math.floor(y / CELL)) + ',' + (Math.floor(z / CELL)); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v) {
  const cx = Math.floor(v.x / CELL), cy = Math.floor(v.y / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step() {
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of neighbors(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dy[i] += (oy / d) * PRESSURE * 0.3;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.25 + 1.0 * Math.min(a * 1.2, 1.0));
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i] + (Math.random() - 0.5) * NOISE * 0.4 + upward;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0016;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, z: (a.z + b.z) * 0.5, age: Math.max(a.age, b.age) * 0.45 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-grow so the nest has body on first frame
for (let s = 0; s < 500; s++) step();

// ─── leaf geometry: curved petal shape
function makeLeafGeo() {
  const W = 0.14, H = 0.32, CURVE = 0.04;
  const segsX = 3, segsY = 5;
  const pos = [], idx = [], nrm = [], uv = [];
  for (let iy = 0; iy <= segsY; iy++) {
    const v = iy / segsY;
    const yp = (v - 0.5) * H;
    const widthScale = Math.sin(v * Math.PI); // tapers at tip and base
    for (let ix = 0; ix <= segsX; ix++) {
      const u = ix / segsX;
      const xp = (u - 0.5) * W * widthScale;
      const zp = CURVE * Math.sin(u * Math.PI) * widthScale; // midrib curl
      pos.push(xp, yp, zp);
      nrm.push(0, 0, 1);
      uv.push(u, v);
    }
  }
  for (let iy = 0; iy < segsY; iy++) {
    for (let ix = 0; ix < segsX; ix++) {
      const a = iy * (segsX + 1) + ix;
      const b = a + 1;
      const c = a + segsX + 1;
      const d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// ─── palette: pearl, lavender, mercury, with warm and cool variants
// Hand-picked: 5 specific colors
const PALETTE = [
  new THREE.Color(0xe8ddd0), // pearl warm
  new THREE.Color(0xc8b8d8), // lavender
  new THREE.Color(0xb8bcc8), // mercury cool
  new THREE.Color(0xd8c8d0), // rose pearl
  new THREE.Color(0xa8a0b8), // deep lavender
];

const MAX_LEAVES = 3200;
const leafGeo = makeLeafGeo();
const leafMat = new THREE.MeshStandardMaterial({
  color: 0xe0d8cc,
  roughness: 0.25,
  metalness: 0.35,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.92,
});

const iMesh = new THREE.InstancedMesh(leafGeo, leafMat, MAX_LEAVES);
iMesh.count = 0;
scene.add(iMesh);

// per-instance color
const dummy = new THREE.Object3D();
const leafData = []; // track placed leaves

// ─── place leaves along the growth curve
function sampleLeaves() {
  const n = verts.length;
  if (n < 4) return;

  // build curve
  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  // determine how many leaves to add this frame
  const targetCount = Math.min(MAX_LEAVES, Math.floor(n * 2.2));
  const currentCount = leafData.length;
  if (currentCount >= targetCount) return;

  const toAdd = Math.min(6, targetCount - currentCount); // accrete gently

  for (let k = 0; k < toAdd; k++) {
    const t = Math.random();
    const p = curve.getPointAt(t);
    const tang = curve.getTangentAt(t).normalize();

    // offset from spine to build nest volume
    const radial = new THREE.Vector3(
      (Math.random() - 0.5),
      (Math.random() - 0.5) * 0.6,
      (Math.random() - 0.5)
    ).normalize();
    // project out of tangent direction
    radial.sub(tang.clone().multiplyScalar(radial.dot(tang))).normalize();
    const offsetDist = 0.15 + Math.random() * 0.55;
    p.add(radial.clone().multiplyScalar(offsetDist));

    // orient leaf: face roughly outward from spine, with random twist
    const up = new THREE.Vector3(0, 1, 0);
    const lookTarget = p.clone().add(radial);
    dummy.position.copy(p);
    dummy.lookAt(lookTarget);
    // add deliberate per-leaf rotation variation (wabi-sabi)
    dummy.rotation.x += (Math.random() - 0.5) * 0.6;
    dummy.rotation.y += (Math.random() - 0.5) * 0.8;
    dummy.rotation.z += (Math.random() - 0.5) * 0.4;
    // slight scale variation
    const sc = 0.7 + Math.random() * 0.8;
    dummy.scale.set(sc, sc, sc);
    dummy.updateMatrix();

    const idx = leafData.length;
    iMesh.setMatrixAt(idx, dummy.matrix);

    // per-leaf color from palette
    const ci = Math.floor(Math.random() * PALETTE.length);
    const col = PALETTE[ci].clone();
    // slight per-leaf hue jitter
    const hsl = {};
    col.getHSL(hsl);
    hsl.h += (Math.random() - 0.5) * 0.03;
    hsl.l += (Math.random() - 0.5) * 0.06;
    col.setHSL(hsl.h, hsl.s, hsl.l);
    iMesh.setColorAt(idx, col);

    leafData.push({ t, birthFrame: frameCount, sc });
  }

  iMesh.count = leafData.length;
  iMesh.instanceMatrix.needsUpdate = true;
  if (iMesh.instanceColor) iMesh.instanceColor.needsUpdate = true;
}

// ─── residue trails: small translucent spheres shed from the nest
const residueGeo = new THREE.SphereGeometry(0.025, 4, 4);
const residueMat = new THREE.MeshBasicMaterial({
  color: 0xc0b8d0,
  transparent: true,
  opacity: 0.25,
});
const residueMesh = new THREE.InstancedMesh(residueGeo, residueMat, 600);
residueMesh.count = 0;
scene.add(residueMesh);
const residues = [];

function spawnResidue() {
  if (residues.length >= 600 || verts.length < 10) return;
  // shed from a random growth vertex
  const vi = Math.floor(Math.random() * verts.length);
  const v = verts[vi];
  residues.push({
    x: v.x + (Math.random() - 0.5) * 0.3,
    y: v.y + (Math.random() - 0.5) * 0.3,
    z: v.z + (Math.random() - 0.5) * 0.3,
    vy: -0.003 - Math.random() * 0.004,
    life: 1.0,
  });
}

function updateResidues() {
  for (let i = residues.length - 1; i >= 0; i--) {
    const r = residues[i];
    r.y += r.vy;
    r.life -= 0.0008;
    if (r.life <= 0) { residues.splice(i, 1); continue; }
    dummy.position.set(r.x, r.y, r.z);
    const s = r.life * 0.8;
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    residueMesh.setMatrixAt(i, dummy.matrix);
  }
  residueMesh.count = residues.length;
  residueMesh.instanceMatrix.needsUpdate = true;
}

// ─── subtle spine thread (thin tube along growth curve for structural read)
let spineMesh = null;
const spineMat = new THREE.MeshBasicMaterial({
  color: 0x908898,
  transparent: true,
  opacity: 0.18,
});

function updateSpine() {
  if (verts.length < 8) return;
  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  const tubeGeo = new THREE.TubeGeometry(curve, Math.min(verts.length, 400), 0.012, 4, true);
  if (spineMesh) { scene.remove(spineMesh); spineMesh.geometry.dispose(); }
  spineMesh = new THREE.Mesh(tubeGeo, spineMat);
  scene.add(spineMesh);
}

// ─── atmosphere: dust motes (tiny bright dots drifting)
const dustCount = 120;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustVel = [];
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 20;
  dustPos[i * 3 + 1] = Math.random() * 16;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 20;
  dustVel.push({ vx: (Math.random() - 0.5) * 0.003, vy: 0.001 + Math.random() * 0.002, vz: (Math.random() - 0.5) * 0.003 });
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xd0c8d8, size: 0.04, transparent: true, opacity: 0.3 });
const dustPts = new THREE.Points(dustGeo, dustMat);
scene.add(dustPts);

function updateDust() {
  for (let i = 0; i < dustCount; i++) {
    dustPos[i * 3] += dustVel[i].vx;
    dustPos[i * 3 + 1] += dustVel[i].vy;
    dustPos[i * 3 + 2] += dustVel[i].vz;
    if (dustPos[i * 3 + 1] > 16) dustPos[i * 3 + 1] = -1;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

// ─── film grain overlay (Lia Halloran influence)
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 256; grainCanvas.height = 256;
const gCtx = grainCanvas.getContext('2d');
function refreshGrain() {
  const imgData = gCtx.createImageData(256, 256);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const v = Math.random() * 20;
    imgData.data[i] = imgData.data[i + 1] = imgData.data[i + 2] = v;
    imgData.data[i + 3] = 18;
  }
  gCtx.putImageData(imgData, 0, 0);
}
refreshGrain();
const grainTex = new THREE.CanvasTexture(grainCanvas);
grainTex.wrapS = grainTex.wrapT = THREE.RepeatWrapping;
grainTex.repeat.set(4, 4);
const grainPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, opacity: 0.12, depthTest: false, depthWrite: false })
);
grainPlane.renderOrder = 999;
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const grainScene = new THREE.Scene();
grainScene.add(grainPlane);

// ─── resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── main loop
let frameCount = 0;
function loop() {
  frameCount++;

  // growth
  for (let s = 0; s < 2; s++) step();

  // accrete leaves
  sampleLeaves();

  // spine update every 30 frames
  if (frameCount % 30 === 0) updateSpine();

  // residue
  if (frameCount % 8 === 0) spawnResidue();
  updateResidues();

  // dust
  updateDust();

  // grain refresh occasionally
  if (frameCount % 90 === 0) { refreshGrain(); grainTex.needsUpdate = true; }

  // camera follow centroid
  let cx = 0, cy = 0, cz = 0;
  for (const v of verts) { cx += v.x; cy += v.y; cz += v.z; }
  cx /= verts.length; cy /= verts.length; cz /= verts.length;

  const tY = Math.max(cy, 2.0);
  controls.target.x += (cx - controls.target.x) * 0.02;
  controls.target.y += (tY - controls.target.y) * 0.03;
  controls.target.z += (cz - controls.target.z) * 0.02;

  const desiredCamY = tY + 3;
  camera.position.y += (desiredCamY - camera.position.y) * 0.025;

  controls.update();
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
