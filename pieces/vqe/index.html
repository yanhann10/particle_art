<title>vqe · calyx cyanotype (Halloran × Riley)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a2240; overflow:hidden;
               color:#c8d4e0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<div class="id">vqe</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 12, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a2240, 1);
document.body.appendChild(renderer.domElement);

/* --- Full-screen cyanotype wash background --- */
const bgScene = new THREE.Scene();
const bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  uniforms: { uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;

    // Simplex-ish value noise for paper grain
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vnoise(vec2 p){
      vec2 i = floor(p); vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      float a = hash(i); float b = hash(i+vec2(1,0));
      float c = hash(i+vec2(0,1)); float d = hash(i+vec2(1,1));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    void main(){
      vec2 uv = vUv;
      // Deep Prussian blue gradient — warmer at bottom (ferric chemistry), cooler at top
      vec3 deep    = vec3(0.035, 0.11, 0.25);   // #091C40
      vec3 mid     = vec3(0.05, 0.17, 0.33);    // #0D2B54
      vec3 top     = vec3(0.04, 0.13, 0.28);    // #0A2147
      vec3 base = mix(deep, mid, smoothstep(0.0, 0.5, uv.y));
      base = mix(base, top, smoothstep(0.5, 1.0, uv.y));

      // Subtle vignette
      float vig = 1.0 - 0.35 * length((uv - 0.5) * vec2(1.4, 1.0));
      base *= vig;

      // Paper grain — cyanotype contact-print texture
      float grain = vnoise(uv * uRes * 0.25 + uTime * 0.3) * 0.06 - 0.03;
      // Larger mottling from chemical unevenness
      float mottle = vnoise(uv * 6.0 + uTime * 0.02) * 0.04 - 0.02;

      base += grain + mottle;

      gl_FragColor = vec4(base, 1.0);
    }
  `
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgScene.add(bgQuad);

/* --- Particle system --- */
const N = 80000;
let geom, points;

const uniforms = {
  uTime:      { value: 0 },
  uPhase:     { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uRowFreq:   { value: 1.2 },
  uColFreq:   { value: 1.0 },
  uWaveAmp:   { value: 0.5 },
  uTwist:     { value: 0.0 },
  uMorph:     { value: 0.0 },
  uPetals:    { value: 5.0 },
  uCupDepth:  { value: 4.0 },
  uLightAng:  { value: 0.0 },  // Turrell light azimuth — drifts slowly
  uLightElev: { value: 0.6 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uMorph;
    uniform float uPetals;
    uniform float uCupDepth;
    uniform float uLightAng;
    uniform float uLightElev;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity;
    varying float vHeight;
    varying float vLight;
    varying float vBrushStroke;
    varying float vRadial;

    // Simple 2D hash noise for brushstroke SDF
    float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise2(vec2 p){
      vec2 i = floor(p); vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      return mix(mix(hash2(i), hash2(i+vec2(1,0)), f.x),
                 mix(hash2(i+vec2(0,1)), hash2(i+vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float v = 0.0; float a = 0.5;
      for(int i=0;i<4;i++){ v += a*vnoise2(p); p *= 2.1; a *= 0.5; }
      return v;
    }

    void main(){
      vec2 gp = gridPos;

      /* Riley wave interference — 2× speed per user request */
      float rowWave = sin(gp.y * uRowFreq + uTime * 1.2 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.7) * uWaveAmp;

      float twist = uTwist * length(gp) * 0.04;
      float ct = cos(twist); float st = sin(twist);
      vec2 twisted = vec2(gp.x * ct - gp.y * st, gp.x * st + gp.y * ct);

      /* Calyx morph */
      float r = length(gp);
      float maxR = 12.0;
      float nr = clamp(r / maxR, 0.0, 1.0);
      float theta = atan(gp.y, gp.x);

      float petalShape = 0.5 + 0.5 * cos(theta * uPetals);
      float cupProfile = uCupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      float flare = 1.0 + 0.15 * nr * nr * uMorph;

      float m = uMorph;
      vec3 flatPos = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);

      float cx = twisted.x * flare + rowWave * (1.0 - 0.5 * m);
      float cy = twisted.y * flare + colWave * (1.0 - 0.5 * m);
      float cz = cupProfile * m;

      vec3 p = mix(flatPos, vec3(cx, cy, cz), m);

      /* Interference → density for cyanotype exposure variation */
      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 1.2)
                         * sin(gp.x * uColFreq * 2.0 + uTime * 0.7);
      float vein = sin(theta * uPetals * 3.0 + r * 1.5 + uTime * 0.4);
      vDensity = mix(interference, interference * 0.6 + vein * 0.4, m);
      vHeight = cz;
      vRadial = nr;

      /* Turrell-style drifting directional light on bowl surface */
      // Approximate surface normal for the cup
      vec3 surfNormal = normalize(vec3(
        -2.0 * uCupDepth * nr * gp.x / (maxR * maxR),
        -2.0 * uCupDepth * nr * gp.y / (maxR * maxR),
        1.0
      ));
      // Drifting light direction
      vec3 lightDir = normalize(vec3(
        cos(uLightAng) * cos(uLightElev),
        sin(uLightAng) * cos(uLightElev),
        sin(uLightElev)
      ));
      float diffuse = max(0.0, dot(surfNormal, lightDir));
      // Soft Turrell glow: wrap lighting
      float wrap = max(0.0, (dot(surfNormal, lightDir) + 0.4) / 1.4);
      vLight = mix(0.15, 1.0, wrap * m + (1.0 - m) * 0.5);

      /* Halloran brushstroke SDF — swaths of exposure across the field */
      vec2 brushUV = gp * 0.18 + uTime * vec2(0.015, 0.008);
      float brush = fbm(brushUV) - 0.42;
      // Second swath at different scale
      float brush2 = fbm(gp * 0.09 + vec2(uTime * 0.01, 3.7)) - 0.45;
      vBrushStroke = smoothstep(-0.08, 0.12, max(brush, brush2));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // Slightly larger points for the glow sprites
      gl_PointSize = uPixel * max(2.0, 4.5 - dist * 0.08);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDensity;
    varying float vHeight;
    varying float vLight;
    varying float vBrushStroke;
    varying float vRadial;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      // Gaussian falloff — soft glow sprite
      float alpha = exp(-r2 * 12.0);
      if (alpha < 0.01) discard;

      // Cyanotype palette: paper-white stars on Prussian blue
      // Base white with slight warm cream (#f0e8d8)
      vec3 paperWhite = vec3(0.94, 0.91, 0.85);
      // Faint blue-white for highlights
      vec3 starWhite  = vec3(0.88, 0.92, 0.98);

      // Density modulates between cream and blue-white
      float densityMask = smoothstep(-0.3, 0.6, vDensity);
      vec3 col = mix(paperWhite, starWhite, densityMask * 0.5);

      // Turrell light tints the surface — warm amber on lit side
      vec3 turrellWarm = vec3(1.0, 0.85, 0.65);
      vec3 turrellCool = vec3(0.6, 0.7, 0.9);
      float warmMix = smoothstep(0.3, 0.8, vLight);
      vec3 lightTint = mix(turrellCool, turrellWarm, warmMix);
      col = mix(col, col * lightTint, 0.4);

      // Brushstroke zones: particles in swaths are brighter (exposed cyanotype)
      float brushBoost = mix(0.35, 1.0, vBrushStroke);

      // Height-based intensity: cup interior glows
      float heightGlow = smoothstep(0.0, 3.5, vHeight) * 0.3;

      // Final alpha: light × brush × base
      float finalAlpha = alpha * vLight * brushBoost * (0.55 + heightGlow);

      // Rim particles fade slightly to let the form breathe
      float rimFade = smoothstep(0.95, 1.0, vRadial);
      finalAlpha *= (1.0 - rimFade * 0.6);

      gl_FragColor = vec4(col, finalAlpha);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24, height = 24;
  const cellW = width / cols, cellH = height / rows;

  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  return { positions, gridPositions, seeds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.5;
  uniforms.uTwist.value = rng() * 4.0;
  uniforms.uPhase.value = rng() * 6.28;
  uniforms.uPetals.value = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value = 0.0;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', (e) => {
  if (e.target.tagName === 'CANVAS') regenerate();
});

/* --- Orbit drag --- */
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.0, orbitPhi = 0.55;
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.4, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
  bgMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  bgMat.uniforms.uTime.value = t;

  // Morph flat → calyx
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.015;

  // Turrell light drifts — slow elliptical path
  uniforms.uLightAng.value = t * 0.13 + Math.sin(t * 0.07) * 0.8;
  uniforms.uLightElev.value = 0.5 + 0.2 * Math.sin(t * 0.09);

  // Camera orbit
  const autoTheta = t * 0.08;
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;
  const radius = 22;
  const centroidY = 1.5 * uniforms.uMorph.value;

  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    centroidY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, centroidY, 0);

  // Render background pass, then particles
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, bgCamera);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
