<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nma · Riley pattern snaps back</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">nma</div>
<div class="hint">drag to stretch · release to snap back — Riley bands as elastic membrane</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// SURPRISE-TURN: the Riley interference pattern is now a rubber-band membrane.
// Drag the mouse and the entire field stretches elastically toward the pointer.
// Release the mouse and it snaps back with a satisfying wobble (spring physics).
// The surprise: what looked like a static print suddenly becomes tactile, elastic.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const restPos   = new Float32Array(N * 3);
const seeds     = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;
function buildField(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w2 = { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 };
  const w3 = { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0;
  let attempts = 0;
  while (written < N && attempts < N * 16){
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
    const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
    const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.10);
    const accept = (f > 0) && (rng() < fall * (0.4 + 0.6 * f));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
    const y = -0.15 * r * r + scallop;
    positions[written*3]     = x;
    positions[written*3 + 1] = y;
    positions[written*3 + 2] = z;
    restPos[written*3]       = x;
    restPos[written*3 + 1]   = y;
    restPos[written*3 + 2]   = z;
    seeds[written]           = rng();
    written++;
  }
  for (let i = written; i < N; i++){
    positions[i*3] = 0; positions[i*3+1] = -2; positions[i*3+2] = 0;
    restPos[i*3] = 0; restPos[i*3+1] = -2; restPos[i*3+2] = 0;
    seeds[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vDepth;
    varying float vSeed;
    void main(){
      vec3 p = position;
      float t = uTime * 0.22 + seed * 6.28;
      p.y += 0.03 * sin(t);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      gl_PointSize = (1.4 + 0.8 * sin(t * 0.7)) * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);
      gl_FragColor = vec4(col, a * 0.78 * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── DUST
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 14;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── RUBBER-BAND SPRING PHYSICS
let isDragging = false;
let dragTarget = new THREE.Vector3(0, 0, 0);
let velocity = new THREE.Vector3(0, 0, 0);
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

addEventListener('pointerdown', (e) => {
  isDragging = true;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);
  if (target) dragTarget.copy(target);
});

addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const target = new THREE.Vector3();
  raycaster.ray.intersectPlane(plane, target);
  if (target) dragTarget.copy(target);
});

addEventListener('pointerup', () => {
  isDragging = false;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = 0;
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  uniforms.uTime.value = t;

  // Spring physics: stretch toward drag target when dragging, snap back when released
  const k = 3.2;      // spring stiffness
  const damping = 0.85;
  for (let i = 0; i < N; i++){
    const rx = restPos[i*3];
    const ry = restPos[i*3 + 1];
    const rz = restPos[i*3 + 2];
    if (ry < -1.5) continue; // skip culled particles
    
    let target = new THREE.Vector3(rx, ry, rz);
    if (isDragging){
      // stretch: pull toward dragTarget, weighted by distance (closer = more pull)
      const distSq = (rx - dragTarget.x) * (rx - dragTarget.x) + 
                     (ry - dragTarget.y) * (ry - dragTarget.y) + 
                     (rz - dragTarget.z) * (rz - dragTarget.z);
      const influence = Math.exp(-distSq * 0.08);
      target.lerp(dragTarget, influence * 0.65);
    }

    const px = positions[i*3];
    const py = positions[i*3 + 1];
    const pz = positions[i*3 + 2];
    const fx = (target.x - px) * k;
    const fy = (target.y - py) * k;
    const fz = (target.z - pz) * k;
    
    let vx = velocity.x * i / N; // fake per-particle velocity (indexed approximation)
    let vy = velocity.y * i / N;
    let vz = velocity.z * i / N;
    vx += fx * dt;
    vy += fy * dt;
    vz += fz * dt;
    vx *= damping;
    vy *= damping;
    vz *= damping;
    
    positions[i*3]     = px + vx * dt;
    positions[i*3 + 1] = py + vy * dt;
    positions[i*3 + 2] = pz + vz * dt;
    
    // store back to shared velocity (rough aggregate for wobble)
    if (i === 0) velocity.set(vx, vy, vz);
  }
  geom.attributes.position.needsUpdate = true;

  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
