<title>qwf · swerve on Riley moiré</title>
<!-- MOTION: drift, intensity: gentle -->
<!-- CREATIVE_CONSTRAINT: moiré reorganization as surprise — tiny parametric shift, dramatic visual consequence -->
<!-- ALGO_PATTERN: wave interference (Bridget Riley op-art) -->
<!-- EVOKES: Riley's "Movement in Squares" — the moment the grid buckles -->
<!-- INTENT: A calm ink-on-parchment Riley interference pattern that every ~18s "swerves" — wave bands dramatically reorganize like tilting a moiré screen, as if someone bumped the desk. The surprise is the disproportionate visual shift from a small rotation. -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:5; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">qwf</div>
<div class="hint">click to regrow · drag to nudge</div>
<div class="src">descended from ere · swerve · moiré surprise</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// SURPRISE-SWERVE on Riley moiré:
// The calm ink-on-parchment interference pattern periodically "swerves" —
// the wave sampling coordinates rotate ~55°, causing the interference bands
// to dramatically reorganize (moiré effect). Like someone bumped the desk
// the print is resting on. Dust motes catch the gust. Ink briefly warms.
// Then silence again.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* ── particle disk: uniform distribution, wave visibility in shader ── */
const N = 80000;
const positions = new Float32Array(N * 3);
const seedAttr  = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r  = Math.sqrt(Math.random()) * 4.0;
  const th = Math.random() * Math.PI * 2;
  positions[i * 3]     = r * Math.cos(th);
  positions[i * 3 + 1] = 0;
  positions[i * 3 + 2] = r * Math.sin(th);
  seedAttr[i] = Math.random();
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seedAttr, 1));

/* ── wave parameters (randomised on click) ── */
function randomWaves() {
  const TAU = Math.PI * 2;
  return {
    w1: new THREE.Vector3(Math.random() * TAU, 1.6 + Math.random() * 1.2, Math.random() * TAU),
    w2: new THREE.Vector3(Math.random() * TAU, 2.1 + Math.random() * 1.4, Math.random() * TAU),
    w3: new THREE.Vector3(Math.random() * TAU, 0.8 + Math.random() * 0.6, Math.random() * TAU),
    radK: 1.3 + Math.random() * 0.6
  };
}
let waves = randomWaves();

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uPointer:   { value: new THREE.Vector2(0, 0) },
  uSwerve:    { value: 0 },
  uSwerveVel: { value: 0 },
  uWave1:     { value: waves.w1 },
  uWave2:     { value: waves.w2 },
  uWave3:     { value: waves.w3 },
  uRadK:      { value: waves.radK }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime, uPixel, uSwerve, uSwerveVel;
    uniform vec2  uPointer;
    uniform vec3  uWave1, uWave2, uWave3;
    uniform float uRadK;
    attribute float seed;
    varying float vField, vSeed, vDepth, vSwerving;

    void main(){
      vec2 p2 = vec2(position.x, position.z);
      float r = length(p2);

      // swerve: rotate sampling coords — moiré reorganisation
      float cs = cos(uSwerve), sn = sin(uSwerve);
      vec2 sp = vec2(p2.x*cs - p2.y*sn, p2.x*sn + p2.y*cs);

      // 3 plane-waves + 1 radial wave → interference field
      float v1 = sin(sp.x*cos(uWave1.x)*uWave1.y + sp.y*sin(uWave1.x)*uWave1.y + uWave1.z);
      float v2 = sin(sp.x*cos(uWave2.x)*uWave2.y + sp.y*sin(uWave2.x)*uWave2.y + uWave2.z);
      float v3 = sin(sp.x*cos(uWave3.x)*uWave3.y + sp.y*sin(uWave3.x)*uWave3.y + uWave3.z);
      float vR = sin(r * uRadK);
      float f  = (v1 + v2 + v3 + vR) * 0.25;

      // calyx falloff
      float fall = exp(-r * r * 0.10);
      float vis  = smoothstep(-0.05, 0.18, f) * fall;

      // calyx surface: cupped bowl with petal scallops
      float th = atan(position.z, position.x);
      float scallop = cos(th * 6.0) * 0.18 * (r / 4.0);
      float y = -0.15 * r * r + scallop;

      // breathing
      float t = uTime * 0.22 + seed * 6.28;
      y += 0.03 * sin(t);

      // lateral nudge during swerve — particles feel the bump
      vec3 pos = vec3(position.x + uSwerveVel * 0.25 * seed,
                      y,
                      position.z + uSwerveVel * 0.18 * (1.0 - seed));

      // pointer tilt
      float tiltX = uPointer.y * 0.22, tiltZ = -uPointer.x * 0.22;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(pos.x, pos.y*ca - pos.z*sa, pos.y*sa + pos.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth    = -mv.z;
      vField    = vis;
      vSeed     = seed;
      vSwerving = abs(uSwerveVel);

      float sz = (1.4 + 0.8*sin(t*0.7)) * uPixel * (5.0 / vDepth);
      gl_PointSize = vis > 0.01 ? sz : 0.0;
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vField, vSeed, vDepth, vSwerving;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r * 19.0);

      // ink tones: deep sumi ↔ warm amber
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));

      // during swerve: ink catches light — brief amber flush
      vec3 inkFlush = vec3(0.38, 0.24, 0.10);
      col = mix(col, inkFlush, clamp(vSwerving * 0.55, 0.0, 0.35));

      // depth haze toward parchment
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      gl_FragColor = vec4(col, a * 0.78 * vField * (1.0 - haze*0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── dust motes ── */
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]   = (Math.random()-0.5)*14;
  dustPos[i*3+1] = (Math.random()-0.5)*8;
  dustPos[i*3+2] = (Math.random()-0.5)*8;
  dustSeed[i]    = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uSwerveVel: uniforms.uSwerveVel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uSwerveVel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime*0.10 + seed*6.28;
      p.x += sin(t*1.3 + seed*30.0)*0.4;
      p.y -= mod(uTime*0.08 + seed*7.0, 4.0) - 2.0;
      p.z += cos(t*1.1 + seed*22.0)*0.3;
      // gust during swerve
      p.x += uSwerveVel * (seed - 0.5) * 3.0;
      p.z += uSwerveVel * (1.0 - seed) * 1.5;
      float sx = -p.x/7.0, sy = p.y/4.0;
      vGlow = clamp(0.30 + 0.55*smoothstep(-0.2, 0.6, sx+sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4*vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a*0.70*vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

/* ── interaction ── */
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  waves = randomWaves();
  uniforms.uWave1.value.copy(waves.w1);
  uniforms.uWave2.value.copy(waves.w2);
  uniforms.uWave3.value.copy(waves.w3);
  uniforms.uRadK.value = waves.radK;
  swerveAngle = 0; swerveTarget = 0; swerveVel = 0;
  lastSwerveTime = -999;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── swerve spring ── */
let swerveAngle  = 0;
let swerveTarget = 0;
let swerveVel    = 0;
let lastSwerveTime = -999;
const FIRST_SWERVE    = 9;   // first surprise at 9s
const SWERVE_INTERVAL = 20;  // then every 20s
const SPRING_K = 10.0;       // spring stiffness
const SPRING_B = 4.0;        // damping — underdamped for slight overshoot

const start = performance.now();
let prevT = 0;

function loop(){
  const t  = (performance.now() - start) / 1000;
  const dt = Math.min(t - prevT, 0.05);
  prevT = t;
  uniforms.uTime.value = t;

  /* ── trigger swerve ── */
  const elapsed = lastSwerveTime < 0 ? t : t - lastSwerveTime;
  const interval = lastSwerveTime < 0 ? FIRST_SWERVE : SWERVE_INTERVAL;
  if (elapsed > interval) {
    const amount = 0.78 + Math.random() * 0.52;   // 45°–75°
    const dir    = Math.random() > 0.5 ? 1 : -1;
    swerveTarget += amount * dir;
    lastSwerveTime = t;
  }

  /* ── spring integration ── */
  const displacement = swerveAngle - swerveTarget;
  swerveVel += (-SPRING_K * displacement - SPRING_B * swerveVel) * dt;
  swerveAngle += swerveVel * dt;

  uniforms.uSwerve.value    = swerveAngle;
  uniforms.uSwerveVel.value = swerveVel;

  /* ── camera: slow lateral drift ── */
  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
