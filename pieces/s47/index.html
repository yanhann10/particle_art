<!-- MOTION: morph, intensity: gentle -->

  html, body { margin:0; padding:0; height:100%; background:#0d0a08; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">s47</div>
<div class="hint">drag to orbit · genealogical interpolation in progress</div>
<div class="src">Nouf Aljowaysir · Ana Min Wein (2023 Lumen Prize)</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Nouf Aljowaysir 2023 Lumen Prize: faces of ancestors morphing through
// latent-space genealogical interpolation. Point-cloud face that travels
// between three archetypes (great-grandparent → grandparent → self), with
// per-point lag so memory re-finds geometry. Sepia, rose, ink palette.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0a08, 0.018);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 7.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a08, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xd4a574, 1.4);
lightKey.position.set(3, 5, 4);
scene.add(lightKey);
const lightFill = new THREE.DirectionalLight(0x7a5d5a, 0.5);
lightFill.position.set(-4, 2, -3);
scene.add(lightFill);
scene.add(new THREE.AmbientLight(0x1a1210, 0.6));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.4, 0);
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 12;

// ─────────── THREE FACIAL ARCHETYPES — latent anchors
// Each archetype is a stylized facial geometry: point-cloud ellipsoids
// deformed to suggest features (nose bridge, cheekbones, jaw, brow ridge).
// We define them as displacement functions over a UV sphere.

function buildArchetype(deformFunc, color){
  const N_LAT = 32, N_LON = 64;
  const positions = [];
  const colors = [];
  for (let i = 0; i <= N_LAT; i++){
    const phi = (i / N_LAT) * Math.PI;
    for (let j = 0; j <= N_LON; j++){
      const theta = (j / N_LON) * Math.PI * 2;
      const u = j / N_LON, v = i / N_LAT;
      const base = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
      );
      const pos = deformFunc(base, u, v);
      positions.push(pos.x, pos.y, pos.z);
      colors.push(color.r, color.g, color.b);
    }
  }
  return { positions, colors };
}

// ARCHETYPE A: Great-Grandparent — broad jaw, pronounced brow, narrow nose bridge
function deformA(base, u, v){
  const p = base.clone().multiplyScalar(1.8);
  // broad jaw: widen lower half
  if (p.y < 0){
    const widen = (1 + 0.5 * (1 - Math.abs(p.y) / 1.8));
    p.x *= widen;
    p.z *= widen;
  }
  // pronounced brow ridge: bulge at y ≈ 0.4
  const brow = Math.exp(-Math.pow((p.y - 0.7) / 0.3, 2));
  p.z += brow * 0.3;
  // narrow nose bridge: compress x near z > 0, y ≈ 0
  if (p.z > 0 && Math.abs(p.y) < 0.5){
    const squeeze = Math.exp(-Math.pow(p.z / 0.8, 2));
    p.x *= (1 - squeeze * 0.4);
  }
  return p;
}

// ARCHETYPE B: Grandparent — softer features, rounded cheeks, slight chin
function deformB(base, u, v){
  const p = base.clone().multiplyScalar(1.7);
  // rounded cheeks: bulge at mid-height, lateral
  const cheek = Math.exp(-Math.pow((p.y - 0.1) / 0.6, 2)) * Math.exp(-Math.pow(p.z / 0.7, 2));
  p.x *= (1 + cheek * 0.3);
  // slight chin: narrow lower y
  if (p.y < -0.8){
    const taper = 1 - 0.3 * Math.abs((p.y + 0.8) / 1.0);
    p.x *= taper;
    p.z *= taper;
  }
  return p;
}

// ARCHETYPE C: Self — sharper features, higher cheekbones, defined jawline
function deformC(base, u, v){
  const p = base.clone().multiplyScalar(1.65);
  // higher cheekbones: bulge at y ≈ 0.3, lateral
  const cheek = Math.exp(-Math.pow((p.y - 0.3) / 0.4, 2)) * Math.exp(-Math.pow(p.z / 0.6, 2));
  p.x *= (1 + cheek * 0.4);
  // defined jawline: sharper taper below y = -0.5
  if (p.y < -0.5){
    const shape = 1 - 0.5 * Math.pow(Math.abs(p.y + 0.5) / 1.2, 1.5);
    p.x *= shape;
    p.z *= shape;
  }
  // sharper nose: slight forward bulge
  if (p.z > 0 && Math.abs(p.y) < 0.6){
    const nose = Math.exp(-Math.pow(p.z / 0.5, 2)) * Math.exp(-Math.pow(p.y / 0.6, 2));
    p.z += nose * 0.25;
  }
  return p;
}

const colorA = new THREE.Color(0x8a6f54); // sepia
const colorB = new THREE.Color(0xa67b72); // dusty rose
const colorC = new THREE.Color(0x4a3c3a); // ink brown

const archetypeA = buildArchetype(deformA, colorA);
const archetypeB = buildArchetype(deformB, colorB);
const archetypeC = buildArchetype(deformC, colorC);

const N_POINTS = archetypeA.positions.length / 3;

// ─────────── PARTICLE SYSTEM with per-point lag
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(N_POINTS * 3);
const colors = new Float32Array(N_POINTS * 3);

// Per-point state: current pos, target (next archetype), lag phase
const particleState = [];
for (let i = 0; i < N_POINTS; i++){
  particleState.push({
    current: new THREE.Vector3(
      archetypeA.positions[i*3],
      archetypeA.positions[i*3+1],
      archetypeA.positions[i*3+2]
    ),
    target: new THREE.Vector3(),
    lagPhase: Math.random() * Math.PI * 2, // staggered arrival
    colorCurrent: new THREE.Color(archetypeA.colors[i*3], archetypeA.colors[i*3+1], archetypeA.colors[i*3+2]),
    colorTarget: new THREE.Color(),
  });
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.035,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const pointCloud = new THREE.Points(geometry, material);
scene.add(pointCloud);

// ─────────── GENEALOGICAL INTERPOLATION STATE
let morphPhase = 0; // 0: A→B, 1: B→C, 2: C→A
let morphT = 0;
const PHASE_DURATION = 8.0; // seconds per morph
let lastTime = performance.now();

function getArchetypeData(phase){
  if (phase === 0) return { src: archetypeA, dst: archetypeB, srcColor: colorA, dstColor: colorB };
  if (phase === 1) return { src: archetypeB, dst: archetypeC, srcColor: colorB, dstColor: colorC };
  return { src: archetypeC, dst: archetypeA, srcColor: colorC, dstColor: colorA };
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  morphT += dt / PHASE_DURATION;
  if (morphT >= 1.0){
    morphT = 0;
    morphPhase = (morphPhase + 1) % 3;
    // Update all targets to new destination archetype
    const { dst, dstColor } = getArchetypeData(morphPhase);
    for (let i = 0; i < N_POINTS; i++){
      particleState[i].target.set(dst.positions[i*3], dst.positions[i*3+1], dst.positions[i*3+2]);
      particleState[i].colorTarget.setRGB(dst.colors[i*3], dst.colors[i*3+1], dst.colors[i*3+2]);
    }
  }

  // Per-point interpolation with lag: each point's effective t lags behind morphT
  // based on its lagPhase — creates the "memory catching up" effect
  const posAttr = geometry.attributes.position.array;
  const colAttr = geometry.attributes.color.array;

  for (let i = 0; i < N_POINTS; i++){
    const s = particleState[i];
    // lag curve: sine-modulated delay
    const lagAmount = 0.35 * (0.5 + 0.5 * Math.sin(s.lagPhase + morphT * Math.PI * 2));
    let effectiveT = morphT - lagAmount;
    effectiveT = Math.max(0, Math.min(1, effectiveT));

    // smooth ease
    const ease = effectiveT < 0.5 
      ? 2 * effectiveT * effectiveT 
      : 1 - Math.pow(-2 * effectiveT + 2, 2) / 2;

    // lerp position
    s.current.lerpVectors(s.current, s.target, 0.02 + ease * 0.06);
    
    // add subtle jitter during transition to suggest digital/latent uncertainty
    const jitter = (1 - Math.abs(effectiveT - 0.5) * 2) * 0.02; // peak jitter at mid-transition
    const jx = (Math.random() - 0.5) * jitter;
    const jy = (Math.random() - 0.5) * jitter;
    const jz = (Math.random() - 0.5) * jitter;

    posAttr[i*3]   = s.current.x + jx;
    posAttr[i*3+1] = s.current.y + jy;
    posAttr[i*3+2] = s.current.z + jz;

    // lerp color
    s.colorCurrent.lerp(s.colorTarget, 0.015 + ease * 0.04);
    colAttr[i*3]   = s.colorCurrent.r;
    colAttr[i*3+1] = s.colorCurrent.g;
    colAttr[i*3+2] = s.colorCurrent.b;
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;

  // slow rotation of the face for cinematic presentation
  pointCloud.rotation.y += 0.002;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Initialize first morph phase targets
const { dst, dstColor } = getArchetypeData(0);
for (let i = 0; i < N_POINTS; i++){
  particleState[i].target.set(dst.positions[i*3], dst.positions[i*3+1], dst.positions[i*3+2]);
  particleState[i].colorTarget.setRGB(dst.colors[i*3], dst.colors[i*3+1], dst.colors[i*3+2]);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
