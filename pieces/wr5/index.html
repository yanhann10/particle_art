<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wr5 · Cellular Forms — hiraeth dissolution</title>
<!-- MOTION: growth+dissolution, intensity: gentle-melancholic -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 40% 45%, #1a1e2e 0%, #111524 40%, #080a12 100%),
      #080a12;
    background-blend-mode: normal;
    color: #8a9ab4; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.07  0 0 0 0 0.12  0 0 0 0.28 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/></svg>");
    mix-blend-mode: multiply; opacity: 0.45;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 80% 70% at 25% 30%, rgba(160,175,210,0.08), rgba(160,175,210,0) 60%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">wr5</div>
<div class="hint">cells grow and remember — the oldest drift away, longing for the center they left</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Andy Lomas cellular morphogenesis + hiraeth (Welsh longing for a lost home).
// The cells grow from center but the oldest peripheral cells gradually detach,
// drift upward and fade — ghosts of form that can't return to the body.
// Palette shifts from warm core (memory of home) to cold periphery (distance).

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080a12);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 8);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ────────────── CELL STRUCTURE
const MAX_CELLS = 20000;
const INITIAL_CELLS = 120;
const SPLIT_THRESHOLD = 1.0;
const NUTRIENT_RATE = 0.11;
const SPRING_K = 0.18;
const DAMPING = 0.85;
const REST_DIST = 0.14;
const DETACH_AGE = 18.0;    // cells older than this begin to drift
const GHOST_AGE  = 28.0;    // cells older than this become ghosts (fade fully)

class Cell {
  constructor(x, y, z) {
    this.pos = new THREE.Vector3(x, y, z);
    this.vel = new THREE.Vector3(0, 0, 0);
    this.nutrient = 0;
    this.age = 0;
    this.neighbors = [];
    this.detached = false;
    this.ghostAlpha = 1.0;
    this.distFromCenter = 0;
  }
}

const cells = [];

// Initialize seed — small icosahedron cluster
function initCells() {
  const phi = (1 + Math.sqrt(5)) / 2;
  const a = 0.5, b = a / phi;
  const verts = [
    [-a, b, 0], [a, b, 0], [-a, -b, 0], [a, -b, 0],
    [0, -a, b], [0, a, b], [0, -a, -b], [0, a, -b],
    [b, 0, -a], [b, 0, a], [-b, 0, -a], [-b, 0, a]
  ];
  verts.forEach(v => cells.push(new Cell(v[0], v[1], v[2])));
  for (let i = 0; i < cells.length; i++) {
    for (let j = i + 1; j < cells.length; j++) {
      if (cells[i].pos.distanceTo(cells[j].pos) < 1.2) {
        cells[i].neighbors.push(j);
        cells[j].neighbors.push(i);
      }
    }
  }
}
initCells();

// ────────────── INSTANCED MESH
const baseGeom = new THREE.SphereGeometry(0.08, 8, 6);
const instMesh = new THREE.InstancedMesh(baseGeom, null, MAX_CELLS);
instMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);

// Per-instance color for warm-core → cold-periphery gradient + ghost fade
const colorAttr = new Float32Array(MAX_CELLS * 3);
const colorBuf = new THREE.InstancedBufferAttribute(colorAttr, 3);
colorBuf.setUsage(THREE.DynamicDrawUsage);
baseGeom.setAttribute('iColor', colorBuf);

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: `
    attribute vec3 iColor;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vDepth;
    varying vec3 vColor;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vColor = iColor;
      vec4 mv = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
      vPos = mv.xyz;
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vDepth;
    varying vec3 vColor;
    void main() {
      float ddx = length(dFdx(vPos));
      float ddy = length(dFdy(vPos));
      float ao = 1.0 - clamp((ddx + ddy) * 1.8, 0.0, 0.65);
      vec3 lightDir = normalize(vec3(-1.0, 1.2, 0.5));
      float diff = max(0.0, dot(vNormal, lightDir));
      float rim = pow(1.0 - abs(dot(vNormal, vec3(0,0,1))), 2.2) * 0.22;
      vec3 col = vColor + rim * vec3(0.06, 0.04, 0.10);
      col *= (0.25 + 0.75 * diff) * ao;
      // Depth fade to dark background
      float fade = clamp((vDepth - 8.0) / 5.0, 0.0, 0.5);
      col = mix(col, vec3(0.03, 0.04, 0.07), fade);
      // Alpha from brightness for ghost cells
      float a = clamp(length(vColor) / 0.95, 0.08, 1.0);
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  depthWrite: true
});
instMesh.material = mat;
scene.add(instMesh);

// ────────────── GHOST MOTES — memories of detached cells
const N_GHOSTS = 600;
const ghostGeom = new THREE.BufferGeometry();
const ghostPos  = new Float32Array(N_GHOSTS * 3);
const ghostLife = new Float32Array(N_GHOSTS);   // 0 = inactive
const ghostVel  = new Float32Array(N_GHOSTS * 3);
const ghostSeed = new Float32Array(N_GHOSTS);
for (let i = 0; i < N_GHOSTS; i++) {
  ghostPos[i*3] = ghostPos[i*3+1] = ghostPos[i*3+2] = 0;
  ghostLife[i] = 0;
  ghostSeed[i] = Math.random();
}
ghostGeom.setAttribute('position', new THREE.BufferAttribute(ghostPos, 3));
ghostGeom.setAttribute('life',     new THREE.BufferAttribute(ghostLife, 1));
ghostGeom.setAttribute('seed',     new THREE.BufferAttribute(ghostSeed, 1));
const ghostMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float life;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.06 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 20.0) * 0.12;
      p.z += cos(t * 0.9 + seed * 15.0) * 0.10;
      vAlpha = life;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.2 + life * 1.5) * uPixel * (3.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0);
      // Cool blue-silver ghost color
      vec3 col = vec3(0.55, 0.62, 0.82);
      gl_FragColor = vec4(col, a * 0.5 * vAlpha);
    }
  `
});
const ghosts = new THREE.Points(ghostGeom, ghostMat);
scene.add(ghosts);

// ────────────── DUST MOTES (atmospheric)
const N_DUST = 140;
const dustGeom = new THREE.BufferGeometry();
const dustPosArr  = new Float32Array(N_DUST * 3);
const dustSeedArr = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPosArr[i*3]     = (Math.random() - 0.5) * 14;
  dustPosArr[i*3 + 1] = (Math.random() - 0.5) * 10;
  dustPosArr[i*3 + 2] = (Math.random() - 0.5) * 6;
  dustSeedArr[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPosArr, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeedArr, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.06 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.35;
      p.y -= mod(uTime * 0.04 + seed * 7.0, 5.0) - 2.5;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.28;
      vGlow = clamp(0.20 + 0.40 * seed, 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 0.8 * vGlow) * uPixel * (2.8 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0);
      vec3 col = vec3(0.68, 0.72, 0.88) * vGlow;
      gl_FragColor = vec4(col, a * 0.4 * vGlow);
    }
  `
});
const dustPts = new THREE.Points(dustGeom, dustMat);
scene.add(dustPts);

// ────────────── GHOST SPAWN RING
let ghostIdx = 0;
function spawnGhost(pos) {
  const i = ghostIdx % N_GHOSTS;
  ghostPos[i*3]   = pos.x;
  ghostPos[i*3+1] = pos.y;
  ghostPos[i*3+2] = pos.z;
  ghostLife[i] = 1.0;
  ghostVel[i*3]   = (Math.random() - 0.5) * 0.02;
  ghostVel[i*3+1] = 0.015 + Math.random() * 0.025;
  ghostVel[i*3+2] = (Math.random() - 0.5) * 0.02;
  ghostIdx++;
}

// ────────────── GROWTH SIMULATION (hiraeth morph)
const centroid = new THREE.Vector3();
function computeCentroid() {
  centroid.set(0, 0, 0);
  let alive = 0;
  for (let i = 0; i < cells.length; i++) {
    if (!cells[i].detached) { centroid.add(cells[i].pos); alive++; }
  }
  if (alive > 0) centroid.divideScalar(alive);
}

// Warm core color, cold periphery
const warmCol = new THREE.Color(0.92, 0.85, 0.78);  // amber warmth — home
const coldCol = new THREE.Color(0.55, 0.60, 0.76);  // slate blue — distance

function updateCells(dt) {
  computeCentroid();

  // Accumulate nutrient — cells nearer to center get more (home nourishes)
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.detached) continue;
    c.distFromCenter = c.pos.distanceTo(centroid);
    const proximityBonus = 1.0 / (1.0 + c.distFromCenter * 0.6);
    c.nutrient += NUTRIENT_RATE * dt * (0.6 + 0.6 * proximityBonus);
    c.age += dt;
  }

  // Split cells that exceed threshold
  const newCells = [];
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.detached) continue;
    if (c.nutrient >= SPLIT_THRESHOLD && cells.length + newCells.length < MAX_CELLS) {
      c.nutrient = 0;
      const offset = new THREE.Vector3(
        (Math.random() - 0.5) * 0.2,
        (Math.random() - 0.5) * 0.2,
        (Math.random() - 0.5) * 0.2
      ).normalize().multiplyScalar(REST_DIST * 0.85);
      const nc = new Cell(c.pos.x + offset.x, c.pos.y + offset.y, c.pos.z + offset.z);
      nc.neighbors.push(i);
      c.neighbors.push(cells.length + newCells.length);
      if (c.neighbors.length > 2) {
        const inheritIdx = c.neighbors[Math.floor(Math.random() * c.neighbors.length)];
        if (inheritIdx < cells.length && !nc.neighbors.includes(inheritIdx)) {
          nc.neighbors.push(inheritIdx);
          if (cells[inheritIdx]) cells[inheritIdx].neighbors.push(cells.length + newCells.length);
        }
      }
      newCells.push(nc);
    }
  }
  cells.push(...newCells);

  // Hiraeth detachment — old peripheral cells lose their bonds and drift upward
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.detached) {
      // Drift upward slowly, fading
      c.pos.y += 0.012 * dt;
      c.pos.x += Math.sin(c.age * 0.3 + i) * 0.003;
      c.pos.z += Math.cos(c.age * 0.25 + i * 0.7) * 0.003;
      c.ghostAlpha = Math.max(0, c.ghostAlpha - dt * 0.06);
      if (c.ghostAlpha < 0.15 && Math.random() < 0.02) {
        spawnGhost(c.pos);
      }
      continue;
    }
    // Check for detachment
    if (c.age > DETACH_AGE && c.distFromCenter > 1.8) {
      const detachChance = (c.age - DETACH_AGE) * 0.008 * dt;
      if (Math.random() < detachChance) {
        c.detached = true;
        c.neighbors = [];
        spawnGhost(c.pos);
      }
    }
  }

  // Spring relaxation (only connected cells)
  const forces = [];
  for (let i = 0; i < cells.length; i++) forces.push(new THREE.Vector3(0, 0, 0));
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.detached) continue;
    for (let j = 0; j < c.neighbors.length; j++) {
      const ni = c.neighbors[j];
      if (ni >= cells.length) continue;
      const n = cells[ni];
      if (n.detached) continue;
      const delta = new THREE.Vector3().subVectors(n.pos, c.pos);
      const dist = delta.length();
      if (dist < 0.001) continue;
      const force = (dist - REST_DIST) * SPRING_K;
      delta.normalize().multiplyScalar(force);
      forces[i].add(delta);
    }
  }

  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.detached) continue;
    c.vel.add(forces[i].multiplyScalar(dt));
    c.vel.multiplyScalar(DAMPING);
    c.pos.add(new THREE.Vector3().copy(c.vel).multiplyScalar(dt));
  }

  // Update instances
  const m = new THREE.Matrix4();
  const tmpCol = new THREE.Color();
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    const s = c.detached ? Math.max(0.3, c.ghostAlpha) : 1.0;
    m.makeScale(s, s, s);
    m.setPosition(c.pos);
    instMesh.setMatrixAt(i, m);

    // Color: warm at center, cool at periphery, dim for ghosts
    const t = Math.min(c.distFromCenter / 4.0, 1.0);
    tmpCol.lerpColors(warmCol, coldCol, t);
    if (c.detached) {
      tmpCol.multiplyScalar(c.ghostAlpha * 0.7);
    }
    colorAttr[i*3]   = tmpCol.r;
    colorAttr[i*3+1] = tmpCol.g;
    colorAttr[i*3+2] = tmpCol.b;
  }
  instMesh.instanceMatrix.needsUpdate = true;
  colorBuf.needsUpdate = true;
  instMesh.count = cells.length;
}

// Update ghost particles
function updateGhosts(dt) {
  for (let i = 0; i < N_GHOSTS; i++) {
    if (ghostLife[i] <= 0) continue;
    ghostPos[i*3]   += ghostVel[i*3];
    ghostPos[i*3+1] += ghostVel[i*3+1];
    ghostPos[i*3+2] += ghostVel[i*3+2];
    ghostLife[i] -= dt * 0.04;
    if (ghostLife[i] < 0) ghostLife[i] = 0;
  }
  ghostGeom.attributes.position.needsUpdate = true;
  ghostGeom.attributes.life.needsUpdate = true;
}

// ────────────── CAMERA
function updateCamera(t) {
  computeCentroid();
  const target = centroid.clone();
  // Pull back as structure grows
  const aliveCt = cells.filter(c => !c.detached).length;
  const size = Math.sqrt(Math.max(1, aliveCt) / INITIAL_CELLS);
  const baseDist = 8 + size * 1.4;
  // Slow orbit
  const orbitAngle = t * 0.065;
  camera.position.x = Math.sin(orbitAngle) * baseDist * 0.32;
  camera.position.y = Math.sin(t * 0.04 + 1.0) * 0.5 + 0.3;
  camera.position.z = baseDist;
  camera.lookAt(target);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = start;
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  mat.uniforms.uTime.value = t;
  ghostMat.uniforms.uTime.value = t;
  dustMat.uniforms.uTime.value = t;

  updateCells(dt);
  updateGhosts(dt);
  updateCamera(t);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>

    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
