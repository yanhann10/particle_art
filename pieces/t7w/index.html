<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t7w · Fiddlehead Forest</title>
<!-- MOTION: unfurling, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">t7w</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Fern L-system for fiddlehead structure ── */
const RULES = {
  'F': [ 
    { p: 0.5, s: 'F[+F]F[-F]F' },
    { p: 0.3, s: 'F[++F][--F]F' },
    { p: 0.2, s: 'FF[+F][-F]' }
  ],
  'X': [
    { p: 0.6, s: 'F[+X][-X]FX' },
    { p: 0.4, s: 'F-[[X]+X]+F[+FX]-X' }
  ]
};

const ANGLE = THREE.MathUtils.degToRad(25);
const STEP = 0.8;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function fernTurtle(str, seed){
  const points = [];
  const stack = [];
  let pos = new THREE.Vector3(0,0,0);
  let dir = new THREE.Vector3(0,1,0);
  let right = new THREE.Vector3(1,0,0);
  let forward = new THREE.Vector3(0,0,-1);
  let age = 0;
  let gen = 0;
  
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    dir.applyQuaternion(q);
    right.applyQuaternion(q);
    forward.applyQuaternion(q);
  };
  
  for (const ch of str){
    switch(ch){
      case 'F':
        const nextPos = pos.clone().addScaledVector(dir, STEP);
        points.push({ 
          start: pos.clone(), 
          end: nextPos.clone(), 
          age, 
          gen,
          seed: seed + age * 0.001
        });
        pos = nextPos;
        age += 1;
        break;
      case 'X':
        age += 0.5;
        break;
      case '+':
        rotate(forward, ANGLE);
        break;
      case '-':
        rotate(forward, -ANGLE);
        break;
      case '[':
        stack.push({ pos: pos.clone(), dir: dir.clone(), right: right.clone(), forward: forward.clone(), age, gen });
        gen += 1;
        break;
      case ']':
        const frame = stack.pop();
        pos = frame.pos;
        dir = frame.dir;
        right = frame.right;
        forward = frame.forward;
        age = frame.age;
        gen = frame.gen;
        break;
    }
  }
  return points;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.022);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 8, 0);

/* ── Generate multiple ferns ── */
const ferns = [];
const FERN_COUNT = 18;

function rngFromSeed(s){
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

for (let i = 0; i < FERN_COUNT; i++){
  const seed = 1000 + i * 7919;
  const rng = rngFromSeed(seed);
  const str = expand('X', 5, rng);
  const segments = fernTurtle(str, seed);
  
  // Position in circular arrangement
  const angle = (i / FERN_COUNT) * Math.PI * 2;
  const radius = 6 + rng() * 4;
  const offset = new THREE.Vector3(
    Math.cos(angle) * radius,
    0,
    Math.sin(angle) * radius
  );
  
  // Build tube geometry for each segment
  segments.forEach(seg => {
    const pts = [seg.start.clone().add(offset), seg.end.clone().add(offset)];
    const curve = new THREE.CatmullRomCurve3(pts);
    
    // Variable radius: thicker at base, thinner at tips
    const baseRadius = 0.15 * (1 - seg.gen * 0.12);
    const tipRadius = baseRadius * 0.6;
    const radiusFunc = t => THREE.MathUtils.lerp(baseRadius, tipRadius, t);
    
    const tubeGeo = new THREE.TubeGeometry(curve, 2, 0.12, 6, false);
    
    // Store metadata for shader
    const positions = tubeGeo.attributes.position;
    const ages = new Float32Array(positions.count);
    const seeds = new Float32Array(positions.count);
    const gens = new Float32Array(positions.count);
    
    for (let j = 0; j < positions.count; j++){
      ages[j] = seg.age;
      seeds[j] = seg.seed;
      gens[j] = seg.gen;
    }
    
    tubeGeo.setAttribute('vAge', new THREE.BufferAttribute(ages, 1));
    tubeGeo.setAttribute('vSeed', new THREE.BufferAttribute(seeds, 1));
    tubeGeo.setAttribute('vGen', new THREE.BufferAttribute(gens, 1));
    
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uUnfurl: { value: 0 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uUnfurl;
        attribute float vAge;
        attribute float vSeed;
        attribute float vGen;
        varying vec3 vCol;
        varying float vAlpha;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        
        void main(){
          // Unfurl from coiled fiddlehead
          float coilT = clamp(uUnfurl - vAge * 0.008, 0.0, 1.0);
          coilT = coilT * coilT * (3.0 - 2.0 * coilT);
          
          // Start coiled tight
          vec3 coilAxis = normalize(vec3(0.3, 1.0, 0.2));
          float coilAngle = (1.0 - coilT) * 3.14159 * 4.0 * (1.0 + vAge * 0.15);
          
          vec3 p = position;
          // Rotate around coil axis
          float ca = cos(coilAngle);
          float sa = sin(coilAngle);
          vec3 k = coilAxis;
          mat3 rot = mat3(
            ca + k.x*k.x*(1.0-ca), k.x*k.y*(1.0-ca)-k.z*sa, k.x*k.z*(1.0-ca)+k.y*sa,
            k.y*k.x*(1.0-ca)+k.z*sa, ca+k.y*k.y*(1.0-ca), k.y*k.z*(1.0-ca)-k.x*sa,
            k.z*k.x*(1.0-ca)-k.y*sa, k.z*k.y*(1.0-ca)+k.x*sa, ca+k.z*k.z*(1.0-ca)
          );
          p = rot * p;
          
          // Gentle sway
          float sway = sin(uTime * 0.8 + vSeed * 6.28) * 0.15 * coilT;
          p.x += sway * (vAge * 0.02);
          p.z += cos(uTime * 0.6 + vSeed * 4.0) * 0.1 * coilT * (vAge * 0.02);
          
          // Palette: aged fern green to rust brown tips
          vec3 fernBase = vec3(0.25, 0.38, 0.28);
          vec3 fernTip = vec3(0.42, 0.35, 0.22);
          vec3 rustAccent = vec3(0.52, 0.32, 0.18);
          
          float tipness = vGen / 5.0;
          vec3 col = mix(fernBase, fernTip, tipness);
          col = mix(col, rustAccent, vSeed * 0.3);
          
          vCol = col;
          vAlpha = 0.82 * coilT;
          
          vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
          vNormal = normalize(normalMatrix * normal);
          vViewDir = normalize(-mvPos.xyz);
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        varying vec3 vCol;
        varying float vAlpha;
        varying vec3 vNormal;
        varying vec3 vViewDir;
        
        void main(){
          vec3 col = vCol;
          
          // Soft diffuse light
          vec3 L = normalize(vec3(0.4, 1.0, 0.3));
          vec3 N = normalize(vNormal);
          float diff = max(dot(N, L), 0.0) * 0.6 + 0.4;
          col *= diff;
          
          // Subtle specular for vascular sheen
          vec3 V = normalize(vViewDir);
          vec3 R = reflect(-L, N);
          float spec = pow(max(dot(V, R), 0.0), 32.0);
          col += vec3(0.7, 0.75, 0.65) * spec * 0.2;
          
          // Rim light for translucency
          float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0);
          col += vec3(0.45, 0.52, 0.38) * rim * 0.25;
          
          gl_FragColor = vec4(col, vAlpha);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide
    });
    
    const mesh = new THREE.Mesh(tubeGeo, mat);
    scene.add(mesh);
    ferns.push({ mesh, mat });
  });
}

/* ── Ground plane with lustrous translucent finish ── */
const planeGeo = new THREE.PlaneGeometry(60, 60);
const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vViewDir;
    varying vec3 vNormal;
    void main(){
      vUv = uv;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewDir = normalize(-mvPos.xyz);
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vViewDir;
    varying vec3 vNormal;
    
    void main(){
      // Base: dark warm gray with slight transparency
      vec3 base = vec3(0.12, 0.14, 0.15);
      vec3 warmTint = vec3(0.86, 0.78, 0.67);
      base = mix(base, warmTint * 0.08, 0.3);
      
      // Fresnel edge highlight
      float fresnel = pow(1.0 - max(dot(vNormal, vViewDir), 0.0), 2.5);
      vec3 edgeGlow = vec3(1.0, 1.0, 1.0) * fresnel * 0.18;
      
      // Subtle specular shimmer
      float shimmer = pow(max(dot(vNormal, normalize(vec3(0.3, 1.0, 0.4))), 0.0), 80.0);
      vec3 spec = vec3(0.9, 0.92, 0.88) * shimmer * 0.12;
      
      vec3 col = base + edgeGlow + spec;
      float alpha = 0.18 + fresnel * 0.06;
      
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});

const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -0.2;
scene.add(plane);

/* ── Shimmer overlay plane (additive) ── */
const shimmerGeo = new THREE.PlaneGeometry(60, 60);
const shimmerMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    
    void main(){
      // Traveling specular ripples
      float wave1 = sin(vUv.x * 8.0 + uTime * 0.4) * 0.5 + 0.5;
      float wave2 = sin(vUv.y * 12.0 - uTime * 0.3) * 0.5 + 0.5;
      float ripple = wave1 * wave2 * 0.08;
      
      vec3 col = vec3(0.85, 0.88, 0.82) * ripple;
      gl_FragColor = vec4(col, ripple * 0.08);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide
});

const shimmer = new THREE.Mesh(shimmerGeo, shimmerMat);
shimmer.rotation.x = -Math.PI / 2;
shimmer.position.y = -0.15;
scene.add(shimmer);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  // Unfurl progression: 80% complete by t=3s
  const unfurlSpeed = 1.5;
  const unfurl = Math.min(elapsed / unfurlSpeed, 1.0);
  
  ferns.forEach(({ mat }) => {
    mat.uniforms.uTime.value = elapsed;
    mat.uniforms.uUnfurl.value = unfurl;
  });
  
  planeMat.uniforms.uTime.value = elapsed;
  shimmerMat.uniforms.uTime.value = elapsed;
  
  // Static contemplative camera
  camera.position.y = 12 + Math.sin(elapsed * 0.12) * 0.6;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<script src="/audio-reactive.js" defer></script>
</body>
