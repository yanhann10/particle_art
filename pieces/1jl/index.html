<title>m8b · Möbius twist — Shiota web inverts</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#050505; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }

<body>
<div class="id">m8b</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.045);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x221111, 0.8);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
dirLight.position.set(-3, 5, 2);
scene.add(dirLight);

// ── Deterministic RNG
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Suspended sphere
const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(2.8, 0.6, -3.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.35,
  roughness: 0.9,
  metalness: 0.0,
  transparent: true,
  opacity: 0.85
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── Möbius band — appears during twist as a ghostly guide shape
const mobiusGeo = new THREE.BufferGeometry();
const mSegs = 200, mWidth = 0.6;
const mVerts = new Float32Array((mSegs + 1) * 2 * 3);
const mIdx = [];
for (let i = 0; i <= mSegs; i++) {
  const u = (i / mSegs) * Math.PI * 2;
  const halfU = u / 2;
  const R = 2.8;
  for (let j = 0; j < 2; j++) {
    const v = (j - 0.5) * mWidth;
    const idx = (i * 2 + j) * 3;
    mVerts[idx]     = (R + v * Math.cos(halfU)) * Math.cos(u);
    mVerts[idx + 1] = (R + v * Math.cos(halfU)) * Math.sin(u);
    mVerts[idx + 2] = v * Math.sin(halfU);
  }
  if (i < mSegs) {
    const a = i * 2, b = i * 2 + 1, c = (i+1) * 2, d = (i+1) * 2 + 1;
    mIdx.push(a, c, b, b, c, d);
  }
}
mobiusGeo.setAttribute('position', new THREE.BufferAttribute(mVerts, 3));
mobiusGeo.setIndex(mIdx);
mobiusGeo.computeVertexNormals();
const mobiusMat = new THREE.MeshBasicMaterial({
  color: 0x40e0d0,
  transparent: true,
  opacity: 0.0,
  side: THREE.DoubleSide,
  wireframe: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const mobiusMesh = new THREE.Mesh(mobiusGeo, mobiusMat);
mobiusMesh.position.copy(sphereCenter);
mobiusMesh.scale.setScalar(0.9);
scene.add(mobiusMesh);

// ── Room anchors
const ROOM = { w: 18, h: 12, d: 28 };
const anchors = [];

function wallPoint(){
  const face = Math.floor(rng() * 6);
  let x, y, z;
  const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;
  switch(face){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    case 5: z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

const NUM_ANCHORS = 600;
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.1 + rng() * 2.5;
    anchors.push(sphereCenter.clone().add(dir.multiplyScalar(dist)));
  } else {
    anchors.push(wallPoint());
  }
}

// ── Build line segments
const NUM_LINES = 20000;
const linePositions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurfacePoint(from){
  const dir = sphereCenter.clone().sub(from).normalize();
  return sphereCenter.clone().add(dir.multiplyScalar(-sphereRadius * (0.98 + rng()*0.04)));
}

const catA = Math.floor(NUM_LINES * 0.4);
for (let i = 0; i < catA && li < NUM_LINES; i++){
  const a = wallPoint(), b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereCenter) > 12 && rng() > 0.3) { i--; continue; }
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=b.x; linePositions[idx+4]=b.y; linePositions[idx+5]=b.z;
  li++;
}

const catB = Math.floor(NUM_LINES * 0.35);
for (let i = 0; i < catB && li < NUM_LINES; i++){
  const a = anchors[Math.floor(rng() * anchors.length)];
  const ns = sphereSurfacePoint(a);
  ns.x += (rng()-0.5)*0.5; ns.y += (rng()-0.5)*0.5; ns.z += (rng()-0.5)*0.5;
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=ns.x; linePositions[idx+4]=ns.y; linePositions[idx+5]=ns.z;
  li++;
}

const catC = NUM_LINES - li;
for (let i = 0; i < catC && li < NUM_LINES; i++){
  const ai = Math.floor(rng() * anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 8; j++){
    const bi = Math.floor(rng() * anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.2){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) best = wallPoint();
  const idx = li * 6;
  linePositions[idx]=a.x; linePositions[idx+1]=a.y; linePositions[idx+2]=a.z;
  linePositions[idx+3]=best.x; linePositions[idx+4]=best.y; linePositions[idx+5]=best.z;
  li++;
}

const basePositions = new Float32Array(linePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Dark fragments
const fragments = [];
const NUM_FRAGMENTS = 18;
for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.05 + rng()*0.15;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(size, size*(0.3+rng()*1.4), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.04+rng()*0.06, 0.02+rng()*0.03, 0.02+rng()*0.02),
    transparent: true, opacity: 0.6+rng()*0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = rng();
  const segIdx = Math.floor(rng() * li) * 6;
  mesh.position.set(
    basePositions[segIdx]*(1-t)+basePositions[segIdx+3]*t,
    basePositions[segIdx+1]*(1-t)+basePositions[segIdx+4]*t,
    basePositions[segIdx+2]*(1-t)+basePositions[segIdx+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  mesh.userData.basePos = mesh.position.clone();
  mesh.userData.baseColor = mat.color.clone();
  fragments.push(mesh);
  scene.add(mesh);
}

// ── Möbius twist parameters
// Jean Tinguely-style: orderly → brief mechanical surprise → self-recovery
const TWIST_PERIOD = 20.0;   // seconds between twists
const TWIST_DURATION = 5.0;  // how long the twist event lasts
const TWIST_ONSET = 8.0;     // first twist starts after this many seconds

function twistEnvelope(elapsed) {
  if (elapsed < TWIST_ONSET) return 0;
  const t = (elapsed - TWIST_ONSET) % TWIST_PERIOD;
  if (t > TWIST_DURATION) return 0;
  // smooth bell: sin²
  const p = Math.sin(Math.PI * t / TWIST_DURATION);
  return p * p;
}

// ── Camera path
const cameraPath = { radius: 6.5, height: 0.8, speed: 0.018, lookBias: new THREE.Vector3(0.5, 0.3, 0) };

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Temp vectors for twist math
const _rel = new THREE.Vector3();
const _twisted = new THREE.Vector3();
const redColor = new THREE.Color(0xc20018);
const tealColor = new THREE.Color(0x18c2a0);
const whiteColor = new THREE.Color(0xf0e8dc);
const darkColor = new THREE.Color(0x0a0608);
const mixColor = new THREE.Color();

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const twist = twistEnvelope(elapsed);

  // Möbius twist: rotate each vertex around the sphere's Y-axis
  // by an angle that depends on its height relative to sphere center.
  // This creates the characteristic half-twist of a Möbius band.
  const breathAmp = 0.015;
  const breathFreq = 0.3;
  const posAttr = lineGeo.attributes.position;
  const arr = posAttr.array;

  const twistAngle = twist * Math.PI; // half-turn at peak

  for (let i = 0; i < li * 6; i += 3){
    const bx = basePositions[i];
    const by = basePositions[i+1];
    const bz = basePositions[i+2];

    // breathing
    const phase = bx*0.7 + by*1.1 + bz*0.5;
    const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;
    let px = bx + b;
    let py = by + b * 0.7;
    let pz = bz + b * 0.5;

    // Möbius twist around sphere center Y-axis
    if (twist > 0.001) {
      _rel.set(px - sphereCenter.x, py - sphereCenter.y, pz - sphereCenter.z);
      const dist = Math.sqrt(_rel.x*_rel.x + _rel.z*_rel.z);
      // twist angle varies with height — the Möbius half-twist signature
      const heightNorm = Math.atan2(_rel.y, dist) / (Math.PI * 0.5);
      const localAngle = twistAngle * heightNorm;
      const cosA = Math.cos(localAngle);
      const sinA = Math.sin(localAngle);
      // rotate in XZ plane around sphere center
      const rx = _rel.x * cosA - _rel.z * sinA;
      const rz = _rel.x * sinA + _rel.z * cosA;
      px = sphereCenter.x + rx;
      py = sphereCenter.y + _rel.y;
      pz = sphereCenter.z + rz;
    }

    arr[i]   = px;
    arr[i+1] = py;
    arr[i+2] = pz;
  }
  posAttr.needsUpdate = true;

  // Thread color: red → teal during twist
  mixColor.copy(redColor).lerp(tealColor, twist);
  lineMat.color.copy(mixColor);
  // slightly boost opacity during twist for visibility
  lineMat.opacity = 0.07 + twist * 0.04;

  // Sphere: white → dark void during twist (inside-out moment)
  sphereMat.color.copy(whiteColor).lerp(darkColor, twist);
  sphereMat.emissive.copy(whiteColor).lerp(darkColor, twist);
  sphereMat.emissiveIntensity = 0.35 * (1 - twist) + 0.05 * twist;
  sphereMat.opacity = 0.85 - twist * 0.4;

  // Möbius wireframe guide fades in during twist
  mobiusMat.opacity = twist * 0.12;
  mobiusMesh.rotation.y = elapsed * 0.15;
  mobiusMesh.rotation.x = Math.sin(elapsed * 0.08) * 0.3;

  // Fragments drift slightly during twist
  for (const frag of fragments) {
    if (twist > 0.001) {
      const bp = frag.userData.basePos;
      _rel.set(bp.x - sphereCenter.x, bp.y - sphereCenter.y, bp.z - sphereCenter.z);
      const dist = Math.sqrt(_rel.x*_rel.x + _rel.z*_rel.z);
      const hn = Math.atan2(_rel.y, dist) / (Math.PI * 0.5);
      const la = twistAngle * hn;
      const c = Math.cos(la), s = Math.sin(la);
      frag.position.set(
        sphereCenter.x + _rel.x*c - _rel.z*s,
        sphereCenter.y + _rel.y,
        sphereCenter.z + _rel.x*s + _rel.z*c
      );
      frag.rotation.y += twist * 0.02;
      frag.material.color.copy(frag.userData.baseColor).lerp(tealColor, twist * 0.3);
    } else {
      frag.position.copy(frag.userData.basePos);
    }
  }

  // Camera dolly
  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  camera.position.set(
    sphereCenter.x + Math.cos(angle) * cr,
    sphereCenter.y + cameraPath.height + Math.sin(elapsed * 0.012) * 1.5,
    sphereCenter.z + Math.sin(angle) * cr
  );
  const lookTarget = sphereCenter.clone();
  lookTarget.x += Math.sin(elapsed * 0.04) * cameraPath.lookBias.x;
  lookTarget.y += Math.cos(elapsed * 0.03) * cameraPath.lookBias.y;
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
