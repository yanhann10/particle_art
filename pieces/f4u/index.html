<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f4u · living archive reef morph</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#041418; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">f4u</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x041418, 0.028);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 28);
camera.lookAt(0, 4, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x041418, 1);
document.body.appendChild(renderer.domElement);

// underwater lighting — caustic-like ripple from above
const light1 = new THREE.DirectionalLight(0x4de3e3, 1.8);
light1.position.set(5, 20, 3);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xff6b9d, 0.9);
light2.position.set(-8, 15, -6);
scene.add(light2);
const amb = new THREE.AmbientLight(0x1a3f44, 0.6);
scene.add(amb);

// substrate plane — dark reef floor
const substrate = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x0a1b1f, roughness: 0.9, metalness: 0.1 })
);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = 0;
substrate.receiveShadow = true;
scene.add(substrate);

// coral species archetypes — each is a procedural generator function
// returns InstancedMesh with N instances positioned in a cluster
function genBranchingCoral(N, seed){
  const geom = new THREE.CylinderGeometry(0.08, 0.12, 1.2, 6, 4);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff6b9d, roughness: 0.4, metalness: 0.15,
    emissive: 0xff6b9d, emissiveIntensity: 0.12
  });
  const mesh = new THREE.InstancedMesh(geom, mat, N);
  const dummy = new THREE.Object3D();
  const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed >>> 0) / 4294967296; };
  for (let i = 0; i < N; i++){
    const x = (rng() - 0.5) * 3;
    const z = (rng() - 0.5) * 3;
    const y = 0.6 + rng() * 1.5;
    dummy.position.set(x, y, z);
    dummy.rotation.set(rng() * 0.4, rng() * Math.PI * 2, rng() * 0.4);
    const s = 0.7 + rng() * 0.6;
    dummy.scale.set(s, s * (0.8 + rng() * 0.5), s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}

function genPlateCoral(N, seed){
  const geom = new THREE.CylinderGeometry(0.9, 0.5, 0.15, 16, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x4de3e3, roughness: 0.5, metalness: 0.2,
    emissive: 0x4de3e3, emissiveIntensity: 0.10
  });
  const mesh = new THREE.InstancedMesh(geom, mat, N);
  const dummy = new THREE.Object3D();
  const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed >>> 0) / 4294967296; };
  for (let i = 0; i < N; i++){
    const x = (rng() - 0.5) * 3.5;
    const z = (rng() - 0.5) * 3.5;
    const y = 0.2 + rng() * 0.8;
    dummy.position.set(x, y, z);
    dummy.rotation.set(0, rng() * Math.PI * 2, 0);
    const s = 0.6 + rng() * 0.8;
    dummy.scale.set(s, 1, s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}

function genBrainCoral(N, seed){
  const geom = new THREE.SphereGeometry(0.4, 12, 8);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xaaff66, roughness: 0.6, metalness: 0.1,
    emissive: 0x88dd44, emissiveIntensity: 0.08
  });
  const mesh = new THREE.InstancedMesh(geom, mat, N);
  const dummy = new THREE.Object3D();
  const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed >>> 0) / 4294967296; };
  for (let i = 0; i < N; i++){
    const x = (rng() - 0.5) * 2.8;
    const z = (rng() - 0.5) * 2.8;
    const y = 0.3 + rng() * 0.5;
    dummy.position.set(x, y, z);
    const s = 0.5 + rng() * 0.7;
    dummy.scale.set(s, s * 0.8, s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}

function genTubeCoral(N, seed){
  const geom = new THREE.CylinderGeometry(0.06, 0.06, 1.0, 8, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xff9966, roughness: 0.5, metalness: 0.2,
    emissive: 0xff7744, emissiveIntensity: 0.1
  });
  const mesh = new THREE.InstancedMesh(geom, mat, N);
  const dummy = new THREE.Object3D();
  const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed >>> 0) / 4294967296; };
  for (let i = 0; i < N; i++){
    const x = (rng() - 0.5) * 2.5;
    const z = (rng() - 0.5) * 2.5;
    const y = 0.5 + rng() * 1.2;
    dummy.position.set(x, y, z);
    dummy.rotation.set(rng() * 0.3, rng() * Math.PI * 2, rng() * 0.3);
    const s = 0.6 + rng() * 0.5;
    dummy.scale.set(s, s * (0.9 + rng() * 0.4), s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  return mesh;
}

// colony grid — 5×5 grid of coral colonies, each colony drifts through species-space
const GRID = 5;
const SPACING = 9;
const colonies = [];
for (let gx = 0; gx < GRID; gx++){
  for (let gz = 0; gz < GRID; gz++){
    const cx = (gx - (GRID - 1) / 2) * SPACING;
    const cz = (gz - (GRID - 1) / 2) * SPACING;
    const seed = gx * 1000 + gz * 100 + 0xC0FFEE;
    const colony = {
      x: cx, z: cz,
      seed,
      // latent space coords — 4D Perlin will drift these over time
      latent: [Math.random(), Math.random(), Math.random(), Math.random()],
      meshes: [
        genBranchingCoral(18, seed + 1),
        genPlateCoral(12, seed + 2),
        genBrainCoral(10, seed + 3),
        genTubeCoral(20, seed + 4)
      ],
      group: new THREE.Group()
    };
    colony.meshes.forEach(m => colony.group.add(m));
    colony.group.position.set(cx, 0, cz);
    scene.add(colony.group);
    colonies.push(colony);
  }
}

// Perlin-4D for latent drift (simplified octave implementation)
function perlin4d(x, y, z, w, seed){
  const p = (seed * 12345) % 256;
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + t * (b - a);
  const grad = (hash, x, y, z, w) => {
    const h = hash & 15;
    const u = h < 8 ? x : y;
    const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    const s = h < 2 ? z : w;
    return ((h & 1) === 0 ? u : -u) + ((h & 2) === 0 ? v : -v) + ((h & 4) === 0 ? s : -s);
  };
  const hash = (i) => ((i * 2654435761 ^ p) >>> 0) % 256;
  const xi = Math.floor(x) & 255;
  const yi = Math.floor(y) & 255;
  const zi = Math.floor(z) & 255;
  const wi = Math.floor(w) & 255;
  const xf = x - Math.floor(x);
  const yf = y - Math.floor(y);
  const zf = z - Math.floor(z);
  const wf = w - Math.floor(w);
  const u = fade(xf), v = fade(yf), t = fade(zf), s = fade(wf);
  const a = hash(xi) + yi;
  const aa = hash(a) + zi;
  const aaa = hash(aa) + wi;
  const aab = hash(aa + 1) + wi;
  const ab = hash(a + 1) + zi;
  const aba = hash(ab) + wi;
  const abb = hash(ab + 1) + wi;
  const b = hash(xi + 1) + yi;
  const ba = hash(b) + zi;
  const baa = hash(ba) + wi;
  const bab = hash(ba + 1) + wi;
  const bb = hash(b + 1) + zi;
  const bba = hash(bb) + wi;
  const bbb = hash(bb + 1) + wi;
  const x1 = lerp(grad(hash(aaa), xf, yf, zf, wf), grad(hash(baa), xf - 1, yf, zf, wf), u);
  const x2 = lerp(grad(hash(aba), xf, yf - 1, zf, wf), grad(hash(bba), xf - 1, yf - 1, zf, wf), u);
  const y1 = lerp(x1, x2, v);
  const x3 = lerp(grad(hash(aab), xf, yf, zf - 1, wf), grad(hash(bab), xf - 1, yf, zf - 1, wf), u);
  const x4 = lerp(grad(hash(abb), xf, yf - 1, zf - 1, wf), grad(hash(bbb), xf - 1, yf - 1, zf - 1, wf), u);
  const y2 = lerp(x3, x4, v);
  const z1 = lerp(y1, y2, t);
  const x5 = lerp(grad(hash(aaa + 1), xf, yf, zf, wf - 1), grad(hash(baa + 1), xf - 1, yf, zf, wf - 1), u);
  const x6 = lerp(grad(hash(aba + 1), xf, yf - 1, zf, wf - 1), grad(hash(bba + 1), xf - 1, yf - 1, zf, wf - 1), u);
  const y3 = lerp(x5, x6, v);
  const x7 = lerp(grad(hash(aab + 1), xf, yf, zf - 1, wf - 1), grad(hash(bab + 1), xf - 1, yf, zf - 1, wf - 1), u);
  const x8 = lerp(grad(hash(abb + 1), xf, yf - 1, zf - 1, wf - 1), grad(hash(bbb + 1), xf - 1, yf - 1, zf - 1, wf - 1), u);
  const y4 = lerp(x7, x8, v);
  const z2 = lerp(y3, y4, t);
  return lerp(z1, z2, s);
}

// plankton particles — drift in front of reef
const PLANKTON = 8000;
const planktonGeom = new THREE.BufferGeometry();
const planktonPos = new Float32Array(PLANKTON * 3);
const planktonVel = new Float32Array(PLANKTON * 3);
const planktonSeed = new Float32Array(PLANKTON);
for (let i = 0; i < PLANKTON; i++){
  planktonPos[i * 3] = (Math.random() - 0.5) * 80;
  planktonPos[i * 3 + 1] = Math.random() * 20;
  planktonPos[i * 3 + 2] = (Math.random() - 0.5) * 80;
  planktonVel[i * 3] = (Math.random() - 0.5) * 0.02;
  planktonVel[i * 3 + 1] = (Math.random() - 0.5) * 0.01;
  planktonVel[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
  planktonSeed[i] = Math.random();
}
planktonGeom.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
planktonGeom.setAttribute('velocity', new THREE.BufferAttribute(planktonVel, 3));
planktonGeom.setAttribute('seed', new THREE.BufferAttribute(planktonSeed, 1));

const planktonMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute vec3 velocity;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.3 + seed * 6.28;
      p += velocity * uTime * 10.0;
      p.x += sin(t) * 0.4;
      p.z += cos(t * 0.8) * 0.4;
      if (p.x < -40.0) p.x += 80.0;
      if (p.x > 40.0) p.x -= 80.0;
      if (p.z < -40.0) p.z += 80.0;
      if (p.z > 40.0) p.z -= 80.0;
      if (p.y < 0.0) p.y += 20.0;
      if (p.y > 20.0) p.y -= 20.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
      float pulse = 0.5 + 0.5 * sin(t * 1.2);
      vAlpha = 0.3 + 0.4 * pulse;
      vec3 c1 = vec3(0.3, 0.87, 0.87);
      vec3 c2 = vec3(1.0, 0.42, 0.62);
      vec3 c3 = vec3(0.67, 1.0, 0.4);
      float h = fract(seed * 3.0);
      if (h < 0.33) vCol = c1;
      else if (h < 0.66) vCol = c2;
      else vCol = c3;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const plankton = new THREE.Points(planktonGeom, planktonMat);
scene.add(plankton);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  planktonMat.uniforms.uTime.value = t;

  // drift each colony through latent space via 4D Perlin, morph species mix
  colonies.forEach((col, ci) => {
    const drift_speed = 0.08;
    const scale = 0.4;
    for (let d = 0; d < 4; d++){
      const n = perlin4d(
        col.x * scale, col.z * scale, t * drift_speed, d * 100 + col.seed, col.seed
      );
      col.latent[d] = 0.5 + 0.5 * n;
    }
    // map latent to species weights [branching, plate, brain, tube]
    const w = col.latent.slice();
    const sum = w.reduce((a, b) => a + b, 0);
    w.forEach((_, i) => w[i] /= sum);
    // scale + opacity per species
    col.meshes.forEach((mesh, mi) => {
      const target = w[mi];
      const s = 0.4 + target * 0.6;
      mesh.scale.set(s, s, s);
      mesh.material.opacity = 0.3 + target * 0.7;
      mesh.material.transparent = true;
    });
  });

  // slow camera orbit
  const ang = t * 0.04;
  const r = 28;
  camera.position.x = Math.sin(ang) * r;
  camera.position.z = Math.cos(ang) * r;
  camera.position.y = 12 + Math.sin(t * 0.06) * 2;
  camera.lookAt(0, 4, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
