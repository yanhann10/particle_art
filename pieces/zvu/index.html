<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zvu · climate text streams</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050608; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">zvu</div>
<div class="hint">drag to orbit · truth/distortion nodes split the flow</div>
<div class="src">Gaëtan Robillard · Critical Climate Machine · text stream field</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Climate misinformation streams as kinetic data sculpture.
   Text glyphs flow through transparent volumes; 'truth' nodes
   straighten the field, 'distortion' nodes add turbulence.
   The flow splits into clean and chaotic branches. */

const BG = 0x050608;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.022);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// --- nodes: truth straightens field, distortion adds curl ---
const nodes = [
  { pos: new THREE.Vector3(-4, 2, -1), type: 'truth', strength: 1.2 },
  { pos: new THREE.Vector3(3, -1, 2), type: 'distortion', strength: 1.5 },
  { pos: new THREE.Vector3(-2, -2, 3), type: 'truth', strength: 0.9 },
  { pos: new THREE.Vector3(5, 1, -2), type: 'distortion', strength: 1.8 },
  { pos: new THREE.Vector3(0, 3, 0), type: 'truth', strength: 1.0 }
];

// node markers: small labeled spheres
nodes.forEach(n => {
  const geom = new THREE.SphereGeometry(0.15, 16, 12);
  const mat = new THREE.MeshBasicMaterial({
    color: n.type === 'truth' ? 0x1a5f6f : 0x6f2a1a,
    transparent: true,
    opacity: 0.7
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.copy(n.pos);
  scene.add(mesh);

  // connecting lines to origin (schematic wiring)
  const lineGeom = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0),
    n.pos
  ]);
  const lineMat = new THREE.LineBasicMaterial({
    color: n.type === 'truth' ? 0x0d3d47 : 0x3d1a0d,
    transparent: true,
    opacity: 0.25
  });
  const line = new THREE.Line(lineGeom, lineMat);
  scene.add(line);
});

// --- vector field function ---
function fieldAt(p, t) {
  let vx = 0, vy = 0, vz = 0.3; // base drift toward +Z
  nodes.forEach(n => {
    const d = p.distanceTo(n.pos);
    if (d < 0.01) return;
    const falloff = Math.exp(-d * 0.4) * n.strength;
    const dir = new THREE.Vector3().subVectors(n.pos, p).normalize();
    if (n.type === 'truth') {
      // truth pulls flow toward Z-axis straightening (remove XY curl)
      vx += -p.x * falloff * 0.2;
      vy += -p.y * falloff * 0.2;
      vz += falloff * 0.4;
    } else {
      // distortion adds curl
      const curl = Math.sin(t * 0.5 + p.x * 0.4 + p.z * 0.3) * falloff;
      vx += dir.y * curl;
      vy += -dir.x * curl;
      vz += dir.z * falloff * 0.3;
    }
  });
  return new THREE.Vector3(vx, vy, vz);
}

// --- text glyphs as particles ---
const WORDS = [
  'CO2', '+1.5°C', 'MELT', 'ARCTIC', 'CONSENSUS', 'HOAX', 'DATA', 'FUNDING',
  'GREENLAND', 'METHANE', 'MODELS', 'FRAUD', 'IPCC', 'FOSSIL', 'RENEWABLE',
  'DROUGHT', 'FLOOD', 'OPINION', 'EVIDENCE', 'SPIN', 'FACT', 'NARRATIVE'
];

const N_GLYPHS = 40000;
const particles = [];
for (let i = 0; i < N_GLYPHS; i++) {
  const word = WORDS[Math.floor(Math.random() * WORDS.length)];
  const theta = Math.random() * Math.PI * 2;
  const rad = 1 + Math.random() * 4;
  particles.push({
    pos: new THREE.Vector3(
      Math.cos(theta) * rad,
      (Math.random() - 0.5) * 4,
      -10 + Math.random() * 2
    ),
    vel: new THREE.Vector3(0, 0, 0),
    word,
    seed: Math.random(),
    age: Math.random()
  });
}

// --- render as textured sprites ---
const canvas = document.createElement('canvas');
canvas.width = 512;
canvas.height = 512;
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, 512, 512);
ctx.fillStyle = '#2da8b8';
ctx.font = 'bold 48px ui-monospace';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('TEXT', 256, 256);
const texture = new THREE.CanvasTexture(canvas);

const geom = new THREE.BufferGeometry();
const pos = new Float32Array(N_GLYPHS * 3);
const seeds = new Float32Array(N_GLYPHS);
const ages = new Float32Array(N_GLYPHS);
for (let i = 0; i < N_GLYPHS; i++) {
  pos[i * 3] = particles[i].pos.x;
  pos[i * 3 + 1] = particles[i].pos.y;
  pos[i * 3 + 2] = particles[i].pos.z;
  seeds[i] = particles[i].seed;
  ages[i] = particles[i].age;
}
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('age', new THREE.BufferAttribute(ages, 1));

const uniforms = {
  uTime: { value: 0 },
  uTex: { value: texture },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    varying vec2 vUv;
    varying float vAlpha;

    void main() {
      vec3 p = position;
      
      // gentle perpendicular jitter (reading the turbulence)
      float jitter = sin(uTime * 1.2 + seed * 40.0) * 0.02;
      p.x += jitter;
      p.y += cos(uTime * 0.8 + seed * 30.0) * 0.015;

      vAlpha = 0.35 + age * 0.25;
      vUv = vec2(0.5);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.2 * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying vec2 vUv;
    varying float vAlpha;

    void main() {
      vec2 uv = gl_PointCoord;
      vec4 tex = texture2D(uTex, uv);
      float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
      
      // instrument-panel teal
      vec3 col = vec3(0.18, 0.66, 0.72);
      float a = lum * vAlpha;
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// transparent containment volumes (wireframe boxes)
const boxGeom = new THREE.BoxGeometry(8, 6, 4);
const boxMat = new THREE.MeshBasicMaterial({
  color: 0x1a3d47,
  transparent: true,
  opacity: 0.08,
  wireframe: true
});
const box1 = new THREE.Mesh(boxGeom, boxMat);
box1.position.set(-2, 0, 0);
scene.add(box1);
const box2 = new THREE.Mesh(boxGeom.clone(), boxMat.clone());
box2.position.set(3, 1, -1);
box2.scale.set(0.7, 0.9, 1.2);
scene.add(box2);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // update particle positions via vector field
  for (let i = 0; i < N_GLYPHS; i++) {
    const p = particles[i];
    const field = fieldAt(p.pos, t);
    p.vel.lerp(field, 0.05);
    p.pos.add(p.vel.clone().multiplyScalar(0.016));
    
    // wrap Z (loop the stream)
    if (p.pos.z > 12) {
      p.pos.z = -12;
      const theta = Math.random() * Math.PI * 2;
      const rad = 1 + Math.random() * 4;
      p.pos.x = Math.cos(theta) * rad;
      p.pos.y = (Math.random() - 0.5) * 4;
    }
    
    p.age += 0.001;
    if (p.age > 1) p.age = 0;
    
    pos[i * 3] = p.pos.x;
    pos[i * 3 + 1] = p.pos.y;
    pos[i * 3 + 2] = p.pos.z;
    ages[i] = p.age;
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;

  // gentle box rotation
  box1.rotation.y = t * 0.08;
  box2.rotation.x = t * 0.06;
  box2.rotation.z = t * 0.04;

  // camera orbits slowly
  camera.position.x = Math.sin(t * 0.05) * 16;
  camera.position.z = Math.cos(t * 0.05) * 16;
  camera.lookAt(0, 0, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
