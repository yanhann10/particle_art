<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cp2 · vera molnar désordres</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4efe6; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">cp2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4efe6, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 15);

/* ── grid params ── */
const COLS = 34, ROWS = 34;
const CELL = 0.30;
const NESTING = 4;

/* ── deterministic rng ── */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ── build line-segment geometry ── */
const segsPerCell = NESTING * 4;
const totalVerts = COLS * ROWS * segsPerCell * 2;
const pos    = new Float32Array(totalVerts * 3);
const aChaos = new Float32Array(totalVerts);
const aSeed  = new Float32Array(totalVerts * 4);
const aCenter = new Float32Array(totalVerts * 2);
const aRowCol = new Float32Array(totalVerts * 2);

let vi = 0;
for (let row = 0; row < ROWS; row++) {
  for (let col = 0; col < COLS; col++) {
    const cx = (col - COLS / 2 + 0.5) * CELL;
    const cy = ((ROWS - 1 - row) - ROWS / 2 + 0.5) * CELL;
    /* chaos: 0 at top (row=0), 1 at bottom (row=ROWS-1) */
    const ch = Math.pow(row / (ROWS - 1), 1.6);
    const rng = mulberry32(row * 997 + col * 53 + 7);

    for (let n = 0; n < NESTING; n++) {
      const half = CELL * 0.44 * (1.0 - n * 0.21);
      /* per-square rotation seed */
      const sqSeed = [rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1];
      const corners = [
        [cx - half, cy - half],
        [cx + half, cy - half],
        [cx + half, cy + half],
        [cx - half, cy + half]
      ];

      for (let e = 0; e < 4; e++) {
        const p0 = corners[e];
        const p1 = corners[(e + 1) % 4];

        for (let v = 0; v < 2; v++) {
          const pp = v === 0 ? p0 : p1;
          const i3 = vi * 3;
          pos[i3]     = pp[0];
          pos[i3 + 1] = pp[1];
          pos[i3 + 2] = 0;
          aChaos[vi] = ch;
          const i4 = vi * 4;
          aSeed[i4]     = sqSeed[0];
          aSeed[i4 + 1] = sqSeed[1];
          aSeed[i4 + 2] = rng() * 2 - 1;
          aSeed[i4 + 3] = rng() * 2 - 1;
          const i2 = vi * 2;
          aCenter[i2]     = cx;
          aCenter[i2 + 1] = cy;
          aRowCol[i2]     = row / (ROWS - 1);
          aRowCol[i2 + 1] = col / (COLS - 1);
          vi++;
        }
      }
    }
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('aChaos',   new THREE.BufferAttribute(aChaos, 1));
geom.setAttribute('aSeed',    new THREE.BufferAttribute(aSeed, 4));
geom.setAttribute('aCenter',  new THREE.BufferAttribute(aCenter, 2));
geom.setAttribute('aRowCol',  new THREE.BufferAttribute(aRowCol, 2));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0 },
    uInk:   { value: new THREE.Color(0x121218) },
    uCobalt:{ value: new THREE.Color(0x1e3a6b) }
  },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    attribute float aChaos;
    attribute vec4  aSeed;
    attribute vec2  aCenter;
    attribute vec2  aRowCol;
    uniform float uTime;
    varying float vChaos;
    varying float vDepth;
    varying float vRowNorm;

    void main() {
      vChaos   = aChaos;
      vRowNorm = aRowCol.x;

      vec3 p = position;

      /* travelling wave: a slow sine adds temporal breath to the static gradient */
      float wave = 0.18 * sin(uTime * 0.28 - aRowCol.x * 5.0 + aRowCol.y * 1.5);
      float chaos = clamp(aChaos + wave, 0.0, 1.0);

      /* rotation around cell center */
      float angle = chaos * aSeed.x * 0.7;
      float ca = cos(angle), sa = sin(angle);
      vec2 local = p.xy - aCenter;
      vec2 rotated = vec2(local.x * ca - local.y * sa,
                          local.x * sa + local.y * ca);
      p.xy = aCenter + rotated;

      /* per-vertex displacement */
      float disp = chaos * 0.08;
      p.x += aSeed.z * disp * (1.0 + 0.25 * sin(uTime * 0.32 + aSeed.w * 6.28));
      p.y += aSeed.w * disp * (1.0 + 0.25 * cos(uTime * 0.27 + aSeed.z * 6.28));

      /* z-lift: disorder rises off the page */
      p.z += chaos * chaos * 0.35 * (1.0 + 0.2 * sin(uTime * 0.18 + aSeed.x * 4.0));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3  uInk;
    uniform vec3  uCobalt;
    uniform float uTime;
    varying float vChaos;
    varying float vDepth;
    varying float vRowNorm;

    void main() {
      /* ink → cobalt at high chaos */
      vec3 col = mix(uInk, uCobalt, smoothstep(0.3, 0.9, vChaos) * 0.55);

      /* depth fade toward paper color */
      float depthFade = 1.0 - smoothstep(10.0, 22.0, vDepth);

      /* opacity: denser at order end, slightly translucent at chaos end */
      float alpha = mix(0.92, 0.55, vChaos * 0.6) * depthFade;

      gl_FragColor = vec4(col, alpha);
    }
  `
});

const lines = new THREE.LineSegments(geom, mat);
scene.add(lines);

/* ── paper grain overlay ── */
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    void main() {
      float n = hash(vUv * 900.0 + fract(uTime * 0.05) * 100.0);
      /* subtle warm grain — darker and lighter speckles */
      float grain = (n - 0.5) * 0.055;
      gl_FragColor = vec4(vec3(grain < 0.0 ? 0.0 : 0.15), abs(grain));
    }
  `
});
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat));

/* ── subtle vignette ── */
const vignetteMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main() {
      vec2 c = vUv - 0.5;
      float d = dot(c, c);
      float v = smoothstep(0.15, 0.65, d) * 0.18;
      gl_FragColor = vec4(vec3(0.08, 0.06, 0.04), v);
    }
  `
});
const vignetteScene = new THREE.Scene();
vignetteScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vignetteMat));

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── loop ── */
function loop() {
  const t = performance.now() / 1000;
  mat.uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;

  /* slow orbit — mostly frontal, gentle reveal of z-depth */
  const ang = t * 0.06;
  const r = 15;
  camera.position.x = Math.sin(ang) * r * 0.22;
  camera.position.z = r * (0.85 + 0.15 * Math.cos(ang * 0.7));
  camera.position.y = Math.sin(ang * 0.45) * r * 0.10;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.render(vignetteScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
