<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: cascade, intensity: gentle -->
<title>xau · narcissus fox · mirror-flip murmuration</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a090d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size:11px;
           letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px;
           letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">xau</div>
<div class="hint" id="hint">loading fox…</div>
<div class="src">Reynolds 1986 · Narcissus · mirror-flip</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 8, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a090d, 1);
document.body.appendChild(renderer.domElement);

/* ── constants ── */
const N = 60000;
const positions   = new Float32Array(N * 3);
const velocities  = new Float32Array(N * 3);
const homePos     = new Float32Array(N * 3);
const origHome    = new Float32Array(N * 3);
const seeds       = new Float32Array(N);
const trails      = new Float32Array(N);
const isRef       = new Float32Array(N);

/* ── init dispersed sphere ── */
for (let i = 0; i < N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const r     = 4 + Math.random() * 10;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  homePos[i*3]     = positions[i*3];
  homePos[i*3+1]   = positions[i*3+1];
  homePos[i*3+2]   = positions[i*3+2];
  const vt = Math.random() * Math.PI * 2;
  const vp = Math.acos(2 * Math.random() - 1);
  const sp = 0.3 + Math.random() * 0.25;
  velocities[i*3]   = sp * Math.sin(vp) * Math.cos(vt);
  velocities[i*3+1] = sp * Math.sin(vp) * Math.sin(vt);
  velocities[i*3+2] = sp * Math.cos(vp);
  seeds[i]  = Math.random();
  trails[i] = Math.random() * 0.3;
  isRef[i]  = 0.0;
}

/* ── shader material ── */
const uniforms = { uTime:{ value:0 }, uPixel:{ value: renderer.getPixelRatio() } };
const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float trail;
    attribute float aRef;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      /* subtle water-distortion for reflected particles */
      if (aRef > 0.5) {
        p.x += sin(p.y * 1.8 + uTime * 0.4) * 0.18;
        p.z += cos(p.y * 1.3 + uTime * 0.25) * 0.12;
      }
      float phase = seed * 6.28 + uTime * 0.25;
      float pulse = 0.5 + 0.5 * sin(phase);
      /* palette: warm dusk for original, cool slate for reflection */
      vec3 c0 = vec3(0.22, 0.18, 0.38);
      vec3 c1 = vec3(0.72, 0.42, 0.48);
      vec3 c2 = vec3(0.85, 0.70, 0.44);
      float blend = smoothstep(0.3, 0.7, pulse);
      vCol = mix(c0, c1, blend);
      vCol = mix(vCol, c2, smoothstep(0.7, 1.0, pulse) * 0.5);
      if (aRef > 0.5) {
        vec3 refTint = vec3(0.28, 0.32, 0.42);
        vCol = mix(vCol, refTint, 0.45);
      }
      vAlpha = 0.55 + 0.35 * pulse + trail * 0.2;
      if (aRef > 0.5) vAlpha *= 0.65;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.3 + 0.7 * pulse + trail * 1.2) * uPixel * (50.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }`
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('trail',    new THREE.BufferAttribute(trails, 1));
geom.setAttribute('aRef',     new THREE.BufferAttribute(isRef, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── mirror plane (invisible until surprise) ── */
const mirrorGeo = new THREE.PlaneGeometry(60, 60);
const mirrorMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { uOpacity: { value: 0 }, uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uOpacity;
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float fade = 1.0 - smoothstep(0.2, 0.85, d);
      float ripple = 0.5 + 0.5 * sin(d * 18.0 - uTime * 0.8);
      float alpha = fade * uOpacity * (0.04 + ripple * 0.025);
      vec3 col = vec3(0.55, 0.58, 0.68);
      gl_FragColor = vec4(col * alpha, alpha);
    }`
});
const mirrorPlane = new THREE.Mesh(mirrorGeo, mirrorMat);
mirrorPlane.rotation.x = -Math.PI / 2;
mirrorPlane.visible = false;
scene.add(mirrorPlane);

/* ── load fox model ── */
let modelLoaded = false;
let modelLoadTime = 0;
let mirrorY = -8;
const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb',
  (gltf) => {
    let targetMesh = null;
    gltf.scene.traverse(child => {
      if (!targetMesh && child.isMesh && child.geometry.attributes.position)
        targetMesh = child;
    });
    if (!targetMesh) return;
    targetMesh.updateWorldMatrix(true, false);
    const geo = targetMesh.geometry.clone();
    geo.applyMatrix4(targetMesh.matrixWorld);
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    const center = new THREE.Vector3();
    bb.getCenter(center);
    const size = new THREE.Vector3();
    bb.getSize(size);
    const scale = 24 / Math.max(size.x, size.y, size.z);
    const samplerMesh = new THREE.Mesh(geo);
    const sampler = new MeshSurfaceSampler(samplerMesh).build();
    const sp = new THREE.Vector3();
    for (let i = 0; i < N; i++) {
      sampler.sample(sp);
      homePos[i*3]   = (sp.x - center.x) * scale;
      homePos[i*3+1] = (sp.y - center.y) * scale;
      homePos[i*3+2] = (sp.z - center.z) * scale;
      origHome[i*3]   = homePos[i*3];
      origHome[i*3+1] = homePos[i*3+1];
      origHome[i*3+2] = homePos[i*3+2];
    }
    let yMin = Infinity;
    for (let i = 0; i < N; i++) yMin = Math.min(yMin, origHome[i*3+1]);
    mirrorY = yMin - 1.2;
    modelLoaded = true;
    modelLoadTime = (performance.now() - startT) / 1000;
    document.getElementById('hint').textContent =
      'fox murmuration · Reynolds 1986 · 60k boids';
  },
  undefined,
  () => {
    document.getElementById('hint').textContent = 'murmuration (fallback) · Reynolds 1986';
    for (let i = 0; i < N; i++) {
      origHome[i*3]   = homePos[i*3];
      origHome[i*3+1] = homePos[i*3+1];
      origHome[i*3+2] = homePos[i*3+2];
    }
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── surprise state ── */
let surpriseTriggered = false;
let surpriseStart = 0;
const SURPRISE_DELAY = 14;
const SURPRISE_TRANS  = 5;

function triggerSurprise(elapsed) {
  surpriseTriggered = true;
  surpriseStart = elapsed;
  for (let i = 0; i < N; i++) {
    if (i % 2 === 1) isRef[i] = 1.0;
  }
  geom.attributes.aRef.needsUpdate = true;
  mirrorPlane.position.y = mirrorY;
  mirrorPlane.visible = true;
}

/* ── spatial hash ── */
const PERCEPTION = 3.0, SEP_DIST = 1.0;
const COHESION_F = 0.016, ALIGNMENT_F = 0.065, SEP_F = 0.13;
const BOUNDARY_F = 0.25, HOME_F_BASE = 0.05;
const MAX_SPEED = 1.4, MIN_SPEED = 0.35, BOUNDARY = 35;
const MAX_NEIGHBORS = 10, CELL = PERCEPTION * 1.5;
let grid = new Map();

function cellKey(x,y,z){
  return ((Math.floor(x/CELL)*73856093)^(Math.floor(y/CELL)*19349663)^(Math.floor(z/CELL)*83492791))|0;
}
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<N;i++){
    const k=cellKey(positions[i*3],positions[i*3+1],positions[i*3+2]);
    let b=grid.get(k); if(!b){b=[];grid.set(k,b);} b.push(i);
  }
}
const _off=[];
for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++) _off.push([dx,dy,dz]);
function* neighborIndices(x,y,z){
  const cx=Math.floor(x/CELL),cy=Math.floor(y/CELL),cz=Math.floor(z/CELL);
  for(const[dx,dy,dz] of _off){
    const k=(((cx+dx)*73856093)^((cy+dy)*19349663)^((cz+dz)*83492791))|0;
    const b=grid.get(k); if(b) for(const j of b) yield j;
  }
}

/* ── round-robin boid update ── */
const BATCH = 10000;
let batchStart = 0;

function updateBoids(dt, elapsed){
  rebuildGrid();
  const breathCycle = elapsed * 0.1;
  const gatherPhase = 0.5 + 0.5 * Math.sin(breathCycle);
  const sinceModel = elapsed - modelLoadTime;
  const earlyBoost = (modelLoaded && sinceModel < 6.0) ? 2.5*(1.0-sinceModel/6.0) : 0.0;
  const homeForce = HOME_F_BASE * (0.5 + gatherPhase * 1.2) + earlyBoost * HOME_F_BASE;

  let flipT = 0;
  if (surpriseTriggered) {
    flipT = Math.min((elapsed - surpriseStart) / SURPRISE_TRANS, 1.0);
    flipT = flipT * flipT * (3 - 2 * flipT);
  }

  const end = Math.min(batchStart + BATCH, N);
  for(let i = batchStart; i < end; i++){
    const px=positions[i*3], py=positions[i*3+1], pz=positions[i*3+2];
    let sx=0,sy=0,sz=0;
    let apx=0,apy=0,apz=0, avx=0,avy=0,avz=0;
    let cn=0,an=0,checked=0;

    for(const j of neighborIndices(px,py,pz)){
      if(j===i) continue;
      if(checked >= MAX_NEIGHBORS) break;
      const dx=positions[j*3]-px, dy=positions[j*3+1]-py, dz=positions[j*3+2]-pz;
      const dSq=dx*dx+dy*dy+dz*dz;
      if(dSq < PERCEPTION*PERCEPTION && dSq > 0.001){
        checked++;
        const d=Math.sqrt(dSq);
        apx+=positions[j*3]; apy+=positions[j*3+1]; apz+=positions[j*3+2]; cn++;
        avx+=velocities[j*3]; avy+=velocities[j*3+1]; avz+=velocities[j*3+2]; an++;
        if(d < SEP_DIST){
          const f=(SEP_DIST-d)/SEP_DIST;
          sx-=(dx/d)*f*SEP_F; sy-=(dy/d)*f*SEP_F; sz-=(dz/d)*f*SEP_F;
        }
      }
    }
    if(cn>0){sx+=(apx/cn-px)*COHESION_F;sy+=(apy/cn-py)*COHESION_F;sz+=(apz/cn-pz)*COHESION_F;}
    if(an>0){sx+=(avx/an-velocities[i*3])*ALIGNMENT_F;sy+=(avy/an-velocities[i*3+1])*ALIGNMENT_F;sz+=(avz/an-velocities[i*3+2])*ALIGNMENT_F;}

    /* homing — reflected particles lerp toward mirrored target */
    let hx = origHome[i*3], hy = origHome[i*3+1], hz = origHome[i*3+2];
    if (isRef[i] > 0.5 && surpriseTriggered) {
      const refY = 2 * mirrorY - origHome[i*3+1];
      hy = origHome[i*3+1] + (refY - origHome[i*3+1]) * flipT;
    }
    sx += (hx-px)*homeForce; sy += (hy-py)*homeForce; sz += (hz-pz)*homeForce;

    const dfc=Math.sqrt(px*px+py*py+pz*pz);
    if(dfc > BOUNDARY*0.7){
      const f=Math.pow((dfc-BOUNDARY*0.7)/(BOUNDARY*0.3),2);
      sx-=(px/dfc)*f*BOUNDARY_F; sy-=(py/dfc)*f*BOUNDARY_F; sz-=(pz/dfc)*f*BOUNDARY_F;
    }

    velocities[i*3]+=sx*dt; velocities[i*3+1]+=sy*dt; velocities[i*3+2]+=sz*dt;
    let spd=Math.sqrt(velocities[i*3]**2+velocities[i*3+1]**2+velocities[i*3+2]**2);
    if(spd>MAX_SPEED){const s=MAX_SPEED/spd;velocities[i*3]*=s;velocities[i*3+1]*=s;velocities[i*3+2]*=s;}
    else if(spd<MIN_SPEED&&spd>0.01){const s=MIN_SPEED/spd;velocities[i*3]*=s;velocities[i*3+1]*=s;velocities[i*3+2]*=s;}
    trails[i]=THREE.MathUtils.lerp(trails[i],spd/MAX_SPEED,0.08);
  }

  for(let i=0;i<N;i++){
    positions[i*3]+=velocities[i*3]*dt;
    positions[i*3+1]+=velocities[i*3+1]*dt;
    positions[i*3+2]+=velocities[i*3+2]*dt;
  }
  batchStart = end >= N ? 0 : end;
  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;
  geom.computeBoundingSphere();
}

/* ── camera: fixed with gentle breathing, descends after surprise ── */
const centroid = new THREE.Vector3();
function updateCamera(elapsed){
  centroid.set(0,0,0);
  let cnt=0;
  for(let i=0;i<N;i+=8){
    centroid.x+=positions[i*3]; centroid.y+=positions[i*3+1]; centroid.z+=positions[i*3+2]; cnt++;
  }
  centroid.multiplyScalar(1/cnt);

  const camZ = 50;
  const camX = centroid.x + Math.sin(elapsed * 0.025) * 2.5;
  let camY, lookY;
  if (!surpriseTriggered) {
    camY = centroid.y + 7 + Math.sin(elapsed * 0.06) * 1.5;
    lookY = centroid.y;
  } else {
    const t = Math.min((elapsed - surpriseStart) / 12, 1);
    const ease = t * t * (3 - 2 * t);
    const preY = centroid.y + 7;
    camY = preY + (mirrorY + 1 - preY) * ease;
    lookY = centroid.y + (mirrorY - centroid.y) * ease * 0.6;
  }
  camera.position.set(camX, camY, camZ);
  camera.lookAt(centroid.x, lookY, centroid.z);
}

/* ── main loop ── */
let lastTime = performance.now();
const startT = performance.now();
const hintEl = document.getElementById('hint');
let frameCount = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const elapsed = (now - startT) / 1000;
  uniforms.uTime.value = elapsed;

  if (modelLoaded && !surpriseTriggered && (elapsed - modelLoadTime) > SURPRISE_DELAY) {
    triggerSurprise(elapsed);
    hintEl.textContent = 'narcissus · the fox meets its reflection';
  }

  if (surpriseTriggered) {
    const mT = Math.min((elapsed - surpriseStart) / 3, 1);
    mirrorMat.uniforms.uOpacity.value = mT;
    mirrorMat.uniforms.uTime.value = elapsed;
  }

  updateBoids(dt * 60, elapsed);
  updateCamera(elapsed);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
  <button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
  <button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
  <input id="pc-input" type="text" maxlength="200" placeholder="What to change…"
    style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"
    onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"
    onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
  <button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
