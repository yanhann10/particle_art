<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u7n · folded leaves (naïve hand)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a07; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">u7n</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Folded Leaves: organic combination of different leaf-twirl structures ── */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(7, 4.5, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a07, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

const N = 80000;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float leafId;
    attribute float strokeWeight;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vStroke;

    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;

      /* naïve irregularity: per-particle jitter ~10% */
      float jitter = 0.11;
      p.x += (seed * 2.0 - 1.0) * jitter;
      p.y += (fract(seed * 37.19) * 2.0 - 1.0) * jitter;
      p.z += (fract(seed * 71.43) * 2.0 - 1.0) * jitter;

      /* gentle drift — leaves trembling in still air */
      float drift = 0.05 * sin(t * 0.6 + seed * 12.0);
      p.x += drift;
      p.y += drift * 0.3;

      /* palette: El Anatsui — warm ochre, sienna, copper, dust */
      vec3 ochre  = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 dust   = vec3(0.92, 0.84, 0.66);
      vec3 copper = vec3(0.72, 0.45, 0.28);

      /* color per leaf cluster — hand-chosen asymmetry */
      float leafMod = mod(leafId, 7.0);
      vec3 baseCol = ochre;
      if (leafMod < 1.0) baseCol = sienna;
      else if (leafMod < 2.0) baseCol = copper;
      else if (leafMod < 3.0) baseCol = dust;
      else if (leafMod < 4.0) baseCol = mix(ochre, sienna, 0.5);
      else if (leafMod < 5.0) baseCol = mix(copper, dust, 0.4);
      else if (leafMod < 6.0) baseCol = mix(ochre, copper, 0.6);

      /* subtle variation within leaf — hand-painted feel */
      float colorJitter = seed * 0.15;
      baseCol.r += (fract(seed * 13.7) - 0.5) * colorJitter;
      baseCol.g += (fract(seed * 29.3) - 0.5) * colorJitter;
      baseCol.b += (fract(seed * 41.1) - 0.5) * colorJitter;
      baseCol = clamp(baseCol, 0.0, 1.0);

      vCol = baseCol;
      vAlpha = 0.5 + 0.3 * sin(t * 0.5);
      vStroke = strokeWeight;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* brushstroke variation: some particles 2-4x larger */
      float sizeBase = 36.0 / dist;
      gl_PointSize = uPixel * sizeBase * (0.6 + strokeWeight * 2.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vStroke;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      /* irregular edge softness — not uniform Gaussian */
      float falloff = 12.0 + vStroke * 8.0;
      float a = exp(-r * falloff) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

/* ── Leaf-twirl structure generator ── */
/* Each leaf: curved strip geometry with mid-vein + curling edge */
function buildLeaf(opts){
  const { posBase, rotAxis, curlAmt, lengthScale, widthScale, twist, segments } = opts;
  const particles = [];
  const veinSteps = segments || 30;
  const edgeSteps = Math.floor(veinSteps * 0.6);

  /* mid-vein curve: fern-uncurling arc */
  for (let i = 0; i < veinSteps; i++){
    const t = i / (veinSteps - 1);
    const len = lengthScale * t;
    const curl = curlAmt * Math.pow(t, 1.4);
    const yOff = -curl * Math.sin(t * Math.PI);
    const zOff = curl * Math.cos(t * Math.PI) * 0.5;

    const localPos = new THREE.Vector3(0, len, 0);
    localPos.y += yOff;
    localPos.z += zOff;

    /* twist along vein */
    const twistAng = twist * t * Math.PI;
    const ct = Math.cos(twistAng), st = Math.sin(twistAng);
    const xRot = localPos.x * ct - localPos.z * st;
    const zRot = localPos.x * st + localPos.z * ct;
    localPos.x = xRot;
    localPos.z = zRot;

    /* rotate by leaf orientation axis */
    localPos.applyAxisAngle(rotAxis, opts.angle || 0);
    localPos.add(posBase);

    /* vein particles: higher density, some with stroke emphasis */
    const veinDensity = 80 + Math.floor(Math.random() * 40);
    for (let k = 0; k < veinDensity; k++){
      particles.push({
        pos: localPos.clone(),
        seed: Math.random(),
        strokeWeight: Math.random() > 0.88 ? 1.2 : 0.3
      });
    }

    /* edge particles: wing membrane spreading from vein */
    if (i > 3 && i < veinSteps - 2){
      const edgeWidth = widthScale * Math.sin(t * Math.PI) * (0.7 + Math.random() * 0.3);
      for (let side of [-1, 1]){
        for (let j = 0; j < edgeSteps; j++){
          const u = j / (edgeSteps - 1);
          const edgePos = localPos.clone();
          edgePos.x += side * edgeWidth * u;
          /* edge ripple — asymmetric, hand-drawn */
          const ripple = 0.08 * Math.sin(u * Math.PI * 3 + t * 6.28);
          edgePos.y += ripple * (Math.random() - 0.5);
          edgePos.z += ripple * (Math.random() - 0.5);
          particles.push({
            pos: edgePos,
            seed: Math.random(),
            strokeWeight: 0.2
          });
        }
      }
    }
  }
  return particles;
}

/* ── Leaf arrangement: 7-9 distinct twirl elements, off-grid placement ── */
const leafConfigs = [
  { posBase: new THREE.Vector3(-1.2, 0.3, 0.5), rotAxis: new THREE.Vector3(0,0,1), angle: 0.4, curlAmt: 1.8, lengthScale: 3.2, widthScale: 1.1, twist: 0.6, segments: 32 },
  { posBase: new THREE.Vector3(0.8, -0.5, -0.7), rotAxis: new THREE.Vector3(1,0,0), angle: -0.3, curlAmt: 2.1, lengthScale: 2.9, widthScale: 0.9, twist: -0.5, segments: 28 },
  { posBase: new THREE.Vector3(0.3, 1.2, 0.9), rotAxis: new THREE.Vector3(0.7,0.3,0), angle: 0.8, curlAmt: 1.5, lengthScale: 3.5, widthScale: 1.3, twist: 0.8, segments: 35 },
  { posBase: new THREE.Vector3(-0.9, 2.0, -0.4), rotAxis: new THREE.Vector3(0,1,0), angle: -0.6, curlAmt: 1.9, lengthScale: 2.6, widthScale: 1.0, twist: -0.4, segments: 26 },
  { posBase: new THREE.Vector3(1.5, 0.8, 0.2), rotAxis: new THREE.Vector3(0.4,0.6,0.2), angle: 1.1, curlAmt: 2.3, lengthScale: 3.0, widthScale: 1.2, twist: 0.7, segments: 30 },
  { posBase: new THREE.Vector3(-1.8, 1.5, -0.9), rotAxis: new THREE.Vector3(0.2,0,0.8), angle: -1.0, curlAmt: 1.6, lengthScale: 2.8, widthScale: 0.95, twist: -0.6, segments: 29 },
  { posBase: new THREE.Vector3(0.1, -0.9, 1.2), rotAxis: new THREE.Vector3(0.5,0.5,0), angle: 0.5, curlAmt: 2.0, lengthScale: 3.3, widthScale: 1.15, twist: 0.5, segments: 31 },
  { posBase: new THREE.Vector3(1.1, 2.5, -0.6), rotAxis: new THREE.Vector3(0,0.9,0.1), angle: -0.7, curlAmt: 1.7, lengthScale: 2.7, widthScale: 1.05, twist: -0.7, segments: 27 },
  { posBase: new THREE.Vector3(-0.5, 0.0, -1.1), rotAxis: new THREE.Vector3(0.8,0.2,0), angle: 0.9, curlAmt: 2.2, lengthScale: 3.1, widthScale: 1.25, twist: 0.4, segments: 33 },
];

let allParticles = [];
for (let i = 0; i < leafConfigs.length; i++){
  const leafParticles = buildLeaf(leafConfigs[i]);
  for (const p of leafParticles){
    allParticles.push({ ...p, leafId: i });
  }
}

/* resample to exactly N particles */
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const leafIds = new Float32Array(N);
const strokeWeights = new Float32Array(N);

for (let i = 0; i < N; i++){
  const src = allParticles[Math.floor(Math.random() * allParticles.length)];
  positions[i*3]   = src.pos.x;
  positions[i*3+1] = src.pos.y;
  positions[i*3+2] = src.pos.z;
  seeds[i] = src.seed;
  leafIds[i] = src.leafId;
  strokeWeights[i] = src.strokeWeight;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('leafId', new THREE.BufferAttribute(leafIds, 1));
geom.setAttribute('strokeWeight', new THREE.BufferAttribute(strokeWeights, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
