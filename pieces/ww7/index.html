<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dmc · dandelion-clock surprise</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #150a25; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#22113a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · blow the seeds away</button>
<div class="id">dmc</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
const flightPhase = new Float32Array(N);

for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 4 + s * 2.4;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
    flightPhase[idx] = 0.0;
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('flightPhase', new THREE.BufferAttribute(flightPhase, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBands: { value: uBands },
  uTreble: { value: 0 },
  uBlowTrigger: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform float uBlowTrigger;
    attribute float shellIdx;
    attribute float seed;
    attribute float flightPhase;
    varying vec3 vCol;
    varying float vEnergy;
    varying float vBlow;
    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;
      vEnergy = e;

      vec3 p = position;
      float r = length(p);
      vec3 dir = p / max(r, 0.001);

      // SURPRISE: sudden energy spike (>0.75) triggers dandelion-seed dispersal
      float blowPulse = smoothstep(0.75, 0.85, e);
      float blow = flightPhase + blowPulse * 0.04;
      blow = min(blow, 1.0);
      vBlow = blow;

      if (blow > 0.01) {
        // seeds scatter radially with parachute drift
        vec3 flightDir = dir + vec3(
          sin(seed * 31.4 + uTime * 0.6) * 0.4,
          cos(seed * 19.2) * 0.3,
          sin(seed * 23.7) * 0.3
        );
        flightDir = normalize(flightDir);
        float travelDist = blow * blow * 40.0;
        p += flightDir * travelDist;
        // gentle tumble during flight
        p.x += sin(uTime * 2.0 + seed * 6.28) * blow * 1.2;
        p.y += cos(uTime * 1.7 + seed * 3.14) * blow * 0.8;
      } else {
        // normal shell behavior
        float pulse = 1.0 + e * 0.9;
        p = dir * r * pulse;
        float t = uTime * 0.4 + seed * 6.28 + shellIdx * 0.7;
        vec3 perp = normalize(cross(dir, vec3(0,1,0) + 0.1*sin(seed*9.0)));
        p += perp * sin(t) * (0.4 + e * 1.2);
      }

      // color shift during flight: shells → dandelion white-gold
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan = vec3(0.25, 0.85, 0.95);
      vec3 seedWhite = vec3(0.98, 0.95, 0.88);
      float k = clamp(shellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vec3 shellCol = mix(amber, cyan, k);
      vCol = mix(shellCol, seedWhite, blow);
      vCol *= (0.6 + e * 1.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float pSize = (1.0 + 2.4 * e) * uPixel * (50.0 / dist);
      // seeds become smaller, more delicate
      pSize *= mix(1.0, 0.4, blow);
      gl_PointSize = pSize;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    varying float vBlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.45 + 0.55 * vEnergy);
      // seeds fade as they drift away
      a *= mix(1.0, 0.3, vBlow);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · blow hard to scatter seeds';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic dandelion mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
let lastBlowTime = -10;
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  points.rotation.y = t * 0.04;
  points.rotation.x = Math.sin(t * 0.06) * 0.12;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    // synthetic with occasional blow event
    uBands.x = 0.35 + 0.35 * Math.sin(t*1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    // synthetic blow every 12 seconds
    let treble = 0.18 + 0.18 * Math.sin(t*7.0);
    if (Math.floor(t / 12) > Math.floor((t - 0.016) / 12)) {
      treble = 0.95;
    }
    uniforms.uTreble.value = treble;
  }

  // persist flight phase for scattered seeds
  const maxE = Math.max(uBands.x, uBands.y, uBands.z, uBands.w, uniforms.uTreble.value);
  if (maxE > 0.75 && t - lastBlowTime > 1.0) {
    lastBlowTime = t;
    const fp = geom.attributes.flightPhase.array;
    for (let i = 0; i < N; i++) {
      fp[i] = Math.min(fp[i] + 0.2, 1.0);
    }
    geom.attributes.flightPhase.needsUpdate = true;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
