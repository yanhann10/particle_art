<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ibd · chartreuse</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f1410; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">ibd</div>
<div class="hint">drag to orbit · luminous zones pulse and recede</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Organic folded-leaf clusters: multiple twirled sheets in arrangement ── */
function createLeafTwirl(scale, twist, curlAxis, seedVal){
  const segs = 32;
  const verts = [];
  const rng = () => {
    seedVal = (seedVal * 1103515245 + 12345) & 0x7fffffff;
    return seedVal / 0x7fffffff;
  };
  
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const u = t * Math.PI * 2 * twist;
    const width = 0.8 * scale * Math.sin(t * Math.PI);
    const lengthPos = t * 3.5 * scale;
    
    const curlAngle = u + curlAxis * t * Math.PI * 0.6;
    const radius = lengthPos * 0.15;
    
    const x = Math.cos(curlAngle) * radius;
    const y = lengthPos;
    const z = Math.sin(curlAngle) * radius;
    
    const jitter = 0.08 * scale * rng();
    verts.push(new THREE.Vector3(
      x + width * Math.cos(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5),
      y + jitter * (rng()-0.5),
      z + width * Math.sin(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5)
    ));
    verts.push(new THREE.Vector3(
      x - width * Math.cos(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5),
      y + jitter * (rng()-0.5),
      z - width * Math.sin(curlAngle + Math.PI*0.5) + jitter * (rng()-0.5)
    ));
  }
  
  return verts;
}

function buildLeafCluster(){
  const allVerts = [];
  const centerY = 0;
  
  const arrangements = [
    { scale: 1.2, twist: 1.8, curl: 1.0, rot: 0, offset: new THREE.Vector3(-1.5, centerY, 0.8) },
    { scale: 1.0, twist: 2.2, curl: -1.0, rot: Math.PI*0.4, offset: new THREE.Vector3(1.2, centerY+0.5, -0.6) },
    { scale: 0.9, twist: 1.5, curl: 0.5, rot: Math.PI*0.8, offset: new THREE.Vector3(0.3, centerY-0.8, 1.4) },
    { scale: 1.1, twist: 2.0, curl: -0.7, rot: Math.PI*1.2, offset: new THREE.Vector3(-0.8, centerY+1.2, -1.2) },
    { scale: 0.85, twist: 1.6, curl: 0.8, rot: Math.PI*1.6, offset: new THREE.Vector3(1.8, centerY-0.4, 0.4) },
    { scale: 1.05, twist: 2.4, curl: -0.6, rot: Math.PI*2.0, offset: new THREE.Vector3(-1.0, centerY+0.8, 1.8) },
    { scale: 0.95, twist: 1.9, curl: 1.2, rot: Math.PI*2.4, offset: new THREE.Vector3(0.6, centerY-1.0, -1.6) },
    { scale: 0.88, twist: 2.1, curl: -0.9, rot: Math.PI*2.8, offset: new THREE.Vector3(2.0, centerY+0.2, 1.0) },
  ];
  
  for (const cfg of arrangements){
    const leafVerts = createLeafTwirl(cfg.scale, cfg.twist, cfg.curl, Math.floor(cfg.rot * 1000));
    const quat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), cfg.rot);
    for (const v of leafVerts){
      v.applyQuaternion(quat);
      v.add(cfg.offset);
      allVerts.push(v);
    }
  }
  
  return allVerts;
}

function buildParticles(verts, totalN){
  const positions = new Float32Array(totalN * 3);
  const seeds = new Float32Array(totalN);
  const luminousZones = new Float32Array(totalN);
  
  for (let i = 0; i < totalN; i++){
    const v = verts[Math.floor(Math.random() * verts.length)].clone();
    const jitter = 0.15;
    v.x += (Math.random() - 0.5) * jitter;
    v.y += (Math.random() - 0.5) * jitter;
    v.z += (Math.random() - 0.5) * jitter;
    
    positions[i*3] = v.x;
    positions[i*3+1] = v.y;
    positions[i*3+2] = v.z;
    seeds[i] = Math.random();
    
    const dist = v.length();
    const angle = Math.atan2(v.z, v.x);
    const zone1 = Math.abs(angle - Math.PI*0.25) < 0.6 && dist < 3.5 ? 1.0 : 0.0;
    const zone2 = Math.abs(angle - Math.PI*1.2) < 0.7 && dist > 2.0 ? 1.0 : 0.0;
    const zone3 = v.y > 2.0 && Math.abs(v.x) < 1.2 ? 1.0 : 0.0;
    const zone4 = v.y < -1.5 && dist < 2.8 ? 1.0 : 0.0;
    luminousZones[i] = Math.max(zone1, zone2, zone3, zone4);
  }
  
  return { positions, seeds, luminousZones };
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f1410, 0.08);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.8, 35);
camera.position.set(8, 3, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f1410, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.target.set(0, 0, 0);

const N = 80000;
const leafVerts = buildLeafCluster();
const { positions, seeds, luminousZones } = buildParticles(leafVerts, N);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('luminousZone', new THREE.BufferAttribute(luminousZones, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCamPos: { value: camera.position.clone() },
  uFogDensity: { value: 0.08 },
  uFogColor: { value: new THREE.Color(0x0f1410) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec3 uCamPos;
    uniform float uFogDensity;
    attribute float seed;
    attribute float luminousZone;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    
    void main(){
      vec3 p = position;
      
      float drift = uTime * 0.08 + seed * 6.28;
      p.x += 0.15 * sin(drift * 0.4 + p.y * 0.2);
      p.z += 0.12 * cos(drift * 0.5 + p.y * 0.3);
      p.y += 0.08 * sin(drift * 0.6);
      
      vec3 camDir = normalize(uCamPos - p);
      float distToCam = distance(uCamPos, p);
      
      float pulsePhase = uTime * 0.8 + seed * 3.14;
      float pulse = 0.5 + 0.5 * sin(pulsePhase);
      
      float luminousFade = 1.0;
      if (luminousZone > 0.5){
        float approachDist = smoothstep(10.0, 5.0, distToCam);
        float luminousIntensity = 1.0 + approachDist * pulse * 1.8;
        luminousFade = luminousIntensity;
      }
      
      float viewAngle = dot(camDir, normalize(p));
      float occlusion = smoothstep(-0.3, 0.5, viewAngle);
      
      float layerFog = smoothstep(12.0, 18.0, distToCam) * 0.7;
      float nearClip = smoothstep(1.2, 2.5, distToCam);
      
      vec3 chartreuse = vec3(0.75, 0.98, 0.28);
      vec3 lime = vec3(0.62, 0.88, 0.35);
      vec3 olive = vec3(0.52, 0.72, 0.28);
      vec3 deepGreen = vec3(0.32, 0.52, 0.22);
      
      float energyPhase = seed * 6.28 + uTime * 0.3;
      float energy = 0.5 + 0.5 * sin(energyPhase);
      
      vec3 col = mix(deepGreen, lime, energy);
      
      if (luminousZone > 0.5){
        col = mix(col, chartreuse, pulse * 0.85);
        col = mix(col, lime, (1.0 - pulse) * 0.4);
      } else {
        col = mix(col, olive, 0.6);
      }
      
      vCol = col;
      
      float baseAlpha = 0.5 + 0.3 * energy;
      
      if (luminousZone > 0.5){
        baseAlpha *= luminousFade;
        baseAlpha = min(baseAlpha * 1.5, 1.0);
      }
      
      baseAlpha *= occlusion;
      baseAlpha *= (1.0 - layerFog);
      baseAlpha *= nearClip;
      vAlpha = baseAlpha;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vFogFactor = 1.0 - exp(-uFogDensity * dist * dist * 0.15);
      
      float sizeBoost = luminousZone > 0.5 ? (1.0 + pulse * 0.4) : 1.0;
      gl_PointSize = (1.2 + 0.5 * energy) * sizeBoost * uPixel * (38.0 / max(1.0, dist));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float core = exp(-r * 14.0);
      float a = core * vAlpha;
      
      vec3 col = mix(vCol, uFogColor, vFogFactor * 0.5);
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

geom.computeBoundingSphere();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  uniforms.uCamPos.value.copy(camera.position);
  
  const fogBreathing = 0.08 + 0.03 * Math.sin(elapsed * 0.15);
  uniforms.uFogDensity.value = fogBreathing;
  scene.fog.density = fogBreathing;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
