<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx5 · Lorenz×3 triple attractor</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#030204; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#9a8f82; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#9a8f82; }
</style>
</head>
<body>
<div class="id">fx5</div>
<div class="hint">Lorenz×3 · 120° triple butterfly · slow smoke · orbit drag</div>
<div class="src">fx5 · iter.s4u · Lorenz×3 triple attractor · 3000 particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ── scene setup ───────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 6, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x030204, 1);
document.body.appendChild(renderer.domElement);

// ── Lorenz parameters: three attractors ───────────────────────────────────────
// A: classic (σ=10, ρ=28, β=8/3)   — electric cyan
// B: compressed (σ=10, ρ=28, β=1.5) — warm amber
// C: expanded (σ=16, ρ=45, β=4)    — rose-magenta
const ATTRACTORS = [
  { sigma: 10.0, rho: 28.0, beta: 8.0/3.0,
    r: 0/255, g: 200/255, b: 255/255,         // electric cyan
    rotY: 0.0 },
  { sigma: 10.0, rho: 28.0, beta: 1.5,
    r: 255/255, g: 170/255, b: 30/255,        // warm amber
    rotY: (2.0 * Math.PI) / 3.0 },
  { sigma: 16.0, rho: 45.0, beta: 4.0,
    r: 255/255, g: 60/255, b: 140/255,        // rose-magenta
    rotY: (4.0 * Math.PI) / 3.0 }
];

const N_ATTRACTORS = 3;
const PER_ATTRACTOR = 1000;          // particles per attractor
const TOTAL_ACTIVE = N_ATTRACTORS * PER_ATTRACTOR;  // 3000 active
const TRAIL_FRAMES = 79;             // trail history depth
const SCALE = 0.25;                  // Lorenz coords ÷ 4 → fits ±5 units

const DT = 0.001;
const STEPS_PER_FRAME = 1;

// ── Lorenz state arrays (per attractor) ───────────────────────────────────────
const lx = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];
const ly = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];
const lz = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];

// seed all attractors with different phases
for (let a = 0; a < N_ATTRACTORS; a++) {
  const { rho } = ATTRACTORS[a];
  for (let i = 0; i < PER_ATTRACTOR; i++) {
    const phase = i * 0.1 + a * 2.1;
    lx[a][i] = Math.sin(phase) * 7.5 + (Math.random() - 0.5) * 1.5;
    ly[a][i] = Math.cos(phase) * 7.5 + (Math.random() - 0.5) * 1.5;
    lz[a][i] = rho * 0.9 + Math.sin(phase * 0.7) * 10.0 + (Math.random() - 0.5) * 3.0;
  }
}

// ── RK4 Lorenz step per attractor ────────────────────────────────────────────
const k1x = [0], k1y = [0], k1z = [0];
const k2x = [0], k2y = [0], k2z = [0];
const k3x = [0], k3y = [0], k3z = [0];
const k4x = [0], k4y = [0], k4z = [0];

function lorenzDeriv(sigma, rho, beta, x, y, z, dxO, dyO, dzO) {
  dxO[0] = sigma * (y - x);
  dyO[0] = x * (rho - z) - y;
  dzO[0] = x * y - beta * z;
}

function rk4Step(a, i) {
  const { sigma, rho, beta } = ATTRACTORS[a];
  const x = lx[a][i], y = ly[a][i], z = lz[a][i];
  lorenzDeriv(sigma, rho, beta, x, y, z, k1x, k1y, k1z);
  lorenzDeriv(sigma, rho, beta,
    x + k1x[0]*DT*0.5, y + k1y[0]*DT*0.5, z + k1z[0]*DT*0.5,
    k2x, k2y, k2z);
  lorenzDeriv(sigma, rho, beta,
    x + k2x[0]*DT*0.5, y + k2y[0]*DT*0.5, z + k2z[0]*DT*0.5,
    k3x, k3y, k3z);
  lorenzDeriv(sigma, rho, beta,
    x + k3x[0]*DT, y + k3y[0]*DT, z + k3z[0]*DT,
    k4x, k4y, k4z);
  lx[a][i] = x + (DT/6) * (k1x[0] + 2*k2x[0] + 2*k3x[0] + k4x[0]);
  ly[a][i] = y + (DT/6) * (k1y[0] + 2*k2y[0] + 2*k3y[0] + k4y[0]);
  lz[a][i] = z + (DT/6) * (k1z[0] + 2*k2z[0] + 2*k3z[0] + k4z[0]);
}

// ── warmup: 800 steps to settle onto attractor ────────────────────────────────
for (let step = 0; step < 800; step++) {
  for (let a = 0; a < N_ATTRACTORS; a++) {
    for (let i = 0; i < PER_ATTRACTOR; i++) rk4Step(a, i);
  }
}

// ── Y-axis rotation helper ─────────────────────────────────────────────────────
// Rotates (x, z) by angle θ around Y axis
function rotateY(x, z, theta, out) {
  const c = Math.cos(theta), s = Math.sin(theta);
  out[0] = c * x - s * z;
  out[1] = s * x + c * z;
}
const rotOut = new Float32Array(2);

// ── geometry: one Points object for all 3 attractors ──────────────────────────
// Layout: [ active_A(1000) | active_B(1000) | active_C(1000) | trails_A(79*1000) | trails_B(79*1000) | trails_C(79*1000) ]
const TOTAL_POINTS = TOTAL_ACTIVE + N_ATTRACTORS * TRAIL_FRAMES * PER_ATTRACTOR;

const positions = new Float32Array(TOTAL_POINTS * 3);
const colors    = new Float32Array(TOTAL_POINTS * 3);
const sizes     = new Float32Array(TOTAL_POINTS);

// initialize trail positions to near-origin (will fade away)
for (let i = TOTAL_ACTIVE; i < TOTAL_POINTS; i++) {
  positions[i*3]     = (Math.random() - 0.5) * 0.2;
  positions[i*3 + 1] = (Math.random() - 0.5) * 0.2;
  positions[i*3 + 2] = (Math.random() - 0.5) * 0.2;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('aColor',   new THREE.BufferAttribute(colors,    3));
geom.setAttribute('aSize',    new THREE.BufferAttribute(sizes,     1));

const mat = new THREE.ShaderMaterial({
  uniforms: { uPixel: { value: renderer.getPixelRatio() } },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 aColor;
    attribute float aSize;
    varying vec3 vColor;
    varying float vSize;
    void main(){
      vColor = aColor;
      vSize  = aSize;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = max(1.0, -mv.z);
      gl_PointSize = aSize * uPixel * (14.0 / dist);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vSize;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d) * 4.0;
      if (r > 1.0) discard;
      float alpha = exp(-r * 8.0);
      gl_FragColor = vec4(vColor * alpha, alpha);
    }
  `
});

const pointsMesh = new THREE.Points(geom, mat);
scene.add(pointsMesh);

// ── trail ring buffer per attractor ───────────────────────────────────────────
// Each attractor has its own write pointer
const trailWritePtr = new Int32Array(N_ATTRACTORS);

// Offset into the positions array for attractor a's trail frame f, particle i:
// TOTAL_ACTIVE + a * (TRAIL_FRAMES * PER_ATTRACTOR) + f * PER_ATTRACTOR + i
function trailOffset(a, f, i) {
  return TOTAL_ACTIVE + a * (TRAIL_FRAMES * PER_ATTRACTOR) + f * PER_ATTRACTOR + i;
}

// ── jitter helper ─────────────────────────────────────────────────────────────
let _jitterSeed = 99317;
function jitter() {
  _jitterSeed = (_jitterSeed * 1664525 + 1013904223) >>> 0;
  return (_jitterSeed / 4294967296) - 0.5;
}

// ── color by attractor and trail age ──────────────────────────────────────────
// age: 0.0 = active head, 1.0 = oldest trail
// 0-15 frames (age < 15/79 ≈ 0.19): full base color
// 15-50 frames (0.19–0.63): blend base → rust #8c3c1e
// 50-79 frames (0.63–1.0): rust color, dimming
const RUST = { r: 140/255, g: 60/255, b: 30/255 };

function setColorForAge(cr, a, idx, age) {
  const { r, g, b } = ATTRACTORS[a];
  const base = idx * 3;
  if (age < 0.001) {
    // active head — full base color
    cr[base]     = r;
    cr[base + 1] = g;
    cr[base + 2] = b;
  } else if (age < 0.19) {
    // fresh trail — full base color at high opacity (encoded in size/alpha)
    cr[base]     = r;
    cr[base + 1] = g;
    cr[base + 2] = b;
  } else if (age < 0.63) {
    // mid trail — blend base → rust
    const t = (age - 0.19) / (0.63 - 0.19);
    cr[base]     = r + (RUST.r - r) * t;
    cr[base + 1] = g + (RUST.g - g) * t;
    cr[base + 2] = b + (RUST.b - b) * t;
  } else {
    // old trail — rust, fading
    const t = Math.min(1.0, (age - 0.63) / 0.37);
    cr[base]     = RUST.r * (1.0 - t * 0.4);
    cr[base + 1] = RUST.g * (1.0 - t * 0.5);
    cr[base + 2] = RUST.b * (1.0 - t * 0.6);
  }
}

function setSizeForAge(sz, idx, age) {
  if (age < 0.001) {
    sz[idx] = 5.5;   // active head — large bright point
  } else if (age < 0.19) {
    sz[idx] = 3.5;   // fresh trail
  } else if (age < 0.63) {
    sz[idx] = 3.5 - (age - 0.19) / (0.63 - 0.19) * 2.0;  // 3.5 → 1.5
  } else {
    sz[idx] = Math.max(1.5, 1.5 - (age - 0.63) * 0.5);
  }
}

// ── orbit camera controls ──────────────────────────────────────────────────────
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.0, orbitPhi = 0.52;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.5, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = renderer.getPixelRatio();
});

// ── temp arrays for world positions ───────────────────────────────────────────
const tmpWX = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];
const tmpWY = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];
const tmpWZ = [new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR), new Float32Array(PER_ATTRACTOR)];

// ── main render loop ───────────────────────────────────────────────────────────
const start = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;

  // ── advance all attractors one RK4 step ──────────────────────────────────
  for (let a = 0; a < N_ATTRACTORS; a++) {
    for (let i = 0; i < PER_ATTRACTOR; i++) rk4Step(a, i);
  }

  // ── compute world positions for each attractor ────────────────────────────
  for (let a = 0; a < N_ATTRACTORS; a++) {
    const rotAngle = ATTRACTORS[a].rotY;
    for (let i = 0; i < PER_ATTRACTOR; i++) {
      // apply tremor in Lorenz space (before rotation)
      const jx = jitter() * 0.025 / SCALE;
      const jy = jitter() * 0.025 / SCALE;
      const jz = jitter() * 0.025 / SCALE;

      // scale the Lorenz coordinates
      const sx = (lx[a][i] + jx) * SCALE;
      const sy = (ly[a][i] + jy) * SCALE;
      const sz = (lz[a][i] + jz) * SCALE;

      // rotate around Y axis
      rotateY(sx, sz, rotAngle, rotOut);
      tmpWX[a][i] = rotOut[0];
      tmpWY[a][i] = sy;
      tmpWZ[a][i] = rotOut[1];
    }
  }

  // ── write current positions into trail buffers ────────────────────────────
  for (let a = 0; a < N_ATTRACTORS; a++) {
    const ptr = trailWritePtr[a];
    for (let i = 0; i < PER_ATTRACTOR; i++) {
      const tidx = trailOffset(a, ptr, i);
      positions[tidx*3]     = tmpWX[a][i];
      positions[tidx*3 + 1] = tmpWY[a][i];
      positions[tidx*3 + 2] = tmpWZ[a][i];
    }
  }

  // ── update trail colors and sizes ─────────────────────────────────────────
  for (let a = 0; a < N_ATTRACTORS; a++) {
    const ptr = trailWritePtr[a];
    for (let f = 0; f < TRAIL_FRAMES; f++) {
      const frameDelta = (ptr - f + TRAIL_FRAMES) % TRAIL_FRAMES;
      const age = (frameDelta + 1) / TRAIL_FRAMES;
      for (let i = 0; i < PER_ATTRACTOR; i++) {
        const tidx = trailOffset(a, f, i);
        setColorForAge(colors, a, tidx, age);
        setSizeForAge(sizes, tidx, age);
      }
    }
    trailWritePtr[a] = (ptr + 1) % TRAIL_FRAMES;
  }

  // ── update active particle positions and appearance ───────────────────────
  for (let a = 0; a < N_ATTRACTORS; a++) {
    const activeBase = a * PER_ATTRACTOR;
    for (let i = 0; i < PER_ATTRACTOR; i++) {
      const idx = activeBase + i;
      positions[idx*3]     = tmpWX[a][i];
      positions[idx*3 + 1] = tmpWY[a][i];
      positions[idx*3 + 2] = tmpWZ[a][i];
      setColorForAge(colors, a, idx, 0.0);
      sizes[idx] = 5.5;
    }
  }

  // ── mark GPU buffers dirty ────────────────────────────────────────────────
  geom.attributes.position.needsUpdate = true;
  geom.attributes.aColor.needsUpdate   = true;
  geom.attributes.aSize.needsUpdate    = true;

  // ── slow single-direction auto-rotate (0.015 rad/s) ──────────────────────
  // Full rotation every ~419 seconds ≈ 7 minutes
  const autoTheta = t * 0.015;
  const theta = autoTheta + orbitTheta;
  const phi   = orbitPhi;
  const radius = 20;
  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
