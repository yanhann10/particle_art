<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kam · cypress ↔ art-deco tower morph</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070a; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">kam · cypress ↔ art-deco tower</div>
<div class="hint">drag to orbit · click to flip · auto-morphs every ~12s</div>
<div class="src">organic ↔ geometric · 70k particles · two poses</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────── scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ────────────── geometry pose A: cypress (vertical L-system)
// stochastic but vertically-biased: small angles, strong upward growth
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F'         },  // narrow side branchlets, central trunk continues
    { p: 0.25, s: 'FF[/f]\\F'          },
    { p: 0.20, s: 'F[+f-f][/f\\f]F'    },
  ],
  'f': [   // small terminal twigs
    { p: 0.6, s: 'f[+f][-f]'          },
    { p: 0.4, s: 'f'                   },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);   // tight angle = cypress vertical look
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let h = new THREE.Vector3(0, 1, 0);
  let l = new THREE.Vector3(-1, 0, 0);
  let u = new THREE.Vector3(0, 0, 1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

// repeatable rng so the cypress isn't redrawn each frame
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

const cypressSegs = turtle(expand('F', 6, rng));

// ────────────── geometry pose B: art-deco tower
// stacked rectangular setbacks + central spire + radial sunburst crown
function sampleArtDeco(N){
  // returns N positions sampled across the tower's surfaces
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();

  // setbacks: each tier (cx, cz, half-width, height_from, height_to, vertical_ridges)
  const tiers = [
    { hw: 4.5, y0: 0.0,  y1: 4.0,  ridges: 14 },  // base
    { hw: 3.4, y0: 4.0,  y1: 7.5,  ridges: 12 },
    { hw: 2.4, y0: 7.5,  y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8  },
    { hw: 0.85,y0: 13.0, y1: 15.0, ridges: 6  },
  ];
  // spire: cone from radius 0.6 at y=15 to point at y=20
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;

  // budget: 60% on tier walls (vertical ridges + bands), 25% on horizontal capping bands,
  // 10% on spire, 5% on radial sunburst crown
  const W = Math.floor(N * 0.55);   // wall ridges
  const B = Math.floor(N * 0.25);   // horizontal banding
  const S = Math.floor(N * 0.12);   // spire
  const C = N - W - B - S;          // crown
  let i = 0;

  // 1) wall ridges — for each tier, particles cluster on vertical ridge lines
  // distribute weight across tiers proportional to perimeter * height
  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b, 0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0, ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      // pick which face (0..3): +x, -x, +z, -z
      const face = Math.floor(Math.random() * 4);
      // ridge index (1..ridges) — cluster particles near ridge centerlines
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;        // [0,1]
      const along = (ridgeFrac * 2 - 1) * t.hw;      // [-hw, hw]
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      // small cluster offset from ridge centerline (gives "corrugation" feel)
      const jitter = 0.04;
      switch(face){
        case 0: pos.set( t.hw + (Math.random()-0.5)*jitter, y, along); break;
        case 1: pos.set(-t.hw + (Math.random()-0.5)*jitter, y, along); break;
        case 2: pos.set(along, y,  t.hw + (Math.random()-0.5)*jitter); break;
        case 3: pos.set(along, y, -t.hw + (Math.random()-0.5)*jitter); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }

  // 2) horizontal capping bands at each setback (highlights the deco stepping)
  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    // pick top or bottom edge of tier
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const f = Math.random() * 2 - 1;
    const along = f * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set( t.hw, edge + (Math.random()-0.5)*j, along); break;
      case 1: pos.set(-t.hw, edge + (Math.random()-0.5)*j, along); break;
      case 2: pos.set(along, edge + (Math.random()-0.5)*j,  t.hw); break;
      case 3: pos.set(along, edge + (Math.random()-0.5)*j, -t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // 3) spire: cone
  for (let k = 0; k < S; k++){
    const t = Math.random();   // [0..1]
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th) * r, y, Math.sin(th) * r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // 4) sunburst crown: 16 chevrons radiating from base of spire
  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();   // [0..1] from inner radius outward
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5) * 0.05;
    pos.set(Math.cos(th) * r, y, Math.sin(th) * r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ────────────── build correspondence: each particle has a TREE pos and a TOWER pos
const N = 70000;
const treePos  = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

// distribute particles along cypress segments (length-weighted)
const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
let written = 0;
const v = new THREE.Vector3();
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N - written)
    : Math.max(1, Math.floor(N * lens[i] / totalLen));
  for (let k = 0; k < share && written < N; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.06 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    written++;
  }
}

// re-center & scale BOTH poses so they share the same vertical extent (~0..16 in y)
function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity;
  let cx = 0, cz = 0;
  for (let i = 0; i < arr.length / 3; i++){
    minY = Math.min(minY, arr[i*3+1]);
    maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= arr.length / 3; cz /= arr.length / 3;
  const h = maxY - minY;
  const s = targetH / h;
  for (let i = 0; i < arr.length / 3; i++){
    arr[i*3]   = (arr[i*3]   - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;   // base at y=0
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

// ────────────── shader
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uMix:    { value: 0 }    // 0 = cypress, 1 = tower
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    varying float vMix;
    void main(){
      // smooth-step the mix so morph eases at endpoints
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // sway: organic at m=0, rigid at m=1
      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = (1.0 - m) * 0.06 * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      vMix = m;
      vEnergy = 0.5 + 0.5 * sin(t * 0.8);
      // forest greens (cypress) → bronze/cream (deco)
      vec3 treeA = vec3(0.18, 0.36, 0.20);
      vec3 treeB = vec3(0.55, 0.78, 0.35);
      vec3 treeC = vec3(0.85, 0.92, 0.55);
      vec3 deco_a = vec3(0.42, 0.30, 0.18);
      vec3 deco_b = vec3(0.92, 0.72, 0.40);
      vec3 deco_c = vec3(0.99, 0.94, 0.84);
      // height-based color gradient + energy-based highlight
      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol  = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      vec3 decoCol  = mix(deco_a, deco_b, hk);
      decoCol = mix(decoCol, deco_c, smoothstep(0.85, 1.0, hk) * 0.7);
      vCol = mix(treeCol, decoCol, m);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + 0.7 * vEnergy) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    varying float vMix;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── interaction
let target = 0;
let phase = 0; // current
addEventListener('click', () => { target = 1 - target; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // auto-toggle every ~12s if user hasn't clicked recently
  // simple cycle: each 12s flip the auto target
  const auto = (Math.floor(t / 12) % 2 === 1) ? 1 : 0;
  // user's click overrides auto for the next 8s by setting target manually
  // (simple version: just blend toward XOR of auto and manual)
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  // gentle camera turn
  const ang = t * 0.05;
  camera.position.x = Math.sin(ang) * 22;
  camera.position.z = Math.cos(ang) * 22;
  camera.lookAt(0, 8, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
