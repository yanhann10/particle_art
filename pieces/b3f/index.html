<body>
<div class="id">b3f</div>
<div class="hint">click to re-pour · move to tilt — watch one pool yearn for another that will not turn</div>
<div class="src">descended from sov · sehnsucht · asymmetric longing across canvas</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: the viewer sees pigment pools soaking across raw canvas, but one pool
// stretches desperate tendrils toward a distant pool that only soaks inward —
// asymmetric longing made visible. Sehnsucht is the German ache for something
// unreachable; here the unreachable is another pool of pigment three inches away
// on the same canvas. The reaching never completes. The still pool doesn't know.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
const centers   = new Float32Array(N * 2);
const pColors   = new Float32Array(N * 3);
const yearning  = new Float32Array(N * 3); // xy = target point, z = yearning strength (0 = still)

function mkRng(seed){
  let s = seed >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let pourSeed = Math.floor(Math.random() * 1e9);
let pourTime = 0;

function buildPour(seed){
  const rng = mkRng(seed);

  // Four pools with ASYMMETRIC yearning:
  // Pool 0 (umber, large, left) yearns intensely toward Pool 1 — stretches tendrils right
  // Pool 1 (twilight, upper right) yearns weakly toward Pool 2 — a glance, not a reach
  // Pool 2 (dried sage, lower right) yearns toward something OFF-CANVAS (bottom-right exit)
  // Pool 3 (ash rose, bottom center) is STILL — soaks inward only, the beloved that doesn't turn

  const pools = [
    { cx: -2.1 + rng()*0.4, cy: 0.2 + rng()*0.3,
      r: 2.4 + rng()*0.5, n: 26000,
      col: [0.42, 0.24, 0.16],         // umber — the one who aches
      yearnTo: null, yearnStr: 0.85 },  // set after pools defined
    { cx: 2.0 + rng()*0.5, cy: 1.0 + rng()*0.4,
      r: 1.7 + rng()*0.3, n: 18000,
      col: [0.22, 0.24, 0.34],         // twilight slate
      yearnTo: null, yearnStr: 0.25 },  // faint reach
    { cx: 2.2 + rng()*0.4, cy: -1.2 + rng()*0.3,
      r: 1.4 + rng()*0.3, n: 16000,
      col: [0.28, 0.33, 0.24],         // dried sage
      yearnTo: [5.0, -3.0], yearnStr: 0.45 }, // yearns off-canvas
    { cx: 0.1 + rng()*0.4 - 0.2, cy: -0.6 + rng()*0.3,
      r: 1.8 + rng()*0.3, n: 20000,
      col: [0.40, 0.30, 0.30],         // ash rose — the still one
      yearnTo: null, yearnStr: 0.0 },  // doesn't reach at all
  ];
  // Wire asymmetric yearning
  pools[0].yearnTo = [pools[3].cx, pools[3].cy]; // umber yearns for ash rose
  pools[1].yearnTo = [pools[2].cx, pools[2].cy]; // twilight glances at sage

  let idx = 0;
  for (const pool of pools){
    for (let i = 0; i < pool.n && idx < N; i++, idx++){
      const angle = rng() * Math.PI * 2;
      const rFrac = Math.pow(rng(), 0.6);
      const dist = rFrac * pool.r;
      positions[idx*3]     = pool.cx + Math.cos(angle) * dist;
      positions[idx*3 + 1] = pool.cy + Math.sin(angle) * dist;
      positions[idx*3 + 2] = 0;
      centers[idx*2]     = pool.cx;
      centers[idx*2 + 1] = pool.cy;

      // yearning: edge particles yearn more (tendrils form at periphery)
      const edgeness = rFrac; // 0=center, 1=edge
      // direction from pool center toward yearning target
      if (pool.yearnTo && pool.yearnStr > 0){
        yearning[idx*3]     = pool.yearnTo[0];
        yearning[idx*3 + 1] = pool.yearnTo[1];
        // only edge particles on the FACING side yearn strongly
        const toTarget = Math.atan2(pool.yearnTo[1] - pool.cy, pool.yearnTo[0] - pool.cx);
        let angleDiff = angle - toTarget;
        angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff));
        const facing = Math.max(0, Math.cos(angleDiff)); // 1 = facing target, 0 = away
        yearning[idx*3 + 2] = pool.yearnStr * edgeness * facing * (0.7 + 0.3 * rng());
      } else {
        yearning[idx*3]     = pool.cx; // yearns toward self = stays
        yearning[idx*3 + 1] = pool.cy;
        yearning[idx*3 + 2] = 0;
      }

      const vary = 0.05;
      pColors[idx*3]     = pool.col[0] + (rng() - 0.5) * vary;
      pColors[idx*3 + 1] = pool.col[1] + (rng() - 0.5) * vary;
      pColors[idx*3 + 2] = pool.col[2] + (rng() - 0.5) * vary;
      seeds[idx] = rng();
    }
  }
  for (; idx < N; idx++){
    positions[idx*3] = 0; positions[idx*3+1] = -10; positions[idx*3+2] = 0;
    centers[idx*2] = 0; centers[idx*2+1] = -10;
    pColors[idx*3] = 0; pColors[idx*3+1] = 0; pColors[idx*3+2] = 0;
    yearning[idx*3] = 0; yearning[idx*3+1] = -10; yearning[idx*3+2] = 0;
    seeds[idx] = 0;
  }
}
buildPour(pourSeed);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aCenter',  new THREE.BufferAttribute(centers, 2));
geom.setAttribute('aColor',   new THREE.BufferAttribute(pColors, 3));
geom.setAttribute('aYearn',   new THREE.BufferAttribute(yearning, 3));

const uniforms = {
  uTime:    { value: 0 },
  uPour:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPour;
    uniform float uPixel;
    uniform vec2  uPointer;
    attribute float seed;
    attribute vec2  aCenter;
    attribute vec3  aColor;
    attribute vec3  aYearn; // xy = yearning target, z = yearning strength
    varying vec3  vCol;
    varying float vAlpha;
    varying float vEdge;

    void main(){
      float elapsed = uTime - uPour;

      // base soak spread
      float rate = 0.045 + 0.035 * seed;
      float spread = 1.0 - exp(-elapsed * rate);
      spread += 0.012 * sin(uTime * 0.2 + seed * 6.2831);
      spread = clamp(spread, 0.0, 1.05);

      vec2 target = position.xy;
      vec2 dir = target - aCenter;
      float dist = length(dir);

      // organic edge perturbation
      float angle = atan(dir.y, dir.x);
      float warp = 0.25 * sin(dist * 2.8 + seed * 6.28)
                 + 0.15 * sin(angle * 3.0 + seed * 12.0 + elapsed * 0.04);
      angle += warp * spread;

      vec2 warped = aCenter + dist * vec2(cos(angle), sin(angle));
      vec2 p = mix(aCenter, warped, spread);

      // gravity settle
      p.y -= spread * dist * 0.05;

      // ──── YEARNING: particles drift toward their yearning target ────
      // The yearning grows SLOWLY after the initial soak, like an afterthought
      // that becomes an obsession. Never reaches — asymptotic approach to 40%.
      float yearnStr = aYearn.z;
      if (yearnStr > 0.0) {
        float yearnElapsed = max(0.0, elapsed - 3.0); // yearning begins after soak settles
        float yearnPhase = 1.0 - exp(-yearnElapsed * 0.015); // very slow
        yearnPhase *= yearnStr;

        vec2 yearnTarget = aYearn.xy;
        vec2 toYearn = yearnTarget - p;
        float yearnDist = length(toYearn);

        // asymptotic — never arrives, only 40% of the way at most
        float reach = yearnPhase * 0.40;

        // tendrils: add slight waviness to the reaching motion
        float tendrilWave = 0.08 * sin(seed * 40.0 + uTime * 0.12 + dist * 1.5);
        vec2 perpendicular = vec2(-toYearn.y, toYearn.x);
        if (yearnDist > 0.01) perpendicular /= yearnDist;

        p += toYearn * reach + perpendicular * tendrilWave * yearnPhase;

        // yearning particles pulse slightly — a restless quality
        float pulse = 0.02 * sin(uTime * 0.35 + seed * 20.0) * yearnPhase;
        p += normalize(toYearn + 0.001) * pulse;
      }

      // canvas tilt from pointer
      float tiltX = uPointer.x * 0.12 * spread * dist;
      float tiltY = uPointer.y * 0.08 * spread * dist;
      p.x += tiltX;
      p.y += tiltY;

      vec3 pos3 = vec3(p, 0.0);
      vec4 mv = modelViewMatrix * vec4(pos3, 1.0);

      vEdge = dist / 3.5;
      float edgeFade = 1.0 - smoothstep(0.5, 1.0, vEdge);
      vAlpha = (0.35 + 0.35 * edgeFade) * spread;
      vAlpha *= 0.6 + 0.4 * (1.0 - vEdge);
      vAlpha *= smoothstep(0.0, 0.08, spread);

      // yearning particles thin out as they stretch — pigment diluting
      if (yearnStr > 0.0) {
        float yearnElapsed2 = max(0.0, elapsed - 3.0);
        float yp = (1.0 - exp(-yearnElapsed2 * 0.015)) * yearnStr;
        vAlpha *= mix(1.0, 0.55, yp * vEdge);
      }

      // color: dilute toward canvas tone at edges
      vec3 canvas = vec3(0.82, 0.75, 0.60);
      vCol = mix(aColor, canvas, vEdge * 0.45);
      // yearning particles shift slightly cooler — longing cools the pigment
      if (yearnStr > 0.0) {
        float yearnElapsed3 = max(0.0, elapsed - 3.0);
        float yp2 = (1.0 - exp(-yearnElapsed3 * 0.015)) * yearnStr;
        vCol = mix(vCol, vCol * vec3(0.92, 0.95, 1.05), yp2 * 0.3);
      }

      float sz = (1.6 + 0.6 * (1.0 - vEdge)) * uPixel * (5.0 / -mv.z);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;
    varying float vEdge;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;
      float a = exp(-r2 * 16.0);
      gl_FragColor = vec4(vCol, a * vAlpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── DUST MOTES
const N_DUST = 200;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 14;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 6;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.2 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.50 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── INTERACTION
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = (e.clientY / innerHeight) * 2 - 1;
});
addEventListener('click', () => {
  pourSeed = Math.floor(Math.random() * 1e9);
  buildPour(pourSeed);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.aCenter.needsUpdate = true;
  geom.attributes.aColor.needsUpdate = true;
  geom.attributes.aYearn.needsUpdate = true;
  pourTime = (performance.now() - startMs) / 1000;
  uniforms.uPour.value = pourTime;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startMs = performance.now();
function loop(){
  const t = (performance.now() - startMs) / 1000;
  uniforms.uTime.value = t;
  // update pointer uniform every frame
  uniforms.uPointer.value.set(pointer.x, pointer.y);
  // very slow drift — contemplative breathing over the canvas
  camera.position.x = Math.sin(t * 0.035) * 0.25;
  camera.position.y = 0.6 + Math.sin(t * 0.025 + 1.0) * 0.15;
  camera.lookAt(0, -0.1, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
</body>
</html>
