<!doctype html>
<html lang="en">
<head>
<!-- MOTION: pulsing, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6df · cyanotype star leaves after Halloran</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  background:
    radial-gradient(ellipse at 48% 44%, #1a4a7a 0%, #0d2c54 32%, #081e3e 62%, #03101f 100%),
    #03101f;
  color:#b8cce0; font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
/* cyanotype paper grain — ferric ammonium citrate texture */
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.80' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.04 0 0 0 0 0.10 0 0 0 0 0.20 0 0 0 0.38 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
  mix-blend-mode:screen; opacity:0.40;
}
/* subtle chemical bloom — uneven exposure from upper-left */
body::after {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
  background: radial-gradient(ellipse 75% 55% at 30% 28%, rgba(140,185,225,0.08), transparent 55%),
              radial-gradient(ellipse 40% 30% at 72% 68%, rgba(100,150,200,0.05), transparent 45%);
  mix-blend-mode:screen;
}
canvas { display:block; position:relative; z-index:0; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">6df</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Lia Halloran — Your Body Is A Space That Sees
// Cyanotype star chart: leaf-shaped stars scattered along a galactic band,
// flowing brushstroke regions modulate brightness (painted transparency),
// orbital trace ellipses overlay the field. Motion is biomorphic:
// vascular pulsing waves ripple through the star field like tidal breathing.
// Palette locked: Prussian blue (#0d2c54) + paper-white/cream.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ─── RNG ───
let regrowSeed = Math.random() * 1e9;
function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ─── GALACTIC LEAF-STAR FIELD ───
const N = 80000;
const positions = new Float32Array(N * 3);
const seeds     = new Float32Array(N);
const angles    = new Float32Array(N);
const bands     = new Float32Array(N); // proximity to galactic band

function buildField(seed) {
  const rng = mkRng(seed);
  // Galactic band: curved stripe tilted across the frame
  const tilt = 0.28 + rng() * 0.15;
  const curve = 0.12 + rng() * 0.08;
  const bw = 1.1 + rng() * 0.4;
  // A few dense cluster centers within the band
  const clusters = [];
  for (let c = 0; c < 4; c++) {
    const cx = (rng() - 0.5) * 8;
    const cy = Math.sin(cx * curve) * 1.8 + cx * Math.sin(tilt) + (rng() - 0.5) * bw * 0.5;
    clusters.push({ x: cx, y: cy, r: 0.6 + rng() * 0.8 });
  }
  let written = 0, attempts = 0;
  while (written < N && attempts < N * 14) {
    attempts++;
    const x = (rng() - 0.5) * 12;
    const y = (rng() - 0.5) * 8;
    const bandY = Math.sin(x * curve) * 1.8 + x * Math.sin(tilt);
    const distBand = Math.abs(y - bandY);
    const bandD = Math.exp(-distBand * distBand / (bw * bw));
    // Cluster boost
    let cb = 0;
    for (const cl of clusters) {
      const d2 = (x - cl.x) ** 2 + (y - cl.y) ** 2;
      cb = Math.max(cb, Math.exp(-d2 / (cl.r * cl.r)) * 0.5);
    }
    const density = Math.min(bandD + cb, 1.0);
    const halo = 0.035;
    if (rng() > Math.max(density, halo)) continue;
    const z = (rng() - 0.5) * 0.25;
    positions[written * 3]     = x;
    positions[written * 3 + 1] = y;
    positions[written * 3 + 2] = z;
    seeds[written] = rng();
    angles[written] = rng() * Math.PI * 2;
    bands[written] = density;
    written++;
  }
  for (let i = written; i < N; i++) {
    positions[i * 3] = 0; positions[i * 3 + 1] = -20; positions[i * 3 + 2] = 0;
    seeds[i] = 0; angles[i] = 0; bands[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('aSeed',    new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aAngle',   new THREE.BufferAttribute(angles, 1));
geom.setAttribute('aBand',    new THREE.BufferAttribute(bands, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const starMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float aSeed;
    attribute float aAngle;
    attribute float aBand;
    varying float vSeed;
    varying float vAngle;
    varying float vBrush;
    varying float vPulse;

    // Simple 2D hash noise for brushstroke regions
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash(i), b = hash(i + vec2(1,0));
      float c = hash(i + vec2(0,1)), d = hash(i + vec2(1,1));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    void main(){
      vec3 p = position;

      // ── BIOMORPHIC PULSING ──
      // Radial vascular waves: propagate outward from center like heartbeat
      float dist = length(p.xy);
      float t = uTime;
      // Multiple overlapping wave fronts for organic irregularity
      float wave1 = sin(dist * 1.8 - t * 0.55 + aSeed * 0.5) * 0.08;
      float wave2 = sin(dist * 1.1 - t * 0.33 + 1.5) * 0.05;
      // Tidal breathing: slow global expansion/contraction
      float breath = sin(t * 0.18) * 0.03 + sin(t * 0.11 + 0.7) * 0.02;
      // Peristaltic squeeze along the galactic band axis
      float peristalsis = sin(p.x * 0.6 - t * 0.25) * 0.06;

      // Apply pulsing as radial displacement + slight y-shift
      float radialPulse = wave1 + wave2 + breath;
      vec2 dir = dist > 0.01 ? normalize(p.xy) : vec2(0,1);
      p.xy += dir * radialPulse * dist * 0.15;
      p.y += peristalsis * aBand * 0.12;
      // Gentle individual drift
      p.x += sin(t * 0.15 + aSeed * 40.0) * 0.02;
      p.y += cos(t * 0.12 + aSeed * 30.0) * 0.015;

      // Store pulse phase for brightness modulation
      vPulse = 0.5 + 0.5 * sin(dist * 1.8 - t * 0.55);

      // ── BRUSHSTROKE REGIONS ──
      // Halloran's painted transparency: flowing noise regions where stars brighten
      vec2 bp = p.xy * 0.35 + vec2(t * 0.03, t * 0.02);
      float n1 = vnoise(bp);
      float n2 = vnoise(bp * 1.7 + 3.5);
      float brush = smoothstep(0.25, 0.65, n1 * 0.6 + n2 * 0.4);
      vBrush = brush;

      vSeed = aSeed;
      vAngle = aAngle + t * 0.02 * (aSeed - 0.5); // very slow leaf rotation

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      // Size: brighter in brush regions and on pulse peaks
      float sz = (1.2 + 0.8 * brush + 0.3 * vPulse) * uPixel * (5.0 / -mv.z);
      // Halo stars are dimmer/smaller
      sz *= (0.5 + 0.5 * aBand);
      gl_PointSize = max(sz, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSeed;
    varying float vAngle;
    varying float vBrush;
    varying float vPulse;

    void main(){
      vec2 p = gl_PointCoord - 0.5;
      // Rotate to leaf orientation
      float ca = cos(vAngle), sa = sin(vAngle);
      p = vec2(p.x * ca - p.y * sa, p.x * sa + p.y * ca);

      // ── LEAF SILHOUETTE ──
      // Elongated ovoid with pointed tip (asymmetric along y)
      vec2 scaled = p * vec2(1.0, 2.0);
      float r = length(scaled);
      // Taper: narrow toward positive y (tip)
      r += p.y * 0.35;
      // Midvein darkening (subtle line down center)
      float vein = exp(-abs(p.x) * 60.0) * 0.15 * smoothstep(0.4, 0.0, abs(p.y));

      if (r > 0.45) discard;
      float alpha = exp(-r * r * 14.0) - vein;

      // ── COLOR ──
      // Cyanotype white: warm paper-white with slight cream
      vec3 starWhite = vec3(0.92, 0.94, 0.98);
      vec3 starWarm  = vec3(0.98, 0.92, 0.82);
      vec3 col = mix(starWhite, starWarm, vSeed * 0.4);

      // Brushstroke regions: stars glow brighter with slight cyan tint
      col = mix(col, vec3(0.85, 0.95, 1.0), vBrush * 0.3);

      // Pulse brightens on wave peaks
      float glow = 0.55 + 0.25 * vBrush + 0.15 * vPulse;
      alpha *= glow;

      // Softer edges for distant/dim stars
      alpha *= smoothstep(0.45, 0.15, r);
      gl_FragColor = vec4(col, alpha * 0.82);
    }
  `
});

const stars = new THREE.Points(geom, starMat);
scene.add(stars);

// ─── ORBITAL TRACE ELLIPSES (Halloran's astronomical diagrams) ───
const rngOrb = mkRng(42);
for (let i = 0; i < 6; i++) {
  const pts = [];
  const a = 1.2 + rngOrb() * 3.0;
  const b = 0.5 + rngOrb() * 1.8;
  const cx = (rngOrb() - 0.5) * 5;
  const cy = (rngOrb() - 0.5) * 3;
  const rot = rngOrb() * Math.PI;
  const segments = 96;
  // Partial ellipse: some are incomplete (like hand-drawn arcs)
  const startT = rngOrb() * Math.PI * 0.3;
  const endT = Math.PI * 2 - rngOrb() * Math.PI * 0.5;
  for (let j = 0; j <= segments; j++) {
    const t = startT + (j / segments) * (endT - startT);
    const ex = a * Math.cos(t);
    const ey = b * Math.sin(t);
    const rx = ex * Math.cos(rot) - ey * Math.sin(rot) + cx;
    const ry = ex * Math.sin(rot) + ey * Math.cos(rot) + cy;
    pts.push(new THREE.Vector3(rx, ry, -0.05));
  }
  const lineGeom = new THREE.BufferGeometry().setFromPoints(pts);
  const opacity = 0.06 + rngOrb() * 0.08;
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xc8ddf0, transparent: true, opacity
  });
  scene.add(new THREE.Line(lineGeom, lineMat));
}

// ─── DRIP MARKS (vertical streaks — painted cyanotype imperfection) ───
const rngDrip = mkRng(77);
for (let i = 0; i < 8; i++) {
  const pts = [];
  const dx = (rngDrip() - 0.5) * 10;
  const dy0 = (rngDrip() - 0.5) * 4;
  const dLen = 0.5 + rngDrip() * 2.0;
  const segments = 24;
  for (let j = 0; j <= segments; j++) {
    const t = j / segments;
    const wobble = Math.sin(t * 8 + rngDrip() * 10) * 0.04;
    pts.push(new THREE.Vector3(dx + wobble, dy0 - t * dLen, -0.03));
  }
  const dGeom = new THREE.BufferGeometry().setFromPoints(pts);
  const dMat = new THREE.LineBasicMaterial({
    color: 0xa8c8e8, transparent: true, opacity: 0.04 + rngDrip() * 0.05
  });
  scene.add(new THREE.Line(dGeom, dMat));
}

// ─── CHEMICAL RESIDUE DUST (tiny bright specks on cyanotype surface) ───
const ND = 180;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(ND * 3);
const dustSd   = new Float32Array(ND);
for (let i = 0; i < ND; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 13;
  dustPos[i * 3 + 1] = (Math.random() - 0.5) * 9;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 0.3 + 0.1;
  dustSd[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSd, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.06 + seed * 6.28;
      p.x += sin(t * 1.1 + seed * 25.0) * 0.15;
      p.y += cos(t * 0.9 + seed * 18.0) * 0.12;
      // Flicker: chemical residue catches light intermittently
      vAlpha = 0.3 + 0.7 * pow(sin(t * 3.0 + seed * 50.0) * 0.5 + 0.5, 3.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + 0.6 * vAlpha) * uPixel * (3.5 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 22.0);
      vec3 col = vec3(0.78, 0.88, 0.98);
      gl_FragColor = vec4(col, a * vAlpha * 0.45);
    }
  `
});
scene.add(new THREE.Points(dustGeom, dustMat));

// ─── INTERACTION ───
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.aSeed.needsUpdate = true;
  geom.attributes.aAngle.needsUpdate = true;
  geom.attributes.aBand.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── ANIMATION ───
const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  // Very subtle camera parallax — viewing a print on a table
  camera.position.x = Math.sin(t * 0.035) * 0.3;
  camera.position.y = 0.15 + Math.sin(t * 0.028 + 0.8) * 0.2;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
