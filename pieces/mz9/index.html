<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mz9 · geological strata · time made visible</title>
<!-- MOTION: breathe, intensity: calm -->
<!-- Palette: basalt #404030, limestone #8a7060, sandstone #c0a060, chalk #e0d8c0 — earth tones -->
<!-- Artist: geological cross-section — time, erosion, sedimentary accumulation -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0b09; overflow:hidden;
               color:#a09080; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.50; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.40; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">mz9</div>
<div class="hint">drag to orbit · layers erode over 30s then reset</div>
<div class="src">geological strata · sedimentary cross-section · time made visible</div>
<div class="stat" id="stat">erosion: 0%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Geological strata: 12 translucent horizontal PlaneGeometry layers.
   Each layer has a procedural ShaderMaterial with vertex displacement (undulation).
   Layers slowly erode (displacement shrinks to 0) over 30s, then reset.
   Earth-tone palette cycling through basalt → limestone → sandstone → chalk.
   Time made visible — the viewer reads geology from the side or from above. */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0b09);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(12, 8, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// Subtle ambient light — geological, not theatrical
const ambient = new THREE.AmbientLight(0xd8c8b0, 0.8);
scene.add(ambient);
const keyLight = new THREE.DirectionalLight(0xfff0e0, 1.2);
keyLight.position.set(8, 20, 10);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xa0b0c0, 0.4);
rimLight.position.set(-10, 5, -8);
scene.add(rimLight);

// Earth-tone layer colors cycling through geologic sequence
const LAYER_COLORS = [
  new THREE.Color(0x2a2820), // deep basalt
  new THREE.Color(0x404030), // basalt
  new THREE.Color(0x5a5040), // dark shale
  new THREE.Color(0x6a5848), // mudstone
  new THREE.Color(0x8a7060), // limestone
  new THREE.Color(0xa08060), // light limestone
  new THREE.Color(0xb09050), // sandstone base
  new THREE.Color(0xc0a060), // sandstone
  new THREE.Color(0xc8a870), // sandy limestone
  new THREE.Color(0xd0b878), // pale sandstone
  new THREE.Color(0xd8c890), // chalk base
  new THREE.Color(0xe0d8c0), // chalk
];

const LAYER_COUNT = 12;
const LAYER_STEP = 0.5;
const Y_START = -3.0;
const EROSION_CYCLE = 30.0;

const layers = [];
const statEl = document.getElementById('stat');

for (let li = 0; li < LAYER_COUNT; li++) {
  const y = Y_START + li * LAYER_STEP;
  const col = LAYER_COLORS[li];

  // Higher layers have more relief (deposited later, less compressed)
  const baseAmplitude = 0.04 + (li / LAYER_COUNT) * 0.04;

  const vert = `
    uniform float uTime;
    uniform float uAmplitude;
    varying vec2 vUv;
    varying vec3 vNormal;

    float snoise(vec2 p){
      // Simple 2D value noise
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f*f*(3.0-2.0*f);
      float a = fract(sin(dot(i, vec2(127.1,311.7)))*43758.5453);
      float b = fract(sin(dot(i+vec2(1,0), vec2(127.1,311.7)))*43758.5453);
      float c = fract(sin(dot(i+vec2(0,1), vec2(127.1,311.7)))*43758.5453);
      float d = fract(sin(dot(i+vec2(1,1), vec2(127.1,311.7)))*43758.5453);
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y) * 2.0 - 1.0;
    }

    void main(){
      vUv = uv;
      vec3 p = position;
      // Undulation: two octaves of value noise, slowly shifting
      float n1 = snoise(p.xz * 0.6 + vec2(uTime * 0.04, ${(li * 0.37).toFixed(3)}));
      float n2 = snoise(p.xz * 1.4 + vec2(${(li * 0.51).toFixed(3)}, uTime * 0.02));
      float disp = (n1 * 0.7 + n2 * 0.3) * uAmplitude;
      p.y += disp;
      vNormal = normalMatrix * normal;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `;

  const frag = `
    uniform vec3 uColor;
    uniform float uOpacity;
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;

    void main(){
      // Slight cross-bedding pattern — thin lines in UV space
      float bedding = 0.5 + 0.5 * sin((vUv.x * 8.0 + vUv.y * 3.0) * 3.14159);
      float grain = fract(sin(dot(floor(vUv * 80.0), vec2(127.1, 311.7))) * 43758.5453);
      vec3 col = uColor * (0.85 + 0.15 * bedding) * (0.95 + 0.05 * grain);
      // Lambert shading
      vec3 norm = normalize(vNormal);
      float diff = max(dot(norm, normalize(vec3(0.5, 1.0, 0.7))), 0.0);
      col *= (0.55 + 0.45 * diff);
      gl_FragColor = vec4(col, uOpacity);
    }
  `;

  const mat = new THREE.ShaderMaterial({
    vertexShader: vert,
    fragmentShader: frag,
    uniforms: {
      uTime:      { value: 0 },
      uColor:     { value: col },
      uOpacity:   { value: 0.65 },
      uAmplitude: { value: baseAmplitude },
    },
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
  });

  const geo = new THREE.PlaneGeometry(14, 14, 20, 20);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = y;
  scene.add(mesh);

  layers.push({ mesh, mat, baseAmplitude, y });
}

// Thin edge lines for each layer — geological section lines
for (let li = 0; li < LAYER_COUNT; li++) {
  const y = Y_START + li * LAYER_STEP;
  const col = LAYER_COLORS[li];
  const lineGeo = new THREE.BufferGeometry();
  const pts = [];
  for (let i = 0; i <= 40; i++) {
    const x = -7 + (i / 40) * 14;
    pts.push(x, y + 0.002, -7);
  }
  lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lineMat = new THREE.LineBasicMaterial({ color: col, opacity: 0.35, transparent: true });
  scene.add(new THREE.Line(lineGeo, lineMat));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  const t = performance.now() / 1000;

  // Erosion: amplitude shrinks to 0 over 30s then resets
  const cycleT = t % EROSION_CYCLE;
  // Ease out: erosionFactor = 1 → 0 over cycle
  const erosionFactor = 1.0 - Math.pow(cycleT / EROSION_CYCLE, 1.5);
  const erosionPct = Math.round((1 - erosionFactor) * 100);
  statEl.textContent = `erosion: ${erosionPct}%`;

  for (let li = 0; li < LAYER_COUNT; li++) {
    const { mat, baseAmplitude } = layers[li];
    mat.uniforms.uTime.value = t;
    mat.uniforms.uAmplitude.value = baseAmplitude * Math.max(0.02, erosionFactor);
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
