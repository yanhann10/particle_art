<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pyx · Shiota — Rilling Descent</title>
<!-- MOTION: drift + gravity, intensity: meditative -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">pyx</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080101, 0.004));
const key1 = new THREE.PointLight(0x1a0303, 0.010, 32, 2.4);
key1.position.set(-7, 9, 5);
scene.add(key1);

const key2 = new THREE.PointLight(0x0e0202, 0.006, 26, 2.2);
key2.position.set(5, -6, -7);
scene.add(key2);

let seed = 734512;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 28, h: 18, d: 24 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

const keyPos = new THREE.Vector3(1.2, 0.8, -1.0);

const keyGeo = new THREE.CylinderGeometry(0.08, 0.08, 3.2, 8);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xe0d8c8,
  emissive: 0xc0b0a0,
  emissiveIntensity: 0.62,
  roughness: 0.84,
  metalness: 0.18
});
const keyShaft = new THREE.Mesh(keyGeo, keyMat);
keyShaft.position.copy(keyPos);
keyShaft.rotation.z = Math.PI/2;
scene.add(keyShaft);

const keyBowGeo = new THREE.TorusGeometry(0.5, 0.09, 8, 16);
const keyBow = new THREE.Mesh(keyBowGeo, keyMat);
keyBow.position.set(keyPos.x - 1.8, keyPos.y, keyPos.z);
keyBow.rotation.y = Math.PI/2;
scene.add(keyBow);

const keyTeeth = [];
for(let i=0; i<4; i++){
  const tooth = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.38, 0.08),
    keyMat
  );
  tooth.position.set(
    keyPos.x + 1.4 + i*0.22,
    keyPos.y - 0.15 - (i%2)*0.12,
    keyPos.z
  );
  scene.add(tooth);
  keyTeeth.push(tooth);
}

const keyGlow = new THREE.PointLight(0x140303, 0.008, 10, 2.6);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

const keyAnchors = [];

for(let i=0; i<32; i++){
  const t = i/31;
  const angle = (i%8)*(Math.PI*2/8);
  const x = keyPos.x + (t-0.5)*3.2;
  const y = keyPos.y + Math.cos(angle)*0.08;
  const z = keyPos.z + Math.sin(angle)*0.08;
  keyAnchors.push(new THREE.Vector3(x, y, z));
}

for(let i=0; i<24; i++){
  const angle = (i/24)*Math.PI*2;
  const r = 0.5 + 0.09;
  const x = keyPos.x - 1.8 + Math.cos(angle)*r*Math.cos(Math.PI/2);
  const y = keyPos.y + Math.sin(angle)*r;
  const z = keyPos.z + Math.cos(angle)*r*Math.sin(Math.PI/2);
  keyAnchors.push(new THREE.Vector3(x, y, z));
}

for(let i=0; i<4; i++){
  for(let j=0; j<3; j++){
    const x = keyPos.x + 1.4 + i*0.22 + (rng()-0.5)*0.09;
    const y = keyPos.y - 0.15 - (i%2)*0.12 + (rng()-0.5)*0.19;
    const z = keyPos.z + (rng()-0.5)*0.04;
    keyAnchors.push(new THREE.Vector3(x, y, z));
  }
}

const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.84; z=(rng()-0.5)*ROOM.d*0.84; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.84; z=(rng()-0.5)*ROOM.d*0.84; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.84; z=(rng()-0.5)*ROOM.d*0.84; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.84; z=(rng()-0.5)*ROOM.d*0.84; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.84; y=(rng()-0.5)*ROOM.h*0.84; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.84; y=(rng()-0.5)*ROOM.h*0.84; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<120; i++) anchors.push(wallPt());

const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const threadGravity = new Float32Array(NUM_LINES);
const threadPhase = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  
  const dy = b.y - a.y;
  const len = a.distanceTo(b);
  threadGravity[li] = (dy < 0 ? 1.0 : 0.3) * Math.min(len / 8.0, 1.0);
  threadPhase[li] = rng() * Math.PI * 2;
  
  li++;
}

const suspCount = 6;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2;
  const r = 0.55 + rng()*0.15;
  const x = keyPos.x - 1.8 + Math.cos(angle)*r;
  const z = keyPos.z + Math.sin(angle)*r*0.4;
  const y = keyPos.y + 0.1;
  const sp = new THREE.Vector3(x, y, z);
  
  const ceilX = sp.x + (rng()-0.5)*1.0;
  const ceilZ = sp.z + (rng()-0.5)*1.0;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sp);
}

const convergeBudget = 9200;
for(let i=0; i<convergeBudget && li<NUM_LINES-10800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 2.8) continue;
  
  let closest = keyAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<5; k++){
    const candidate = keyAnchors[Math.floor(rng()*keyAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  if(rng()<0.22){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.28 + rng()*0.60);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

for(let i=0; i<640 && li<NUM_LINES-9400; i++){
  const ka = keyAnchors[Math.floor(rng()*keyAnchors.length)];
  const dir = ka.clone().sub(keyPos).normalize();
  dir.x += (rng()-0.5)*0.9;
  dir.y += (rng()-0.5)*0.8 - 0.3;
  dir.z += (rng()-0.5)*0.9;
  dir.normalize();
  const len = 3.8 + rng()*10.5;
  const end = ka.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(ka, end);
  }
}

const THRESH = 7.8;
let webCount = 0, attempts = 0;
while(webCount<5200 && li<NUM_LINES-3800 && attempts<28000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<7; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>1.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

for(let i=0; i<180 && li<NUM_LINES-2600; i++){
  const startDist = 4.8 + rng()*7.5;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.80;
  const start = keyPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.0,
    (rng()-0.5)*1.6 - 0.4,
    (rng()-0.5)*2.0
  ).normalize();
  
  const segLen = 1.1 + rng()*0.8;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-20 && rng()<0.58){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.55 + rng()*0.62
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.70));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-18 && rng()<0.42){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.55 - rng()*0.62
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.66));
      setLine(p1, p2b);
    }
  }
}

for(let i=0; i<420 && li<NUM_LINES-1600; i++){
  const y = keyPos.y + (rng()-0.5)*6.5;
  const x1 = -hw + rng()*3.8;
  const z1 = (rng()-0.5)*ROOM.d*0.82;
  const x2 = hw - rng()*3.8;
  const z2 = (rng()-0.5)*ROOM.d*0.82;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

for(let i=0; i<280 && li<NUM_LINES-1000; i++){
  const x = (rng()-0.5)*ROOM.w*0.80;
  const z = (rng()-0.5)*ROOM.d*0.80;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.1, hh, z + (rng()-0.5)*1.1);
  setLine(a, b);
}

let wallSpans = 0;
while(wallSpans<1500 && li<NUM_LINES-400){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>6.0 && d<19.0){
    setLine(a, b);
    wallSpans++;
  }
}

while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>6.5 && d<16.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.078,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

const pathLen = 3000;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.12 + lt*Math.PI*0.55;
    const r = 14.0 - lt*4.5;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 6.2 - lt*3.5;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*0.67 + lt*Math.PI*1.05;
    const r = 9.5 + Math.sin(lt*Math.PI*1.3)*1.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 0.6 + Math.cos(lt*Math.PI*1.4)*1.0;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.74){
    const lt = (t-0.52)/0.22;
    const angle = Math.PI*1.72 + lt*Math.PI*0.75;
    const r = 8.5 + Math.cos(lt*Math.PI)*1.3;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - lt*7.0;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.74)/0.26;
    const angle = Math.PI*2.47 + lt*Math.PI*0.50;
    const r = 8.2 + lt*6.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 2.8 + lt*4.2;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    
    const gravity = threadGravity[i];
    const phase = threadPhase[i];
    const wave = Math.sin(elapsed*0.24 + phase)*0.018;
    const sag = gravity * Math.sin(elapsed*0.16 + phase*0.3)*0.032;
    
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      const t = v;
      arr[vi]   = basePositions[vi]   + wave*t*0.5;
      arr[vi+1] = basePositions[vi+1] - sag*t;
      arr[vi+2] = basePositions[vi+2] + wave*t*0.3;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  keyShaft.rotation.y = Math.sin(elapsed*0.000038)*0.012;
  keyBow.rotation.x = Math.sin(elapsed*0.000030)*0.009;

  const speed = 0.000014;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000068)*0.20,
    keyPos.y + Math.cos(elapsed*0.000052)*0.16,
    keyPos.z + Math.sin(elapsed*0.000046)*0.14
  );

  key1.intensity = 0.010 + Math.sin(elapsed*0.000048)*0.0042;
  keyGlow.intensity = 0.008 + Math.sin(elapsed*0.000060)*0.0032;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
