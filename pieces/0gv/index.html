<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathing, intensity: calm -->
<!-- INTENT: Two Lorenz butterflies side by side like Gonzalez-Torres' paired clocks — breathing together, slowly drifting out of sync, finding each other again. The viewer should feel tenderness, presence, the intimacy of synchronized time in warm amber light. -->
<!-- ARTIST: Felix Gonzalez-Torres — candy spills, light strings, paired clocks; intimacy as sculpture -->
<!-- PATTERN: strange attractor (Lorenz), paired/mirrored composition -->
<!-- EVOKES: "Untitled" (Perfect Lovers) 1991 — two clocks keeping time together -->
<title>0gv · tender pair · lorenz</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; color:#cdd2dc; opacity:0.55;
      font-size:11px; letter-spacing:0.06em; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<div class="id">0gv</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  Two Lorenz attractors, placed side by side like Felix Gonzalez-Torres'
  "Untitled" (Perfect Lovers) — paired clocks on a gallery wall.

  Both trace the same system. Over a 120-second cycle, one's sigma drifts
  slightly — their orbits desynchronize, then gently return. Like two
  hearts losing and finding their rhythm.

  Palette: warm incandescent amber — the color of old light bulbs,
  of gallery spots at closing time, of candlelight on skin.
*/

const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

// init: both groups from same Lorenz basin
function makeInit(){
  const d = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    d[i*4]   = (Math.random() - 0.5) * 8;
    d[i*4+1] = (Math.random() - 0.5) * 8;
    d[i*4+2] = 27 + (Math.random() - 0.5) * 8;
    d[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(d, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const ortho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInit() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, ortho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, ortho);
renderer.setRenderTarget(null);

// ── simulation: Lorenz for both halves, group B drifts ──
const simU = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.0 },
  uDrift: { value: 0.0 }     // sigma offset for group B
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uDrift;
    varying vec2 vUv;

    vec3 lorenz(vec3 p, float sigma){
      return vec3(sigma*(p.y - p.x),
                  p.x*(28.0 - p.z) - p.y,
                  p.x*p.y - (8.0/3.0)*p.z);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      float sigma = 10.0;
      if(vUv.y >= 0.5) sigma += uDrift;

      vec3 dp = lorenz(p, sigma);
      float dt = uDt * 0.12;
      p += dp * dt;
      age = mod(age + dt * 0.035, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ── render scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.2, 7.0);
camera.lookAt(0, 0, 0);

// faint warm glow behind each form
function makeGlow(x){
  const g = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 4),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vUv; void main(){
        vec2 c = vUv - 0.5;
        float d = dot(c,c);
        float a = 0.025 * exp(-d * 5.0);
        gl_FragColor = vec4(0.72, 0.55, 0.30, a);
      }`
    })
  );
  g.position.set(x, 0, -2.0);
  scene.add(g);
}
makeGlow(-1.35);
makeGlow(1.35);

// points
const pGeom = new THREE.BufferGeometry();
const idx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idx[i*2]   = (x + 0.5) / W;
  idx[i*2+1] = (y + 0.5) / H;
}
pGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idx, 2));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtA.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uBreathe: { value: 1.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uBreathe;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vFogD;

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;
      float group = step(0.5, uvIdx.y);

      // lorenz → display coords
      vec3 disp = (p - vec3(0.0, 0.0, 25.0)) / 25.0;
      disp *= uBreathe;
      // pair offset
      disp.x += mix(-1.35, 1.35, group);

      // palette: warm amber (group A) / slightly rosier amber (group B)
      // like two slightly different color-temperature bulbs
      vec3 amber  = vec3(0.76, 0.58, 0.33);
      vec3 cream  = vec3(0.85, 0.77, 0.62);
      vec3 shadow = vec3(0.48, 0.36, 0.20);
      vec3 rose   = vec3(0.78, 0.54, 0.38);

      vec3 cA = mix(amber, cream, smoothstep(0.0, 0.45, age));
      cA = mix(cA, shadow, smoothstep(0.55, 1.0, age));
      vec3 cB = mix(rose, cream, smoothstep(0.0, 0.45, age));
      cB = mix(cB, shadow, smoothstep(0.55, 1.0, age));

      vCol = mix(cA, cB, group);

      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      vFogD = -mv.z;
      gl_PointSize = 2.4 * uPixel * (3.0 / max(vFogD, 0.4));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFogD;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if(r > 0.25) discard;
      float a = exp(-r * 11.0);
      // warm fog toward background
      float fog = 1.0 - exp(-0.003 * vFogD * vFogD);
      vec3 col = mix(vCol, vec3(0.04, 0.03, 0.02), fog);
      float o = a * 0.65;
      gl_FragColor = vec4(col * o, o);
    }
  `
});
const pts = new THREE.Points(pGeom, pMat);
scene.add(pts);

// ── subtle falling particles: 0.5% slowly descend, like candies taken ──
// (handled in sim by letting some particles age-reset with slight downward bias)

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  // drift cycle: 120s — sync → desync → sync
  const phase = (t % 120) / 120;
  simU.uDrift.value = 0.35 * Math.pow(Math.sin(phase * Math.PI), 2);
  simU.uDt.value = dt;

  // breathing — slow, gentle, like a sleeping body
  pMat.uniforms.uBreathe.value = 1.0 + 0.04 * Math.sin(t * 0.22);

  // sim: 3 substeps
  for (let i = 0; i < 3; i++){
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, ortho);
    [rtA, rtB] = [rtB, rtA];
  }
  renderer.setRenderTarget(null);
  pMat.uniforms.state.value = rtA.texture;

  // fixed camera — gallery stillness
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<!-- piece-ctrl (injected by scripts/inject_grade_panel.py) -->
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
<button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
<button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
<input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
<button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
