<title>cellular forms · morphogenetic growth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<div class="id">8il</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Andy Lomas morphogenetic growth: cells split when accumulated nutrient exceeds threshold.
// We keep a neighbor graph (6 neighbors per cell), spring forces, and insert new cells
// when a cell's 'nutrient' > 1.0. Render as instanced spheres with depth-gradient shading.
// The form grows from a seed cluster into a rumpled coral-like mass over ~30 seconds.

const MAX_CELLS = 16384;
const INIT_CELLS = 64;
const SPLIT_THRESHOLD = 1.0;
const NUTRIENT_RATE = 0.012;
const SPRING_K = 0.3;
const DAMPING = 0.92;
const REST_LENGTH = 0.08;

class Cell {
  constructor(pos) {
    this.pos = pos.clone();
    this.vel = new THREE.Vector3();
    this.neighbors = [];
    this.nutrient = Math.random() * 0.5;
    this.age = 0;
  }
}

const cells = [];

// initialize seed cluster
for (let i = 0; i < INIT_CELLS; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 0.12 + Math.random() * 0.08;
  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);
  cells.push(new Cell(new THREE.Vector3(x, y, z)));
}

// build neighbor graph (k-nearest, k=6)
function rebuildNeighbors() {
  const k = 6;
  for (let c of cells) c.neighbors = [];
  for (let i = 0; i < cells.length; i++) {
    const dists = [];
    for (let j = 0; j < cells.length; j++) {
      if (i === j) continue;
      dists.push({ idx: j, d: cells[i].pos.distanceTo(cells[j].pos) });
    }
    dists.sort((a, b) => a.d - b.d);
    for (let m = 0; m < Math.min(k, dists.length); m++) {
      cells[i].neighbors.push(cells[dists[m].idx]);
    }
  }
}
rebuildNeighbors();

function splitCell(idx) {
  if (cells.length >= MAX_CELLS) return;
  const parent = cells[idx];
  const dir = new THREE.Vector3(
    (Math.random() - 0.5),
    (Math.random() - 0.5),
    (Math.random() - 0.5)
  ).normalize();
  const offset = dir.multiplyScalar(REST_LENGTH * 0.6);
  const child = new Cell(parent.pos.clone().add(offset));
  child.nutrient = parent.nutrient * 0.5;
  parent.nutrient *= 0.5;
  cells.push(child);
}

function simulate(dt) {
  // accumulate nutrient
  for (let c of cells) {
    c.nutrient += NUTRIENT_RATE * dt;
    c.age += dt;
  }

  // spring forces
  for (let c of cells) {
    const force = new THREE.Vector3();
    for (let n of c.neighbors) {
      const delta = n.pos.clone().sub(c.pos);
      const dist = delta.length();
      if (dist < 0.001) continue;
      const displacement = dist - REST_LENGTH;
      force.add(delta.normalize().multiplyScalar(SPRING_K * displacement));
    }
    c.vel.add(force.multiplyScalar(dt));
    c.vel.multiplyScalar(DAMPING);
    c.pos.add(c.vel.clone().multiplyScalar(dt));
  }

  // split cells over threshold
  const toSplit = [];
  for (let i = 0; i < cells.length; i++) {
    if (cells[i].nutrient > SPLIT_THRESHOLD && cells.length < MAX_CELLS) {
      toSplit.push(i);
    }
  }
  for (let idx of toSplit) splitCell(idx);

  // rebuild neighbor graph every 10 splits
  if (toSplit.length > 0 && Math.random() < 0.15) {
    rebuildNeighbors();
  }
}

// ─────────────────────────── render ───────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 2.5);
camera.lookAt(0, 0, 0);

// instanced spheres
const sphereGeom = new THREE.SphereGeometry(0.04, 12, 12);
const instancedMesh = new THREE.InstancedMesh(sphereGeom, null, MAX_CELLS);
instancedMesh.count = cells.length;

const cellMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uCamPos: { value: camera.position }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vDepth;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
      vWorldPos = (instanceMatrix * vec4(position, 1.0)).xyz;
      vDepth = -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uCamPos;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vDepth;
    void main() {
      vec3 lightDir = normalize(vec3(0.6, 1.0, 0.8));
      float ndl = max(0.0, dot(vNormal, lightDir));
      
      // ambient occlusion approximation via depth derivative
      float ao = 1.0 - smoothstep(0.0, 3.0, vDepth) * 0.6;
      
      // subsurface tint
      vec3 baseCol = vec3(0.92, 0.88, 0.85);
      vec3 subCol = vec3(0.98, 0.78, 0.68);
      float sub = pow(max(0.0, dot(vNormal, normalize(uCamPos - vWorldPos))), 2.0);
      vec3 col = mix(baseCol, subCol, sub * 0.15);
      
      // raking light sculptural shading
      float light = ndl * 0.7 + 0.3;
      col *= light * ao;
      
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
instancedMesh.material = cellMat;
scene.add(instancedMesh);

// directional rim light
const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight.position.set(-1, 1, 1);
scene.add(dirLight);
const ambLight = new THREE.AmbientLight(0x222222);
scene.add(ambLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// update instance matrices
const dummy = new THREE.Object3D();
function updateInstances() {
  instancedMesh.count = cells.length;
  for (let i = 0; i < cells.length; i++) {
    dummy.position.copy(cells[i].pos);
    const scale = 0.8 + 0.2 * Math.sin(cells[i].age * 0.5);
    dummy.scale.setScalar(scale);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
  }
  instancedMesh.instanceMatrix.needsUpdate = true;
}

// compute centroid for camera tracking
function getCentroid() {
  const c = new THREE.Vector3();
  for (let cell of cells) c.add(cell.pos);
  return c.divideScalar(cells.length);
}

let lastT = performance.now();
let simAccum = 0;
const SIM_STEP = 1 / 60;

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  cellMat.uniforms.uTime.value = now / 1000;

  // fixed timestep sim
  simAccum += dt;
  while (simAccum > SIM_STEP) {
    simulate(SIM_STEP);
    simAccum -= SIM_STEP;
  }

  updateInstances();

  // camera slow orbit, track centroid
  const centroid = getCentroid();
  const ang = now * 0.0002;
  const radius = 2.0 + Math.sin(now * 0.0001) * 0.3;
  camera.position.x = Math.sin(ang) * radius;
  camera.position.z = Math.cos(ang) * radius;
  camera.position.y = Math.sin(ang * 0.7) * 0.5;
  camera.lookAt(centroid);
  cellMat.uniforms.uCamPos.value.copy(camera.position);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
