<title>cj9 · Geometric Suspension — Manolo Gamboa Naon</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0a; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<div class="id">cj9</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Flat color palette — Manolo Gamboa Naon inspired
const palette = [
  0xe63946, // red
  0xf1faee, // off-white
  0xa8dadc, // pale cyan
  0x457b9d, // steel blue
  0x1d3557  // navy
];

// ── Central sphere — hard-edged, flat shaded
const sphereRadius = 2.4;
const sphereGeo = new THREE.IcosahedronGeometry(sphereRadius, 1);
const sphereMat = new THREE.MeshBasicMaterial({
  color: palette[1],
  wireframe: false,
  flatShading: true
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(0, 0, 0);
scene.add(sphere);

// ── Geometric primitives suspended around sphere
// Hard-edged shapes: triangles, rings, half-circles, rectangles
const shapes = new THREE.Group();
scene.add(shapes);

// Helper: create flat triangle
function makeTriangle(size, color, pos, rot){
  const shape = new THREE.Shape();
  shape.moveTo(0, size);
  shape.lineTo(-size * 0.866, -size * 0.5);
  shape.lineTo(size * 0.866, -size * 0.5);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.rotation.set(rot.x, rot.y, rot.z);
  return mesh;
}

// Helper: create ring
function makeRing(innerR, outerR, color, pos, rot){
  const geo = new THREE.RingGeometry(innerR, outerR, 32);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.rotation.set(rot.x, rot.y, rot.z);
  return mesh;
}

// Helper: create rectangle
function makeRect(w, h, color, pos, rot){
  const shape = new THREE.Shape();
  shape.moveTo(-w/2, -h/2);
  shape.lineTo(w/2, -h/2);
  shape.lineTo(w/2, h/2);
  shape.lineTo(-w/2, h/2);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.rotation.set(rot.x, rot.y, rot.z);
  return mesh;
}

// Helper: create half-circle
function makeHalfCircle(radius, color, pos, rot){
  const shape = new THREE.Shape();
  shape.absarc(0, 0, radius, 0, Math.PI, false);
  shape.lineTo(-radius, 0);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos);
  mesh.rotation.set(rot.x, rot.y, rot.z);
  return mesh;
}

// ── Deterministic layout — no randomness, pure geometry
// Layer 1: Ring orbit — 8 triangles, evenly spaced
const ring1Radius = 6;
for (let i = 0; i < 8; i++){
  const angle = (i / 8) * Math.PI * 2;
  const x = Math.cos(angle) * ring1Radius;
  const y = Math.sin(angle) * ring1Radius;
  const tri = makeTriangle(
    0.8,
    palette[i % 2 === 0 ? 0 : 3],
    new THREE.Vector3(x, y, 0),
    new THREE.Euler(0, 0, angle + Math.PI / 2)
  );
  shapes.add(tri);
}

// Layer 2: Inner ring — 4 rectangles at cardinal directions
const ring2Radius = 4.2;
for (let i = 0; i < 4; i++){
  const angle = (i / 4) * Math.PI * 2;
  const x = Math.cos(angle) * ring2Radius;
  const y = Math.sin(angle) * ring2Radius;
  const rect = makeRect(
    1.5, 0.4,
    palette[2],
    new THREE.Vector3(x, y, 0.5),
    new THREE.Euler(0, 0, angle)
  );
  shapes.add(rect);
}

// Layer 3: Outer half-circles — 6 positioned hexagonally
const ring3Radius = 9;
for (let i = 0; i < 6; i++){
  const angle = (i / 6) * Math.PI * 2;
  const x = Math.cos(angle) * ring3Radius;
  const y = Math.sin(angle) * ring3Radius;
  const half = makeHalfCircle(
    1.2,
    palette[4],
    new THREE.Vector3(x, y, -1),
    new THREE.Euler(0, 0, angle - Math.PI / 2)
  );
  shapes.add(half);
}

// Layer 4: Rings at depth — 3 large rings behind sphere
for (let i = 0; i < 3; i++){
  const angle = (i / 3) * Math.PI * 2 + Math.PI / 6;
  const x = Math.cos(angle) * 5.5;
  const y = Math.sin(angle) * 5.5;
  const ring = makeRing(
    1.8, 2.2,
    palette[1],
    new THREE.Vector3(x, y, -2),
    new THREE.Euler(0, 0, 0)
  );
  shapes.add(ring);
}

// Layer 5: Connecting lines — straight geometric struts
const lineMat = new THREE.LineBasicMaterial({ color: palette[0], transparent: true, opacity: 0.4 });
const linePositions = [];

// Connect sphere center to outer triangles
for (let i = 0; i < 8; i++){
  const angle = (i / 8) * Math.PI * 2;
  const x = Math.cos(angle) * ring1Radius;
  const y = Math.sin(angle) * ring1Radius;
  linePositions.push(0, 0, 0);
  linePositions.push(x, y, 0);
}

// Connect adjacent triangles
for (let i = 0; i < 8; i++){
  const angle1 = (i / 8) * Math.PI * 2;
  const angle2 = ((i + 1) / 8) * Math.PI * 2;
  const x1 = Math.cos(angle1) * ring1Radius;
  const y1 = Math.sin(angle1) * ring1Radius;
  const x2 = Math.cos(angle2) * ring1Radius;
  const y2 = Math.sin(angle2) * ring1Radius;
  linePositions.push(x1, y1, 0);
  linePositions.push(x2, y2, 0);
}

// Connect rectangles to triangles
for (let i = 0; i < 4; i++){
  const angleRect = (i / 4) * Math.PI * 2;
  const angleTri = (i * 2 / 8) * Math.PI * 2;
  const xr = Math.cos(angleRect) * ring2Radius;
  const yr = Math.sin(angleRect) * ring2Radius;
  const xt = Math.cos(angleTri) * ring1Radius;
  const yt = Math.sin(angleTri) * ring1Radius;
  linePositions.push(xr, yr, 0.5);
  linePositions.push(xt, yt, 0);
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// ── Foreground accents — small geometric marks
const accentGroup = new THREE.Group();
scene.add(accentGroup);

// 12 small triangles scattered in z-depth
for (let i = 0; i < 12; i++){
  const angle = (i / 12) * Math.PI * 2;
  const r = 11 + (i % 3);
  const x = Math.cos(angle) * r;
  const y = Math.sin(angle) * r;
  const z = ((i % 4) - 2) * 1.5;
  const tri = makeTriangle(
    0.3,
    palette[i % 4 === 0 ? 0 : 2],
    new THREE.Vector3(x, y, z),
    new THREE.Euler(0, 0, angle)
  );
  accentGroup.add(tri);
}

// ── Motion law: slow uniform rotation of the entire shape assembly
// No randomness, no drift — pure geometric rotation like a kinetic sculpture
const rotationSpeed = 0.08; // degrees per second

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  
  // Rotate entire shape assembly around Y axis
  const rotY = (elapsed * rotationSpeed * Math.PI / 180);
  shapes.rotation.y = rotY;
  lines.rotation.y = rotY;
  accentGroup.rotation.y = rotY;
  
  // Sphere counter-rotates slowly on X axis
  sphere.rotation.x = elapsed * 0.03;
  sphere.rotation.y = elapsed * 0.02;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
