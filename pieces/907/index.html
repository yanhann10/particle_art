<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>907 · soap-bubble tree</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#070908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">907 · soap-bubble tree</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>
<div class="src">surprise · L-system tree + iridescent soap bubbles from branch tips</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES) {
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0,1,0), L = new THREE.Vector3(-1,0,0), U = new THREE.Vector3(0,0,1);
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone(), gen = 0;
  const rotate = (axis,ang) => { const q = new THREE.Quaternion().setFromAxisAngle(axis,ang); h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q); };
  for (const ch of str){
    switch(ch){
      case 'F': { const step = STEP_BASE*Math.pow(depthFactor,gen); const np = pos.clone().addScaledVector(h,step); segments.push({from:pos.clone(),to:np.clone(),gen}); pos=np; break; }
      case '+': rotate(u,+ANGLE); break; case '-': rotate(u,-ANGLE); break;
      case '&': rotate(l,+ANGLE); break; case '^': rotate(l,-ANGLE); break;
      case '/': rotate(h,+ANGLE); break; case '\\': rotate(h,-ANGLE); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen+=1; break;
      case ']': { const f=stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s=>s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3), seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN), lengths = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;
  for (let i=0; i<segments.length; i++){
    const share = i===segments.length-1 ? totalN-written : Math.max(1,Math.floor(totalN*lens[i]/total));
    for (let k=0; k<share && written<totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04*Math.pow(0.85,segments[i].gen);
      v.x+=(Math.random()-0.5)*jitter; v.y+=(Math.random()-0.5)*jitter; v.z+=(Math.random()-0.5)*jitter;
      positions[written*3]=v.x; positions[written*3+1]=v.y; positions[written*3+2]=v.z;
      seeds[written]=Math.random(); gens[written]=segments[i].gen; lengths[written]=t; written++;
    }
  }
  return { positions, seeds, gens, lengths };
}

/* ---- collect branch tips for bubble spawning ---- */
function collectTips(segments, maxGen){
  const tips = [];
  const thresh = Math.max(2, maxGen - 1);
  for (const s of segments) if (s.gen >= thresh) tips.push(s.to.clone());
  return tips;
}

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070908, 0.028);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 4, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070908, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 2, 0);

/* ---- soft ambient + directional for bubble PBR ---- */
scene.add(new THREE.AmbientLight(0x8090a0, 0.3));
const dLight = new THREE.DirectionalLight(0xffe8c8, 0.6);
dLight.position.set(-4, 12, 6); scene.add(dLight);

const N = 80000;
let geom, points, mat;

const beamPos = new THREE.Vector3(-3.5, 14, 2.5);
const uniforms = {
  uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uReady:{value:0},
  uBeamPos:{value:beamPos}, uBeamRadius:{value:1.8},
};
mat = new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uReady;
    uniform vec3 uBeamPos; uniform float uBeamRadius;
    attribute float seed, gen, lengthT;
    varying vec3 vCol; varying float vGen, vEnergy, vBeamDist;
    void main(){
      vec3 p = position;
      float t = uTime*0.5 + seed*6.28;
      float sway = 0.06*gen*(0.5+0.5*sin(t*0.7));
      p.x += sway*sin(t+p.y*0.3); p.z += sway*cos(t*0.9+p.y*0.3);
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0,1.0,uReady));
      vGen = gen; vEnergy = 0.5+0.5*sin(t*0.5);
      vBeamDist = length(p.xz - uBeamPos.xz);
      vec3 a = vec3(0.45,0.30,0.20);
      vec3 b = vec3(0.42,0.58,0.33);
      vec3 c = vec3(0.80,0.72,0.45);
      float k = clamp(gen*0.18,0.0,1.0);
      vCol = mix(a, b, k); vCol = mix(vCol, c, smoothstep(0.65,1.0,k));
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0+0.7*vEnergy)*uPixel*(40.0/dist)*(0.4+0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform float uBeamRadius;
    varying vec3 vCol; varying float vGen, vEnergy, vBeamDist;
    void main(){
      vec2 d = gl_PointCoord-0.5; float r = dot(d,d);
      if(r>0.25) discard;
      float inBeam = smoothstep(uBeamRadius+0.3, uBeamRadius-0.3, vBeamDist);
      float brightBoost = 1.0+0.8*inBeam;
      float a = exp(-r*17.0)*(0.55+0.45*vEnergy);
      gl_FragColor = vec4(vCol*a*brightBoost, a);
    }`
});

/* ---- volumetric beam with soft noise edge ---- */
const coneGeom = new THREE.ConeGeometry(1.8, 28, 32, 1, true);
const coneMat = new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uBeamColor:{value:new THREE.Color(0.90,0.85,0.65)} },
  transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    varying float vY; varying vec3 vPos;
    void main(){
      vPos = position;
      vY = (position.y+14.0)/28.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader:`
    uniform vec3 uBeamColor; uniform float uTime;
    varying float vY; varying vec3 vPos;
    // simple hash noise
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise2d(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                 mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
    }
    void main(){
      float falloff = smoothstep(0.0,0.4,vY);
      // noise-driven edge dissolve
      float n = noise2d(vPos.xz*1.5 + vec2(uTime*0.08, uTime*0.05));
      float edgeFade = smoothstep(0.0,0.3, n*0.6+0.2 - (1.0-falloff)*0.4);
      float a = 0.07 * falloff * edgeFade;
      gl_FragColor = vec4(uBeamColor*a, a);
    }`
});
const cone = new THREE.Mesh(coneGeom, coneMat);
cone.position.copy(beamPos); cone.rotation.x = Math.PI; scene.add(cone);

/* ---- SOAP BUBBLES via InstancedMesh + MeshPhysicalMaterial ---- */
const BUBBLE_COUNT = 100;
const bubbleGeo = new THREE.SphereGeometry(1, 16, 12);
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8d0c0, roughness: 0.0, metalness: 0.05,
  transmission: 0.92, thickness: 0.15, transparent: true, opacity: 0.6,
  iridescence: 1.0, iridescenceIOR: 1.35, iridescenceThicknessRange: [100, 400],
  envMapIntensity: 0.4, side: THREE.FrontSide,
});
const bubbles = new THREE.InstancedMesh(bubbleGeo, bubbleMat, BUBBLE_COUNT);
bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(bubbles);

// bubble state
const bState = [];
let tipPositions = [];
const dummy = new THREE.Object3D();

function initBubble(i, delayed){
  const tip = tipPositions.length > 0
    ? tipPositions[Math.floor(Math.random()*tipPositions.length)]
    : new THREE.Vector3((Math.random()-0.5)*4, 2+Math.random()*6, (Math.random()-0.5)*4);
  const baseR = 0.08 + Math.random()*0.18;
  bState[i] = {
    origin: tip.clone(),
    x: tip.x, y: tip.y, z: tip.z,
    radius: baseR, maxRadius: baseR,
    phase: Math.random()*Math.PI*2,
    driftX: (Math.random()-0.5)*0.15,
    driftZ: (Math.random()-0.5)*0.15,
    riseSpeed: 0.12 + Math.random()*0.18,
    life: 0, maxLife: 6 + Math.random()*10,
    delay: delayed ? Math.random()*5 : 0,
    growing: true, growDur: 0.8+Math.random()*0.6,
    popping: false, popTime: 0,
  };
}

function resetAllBubbles(){
  for (let i=0; i<BUBBLE_COUNT; i++) initBubble(i, true);
}

function updateBubbles(dt, t){
  for (let i=0; i<BUBBLE_COUNT; i++){
    const b = bState[i];
    if (b.delay > 0){ b.delay -= dt; dummy.scale.set(0,0,0); dummy.position.set(0,-100,0); dummy.updateMatrix(); bubbles.setMatrixAt(i,dummy.matrix); continue; }
    b.life += dt;
    if (b.popping){
      const pt = (t - b.popTime);
      const s = b.maxRadius * Math.max(0, 1.0 - pt*4.0);
      if (s <= 0.001){ initBubble(i, false); continue; }
      dummy.scale.set(s*1.3, s*0.7, s*1.3);
      dummy.position.set(b.x, b.y, b.z);
      dummy.updateMatrix(); bubbles.setMatrixAt(i, dummy.matrix); continue;
    }
    // grow phase
    let rScale = 1.0;
    if (b.growing){
      rScale = Math.min(1.0, b.life / b.growDur);
      if (rScale >= 1.0) b.growing = false;
    }
    // drift upward
    b.y += b.riseSpeed * dt;
    b.x += b.driftX * dt + Math.sin(t*0.7 + b.phase)*0.008;
    b.z += b.driftZ * dt + Math.cos(t*0.6 + b.phase*1.3)*0.008;
    // gentle wobble in radius
    const wobble = 1.0 + 0.06*Math.sin(t*2.5 + b.phase);
    const r = b.radius * rScale * wobble;
    dummy.scale.set(r, r, r);
    dummy.position.set(b.x, b.y, b.z);
    dummy.updateMatrix();
    bubbles.setMatrixAt(i, dummy.matrix);
    // pop if lifetime exceeded
    if (b.life > b.maxLife){ b.popping = true; b.popTime = t; }
  }
  bubbles.instanceMatrix.needsUpdate = true;
}

let revealStart = 0;

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => { s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; };
  const str = expand('F', 5, rng);
  const segs = turtle(str, 0.78);
  const bb = new THREE.Box3();
  for (const s of segs){ bb.expandByPoint(s.from); bb.expandByPoint(s.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const s of segs){
    s.from.x-=ctr.x; s.from.z-=ctr.z; s.from.y-=mn.y-(-7);
    s.to.x-=ctr.x; s.to.z-=ctr.z; s.to.y-=mn.y-(-7);
  }
  const maxGen = segs.reduce((m,s)=>Math.max(m,s.gen),0);
  tipPositions = collectTips(segs, maxGen);

  const { positions, seeds, gens, lengths } = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen', new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('lengthT', new THREE.BufferAttribute(lengths, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate=true;
    geom.attributes.seed.array.set(seeds); geom.attributes.seed.needsUpdate=true;
    geom.attributes.gen.array.set(gens); geom.attributes.gen.needsUpdate=true;
    geom.attributes.lengthT.array.set(lengths); geom.attributes.lengthT.needsUpdate=true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
  resetAllBubbles();
}

regrow(Math.floor(Math.random()*1e9));
addEventListener('click', () => regrow(Math.floor(Math.random()*1e9)));
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

const start = performance.now();
let prevT = 0;
function loop(){
  const now = performance.now();
  const t = (now-start)/1000;
  const dt = Math.min(t - prevT, 0.05); prevT = t;
  uniforms.uTime.value = t;
  coneMat.uniforms.uTime.value = t;
  if (revealStart>0) uniforms.uReady.value = Math.min(1.0,(now-revealStart)/2200);
  updateBubbles(dt, t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
