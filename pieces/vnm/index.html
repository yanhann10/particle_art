<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vnm · data-pour · particle ML dream</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">vnm</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Refik Anadol · data-pour · 200k+ particles in FBO GPGPU feedback loop
// Smooth flow field: particles drift as if ML training data flowing through
// latent space. Pearlescent cyan-violet duotone + white-hot highlights.
// Additive rendering for soft glow — no hard edges. Architectural scale.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08080d);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 12, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const SIZE = 512;  // 512×512 = 262k particles
const COUNT = SIZE * SIZE;

// ─────────── GPGPU position FBO setup (ping-pong for feedback)
const positionShader = {
  uniforms: {
    tPositions: { value: null },
    uTime: { value: 0 },
    uDelta: { value: 0 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tPositions;
    uniform float uTime;
    uniform float uDelta;
    varying vec2 vUv;

    // Smooth flow field (3D curl-noise simulation via composed sine waves)
    vec3 flow(vec3 p, float t) {
      float s1 = 0.8;
      float s2 = 1.3;
      float s3 = 0.6;
      vec3 f = vec3(
        sin(p.y * s1 + t * 0.4) * cos(p.z * s2 - t * 0.3),
        sin(p.z * s2 + t * 0.5) * cos(p.x * s3 + t * 0.2),
        sin(p.x * s3 - t * 0.3) * cos(p.y * s1 + t * 0.4)
      );
      return f * 0.6;
    }

    void main() {
      vec4 pos = texture2D(tPositions, vUv);
      vec3 p = pos.xyz;
      
      // Smooth flow advection
      vec3 vel = flow(p * 0.08, uTime * 0.1);
      p += vel * uDelta * 2.5;
      
      // Gentle containment sphere (soft repel from radius ~24)
      float d = length(p);
      if (d > 24.0) {
        p -= normalize(p) * (d - 24.0) * 0.08;
      }
      
      // Subtle upward drift (data rising)
      p.y += uDelta * 0.5;
      
      // Age tracking in .w
      float age = pos.w + uDelta * 0.02;
      
      // Respawn if too old or too far
      if (age > 1.0 || d > 40.0) {
        // Spawn at bottom in toroid
        float theta = vUv.x * 6.28318;
        float phi = (vUv.y - 0.5) * 3.14159 * 0.6;
        float r = 8.0 + fract(sin(vUv.x * 12.9898 + vUv.y * 78.233) * 43758.5453) * 6.0;
        p = vec3(
          cos(theta) * cos(phi) * r,
          -12.0 + sin(phi) * 4.0,
          sin(theta) * cos(phi) * r
        );
        age = 0.0;
      }
      
      gl_FragColor = vec4(p, age);
    }
  `
};

const rtA = new THREE.WebGLRenderTarget(SIZE, SIZE, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType,
});
const rtB = rtA.clone();

// Initialize positions
const initData = new Float32Array(SIZE * SIZE * 4);
for (let i = 0; i < SIZE; i++) {
  for (let j = 0; j < SIZE; j++) {
    const idx = (i * SIZE + j) * 4;
    const theta = (j / SIZE) * Math.PI * 2;
    const phi = ((i / SIZE) - 0.5) * Math.PI * 0.6;
    const r = 8 + Math.random() * 6;
    initData[idx + 0] = Math.cos(theta) * Math.cos(phi) * r;
    initData[idx + 1] = -12 + Math.sin(phi) * 4;
    initData[idx + 2] = Math.sin(theta) * Math.cos(phi) * r;
    initData[idx + 3] = Math.random();  // age
  }
}
const initTexture = new THREE.DataTexture(initData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
initTexture.needsUpdate = true;

const posScene = new THREE.Scene();
const posCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const posMat = new THREE.ShaderMaterial(positionShader);
const posQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), posMat);
posScene.add(posQuad);

rtA.texture = initTexture;
let currentRT = rtA, nextRT = rtB;

// ─────────── Particle rendering
const particleVert = `
  uniform sampler2D tPositions;
  uniform float uTime;
  uniform float uSize;
  varying float vAge;
  varying float vDepth;

  void main() {
    vec2 uv = position.xy;  // position.xy holds UV coords
    vec4 pos = texture2D(tPositions, uv);
    vec3 p = pos.xyz;
    vAge = pos.w;

    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
    vDepth = -mvPosition.z;
    gl_Position = projectionMatrix * mvPosition;

    // Smaller, crisper points — readable as individual marks
    float sizeMod = 1.0 - vAge * 0.5;
    gl_PointSize = uSize * sizeMod * (48.0 / vDepth);
  }
`;

const particleFrag = `
  varying float vAge;
  varying float vDepth;

  void main() {
    // Hard-edged circle — each particle reads as a distinct mark
    vec2 cxy = 2.0 * gl_PointCoord - 1.0;
    float r = dot(cxy, cxy);
    if (r > 0.25) discard;
    // Thin anti-aliased edge, otherwise opaque
    float alpha = 1.0 - smoothstep(0.18, 0.25, r);

    // Pearlescent cyan-violet duotone: white-hot core → cyan → violet
    vec3 col;
    if (vAge < 0.3) {
      float t = vAge / 0.3;
      col = mix(vec3(1.0, 1.0, 1.0), vec3(0.4, 0.9, 1.0), t);
    } else if (vAge < 0.7) {
      float t = (vAge - 0.3) / 0.4;
      col = mix(vec3(0.4, 0.9, 1.0), vec3(0.7, 0.5, 1.0), t);
    } else {
      float t = (vAge - 0.7) / 0.3;
      col = mix(vec3(0.7, 0.5, 1.0), vec3(0.3, 0.2, 0.5), t);
    }

    float brightness = 1.0 - smoothstep(10.0, 50.0, vDepth);
    col *= brightness * 1.2;

    // Legible opacity — marks, not fog
    alpha *= 0.62 * (1.0 - vAge * 0.45);

    gl_FragColor = vec4(col, alpha);
  }
`;

const particleGeo = new THREE.BufferGeometry();
const uvs = new Float32Array(COUNT * 2);
for (let i = 0; i < SIZE; i++) {
  for (let j = 0; j < SIZE; j++) {
    const idx = (i * SIZE + j) * 2;
    uvs[idx + 0] = j / SIZE;
    uvs[idx + 1] = i / SIZE;
  }
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(uvs, 2));

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    tPositions: { value: null },
    uTime: { value: 0 },
    uSize: { value: 2.8 },
  },
  vertexShader: particleVert,
  fragmentShader: particleFrag,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// Slow camera orbit
let camAngle = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(now) {
  const delta = Math.min((now - lastTime) * 0.001, 0.1);
  lastTime = now;
  const time = now * 0.001;

  // Update GPGPU position simulation
  posMat.uniforms.tPositions.value = currentRT.texture;
  posMat.uniforms.uTime.value = time;
  posMat.uniforms.uDelta.value = delta;
  renderer.setRenderTarget(nextRT);
  renderer.render(posScene, posCam);
  renderer.setRenderTarget(null);
  [currentRT, nextRT] = [nextRT, currentRT];

  // Update particle material
  particleMat.uniforms.tPositions.value = currentRT.texture;
  particleMat.uniforms.uTime.value = time;

  // Slow camera orbit (architectural view)
  camAngle += delta * 0.08;
  const radius = 28;
  camera.position.x = Math.cos(camAngle) * radius;
  camera.position.z = Math.sin(camAngle) * radius;
  camera.position.y = 12 + Math.sin(time * 0.2) * 3;
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
