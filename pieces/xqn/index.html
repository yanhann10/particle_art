<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xqn · relational field · Bourriaud 1998</title>
<!-- MOTION: gathering, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0808; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .status { position:fixed; right:14px; bottom:12px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">xqn · relational field · Bourriaud 1998</div>
<div class="hint" id="hint">waiting for social field to form...</div>
<div class="src">Nicolas Bourriaud · art as interhuman encounter</div>
<div class="status" id="status">channels: 0 · presences: 0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 8, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0808, 1);
document.body.appendChild(renderer.domElement);

// BroadcastChannel for cross-tab communication
const bc = new BroadcastChannel('relational_field');
let presenceCount = 1; // self
let channelIds = new Set([Math.random().toString(36).slice(2,9)]);
const myId = Array.from(channelIds)[0];

// Shared state: external "pulses" that create attraction points
const sharedAttractions = [];
const MAX_ATTRACTIONS = 12;

// Announce presence on load
bc.postMessage({ type: 'presence', id: myId, timestamp: Date.now() });

// Listen for other tabs
bc.onmessage = (e) => {
  const data = e.data;
  if (data.type === 'presence'){
    if (!channelIds.has(data.id)){
      channelIds.add(data.id);
      presenceCount = channelIds.size;
      // Send our presence back
      bc.postMessage({ type: 'presence', id: myId, timestamp: Date.now() });
    }
  } else if (data.type === 'pulse'){
    // Another viewer clicked — add an attraction point
    sharedAttractions.push({
      pos: new THREE.Vector3(data.x, data.y, data.z),
      strength: data.strength || 1.0,
      decay: 0.98,
      born: Date.now()
    });
    if (sharedAttractions.length > MAX_ATTRACTIONS) sharedAttractions.shift();
  }
};

// Ping presence every 3s
setInterval(() => {
  bc.postMessage({ type: 'presence', id: myId, timestamp: Date.now() });
}, 3000);

// Clean stale presences (no ping in 10s)
setInterval(() => {
  const now = Date.now();
  channelIds.forEach(id => {
    // This is simplified — real impl would track last-seen per id
    // For demo: just assume all reported are active
  });
}, 10000);

// WebSocket to Binance public ticker (fallback if fails: proceed with BroadcastChannel only)
let ws = null;
let wsConnected = false;
let lastPrice = null;

try {
  ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  ws.onopen = () => {
    wsConnected = true;
  };
  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.p){
        const price = parseFloat(data.p);
        if (lastPrice !== null){
          const delta = price - lastPrice;
          const strength = Math.abs(delta) * 0.001; // scale
          // Price movement creates attraction point
          const angle = Math.random() * Math.PI * 2;
          const radius = 8 + Math.random() * 6;
          sharedAttractions.push({
            pos: new THREE.Vector3(
              Math.cos(angle) * radius,
              (Math.random() - 0.5) * 10,
              Math.sin(angle) * radius
            ),
            strength: Math.min(strength, 2.0),
            decay: 0.96,
            born: Date.now()
          });
          if (sharedAttractions.length > MAX_ATTRACTIONS) sharedAttractions.shift();
        }
        lastPrice = price;
      }
    } catch(err){}
  };
  ws.onerror = () => { wsConnected = false; };
  ws.onclose = () => { wsConnected = false; };
} catch(err){
  wsConnected = false;
}

// Particle system
const N = 2400;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const affiliations = new Float32Array(N); // which presence point this particle relates to

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 15 + Math.random() * 8;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  
  velocities[i*3] = (Math.random() - 0.5) * 0.4;
  velocities[i*3+1] = (Math.random() - 0.5) * 0.4;
  velocities[i*3+2] = (Math.random() - 0.5) * 0.4;
  
  seeds[i] = Math.random();
  affiliations[i] = Math.random();
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPresenceCount: { value: 1 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPresenceCount;
    attribute float seed;
    attribute float affiliation;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.4;
      float pulse = 0.5 + 0.5 * sin(phase);
      
      // Bourriaud palette: warm communal tones — terracotta, ochre, soft rose, cream
      vec3 c0 = vec3(0.76, 0.42, 0.32); // terracotta
      vec3 c1 = vec3(0.88, 0.72, 0.48); // ochre
      vec3 c2 = vec3(0.92, 0.82, 0.78); // cream
      
      float presence_factor = min(uPresenceCount / 5.0, 1.0);
      float colorPhase = affiliation + presence_factor * 0.3;
      vCol = mix(c0, c1, fract(colorPhase));
      vCol = mix(vCol, c2, smoothstep(0.6, 1.0, pulse) * presence_factor);
      
      vAlpha = 0.4 + 0.4 * pulse + presence_factor * 0.2;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (2.2 + pulse * 1.5) * uPixel * (50.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('affiliation', new THREE.BufferAttribute(affiliations, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Visual markers for attraction points
const attractionGeom = new THREE.SphereGeometry(0.8, 8, 8);
const attractionMeshes = [];
for (let i = 0; i < MAX_ATTRACTIONS; i++){
  const mesh = new THREE.Mesh(
    attractionGeom,
    new THREE.MeshBasicMaterial({ 
      color: 0xe8b48a, 
      transparent: true, 
      opacity: 0,
      depthWrite: false
    })
  );
  scene.add(mesh);
  attractionMeshes.push(mesh);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Click to send pulse
renderer.domElement.addEventListener('click', (e) => {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  
  const vec = new THREE.Vector3(x, y, 0.5);
  vec.unproject(camera);
  vec.sub(camera.position).normalize();
  const distance = 20;
  const pos = camera.position.clone().add(vec.multiplyScalar(distance));
  
  sharedAttractions.push({
    pos: pos,
    strength: 1.5,
    decay: 0.98,
    born: Date.now()
  });
  if (sharedAttractions.length > MAX_ATTRACTIONS) sharedAttractions.shift();
  
  // Broadcast to other tabs
  bc.postMessage({ 
    type: 'pulse', 
    id: myId,
    x: pos.x, 
    y: pos.y, 
    z: pos.z,
    strength: 1.5,
    timestamp: Date.now()
  });
});

const hintEl = document.getElementById('hint');
const statusEl = document.getElementById('status');

function updateParticles(dt){
  // Decay attractions
  for (let i = sharedAttractions.length - 1; i >= 0; i--){
    sharedAttractions[i].strength *= sharedAttractions[i].decay;
    if (sharedAttractions[i].strength < 0.05 || Date.now() - sharedAttractions[i].born > 15000){
      sharedAttractions.splice(i, 1);
    }
  }
  
  // Update attraction meshes
  attractionMeshes.forEach((mesh, i) => {
    if (i < sharedAttractions.length){
      const att = sharedAttractions[i];
      mesh.position.copy(att.pos);
      mesh.material.opacity = att.strength * 0.4;
      mesh.scale.setScalar(1.0 + att.strength * 0.5);
    } else {
      mesh.material.opacity = 0;
    }
  });
  
  // Particles are attracted to shared attraction points
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    let fx = 0, fy = 0, fz = 0;
    
    // Attraction to shared points
    sharedAttractions.forEach(att => {
      const dx = att.pos.x - px;
      const dy = att.pos.y - py;
      const dz = att.pos.z - pz;
      const distSq = dx*dx + dy*dy + dz*dz + 0.1;
      const dist = Math.sqrt(distSq);
      const force = att.strength * 0.015 / distSq;
      fx += (dx / dist) * force;
      fy += (dy / dist) * force;
      fz += (dz / dist) * force;
    });
    
    // Gentle drift
    fx += (Math.random() - 0.5) * 0.008;
    fy += (Math.random() - 0.5) * 0.008;
    fz += (Math.random() - 0.5) * 0.008;
    
    // Boundary containment
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > 25){
      const bound_force = (distFromCenter - 25) * 0.02;
      fx -= (px / distFromCenter) * bound_force;
      fy -= (py / distFromCenter) * bound_force;
      fz -= (pz / distFromCenter) * bound_force;
    }
    
    velocities[i*3]   += fx * dt;
    velocities[i*3+1] += fy * dt;
    velocities[i*3+2] += fz * dt;
    
    // Damping
    velocities[i*3]   *= 0.98;
    velocities[i*3+1] *= 0.98;
    velocities[i*3+2] *= 0.98;
    
    // Clamp
    const speed = Math.sqrt(
      velocities[i*3]*velocities[i*3] + 
      velocities[i*3+1]*velocities[i*3+1] + 
      velocities[i*3+2]*velocities[i*3+2]
    );
    if (speed > 2.0){
      velocities[i*3]   *= 2.0 / speed;
      velocities[i*3+1] *= 2.0 / speed;
      velocities[i*3+2] *= 2.0 / speed;
    }
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();
}

const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  const angle = performance.now() * 0.00006;
  camera.position.x = centroid.x + Math.cos(angle) * 32;
  camera.position.z = centroid.z + Math.sin(angle) * 32;
  camera.position.y = centroid.y + Math.sin(angle * 0.6) * 8;
  camera.lookAt(centroid);
}

let lastTime = performance.now();
const start = performance.now();
let frameCount = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;
  
  frameCount++;
  if (frameCount % 60 === 0){
    presenceCount = channelIds.size;
    uniforms.uPresenceCount.value = presenceCount;
    
    const channels = (wsConnected ? 1 : 0) + 1; // ws + broadcast
    statusEl.textContent = `channels: ${channels} · presences: ${presenceCount} · pulses: ${sharedAttractions.length}`;
    
    if (presenceCount === 1 && sharedAttractions.length === 0){
      hintEl.textContent = 'open another tab or wait for price movement · click to create encounter';
    } else if (presenceCount > 1){
      hintEl.textContent = `relational field active · ${presenceCount} viewers co-present · Bourriaud 1998`;
    } else if (sharedAttractions.length > 0){
      hintEl.textContent = `external pulse received · ${sharedAttractions.length} active attraction points`;
    }
  }
  
  uniforms.uTime.value = t;
  updateParticles(dt * 60);
  updateCamera();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
