<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jgt · Shiota × af Klint — thread incantation</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#030303; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">jgt</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);
scene.fog = new THREE.FogExp2(0x020202, 0.022);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x180505, 0.8));
const dL = new THREE.DirectionalLight(0xffeedd, 0.35);
dL.position.set(-4, 6, 3);
scene.add(dL);
const pL = new THREE.PointLight(0x220505, 0.5, 20);
pL.position.set(2, 3, -6);
scene.add(pL);

// Incantation glow — warm amber point light pulsing from the sphere
const ritualLight = new THREE.PointLight(0xd4930a, 0.0, 18);
scene.add(ritualLight);

let seed = 48271953;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── Suspended sphere — the still center, now awakened by incantation
const sphereR = 1.8;
const spherePos = new THREE.Vector3(1.2, 0.4, -4.5);
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf5ede2, emissive: 0xf5ede2, emissiveIntensity: 0.6,
    roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.22,
    side: THREE.DoubleSide, depthWrite: false
  })
);
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

// Inner glow core — now pulses with ritual amber
const coreMat = new THREE.MeshBasicMaterial({
  color: 0xfff8f0, transparent: true, opacity: 0.35
});
const coreMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.4, 12, 8), coreMat
);
coreMesh.position.copy(spherePos);
scene.add(coreMesh);

// ── Suspended dress — Shiota's remembered object
const dressGroup = new THREE.Group();
const bodiceGeo = new THREE.CylinderGeometry(0.18, 0.32, 0.7, 8);
const dressMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a0a, roughness: 0.7, metalness: 0.3,
  transparent: true, opacity: 0.75
});
const bodice = new THREE.Mesh(bodiceGeo, dressMat);
dressGroup.add(bodice);
const skirtGeo = new THREE.ConeGeometry(0.6, 1.2, 10, 1, true);
const skirt = new THREE.Mesh(skirtGeo, dressMat);
skirt.position.y = -0.9;
skirt.rotation.x = Math.PI;
dressGroup.add(skirt);
const sleeveGeo = new THREE.CylinderGeometry(0.06, 0.04, 0.55, 6);
const sleeveL = new THREE.Mesh(sleeveGeo, dressMat);
sleeveL.position.set(-0.28, 0.15, 0);
sleeveL.rotation.z = 0.6;
const sleeveR = new THREE.Mesh(sleeveGeo, dressMat);
sleeveR.position.set(0.28, 0.15, 0);
sleeveR.rotation.z = -0.6;
dressGroup.add(sleeveL, sleeveR);

const dressPos = new THREE.Vector3(spherePos.x - 0.3, spherePos.y + 0.2, spherePos.z + 1.5);
dressGroup.position.copy(dressPos);
dressGroup.rotation.set(0.08, 0.3, 0.05);
scene.add(dressGroup);

// ── Room boundaries
const ROOM = { w: 20, h: 14, d: 30 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Anchor points clustered around sphere and dress
const NUM_ANCHORS = 800;
const anchors = [];
for(let i=0; i<NUM_ANCHORS; i++){
  if(rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereR + 0.05 + rng()*2.8;
    anchors.push(spherePos.clone().add(dir.multiplyScalar(dist)));
  } else if(rng() < 0.25){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    anchors.push(dressPos.clone().add(dir.multiplyScalar(0.2 + rng()*2.0)));
  } else if(rng() < 0.4){
    const p = wallPt();
    p.lerp(spherePos, 0.2 + rng()*0.4);
    anchors.push(p);
  } else {
    anchors.push(wallPt());
  }
}

// ── Build line segments — original threads + ritual ring threads
const NUM_LINES = 20000;
const NUM_RING_LINES = 4000;
const TOTAL_LINES = NUM_LINES + NUM_RING_LINES;
const positions = new Float32Array(TOTAL_LINES * 6);
let li = 0;

function sphereSurf(from){
  const dir = spherePos.clone().sub(from).normalize();
  return spherePos.clone().sub(dir.multiplyScalar(sphereR * (0.95 + rng()*0.08)));
}

function dressSurf(){
  return dressPos.clone().add(new THREE.Vector3(
    (rng()-0.5)*0.5, (rng()-0.5)*1.4, (rng()-0.5)*0.4
  ));
}

function setLine(a, b){
  if(li >= TOTAL_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Cat A: converging on sphere (42%)
const catA = Math.floor(NUM_LINES * 0.42);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, sphereSurf(a));
}

// Cat B: converging on dress (15%)
const catB = Math.floor(NUM_LINES * 0.15);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = rng()<0.55 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, dressSurf());
}

// Cat C: wall-to-wall threads passing through dense region (22%)
const catC = Math.floor(NUM_LINES * 0.22);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 8 && rng() > 0.12){ i--; continue; }
  setLine(a, b);
}

// Cat D: short local web between nearby anchors
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.1){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

// ── INCANTATION: Concentric ritual rings around the sphere
// Inspired by Hilma af Klint's spiritual diagrams — thread becomes scripture
const NUM_RINGS = 7;
const ringStartIdx = li;
for(let r = 0; r < NUM_RINGS; r++){
  const ringR = sphereR * (1.3 + r * 0.55);
  const tiltX = (rng() - 0.5) * 0.7;
  const tiltZ = (rng() - 0.5) * 0.7;
  const segsPerRing = Math.floor(NUM_RING_LINES / NUM_RINGS);
  const yOff = (r - NUM_RINGS/2) * 0.25;

  for(let s = 0; s < segsPerRing && li < TOTAL_LINES; s++){
    const a1 = (s / segsPerRing) * Math.PI * 2;
    const a2 = ((s + 1) / segsPerRing) * Math.PI * 2;
    // Slight irregularity — hand-drawn, not mechanical
    const wobble1 = 1.0 + Math.sin(a1 * 5 + r) * 0.04;
    const wobble2 = 1.0 + Math.sin(a2 * 5 + r) * 0.04;
    const p1 = new THREE.Vector3(
      Math.cos(a1) * ringR * wobble1,
      yOff + Math.sin(a1 * 3) * 0.08,
      Math.sin(a1) * ringR * wobble1
    );
    const p2 = new THREE.Vector3(
      Math.cos(a2) * ringR * wobble2,
      yOff + Math.sin(a2 * 3) * 0.08,
      Math.sin(a2) * ringR * wobble2
    );
    // Apply tilt
    p1.applyAxisAngle(new THREE.Vector3(1,0,0), tiltX);
    p1.applyAxisAngle(new THREE.Vector3(0,0,1), tiltZ);
    p2.applyAxisAngle(new THREE.Vector3(1,0,0), tiltX);
    p2.applyAxisAngle(new THREE.Vector3(0,0,1), tiltZ);
    // Translate to sphere center
    p1.add(spherePos);
    p2.add(spherePos);
    setLine(p1, p2);
  }
}
const ringEndIdx = li;

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color: original threads red, ritual rings shift toward amber
const colors = new Float32Array(TOTAL_LINES * 6);
const baseRed = new THREE.Color(0xc20018);
const ritualAmber = new THREE.Color(0xc47a10);
for(let i = 0; i < TOTAL_LINES; i++){
  const isRing = i >= ringStartIdx && i < ringEndIdx;
  const c = isRing ? ritualAmber : baseRed;
  colors[i*6]   = c.r; colors[i*6+1] = c.g; colors[i*6+2] = c.b;
  colors[i*6+3] = c.r; colors[i*6+4] = c.g; colors[i*6+5] = c.b;
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── INCANTATION MOTES — tiny particles rising from the sphere
// Like whispered syllables made visible, ascending slowly
const NUM_MOTES = 600;
const moteGeo = new THREE.BufferGeometry();
const motePos = new Float32Array(NUM_MOTES * 3);
const moteSpeeds = new Float32Array(NUM_MOTES);
const motePhases = new Float32Array(NUM_MOTES);
const moteRadii = new Float32Array(NUM_MOTES);

for(let i = 0; i < NUM_MOTES; i++){
  const ang = rng() * Math.PI * 2;
  const r = sphereR * (0.3 + rng() * 1.2);
  motePos[i*3]     = spherePos.x + Math.cos(ang) * r;
  motePos[i*3 + 1] = spherePos.y - 1 + rng() * 6;
  motePos[i*3 + 2] = spherePos.z + Math.sin(ang) * r;
  moteSpeeds[i] = 0.08 + rng() * 0.18;
  motePhases[i] = rng() * Math.PI * 2;
  moteRadii[i] = r;
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));

const moteMat = new THREE.PointsMaterial({
  color: 0xd4a040,
  size: 0.04,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const motes = new THREE.Points(moteGeo, moteMat);
scene.add(motes);

// ── Dark fragments — charred paper caught in threads
const NUM_FRAGS = 35;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.025 + rng()*0.1;
  const geo = rng()>0.6
    ? new THREE.BoxGeometry(sz, sz*(0.3+rng()*1.5), sz*(0.2+rng()))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.015 + rng()*0.035;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.5, d*0.4),
    transparent: true, opacity: 0.4 + rng()*0.45
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.2 + rng()*0.6;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// ── Camera path — slow dolly INSIDE the web
const dollyPath = [];
const pathLen = 240;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;
  const x = spherePos.x + Math.sin(phase) * 3.8 + Math.sin(phase*1.7)*1.5;
  const y = spherePos.y + Math.sin(phase*0.6 + 0.9) * 1.8 + Math.cos(phase*1.3)*0.6;
  const z = spherePos.z + Math.cos(phase) * 5.5 + Math.cos(phase*0.4)*1.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Incantation rhythm — a slow triple-beat pulse like chanted syllables
  const chant = Math.pow(Math.abs(Math.sin(t * 0.35)), 3.0);
  const chantSlow = Math.pow(Math.abs(Math.sin(t * 0.12)), 2.0);

  // Breathing on threads — modulated by chant rhythm
  const breathAmp = 0.008 + chant * 0.012;
  const breathFreq = 0.18;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<TOTAL_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.4 + by*0.9 + bz*0.25;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.6;
    arr[i+2] = bz + s*0.4;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Ring threads pulse in opacity with the chant
  const colArr = lineGeo.attributes.color.array;
  const ringIntensity = 0.7 + chant * 0.3;
  for(let i = ringStartIdx; i < ringEndIdx; i++){
    const c = ritualAmber.clone().multiplyScalar(ringIntensity);
    colArr[i*6]   = c.r; colArr[i*6+1] = c.g; colArr[i*6+2] = c.b;
    colArr[i*6+3] = c.r; colArr[i*6+4] = c.g; colArr[i*6+5] = c.b;
  }
  lineGeo.attributes.color.needsUpdate = true;

  // Thread opacity swells with chant
  threads.material.opacity = 0.055 + chant * 0.035;

  // Ritual light pulses from sphere
  ritualLight.position.copy(spherePos);
  ritualLight.intensity = chant * 0.6;

  // Core shifts from cool white to warm amber with the chant
  coreMat.color.setRGB(
    1.0,
    0.97 - chant * 0.2,
    0.94 - chant * 0.45
  );
  coreMat.opacity = 0.3 + chant * 0.25;

  // Sphere emissive responds
  sphereMesh.material.emissiveIntensity = 0.6 + chant * 0.4;

  // Motes — ascending syllables, spiral upward
  const mp = moteGeo.attributes.position.array;
  for(let i = 0; i < NUM_MOTES; i++){
    const yBase = spherePos.y - 1;
    const yRange = 7;
    mp[i*3 + 1] += moteSpeeds[i] * 0.016;
    if(mp[i*3+1] > yBase + yRange){
      mp[i*3+1] = yBase;
    }
    // Gentle spiral
    const ang = t * 0.1 + motePhases[i];
    const drift = Math.sin(ang) * 0.003;
    mp[i*3]   += drift;
    mp[i*3+2] += Math.cos(ang) * 0.003;
  }
  moteGeo.attributes.position.needsUpdate = true;
  moteMat.opacity = 0.25 + chantSlow * 0.35;

  // Camera dolly
  const speed = 0.005;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere/dress blend
  const lookBlend = 0.5 + Math.sin(t * 0.015) * 0.4;
  const lookTarget = spherePos.clone().lerp(dressPos, lookBlend);
  lookTarget.x += Math.sin(t*0.021)*0.4;
  lookTarget.y += Math.cos(t*0.014)*0.25;
  camera.lookAt(lookTarget);

  // Dress sway — slightly more animated, as if stirred by spoken air
  dressGroup.rotation.z = 0.05 + Math.sin(t * 0.08) * 0.012 + chant * 0.008;
  dressGroup.rotation.x = 0.08 + Math.cos(t * 0.06) * 0.008;

  // Sphere soft pulse
  const pulse = 1.0 + Math.sin(t * 0.12) * 0.006 + chant * 0.015;
  sphereMesh.scale.setScalar(pulse);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
