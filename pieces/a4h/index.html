<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a4h · climate data streams</title>
<!-- MOTION: flow, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#080a0d; overflow:hidden;
               color:#4dd4d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">a4h</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 18);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080a0d, 1);
document.body.appendChild(renderer.domElement);

// text corpus — climate misinformation fragments + real data
const TRUTH_PHRASES = [
  '+1.1°C', '415ppm CO₂', 'IPCC AR6', '2050 net-zero', 'sea level +3mm/yr',
  'glacial retreat', 'carbon budget', 'renewable transition', 'climate science consensus'
];
const DISTORTION_PHRASES = [
  'natural cycles', 'sunspot theory', 'hockey stick hoax', 'CO₂ is plant food',
  'no warming since 1998', 'ice age coming', 'climate always changed', 'model uncertainty',
  'benefits outweigh costs', 'technological salvation', 'too expensive to act'
];

// THREE text sprites
function makeTextSprite(txt, color, size=0.4){
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 256; canvas.height = 64;
  ctx.font = 'bold 24px ui-monospace, monospace';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(txt, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.85 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(size * 4, size, 1);
  return sprite;
}

// Vector field nodes — truth attractor + distortion repeller
const truthNode = new THREE.Vector3(0, 2, 0);
const distortNode = new THREE.Vector3(0, -2, 0);

// marker spheres for nodes
const truthMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0x4dd4d8, transparent: true, opacity: 0.6 })
);
truthMarker.position.copy(truthNode);
scene.add(truthMarker);

const distortMarker = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xd84d4d, transparent: true, opacity: 0.6 })
);
distortMarker.position.copy(distortNode);
scene.add(distortMarker);

// transparent containment volumes
const boxGeom = new THREE.BoxGeometry(12, 4, 8);
const boxMat = new THREE.MeshBasicMaterial({ color: 0x1a3a3c, transparent: true, opacity: 0.12, wireframe: true });
const truthBox = new THREE.Mesh(boxGeom, boxMat);
truthBox.position.set(0, 2, 0);
scene.add(truthBox);

const distortBox = new THREE.Mesh(boxGeom, boxMat);
distortBox.position.set(0, -2, 0);
scene.add(distortBox);

// particle text streams
const N_TRUTH = 120;
const N_DISTORT = 180;
const truthParticles = [];
const distortParticles = [];

for (let i = 0; i < N_TRUTH; i++){
  const txt = TRUTH_PHRASES[Math.floor(Math.random() * TRUTH_PHRASES.length)];
  const sprite = makeTextSprite(txt, '#4dd4d8', 0.35);
  sprite.position.set(
    (Math.random() - 0.5) * 16,
    (Math.random() - 0.5) * 2 + 4,
    (Math.random() - 0.5) * 12
  );
  sprite.userData.vel = new THREE.Vector3(
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5
  );
  sprite.userData.type = 'truth';
  sprite.userData.age = Math.random() * 10;
  scene.add(sprite);
  truthParticles.push(sprite);
}

for (let i = 0; i < N_DISTORT; i++){
  const txt = DISTORTION_PHRASES[Math.floor(Math.random() * DISTORTION_PHRASES.length)];
  const sprite = makeTextSprite(txt, '#d84d4d', 0.35);
  sprite.position.set(
    (Math.random() - 0.5) * 16,
    (Math.random() - 0.5) * 2 - 4,
    (Math.random() - 0.5) * 12
  );
  sprite.userData.vel = new THREE.Vector3(
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5,
    (Math.random() - 0.5) * 0.5
  );
  sprite.userData.type = 'distort';
  sprite.userData.age = Math.random() * 10;
  scene.add(sprite);
  distortParticles.push(sprite);
}

// vector field function
function vectorField(pos, t){
  const toTruth = new THREE.Vector3().subVectors(truthNode, pos);
  const distTruth = toTruth.length();
  const toDistort = new THREE.Vector3().subVectors(distortNode, pos);
  const distDistort = toDistort.length();
  
  // truth pulls, distortion repels
  const truthForce = toTruth.normalize().multiplyScalar(1.2 / Math.max(distTruth, 0.5));
  const distortForce = toDistort.normalize().multiplyScalar(-1.5 / Math.max(distDistort, 0.5));
  
  // curl noise for turbulence
  const curl = new THREE.Vector3(
    Math.sin(pos.y * 0.4 + t * 0.3) * Math.cos(pos.z * 0.3),
    Math.cos(pos.x * 0.3 + t * 0.4) * Math.sin(pos.z * 0.4),
    Math.sin(pos.x * 0.4) * Math.cos(pos.y * 0.3 + t * 0.2)
  ).multiplyScalar(0.4);
  
  return truthForce.add(distortForce).add(curl);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = 0.016;
  
  // animate node positions — gentle oscillation
  truthNode.x = Math.sin(t * 0.3) * 1.5;
  truthNode.z = Math.cos(t * 0.4) * 1.2;
  truthMarker.position.copy(truthNode);
  truthBox.position.copy(truthNode);
  
  distortNode.x = Math.cos(t * 0.25) * 1.8;
  distortNode.z = Math.sin(t * 0.35) * 1.4;
  distortMarker.position.copy(distortNode);
  distortBox.position.copy(distortNode);
  
  // update truth particles
  truthParticles.forEach(p => {
    const force = vectorField(p.position, t);
    p.userData.vel.add(force.multiplyScalar(dt * 0.8));
    p.userData.vel.multiplyScalar(0.97); // damping
    p.position.add(p.userData.vel.clone().multiplyScalar(dt * 4));
    
    // wrap bounds
    if (Math.abs(p.position.x) > 10) p.position.x *= -0.9;
    if (Math.abs(p.position.y - 2) > 6) p.position.y = 2 + (Math.random() - 0.5) * 2;
    if (Math.abs(p.position.z) > 8) p.position.z *= -0.9;
    
    // fade in/out cycle
    p.userData.age += dt;
    const cycle = (p.userData.age % 8);
    p.material.opacity = cycle < 1 ? cycle : (cycle > 7 ? 8 - cycle : 1);
    p.material.opacity *= 0.85;
  });
  
  // update distortion particles
  distortParticles.forEach(p => {
    const force = vectorField(p.position, t);
    p.userData.vel.add(force.multiplyScalar(dt * 1.2));
    p.userData.vel.multiplyScalar(0.95); // more chaotic
    p.position.add(p.userData.vel.clone().multiplyScalar(dt * 5));
    
    // wrap bounds
    if (Math.abs(p.position.x) > 10) p.position.x *= -0.9;
    if (Math.abs(p.position.y + 2) > 6) p.position.y = -2 + (Math.random() - 0.5) * 2;
    if (Math.abs(p.position.z) > 8) p.position.z *= -0.9;
    
    // fade + turbulence flicker
    p.userData.age += dt;
    const cycle = (p.userData.age % 6);
    const flicker = 0.5 + 0.5 * Math.sin(t * 12 + p.position.x * 4);
    p.material.opacity = (cycle < 0.8 ? cycle / 0.8 : (cycle > 5 ? (6 - cycle) : 1)) * 0.85 * flicker;
  });
  
  // camera gentle orbit
  camera.position.x = Math.sin(t * 0.08) * 4;
  camera.position.y = 6 + Math.sin(t * 0.12) * 1.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
