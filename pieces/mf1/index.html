<style>

<body>
<div class="id">mf1</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0022);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050101, 0.004));
const warmL = new THREE.PointLight(0xff2810, 0.008, 35, 2.0);
warmL.position.set(-2, 10, -3);
scene.add(warmL);

let seed = 7391528;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// Room — taller, narrower: a chapel, not a gallery
const ROOM = { w:18, h:24, d:18 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ONE SPHERE — the still center, a moon in the circulatory cosmos
// Shiota's Uncertain Journey (2016): one form suspended in red thread cathedral
// Here: a pale stone-like sphere — memory condensed to a single point
const sphereCenter = new THREE.Vector3(0.6, 1.2, -0.4);
const sphereR = 1.6;

const sMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8d8, emissive: 0xf0e8d8, emissiveIntensity: 0.65,
  roughness: 0.95, transparent: true, opacity: 0.28
});
const sphere = new THREE.Mesh(new THREE.SphereGeometry(sphereR, 24, 16), sMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0xfff4e0, 0.009, 8, 2);
sphereGlow.position.copy(sphereCenter);
scene.add(sphereGlow);

function sphereSurf(center, r){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    center.x+Math.sin(v)*Math.cos(u)*r,
    center.y+Math.sin(v)*Math.sin(u)*r,
    center.z+Math.cos(v)*r
  );
}

// ── FRAGMENTS — charred diary pages, torn letters, caught in the web
const fragments = [];
for(let i=0; i<22; i++){
  const u2=rng()*Math.PI*2, v2=Math.acos(2*rng()-1);
  const r=2.8+rng()*6.0;
  const pos = new THREE.Vector3(
    sphereCenter.x+Math.sin(v2)*Math.cos(u2)*r,
    sphereCenter.y+Math.sin(v2)*Math.sin(u2)*r*0.7,
    sphereCenter.z+Math.cos(v2)*r
  );
  if(Math.abs(pos.x)<hw-1 && Math.abs(pos.y)<hh-1 && Math.abs(pos.z)<hd-1){
    fragments.push(pos);
  }
}

for(const fp of fragments){
  const s = 0.08+rng()*0.16;
  const corners = [];
  const nc = 4+Math.floor(rng()*3);
  for(let c=0; c<nc; c++){
    const ca = (c/nc)*Math.PI*2+rng()*0.5;
    const cr = s*(0.3+rng());
    corners.push(new THREE.Vector3(Math.cos(ca)*cr, Math.sin(ca)*cr, (rng()-0.5)*s*0.15));
  }
  const pts = [];
  for(let c=0; c<corners.length; c++){
    const n=(c+1)%corners.length;
    pts.push(corners[c].x,corners[c].y,corners[c].z, corners[n].x,corners[n].y,corners[n].z);
  }
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0c0806, transparent:true, opacity:0.4
  }));
  fMesh.position.copy(fp);
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  scene.add(fMesh);
}

// ── VOID ZONES — cylindrical gaps for the camera to breathe through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.7;
  const vr=4.5+rng()*2.0;
  voids.push({ x:sphereCenter.x+Math.cos(a)*vr, z:sphereCenter.z+Math.sin(a)*vr, r:1.1+rng()*0.5 });
}
function inVoid(p){
  for(const v of voids){ const dx=p.x-v.x, dz=p.z-v.z; if(dx*dx+dz*dz<v.r*v.r) return true; }
  return false;
}

// ── ANCHOR POINTS — truncated icosahedron shells radiating from the sphere
const icoGeo2 = new THREE.IcosahedronGeometry(1, 2);
const icoPos = icoGeo2.attributes.position;
const icoNorms = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNorms.push(v); }
}

const anchors = [];
const shellRadii = [2.8, 4.2, 6.0, 8.0, 10.5];
for(const sr of shellRadii){
  for(const n of icoNorms){
    const pt = new THREE.Vector3(
      sphereCenter.x+n.x*sr,
      sphereCenter.y+n.y*sr*0.8,
      sphereCenter.z+n.z*sr
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
      anchors.push(pt);
    }
  }
}

// Wall anchors — where threads terminate into architecture
for(let i=0; i<70; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}

// Fragment anchors
for(const fp of fragments) anchors.push(fp.clone());

// ── BUILD THREAD NETWORK — 20,000 segments budget
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES); // 0=suspend 1=converge 2=web 3=dendrite 4=radial
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION THREADS — from ceiling, making the hanging legible
// 8 primary suspension lines + 4 secondary — physical honesty
for(let i=0; i<10; i++){
  const a=(i/10)*Math.PI*2+(rng()-0.5)*0.25;
  const spread = i<6 ? 0.2+rng()*0.3 : 0.8+rng()*0.5;
  const top = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*spread*2.5,
    hh,
    sphereCenter.z+Math.sin(a)*spread*2.5
  );
  const bot = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*0.06,
    sphereCenter.y+sphereR-0.03,
    sphereCenter.z+Math.sin(a)*0.06
  );
  setLine(top, bot, 0);
  // Some double up — redundancy of care
  if(rng()<0.4){
    const top2 = top.clone();
    top2.x += (rng()-0.5)*0.8;
    top2.z += (rng()-0.5)*0.8;
    setLine(top2, bot.clone(), 0);
  }
}

// ── CONVERGENCE — every anchor reaches toward the sphere
// The circulatory metaphor: all threads as blood vessels → heart
for(let i=0; i<anchors.length && li<NUM_LINES-200; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  // Closer anchors get more threads (density follows proximity)
  const count = d<3.5?4 : d<5.5?3 : d<8.0?2 : 1;
  for(let j=0; j<count && li<NUM_LINES; j++){
    const target = sphereSurf(sphereCenter, sphereR);
    // 8% of threads stop short — Quayola directive: threads that almost reach but fail
    if(rng()<0.08){
      const dir = a.clone().sub(target).normalize();
      const shortfall = 0.3+rng()*1.2;
      setLine(a, target.clone().add(dir.multiplyScalar(shortfall)), 1);
    } else {
      setLine(a, target, 1);
    }
  }
}

// ── PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 4.2;
let webCount=0, attempts=0;
while(webCount<5500 && li<NUM_LINES && attempts<40000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<12; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  webCount++;
}

// ── DENDRITIC BRANCHES — Y-forking chains, 3 generations
// Andy Lomas directive: morphogenetic growth, not placement
for(let i=0; i<180 && li<NUM_LINES-8; i++){
  const root = anchors[Math.floor(rng()*anchors.length)];
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.35+rng()*0.6;
  let cur = root.clone();
  for(let g=0; g<3 && li<NUM_LINES; g++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen*(0.65**g)));
    dir.x+=(rng()-0.5)*0.9; dir.y+=(rng()-0.5)*0.5; dir.z+=(rng()-0.5)*0.9;
    dir.normalize();
    if(Math.abs(next.x)<hw && Math.abs(next.y)<hh && Math.abs(next.z)<hd){
      setLine(cur, next, 3);
      // Y-fork at generation 1
      if(g===1 && rng()>0.45){
        const fd=dir.clone();
        fd.x+=(rng()-0.5)*1.4; fd.z+=(rng()-0.5)*1.4; fd.normalize();
        const fork = cur.clone().add(fd.multiplyScalar(segLen*0.35));
        setLine(cur, fork, 3);
      }
      cur=next;
    }
  }
}

// ── RADIAL FILAMENTS — threads radiating outward from sphere surface
for(let i=0; i<700 && li<NUM_LINES; i++){
  const sp = sphereSurf(sphereCenter, sphereR);
  const dir = sp.clone().sub(sphereCenter).normalize();
  dir.x+=(rng()-0.5)*0.2; dir.y+=(rng()-0.5)*0.2; dir.z+=(rng()-0.5)*0.2;
  dir.normalize();
  const len = 1.5+rng()*4.0;
  const end = sp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(sp, end, 4);
  }
}

// ── WALL-TO-SPHERE spans — long threads anchoring in architecture
for(let i=0; i<2000 && li<NUM_LINES; i++){
  const a = wallPt();
  const b = sphereSurf(sphereCenter, sphereR);
  setLine(a, b, 2);
}

// ── WALL-TO-ANCHOR fills
while(li<NUM_LINES){
  const a=wallPt();
  const b = rng()<0.3 ? sphereSurf(sphereCenter, sphereR) : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single arterial red (#c20018), opacity by category + distance
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
// Category opacities: [suspend, converge, web, dendrite, radial]
const catAlpha = [0.14, 0.09, 0.045, 0.06, 0.07];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.2, 1.0-d*0.02);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  // Threads near sphere get a barely perceptible warmth
  const warmShift = d<3.5 ? 0.012*(1.0-d/3.5) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.3;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.1,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// ── CAMERA PATH — a pilgrimage to the still center
// Narrative: descend into the chapel from above → approach through thread fog →
// orbit close around the sphere → pass through dense web → pull back below →
// rise to ceiling height → look down through the circulatory web → slow recession
const pathLen = 3200;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.06){
    // Enter from above — descending through suspension threads
    const lt=t/0.06;
    const eased = lt*lt*(3-2*lt);
    x = sphereCenter.x+2.5;
    y = hh-1.0-eased*8.0;
    z = sphereCenter.z+4.5-eased*1.5;
  } else if(t<0.18){
    // Approach — camera finds the sphere through the fog
    const lt=(t-0.06)/0.12;
    const eased = lt*lt*(3-2*lt);
    x = sphereCenter.x+2.5-eased*0.5;
    y = sphereCenter.y+3.0-eased*1.5;
    z = sphereCenter.z+3.0+Math.sin(lt*Math.PI)*0.5;
  } else if(t<0.35){
    // Close orbit — discovering the sphere, threads crossing view
    const lt=(t-0.18)/0.17;
    const rH=3.0+Math.sin(lt*Math.PI*0.7)*0.4;
    const angle=lt*Math.PI*1.5+0.8;
    x = sphereCenter.x+Math.cos(angle)*rH;
    y = sphereCenter.y+0.3+Math.sin(lt*Math.PI*0.8)*0.8;
    z = sphereCenter.z+Math.sin(angle)*rH;
  } else if(t<0.44){
    // Hold — contemplation, minimal movement, thread-depth
    const lt=(t-0.35)/0.09;
    x = sphereCenter.x+Math.cos(lt*0.2+4.0)*2.8;
    y = sphereCenter.y+0.2+lt*0.3;
    z = sphereCenter.z+Math.sin(lt*0.2+4.0)*2.6;
  } else if(t<0.55){
    // Descend below the sphere — look up through the web at the moon
    const lt=(t-0.44)/0.11;
    const eased = lt*lt*(3-2*lt);
    x = sphereCenter.x+Math.sin(lt*Math.PI*0.4+4.0)*3.2;
    y = sphereCenter.y-eased*7.0;
    z = sphereCenter.z+Math.cos(lt*Math.PI*0.4+4.0)*3.0;
  } else if(t<0.68){
    // Floor level — wide orbit, seeing the full architectural scale
    const lt=(t-0.55)/0.13;
    const rH=5.5+lt*1.5;
    const angle=lt*Math.PI*0.9+4.5;
    x = sphereCenter.x+Math.cos(angle)*rH;
    y = -hh+2.0+lt*1.5;
    z = sphereCenter.z+Math.sin(angle)*rH;
  } else if(t<0.80){
    // Rise through the web — threads streaming past
    const lt=(t-0.68)/0.12;
    const eased = lt*lt*(3-2*lt);
    x = sphereCenter.x+Math.sin(lt*Math.PI+5.0)*2.8;
    y = -hh+3.5+eased*16.0;
    z = sphereCenter.z+Math.cos(lt*Math.PI+5.0)*3.0;
  } else if(t<0.90){
    // Above — looking down through suspension threads at the sphere
    const lt=(t-0.80)/0.10;
    x = sphereCenter.x+Math.cos(lt*0.4+6.0)*2.0;
    y = hh-2.0-lt*1.5;
    z = sphereCenter.z+Math.sin(lt*0.4+6.0)*2.2;
  } else {
    // Recede — sphere fades back into the web's body
    const lt=(t-0.90)/0.10;
    const rH=3.5+lt*7.0;
    x = sphereCenter.x+Math.cos(lt*Math.PI*0.3+6.3)*rH;
    y = sphereCenter.y+2.0+lt*3.0;
    z = sphereCenter.z+Math.sin(lt*Math.PI*0.3+6.3)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
const lookTarget = sphereCenter.clone();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — near-imperceptible, glacial
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.025+basePositions[idx+1]*0.035+i*0.00012;
    const breath = Math.sin(elapsed*0.0006+phase)*0.00003;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.035;
      arr[vi+1] = basePositions[vi+1] + breath*0.02;
      arr[vi+2] = basePositions[vi+2] + breath*0.03;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — very slow, contemplative
  const speed = 0.000028;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target drifts gently around the sphere — never exactly centered
  lookTarget.x = sphereCenter.x + Math.sin(elapsed*0.00012)*0.15;
  lookTarget.y = sphereCenter.y + Math.cos(elapsed*0.0001)*0.12;
  lookTarget.z = sphereCenter.z + Math.sin(elapsed*0.00009+1.0)*0.1;
  camera.lookAt(lookTarget);

  // Light breathing
  warmL.intensity = 0.008+Math.sin(elapsed*0.00006)*0.003;
  sphereGlow.intensity = 0.009+Math.sin(elapsed*0.00005)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
