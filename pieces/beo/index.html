<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beo · latent genealogy</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a0d; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">beo</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f0a0d, 0.018);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a0d, 1);
document.body.appendChild(renderer.domElement);

// THREE facial archetypes — elder, middle, young — latent positions in point-cloud space
const N = 8000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);

// Archetype 1: elder — broader, lower-set features
const elder = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 3.8 + (Math.random()**2) * 1.4;
  let x = r * Math.sin(phi) * Math.cos(theta);
  let y = r * Math.sin(phi) * Math.sin(theta);
  let z = r * Math.cos(phi);
  // elder: compress vertically, expand laterally
  y *= 0.78;
  x *= 1.18;
  y -= 0.9;
  elder[i*3] = x;
  elder[i*3+1] = y;
  elder[i*3+2] = z;
}

// Archetype 2: middle — balanced oval
const middle = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 3.6 + (Math.random()**2) * 1.2;
  let x = r * Math.sin(phi) * Math.cos(theta);
  let y = r * Math.sin(phi) * Math.sin(theta);
  let z = r * Math.cos(phi);
  y *= 1.08;
  x *= 0.94;
  y -= 0.3;
  middle[i*3] = x;
  middle[i*3+1] = y;
  middle[i*3+2] = z;
}

// Archetype 3: young — elongated, delicate
const young = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  const r = 3.4 + (Math.random()**2) * 1.0;
  let x = r * Math.sin(phi) * Math.cos(theta);
  let y = r * Math.sin(phi) * Math.sin(theta);
  let z = r * Math.cos(phi);
  y *= 1.22;
  x *= 0.86;
  y += 0.4;
  young[i*3] = x;
  young[i*3+1] = y;
  young[i*3+2] = z;
}

// Initialize at elder positions
for (let i = 0; i < N; i++) {
  positions[i*3] = elder[i*3];
  positions[i*3+1] = elder[i*3+1];
  positions[i*3+2] = elder[i*3+2];
  seeds[i] = Math.random();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMorph: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMorph;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      
      // per-point lag — memory catching up — sine-jitter with seed offset
      float lag = 0.14 * sin(uTime * 2.4 + seed * 6.28 + uMorph * 1.8);
      p.x += lag * (seed - 0.5) * 1.2;
      p.y += lag * (0.5 - seed) * 0.9;
      p.z += lag * (seed - 0.5) * 0.7;
      
      // genealogical palette — sepia, rose, ink
      vec3 sepia = vec3(0.76, 0.60, 0.42);
      vec3 rose = vec3(0.88, 0.52, 0.56);
      vec3 ink = vec3(0.18, 0.14, 0.16);
      
      // morph-phase color — elder=sepia, middle=rose, young=ink
      float phase = mod(uMorph, 3.0);
      vec3 col;
      if (phase < 1.0) {
        col = mix(sepia, rose, phase);
      } else if (phase < 2.0) {
        col = mix(rose, ink, phase - 1.0);
      } else {
        col = mix(ink, sepia, phase - 2.0);
      }
      
      vCol = col;
      vAlpha = 0.7 + 0.3 * sin(seed * 8.0 + uTime * 0.6);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.6 * uPixel * (80.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 10.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// volumetric atmosphere — warm side-light gradient
const ambLight = new THREE.AmbientLight(0x1a1215, 0.4);
scene.add(ambLight);
const sideLight = new THREE.DirectionalLight(0xd9a88a, 1.2);
sideLight.position.set(8, 2, 6);
scene.add(sideLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
const MORPH_CYCLE = 18.0; // seconds per generation transition

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // morph phase: 0→1 elder→middle, 1→2 middle→young, 2→3 young→elder
  const morphPhase = (t / MORPH_CYCLE) % 3.0;
  uniforms.uMorph.value = morphPhase;
  
  const posAttr = geom.attributes.position;
  const arr = posAttr.array;
  
  // interpolate positions between archetypes with per-point lag
  for (let i = 0; i < N; i++) {
    let from, to;
    let k = morphPhase % 1.0;
    const phase = Math.floor(morphPhase);
    
    if (phase === 0) {
      from = elder; to = middle;
    } else if (phase === 1) {
      from = middle; to = young;
    } else {
      from = young; to = elder;
    }
    
    // per-point lag — some points arrive late, creating the in-between truth
    const lagFactor = 0.3 * Math.sin(seeds[i] * 9.0 + t * 1.6);
    const kLagged = Math.max(0, Math.min(1, k + lagFactor));
    
    // smooth interpolation
    const ks = kLagged * kLagged * (3.0 - 2.0 * kLagged);
    
    arr[i*3]   = from[i*3]   + (to[i*3]   - from[i*3])   * ks;
    arr[i*3+1] = from[i*3+1] + (to[i*3+1] - from[i*3+1]) * ks;
    arr[i*3+2] = from[i*3+2] + (to[i*3+2] - from[i*3+2]) * ks;
  }
  posAttr.needsUpdate = true;
  
  // gentle orbital drift
  camera.position.x = Math.sin(t * 0.08) * 4.0;
  camera.position.y = Math.sin(t * 0.06) * 2.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
