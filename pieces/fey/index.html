<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fey · void · drift</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">fey</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── FOLDED LEAF GEOMETRY — building multiple organic leaf-twirl elements ── */
function createLeafTwirl(seed, scaleBase, twirlIntensity){
  const segments = 42;
  const width = 1.8 * scaleBase;
  const length = 4.5 * scaleBase;
  
  const positions = [];
  const uvs = [];
  const indices = [];
  
  const rng = () => {
    seed = (seed * 16807) % 2147483647;
    return seed / 2147483647;
  };
  
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const y = (t - 0.5) * length;
    
    // calligraphic midvein curve — S-bend with asymmetric weight
    const spineX = Math.sin(t * Math.PI * 2.2 + seed * 0.001) * 0.4 * scaleBase;
    const spineZ = Math.cos(t * Math.PI * 1.8 + seed * 0.002) * 0.3 * scaleBase;
    
    // width profile — narrow at both ends, full in middle
    const widthProfile = Math.sin(t * Math.PI) * (0.7 + 0.3 * Math.sin(t * Math.PI * 3));
    const w = width * widthProfile;
    
    // twirl — rotation accumulates along length, more at tip
    const twirlAngle = twirlIntensity * t * t * Math.PI * 1.8;
    const ct = Math.cos(twirlAngle);
    const st = Math.sin(twirlAngle);
    
    // edge curvature — leaf curls inward at edges
    const edgeCurl = 0.3 * scaleBase * Math.sin(t * Math.PI);
    
    // left edge point
    let lx = -w;
    let lz = edgeCurl;
    const lxRot = lx * ct - lz * st;
    const lzRot = lx * st + lz * ct;
    positions.push(spineX + lxRot, y, spineZ + lzRot);
    uvs.push(0, t);
    
    // right edge point
    let rx = w;
    let rz = edgeCurl;
    const rxRot = rx * ct - rz * st;
    const rzRot = rx * st + rz * ct;
    positions.push(spineX + rxRot, y, spineZ + rzRot);
    uvs.push(1, t);
    
    if (i < segments){
      const base = i * 2;
      indices.push(base, base+1, base+2);
      indices.push(base+1, base+3, base+2);
    }
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  
  return geom;
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 800);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// SUBLIME FOG — very low density, particles vanish into infinite void
scene.fog = new THREE.Fog(0x000000, 40, 600);

const N = 80000;
const leafGroup = new THREE.Group();
scene.add(leafGroup);

// Build 7 distinct folded-leaf elements — varying scale, twirl, position
const leafConfigs = [
  { seed: 12847, scale: 1.2, twirl: 1.4, pos: [0, 0, 0], rot: [0, 0, 0] },
  { seed: 58392, scale: 0.9, twirl: 1.8, pos: [-2.5, 3.2, -1.5], rot: [0.3, 0.8, 0.2] },
  { seed: 73921, scale: 1.0, twirl: 1.2, pos: [2.8, -2.5, 1.2], rot: [-0.4, -0.6, 0.5] },
  { seed: 29384, scale: 0.75, twirl: 2.1, pos: [1.2, 5.5, -2.8], rot: [0.6, 0.2, -0.3] },
  { seed: 91847, scale: 1.1, twirl: 1.6, pos: [-3.5, -4.0, 2.5], rot: [-0.2, 1.0, 0.7] },
  { seed: 44821, scale: 0.85, twirl: 1.9, pos: [4.2, 1.8, -3.5], rot: [0.5, -0.8, -0.6] },
  { seed: 67234, scale: 0.95, twirl: 1.5, pos: [-1.8, -1.0, 3.2], rot: [0.1, 0.5, 0.9] },
];

const leafMeshes = [];
for (const cfg of leafConfigs){
  const geom = createLeafTwirl(cfg.seed, cfg.scale, cfg.twirl);
  const mesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
  mesh.position.set(...cfg.pos);
  mesh.rotation.set(...cfg.rot);
  leafGroup.add(mesh);
  leafMeshes.push(mesh);
}

// Sample particles from all leaf surfaces
const totalVerts = leafMeshes.reduce((sum, m) => sum + m.geometry.attributes.position.count, 0);
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const leafIds = new Float32Array(N);

let written = 0;
for (let li = 0; li < leafMeshes.length; li++){
  const mesh = leafMeshes[li];
  const posAttr = mesh.geometry.attributes.position;
  const vCount = posAttr.count;
  const share = Math.floor(N * vCount / totalVerts);
  
  for (let i = 0; i < share && written < N; i++){
    const idx = Math.floor(Math.random() * vCount);
    const v = new THREE.Vector3(
      posAttr.getX(idx),
      posAttr.getY(idx),
      posAttr.getZ(idx)
    );
    
    // jitter slightly off surface
    v.x += (Math.random() - 0.5) * 0.08;
    v.y += (Math.random() - 0.5) * 0.08;
    v.z += (Math.random() - 0.5) * 0.08;
    
    // transform by mesh world matrix
    mesh.updateMatrixWorld();
    v.applyMatrix4(mesh.matrixWorld);
    
    positions[written * 3] = v.x;
    positions[written * 3 + 1] = v.y;
    positions[written * 3 + 2] = v.z;
    seeds[written] = Math.random();
    leafIds[written] = li / leafMeshes.length;
    written++;
  }
}

// fill remaining
while (written < N){
  const li = Math.floor(Math.random() * leafMeshes.length);
  const mesh = leafMeshes[li];
  const posAttr = mesh.geometry.attributes.position;
  const idx = Math.floor(Math.random() * posAttr.count);
  const v = new THREE.Vector3(
    posAttr.getX(idx),
    posAttr.getY(idx),
    posAttr.getZ(idx)
  );
  v.x += (Math.random() - 0.5) * 0.08;
  v.y += (Math.random() - 0.5) * 0.08;
  v.z += (Math.random() - 0.5) * 0.08;
  mesh.updateMatrixWorld();
  v.applyMatrix4(mesh.matrixWorld);
  positions[written * 3] = v.x;
  positions[written * 3 + 1] = v.y;
  positions[written * 3 + 2] = v.z;
  seeds[written] = Math.random();
  leafIds[written] = li / leafMeshes.length;
  written++;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('leafId', new THREE.BufferAttribute(leafIds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCamZ: { value: camera.position.z },
  uAudioLow: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCamZ;
    uniform float uAudioLow;
    attribute float seed;
    attribute float leafId;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // SUBLIME DRIFT — particles slowly recede into infinite void
      // camera approaches very slowly, particles drift away faster
      float driftSpeed = 0.08 + seed * 0.04;
      p.z -= uTime * driftSpeed;
      
      // low-frequency rumble response (if mic enabled)
      float rumble = uAudioLow * 0.5;
      p.x += sin(uTime * 0.3 + seed * 6.28) * rumble * 0.2;
      p.y += cos(uTime * 0.25 + seed * 6.28) * rumble * 0.15;
      
      // gentle vertical sway
      p.y += sin(uTime * 0.18 + seed * 3.14) * 0.12;
      
      // depth-based scale — near particles huge, far particles vanish
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      // wrap particles — once they drift past camera, respawn far ahead
      if (dist < -2.0){
        p.z += 700.0;
        mv = modelViewMatrix * vec4(p, 1.0);
        dist = -mv.z;
      }
      
      // PALETTE: El Anatsui ochre-to-sienna, warm metal against void
      vec3 ochre = vec3(0.78, 0.58, 0.30);
      vec3 sienna = vec3(0.52, 0.34, 0.22);
      vec3 copper = vec3(0.72, 0.45, 0.28);
      vec3 dust = vec3(0.92, 0.84, 0.66);
      
      vec3 col = mix(sienna, ochre, leafId);
      col = mix(col, copper, sin(uTime * 0.4 + seed * 6.28) * 0.3 + 0.4);
      
      // far particles fade to dust color
      float depthFade = smoothstep(300.0, 600.0, dist);
      col = mix(col, dust, depthFade * 0.6);
      
      vCol = col;
      
      // alpha: near particles bright, far particles dissolve
      float energy = 0.5 + 0.5 * sin(uTime * 0.5 + seed * 6.28);
      vAlpha = (0.6 + 0.4 * energy) * (1.0 - depthFade);
      
      // size: massive near field (overwhelming scale), tiny far field
      float baseSize = 120.0 / dist;
      gl_PointSize = baseSize * uPixel * (0.8 + 0.4 * energy);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// hide leaf meshes — we only need their geometry for particle sampling
leafGroup.visible = false;

// optional mic input for low-frequency rumble visualization
let audioContext, analyser, dataArray;
navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioContext.createMediaStreamSource(stream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}).catch(() => {});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  // CAMERA DRIFT — slow approach into the void
  camera.position.z = 18 - elapsed * 0.015;
  uniforms.uCamZ.value = camera.position.z;
  
  // update low-frequency audio response
  if (analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    const lowFreq = dataArray.slice(0, 8).reduce((a, b) => a + b, 0) / (8 * 255);
    uniforms.uAudioLow.value = lowFreq;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
