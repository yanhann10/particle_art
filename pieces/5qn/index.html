<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5qn · peekaboo cypress ↔ tower</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070a; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">5qn</div>
<div class="hint">drag to orbit · click to flip · something watches back</div>
<div class="src">peekaboo · 70k particles · two poses</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ── L-system cypress (pose A) ──
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = new THREE.Vector3(0,1,0), l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE*1.5); break;
      case '\\': rotate(h, -ANGLE*1.5); break;
      case '[': stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const cypressSegs = turtle(expand('F', 6, rng));

// ── Art-deco tower (pose B) ──
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();
  const tiers = [
    { hw: 4.5, y0: 0.0, y1: 4.0, ridges: 14 },
    { hw: 3.4, y0: 4.0, y1: 7.5, ridges: 12 },
    { hw: 2.4, y0: 7.5, y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8 },
    { hw: 0.85, y0: 13.0, y1: 15.0, ridges: 6 },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;
  const W = Math.floor(N * 0.55), B = Math.floor(N * 0.25),
        S = Math.floor(N * 0.12), C = N - W - B - S;
  let i = 0;
  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b, 0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0,ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      const face = Math.floor(Math.random() * 4);
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;
      const along = (ridgeFrac * 2 - 1) * t.hw;
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      const jitter = 0.04;
      switch(face){
        case 0: pos.set( t.hw+(Math.random()-0.5)*jitter, y, along); break;
        case 1: pos.set(-t.hw+(Math.random()-0.5)*jitter, y, along); break;
        case 2: pos.set(along, y, t.hw+(Math.random()-0.5)*jitter); break;
        case 3: pos.set(along, y,-t.hw+(Math.random()-0.5)*jitter); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const along = (Math.random() * 2 - 1) * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set( t.hw, edge+(Math.random()-0.5)*j, along); break;
      case 1: pos.set(-t.hw, edge+(Math.random()-0.5)*j, along); break;
      case 2: pos.set(along, edge+(Math.random()-0.5)*j, t.hw); break;
      case 3: pos.set(along, edge+(Math.random()-0.5)*j,-t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k = 0; k < S; k++){
    const t = Math.random();
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5)*0.05;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ── Build particle buffers ──
const N = 70000;
const treePos = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
const N_SKEL = Math.floor(N * 0.55);
let written = 0;
const v = new THREE.Vector3();

for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written)
    : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random(); written++;
  }
}
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8, SPIRAL = 0.9, TUFT_COUNT = 24;
  const tuftYs = [], tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    tuftYs.push(haloYStart + ((i+0.5)/TUFT_COUNT) * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }
  const N_FOLIAGE = N - N_SKEL;
  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT = N_FOLIAGE - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random() - 0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    treePos[written*3]   = Math.cos(th) * r;
    treePos[written*3+1] = y + (Math.random()-0.5)*0.05;
    treePos[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random(); written++;
  }
  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t], tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const tuftSize = 0.18;
    treePos[written*3]   = Math.cos(tuftTh + (Math.random()-0.5)*0.4) * (reach + (Math.random()-0.5)*tuftSize);
    treePos[written*3+1] = tuftY + (Math.random()-0.5)*0.4;
    treePos[written*3+2] = Math.sin(tuftTh + (Math.random()-0.5)*0.4) * (reach + (Math.random()-0.5)*tuftSize);
    seeds[written] = Math.random(); written++;
  }
}
while (written < N){ treePos[written*3]=0; treePos[written*3+1]=0; treePos[written*3+2]=0; seeds[written]=Math.random(); written++; }

function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity, cx = 0, cz = 0;
  const cnt = arr.length / 3;
  for (let i = 0; i < cnt; i++){
    minY = Math.min(minY, arr[i*3+1]); maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= cnt; cz /= cnt;
  const s = targetH / (maxY - minY);
  for (let i = 0; i < cnt; i++){
    arr[i*3]   = (arr[i*3] - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

// ── Shader with peekaboo eyes ──
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 },
  uPeek:  { value: 0 },
  uBlinkPhase: { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    uniform float uPeek;
    uniform float uBlinkPhase;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // gentle sway (organic when cypress, rigid when tower)
      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = (1.0 - m) * 0.06 * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      float energy = 0.5 + 0.5 * sin(t * 0.8);

      // ── base palette: forest green ↔ bronze ──
      vec3 treeA = vec3(0.18, 0.36, 0.20);
      vec3 treeB = vec3(0.55, 0.78, 0.35);
      vec3 treeC = vec3(0.85, 0.92, 0.55);
      vec3 deco_a = vec3(0.42, 0.30, 0.18);
      vec3 deco_b = vec3(0.92, 0.72, 0.40);
      vec3 deco_c = vec3(0.99, 0.94, 0.84);
      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol  = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      vec3 decoCol  = mix(deco_a, deco_b, hk);
      decoCol = mix(decoCol, deco_c, smoothstep(0.85, 1.0, hk) * 0.7);
      vec3 baseCol = mix(treeCol, decoCol, m);

      // ── peekaboo eyes ──
      // eye positions: two amber orbs in upper-mid form, facing camera (+z)
      // cypress eyes sit higher + closer (owl in canopy)
      // tower eyes sit as lit windows
      vec3 eyeLTree  = vec3(-0.45, 11.0, 0.6);
      vec3 eyeRTree  = vec3( 0.45, 11.0, 0.6);
      vec3 eyeLTower = vec3(-0.9, 11.5, 1.6);
      vec3 eyeRTower = vec3( 0.9, 11.5, 1.6);
      vec3 eyeL = mix(eyeLTree, eyeLTower, m);
      vec3 eyeR = mix(eyeRTree, eyeRTower, m);

      // eye shape: slightly vertically squished (blink effect via uBlinkPhase)
      // uBlinkPhase: 0 = fully open, 1 = fully shut
      vec3 scaleVec = vec3(1.0, max(0.1, 1.0 - uBlinkPhase * 0.85), 1.0);
      vec3 dL = (p - eyeL) * scaleVec;
      vec3 dR = (p - eyeR) * scaleVec;
      float distL = length(dL);
      float distR = length(dR);

      // pupil: dark center (radius ~0.12), iris: glow (radius ~0.45)
      float irisR = 0.5;
      float pupilR = 0.13;
      float nearIrisL = smoothstep(irisR, 0.0, distL);
      float nearIrisR = smoothstep(irisR, 0.0, distR);
      float nearIris = max(nearIrisL, nearIrisR);
      float nearPupilL = smoothstep(pupilR, 0.0, distL);
      float nearPupilR = smoothstep(pupilR, 0.0, distR);
      float nearPupil = max(nearPupilL, nearPupilR);

      // warm amber iris, dark pupil
      vec3 irisCol = vec3(0.85, 0.58, 0.15);
      vec3 pupilCol = vec3(0.04, 0.03, 0.02);
      vec3 eyeCol = mix(irisCol, pupilCol, nearPupil);

      // apply peekaboo: blend eye color in, dim surrounding particles slightly
      float peekStr = uPeek * nearIris;
      vCol = mix(baseCol, eyeCol, peekStr * 0.9);

      // particles near eyes get size boost during peek; others dim very slightly
      float sizeMult = 1.0 + peekStr * 1.8 - uPeek * (1.0 - nearIris) * 0.15;
      sizeMult = max(sizeMult, 0.3);

      float baseAlpha = 0.45 + 0.55 * energy;
      vAlpha = baseAlpha * (1.0 + peekStr * 1.5);
      vAlpha = min(vAlpha, 1.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + 0.7 * energy) * sizeMult * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── Interaction ──
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // auto-morph every ~14s
  const auto = (Math.floor(t / 14) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  // ── peekaboo timing ──
  // cycle: 22s. eyes appear for ~4s with blink-open / hold / blink-shut
  // two quick blinks before the full reveal (playful timing)
  const peekCycle = 22.0;
  const pc = t % peekCycle;
  let peek = 0, blink = 0;

  // micro-blink 1: t=0.0–0.6 (tease)
  // micro-blink 2: t=1.2–1.8 (tease)
  // full open:     t=3.0–6.5 (reveal + hold)
  // close:         t=6.5–7.2

  if (pc < 0.6) {
    // micro-blink 1: quick open-shut
    const bp = pc / 0.6;
    peek = Math.sin(bp * Math.PI) * 0.4; // partial open
    blink = 1.0 - peek * 2.0;
  } else if (pc >= 1.2 && pc < 1.8) {
    // micro-blink 2: slightly wider
    const bp = (pc - 1.2) / 0.6;
    peek = Math.sin(bp * Math.PI) * 0.6;
    blink = 1.0 - peek * 1.5;
  } else if (pc >= 3.0 && pc < 3.8) {
    // slow open
    const bp = (pc - 3.0) / 0.8;
    peek = bp;
    blink = 1.0 - bp;
  } else if (pc >= 3.8 && pc < 6.5) {
    // full gaze — eyes wide open, watching
    peek = 1.0;
    blink = 0.0;
  } else if (pc >= 6.5 && pc < 7.2) {
    // close
    const bp = (pc - 6.5) / 0.7;
    peek = 1.0 - bp;
    blink = bp;
  }

  peek = Math.max(0, Math.min(1, peek));
  blink = Math.max(0, Math.min(1, blink));
  uniforms.uPeek.value = peek;
  uniforms.uBlinkPhase.value = blink;

  // camera: fixed with very gentle breathing (no Y-axis rotation)
  const breathe = Math.sin(t * 0.15) * 0.8;
  camera.position.set(0, 8 + breathe * 0.3, 26 + breathe);
  camera.lookAt(0, 8, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
