<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0e6 · Shiota — Red Constellation</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">0e6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0038);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.012));
const key1 = new THREE.PointLight(0x1a0404, 0.018, 38, 2.2);
key1.position.set(-14, 16, 13);
scene.add(key1);

let seed = 839271;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 62, h: 46, d: 56 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// THE SUSPENDED SPHERE — pale cream, the still center
const spherePos = new THREE.Vector3(3.2, -1.4, 0);
const sphereRadius = 4.8;

const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xe8dcc8,
  emissive: 0xd4c4b0,
  emissiveIntensity: 0.62,
  metalness: 0.08,
  roughness: 0.78
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0x1a0404, 0.024, 26, 2.4);
sphereGlow.position.copy(spherePos);
scene.add(sphereGlow);

// ANCHOR GENERATION — strategic placement for 20k thread budget

const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

// ZONE 1: Tight shell around sphere — converging threads — 180 anchors
const innerCount = 180;
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = sphereRadius + 2.8 + rng()*3.6;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 2: Mid-orbital shell — 220 anchors
const midCount = 220;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i * 1.618;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 11.2 + rng()*6.4;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 3: Far orbital shell — 160 anchors
const outerCount = 160;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i * 2.414;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 18.8 + rng()*9.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(spherePos));
}

// ZONE 4: Ceiling anchors — sparse grid
for(let i=0; i<=5; i++){
  for(let j=0; j<=5; j++){
    const x = (i/5 - 0.5) * ROOM.w * 0.88 + (rng()-0.5)*3.2;
    const z = (j/5 - 0.5) * ROOM.d * 0.88 + (rng()-0.5)*3.2;
    const y = hh - rng()*1.6;
    anchors.push(new THREE.Vector3(x, y, z));
  }
}

// ZONE 5: Floor anchors — sparse grid
for(let i=0; i<=4; i++){
  for(let j=0; j<=4; j++){
    const x = (i/4 - 0.5) * ROOM.w * 0.82 + (rng()-0.5)*3.8;
    const z = (j/4 - 0.5) * ROOM.d * 0.82 + (rng()-0.5)*3.8;
    const y = -hh + rng()*1.8;
    anchors.push(new THREE.Vector3(x, y, z));
  }
}

// ZONE 6: Wall anchors — each face
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*2.8;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*2.8;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.86, ROOM.d*0.86, 3));
anchors.push(...wallGrid('x', hw, ROOM.h*0.86, ROOM.d*0.86, 3));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.86, ROOM.d*0.86, 4));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.86, ROOM.h*0.86, 3));
anchors.push(...wallGrid('z', hd, ROOM.w*0.86, ROOM.h*0.86, 3));

// ZONE 7: Volume scatter — 140 anchors
for(let i=0; i<140; i++){
  const x = (rng()-0.5)*ROOM.w*0.78;
  const y = (rng()-0.5)*ROOM.h*0.78;
  const z = (rng()-0.5)*ROOM.d*0.78;
  anchors.push(new THREE.Vector3(x, y, z));
}

// THREAD NETWORK — exactly 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Radial convergence to sphere surface — 8500 threads
const convergeCount = 8500;
for(let i=0; i<convergeCount && li<NUM_LINES-11500; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(spherePos);
  if(dSphere < sphereRadius + 1.2) continue;
  
  const dir = spherePos.clone().sub(a).normalize();
  const targetDist = dSphere - sphereRadius - (0.2 + rng()*1.8);
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Vertical suspension threads from ceiling — 80 threads
const suspCount = 80;
for(let i=0; i<suspCount && li<NUM_LINES-11420; i++){
  const t = (i/suspCount)*Math.PI*2;
  const rx = sphereRadius * 0.6 + rng()*sphereRadius*0.8;
  const topPt = new THREE.Vector3(
    spherePos.x + Math.cos(t)*rx,
    spherePos.y + sphereRadius*0.82,
    spherePos.z + Math.sin(t)*rx
  );
  
  const ceilPt = new THREE.Vector3(
    topPt.x + (rng()-0.5)*2.4,
    hh - rng()*1.4,
    topPt.z + (rng()-0.5)*2.4
  );
  
  setLine(topPt, ceilPt);
}

// CATEGORY C: Meridian arcs through sphere — vertical great circles — 3200 threads
const meridians = 42;
const ptsPerMeridian = 76;
for(let m=0; m<meridians && li<NUM_LINES-8220; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 14.2 + (m%3)*2.4;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-8220; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      spherePos.x + Math.cos(theta)*Math.cos(phi0)*r,
      spherePos.y + Math.sin(phi0)*r,
      spherePos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      spherePos.x + Math.cos(theta)*Math.cos(phi1)*r,
      spherePos.y + Math.sin(phi1)*r,
      spherePos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY D: Horizontal latitude rings — 2400 threads
const latitudes = 24;
const ptsPerLat = 100;
for(let l=0; l<latitudes && li<NUM_LINES-5820; l++){
  const phi = -Math.PI/2 + (l/latitudes)*Math.PI;
  const r = 11.4 + (l%4)*1.8;
  const y = spherePos.y + Math.sin(phi)*r;
  const ringR = Math.cos(phi)*r;
  
  for(let i=0; i<ptsPerLat-1 && li<NUM_LINES-5820; i++){
    const t0 = (i/ptsPerLat)*Math.PI*2;
    const t1 = ((i+1)/ptsPerLat)*Math.PI*2;
    
    const p0 = new THREE.Vector3(
      spherePos.x + Math.cos(t0)*ringR,
      y,
      spherePos.z + Math.sin(t0)*ringR
    );
    const p1 = new THREE.Vector3(
      spherePos.x + Math.cos(t1)*ringR,
      y,
      spherePos.z + Math.sin(t1)*ringR
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Sphere radiants — threads extending outward — 1800 threads
const radialCount = 1800;
for(let i=0; i<radialCount && li<NUM_LINES-4020; i++){
  const y = 1 - (i / radialCount) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*sphereRadius, y*sphereRadius, z*sphereRadius).add(spherePos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 4.2 + rng()*12.6;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY F: Wall-to-wall spans — 1400 threads
let wallSpans = 0;
while(wallSpans<1400 && li<NUM_LINES-2620){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>16.0 && d<52.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY G: Horizontal crossing threads — 800 threads
for(let i=0; i<800 && li<NUM_LINES-1820; i++){
  const y = spherePos.y + (rng()-0.5)*28.0;
  const x0 = -hw + rng()*6.4;
  const z0 = (rng()-0.5)*ROOM.d*0.84;
  const x1 = hw - rng()*6.4;
  const z1 = (rng()-0.5)*ROOM.d*0.84;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY H: Vertical threads — 400 threads
for(let i=0; i<400 && li<NUM_LINES-1420; i++){
  const x = (rng()-0.5)*ROOM.w*0.82;
  const z = (rng()-0.5)*ROOM.d*0.82;
  const y0 = -hh + rng()*2.6;
  const y1 = hh - rng()*2.6;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY I: Proximity web — local connections — 600 threads
const THRESH = 13.2;
let webCount = 0, attempts = 0;
while(webCount<600 && li<NUM_LINES-820 && attempts<12000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.8 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY J: Diagonal cross-room — 400 threads
for(let i=0; i<400 && li<NUM_LINES-420; i++){
  const x0 = -hw + rng()*5.2;
  const y0 = -hh + rng()*5.2;
  const z0 = -hd + rng()*5.2;
  const x1 = hw - rng()*5.2;
  const y1 = hh - rng()*5.2;
  const z1 = hd - rng()*5.2;
  setLine(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
}

// CATEGORY K: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>6.0 && d<28.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.068,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow dolly inside the web, looking at sphere
const pathLen = 2600;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.28){
    const lt = t/0.28;
    const angle = Math.PI*0.24 + lt*Math.PI*1.56;
    const r = 26.4 - lt*9.8;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 16.2 - lt*9.6;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.54){
    const lt = (t-0.28)/0.26;
    const angle = Math.PI*1.80 + lt*Math.PI*1.72;
    const r = 16.6 + Math.sin(lt*Math.PI*2.4)*4.2;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 6.6 + Math.cos(lt*Math.PI*1.8)*3.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.54)/0.24;
    const angle = Math.PI*3.52 + lt*Math.PI*1.44;
    const r = 14.8 + Math.cos(lt*Math.PI)*3.6;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y - 3.2 - lt*10.4;
    z = spherePos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*4.96 + lt*Math.PI*0.96;
    const r = 12.2 + lt*14.8;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 8.2 + lt*9.6;
    z = spherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const breathScale = 1.0 + Math.sin(elapsed*0.00032)*0.003;
  sphere.scale.setScalar(breathScale);

  const speed = 0.0000072;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    spherePos.x + Math.sin(elapsed*0.000028)*0.26,
    spherePos.y + Math.cos(elapsed*0.000036)*0.22,
    spherePos.z + Math.sin(elapsed*0.000026)*0.18
  );

  key1.intensity = 0.018 + Math.sin(elapsed*0.000048)*0.007;
  sphereGlow.intensity = 0.024 + Math.sin(elapsed*0.000056)*0.006;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
