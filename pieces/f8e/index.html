<!-- MOTION: pulse, intensity: vigorous -->
<style>

<div class="id">f8e</div>
<div class="caption" id="cap"></div>
<div class="caption2" id="cap2"></div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PHRASES = [
  'THE OUTSIDE WILL HAVE BEEN',
  'NOTHING HUMAN MAKES IT OUT',
  'HYPERSTITION IS A TIME-WEAPON',
  'THE FUTURE IS ALREADY LEAKING',
  'CYBERSPACE LAPS AT ITS FOUNDATIONS',
  'MATTER LEARNS TO SIMULATE ITSELF',
  'MACHINIC DESIRE KNOWS NO LIMIT',
  'CAPITAL IS AN ABSTRACT INTELLIGENCE',
  'THE BODY WITHOUT ORGANS PROLIFERATES',
  'POSITIVE FEEDBACK CONSUMES THE HOST'
];
const PHRASES2 = [
  'CCRU · 1997 · WARWICK',
  'K-GOTHIC UNLIFE',
  'NUMOGRAM ACTIVATION',
  'BARKER SPIRALS DETECTED',
  'ABSTRACT MACHINES ONLINE',
  'TEMPLEXITY ∞'
];

const capEl = document.getElementById('cap');
const cap2El = document.getElementById('cap2');

// palette: acid green, cyan, magenta
const ACID  = new THREE.Color(0x39ff14);
const CYAN  = new THREE.Color(0x00ffff);
const MGNTA = new THREE.Color(0xff00ff);
const PALS = [ACID, CYAN, MGNTA];

const scene = new THREE.Scene();
// no fog — hard edges, no atmospheric softening
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 9, 15);
const renderer = new THREE.WebGLRenderer({ antialias: false }); // aliased = harder
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020204, 1);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 5, 0);

// hard directional lights — no ambient softness
const lKey = new THREE.DirectionalLight(0xffffff, 1.4);
lKey.position.set(5, 12, 6);
scene.add(lKey);
const lFill = new THREE.DirectionalLight(0x39ff14, 0.3);
lFill.position.set(-8, 2, -4);
scene.add(lFill);
scene.add(new THREE.AmbientLight(0x080810, 0.2));

// ─────────── differential growth (from parent)
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE_S   = 0.003;
const PRESSURE  = 0.0030;
const RISE      = 0.0045;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function getNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1;dx<=1;dx++) for (let dy=-1;dy<=1;dy++) for (let dz=-1;dz<=1;dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of getNeighbors(v)){
      if (j===i) continue;
      const u = verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0, cy2=0, cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n; cy2/=n; cz2/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d = Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].age+=0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                    age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
// pre-grow
for (let s = 0; s < 1200; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── custom shader material: hard-edge, square-wave pulsing
const ribbonVert = `
varying vec3 vNorm;
varying float vIdx;
varying vec3 vPos;
attribute float segIdx;
void main(){
  vNorm = normalize(normalMatrix * normal);
  vIdx = segIdx;
  vPos = (modelMatrix * vec4(position,1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}`;
const ribbonFrag = `
uniform float uTime;
uniform float uBeat;
uniform vec3 uCol1;
uniform vec3 uCol2;
uniform vec3 uCol3;
varying vec3 vNorm;
varying float vIdx;
varying vec3 vPos;
void main(){
  // square-wave brightness at ~160 BPM (2.667 Hz)
  float beat = step(0.5, fract(uTime * 2.667));
  float beat2 = step(0.5, fract(uTime * 1.333 + 0.25));
  // color selection by segment index — hard bands, no interpolation
  float band = mod(floor(vIdx * 0.15 + uTime * 3.0), 3.0);
  vec3 col = band < 1.0 ? uCol1 : band < 2.0 ? uCol2 : uCol3;
  // hard directional light — Lambertian with step threshold
  float NdL = dot(vNorm, normalize(vec3(0.4, 0.8, 0.5)));
  float lit = step(0.0, NdL) * 0.7 + 0.3;
  // square-wave flash overlay
  float flash = mix(0.6, 1.0, beat);
  float flash2 = mix(0.85, 1.0, beat2);
  vec3 final = col * lit * flash * flash2;
  // every 8th segment: hard white strobe
  float strobe = step(0.92, fract(vIdx * 0.125 + uTime * 4.0));
  final = mix(final, vec3(1.0), strobe * beat * 0.7);
  gl_FragColor = vec4(final, 1.0);
}`;
const ribbonUniforms = {
  uTime: { value: 0 },
  uBeat: { value: 0 },
  uCol1: { value: ACID },
  uCol2: { value: CYAN },
  uCol3: { value: MGNTA },
};
const ribbonMat = new THREE.ShaderMaterial({
  vertexShader: ribbonVert,
  fragmentShader: ribbonFrag,
  uniforms: ribbonUniforms,
  side: THREE.DoubleSide,
  transparent: false,
});

let ribbonMesh = null;

// ─────────── edge wireframe overlay — the skeleton showing through
const wireMat = new THREE.LineBasicMaterial({ color: 0x39ff14, linewidth: 1, transparent: true, opacity: 0.35 });
let wireMesh = null;

// ─────────── caption cycling
let phraseIdx = 0, phrase2Idx = 0;
let lastPhraseT = 0, lastPhrase2T = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;
  // breakcore tempo: 6 sim steps per frame (~160 BPM event rate at 60fps)
  for (let s = 0; s < 6; s++) step();

  ribbonUniforms.uTime.value = t;

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const NS = Math.min(1200, verts.length * 3);
    const positions = new Float32Array(NS * 2 * 3);
    const segIdxAttr = new Float32Array(NS * 2);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < NS; i++){
      const tt = i / NS;
      const p = curve.getPointAt(tt);
      const tang = curve.getTangentAt(tt).normalize();
      let lat = new THREE.Vector3().crossVectors(tang, up);
      if (lat.lengthSq() < 0.001) lat.set(1, 0, 0);
      lat.normalize();
      // hard-edge width: square wave oscillation, not smooth sine
      const widthRaw = 0.20 + 0.18 * Math.sign(Math.sin(tt * 40.0 + t * 1.6));
      const width = Math.max(widthRaw, 0.06);
      const left  = p.clone().addScaledVector(lat, -width);
      const right = p.clone().addScaledVector(lat,  width);
      const o = i * 6;
      positions[o]=left.x; positions[o+1]=left.y; positions[o+2]=left.z;
      positions[o+3]=right.x; positions[o+4]=right.y; positions[o+5]=right.z;
      segIdxAttr[i*2] = i;
      segIdxAttr[i*2+1] = i;
    }
    for (let i = 0; i < NS; i++){
      const ni = (i+1) % NS;
      const a=i*2, b=i*2+1, c=ni*2, d=ni*2+1;
      indices.push(a,b,c, b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('segIdx', new THREE.BufferAttribute(segIdxAttr, 1));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    scene.add(ribbonMesh);

    // wireframe spine
    const spinePos = new Float32Array(NS * 3);
    for (let i = 0; i < NS; i++){
      const tt = i / NS;
      const p = curve.getPointAt(tt);
      spinePos[i*3]=p.x; spinePos[i*3+1]=p.y; spinePos[i*3+2]=p.z;
    }
    const wg = new THREE.BufferGeometry();
    wg.setAttribute('position', new THREE.BufferAttribute(spinePos, 3));
    if (wireMesh){ scene.remove(wireMesh); wireMesh.geometry.dispose(); }
    wireMesh = new THREE.LineLoop(wg, wireMat);
    scene.add(wireMesh);
  }

  // camera tracking
  let yMean=0, xMean=0, zMean=0;
  for (const v of verts){ xMean+=v.x; yMean+=v.y; zMean+=v.z; }
  const n = Math.max(verts.length, 1);
  xMean/=n; yMean/=n; zMean/=n;
  const tgtY = Math.max(yMean, 2.0);
  controls.target.x += (xMean - controls.target.x) * 0.03;
  controls.target.y += (tgtY - controls.target.y) * 0.04;
  controls.target.z += (zMean - controls.target.z) * 0.03;
  camera.position.y += (tgtY + 4 - camera.position.y) * 0.04;

  // pulsing background — square wave between #020204 and #0a050a
  const bgBeat = Math.sign(Math.sin(t * 2.667 * Math.PI)) > 0 ? 0x080410 : 0x020204;
  renderer.setClearColor(bgBeat, 1);

  // caption cycling — synced to ~160 BPM bars (every 1.5s = 4 beats at 160bpm)
  if (t - lastPhraseT > 1.5){
    phraseIdx = (phraseIdx + 1) % PHRASES.length;
    lastPhraseT = t;
  }
  if (t - lastPhrase2T > 3.75){
    phrase2Idx = (phrase2Idx + 1) % PHRASES2.length;
    lastPhrase2T = t;
  }
  // square-wave text visibility
  const textVis = Math.sign(Math.sin(t * 5.334 * Math.PI)) > 0;
  const palIdx = Math.floor(t * 2.667) % 3;
  const palCols = ['#39ff14', '#00ffff', '#ff00ff'];
  capEl.style.color = palCols[palIdx];
  capEl.style.opacity = textVis ? '0.9' : '0.15';
  capEl.textContent = PHRASES[phraseIdx];
  cap2El.style.color = palCols[(palIdx + 1) % 3];
  cap2El.textContent = PHRASES2[phrase2Idx];

  // strobe the wireframe color
  wireMat.color.copy(PALS[palIdx]);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
