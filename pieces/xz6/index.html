<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>xz6 · lucy data-dream · anadol flow</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05060d}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#cdd2dc;letter-spacing:0.06em;z-index:2}
.ld{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:13px;opacity:0.6;color:#a0b0c8;font-family:ui-monospace,monospace;letter-spacing:0.06em;z-index:2}
</style>
</head>
<body>
<div class="ld" id="ld">loading lucy …</div>
<div class="id">xz6</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

const W = 512; // 512×512 = 262 144 particles
const N = W * W;

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060d, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 2, 38);

/* ── background gradient plane ── */
const bgGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.9999,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float g = smoothstep(0.0,1.0,vUv.y);
      vec3 lo = vec3(0.02,0.015,0.04);
      vec3 hi = vec3(0.04,0.05,0.09);
      gl_FragColor = vec4(mix(lo,hi,g),1.0);
    }`
});
const bgMesh = new THREE.Mesh(bgGeo, bgMat);
bgMesh.frustumCulled = false;
bgMesh.renderOrder = -1;
scene.add(bgMesh);

/* ── GPGPU shaders ── */
const simPosSrc = `
uniform float uTime, uDt;
uniform sampler2D tRest;
void main(){
  vec2 uv = gl_FragCoord.xy / resolution.xy;
  vec4 pos = texture2D(texturePosition, uv);
  vec4 vel = texture2D(textureVelocity, uv);
  vec4 rest = texture2D(tRest, uv);
  vec3 p = pos.xyz + vel.xyz * uDt;
  float life = pos.w + uDt * 0.12;
  float d = length(p - rest.xyz);
  if(d > 14.0){ p = rest.xyz; life = 0.0; }
  gl_FragColor = vec4(p, life);
}`;

const simVelSrc = `
uniform float uTime, uDt;
uniform sampler2D tRest;

vec3 flowField(vec3 p, float t){
  float r = length(p.xz);
  float ang = atan(p.z, p.x);
  // laminar upward streams — 5 ribbons around the figure
  float ribbon = sin(ang * 5.0 + t * 0.08) * 0.5 + 0.5;
  ribbon = ribbon * ribbon; // sharpen ribbons
  float upward = (0.18 + 0.55 * ribbon) * smoothstep(0.5, 3.0, r);
  // top curl-back
  upward = mix(upward, -0.35, smoothstep(7.5, 10.5, p.y));
  // bottom recirculate up
  upward = mix(upward, 0.25, smoothstep(-7.5, -10.0, -p.y));
  // slow orbital tangent
  float orb = 0.12 * smoothstep(0.8, 4.0, r);
  vec3 tang = vec3(-sin(ang), 0.0, cos(ang));
  // gentle radial breathing
  float radial = sin(p.y * 0.4 + t * 0.15) * 0.04;
  vec3 rDir = normalize(vec3(p.x, 0.0, p.z) + 0.001);
  return tang * orb + vec3(0.0, upward, 0.0) + rDir * radial;
}

void main(){
  vec2 uv = gl_FragCoord.xy / resolution.xy;
  vec4 vel = texture2D(textureVelocity, uv);
  vec4 pos = texture2D(texturePosition, uv);
  vec4 rest = texture2D(tRest, uv);
  vec3 v = vel.xyz;
  vec3 p = pos.xyz;
  vec3 r = rest.xyz;
  float seed = vel.w;
  // flow field
  vec3 flow = flowField(p, uTime + seed * 6.2831);
  v += flow * 0.8 * uDt;
  // spring return to rest
  vec3 toR = r - p;
  float dist = length(toR);
  float spring = 0.06 * smoothstep(0.0, 5.0, dist);
  v += toR * spring * uDt * 12.0;
  // damping
  v *= 0.965;
  float spd = length(v);
  if(spd > 2.5) v = v / spd * 2.5;
  gl_FragColor = vec4(v, seed);
}`;

/* ── render shaders ── */
const renderVS = `
uniform sampler2D tPos;
uniform sampler2D tVel;
uniform float uPx, uTime, uReveal;
attribute vec2 ref;
varying vec3 vCol;
varying float vA;

void main(){
  vec4 pd = texture2D(tPos, ref);
  vec4 vd = texture2D(tVel, ref);
  vec3 p = pd.xyz;
  float life = pd.w;
  float seed = vd.w;
  float spd = length(vd.xyz);

  // reveal: fly from scattered sphere
  vec3 entry = normalize(vec3(sin(seed*43.7), cos(seed*31.1), sin(seed*23.3))) * 28.0;
  p = mix(entry, p, smoothstep(0.0, 1.0, uReveal));

  // palette: pearlescent cyan ↔ violet, white-hot core
  vec3 cyan   = vec3(0.15, 0.82, 0.95);
  vec3 violet = vec3(0.58, 0.30, 0.95);
  vec3 pearl  = vec3(0.78, 0.88, 1.0);
  vec3 white  = vec3(1.0, 0.98, 1.0);

  // map by height + seed for variety
  float hN = (p.y + 9.0) / 18.0; // normalised height
  float t = clamp(hN + sin(seed * 6.28 + life) * 0.15, 0.0, 1.0);
  vec3 base = mix(cyan, violet, t);
  // pearlescent sheen
  base = mix(base, pearl, smoothstep(0.35, 0.65, t) * 0.25);
  // white-hot where near rest surface & slow (dense core)
  float proximity = length(vd.xyz);
  float hot = smoothstep(1.2, 0.15, proximity) * 0.55;
  // also hot at high speed (streaming glow)
  hot += smoothstep(0.8, 2.2, spd) * 0.3;
  base = mix(base, white, min(hot, 0.85));
  vCol = base;

  // alpha: core denser, streamers softer
  vA = (0.18 + 0.32 * smoothstep(0.0, 1.5, spd) + hot * 0.2) * uReveal;

  vec4 mv = modelViewMatrix * vec4(p, 1.0);
  float dist = -mv.z;
  gl_PointSize = max(0.8, (1.0 + spd * 0.5 + hot * 1.2) * uPx * (38.0 / dist) * uReveal);
  gl_Position = projectionMatrix * mv;
}`;

const renderFS = `
varying vec3 vCol;
varying float vA;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d, d);
  if(r2 > 0.25) discard;
  float a = exp(-r2 * 10.0) * vA;
  gl_FragColor = vec4(vCol * a, a);
}`;

/* ── state ── */
let gpuCompute, posVar, velVar, restTex, pts;
let ready = false, revealT0 = 0;

function initGPU(restPos, seeds){
  gpuCompute = new GPUComputationRenderer(W, W, renderer);
  restTex = gpuCompute.createTexture();
  const dtP = gpuCompute.createTexture();
  const dtV = gpuCompute.createTexture();
  const rd = restTex.image.data, pd = dtP.image.data, vd = dtV.image.data;
  for(let i = 0; i < N; i++){
    const i4 = i * 4, i3 = i * 3;
    rd[i4] = restPos[i3]; rd[i4+1] = restPos[i3+1]; rd[i4+2] = restPos[i3+2]; rd[i4+3] = 0;
    pd[i4] = restPos[i3]; pd[i4+1] = restPos[i3+1]; pd[i4+2] = restPos[i3+2]; pd[i4+3] = Math.random()*6.28;
    vd[i4] = 0; vd[i4+1] = 0; vd[i4+2] = 0; vd[i4+3] = seeds[i];
  }
  posVar = gpuCompute.addVariable('texturePosition', simPosSrc, dtP);
  velVar = gpuCompute.addVariable('textureVelocity', simVelSrc, dtV);
  gpuCompute.setVariableDependencies(posVar, [posVar, velVar]);
  gpuCompute.setVariableDependencies(velVar, [posVar, velVar]);
  const pu = posVar.material.uniforms, vu = velVar.material.uniforms;
  pu.uTime = {value:0}; pu.uDt = {value:0.016}; pu.tRest = {value:restTex};
  vu.uTime = {value:0}; vu.uDt = {value:0.016}; vu.tRest = {value:restTex};
  const err = gpuCompute.init();
  if(err){ console.error(err); return; }

  const geo = new THREE.BufferGeometry();
  const refs = new Float32Array(N * 2);
  for(let i = 0; i < N; i++){
    refs[i*2]   = (i % W + 0.5) / W;
    refs[i*2+1] = (Math.floor(i / W) + 0.5) / W;
  }
  geo.setAttribute('ref', new THREE.BufferAttribute(refs, 2));
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      tPos: {value:null}, tVel: {value:null},
      uPx: {value:renderer.getPixelRatio()},
      uTime: {value:0}, uReveal: {value:0}
    },
    vertexShader: renderVS, fragmentShader: renderFS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  pts = new THREE.Points(geo, mat);
  scene.add(pts);
  ready = true;
}

/* ── load Lucy ── */
const ldEl = document.getElementById('ld');
function onGeo(geometry){
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const c = bb.getCenter(new THREE.Vector3());
  const s = bb.getSize(new THREE.Vector3());
  const sc = 16 / Math.max(s.x, s.y, s.z);
  geometry.translate(-c.x, -c.y, -c.z);
  geometry.scale(sc, sc, sc);
  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
  const sampler = new MeshSurfaceSampler(mesh).build();
  const rp = new Float32Array(N*3), sd = new Float32Array(N);
  const tmp = new THREE.Vector3();
  for(let i = 0; i < N; i++){
    sampler.sample(tmp);
    rp[i*3]=tmp.x; rp[i*3+1]=tmp.y; rp[i*3+2]=tmp.z;
    sd[i] = Math.random();
  }
  initGPU(rp, sd);
  ldEl.style.display = 'none';
  revealT0 = performance.now();
}

const loader = new PLYLoader();
loader.load('https://threejs.org/examples/models/ply/binary/Lucy100k.ply',
  g => onGeo(g),
  xhr => { if(xhr.lengthComputable) ldEl.textContent = `loading lucy · ${(xhr.loaded/xhr.total*100|0)}%`; },
  () => {
    ldEl.textContent = 'fallback…';
    onGeo(new THREE.CylinderGeometry(2.5, 3, 16, 48, 48));
  }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(pts) pts.material.uniforms.uPx.value = renderer.getPixelRatio();
});

/* ── loop ── */
const t0 = performance.now();
let prev = t0;
(function loop(){
  requestAnimationFrame(loop);
  const now = performance.now();
  const t = (now - t0) / 1000;
  const dt = Math.min(0.033, (now - prev) / 1000);
  prev = now;

  if(ready){
    posVar.material.uniforms.uTime.value = t;
    posVar.material.uniforms.uDt.value = dt;
    velVar.material.uniforms.uTime.value = t;
    velVar.material.uniforms.uDt.value = dt;
    gpuCompute.compute();
    const u = pts.material.uniforms;
    u.tPos.value = gpuCompute.getCurrentRenderTarget(posVar).texture;
    u.tVel.value = gpuCompute.getCurrentRenderTarget(velVar).texture;
    u.uTime.value = t;
    if(revealT0 > 0) u.uReveal.value = Math.min(1.0, (now - revealT0) / 3500);
  }

  // slow cinematic orbit — vertical figure, camera drifts
  const R = 34;
  const a = t * 0.045;
  const cy = 1.5 + Math.sin(t * 0.025) * 2.5;
  camera.position.set(Math.sin(a) * R, cy, Math.cos(a) * R);
  camera.lookAt(0, 0.5, 0);

  renderer.render(scene, camera);
})();
</script>
</body>
</html>
