<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: grow, intensity: gentle -->
<title>ldo · risograph ink · posterized differential growth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a10; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           font-family: ui-monospace, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">ldo</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Mutation: posterized risograph feel — quantize shading to 6 discrete bands.
// Two riso ink layers: fluorescent pink (diffuse) + metallic gold (rim).
// Grain noise for paper-stock speckle. No fog — prints don't have atmosphere.
//
// Palette (hand-picked, all real riso ink references):
//   #e84898 — fluorescent pink (Risograph SF ink)
//   #d8a830 — metallic gold (Risograph ME ink)
//   #0a0a10 — deep indigo-black craft paper
//   #1c0818 — pink at lowest density on dark stock
//   #f8c8e0 — overinked pink at full saturation

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a10, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (3D, inherited from 5gm → 2iy)
const MAX_VERTS = 1800;
const ATTRACT   = 0.06;
const REPEL_R   = 0.46;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0042;
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 700; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── risograph posterized ink-tube shader
// Two-pass riso: fluorescent pink diffuse + gold rim, each quantized to 6 steps.
// Grain noise simulates paper stock texture.

const tubeShaderMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0.0 },
    uInk1:  { value: new THREE.Color(0xe84898) },  // fluorescent pink
    uInk2:  { value: new THREE.Color(0xd8a830) },  // metallic gold
  },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;

    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vHeight = position.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3 uInk1;
    uniform vec3 uInk2;

    varying vec3 vNormal;
    varying vec3 vWorldPos;
    varying float vHeight;

    // hash for grain noise
    float hash21(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    // quantize value to N discrete steps
    float posterize(float v, float steps) {
      return floor(v * steps + 0.001) / (steps - 1.0);
    }

    void main() {
      vec3 N = normalize(vNormal);

      // primary diffuse — light from above-right, slightly behind
      vec3 L = normalize(vec3(0.4, 0.9, 0.5));
      float diff = dot(N, L) * 0.5 + 0.5;  // half-lambert [0,1]

      // secondary rim light — gold ink layer
      vec3 V = normalize(cameraPosition - vWorldPos);
      float rim = 1.0 - max(dot(N, V), 0.0);
      rim = pow(rim, 2.5);

      // height-based subtle intensity shift (bottom darker, top brighter)
      float hBias = smoothstep(-1.0, 12.0, vHeight) * 0.15;
      diff = clamp(diff + hBias, 0.0, 1.0);

      // ── posterize each ink layer to 6 discrete steps ──
      float qDiff = posterize(diff, 6.0);
      float qRim  = posterize(rim, 6.0);

      // ensure shadow side doesn't vanish — minimum density
      qDiff = 0.12 + qDiff * 0.88;

      // composite two ink layers on dark paper
      // pink ink: primary form
      vec3 pinkLayer = uInk1 * qDiff;
      // gold ink: rim accents (lighter application)
      vec3 goldLayer = uInk2 * qRim * 0.55;

      // riso overprint: additive-ish blend (inks overlap on paper)
      vec3 color = pinkLayer + goldLayer;

      // ── paper grain noise — changes each frame for riso speckle ──
      vec2 sc = gl_FragCoord.xy;
      float grain = hash21(sc * 1.1 + fract(uTime * 5.7)) * 0.07 - 0.035;
      color += grain;

      // slight ink bleed: soften extreme darks toward a warm near-black
      color = max(color, vec3(0.03, 0.01, 0.02));

      gl_FragColor = vec4(color, 0.93);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide,
});

// ─────────── tube builder (variable-radius swept polygon)
let tubeMesh = null;
const RADIAL = 8;

function buildTube() {
  if (verts.length < 10) return;

  const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

  const N_SAMPLES = Math.min(800, verts.length * 2);
  const radiiList = new Array(N_SAMPLES);

  for (let i = 0; i < N_SAMPLES; i++){
    const t = i / N_SAMPLES;
    const dt = 1 / N_SAMPLES;
    const t1 = curve.getTangent((t - dt + 1) % 1);
    const t2 = curve.getTangent(t);
    const t3 = curve.getTangent((t + dt) % 1);
    const cosAB = t1.dot(t2);
    const cosBC = t2.dot(t3);
    const curvature = (2 - cosAB - cosBC) * 0.5;
    const pressure = Math.min(1.0, curvature * 8);
    // slightly thicker than parent for better riso band visibility
    radiiList[i] = 0.022 + 0.13 * pressure;
  }

  const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < N_SAMPLES; i++){
    const t = i / N_SAMPLES;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
    if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const r = radiiList[i];
    for (let j = 0; j < RADIAL; j++){
      const ang = (j / RADIAL) * Math.PI * 2;
      const v = new THREE.Vector3()
        .copy(normal).multiplyScalar(Math.cos(ang) * r)
        .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
        .add(p);
      const idx = (i * RADIAL + j) * 3;
      positions[idx]     = v.x;
      positions[idx + 1] = v.y;
      positions[idx + 2] = v.z;
    }
  }

  for (let i = 0; i < N_SAMPLES; i++){
    const ni = (i + 1) % N_SAMPLES;
    for (let j = 0; j < RADIAL; j++){
      const nj = (j + 1) % RADIAL;
      const a = i * RADIAL + j, b = i * RADIAL + nj;
      const c = ni * RADIAL + j, d = ni * RADIAL + nj;
      indices.push(a, b, c, b, d, c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();

  if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
  tubeMesh = new THREE.Mesh(g, tubeShaderMat);
  scene.add(tubeMesh);
}

// ─────────── fullscreen grain overlay — paper texture across entire frame
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    float h(vec2 p){ return fract(sin(dot(p, vec2(41.1,97.3)))*43758.5453); }
    void main(){
      float g = h(gl_FragCoord.xy * 0.8 + fract(uTime * 3.1)) * 0.04;
      gl_FragColor = vec4(vec3(g), g * 0.6);
    }
  `,
  transparent: true,
  depthTest: false,
  depthWrite: false,
});
const grainQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  grainMat
);
grainQuad.frustumCulled = false;
grainQuad.renderOrder = 999;

const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.Camera();

// ─────────── resize
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── render loop
const clock = new THREE.Clock();
function loop(){
  const t = clock.getElapsedTime();

  for (let s = 0; s < 2; s++) step();
  buildTube();

  // update shader time
  tubeShaderMat.uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;

  // camera follow centroid
  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);

  // overlay grain pass (on top, no depth)
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
