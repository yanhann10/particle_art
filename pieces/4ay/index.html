<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4ay · AUTO{}Construccion</title>
<!-- MOTION: collapse, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">4ay</div>
<div class="hint">click to rebuild · orbit + scroll</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system for spatial cells (rooms) ── */
const RULES = {
  'A': [
    { p: 0.40, s: 'A[+B][-B]A' },
    { p: 0.35, s: 'AB[/B]A' },
    { p: 0.15, s: 'A[+B-B]A' },
    { p: 0.10, s: 'B' }
  ],
  'B': [
    { p: 0.50, s: 'BA' },
    { p: 0.30, s: 'B[+A]' },
    { p: 0.20, s: 'A' }
  ]
};

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function parseRooms(str){
  const rooms = [];
  const stack = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let dir = new THREE.Vector3(1, 0, 0);
  let up = new THREE.Vector3(0, 1, 0);
  const rot = THREE.MathUtils.degToRad(90);
  
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    dir.applyQuaternion(q);
    up.applyQuaternion(q);
  };
  
  for (const ch of str){
    switch(ch){
      case 'A':
      case 'B': {
        const sz = ch === 'A' ? 2.0 : 1.5;
        rooms.push({
          pos: pos.clone(),
          size: sz,
          type: ch,
          phase: Math.random()
        });
        pos.addScaledVector(dir, sz * 1.1);
        break;
      }
      case '+': rotate(up, rot); break;
      case '-': rotate(up, -rot); break;
      case '/': rotate(dir, rot); break;
      case '\\': rotate(dir, -rot); break;
      case '[':
        stack.push({ pos: pos.clone(), dir: dir.clone(), up: up.clone() });
        break;
      case ']': {
        const st = stack.pop();
        pos = st.pos; dir = st.dir; up = st.up;
        break;
      }
    }
  }
  return rooms;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0a0908, 15, 45);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2, 0);

const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
const rebarMat = new THREE.MeshStandardMaterial({
  color: 0x4a4a48,
  roughness: 0.85,
  metalness: 0.15
});
const cinderMat = new THREE.MeshStandardMaterial({
  color: 0x666360,
  roughness: 0.95,
  metalness: 0.05
});
const neonMat = new THREE.MeshStandardMaterial({
  color: 0xff6b35,
  emissive: 0xff6b35,
  emissiveIntensity: 0.6,
  roughness: 0.3,
  metalness: 0.2
});

const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
light1.position.set(5, 12, 8);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xcccccc, 0.4);
light2.position.set(-6, 8, -5);
scene.add(light2);
const ambient = new THREE.AmbientLight(0x404040, 0.5);
scene.add(ambient);

let structure = { rooms: [], cubes: [], collapsePhase: 0, collapseTime: 0, buildTime: 0 };

function buildStructure(seed){
  // Clear existing
  for (const cube of structure.cubes){
    scene.remove(cube.mesh);
  }
  
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const str = expand('A', 4, rng);
  const rooms = parseRooms(str);
  
  // Center structure
  const bb = new THREE.Box3();
  for (const rm of rooms){
    bb.expandByPoint(rm.pos);
  }
  const ctr = bb.getCenter(new THREE.Vector3());
  for (const rm of rooms){
    rm.pos.sub(ctr);
  }
  
  // Generate cubes for each room
  const cubes = [];
  for (let ri = 0; ri < rooms.length; ri++){
    const rm = rooms[ri];
    const cellSize = 0.5;
    const gridN = Math.ceil(rm.size / cellSize);
    
    for (let ix = 0; ix < gridN; ix++){
      for (let iy = 0; iy < gridN; iy++){
        for (let iz = 0; iz < gridN; iz++){
          // Hollow out interior (only walls)
          const isEdge = ix === 0 || ix === gridN-1 || 
                         iy === 0 || iy === gridN-1 || 
                         iz === 0 || iz === gridN-1;
          if (!isEdge && rng() > 0.15) continue;
          
          const gridPos = new THREE.Vector3(
            (ix - gridN/2 + 0.5) * cellSize,
            (iy - gridN/2 + 0.5) * cellSize,
            (iz - gridN/2 + 0.5) * cellSize
          );
          
          const worldPos = rm.pos.clone().add(gridPos);
          const mesh = new THREE.Mesh(cubeGeo, rebarMat);
          mesh.position.copy(worldPos);
          mesh.scale.setScalar(cellSize * 0.92);
          scene.add(mesh);
          
          cubes.push({
            mesh,
            room: ri,
            gridPos: gridPos.clone(),
            worldStart: worldPos.clone(),
            velocity: new THREE.Vector3(0, 0, 0),
            phase: rm.phase + rng() * 0.3,
            seed: rng(),
            isNeon: rng() < 0.08,
            collapsed: false
          });
          
          if (cubes[cubes.length-1].isNeon){
            mesh.material = neonMat;
          } else if (rng() < 0.3){
            mesh.material = cinderMat;
          }
        }
      }
    }
  }
  
  structure = {
    rooms,
    cubes,
    collapsePhase: 0,
    collapseTime: 0,
    buildTime: performance.now()
  };
}

buildStructure(Math.floor(Math.random() * 1e9));

addEventListener('click', () => {
  buildStructure(Math.floor(Math.random() * 1e9));
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();
let lastCollapseTime = 0;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  const dt = 1/60;
  
  // Collapse cycle: 8s build, 2s collapse, repeat
  const cycleDur = 10;
  const cyclePhase = (elapsed % cycleDur) / cycleDur;
  const isCollapsing = cyclePhase > 0.8;
  
  if (isCollapsing && structure.collapsePhase === 0){
    structure.collapsePhase = 1;
    structure.collapseTime = now;
  } else if (!isCollapsing && structure.collapsePhase === 1){
    // Rebuild
    buildStructure(Math.floor(Math.random() * 1e9));
  }
  
  const collapseT = structure.collapsePhase > 0 
    ? Math.min(1, (now - structure.collapseTime) / 2000) 
    : 0;
  
  // Update cubes
  for (let i = 0; i < structure.cubes.length; i++){
    const cube = structure.cubes[i];
    const mesh = cube.mesh;
    
    if (structure.collapsePhase > 0){
      if (!cube.collapsed){
        // Trigger collapse with phase delay
        const trigger = smoothstep(0, 1, collapseT - cube.phase * 0.3);
        if (trigger > 0.01){
          cube.collapsed = true;
          // Random ejection velocity
          cube.velocity.set(
            (cube.seed - 0.5) * 4,
            -0.5 + cube.seed * 2,
            (Math.sin(cube.seed * 6.28) - 0.5) * 4
          );
        }
      }
      
      if (cube.collapsed){
        // Physics
        cube.velocity.y -= 9.8 * dt;
        mesh.position.add(cube.velocity.clone().multiplyScalar(dt));
        
        // Tumble
        mesh.rotation.x += cube.velocity.x * dt * 0.5;
        mesh.rotation.y += cube.velocity.y * dt * 0.5;
        mesh.rotation.z += cube.velocity.z * dt * 0.5;
        
        // Fade out
        if (mesh.material.opacity === undefined){
          mesh.material = mesh.material.clone();
          mesh.material.transparent = true;
          mesh.material.opacity = 1;
        }
        mesh.material.opacity *= 0.97;
      }
    } else {
      // Build phase: assemble animation
      const buildT = Math.min(1, (now - structure.buildTime) / 1800);
      const arriveT = smoothstep(cube.phase * 0.4, cube.phase * 0.4 + 0.6, buildT);
      
      const entry = cube.worldStart.clone();
      entry.y += 12 + cube.seed * 8;
      entry.x += (cube.seed - 0.5) * 6;
      entry.z += (Math.sin(cube.seed * 6.28) - 0.5) * 6;
      
      mesh.position.lerpVectors(entry, cube.worldStart, arriveT);
      
      // Snap rotation to grid as it arrives
      const snapT = smoothstep(0.7, 1.0, arriveT);
      const wobbleX = Math.sin(elapsed * 3 + cube.seed * 6.28) * (1 - snapT) * 0.4;
      const wobbleZ = Math.cos(elapsed * 2.5 + cube.seed * 10) * (1 - snapT) * 0.4;
      mesh.rotation.set(wobbleX, 0, wobbleZ);
      
      // Neon flash on arrival
      if (cube.isNeon && arriveT > 0.9){
        const flash = Math.sin(elapsed * 8 + cube.seed * 6.28) * 0.5 + 0.5;
        mesh.material.emissiveIntensity = 0.6 + flash * 0.4;
      }
      
      mesh.material.opacity = 1;
    }
  }
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
