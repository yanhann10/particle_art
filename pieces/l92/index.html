<style>

<div class="id">l92</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040201, 0.0035);

const camera = new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.03));

const pL = new THREE.PointLight(0xffd8b0, 0.07, 45, 1.8);
pL.position.set(-3, 15, 2);
scene.add(pL);

let seed = 48271053;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 44, h: 34, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — a held breath, the moon you carry home
const sphereCenter = new THREE.Vector3(0.6, 2.0, -0.8);
const SPHERE_R = 1.55;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8de,
    emissive: 0xede4d6,
    emissiveIntensity: 0.6,
    roughness: 0.94,
    metalness: 0.0,
    transparent: true,
    opacity: 0.32
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.65, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xfaf4ec, transparent: true, opacity: 0.04 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// Suspension threads — the sphere hangs from somewhere we can't see
const suspPts = [];
for(let i = 0; i < 6; i++){
  const ox = (rng()-0.5)*0.35;
  const oz = (rng()-0.5)*0.3;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.04, sphereCenter.y + SPHERE_R + 0.04, sphereCenter.z + oz*0.04
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng(), v = rng();
  const theta = 2 * Math.PI * u;
  const phi = Math.acos(2 * v - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(phi)*Math.cos(theta) * SPHERE_R,
    sphereCenter.y + Math.sin(phi)*Math.sin(theta) * SPHERE_R,
    sphereCenter.z + Math.cos(phi) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — Fibonacci-sphere shells with asymmetric density bias
// Denser toward the upper-left octant: threads gather like memory clusters
const anchors = [];
const PHI_GOLD = (1 + Math.sqrt(5)) / 2;

function fibSphere(n, R){
  const pts = [];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n - 1)) * 2;
    const radius = Math.sqrt(1 - y * y);
    const theta = 2 * Math.PI * i / PHI_GOLD;
    const px = sphereCenter.x + Math.cos(theta) * radius * R;
    const py = sphereCenter.y + y * R;
    const pz = sphereCenter.z + Math.sin(theta) * radius * R;
    // Asymmetric density: bias toward -x, +y
    const biasChance = (px < sphereCenter.x && py > sphereCenter.y) ? 1.0 : 0.65;
    if(rng() < biasChance){
      pts.push(new THREE.Vector3(
        px + (rng()-0.5)*R*0.03,
        py + (rng()-0.5)*R*0.03,
        pz + (rng()-0.5)*R*0.03
      ));
    }
  }
  return pts;
}

const shells = [3.0, 6.0, 10.0, 16.0, 22.0];
const shellCounts = [18, 28, 36, 42, 50];
for(let s = 0; s < shells.length; s++){
  const pts = fibSphere(shellCounts[s], shells[s]);
  anchors.push(...pts);
}

// Wall-biased anchors for long spans
while(anchors.length < 650){
  const p = rng() < 0.35 ? wallPt() : wallPt().lerp(sphereCenter, 0.06 + rng()*0.2);
  anchors.push(p);
}

// Void zones — two deliberate clearings for the camera to peer through
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 5, sphereCenter.y + 8, sphereCenter.z + 6), r: 2.4 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y - 5, sphereCenter.z - 7), r: 2.1 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── ANGULAR QUANTIZATION — order near the sphere dissolving to chaos at walls
const QUANT = Math.PI / 12;
function quantize(pt){
  const dx = pt.x - sphereCenter.x, dz = pt.z - sphereCenter.z;
  const d = Math.sqrt(dx*dx + dz*dz);
  if(d > 7.0 || d < 0.1) return pt;
  const blend = Math.max(0, 1.0 - d / 7.0);
  const ang = Math.atan2(dz, dx);
  const qAng = Math.round(ang / QUANT) * QUANT;
  const lAng = ang + (qAng - ang) * blend * 0.55;
  return new THREE.Vector3(
    sphereCenter.x + Math.cos(lAng) * d, pt.y,
    sphereCenter.z + Math.sin(lAng) * d
  );
}

// ── BUILD THREADS
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const qa = quantize(a);
  const qb = quantize(b);
  const idx = li * 6;
  positions[idx]=qa.x; positions[idx+1]=qa.y; positions[idx+2]=qa.z;
  positions[idx+3]=qb.x; positions[idx+4]=qb.y; positions[idx+5]=qb.z;
  const mx=(qa.x+qb.x)*0.5, my=(qa.y+qb.y)*0.5, mz=(qa.z+qb.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Cat A: CONVERGENCE — all roads lead to the sphere
// ~42% — the dominant gesture
const catA = Math.floor(NUM_LINES * 0.42);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.38){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = sphereSurf();
  // 10% stop short — the almost-touch, reaching without arriving
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng() * 1.5;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Cat B: BUNDLED PATHS — groups of 3-5 near-parallel threads
// creating visible "yarns" — the hand-tied quality of real Shiota
// ~18% of budget
const catBtarget = Math.floor(NUM_LINES * 0.18);
let catBcount = 0;
while(catBcount < catBtarget && li < NUM_LINES){
  const bundleSize = 3 + Math.floor(rng() * 3);
  const startAnchor = anchors[Math.floor(rng()*anchors.length)];
  if(inVoid(startAnchor)) continue;

  let endPt;
  if(rng() < 0.55){
    endPt = sphereSurf();
  } else {
    let best = null, bestD = Infinity;
    for(let j = 0; j < 15; j++){
      const bi = Math.floor(rng()*anchors.length);
      const d = startAnchor.distanceTo(anchors[bi]);
      if(d < bestD && d > 1.0 && d < 8.0){ bestD = d; best = anchors[bi]; }
    }
    if(!best) continue;
    endPt = best;
  }
  if(inVoid(endPt)) continue;

  // Generate the bundle: near-parallel threads with slight spread
  const spreadFactor = 0.06 + rng() * 0.08;
  for(let b = 0; b < bundleSize && li < NUM_LINES; b++){
    const offA = new THREE.Vector3((rng()-0.5)*spreadFactor, (rng()-0.5)*spreadFactor, (rng()-0.5)*spreadFactor);
    const offB = new THREE.Vector3((rng()-0.5)*spreadFactor*0.5, (rng()-0.5)*spreadFactor*0.5, (rng()-0.5)*spreadFactor*0.5);
    setLine(startAnchor.clone().add(offA), endPt.clone().add(offB), 1);
    catBcount++;
  }
}

// Cat C: PROXIMITY NETWORK — anchor-to-nearest-anchor
const THRESH = 5.0;
let catCcount = 0;
const catCtarget = Math.floor(NUM_LINES * 0.16);
let attempts = 0;
while(catCcount < catCtarget && li < NUM_LINES && attempts < 100000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.5 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 2);
  catCcount++;

  // Dendritic branching — Y-forks, morphogenetic
  if(rng() < 0.12 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.3 + rng()*0.4);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.12 + rng()*0.4));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 2);
      catCcount++;
    }
  }
}

// Cat D: CORONA — dense wrapping near sphere surface
const catD = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const s2 = sphereSurf();
  const outA = s1.clone().add(new THREE.Vector3((rng()-0.5)*0.45, (rng()-0.5)*0.45, (rng()-0.5)*0.45));
  const outB = s2.clone().add(new THREE.Vector3((rng()-0.5)*0.45, (rng()-0.5)*0.45, (rng()-0.5)*0.45));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB, 3);
}

// Cat E: GRAVITY — threads draping to floor, weighted by memory
const catE = Math.floor(NUM_LINES * 0.05);
for(let i = 0; i < catE && li < NUM_LINES; i++){
  const sp = sphereSurf();
  if(sp.y > sphereCenter.y) sp.y = sphereCenter.y - rng() * SPHERE_R;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*3.5,
    -hh,
    sp.z + (rng()-0.5)*3.5
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 4);
}

// Cat F: LONG SPANS — wall-to-wall, the architecture asserts itself
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.3 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 5);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
// Convergence brightest, bundles slightly less, network quieter, corona intimate, gravity/spans ghostly
const catOpacity = [0.08, 0.07, 0.045, 0.06, 0.05, 0.032];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[Math.min(cat, 5)];
  const bright = op / 0.08;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── SUSPENDED KEYS — 50,000 keys in "The Key in the Hand" (Venice 2015)
// Here: small key silhouettes caught in the web, dark against red
const NUM_KEYS = 28;
for(let i = 0; i < NUM_KEYS; i++){
  // Key shape: a small ring + shaft + two teeth, all from line segments
  const kSize = 0.035 + rng()*0.06;
  const kVerts = [];

  // Ring (octagon)
  const ringR = kSize * 0.4;
  for(let j = 0; j < 8; j++){
    const a1 = (j/8) * Math.PI * 2;
    const a2 = ((j+1)/8) * Math.PI * 2;
    kVerts.push(
      Math.cos(a1)*ringR, Math.sin(a1)*ringR + kSize*0.6, 0,
      Math.cos(a2)*ringR, Math.sin(a2)*ringR + kSize*0.6, 0
    );
  }
  // Shaft
  kVerts.push(0, kSize*0.2, 0, 0, -kSize*0.5, 0);
  // Teeth
  kVerts.push(0, -kSize*0.3, 0, kSize*0.15, -kSize*0.3, 0);
  kVerts.push(0, -kSize*0.45, 0, kSize*0.12, -kSize*0.45, 0);

  const kGeo = new THREE.BufferGeometry();
  kGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(kVerts), 3));

  const d = 0.008 + rng()*0.015;
  const kMat = new THREE.LineBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.18 + rng()*0.2
  });
  const key = new THREE.LineSegments(kGeo, kMat);

  // Place along a thread or near sphere
  if(rng() < 0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    key.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    key.position.copy(sphereCenter).add(dir.multiplyScalar(2.5 + rng()*8.0));
  }
  key.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(key);
}

// A few dark fragments too — charred paper, memory residue
const NUM_FRAGMENTS = 14;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.08;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.4 + rng()*0.7);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.2+rng()*0.3), h*(rng()*0.05), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.02),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  const si = Math.floor(rng()*li)*6;
  const t = 0.2 + rng()*0.6;
  frag.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate, narrative of gathering
// Arc: start looking up through dense threads → settle to eye level → dip below
// sphere looking up at it as a held moon → slow rise back — a cycle of approach
const pathLen = 1800;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  // Asymmetric orbit — tighter approach on one side (the dense side)
  const rBase = 5.2;
  const rMod = Math.sin(p * 0.7 + 1.2) * 1.6 + Math.cos(p * 1.3 + 0.4) * 0.7;
  const rX = rBase + rMod;
  const rZ = rBase + 1.2 + Math.cos(p * 0.6 + 0.8) * 1.4;

  const x = cx + Math.sin(p) * rX;
  // Vertical narrative: start high, settle, dip, rise
  const yBase = cy + 0.5;
  const yWave = Math.sin(p * 0.25 + 0.8) * 3.8
    + Math.cos(p * 0.55 + 2.0) * 2.0
    + Math.sin(p * 1.1 + 3.5) * 0.4;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — nearly imperceptible, <0.4% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0002 * Math.max(0, 1.0 - dist / 25.0);
    const phase = basePositions[idx]*0.14 + basePositions[idx+1]*0.18 + i*0.0005;
    const breath = Math.sin(t*0.012 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.28;
      arr[vi+1] = basePositions[vi+1] + breath*0.18;
      arr[vi+2] = basePositions[vi+2] + breath*0.22;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — the gathering
  const speed = 0.00045;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — always the gravitational center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0014)*0.05;
  look.y += Math.cos(t*0.0011)*0.03;
  look.z += Math.sin(t*0.0017)*0.04;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = -3 + Math.sin(t*0.0007)*0.15;
  pL.position.y = 15 + Math.cos(t*0.0005)*0.08;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
