<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hkl · Shiota — Two Home Countries</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">hkl</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020000, 0.0026);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.008));
const pL = new THREE.PointLight(0xff6040, 0.018, 55, 2.4);
pL.position.set(-4, 7, 1.5);
scene.add(pL);

let seed = 3716284;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── ARCHITECTURAL VOLUME — walk-in chamber
const ROOM = { w:30, h:24, d:26 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE SPHERE — pale, luminous, the still center within the agitated network
// Off-white, cottony — the remembered homeland suspended in a cosmos of thread
const sphereR = 2.4;
const sphereCenter = new THREE.Vector3(2.2, 0.8, -0.5);
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8dc,
    emissive: 0xf0e8dc,
    emissiveIntensity: 0.85,
    roughness: 0.95,
    transparent: true,
    opacity: 0.32,
    fog: true
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Point on sphere surface
function sphereSurfPt(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

// ── DARK FRAGMENTS — paper/charred matter caught in the web
const NUM_FRAGS = 20;
for(let i = 0; i < NUM_FRAGS; i++){
  let pos;
  do {
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = 3.8 + rng()*7.5;
    pos = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.82,
      sphereCenter.z + Math.cos(v)*r
    );
  } while(pos.distanceTo(sphereCenter) < sphereR + 0.8);

  const verts = [];
  const nSeg = 3 + Math.floor(rng()*4);
  const sz = 0.05 + rng()*0.14;
  for(let s = 0; s < nSeg; s++){
    verts.push(
      (rng()-0.5)*sz, (rng()-0.5)*sz, (rng()-0.5)*sz,
      (rng()-0.5)*sz, (rng()-0.5)*sz, (rng()-0.5)*sz
    );
  }
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  const fm = new THREE.LineSegments(fg, new THREE.LineBasicMaterial({
    color: 0x1a1210, transparent: true, opacity: 0.48, fog: true
  }));
  fm.position.copy(pos);
  fm.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(fm);
}

// ── ANCHOR FIELD — radial shells densifying toward sphere
const anchors = [];

// Dense inner shells (circulatory density near the heart)
const shells = [3.5, 5.0, 7.0, 9.5, 12.0, 14.5];
for(const sr of shells){
  const count = Math.floor(sr < 6 ? 28 : 14 + sr*0.8);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.82+rng()*0.36);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.84,
      sphereCenter.z + Math.cos(v)*r
    ));
  }
}

// Wall anchors
for(let i = 0; i < 55; i++) anchors.push(wallPt());

// ── VOID ZONES — 3 cylindrical gaps, intentional negative space
const voids = [];
for(let i = 0; i < 3; i++){
  const u = rng()*Math.PI*2;
  const r = 5.0 + rng()*4.0;
  voids.push({
    x: sphereCenter.x + Math.cos(u)*r,
    z: sphereCenter.z + Math.sin(u)*r,
    r: 1.5 + rng()*1.0
  });
}

function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── SUSPENSION THREADS — ceiling to sphere top
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.35;
  const topR = 0.2 + rng()*0.6;
  const botPt = sphereSurfPt();
  // Ensure bot is on upper hemisphere
  if(botPt.y < sphereCenter.y) botPt.y = sphereCenter.y + (sphereCenter.y - botPt.y);
  suspPts.push(
    sphereCenter.x + Math.cos(a)*topR, hh, sphereCenter.z + Math.sin(a)*topR,
    botPt.x, botPt.y, botPt.z
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0303, transparent: true, opacity: 0.32
})));

// ── THREAD NETWORK — 20,000 segments (hard budget)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  if(inVoid(a) || inVoid(b)) return; // respect void zones
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  li++;
}

// RULE 1: CONVERGENCE — threads from anchors/walls toward sphere surface
// Like blood vessels converging on a heart
const catA = Math.floor(NUM_LINES * 0.56);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }

  const target = sphereSurfPt();

  // 10% yearning threads — stop 0.3–1.8 units short, exposing the gap
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng()*1.5;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped);
  } else {
    setLine(origin, target);
  }
}

// RULE 2: LATERAL WEB — anchor-to-anchor within proximity threshold
const THRESH = 6.0;
const catBtarget = Math.floor(NUM_LINES * 0.22);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 45000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  catBcount++;
}

// RULE 3: DENDRITIC CHAINS — branching outward from sphere surface
// Morphogenetic — each chain spawns from the surface and grows away
for(let i = 0; i < 140 && li < NUM_LINES; i++){
  let pt = sphereSurfPt();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 2 + Math.floor(rng()*4);
  let prevDir = radial.clone();

  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.35 + rng()*0.65;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.45, (rng()-0.5)*0.45, (rng()-0.5)*0.45
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next);

    // Y-fork at generation 1 — dendritic branching
    if(c === 1 && rng() < 0.35 && li < NUM_LINES){
      const forkDev = new THREE.Vector3(
        (rng()-0.5)*0.7, (rng()-0.5)*0.7, (rng()-0.5)*0.7
      );
      const forkDir = prevDir.clone().add(forkDev).normalize();
      const forkPt = pt.clone().add(forkDir.multiplyScalar(0.25 + rng()*0.4));
      setLine(pt, forkPt);
    }

    pt = next;
    prevDir = dir;
  }
}

// Fill remainder with architectural spans — wall to wall or wall to sphere vicinity
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.15 ? sphereSurfPt() : wallPt();
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — single arterial red #c20018
// Density gradient: threads closer to sphere are brighter (circulatory concentration)
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  // Closer to sphere = brighter; far away = dimmer
  const distFade = Math.max(0.22, 1.0 - d*0.058);
  const baseOp = 0.11 * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.75;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA DOLLY — slow drift INSIDE the web, sphere always in view
// Five-phase path: approach → rise → intimate → descend → return
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.18){
    // Phase 1: low approach, threading through web
    const lt = t/0.18;
    rH = 5.2 + lt*0.8;
    y = cy - 2.0 + lt*2.4;
  } else if(t < 0.38){
    // Phase 2: rise alongside, seeing sphere from below
    const lt = (t-0.18)/0.2;
    rH = 6.0 + lt*2.5;
    y = cy + 0.4 + lt*4.8;
  } else if(t < 0.54){
    // Phase 3: close orbit, intimate with the sphere
    const lt = (t-0.38)/0.16;
    rH = 8.5 - lt*2.8;
    y = cy + 5.2 + Math.sin(lt*Math.PI)*1.2;
  } else if(t < 0.76){
    // Phase 4: descend through dense convergence zone
    const lt = (t-0.54)/0.22;
    rH = 5.7 + lt*1.5;
    y = cy + 6.4 - lt*10.5;
  } else {
    // Phase 5: return arc, low and close
    const lt = (t-0.76)/0.24;
    rH = 7.2 - lt*2.0;
    y = cy - 4.1 + lt*2.1;
  }

  const x = cx + Math.sin(p*0.82)*rH;
  const z = cz + Math.cos(p*0.82)*rH*1.08;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

// Start camera at a position where web + sphere are clearly visible
camera.position.copy(dollyPath[0]);
camera.lookAt(sphereCenter);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — <0.4% length variation, tidal not noisy
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00006 * Math.max(0, 1.0-dist/15.0);
    const phase = basePositions[idx]*0.04 + basePositions[idx+1]*0.06 + i*0.00015;
    const breath = Math.sin(elapsed*0.004+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.16;
      arr[vi+1] = basePositions[vi+1] + breath*0.11;
      arr[vi+2] = basePositions[vi+2] + breath*0.13;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — very slow drift through the installation
  const speed = 0.00010;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with slow micro-drift
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00045)*0.035;
  look.y += Math.cos(elapsed*0.00032)*0.18;
  look.z += Math.sin(elapsed*0.00058+0.3)*0.03;
  camera.lookAt(look);

  // Light micro-drift
  pL.position.x = -4 + Math.sin(elapsed*0.0002)*0.06;
  pL.position.y = 7 + Math.cos(elapsed*0.00012)*0.05;
  pL.intensity = 0.018 + Math.sin(elapsed*0.00028)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
