<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2m · the flock that loses one and finds it again</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a14; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      radial-gradient(ellipse at 50% 120%, #1a1520 0%, transparent 70%),
      linear-gradient(to bottom,
        #0e0e1a 0%,
        #151222 22%,
        #1f1528 45%,
        #2a1c2e 68%,
        #352432 88%,
        #3d2a38 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #cdd2dc; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 10px; letter-spacing: 0.06em;
          color: #d09060; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<div class="id">v2m</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e0e1a, 0.032);
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ─── volumetric light beam (top-right, angled slightly)
const beamGeo = new THREE.ConeGeometry(2.8, 38, 32, 1, true);
const beamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vWorldPos;
    void main(){
      float edge = 1.0 - abs(vUv.x - 0.5) * 2.0;
      edge = pow(edge, 2.2);
      float height = vUv.y;
      float falloff = pow(1.0 - height, 1.8);
      float flicker = 0.92 + 0.08 * sin(uTime * 0.7 + vWorldPos.y * 0.3);
      vec3 col = mix(vec3(0.95, 0.78, 0.50), vec3(0.85, 0.62, 0.40), height);
      float a = edge * falloff * flicker * 0.065;
      gl_FragColor = vec4(col * a * 1.8, a);
    }
  `
});
const beam = new THREE.Mesh(beamGeo, beamMat);
beam.position.set(7.5, 12, -4);
beam.rotation.z = -0.12;
beam.rotation.x = 0.08;
scene.add(beam);

// ─── starfield specks for texture
const starCount = 220;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++){
  starPos[i*3]   = (Math.random() - 0.5) * 60;
  starPos[i*3+1] = (Math.random() - 0.5) * 40;
  starPos[i*3+2] = -15 - Math.random() * 30;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0x998899, size: 0.08, transparent: true, opacity: 0.35,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false
});
scene.add(new THREE.Points(starGeo, starMat));

// ─── low horizon ground mist plane
const mistGeo = new THREE.PlaneGeometry(80, 20);
const mistMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.NormalBlending, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float y = vUv.y;
      float fade = smoothstep(0.0, 0.6, y) * (1.0 - smoothstep(0.7, 1.0, y));
      float drift = sin(vUv.x * 3.0 + uTime * 0.15) * 0.3 + 0.7;
      vec3 col = vec3(0.18, 0.12, 0.15);
      float a = fade * drift * 0.22;
      gl_FragColor = vec4(col, a);
    }
  `
});
const mist = new THREE.Mesh(mistGeo, mistMat);
mist.position.set(0, -9, 0);
mist.rotation.x = -0.15;
scene.add(mist);

// ─── boids with embedded narrative
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3+1]   = Math.sin(ph) * r;
  pos[i*3+2]   = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3+1]   = (Math.random() - 0.5) * 0.3;
  vel[i*3+2]   = (Math.random() - 0.5) * 0.4;
}
pos[0] = -1.2; pos[1] = 0.6; pos[2] = 0.0;

const PERCEPTION_R = 4.0, SEPARATION_R = 0.9;
const W_COH = 0.018, W_ALI = 0.060, W_SEP = 0.080;
const MAX_SPEED = 1.4, MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

// beam intersection test (world-space cylinder approx)
const beamOrigin = new THREE.Vector3(7.5, 22, -4);
const beamDir = new THREE.Vector3(-0.12, -1, 0.08).normalize();
const beamRadius = 2.8;

function inBeam(x, y, z){
  const dx = x - beamOrigin.x, dy = y - beamOrigin.y, dz = z - beamOrigin.z;
  const t = dx*beamDir.x + dy*beamDir.y + dz*beamDir.z;
  if (t < 0 || t > 38) return 0;
  const px = dx - beamDir.x*t, py = dy - beamDir.y*t, pz = dz - beamDir.z*t;
  const dist = Math.sqrt(px*px + py*py + pz*pz);
  return Math.max(0, 1.0 - dist / beamRadius);
}

function step(dt){
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){ cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2]; }
  cx /= (N-1); cy /= (N-1); cz /= (N-1);

  const sx = pos[0] - cx, sy = pos[1] - cy, sz = pos[2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCohesion = Math.max(0, Math.min(1, 1 - stragDist / 8));
  cohesion += (targetCohesion - cohesion) * dt * 0.45;

  if (cohesion > 0.85) arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5) arcStage = 'loss';
  else if (cohesion < 0.5) arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65) arcStage = 'return';
  arcEl.textContent = `${arcStage} · ${Math.round(cohesion*100)}%`;

  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX=0,cohY=0,cohZ=0,cohN=0;
    let aliX=0,aliY=0,aliZ=0,aliN=0;
    let sepX=0,sepY=0,sepZ=0;
    const px=pos[i*3],py=pos[i*3+1],pz=pos[i*3+2];
    const isS = i === STRAGGLER;
    const pR = isS ? PERCEPTION_R * 0.55 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i===j) continue;
      const dx=pos[j*3]-px, dy=pos[j*3+1]-py, dz=pos[j*3+2]-pz;
      const d2=dx*dx+dy*dy+dz*dz;
      if (d2 > pR*pR || d2 < 1e-6) continue;
      cohX+=pos[j*3]; cohY+=pos[j*3+1]; cohZ+=pos[j*3+2]; cohN++;
      aliX+=vel[j*3]; aliY+=vel[j*3+1]; aliZ+=vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R*SEPARATION_R){
        const inv = 1/Math.sqrt(d2);
        sepX -= dx*inv; sepY -= dy*inv; sepZ -= dz*inv;
      }
    }

    if (isS){
      const drift = Math.sin(performance.now()*0.0003)*0.4;
      acc[i*3] += drift;
      acc[i*3+1] += -0.25 + Math.cos(performance.now()*0.0002)*0.2;
      acc[i*3+2] += drift*0.6;
    }

    if (!isS && (arcStage==='seeking'||arcStage==='return')){
      const tx=pos[0]-px, ty=pos[1]-py, tz=pos[2]-pz;
      const td=Math.sqrt(tx*tx+ty*ty+tz*tz)+1e-3;
      const seek = arcStage==='seeking' ? 0.020 : 0.012;
      acc[i*3]+=tx/td*seek; acc[i*3+1]+=ty/td*seek; acc[i*3+2]+=tz/td*seek;
    }

    if (cohN>0){ acc[i*3]+=(cohX/cohN-px)*W_COH; acc[i*3+1]+=(cohY/cohN-py)*W_COH; acc[i*3+2]+=(cohZ/cohN-pz)*W_COH; }
    if (aliN>0){ acc[i*3]+=(aliX/aliN-vel[i*3])*W_ALI; acc[i*3+1]+=(aliY/aliN-vel[i*3+1])*W_ALI; acc[i*3+2]+=(aliZ/aliN-vel[i*3+2])*W_ALI; }
    acc[i*3]+=sepX*W_SEP; acc[i*3+1]+=sepY*W_SEP; acc[i*3+2]+=sepZ*W_SEP;

    const d2c=px*px+py*py+pz*pz;
    if (d2c>90){ const inv=0.012/Math.sqrt(d2c); acc[i*3]-=px*inv; acc[i*3+1]-=py*inv; acc[i*3+2]-=pz*inv; }
  }

  const speedMul = (arcStage==='loss'||arcStage==='seeking') ? 0.55 : arcStage==='return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++){
    let ax=acc[i*3],ay=acc[i*3+1],az=acc[i*3+2];
    const af=Math.sqrt(ax*ax+ay*ay+az*az);
    if (af>MAX_FORCE){ ax*=MAX_FORCE/af; ay*=MAX_FORCE/af; az*=MAX_FORCE/af; }
    vel[i*3]+=ax; vel[i*3+1]+=ay; vel[i*3+2]+=az;
    let vx=vel[i*3],vy=vel[i*3+1],vz=vel[i*3+2];
    const sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
    if (sp>MAX_SPEED){ vx*=MAX_SPEED/sp; vy*=MAX_SPEED/sp; vz*=MAX_SPEED/sp; vel[i*3]=vx; vel[i*3+1]=vy; vel[i*3+2]=vz; }
    pos[i*3]+=vel[i*3]*dt*speedMul;
    pos[i*3+1]+=vel[i*3+1]*dt*speedMul;
    pos[i*3+2]+=vel[i*3+2]*dt*speedMul;
  }
}

// ─── particle render with beam-intersection brightening
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedArr = new Float32Array(N);
for (let i = 0; i < N; i++) seedArr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));
const isStragArr = new Float32Array(N);
isStragArr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(isStragArr, 1));
const beamIntensity = new Float32Array(N);
geom.setAttribute('beamI', new THREE.BufferAttribute(beamIntensity, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    attribute float beamI;
    varying vec3  vCol;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = 1.6 + 0.8 * sin(t);
      float stragSize = strag * 2.4;
      gl_PointSize = (baseSize + stragSize) * uPixel * (16.0 / dist);
      vFade = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);

      vec3 warm  = vec3(0.96, 0.65, 0.32);
      vec3 hot   = vec3(1.00, 0.92, 0.78);
      vec3 cool  = vec3(0.42, 0.55, 0.78);
      vec3 lost  = vec3(0.55, 0.32, 0.62);
      vec3 cohCol = mix(cool, warm, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(lost, hot, smoothstep(0.0, 1.0, uCohesion));
      vCol = mix(cohCol, highCol, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.18);
      vCol *= (1.0 + strag * 0.4);
      // beam intersection brightening
      vCol += vec3(0.95, 0.80, 0.55) * beamI * 0.6;
      vFade = min(1.0, vFade + beamI * 0.3);

      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vFade;
      gl_FragColor = vec4(vCol * a * 0.95, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  uniforms.uCohesion.value = cohesion;
  beamMat.uniforms.uTime.value = t;
  mistMat.uniforms.uTime.value = t;

  step(dt);
  // update beam intersection per particle
  for (let i = 0; i < N; i++){
    beamIntensity[i] = inBeam(pos[i*3], pos[i*3+1], pos[i*3+2]);
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.beamI.needsUpdate = true;

  const ang = now * 0.00010;
  camera.position.x = Math.sin(ang) * 26;
  camera.position.z = Math.cos(ang) * 26;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
