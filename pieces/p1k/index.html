<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<div class="id">p7k · improvisational</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const angle = Math.random() * Math.PI * 2;
  const rad = Math.random() * 2.2;
  init[i*4]   = Math.cos(angle) * rad * (0.4 + Math.random() * 0.6);
  init[i*4+1] = Math.sin(angle) * rad * (0.4 + Math.random() * 0.6);
  init[i*4+2] = (Math.random() - 0.5) * 0.15;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev:  { value: rtA.texture },
  uDt:   { value: 0.01 },
  uA:    { value: 0.95 },
  uB:    { value: 0.70 },
  uC:    { value: 0.60 },
  uD:    { value: 3.50 },
  uE:    { value: 0.25 },
  uF:    { value: 0.10 },
  uTime: { value: 0.0 },
  uSwingX: { value: 0.0 },
  uSwingY: { value: 0.0 },
  uBurst:  { value: 0.0 },
  uBurstAngle: { value: 0.0 },
  uRes:  { value: new THREE.Vector2(W, H) }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uTime, uSwingX, uSwingY, uBurst, uBurstAngle;
    uniform vec2 uRes;
    varying vec2 vUv;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec2 pid = vUv * uRes;

      float h1 = hash(pid);
      float h2 = hash(pid + 71.0);
      float h3 = hash(pid + 137.0);
      float h4 = hash(pid + 213.0);

      // Flattened Aizawa attractor — parent's ghost, pressed onto canvas
      vec3 att = vec3(
        (p.z * 6.0 - uB) * p.x - uD * p.y,
        uD * p.x + (p.z * 6.0 - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      att.z *= 0.04;
      att.xy *= 0.35;

      // Pollock arm-swing: pendulum arc force
      // Multiple swing streams at different phases (all-over composition)
      float streamId = floor(h1 * 5.0);
      float streamPhase = streamId * 1.2566;
      float swingT = uTime * (0.6 + h4 * 0.4) + streamPhase;
      
      // Pivot traces a slow figure-eight (Pollock's whole-body rhythm)
      vec2 pivot = vec2(
        sin(swingT * 0.7) * 1.5 + uSwingX,
        sin(swingT * 0.53 + 1.0) * 1.2 + uSwingY
      );
      
      vec2 toPivot = pivot - p.xy;
      float dist = length(toPivot);
      vec2 radial = dist > 0.001 ? toPivot / dist : vec2(0.0);
      
      // Tangential force — creates the characteristic arcing drip
      vec2 tangent = vec2(-radial.y, radial.x);
      float tangentStr = 2.0 + h2 * 1.5;
      
      // String tension — elastic pull toward swing radius
      float idealRadius = 0.8 + h3 * 1.6;
      float tension = (dist - idealRadius) * 0.6;
      
      vec3 dp = att;
      dp.xy += tangent * tangentStr / (1.0 + dist * 0.5);
      dp.xy += radial * tension;

      // Gravity drip — paint falls
      dp.y -= 0.15 + h3 * 0.12;

      // Gestural burst — periodic fling of energy
      if(uBurst > 0.01){
        float ba = uBurstAngle + h1 * 0.8 - 0.4;
        vec2 burstDir = vec2(cos(ba), sin(ba));
        float burstStr = uBurst * (2.5 + h2 * 3.0);
        // Closer particles to burst origin get flung harder
        float burstDist = length(p.xy - pivot);
        burstStr *= exp(-burstDist * 0.4);
        dp.xy += burstDir * burstStr;
      }

      // Second harmonic swing for all-over coverage
      float swing2T = uTime * 0.4 + h2 * 6.28;
      vec2 drift = vec2(
        sin(swing2T + p.y * 0.3) * 0.3,
        cos(swing2T * 0.8 + p.x * 0.3) * 0.25
      );
      dp.xy += drift;

      // Viscous drag — paint consistency (some thick, some thin)
      float viscosity = 0.85 + h4 * 0.12;
      float speed = length(dp);
      dp *= viscosity / (1.0 + speed * 0.08);

      // Flatten onto canvas plane
      dp.z -= p.z * 2.0;

      p += dp * uDt;

      // Canvas bounds — respawn if particle leaves frame
      if(abs(p.x) > 3.8 || abs(p.y) > 3.0){
        float cycle = floor(uTime * 0.5 + h1 * 10.0);
        float r1 = hash(vec2(h1, cycle));
        float r2 = hash(vec2(h2, cycle));
        p.x = (r1 - 0.5) * 3.0;
        p.y = (r2 - 0.5) * 2.4;
        p.z = (h3 - 0.5) * 0.1;
        age = 0.0;
      }

      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// Render
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.05, 80);
camera.position.set(0, 0.8, 5.5);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vHash;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vSpeed = clamp(length(p.xy) * 0.25, 0.0, 1.0);
      vHash = fract(sin(dot(uvIdx, vec2(127.1, 311.7))) * 43758.5453);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // Vary size: thin splatters and thick drips
      float thickness = 0.6 + vHash * 1.2;
      float sz = thickness * uPixel * (7.0 / max(dist, 0.5));
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vHash;
    uniform float uTime;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);

      // Pollock palette: ivory, raw umber, aluminum, deep navy
      // (Autumn Rhythm / Number 1A, 1948 / Lavender Mist references)
      vec3 c_ivory  = vec3(0.91, 0.86, 0.75);
      vec3 c_umber  = vec3(0.40, 0.24, 0.12);
      vec3 c_silver = vec3(0.68, 0.72, 0.78);
      vec3 c_navy   = vec3(0.08, 0.10, 0.20);
      vec3 c_ochre  = vec3(0.78, 0.58, 0.22);

      // Each particle committed to a paint color (hash-based, like Pollock's layered passes)
      float colorBand = vHash;
      vec3 col;
      if(colorBand < 0.30){
        col = mix(c_ivory, c_silver, smoothstep(0.0, 0.30, colorBand));
      } else if(colorBand < 0.55){
        col = mix(c_umber, c_ochre, smoothstep(0.30, 0.55, colorBand));
      } else if(colorBand < 0.80){
        col = mix(c_silver, c_ivory, smoothstep(0.55, 0.80, colorBand));
      } else {
        col = mix(c_navy, c_umber, smoothstep(0.80, 1.0, colorBand));
      }

      // Slight shimmer on silver particles (aluminum paint glint)
      if(colorBand > 0.55 && colorBand < 0.80){
        float glint = sin(uTime * 3.0 + vHash * 40.0) * 0.5 + 0.5;
        col += glint * 0.08;
      }

      // Age fade: fresh drips are brighter
      float freshness = 1.0 - vAge * 0.3;
      col *= freshness;

      float opacity = a * (0.35 + vSpeed * 0.5 + (1.0 - vAge) * 0.25);
      gl_FragColor = vec4(col * opacity, opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pointer: Pollock's body position influences the swing pivot
const swing = { x: 0, y: 0 };
addEventListener('pointermove', (e) => {
  swing.x = ((e.clientX / innerWidth) - 0.5) * 1.5;
  swing.y = ((e.clientY / innerHeight) - 0.5) * -1.0;
});

let t0 = performance.now();

// Burst timing: irregular gestural flings (Pollock's improvisational rhythm)
// Not periodic — quasi-random intervals for improvisational feel
const burstSchedule = [];
let nextBurst = 2.0;
for (let i = 0; i < 60; i++){
  burstSchedule.push(nextBurst);
  nextBurst += 1.8 + Math.random() * 4.5; // 1.8-6.3s gaps — irregular
}
let burstIdx = 0;
let burstEnvelope = 0;
let burstAngle = 0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uTime.value = elapsed;
  simUniforms.uSwingX.value += (swing.x - simUniforms.uSwingX.value) * 0.03;
  simUniforms.uSwingY.value += (swing.y - simUniforms.uSwingY.value) * 0.03;

  // Burst envelope (attack-decay)
  if(burstIdx < burstSchedule.length && elapsed > burstSchedule[burstIdx]){
    burstEnvelope = 1.0;
    burstAngle = Math.random() * Math.PI * 2;
    burstIdx++;
  }
  burstEnvelope *= 0.93; // fast decay
  simUniforms.uBurst.value = burstEnvelope;
  simUniforms.uBurstAngle.value = burstAngle;

  // Slowly morph attractor params (improvisational drift, never settles)
  simUniforms.uA.value = 0.95 + Math.sin(elapsed * 0.13) * 0.06;
  simUniforms.uC.value = 0.60 + Math.sin(elapsed * 0.09 + 1.0) * 0.08;
  simUniforms.uD.value = 3.50 + Math.sin(elapsed * 0.07 + 2.0) * 0.30;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;

  // Camera: slight overhead angle, slow drift — viewing the floor canvas
  // Pollock perspective: standing over the work, walking around it
  const ang = elapsed * 0.06;
  const camDist = 5.2 + Math.sin(elapsed * 0.11) * 0.5;
  const camHeight = 2.8 + Math.sin(elapsed * 0.08) * 0.4;
  camera.position.x = Math.sin(ang) * camDist * 0.4;
  camera.position.z = Math.cos(ang) * camDist;
  camera.position.y = camHeight;
  // Track the centroid of activity (shifts with swing)
  const lookX = simUniforms.uSwingX.value * 0.3;
  const lookY = simUniforms.uSwingY.value * 0.2 - 0.1;
  camera.lookAt(lookX, lookY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
