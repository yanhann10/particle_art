<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>le2 · 1% de Désordre</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f0e8; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
        letter-spacing: 0.06em; color:#1a1a1a; }
</style>
</head>
<body>
<div class="id">le2 · 1% de Désordre</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4f0e8, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 45);
camera.lookAt(0, 0, 0);

// Grid: 32 × 32 cells, each cell contains nested squares (4 levels deep)
const GRID = 32;
const CELL_SIZE = 1.0;
const NESTS = 4;  // nested squares per cell
const instances = [];

// Build instance data: for each cell, for each nesting level
for (let gy = 0; gy < GRID; gy++){
  for (let gx = 0; gx < GRID; gx++){
    const cx = (gx - GRID/2) * CELL_SIZE;
    const cy = (gy - GRID/2) * CELL_SIZE;
    
    // chaos_amount: 0 at top (gy=0), 1 at bottom (gy=GRID-1)
    const chaos = gy / (GRID - 1);
    
    for (let n = 0; n < NESTS; n++){
      // nested square sizes decrease inward
      const size = CELL_SIZE * 0.8 * (1.0 - n * 0.18);
      instances.push({ cx, cy, size, chaos, nest: n });
    }
  }
}

// For each instance we'll draw a square as 4 line segments
// Store geometry once, instance it with transforms
const segmentGeom = new THREE.BufferGeometry();
const positions = new Float32Array([
  0, 0, 0,
  1, 0, 0
]);
segmentGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const lineMat = new THREE.LineBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.85 });

// We'll create individual line objects and apply transforms manually
// (InstancedMesh doesn't support lines well, so we'll brute-force)
const lineObjects = [];

instances.forEach(inst => {
  const { cx, cy, size, chaos } = inst;
  
  // Per-instance random seeds (deterministic based on position)
  const seed = (cx * 1000 + cy) * 0.0001;
  const rnd = (s) => {
    const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  };
  
  // Gaussian approximation via sum of uniforms
  const gauss = () => {
    let sum = 0;
    for (let i = 0; i < 6; i++) sum += rnd(seed + i * 0.1);
    return (sum / 6 - 0.5) * 2.0;  // mean 0, roughly stddev 0.4
  };
  
  // Perturbations grow with chaos
  const offsetX = gauss() * chaos * 0.2;
  const offsetY = gauss() * chaos * 0.2;
  const angle = gauss() * chaos * 0.15;  // radians
  const scaleVar = 1.0 + gauss() * chaos * 0.08;
  
  // Draw square as 4 edges
  const corners = [
    [-0.5, -0.5],
    [ 0.5, -0.5],
    [ 0.5,  0.5],
    [-0.5,  0.5]
  ];
  
  for (let i = 0; i < 4; i++){
    const [x1, y1] = corners[i];
    const [x2, y2] = corners[(i+1) % 4];
    
    const edgeGeom = new THREE.BufferGeometry();
    const pts = new Float32Array([
      x1 * size * scaleVar, y1 * size * scaleVar, 0,
      x2 * size * scaleVar, y2 * size * scaleVar, 0
    ]);
    edgeGeom.setAttribute('position', new THREE.BufferAttribute(pts, 3));
    
    const line = new THREE.Line(edgeGeom, lineMat);
    
    // Apply rotation around center
    line.rotation.z = angle;
    
    // Apply translation
    line.position.set(cx + offsetX, cy + offsetY, 0);
    
    scene.add(line);
    lineObjects.push(line);
  }
});

// Slow camera orbit — very gentle, Molnar's work doesn't shout
let time = 0;
function loop(){
  time += 0.0008;
  
  const radius = 45;
  camera.position.x = Math.sin(time) * radius * 0.2;
  camera.position.z = Math.cos(time) * radius;
  camera.position.y = Math.sin(time * 0.7) * 5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
</html>
