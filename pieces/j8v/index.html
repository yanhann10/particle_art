<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j8v · soft-erupt · vascular tower with spore release</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#e6c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">j8v</div>
<div class="hint">drag to orbit · click to pause/resume</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── soft-erupt ──
   The vascular tower from t9w grows as before, but every ~9 seconds the
   top third of the tube gently swells outward — a diastolic over-pulse —
   and releases a cloud of luminous spore-particles that drift upward and
   fade like dandelion seeds catching a thermal. The eruption is Calder-
   gentle: the form bulges, exhales its cargo, then quietly contracts.
   Inspired by Ernst Haeckel's Kunstformen der Natur siphonophore plates
   — biological forms that bud and release.                              */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.035);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff0e8, 0.9);
lightKey.position.set(5, 10, 5);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const lightRim = new THREE.DirectionalLight(0x88aacc, 0.4);
lightRim.position.set(-5, 3, -5);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (inherited from t9w / 5gm)
const MAX_VERTS = 1500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.50;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0045;
const MAX_D     = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── spore particle system (the surprise)
const MAX_SPORES = 800;
const sporePositions = new Float32Array(MAX_SPORES * 3);
const sporeAlphas    = new Float32Array(MAX_SPORES);
const sporeSpeeds    = new Float32Array(MAX_SPORES * 3);
let sporeCount = 0;

const sporeGeo = new THREE.BufferGeometry();
sporeGeo.setAttribute('position', new THREE.BufferAttribute(sporePositions, 3));
sporeGeo.setAttribute('alpha', new THREE.BufferAttribute(sporeAlphas, 1));

const sporeMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  uniforms: {
    uColor: { value: new THREE.Color(0xffcc88) },
    fogColor: { value: new THREE.Color(0x0a0608) },
    fogDensity: { value: 0.035 }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      vAlpha = alpha;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      float fogDist = length(mvPos.xyz);
      vFogFactor = 1.0 - exp(-0.035 * 0.035 * fogDist * fogDist);
      gl_PointSize = max(2.0, 6.0 * (1.0 / -mvPos.z) * alpha);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform vec3 fogColor;
    varying float vAlpha;
    varying float vFogFactor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float soft = smoothstep(0.5, 0.15, d);
      vec3 col = mix(uColor, fogColor, vFogFactor);
      gl_FragColor = vec4(col, soft * vAlpha * 0.85);
    }
  `
});
const sporeMesh = new THREE.Points(sporeGeo, sporeMat);
scene.add(sporeMesh);

function emitSpores(cx, cy, cz, count){
  for (let i = 0; i < count && sporeCount < MAX_SPORES; i++){
    const idx = sporeCount;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.random() * Math.PI * 0.6;
    const r  = 0.3 + Math.random() * 0.6;
    sporePositions[idx*3]     = cx + Math.sin(ph)*Math.cos(th)*r;
    sporePositions[idx*3 + 1] = cy + Math.cos(ph)*r*0.5;
    sporePositions[idx*3 + 2] = cz + Math.sin(ph)*Math.sin(th)*r;
    sporeSpeeds[idx*3]     = (Math.random()-0.5)*0.008;
    sporeSpeeds[idx*3 + 1] = 0.012 + Math.random()*0.018;
    sporeSpeeds[idx*3 + 2] = (Math.random()-0.5)*0.008;
    sporeAlphas[idx] = 0.7 + Math.random()*0.3;
    sporeCount++;
  }
}

function updateSpores(dt){
  let writeIdx = 0;
  for (let i = 0; i < sporeCount; i++){
    sporeAlphas[i] -= dt * 0.12;
    if (sporeAlphas[i] <= 0) continue;
    // drift upward with slight wander
    sporePositions[i*3]     += sporeSpeeds[i*3] + (Math.random()-0.5)*0.002;
    sporePositions[i*3 + 1] += sporeSpeeds[i*3+1];
    sporePositions[i*3 + 2] += sporeSpeeds[i*3+2] + (Math.random()-0.5)*0.002;
    sporeSpeeds[i*3+1] *= 0.998; // slow rise
    if (writeIdx !== i){
      sporePositions[writeIdx*3]   = sporePositions[i*3];
      sporePositions[writeIdx*3+1] = sporePositions[i*3+1];
      sporePositions[writeIdx*3+2] = sporePositions[i*3+2];
      sporeSpeeds[writeIdx*3]   = sporeSpeeds[i*3];
      sporeSpeeds[writeIdx*3+1] = sporeSpeeds[i*3+1];
      sporeSpeeds[writeIdx*3+2] = sporeSpeeds[i*3+2];
      sporeAlphas[writeIdx] = sporeAlphas[i];
    }
    writeIdx++;
  }
  sporeCount = writeIdx;
  sporeGeo.attributes.position.needsUpdate = true;
  sporeGeo.attributes.alpha.needsUpdate = true;
  sporeGeo.setDrawRange(0, sporeCount);
}

// ─────────── eruption state
const ERUPT_PERIOD  = 9.0;   // seconds between eruptions
const ERUPT_RISE    = 1.5;   // swell duration
const ERUPT_HOLD    = 0.6;   // hold at peak
const ERUPT_FALL    = 2.0;   // settle duration
const ERUPT_CYCLE   = ERUPT_RISE + ERUPT_HOLD + ERUPT_FALL;
let eruptPhase = -1; // -1 = waiting
let eruptTimer = 4.0; // first eruption after 4s
let eruptAmount = 0;  // 0..1 swell factor
let hasEmittedThisCycle = false;

function updateEruption(dt){
  if (eruptPhase < 0){
    eruptTimer -= dt;
    if (eruptTimer <= 0){
      eruptPhase = 0;
      eruptTimer = 0;
      hasEmittedThisCycle = false;
    }
    eruptAmount *= 0.92; // decay any residual
    return;
  }
  eruptTimer += dt;
  if (eruptTimer < ERUPT_RISE){
    // swelling
    eruptAmount = eruptTimer / ERUPT_RISE;
    eruptAmount = eruptAmount * eruptAmount * (3 - 2*eruptAmount); // smoothstep
  } else if (eruptTimer < ERUPT_RISE + ERUPT_HOLD){
    eruptAmount = 1.0;
    // emit spores at peak
    if (!hasEmittedThisCycle){
      hasEmittedThisCycle = true;
      // find top-third centroid of tube
      let yMin = Infinity, yMax = -Infinity;
      for (const v of verts){ if(v.y<yMin) yMin=v.y; if(v.y>yMax) yMax=v.y; }
      const yThresh = yMin + (yMax-yMin)*0.65;
      let sx=0,sy=0,sz=0,sc=0;
      for (const v of verts){
        if (v.y > yThresh){ sx+=v.x; sy+=v.y; sz+=v.z; sc++; }
      }
      if (sc > 0){
        emitSpores(sx/sc, sy/sc, sz/sc, 60 + Math.floor(Math.random()*40));
      }
    }
  } else if (eruptTimer < ERUPT_CYCLE){
    const fallT = (eruptTimer - ERUPT_RISE - ERUPT_HOLD) / ERUPT_FALL;
    eruptAmount = 1.0 - fallT * fallT; // ease-in settle
  } else {
    eruptAmount = 0;
    eruptPhase = -1;
    eruptTimer = ERUPT_PERIOD + (Math.random()-0.5)*2;
  }
}

// ─────────── vascular tube renderer
let tubeMesh = null;
const tubeColorBase = new THREE.Color(0xb04438);
const tubeColorErupt = new THREE.Color(0xd4956a); // warm amber flush
const tubeEmitBase = new THREE.Color(0x2a0808);
const tubeEmitErupt = new THREE.Color(0x4a2010);

const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xb04438,
  emissive: 0x2a0808,
  roughness: 0.5,
  metalness: 0.05,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = 0;
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;

  for (let s = 0; s < 2; s++) step();
  updateEruption(dt);
  updateSpores(dt);

  // color shift during eruption
  tubeMat.color.copy(tubeColorBase).lerp(tubeColorErupt, eruptAmount * 0.6);
  tubeMat.emissive.copy(tubeEmitBase).lerp(tubeEmitErupt, eruptAmount * 0.8);
  // update spore glow color during eruption
  sporeMat.uniforms.uColor.value.set(0xffcc88).lerp(new THREE.Color(0xffddaa), eruptAmount);

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){ if (v.y < yMin) yMin = v.y; if (v.y > yMax) yMax = v.y; }
    const yRange = Math.max(yMax - yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(700, verts.length * 2);
    const RADIAL = 8;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    const pulse = 1.0 + 0.10 * Math.sin(t * 1.6);

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
      let r = 0.40 * (1 - heightFrac * 0.78);

      // SURPRISE: top-third swells during eruption
      const eruptZone = smoothstep(0.55, 0.85, heightFrac);
      const swell = 1.0 + eruptAmount * eruptZone * 1.2;
      r *= swell;

      // vessel nodes
      const node = Math.sin(tt * 22.0) * 0.5 + 0.5;
      r *= (1.0 + 0.18 * Math.pow(node, 6));
      r *= pulse;

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i * RADIAL + j) * 3]     = v.x;
        positions[(i * RADIAL + j) * 3 + 1] = v.y;
        positions[(i * RADIAL + j) * 3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  // camera tracks centroid
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function smoothstep(lo, hi, x){
  const t = Math.max(0, Math.min(1, (x - lo) / (hi - lo)));
  return t * t * (3 - 2 * t);
}

loop();
</script>
</body>
