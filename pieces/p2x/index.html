<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>obsessive · kusama particle field · infinite dot recursion</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
      color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">p2x</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  Kusama obsessive: take the parent's vascular network and make it compulsively
  dot every intersection, every node, every branch — infinite polka-dot recursion
  as if the slime mold veins themselves become hosts for obsessive repetition.
  
  The form remains recognizable (differential growth network) but dots proliferate
  at every vertex, scaled by local trail intensity, each dot a mirror reflecting
  neighbors in fractal feedback. Palette shifts to Kusama yellow/black with red accents.
  
  Not literal pumpkins or infinity rooms — the *practice* of obsessive dotting
  applied to computational substrate.
*/

// ─── Physarum simulation (inherit structure) ───
const W = 128, H = 128;
const trail = new Float32Array(W * H);
const trailB = new Float32Array(W * H);

const foods = [
  { x: 0.14, y: 0.28 }, { x: 0.71, y: 0.15 },
  { x: 0.38, y: 0.76 }, { x: 0.84, y: 0.62 },
  { x: 0.52, y: 0.42 }, { x: 0.22, y: 0.60 },
  { x: 0.90, y: 0.38 }, { x: 0.60, y: 0.85 },
];

const N_AGENTS = 2800;
const ax = new Float32Array(N_AGENTS);
const ay = new Float32Array(N_AGENTS);
const aa = new Float32Array(N_AGENTS);

for (let i = 0; i < N_AGENTS; i++) {
  const f = foods[i % foods.length];
  ax[i] = (f.x + (Math.random() - 0.5) * 0.06) * W;
  ay[i] = (f.y + (Math.random() - 0.5) * 0.06) * H;
  aa[i] = Math.random() * Math.PI * 2;
}

const SA = 0.52, SD = 7.0, TS = 0.38, MS = 1.0;
const DEPOSIT = 0.7, DECAY = 0.965, DIFFUSE = 0.16;

function sense(px, py, angle) {
  const sx = Math.round(px + Math.cos(angle) * SD);
  const sy = Math.round(py + Math.sin(angle) * SD);
  if (sx < 0 || sx >= W || sy < 0 || sy >= H) return 0;
  return trail[sy * W + sx];
}

function simStep() {
  for (let i = 0; i < N_AGENTS; i++) {
    const sL = sense(ax[i], ay[i], aa[i] - SA);
    const sC = sense(ax[i], ay[i], aa[i]);
    const sR = sense(ax[i], ay[i], aa[i] + SA);
    if (sC >= sL && sC >= sR) { }
    else if (sL > sR) aa[i] -= TS * (0.5 + Math.random() * 0.5);
    else if (sR > sL) aa[i] += TS * (0.5 + Math.random() * 0.5);
    else aa[i] += (Math.random() - 0.5) * TS * 2;

    ax[i] += Math.cos(aa[i]) * MS;
    ay[i] += Math.sin(aa[i]) * MS;
    if (ax[i] < 0) ax[i] += W; if (ax[i] >= W) ax[i] -= W;
    if (ay[i] < 0) ay[i] += H; if (ay[i] >= H) ay[i] -= H;

    const ix = ~~ax[i], iy = ~~ay[i];
    trail[iy * W + ix] = Math.min(trail[iy * W + ix] + DEPOSIT, 8.0);
  }
  for (const f of foods) {
    const fx = ~~(f.x * W), fy = ~~(f.y * H);
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const px = fx + dx, py = fy + dy;
      if (px >= 0 && px < W && py >= 0 && py < H)
        trail[py * W + px] = Math.min(trail[py * W + px] + 1.8, 10.0);
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let sum = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      sum += trail[((y + dy + H) % H) * W + (x + dx + W) % W]; c++;
    }
    trailB[y * W + x] = (trail[y * W + x] * (1 - DIFFUSE) + (sum / c) * DIFFUSE) * DECAY;
  }
  for (let i = 0; i < W * H; i++) trail[i] = trailB[i];
}

for (let i = 0; i < 400; i++) simStep();

// ─── Three.js scene ───
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.012);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 4, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

// Kusama lighting — warm yellow key, black void
const key = new THREE.DirectionalLight(0xffeb3b, 2.2);
key.position.set(5, 10, 4);
scene.add(key);
scene.add(new THREE.AmbientLight(0x1a1a0a, 0.2));

const accent = new THREE.DirectionalLight(0xff3030, 0.6);
accent.position.set(-3, 3, -5);
scene.add(accent);

// ─── Extract dot positions from trail ───
// Every pixel above threshold becomes a dot; intensity scales size
const DOT_THRESHOLD = 1.2;
const dotData = [];

for (let y = 0; y < H; y++) {
  for (let x = 0; x < W; x++) {
    const v = trail[y * W + x];
    if (v > DOT_THRESHOLD) {
      const wx = (x / W - 0.5) * 7;
      const wy = (y / H - 0.5) * 7;
      const wz = (v / 8.0) * 1.2;
      const s = 0.04 + (v / 8.0) * 0.12;
      dotData.push({ x: wx, y: wy, z: wz, s, v });
    }
  }
}

// ─── Instanced dots (spheres) ───
const dotGeo = new THREE.SphereGeometry(1, 12, 12);
const dotMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vIntensity;
    attribute float intensity;
    
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPos = (modelMatrix * vec4(position, 1.0)).xyz;
      vIntensity = intensity;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    uniform float time;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vIntensity;
    
    void main() {
      // Kusama palette: yellow base, red accents
      vec3 yellow = vec3(1.0, 0.92, 0.23);
      vec3 red = vec3(0.95, 0.18, 0.18);
      vec3 black = vec3(0.05, 0.05, 0.05);
      
      // intensity → color choice
      float t = smoothstep(0.3, 0.7, vIntensity);
      vec3 col = mix(yellow, red, t * 0.4);
      
      // dots have black centers (obsessive perfection)
      float center = 1.0 - smoothstep(0.4, 0.9, length(vNormal.xy));
      col = mix(col, black, center * 0.6);
      
      // pulsing based on position (mirror recursion feel)
      float pulse = sin(time * 2.0 + vPos.x * 1.5 + vPos.y * 1.2) * 0.2 + 0.8;
      col *= pulse;
      
      // rim highlight
      float rim = pow(1.0 - abs(dot(vNormal, vec3(0, 0, 1))), 2.0);
      col += vec3(1.0, 1.0, 0.8) * rim * 0.3;
      
      // fog
      float depth = length(vPos - cameraPosition);
      float fogFactor = 1.0 - exp(-fogDensity * fogDensity * depth * depth);
      col = mix(col, fogColor, fogFactor);
      
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  uniforms: {
    fogColor: { value: scene.fog.color },
    fogDensity: { value: scene.fog.density },
    time: { value: 0 }
  }
});

const dots = new THREE.InstancedMesh(dotGeo, dotMat, dotData.length);
scene.add(dots);

// set per-instance intensity attribute
const intensities = new Float32Array(dotData.length);
dotData.forEach((d, i) => intensities[i] = d.v / 8.0);
dots.geometry.setAttribute('intensity', new THREE.InstancedBufferAttribute(intensities, 1));

const dummy = new THREE.Object3D();
dotData.forEach((d, i) => {
  dummy.position.set(d.x, d.y, d.z);
  dummy.scale.setScalar(d.s);
  dummy.updateMatrix();
  dots.setMatrixAt(i, dummy.matrix);
});
dots.instanceMatrix.needsUpdate = true;

// ─── Secondary dot layer: recursion on recursion ───
// Place smaller dots between existing dots (Kusama's infinite expansion)
const recursiveDots = [];
for (let i = 0; i < dotData.length; i += 3) {
  const d = dotData[i];
  const nx = d.x + (Math.random() - 0.5) * 0.3;
  const ny = d.y + (Math.random() - 0.5) * 0.3;
  const nz = d.z * 0.6;
  const ns = d.s * 0.4;
  recursiveDots.push({ x: nx, y: ny, z: nz, s: ns, v: d.v });
}

const dotGeo2 = new THREE.SphereGeometry(1, 8, 8);
const dotMat2 = dotMat.clone();
dotMat2.uniforms.fogColor = { value: scene.fog.color };
dotMat2.uniforms.fogDensity = { value: scene.fog.density };
dotMat2.uniforms.time = { value: 0 };

const dots2 = new THREE.InstancedMesh(dotGeo2, dotMat2, recursiveDots.length);
scene.add(dots2);

const intensities2 = new Float32Array(recursiveDots.length);
recursiveDots.forEach((d, i) => intensities2[i] = d.v / 8.0);
dots2.geometry.setAttribute('intensity', new THREE.InstancedBufferAttribute(intensities2, 1));

recursiveDots.forEach((d, i) => {
  dummy.position.set(d.x, d.y, d.z);
  dummy.scale.setScalar(d.s);
  dummy.updateMatrix();
  dots2.setMatrixAt(i, dummy.matrix);
});
dots2.instanceMatrix.needsUpdate = true;

// ─── Food source markers (red accent dots) ───
const foodGeo = new THREE.SphereGeometry(0.15, 16, 16);
const foodMat = new THREE.MeshStandardMaterial({
  color: 0xff3030,
  emissive: 0xff1010,
  emissiveIntensity: 1.2,
  roughness: 0.3,
  metalness: 0.1
});

const foodMarkers = [];
for (const f of foods) {
  const wx = (f.x - 0.5) * 7;
  const wy = (f.y - 0.5) * 7;
  const m = new THREE.Mesh(foodGeo, foodMat);
  m.position.set(wx, wy, 0.5);
  scene.add(m);
  foodMarkers.push(m);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── Centroid tracking ───
function computeCentroid() {
  let cx = 0, cy = 0, cz = 0, count = 0;
  dotData.forEach(d => {
    cx += d.x; cy += d.y; cz += d.z; count++;
  });
  return count > 0 ? { x: cx / count, y: cy / count, z: cz / count } : { x: 0, y: 0, z: 0 };
}

const centroid = computeCentroid();

const t0 = performance.now();
let fc = 0;

function loop() {
  const t = (performance.now() - t0) / 1000;

  simStep();

  // update shader time for pulsing
  dotMat.uniforms.time.value = t;
  dotMat2.uniforms.time.value = t;

  // obsessive rotation — continuous, never settling
  dots.rotation.z = t * 0.15;
  dots.rotation.x = Math.sin(t * 0.3) * 0.1;
  
  dots2.rotation.z = t * 0.12 + Math.PI / 3;
  dots2.rotation.y = Math.sin(t * 0.25) * 0.08;

  // food markers pulse
  foodMarkers.forEach((m, i) => {
    const phase = i * 0.5;
    m.scale.setScalar(1.0 + Math.sin(t * 3.0 + phase) * 0.2);
  });

  // camera: slow orbit around centroid
  const ca = t * 0.06;
  const cr = 12 + Math.sin(t * 0.08) * 1.5;
  const ch = 4 + Math.cos(t * 0.09) * 1.2;
  camera.position.set(
    centroid.x + Math.cos(ca) * cr,
    centroid.y + ch,
    centroid.z + Math.sin(ca) * cr
  );
  camera.lookAt(centroid.x, centroid.y, centroid.z);

  renderer.render(scene, camera);

  fc++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
