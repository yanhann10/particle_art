<title>48l · substrate maze · Jared Tarbell growth</title>
<style>

canvas { display:block; }

      color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>

<body>
<div class="id">48l</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ══════════════ SUBSTRATE ALGORITHM (Jared Tarbell) ══════════════
   Lines grow on a 2-D grid.  When a line crosses an occupied cell
   it stops and spawns perpendicular children.  The result is an
   architectural crystalline maze.                                 */

const GW = 640, GH = 640;
const grid = new Int16Array(GW * GH).fill(-1);
const segments = [];
const MAX_LINES = 900, MAX_ACTIVE = 140;
let lineCount = 0;
const cracks = [];

function spawnCrack(x, y, angle, gen) {
  if (cracks.length >= MAX_ACTIVE || lineCount >= MAX_LINES) return;
  const a = ((Math.round(angle / 90) * 90) % 360 + 360) % 360;
  const rad = a * Math.PI / 180;
  const dx = Math.round(Math.cos(rad));
  const dy = Math.round(Math.sin(rad));
  const ix = Math.round(x), iy = Math.round(y);
  if (ix < 1 || ix >= GW - 1 || iy < 1 || iy >= GH - 1) return;
  if (grid[iy * GW + ix] >= 0) return;
  cracks.push({ x: ix, y: iy, dx, dy, gen, sx: ix, sy: iy, id: lineCount++, steps: 0 });
  grid[iy * GW + ix] = lineCount - 1;
}

// Seed from edges
for (let i = 0; i < 16; i++) {
  const side = i % 4;
  let x, y, angle;
  if (side === 0)      { x = 1;      y = 40 + Math.floor(Math.random() * (GH - 80)); angle = 0; }
  else if (side === 1) { x = GW - 2; y = 40 + Math.floor(Math.random() * (GH - 80)); angle = 180; }
  else if (side === 2) { x = 40 + Math.floor(Math.random() * (GW - 80)); y = 1;      angle = 90; }
  else                 { x = 40 + Math.floor(Math.random() * (GW - 80)); y = GH - 2; angle = 270; }
  spawnCrack(x, y, angle, 0);
}
// Interior seeds
for (let i = 0; i < 8; i++) {
  spawnCrack(
    Math.floor(GW * 0.15 + Math.random() * GW * 0.7),
    Math.floor(GH * 0.15 + Math.random() * GH * 0.7),
    Math.floor(Math.random() * 4) * 90, 0
  );
}

function stepSubstrate() {
  for (let ci = cracks.length - 1; ci >= 0; ci--) {
    const c = cracks[ci];
    const nx = c.x + c.dx, ny = c.y + c.dy;
    if (nx < 1 || nx >= GW - 1 || ny < 1 || ny >= GH - 1) {
      if (c.steps > 3) segments.push({ x0: c.sx, y0: c.sy, x1: c.x, y1: c.y, gen: c.gen });
      cracks.splice(ci, 1); continue;
    }
    const gi = ny * GW + nx;
    if (grid[gi] >= 0 && grid[gi] !== c.id) {
      if (c.steps > 3) segments.push({ x0: c.sx, y0: c.sy, x1: c.x, y1: c.y, gen: c.gen });
      const pa = Math.atan2(c.dy, c.dx) * 180 / Math.PI;
      if (Math.random() < 0.88) spawnCrack(c.x, c.y, pa + 90, c.gen + 1);
      if (Math.random() < 0.88) spawnCrack(c.x, c.y, pa - 90, c.gen + 1);
      cracks.splice(ci, 1); continue;
    }
    grid[gi] = c.id;
    c.x = nx; c.y = ny; c.steps++;
  }
  // Spawn from existing segments when population drops
  if (cracks.length < 30 && segments.length > 0 && lineCount < MAX_LINES) {
    for (let k = 0; k < 3; k++) {
      const seg = segments[Math.floor(Math.random() * segments.length)];
      const t = 0.1 + Math.random() * 0.8;
      const px = seg.x0 + (seg.x1 - seg.x0) * t;
      const py = seg.y0 + (seg.y1 - seg.y0) * t;
      const sa = Math.atan2(seg.y1 - seg.y0, seg.x1 - seg.x0) * 180 / Math.PI;
      spawnCrack(Math.round(px), Math.round(py), sa + (Math.random() < 0.5 ? 90 : -90), seg.gen + 1);
    }
  }
}

// Reseed if all cracks die early
for (let i = 0; i < 120000; i++) {
  if (cracks.length === 0 && lineCount < MAX_LINES && segments.length > 0) {
    for (let k = 0; k < 6; k++) {
      const seg = segments[Math.floor(Math.random() * segments.length)];
      const t = 0.1 + Math.random() * 0.8;
      const sa = Math.atan2(seg.y1 - seg.y0, seg.x1 - seg.x0) * 180 / Math.PI;
      spawnCrack(
        Math.round(seg.x0 + (seg.x1 - seg.x0) * t),
        Math.round(seg.y0 + (seg.y1 - seg.y0) * t),
        sa + (Math.random() < 0.5 ? 90 : -90), seg.gen + 1
      );
    }
  }
  if (cracks.length === 0 && (lineCount >= MAX_LINES || segments.length === 0)) break;
  stepSubstrate();
}

/* ══════════════ THREE.js SCENE ══════════════ */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08070a, 0.014);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 30, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070a, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 12;
controls.maxDistance = 60;

// Lighting — warm key, cool fill
scene.add(new THREE.AmbientLight(0x181214, 0.5));
const keyLight = new THREE.DirectionalLight(0xffe0c4, 0.7);
keyLight.position.set(8, 18, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x7888a0, 0.3);
fillLight.position.set(-6, 10, -8);
scene.add(fillLight);
// Warm up-light from below
const upLight = new THREE.PointLight(0xc08040, 0.3, 40);
upLight.position.set(0, -2, 0);
scene.add(upLight);

/* ─── Palette: hand-picked warm architectural tones ─── */
const genColors = [
  new THREE.Color(0xc9986e), // sandstone amber
  new THREE.Color(0x8e6a48), // raw umber
  new THREE.Color(0x6e8878), // sage celadon
  new THREE.Color(0x7c6c8c), // muted lavender
  new THREE.Color(0x907868), // warm taupe
  new THREE.Color(0xa86858), // terra cotta
  new THREE.Color(0x6a7a88), // blue slate
];

/* ─── Convert substrate segments → particles ─── */
const SCALE = 32 / GW;
const positions = [], colors = [], genPhase = [];

for (const seg of segments) {
  const wx0 = (seg.x0 - GW / 2) * SCALE;
  const wz0 = (seg.y0 - GH / 2) * SCALE;
  const wx1 = (seg.x1 - GW / 2) * SCALE;
  const wz1 = (seg.y1 - GH / 2) * SCALE;
  const len = Math.hypot(wx1 - wx0, wz1 - wz0);
  const count = Math.max(3, Math.floor(len * (5 + Math.random() * 4)));
  const col = genColors[Math.min(seg.gen, genColors.length - 1)];
  const yBase = seg.gen * 0.18;

  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    // Cluster particles near segment center for density variation
    const spread = 0.045 + seg.gen * 0.008;
    positions.push(
      wx0 + (wx1 - wx0) * t + (Math.random() - 0.5) * spread,
      yBase + Math.random() * 0.035,
      wz0 + (wz1 - wz0) * t + (Math.random() - 0.5) * spread
    );
    const v = 0.88 + Math.random() * 0.24;
    colors.push(col.r * v, col.g * v, col.b * v);
    genPhase.push(seg.gen, Math.random() * 6.283);
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.setAttribute('aGenPhase', new THREE.Float32BufferAttribute(genPhase, 2));

const pointsMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute vec3 color;
    attribute vec2 aGenPhase;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uTime;
    void main() {
      vColor = color;
      vec3 pos = position;
      float phase = aGenPhase.y;
      float gen = aGenPhase.x;
      // gentle breathing — particles rise and settle like warm air
      pos.y += sin(uTime * 0.35 + phase + pos.x * 1.8) * 0.02 * (1.0 + gen * 0.15);
      pos.x += sin(uTime * 0.2 + phase * 1.3) * 0.006;
      pos.z += cos(uTime * 0.18 + phase * 0.9) * 0.006;
      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      float size = max(1.8, (3.2 - gen * 0.2) * (280.0 / -mv.z));
      gl_PointSize = size;
      gl_Position = projectionMatrix * mv;
      // fade with distance
      vAlpha = smoothstep(80.0, 10.0, -mv.z) * (0.75 + 0.25 * (1.0 - gen * 0.1));
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      // leaf-shaped: pointed ellipse rotated slightly
      float angle = 0.35;
      float ca = cos(angle), sa = sin(angle);
      vec2 r = vec2(uv.x * ca - uv.y * sa, uv.x * sa + uv.y * ca);
      float d = length(r * vec2(1.6, 2.8));
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.15, d) * vAlpha;
      // slight vein line down center
      float vein = 1.0 - smoothstep(0.0, 0.04, abs(r.x)) * 0.15;
      gl_FragColor = vec4(vColor * vein, a);
    }
  `,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
scene.add(new THREE.Points(geo, pointsMat));

/* ─── Thin line skeleton — subtle wireframe under particles ─── */
for (let g = 0; g < genColors.length; g++) {
  const lp = [];
  for (const seg of segments) {
    if (Math.min(seg.gen, genColors.length - 1) !== g) continue;
    const yB = seg.gen * 0.18;
    lp.push(
      (seg.x0 - GW / 2) * SCALE, yB, (seg.y0 - GH / 2) * SCALE,
      (seg.x1 - GW / 2) * SCALE, yB, (seg.y1 - GH / 2) * SCALE
    );
  }
  if (!lp.length) continue;
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  const lc = genColors[g].clone().multiplyScalar(0.28);
  scene.add(new THREE.LineSegments(lg,
    new THREE.LineBasicMaterial({ color: lc, transparent: true, opacity: 0.12 })
  ));
}

/* ─── Ground plane — architectural datum ─── */
const gndGeo = new THREE.PlaneGeometry(48, 48);
const gndMat = new THREE.MeshBasicMaterial({ color: 0x0c0a08, transparent: true, opacity: 0.6 });
const gnd = new THREE.Mesh(gndGeo, gndMat);
gnd.rotation.x = -Math.PI / 2;
gnd.position.y = -0.15;
scene.add(gnd);

/* ─── Film-grain overlay (photochemical warmth) ─── */
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const grainMat = new THREE.ShaderMaterial({
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uRes;
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    void main() {
      vec2 uv = gl_FragCoord.xy / uRes;
      float g = hash(uv * 800.0 + uTime * 13.7) * 0.06 - 0.03;
      // warm vignette
      float vig = 1.0 - smoothstep(0.3, 0.85, length(uv - 0.5));
      float darken = (1.0 - vig) * 0.25;
      gl_FragColor = vec4(vec3(g - darken), 0.35);
    }
  `,
  uniforms: {
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  transparent: true, depthTest: false, depthWrite: false,
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
grainScene.add(grainQuad);

/* ─── Resize ─── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  grainMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

/* ─── Animate ─── */
const t0 = performance.now();
(function loop() {
  const t = (performance.now() - t0) / 1000;
  pointsMat.uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;
  controls.update();
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;
  requestAnimationFrame(loop);
})();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
