<script type="module">
import * as THREE from 'three';
import { createRenderer, mountControlPanel } from '../lib/scaffold.js';

// ── SCAFFOLD ─────────────────────────────────────────────────────────────────
const { renderer, scene, camera } = createRenderer({
  clearColor: {{CLEAR_COLOR_HEX}},   // e.g. 0x000000
  fov: {{FOV}},                      // e.g. 62
  fog: null,                         // or { color: 0x020101, density: 0.0025 }
});
camera.position.set(0, 0, 5);       // initial camera position
mountControlPanel();

// ── SEEDED RNG (deterministic across runs) ────────────────────────────────────
let seed = {{SEED}};                 // e.g. 73291485 — any 32-bit integer
function rng() { seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── YOUR GENERATIVE KERNEL ────────────────────────────────────────────────────
// Build your scene here. Use rng() instead of Math.random() for reproducibility.



// ── ANIMATION LOOP ────────────────────────────────────────────────────────────
const t0 = performance.now();
function loop() {
  const elapsed = (performance.now() - t0) / 1000;
  // update scene here
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
