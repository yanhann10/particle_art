<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fs7 · HYPERSTITION ENGINE (Land/Plant/Fisher calyx as time-weapon)</title>
<!-- MOTION: pulse, intensity: explosive -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#0f0; font-family: ui-monospace, "Courier New", monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .caption { position:fixed; left:14px; top:14px; opacity:0.9; font-size: 13px; letter-spacing: 0.08em; 
             color:#00ff00; text-transform:uppercase; font-weight:700; animation: glitch 0.15s infinite; }
  @keyframes glitch {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-1px, 1px); color:#ff00ff; }
    50% { transform: translate(1px, -1px); color:#00ffff; }
    75% { transform: translate(-1px, -1px); color:#00ff00; }
  }
</style>
</head>
<body>
<div class="id">fs7</div>
<div class="caption">THE OUTSIDE WILL HAVE BEEN</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:    { value: 0 },
  uBeat:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPulse:   { value: 0 },
  uSnap:    { value: 0 },
  uAudioBass: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBeat;
    uniform float uPulse;
    uniform float uSnap;
    uniform float uAudioBass;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vIntensity;
    varying float vColorPhase;

    void main(){
      vec2 gp = gridPos;
      float r = length(gp);
      float theta = atan(gp.y, gp.x);
      
      // 160 BPM = 2.666... Hz = 0.375s period
      float beatPhase = fract(uTime * 2.666);
      float hardPulse = step(0.5, fract(uBeat * 0.25)); // square wave
      
      // Machine calyx: angular quantization (8 segments, non-organic)
      float quantTheta = floor(theta / 0.785398) * 0.785398;
      float angleDrift = sin(quantTheta * 4.0 + uTime * 8.0) * 0.3;
      
      // Hyperbolic cup profile (opens faster than parabola)
      float nr = r / 12.0;
      float cupZ = 6.0 * nr * nr * (1.0 + nr * 0.5);
      
      // Bass-driven expansion pulse (mic fallback: just time-driven)
      float expansion = 1.0 + uAudioBass * 0.4 + hardPulse * 0.15;
      
      // Snap events: collapse to center on beat
      float snapCollapse = uSnap * (1.0 - nr);
      
      vec3 p;
      p.x = gp.x * expansion + angleDrift - snapCollapse * gp.x * 0.6;
      p.y = gp.y * expansion + sin(uTime * 12.0 + r * 2.0) * 0.2 - snapCollapse * gp.y * 0.6;
      p.z = cupZ * (1.0 - snapCollapse * 0.7) + sin(theta * 5.0 + uTime * 16.0) * 0.3;
      
      // Interference patterns at machine speed
      float wave1 = sin(gp.x * 3.0 + uTime * 20.0);
      float wave2 = sin(gp.y * 2.5 - uTime * 18.0);
      float interference = wave1 * wave2;
      
      // Hard threshold: no soft gradients
      vIntensity = step(0.0, interference) * (0.6 + hardPulse * 0.4);
      
      // Color phase: cycles acid green → cyan → magenta at breakcore tempo
      vColorPhase = fract(seed + uTime * 4.0 + r * 0.1);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeBoost = 1.0 + uSnap * 2.0;
      gl_PointSize = uPixel * max(2.0, (4.0 - dist * 0.08) * sizeBoost);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vIntensity;
    varying float vColorPhase;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Hard-edge brightness: square law
      float bright = step(0.18, 0.25 - r);
      
      // Color cycling: acid palette, no smoothstep
      vec3 col;
      float phase = vColorPhase;
      if (phase < 0.33) {
        col = vec3(0.0, 1.0, 0.0); // acid green
      } else if (phase < 0.66) {
        col = vec3(0.0, 1.0, 1.0); // cyan
      } else {
        col = vec3(1.0, 0.0, 1.0); // magenta
      }
      
      col *= vIntensity * (0.8 + bright * 0.2);
      
      float alpha = 1.0;
      gl_FragColor = vec4(col, alpha);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24, height = 24;
  const cellW = width / cols, cellH = height / rows;

  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  return { positions, gridPositions, seeds };
}

const seed = Date.now();
const rows = 120, cols = 120;
const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
points = new THREE.Points(geom, mat);
scene.add(points);

// Attempt mic access for bass-reactive, silent fallback
let audioCtx, analyser, dataArray;
navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
  audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);
  dataArray = new Uint8Array(analyser.frequencyBinCount);
}).catch(() => {
  // Silent fail: piece still renders with time-driven pulse
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
let beatCounter = 0;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  
  // 160 BPM = 2.666 Hz beat
  const beatPhase = (t * 2.666) % 1.0;
  beatCounter = Math.floor(t * 2.666);
  uniforms.uBeat.value = beatCounter;
  
  // Pulse: square wave at beat
  uniforms.uPulse.value = beatPhase < 0.1 ? 1.0 : 0.0;
  
  // Snap: sharp collapse every 4 beats
  const snapTrigger = (beatCounter % 4 === 0) && beatPhase < 0.15;
  uniforms.uSnap.value = snapTrigger ? 1.0 : uniforms.uSnap.value * 0.85;
  
  // Audio bass (if available)
  if (analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    const bass = (dataArray[0] + dataArray[1] + dataArray[2]) / (3 * 255);
    uniforms.uAudioBass.value = bass;
  } else {
    // Fallback: sine at beat freq
    uniforms.uAudioBass.value = 0.3 + 0.3 * Math.sin(t * 2.666 * Math.PI * 2);
  }
  
  // Camera orbit: machine-locked circle, no smoothing
  const orbitSpeed = 0.4; // fast
  const theta = t * orbitSpeed;
  const radius = 18;
  camera.position.set(
    radius * Math.sin(theta),
    6 + Math.sin(t * 4.0) * 2.0, // rapid vertical oscillation
    radius * Math.cos(theta)
  );
  camera.lookAt(0, 2, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
