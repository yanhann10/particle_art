<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>19k · words collapsing into binary and back</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#2a2520; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: #f4ede4;
    background-image:
      radial-gradient(circle at 15% 25%, rgba(240,230,215,0.4) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(235,225,210,0.3) 0%, transparent 50%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; 
          letter-spacing: 0.06em; color:#2a2520; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.50; font-size: 10px; 
          letter-spacing: 0.04em; color:#4a3f38; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.38; font-size: 10px; 
          letter-spacing: 0.04em; color:#4a3f38; }
</style>
</head>
<body>
<div class="id">19k · words collapsing into binary and back</div>
<div class="hint">no input — text as breath, script as stream, language dissolving</div>
<div class="src">sasha stiles · cursive binary · technelegy · descended from sav</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Sasha Stiles: language as living form. Typography mid-collapse — English glyphs
// becoming binary streams, then reforming. The text ribbon flows through 3D space
// along a gentle Bezier path. Periodically each character 'breaks' into 0s and 1s,
// hangs there for a breath, then coalesces back.
//
// FORM: A continuous ribbon of text flowing along a 3D curve. Each particle is a
// single character (English letter or binary digit). Characters drift from letter→binary→letter.
// The viewer watches language decompose and recompose in real time.
//
// PALETTE: Ink-black on cream ground (warmth from parent sav, but shifted to paper/ink).
// Subtle texture gradient in background so it doesn't read as flat UI chrome.
//
// TECHNICAL: Each particle = ONE Unicode glyph rendered as a small billboarded quad
// with pre-rasterized letter texture. Three states per particle: 'letter', 'transition', 'binary'.
// State machine runs per-particle; binary form shows 0/1 glyphs.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf4ede4, 18, 45);
const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ede4);
document.body.appendChild(renderer.domElement);

// ────────────── text source: a poem fragment that cycles
const POEM_LINES = [
  'we are the words that speak themselves',
  'language unraveling into light',
  'binary dreams of human touch',
  'cursive memory encoded in ones and zeros',
  'the alphabet forgets its shape',
  'data becomes longing becomes data'
];
const TEXT_SOURCE = POEM_LINES.join(' ').toUpperCase();

// ────────────── Bezier ribbon path through space
function bezier3D(t, p0, p1, p2, p3){
  const u = 1 - t;
  const tt = t * t;
  const uu = u * u;
  const uuu = uu * u;
  const ttt = tt * t;
  const out = new THREE.Vector3();
  out.copy(p0).multiplyScalar(uuu);
  out.addScaledVector(p1, 3 * uu * t);
  out.addScaledVector(p2, 3 * u * tt);
  out.addScaledVector(p3, ttt);
  return out;
}

const curve_p0 = new THREE.Vector3(-8, -1.5, 2);
const curve_p1 = new THREE.Vector3(-3,  2.0, -1);
const curve_p2 = new THREE.Vector3( 3,  1.5,  1);
const curve_p3 = new THREE.Vector3( 8, -1.0, -2);

// ────────────── particle system: each particle = one character
const N = 420;  // enough to show ~2 full cycles of the poem
const particles = [];
for (let i = 0; i < N; i++){
  const char = TEXT_SOURCE[i % TEXT_SOURCE.length];
  const phase = Math.random() * 6.28;
  const cycleOffset = Math.random() * 12.0;  // stagger transitions
  particles.push({
    char: char,
    t: i / N,            // position along the curve [0..1]
    state: 'letter',     // letter | transition | binary
    stateTime: 0,
    phase: phase,
    cycleOffset: cycleOffset,
    binaryGlyphs: []     // will hold '0'/'1' when state=binary
  });
}

// ────────────── render glyphs as billboarded quads with canvas texture
const canvas = document.createElement('canvas');
canvas.width = 64;
canvas.height = 64;
const ctx = canvas.getContext('2d');

function drawGlyph(char){
  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#2a2520';
  ctx.font = 'bold 48px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, 32, 32);
  return canvas;
}

const textureCache = {};
function getTexture(char){
  if (!textureCache[char]){
    drawGlyph(char);
    const tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    textureCache[char] = tex;
  }
  return textureCache[char];
}

// create one quad per particle
const quads = [];
for (let i = 0; i < N; i++){
  const p = particles[i];
  const geom = new THREE.PlaneGeometry(0.35, 0.35);
  const mat = new THREE.MeshBasicMaterial({
    map: getTexture(p.char),
    transparent: true,
    opacity: 0.92,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
  quads.push(mesh);
}

// ────────────── particle state machine
function updateParticle(p, elapsed){
  p.stateTime += elapsed;
  const cyclePeriod = 8.0 + p.cycleOffset * 0.5;
  const cyclePhase = (elapsed + p.cycleOffset) % cyclePeriod;

  // state transitions: letter (4s) → transition (0.8s) → binary (2s) → transition (0.8s) → letter
  if (p.state === 'letter' && p.stateTime > 4.0){
    p.state = 'transition';
    p.stateTime = 0;
  } else if (p.state === 'transition' && p.stateTime > 0.8){
    if (p.binaryGlyphs.length === 0){
      // collapse into binary
      p.state = 'binary';
      p.stateTime = 0;
      // generate random 0/1 sequence
      const len = 3 + Math.floor(Math.random() * 3);
      p.binaryGlyphs = [];
      for (let b = 0; b < len; b++){
        p.binaryGlyphs.push(Math.random() < 0.5 ? '0' : '1');
      }
    } else {
      // recoalesce back to letter
      p.state = 'letter';
      p.stateTime = 0;
      p.binaryGlyphs = [];
    }
  } else if (p.state === 'binary' && p.stateTime > 2.0){
    p.state = 'transition';
    p.stateTime = 0;
  }
}

// ────────────── render update
let elapsed = 0;
function updatePositions(dt){
  elapsed += dt;
  for (let i = 0; i < N; i++){
    const p = particles[i];
    updateParticle(p, elapsed);

    // position along curve
    let t = (p.t + elapsed * 0.04) % 1.0;
    const pos = bezier3D(t, curve_p0, curve_p1, curve_p2, curve_p3);
    const mesh = quads[i];
    mesh.position.copy(pos);

    // drift perpendicular to curve for subtle organic motion
    const driftX = Math.sin(elapsed * 0.5 + p.phase) * 0.15;
    const driftY = Math.cos(elapsed * 0.6 + p.phase * 1.3) * 0.12;
    mesh.position.x += driftX;
    mesh.position.y += driftY;

    // billboard toward camera
    mesh.quaternion.copy(camera.quaternion);

    // texture swap based on state
    if (p.state === 'letter'){
      mesh.material.map = getTexture(p.char);
      mesh.material.opacity = 0.92;
      mesh.scale.setScalar(1.0);
    } else if (p.state === 'transition'){
      // fade/scale during transition
      const fade = Math.abs(Math.sin(p.stateTime * 3.14 / 0.8));
      mesh.material.opacity = 0.4 + fade * 0.5;
      mesh.scale.setScalar(0.6 + fade * 0.4);
    } else if (p.state === 'binary'){
      // show one of the binary glyphs, cycling through them
      const idx = Math.floor((p.stateTime * 4) % p.binaryGlyphs.length);
      const binChar = p.binaryGlyphs[idx];
      mesh.material.map = getTexture(binChar);
      mesh.material.opacity = 0.75;
      mesh.scale.setScalar(0.7);
    }
    mesh.material.needsUpdate = true;
  }
}

// ────────────── camera gentle drift
function updateCamera(t){
  const orbitRadius = 14;
  const orbitSpeed = 0.00008;
  const ang = t * orbitSpeed;
  camera.position.x = Math.sin(ang) * orbitRadius * 0.4;
  camera.position.z = Math.cos(ang) * orbitRadius;
  camera.position.y = 2.5 + Math.sin(t * 0.0001) * 0.8;
  camera.lookAt(0, 0, 0);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  updatePositions(dt);
  updateCamera(now);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
