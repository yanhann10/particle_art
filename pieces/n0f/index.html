<title>6v2 · skitter colony</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);

<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">n0f</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

/* ── build branching coral armature ── */
const branches = [];
function growBranch(origin, dir, len, radius, depth, maxDepth) {
  if (depth > maxDepth || len < 0.3) return;
  const end = [
    origin[0] + dir[0] * len,
    origin[1] + dir[1] * len,
    origin[2] + dir[2] * len
  ];
  branches.push({ origin, end, radius, depth });
  const nChildren = depth === 0 ? 5 : (Math.random() < 0.5 ? 3 : 2);
  for (let c = 0; c < nChildren; c++) {
    const splay = 0.4 + Math.random() * 0.5;
    const spin = (c / nChildren) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
    const up = [dir[0], dir[1], dir[2]];
    const perp1 = Math.abs(up[1]) < 0.9
      ? [up[2], 0, -up[0]] : [0, up[2], -up[1]];
    const pLen = Math.sqrt(perp1[0]**2 + perp1[1]**2 + perp1[2]**2) || 1;
    perp1[0] /= pLen; perp1[1] /= pLen; perp1[2] /= pLen;
    const perp2 = [
      up[1]*perp1[2] - up[2]*perp1[1],
      up[2]*perp1[0] - up[0]*perp1[2],
      up[0]*perp1[1] - up[1]*perp1[0]
    ];
    const nd = [
      up[0] * (1 - splay) + (perp1[0]*Math.cos(spin) + perp2[0]*Math.sin(spin)) * splay,
      up[1] * (1 - splay) + (perp1[1]*Math.cos(spin) + perp2[1]*Math.sin(spin)) * splay,
      up[2] * (1 - splay) + (perp1[2]*Math.cos(spin) + perp2[2]*Math.sin(spin)) * splay
    ];
    const nLen = Math.sqrt(nd[0]**2 + nd[1]**2 + nd[2]**2) || 1;
    nd[0] /= nLen; nd[1] /= nLen; nd[2] /= nLen;
    growBranch(end, nd, len * (0.55 + Math.random() * 0.2), radius * 0.65, depth + 1, maxDepth);
  }
}
growBranch([0, -6, 0], [0, 1, 0], 4.0, 1.2, 0, 4);
growBranch([-1.5, -6.5, 0.5], [-0.15, 1, 0.08], 3.2, 0.9, 0, 3);
growBranch([1.2, -6.2, -0.7], [0.12, 1, -0.06], 3.5, 1.0, 0, 3);

/* ── distribute particles along branches ── */
const SHELLS = 5;
const N = 20000;
const perShell = Math.floor(N / SHELLS);
const positions = new Float32Array(N * 3);
const homePos   = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
const skitterDir = new Float32Array(N * 3);

// assign branches to shells by depth
const branchByShell = [[], [], [], [], []];
for (const b of branches) {
  const s = Math.min(b.depth, SHELLS - 1);
  branchByShell[s].push(b);
}
// ensure each shell has at least one branch
for (let s = 0; s < SHELLS; s++) {
  if (branchByShell[s].length === 0) branchByShell[s] = branchByShell[Math.max(0, s-1)];
}

let idx = 0;
for (let s = 0; s < SHELLS; s++) {
  const brs = branchByShell[s];
  const count = s < SHELLS - 1 ? perShell : N - idx;
  for (let i = 0; i < count; i++) {
    const b = brs[i % brs.length];
    const t = Math.random();
    const px = b.origin[0] + (b.end[0] - b.origin[0]) * t;
    const py = b.origin[1] + (b.end[1] - b.origin[1]) * t;
    const pz = b.origin[2] + (b.end[2] - b.origin[2]) * t;
    // scatter around branch axis
    const scatter = b.radius * (0.3 + Math.random() * 0.7);
    const angle = Math.random() * Math.PI * 2;
    const offX = Math.cos(angle) * scatter;
    const offZ = Math.sin(angle) * scatter;
    const offY = (Math.random() - 0.5) * scatter * 0.5;
    homePos[idx*3]   = positions[idx*3]   = px + offX;
    homePos[idx*3+1] = positions[idx*3+1] = py + offY;
    homePos[idx*3+2] = positions[idx*3+2] = pz + offZ;
    shellIdx[idx] = s;
    seeds[idx] = Math.random();
    // pre-compute a random skitter direction per particle
    const sx = (Math.random()-0.5), sy = (Math.random()-0.5)*0.3 + 0.3, sz = (Math.random()-0.5);
    const sl = Math.sqrt(sx*sx+sy*sy+sz*sz) || 1;
    skitterDir[idx*3] = sx/sl; skitterDir[idx*3+1] = sy/sl; skitterDir[idx*3+2] = sz/sl;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',   new THREE.BufferAttribute(positions, 3));
geom.setAttribute('home',       new THREE.BufferAttribute(homePos, 3));
geom.setAttribute('shellIdx',   new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',       new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('skitDir',    new THREE.BufferAttribute(skitterDir, 3));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uBands:   { value: uBands },
  uTreble:  { value: 0 },
  uSkitter: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform float uSkitter;
    attribute float shellIdx;
    attribute float seed;
    attribute vec3 home;
    attribute vec3 skitDir;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;

      vec3 p = home;

      // gentle breathing on the coral — radial pulse from centroid
      vec3 centroid = vec3(0.0, -1.0, 0.0);
      vec3 fromCenter = p - centroid;
      float pulse = 1.0 + e * 0.15;
      p = centroid + fromCenter * pulse;

      // subtle tangential drift along branch
      float t = uTime * 0.3 + seed * 6.28 + shellIdx * 0.5;
      p.x += sin(t) * 0.15 * (0.5 + e);
      p.z += cos(t * 0.7 + seed * 3.0) * 0.12 * (0.5 + e);

      // ── SKITTER: particles scatter outward along their random directions ──
      // staccato: each particle has its own phase offset so they fire in waves
      float skitPhase = uSkitter * (0.6 + seed * 0.4);
      // sharp attack, slower settle — use smoothstep for snappy motion
      float skitAmount = smoothstep(0.0, 0.15, skitPhase) * (1.0 - smoothstep(0.5, 1.0, skitPhase));
      // high-frequency jitter during skitter for insect-leg vibration
      float jitter = sin(uTime * 40.0 + seed * 200.0) * 0.3 * skitAmount;
      float skitDist = (1.5 + seed * 2.5 + shellIdx * 0.4) * skitAmount;
      p += skitDir * (skitDist + jitter);

      // palette: amber base → chartreuse accent (persistent on outer shells)
      vec3 amber      = vec3(0.95, 0.65, 0.18);
      vec3 chartreuse = vec3(0.65, 0.92, 0.12);
      vec3 cyan       = vec3(0.22, 0.78, 0.88);
      // outer shells get permanent chartreuse tint; inner stay amber
      float shellNorm = shellIdx / 4.0;
      vec3 baseCol = mix(amber, chartreuse, shellNorm * 0.7);
      // during skitter, flash toward bright chartreuse
      baseCol = mix(baseCol, chartreuse * 1.4, skitAmount * 0.7);
      // treble shells get cyan edge
      baseCol = mix(baseCol, cyan, step(3.5, shellIdx) * 0.35);
      baseCol *= (0.55 + e * 0.9);
      vCol = baseCol;

      vAlpha = 0.5 + 0.5 * e + skitAmount * 0.3;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 2.0 * e + skitAmount * 1.0) * uPixel * (48.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── audio ── */
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · coral colony · skitter';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0; for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

/* ── skitter scheduling ── */
// Skitter events: 8–14 sec apart, last ~1.5 sec
let skitterClock = 0;
let skitterActive = false;
let nextSkitter = 6 + Math.random() * 4;
const SKITTER_DUR = 1.8;

/* ── centroid tracking camera ── */
const camTarget = new THREE.Vector3(0, 0, 0);

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = 1/60;
  uniforms.uTime.value = t;

  // gentle rotation
  points.rotation.y = t * 0.035;
  points.rotation.x = Math.sin(t * 0.05) * 0.08;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
    // loud transient can trigger extra skitter
    if (uBands.x > 0.7 && !skitterActive && (t - skitterClock) > 3) {
      skitterActive = true; skitterClock = t;
    }
  } else {
    uBands.x = 0.32 + 0.28 * Math.sin(t*1.3);
    uBands.y = 0.28 + 0.25 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.22 + 0.22 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.18 + 0.18 * Math.sin(t*4.7 + 0.4);
    uniforms.uTreble.value = 0.15 + 0.15 * Math.sin(t*7.0);
  }

  // skitter timing
  if (!skitterActive && t > nextSkitter) {
    skitterActive = true;
    skitterClock = t;
  }
  if (skitterActive) {
    const elapsed = t - skitterClock;
    uniforms.uSkitter.value = Math.min(elapsed / SKITTER_DUR, 1.0);
    if (elapsed > SKITTER_DUR) {
      skitterActive = false;
      uniforms.uSkitter.value = 0;
      nextSkitter = t + 8 + Math.random() * 6;
    }
  } else {
    uniforms.uSkitter.value = 0;
  }

  // camera gently tracks centroid (coral grows upward)
  const goalY = 0.5 + Math.sin(t * 0.04) * 0.5;
  camTarget.y += (goalY - camTarget.y) * 0.02;
  camera.lookAt(camTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
