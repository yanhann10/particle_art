<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>w4q · tender light sheets</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">w4q</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · light sheet drape · differential growth</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender light sheets — differential growth reimagined as
   Felix Gonzalez-Torres draped incandescent plane overlays.
   Each particle is now a small semi-transparent plane
   billboarded to camera. Dense overlap = saturated pools of light. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

// --- curve parameters, tuned for draping ---
const MAX_VERTS = 3200;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 6;

// initialize: horizontal line with gentle wave
const verts = [];
const NV0 = 40;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 6;
  const y = -Math.abs(t) * 1.2 + Math.sin(t * Math.PI * 2) * 0.3;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

// spatial hash
const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  // repulsion
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  // attraction
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  // pressure
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  // apply + gravity + noise
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
  }

  // subdivide
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- rendering: 40k planes as billboarded light sheets ---
const N_RENDER = 40000;

// base plane geometry: small quad
const planeGeom = new THREE.PlaneGeometry(0.12, 0.12);
const mat = new THREE.MeshBasicMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide
});

const mesh = new THREE.InstancedMesh(planeGeom, mat, N_RENDER);
scene.add(mesh);

// per-instance data
const instanceColors = [];
const instanceOpacities = [];
const instanceSeeds = [];
for (let i = 0; i < N_RENDER; i++) {
  instanceColors.push(new THREE.Color(1, 1, 1));
  instanceOpacities.push(0.08);
  instanceSeeds.push(Math.random());
}

// wire
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x2a2420,
  transparent: true,
  opacity: 0.3
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 500; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

const dummy = new THREE.Object3D();

function loop() {
  const t = (performance.now() - start) / 1000;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;

  // update wire
  for (let i = 0; i < n; i++) {
    wirePositions[i * 3]     = verts[i].x;
    wirePositions[i * 3 + 1] = verts[i].y;
    wirePositions[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // distribute planes along curve
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt(
      (b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2
    );
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n - 1; i++) {
      const share = (i === n - 2)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[i + 1];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
        const spread = 0.015;
        const px = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * spread;
        const py = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
        const pz = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * spread;

        // position
        dummy.position.set(px, py, pz);

        // billboard to camera
        dummy.quaternion.copy(camera.quaternion);

        // gentle sway
        const seed = instanceSeeds[written];
        const swayT = t * 0.3 + seed * 6.28;
        dummy.position.x += Math.sin(swayT) * 0.008 * (1.0 + seed);
        dummy.position.z += Math.cos(swayT * 0.7) * 0.005;

        // scale variation
        const scaleVar = 0.8 + Math.random() * 0.4;
        dummy.scale.set(scaleVar, scaleVar, 1);

        dummy.updateMatrix();
        mesh.setMatrixAt(written, dummy.matrix);

        // color: warm filament amber → soft white
        const age = Math.max(a.age, b.age);
        const pulse = 0.85 + 0.15 * Math.sin(t * 1.2 + seed * 40.0);
        const amber  = new THREE.Color(1.0, 0.72, 0.32);
        const warm   = new THREE.Color(1.0, 0.88, 0.72);
        const white  = new THREE.Color(1.0, 0.96, 0.92);
        const k = Math.min(age * 1.2, 1.0);
        const col = amber.clone().lerp(warm, k);
        col.lerp(white, Math.max(0, (k - 0.7) / 0.3) * 0.3);
        col.multiplyScalar(pulse);
        instanceColors[written].copy(col);

        // opacity: low per-sheet, overlap creates saturation
        const baseOpacity = 0.04 + Math.random() * 0.08;
        instanceOpacities[written] = baseOpacity * (0.55 + 0.2 * pulse);

        written++;
      }
    }
  }

  mesh.instanceMatrix.needsUpdate = true;

  // apply colors and opacities via manual color attribute
  mesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(
    new Float32Array(instanceColors.flatMap(c => [c.r, c.g, c.b])), 3
  ));
  mesh.material.vertexColors = true;
  mesh.material.opacity = instanceOpacities.reduce((a, b) => a + b, 0) / N_RENDER;

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
