<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MOTION: sway, intensity: gentle -->
<!-- INTENT: A scorched wheat field under leaden sky — stalks of leaf-particles rising from ashen earth, some smoldering at tips. Mythic weight: aftermath and stubborn renewal. Anselm Kiefer's Margarethe in particle form. -->
<!-- ALGO: flow-field wind + rejection-sampled stalk density. Evokes Kiefer's Margarethe (1981) — impasto straw palette, scorched-earth horizon, narrative of burning and persistence. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z6f · kiefer wheat field — mythic</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; }
body {
  background: linear-gradient(180deg,
    #111010 0%, #1a1610 20%, #241e14 45%,
    #2e2418 65%, #3a2c1a 82%, #2a1f15 100%);
  color: #8b7340;
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.07 0 0 0 0 0.05 0 0 0 0 0.03 0 0 0 0.42 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.58'/></svg>");
  mix-blend-mode: multiply; opacity: 0.55;
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(ellipse 130% 35% at 50% 88%, rgba(100,50,15,0.13), transparent 65%);
  mix-blend-mode: screen;
}
canvas { display:block; position:relative; z-index:0; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
  letter-spacing:0.06em; z-index:5; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">z6f</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Anselm Kiefer × ere: the Riley wave-interference field becomes a scorched
// wheat field under leaden sky. Each stalk is a column of particles; heads
// spread and droop. ~22% of stalks smolder at their tips. Wind sways them
// in coordinated phase groups. Ground is charred ash particles. Ash flakes
// drift upward from the smolder. Camera drifts laterally — contemplative.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 2.6, 9.5);
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const pos = new Float32Array(N*3);
const aSeed = new Float32Array(N);
const aPhase = new Float32Array(N);
const aH = new Float32Array(N);
const aBurn = new Float32Array(N);

let regrowSeed = Math.random()*1e9;

function buildField(s0){
  let s = s0>>>0;
  const rng = ()=>{ s|=0; s = s+0x6d2b79f5|0;
    let t = Math.imul(s^s>>>15, 1|s);
    t = t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };

  const STALKS = 420;
  const perStalk = Math.floor(N*0.86/STALKS);
  let w = 0;

  for(let si=0; si<STALKS && w<N-2400; si++){
    const bx = (rng()-0.5)*13;
    const bz = (rng()-0.5)*7 - 0.8;
    const h = 1.6 + rng()*3.2;
    const leanX = (rng()-0.5)*0.38;
    const leanZ = (rng()-0.5)*0.14;
    const ph = rng()*Math.PI*2;
    const isBurnt = rng()<0.22;
    const burnStr = isBurnt ? 0.35+rng()*0.65 : 0;
    const droopAmt = 0.08+rng()*0.22;

    for(let pi=0; pi<perStalk && w<N-2400; pi++){
      const t = pi/perStalk;
      const isHead = t>0.62;
      const headT = isHead ? (t-0.62)/0.38 : 0;
      const spread = isHead ? 0.05+0.16*headT : 0.013;

      const x = bx + leanX*t*t + (rng()-0.5)*spread;
      const y = -1.3 + t*h - (isHead ? droopAmt*headT*headT : 0);
      const z = bz + leanZ*t*t + (rng()-0.5)*spread;

      pos[w*3]=x; pos[w*3+1]=y; pos[w*3+2]=z;
      aSeed[w]=rng(); aPhase[w]=ph; aH[w]=t;
      aBurn[w]= isHead ? burnStr*headT : 0;
      w++;
    }
  }
  // ground char
  while(w<N){
    pos[w*3]=(rng()-0.5)*15;
    pos[w*3+1]=-1.3+(rng()-0.5)*0.3;
    pos[w*3+2]=(rng()-0.5)*8-0.8;
    aSeed[w]=rng(); aPhase[w]=rng()*6.28; aH[w]=0; aBurn[w]=0;
    w++;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos,3));
geom.setAttribute('aSeed', new THREE.BufferAttribute(aSeed,1));
geom.setAttribute('aPhase', new THREE.BufferAttribute(aPhase,1));
geom.setAttribute('aH', new THREE.BufferAttribute(aH,1));
geom.setAttribute('aBurn', new THREE.BufferAttribute(aBurn,1));

const u = {
  uTime:{value:0}, uPx:{value:renderer.getPixelRatio()},
  uPtr:{value:new THREE.Vector2(0,0)}
};

const mat = new THREE.ShaderMaterial({
  uniforms:u, transparent:true, depthWrite:false,
  blending:THREE.NormalBlending,
  vertexShader:`
    uniform float uTime, uPx;
    uniform vec2 uPtr;
    attribute float aSeed, aPhase, aH, aBurn;
    varying float vH, vBurn, vSeed, vDepth;
    void main(){
      vec3 p = position;
      float wStr = aH*aH*0.32;
      float wT = uTime*0.40 + aPhase;
      p.x += sin(wT)*wStr + sin(wT*2.1+1.0)*wStr*0.13;
      p.z += cos(wT*0.65+2.0)*wStr*0.10;
      p.x += uPtr.x*aH*0.12;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      vDepth = -mv.z; vH=aH; vBurn=aBurn; vSeed=aSeed;
      float sz = mix(1.0, 2.4, smoothstep(0.5,0.85,aH));
      sz = aH<0.05 ? 0.7 : sz;
      gl_PointSize = sz * uPx * (5.5/vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying float vH, vBurn, vSeed, vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r>0.25) discard;
      float a = exp(-r*15.0);
      vec3 earth  = vec3(0.11,0.08,0.05);
      vec3 straw  = vec3(0.50,0.41,0.20);
      vec3 pale   = vec3(0.60,0.50,0.28);
      vec3 ash    = vec3(0.22,0.19,0.16);
      vec3 ember  = vec3(0.34,0.17,0.08);
      vec3 col = mix(earth, straw, smoothstep(0.05,0.45,vH));
      col = mix(col, pale, smoothstep(0.45,0.82,vH));
      col = mix(col, mix(ash, ember, sin(vSeed*11.0)*0.5+0.5), vBurn);
      if(vBurn>0.18){
        float pulse = sin(vSeed*38.0 + vH*9.0)*0.5+0.5;
        col += ember*0.25*pulse*vBurn;
      }
      float haze = clamp((vDepth-7.0)/11.0, 0.0, 0.6);
      col = mix(col, vec3(0.10,0.08,0.06), haze);
      if(vH<0.05) col = mix(ash, earth, vSeed);
      gl_FragColor = vec4(col, a*0.80*(1.0-haze*0.45));
    }
  `
});
scene.add(new THREE.Points(geom, mat));

// ── Ash flakes rising from smolder ──
const NA = 180;
const aG = new THREE.BufferGeometry();
const aP = new Float32Array(NA*3), aS = new Float32Array(NA);
for(let i=0;i<NA;i++){
  aP[i*3]=(Math.random()-0.5)*14;
  aP[i*3+1]=-1+Math.random()*6;
  aP[i*3+2]=(Math.random()-0.5)*8;
  aS[i]=Math.random();
}
aG.setAttribute('position', new THREE.BufferAttribute(aP,3));
aG.setAttribute('aSeed', new THREE.BufferAttribute(aS,1));
const aM = new THREE.ShaderMaterial({
  uniforms:{uTime:u.uTime, uPx:u.uPx},
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPx;
    attribute float aSeed;
    varying float vA;
    void main(){
      vec3 p = position;
      float t = uTime*0.055 + aSeed*6.28;
      p.x += sin(t*1.6+aSeed*18.0)*0.55;
      p.y += mod(uTime*0.035+aSeed*7.5, 5.5)-1.0;
      p.z += cos(t*1.1+aSeed*14.0)*0.35;
      vA = 0.12+0.18*sin(t*1.8);
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      gl_PointSize = (0.7+0.5*aSeed)*uPx*(3.0/-mv.z);
      gl_Position = projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord-0.5;
      if(dot(d,d)>0.25) discard;
      float a = exp(-dot(d,d)*18.0);
      gl_FragColor = vec4(0.40,0.33,0.24, a*vA);
    }
  `
});
scene.add(new THREE.Points(aG, aM));

// ── Interaction ──
addEventListener('pointermove', e=>{
  u.uPtr.value.set((e.clientX/innerWidth)*2-1,(e.clientY/innerHeight)*2-1);
});
addEventListener('click', ()=>{
  regrowSeed = Math.random()*1e9;
  buildField(Math.floor(regrowSeed));
  ['position','aSeed','aPhase','aH','aBurn'].forEach(k=>geom.attributes[k].needsUpdate=true);
});
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const t0 = performance.now();
(function loop(){
  const t = (performance.now()-t0)/1000;
  u.uTime.value = t;
  camera.position.x = Math.sin(t*0.025)*0.55;
  camera.position.y = 2.6 + Math.sin(t*0.018+0.5)*0.12;
  camera.lookAt(0, 0.8, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId(), KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){
      document.getElementById('gp-'+k).value=G[k];
      document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    load().forEach(function(c,i){
      var b=document.createElement('button');b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
})();
</script>
