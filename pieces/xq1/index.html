<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xq1 · Avocado mesh sampling</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#070908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">xq1</div>
<div class="hint">drag to orbit · scroll to zoom · click to resample</div>
<div class="src">glTF sampling · 60k particles · organic form</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 4, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

const N = 60000;
let geom, points, mat;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
};
mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute float seed;
    attribute vec3 normal;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      
      // breathe: subtle expansion along normals
      float breathe = 0.08 * (0.5 + 0.5*sin(t * 0.4));
      p += normal * breathe;
      
      // sway: gentle organic motion
      float sway = 0.05 * (0.5 + 0.5*sin(t * 0.7 + seed * 3.14));
      p.x += sway * sin(t + p.y * 0.3);
      p.z += sway * cos(t * 0.9 + p.y * 0.3);

      // reveal: particles fly in from above
      vec3 entry = vec3(seed*4.0 - 2.0, 25.0 + seed*8.0, seed*4.0 - 2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.5 + 0.5 * sin(t * 0.5 + seed * 2.0);
      
      // palette: earthy green avocado with highlight variation
      float ndotup = dot(normalize(normal), vec3(0.0, 1.0, 0.0));
      float height = (position.y + 5.0) * 0.1;
      vec3 base = vec3(0.35, 0.50, 0.25);   // dark avocado green
      vec3 mid = vec3(0.55, 0.70, 0.35);    // lighter green
      vec3 highlight = vec3(0.75, 0.85, 0.45);  // yellow-green
      
      float k = smoothstep(-0.3, 0.5, ndotup) * (0.5 + 0.5*height);
      vCol = mix(base, mid, k);
      vCol = mix(vCol, highlight, smoothstep(0.7, 1.0, k) * vEnergy * 0.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 0.7*vEnergy) * uPixel * (40.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 17.0) * (0.55 + 0.45*vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;
let loadedMesh = null;

function sampleSurface(){
  if (!loadedMesh) return;
  
  const sampler = new MeshSurfaceSampler(loadedMesh).build();
  const positions = new Float32Array(N * 3);
  const normals = new Float32Array(N * 3);
  const seeds = new Float32Array(N);
  
  const tempPos = new THREE.Vector3();
  const tempNorm = new THREE.Vector3();
  
  for (let i = 0; i < N; i++){
    sampler.sample(tempPos, tempNorm);
    positions[i*3] = tempPos.x;
    positions[i*3+1] = tempPos.y;
    positions[i*3+2] = tempPos.z;
    normals[i*3] = tempNorm.x;
    normals[i*3+1] = tempNorm.y;
    normals[i*3+2] = tempNorm.z;
    seeds[i] = Math.random();
  }
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.normal.array.set(normals); geom.attributes.normal.needsUpdate = true;
    geom.attributes.seed.array.set(seeds); geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Avocado/glTF-Binary/Avocado.glb',
  (gltf) => {
    gltf.scene.traverse((child) => {
      if (child.isMesh && child.geometry && child.geometry.attributes.position && !loadedMesh){
        const origGeom = child.geometry;
        
        // compute bounding box
        origGeom.computeBoundingBox();
        const bbox = origGeom.boundingBox;
        const center = bbox.getCenter(new THREE.Vector3());
        const size = bbox.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        
        // create normalized geometry to fit in view
        const scale = 10.0 / maxDim;
        const positions = origGeom.attributes.position.array;
        const normals = origGeom.attributes.normal ? origGeom.attributes.normal.array : null;
        
        const newPositions = new Float32Array(positions.length);
        const newNormals = normals ? new Float32Array(normals.length) : null;
        
        for (let i = 0; i < positions.length/3; i++){
          newPositions[i*3] = (positions[i*3] - center.x) * scale;
          newPositions[i*3+1] = (positions[i*3+1] - center.y) * scale;
          newPositions[i*3+2] = (positions[i*3+2] - center.z) * scale;
          if (newNormals && normals){
            newNormals[i*3] = normals[i*3];
            newNormals[i*3+1] = normals[i*3+1];
            newNormals[i*3+2] = normals[i*3+2];
          }
        }
        
        const newGeom = new THREE.BufferGeometry();
        newGeom.setAttribute('position', new THREE.BufferAttribute(newPositions, 3));
        if (newNormals){
          newGeom.setAttribute('normal', new THREE.BufferAttribute(newNormals, 3));
        } else {
          newGeom.computeVertexNormals();
        }
        if (origGeom.index){
          newGeom.setIndex(origGeom.index);
        }
        
        const mesh = new THREE.Mesh(newGeom, new THREE.MeshBasicMaterial());
        loadedMesh = mesh;
        sampleSurface();
      }
    });
  },
  undefined,
  (error) => {
    console.error('Error loading model:', error);
  }
);

addEventListener('click', () => {
  if (loadedMesh) sampleSurface();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
