<!doctype html>
<html lang="en">
<head>

<title>567 · cypress ↔ art-deco tower · cascade</title>
<!-- MOTION: cascade, intensity: vigorous -->
<style>

               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size:11px; letter-spacing:0.06em; }

<body>
<div class="id">567</div>
<div class="hint">drag to orbit · click to flip · particles cascade like autumn rain</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ─── scene ─── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.015);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 8, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

/* ─── repeatable rng ─── */
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

/* ─── L-system cypress (pose A) ─── */
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, r){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const rv = r(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (rv <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = new THREE.Vector3(0,1,0), l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1);
  let gen = 0;
  const rot = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rot(u, +ANGLE); break;  case '-': rot(u, -ANGLE); break;
      case '&': rot(l, +ANGLE); break;  case '^': rot(l, -ANGLE); break;
      case '/': rot(h, +ANGLE*1.5); break;  case '\\': rot(h, -ANGLE*1.5); break;
      case '[': stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const cypressSegs = turtle(expand('F', 6, rng));

/* ─── art-deco tower (pose B) ─── */
function sampleArtDeco(N){
  const out = new Float32Array(N*3);
  const pos = new THREE.Vector3();
  const tiers = [
    { hw:4.5, y0:0, y1:4, ridges:14 },
    { hw:3.4, y0:4, y1:7.5, ridges:12 },
    { hw:2.4, y0:7.5, y1:10.5, ridges:10 },
    { hw:1.5, y0:10.5, y1:13, ridges:8 },
    { hw:0.85, y0:13, y1:15, ridges:6 },
  ];
  const spireBase=0.6, spireTop=18.5, spireApex=20.5;
  const W=Math.floor(N*0.55), B=Math.floor(N*0.25), S=Math.floor(N*0.12), C=N-W-B-S;
  let i=0;
  const tierW = tiers.map(t=>8*t.hw*(t.y1-t.y0));
  const twT = tierW.reduce((a,b)=>a+b,0);
  for (let ti=0; ti<tiers.length; ti++){
    const t=tiers[ti];
    const count = ti===tiers.length-1 ? W-i : Math.floor(tierW[ti]/twT*W);
    for (let k=0; k<count; k++){
      const face=Math.floor(Math.random()*4);
      const r=Math.floor(Math.random()*t.ridges);
      const rf=(r+0.5)/t.ridges;
      const along=(rf*2-1)*t.hw;
      const y=t.y0+Math.random()*(t.y1-t.y0);
      const j=0.04;
      switch(face){
        case 0: pos.set(t.hw+(Math.random()-.5)*j, y, along); break;
        case 1: pos.set(-t.hw+(Math.random()-.5)*j, y, along); break;
        case 2: pos.set(along, y, t.hw+(Math.random()-.5)*j); break;
        case 3: pos.set(along, y, -t.hw+(Math.random()-.5)*j); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k=0; k<B; k++){
    const ti=Math.floor(Math.random()*tiers.length), t=tiers[ti];
    const edge=Math.random()<0.6?t.y1:t.y0;
    const face=Math.floor(Math.random()*4);
    const along=(Math.random()*2-1)*t.hw;
    const j=0.02;
    switch(face){
      case 0: pos.set(t.hw, edge+(Math.random()-.5)*j, along); break;
      case 1: pos.set(-t.hw, edge+(Math.random()-.5)*j, along); break;
      case 2: pos.set(along, edge+(Math.random()-.5)*j, t.hw); break;
      case 3: pos.set(along, edge+(Math.random()-.5)*j, -t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k=0; k<S; k++){
    const t=Math.random();
    const y=spireTop+t*(spireApex-spireTop);
    const r=spireBase*(1-t);
    const th=Math.random()*Math.PI*2;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  const chevrons=16;
  for (let k=0; k<C; k++){
    const ch=Math.floor(Math.random()*chevrons);
    const th=(ch+0.5)/chevrons*Math.PI*2;
    const along=Math.random();
    const r=0.7+along*1.3;
    const y=spireTop-0.4+along*0.8+(Math.random()-.5)*0.05;
    pos.set(Math.cos(th)*r, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

/* ─── build correspondence ─── */
const N = 70000;
const treePos = new Float32Array(N*3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);
const cascadePhase = new Float32Array(N); // staggered release timing

const lens = cypressSegs.map(s=>s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const SKEL_FRAC=0.55, N_SKEL=Math.floor(N*SKEL_FRAC), N_FOL=N-N_SKEL;
let written=0;
const v = new THREE.Vector3();

for (let i=0; i<cypressSegs.length; i++){
  const share = i===cypressSegs.length-1 ? N_SKEL-written : Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for (let k=0; k<share && written<N_SKEL; k++){
    const t=Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jit=0.05*Math.pow(0.85,cypressSegs[i].gen);
    treePos[written*3]=v.x+(Math.random()-.5)*jit;
    treePos[written*3+1]=v.y+(Math.random()-.5)*jit;
    treePos[written*3+2]=v.z+(Math.random()-.5)*jit;
    seeds[written]=Math.random();
    written++;
  }
}
{
  let yMin=Infinity, yMax=-Infinity;
  for (const s of cypressSegs){ yMin=Math.min(yMin,s.from.y,s.to.y); yMax=Math.max(yMax,s.from.y,s.to.y); }
  const trunkH=yMax-yMin, haloYStart=yMin+trunkH*0.16;
  const RIDGES=8, SPIRAL=0.9, TUFT_COUNT=24;
  const tuftYs=[], tuftThs=[];
  for (let i=0;i<TUFT_COUNT;i++){
    tuftYs.push(haloYStart+((i+.5)/TUFT_COUNT)*(yMax-haloYStart));
    tuftThs.push(Math.random()*Math.PI*2);
  }
  const N_RIDGE=Math.floor(N_FOL*0.6), N_TUFT=N_FOL-N_RIDGE;
  for (let k=0;k<N_RIDGE&&written<N;k++){
    const yt=Math.random(), y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const ridgeTh=(ridge/RIDGES)*Math.PI*2+y*SPIRAL;
    const th=ridgeTh+(Math.random()-.5)*0.3;
    const r=baseR*(0.55+0.45*Math.random());
    treePos[written*3]=Math.cos(th)*r;
    treePos[written*3+1]=y+(Math.random()-.5)*0.05;
    treePos[written*3+2]=Math.sin(th)*r;
    seeds[written]=Math.random(); written++;
  }
  for (let k=0;k<N_TUFT&&written<N;k++){
    const t=Math.floor(Math.random()*TUFT_COUNT);
    const yt=(tuftYs[t]-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-0.45,2));
    const baseR=0.05+0.95*taper;
    const reach=baseR+0.1+Math.random()*0.35;
    const localY=tuftYs[t]+(Math.random()-.5)*0.4;
    const localTh=tuftThs[t]+(Math.random()-.5)*0.4;
    const localR=reach+(Math.random()-.5)*0.18;
    treePos[written*3]=Math.cos(localTh)*localR;
    treePos[written*3+1]=localY;
    treePos[written*3+2]=Math.sin(localTh)*localR;
    seeds[written]=Math.random(); written++;
  }
}
while(written<N){ treePos[written*3]=0; treePos[written*3+1]=0; treePos[written*3+2]=0; seeds[written]=Math.random(); written++; }

/* cascade phase: staggered by height — top particles release first, creating
   visible rivulets of falling particles. Each particle has a unique cycle
   period so the cascade reads as continuous rain, not synchronized pulse. */
for (let i=0; i<N; i++){
  // higher particles get earlier phase (fall first); randomized period 4-9s
  cascadePhase[i] = seeds[i] * 6.28 + (treePos[i*3+1] / 16.0) * 2.0;
}

/* ─── fit both poses to same vertical extent ─── */
function fitToHeight(arr, targetH){
  let minY=Infinity, maxY=-Infinity, cx=0, cz=0;
  const n=arr.length/3;
  for (let i=0;i<n;i++){
    minY=Math.min(minY,arr[i*3+1]); maxY=Math.max(maxY,arr[i*3+1]);
    cx+=arr[i*3]; cz+=arr[i*3+2];
  }
  cx/=n; cz/=n;
  const s=targetH/(maxY-minY);
  for (let i=0;i<n;i++){
    arr[i*3]=(arr[i*3]-cx)*s;
    arr[i*3+1]=(arr[i*3+1]-minY)*s;
    arr[i*3+2]=(arr[i*3+2]-cz)*s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

/* ─── shader material ─── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('cPhase',   new THREE.BufferAttribute(cascadePhase, 1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    attribute float cPhase;
    varying vec3 vCol;
    varying float vAlpha;

    // cascade: each particle cycles through (hold → release → fall → reform)
    // period varies per particle so the cascade is continuous, not synchronized
    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 baseP = mix(treePos, towerPos, m);

      // cascade timing: particle-specific period (5-9 seconds)
      float period = 5.0 + seed * 4.0;
      float phase = mod(uTime + cPhase, period) / period; // 0..1

      // 0..0.55 = hold (particle sits at home position with gentle sway)
      // 0.55..0.85 = fall (gravity cascade)
      // 0.85..1.0 = reform (rise back as ghostly wisps)
      vec3 p = baseP;
      float alpha = 1.0;

      float holdEnd = 0.55;
      float fallEnd = 0.85;

      if (phase < holdEnd) {
        // hold: gentle organic sway (cypress) or rigid shimmer (deco)
        float t = uTime * 0.4 + seed * 6.28;
        float swayAmt = (1.0 - m) * 0.05 * (p.y / 16.0);
        float shimmer = m * 0.015 * sin(t * 3.0 + p.y * 2.0);
        p.x += swayAmt * sin(t) + shimmer;
        p.z += swayAmt * cos(t * 0.9) + shimmer * 0.7;
      }
      else if (phase < fallEnd) {
        // fall: gravity-led cascade — particles peel off and tumble down
        float fallT = (phase - holdEnd) / (fallEnd - holdEnd); // 0..1
        float gravity = 16.0 * fallT * fallT; // quadratic fall
        p.y -= gravity;
        // lateral drift while falling — like leaves in wind, not straight down
        float windPhase = seed * 6.28 + uTime * 0.3;
        float lateralAmt = 0.8 * fallT;
        p.x += sin(windPhase + fallT * 4.0) * lateralAmt;
        p.z += cos(windPhase * 1.3 + fallT * 3.0) * lateralAmt * 0.7;
        // tumbling — small high-freq oscillation
        p.x += sin(fallT * 20.0 + seed * 50.0) * 0.08 * fallT;
        // fade as particle nears ground
        alpha = mix(1.0, 0.15, fallT);
      }
      else {
        // reform: ghostly ascent back to home — wisps rising
        float reformT = (phase - fallEnd) / (1.0 - fallEnd); // 0..1
        float reformEase = smoothstep(0.0, 1.0, reformT);
        // start from fallen position (below), rise to home
        float fallBottom = baseP.y - 16.0;
        p.y = mix(fallBottom, baseP.y, reformEase);
        // slight inward spiral during reform
        float spiralAng = reformT * 2.0 + seed * 6.28;
        float spiralR = (1.0 - reformT) * 0.6;
        p.x += sin(spiralAng) * spiralR;
        p.z += cos(spiralAng) * spiralR;
        alpha = reformEase * 0.6; // ghostly fade-in
      }

      // clamp: don't render below ground
      if (p.y < -1.0) alpha = 0.0;

      // ── color: hand-tuned 5-color palettes ──
      // cypress: deep pine #2D5A3D, living green #6B9E4A, gold-tip #C9B44E, bark #4A3728, highlight #A8C97A
      // deco:    dark bronze #6B4D2E, burnished gold #D4A037, ivory #FFF5E0, steel #8C8C8C, rosette #C97A5A
      float hk = clamp(baseP.y / 16.0, 0.0, 1.0);

      vec3 cPine    = vec3(0.176, 0.353, 0.239);
      vec3 cGreen   = vec3(0.420, 0.620, 0.290);
      vec3 cGoldTip = vec3(0.788, 0.706, 0.306);
      vec3 cBark    = vec3(0.290, 0.216, 0.157);

      vec3 dBronze  = vec3(0.420, 0.302, 0.180);
      vec3 dGold    = vec3(0.831, 0.627, 0.216);
      vec3 dIvory   = vec3(0.999, 0.961, 0.878);
      vec3 dRosette = vec3(0.788, 0.478, 0.353);

      // height gradient with hand-placed transitions
      vec3 treeCol = mix(cBark, cPine, smoothstep(0.0, 0.15, hk));
      treeCol = mix(treeCol, cGreen, smoothstep(0.15, 0.6, hk));
      treeCol = mix(treeCol, cGoldTip, smoothstep(0.75, 0.95, hk) * 0.7);

      vec3 decoCol = mix(dBronze, dGold, smoothstep(0.1, 0.5, hk));
      decoCol = mix(decoCol, dRosette, smoothstep(0.4, 0.7, hk) * 0.3);
      decoCol = mix(decoCol, dIvory, smoothstep(0.85, 1.0, hk) * 0.8);

      vCol = mix(treeCol, decoCol, m);

      // falling particles warm slightly (like autumn leaves catching light)
      if (phase >= holdEnd && phase < fallEnd) {
        float fallT = (phase - holdEnd) / (fallEnd - holdEnd);
        vCol = mix(vCol, vec3(0.9, 0.65, 0.3), fallT * 0.35 * (1.0 - m));
        vCol = mix(vCol, vec3(1.0, 0.85, 0.6), fallT * 0.2 * m);
      }

      vAlpha = alpha;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // falling particles slightly larger (closer / more prominent)
      float sizeMult = (phase >= holdEnd && phase < fallEnd) ? 1.3 : 1.0;
      gl_PointSize = sizeMult * (0.8 + 0.5 * seed) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float soft = exp(-r * 16.0);
      float a = soft * vAlpha * 0.55;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ─── ground mist: subtle settling particles at base ─── */
const mistGeo = new THREE.PlaneGeometry(30, 30);
const mistMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: uniforms.uTime },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      float fog = exp(-d * d * 8.0) * 0.08;
      float shimmer = 0.5 + 0.5 * sin(uTime * 0.3 + d * 10.0);
      fog *= 0.7 + 0.3 * shimmer;
      vec3 col = vec3(0.15, 0.12, 0.10);
      gl_FragColor = vec4(col * fog, fog);
    }
  `
});
const mist = new THREE.Mesh(mistGeo, mistMat);
mist.rotation.x = -Math.PI/2;
mist.position.y = -0.3;
scene.add(mist);

/* ─── interaction ─── */
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // auto-toggle every ~14s
  const auto = (Math.floor(t / 14) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.018;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  // slow orbit — camera tracks centroid, keeps form well-framed
  const ang = t * 0.04;
  const orbitR = 24;
  const camY = 8 + Math.sin(t * 0.07) * 1.5;
  camera.position.x = Math.sin(ang) * orbitR;
  camera.position.z = Math.cos(ang) * orbitR;
  camera.position.y = camY;
  camera.lookAt(0, 7.5, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
