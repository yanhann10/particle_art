<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5b6 · speculative topography (depth-routed)</title>
<!-- MOTION: drift, intensity: gentle -->
<!--
  Palette (hand-tuned, restrained / aged — no neon):
    midnight smoke  #14171c  ground & fog
    deep ash        #2a2f36 → #4a515b  terrain elevation ramp
    patina ridge    #6b6256  highest land
    courier ember   #b98a5e  (rust-amber, HSL sat ~40%)
    courier dusk    #6f8aa3  (slate-blue, HSL sat ~23%)
  The two trail tones depart from the parent's neon green/pink, which read as pop.
  Couriers wander a 3D route-graph whose sites span a deep Z range — trails sweep
  from foreground to background so a slow lateral camera DRIFT (no Y-spin) reveals
  real parallax: near routes streak past, far ones dissolve into atmosphere.
-->
<style>
  html, body { margin:0; padding:0; height:100%; background:#14171c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">5b6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const BG = 0x14171c;
const scene = new THREE.Scene();
// far routes & land dissolve into atmosphere (depth cue)
scene.fog = new THREE.Fog(BG, 55, 155);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 320);
const CAM_BASE = new THREE.Vector3(0, 28, 72);
const LOOK = new THREE.Vector3(0, 5, 0);
camera.position.copy(CAM_BASE);
camera.lookAt(LOOK);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

// ---- field extent: sites span a DEEP z-range so trails traverse frustum depth ----
const SPAN_X = 60;   // wide
const SPAN_Z = 56;   // deep — this is the depth the directive asks us to use
// visible frustum depth at this framing ~ 140 units; site z-range (112) ≈ 0.8× → trails
// genuinely sweep foreground→background, not a flat sheet.

// deterministic-ish hash for handmade per-element jitter
let _s = 1337;
function rnd(){ _s = (_s * 1664525 + 1013904223) & 0x7fffffff; return _s / 0x7fffffff; }

// ---- speculative topography: layered ridges ----
function elev(x, z){
  let h = 3.0 * Math.sin(x*0.058) * Math.cos(z*0.05);
  h += 2.2 * Math.sin((x + z) * 0.04 + 0.7);
  h += 1.6 * Math.cos((x - z*1.3) * 0.03);
  h -= 1.4 * Math.abs(Math.sin(x*0.02) * Math.sin(z*0.024)); // valley troughs
  return h;
}

// ---- dense terrain point cloud (the world / substrate / atmosphere) ----
const TN = 200; // 200x200 = 40,000 points
const tCount = TN * TN;
const tPos = new Float32Array(tCount * 3);
const tCol = new Float32Array(tCount * 3);

const cLow  = new THREE.Color(0x2a2f36);
const cMid  = new THREE.Color(0x4a515b);
const cHigh = new THREE.Color(0x6b6256);
const tmp = new THREE.Color();

let pi = 0;
for (let ix = 0; ix < TN; ix++){
  for (let iz = 0; iz < TN; iz++){
    const x = ((ix / (TN-1)) - 0.5) * SPAN_X * 2;
    const z = ((iz / (TN-1)) - 0.5) * SPAN_Z * 2;
    const y = elev(x, z) + (rnd() - 0.5) * 0.25; // micro grain
    tPos[pi*3]   = x;
    tPos[pi*3+1] = y;
    tPos[pi*3+2] = z;
    // elevation ramp, low→high
    const e = THREE.MathUtils.clamp((y + 5) / 11, 0, 1);
    if (e < 0.5) tmp.copy(cLow).lerp(cMid, e/0.5);
    else         tmp.copy(cMid).lerp(cHigh, (e-0.5)/0.5);
    const dim = 0.78 + (rnd()-0.5)*0.12; // hand variation, avoid procedural flatness
    tCol[pi*3]   = tmp.r * dim;
    tCol[pi*3+1] = tmp.g * dim;
    tCol[pi*3+2] = tmp.b * dim;
    pi++;
  }
}
const tGeo = new THREE.BufferGeometry();
tGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3));
tGeo.setAttribute('color', new THREE.BufferAttribute(tCol, 3));
const tMat = new THREE.PointsMaterial({
  size: 0.6, sizeAttenuation: true, vertexColors: true,
  transparent: true, opacity: 0.92, fog: true, depthWrite: false
});
scene.add(new THREE.Points(tGeo, tMat));

// ---- route graph: sites distributed across full depth ----
const SITES = 92;
const sites = [];
for (let i = 0; i < SITES; i++){
  const x = (rnd() - 0.5) * SPAN_X * 2 * 0.92;
  const z = (rnd() - 0.5) * SPAN_Z * 2 * 0.92;
  sites.push({ x, y: elev(x, z) + 1.2, z });
}
// connect each site to 2-4 nearest neighbours
const graph = sites.map(() => []);
for (let i = 0; i < SITES; i++){
  const d = [];
  for (let j = 0; j < SITES; j++){
    if (i === j) continue;
    const dx = sites[i].x - sites[j].x, dz = sites[i].z - sites[j].z;
    d.push({ j, d: dx*dx + dz*dz });
  }
  d.sort((a,b) => a.d - b.d);
  const n = 2 + Math.floor(rnd()*3);
  for (let k = 0; k < n && k < d.length; k++){
    const t = d[k].j;
    if (!graph[i].includes(t)) graph[i].push(t);
    if (!graph[t].includes(i)) graph[t].push(i);
  }
}

// faint static route substrate so the "map" reads even before trails accumulate
const edgePts = [];
for (let i = 0; i < SITES; i++)
  for (const j of graph[i])
    if (j > i){
      edgePts.push(new THREE.Vector3(sites[i].x, sites[i].y, sites[i].z));
      edgePts.push(new THREE.Vector3(sites[j].x, sites[j].y, sites[j].z));
    }
const edgeGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
const edgeMat = new THREE.LineBasicMaterial({
  color: 0x394450, transparent: true, opacity: 0.14, fog: true
});
scene.add(new THREE.LineSegments(edgeGeo, edgeMat));

// ---- couriers: wander the graph, leaving fading light-trails through depth ----
const COURIERS = 220;
const MAXLEN = 80;
const EMBER = new THREE.Color(0xb98a5e);
const DUSK  = new THREE.Color(0x6f8aa3);

const couriers = [];
const trailObjs = [];
for (let i = 0; i < COURIERS; i++){
  const cur = Math.floor(rnd() * SITES);
  const nbrs = graph[cur];
  const nxt = nbrs.length ? nbrs[Math.floor(rnd()*nbrs.length)] : cur;
  const base = (rnd() < 0.62) ? EMBER : DUSK;
  const col = base.clone().offsetHSL((rnd()-0.5)*0.03, 0, (rnd()-0.5)*0.08); // hand jitter
  couriers.push({
    cur, nxt, t: rnd(),
    speed: 0.24 + rnd()*0.34,
    arc: 1.0 + rnd()*1.6,
    col, trail: []
  });

  const g = new THREE.BufferGeometry();
  const pos = new Float32Array(MAXLEN * 3);
  const cls = new Float32Array(MAXLEN * 3);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(cls, 3));
  g.setDrawRange(0, 0);
  const m = new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: true
  });
  const line = new THREE.Line(g, m);
  scene.add(line);
  trailObjs.push({ g, pos, cls });
}

function stepCourier(c, dt){
  c.t += c.speed * dt;
  while (c.t >= 1){
    c.t -= 1;
    c.cur = c.nxt;
    const nbrs = graph[c.cur];
    // avoid immediate backtrack when possible (smoother wander)
    let pick = nbrs.length ? nbrs[Math.floor(rnd()*nbrs.length)] : c.cur;
    if (nbrs.length > 1 && pick === c.nxt) pick = nbrs[(nbrs.indexOf(pick)+1)%nbrs.length];
    c.nxt = pick;
  }
  const a = sites[c.cur], b = sites[c.nxt];
  const x = THREE.MathUtils.lerp(a.x, b.x, c.t);
  const y = THREE.MathUtils.lerp(a.y, b.y, c.t) + c.arc * Math.sin(Math.PI * c.t);
  const z = THREE.MathUtils.lerp(a.z, b.z, c.t);
  c.trail.push(x, y, z);
  if (c.trail.length > MAXLEN * 3) c.trail.splice(0, c.trail.length - MAXLEN * 3);
}

function drawTrail(c, idx, bright){
  const tr = c.trail;
  const len = tr.length / 3;
  if (len < 2){ trailObjs[idx].g.setDrawRange(0, 0); return; }
  const { g, pos, cls } = trailObjs[idx];
  const r = c.col.r, gg = c.col.g, bb = c.col.b;
  for (let i = 0; i < len; i++){
    pos[i*3]   = tr[i*3];
    pos[i*3+1] = tr[i*3+1];
    pos[i*3+2] = tr[i*3+2];
    const fade = Math.pow(i / (len - 1), 1.6) * bright; // head bright, tail → dark (additive = invisible)
    cls[i*3]   = r * fade;
    cls[i*3+1] = gg * fade;
    cls[i*3+2] = bb * fade;
  }
  g.setDrawRange(0, len);
  g.attributes.position.needsUpdate = true;
  g.attributes.color.needsUpdate = true;
}

// ---- warm up so trails are already drawn before the 5s screenshot ----
for (let w = 0; w < 70; w++)
  for (const c of couriers) stepCourier(c, 0.05);
couriers.forEach((c, i) => drawTrail(c, i, 0.9));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio clock: warps with sound, advances at real-time with zero audio
let lastT = performance.now();
function loop(){
  const now = performance.now();
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = Math.min(dt, 0.05); // clamp after tab-stall

  const AR = window.AR;
  const at = (AR ? AR.t : now) * 0.001;
  const level = AR ? AR.level : 0;
  const beat  = AR ? AR.beat  : 0;

  // trails react: brighter / faster with sound, fully alive at silence
  const bright = 0.86 + level * 0.5 + beat * 0.25;
  const flow = dt * (1 + level * 0.7);
  couriers.forEach((c, i) => { stepCourier(c, flow); drawTrail(c, i, bright); });

  // SINGLE SLOW LATERAL DRIFT (no Y-spin): trucks the camera sideways so depth
  // resolves through parallax — near routes streak, far ones barely move.
  const drift = Math.sin(at * 0.045) * 18;     // ~140s period — one unhurried pass
  const rise  = Math.sin(at * 0.03) * 2.5;
  camera.position.set(CAM_BASE.x + drift, CAM_BASE.y + rise, CAM_BASE.z);
  camera.lookAt(LOOK);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<script src="/audio-reactive.js" defer></script>
</body>
</html>
