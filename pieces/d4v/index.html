<!doctype html>
<html lang="en">
<head>
<!-- MOTION: cascade, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ahx · DNA double helix unraveling</title>
<!-- Palette rationale: Helix A blue-indigo (#1a2060) echoes base adenine/guanine
     visual conventions; Helix B deep crimson (#802020) echoes thymine/cytosine;
     base-pair rungs in warm off-white (#f0f0e8) suggest the H-bond bridges;
     near-black (#030408) background is molecular darkness. Restrained, scientific duotone. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#030408; overflow:hidden;
               color:#9090b0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .phase { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">ahx · DNA double helix · unraveling</div>
<div class="hint">drag to orbit · 20s unravel → re-anneal cycle</div>
<div class="src">Watson-Crick double helix · 12 turns · 240 base pairs</div>
<div class="phase" id="phase">annealed</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// DNA DOUBLE HELIX UNRAVELING
// Two counter-wound helices, 12 full turns, 10 units along Y.
// 240 base-pair rungs connecting A to B.
// Animation: 20s unravel from bottom (rungs fade, strands drift apart).
//            then 20s re-anneal from bottom.
// Camera: slow drift along +Y, revealing helix length.

const TURNS       = 12;
const HEIGHT      = 10.0;
const N_PAIRS     = 240;
const HELIX_R     = 0.6;  // radius of the double helix cylinder
const NODE_R      = 0.08; // sphere radius at each nucleotide node
const CYCLE_DUR   = 20.0; // seconds per half-cycle
const MAX_DRIFT   = 0.8;  // max X drift when strands separate

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, -2, 10);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x030408, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 5, 0);

// Lighting
scene.add(new THREE.AmbientLight(0x080c18, 0.8));
const keyLight = new THREE.DirectionalLight(0xc0c8ff, 0.7);
keyLight.position.set(3, 10, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xff8060, 0.3);
rimLight.position.set(-3, 5, -3);
scene.add(rimLight);
// Blue tint from below — like a gel electrophoresis lamp
const blueLight = new THREE.PointLight(0x2040a0, 1.2, 20);
blueLight.position.set(0, -2, 0);
scene.add(blueLight);

// ── Materials
const matA = new THREE.MeshStandardMaterial({ color: 0x2030a0, roughness: 0.4, metalness: 0.2, emissive: 0x0a1040, emissiveIntensity: 0.3 });
const matB = new THREE.MeshStandardMaterial({ color: 0xa02020, roughness: 0.4, metalness: 0.2, emissive: 0x401010, emissiveIntensity: 0.3 });
const matRung = new THREE.MeshStandardMaterial({ color: 0xf0f0e8, roughness: 0.5, transparent: true, opacity: 1.0 });
const matBackboneA = new THREE.MeshStandardMaterial({ color: 0x1a2060, roughness: 0.35, metalness: 0.15 });
const matBackboneB = new THREE.MeshStandardMaterial({ color: 0x802020, roughness: 0.35, metalness: 0.15 });

// ── Geometry builder
// Precompute helix node positions
const nodesA = [];
const nodesB = [];
for (let i = 0; i < N_PAIRS; i++) {
  const t = i / (N_PAIRS - 1);
  const y = t * HEIGHT;
  const angle = t * TURNS * Math.PI * 2;
  nodesA.push(new THREE.Vector3(
    Math.cos(angle) * HELIX_R,
    y,
    Math.sin(angle) * HELIX_R
  ));
  // B strand is counter-wound (180° offset)
  nodesB.push(new THREE.Vector3(
    Math.cos(angle + Math.PI) * HELIX_R,
    y,
    Math.sin(angle + Math.PI) * HELIX_R
  ));
}

// Backbone tubes for Strand A and B
function buildBackboneTube(nodes, mat) {
  const curve = new THREE.CatmullRomCurve3(nodes);
  const geo = new THREE.TubeGeometry(curve, nodes.length * 2, 0.04, 6, false);
  return new THREE.Mesh(geo, mat);
}

const backboneA = buildBackboneTube(nodesA, matBackboneA);
const backboneB = buildBackboneTube(nodesB, matBackboneB);
scene.add(backboneA);
scene.add(backboneB);

// Nucleotide node spheres
const nodeGeo = new THREE.SphereGeometry(NODE_R, 8, 6);
const instancedA = new THREE.InstancedMesh(nodeGeo, matA, N_PAIRS);
const instancedB = new THREE.InstancedMesh(nodeGeo, matB, N_PAIRS);
instancedA.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
instancedB.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(instancedA);
scene.add(instancedB);

// Base-pair rungs — individual LineSegments for per-rung opacity
// Use InstancedMesh of thin cylinder instead for proper opacity control
const rungGeo = new THREE.CylinderGeometry(0.015, 0.015, 1.0, 5, 1);
// Rung center at origin, scale Y to actual distance at render time
const rungMaterials = [];
const rungs = [];
for (let i = 0; i < N_PAIRS; i++) {
  const m = matRung.clone();
  m.transparent = true;
  m.opacity = 1.0;
  rungMaterials.push(m);
  const rung = new THREE.Mesh(rungGeo, m);
  scene.add(rung);
  rungs.push(rung);
}

// ── State for unraveling animation
// driftA[i], driftB[i]: current X-offset for node i on each strand (0 = annealed)
const driftA = new Float32Array(N_PAIRS).fill(0);
const driftB = new Float32Array(N_PAIRS).fill(0);
const rungOpacity = new Float32Array(N_PAIRS).fill(1);

const dummy = new THREE.Object3D();

function updateGeometry(t) {
  // t in [0, 2*CYCLE_DUR]: first half = unravel, second half = re-anneal
  const halfCycle = CYCLE_DUR;
  const cycleT = t % (2 * halfCycle);
  const unraveling = cycleT < halfCycle;
  const phase = unraveling ? (cycleT / halfCycle) : (1 - (cycleT - halfCycle) / halfCycle);
  // phase 0 = annealed, 1 = fully unraveled

  document.getElementById('phase').textContent = unraveling ? 'unraveling' : 're-annealing';

  // Bottom-up cascade: for node i, its unravel progress leads by (1 - i/N_PAIRS)
  for (let i = 0; i < N_PAIRS; i++) {
    const nodeT = i / (N_PAIRS - 1);
    // Bottom nodes unravel first
    const localPhase = THREE.MathUtils.clamp(phase * 2 - nodeT, 0, 1);

    driftA[i] = localPhase * MAX_DRIFT;
    driftB[i] = -localPhase * MAX_DRIFT;
    rungOpacity[i] = 1 - localPhase;
  }

  // Update strand A positions
  const curNodesA = nodesA.map((n, i) => new THREE.Vector3(n.x + driftA[i], n.y, n.z));
  const curNodesB = nodesB.map((n, i) => new THREE.Vector3(n.x + driftB[i], n.y, n.z));

  // Update backbone tubes (rebuild at low frequency for perf)
  // For smooth motion, rebuild every frame (only 240 segments each — cheap)
  if (backboneA.geometry) backboneA.geometry.dispose();
  if (backboneB.geometry) backboneB.geometry.dispose();

  const curveA = new THREE.CatmullRomCurve3(curNodesA);
  const curveB = new THREE.CatmullRomCurve3(curNodesB);
  backboneA.geometry = new THREE.TubeGeometry(curveA, N_PAIRS * 2, 0.04, 6, false);
  backboneB.geometry = new THREE.TubeGeometry(curveB, N_PAIRS * 2, 0.04, 6, false);

  // Update node spheres
  for (let i = 0; i < N_PAIRS; i++) {
    dummy.position.copy(curNodesA[i]);
    dummy.updateMatrix();
    instancedA.setMatrixAt(i, dummy.matrix);

    dummy.position.copy(curNodesB[i]);
    dummy.updateMatrix();
    instancedB.setMatrixAt(i, dummy.matrix);
  }
  instancedA.instanceMatrix.needsUpdate = true;
  instancedB.instanceMatrix.needsUpdate = true;

  // Update rungs
  for (let i = 0; i < N_PAIRS; i++) {
    const pA = curNodesA[i];
    const pB = curNodesB[i];
    const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
    const dist = pA.distanceTo(pB);
    rungs[i].position.copy(mid);
    rungs[i].scale.set(1, dist, 1);
    // Orient toward pA
    const dir = new THREE.Vector3().subVectors(pA, pB).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const quat = new THREE.Quaternion().setFromUnitVectors(up, dir);
    rungs[i].quaternion.copy(quat);
    rungMaterials[i].opacity = rungOpacity[i];
    rungMaterials[i].visible = rungOpacity[i] > 0.01;
  }
}

// ── Camera drift along +Y
let camDriftY = 0;
const camBaseY = -2;
const camTopY = 6;

let startTime = null;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let paused = false;
renderer.domElement.addEventListener('click', () => { paused = !paused; });

function animate(ts) {
  requestAnimationFrame(animate);
  if (paused) return;

  if (!startTime) startTime = ts;
  const elapsed = (ts - startTime) * 0.001;

  // Update helix geometry
  updateGeometry(elapsed);

  // Camera: slow drift along +Y axis revealing helix length
  // Moves from y=-2 to y=6 over 20s, then resets
  const camPhase = (elapsed % 25) / 25; // 25s cycle
  const targetCamY = camBaseY + (camTopY - camBaseY) * Math.min(camPhase * 1.5, 1);
  camera.position.y += (targetCamY - camera.position.y) * 0.005;
  controls.target.y = camera.position.y + 3;

  controls.update();
  renderer.render(scene, camera);
}
animate(0);
</script>
</body>
</html>
