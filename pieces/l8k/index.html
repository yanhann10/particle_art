canvas { display:block; }

<body>
<div class="id">l8k</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 12, 50);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 100);
camera.position.set(18, 14, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Lighting: harsh overhead construction-site light + ambient glow
const ambLight = new THREE.AmbientLight(0x2a2520, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffe8c0, 1.2);
dirLight.position.set(8, 24, 6);
scene.add(dirLight);
const accentLight = new THREE.PointLight(0x00ffcc, 0.8, 40);
accentLight.position.set(-5, 8, -5);
scene.add(accentLight);

// ── Deterministic RNG
let rngState = 48291647;
function rng(){ 
  rngState |= 0; 
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── L-system grammar for informal architecture
// axiom: R (room)
// R -> R [+F] [-F] R | R [^F] [vF] R | F
// F -> box
const GRID_SIZE = 0.8;
const MAX_DEPTH = 4;

class LNode {
  constructor(pos, dir, depth){
    this.pos = pos.clone();
    this.dir = dir.clone();
    this.depth = depth;
    this.children = [];
    this.box = null; // THREE.Mesh reference
    this.state = 'building'; // 'building' | 'stable' | 'collapsing' | 'fallen'
    this.collapseVel = new THREE.Vector3(0, 0, 0);
    this.lifetime = 0;
  }
}

const roots = [];
const allNodes = [];

function expandNode(node){
  if (node.depth >= MAX_DEPTH) return;
  const r = rng();
  
  // Branching rules
  if (r < 0.4 && node.depth < MAX_DEPTH - 1){
    // Rule: R -> R [+F] [-F] R
    // main stem
    const stem = new LNode(
      node.pos.clone().add(node.dir.clone().multiplyScalar(GRID_SIZE)),
      node.dir.clone(),
      node.depth + 1
    );
    node.children.push(stem);
    allNodes.push(stem);
    
    // branch left
    const leftDir = node.dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), Math.PI/2 + (rng()-0.5)*0.4);
    const left = new LNode(
      node.pos.clone().add(leftDir.multiplyScalar(GRID_SIZE)),
      leftDir,
      node.depth + 1
    );
    node.children.push(left);
    allNodes.push(left);
    
    // branch right
    const rightDir = node.dir.clone().applyAxisAngle(new THREE.Vector3(0,1,0), -Math.PI/2 + (rng()-0.5)*0.4);
    const right = new LNode(
      node.pos.clone().add(rightDir.multiplyScalar(GRID_SIZE)),
      rightDir,
      node.depth + 1
    );
    node.children.push(right);
    allNodes.push(right);
    
    expandNode(stem);
    if (rng() > 0.3) expandNode(left);
    if (rng() > 0.3) expandNode(right);
    
  } else if (r < 0.7){
    // Rule: R -> R [^F] [vF] R (vertical branches)
    const stem = new LNode(
      node.pos.clone().add(node.dir.clone().multiplyScalar(GRID_SIZE)),
      node.dir.clone(),
      node.depth + 1
    );
    node.children.push(stem);
    allNodes.push(stem);
    
    // branch up
    const upDir = new THREE.Vector3(0, 1, 0);
    const up = new LNode(
      node.pos.clone().add(upDir.multiplyScalar(GRID_SIZE)),
      upDir,
      node.depth + 1
    );
    node.children.push(up);
    allNodes.push(up);
    
    expandNode(stem);
    if (rng() > 0.4) expandNode(up);
    
  } else {
    // Rule: F (just extend forward)
    const next = new LNode(
      node.pos.clone().add(node.dir.clone().multiplyScalar(GRID_SIZE)),
      node.dir.clone(),
      node.depth + 1
    );
    node.children.push(next);
    allNodes.push(next);
    expandNode(next);
  }
}

// Generate structure — 3 starting roots
for (let i = 0; i < 3; i++){
  const startPos = new THREE.Vector3(
    (i - 1) * 4 + (rng() - 0.5) * 2,
    0,
    (rng() - 0.5) * 3
  );
  const startDir = new THREE.Vector3(
    (rng() - 0.5) * 0.4,
    0.3 + rng() * 0.3,
    (rng() - 0.5) * 0.4
  ).normalize();
  const root = new LNode(startPos, startDir, 0);
  roots.push(root);
  allNodes.push(root);
  expandNode(root);
}

// ── Materials
const cinderMat = new THREE.MeshStandardMaterial({
  color: 0x5a5550,
  roughness: 0.85,
  metalness: 0.05
});
const rebarMat = new THREE.MeshStandardMaterial({
  color: 0x3a3330,
  roughness: 0.9,
  metalness: 0.2,
  emissive: 0x000000
});
const glitchMat = new THREE.MeshStandardMaterial({
  color: 0x00ffcc,
  emissive: 0x00ffcc,
  emissiveIntensity: 0.6,
  roughness: 0.3,
  metalness: 0.7
});

// ── Create boxes for all nodes
const boxGeo = new THREE.BoxGeometry(GRID_SIZE * 0.85, GRID_SIZE * 0.85, GRID_SIZE * 0.85);
allNodes.forEach(node => {
  const mat = rng() < 0.08 ? glitchMat : (rng() < 0.3 ? rebarMat : cinderMat);
  const mesh = new THREE.Mesh(boxGeo, mat);
  mesh.position.copy(node.pos);
  mesh.rotation.set(
    (rng() - 0.5) * 0.15,
    (rng() - 0.5) * 0.15,
    (rng() - 0.5) * 0.15
  );
  node.box = mesh;
  scene.add(mesh);
});

// ── Ground plane — concrete slab with grid lines
const groundGeo = new THREE.PlaneGeometry(60, 60, 20, 20);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a1815,
  roughness: 0.95,
  metalness: 0.0,
  wireframe: false
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.y = -0.5;
scene.add(ground);

// Grid overlay
const gridHelper = new THREE.GridHelper(60, 30, 0x2a2520, 0x1a1510);
gridHelper.position.y = -0.49;
scene.add(gridHelper);

// ── Collapse cycle — every 4 seconds
const CYCLE_DURATION = 4.0; // seconds
const BUILD_PHASE = 2.5;
const COLLAPSE_PHASE = 1.5;

let cycleTime = 0;
const collapseQueue = [];

function triggerCollapse(){
  // Mark 30-50% of nodes for collapse, biased toward higher/outer nodes
  const numToCollapse = Math.floor(allNodes.length * (0.3 + rng() * 0.2));
  const candidates = allNodes.filter(n => n.state === 'stable');
  
  // Sort by height + distance from origin (prefer tall outer nodes)
  candidates.sort((a, b) => {
    const scoreA = a.pos.y * 2 + a.pos.length();
    const scoreB = b.pos.y * 2 + b.pos.length();
    return scoreB - scoreA;
  });
  
  for (let i = 0; i < numToCollapse && i < candidates.length; i++){
    const node = candidates[i];
    node.state = 'collapsing';
    node.collapseVel.set(
      (rng() - 0.5) * 0.08,
      -0.02 - rng() * 0.05,
      (rng() - 0.5) * 0.08
    );
    collapseQueue.push(node);
  }
}

function resetStructure(){
  // Return all nodes to building state
  allNodes.forEach(node => {
    node.state = 'building';
    node.lifetime = 0;
    node.collapseVel.set(0, 0, 0);
    node.box.position.copy(node.pos);
    node.box.rotation.set(
      (rng() - 0.5) * 0.15,
      (rng() - 0.5) * 0.15,
      (rng() - 0.5) * 0.15
    );
    node.box.visible = true;
  });
  collapseQueue.length = 0;
}

// ── Camera orbit
const cameraTarget = new THREE.Vector3(0, 6, 0);
const cameraOrbit = {
  radius: 26,
  speed: 0.05,
  heightOscillation: 3.0
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const dt = 1 / 60;

  // Cycle management
  cycleTime = elapsed % CYCLE_DURATION;
  
  if (cycleTime < BUILD_PHASE){
    // Building phase — nodes fade in progressively
    const buildProgress = cycleTime / BUILD_PHASE;
    allNodes.forEach(node => {
      if (node.state === 'building'){
        node.lifetime += dt;
        const targetTime = node.depth * 0.3;
        if (node.lifetime >= targetTime){
          node.state = 'stable';
          node.box.visible = true;
        } else {
          node.box.visible = false;
        }
      }
    });
  } else {
    // Collapse phase
    if (collapseQueue.length === 0){
      triggerCollapse();
    }
    
    // Update collapsing nodes
    collapseQueue.forEach(node => {
      if (node.state === 'collapsing'){
        // Apply gravity + lateral drift
        node.collapseVel.y -= 0.004;
        node.box.position.add(node.collapseVel);
        
        // Tumble
        node.box.rotation.x += node.collapseVel.x * 0.5;
        node.box.rotation.z += node.collapseVel.z * 0.5;
        
        // Check if fallen through ground
        if (node.box.position.y < -2){
          node.state = 'fallen';
          node.box.visible = false;
        }
      }
    });
  }
  
  // Reset at cycle boundary
  if (cycleTime < dt){
    resetStructure();
  }
  
  // Camera orbit — slow circle, gentle vertical oscillation
  const angle = elapsed * cameraOrbit.speed;
  camera.position.set(
    Math.cos(angle) * cameraOrbit.radius,
    14 + Math.sin(elapsed * 0.15) * cameraOrbit.heightOscillation,
    Math.sin(angle) * cameraOrbit.radius
  );
  camera.lookAt(cameraTarget);
  
  // Pulse accent light on collapse phase
  if (cycleTime >= BUILD_PHASE){
    accentLight.intensity = 0.8 + Math.sin(elapsed * 8) * 0.4;
  } else {
    accentLight.intensity = 0.3;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
