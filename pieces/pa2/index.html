<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pa2 · cumulus border drift</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.50; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.40; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">pa2 · cumulus border drift</div>
<div class="hint">drag to orbit · border at x=0 (red tint crosses line)</div>
<div class="src">morakana (lumen prize 2025 gold) · curl-noise advection · 85k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0c, 0.012);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 28, 65);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ────────────── curl-noise field: 3D Perlin + curl operator
// simplified Perlin-like noise using sin/cos basis (deterministic, no lookup tables)
function hash3(x, y, z){
  const a = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  const b = Math.sin(x * 93.989 + y * 67.345 + z * 89.232) * 28476.453;
  const c = Math.sin(x * 45.678 + y * 23.456 + z * 67.890) * 19283.746;
  return [a - Math.floor(a), b - Math.floor(b), c - Math.floor(c)];
}
function grad3(i, j, k, x, y, z){
  const [gx, gy, gz] = hash3(i, j, k);
  const dx = x - i, dy = y - j, dz = z - k;
  return (gx - 0.5) * dx + (gy - 0.5) * dy + (gz - 0.5) * dz;
}
function perlin(x, y, z){
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  const w = fz * fz * (3 - 2 * fz);
  const c000 = grad3(ix, iy, iz, x, y, z);
  const c100 = grad3(ix+1, iy, iz, x, y, z);
  const c010 = grad3(ix, iy+1, iz, x, y, z);
  const c110 = grad3(ix+1, iy+1, iz, x, y, z);
  const c001 = grad3(ix, iy, iz+1, x, y, z);
  const c101 = grad3(ix+1, iy, iz+1, x, y, z);
  const c011 = grad3(ix, iy+1, iz+1, x, y, z);
  const c111 = grad3(ix+1, iy+1, iz+1, x, y, z);
  const x00 = c000 * (1 - u) + c100 * u;
  const x10 = c010 * (1 - u) + c110 * u;
  const x01 = c001 * (1 - u) + c101 * u;
  const x11 = c011 * (1 - u) + c111 * u;
  const y0 = x00 * (1 - v) + x10 * v;
  const y1 = x01 * (1 - v) + x11 * v;
  return y0 * (1 - w) + y1 * w;
}

// curl( perlin-potential-field ) = divergence-free flow
function curl(x, y, z, t){
  const eps = 0.2;
  const scale = 0.12;
  const xs = x * scale, ys = y * scale, zs = z * scale;
  const ts = t * 0.15;
  const px = perlin(xs, ys, zs + ts);
  const py = perlin(xs + ts, ys, zs);
  const pz = perlin(xs, ys + ts, zs);
  const dzdx = (perlin(xs + eps, ys, zs) - px) / eps;
  const dzdy = (perlin(xs, ys + eps, zs) - px) / eps;
  const dxdy = (perlin(xs, ys + eps, zs) - py) / eps;
  const dxdz = (perlin(xs, ys, zs + eps) - py) / eps;
  const dydz = (perlin(xs, ys, zs + eps) - pz) / eps;
  const dydx = (perlin(xs + eps, ys, zs) - pz) / eps;
  return new THREE.Vector3(
    dydz - dzdy,
    dzdx - dxdz,
    dxdy - dydx
  );
}

// ────────────── particle field: 85k particles in 4 cloud clusters
// clusters spawn at x=-35 (west), drift east +0.2 units/s base wind + curl micro-motion
// border at x=0: crossing triggers red tint (oxidized geopolitical marker)
const N = 85000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const crossTime = new Float32Array(N);  // time when particle crossed x=0 (or -1 if not yet)

// 4 cloud clusters: different altitudes, densities, spawn-times
const clusters = [
  { cx: -35, cy: 5,  cz: -12, rx: 8,  ry: 3.5, rz: 10, count: 22000, delay: 0 },
  { cx: -35, cy: 12, cz: 8,   rx: 10, ry: 4,   rz: 12, count: 25000, delay: 1.2 },
  { cx: -35, cy: 18, cz: -5,  rx: 7,  ry: 3,   rz: 8,  count: 18000, delay: 2.5 },
  { cx: -35, cy: 9,  cz: 20,  rx: 9,  ry: 3.5, rz: 11, count: 20000, delay: 4.0 }
];
let idx = 0;
for (const cl of clusters){
  for (let i = 0; i < cl.count; i++){
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = Math.pow(Math.random(), 0.6);
    positions[idx*3]   = cl.cx + r * cl.rx * Math.sin(ph) * Math.cos(th);
    positions[idx*3+1] = cl.cy + r * cl.ry * Math.cos(ph);
    positions[idx*3+2] = cl.cz + r * cl.rz * Math.sin(ph) * Math.sin(th);
    velocities[idx*3]   = 0.2 + Math.random() * 0.1;  // base eastward drift
    velocities[idx*3+1] = (Math.random() - 0.5) * 0.02;
    velocities[idx*3+2] = (Math.random() - 0.5) * 0.03;
    seeds[idx] = Math.random();
    crossTime[idx] = -1;
    idx++;
  }
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('crossTime', new THREE.BufferAttribute(crossTime, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute vec3 velocity;
    attribute float seed;
    attribute float crossTime;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vCross;
    void main(){
      vec3 p = position;
      float t = uTime;
      
      // curl-noise micro-motion (high-frequency atmospheric turbulence)
      float scale = 0.12;
      float ts = t * 0.15;
      float xs = p.x * scale, ys = p.y * scale, zs = p.z * scale;
      // simplified curl approximation: sin-based pseudo-curl
      float cx = sin(ys + zs + ts) * cos(xs);
      float cy = sin(xs + zs + ts * 0.9) * cos(ys);
      float cz = sin(xs + ys + ts * 1.1) * cos(zs);
      vec3 curlVel = vec3(cx, cy, cz) * 0.3;
      
      // base eastward wind + curl
      vec3 drift = velocity * t + curlVel * t;
      p += drift;
      
      // wrap-around: if particle drifts past x=+40, respawn at x=-40 (continuous cloud belt)
      if (p.x > 40.0) {
        p.x -= 80.0;
      }
      
      vCross = crossTime;
      
      // palette: bone-white base (#f4f1ec → rgb 0.96,0.95,0.93), dust (#c8bfb5 → 0.78,0.75,0.71)
      // if crossed border (x≥0 and crossTime ≥ 0), tint toward oxidized red (#8b4038 → 0.55,0.25,0.22)
      vec3 cloudWhite = vec3(0.96, 0.95, 0.93);
      vec3 cloudDust  = vec3(0.78, 0.75, 0.71);
      vec3 borderRed  = vec3(0.55, 0.25, 0.22);
      
      float height = (p.y - 5.0) / 15.0;
      vec3 base = mix(cloudDust, cloudWhite, smoothstep(0.3, 1.0, height));
      
      // crossing marker: if particle crossed x=0, fade red in over 1.5s then persist at 40% intensity
      float sinceXing = (crossTime >= 0.0) ? (t - crossTime) : -1.0;
      float redMix = 0.0;
      if (sinceXing >= 0.0){
        redMix = smoothstep(0.0, 1.5, sinceXing) * 0.4;
      }
      vCol = mix(base, borderRed, redMix);
      
      // fog-like density variation by seed
      vAlpha = 0.4 + 0.6 * seed;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.8 * seed) * uPixel * (70.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vCross;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float soft = exp(-r * 12.0);
      float a = soft * vAlpha * 0.6;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── invisible border plane at x=0 (for visual reference — not rendered)
// instead we'll just update the crossTime attribute in the loop

// ────────────── ground reference: faint grid at y=0 (earth-plane)
const gridHelper = new THREE.GridHelper(80, 40, 0x1a1a1c, 0x14141a);
gridHelper.position.y = 0;
scene.add(gridHelper);

// subtle ambient + directional (high-altitude sun from southeast)
const ambient = new THREE.AmbientLight(0x1a1a20, 0.3);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xf4f1ec, 0.5);
sun.position.set(15, 25, -10);
scene.add(sun);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
const pos = geom.attributes.position.array;
const vel = geom.attributes.velocity.array;
const xTime = geom.attributes.crossTime.array;
const seed = geom.attributes.seed.array;

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // update particles: advect by curl + base wind, check border crossing
  for (let i = 0; i < N; i++){
    const px = pos[i*3], py = pos[i*3+1], pz = pos[i*3+2];
    const vx = vel[i*3], vy = vel[i*3+1], vz = vel[i*3+2];
    const s = seed[i];
    
    // curl-noise field sample
    const c = curl(px, py, pz, t);
    const dt = 0.016;
    const nx = px + (vx + c.x * 0.3) * dt;
    const ny = py + (vy + c.y * 0.3) * dt;
    const nz = pz + (vz + c.z * 0.3) * dt;
    
    // wrap x at +40 → -40
    pos[i*3]   = nx > 40 ? nx - 80 : nx;
    pos[i*3+1] = ny;
    pos[i*3+2] = nz;
    
    // border crossing detection: if particle was west of x=0 and now ≥ 0, mark crossTime
    if (xTime[i] < 0 && px < 0 && pos[i*3] >= 0){
      xTime[i] = t;
    }
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.crossTime.needsUpdate = true;
  
  // slow camera drift (satellite POV: slight eastward pan over time)
  const cameraX = Math.sin(t * 0.03) * 8;
  const cameraZ = 65 + Math.cos(t * 0.04) * 5;
  camera.position.x = cameraX;
  camera.position.z = cameraZ;
  camera.lookAt(0, 10, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
