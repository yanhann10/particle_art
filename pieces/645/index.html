<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>645 · abyssal lorenz</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#020810; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">645</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020810, 1);
document.body.appendChild(renderer.domElement);

// --- ping-pong state ---
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// velocity ping-pong for momentum
let rtVelA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtVelB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
const initVel = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 6.0;
  init[i*4+1] = (Math.random()*2-1) * 6.0;
  init[i*4+2] = (Math.random()*2-1) * 6.0 + 25.0;
  init[i*4+3] = Math.random();
  initVel[i*4] = 0; initVel[i*4+1] = 0; initVel[i*4+2] = 0; initVel[i*4+3] = 0;
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;
const initVelTex = new THREE.DataTexture(initVel, W, H, THREE.RGBAFormat, THREE.FloatType);
initVelTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

blitMat.uniforms.tex.value = initTex;
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
blitMat.uniforms.tex.value = initVelTex;
renderer.setRenderTarget(rtVelA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// --- simulation with momentum ---
const simUniforms = {
  prev:    { value: null },
  prevVel: { value: null },
  uDt:     { value: 0.003 },
  uSigma:  { value: 10.0 },
  uRho:    { value: 28.0 },
  uBeta:   { value: 8.0/3.0 },
  uDrag:   { value: 0.985 },
  uInertia:{ value: 0.12 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform sampler2D prevVel;
    uniform float uDt, uSigma, uRho, uBeta, uDrag, uInertia;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec4 v = texture2D(prevVel, vUv);
      vec3 p = s.xyz;
      vec3 vel = v.xyz;
      float age = s.w;
      vec3 force = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      // momentum: blend force into velocity with inertia
      vel = vel * uDrag + force * uInertia * uDt;
      p += vel * uDt;
      age = mod(age + uDt * 0.02, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
// separate pass to write velocity
const velMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform sampler2D prevVel;
    uniform float uDt, uSigma, uRho, uBeta, uDrag, uInertia;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec4 v = texture2D(prevVel, vUv);
      vec3 p = s.xyz;
      vec3 vel = v.xyz;
      vec3 force = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      vel = vel * uDrag + force * uInertia * uDt;
      gl_FragColor = vec4(vel, 0.0);
    }
  `
});
const simScene = new THREE.Scene();
const simMesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat);
simScene.add(simMesh);

const velScene = new THREE.Scene();
velScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), velMat));

// --- render scene ---
const scene = new THREE.Scene();

// background gradient: deep ocean dusk
const bgGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      // vertical gradient: deep midnight at bottom, dark teal-navy at top
      vec3 bottom = vec3(0.008, 0.012, 0.035);
      vec3 mid    = vec3(0.015, 0.045, 0.09);
      vec3 top    = vec3(0.04, 0.065, 0.105);
      float t = vUv.y;
      vec3 col = mix(bottom, mid, smoothstep(0.0, 0.45, t));
      col = mix(col, top, smoothstep(0.45, 1.0, t));
      // subtle vignette
      vec2 vc = (vUv - 0.5) * 2.0;
      float vig = 1.0 - dot(vc, vc) * 0.25;
      gl_FragColor = vec4(col * vig, 1.0);
    }
  `
});
const bgMesh = new THREE.Mesh(bgGeo, bgMat);
bgMesh.renderOrder = -1000;
bgMesh.frustumCulled = false;
const bgScene = new THREE.Scene();
bgScene.add(bgMesh);
const bgCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 10, 90);

// --- main particles ---
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: null },
    stateVel: { value: null },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 },
    uFogNear: { value: 30.0 },
    uFogFar:  { value: 140.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform sampler2D stateVel;
    uniform float uPixel, uTime, uFogNear, uFogFar;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vFog;
    varying float vDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec4 v = texture2D(stateVel, uvIdx);
      vec3 p = s.xyz;
      float speed = length(v.xyz) * 0.003;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      p.z -= 25.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vDepth = dist;
      // atmospheric fog: particles fade into the deep
      vFog = smoothstep(uFogNear, uFogFar, dist);
      gl_PointSize = (1.0 + 1.8 * vSpeed) * uPixel * (55.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge, vSpeed, vFog, vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      // Memo Akten oceanic palette:
      // deep midnight blue → teal → phosphorescent cyan → warm dusk highlight
      vec3 c0 = vec3(0.06, 0.10, 0.28);  // midnight blue
      vec3 c1 = vec3(0.05, 0.22, 0.38);  // deep teal
      vec3 c2 = vec3(0.12, 0.48, 0.58);  // ocean teal
      vec3 c3 = vec3(0.30, 0.72, 0.78);  // phosphorescent cyan
      vec3 c4 = vec3(0.55, 0.42, 0.32);  // warm dusk amber (rare accent)
      float k = mod(vAge + vSpeed * 0.3, 1.0);
      vec3 col = mix(c0, c1, smoothstep(0.0, 0.25, k));
      col = mix(col, c2, smoothstep(0.25, 0.5, k));
      col = mix(col, c3, smoothstep(0.5, 0.75, k));
      col = mix(col, c4, smoothstep(0.85, 1.0, k));
      // speed-dependent luminance — faster particles glow brighter
      float lum = 0.35 + vSpeed * 0.65;
      // fog fades particles toward background
      float fogAlpha = 1.0 - vFog * 0.92;
      // distant particles shift cooler
      vec3 fogCol = vec3(0.02, 0.04, 0.08);
      col = mix(col, fogCol, vFog * 0.6);
      gl_FragColor = vec4(col * a * lum, a * fogAlpha * (0.5 + vSpeed * 0.5));
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// --- foreground dust motes for depth ---
const dustCount = 800;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustPhase = new Float32Array(dustCount);
for (let i = 0; i < dustCount; i++){
  dustPos[i*3]   = (Math.random()-0.5) * 160;
  dustPos[i*3+1] = (Math.random()-0.5) * 100;
  dustPos[i*3+2] = (Math.random()-0.5) * 160;
  dustPhase[i] = Math.random() * Math.PI * 2;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('phase', new THREE.BufferAttribute(dustPhase, 1));

const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float phase;
    uniform float uTime;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // gentle vertical drift
      p.y += sin(uTime * 0.08 + phase) * 2.5;
      p.x += cos(uTime * 0.05 + phase * 1.3) * 1.5;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      vAlpha = smoothstep(120.0, 20.0, dist) * smoothstep(1.0, 5.0, dist);
      vAlpha *= (0.3 + 0.7 * sin(uTime * 0.15 + phase * 2.0) * 0.5 + 0.5);
      gl_PointSize = max(1.0, 2.5 * (40.0 / max(dist, 1.0)));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 10.0);
      vec3 col = vec3(0.15, 0.30, 0.42);
      gl_FragColor = vec4(col * a, a * vAlpha * 0.12);
    }
  `
});
const dustPoints = new THREE.Points(dustGeo, dustMat);
scene.add(dustPoints);

// --- volumetric fog plane between layers ---
const fogPlaneGeo = new THREE.PlaneGeometry(200, 120, 1, 1);
const fogPlaneMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      float fog = exp(-d * d * 3.0);
      // slowly shifting color
      float t = sin(uTime * 0.04) * 0.5 + 0.5;
      vec3 col = mix(vec3(0.02, 0.06, 0.12), vec3(0.04, 0.09, 0.14), t);
      float alpha = fog * 0.06;
      gl_FragColor = vec4(col, alpha);
    }
  `
});
const fogPlane = new THREE.Mesh(fogPlaneGeo, fogPlaneMat);
fogPlane.position.z = -15.0;
scene.add(fogPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// --- interaction: extremely slow LERP, Memo Akten style ---
// target params drift toward pointer over many seconds
const current = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
const target  = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 4.0;
  target.sigma = 10.0 + nx * 1.5;
  target.beta  = 8.0/3.0 + nx * ny * 0.3;
});

// camera rail: very slow figure-8 path with vertical sway
function cameraRail(t) {
  const s = t * 0.000025; // extremely slow
  const r = 85.0 + Math.sin(s * 0.7) * 12.0;
  const x = Math.sin(s) * r;
  const z = Math.cos(s * 0.618) * r; // golden ratio offset for figure-8 feel
  const y = Math.sin(s * 0.4) * 8.0 + 5.0;
  return new THREE.Vector3(x, y, z);
}

let lastTime = performance.now();
const startTime = lastTime;

function loop(){
  const now = performance.now();
  const elapsed = now - startTime;
  lastTime = now;

  // very slow parameter easing (alpha ~0.006 per frame ≈ 3-5 second integration)
  const lerpAlpha = 0.006;
  current.sigma += (target.sigma - current.sigma) * lerpAlpha;
  current.rho   += (target.rho   - current.rho)   * lerpAlpha;
  current.beta  += (target.beta  - current.beta)   * lerpAlpha;

  simUniforms.uSigma.value = current.sigma;
  simUniforms.uRho.value   = current.rho;
  simUniforms.uBeta.value  = current.beta;

  // step sim: write velocity, then position
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    simUniforms.prevVel.value = rtVelA.texture;

    // write new velocity
    simMesh.material = velMat;
    renderer.setRenderTarget(rtVelB);
    renderer.render(simScene, camOrtho);
    let tmpV = rtVelA; rtVelA = rtVelB; rtVelB = tmpV;

    // write new position
    simUniforms.prevVel.value = rtVelA.texture;
    simMesh.material = simMat;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    let tmpP = rtA; rtA = rtB; rtB = tmpP;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.stateVel.value = rtVelA.texture;
  pointsMat.uniforms.uTime.value = elapsed / 1000;
  dustMat.uniforms.uTime.value = elapsed / 1000;
  fogPlaneMat.uniforms.uTime.value = elapsed / 1000;

  // camera on slow rail
  const camPos = cameraRail(elapsed);
  camera.position.lerp(camPos, 0.015); // smooth camera motion too
  // look-at drifts slowly toward attractor center
  const lookTarget = new THREE.Vector3(
    Math.sin(elapsed * 0.00003) * 3.0,
    Math.cos(elapsed * 0.00004) * 2.0,
    0.0
  );
  camera.lookAt(lookTarget);

  // fog plane always faces camera, sits between cam and attractor
  const fogPos = camera.position.clone().lerp(lookTarget, 0.55);
  fogPlane.position.copy(fogPos);
  fogPlane.lookAt(camera.position);

  // render background first, then scene
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
