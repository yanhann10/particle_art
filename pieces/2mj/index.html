<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2mj · collective breathing field</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a14; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .status { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; line-height: 1.6; }
  .count { color:#88c0d0; font-weight: 600; }
</style>
</head>
<body>
<div class="id">2mj</div>
<div class="status" id="status">
  connecting to shared field…<br>
  <span class="count" id="count">0</span> active participants
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a14, 1);
document.body.appendChild(renderer.domElement);

// shared state pool — each tab contributes breath cycles
const breathPool = [];
const MAX_POOL = 20;
let myBreathPhase = Math.random() * Math.PI * 2;
let myBreathRate = 0.8 + Math.random() * 0.4;
let participantCount = 1;

// BroadcastChannel for same-origin tabs
let channel = null;
try {
  channel = new BroadcastChannel('relational_field');
  channel.onmessage = (e) => {
    if (e.data.type === 'breath') {
      breathPool.push({ phase: e.data.phase, rate: e.data.rate, time: performance.now() });
      if (breathPool.length > MAX_POOL) breathPool.shift();
    } else if (e.data.type === 'hello') {
      participantCount = Math.max(1, e.data.count || 1);
      channel.postMessage({ type: 'hello', count: participantCount + 1 });
    } else if (e.data.type === 'ping') {
      participantCount = Math.max(1, e.data.count || 1);
    }
  };
  channel.postMessage({ type: 'hello', count: 1 });
  setInterval(() => {
    channel.postMessage({ type: 'ping', count: participantCount });
  }, 2000);
} catch (e) {
  console.warn('BroadcastChannel unavailable');
}

// WebSocket fallback to public crypto ticker for external pulse
let ws = null;
let lastPrice = 0;
let priceVelocity = 0;
try {
  ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
  ws.onopen = () => {
    document.getElementById('status').innerHTML = 
      'connected to shared field + binance stream<br><span class="count" id="count">' + participantCount + '</span> active participants';
  };
  ws.onmessage = (e) => {
    const trade = JSON.parse(e.data);
    const price = parseFloat(trade.p);
    if (lastPrice > 0) {
      priceVelocity = (price - lastPrice) / lastPrice;
    }
    lastPrice = price;
  };
  ws.onerror = ws.onclose = () => {
    document.getElementById('status').innerHTML = 
      'local field only (websocket unavailable)<br><span class="count" id="count">' + participantCount + '</span> active participants';
  };
} catch (e) {
  console.warn('WebSocket unavailable');
}

// particle field — individual motes that follow collective breath
const N = 18000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const clusters = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r = 8 + Math.random() * 14;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  seeds[i] = Math.random();
  clusters[i] = Math.floor(Math.random() * 8);
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('cluster', new THREE.BufferAttribute(clusters, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBreath: { value: 0 },
  uCollective: { value: 0 },
  uExternalPulse: { value: 0 },
  uParticipants: { value: 1 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBreath;
    uniform float uCollective;
    uniform float uExternalPulse;
    uniform float uParticipants;
    attribute float seed;
    attribute float cluster;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      float r = length(p);
      vec3 dir = normalize(p);
      
      // individual breath modulated by collective field
      float myBreath = sin(uTime * (0.6 + seed * 0.4) + seed * 6.28) * 0.5 + 0.5;
      float breathMix = mix(myBreath, uCollective, 0.7);
      
      // radial expansion on inhale, contraction on exhale
      float expansion = 1.0 + (breathMix - 0.5) * 1.8;
      p = dir * r * expansion;
      
      // cluster rotation — each cluster phase-locked to participant count
      float clusterPhase = cluster * 0.785 + uParticipants * 0.1;
      float angle = uTime * 0.15 + clusterPhase;
      float c = cos(angle);
      float s = sin(angle);
      float px = p.x * c - p.z * s;
      float pz = p.x * s + p.z * c;
      p.x = px;
      p.z = pz;
      
      // external price pulse creates turbulence
      vec3 turbulence = vec3(
        sin(seed * 17.3 + uTime * 2.0),
        sin(seed * 23.1 + uTime * 1.7),
        sin(seed * 31.7 + uTime * 2.3)
      ) * uExternalPulse * 2.5;
      p += turbulence;
      
      // color: cold silver → warm rose based on breath sync
      vec3 silver = vec3(0.82, 0.88, 0.92);
      vec3 rose = vec3(0.98, 0.65, 0.72);
      float sync = abs(myBreath - uCollective);
      vCol = mix(rose, silver, sync);
      vCol *= (0.5 + breathMix * 0.8);
      
      vAlpha = (0.3 + breathMix * 0.7) * (1.0 - sync * 0.5);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeBase = 0.8 + breathMix * 1.4;
      gl_PointSize = sizeBase * uPixel * (55.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ambient fog
scene.fog = new THREE.FogExp2(0x0f0a14, 0.018);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// breathing mechanics
function computeCollectiveBreath(t) {
  // my breath
  myBreathPhase += 0.016 * myBreathRate;
  const myBreath = Math.sin(myBreathPhase) * 0.5 + 0.5;
  
  // average of breath pool from other tabs
  const now = performance.now();
  const recentBreaths = breathPool.filter(b => now - b.time < 5000);
  if (recentBreaths.length > 0) {
    const sum = recentBreaths.reduce((acc, b) => {
      return acc + (Math.sin(t * b.rate + b.phase) * 0.5 + 0.5);
    }, 0);
    const avgBreath = sum / recentBreaths.length;
    return (myBreath + avgBreath) / 2;
  }
  return myBreath;
}

// broadcast my breath state
setInterval(() => {
  if (channel) {
    channel.postMessage({ 
      type: 'breath', 
      phase: myBreathPhase, 
      rate: myBreathRate 
    });
  }
}, 200);

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // update breath fields
  const myBreath = Math.sin(myBreathPhase) * 0.5 + 0.5;
  const collective = computeCollectiveBreath(t);
  uniforms.uBreath.value = myBreath;
  uniforms.uCollective.value = collective;
  uniforms.uParticipants.value = participantCount;
  
  // external price pulse decays over 2 seconds
  uniforms.uExternalPulse.value *= 0.95;
  if (Math.abs(priceVelocity) > 0.0001) {
    uniforms.uExternalPulse.value = Math.min(1, Math.abs(priceVelocity * 5000));
    priceVelocity *= 0.9;
  }
  
  // gentle orbital camera influenced by collective
  camera.position.x = Math.sin(t * 0.08) * 6;
  camera.position.y = Math.cos(t * 0.05) * 4;
  camera.lookAt(0, 0, 0);
  
  // update participant count display
  const countEl = document.getElementById('count');
  if (countEl) countEl.textContent = participantCount;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

// cleanup
window.addEventListener('beforeunload', () => {
  if (channel) {
    participantCount = Math.max(1, participantCount - 1);
    channel.postMessage({ type: 'ping', count: participantCount });
    channel.close();
  }
  if (ws) ws.close();
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
