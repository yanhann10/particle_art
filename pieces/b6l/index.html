<style>

<div class="id">b6l</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.014);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.3));
const pL = new THREE.PointLight(0xffd0b0, 0.45, 50, 1.8);
pL.position.set(2, 9, -2);
scene.add(pL);

let seed = 83741926;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── SUSPENDED SPHERE — pale soul, luminous core
const sphereR = 2.2;
const spherePos = new THREE.Vector3(1.8, 2.5, -1.2);
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.65,
    roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.72
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── SUSPENDED DRESS — the remembered body (Shiota's signature)
const dressPos = new THREE.Vector3(spherePos.x - 0.6, spherePos.y - 6.0, spherePos.z + 0.3);
const dressVerts = [];
const dressIdx = [];
const NUM_RIBS = 18;
const NUM_LEVELS = 14;

function dressRadius(y){
  const t = y / 3.6;
  if(t > 0.92) return 0.15;
  if(t > 0.78) return 0.22 + (0.92 - t) * 2.8;
  if(t > 0.55) return 0.62 - (t - 0.55) * 0.35;
  if(t > 0.38) return 0.54;
  return 0.54 + (0.38 - t) * 2.1;
}

for(let l = 0; l < NUM_LEVELS; l++){
  const y = (l / (NUM_LEVELS - 1)) * 3.6;
  const r = dressRadius(y);
  for(let ri = 0; ri < NUM_RIBS; ri++){
    const a = (ri / NUM_RIBS) * Math.PI * 2;
    const wobble = 1.0 + (rng() - 0.5) * 0.06;
    dressVerts.push(Math.cos(a) * r * wobble, y, Math.sin(a) * r * wobble);
  }
}
// Hanger point
dressVerts.push(0, 3.85, 0);
const hangerIdx = NUM_LEVELS * NUM_RIBS;

// Vertical ribs
for(let ri = 0; ri < NUM_RIBS; ri++){
  for(let l = 0; l < NUM_LEVELS - 1; l++){
    dressIdx.push(l * NUM_RIBS + ri, (l + 1) * NUM_RIBS + ri);
  }
  // Top ring to hanger
  dressIdx.push((NUM_LEVELS - 1) * NUM_RIBS + ri, hangerIdx);
}
// Horizontal rings
for(let l = 0; l < NUM_LEVELS; l++){
  for(let ri = 0; ri < NUM_RIBS; ri++){
    dressIdx.push(l * NUM_RIBS + ri, l * NUM_RIBS + (ri + 1) % NUM_RIBS);
  }
}
// Diagonal cross-threads on skirt (lower 5 levels)
for(let l = 0; l < 5; l++){
  for(let ri = 0; ri < NUM_RIBS; ri += 2){
    dressIdx.push(l * NUM_RIBS + ri, (l + 1) * NUM_RIBS + (ri + 1) % NUM_RIBS);
  }
}

const dressFA = new Float32Array(dressVerts);
const dressGeo = new THREE.BufferGeometry();
dressGeo.setAttribute('position', new THREE.BufferAttribute(dressFA, 3));
dressGeo.setIndex(dressIdx);
const dress = new THREE.LineSegments(dressGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a08, transparent: true, opacity: 0.6
}));
dress.position.copy(dressPos);
scene.add(dress);

// Store base dress positions for sway animation
const baseDressPos = new Float32Array(dressFA);

// ── ROOM VOLUME
const ROOM = { w: 38, h: 26, d: 46 };
const hw = ROOM.w / 2, hh = ROOM.h / 2, hd = ROOM.d / 2;

function wallPt(){
  const f = Math.floor(rng() * 6);
  let x, y, z;
  switch(f){
    case 0: x = -hw; y = (rng() - 0.5) * ROOM.h; z = (rng() - 0.5) * ROOM.d; break;
    case 1: x = hw;  y = (rng() - 0.5) * ROOM.h; z = (rng() - 0.5) * ROOM.d; break;
    case 2: y = -hh; x = (rng() - 0.5) * ROOM.w; z = (rng() - 0.5) * ROOM.d; break;
    case 3: y = hh;  x = (rng() - 0.5) * ROOM.w; z = (rng() - 0.5) * ROOM.d; break;
    case 4: z = -hd; x = (rng() - 0.5) * ROOM.w; y = (rng() - 0.5) * ROOM.h; break;
    default:z = hd;  x = (rng() - 0.5) * ROOM.w; y = (rng() - 0.5) * ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS
const anchors = [];
const centroid = spherePos.clone().add(dressPos).multiplyScalar(0.5);

// Icosahedral skeleton (Mohr)
const phi = (1 + Math.sqrt(5)) / 2;
const icoV = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoV){
  anchors.push(new THREE.Vector3(v[0]*7.5 + centroid.x, v[1]*6.0 + centroid.y, v[2]*7.5 + centroid.z));
}

// Suspension ceiling anchors — sphere
const suspAnchors = [];
for(let i = 0; i < 8; i++){
  const p = new THREE.Vector3(spherePos.x + (rng()-0.5)*3.5, hh, spherePos.z + (rng()-0.5)*3.5);
  suspAnchors.push(p); anchors.push(p);
}
// Suspension ceiling anchors — dress hanger
for(let i = 0; i < 6; i++){
  const p = new THREE.Vector3(dressPos.x + (rng()-0.5)*1.8, hh, dressPos.z + (rng()-0.5)*1.8);
  suspAnchors.push(p); anchors.push(p);
}

// Void zones — deliberate negative space (Tyler Hobbs)
const voids = [];
for(let i = 0; i < 3; i++){
  voids.push({
    pos: new THREE.Vector3(centroid.x + (rng()-0.5)*16, centroid.y + (rng()-0.5)*10, centroid.z + (rng()-0.5)*16),
    r: 2.0 + rng() * 1.8
  });
}
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense shell anchors
const NUM_ANCHORS = 1100;
for(let i = anchors.length; i < NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.32){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = spherePos.clone().add(dir.multiplyScalar(sphereR + 0.5 + rng() * 6.0));
  } else if(r < 0.50){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = dressPos.clone().add(dir.multiplyScalar(1.5 + rng() * 5.0));
  } else if(r < 0.72){
    p = wallPt(); p.lerp(centroid, 0.15 + rng() * 0.5);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereR));
}

function dressSurf(){
  const l = Math.floor(rng() * NUM_LEVELS);
  const ri = Math.floor(rng() * NUM_RIBS);
  const vi = (l * NUM_RIBS + ri) * 3;
  return new THREE.Vector3(dressPos.x + dressFA[vi], dressPos.y + dressFA[vi+1], dressPos.z + dressFA[vi+2]);
}

// Radial quantization near sphere (Molnar)
function quantize(p){
  const d = p.distanceTo(spherePos);
  if(d > 10) return p;
  const s = Math.max(0, 1 - d / 10);
  const dir = p.clone().sub(spherePos);
  const th = Math.atan2(dir.z, dir.x);
  const snap = 15 * Math.PI / 180;
  const snapped = Math.round(th / snap) * snap;
  const blended = th + (snapped - th) * s * 0.5;
  const horiz = Math.sqrt(dir.x * dir.x + dir.z * dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx] = a.x; positions[idx+1] = a.y; positions[idx+2] = a.z;
  positions[idx+3] = b.x; positions[idx+4] = b.y; positions[idx+5] = b.z;
  const mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5, mz = (a.z + b.z) * 0.5;
  lineDist[li] = Math.sqrt((mx - spherePos.x)**2 + (my - spherePos.y)**2 + (mz - spherePos.z)**2);
  li++;
}

// Suspension: ceiling → sphere top
for(const sa of suspAnchors.slice(0, 8)){
  for(let j = 0; j < 3; j++){
    const tgt = sphereSurf();
    tgt.y = Math.max(tgt.y, spherePos.y + sphereR * 0.4);
    setLine(sa, tgt);
  }
}

// Suspension: ceiling → dress hanger
for(const sa of suspAnchors.slice(8)){
  const hanger = new THREE.Vector3(dressPos.x, dressPos.y + 3.85, dressPos.z);
  for(let j = 0; j < 4; j++){
    const h = hanger.clone();
    h.x += (rng() - 0.5) * 0.15;
    h.z += (rng() - 0.5) * 0.15;
    setLine(sa, h);
  }
}

// Umbilical: sphere bottom → dress top
for(let i = 0; i < 50; i++){
  const a = sphereSurf();
  a.y = Math.min(a.y, spherePos.y - sphereR * 0.2);
  const b = dressSurf();
  setLine(a, b);
}

// Cat A: converging on sphere (38%) — 8% stop short (Quayola)
const catA = Math.floor(NUM_LINES * 0.38);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a = rng() < 0.5 ? anchors[Math.floor(rng() * anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantize(a);
  const target = sphereSurf();
  if(rng() < 0.08){
    // Threads that almost reach but fail — presence-in-absence
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng() * 1.5));
  }
  setLine(a, target);
}

// Cat B: converging on dress (18%)
const catB = Math.floor(NUM_LINES * 0.18);
for(let i = 0; i < catB && li < NUM_LINES; i++){
  let a = rng() < 0.4 ? anchors[Math.floor(rng() * anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  const target = dressSurf();
  if(rng() < 0.06){
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng() * 0.9));
  }
  setLine(a, target);
}

// Cat C: wall-to-wall structural web (18%)
const catC = Math.floor(NUM_LINES * 0.18);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const a = wallPt(), b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(centroid) > 18 && rng() > 0.04){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat D: dendritic branching filaments (Entangled Others)
while(li < NUM_LINES - 80){
  const ai = Math.floor(rng() * anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng() * anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.5){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Y-fork branching — 3 generations
  if(rng() < 0.25 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.3 + rng() * 0.35);
    const brDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const brEnd = mid.clone().add(brDir.multiplyScalar(0.8 + rng() * 2.0));
    if(!inVoid(brEnd)){
      setLine(mid, brEnd);
      if(rng() < 0.3 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(brEnd, 0.5);
        const br2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const brEnd2 = mid2.clone().add(br2.multiplyScalar(0.5 + rng() * 1.2));
        if(!inVoid(brEnd2)) setLine(mid2, brEnd2);
      }
    }
  }
}

// Fill remaining
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng() * anchors.length)];
  if(!inVoid(a)){
    if(rng() < 0.55) setLine(a, sphereSurf());
    else setLine(a, dressSurf());
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / memory scraps
const NUM_FRAGS = 28;
for(let i = 0; i < NUM_FRAGS; i++){
  const sz = 0.04 + rng() * 0.12;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(sz * (1.5 + rng() * 2.0), sz * 0.015, sz * (0.6 + rng()))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng() * 0.02;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d * 0.3, d * 0.2),
    transparent: true, opacity: 0.25 + rng() * 0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  if(rng() < 0.55){
    const t = 0.15 + rng() * 0.7;
    mesh.position.lerpVectors(spherePos, dressPos, t);
    mesh.position.x += (rng() - 0.5) * 3.5;
    mesh.position.y += (rng() - 0.5) * 1.5;
    mesh.position.z += (rng() - 0.5) * 3.5;
  } else {
    const si = Math.floor(rng() * li) * 6;
    const t = 0.2 + rng() * 0.6;
    mesh.position.set(
      basePositions[si] * (1 - t) + basePositions[si + 3] * t,
      basePositions[si + 1] * (1 - t) + basePositions[si + 4] * t,
      basePositions[si + 2] * (1 - t) + basePositions[si + 5] * t
    );
  }
  mesh.rotation.set(rng() * 6.28, rng() * 6.28, rng() * 6.28);
  scene.add(mesh);
}

// ── CAMERA PATH — intimate weave between sphere and dress
const pathLen = 400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = centroid.x, cy = centroid.y, cz = centroid.z;
  const x = cx + Math.sin(p) * 6.0 + Math.sin(p * 1.3 + 0.7) * 2.5 + Math.cos(p * 0.35) * 1.8;
  const y = cy + 0.5 + Math.sin(p * 0.5 + 1.0) * 4.5 + Math.cos(p * 0.38) * 1.0;
  const z = cz + Math.cos(p) * 8.0 + Math.cos(p * 0.75 + 2.0) * 2.0;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
const dressArr = dressGeo.attributes.position.array;

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── THREAD MICRO-BREATH — glacial systole centered on sphere
  const arr = lineGeo.attributes.position.array;
  const pulse = Math.sin(t * 0.065) * 0.5 + 0.5;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0025 * Math.max(0, 1.0 - dist / 20.0);
    const p = (pulse - 0.5) * amp;
    const breathPhase = basePositions[idx] * 0.2 + basePositions[idx + 1] * 0.5 + i * 0.003;
    const micro = Math.sin(t * 0.07 + breathPhase) * 0.0015;
    for(let v = 0; v < 2; v++){
      const vi = idx + v * 3;
      const bx = basePositions[vi], by = basePositions[vi + 1], bz = basePositions[vi + 2];
      const dx = spherePos.x - bx, dy = spherePos.y - by, dz = spherePos.z - bz;
      const len = Math.sqrt(dx * dx + dy * dy + dz * dz) + 0.001;
      arr[vi]     = bx + (dx / len) * p + micro * 0.6;
      arr[vi + 1] = by + (dy / len) * p + micro * 0.3;
      arr[vi + 2] = bz + (dz / len) * p + micro * 0.4;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // ── DRESS SWAY — imperceptible hem motion, as if a door opened far away
  const swayAmt = Math.sin(t * 0.04) * 0.012;
  const swayZ = Math.cos(t * 0.031 + 0.7) * 0.008;
  for(let l = 0; l < NUM_LEVELS; l++){
    const yFrac = l / (NUM_LEVELS - 1);
    const sway = (1.0 - yFrac) * swayAmt;
    const swZ = (1.0 - yFrac) * swayZ;
    for(let ri = 0; ri < NUM_RIBS; ri++){
      const vi = (l * NUM_RIBS + ri) * 3;
      dressArr[vi]     = baseDressPos[vi] + sway;
      dressArr[vi + 1] = baseDressPos[vi + 1];
      dressArr[vi + 2] = baseDressPos[vi + 2] + swZ;
    }
  }
  dressGeo.attributes.position.needsUpdate = true;

  // ── CAMERA DOLLY
  const speed = 0.002;
  const pathT = (t * speed) % 1.0;
  const fIdx = pathT * (pathLen - 1);
  const i0 = Math.floor(fIdx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], fIdx - Math.floor(fIdx));

  const look = centroid.clone();
  look.x += Math.sin(t * 0.008) * 0.6;
  look.y += Math.cos(t * 0.006) * 0.35;
  camera.lookAt(look);

  // Sphere breath
  sphere.scale.setScalar(1.0 + pulse * 0.006);
  sphere.position.y = spherePos.y + Math.sin(t * 0.01) * 0.008;

  // Light wander
  pL.position.x = 2 + Math.sin(t * 0.005) * 1.0;
  pL.position.y = 9 + Math.cos(t * 0.004) * 0.6;
  pL.position.z = -2 + Math.cos(t * 0.007) * 0.8;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
