<!doctype html>
<html lang="en">
<head>
<!-- MOTION: drift, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bhs · venus de milo · point cloud</title>
<!-- Palette rationale: cool blue-white (#d0e8f8) at top evokes marble veining and cold
     museum light on white stone; warm amber (#d08040) at base suggests earth/pedestal
     origin — classical sculpture born from the ground. Height gradient = temporal meaning:
     the divine descending into clay. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06040a; overflow:hidden;
               color:#c8c0d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id      { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint    { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src     { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.7; letter-spacing:0.08em; }
</style>
</head>
<body>
<div class="id">bhs · venus de milo · point cloud</div>
<div class="hint">drag to orbit · scroll to zoom · height gradient: marble to earth</div>
<div class="src">descended from n8q · classical sculpture point cloud</div>
<div class="loading" id="loading">loading venus geometry…</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06040a, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

const N_POINTS = 50000;
const loadingEl = document.getElementById('loading');

// ── Vertex shader: height-gradient color + distance falloff (no fog uniforms)
const vertexShader = `
  uniform float uTime;
  uniform float uYMin;
  uniform float uYMax;
  attribute float aSeed;
  varying float vHeightT;
  varying float vDist;
  void main() {
    // Gentle drift: small per-point oscillation based on seed
    float drift = sin(uTime * 0.6 + aSeed * 6.2832) * 0.008;
    vec3 pos = position + normal * drift;
    vHeightT = clamp((pos.y - uYMin) / (uYMax - uYMin), 0.0, 1.0);
    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
    vDist = -mvPosition.z;
    gl_PointSize = clamp(120.0 / vDist, 0.8, 3.5);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

// ── Fragment shader: smooth circle, height gradient
const fragmentShader = `
  varying float vHeightT;
  varying float vDist;
  void main() {
    // Circular point
    vec2 uv = gl_PointCoord * 2.0 - 1.0;
    if (dot(uv,uv) > 1.0) discard;
    // Height gradient: warm amber at base → cool blue-white at top
    vec3 colBase = vec3(0.816, 0.502, 0.251); // #d08040
    vec3 colTop  = vec3(0.816, 0.910, 0.973); // #d0e8f8
    vec3 col = mix(colBase, colTop, vHeightT);
    // Distance falloff (replaces fog)
    float fade = clamp(1.0 - (vDist - 2.0) / 15.0, 0.3, 1.0);
    gl_FragColor = vec4(col * fade, 0.85);
  }
`;

const uniforms = {
  uTime: { value: 0 },
  uYMin: { value: -2.0 },
  uYMax: { value: 2.0 },
};

function buildPointCloud(positions, normals) {
  const N = Math.min(positions.length / 3, N_POINTS);
  const pos = new Float32Array(N * 3);
  const nor = new Float32Array(N * 3);
  const seeds = new Float32Array(N);

  // Sample up to N_POINTS from positions
  const step = Math.max(1, Math.floor(positions.length / 3 / N));
  let count = 0;
  for (let i = 0; i < positions.length / 3 && count < N; i += step) {
    pos[count*3]   = positions[i*3];
    pos[count*3+1] = positions[i*3+1];
    pos[count*3+2] = positions[i*3+2];
    if (normals && normals.length > i*3+2) {
      nor[count*3]   = normals[i*3];
      nor[count*3+1] = normals[i*3+1];
      nor[count*3+2] = normals[i*3+2];
    }
    seeds[count] = Math.random();
    count++;
  }

  // Compute Y range for gradient
  let yMin = Infinity, yMax = -Infinity;
  for (let i = 0; i < count; i++) {
    yMin = Math.min(yMin, pos[i*3+1]);
    yMax = Math.max(yMax, pos[i*3+1]);
  }
  uniforms.uYMin.value = yMin;
  uniforms.uYMax.value = yMax;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos.slice(0, count*3), 3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor.slice(0, count*3), 3));
  geo.setAttribute('aSeed',    new THREE.BufferAttribute(seeds.slice(0, count), 1));

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    transparent: true,
    depthWrite: false,
  });

  const points = new THREE.Points(geo, mat);
  // Center the geometry
  geo.computeBoundingBox();
  const box = geo.boundingBox;
  const centerY = (box.min.y + box.max.y) / 2;
  const height = box.max.y - box.min.y;
  points.position.y = -centerY;
  // Scale to fit camera view
  const scale = 3.5 / height;
  points.scale.setScalar(scale);
  scene.add(points);

  loadingEl.style.display = 'none';
  return points;
}

// ── Strategy A: Load venus OBJ from GitHub CDN
let cloudObject = null;
const loader = new OBJLoader();
const OBJ_URL = 'https://raw.githubusercontent.com/alecjacobson/common-3d-test-models/master/data/venus.obj';

loader.load(
  OBJ_URL,
  (obj) => {
    // Extract all vertices and normals
    let allPos = [], allNor = [];
    obj.traverse(child => {
      if (child.isMesh) {
        const geo = child.geometry;
        if (!geo.attributes.position) return;
        const p = geo.attributes.position;
        const n = geo.attributes.normal;
        for (let i = 0; i < p.count; i++) {
          allPos.push(p.getX(i), p.getY(i), p.getZ(i));
          if (n) allNor.push(n.getX(i), n.getY(i), n.getZ(i));
          else allNor.push(0,1,0);
        }
      }
    });
    if (allPos.length > 0) {
      cloudObject = buildPointCloud(new Float32Array(allPos), new Float32Array(allNor));
    } else {
      buildProcedural();
    }
  },
  null,
  () => {
    // Strategy B: procedural female torso via Lathe geometry
    buildProcedural();
  }
);

function buildProcedural() {
  // Lathe profile: shoulder to hip (classical female torso proportion)
  const profilePts = [
    new THREE.Vector2(0.05, 3.5),  // neck
    new THREE.Vector2(0.35, 3.0),  // shoulder
    new THREE.Vector2(0.50, 2.5),  // upper chest
    new THREE.Vector2(0.45, 2.0),  // mid chest
    new THREE.Vector2(0.35, 1.5),  // waist
    new THREE.Vector2(0.40, 1.0),  // hip flare
    new THREE.Vector2(0.50, 0.5),  // hip
    new THREE.Vector2(0.60, 0.0),  // widest hip
    new THREE.Vector2(0.55, -0.5), // upper thigh
    new THREE.Vector2(0.40, -1.0), // mid thigh
  ];

  const latheGeo = new THREE.LatheGeometry(profilePts, 64);
  latheGeo.computeVertexNormals();

  // Sample 50k points on the surface
  const pos = latheGeo.attributes.position;
  const nor = latheGeo.attributes.normal;
  const N = N_POINTS;
  const sampledPos = new Float32Array(N * 3);
  const sampledNor = new Float32Array(N * 3);

  const triCount = latheGeo.index
    ? latheGeo.index.count / 3
    : pos.count / 3;

  for (let i = 0; i < N; i++) {
    // Random triangle
    const tri = Math.floor(Math.random() * triCount) * 3;
    let ia, ib, ic;
    if (latheGeo.index) {
      ia = latheGeo.index.getX(tri);
      ib = latheGeo.index.getX(tri+1);
      ic = latheGeo.index.getX(tri+2);
    } else {
      ia = tri; ib = tri+1; ic = tri+2;
    }
    // Barycentric random
    let u = Math.random(), v = Math.random();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    const w = 1 - u - v;

    sampledPos[i*3]   = w*pos.getX(ia) + u*pos.getX(ib) + v*pos.getX(ic);
    sampledPos[i*3+1] = w*pos.getY(ia) + u*pos.getY(ib) + v*pos.getY(ic);
    sampledPos[i*3+2] = w*pos.getZ(ia) + u*pos.getZ(ib) + v*pos.getZ(ic);
    if (nor) {
      sampledNor[i*3]   = w*nor.getX(ia) + u*nor.getX(ib) + v*nor.getX(ic);
      sampledNor[i*3+1] = w*nor.getY(ia) + u*nor.getY(ib) + v*nor.getY(ic);
      sampledNor[i*3+2] = w*nor.getZ(ia) + u*nor.getZ(ib) + v*nor.getZ(ic);
    }
  }

  latheGeo.dispose();
  cloudObject = buildPointCloud(sampledPos, sampledNor);
}

// Zoom pulse: gentle periodic zoom in/out
let time = 0;
let zoomPhase = 0;
const baseZ = 6;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let paused = false;
renderer.domElement.addEventListener('click', () => { paused = !paused; });

function animate(ts) {
  requestAnimationFrame(animate);
  if (paused) return;
  time = ts * 0.001;

  uniforms.uTime.value = time;

  // Periodic zoom pulse: camera z oscillates gently
  const zPulse = baseZ + Math.sin(time * 0.25) * 0.8;
  camera.position.z += (zPulse - camera.position.z) * 0.01;

  controls.update();
  renderer.render(scene, camera);
}
animate(0);
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}

    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
