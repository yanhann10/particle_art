<head>
<meta charset="utf-8">

<title>r2v · glyph-stele</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">r2v</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Folded-leaf primitive (from parent) + Mayan glyph grid structure ── */

/* Each leaf is a curled sheet geometry — fern-uncurl calligraphy */
function buildLeafGeometry(seed, width, height, curvature){
  const segs = 24;
  const pos = [];
  const rng = (() => {
    let s = seed >>> 0;
    return () => {
      s |= 0; s = s + 0x9E3779B9 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })();

  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const w = width * (1 - t * 0.4); // taper
    const y = height * t;
    const twist = curvature * Math.sin(t * Math.PI);
    const jitter = 0.04 * (rng() - 0.5);
    pos.push(-w/2 + twist + jitter, y, 0);
    pos.push(+w/2 + twist + jitter, y, 0);
  }
  const indices = [];
  for (let i = 0; i < segs; i++){
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, c, b, b, c, d);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

/* Mayan stelae grid: vertical register structure — 4 horizontal tiers, each with 2-3 glyph blocks */
/* Each glyph block is a cluster of 3-6 folded leaves arranged in a compact square composition */

function buildGlyphBlock(seed, scale){
  const group = new THREE.Group();
  const rng = (() => {
    let s = seed >>> 0;
    return () => {
      s |= 0; s = s + 0x9E3779B9 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })();

  const leafCount = 3 + Math.floor(rng() * 4); // 3-6 leaves per glyph
  for (let i = 0; i < leafCount; i++){
    const leafSeed = (seed + i * 137) >>> 0;
    const w = 0.4 + rng() * 0.3;
    const h = 0.7 + rng() * 0.5;
    const curv = (rng() - 0.5) * 1.2;
    const leafGeom = buildLeafGeometry(leafSeed, w * scale, h * scale, curv * scale);
    
    const mat = new THREE.MeshBasicMaterial({
      color: 0x8b7355,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(leafGeom, mat);
    
    // arrange leaves in tight cluster — radial + slight overlap
    const angle = (i / leafCount) * Math.PI * 2;
    const radius = scale * 0.25;
    mesh.position.x = Math.cos(angle) * radius;
    mesh.position.z = Math.sin(angle) * radius;
    mesh.rotation.y = angle + (rng() - 0.5) * 0.6;
    mesh.rotation.x = (rng() - 0.5) * 0.3;
    mesh.rotation.z = (rng() - 0.5) * 0.4;
    
    group.add(mesh);
  }
  return group;
}

/* Build stele: 4 vertical tiers, each with 2-3 glyph blocks arranged horizontally */
function buildStele(seed){
  const group = new THREE.Group();
  const rng = (() => {
    let s = seed >>> 0;
    return () => {
      s |= 0; s = s + 0x9E3779B9 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  })();

  const tierCount = 4;
  const tierHeight = 3.5;
  const totalHeight = tierCount * tierHeight;

  for (let tier = 0; tier < tierCount; tier++){
    const y = tier * tierHeight - totalHeight / 2;
    const glyphCount = 2 + Math.floor(rng() * 2); // 2-3 glyphs per tier
    const spacing = 2.8;
    const rowWidth = (glyphCount - 1) * spacing;
    
    for (let g = 0; g < glyphCount; g++){
      const glyphSeed = (seed + tier * 100 + g * 17) >>> 0;
      const scale = 0.8 + rng() * 0.3;
      const glyph = buildGlyphBlock(glyphSeed, scale);
      glyph.position.x = (g / (glyphCount - 1) - 0.5) * rowWidth;
      glyph.position.y = y;
      group.add(glyph);
    }
  }

  return group;
}

/* Particles: scatter on leaf surfaces + sparse environmental dust */
function buildParticles(stele, totalN){
  const positions = new Float32Array(totalN * 3);
  const seeds = new Float32Array(totalN);
  const types = new Float32Array(totalN); // 0=leaf-surface, 1=dust
  
  let written = 0;
  const leafMeshes = [];
  stele.traverse(obj => {
    if (obj.isMesh) leafMeshes.push(obj);
  });

  // 75% on leaf surfaces
  const leafCount = Math.floor(totalN * 0.75);
  for (let i = 0; i < leafCount && written < totalN; i++){
    const mesh = leafMeshes[Math.floor(Math.random() * leafMeshes.length)];
    const posAttr = mesh.geometry.attributes.position;
    const idx = Math.floor(Math.random() * posAttr.count);
    const v = new THREE.Vector3(
      posAttr.getX(idx),
      posAttr.getY(idx),
      posAttr.getZ(idx)
    );
    v.applyMatrix4(mesh.matrixWorld);
    // slight surface offset
    v.x += (Math.random() - 0.5) * 0.02;
    v.y += (Math.random() - 0.5) * 0.02;
    v.z += (Math.random() - 0.5) * 0.02;
    positions[written * 3] = v.x;
    positions[written * 3 + 1] = v.y;
    positions[written * 3 + 2] = v.z;
    seeds[written] = Math.random();
    types[written] = 0;
    written++;
  }

  // 25% environmental dust
  const bb = new THREE.Box3().setFromObject(stele);
  const dustCount = totalN - written;
  for (let i = 0; i < dustCount && written < totalN; i++){
    positions[written * 3] = (Math.random() - 0.5) * 8;
    positions[written * 3 + 1] = bb.min.y + Math.random() * (bb.max.y - bb.min.y);
    positions[written * 3 + 2] = (Math.random() - 0.5) * 6;
    seeds[written] = Math.random();
    types[written] = 1;
    written++;
  }

  return { positions, seeds, types };
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0806, 0.045);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const N = 80000;
let particleGeom, particlePoints, steleGroup;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 }
};

const particleMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute float seed;
    attribute float ptype;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;

      // reveal animation
      vec3 entry = vec3(seed * 6.0 - 3.0, 20.0 + seed * 10.0, seed * 6.0 - 3.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // gentle drift for dust particles
      if (ptype > 0.5){
        p.x += 0.3 * sin(t * 0.5);
        p.y += 0.15 * sin(t * 0.3) * uReady;
        p.z += 0.3 * cos(t * 0.6);
      }

      // Mayan earth tones — ochre, sienna, burnt umber, limestone cream
      vec3 ochre = vec3(0.82, 0.62, 0.38);
      vec3 sienna = vec3(0.63, 0.42, 0.28);
      vec3 umber = vec3(0.38, 0.26, 0.18);
      vec3 limestone = vec3(0.88, 0.82, 0.68);

      float energy = 0.5 + 0.5 * sin(t * 0.6);
      vec3 baseCol = mix(sienna, ochre, seed);
      baseCol = mix(baseCol, umber, (1.0 - energy) * 0.3);
      
      // dust particles lighter
      if (ptype > 0.5){
        baseCol = mix(baseCol, limestone, 0.6);
      }

      vCol = baseCol;
      vAlpha = (0.5 + 0.5 * energy) * (ptype > 0.5 ? 0.25 : 0.65);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.5 * energy) * uPixel * (32.0 / dist) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;

function regrow(seed){
  if (steleGroup) scene.remove(steleGroup);
  steleGroup = buildStele(seed);
  steleGroup.updateMatrixWorld(true);
  scene.add(steleGroup);

  const { positions, seeds, types } = buildParticles(steleGroup, N);

  if (!particleGeom){
    particleGeom = new THREE.BufferGeometry();
    particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    particleGeom.setAttribute('ptype', new THREE.BufferAttribute(types, 1));
    particlePoints = new THREE.Points(particleGeom, particleMat);
    scene.add(particlePoints);
  } else {
    particleGeom.attributes.position.array.set(positions);
    particleGeom.attributes.position.needsUpdate = true;
    particleGeom.attributes.seed.array.set(seeds);
    particleGeom.attributes.seed.needsUpdate = true;
    particleGeom.attributes.ptype.array.set(types);
    particleGeom.attributes.ptype.needsUpdate = true;
  }
  particleGeom.computeBoundingSphere();

  // track stele centroid
  const bb = new THREE.Box3().setFromObject(steleGroup);
  const center = bb.getCenter(new THREE.Vector3());
  controls.target.copy(center);

  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ambient light + side light gradient
const ambient = new THREE.AmbientLight(0x2a1f18, 0.4);
scene.add(ambient);
const sideLight = new THREE.DirectionalLight(0xd4a574, 0.8);
sideLight.position.set(5, 8, 3);
scene.add(sideLight);

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2500);
  }

  // stele breathes slightly — vertical compression/expansion
  if (steleGroup){
    const breathe = 1.0 + 0.015 * Math.sin(elapsed * 0.18);
    steleGroup.scale.y = breathe;
    steleGroup.rotation.y = elapsed * 0.04;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }

})();
