<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lob · Shiota — The Key in the Hand (After Venice)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">lob</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.009);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.15));

const pL = new THREE.PointLight(0xffd0a0, 0.35, 50, 1.8);
pL.position.set(-2.0, 10.0, 1.5);
scene.add(pL);

let seed = 71629384;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — architectural void (Shiota's gallery cube)
const ROOM = { w: 40, h: 26, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── THE SPHERE — sole suspended object, pale moon/heart at the web's center
// Reference: seed image — one pale cottony sphere, the still center
const spherePos = new THREE.Vector3(0.0, 2.5, 0.0);
const SPHERE_R = 2.2;
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8d8,
    emissive: 0xf0e8d8,
    emissiveIntensity: 0.6,
    roughness: 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.38,
    side: THREE.DoubleSide
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// Suspension wires — ceiling to sphere top (physically legible hanging)
const suspGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  spherePos.x - 0.3, hh, spherePos.z + 0.2,
  spherePos.x - 0.1, spherePos.y + SPHERE_R, spherePos.z + 0.05,
  spherePos.x + 0.4, hh, spherePos.z - 0.15,
  spherePos.x + 0.15, spherePos.y + SPHERE_R, spherePos.z - 0.08,
  spherePos.x - 0.1, hh, spherePos.z - 0.35,
  spherePos.x, spherePos.y + SPHERE_R*0.98, spherePos.z - 0.12,
  spherePos.x + 0.05, hh, spherePos.z + 0.4,
  spherePos.x + 0.02, spherePos.y + SPHERE_R*0.96, spherePos.z + 0.15
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a08, transparent: true, opacity: 0.5
})));

function sphereSurf(){
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2 * rng() - 1);
  return new THREE.Vector3(
    spherePos.x + Math.sin(v)*Math.cos(u)*SPHERE_R,
    spherePos.y + Math.sin(v)*Math.sin(u)*SPHERE_R,
    spherePos.z + Math.cos(v)*SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron skeleton at three scales
const phi = (1 + Math.sqrt(5)) / 2;
const truncIcoVerts = [
  [0, 1, 3*phi], [0, 1, -3*phi], [0, -1, 3*phi], [0, -1, -3*phi],
  [1, 3*phi, 0], [-1, 3*phi, 0], [1, -3*phi, 0], [-1, -3*phi, 0],
  [3*phi, 0, 1], [-3*phi, 0, 1], [3*phi, 0, -1], [-3*phi, 0, -1],
  [2, 1+2*phi, phi], [-2, 1+2*phi, phi], [2, -(1+2*phi), phi], [-2, -(1+2*phi), phi],
  [2, 1+2*phi, -phi], [-2, 1+2*phi, -phi], [2, -(1+2*phi), -phi], [-2, -(1+2*phi), -phi],
  [phi, 2, 1+2*phi], [-phi, 2, 1+2*phi], [phi, -2, 1+2*phi], [-phi, -2, 1+2*phi],
  [phi, 2, -(1+2*phi)], [-phi, 2, -(1+2*phi)], [phi, -2, -(1+2*phi)], [-phi, -2, -(1+2*phi)],
  [1+2*phi, phi, 2], [-(1+2*phi), phi, 2], [1+2*phi, -phi, 2], [-(1+2*phi), -phi, 2],
  [1+2*phi, phi, -2], [-(1+2*phi), phi, -2], [1+2*phi, -phi, -2], [-(1+2*phi), -phi, -2]
];

const anchors = [];
for(const v of truncIcoVerts){
  const norm = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  // Three concentric shells — inner, mid, outer
  const scales = [2.8/norm, 5.8/norm, 10.0/norm];
  for(const s of scales){
    anchors.push(new THREE.Vector3(
      spherePos.x + v[0]*s, spherePos.y + v[1]*s, spherePos.z + v[2]*s
    ));
  }
}

// Void zones — deliberate negative space windows (Tyler Hobbs)
const voids = [
  { pos: new THREE.Vector3(spherePos.x + 6.0, spherePos.y - 2.0, spherePos.z + 5.0), r: 3.2 },
  { pos: new THREE.Vector3(spherePos.x - 7.0, spherePos.y + 4.0, spherePos.z - 3.0), r: 2.8 },
  { pos: new THREE.Vector3(spherePos.x + 2.0, spherePos.y + 7.0, spherePos.z - 6.0), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Fill remaining anchors — scattered in the architectural volume
const NUM_ANCHORS = 900;
for(let i = anchors.length; i < NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.35){
    // Near sphere — dense inner web
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = spherePos.clone().add(dir.multiplyScalar(SPHERE_R + 1.0 + rng()*5.0));
  } else if(r < 0.55){
    // Mid-field between sphere and walls
    p = wallPt().lerp(spherePos, 0.25 + rng()*0.4);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES); // distance from sphere center
const lineLen = new Float32Array(NUM_LINES);  // actual segment length
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-spherePos.x, dy = my-spherePos.y, dz = mz-spherePos.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  const lx = b.x-a.x, ly = b.y-a.y, lz = b.z-a.z;
  lineLen[li] = Math.sqrt(lx*lx + ly*ly + lz*lz);
  li++;
}

// Category A: Convergence threads — anchor/wall → sphere surface (55%)
// These are the blood vessels around the heart
const catA = Math.floor(NUM_LINES * 0.52);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.4){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 8% stop short — threads that almost reach but fail (Quayola)
  if(rng() < 0.08){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng()*1.5));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Category B: Structural web — anchor → anchor within threshold (25%)
const THRESHOLD = 7.0;
let rule2count = 0;
const rule2target = Math.floor(NUM_LINES * 0.25);
let rule2attempts = 0;
while(rule2count < rule2target && li < NUM_LINES && rule2attempts < 100000){
  rule2attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  rule2count++;

  // Y-fork branching — dendritic capillaries (Entangled Others)
  if(rng() < 0.2 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.4 + rng()*1.2));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      rule2count++;
      // Second generation branch
      if(rng() < 0.3 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(bEnd, 0.5 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.2 + rng()*0.7));
        if(!inVoid(bEnd2)){ setLine(mid2, bEnd2); rule2count++; }
      }
    }
  }
}

// Category C: Wall-spanning structural threads (remaining budget)
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.55 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── KEYS — tiny dark key silhouettes caught in the web
// Reference: The Key in the Hand (Venice 2015) — 50,000 keys in red yarn
// Each key is a simple cross shape (bow + blade) as LineSegments
const NUM_KEYS = 55;
const keyLinePositions = [];
for(let i = 0; i < NUM_KEYS; i++){
  const sz = 0.06 + rng()*0.1;
  // Place along thread midpoints
  const si = Math.floor(rng()*li);
  const idx = si * 6;
  const t = 0.2 + rng()*0.6;
  const px = basePositions[idx]*(1-t) + basePositions[idx+3]*t;
  const py = basePositions[idx+1]*(1-t) + basePositions[idx+4]*t;
  const pz = basePositions[idx+2]*(1-t) + basePositions[idx+5]*t;

  // Random orientation axes
  const ax = rng()*6.28, ay = rng()*6.28;
  const ca = Math.cos(ax), sa = Math.sin(ax);
  const cb = Math.cos(ay), sb = Math.sin(ay);

  // Key bow (circle top) — small ring approximated by 4 line segments
  const bowR = sz * 0.35;
  const bladeL = sz * 1.2;
  const teethW = sz * 0.3;

  // Blade — vertical line
  const bx = sb*bladeL, by = -bladeL*ca, bz = cb*bladeL*sa;
  keyLinePositions.push(px, py, pz, px+bx, py+by, pz+bz);

  // Bow — small diamond at top
  const bowOx = bowR*cb, bowOy = bowR*sa*sb, bowOz = -bowR*ca*sb;
  const bowPx = bowR*sa, bowPy = -bowR*ca, bowPz = 0;
  keyLinePositions.push(
    px+bowOx, py+bowOy, pz+bowOz,
    px+bowPx, py+bowPy, pz+bowPz
  );
  keyLinePositions.push(
    px-bowOx, py-bowOy, pz-bowOz,
    px-bowPx, py-bowPy, pz-bowPz
  );
  keyLinePositions.push(
    px+bowOx, py+bowOy, pz+bowOz,
    px-bowPx, py-bowPy, pz-bowPz
  );

  // Teeth — small perpendicular notches at blade end
  const tx = teethW*ca, ty = teethW*sa, tz = 0;
  keyLinePositions.push(
    px+bx*0.7, py+by*0.7, pz+bz*0.7,
    px+bx*0.7+tx, py+by*0.7+ty, pz+bz*0.7+tz
  );
  keyLinePositions.push(
    px+bx*0.9, py+by*0.9, pz+bz*0.9,
    px+bx*0.9+tx*0.7, py+by*0.9+ty*0.7, pz+bz*0.9+tz*0.7
  );
}

if(keyLinePositions.length > 0){
  const keyGeo = new THREE.BufferGeometry();
  keyGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(keyLinePositions), 3));
  scene.add(new THREE.LineSegments(keyGeo, new THREE.LineBasicMaterial({
    color: 0x0a0604,
    transparent: true,
    opacity: 0.55
  })));
}

// ── LEAF FRAGMENTS — charred paper / pressed leaves caught in the web
const NUM_LEAVES = 35;
for(let i = 0; i < NUM_LEAVES; i++){
  const sz = 0.03 + rng()*0.09;
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.25 + rng()*0.35);
  const h = sz * (1.0 + rng()*0.5);
  const verts = new Float32Array([
    0, h*0.5, 0,  -w*0.5, 0, 0,  0, -h*0.5, 0,
    0, h*0.5, 0,   w*0.5, 0, 0,  0, -h*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.008 + rng()*0.025;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.2, d*0.08),
    transparent: true,
    opacity: 0.2 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const leaf = new THREE.Mesh(leafGeo, leafMat);
  const si = Math.floor(rng()*li)*6;
  const t = 0.15 + rng()*0.7;
  leaf.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  leaf.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(leaf);
}

// ── CAMERA — glacial drift inside the web, rising and falling
// The viewer walks slowly through the installation, always looking toward the sphere
const pathLen = 600;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  // Elliptical orbit with vertical breathing — rise through dense web, sink through voids
  const x = spherePos.x + Math.sin(p)*6.5 + Math.sin(p*1.7+1.2)*2.0;
  const y = spherePos.y + 0.5 + Math.sin(p*0.3+0.5)*5.5 + Math.cos(p*0.9)*1.5;
  const z = spherePos.z + Math.cos(p)*8.0 + Math.cos(p*0.6+2.0)*3.0;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── THREAD MICRO-BREATHING — imperceptible, <0.4% variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    // Closer to sphere = less movement (taut), farther = slight sway
    const amp = 0.001 * Math.max(0, 1.0 - dist / 25.0);
    const phase = basePositions[idx]*0.25 + basePositions[idx+1]*0.3 + i*0.002;
    const breath = Math.sin(t*0.035 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.4;
      arr[vi+1] = basePositions[vi+1] + breath*0.3;
      arr[vi+2] = basePositions[vi+2] + breath*0.38;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere — subtle emissive pulse, like a heartbeat
  const pulse = 0.55 + Math.sin(t*0.08)*0.08;
  sphere.material.emissiveIntensity = pulse;

  // Glacial camera drift — presence walking through the web
  const speed = 0.0011;
  const pathT = (t * speed) % 1.0;
  const idxF = pathT * (pathLen - 1);
  const i0 = Math.floor(idxF) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idxF - Math.floor(idxF);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle wander
  const look = spherePos.clone();
  look.x += Math.sin(t*0.005)*0.3;
  look.y += Math.cos(t*0.004)*0.2;
  look.z += Math.sin(t*0.006)*0.2;
  camera.lookAt(look);

  // Single warm point light — darkness is the primary material
  pL.position.x = -2.0 + Math.sin(t*0.003)*0.8;
  pL.position.y = 10.0 + Math.cos(t*0.002)*0.3;
  pL.position.z = 1.5 + Math.cos(t*0.004)*0.6;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
