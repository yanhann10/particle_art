<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>69k · lorenz cascade</title>
<!-- MOTION: CASCADE, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">69k · lorenz cascade</div>
<div class="hint">gravity-led descent through phase space</div>
<div class="src">strange attractor · 100k cascading particles · Lorenz + gravity</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// CASCADE motion: particles born at top of attractor basin, Lorenz field pulls them through
// the strange attractor's butterfly wings, then gravity + damping cascade them downward
// to pool at bottom. Continuous spawning at top creates a waterfall through phase space.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070b, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: spawn at top of basin with small horizontal spread
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.random() * 4.0;
  init[i*4]   = Math.cos(angle) * radius;
  init[i*4+1] = Math.sin(angle) * radius;
  init[i*4+2] = 45.0 + Math.random() * 8.0;  // spawn high
  init[i*4+3] = Math.random();   // lifecycle: 0=newborn, 1=expired
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation pass: Lorenz + gravity cascade + respawn
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:    { value: 0.006 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 },
  uGravity: { value: 12.0 },
  uDamping: { value: 0.92 },
  uTime: { value: 0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uSigma;
    uniform float uRho;
    uniform float uBeta;
    uniform float uGravity;
    uniform float uDamping;
    uniform float uTime;
    varying vec2 vUv;

    // hash for per-particle seed
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float life = s.w;
      
      // respawn at top if fallen below threshold or aged out
      if (p.z < 0.0 || life > 1.0){
        float seed = hash(vUv + uTime * 0.001);
        float angle = seed * 6.283;
        float radius = hash(vUv * 1.3 + uTime * 0.002) * 4.0;
        p.x = cos(angle) * radius;
        p.y = sin(angle) * radius;
        p.z = 45.0 + hash(vUv * 2.1 + uTime * 0.003) * 8.0;
        life = 0.0;
      }
      
      // Lorenz attractor field (weakened to let gravity dominate)
      vec3 lorenz = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      ) * 0.45;
      
      // gravity cascade downward
      vec3 gravity = vec3(0.0, 0.0, -uGravity);
      
      // horizontal damping (turbulent drag)
      vec3 damping = -vec3(p.x, p.y, 0.0) * (1.0 - uDamping);
      
      vec3 dp = lorenz + gravity + damping;
      p += dp * uDt;
      
      life += uDt * 0.08;
      
      gl_FragColor = vec4(p, life);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(35, -45, 40);
camera.lookAt(0, 0, 15);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vLife;
    varying float vDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vLife = s.w;
      
      // shift attractor for framing
      p.z -= 25.0;
      vDepth = p.z + 25.0;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      // size by lifecycle — larger when young at top, smaller as they fall
      float sizeFactor = 1.0 - smoothstep(0.0, 0.6, vLife);
      gl_PointSize = (0.8 + 2.4 * sizeFactor) * uPixel * (70.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLife;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      
      // cascade palette: icy cyan at top → deep indigo at middle → warm amber pooling at bottom
      vec3 topCol = vec3(0.68, 0.92, 0.98);    // cyan spray
      vec3 midCol = vec3(0.24, 0.38, 0.82);    // indigo flow
      vec3 botCol = vec3(0.92, 0.68, 0.42);    // amber pool
      
      float heightKey = clamp(vDepth / 50.0, 0.0, 1.0);
      vec3 col = mix(botCol, midCol, smoothstep(0.0, 0.5, heightKey));
      col = mix(col, topCol, smoothstep(0.5, 1.0, heightKey));
      
      // fade particles as they age
      float lifeFade = 1.0 - smoothstep(0.7, 1.0, vLife);
      
      gl_FragColor = vec4(col * a * lifeFade * 0.75, a * lifeFade);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// volumetric fog layer between camera and form
const fogGeom = new THREE.PlaneGeometry(120, 120);
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      vec3 p = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    float noise(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    void main(){
      vec2 p = vUv * 6.0 + uTime * 0.02;
      float n = noise(floor(p)) * 0.5 + noise(floor(p * 2.3)) * 0.3;
      float alpha = n * 0.08;
      gl_FragColor = vec4(0.06, 0.08, 0.14, alpha);
    }
  `
});
const fogPlane = new THREE.Mesh(fogGeom, fogMat);
fogPlane.position.set(0, 0, 10);
scene.add(fogPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = (now - lastTime) / 1000; 
  lastTime = now;
  
  simUniforms.uTime.value = now / 1000;
  
  // step sim 3 substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;
  fogMat.uniforms.uTime.value = now / 1000;
  
  // slow orbital camera to see cascade from changing angles
  const ang = now * 0.00008;
  camera.position.x = Math.cos(ang) * 50;
  camera.position.y = Math.sin(ang) * -50;
  camera.position.z = 35 + Math.sin(ang * 0.7) * 8;
  camera.lookAt(0, 0, 12);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
