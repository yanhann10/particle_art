<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wcs · kirigami relief</title>
<!-- MOTION: unfold, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">wcs</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.minDistance = 8;
controls.maxDistance = 40;

/* ── Fibonacci spiral pattern for cut layout ── */
const PHI = (1 + Math.sqrt(5)) / 2;
const SPIRALS = 21;
const RADIUS = 8;
const CUT_WIDTH = 0.18;
const LIFT_HEIGHT = 2.4;

function fibonacciSpiral(index, total, radius){
  const angle = index * 2 * Math.PI / PHI;
  const r = radius * Math.sqrt(index / total);
  return {
    x: r * Math.cos(angle),
    y: r * Math.sin(angle),
    angle: angle,
    r: r
  };
}

/* ── Generate kirigami geometry ── */
const group = new THREE.Group();
scene.add(group);

/* Base uncut paper */
const baseMat = new THREE.MeshStandardMaterial({
  color: 0xf5ede0,
  roughness: 0.8,
  metalness: 0.0,
  side: THREE.DoubleSide
});
const baseGeo = new THREE.CircleGeometry(RADIUS, 128);
const baseMesh = new THREE.Mesh(baseGeo, baseMat);
baseMesh.rotation.x = -Math.PI / 2;
baseMesh.receiveShadow = true;
group.add(baseMesh);

/* Cut flaps — each follows Fibonacci spiral */
const flapMat = new THREE.MeshStandardMaterial({
  color: 0xe8d5b8,
  roughness: 0.75,
  metalness: 0.05,
  side: THREE.DoubleSide
});

const flaps = [];
for (let i = 3; i < SPIRALS; i++){
  const pt = fibonacciSpiral(i, SPIRALS, RADIUS);
  const nextPt = fibonacciSpiral(i+1, SPIRALS, RADIUS);
  
  const len = Math.sqrt((nextPt.x - pt.x)**2 + (nextPt.y - pt.y)**2);
  const midAngle = (pt.angle + nextPt.angle) / 2;
  
  /* Each flap is a leaf-like petal shape */
  const flapShape = new THREE.Shape();
  const flapLen = len * 1.4;
  const flapW = CUT_WIDTH;
  
  /* Petal outline */
  flapShape.moveTo(0, 0);
  flapShape.quadraticCurveTo(flapLen * 0.3, flapW * 0.8, flapLen * 0.65, flapW * 0.5);
  flapShape.quadraticCurveTo(flapLen * 0.85, flapW * 0.2, flapLen, 0);
  flapShape.quadraticCurveTo(flapLen * 0.85, -flapW * 0.2, flapLen * 0.65, -flapW * 0.5);
  flapShape.quadraticCurveTo(flapLen * 0.3, -flapW * 0.8, 0, 0);
  
  const flapGeo = new THREE.ShapeGeometry(flapShape, 16);
  const flapMesh = new THREE.Mesh(flapGeo, flapMat);
  
  flapMesh.position.set(pt.x, 0.01, pt.y);
  flapMesh.rotation.y = midAngle;
  flapMesh.castShadow = true;
  flapMesh.receiveShadow = true;
  
  group.add(flapMesh);
  flaps.push({
    mesh: flapMesh,
    baseY: 0.01,
    baseRotX: 0,
    targetLift: LIFT_HEIGHT * (0.7 + 0.3 * Math.random()),
    targetRotX: (0.4 + 0.35 * Math.random()) * Math.PI / 2,
    phase: i / SPIRALS * Math.PI * 2,
    speed: 0.8 + 0.4 * Math.random()
  });
}

/* ── Directional key light (raking angle for shadow drama) ── */
const keyLight = new THREE.DirectionalLight(0xfff5e8, 2.2);
keyLight.position.set(12, 15, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.left = -15;
keyLight.shadow.camera.right = 15;
keyLight.shadow.camera.top = 15;
keyLight.shadow.camera.bottom = -15;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

/* Fill light from opposite side */
const fillLight = new THREE.DirectionalLight(0xc9a86a, 0.6);
fillLight.position.set(-8, 6, -10);
scene.add(fillLight);

/* Ambient warm base */
const ambientLight = new THREE.AmbientLight(0xf5ede0, 0.35);
scene.add(ambientLight);

/* Rim light (cool accent) */
const rimLight = new THREE.DirectionalLight(0x8ab4c2, 0.8);
rimLight.position.set(-5, 2, 12);
scene.add(rimLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();
const UNFOLD_DURATION = 6000;
const BREATH_PERIOD = 8;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  /* Unfold animation — each flap lifts in sequence */
  const unfoldProgress = Math.min(1, (now - start) / UNFOLD_DURATION);
  
  for (let i = 0; i < flaps.length; i++){
    const flap = flaps[i];
    const delayFactor = i / flaps.length;
    const localProgress = smoothstep(delayFactor * 0.5, delayFactor * 0.5 + 0.5, unfoldProgress);
    
    /* Breathing motion after unfold completes */
    const breathPhase = elapsed * (Math.PI * 2 / BREATH_PERIOD) * flap.speed + flap.phase;
    const breathAmp = 0.12 * Math.sin(breathPhase);
    
    const liftProgress = localProgress + breathAmp * localProgress;
    
    flap.mesh.position.y = flap.baseY + flap.targetLift * liftProgress;
    flap.mesh.rotation.x = flap.baseRotX + flap.targetRotX * liftProgress;
  }
  
  /* Gentle camera drift */
  const drift = 0.4 * Math.sin(elapsed * 0.18);
  camera.position.x = drift;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
