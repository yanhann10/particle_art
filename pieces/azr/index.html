<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azr · Shiota — The Dress Alone (After In Silence)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">azr</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.014);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.15));

const pL = new THREE.PointLight(0xffd0a0, 0.35, 40, 1.8);
pL.position.set(-2.0, 10.0, 1.5);
scene.add(pL);

let seed = 61482937;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — architectural void, slightly taller
const ROOM = { w: 32, h: 26, d: 38 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — the sole remembered object (Shiota: one form, not two)
const dressCenter = new THREE.Vector3(0.0, 1.0, 0.0);
const SKIRT_R = 1.8, SKIRT_H = 4.2;
const BODICE_R = 0.55, BODICE_H = 1.5;
const skirtBottom = dressCenter.y - SKIRT_H * 0.4;
const skirtTop = dressCenter.y + SKIRT_H * 0.6;
const bodiceTop = skirtTop + BODICE_H;

const dressGroup = new THREE.Group();

const dressMat = new THREE.MeshStandardMaterial({
  color: 0xf0e6d8,
  emissive: 0xf0e6d8,
  emissiveIntensity: 0.6,
  roughness: 0.94,
  metalness: 0.0,
  transparent: true,
  opacity: 0.38,
  side: THREE.DoubleSide
});

// Skirt — wider, more presence
const skirtGeo = new THREE.ConeGeometry(SKIRT_R, SKIRT_H, 18, 1, true);
const skirt = new THREE.Mesh(skirtGeo, dressMat);
skirt.position.set(dressCenter.x, dressCenter.y + SKIRT_H*0.1, dressCenter.z);
skirt.rotation.x = Math.PI;
dressGroup.add(skirt);

// Bodice
const bodiceGeo = new THREE.CylinderGeometry(BODICE_R*0.65, BODICE_R, BODICE_H, 14, 1, true);
const bodice = new THREE.Mesh(bodiceGeo, dressMat);
bodice.position.set(dressCenter.x, skirtTop + BODICE_H*0.5, dressCenter.z);
dressGroup.add(bodice);

// Shoulders — subtle widening at top
const shoulderGeo = new THREE.CylinderGeometry(BODICE_R*1.3, BODICE_R*0.65, 0.25, 14, 1, true);
const shoulder = new THREE.Mesh(shoulderGeo, dressMat);
shoulder.position.set(dressCenter.x, bodiceTop - 0.1, dressCenter.z);
dressGroup.add(shoulder);

// Hanger wire
const hangerGeo = new THREE.BufferGeometry();
const hangerPts = new Float32Array([
  dressCenter.x - 1.0, bodiceTop + 0.7, dressCenter.z,
  dressCenter.x, bodiceTop + 1.2, dressCenter.z,
  dressCenter.x, bodiceTop + 1.2, dressCenter.z,
  dressCenter.x + 1.0, bodiceTop + 0.7, dressCenter.z,
  dressCenter.x, bodiceTop + 1.2, dressCenter.z,
  dressCenter.x, bodiceTop + 0.05, dressCenter.z
]);
hangerGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
dressGroup.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x1a1a1a, transparent: true, opacity: 0.65
})));

scene.add(dressGroup);

// Suspension wires from ceiling — physical legibility (Saraceno)
const suspGeo = new THREE.BufferGeometry();
const sp = new Float32Array([
  dressCenter.x - 0.25, hh, dressCenter.z + 0.1,
  dressCenter.x, bodiceTop + 1.2, dressCenter.z,
  dressCenter.x + 0.3, hh, dressCenter.z - 0.15,
  dressCenter.x, bodiceTop + 1.2, dressCenter.z,
  dressCenter.x + 0.05, hh, dressCenter.z + 0.25,
  dressCenter.x + 0.05, bodiceTop + 1.2, dressCenter.z + 0.05,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x120604, transparent: true, opacity: 0.5
})));

// ── DRESS SURFACE SAMPLER
function dressSurf(){
  const r = rng();
  if(r < 0.6){
    const t = rng();
    const radius = BODICE_R + (SKIRT_R - BODICE_R) * t;
    const angle = rng() * Math.PI * 2;
    const y = skirtTop - t * SKIRT_H;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(angle) * radius,
      y,
      dressCenter.z + Math.sin(angle) * radius
    );
  } else {
    const t = rng();
    const angle = rng() * Math.PI * 2;
    const radius = BODICE_R * (0.65 + 0.35 * (1 - t));
    const y = skirtTop + t * BODICE_H;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(angle) * radius,
      y,
      dressCenter.z + Math.sin(angle) * radius
    );
  }
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron skeleton at three scales (Mohr)
const NUM_ANCHORS = 900;
const anchors = [];

const phi = (1 + Math.sqrt(5)) / 2;
const truncIcoVerts = [
  [0,1,3*phi],[0,1,-3*phi],[0,-1,3*phi],[0,-1,-3*phi],
  [1,3*phi,0],[-1,3*phi,0],[1,-3*phi,0],[-1,-3*phi,0],
  [3*phi,0,1],[-3*phi,0,1],[3*phi,0,-1],[-3*phi,0,-1],
  [2,1+2*phi,phi],[-2,1+2*phi,phi],[2,-(1+2*phi),phi],[-2,-(1+2*phi),phi],
  [2,1+2*phi,-phi],[-2,1+2*phi,-phi],[2,-(1+2*phi),-phi],[-2,-(1+2*phi),-phi],
  [phi,2,1+2*phi],[-phi,2,1+2*phi],[phi,-2,1+2*phi],[-phi,-2,1+2*phi],
  [phi,2,-(1+2*phi)],[-phi,2,-(1+2*phi)],[phi,-2,-(1+2*phi)],[-phi,-2,-(1+2*phi)],
  [1+2*phi,phi,2],[-(1+2*phi),phi,2],[1+2*phi,-phi,2],[-(1+2*phi),-phi,2],
  [1+2*phi,phi,-2],[-(1+2*phi),phi,-2],[1+2*phi,-phi,-2],[-(1+2*phi),-phi,-2]
];

for(const v of truncIcoVerts){
  const norm = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  const scales = [1.8, 4.2, 8.0];
  for(const s of scales){
    const f = s/norm;
    anchors.push(new THREE.Vector3(
      dressCenter.x + v[0]*f, dressCenter.y + 1.2 + v[1]*f, dressCenter.z + v[2]*f
    ));
  }
}

// Void zones — negative space windows (Hobbs)
const voids = [
  { pos: new THREE.Vector3(dressCenter.x + 6, dressCenter.y + 2, dressCenter.z - 5), r: 3.0 },
  { pos: new THREE.Vector3(dressCenter.x - 5, dressCenter.y - 3, dressCenter.z + 4), r: 2.8 },
  { pos: new THREE.Vector3(dressCenter.x + 3, dressCenter.y + 7, dressCenter.z + 6), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Fill remaining anchors
for(let i = anchors.length; i < NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.45){
    p = dressSurf();
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p.add(dir.multiplyScalar(1.2 + rng()*5.5));
  } else if(r < 0.65){
    p = wallPt().lerp(dressCenter, 0.15 + rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// ── BUILD 19,000 TAUT RED THREADS
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-dressCenter.x, dy = my-dressCenter.y-1.0, dz = mz-dressCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Suspension threads — ceiling to dress top (Saraceno: physical legibility)
for(let i = 0; i < 18 && li < NUM_LINES; i++){
  const cx = dressCenter.x + (rng()-0.5)*3;
  const cz = dressCenter.z + (rng()-0.5)*3;
  setLine(new THREE.Vector3(cx, hh, cz), dressSurf());
}

// Rule 1: anchor/wall → dress surface — convergence like vessels to a heart (60%)
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.4){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 8% stop short — threads reaching but never arriving (Quayola: the gap)
  if(rng() < 0.08){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.15 + rng()*1.4));
    setLine(a, target);
  } else {
    setLine(a, dressSurf());
  }
}

// Rule 2: anchor → anchor within threshold — structural web (25%)
const THRESHOLD = 6.0;
let rule2count = 0;
const rule2target = Math.floor(NUM_LINES * 0.25);
let rule2attempts = 0;
while(rule2count < rule2target && li < NUM_LINES && rule2attempts < 90000){
  rule2attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  rule2count++;

  // Y-fork branching — dendritic capillaries (Entangled Others)
  if(rng() < 0.2 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.4 + rng()*1.2));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      rule2count++;
      // Second generation fork
      if(rng() < 0.3 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(bEnd, 0.5 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.2 + rng()*0.7));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          rule2count++;
        }
      }
    }
  }
}

// Wall-spanning structural threads — remaining
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.55 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Thread opacity differentiation (Halloran): vary by distance
const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CHARRED FRAGMENTS — diary pages / burned paper caught in the web
const NUM_FRAGMENTS = 35;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.1;
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.35 + rng()*0.5);
  const h = sz * (0.8 + rng()*0.8);
  // Irregular quadrilateral — like torn paper
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.2), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.4+rng()*0.2), h*(rng()*0.15), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.008 + rng()*0.025;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.2, d*0.08),
    transparent: true,
    opacity: 0.15 + rng()*0.35,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  // Place along threads
  if(rng() < 0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(1.5 + rng()*7.0));
    frag.position.y += 0.8;
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — slow drift INSIDE the web, intimate architectural walk
// Rise from below, circle the dress, look up through threads, descend again
const pathLen = 600;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;
  // Asymmetric ellipse — closer on one side, farther on other
  const rX = 4.5 + Math.sin(p*0.5)*1.5;
  const rZ = 6.0 + Math.cos(p*0.7)*2.0;
  const x = cx + Math.sin(p) * rX + Math.sin(p*1.7+1.2)*0.8;
  // Vertical: slow rise and fall, spending more time at eye-level with the dress
  const yBase = cy + 1.5;
  const yWave = Math.sin(p*0.4+0.5)*4.5 + Math.cos(p*0.9)*1.0;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ + Math.cos(p*0.6+2.0)*1.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── THREAD MICRO-BREATHING — imperceptible, <0.5% variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.001 * Math.max(0, 1.0 - dist / 22.0);
    const phase = basePositions[idx]*0.28 + basePositions[idx+1]*0.33 + i*0.002;
    const breath = Math.sin(t*0.035 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.4;
      arr[vi+1] = basePositions[vi+1] + breath*0.3;
      arr[vi+2] = basePositions[vi+2] + breath*0.38;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0012;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward dress — presence-in-absence
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.005)*0.25;
  look.y += 1.4 + Math.cos(t*0.003)*0.2;
  look.z += Math.sin(t*0.004)*0.15;
  camera.lookAt(look);

  // Single warm light — darkness is primary material (Morakana)
  pL.position.x = -2.0 + Math.sin(t*0.0025)*0.8;
  pL.position.y = 10.0 + Math.cos(t*0.002)*0.3;
  pL.position.z = 1.5 + Math.cos(t*0.004)*0.5;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
