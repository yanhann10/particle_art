<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a00 · Furl</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#8ab4d4; opacity:.55; font-size:11px; letter-spacing:.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">a00</div>
<canvas id="c"></canvas>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(138,180,212,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(138,180,212,0.4);border-radius:3px;padding:4px 10px;color:rgba(138,180,212,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#8ab4d4';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';};
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
// ── FURL — WebGL2 / GLSL ES 3.00 ─────────────────────────────────────────────
// Two light rails fly the camera like a rollercoaster, then coil into a ball,
// then unfurl into a classic double helix — cycling continuously.
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2');
if (!gl) {
  document.body.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh';
  document.body.innerHTML = '<p style="color:#8ab4d4;font-family:monospace">WebGL2 required</p>';
  throw 0;
}

const VS = `#version 300 es
in vec2 a;
void main(){ gl_Position = vec4(a, 0., 1.); }`;

const FS = `#version 300 es
precision highp float;
uniform float iTime;
uniform vec2  iRes;
out vec4 fragColor;

#define TWO_PI 6.28318530
#define PI     3.14159265

// Helix SDF — axis along Z, phase offset allows two anti-parallel rails.
// Capped with spherical falloff so the "ball" phase has finite extent.
float helixSDF(vec3 p, float R, float pitch, float phase, float tubeR, float capR) {
  pitch = max(pitch, 0.08);
  float a  = atan(p.y, p.x) - phase;
  float k  = round(p.z / pitch - a / TWO_PI);
  float zH = pitch * (a / TWO_PI + k);
  float dr = length(p.xy) - R;
  float dz = p.z - zH;
  float d  = length(vec2(dr, dz)) - tubeR;
  // Spherical cap: push SDF up outside capR so raymarcher skips far regions
  float beyond = max(0., length(p) - capR);
  return d + beyond * 0.7;
}

vec3 glow;

float sdf(vec3 p) {
  float T = iTime;

  // Three-phase cycle over ~35 seconds:
  //   morph 0 → 1 : loose double rail → tight ball
  //   morph 1 → 0 : ball → double helix / loose again
  float morph = 0.5 - 0.5 * cos(T * 0.18);   // 0..1..0, period ~35s

  // Shape parameters
  float pitch = mix(7.5, 0.32, morph);
  float R     = mix(1.4, 0.85, morph);
  float tubeR = mix(0.07, 0.12, morph);
  float capR  = mix(80., 5.2, morph);          // huge when loose, tiny ball when tight

  // Rail A — silver-blue  (phase 0)
  float dA = helixSDF(p, R, pitch, 0.,  tubeR, capR);
  // Rail B — pale cyan   (phase PI = anti-parallel)
  float dB = helixSDF(p, R, pitch, PI,  tubeR, capR);

  // Glow — keep a00's original palette exactly
  glow += vec3(4.5, 6.5, 9.0) / (0.04 + dA * dA * 0.5);
  glow += vec3(2.0, 7.0, 9.5) / (0.03 + dB * dB * 0.4);

  return min(dA, dB);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - iRes * 0.5) / iRes.y;

  float T     = iTime;
  float morph = 0.5 - 0.5 * cos(T * 0.18);

  // --- Camera blend ---
  // Track mode (morph=0): ride inside the helix — rails spiral around you.
  // Ball mode  (morph=1): camera orbits outside the tight coil.
  float trackZ  = T * 12.0;
  float phi     = TWO_PI * trackZ / max(mix(7.5, 0.32, morph), 0.08);
  // Slight wobble timed to the helix rotation for a "riding the track" feel
  vec3 ro_track = vec3(sin(phi * 0.15) * 0.4, -0.3 + cos(phi * 0.2) * 0.2, trackZ);
  vec3 fd_track = normalize(vec3(sin(phi * 0.15) * 0.04, 0.04, 1.0));

  float orb     = T * 0.13;
  vec3 ro_ball  = vec3(cos(orb) * 11.0, sin(orb * 0.45) * 4.0, sin(orb) * 11.0);
  vec3 fd_ball  = normalize(-ro_ball);

  vec3 ro  = mix(ro_track, ro_ball,  morph);
  vec3 fwd = normalize(mix(fd_track, fd_ball, morph));

  vec3 up0 = abs(fwd.y) < 0.97 ? vec3(0., 1., 0.) : vec3(0., 0., 1.);
  vec3 rgt = normalize(cross(fwd, up0));
  vec3 up  = cross(rgt, fwd);
  vec3 rd  = normalize(uv.x * rgt + uv.y * up + 1.6 * fwd);

  glow = vec3(0.);
  vec3  o = vec3(0.);
  float t = 0., s;

  for (float i = 0.; i < 128.; i++) {
    vec3 p = ro + rd * t;
    s = sdf(p) * 0.85;
    t += max(s, 0.01);
    o += glow + 1.0 / max(s, 0.01);
    if (t > 90.) break;
  }

  // Reinhard + a00's cold grade
  vec3 col = o / (o + 5e4);
  col.r *= 0.78;
  col.g *= 0.92;
  col.b *= 1.12;

  fragColor = vec4(clamp(col, 0., 1.), 1.);
}`;

function mksh(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    console.error(type === gl.VERTEX_SHADER ? 'VS' : 'FS', gl.getShaderInfoLog(sh));
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, mksh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, mksh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  console.error('link', gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'iTime');
const uRes  = gl.getUniformLocation(prog, 'iRes');

function resize() {
  cv.width  = innerWidth;
  cv.height = innerHeight;
  gl.viewport(0, 0, innerWidth, innerHeight);
  gl.uniform2f(uRes, innerWidth, innerHeight);
}
resize();
addEventListener('resize', resize);

const t0 = performance.now();
(function loop() {
  gl.uniform1f(uTime, (performance.now() - t0) / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
