<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>25v · Hash-seeded choreography — Human Unreadable</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0604; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
.hash { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#8a6844; opacity:0.45; font-size:9px; letter-spacing:0.08em; z-index:5; }
</style>
</head>
<body>
<div class="id">25v</div>
<div class="hash"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
// Stage cyclorama gradient — warm amber to deep rust-red
const canvas = document.createElement('canvas');
canvas.width = 2;
canvas.height = 512;
const ctx = canvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#1a0e08');
grad.addColorStop(0.35, '#2d1508');
grad.addColorStop(0.7, '#4a1e0a');
grad.addColorStop(1, '#6b2a0f');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
const bgTex = new THREE.CanvasTexture(canvas);
scene.background = bgTex;
scene.fog = new THREE.FogExp2(0x1a0e08, 0.018);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 12, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Warm stage lighting
const ambLight = new THREE.AmbientLight(0x4a2514, 0.4);
scene.add(ambLight);
const keyLight = new THREE.DirectionalLight(0xffb870, 1.2);
keyLight.position.set(-8, 16, 12);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xff8844, 0.5);
fillLight.position.set(6, 8, -5);
scene.add(fillLight);

// ── Hash generation and seeded RNG
function generateHash(){
  let h = '';
  const chars = '0123456789abcdef';
  for(let i=0; i<64; i++) h += chars[Math.floor(Math.random()*16)];
  return h;
}

let HASH = generateHash();
document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';

// Seed RNG from hash
let rngState = 0;
for(let i=0; i<8; i++){
  rngState ^= parseInt(HASH.substring(i*8, i*8+8), 16);
}
rngState = rngState >>> 0;

function rng(){
  rngState |= 0;
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Derive choreography parameters from hash
const NUM_FIGURES = 3 + Math.floor(rng() * 4); // 3-6 dancers
const JOINTS_PER_FIGURE = 12;

class Figure {
  constructor(index){
    this.index = index;
    this.joints = [];
    this.springs = [];
    
    // Hash-derived initial placement
    const angle = (index / NUM_FIGURES) * Math.PI * 2 + rng() * 0.8;
    const radius = 8 + rng() * 6;
    const centerX = Math.cos(angle) * radius;
    const centerZ = Math.sin(angle) * radius;
    const centerY = 6 + rng() * 4;
    
    // Phase offsets from hash
    this.phaseX = rng() * Math.PI * 2;
    this.phaseY = rng() * Math.PI * 2;
    this.phaseZ = rng() * Math.PI * 2;
    
    // Amplitude from hash
    this.ampX = 0.8 + rng() * 2.5;
    this.ampY = 1.2 + rng() * 3.0;
    this.ampZ = 0.8 + rng() * 2.5;
    
    // Frequency from hash
    this.freqX = 0.15 + rng() * 0.25;
    this.freqY = 0.12 + rng() * 0.28;
    this.freqZ = 0.18 + rng() * 0.22;
    
    // Initialize joints as point masses
    for(let i=0; i<JOINTS_PER_FIGURE; i++){
      const t = i / (JOINTS_PER_FIGURE - 1);
      // Vertical spine with hash-derived variation
      const x = centerX + (rng()-0.5) * 1.5;
      const y = centerY + t * 8 + (rng()-0.5) * 0.8;
      const z = centerZ + (rng()-0.5) * 1.5;
      this.joints.push({
        pos: new THREE.Vector3(x, y, z),
        vel: new THREE.Vector3(),
        base: new THREE.Vector3(x, y, z),
        mass: 0.8 + rng() * 0.4
      });
    }
    
    // Spring connections — hash-derived topology
    const numSprings = 18 + Math.floor(rng() * 12);
    for(let i=0; i<numSprings; i++){
      const a = Math.floor(rng() * JOINTS_PER_FIGURE);
      let b = Math.floor(rng() * JOINTS_PER_FIGURE);
      if(a === b) b = (b+1) % JOINTS_PER_FIGURE;
      const restLen = this.joints[a].pos.distanceTo(this.joints[b].pos);
      const stiffness = 0.04 + rng() * 0.08;
      const damping = 0.85 + rng() * 0.1;
      this.springs.push({ a, b, restLen, stiffness, damping });
    }
    
    // Color per figure from hash
    const hue = rng();
    this.color = new THREE.Color().setHSL(
      0.05 + hue * 0.15, // orange-amber-rust range
      0.6 + rng() * 0.35,
      0.45 + rng() * 0.25
    );
  }
  
  update(time, dt){
    // Apply hash-derived motion fields
    for(let i=0; i<this.joints.length; i++){
      const j = this.joints[i];
      const target = j.base.clone();
      
      // Wave motion with per-joint phase offset
      const jointPhase = (i / JOINTS_PER_FIGURE) * Math.PI;
      target.x += Math.sin(time * this.freqX + this.phaseX + jointPhase) * this.ampX;
      target.y += Math.cos(time * this.freqY + this.phaseY + jointPhase * 0.7) * this.ampY;
      target.z += Math.sin(time * this.freqZ + this.phaseZ + jointPhase * 1.3) * this.ampZ;
      
      // Attraction to target
      const force = target.clone().sub(j.pos).multiplyScalar(0.08);
      j.vel.add(force.multiplyScalar(dt));
    }
    
    // Spring forces
    for(let s of this.springs){
      const ja = this.joints[s.a];
      const jb = this.joints[s.b];
      const delta = jb.pos.clone().sub(ja.pos);
      const dist = delta.length();
      if(dist < 0.01) continue;
      const force = delta.normalize().multiplyScalar((dist - s.restLen) * s.stiffness);
      ja.vel.add(force.multiplyScalar(dt / ja.mass));
      jb.vel.sub(force.multiplyScalar(dt / jb.mass));
      // Damping
      ja.vel.multiplyScalar(s.damping);
      jb.vel.multiplyScalar(s.damping);
    }
    
    // Integrate
    for(let j of this.joints){
      j.pos.add(j.vel.clone().multiplyScalar(dt));
      j.vel.multiplyScalar(0.97); // Global damping
    }
  }
}

// Create figures
const figures = [];
for(let i=0; i<NUM_FIGURES; i++){
  figures.push(new Figure(i));
}

// ── Build line geometry for all figures
const totalLines = figures.reduce((sum, f) => sum + f.springs.length, 0);
const linePositions = new Float32Array(totalLines * 6);
const lineColors = new Float32Array(totalLines * 6);
let lineIdx = 0;

for(let fig of figures){
  for(let s of fig.springs){
    const idx = lineIdx * 6;
    const ja = fig.joints[s.a];
    const jb = fig.joints[s.b];
    linePositions[idx]   = ja.pos.x;
    linePositions[idx+1] = ja.pos.y;
    linePositions[idx+2] = ja.pos.z;
    linePositions[idx+3] = jb.pos.x;
    linePositions[idx+4] = jb.pos.y;
    linePositions[idx+5] = jb.pos.z;
    
    // Color
    lineColors[idx]   = fig.color.r;
    lineColors[idx+1] = fig.color.g;
    lineColors[idx+2] = fig.color.b;
    lineColors[idx+3] = fig.color.r;
    lineColors[idx+4] = fig.color.g;
    lineColors[idx+5] = fig.color.b;
    
    lineIdx++;
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// ── Joint point sprites
const jointGeo = new THREE.BufferGeometry();
const jointPositions = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
const jointColors = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
let jointIdx = 0;

for(let fig of figures){
  for(let j of fig.joints){
    const idx = jointIdx * 3;
    jointPositions[idx]   = j.pos.x;
    jointPositions[idx+1] = j.pos.y;
    jointPositions[idx+2] = j.pos.z;
    
    jointColors[idx]   = fig.color.r * 1.3;
    jointColors[idx+1] = fig.color.g * 1.3;
    jointColors[idx+2] = fig.color.b * 1.3;
    
    jointIdx++;
  }
}

jointGeo.setAttribute('position', new THREE.BufferAttribute(jointPositions, 3));
jointGeo.setAttribute('color', new THREE.BufferAttribute(jointColors, 3));

const jointMat = new THREE.PointsMaterial({
  size: 0.35,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const points = new THREE.Points(jointGeo, jointMat);
scene.add(points);

// ── Stage floor (subtle dark plane)
const floorGeo = new THREE.PlaneGeometry(120, 120);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x180a05,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.4
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// ── Camera orbit — gentle drift
const cameraPath = {
  radius: 42,
  height: 12,
  speed: 0.008,
  lookHeight: 10
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Regenerate on click
addEventListener('click', () => {
  HASH = generateHash();
  document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';
  location.reload();
});

// ── Animate
const start = performance.now();
let lastTime = start;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  
  // Update all figures
  for(let fig of figures){
    fig.update(elapsed, dt);
  }
  
  // Update line geometry
  lineIdx = 0;
  const posAttr = lineGeo.attributes.position;
  const posArr = posAttr.array;
  for(let fig of figures){
    for(let s of fig.springs){
      const idx = lineIdx * 6;
      const ja = fig.joints[s.a];
      const jb = fig.joints[s.b];
      posArr[idx]   = ja.pos.x;
      posArr[idx+1] = ja.pos.y;
      posArr[idx+2] = ja.pos.z;
      posArr[idx+3] = jb.pos.x;
      posArr[idx+4] = jb.pos.y;
      posArr[idx+5] = jb.pos.z;
      lineIdx++;
    }
  }
  posAttr.needsUpdate = true;
  
  // Update joint geometry
  jointIdx = 0;
  const jointPosAttr = jointGeo.attributes.position;
  const jointPosArr = jointPosAttr.array;
  for(let fig of figures){
    for(let j of fig.joints){
      const idx = jointIdx * 3;
      jointPosArr[idx]   = j.pos.x;
      jointPosArr[idx+1] = j.pos.y;
      jointPosArr[idx+2] = j.pos.z;
      jointIdx++;
    }
  }
  jointPosAttr.needsUpdate = true;
  
  // Camera drift
  const angle = elapsed * cameraPath.speed;
  camera.position.set(
    Math.cos(angle) * cameraPath.radius,
    cameraPath.height + Math.sin(elapsed * 0.015) * 2.5,
    Math.sin(angle) * cameraPath.radius
  );
  camera.lookAt(0, cameraPath.lookHeight, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
