<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4o2 · folded leaves</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">4o2</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── folded-leaf structures: organic arrangement ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 3, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

/* ── leaf-twirl geometry builder ── */
function createLeafTwirl(params){
  const { length, width, curvature, twist, segments, midvein } = params;
  const positions = [];
  const uvs = [];
  const indices = [];
  
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const u = t * length;
    
    // arc path along length
    const theta = t * curvature;
    const baseX = Math.sin(theta) * (length / (curvature || 0.1));
    const baseY = (1 - Math.cos(theta)) * (length / (curvature || 0.1));
    
    // twist angle accumulates along length
    const twistAngle = t * twist;
    const cosT = Math.cos(twistAngle);
    const sinT = Math.sin(twistAngle);
    
    // width taper: wide at base, narrow at tip
    const widthHere = width * (1.0 - t * 0.7);
    
    // left and right edge
    for (let side = -1; side <= 1; side += 2){
      const localX = side * widthHere * 0.5;
      const localZ = 0;
      
      // apply twist
      const x = baseX + localX * cosT - localZ * sinT;
      const y = baseY;
      const z = localX * sinT + localZ * cosT;
      
      positions.push(x, y, z);
      uvs.push((side + 1) * 0.5, t);
    }
  }
  
  // midvein as calligraphic line
  const veinPositions = [];
  for (let i = 0; i <= segments * 2; i++){
    const t = i / (segments * 2);
    const u = t * length;
    const theta = t * curvature;
    const x = Math.sin(theta) * (length / (curvature || 0.1));
    const y = (1 - Math.cos(theta)) * (length / (curvature || 0.1));
    const twistAngle = t * twist;
    const z = 0.02 * Math.sin(twistAngle);
    veinPositions.push(x, y, z);
  }
  
  // triangulate
  for (let i = 0; i < segments; i++){
    const base = i * 2;
    indices.push(base, base+1, base+2);
    indices.push(base+1, base+3, base+2);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  
  const veinGeom = new THREE.BufferGeometry();
  veinGeom.setAttribute('position', new THREE.Float32BufferAttribute(veinPositions, 3));
  
  return { geom, veinGeom };
}

/* ── El Anatsui palette: ochre, sienna, copper, dust ── */
const palette = {
  ochre:  new THREE.Color(0.78, 0.58, 0.30),
  sienna: new THREE.Color(0.52, 0.34, 0.22),
  copper: new THREE.Color(0.72, 0.45, 0.28),
  dust:   new THREE.Color(0.92, 0.84, 0.66),
  burnt:  new THREE.Color(0.42, 0.28, 0.18),
};

/* ── leaf-twirl arrangements: 7 elements ── */
const leafConfigs = [
  // center dominant twirl
  { length: 4.2, width: 1.8, curvature: 1.8, twist: Math.PI * 1.2, segments: 40,
    pos: [0, 0, 0], rot: [0, 0, 0], color: palette.ochre, scale: 1.0 },
  // left unfurling
  { length: 3.5, width: 1.4, curvature: 2.2, twist: Math.PI * 0.9, segments: 35,
    pos: [-2.2, -0.5, 0.3], rot: [0.3, -0.6, 0.4], color: palette.sienna, scale: 0.85 },
  // right drooping
  { length: 3.8, width: 1.5, curvature: 1.6, twist: -Math.PI * 1.1, segments: 38,
    pos: [2.0, -0.3, -0.4], rot: [-0.2, 0.7, -0.3], color: palette.copper, scale: 0.9 },
  // upper left accent
  { length: 2.8, width: 1.1, curvature: 2.5, twist: Math.PI * 0.7, segments: 28,
    pos: [-1.5, 1.8, 0.5], rot: [0.5, -0.4, 0.6], color: palette.dust, scale: 0.7 },
  // lower right accent
  { length: 3.0, width: 1.2, curvature: 1.9, twist: -Math.PI * 0.8, segments: 30,
    pos: [1.6, -1.4, -0.2], rot: [-0.4, 0.5, -0.5], color: palette.burnt, scale: 0.75 },
  // back layer large
  { length: 3.9, width: 1.6, curvature: 1.7, twist: Math.PI * 1.0, segments: 36,
    pos: [0.3, -0.2, -1.2], rot: [0.1, 0.2, 0.1], color: palette.sienna, scale: 0.95 },
  // forward small detail
  { length: 2.4, width: 0.9, curvature: 2.8, twist: Math.PI * 1.3, segments: 24,
    pos: [-0.8, 0.8, 1.0], rot: [0.4, -0.3, 0.7], color: palette.ochre, scale: 0.6 },
];

const leafMeshes = [];
const veinLines = [];

leafConfigs.forEach((cfg, idx) => {
  const { geom, veinGeom } = createLeafTwirl(cfg);
  
  // leaf sheet material
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color,
    side: THREE.DoubleSide,
    roughness: 0.85,
    metalness: 0.12,
    transparent: true,
    opacity: 0.88,
    emissive: cfg.color,
    emissiveIntensity: 0.08,
  });
  
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(...cfg.pos);
  mesh.rotation.set(...cfg.rot);
  mesh.scale.setScalar(cfg.scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  leafMeshes.push(mesh);
  
  // midvein as dark line
  const veinMat = new THREE.LineBasicMaterial({
    color: 0x1a120a,
    opacity: 0.6,
    transparent: true,
    linewidth: 1,
  });
  const veinLine = new THREE.Line(veinGeom, veinMat);
  veinLine.position.copy(mesh.position);
  veinLine.rotation.copy(mesh.rotation);
  veinLine.scale.copy(mesh.scale);
  scene.add(veinLine);
  veinLines.push(veinLine);
});

/* ── lighting: warm ambient + key sidelight ── */
const ambientLight = new THREE.AmbientLight(0xf5e8d0, 0.45);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffcc88, 0.8);
keyLight.position.set(6, 8, 4);
keyLight.castShadow = true;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xaa7744, 0.35);
rimLight.position.set(-4, 2, -3);
scene.add(rimLight);

/* ── volumetric fog layer ── */
scene.fog = new THREE.Fog(0x0a0806, 8, 22);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  // gentle breathing motion on each leaf
  leafMeshes.forEach((mesh, i) => {
    const phase = elapsed * 0.3 + i * 0.8;
    const breathe = 0.015 * Math.sin(phase);
    mesh.rotation.z = leafConfigs[i].rot[2] + breathe;
    
    // subtle vertical drift
    const drift = 0.04 * Math.sin(phase * 0.6 + i * 1.2);
    mesh.position.y = leafConfigs[i].pos[1] + drift;
    
    veinLines[i].rotation.copy(mesh.rotation);
    veinLines[i].position.copy(mesh.position);
  });
  
  // camera slow orbit with vertical drift
  const orbitAngle = elapsed * 0.08;
  const radius = 14;
  camera.position.x = Math.sin(orbitAngle) * radius;
  camera.position.z = Math.cos(orbitAngle) * radius;
  camera.position.y = 3 + 0.5 * Math.sin(elapsed * 0.15);
  camera.lookAt(0, 0, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
