<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mbq · Shiota — Blood Meridian</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">mbq</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080000, 0.004));
const keyL = new THREE.PointLight(0xff1008, 0.018, 28, 1.8);
keyL.position.set(3, 5, -2);
scene.add(keyL);

let seed = 718293;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// THE SUSPENDED OBJECT — a single pale sphere, off-white cotton
const sphereCenter = new THREE.Vector3(1.5, 0.8, 0.5);
const sphereR = 1.8;

const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0, emissive: 0xf5ede4, emissiveIntensity: 0.85,
  roughness: 0.92, transparent: true, opacity: 0.35
});
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

const glowS = new THREE.PointLight(0xfff8f0, 0.008, 5, 2.2);
glowS.position.copy(sphereCenter);
scene.add(glowS);

// ROOM VOLUME — Shiota scale, walk-in cathedral
const ROOM = { w: 18, h: 16, d: 18 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHOR LATTICE — icosahedral shell + wall grid
const icoGeo = new THREE.IcosahedronGeometry(1, 1);
const icoPos = icoGeo.attributes.position;
const icoNorms = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNorms.push(v); }
}

const anchors = [];

// Nested icosahedral shells around sphere
const shellRadii = [3.2, 5.0, 7.0, 9.0];
for(const sr of shellRadii){
  for(const n of icoNorms){
    const pt = new THREE.Vector3(
      sphereCenter.x + n.x*sr,
      sphereCenter.y + n.y*sr*0.8,
      sphereCenter.z + n.z*sr
    );
    if(Math.abs(pt.x)<hw-0.3 && Math.abs(pt.y)<hh-0.3 && Math.abs(pt.z)<hd-0.3){
      anchors.push(pt);
    }
  }
}

// Wall anchors — Shiota uses floors/walls/ceiling as pinpoints
function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<60; i++) anchors.push(wallPt());

// Meridian points on sphere surface — threads converge here like blood vessels to a heart
const meridianPts = [];
const phiSteps = 16;
const thetaSteps = 8;
for(let p=0; p<phiSteps; p++){
  for(let t=0; t<thetaSteps; t++){
    const phi = (p/phiSteps)*Math.PI*2;
    const theta = (t/thetaSteps)*Math.PI;
    const x = sphereCenter.x + Math.sin(theta)*Math.cos(phi)*sphereR;
    const y = sphereCenter.y + Math.cos(theta)*sphereR;
    const z = sphereCenter.z + Math.sin(theta)*Math.sin(phi)*sphereR;
    meridianPts.push(new THREE.Vector3(x, y, z));
  }
}

// BUILD THREAD NETWORK — 20,000 line segments max (Shiota uses hundreds of thousands of meters, we scale to WebGL limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION — ceiling threads to sphere top (presence held by thread)
const topHemi = meridianPts.filter(p => p.y > sphereCenter.y + sphereR*0.5);
for(const mp of topHemi){
  const ceiling = new THREE.Vector3(mp.x + (rng()-0.5)*1.2, hh, mp.z + (rng()-0.5)*1.2);
  setLine(ceiling, mp);
}

// CONVERGENCE — anchors to nearest sphere meridian
// Shiota: threads converge to the object from all directions
for(let i=0; i<anchors.length && li<NUM_LINES-2000; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  if(d < sphereR*1.1) continue;
  
  // Each anchor sends 2-4 threads to sphere depending on distance
  const count = d<5.0 ? 3 : (d<8.0 ? 2 : 1);
  for(let j=0; j<count && li<NUM_LINES-1500; j++){
    let closest = meridianPts[0];
    let closestD = a.distanceTo(closest);
    for(let k=0; k<8; k++){
      const candidate = meridianPts[Math.floor(rng()*meridianPts.length)];
      const cd = a.distanceTo(candidate);
      if(cd < closestD){ closestD = cd; closest = candidate; }
    }
    setLine(a, closest);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold (Shiota: density through repeated connection)
const THRESH = 4.8;
let webCount = 0, attempts = 0;
while(webCount<4000 && li<NUM_LINES-2000 && attempts<30000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans (architectural tautness)
let wallSpans = 0;
while(wallSpans<1200 && li<NUM_LINES-500){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>2.0 && d<15.0){
    setLine(a, b);
    wallSpans++;
  }
}

// RADIAL THREADS outward from sphere (threads that almost reach but fail — the gap)
for(let i=0; i<600 && li<NUM_LINES-100; i++){
  const mp = meridianPts[Math.floor(rng()*meridianPts.length)];
  const dir = mp.clone().sub(sphereCenter).normalize();
  dir.x += (rng()-0.5)*0.25;
  dir.y += (rng()-0.5)*0.2;
  dir.z += (rng()-0.5)*0.25;
  dir.normalize();
  const len = 2.5 + rng()*4.0;
  const end = mp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(mp, end);
  }
}

// FILL remaining capacity with any-to-any
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  if(a.distanceTo(b)>1.0 && a.distanceTo(b)<12.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.08,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, Shiota's viewer-in-the-work principle
// Slow dolly that moves through the network, looking at/around the sphere
const pathLen = 2400;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.20){
    // Enter from the side, sphere in right frame
    const lt = t/0.20;
    x = sphereCenter.x - 7.0 + lt*2.0;
    y = sphereCenter.y + 0.5 + Math.sin(lt*Math.PI)*0.8;
    z = sphereCenter.z + 5.0 - lt*1.5;
  } else if(t<0.45){
    // Orbit close, threads cross the view
    const lt = (t-0.20)/0.25;
    const angle = lt*Math.PI*1.1 + 0.3;
    const r = 4.5 + Math.sin(lt*Math.PI)*0.6;
    x = sphereCenter.x + Math.cos(angle)*r;
    y = sphereCenter.y + 0.3 + Math.sin(lt*Math.PI*0.6)*0.5;
    z = sphereCenter.z + Math.sin(angle)*r;
  } else if(t<0.65){
    // Descend below, looking up through the web at the suspended object
    const lt = (t-0.45)/0.20;
    const angle = lt*Math.PI*0.7 + 1.8;
    const r = 5.0;
    x = sphereCenter.x + Math.cos(angle)*r;
    y = sphereCenter.y - lt*6.0;
    z = sphereCenter.z + Math.sin(angle)*r;
  } else if(t<0.85){
    // Rise along opposite side, threads in silhouette
    const lt = (t-0.65)/0.20;
    x = sphereCenter.x + Math.sin(lt*Math.PI*0.5+2.5)*5.5;
    y = sphereCenter.y - 6.0 + lt*8.0;
    z = sphereCenter.z + Math.cos(lt*Math.PI*0.5+2.5)*5.0;
  } else {
    // Recede into the void
    const lt = (t-0.85)/0.15;
    const r = 6.0 + lt*5.0;
    x = sphereCenter.x + Math.cos(lt*Math.PI*0.4+3.5)*r;
    y = sphereCenter.y + 2.0 - lt*1.5;
    z = sphereCenter.z + Math.sin(lt*Math.PI*0.4+3.5)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchors jitter <0.5%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.03 + basePositions[idx+1]*0.04 + i*0.0001;
    const breath = Math.sin(elapsed*0.0006 + phase)*0.00002;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.02;
      arr[vi+1] = basePositions[vi+1] + breath*0.015;
      arr[vi+2] = basePositions[vi+2] + breath*0.025;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000025;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    sphereCenter.x + Math.sin(elapsed*0.00010)*0.08,
    sphereCenter.y + Math.cos(elapsed*0.00008)*0.06,
    sphereCenter.z
  );

  keyL.intensity = 0.018 + Math.sin(elapsed*0.00007)*0.004;
  glowS.intensity = 0.008 + Math.sin(elapsed*0.00009)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
