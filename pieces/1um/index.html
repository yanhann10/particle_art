<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>1um · turrell attractor</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05060a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">1um</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  James Turrell — Aten Reign (2013, Guggenheim rotunda).
  Concentric ellipses of luminous color: cyan at the perimeter fading
  through magenta to a warm amber core overhead. The viewer stands
  inside the light; the light is the material.

  Here the Lorenz attractor's 65 k trajectories become translucent
  billboarded planes. Each plane is nearly invisible (opacity 0.06);
  where hundreds overlap the color accumulates into radiant density.
  Height in the attractor maps to Turrell's vertical color-temperature
  gradient: cold cyan below, magenta at the equator, warm amber above.
  The camera drifts slowly at mid-height so the viewer is *inside*
  the luminous volume, not observing it from outside.
*/

const W = 256, H = 256;
const N = W * H; // 65 536 planes

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

// ---- ping-pong GPGPU state ----
const rtOpts = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtOpts);
let rtB = new THREE.WebGLRenderTarget(W, H, rtOpts);

// seed particles near the attractor basin
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i*4]   = (Math.random()*2-1) * 6.0;
  init[i*4+1] = (Math.random()*2-1) * 6.0;
  init[i*4+2] = (Math.random()*2-1) * 6.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const fullQuad = new THREE.PlaneGeometry(2, 2);
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// blit init state
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(fullQuad, blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- Lorenz integrator ----
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.04, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ---- instanced planes ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);

const baseGeom = new THREE.PlaneGeometry(1, 1);
const instGeom = new THREE.InstancedBufferGeometry();
instGeom.index = baseGeom.index;
instGeom.attributes.position = baseGeom.attributes.position;
instGeom.attributes.uv = baseGeom.attributes.uv;

const uvIdxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdxArr[i*2]   = (x + 0.5) / W;
  uvIdxArr[i*2+1] = (y + 0.5) / H;
}
instGeom.setAttribute('uvIdx', new THREE.InstancedBufferAttribute(uvIdxArr, 2));
instGeom.instanceCount = N;

const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture },
    uSize: { value: 2.2 },
    uTime: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform sampler2D state;
    uniform float uSize;
    attribute vec2 uvIdx;
    varying vec2 vQuadUv;
    varying float vHeight;
    varying float vAge;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      p.z -= 25.0;           // center attractor vertically
      vHeight = p.z;          // attractor z → vertical bands
      vAge = s.w;
      vQuadUv = uv;

      // billboard in view space
      vec4 mvCenter = modelViewMatrix * vec4(p, 1.0);
      // scale planes slightly by distance for atmospheric perspective
      float dist = max(-mvCenter.z, 1.0);
      float sz = uSize * (50.0 / dist);
      mvCenter.xy += (position.xy) * sz;
      gl_Position = projectionMatrix * mvCenter;
    }
  `,
  fragmentShader: `
    varying vec2 vQuadUv;
    varying float vHeight;
    varying float vAge;
    void main(){
      // soft radial falloff — light, not geometry
      vec2 c = vQuadUv - 0.5;
      float r = length(c) * 2.0;
      float falloff = smoothstep(1.0, 0.15, r);
      falloff *= falloff;  // extra softness

      // Turrell vertical color-temperature gradient
      // attractor z (centered) ranges ~[-25, 25]
      float h = clamp((vHeight + 25.0) / 50.0, 0.0, 1.0);

      // three-band palette:
      //   bottom:  deep cyan    (0.06, 0.28, 0.52)
      //   middle:  soft magenta (0.42, 0.08, 0.38)
      //   top:     warm amber   (0.48, 0.32, 0.08)
      vec3 cyan    = vec3(0.06, 0.28, 0.52);
      vec3 magenta = vec3(0.42, 0.08, 0.38);
      vec3 amber   = vec3(0.48, 0.32, 0.08);

      vec3 col = mix(cyan, magenta, smoothstep(0.15, 0.55, h));
      col = mix(col, amber, smoothstep(0.50, 0.88, h));

      // slight age-driven luminance variation for liveliness
      float lum = 0.85 + 0.15 * sin(vAge * 6.2832);

      float alpha = falloff * 0.055 * lum;
      gl_FragColor = vec4(col * alpha * 1.8, alpha);
    }
  `
});
const mesh = new THREE.Mesh(instGeom, planeMat);
scene.add(mesh);

// ---- resize ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- pointer nudge (subtle, keeps canonical shape) ----
const target = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 4.0;
  target.sigma = 10.0 + nx * 1.8;
});

// ---- centroid tracking ----
// read-back a small subset of the state each frame would be expensive;
// instead, the Lorenz attractor's centroid is analytically known:
// mean x,y ≈ 0; mean z ≈ ρ - 1 ≈ 27 → shifted: 2.0
// we track it softly
const centroid = new THREE.Vector3(0, 0, 2.0);

let lastTime = performance.now();

function loop() {
  const now = performance.now();
  lastTime = now;

  // ease parameters
  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.04;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.04;

  // step sim — 4 substeps
  for (let i = 0; i < 4; i++) {
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  planeMat.uniforms.state.value = rtA.texture;
  planeMat.uniforms.uTime.value = now * 0.001;

  // slow drift orbit — Turrell's tempo, not a screensaver
  // elliptical orbit, slightly elevated, viewer partially inside the form
  const t = now * 0.00006;
  const rx = 52.0 + Math.sin(t * 0.7) * 12.0;  // breathing radius
  const ry = 8.0 + Math.sin(t * 1.3) * 5.0;     // gentle vertical drift
  camera.position.set(
    Math.sin(t) * rx,
    ry,
    Math.cos(t) * rx
  );

  // soft centroid track
  const cz = (simUniforms.uRho.value - 1.0) - 25.0;
  centroid.z += (cz - centroid.z) * 0.02;
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
