<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a7m · baldachin (canopy)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">a7m · baldachin</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">ceremonial canopy morphogenesis</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// BALDACHIN: The differential growth system now responds to vertical stratification.
// The base ring remains anchored near y=0 while the expanding form lifts upward,
// creating a ceremonial canopy structure with draped vertical curtains between
// support points. The rebound mechanism is reframed as a ritual gesture: periodic
// descents where the canopy lowers solemnly before rising again.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0806, 0.035);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 10, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 3, 0);

const MAX_VERTS = 4000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE_BASE = 0.0035;
const MAX_D    = 0.32;
const R_WALL   = 6.5;
const DESCEND_DURATION = 240;

let descending = false;
let descendTimer = 0;

const verts = [];
const NV0 = 24;
for (let i = 0; i < NV0; i++){
  const th = i / NV0 * Math.PI * 2;
  const r  = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ 
    x: Math.cos(th) * r, 
    z: Math.sin(th) * r, 
    y: 0, 
    age: 0,
    anchor: i % 6 === 0  // every 6th vertex is a support column
  });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x, z){ return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const arr = grid.get((cx+dx) + ',' + (cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  if (!descending){
    for (let i = 0; i < n; i++){
      const v = verts[i];
      const r = Math.hypot(v.x, v.z);
      if (r > R_WALL){
        descending = true;
        descendTimer = DESCEND_DURATION;
        break;
      }
    }
  } else {
    descendTimer--;
    if (descendTimer <= 0) descending = false;
  }

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex*ex + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }

  for (let i = 0; i < n; i++){
    const a = verts[(i - 1 + n) % n];
    const b = verts[(i + 1) % n];
    const v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }

  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  const pressureSign = descending ? -1.0 : 1.0;
  const pressureMag  = descending ? 0.008 : PRESSURE_BASE;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * pressureMag * pressureSign;
    dz[i] += (oz / d) * pressureMag * pressureSign;
  }

  // Baldachin vertical structure: anchors stay low, others rise to form canopy
  for (let i = 0; i < n; i++){
    const v = verts[i];
    let yTarget;
    
    if (v.anchor){
      // Support columns remain near ground
      yTarget = 0.3;
    } else {
      // Canopy fabric rises with age
      const lift = Math.min(v.age * 1.8, 6.5);
      yTarget = lift;
    }
    
    if (descending){
      // Ceremonial descent: all parts lower
      const descendPhase = 1.0 - (descendTimer / DESCEND_DURATION);
      yTarget *= (1.0 - descendPhase * 0.7);
    }
    
    dy[i] = (yTarget - v.y) * 0.04;
    
    // Add draping gravity between anchor points
    if (!v.anchor){
      const r = Math.hypot(v.x - cx, v.z - cz);
      const sag = Math.sin(r * 0.5) * 0.4;
      dy[i] -= sag * 0.02;
    }
  }

  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i];
    verts[i].age += 0.0006;
  }

  if (!descending){
    const grown = [];
    for (let i = 0; i < n; i++){
      const a = verts[i], b = verts[(i + 1) % n];
      grown.push(a);
      const ex = b.x - a.x, ez = b.z - a.z;
      if (ex*ex + ez*ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS){
        grown.push({ 
          x: (a.x + b.x) * 0.5, 
          z: (a.z + b.z) * 0.5,
          y: (a.y + b.y) * 0.5, 
          age: Math.max(a.age, b.age) * 0.85,
          anchor: false
        });
      }
    }
    verts.length = 0;
    for (const v of grown) verts.push(v);
  }
}

const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
const rAnchor    = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('anchor',   new THREE.BufferAttribute(rAnchor, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uDescend: { value: 0.0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uDescend;
    attribute float seed;
    attribute float age;
    attribute float anchor;
    varying vec3 vCol;
    varying float vAge;
    void main(){
      vec3 p = position;
      vAge = age;
      float t = uTime * 0.5 + seed * 6.28;
      p += 0.005 * vec3(sin(t), 0.0, cos(t));

      // Palette: rich burgundy/gold ceremonial fabric
      vec3 fabricCol = vec3(0.72, 0.28, 0.32);
      vec3 goldCol = vec3(0.95, 0.82, 0.48);
      vec3 descendCol = vec3(0.45, 0.38, 0.52);
      
      float k = clamp(age * 0.8, 0.0, 1.0);
      vec3 baseCol = mix(fabricCol, goldCol, smoothstep(0.7, 1.0, k) * anchor * 0.9);
      baseCol = mix(baseCol, goldCol * 0.6, (1.0 - anchor) * smoothstep(0.85, 1.0, k) * 0.3);
      vCol = mix(baseCol, descendCol, uDescend * 0.5);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeMult = 1.0 + anchor * 0.4;
      gl_PointSize = 1.4 * uPixel * (40.0 / dist) * sizeMult;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAge;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * 0.65;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 600; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 4; s++) step();

  const descendPhase = descending ? (1.0 - descendTimer / DESCEND_DURATION) : 0.0;
  uniforms.uDescend.value = descendPhase;

  const n = verts.length;
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    const L = Math.sqrt(ex*ex + ez*ez + ey*ey);
    lengths.push(L); total += L;
  }
  if (total > 0){
    let written = 0;
    for (let i = 0; i < n; i++){
      const share = (i === n - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[(i + 1) % n];
      const anchorVal = (a.anchor || b.anchor) ? 1.0 : 0.0;
      for (let k = 0; k < share && written < N_RENDER; k++){
        const u = Math.random();
        rPositions[written*3]   = a.x + (b.x - a.x) * u + (Math.random()-0.5) * 0.02;
        rPositions[written*3+1] = a.y + (b.y - a.y) * u;
        rPositions[written*3+2] = a.z + (b.z - a.z) * u + (Math.random()-0.5) * 0.02;
        rAge[written] = Math.max(a.age, b.age);
        rAnchor[written] = anchorVal;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.anchor.needsUpdate = true;
  }
  const modeStr = descending ? ' · descending' : ' · rising';
  statEl.textContent = `vertices=${n}${modeStr}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
