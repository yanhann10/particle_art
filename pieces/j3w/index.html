<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yy3 · mono no aware · faces dissolving into impermanence</title>
<!-- MOTION: morph + dissolve, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">j3w</div>
<div class="hint">drag to orbit · each cycle sheds what cannot be held</div>
<div class="src">Hiroshi Sugimoto · Theaters (1976–) · long-exposure dissolution of form</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Mono no aware — the pathos of things, gentle sadness of impermanence.
// Continuing the ancestral face morph from s47 (Nouf Aljowaysir genealogical
// interpolation), but now each generation cycle sheds particles that drift
// downward like petals — memories that cannot be held. Over time the faces
// thin, losing resolution, as lineage dissolves into light.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0908, 0.015);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 7.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0908, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xc9a88a, 1.2);
lightKey.position.set(3, 5, 4);
scene.add(lightKey);
const lightFill = new THREE.DirectionalLight(0x6a5552, 0.4);
lightFill.position.set(-4, 2, -3);
scene.add(lightFill);
scene.add(new THREE.AmbientLight(0x151010, 0.5));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.4, 0);
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 12;

// ─────────── THREE FACIAL ARCHETYPES (inherited from s47)

function buildArchetype(deformFunc, color){
  const N_LAT = 32, N_LON = 64;
  const positions = [];
  const colors = [];
  for (let i = 0; i <= N_LAT; i++){
    const phi = (i / N_LAT) * Math.PI;
    for (let j = 0; j <= N_LON; j++){
      const theta = (j / N_LON) * Math.PI * 2;
      const base = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi),
        Math.sin(phi) * Math.sin(theta)
      );
      const pos = deformFunc(base);
      positions.push(pos.x, pos.y, pos.z);
      colors.push(color.r, color.g, color.b);
    }
  }
  return { positions, colors };
}

function deformA(base){
  const p = base.clone().multiplyScalar(1.8);
  if (p.y < 0){
    const widen = (1 + 0.5 * (1 - Math.abs(p.y) / 1.8));
    p.x *= widen; p.z *= widen;
  }
  const brow = Math.exp(-Math.pow((p.y - 0.7) / 0.3, 2));
  p.z += brow * 0.3;
  if (p.z > 0 && Math.abs(p.y) < 0.5){
    const squeeze = Math.exp(-Math.pow(p.z / 0.8, 2));
    p.x *= (1 - squeeze * 0.4);
  }
  return p;
}

function deformB(base){
  const p = base.clone().multiplyScalar(1.7);
  const cheek = Math.exp(-Math.pow((p.y - 0.1) / 0.6, 2)) * Math.exp(-Math.pow(p.z / 0.7, 2));
  p.x *= (1 + cheek * 0.3);
  if (p.y < -0.8){
    const taper = 1 - 0.3 * Math.abs((p.y + 0.8) / 1.0);
    p.x *= taper; p.z *= taper;
  }
  return p;
}

function deformC(base){
  const p = base.clone().multiplyScalar(1.65);
  const cheek = Math.exp(-Math.pow((p.y - 0.3) / 0.4, 2)) * Math.exp(-Math.pow(p.z / 0.6, 2));
  p.x *= (1 + cheek * 0.4);
  if (p.y < -0.5){
    const shape = 1 - 0.5 * Math.pow(Math.abs(p.y + 0.5) / 1.2, 1.5);
    p.x *= shape; p.z *= shape;
  }
  if (p.z > 0 && Math.abs(p.y) < 0.6){
    const nose = Math.exp(-Math.pow(p.z / 0.5, 2)) * Math.exp(-Math.pow(p.y / 0.6, 2));
    p.z += nose * 0.25;
  }
  return p;
}

// Palette faded — old photographs bleaching in sunlight
const colorA = new THREE.Color(0x9a8878); // faded sepia
const colorB = new THREE.Color(0x8a7a74); // ash rose
const colorC = new THREE.Color(0x5a504e); // warm grey

const archetypeA = buildArchetype(deformA, colorA);
const archetypeB = buildArchetype(deformB, colorB);
const archetypeC = buildArchetype(deformC, colorC);

const N_POINTS = archetypeA.positions.length / 3;

// ─────────── MAIN FACE PARTICLES
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(N_POINTS * 3);
const colors = new Float32Array(N_POINTS * 3);
const alphas = new Float32Array(N_POINTS);

const particleState = [];
for (let i = 0; i < N_POINTS; i++){
  particleState.push({
    current: new THREE.Vector3(
      archetypeA.positions[i*3],
      archetypeA.positions[i*3+1],
      archetypeA.positions[i*3+2]
    ),
    target: new THREE.Vector3(),
    lagPhase: Math.random() * Math.PI * 2,
    colorCurrent: new THREE.Color(colorA.r, colorA.g, colorA.b),
    colorTarget: new THREE.Color(),
    alive: true,
    shedCycle: -1,       // cycle when this particle was shed
    shedVelocity: new THREE.Vector3(),
    opacity: 1.0,
    shedChance: Math.random(), // pre-rolled — lower = sheds sooner
  });
  alphas[i] = 1.0;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

// Custom shader material for per-particle alpha
const material = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying vec3 vColor;
    void main(){
      vAlpha = alpha;
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 2.8 * (300.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vColor;
    uniform vec3 fogColor;
    uniform float fogDensity;
    void main(){
      // soft circle
      vec2 c = gl_PointCoord - 0.5;
      float r = length(c);
      if(r > 0.5) discard;
      float soft = 1.0 - smoothstep(0.3, 0.5, r);
      // manual fog
      float fogFactor = 1.0 - exp(-fogDensity * fogDensity * gl_FragCoord.z / gl_FragCoord.w * gl_FragCoord.z / gl_FragCoord.w);
      fogFactor = clamp(fogFactor, 0.0, 1.0);
      vec3 col = mix(vColor, fogColor, fogFactor);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `,
  uniforms: {
    fogColor: { value: new THREE.Color(0x0b0908) },
    fogDensity: { value: 0.015 },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const pointCloud = new THREE.Points(geometry, material);
scene.add(pointCloud);

// ─────────── FALLEN PARTICLES — a second system for shed particles
// that drift down like cherry petals, fading to nothing
const MAX_FALLEN = 1200;
const fallenGeo = new THREE.BufferGeometry();
const fallenPos = new Float32Array(MAX_FALLEN * 3);
const fallenCol = new Float32Array(MAX_FALLEN * 3);
const fallenAlpha = new Float32Array(MAX_FALLEN);
fallenGeo.setAttribute('position', new THREE.BufferAttribute(fallenPos, 3));
fallenGeo.setAttribute('color', new THREE.BufferAttribute(fallenCol, 3));
fallenGeo.setAttribute('alpha', new THREE.BufferAttribute(fallenAlpha, 1));

const fallenMat = new THREE.ShaderMaterial({
  vertexShader: material.vertexShader,
  fragmentShader: material.fragmentShader,
  uniforms: {
    fogColor: { value: new THREE.Color(0x0b0908) },
    fogDensity: { value: 0.015 },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const fallenCloud = new THREE.Points(fallenGeo, fallenMat);
scene.add(fallenCloud);

const fallenParticles = [];

// ─────────── MORPH STATE
let morphPhase = 0;
let morphT = 0;
const PHASE_DURATION = 12.0; // slower, more contemplative
let lastTime = performance.now();
let totalCycles = 0;

function getArchetypeData(phase){
  if (phase === 0) return { src: archetypeA, dst: archetypeB, srcColor: colorA, dstColor: colorB };
  if (phase === 1) return { src: archetypeB, dst: archetypeC, srcColor: colorB, dstColor: colorC };
  return { src: archetypeC, dst: archetypeA, srcColor: colorC, dstColor: colorA };
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── CENTROID TRACKING
const centroid = new THREE.Vector3();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  morphT += dt / PHASE_DURATION;

  if (morphT >= 1.0){
    morphT = 0;
    morphPhase = (morphPhase + 1) % 3;
    totalCycles++;

    // Each cycle, shed some particles — mono no aware, things slipping away
    const shedRate = Math.min(0.03 + totalCycles * 0.005, 0.12);
    for (let i = 0; i < N_POINTS; i++){
      const s = particleState[i];
      if (s.alive && s.shedChance < shedRate){
        s.alive = false;
        s.shedCycle = totalCycles;
        // gentle downward drift with slight lateral wander
        s.shedVelocity.set(
          (Math.random() - 0.5) * 0.15,
          -0.08 - Math.random() * 0.12,
          (Math.random() - 0.5) * 0.15
        );
        // add to fallen system
        if (fallenParticles.length < MAX_FALLEN){
          fallenParticles.push({
            pos: s.current.clone(),
            vel: s.shedVelocity.clone(),
            color: s.colorCurrent.clone(),
            life: 1.0,
            decay: 0.04 + Math.random() * 0.06,
          });
        }
      }
    }

    const { dst } = getArchetypeData(morphPhase);
    for (let i = 0; i < N_POINTS; i++){
      particleState[i].target.set(dst.positions[i*3], dst.positions[i*3+1], dst.positions[i*3+2]);
      const { dstColor } = getArchetypeData(morphPhase);
      particleState[i].colorTarget.copy(dstColor);
    }
  }

  // ─── update main face particles
  const posAttr = geometry.attributes.position.array;
  const colAttr = geometry.attributes.color.array;
  const alphaAttr = geometry.attributes.alpha.array;

  centroid.set(0, 0, 0);
  let aliveCount = 0;

  for (let i = 0; i < N_POINTS; i++){
    const s = particleState[i];

    if (!s.alive){
      // fade out in main cloud
      s.opacity = Math.max(0, s.opacity - dt * 0.5);
      alphaAttr[i] = s.opacity;
      if (s.opacity <= 0){
        posAttr[i*3] = 0; posAttr[i*3+1] = -100; posAttr[i*3+2] = 0;
      }
      continue;
    }

    aliveCount++;
    const lagAmount = 0.35 * (0.5 + 0.5 * Math.sin(s.lagPhase + morphT * Math.PI * 2));
    let effectiveT = morphT - lagAmount;
    effectiveT = Math.max(0, Math.min(1, effectiveT));
    const ease = effectiveT < 0.5
      ? 2 * effectiveT * effectiveT
      : 1 - Math.pow(-2 * effectiveT + 2, 2) / 2;

    s.current.lerpVectors(s.current, s.target, 0.02 + ease * 0.06);

    // Mid-transition jitter — but gentler, like a sigh
    const jitter = (1 - Math.abs(effectiveT - 0.5) * 2) * 0.015;
    const jx = (Math.random() - 0.5) * jitter;
    const jy = (Math.random() - 0.5) * jitter;
    const jz = (Math.random() - 0.5) * jitter;

    posAttr[i*3]   = s.current.x + jx;
    posAttr[i*3+1] = s.current.y + jy;
    posAttr[i*3+2] = s.current.z + jz;

    // Subtle breath: opacity pulses with a slow sine
    const breathe = 0.75 + 0.25 * Math.sin(now * 0.0004 + s.lagPhase);
    alphaAttr[i] = breathe;

    s.colorCurrent.lerp(s.colorTarget, 0.015 + ease * 0.04);
    // As cycles pass, colors fade toward warm grey — photographs bleaching
    const fadeAmount = Math.min(totalCycles * 0.04, 0.5);
    const fadedColor = s.colorCurrent.clone().lerp(new THREE.Color(0x7a7570), fadeAmount);
    colAttr[i*3]   = fadedColor.r;
    colAttr[i*3+1] = fadedColor.g;
    colAttr[i*3+2] = fadedColor.b;

    centroid.x += posAttr[i*3];
    centroid.y += posAttr[i*3+1];
    centroid.z += posAttr[i*3+2];
  }

  if (aliveCount > 0){
    centroid.divideScalar(aliveCount);
    // Gentle camera target tracking
    controls.target.lerp(centroid, 0.01);
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
  geometry.attributes.alpha.needsUpdate = true;

  // ─── update fallen particles (petals drifting down)
  const fPos = fallenGeo.attributes.position.array;
  const fCol = fallenGeo.attributes.color.array;
  const fAlpha = fallenGeo.attributes.alpha.array;

  for (let i = fallenParticles.length - 1; i >= 0; i--){
    const fp = fallenParticles[i];
    fp.life -= fp.decay * dt;
    if (fp.life <= 0){
      fallenParticles.splice(i, 1);
      continue;
    }
    // gentle drift with slight sine wander
    fp.pos.x += fp.vel.x * dt + Math.sin(now * 0.001 + i) * 0.003 * dt;
    fp.pos.y += fp.vel.y * dt;
    fp.pos.z += fp.vel.z * dt + Math.cos(now * 0.0012 + i) * 0.003 * dt;
    // slow down
    fp.vel.multiplyScalar(0.998);
  }

  // write fallen to buffers
  for (let i = 0; i < MAX_FALLEN; i++){
    if (i < fallenParticles.length){
      const fp = fallenParticles[i];
      fPos[i*3] = fp.pos.x;
      fPos[i*3+1] = fp.pos.y;
      fPos[i*3+2] = fp.pos.z;
      fCol[i*3] = fp.color.r;
      fCol[i*3+1] = fp.color.g;
      fCol[i*3+2] = fp.color.b;
      fAlpha[i] = fp.life * 0.6;
    } else {
      fPos[i*3+1] = -100;
      fAlpha[i] = 0;
    }
  }
  fallenGeo.attributes.position.needsUpdate = true;
  fallenGeo.attributes.color.needsUpdate = true;
  fallenGeo.attributes.alpha.needsUpdate = true;

  // slow contemplative rotation
  pointCloud.rotation.y += 0.0012;
  fallenCloud.rotation.y = pointCloud.rotation.y;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// Initialize first morph phase targets
const { dst } = getArchetypeData(0);
for (let i = 0; i < N_POINTS; i++){
  particleState[i].target.set(dst.positions[i*3], dst.positions[i*3+1], dst.positions[i*3+2]);
  const { dstColor } = getArchetypeData(0);
  particleState[i].colorTarget.copy(dstColor);
}

loop();
</script>
</body>
