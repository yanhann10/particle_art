<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytq · reverie</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">ytq · reverie</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev:     { value: rtA.texture },
  uDt:      { value: 0.012 },
  uA:       { value: 0.95 },
  uB:       { value: 0.70 },
  uC:       { value: 0.60 },
  uD:       { value: 3.50 },
  uE:       { value: 0.25 },
  uF:       { value: 0.10 },
  uGust:    { value: 0.0 },
  uGlaze:   { value: 0.0 },
  uReverie: { value: 0.0 },
  uTime:    { value: 0.0 },
  uRes:     { value: new THREE.Vector2(W, H) }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uGust, uGlaze, uReverie, uTime;
    uniform vec2 uRes;
    varying vec2 vUv;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec2 pid = vUv * uRes;

      float h1 = hash(pid);
      float h2 = hash(pid + 71.0);
      float h3 = hash(pid + 137.0);

      // Aizawa attractor — softened by reverie
      float attractorStrength = mix(1.0, 0.35, uReverie);
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      ) * attractorStrength;

      // Leaf-flurry gust (inherited, fading with glaze)
      if(uGust > 0.01){
        float phase = h1 * 6.2832;
        float freq = 3.0 + h2 * 5.0;
        float flutter_x = sin(uTime * freq + phase) * (0.8 + h3);
        float flutter_y = cos(uTime * freq * 0.7 + phase * 1.3) * (0.6 + h1);
        float flutter_z = sin(uTime * freq * 0.5 + phase * 0.7) * 0.4;
        vec3 centroid = vec3(0.0, 0.0, 1.0);
        vec3 outward = normalize(p - centroid + vec3(0.001));
        float dist = length(p - centroid);
        vec3 gustForce = outward * (2.5 / (1.0 + dist))
                       + vec3(flutter_x, flutter_y - 0.6, flutter_z) * 1.8;
        dp += gustForce * uGust * (1.0 - uGlaze);
      }

      // Celadon glaze (inherited, still active but softening into reverie)
      if(uGlaze > 0.01){
        float g = uGlaze * (1.0 - uReverie * 0.7);
        float channel = floor(h1 * 7.0);
        float channelPhase = channel * 0.897;
        float theta = channelPhase + 0.3 * sin(uTime * 0.2 + channel);
        vec3 rivCenter = vec3(cos(theta) * 0.5, p.y, sin(theta) * 0.5 + 1.0);
        vec3 toRiv = rivCenter - p;
        toRiv.y = 0.0;
        float latDist = length(toRiv);
        float flowSpeed = 0.4 + 0.3 * h2;
        float pooling = smoothstep(-1.5, -0.5, p.y);
        flowSpeed *= (1.0 - pooling * 0.8);
        vec3 glazeForce = vec3(0.0);
        glazeForce += toRiv * 2.0 * smoothstep(0.0, 0.8, latDist);
        glazeForce.y -= flowSpeed;
        dp *= mix(1.0, 0.3, g);
        float speed = length(dp);
        if(speed > 1.5) dp *= 1.5 / speed;
        dp += glazeForce * g * 1.5;
        if(p.y < -2.0){
          p.y = 1.8 + h3 * 0.5;
          p.x = cos(theta) * (0.3 + h2 * 0.3);
          p.z = sin(theta) * (0.3 + h2 * 0.3) + 1.0;
        }
      }

      // Reverie phase — Odilon Redon's pastel dissolution
      // Gravity releases, particles drift upward like half-remembered thoughts
      // The attractor form loosens but remains as a ghostly scaffold
      if(uReverie > 0.01){
        float rev = uReverie;

        // Gentle upward buoyancy — thoughts rising
        float buoy = 0.15 + h2 * 0.12;
        dp.y += buoy * rev;

        // Slow breathing expansion/contraction around centroid
        vec3 centroid = vec3(0.0, 0.5 * rev, 1.0);
        vec3 fromCenter = p - centroid;
        float dist = length(fromCenter);
        float breathPhase = sin(uTime * 0.18) * 0.5 + 0.5;
        // Particles pulse outward then inward, very slowly
        float breathForce = mix(-0.08, 0.12, breathPhase);
        dp += normalize(fromCenter + 0.001) * breathForce * rev;

        // Slow lateral drift — dreamlike wandering per-particle
        float driftPhase = h1 * 6.2832 + uTime * 0.07;
        float driftFreq = 0.3 + h3 * 0.2;
        dp.x += sin(driftPhase * driftFreq) * 0.06 * rev;
        dp.z += cos(driftPhase * driftFreq * 0.8 + 1.7) * 0.06 * rev;

        // Viscous damping increases — everything slows to a crawl
        dp *= mix(1.0, 0.55, rev);

        // Soft containment sphere — don't let particles escape too far
        if(dist > 2.5){
          dp -= normalize(fromCenter) * (dist - 2.5) * 0.3 * rev;
        }

        // Wrap pooled particles back up gently instead of sharply
        if(p.y < -1.5 && rev > 0.3){
          dp.y += ((-1.0 - p.y) * 0.15) * rev;
        }
      }

      float damping = mix(1.0, 0.92, uGlaze);
      damping = mix(damping, 0.88, uReverie);
      p += dp * uDt * damping;

      age = mod(age + uDt * mix(0.06, 0.025, uReverie), 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// Render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 80);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtB.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uGust:    { value: 0.0 },
    uGlaze:   { value: 0.0 },
    uReverie: { value: 0.0 },
    uTime:    { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uGust;
    uniform float uGlaze;
    uniform float uReverie;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vGlaze;
    varying float vReverie;
    varying float vY;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vGust = uGust;
      vGlaze = uGlaze;
      vReverie = uReverie;
      vY = p.y;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      float gustSize = 1.0 + uGust * 1.2 * (1.0 - uGlaze);
      float poolFactor = smoothstep(-1.8, -0.5, p.y) * uGlaze * (1.0 - uReverie * 0.6);
      float glazeSize = 1.0 + poolFactor * 1.8;

      // Reverie: particles soften and swell gently, breathing
      float breathPulse = sin(uTime * 0.22 + vAge * 6.28) * 0.5 + 0.5;
      float revSize = 1.0 + uReverie * (0.4 + breathPulse * 0.5);

      float sz = (1.1 + 1.5 * vSpeed) * uPixel * (8.0 / max(dist, 0.5))
                 * gustSize * glazeSize * revSize;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vGlaze;
    varying float vReverie;
    varying float vY;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // Softer falloff in reverie — hazier edges like Redon pastels
      float sharpness = mix(14.0, 6.0, vReverie);
      float a = exp(-r * sharpness);

      // Leaf palette
      vec3 a_leaf = vec3(0.20, 0.62, 0.45);
      vec3 b_leaf = vec3(0.55, 0.30, 0.78);
      vec3 c_leaf = vec3(0.92, 0.95, 0.98);

      // Autumn gust
      vec3 a_aut = vec3(0.85, 0.55, 0.12);
      vec3 b_aut = vec3(0.72, 0.28, 0.10);
      vec3 c_aut = vec3(0.98, 0.92, 0.78);

      // Celadon glaze — Longquan
      vec3 a_cel = vec3(0.55, 0.74, 0.62);
      vec3 b_cel = vec3(0.40, 0.58, 0.50);
      vec3 c_cel = vec3(0.78, 0.86, 0.80);

      // Reverie palette — Odilon Redon pastel: jade-mist dissolving into lavender pearl
      vec3 a_rev = vec3(0.52, 0.66, 0.68); // misted jade-grey
      vec3 b_rev = vec3(0.58, 0.50, 0.70); // soft lavender
      vec3 c_rev = vec3(0.85, 0.88, 0.92); // pearl-white breath

      // Blend through phases
      float gustBlend = vGust * (1.0 - vGlaze);
      vec3 ca = mix(a_leaf, a_aut, gustBlend);
      vec3 cb = mix(b_leaf, b_aut, gustBlend);
      vec3 cc = mix(c_leaf, c_aut, gustBlend);

      ca = mix(ca, a_cel, vGlaze);
      cb = mix(cb, b_cel, vGlaze);
      cc = mix(cc, c_cel, vGlaze);

      // Celadon dissolves into reverie tones
      ca = mix(ca, a_rev, vReverie);
      cb = mix(cb, b_rev, vReverie);
      cc = mix(cc, c_rev, vReverie);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(ca, cb, smoothstep(0.0, 0.5, k));
      col = mix(col, cc, smoothstep(0.5, 1.0, k));

      // Glaze pool glow (fades in reverie)
      float poolGlow = smoothstep(-1.8, -0.5, vY) * vGlaze * (1.0 - vReverie * 0.7) * 0.3;
      col += poolGlow * vec3(0.1, 0.15, 0.1);

      // Reverie glow: upper particles gain a faint luminous bloom
      float riseGlow = smoothstep(0.0, 1.5, vY) * vReverie * 0.15;
      col += riseGlow * vec3(0.12, 0.10, 0.18);

      // Opacity: reverie particles become more translucent — ghostly
      float baseOpacity = 0.45 + vSpeed * 0.9 + vGlaze * 0.2;
      baseOpacity = mix(baseOpacity, 0.35 + vSpeed * 0.5, vReverie);
      float opacity = a * baseOpacity;
      gl_FragColor = vec4(col * opacity, opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();
const gustPeriod = 11.0;
const gustDuration = 2.5;
const gustAttack = 0.4;
const gustDecay = 1.8;

const glazeStart = 8.0;
const glazeFull = 30.0;
// Reverie emerges as the glaze settles, fully dreaming by ~55s
const reverieStart = 25.0;
const reverieFull = 55.0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;

  // Glaze
  const glaze = Math.min(1.0, Math.max(0.0, (elapsed - glazeStart) / (glazeFull - glazeStart)));
  simUniforms.uGlaze.value = glaze;
  pointsMat.uniforms.uGlaze.value = glaze;

  // Reverie
  const reverie = Math.min(1.0, Math.max(0.0, (elapsed - reverieStart) / (reverieFull - reverieStart)));
  simUniforms.uReverie.value = reverie;
  pointsMat.uniforms.uReverie.value = reverie;
  pointsMat.uniforms.uTime.value = elapsed;

  // Gust (fades with glaze, gone by reverie)
  const cycleT = elapsed % gustPeriod;
  let gust = 0.0;
  if(cycleT < gustDuration){
    if(cycleT < gustAttack){
      gust = (cycleT / gustAttack);
      gust = gust * gust;
    } else {
      const decayT = (cycleT - gustAttack) / gustDecay;
      gust = Math.max(0.0, 1.0 - decayT);
      gust = gust * gust;
    }
  }
  gust *= (1.0 - glaze * 0.85);
  gust *= (1.0 - reverie);
  simUniforms.uGust.value = gust;
  pointsMat.uniforms.uGust.value = gust;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // Camera: orbit slows to near-stillness in reverie, gently breathes vertically
  const orbitSpeed = lerp(0.12, 0.03, reverie);
  const ang = elapsed * orbitSpeed;
  const baseDist = lerp(lerp(4.0, 3.5, glaze), 3.8, reverie);
  const camDist = baseDist + gust * 2.0;
  camera.position.x = Math.sin(ang) * camDist;
  camera.position.z = Math.cos(ang) * camDist;

  // Gentle vertical breathing in reverie — like slow respiration
  const breathY = Math.sin(elapsed * 0.15) * 0.2 * reverie;
  const camY = lerp(lerp(Math.sin(ang * 0.7) * 1.0, 0.3, glaze), 0.6 + breathY, reverie);
  camera.position.y = camY;

  // Look-at drifts upward as particles rise in reverie
  const lookY = lerp(lerp(1.0, 0.2, glaze), 0.7, reverie);
  camera.lookAt(0, lookY, 1.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function lerp(a, b, t){ return a + (b - a) * t; }

loop();
</script>
</body>
</html>
