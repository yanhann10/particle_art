               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<div class="id">dys</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);
scene.fog = new THREE.Fog(0x0a0a0f, 20, 50);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 28);
camera.lookAt(0, 7, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const PALETTE = [
  [0.48, 0.50, 0.55],
  [0.38, 0.42, 0.50],
  [0.55, 0.58, 0.62],
  [0.30, 0.35, 0.42],
  [0.60, 0.62, 0.66],
];

const thickSegs = [];
const medSegs = [];
const thinSegs = [];
const thickCols = [];
const medCols = [];
const thinCols = [];
const jointPositions = [];

function pickColor(y) {
  const t = Math.min(1, Math.max(0, (y + 2) / 18));
  const idx = Math.min(PALETTE.length - 1, Math.floor(t * PALETTE.length));
  const c = PALETTE[idx];
  const v = 0.9 + Math.random() * 0.2;
  return [c[0]*v, c[1]*v, c[2]*v];
}

function generateFrond(baseX, baseZ, mainAngle) {
  const startY = -2 + Math.random() * 1.5;
  let pos = new THREE.Vector3(baseX, startY, baseZ);
  let dir = new THREE.Vector3(
    Math.sin(mainAngle) * 0.25,
    0.88,
    Math.cos(mainAngle) * 0.25
  ).normalize();

  const rachisLen = 10 + Math.random() * 8;
  const rachisN = 10 + Math.floor(Math.random() * 6);
  const segL = rachisLen / rachisN;

  for (let i = 0; i < rachisN; i++) {
    dir.x += (Math.random() - 0.5) * 0.06;
    dir.z += (Math.random() - 0.5) * 0.06;
    dir.y += 0.02;
    dir.normalize();

    const np = pos.clone().add(dir.clone().multiplyScalar(segL));
    const c1 = pickColor(pos.y);
    const c2 = pickColor(np.y);
    thickSegs.push(pos.x, pos.y, pos.z, np.x, np.y, np.z);
    thickCols.push(...c1, ...c2);

    if (i > 1 && i < rachisN - 1) {
      const side = (i % 2 === 0) ? 1 : -1;
      const pinnaBase = np.clone();
      jointPositions.push(pinnaBase.x, pinnaBase.y, pinnaBase.z);

      const pd = new THREE.Vector3(
        dir.z * side * 0.8 + (Math.random() - 0.5) * 0.2,
        0.15 + Math.random() * 0.25,
        -dir.x * side * 0.8 + (Math.random() - 0.5) * 0.2
      ).normalize();

      const pinnaLen = 2.5 + Math.random() * 3;
      const pinnaN = 5 + Math.floor(Math.random() * 4);
      const pSegL = pinnaLen / pinnaN;
      let pp = pinnaBase.clone();

      for (let j = 0; j < pinnaN; j++) {
        pd.x += (Math.random() - 0.5) * 0.12;
        pd.y -= 0.03;
        pd.normalize();
        const pnp = pp.clone().add(pd.clone().multiplyScalar(pSegL));
        const pc1 = pickColor(pp.y);
        const pc2 = pickColor(pnp.y);
        medSegs.push(pp.x, pp.y, pp.z, pnp.x, pnp.y, pnp.z);
        medCols.push(...pc1, ...pc2);

        if (j > 0 && j < pinnaN - 1 && Math.random() < 0.5) {
          const td = new THREE.Vector3(
            pd.x + (Math.random() - 0.5) * 0.6,
            -0.1 + Math.random() * 0.3,
            pd.z + (Math.random() - 0.5) * 0.6
          ).normalize();
          const tipLen = 0.8 + Math.random() * 1.5;
          const tipN = 2 + Math.floor(Math.random() * 3);
          const tSegL = tipLen / tipN;
          let tp = pnp.clone();
          for (let k = 0; k < tipN; k++) {
            td.y -= 0.05;
            td.normalize();
            const tnp = tp.clone().add(td.clone().multiplyScalar(tSegL));
            const tc1 = pickColor(tp.y);
            const tc2 = pickColor(tnp.y);
            thinSegs.push(tp.x, tp.y, tp.z, tnp.x, tnp.y, tnp.z);
            thinCols.push(...tc1, ...tc2);
            tp = tnp;
          }
        }
        pp = pnp;
      }
    }
    pos = np;
  }
}

const frondCount = 90;
const clusterCount = 10;
for (let c = 0; c < clusterCount; c++) {
  const cx = (Math.random() - 0.5) * 18;
  const cz = (Math.random() - 0.5) * 18;
  const n = Math.floor(frondCount / clusterCount) + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const fx = cx + (Math.random() - 0.5) * 5;
    const fz = cz + (Math.random() - 0.5) * 5;
    const angle = Math.random() * Math.PI * 2;
    generateFrond(fx, fz, angle);
  }
}

function buildLines(positions, colors, width, opacity) {
  if (positions.length === 0) return null;
  const geo = new LineSegmentsGeometry();
  geo.setPositions(positions);
  geo.setColors(colors);
  const mat = new LineMaterial({
    linewidth: width,
    vertexColors: true,
    transparent: true,
    opacity: opacity,
    worldUnits: false,
    resolution: new THREE.Vector2(innerWidth, innerHeight),
  });
  const mesh = new LineSegments2(geo, mat);
  mesh.computeLineDistances();
  return mesh;
}

const thickLines = buildLines(thickSegs, thickCols, 3.2, 0.92);
const medLines = buildLines(medSegs, medCols, 2.0, 0.88);
const thinLines = buildLines(thinSegs, thinCols, 1.2, 0.80);

if (thickLines) scene.add(thickLines);
if (medLines) scene.add(medLines);
if (thinLines) scene.add(thinLines);

const jointCount = Math.floor(jointPositions.length / 3);
if (jointCount > 0) {
  const sphereGeo = new THREE.IcosahedronGeometry(0.12, 1);
  const sphereMat = new THREE.MeshStandardMaterial({
    color: 0x3a4050,
    roughness: 0.9,
    metalness: 0.1,
  });
  const instances = new THREE.InstancedMesh(sphereGeo, sphereMat, jointCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < jointCount; i++) {
    dummy.position.set(
      jointPositions[i * 3],
      jointPositions[i * 3 + 1],
      jointPositions[i * 3 + 2]
    );
    dummy.updateMatrix();
    instances.setMatrixAt(i, dummy.matrix);
  }
  instances.instanceMatrix.needsUpdate = true;
  scene.add(instances);
}

const ambLight = new THREE.AmbientLight(0x4a5568, 0.5);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xd4d8e0, 0.5);
dirLight.position.set(5, 14, 8);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x5a6a82, 0.3);
rimLight.position.set(-8, 4, -6);
scene.add(rimLight);

const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x0c0e14, roughness: 1 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
scene.add(ground);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const res = new THREE.Vector2(innerWidth, innerHeight);
  if (thickLines) thickLines.material.resolution.copy(res);
  if (medLines) medLines.material.resolution.copy(res);
  if (thinLines) thinLines.material.resolution.copy(res);
});

function loop(now) {
  requestAnimationFrame(loop);
  const t = (window.AR ? AR.t : now) * 0.001;
  camera.position.y = 9 + Math.sin(t * 0.12) * 1.5;
  camera.position.x = Math.sin(t * 0.06) * 2.5;
  camera.lookAt(0, 7, 0);
  renderer.render(scene, camera);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
