<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>60l · aizawa sheets</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">60l</div>
<div class="hint">a b c · move pointer to nudge parameters</div>
<div class="src">strange attractor · 100k planar sheets</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// MOTION: drift, intensity: gentle

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uA:  { value: 0.95 },
  uB:  { value: 0.70 },
  uC:  { value: 0.60 },
  uD:  { value: 3.50 },
  uE:  { value: 0.25 },
  uF:  { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const sheetGeom = new THREE.PlaneGeometry(0.035, 0.035);
const sheetMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uTexSize: { value: new THREE.Vector2(W, H) },
    uTime: { value: 0 }
  },
  transparent: true, 
  depthWrite: false, 
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform vec2 uTexSize;
    uniform float uTime;
    varying vec3 vColor;
    varying float vOpacity;
    
    void main(){
      float idx = float(gl_InstanceID);
      float y = floor(idx / uTexSize.x);
      float x = idx - y * uTexSize.x;
      vec2 uv = (vec2(x, y) + 0.5) / uTexSize;
      
      vec4 s = texture2D(state, uv);
      vec3 p = s.xyz;
      float age = s.w;
      
      // field normal approximation via finite-difference of z
      float eps = 0.5 / uTexSize.x;
      vec2 uvDx = uv + vec2(eps, 0.0);
      vec2 uvDy = uv + vec2(0.0, eps);
      float zx = texture2D(state, uvDx).z;
      float zy = texture2D(state, uvDy).z;
      vec3 tangentX = normalize(vec3(1.0, 0.0, (zx - p.z) / eps));
      vec3 tangentY = normalize(vec3(0.0, 1.0, (zy - p.z) / eps));
      vec3 normal = normalize(cross(tangentX, tangentY));
      
      float speed = length(p) * 0.5;
      float speedClamped = clamp(speed, 0.0, 1.0);
      
      // emerald → violet → silver
      vec3 a_col = vec3(0.20, 0.62, 0.45);
      vec3 b_col = vec3(0.55, 0.30, 0.78);
      vec3 c_col = vec3(0.92, 0.95, 0.98);
      float k = mod(age + speedClamped * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));
      vColor = col;
      
      vOpacity = 0.04 + speedClamped * 0.08;
      
      // align sheet to field normal
      vec3 worldPos = p;
      vec3 localPos = position;
      
      // construct rotation from z-axis to normal
      vec3 up = vec3(0.0, 0.0, 1.0);
      vec3 axis = cross(up, normal);
      float cosAngle = dot(up, normal);
      float angle = acos(cosAngle);
      
      mat3 rot;
      if (length(axis) > 0.001) {
        axis = normalize(axis);
        float s = sin(angle);
        float c = cos(angle);
        float oc = 1.0 - c;
        rot = mat3(
          oc * axis.x * axis.x + c,           oc * axis.x * axis.y - axis.z * s,  oc * axis.z * axis.x + axis.y * s,
          oc * axis.x * axis.y + axis.z * s,  oc * axis.y * axis.y + c,           oc * axis.y * axis.z - axis.x * s,
          oc * axis.z * axis.x - axis.y * s,  oc * axis.y * axis.z + axis.x * s,  oc * axis.z * axis.z + c
        );
      } else {
        rot = mat3(1.0);
      }
      
      vec3 rotatedPos = rot * localPos;
      vec3 finalPos = worldPos + rotatedPos;
      
      vec4 mv = modelViewMatrix * vec4(finalPos, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vOpacity;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      float alpha = vOpacity;
      gl_FragColor = vec4(vColor * alpha, alpha);
    }
  `
});

const sheets = new THREE.InstancedMesh(sheetGeom, sheetMat, N);
scene.add(sheets);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();
function loop(){
  const now = performance.now();
  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  sheetMat.uniforms.state.value = rtA.texture;
  sheetMat.uniforms.uTime.value = (now - t0) * 0.001;

  const ang = (now - t0) * 0.00015;
  camera.position.x = Math.sin(ang) * 4;
  camera.position.z = Math.cos(ang) * 4;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 1.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
