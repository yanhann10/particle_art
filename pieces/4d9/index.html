<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ribbon·depth · layered light ribbons</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050505; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">4d9</div>
<div class="hint">drag to orbit · parallax ribbons in depth</div>
<div class="src">Anthony McCall (solid light) → extruded ribbon layers</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BG = 0x050505;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 3, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// Lighting
const keyLight = new THREE.DirectionalLight(0xfff8ee, 1.2);
keyLight.position.set(5, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -15;
keyLight.shadow.camera.right = 15;
keyLight.shadow.camera.top = 15;
keyLight.shadow.camera.bottom = -15;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xaab8ff, 0.3);
fillLight.position.set(-4, 3, -6);
scene.add(fillLight);

const ambient = new THREE.AmbientLight(0x111111, 0.5);
scene.add(ambient);

// Floor
const floorGeo = new THREE.PlaneGeometry(60, 60);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a0a, roughness: 0.95, metalness: 0.0
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -6;
floor.receiveShadow = true;
scene.add(floor);

// Differential growth for ribbon center-lines
function createCurve(seed, startX, startY) {
  const MAX_VERTS = 600;
  const verts = [];
  const NV0 = 24;
  const rng = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

  for (let i = 0; i < NV0; i++) {
    const t = (i / (NV0 - 1)) * 2 - 1;
    verts.push({
      x: startX + t * 5,
      y: startY + Math.sin(t * Math.PI * 1.5 + rng() * 2) * 1.2,
      z: (rng() - 0.5) * 0.5,
      pinned: i < 3 || i >= NV0 - 3
    });
  }

  // grow
  for (let iter = 0; iter < 300; iter++) {
    const n = verts.length;
    if (n >= MAX_VERTS) break;

    for (let i = 0; i < n; i++) {
      if (verts[i].pinned) continue;
      let fx = 0, fy = 0, fz = 0;

      // neighbor attraction
      if (i > 0) {
        fx += (verts[i-1].x - verts[i].x) * 0.06;
        fy += (verts[i-1].y - verts[i].y) * 0.06;
        fz += (verts[i-1].z - verts[i].z) * 0.06;
      }
      if (i < n-1) {
        fx += (verts[i+1].x - verts[i].x) * 0.06;
        fy += (verts[i+1].y - verts[i].y) * 0.06;
        fz += (verts[i+1].z - verts[i].z) * 0.06;
      }

      // repulsion from nearby
      for (let j = Math.max(0, i-15); j < Math.min(n, i+15); j++) {
        if (Math.abs(j-i) < 3) continue;
        const dx = verts[i].x - verts[j].x;
        const dy = verts[i].y - verts[j].y;
        const dz = verts[i].z - verts[j].z;
        const d2 = dx*dx + dy*dy + dz*dz;
        if (d2 < 1.0 && d2 > 0.001) {
          const d = Math.sqrt(d2);
          const f = 0.08 * (1 - d / 1.0) / d;
          fx += dx * f; fy += dy * f; fz += dz * f;
        }
      }

      // gravity
      fy -= 0.004;

      verts[i].x += fx + (rng()-0.5)*0.002;
      verts[i].y += fy + (rng()-0.5)*0.002;
      verts[i].z += fz + (rng()-0.5)*0.002;
    }

    // subdivide
    const grown = [];
    for (let i = 0; i < n-1; i++) {
      grown.push(verts[i]);
      const a = verts[i], b = verts[i+1];
      const dx = b.x-a.x, dy = b.y-a.y, dz = b.z-a.z;
      if (dx*dx+dy*dy+dz*dz > 0.25 && verts.length + grown.length < MAX_VERTS) {
        grown.push({
          x: (a.x+b.x)*0.5 + (rng()-0.5)*0.01,
          y: (a.y+b.y)*0.5 + (rng()-0.5)*0.01,
          z: (a.z+b.z)*0.5 + (rng()-0.5)*0.01,
          pinned: false
        });
      }
    }
    grown.push(verts[n-1]);
    verts.length = 0;
    for (const v of grown) verts.push(v);
  }

  return verts;
}

// Create ribbon meshes from curves
const RIBBON_COUNT = 7;
const ribbonData = [];
const zLayers = [-3, -2, -1, 0, 1, 2, 3];
const palette = [
  new THREE.Color(1.0, 0.95, 0.85),   // warm white
  new THREE.Color(1.0, 0.82, 0.55),   // gold
  new THREE.Color(0.95, 0.88, 0.78),  // cream
  new THREE.Color(1.0, 0.75, 0.45),   // amber
  new THREE.Color(0.98, 0.92, 0.80),  // pale gold
  new THREE.Color(1.0, 0.85, 0.65),   // light amber
  new THREE.Color(0.96, 0.90, 0.82),  // ivory
];

for (let r = 0; r < RIBBON_COUNT; r++) {
  const seed = 12345 + r * 7919;
  const yOffset = (r - 3) * 1.8;
  const curve = createCurve(seed, (r % 2 === 0 ? -1 : 1) * 0.5, yOffset);
  const zBase = zLayers[r];

  // Build ribbon geometry using TubeGeometry from a CatmullRom
  const pts = [];
  const step = Math.max(1, Math.floor(curve.length / 120));
  for (let i = 0; i < curve.length; i += step) {
    pts.push(new THREE.Vector3(curve[i].x, curve[i].y, curve[i].z + zBase));
  }

  if (pts.length < 4) continue;

  const spline = new THREE.CatmullRomCurve3(pts);

  // Ribbon as flat extruded shape
  const ribbonWidth = 0.12 + Math.random() * 0.08;
  const ribbonDepth = 0.35 + Math.random() * 0.25;
  const shape = new THREE.Shape();
  shape.moveTo(-ribbonDepth, -ribbonWidth);
  shape.lineTo(ribbonDepth, -ribbonWidth);
  shape.lineTo(ribbonDepth, ribbonWidth);
  shape.lineTo(-ribbonDepth, ribbonWidth);
  shape.closePath();

  const extrudeSettings = {
    steps: Math.min(pts.length * 2, 200),
    extrudePath: spline,
  };

  const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);

  const col = palette[r];
  const mat = new THREE.MeshStandardMaterial({
    color: col,
    emissive: col.clone().multiplyScalar(0.6),
    emissiveIntensity: 0.8,
    roughness: 0.3,
    metalness: 0.1,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Per-ribbon rotation
  const rotX = (Math.random() - 0.5) * 0.15;
  const rotY = (Math.random() - 0.5) * 0.2;
  const rotZ = (Math.random() - 0.5) * 0.08;
  mesh.rotation.set(rotX, rotY, rotZ);

  scene.add(mesh);
  ribbonData.push({
    mesh,
    rotSpeed: (Math.random() - 0.5) * 0.003,
    driftPhase: Math.random() * Math.PI * 2,
    baseY: mesh.position.y,
  });
}

// Particle atmosphere — sparse warm motes
const MOTE_COUNT = 8000;
const motePos = new Float32Array(MOTE_COUNT * 3);
const moteSeed = new Float32Array(MOTE_COUNT);
for (let i = 0; i < MOTE_COUNT; i++) {
  motePos[i*3]   = (Math.random() - 0.5) * 20;
  motePos[i*3+1] = (Math.random() - 0.5) * 16 - 1;
  motePos[i*3+2] = (Math.random() - 0.5) * 12;
  moteSeed[i] = Math.random();
}

const moteGeo = new THREE.BufferGeometry();
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
moteGeo.setAttribute('seed', new THREE.BufferAttribute(moteSeed, 1));

const moteMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      float t = uTime * 0.2 + seed * 6.28;
      p.x += sin(t) * 0.03;
      p.y += cos(t * 0.7) * 0.02 + sin(uTime * 0.1 + seed * 3.0) * 0.01;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.8 + seed * 0.6) * uPixel * (30.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;
      vAlpha = (0.15 + 0.1 * sin(uTime * 1.5 + seed * 20.0)) * smoothstep(40.0, 5.0, dist);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 18.0);
      vec3 col = vec3(1.0, 0.9, 0.7);
      float a = core * vAlpha;
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const motes = new THREE.Points(moteGeo, moteMat);
scene.add(motes);

// Particle halo on ribbons — 30k particles tracing the ribbon forms
const HALO_COUNT = 30000;
const haloPos = new Float32Array(HALO_COUNT * 3);
const haloSeed = new Float32Array(HALO_COUNT);

// Scatter halo particles near ribbon vertices
let hIdx = 0;
for (let r = 0; r < ribbonData.length && hIdx < HALO_COUNT; r++) {
  const geo = ribbonData[r].mesh.geometry;
  const posAttr = geo.attributes.position;
  const count = posAttr.count;
  const perRibbon = Math.floor(HALO_COUNT / RIBBON_COUNT);

  for (let i = 0; i < perRibbon && hIdx < HALO_COUNT; i++) {
    const vi = Math.floor(Math.random() * count);
    const x = posAttr.getX(vi) + (Math.random()-0.5)*0.15;
    const y = posAttr.getY(vi) + (Math.random()-0.5)*0.15;
    const z = posAttr.getZ(vi) + (Math.random()-0.5)*0.15;

    // Apply mesh rotation
    const v = new THREE.Vector3(x, y, z);
    v.applyEuler(ribbonData[r].mesh.rotation);

    haloPos[hIdx*3]   = v.x;
    haloPos[hIdx*3+1] = v.y;
    haloPos[hIdx*3+2] = v.z;
    haloSeed[hIdx] = Math.random();
    hIdx++;
  }
}

const haloGeo = new THREE.BufferGeometry();
haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos, 3));
haloGeo.setAttribute('seed', new THREE.BufferAttribute(haloSeed, 1));

const haloMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      p.x += sin(t) * 0.02 * (0.5 + seed);
      p.y += cos(t * 0.6 + seed * 3.0) * 0.015;
      p.z += sin(t * 0.8 + seed * 5.0) * 0.01;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + seed * 0.8) * uPixel * (35.0 / max(dist, 1.0));
      gl_Position = projectionMatrix * mv;

      float pulse = 0.8 + 0.2 * sin(uTime * 1.8 + seed * 30.0);
      vAlpha = (0.25 + 0.15 * pulse) * smoothstep(50.0, 3.0, dist);

      vec3 warm = vec3(1.0, 0.88, 0.65);
      vec3 hot  = vec3(1.0, 0.95, 0.85);
      vCol = mix(warm, hot, seed);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 16.0);
      float halo = exp(-r * 6.0) * 0.25;
      float a = (core + halo) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const haloPoints = new THREE.Points(haloGeo, haloMat);
scene.add(haloPoints);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;

  // Gentle independent drift per ribbon
  for (let r = 0; r < ribbonData.length; r++) {
    const rd = ribbonData[r];
    rd.mesh.rotation.y += rd.rotSpeed * 0.3;
    rd.mesh.position.y = rd.baseY + Math.sin(t * 0.3 + rd.driftPhase) * 0.15;
  }

  moteMat.uniforms.uTime.value = t;
  haloMat.uniforms.uTime.value = t;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
