<div class="id">4d9</div>
<div class="hint">drag to orbit · click to toggle solid</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const BG = 0x060402;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.FogExp2(BG, 0.012);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 10, 30);
camera.lookAt(0, 8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 8, 0);
controls.minDistance = 8;
controls.maxDistance = 80;

// ── VESSEL GEOMETRY ──────────────────────────────────────────────────────────
// Silhouette profile: 12 levels, radius by spline
const LEVELS = 12;
const SEG    = 24;  // cells per ring
const HEIGHT = 20;

// Radius at each level (0 = bottom, 11 = top)
// tapered bottom, widest ~level 7, tapers toward top
const radiiRaw = [2.5, 3.0, 3.7, 4.4, 5.0, 5.2, 5.5, 5.4, 5.1, 4.6, 4.0, 3.5];

function vesselRadius(level) {
  const t = level / (LEVELS - 1);
  // Catmull-Rom-like smooth interpolation over radiiRaw
  const i = Math.floor(t * (radiiRaw.length - 1));
  const f = t * (radiiRaw.length - 1) - i;
  const r0 = radiiRaw[Math.max(0, i - 1)];
  const r1 = radiiRaw[i];
  const r2 = radiiRaw[Math.min(radiiRaw.length - 1, i + 1)];
  const r3 = radiiRaw[Math.min(radiiRaw.length - 1, i + 2)];
  // Catmull-Rom
  return 0.5 * ((2*r1) + (-r0+r2)*f + (2*r0-5*r1+4*r2-r3)*f*f + (-r0+3*r1-3*r2+r3)*f*f*f);
}

function levelY(level) {
  return (level / (LEVELS - 1)) * HEIGHT;
}

// Ring positions: offset every other level by half cell (pi/SEG)
function ringPoints(level) {
  const pts = [];
  const r   = vesselRadius(level);
  const y   = levelY(level);
  const off = (level % 2 === 0) ? 0 : Math.PI / SEG;
  for (let i = 0; i < SEG; i++) {
    const a = (i / SEG) * Math.PI * 2 + off;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  return pts;
}

// Pre-compute all rings
const rings = [];
for (let lv = 0; lv <= LEVELS; lv++) rings.push(ringPoints(lv));

// ── Build lattice edges ───────────────────────────────────────────────────────
// Each diamond cell: top-left → bottom-center → bottom-right → top-center → X-brace
// Between level lv and lv+1, connect:
//   ring[lv][i] → ring[lv+1][i]   (right leg)
//   ring[lv][i] → ring[lv+1][(i-1+SEG)%SEG]  (left leg)
// Plus horizontal connections within each level

const wireVerts   = [];
const edgeIndices = []; // track which edge index each pair starts at

let edgeCount = 0;

function addEdge(a, b) {
  const idx = edgeCount;
  wireVerts.push(a.x, a.y, a.z, b.x, b.y, b.z);
  edgeCount++;
  return idx;
}

// diagonal legs connecting level to level+1
const legEdgeStart = [];
for (let lv = 0; lv < LEVELS; lv++) {
  legEdgeStart.push(edgeCount);
  const rA = rings[lv];
  const rB = rings[lv + 1];
  for (let i = 0; i < SEG; i++) {
    addEdge(rA[i], rB[i]);
    addEdge(rA[i], rB[(i + 1) % SEG]);
  }
}

// horizontal rings at each level
for (let lv = 0; lv <= LEVELS; lv++) {
  const r = rings[lv];
  for (let i = 0; i < SEG; i++) {
    addEdge(r[i], r[(i + 1) % SEG]);
  }
}

// X-brace: cross connects inside each diamond cell
// cell (lv, i): corners are rA[i], rA[(i+1)%SEG], rB[i], rB[(i+1)%SEG]
for (let lv = 0; lv < LEVELS; lv++) {
  const rA = rings[lv];
  const rB = rings[lv + 1];
  for (let i = 0; i < SEG; i++) {
    const i1 = (i + 1) % SEG;
    // diagonals across the diamond face
    addEdge(rA[i], rB[i1]);
    addEdge(rA[i1], rB[i]);
  }
}

const totalEdges = edgeCount;

// ── Wire colours: bright white-gold primary, dim amber secondary ─────────────
const wireColors = new Float32Array(wireVerts.length); // rgb per vertex
for (let e = 0; e < totalEdges; e++) {
  // every 6th edge: bright white-gold; others: copper-amber
  const bright = (e % 6 === 0);
  const r = bright ? 1.0 : 0.79;
  const g = bright ? 0.88 : 0.47;
  const b = bright ? 0.55 : 0.19;
  wireColors[e * 6]     = r; wireColors[e * 6 + 1] = g; wireColors[e * 6 + 2] = b;
  wireColors[e * 6 + 3] = r; wireColors[e * 6 + 4] = g; wireColors[e * 6 + 5] = b;
}

const wireGeo = new THREE.BufferGeometry();
wireGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(wireVerts), 3));
wireGeo.setAttribute('color',    new THREE.BufferAttribute(wireColors, 3));

const wireMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  depthWrite: false,
});
const wireframe = new THREE.LineSegments(wireGeo, wireMat);
scene.add(wireframe);

// ── Glow Points along edge paths ─────────────────────────────────────────────
// Place glow spheres at edge midpoints for a neon glow look
const GLOW_COUNT = totalEdges;
const glowPos  = new Float32Array(GLOW_COUNT * 3);
const glowSeed = new Float32Array(GLOW_COUNT);
const glowBright = new Float32Array(GLOW_COUNT);

for (let e = 0; e < totalEdges; e++) {
  const ax = wireVerts[e * 6],     ay = wireVerts[e * 6 + 1], az = wireVerts[e * 6 + 2];
  const bx = wireVerts[e * 6 + 3], by = wireVerts[e * 6 + 4], bz = wireVerts[e * 6 + 5];
  glowPos[e * 3]     = (ax + bx) * 0.5;
  glowPos[e * 3 + 1] = (ay + by) * 0.5;
  glowPos[e * 3 + 2] = (az + bz) * 0.5;
  glowSeed[e]   = (e % 6 === 0) ? 1.0 : 0.0; // bright every-6th flag
  glowBright[e] = Math.random();
}

const glowGeo = new THREE.BufferGeometry();
glowGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
glowGeo.setAttribute('bright',   new THREE.BufferAttribute(glowSeed, 1));
glowGeo.setAttribute('seed',     new THREE.BufferAttribute(glowBright, 1));

const glowMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() } },
  transparent: true,
  depthWrite:  false,
  blending:    THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPR;
    attribute float bright;
    attribute float seed;
    varying float vAlpha;
    varying vec3  vCol;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      float pulse = 0.7 + 0.3 * sin(uTime * 2.1 + seed * 6.28);
      float sz = (bright > 0.5) ? 5.0 : 3.0;
      gl_PointSize = sz * uPR * pulse * clamp(40.0 / max(dist, 1.0), 0.5, 3.5);
      gl_Position  = projectionMatrix * mv;
      vAlpha = (bright > 0.5) ? pulse * 0.85 : 0.35 * pulse;
      vCol   = (bright > 0.5)
               ? vec3(1.0, 0.95, 0.65)   // white-gold
               : vec3(0.85, 0.52, 0.22); // copper-amber
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3  vCol;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 14.0);
      float halo = exp(-r * 5.0) * 0.3;
      gl_FragColor = vec4(vCol * (core + halo) * vAlpha, (core + halo) * vAlpha);
    }
  `
});
const glowPoints = new THREE.Points(glowGeo, glowMat);
scene.add(glowPoints);

// ── Solid copper mesh (toggled) ───────────────────────────────────────────────
// Lathe geometry using the vessel radius profile
const lathePoints = [];
for (let i = 0; i <= LEVELS * 4; i++) {
  const t = i / (LEVELS * 4);
  const r = vesselRadius(t * LEVELS);
  const y = t * HEIGHT;
  lathePoints.push(new THREE.Vector2(r, y));
}
const latheGeo = new THREE.LatheGeometry(lathePoints, 48);
const latheMat = new THREE.MeshBasicMaterial({
  color:       0xc97a30,
  transparent: true,
  opacity:     0.10,
  side:        THREE.DoubleSide,
  depthWrite:  false,
});
const solidMesh = new THREE.Mesh(latheGeo, latheMat);
solidMesh.visible = false;
scene.add(solidMesh);

// ── Particle haze ─────────────────────────────────────────────────────────────
const HAZE_N  = 10000;
const hazePos = new Float32Array(HAZE_N * 3);
const hazeSeed = new Float32Array(HAZE_N);

for (let i = 0; i < HAZE_N; i++) {
  // scatter in a cylinder around the structure
  const ang   = Math.random() * Math.PI * 2;
  const rad   = 2 + Math.random() * 8;
  const y     = Math.random() * (HEIGHT + 4) - 2;
  hazePos[i * 3]     = Math.cos(ang) * rad;
  hazePos[i * 3 + 1] = y;
  hazePos[i * 3 + 2] = Math.sin(ang) * rad;
  hazeSeed[i] = Math.random();
}

const hazeGeo = new THREE.BufferGeometry();
hazeGeo.setAttribute('position', new THREE.BufferAttribute(hazePos, 3));
hazeGeo.setAttribute('seed',     new THREE.BufferAttribute(hazeSeed, 1));

const hazeMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPR: { value: renderer.getPixelRatio() } },
  transparent: true,
  depthWrite:  false,
  blending:    THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPR;
    attribute float seed;
    varying float vAlpha;
    void main() {
      vec3 p = position;
      float t = uTime * 0.15 + seed * 6.28;
      p.x += sin(t + seed * 3.0) * 0.08;
      p.y += cos(t * 0.6) * 0.05;
      p.z += sin(t * 0.8 + seed * 5.0) * 0.08;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.5 + seed * 0.8) * uPR * clamp(28.0 / max(dist, 1.0), 0.3, 2.5);
      gl_Position  = projectionMatrix * mv;
      vAlpha = (0.06 + 0.04 * sin(uTime * 1.2 + seed * 20.0)) * smoothstep(60.0, 4.0, dist);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 12.0);
      gl_FragColor = vec4(vec3(0.85, 0.52, 0.25) * core * vAlpha, core * vAlpha);
    }
  `
});
const hazePoints = new THREE.Points(hazeGeo, hazeMat);
scene.add(hazePoints);

// ── Floor reflection plane ─────────────────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(80, 80);
const floorMat = new THREE.MeshBasicMaterial({
  color:       0x100804,
  transparent: true,
  opacity:     0.7,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
scene.add(floor);

// ── Toggle solid on click ──────────────────────────────────────────────────
let solidMode = false;
renderer.domElement.addEventListener('click', () => {
  solidMode = !solidMode;
  solidMesh.visible = solidMode;
});

// ── Resize ────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate ───────────────────────────────────────────────────────────────
const orbitSpeed = 0.08; // radians/sec
const start = performance.now();
let baseAngle = 0;

function loop() {
  const t   = (performance.now() - start) / 1000;
  const dt  = 1 / 60;
  baseAngle += orbitSpeed * dt;

  // Orbit camera around Y, slight tilt
  const camR = 30;
  const camY = 10 + Math.sin(t * 0.2) * 1.5;
  camera.position.set(
    Math.sin(baseAngle) * camR,
    camY,
    Math.cos(baseAngle) * camR
  );
  controls.target.set(0, 9, 0);

  // Pulsing edge colours — update every-6th-edge brightness
  const colorAttr = wireGeo.attributes.color;
  for (let e = 0; e < totalEdges; e++) {
    if (e % 6 === 0) {
      const pulse = 0.65 + 0.35 * Math.sin(t * 1.8 + e * 0.3);
      const r = 1.0 * pulse, g = 0.88 * pulse, b = 0.55 * pulse;
      colorAttr.setXYZ(e * 2,     r, g, b);
      colorAttr.setXYZ(e * 2 + 1, r, g, b);
    }
  }
  colorAttr.needsUpdate = true;

  glowMat.uniforms.uTime.value = t;
  hazeMat.uniforms.uTime.value = t;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
