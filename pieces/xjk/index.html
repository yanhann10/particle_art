<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xjk · geometric ribbon · architectural stack</title>
<!-- MOTION: expansion, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a12; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">xjk</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Manolo Gamboa Naon mode: differential-growth architectural ribbon →
// stacked geometric tiers, hard-edge shapes, editorial poster composition.
// 5-color flat blocking, zero noise, zero randomness in motion.
// Shape hierarchy: hexagonal tiers → triangular wedges → ring outlines.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 12, 24);
camera.lookAt(0, 5, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xffffff, 1.2);
lightKey.position.set(8, 14, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

// Gamboa Naon palette: editorial flat colors
const COLORS = [
  0xe8c547, // mustard
  0xd94e3f, // brick
  0x2d5a7b, // prussian
  0xf4f4ed, // bone
  0x1a1a24, // ink
];

// Tier system: 12 hexagonal platforms stacked vertically
// Each tier: outer hexagon ring + 6 triangular wedges radiating inward
const group = new THREE.Group();
scene.add(group);

const TIERS = 12;
const TIER_HEIGHT = 0.9;
const BASE_RADIUS = 6.0;

for (let tier = 0; tier < TIERS; tier++){
  const y = tier * TIER_HEIGHT;
  const radius = BASE_RADIUS * (1 - tier * 0.06);
  const rotation = (tier * Math.PI / 6); // 30° rotation per tier for visual twist
  
  // Hexagon outline ring
  const hexPoints = [];
  for (let i = 0; i <= 6; i++){
    const angle = (i / 6) * Math.PI * 2 + rotation;
    hexPoints.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      y,
      Math.sin(angle) * radius
    ));
  }
  const hexCurve = new THREE.CatmullRomCurve3(hexPoints, false);
  const hexGeo = new THREE.TubeGeometry(hexCurve, 64, 0.08, 6, false);
  const hexMat = new THREE.MeshStandardMaterial({
    color: COLORS[tier % 5],
    flatShading: true,
    roughness: 0.9,
    metalness: 0.1
  });
  const hexMesh = new THREE.Mesh(hexGeo, hexMat);
  group.add(hexMesh);

  // 6 triangular wedges pointing inward
  for (let w = 0; w < 6; w++){
    const angle = (w / 6) * Math.PI * 2 + rotation;
    const outerX = Math.cos(angle) * radius;
    const outerZ = Math.sin(angle) * radius;
    const innerRadius = radius * 0.25;
    const innerX = Math.cos(angle) * innerRadius;
    const innerZ = Math.sin(angle) * innerRadius;
    
    // Triangle: outer vertex → two adjacent inner vertices
    const angleL = ((w - 0.5) / 6) * Math.PI * 2 + rotation;
    const angleR = ((w + 0.5) / 6) * Math.PI * 2 + rotation;
    const leftX = Math.cos(angleL) * innerRadius;
    const leftZ = Math.sin(angleL) * innerRadius;
    const rightX = Math.cos(angleR) * innerRadius;
    const rightZ = Math.sin(angleR) * innerRadius;

    const triGeo = new THREE.BufferGeometry();
    const vertices = new Float32Array([
      outerX, y + 0.02, outerZ,
      leftX, y + 0.02, leftZ,
      rightX, y + 0.02, rightZ,
    ]);
    triGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    triGeo.setIndex([0, 1, 2]);
    triGeo.computeVertexNormals();
    
    const triMat = new THREE.MeshStandardMaterial({
      color: COLORS[(tier + w + 2) % 5],
      flatShading: true,
      side: THREE.DoubleSide,
      roughness: 0.85,
      metalness: 0.05
    });
    const triMesh = new THREE.Mesh(triGeo, triMat);
    group.add(triMesh);
  }

  // Central ring outline at each tier (smaller, for hierarchy depth)
  if (tier % 2 === 0){
    const ringRadius = radius * 0.18;
    const ringPoints = [];
    for (let i = 0; i <= 32; i++){
      const angle = (i / 32) * Math.PI * 2;
      ringPoints.push(new THREE.Vector3(
        Math.cos(angle) * ringRadius,
        y + 0.05,
        Math.sin(angle) * ringRadius
      ));
    }
    const ringCurve = new THREE.CatmullRomCurve3(ringPoints, true);
    const ringGeo = new THREE.TubeGeometry(ringCurve, 32, 0.04, 8, true);
    const ringMat = new THREE.MeshStandardMaterial({
      color: COLORS[(tier + 3) % 5],
      flatShading: true,
      roughness: 0.9,
      metalness: 0.0
    });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    group.add(ringMesh);
  }
}

// Top cap: single large hexagon
const capY = TIERS * TIER_HEIGHT;
const capRadius = BASE_RADIUS * (1 - TIERS * 0.06) * 0.7;
const capPoints = [];
for (let i = 0; i <= 6; i++){
  const angle = (i / 6) * Math.PI * 2;
  capPoints.push(new THREE.Vector3(
    Math.cos(angle) * capRadius,
    capY,
    Math.sin(angle) * capRadius
  ));
}
const capShape = new THREE.Shape();
capShape.moveTo(capPoints[0].x, capPoints[0].z);
for (let i = 1; i < 6; i++){
  capShape.lineTo(capPoints[i].x, capPoints[i].z);
}
capShape.closePath();
const capGeo = new THREE.ShapeGeometry(capShape);
capGeo.rotateX(-Math.PI / 2);
capGeo.translate(0, capY + 0.1, 0);
const capMat = new THREE.MeshStandardMaterial({
  color: COLORS[4],
  flatShading: true,
  side: THREE.DoubleSide,
  roughness: 0.8,
  metalness: 0.1
});
const capMesh = new THREE.Mesh(capGeo, capMat);
group.add(capMesh);

// Ground plane: large flat circle, single color
const groundGeo = new THREE.CircleGeometry(14, 64);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x12121a,
  flatShading: true,
  roughness: 1.0,
  metalness: 0.0
});
const groundMesh = new THREE.Mesh(groundGeo, groundMat);
scene.add(groundMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();
function loop(){
  const t = (performance.now() - startTime) / 1000;
  
  // Deterministic gentle expansion: scale entire group by periodic function
  const scale = 1.0 + 0.08 * Math.sin(t * 0.3);
  group.scale.set(scale, scale, scale);
  
  // Deterministic gentle rotation
  group.rotation.y = t * 0.08;
  
  // Camera tracks vertical centroid
  const targetY = (TIERS * TIER_HEIGHT) * 0.5;
  camera.position.y += (targetY + 12 - camera.position.y) * 0.02;
  camera.lookAt(0, targetY, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
