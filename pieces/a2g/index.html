<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a2g · alphabet cage (a4h × ksf)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080a0d; overflow:hidden;
               color:#4dd4d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">a2g</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────── scene setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080a0d, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// ────────────── Klein bottle parametric (from ksf)
function kleinBottlePoint(u, v) {
  const a = 2.5, n = 1.8;
  const r = a * (1.0 + 0.4 * Math.sin(v));
  const x = r * Math.cos(u) * (1.0 + 0.3 * Math.sin(v));
  const y = r * Math.sin(u) * (1.0 + 0.3 * Math.sin(v));
  const z = n * Math.sin(v) * (1.0 + 0.4 * Math.cos(2*u));
  return new THREE.Vector3(x, y, z);
}

// ────────────── Letter sprite factory (high-contrast, white on canvas, tinted via THREE.Color)
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
// Pre-bake one canvas texture per letter for efficiency
const letterTextures = {};
function makeLetterTexture(letter) {
  if (letterTextures[letter]) return letterTextures[letter];
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  // Transparent background — THREE.Color tint handles the color
  ctx.clearRect(0, 0, 256, 256);
  ctx.font = 'bold 180px ui-monospace, "SF Mono", Menlo, monospace';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(letter, 128, 128);
  const tex = new THREE.CanvasTexture(canvas);
  letterTextures[letter] = tex;
  return tex;
}

// Palette sets
// Teal family (u < π) — instrument panel
const TEAL_COLORS = [0x4dd4d8, 0x20a0a8, 0x1080a0, 0x6ae8ec, 0x38c4cc];
// Steel family (u ≥ π) — oxidized steel / warm grey
const STEEL_COLORS = [0xc8b090, 0xb0b4bc, 0x808488, 0xd8c4a4, 0x9aa0a8];

function pickColor(u) {
  const set = (u < Math.PI) ? TEAL_COLORS : STEEL_COLORS;
  return set[Math.floor(Math.random() * set.length)];
}

// ────────────── Spawn 200 letter sprites on the Klein bottle surface
const N_SPRITES = 200;
const sprites = [];

for (let i = 0; i < N_SPRITES; i++) {
  const u = Math.random() * Math.PI * 2;
  const v = Math.random() * Math.PI * 2;
  const letter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
  const tex = makeLetterTexture(letter);

  const col = pickColor(u);
  const mat = new THREE.SpriteMaterial({
    map: tex,
    color: col,
    transparent: true,
    opacity: 0.92,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });

  const sprite = new THREE.Sprite(mat);

  // Place on Klein surface
  const p = kleinBottlePoint(u, v);
  sprite.position.copy(p);

  // Size: slightly randomised but large enough to be legible
  const s = 0.9 + Math.random() * 0.5;
  sprite.scale.set(s, s, 1.0);

  sprite.userData = {
    u,
    v,
    vSpeed: 0.005 + Math.random() * 0.006,  // drift speed along v
    age: Math.random() * 300,                // staggered age
    letterAge: Math.floor(Math.random() * 180), // frames until letter change
    letterPeriod: 150 + Math.floor(Math.random() * 120), // ~3s at 60fps
  };

  scene.add(sprite);
  sprites.push(sprite);
}

// ────────────── Faint wireframe cage (optional — gives depth reference)
// A low-res Klein surface as line segments for structural context
const CAGE_U = 40, CAGE_V = 40;
const cagePositions = [];
for (let iu = 0; iu < CAGE_U; iu++) {
  const u = (iu / CAGE_U) * Math.PI * 2;
  for (let iv = 0; iv < CAGE_V; iv++) {
    const v0 = (iv / CAGE_V) * Math.PI * 2;
    const v1 = ((iv + 1) / CAGE_V) * Math.PI * 2;
    const p0 = kleinBottlePoint(u, v0);
    const p1 = kleinBottlePoint(u, v1);
    cagePositions.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);
  }
}
const cageGeom = new THREE.BufferGeometry();
cageGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cagePositions), 3));
const cageMat = new THREE.LineBasicMaterial({
  color: 0x1a3040,
  transparent: true,
  opacity: 0.18,
});
const cage = new THREE.LineSegments(cageGeom, cageMat);
scene.add(cage);

// ────────────── Animation state
// Breathing: slow sinusoidal scale of the whole group
let breathScale = 1.0;
const start = performance.now();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  const t = (performance.now() - start) / 1000;

  // Breathing envelope
  breathScale = 1.0 + 0.07 * Math.sin(t * 0.45);

  sprites.forEach(sp => {
    const ud = sp.userData;

    // Advance v (drift along strand)
    ud.v += ud.vSpeed;
    if (ud.v > Math.PI * 2) ud.v -= Math.PI * 2;

    // Recompute position on Klein surface, scaled by breath
    const p = kleinBottlePoint(ud.u, ud.v);
    p.multiplyScalar(breathScale);
    sp.position.copy(p);

    // Letter cycling: change every ~3 seconds
    ud.age++;
    ud.letterAge++;
    if (ud.letterAge >= ud.letterPeriod) {
      ud.letterAge = 0;
      const newLetter = LETTERS[Math.floor(Math.random() * LETTERS.length)];
      sp.material.map = makeLetterTexture(newLetter);
      sp.material.map.needsUpdate = true;
      // Possibly shift color slightly within palette
      sp.material.color.setHex(pickColor(ud.u));
    }

    // Gentle fade-pulse so letters breathe in and out
    const pulse = 0.75 + 0.25 * Math.sin(t * 1.1 + ud.u * 3.0 + ud.v * 2.0);
    sp.material.opacity = pulse * 0.92;
  });

  // Slow camera orbit — same formula as ksf
  const orbitSpeed = 0.06;
  const radius = 18;
  camera.position.x = Math.sin(t * orbitSpeed) * radius;
  camera.position.z = Math.cos(t * orbitSpeed) * radius;
  camera.position.y = Math.sin(t * orbitSpeed * 0.3) * 3;
  camera.lookAt(0, 0, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
