<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mc3 · Shiota — Red Archive</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">mc3</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.008));
const key1 = new THREE.PointLight(0x280808, 0.018, 28, 2.0);
key1.position.set(-14, 16, 10);
scene.add(key1);

let seed = 847263;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 42, h: 26, d: 38 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED KEY — single brass key at center (Shiota's signature motif)
const keyPos = new THREE.Vector3(0, 0.6, 0);

const keyGroup = new THREE.Group();
const keyHead = new THREE.Mesh(
  new THREE.TorusGeometry(0.48, 0.14, 12, 16),
  new THREE.MeshStandardMaterial({
    color: 0xe8d8c0,
    emissive: 0xa08860,
    emissiveIntensity: 0.58,
    metalness: 0.42,
    roughness: 0.68
  })
);
keyHead.rotation.y = Math.PI/2;
keyGroup.add(keyHead);

const keyShaft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.08, 0.08, 2.2, 12),
  keyHead.material
);
keyShaft.position.y = -1.1;
keyGroup.add(keyShaft);

const tooth1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.28, 0.12, 0.16),
  keyHead.material
);
tooth1.position.set(0, -2.0, 0.12);
keyGroup.add(tooth1);

const tooth2 = new THREE.Mesh(
  new THREE.BoxGeometry(0.22, 0.14, 0.16),
  keyHead.material
);
tooth2.position.set(0, -1.6, 0.12);
keyGroup.add(tooth2);

keyGroup.position.copy(keyPos);
scene.add(keyGroup);

const keyGlow = new THREE.PointLight(0x1c0606, 0.012, 16, 2.4);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// ANCHORS — distributed across room volume with density around key

const anchors = [];

// Dense sphere of anchors around key
const innerCount = 140;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 4.2 + rng()*2.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// Mid-distance shell
const midCount = 180;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 8.4 + rng()*4.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// Wall anchors
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*0.8;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*0.8;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.92, ROOM.d*0.92, 5));
anchors.push(...wallGrid('x', hw, ROOM.h*0.92, ROOM.d*0.92, 5));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.92, ROOM.d*0.92, 6));
anchors.push(...wallGrid('y', hh, ROOM.w*0.92, ROOM.d*0.92, 6));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.92, ROOM.h*0.92, 5));
anchors.push(...wallGrid('z', hd, ROOM.w*0.92, ROOM.h*0.92, 5));

// Scattered volume anchors
for(let i=0; i<220; i++){
  const x = (rng()-0.5)*ROOM.w*0.86;
  const y = (rng()-0.5)*ROOM.h*0.86;
  const z = (rng()-0.5)*ROOM.d*0.86;
  anchors.push(new THREE.Vector3(x, y, z));
}

// RED THREAD NETWORK — 20,000 segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Converging threads — all paths lead to the key
const convergeCount = 6400;
for(let i=0; i<convergeCount && li<NUM_LINES-13600; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 2.8) continue;
  
  // Find nearest point on key geometry
  const dir = keyPos.clone().sub(a).normalize();
  const targetDist = Math.max(0.62, dKey * (0.78 + rng()*0.18));
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Key surface radiants — threads emanating from key
const keyRadials = 2800;
for(let i=0; i<keyRadials && li<NUM_LINES-10800; i++){
  const y = 1 - (i / keyRadials) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*0.62, y*0.62, z*0.62).add(keyPos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 6.8 + rng()*8.4;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY C: Circumferential web — orbiting threads around key at various radii
const circumLevels = 8;
const threadsPerLevel = 140;
for(let l=0; l<circumLevels && li<NUM_LINES-8400; l++){
  const r = 5.2 + l*1.8;
  const yBase = keyPos.y + (l-circumLevels/2)*2.4;
  
  for(let i=0; i<threadsPerLevel && li<NUM_LINES-8400; i++){
    const t0 = (i/threadsPerLevel) * Math.PI*2;
    const t1 = t0 + Math.PI*2/threadsPerLevel;
    
    const x0 = keyPos.x + Math.cos(t0)*r;
    const z0 = keyPos.z + Math.sin(t0)*r;
    const x1 = keyPos.x + Math.cos(t1)*r;
    const z1 = keyPos.z + Math.sin(t1)*r;
    
    const y0 = yBase + Math.sin(t0*3)*0.6;
    const y1 = yBase + Math.sin(t1*3)*0.6;
    
    setLine(
      new THREE.Vector3(x0, y0, z0),
      new THREE.Vector3(x1, y1, z1)
    );
  }
}

// CATEGORY D: Meridian threads — vertical arcs through key
const meridians = 32;
const ptsPerMeridian = 18;
for(let m=0; m<meridians && li<NUM_LINES-7800; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 9.2 + (m%3)*1.6;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-7800; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      keyPos.y + Math.sin(phi0)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      keyPos.y + Math.sin(phi1)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Wall-to-wall spans
let wallSpans = 0;
while(wallSpans<2200 && li<NUM_LINES-5400){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>12.0 && d<32.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY F: Horizontal crossing threads
for(let i=0; i<800 && li<NUM_LINES-4600; i++){
  const y = keyPos.y + (rng()-0.5)*16.0;
  const x0 = -hw + rng()*5.2;
  const z0 = (rng()-0.5)*ROOM.d*0.90;
  const x1 = hw - rng()*5.2;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY G: Vertical suspension threads
for(let i=0; i<360 && li<NUM_LINES-4240; i++){
  const x = (rng()-0.5)*ROOM.w*0.88;
  const z = (rng()-0.5)*ROOM.d*0.88;
  const y0 = -hh;
  const y1 = hh;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY H: Proximity web — local neighborhood connections
const THRESH = 8.6;
let webCount = 0, attempts = 0;
while(webCount<2800 && li<NUM_LINES-1440 && attempts<16000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<4; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>2.8 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY I: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>6.0 && d<18.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.068,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow meditative drift inside the archive
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.28){
    const lt = t/0.28;
    const angle = Math.PI*0.12 + lt*Math.PI*1.08;
    const r = 18.2 - lt*6.4;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 8.6 - lt*5.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.54){
    const lt = (t-0.28)/0.26;
    const angle = Math.PI*1.20 + lt*Math.PI*1.32;
    const r = 11.8 + Math.sin(lt*Math.PI*1.6)*2.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 3.4 + Math.cos(lt*Math.PI*1.4)*1.8;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.54)/0.24;
    const angle = Math.PI*2.52 + lt*Math.PI*0.94;
    const r = 9.8 + Math.cos(lt*Math.PI)*1.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - 1.8 - lt*6.4;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*3.46 + lt*Math.PI*0.68;
    const r = 8.2 + lt*9.6;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 3.8 + lt*5.2;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Key subtle rotation — remembering turns
  keyGroup.rotation.y = elapsed*0.00018;
  keyGroup.rotation.x = Math.sin(elapsed*0.00024)*0.024;
  
  const breathScale = 1.0 + Math.sin(elapsed*0.00032)*0.006;
  keyGroup.scale.setScalar(breathScale);

  // Camera dolly
  const speed = 0.0000064;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000038)*0.12,
    keyPos.y + Math.cos(elapsed*0.000042)*0.10,
    keyPos.z + Math.sin(elapsed*0.000034)*0.08
  );

  key1.intensity = 0.018 + Math.sin(elapsed*0.000048)*0.0052;
  keyGlow.intensity = 0.012 + Math.sin(elapsed*0.000056)*0.0036;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
