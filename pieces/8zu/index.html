<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>8zu · voronoi shatter</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0d14; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">8zu</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  Voronoi-shattered Aizawa attractor — kintsugi in phase space.
  Reference: Quayola's "Strata" series — classical form dissolving into
  computational fragments, the seam between coherence and disintegration.

  100k GPGPU particles trace the Aizawa system but are channelled onto
  Voronoi cell boundaries by 16 slowly-drifting seed points. The cracks
  glow gold (kintsugi philosophy: the break is the beauty).

  Palette (5 colors, hand-picked):
    #D4A574  warm gold — Voronoi edges, the repair line
    #E8C8A0  pale cream — brightest edge highlights near camera
    #4A2D6B  medium violet — transition band, cell interiors
    #2A1B3D  deep indigo — cell depths, recession
    #0A0D14  background — blue-black void

  Narrative arc: wholeness → fracture → beauty in the broken.
  First 6 s: pure attractor settles. Then cracks emerge over 8 s.
  Seeds drift forever — the shatter pattern never repeats.
*/

const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0d14, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// Init: scatter particles in small box near the Aizawa basin
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Blit init data into rtA
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ─── Shared GLSL for Voronoi seed generation ───
const voronoiSeedGLSL = `
vec3 voronoiSeed(int idx, float t) {
  float fi = float(idx);
  float theta = fi * 2.39996323 + t * (0.04 + fi * 0.002);
  float zFrac = fract(fi * 0.618033988 + 0.1);
  float r = 0.5 + 0.55 * sin(fi * 1.7 + t * 0.015);
  float z = -0.2 + zFrac * 2.4;
  return vec3(cos(theta) * r, sin(theta) * r, z + sin(t * 0.02 + fi) * 0.12);
}
`;

// ─── Simulation shader ───
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:  { value: 0.012 },
  uA:   { value: 0.95 },
  uB:   { value: 0.70 },
  uC:   { value: 0.60 },
  uD:   { value: 3.50 },
  uE:   { value: 0.25 },
  uF:   { value: 0.10 },
  uTime: { value: 0.0 },
  uVStr: { value: 0.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uTime, uVStr;
    varying vec2 vUv;

    ${voronoiSeedGLSL}

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // Aizawa attractor
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
          - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
          + uF * p.z * p.x * p.x * p.x
      );

      // Find two nearest Voronoi seeds
      float d1 = 1e6, d2 = 1e6;
      vec3 s1 = vec3(0.0), s2 = vec3(0.0);
      for (int i = 0; i < 16; i++) {
        vec3 sd = voronoiSeed(i, uTime);
        float d = distance(p, sd);
        if (d < d1) { d2 = d1; s2 = s1; d1 = d; s1 = sd; }
        else if (d < d2) { d2 = d; s2 = sd; }
      }

      // Force toward Voronoi edge (perpendicular bisector plane)
      vec3 mid = (s1 + s2) * 0.5;
      vec3 edgeNorm = normalize(s2 - s1 + 1e-6);
      float distToEdge = dot(p - mid, edgeNorm);
      vec3 edgeForce = -edgeNorm * distToEdge;

      // Blend: attractor keeps shape, Voronoi channels to cracks
      float vs = uVStr;
      vec3 step = (dp * (1.0 - vs * 0.4) + edgeForce * vs * 1.8) * uDt;
      // Clamp to prevent teleporting
      step = clamp(step, vec3(-0.08), vec3(0.08));
      p += step;

      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

// ─── Render points ───
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 0, 4.5);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  idxArr[i * 2]     = (x + 0.5) / W;
  idxArr[i * 2 + 1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime;
    attribute vec2 uvIdx;
    varying float vEdge;
    varying float vAge;
    varying float vSpeed;

    ${voronoiSeedGLSL}

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vSpeed = clamp(length(p) * 0.4, 0.0, 1.0);

      // Voronoi edge proximity for coloring
      float d1 = 1e6, d2 = 1e6;
      for (int i = 0; i < 16; i++) {
        float d = distance(p, voronoiSeed(i, uTime));
        if (d < d1) { d2 = d1; d1 = d; }
        else if (d < d2) { d2 = d; }
      }
      // 0 = on edge, 1 = cell center
      vEdge = clamp((d2 - d1) / (d2 + d1 + 0.001), 0.0, 1.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mv.z, 0.5);
      float edgeBoost = 1.0 + (1.0 - vEdge) * 0.7;
      gl_PointSize = (0.9 + 1.0 * vSpeed) * edgeBoost * uPixel * (8.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vEdge;
    varying float vAge;
    varying float vSpeed;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);

      // Kintsugi palette
      vec3 goldEdge = vec3(0.831, 0.647, 0.455);   // #D4A574
      vec3 creamHi  = vec3(0.910, 0.784, 0.627);   // #E8C8A0
      vec3 violet   = vec3(0.290, 0.176, 0.420);    // #4A2D6B
      vec3 indigo   = vec3(0.165, 0.106, 0.239);    // #2A1B3D

      float edge = 1.0 - smoothstep(0.0, 0.30, vEdge);
      vec3 col = mix(indigo, violet, smoothstep(0.15, 0.50, edge));
      col = mix(col, goldEdge, smoothstep(0.45, 0.80, edge));
      col = mix(col, creamHi, smoothstep(0.80, 1.0, edge) * (0.5 + vSpeed * 0.5));

      // Age shimmer — subtle luminance variation
      float shimmer = 0.9 + 0.1 * sin(vAge * 6.2832);
      col *= shimmer;

      float alpha = a * (0.25 + edge * 0.75);
      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ─── Subtle vignette background plane ───
const vigMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float vig = 1.0 - smoothstep(0.15, 0.72, length(c));
      // Warm center glow — very subtle
      vec3 col = mix(vec3(0.039, 0.047, 0.063), vec3(0.055, 0.042, 0.035), vig * 0.4);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const vigScene = new THREE.Scene();
const vigCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
vigScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), vigMat));

// ─── Events ───
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

// ─── Loop ───
const t0 = performance.now();
function loop() {
  const now = performance.now();
  const elapsed = (now - t0) * 0.001; // seconds

  // Voronoi strength ramps in after attractor settles
  const vStr = smoothstepJS(6.0, 14.0, elapsed);

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;
  simUniforms.uVStr.value = vStr;

  // 4 integration sub-steps per frame
  for (let i = 0; i < 4; i++) {
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = elapsed;

  // Slow camera orbit — tracks attractor centroid (~0, 0, 0.8)
  const ang = elapsed * 0.12;
  const radius = 4.2 + Math.sin(elapsed * 0.05) * 0.3;
  camera.position.x = Math.sin(ang) * radius;
  camera.position.z = Math.cos(ang) * radius;
  camera.position.y = Math.sin(ang * 0.6) * 0.9;
  camera.lookAt(0, 0, 0.8);

  // Render vignette background then particles
  renderer.autoClear = false;
  renderer.clear();
  renderer.render(vigScene, vigCam);
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}

function smoothstepJS(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

loop();
</script>
