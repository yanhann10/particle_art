<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: sway, intensity: gentle -->
<title>0lf · seed choreography · hash-driven dancers</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#140a0d}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#cdd2dc;opacity:0.55;font-size:11px;letter-spacing:0.06em;z-index:10}
.seed{position:fixed;left:14px;top:14px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#d4893f;opacity:0.18;font-size:9px;letter-spacing:0.14em;z-index:10;word-break:break-all;max-width:300px;line-height:1.6}
.src{position:fixed;right:14px;top:14px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#cdd2dc;opacity:0.3;font-size:9px;z-index:10}
</style>
</head>
<body>
<div class="id">0lf</div>
<div class="seed" id="seedLabel"></div>
<div class="src">mutated from t9w · Operator / Human Unreadable (Lumen 2023)</div>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import*as THREE from'three';
import{OrbitControls}from'three/addons/controls/OrbitControls.js';

const SEED='a3f7c1d908e2b64f5a1c3e7d0b9f824617d3a5e8c0f2946b8d1e7a3c5f09b264';
document.getElementById('seedLabel').textContent='0x'+SEED;

let s0=0x12345678,s1=0x9abcdef0,s2=0xdeadbeef,s3=0xcafebabe;
for(let i=0;i<64;i+=2){
  const b=parseInt(SEED.substr(i,2),16);
  s0^=b<<((i%8)*4); s1^=b<<(((i+3)%8)*4);
}
function rand(){
  const t=s0^(s0<<11);
  s0=s1;s1=s2;s2=s3;
  s3=(s3^(s3>>>19))^(t^(t>>>8));
  return(s3>>>0)/4294967296;
}
function rr(a,b){return a+rand()*(b-a)}

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,200);
camera.position.set(0,5.5,16);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x140a0d,1);
document.body.appendChild(renderer.domElement);

// stage-cyc background gradient
const bgMat=new THREE.ShaderMaterial({
  depthWrite:false,
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    varying vec2 vUv;
    void main(){
      vec3 top=vec3(0.78,0.48,0.22);
      vec3 mid=vec3(0.45,0.12,0.22);
      vec3 bot=vec3(0.078,0.035,0.05);
      float y=vUv.y;
      vec3 c=y>0.5?mix(mid,top,(y-0.5)*2.):mix(bot,mid,y*2.);
      float vig=1.-0.35*length(vUv-0.5);
      gl_FragColor=vec4(c*vig,1.);
    }`
});
const bgQ=new THREE.Mesh(new THREE.PlaneGeometry(80,50),bgMat);
bgQ.position.set(0,6,-18);scene.add(bgQ);

// stage floor — dark, warm reflection hint
const flMat=new THREE.MeshStandardMaterial({color:0x1a0c0e,roughness:0.92,metalness:0.0});
const fl=new THREE.Mesh(new THREE.PlaneGeometry(50,50),flMat);
fl.rotation.x=-Math.PI/2;fl.position.y=-0.01;scene.add(fl);

// lighting: stage spots
const keyL=new THREE.SpotLight(0xffeedd,1.8,40,0.5,0.6);
keyL.position.set(4,14,8);keyL.target.position.set(0,3,0);
scene.add(keyL);scene.add(keyL.target);
scene.add(new THREE.AmbientLight(0x2a1218,0.4));
const rimL=new THREE.DirectionalLight(0xd4893f,0.35);
rimL.position.set(-7,5,-4);scene.add(rimL);
const fillL=new THREE.PointLight(0x8b5e4b,0.3,20);
fillL.position.set(-3,1,6);scene.add(fillL);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,3.8,0);

// leaf geometry — the elemental unit
function mkLeaf(s){
  const sh=new THREE.Shape();
  sh.moveTo(0,-0.5*s);
  sh.bezierCurveTo(0.2*s,-0.15*s,0.24*s,0.2*s,0,0.5*s);
  sh.bezierCurveTo(-0.24*s,0.2*s,-0.2*s,-0.15*s,0,-0.5*s);
  return new THREE.ShapeGeometry(sh,5);
}

// palette: bone, sienna, blush, amber, rosewood
const PAL=[0xe8d5c4,0xc4936a,0xc47a5a,0xd4893f,0x8b4a3c];

// skeleton topology: parent index, rest offset
const SKEL=[
  {p:-1,rx:0,ry:0},       // 0 hip
  {p:0,rx:0,ry:0.9},      // 1 spine
  {p:1,rx:0,ry:0.75},     // 2 chest
  {p:2,rx:0,ry:0.45},     // 3 neck
  {p:3,rx:0,ry:0.38},     // 4 head
  {p:2,rx:-0.38,ry:0.05}, // 5 Lshoulder
  {p:5,rx:-0.15,ry:-0.65},// 6 Lelbow
  {p:6,rx:-0.1,ry:-0.55}, // 7 Lhand
  {p:2,rx:0.38,ry:0.05},  // 8 Rshoulder
  {p:8,rx:0.15,ry:-0.65}, // 9 Relbow
  {p:9,rx:0.1,ry:-0.55},  // 10 Rhand
  {p:0,rx:-0.2,ry:-0.05}, // 11 Lhip
  {p:11,rx:-0.05,ry:-0.85},//12 Lknee
  {p:12,rx:0,ry:-0.8},    // 13 Lfoot
  {p:0,rx:0.2,ry:-0.05},  // 14 Rhip
  {p:14,rx:0.05,ry:-0.85},//15 Rknee
  {p:15,rx:0,ry:-0.8},    // 16 Rfoot
];
const NJ=SKEL.length;
const ND=6;
const TRAIL_LEN=12;
const dancers=[];

for(let d=0;d<ND;d++){
  const cx=rr(-5.5,5.5),cz=rr(-1.5,1.5);
  const scl=rr(0.75,1.1);
  const baseY=rr(3.0,4.2)*scl;
  const ph0=rr(0,Math.PI*2);
  const fMul=rr(0.5,1.3);
  const aMul=rr(0.5,1.4);
  const ci=Math.floor(rand()*PAL.length);
  const joints=[];

  for(let j=0;j<NJ;j++){
    joints.push({
      ph:ph0+rr(0,Math.PI*1.5),
      ax:rr(0.08,0.5)*aMul,
      ay:rr(0.04,0.25)*aMul,
      az:rr(0.04,0.25)*aMul,
      fx:rr(0.25,0.8)*fMul,
      fy:rr(0.35,0.95)*fMul,
      fz:rr(0.2,0.65)*fMul,
      x:0,y:0,z:0,
    });
  }

  // leaf instances for joints
  const leafGeo=mkLeaf(j=>j===4?0.38*scl:0.22*scl);
  const leafMeshes=[];
  for(let j=0;j<NJ;j++){
    const sz=j===4?0.38*scl:0.22*scl;
    const g=mkLeaf(sz);
    const m=new THREE.MeshStandardMaterial({
      color:PAL[(ci+j%3)%PAL.length],
      emissive:0x180808,roughness:0.55,metalness:0.04,side:THREE.DoubleSide
    });
    const mesh=new THREE.Mesh(g,m);
    scene.add(mesh);leafMeshes.push(mesh);
  }

  // ghost trail leaves (fainter, smaller)
  const ghosts=[];
  for(let tr=0;tr<TRAIL_LEN;tr++){
    const trMeshes=[];
    const alpha=0.12*(1-tr/TRAIL_LEN);
    for(let j=0;j<NJ;j++){
      const sz=(j===4?0.3:0.16)*scl*(1-tr*0.04);
      const g=mkLeaf(sz);
      const m=new THREE.MeshStandardMaterial({
        color:PAL[(ci+j%3)%PAL.length],
        emissive:0x100606,roughness:0.7,metalness:0.0,
        transparent:true,opacity:alpha,side:THREE.DoubleSide,depthWrite:false
      });
      const mesh=new THREE.Mesh(g,m);
      scene.add(mesh);trMeshes.push(mesh);
    }
    ghosts.push({meshes:trMeshes,positions:new Float32Array(NJ*3)});
  }

  // bone lines
  const bPos=new Float32Array(NJ*2*3);
  const bGeo=new THREE.BufferGeometry();
  bGeo.setAttribute('position',new THREE.BufferAttribute(bPos,3));
  const bMat=new THREE.LineBasicMaterial({color:PAL[ci],transparent:true,opacity:0.28});
  const bLines=new THREE.LineSegments(bGeo,bMat);
  scene.add(bLines);

  // ghost bone lines
  const gbPos=new Float32Array(NJ*2*3);
  const gbGeo=new THREE.BufferGeometry();
  gbGeo.setAttribute('position',new THREE.BufferAttribute(gbPos,3));
  const gbMat=new THREE.LineBasicMaterial({color:PAL[ci],transparent:true,opacity:0.06,depthWrite:false});
  const gbLines=new THREE.LineSegments(gbGeo,gbMat);
  scene.add(gbLines);

  dancers.push({cx,cz,scl,baseY,joints,leafMeshes,ghosts,bPos,bGeo,bLines,gbPos,gbGeo,gbLines,ph0,fMul,trailIdx:0});
}

// film grain
const grainMat=new THREE.ShaderMaterial({
  transparent:true,depthTest:false,depthWrite:false,
  uniforms:{uTime:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    varying vec2 vUv;uniform float uTime;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    void main(){float g=h(vUv*900.+uTime*17.3);gl_FragColor=vec4(vec3(g),0.035);}`
});
const grainS=new THREE.Scene();
const grainC=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
grainS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),grainMat));

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

let paused=false;
addEventListener('click',()=>{paused=!paused;});
const T0=performance.now();
let trailClock=0;

function loop(){
  const t=(performance.now()-T0)/1000;
  grainMat.uniforms.uTime.value=t;
  if(paused){controls.update();renderer.render(scene,camera);renderer.autoClear=false;renderer.render(grainS,grainC);renderer.autoClear=true;requestAnimationFrame(loop);return;}

  const shouldTrail=(t-trailClock)>0.12;
  if(shouldTrail)trailClock=t;

  for(const d of dancers){
    // shift trail history
    if(shouldTrail){
      for(let tr=TRAIL_LEN-1;tr>0;tr--){
        d.ghosts[tr].positions.set(d.ghosts[tr-1].positions);
      }
      // store current into slot 0
      for(let j=0;j<NJ;j++){
        d.ghosts[0].positions[j*3]=d.joints[j].x;
        d.ghosts[0].positions[j*3+1]=d.joints[j].y;
        d.ghosts[0].positions[j*3+2]=d.joints[j].z;
      }
    }

    // resolve joint positions
    for(let j=0;j<NJ;j++){
      const sk=SKEL[j],jt=d.joints[j];
      const dx=Math.sin(t*jt.fx+jt.ph)*jt.ax;
      const dy=Math.sin(t*jt.fy+jt.ph*1.3)*jt.ay;
      const dz=Math.sin(t*jt.fz+jt.ph*0.7)*jt.az;
      if(sk.p===-1){
        jt.x=d.cx+dx+Math.sin(t*0.3+d.ph0)*0.4;
        jt.y=d.baseY+dy+Math.sin(t*0.35+d.ph0)*0.25;
        jt.z=d.cz+dz;
      }else{
        const pj=d.joints[sk.p];
        jt.x=pj.x+sk.rx*d.scl+dx;
        jt.y=pj.y+sk.ry*d.scl+dy;
        jt.z=pj.z+dz;
      }
      const lf=d.leafMeshes[j];
      lf.position.set(jt.x,jt.y,jt.z);
      const vx=Math.cos(t*jt.fx+jt.ph)*jt.ax*jt.fx;
      const vy=Math.cos(t*jt.fy+jt.ph*1.3)*jt.ay*jt.fy;
      lf.rotation.z=Math.atan2(vy,vx+0.001);
      lf.rotation.y=Math.sin(t*0.4+j*0.7)*0.4;
    }

    // update bone lines
    let bi=0;
    for(let j=0;j<NJ;j++){
      const sk=SKEL[j],jt=d.joints[j];
      if(sk.p===-1){
        d.bPos[bi++]=jt.x;d.bPos[bi++]=jt.y;d.bPos[bi++]=jt.z;
        d.bPos[bi++]=jt.x;d.bPos[bi++]=jt.y;d.bPos[bi++]=jt.z;
      }else{
        const pj=d.joints[sk.p];
        d.bPos[bi++]=pj.x;d.bPos[bi++]=pj.y;d.bPos[bi++]=pj.z;
        d.bPos[bi++]=jt.x;d.bPos[bi++]=jt.y;d.bPos[bi++]=jt.z;
      }
    }
    d.bGeo.attributes.position.needsUpdate=true;

    // update ghost trail meshes
    for(let tr=0;tr<TRAIL_LEN;tr++){
      const gp=d.ghosts[tr].positions;
      const gm=d.ghosts[tr].meshes;
      for(let j=0;j<NJ;j++){
        gm[j].position.set(gp[j*3],gp[j*3+1],gp[j*3+2]);
        gm[j].rotation.z=d.leafMeshes[j].rotation.z;
        gm[j].rotation.y=d.leafMeshes[j].rotation.y;
      }
    }

    // ghost bone lines from oldest trail
    const mid=Math.floor(TRAIL_LEN/2);
    const gp=d.ghosts[mid].positions;
    let gi=0;
    for(let j=0;j<NJ;j++){
      const sk=SKEL[j];
      if(sk.p===-1){
        d.gbPos[gi++]=gp[j*3];d.gbPos[gi++]=gp[j*3+1];d.gbPos[gi++]=gp[j*3+2];
        d.gbPos[gi++]=gp[j*3];d.gbPos[gi++]=gp[j*3+1];d.gbPos[gi++]=gp[j*3+2];
      }else{
        const p=sk.p;
        d.gbPos[gi++]=gp[p*3];d.gbPos[gi++]=gp[p*3+1];d.gbPos[gi++]=gp[p*3+2];
        d.gbPos[gi++]=gp[j*3];d.gbPos[gi++]=gp[j*3+1];d.gbPos[gi++]=gp[j*3+2];
      }
    }
    d.gbGeo.attributes.position.needsUpdate=true;
  }

  // camera follows ensemble centroid gently
  let ecx=0,ecy=0;
  for(const d of dancers){ecx+=d.joints[0].x;ecy+=d.joints[0].y;}
  ecx/=ND;ecy/=ND;
  controls.target.x+=(ecx-controls.target.x)*0.015;
  controls.target.y+=(ecy-controls.target.y)*0.015;

  controls.update();
  renderer.render(scene,camera);
  renderer.autoClear=false;
  renderer.render(grainS,grainC);
  renderer.autoClear=true;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
