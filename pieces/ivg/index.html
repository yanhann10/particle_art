<title>ivg · Reas Process variant — calyx traced by rule-based agents</title>
<!-- MOTION: drift, intensity: calm -->

  body {
    background: #0a0a0a;
    color: #9a9a9a; font-family: ui-monospace, "SF Mono", Menlo, monospace;

<body>
<div class="id">ivg · Reas Process variant — calyx traced by rule-based agents</div>
<div class="hint">click to reset process · drag to nudge view</div>
<div class="src">descended from ere · Casey Reas · monochrome + minimal accent · rule-based emergence · 2010 restraint</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Casey Reas directive: deterministic rule-based emergence, near-monochrome, one
// small accent color, restraint from 2010 generative art era. No noise, no glow excess.
// Implementation: agents follow simple local rules (seek calyx field maxima, leave traces,
// avoid neighbors), producing the form over time via accumulated paths — Process 11 variant.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ────────────── Riley-style interference field defines the target morphology
let regrowSeed = Math.random() * 1e9;
let fieldParams = {};
function prepareField(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  fieldParams = {
    w1: { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 },
    w2: { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 },
    w3: { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 },
    radK: 1.3 + rng() * 0.6
  };
}
function sampleField(x, z){
  const { w1, w2, w3, radK } = fieldParams;
  const r = Math.sqrt(x*x + z*z);
  const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
  const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
  const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
  const vR = Math.sin(r * radK);
  const f  = (v1 + v2 + v3 + vR) * 0.25;
  const fall = Math.exp(-r * r * 0.10);
  return f * fall;
}
function calyxY(x, z){
  const r = Math.sqrt(x*x + z*z);
  const th = Math.atan2(z, x);
  const petals = 6;
  const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
  return -0.15 * r * r + scallop;
}

prepareField(Math.floor(regrowSeed));

// ────────────── Agent system (Reas Process 11 variant)
// Rules:
//  1. Agent seeks positive field regions, climbs field gradient
//  2. Agent avoids neighbors within threshold distance
//  3. Agent leaves a permanent trace segment each step
//  4. Trace segments accumulate into a line mesh — the form emerges from accumulated paths

const N_AGENTS = 80;
const TRACE_CAPACITY = 60000;
class Agent {
  constructor(x, y, z, seed){
    this.pos = new THREE.Vector3(x, y, z);
    this.vel = new THREE.Vector3(0, 0, 0);
    this.seed = seed;
    this.age = 0;
    this.dead = false;
    this.trace = [];
  }
  step(agents, dt){
    if (this.dead) return;
    this.age += dt;
    // Rule 1: climb field gradient
    const eps = 0.05;
    const fx = (sampleField(this.pos.x + eps, this.pos.z) - sampleField(this.pos.x - eps, this.pos.z)) / (2*eps);
    const fz = (sampleField(this.pos.x, this.pos.z + eps) - sampleField(this.pos.x, this.pos.z - eps)) / (2*eps);
    const grad = new THREE.Vector3(fx, 0, fz);
    grad.normalize();
    // Rule 2: avoid neighbors within 0.3 units
    const avoid = new THREE.Vector3(0, 0, 0);
    for (let other of agents){
      if (other === this || other.dead) continue;
      const diff = this.pos.clone().sub(other.pos);
      const d = diff.length();
      if (d < 0.3 && d > 0.001){
        avoid.add(diff.normalize().multiplyScalar(1.0 / d));
      }
    }
    // Rule 3: slight bias toward center (r < 4)
    const center = new THREE.Vector3(0, 0, 0);
    const toCenter = center.sub(this.pos);
    const rr = this.pos.x*this.pos.x + this.pos.z*this.pos.z;
    const centerWeight = (rr > 16) ? 0.4 : 0.0;
    toCenter.normalize().multiplyScalar(centerWeight);
    // Combine forces
    this.vel.add(grad.multiplyScalar(0.8));
    this.vel.add(avoid.multiplyScalar(1.2));
    this.vel.add(toCenter);
    // speed limit
    const speed = this.vel.length();
    if (speed > 0.12) this.vel.multiplyScalar(0.12 / speed);
    // move
    const prev = this.pos.clone();
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    // clamp to calyx surface
    this.pos.y = calyxY(this.pos.x, this.pos.z);
    // kill if out of bounds
    const r = Math.sqrt(this.pos.x*this.pos.x + this.pos.z*this.pos.z);
    if (r > 5 || this.age > 90) this.dead = true;
    // record trace segment
    if (!this.dead && prev.distanceTo(this.pos) > 0.01){
      this.trace.push({ a: prev.clone(), b: this.pos.clone() });
    }
  }
}

let agents = [];
function initAgents(seed){
  agents = [];
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  for (let i = 0; i < N_AGENTS; i++){
    const r = Math.sqrt(rng()) * 1.5;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const y = calyxY(x, z);
    agents.push(new Agent(x, y, z, rng()));
  }
}
initAgents(Math.floor(regrowSeed));

// ────────────── Trace rendering (accumulated line segments)
const traceGeom = new THREE.BufferGeometry();
const tracePos = new Float32Array(TRACE_CAPACITY * 6);
const traceCol = new Float32Array(TRACE_CAPACITY * 6);
traceGeom.setAttribute('position', new THREE.BufferAttribute(tracePos, 3));
traceGeom.setAttribute('color',    new THREE.BufferAttribute(traceCol, 3));
traceGeom.setDrawRange(0, 0);
const traceMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: false });
const traceLines = new THREE.LineSegments(traceGeom, traceMat);
scene.add(traceLines);

let traceCount = 0;
function updateTraces(){
  traceCount = 0;
  for (let agent of agents){
    for (let seg of agent.trace){
      if (traceCount >= TRACE_CAPACITY) break;
      tracePos[traceCount*6]     = seg.a.x;
      tracePos[traceCount*6 + 1] = seg.a.y;
      tracePos[traceCount*6 + 2] = seg.a.z;
      tracePos[traceCount*6 + 3] = seg.b.x;
      tracePos[traceCount*6 + 4] = seg.b.y;
      tracePos[traceCount*6 + 5] = seg.b.z;
      // monochrome with one accent: 95% cool gray (desaturated blue-gray), 5% warm rust
      const accent = (agent.seed < 0.05);
      const c = accent ? new THREE.Color(0.65, 0.28, 0.18) : new THREE.Color(0.72, 0.72, 0.74);
      traceCol[traceCount*6]     = c.r;
      traceCol[traceCount*6 + 1] = c.g;
      traceCol[traceCount*6 + 2] = c.b;
      traceCol[traceCount*6 + 3] = c.r;
      traceCol[traceCount*6 + 4] = c.g;
      traceCol[traceCount*6 + 5] = c.b;
      traceCount++;
    }
    if (traceCount >= TRACE_CAPACITY) break;
  }
  traceGeom.attributes.position.needsUpdate = true;
  traceGeom.attributes.color.needsUpdate = true;
  traceGeom.setDrawRange(0, traceCount * 2);
}

// ────────────── interaction
const pointer = new THREE.Vector2(0, 0);
addEventListener('pointermove', (e) => {
  pointer.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  prepareField(Math.floor(regrowSeed));
  initAgents(Math.floor(regrowSeed));
  traceCount = 0;
  traceGeom.setDrawRange(0, 0);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = 0;
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = t - lastT;
  lastT = t;
  // step agents
  for (let agent of agents) agent.step(agents, dt * 8);
  updateTraces();
  // gentle pointer-driven camera tilt
  camera.position.x = pointer.x * 0.3;
  camera.position.y = 0.2 + pointer.y * 0.3;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
