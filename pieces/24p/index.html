<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24p · Shiota — Two Home Countries</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">24p</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040101, 0.0025);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.015));

const pL = new THREE.PointLight(0xffd8b0, 0.04, 60, 1.8);
pL.position.set(-3, 20, 4);
scene.add(pL);

let seed = 48291537;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 44, h: 36, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a pale moon within the circulatory cosmos
const sphereCenter = new THREE.Vector3(0.6, 2.2, -0.3);
const SPHERE_R = 1.8;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xede0cc, emissiveIntensity: 0.6,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.28,
  side: THREE.FrontSide
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner luminance — warm core glow
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.65, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf2e2, transparent: true, opacity: 0.04 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// Suspension threads — 8 fine dark lines from ceiling to sphere crown
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i / 8) * Math.PI * 2 + (rng()-0.5)*0.2;
  const spreadTop = 1.2 + rng()*0.6;
  const spreadBot = 0.15 + rng()*0.1;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*spreadTop, hh, sphereCenter.z + Math.sin(a)*spreadTop,
    sphereCenter.x + Math.cos(a)*spreadBot, sphereCenter.y + SPHERE_R - 0.05, sphereCenter.z + Math.sin(a)*spreadBot
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0404, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u) * SPHERE_R,
    sphereCenter.y + Math.sin(v)*Math.sin(u) * SPHERE_R,
    sphereCenter.z + Math.cos(v) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — concentric shells radiating outward from the sphere
const anchors = [];

// Shell anchors at increasing radii
const shellRadii = [3.5, 5.5, 8, 11, 15];
for(const sr of shellRadii){
  const nPts = Math.floor(14 + sr * 2.5);
  for(let i = 0; i < nPts; i++){
    const u = rng() * Math.PI * 2;
    const v = Math.acos(2*rng()-1);
    const r = sr * (0.85 + rng()*0.3);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u) * r + (rng()-0.5)*0.6,
      sphereCenter.y + Math.sin(v)*Math.sin(u) * r * 0.85 + (rng()-0.5)*0.5,
      sphereCenter.z + Math.cos(v) * r + (rng()-0.5)*0.6
    ));
  }
}

// Wall-biased architectural anchors
while(anchors.length < 520){
  const p = rng() < 0.3 ? wallPt() : wallPt().lerp(sphereCenter, 0.03 + rng()*0.2);
  anchors.push(p);
}

// Void zones — deliberate negative space the camera peers through
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 5, sphereCenter.y - 5, sphereCenter.z + 6), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 6, sphereCenter.y + 5, sphereCenter.z - 5), r: 2.2 },
  { pos: new THREE.Vector3(sphereCenter.x + 3, sphereCenter.y - 8, sphereCenter.z - 4), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — threads reach for the sphere surface
// Blood vessels finding the heart, nerves seeking the core
const catA = Math.floor(NUM_LINES * 0.48);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.45){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = sphereSurf();

  // 10% stop short — threads that almost reach the sphere but fail
  // the gap between longing and arrival
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng() * 1.3;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — anchor-to-anchor within threshold
// The web as connective tissue between memory-points
const THRESH = 6.0;
const catBtarget = Math.floor(NUM_LINES * 0.30);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 90000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Rule 3: GRAVITATIONAL DRAPE — threads descending from sphere toward floor
// Weight and longing pulling the web earthward
const catC = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const spt = sphereSurf();
  // Only from lower hemisphere
  if(spt.y > sphereCenter.y) { i--; continue; }
  const floorPt = new THREE.Vector3(
    spt.x + (rng()-0.5)*4.0,
    -hh,
    spt.z + (rng()-0.5)*4.0
  );
  if(!inVoid(spt)) setLine(spt, floorPt, 2);
}

// Rule 4: DENDRITIC BRANCHES — short forking chains near anchors
// The web exhibits growth, not just connection
const catD = Math.floor(NUM_LINES * 0.06);
let catDcount = 0;
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const base = anchors[Math.floor(rng()*anchors.length)];
  if(inVoid(base)) continue;
  let cur = base.clone();
  const nSegs = 2 + Math.floor(rng()*3);
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.6 + rng()*1.2;
  for(let s = 0; s < nSegs && li < NUM_LINES; s++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen * (0.7 + rng()*0.6)));
    // Fork direction slightly
    dir.x += (rng()-0.5)*0.6;
    dir.y += (rng()-0.5)*0.4;
    dir.z += (rng()-0.5)*0.6;
    dir.normalize();
    if(!inVoid(next)){
      setLine(cur, next, 3);
      catDcount++;
    }
    cur = next;
  }
}

// Fill remainder: architectural wall-to-wall spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.2 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
// sphere-converging: brightest, proximity: mid, drape: mid-soft, dendritic: soft, architectural: faintest
const catOpacity = [0.08, 0.05, 0.065, 0.055, 0.028];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.03;
  const bright = op / 0.08;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — stones, charred paper, memories caught in the web
const NUM_FRAGMENTS = 28;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.07;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.7);
  const h = sz * (0.4 + rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.15), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.08), 0,
    w*(0.1-rng()*0.25), -h*0.5, 0,
    w*(-0.3+rng()*0.15), h*0.5, 0,
    w*(0.15+rng()*0.3), h*(rng()*0.04), 0,
    w*(0.1-rng()*0.25), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.014;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.015),
    transparent: true,
    opacity: 0.14 + rng()*0.2,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.6){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(SPHERE_R + 1.5 + rng()*6.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative arc: begin deep inside the outer web, dense threads all around,
// slowly approach the sphere as the web thickens, arrive at the sphere's orbit,
// pause in intimate proximity, then gently ascend to see the full circulatory cosmos.
// The arc of converging — reaching toward the still center.
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  let rH, y;
  if(t < 0.25){
    // Phase 1: deep in the outer web, dense threads all around
    const lt = t / 0.25;
    rH = 12.0 - lt * 3.5;
    y = cy - 6 + lt * 4;
  } else if(t < 0.5){
    // Phase 2: approaching the sphere through thickening threads
    const lt = (t - 0.25) / 0.25;
    rH = 8.5 - lt * 3.0;
    y = cy - 2 + lt * 3.5 + Math.sin(lt * Math.PI) * 0.8;
  } else if(t < 0.75){
    // Phase 3: intimate orbit near the sphere — the heart of the web
    const lt = (t - 0.5) / 0.25;
    rH = 5.5 + Math.sin(lt * Math.PI) * 0.4;
    y = cy + 1.5 + Math.sin(lt * Math.PI * 1.5) * 1.5;
  } else {
    // Phase 4: ascending — the whole nervous system revealed from above
    const lt = (t - 0.75) / 0.25;
    rH = 6.0 + lt * 3.0;
    y = cy + 3 + lt * 5 + Math.sin(lt * Math.PI) * 2.0;
  }

  const x = cx + Math.sin(p * 1.05) * rH + Math.cos(p * 0.4 + 1.3) * 0.4;
  const z = cz + Math.cos(p * 1.05) * (rH * 1.05) + Math.sin(p * 0.45 + 0.7) * 0.35;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible sway, as if the web inhales
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.00012 * Math.max(0, 1.0 - dist / 24.0);
    const phase = basePositions[idx]*0.1 + basePositions[idx+1]*0.13 + i*0.0003;
    const breath = Math.sin(t*0.008 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.1;
      arr[vi+2] = basePositions[vi+2] + breath*0.18;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera along path
  const speed = 0.00035;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — the still center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.001)*0.03;
  look.y += Math.cos(t*0.0008)*0.02 + 0.15;
  look.z += Math.sin(t*0.0012)*0.025;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = -3 + Math.sin(t*0.0005)*0.1;
  pL.position.y = 20 + Math.cos(t*0.0003)*0.05;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
