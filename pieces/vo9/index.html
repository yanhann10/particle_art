<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spiritual · Hilma af Klint — esoteric geometry of the figure</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06060e; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#e5dcd2; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · spiritual …</div>
<div class="id">vo9</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06060e, 1);
document.body.appendChild(renderer.domElement);

/* ── Hilma af Klint: the figure as spiritual diagram ──────────────── */
/* The Lucy copies become concentric mandala layers. Center copy is    */
/* the soul (gold-rose). Inner ring = astral body (blue). Middle ring  */
/* = etheric (soft green-gold). Outer ring = physical dissolving into  */
/* cosmic spiral. Particles slowly spiral outward as if the figure's   */
/* spiritual layers are being diagrammed, af Klint style.              */

const COPIES = 30;
const PER_CENTER = 28000;
const PER_RING1  = 2000;
const PER_RING2  = 1600;
const PER_RING3  = 1400;
const N = PER_CENTER + 7 * PER_RING1 + 11 * PER_RING2 + 11 * PER_RING3;

const copyOffsets = [];
const copyScales  = [];
const copyRing    = [];

copyOffsets.push(new THREE.Vector3(0, 0, 0));
copyScales.push(1.0);
copyRing.push(0);

for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 16, 0, Math.sin(a) * 16));
  copyScales.push(0.52);
  copyRing.push(1);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.28;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 30, 0, Math.sin(a) * 30));
  copyScales.push(0.36);
  copyRing.push(2);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.14;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 44, 0, Math.sin(a) * 44));
  copyScales.push(0.25);
  copyRing.push(3);
}

const restPositions = new Float32Array(N * 3);
const localRest     = new Float32Array(N * 3);
const seedsArr      = new Float32Array(N);
const scaleArr      = new Float32Array(N);
const ringArr       = new Float32Array(N);

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0.0 }
};

/* ── af Klint vertex shader: color-coded cosmology, spiral ascent ── */
const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uReady;
  attribute vec3  rest;
  attribute vec3  localR;
  attribute float seed;
  attribute float sc;
  attribute float ring;
  varying vec3  vCol;
  varying float vAlpha;
  varying float vSpiral;

  /* af Klint's color cosmology — each layer has spiritual meaning */
  /* Ring 0 (soul):     warm gold-rose, the innermost vision       */
  /* Ring 1 (astral):   deep ultramarine blue — the astral plane   */
  /* Ring 2 (etheric):  sage green-gold — growth, life force       */
  /* Ring 3 (physical): soft mauve fading to cosmos                */

  vec3 soulColor(float height, float t) {
    vec3 gold = vec3(0.88, 0.72, 0.28);
    vec3 rose = vec3(0.82, 0.45, 0.42);
    float blend = sin(height * 0.12 + t * 0.15) * 0.5 + 0.5;
    return mix(gold, rose, blend);
  }

  vec3 astralColor(float height, float t) {
    vec3 deepBlue = vec3(0.12, 0.18, 0.52);
    vec3 ultraBlue = vec3(0.22, 0.32, 0.68);
    float blend = sin(height * 0.15 + t * 0.12) * 0.5 + 0.5;
    return mix(deepBlue, ultraBlue, blend);
  }

  vec3 ethericColor(float height, float t) {
    vec3 sage = vec3(0.38, 0.52, 0.32);
    vec3 paleGold = vec3(0.62, 0.58, 0.35);
    float blend = sin(height * 0.1 + t * 0.18) * 0.5 + 0.5;
    return mix(sage, paleGold, blend);
  }

  vec3 physicalColor(float height, float t) {
    vec3 mauve = vec3(0.48, 0.38, 0.52);
    vec3 paleViolet = vec3(0.35, 0.30, 0.45);
    float blend = sin(height * 0.14 + t * 0.1) * 0.5 + 0.5;
    return mix(mauve, paleViolet, blend);
  }

  void main() {
    float t = uTime * 0.25 + seed * 6.2831;

    vec3 lr = localR;

    /* af Klint breathing: gentle vertical pulsation like a living diagram */
    float breathe = sin(uTime * 0.08 + ring * 1.57) * 0.02;
    lr.y *= 1.0 + breathe;

    /* spiritual spiral: particles slowly rotate around the y-axis */
    /* inner rings spiral faster (closer to the soul), outer rings slower */
    float spiralSpeed = 0.04 * (1.0 - ring * 0.2);
    float spiralAngle = uTime * spiralSpeed + seed * 0.3;
    float cs = cos(spiralAngle), ss = sin(spiralAngle);
    lr = vec3(lr.x * cs - lr.z * ss, lr.y, lr.x * ss + lr.z * cs);

    /* color assignment by ring — af Klint's cosmological layers */
    vec3 col;
    float h = lr.y;
    if (ring < 0.5) {
      col = soulColor(h, uTime);
    } else if (ring < 1.5) {
      col = astralColor(h, uTime);
    } else if (ring < 2.5) {
      col = ethericColor(h, uTime);
    } else {
      col = physicalColor(h, uTime);
    }

    /* height-based luminance modulation — diagrammatic light from above */
    float heightNorm = (lr.y + 10.0) / 20.0;
    float topLight = smoothstep(-0.1, 1.0, heightNorm);
    col *= 0.5 + 0.6 * topLight;

    /* subtle golden halo near the figure's head region (top of form) */
    float headGlow = smoothstep(6.0, 9.0, lr.y) * (1.0 - ring * 0.25);
    vec3 haloGold = vec3(0.92, 0.78, 0.35);
    col = mix(col, haloGold, headGlow * 0.4 * (0.7 + 0.3 * sin(uTime * 0.1)));

    vCol = col;

    /* world position */
    vec3 off = rest - localR * sc;
    vec3 p = lr * sc + off;

    /* gentle outward spiral drift — the vision expanding like af Klint's paintings */
    float spiralDrift = sin(uTime * 0.06 + seed * 6.28) * 0.5 + 0.5;
    float driftMag = spiralDrift * 0.4 * sc * smoothstep(0.5, 1.0, ring / 3.0);
    float driftA = atan(lr.z, lr.x) + uTime * 0.03;
    p.x += cos(driftA) * driftMag;
    p.z += sin(driftA) * driftMag;
    /* slight ascent — the spiritual rises */
    p.y += driftMag * 0.3;

    vSpiral = spiralDrift * smoothstep(0.3, 1.0, ring / 3.0);

    /* return toward rest — prevent runaway */
    vec3 restP = lr * sc + off;
    float returnStr = 0.08;
    p = mix(p, restP, returnStr);

    /* assembly reveal — spiral inward */
    float angle2 = seed * 6.2831 * 4.0;
    float radius2 = 50.0 + seed * 30.0;
    vec3 entry = vec3(cos(angle2) * radius2, sin(seed * 20.0) * 25.0, sin(angle2) * radius2);
    float reveal = smoothstep(0.0, 1.0, uReady);
    p = mix(entry, p, reveal);

    /* alpha: center ring brightest, outer rings more translucent */
    float baseAlpha = 0.18 + 0.55 * topLight;
    float ringFade = 1.0 - ring * 0.12;
    vAlpha = reveal * baseAlpha * ringFade;

    /* outer spiral particles glow slightly */
    vAlpha = max(vAlpha, vSpiral * 0.35 * reveal);

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float camDist = -mv.z;
    float baseSz = (1.0 + 0.4 * topLight + 0.8 * vSpiral) * uPixel * (42.0 / max(camDist, 1.0)) * reveal;
    gl_PointSize = max(1.0, baseSz);
    gl_Position  = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying vec3  vCol;
  varying float vAlpha;
  varying float vSpiral;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d);
    if (r2 > 0.25) discard;
    float edge = mix(0.04, 0.18, vSpiral);
    float a = smoothstep(0.25, edge, r2) * vAlpha;
    vec3 col = vCol * (1.0 + vSpiral * 0.1);
    gl_FragColor = vec4(col * a, a);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  blending: THREE.NormalBlending,
  vertexShader,
  fragmentShader
});

const geom   = new THREE.BufferGeometry();
const points  = new THREE.Points(geom, mat);
scene.add(points);

/* ── mandala ground: concentric rings of light — af Klint's diagrams ── */
const floorGeo = new THREE.PlaneGeometry(200, 200, 1, 1);
floorGeo.rotateX(-Math.PI / 2);
const floorMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  uniforms: { uTime: uniforms.uTime, uReady: uniforms.uReady },
  vertexShader: `
    varying vec3 vWPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uReady;
    varying vec3 vWPos;
    void main() {
      float dist = length(vWPos.xz);
      /* concentric mandala rings */
      float ring1 = smoothstep(0.4, 0.0, abs(dist - 16.0));
      float ring2 = smoothstep(0.3, 0.0, abs(dist - 30.0));
      float ring3 = smoothstep(0.25, 0.0, abs(dist - 44.0));
      float center = 0.15 / (1.0 + dist * dist * 0.008);

      /* af Klint palette for ground rings */
      vec3 goldLine = vec3(0.72, 0.58, 0.22);
      vec3 blueLine = vec3(0.14, 0.22, 0.48);
      vec3 sageLine = vec3(0.32, 0.42, 0.28);
      vec3 mauveLine = vec3(0.38, 0.30, 0.42);

      vec3 col = goldLine * center
               + blueLine * ring1 * 0.5
               + sageLine * ring2 * 0.35
               + mauveLine * ring3 * 0.25;

      /* slow rotation of ring brightness */
      float ang = atan(vWPos.z, vWPos.x);
      float pulse = 0.7 + 0.3 * sin(ang * 6.0 + uTime * 0.08);
      col *= pulse;

      float fade = smoothstep(60.0, 15.0, dist);
      float totalIntensity = center + ring1 * 0.5 + ring2 * 0.35 + ring3 * 0.25;
      gl_FragColor = vec4(col, fade * 0.14 * uReady * min(totalIntensity, 1.0));
    }
  `
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -8.5;
scene.add(floor);

/* ── load Stanford Lucy ── */
const loadingEl = document.getElementById('loading');
let revealStart = 0;

new PLYLoader().load(
  'https://threejs.org/examples/models/ply/binary/Lucy100k.ply',
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size   = bb.getSize(new THREE.Vector3());
    const baseScale = 15 / Math.max(size.x, size.y, size.z);
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(baseScale, baseScale, baseScale);

    const mesh    = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp     = new THREE.Vector3();

    let idx = 0;
    for (let c = 0; c < COPIES; c++) {
      const count = c === 0 ? PER_CENTER
        : (copyRing[c] === 1 ? PER_RING1
        : (copyRing[c] === 2 ? PER_RING2 : PER_RING3));
      const s   = copyScales[c];
      const off = copyOffsets[c];
      const r   = copyRing[c];
      for (let i = 0; i < count; i++) {
        sampler.sample(tmp);
        const lx = tmp.x * s, ly = tmp.y * s, lz = tmp.z * s;
        localRest[idx * 3]     = lx;
        localRest[idx * 3 + 1] = ly;
        localRest[idx * 3 + 2] = lz;
        restPositions[idx * 3]     = lx + off.x;
        restPositions[idx * 3 + 1] = ly + off.y;
        restPositions[idx * 3 + 2] = lz + off.z;
        seedsArr[idx] = Math.random();
        scaleArr[idx] = s;
        ringArr[idx]  = r;
        idx++;
      }
    }

    const posArr = new Float32Array(N * 3);
    geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('localR',   new THREE.BufferAttribute(localRest, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seedsArr, 1));
    geom.setAttribute('sc',       new THREE.BufferAttribute(scaleArr, 1));
    geom.setAttribute('ring',     new THREE.BufferAttribute(ringArr, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      loadingEl.textContent = `loading lucy · ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  () => { loadingEl.textContent = 'load failed — check network'; }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ── */
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 4000);
  }

  /* camera: slow meditative orbit, slightly elevated — viewing the mandala */
  const orbitR = 32 + 5 * Math.sin(t * 0.018);
  const angle  = t * 0.02;
  const camY   = 8.0 + 4.0 * Math.sin(t * 0.022) + 1.5 * Math.sin(t * 0.009);
  camera.position.set(Math.sin(angle) * orbitR, camY, Math.cos(angle) * orbitR);
  /* lookAt gently drifts upward — the spiritual gaze */
  const lookY = 2.0 + 1.0 * Math.sin(t * 0.013);
  camera.lookAt(0, lookY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
