<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7ms · withdrawn figure · harman ontology</title>
<!-- MOTION: orbit, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a0b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.38; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">7ms</div>
<div class="hint">the object withdraws from view</div>
<div class="src">harman ontology · descended from t9w</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Graham Harman: objects withdraw from full apprehension. The figure — a 
// standing human silhouette built from differential growth — is never fully
// visible: variable fog density, shy zones where particles fade as camera 
// approaches, near-clip occlusion, depth beyond frustum. Orbit forever; 
// you'll never see the whole.

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d0a0b, 2.0, 22.0);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 1.5, 30);
camera.position.set(11, 7, 9);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a0b, 1);
document.body.appendChild(renderer.domElement);

const lightKey  = new THREE.DirectionalLight(0xffebe0, 0.6);
lightKey.position.set(8, 12, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x1a1214, 0.7));
const lightRim  = new THREE.DirectionalLight(0x6688aa, 0.3);
lightRim.position.set(-6, 4, -7);
scene.add(lightRim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 7, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.minDistance = 6;
controls.maxDistance = 18;

// ─────────── differential growth (human-figure silhouette seed)
const MAX_VERTS = 1800;
const ATTRACT   = 0.065;
const REPEL_R   = 0.48;
const REPEL_STR = 0.12;
const NOISE     = 0.003;
const PRESSURE  = 0.0025;
const MAX_D     = 0.38;

const verts = [];
// torso spine
for (let i = 0; i < 20; i++){
  const y = i * 0.55;
  const r = 0.9 - i * 0.025;
  verts.push({ x: r, y, z: 0, age: 0 });
}
// left arm
for (let i = 0; i < 12; i++){
  const t = i / 11;
  const y = 9 - t * 2.5;
  const x = 1.2 + t * 2.5;
  verts.push({ x, y, z: 0, age: 0 });
}
// right arm
for (let i = 0; i < 12; i++){
  const t = i / 11;
  const y = 9 - t * 2.5;
  const x = -(1.2 + t * 2.5);
  verts.push({ x, y, z: 0, age: 0 });
}
// head circle
for (let i = 0; i < 10; i++){
  const th = i / 10 * Math.PI * 2;
  const r = 1.1;
  verts.push({ x: Math.cos(th)*r, y: 11.5 + Math.sin(th)*r*0.9, z: 0, age: 0 });
}
// left leg
for (let i = 0; i < 10; i++){
  const t = i / 9;
  const y = -t * 6;
  const x = 0.5 + t * 0.3;
  verts.push({ x, y, z: 0, age: 0 });
}
// right leg
for (let i = 0; i < 10; i++){
  const t = i / 9;
  const y = -t * 6;
  const x = -(0.5 + t * 0.3);
  verts.push({ x, y, z: 0, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.3;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.4;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 500; s++) step();

// ─────────── shy zones (camera-approach fade regions)
const shyZones = [
  { x: 0, y: 11, z: 0, r: 2.2 },     // head
  { x: 1.8, y: 8, z: 0, r: 1.5 },    // left shoulder
  { x: -1.8, y: 8, z: 0, r: 1.5 },   // right shoulder
  { x: 0, y: 3, z: 0, r: 1.8 },      // torso center
];

let tubeMesh = null;
const tubeMat = new THREE.MeshStandardMaterial({
  color:    0x9a524a,
  emissive: 0x1a0a08,
  roughness: 0.6,
  metalness: 0.08,
  transparent: true,
  opacity: 1.0,
  depthWrite: true,
});

// layered fog planes for variable density
const fogPlanes = [];
for (let i = 0; i < 5; i++){
  const g = new THREE.PlaneGeometry(40, 40);
  const m = new THREE.MeshBasicMaterial({
    color: 0x0d0a0b,
    transparent: true,
    opacity: 0.12 + i * 0.03,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const p = new THREE.Mesh(g, m);
  p.rotation.x = Math.PI / 2;
  p.position.y = 3 + i * 2.5;
  scene.add(p);
  fogPlanes.push(p);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 1; s++) step();

  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){ if (v.y < yMin) yMin = v.y; if (v.y > yMax) yMax = v.y; }
    const yRange = Math.max(yMax - yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const RADIAL = 7;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const opacities = new Float32Array(N_SAMPLES * RADIAL);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    // compute camera distance for shy-zone fading
    const camPos = camera.position.clone();

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
      let r = 0.35 * (1 - heightFrac * 0.65);

      // compute shy-zone fade
      let shyFade = 1.0;
      for (const zone of shyZones){
        const dx = p.x - zone.x, dy = p.y - zone.y, dz = p.z - zone.z;
        const distToZone = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (distToZone < zone.r){
          const camDist = camPos.distanceTo(p);
          if (camDist < 10){
            const approach = 1 - Math.max(0, Math.min(1, camDist / 10));
            const zoneFactor = 1 - (distToZone / zone.r);
            shyFade *= 1 - (approach * zoneFactor * 0.85);
          }
        }
      }

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i * RADIAL + j) * 3]     = v.x;
        positions[(i * RADIAL + j) * 3 + 1] = v.y;
        positions[(i * RADIAL + j) * 3 + 2] = v.z;
        opacities[i * RADIAL + j] = shyFade;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('opacity', new THREE.BufferAttribute(opacities, 1));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    
    // custom shader to respect per-vertex opacity for shy zones
    const shyMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute float opacity;
        varying float vOpacity;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main(){
          vOpacity = opacity;
          vNormal = normalize(normalMatrix * normal);
          vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPos.xyz;
          gl_Position = projectionMatrix * mvPos;
        }
      `,
      fragmentShader: `
        uniform vec3 diffuse;
        uniform vec3 emissive;
        uniform float roughness;
        varying float vOpacity;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main(){
          vec3 light = normalize(vec3(1.0, 2.0, 1.5));
          float diff = max(dot(vNormal, light), 0.0) * 0.7 + 0.3;
          vec3 col = diffuse * diff + emissive;
          gl_FragColor = vec4(col, vOpacity);
        }
      `,
      uniforms: {
        diffuse: { value: new THREE.Color(0x9a524a) },
        emissive: { value: new THREE.Color(0x1a0a08) },
        roughness: { value: 0.6 }
      },
      transparent: true,
      depthWrite: true,
      side: THREE.DoubleSide,
    });

    tubeMesh = new THREE.Mesh(g, shyMat);
    scene.add(tubeMesh);
  }

  // animate fog plane drift
  for (let i = 0; i < fogPlanes.length; i++){
    fogPlanes[i].position.x = Math.sin(t * 0.2 + i * 0.7) * 1.5;
    fogPlanes[i].position.z = Math.cos(t * 0.15 + i * 1.1) * 1.8;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
