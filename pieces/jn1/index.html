<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jn1 · collage · Wangechi Mutu mythic figure from ochre tower</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">jn1</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ARTIST branch: Wangechi Mutu × collage
// The ochre wind-tower becomes a mythic standing figure — assembled
// from layered particle "materials" like Mutu's collage hybrids.
// Different height bands carry different textures: dense ink-dark
// skin at core, amber/gold leaf fragments drifting at edges,
// botanical tendrils bleeding outward like ink on wet paper.
// The differential growth silhouette is reshaped to suggest a body:
// narrow at waist, wider at shoulders and hips, crowned with
// an upward-reaching headdress of scattered gold particles.
// Technique: Mutu's ink-and-collage method — layered transparencies,
// fragments that don't quite align, the body as landscape.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 6, 0);

// ─────────────────── figure growth — differential growth shaped as body
const MAX_VERTS = 3200;
const ATTRACT = 0.06, REPEL_R = 0.42, REPEL_STR = 0.12, NOISE = 0.003;
const PRESSURE = 0.0028, RISE = 0.005, MAX_D = 0.32;
let paused = false;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2, r = 1.1 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i=0; i<verts.length; i++){
    const v=verts[i], k=key(v.x,v.y,v.z);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++)
    for(let dy=-1;dy<=1;dy++)
      for(let dz=-1;dz<=1;dz++){
        const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if(arr) for(const idx of arr) out.push(idx);
      }
  return out;
}

// Body profile — radius multiplier at normalized height
function bodyProfile(h){
  // h: 0=feet, 1=top
  if(h<0.08) return 1.0;        // feet/base
  if(h<0.25) return 0.9+0.3*Math.sin((h-0.08)/0.17*Math.PI); // hips widen
  if(h<0.40) return 0.65;       // waist narrows
  if(h<0.60) return 0.65+0.5*Math.sin((h-0.40)/0.20*Math.PI); // shoulders widen
  if(h<0.75) return 0.55;       // neck narrows
  if(h<0.88) return 0.7;        // head
  return 0.5+0.6*(h-0.88)/0.12; // headdress fans out
}

function stepTower(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i], cands=neighbors(v);
    for(const j of cands){
      if(j===i) continue;
      const u=verts[j], ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2), f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  // Find centroid and yMax for body shaping
  let cx2=0,cy2=0,cz2=0, yMax=0;
  for(let i=0;i<n;i++){ cx2+=verts[i].x; cy2+=verts[i].y; cz2+=verts[i].z; if(verts[i].y>yMax) yMax=verts[i].y; }
  cx2/=n; cy2/=n; cz2/=n;
  const figH = Math.max(yMax, 1);
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oz=verts[i].z-cz2;
    const dH=Math.hypot(ox,oz)+1e-6;
    const hNorm=Math.min(verts[i].y/figH, 1);
    const targetR = bodyProfile(hNorm) * 1.4;
    // gentle radial force toward body profile
    const radialF = (targetR - dH) * 0.004;
    dx[i]+=(ox/dH)*radialF;
    dz[i]+=(oz/dH)*radialF;
    // upward pressure
    const oy=verts[i].y-cy2;
    const dV=Math.abs(oy)+1e-6;
    dx[i]+=(ox/dH)*PRESSURE*0.6;
    dz[i]+=(oz/dH)*PRESSURE*0.6;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0012;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5, age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}

for(let s=0;s<900;s++) stepTower();
addEventListener('click',()=>{ paused=!paused; });

// ─────────────────── LAYER 1: Core body — dense ink-dark skin particles
const N_BODY=28000;
const bPos=new Float32Array(N_BODY*3);
const bSeed=new Float32Array(N_BODY);
const bHgt=new Float32Array(N_BODY);
for(let i=0;i<N_BODY;i++) bSeed[i]=Math.random();

const geomBody=new THREE.BufferGeometry();
geomBody.setAttribute('position', new THREE.BufferAttribute(bPos,3));
geomBody.setAttribute('seed', new THREE.BufferAttribute(bSeed,1));
geomBody.setAttribute('hgt', new THREE.BufferAttribute(bHgt,1));

const unifBody={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uYMax:{value:1}};
const matBody=new THREE.ShaderMaterial({
  uniforms:unifBody, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uYMax;
    attribute float seed, hgt;
    varying vec3 vCol; varying float vA;
    void main(){
      vec3 p=position;
      float h=clamp(hgt/max(uYMax,0.5),0.,1.);
      // subtle breath — the figure lives
      float breath=sin(uTime*0.4+h*2.)*0.015*h;
      p.x+=breath; p.z+=breath*0.7;
      // Mutu palette: deep umber skin, sienna warmth, dark ink
      vec3 inkBlack=vec3(0.12,0.08,0.10);
      vec3 umber=vec3(0.38,0.22,0.14);
      vec3 sienna=vec3(0.52,0.30,0.18);
      vec3 col=mix(inkBlack,umber,smoothstep(0.,0.3,h));
      col=mix(col,sienna,smoothstep(0.3,0.7,h)*seed);
      col=mix(col,inkBlack,smoothstep(0.85,1.,h)*0.5);
      col*=0.9+0.1*seed;
      vCol=col; vA=0.65;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=1.4*uPixel*(42./-mv.z);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*16.)*vA;
      vec3 bg=vec3(0.031,0.027,0.039);
      float fd=gl_FragCoord.z/gl_FragCoord.w;
      float ff=exp(-0.0006*fd*fd);
      vec3 col=mix(bg,vCol,clamp(ff,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsBody=new THREE.Points(geomBody,matBody);
scene.add(pointsBody);

// ─────────────────── LAYER 2: Collage fragments — gold leaf / botanical patches
const N_FRAG=12000;
const fPos=new Float32Array(N_FRAG*3);
const fSeed=new Float32Array(N_FRAG);
const fHgt=new Float32Array(N_FRAG);
const fPatch=new Float32Array(N_FRAG); // which collage patch
for(let i=0;i<N_FRAG;i++){
  fSeed[i]=Math.random();
  fPatch[i]=Math.floor(Math.random()*5); // 5 collage zones
}

const geomFrag=new THREE.BufferGeometry();
geomFrag.setAttribute('position', new THREE.BufferAttribute(fPos,3));
geomFrag.setAttribute('seed', new THREE.BufferAttribute(fSeed,1));
geomFrag.setAttribute('hgt', new THREE.BufferAttribute(fHgt,1));
geomFrag.setAttribute('patch', new THREE.BufferAttribute(fPatch,1));

const unifFrag={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uYMax:{value:1}};
const matFrag=new THREE.ShaderMaterial({
  uniforms:unifFrag, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uYMax;
    attribute float seed, hgt, patch;
    varying vec3 vCol; varying float vA;
    void main(){
      vec3 p=position;
      float h=clamp(hgt/max(uYMax,0.5),0.,1.);
      // collage offset — fragments shift slightly, never perfectly aligned
      float shiftPhase=uTime*0.12+patch*1.7;
      p.x+=sin(shiftPhase)*0.06*(0.5+seed);
      p.z+=cos(shiftPhase*0.7)*0.04;
      // fragment flutter — pages caught in slow air
      float flutter=sin(uTime*1.2+seed*11.+patch*3.)*0.02;
      p.y+=flutter;
      // 5 material palettes — Mutu's collage sources
      vec3 goldLeaf=vec3(0.82,0.65,0.22);
      vec3 botanical=vec3(0.25,0.38,0.15);
      vec3 magCutout=vec3(0.60,0.28,0.22); // magazine red-brown
      vec3 inkWash=vec3(0.18,0.12,0.20);   // purple-black ink
      vec3 pearl=vec3(0.55,0.50,0.45);     // pearlescent fragment
      vec3 col;
      float p2=mod(patch,5.);
      if(p2<1.) col=goldLeaf;
      else if(p2<2.) col=botanical;
      else if(p2<3.) col=magCutout;
      else if(p2<4.) col=inkWash;
      else col=pearl;
      // fragments only appear in bands — collage layering
      float bandCenter=patch*0.18+0.1;
      float bandDist=abs(h-bandCenter);
      float bandMask=smoothstep(0.18,0.08,bandDist);
      vA=bandMask*0.55*(0.6+0.4*seed);
      col*=0.85+0.15*seed;
      vCol=col;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=1.8*uPixel*(38./-mv.z)*(0.5+0.5*seed);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      // squarish shape — cut paper edge feel
      float edge=max(abs(d.x),abs(d.y));
      float sq=smoothstep(0.48,0.35,edge);
      float a=sq*vA;
      if(a<0.01) discard;
      vec3 bg=vec3(0.031,0.027,0.039);
      float fd=gl_FragCoord.z/gl_FragCoord.w;
      float ff=exp(-0.0006*fd*fd);
      vec3 col=mix(bg,vCol,clamp(ff,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsFrag=new THREE.Points(geomFrag,matFrag);
scene.add(pointsFrag);

// ─────────────────── LAYER 3: Ink bleed — particles that drift outward from silhouette
const N_INK=10000;
const iPos=new Float32Array(N_INK*3);
const iSeed=new Float32Array(N_INK);
const iDrift=new Float32Array(N_INK); // how far from body
for(let i=0;i<N_INK;i++){
  iSeed[i]=Math.random();
  iDrift[i]=0;
}

const geomInk=new THREE.BufferGeometry();
geomInk.setAttribute('position', new THREE.BufferAttribute(iPos,3));
geomInk.setAttribute('seed', new THREE.BufferAttribute(iSeed,1));
geomInk.setAttribute('drift', new THREE.BufferAttribute(iDrift,1));

const unifInk={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uYMax:{value:1}};
const matInk=new THREE.ShaderMaterial({
  uniforms:unifInk, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uYMax;
    attribute float seed, drift;
    varying vec3 vCol; varying float vA;
    void main(){
      vec3 p=position;
      // ink bleeds radially outward
      float angle=atan(p.z,p.x);
      float bleedR=drift;
      p.x+=cos(angle)*bleedR;
      p.z+=sin(angle)*bleedR;
      // ink runs downward slightly
      p.y-=drift*0.3;
      // ink wash color — dark with slight warmth
      vec3 inkDark=vec3(0.15,0.08,0.12);
      vec3 inkWarm=vec3(0.28,0.15,0.10);
      vec3 col=mix(inkDark,inkWarm,seed*0.4);
      vA=(1.-smoothstep(0.,1.8,drift))*0.35;
      vCol=col;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=2.0*uPixel*(35./-mv.z)*(0.3+drift*0.5);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol; varying float vA;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*8.)*vA;
      if(a<0.005) discard;
      vec3 bg=vec3(0.031,0.027,0.039);
      float fd=gl_FragCoord.z/gl_FragCoord.w;
      float ff=exp(-0.0006*fd*fd);
      vec3 col=mix(bg,vCol,clamp(ff,0.,1.));
      gl_FragColor=vec4(col*a,a);
    }
  `
});
const pointsInk=new THREE.Points(geomInk,matInk);
scene.add(pointsInk);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const start=performance.now();
let lastT=start;

function loop(){
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  const elapsed=(now-start)/1000;
  unifBody.uTime.value=elapsed;
  unifFrag.uTime.value=elapsed;
  unifInk.uTime.value=elapsed;

  for(let s=0;s<3;s++) stepTower();

  const n=verts.length;
  let yMax=0, yMean=0, xMean=0, zMean=0;
  if(n>1){
    const lengths=[]; let total=0;
    for(let i=0;i<n;i++){
      const a=verts[i], b=verts[(i+1)%n];
      const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
      const L=Math.sqrt(ex*ex+ey*ey+ez*ez);
      lengths.push(L); total+=L;
      if(a.y>yMax) yMax=a.y;
      yMean+=a.y; xMean+=a.x; zMean+=a.z;
    }
    yMean/=n; xMean/=n; zMean/=n;
    if(total>0){
      // Distribute body particles along growth curve
      let written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_BODY-written:Math.max(1,Math.floor(N_BODY*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_BODY;k++){
          const u=Math.random();
          bPos[written*3]=a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.03;
          bPos[written*3+1]=a.y+(b.y-a.y)*u+(Math.random()-0.5)*0.03;
          bPos[written*3+2]=a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.03;
          bHgt[written]=a.y+(b.y-a.y)*u;
          written++;
        }
      }
      geomBody.attributes.position.needsUpdate=true;
      geomBody.attributes.hgt.needsUpdate=true;

      // Collage fragments — offset from body with slight displacement
      written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_FRAG-written:Math.max(1,Math.floor(N_FRAG*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_FRAG;k++){
          const u=Math.random();
          const px=a.x+(b.x-a.x)*u, py=a.y+(b.y-a.y)*u, pz=a.z+(b.z-a.z)*u;
          // offset outward — collage doesn't perfectly align
          const angle=Math.atan2(pz-zMean,px-xMean);
          const off=0.08+fSeed[written]*0.15;
          fPos[written*3]=px+Math.cos(angle)*off+(Math.random()-0.5)*0.06;
          fPos[written*3+1]=py+(Math.random()-0.5)*0.06;
          fPos[written*3+2]=pz+Math.sin(angle)*off+(Math.random()-0.5)*0.06;
          fHgt[written]=py;
          written++;
        }
      }
      geomFrag.attributes.position.needsUpdate=true;
      geomFrag.attributes.hgt.needsUpdate=true;

      // Ink bleed particles — spawn on body, drift outward over time
      written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_INK-written:Math.max(1,Math.floor(N_INK*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_INK;k++){
          const u=Math.random();
          iPos[written*3]=a.x+(b.x-a.x)*u;
          iPos[written*3+1]=a.y+(b.y-a.y)*u;
          iPos[written*3+2]=a.z+(b.z-a.z)*u;
          // drift increases over time — ink slowly bleeds
          iDrift[written]+= dt * 0.08 * (0.5+iSeed[written]);
          if(iDrift[written]>2.0){
            iDrift[written]=0; // reset — new ink drop
          }
          written++;
        }
      }
      geomInk.attributes.position.needsUpdate=true;
      geomInk.attributes.drift.needsUpdate=true;
    }
  }
  unifBody.uYMax.value=Math.max(yMax,1);
  unifFrag.uYMax.value=Math.max(yMax,1);
  unifInk.uYMax.value=Math.max(yMax,1);

  // camera tracks centroid — framing the full figure
  const targetY=Math.max(yMean,4);
  controls.target.x+=(xMean-controls.target.x)*0.02;
  controls.target.y+=(targetY-controls.target.y)*0.03;
  controls.target.z+=(zMean-controls.target.z)*0.02;
  const desiredCamY=targetY+3;
  camera.position.y+=(desiredCamY-camera.position.y)*0.02;

  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
