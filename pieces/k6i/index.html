<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: gentle -->
<title>k6i · lissajous knot · ribbon topology</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">k6i</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Lissajous knot ribbon — inspired by Chiharu Shiota's taut thread
// installations and the mathematical knot theory of J.P. Bogle & Hearst.
// A (2,3,5) Lissajous knot whose phase offsets breathe slowly,
// causing the topology to inhale and exhale. The ribbon is swept
// as a flat arabesque strip along the knot curve — gold leaf catching
// a single warm key from above, fading to cold teal below.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.018);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 4, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// Lighting — Olafur Eliasson-inspired vertical color-temperature gradient
const keyLight = new THREE.DirectionalLight(0xffebc4, 1.3);
keyLight.position.set(5, 14, 6);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x1a3040, 0.45);
fillLight.position.set(-8, -2, -6);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xc07830, 0.6, 30);
rimLight.position.set(-4, 10, -8);
scene.add(rimLight);

scene.add(new THREE.AmbientLight(0x0c0a14, 0.35));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// ─────────── Lissajous knot parametric definition
// x(t) = cos(nx·t + φx), y(t) = cos(ny·t + φy), z(t) = cos(nz·t + φz)
// (2, 3, 5) with breathing phases → a true knot that morphs

const NX = 2, NY = 3, NZ = 5;
const SCALE = 5.5;
const N_SAMPLES = 800;

function lissajousPoint(t, phaseX, phaseY, phaseZ) {
  return new THREE.Vector3(
    Math.cos(NX * t + phaseX) * SCALE,
    Math.cos(NY * t + phaseY) * SCALE * 0.85,
    Math.cos(NZ * t + phaseZ) * SCALE * 0.7
  );
}

function lissajousTangent(t, phaseX, phaseY, phaseZ) {
  const v = new THREE.Vector3(
    -NX * Math.sin(NX * t + phaseX) * SCALE,
    -NY * Math.sin(NY * t + phaseY) * SCALE * 0.85,
    -NZ * Math.sin(NZ * t + phaseZ) * SCALE * 0.7
  );
  return v.normalize();
}

// ─────────── ribbon material — two-tone gold with depth
const ribbonMatFront = new THREE.MeshStandardMaterial({
  color: 0xc9a45a,
  emissive: 0x1a0e02,
  roughness: 0.28,
  metalness: 0.75,
  side: THREE.DoubleSide,
});

// secondary ribbon — thinner, darker, offset — the shadow-ribbon
const ribbonMatShadow = new THREE.MeshStandardMaterial({
  color: 0x4a3520,
  emissive: 0x0a0604,
  roughness: 0.6,
  metalness: 0.3,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.45,
});

let ribbonMesh = null;
let shadowMesh = null;

// ─────────── dust motes — tiny particles drifting in the volume
const MOTE_COUNT = 300;
const moteGeo = new THREE.BufferGeometry();
const motePos = new Float32Array(MOTE_COUNT * 3);
const moteSizes = new Float32Array(MOTE_COUNT);
const moteVel = [];
for (let i = 0; i < MOTE_COUNT; i++) {
  motePos[i * 3]     = (Math.random() - 0.5) * 20;
  motePos[i * 3 + 1] = (Math.random() - 0.5) * 16;
  motePos[i * 3 + 2] = (Math.random() - 0.5) * 16;
  moteSizes[i] = 1.0 + Math.random() * 2.0;
  moteVel.push({
    x: (Math.random() - 0.5) * 0.003,
    y: (Math.random() - 0.5) * 0.002 + 0.001,
    z: (Math.random() - 0.5) * 0.003
  });
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
moteGeo.setAttribute('size', new THREE.BufferAttribute(moteSizes, 1));

const moteMat = new THREE.PointsMaterial({
  color: 0xd8c895,
  size: 0.04,
  transparent: true,
  opacity: 0.2,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const motes = new THREE.Points(moteGeo, moteMat);
scene.add(motes);

// ─────────── film grain overlay (Lia Halloran — photochemical imperfection)
const grainMat = new THREE.ShaderMaterial({
  transparent: true,
  depthTest: false,
  depthWrite: false,
  uniforms: { uTime: { value: 0 }, uOpacity: { value: 0.06 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform float uOpacity;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    void main(){
      float g = hash(vUv * 800.0 + uTime * 11.3);
      gl_FragColor = vec4(vec3(g), uOpacity * (0.5 + 0.5 * g));
    }
  `
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ─────────── build ribbon geometry from knot curve
function buildRibbon(phaseX, phaseY, phaseZ, time) {
  const positions = new Float32Array(N_SAMPLES * 2 * 3);
  const colors = new Float32Array(N_SAMPLES * 2 * 3);
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  // Palette: 4 hand-chosen colors along the knot
  // warm gold → deep bronze → tarnished copper → pale champagne
  const palette = [
    new THREE.Color(0xd4a84b), // warm gold
    new THREE.Color(0x8b5e2a), // deep bronze
    new THREE.Color(0x6b4423), // tarnished copper
    new THREE.Color(0xe8d5a0), // pale champagne
  ];

  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < N_SAMPLES; i++) {
    const t = (i / N_SAMPLES) * Math.PI * 2;
    const p = lissajousPoint(t, phaseX, phaseY, phaseZ);
    cx += p.x; cy += p.y; cz += p.z;
  }
  cx /= N_SAMPLES; cy /= N_SAMPLES; cz /= N_SAMPLES;

  for (let i = 0; i < N_SAMPLES; i++) {
    const tt = i / N_SAMPLES;
    const t = tt * Math.PI * 2;
    const p = lissajousPoint(t, phaseX, phaseY, phaseZ);
    const tang = lissajousTangent(t, phaseX, phaseY, phaseZ);

    let lateral = new THREE.Vector3().crossVectors(tang, up);
    if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
    lateral.normalize();

    // arabesque width oscillation — 5 lobes with slow time drift
    const widthBase = 0.18;
    const widthOsc = 0.10 * Math.sin(tt * 37.0 + time * 0.15)
                   + 0.06 * Math.sin(tt * 13.0 - time * 0.22);
    const width = widthBase + widthOsc;

    const left  = p.clone().addScaledVector(lateral, -width);
    const right = p.clone().addScaledVector(lateral,  width);

    positions[i * 6]     = left.x;
    positions[i * 6 + 1] = left.y;
    positions[i * 6 + 2] = left.z;
    positions[i * 6 + 3] = right.x;
    positions[i * 6 + 4] = right.y;
    positions[i * 6 + 5] = right.z;

    // color from palette — segments of the knot get different hues
    const palIdx = tt * (palette.length);
    const pA = Math.floor(palIdx) % palette.length;
    const pB = (pA + 1) % palette.length;
    const frac = palIdx - Math.floor(palIdx);
    const col = palette[pA].clone().lerp(palette[pB], frac);

    colors[i * 6]     = col.r; colors[i * 6 + 1] = col.g; colors[i * 6 + 2] = col.b;
    colors[i * 6 + 3] = col.r; colors[i * 6 + 4] = col.g; colors[i * 6 + 5] = col.b;
  }

  for (let i = 0; i < N_SAMPLES; i++) {
    const ni = (i + 1) % N_SAMPLES;
    const a = i * 2, b = i * 2 + 1;
    const c = ni * 2, d = ni * 2 + 1;
    indices.push(a, b, c, b, d, c);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  return { geo, centroid: new THREE.Vector3(cx, cy, cz) };
}

// ─────────── shadow ribbon — offset inward, narrower
function buildShadowRibbon(phaseX, phaseY, phaseZ, time) {
  const positions = new Float32Array(N_SAMPLES * 2 * 3);
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < N_SAMPLES; i++) {
    const tt = i / N_SAMPLES;
    const t = tt * Math.PI * 2;
    const p = lissajousPoint(t, phaseX, phaseY, phaseZ);
    const tang = lissajousTangent(t, phaseX, phaseY, phaseZ);

    let lateral = new THREE.Vector3().crossVectors(tang, up);
    if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
    lateral.normalize();

    // bi-normal for offset
    const binorm = new THREE.Vector3().crossVectors(tang, lateral).normalize();

    const width = 0.08 + 0.04 * Math.sin(tt * 23.0 + time * 0.3);
    // offset slightly along binormal — the shadow sits beneath the main ribbon
    const offset = binorm.clone().multiplyScalar(-0.12);
    const center = p.clone().add(offset);
    const left  = center.clone().addScaledVector(lateral, -width);
    const right = center.clone().addScaledVector(lateral,  width);

    positions[i * 6]     = left.x;
    positions[i * 6 + 1] = left.y;
    positions[i * 6 + 2] = left.z;
    positions[i * 6 + 3] = right.x;
    positions[i * 6 + 4] = right.y;
    positions[i * 6 + 5] = right.z;
  }

  for (let i = 0; i < N_SAMPLES; i++) {
    const ni = (i + 1) % N_SAMPLES;
    const a = i * 2, b = i * 2 + 1;
    const c = ni * 2, d = ni * 2 + 1;
    indices.push(a, b, c, b, d, c);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// ─────────── resize handler
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── animation loop
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;

  // breathing phases — slow sinusoidal drift
  const phaseX = 0.0;
  const phaseY = Math.PI * 0.5  + 0.15 * Math.sin(t * 0.07);
  const phaseZ = Math.PI * 0.25 + 0.12 * Math.sin(t * 0.05 + 1.2);

  // rebuild ribbon
  const { geo, centroid } = buildRibbon(phaseX, phaseY, phaseZ, t);

  if (ribbonMesh) { scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
  ribbonMesh = new THREE.Mesh(geo, ribbonMatFront);
  ribbonMesh.material.vertexColors = true;
  scene.add(ribbonMesh);

  // shadow ribbon
  const shadowGeo = buildShadowRibbon(phaseX, phaseY, phaseZ, t);
  if (shadowMesh) { scene.remove(shadowMesh); shadowMesh.geometry.dispose(); }
  shadowMesh = new THREE.Mesh(shadowGeo, ribbonMatShadow);
  scene.add(shadowMesh);

  // camera tracks centroid
  controls.target.lerp(centroid, 0.03);

  // animate dust motes
  const mp = moteGeo.attributes.position.array;
  for (let i = 0; i < MOTE_COUNT; i++) {
    mp[i * 3]     += moteVel[i].x;
    mp[i * 3 + 1] += moteVel[i].y;
    mp[i * 3 + 2] += moteVel[i].z;
    // wrap
    if (mp[i * 3 + 1] > 10) mp[i * 3 + 1] = -10;
    for (let ax = 0; ax < 3; ax += 2) {
      if (Math.abs(mp[i * 3 + ax]) > 12) mp[i * 3 + ax] *= -0.9;
    }
  }
  moteGeo.attributes.position.needsUpdate = true;

  // grain
  grainMat.uniforms.uTime.value = t;

  controls.update();
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCamera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
