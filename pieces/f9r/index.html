<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f9r · folded leaves (bouquet)</title>
<!-- MOTION: unfurling, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">f9r</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── folded-leaf bouquet ── */
/* 7 distinct leaf elements arranged in a loose clutch; each is a curved sheet with calligraphic mid-vein */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

/* build one curved leaf-sheet */
function buildLeaf(w, h, curvature, twirlAngle){
  const segs = 28;
  const rows = 32;
  const positions = [];
  const uvs = [];
  const indices = [];
  
  for (let r = 0; r <= rows; r++){
    const v = r / rows;
    const y = (v - 0.5) * h;
    /* twist along length */
    const twirl = v * twirlAngle;
    const ct = Math.cos(twirl), st = Math.sin(twirl);
    /* curl the sheet in x-z */
    const curl = v * curvature;
    const cc = Math.cos(curl), sc = Math.sin(curl);
    
    for (let s = 0; s <= segs; s++){
      const u = s / segs;
      const x = (u - 0.5) * w;
      /* apply twist */
      let px = x * ct;
      let pz = x * st;
      /* apply curl */
      let py = y * cc - pz * sc;
      pz = y * sc + pz * cc;
      
      positions.push(px, py, pz);
      uvs.push(u, v);
    }
  }
  
  for (let r = 0; r < rows; r++){
    for (let s = 0; s < segs; s++){
      const a = r * (segs + 1) + s;
      const b = a + segs + 1;
      indices.push(a, b, a+1);
      indices.push(b, b+1, a+1);
    }
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

/* particle system per leaf */
const PARTICLES_PER_LEAF = 12000;

function sampleLeafSurface(geom, count){
  const pos = geom.attributes.position.array;
  const idx = geom.index.array;
  const triCount = idx.length / 3;
  const samples = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  
  for (let i = 0; i < count; i++){
    const ti = Math.floor(Math.random() * triCount);
    const i0 = idx[ti*3], i1 = idx[ti*3+1], i2 = idx[ti*3+2];
    const p0 = new THREE.Vector3(pos[i0*3], pos[i0*3+1], pos[i0*3+2]);
    const p1 = new THREE.Vector3(pos[i1*3], pos[i1*3+1], pos[i1*3+2]);
    const p2 = new THREE.Vector3(pos[i2*3], pos[i2*3+1], pos[i2*3+2]);
    
    let u = Math.random(), v = Math.random();
    if (u + v > 1){ u = 1-u; v = 1-v; }
    const w = 1 - u - v;
    
    const pt = new THREE.Vector3();
    pt.addScaledVector(p0, w);
    pt.addScaledVector(p1, u);
    pt.addScaledVector(p2, v);
    
    samples[i*3] = pt.x;
    samples[i*3+1] = pt.y;
    samples[i*3+2] = pt.z;
    seeds[i] = Math.random();
  }
  return { samples, seeds };
}

/* leaf descriptors */
const leaves = [
  { w:2.8, h:5.2, curvature:0.9, twirlAngle:1.4, pos:[0,0,0], rot:[0.1,0,0.05], scale:1.0 },
  { w:2.4, h:4.6, curvature:1.2, twirlAngle:-1.1, pos:[-1.8,0.5,0.3], rot:[0,-0.2,0.6], scale:0.92 },
  { w:3.0, h:5.8, curvature:0.7, twirlAngle:1.6, pos:[1.5,-0.8,-0.4], rot:[0.15,0.3,-0.25], scale:1.1 },
  { w:2.2, h:4.2, curvature:1.4, twirlAngle:-0.9, pos:[0.4,2.0,0.2], rot:[-0.4,0.1,0.3], scale:0.85 },
  { w:2.6, h:5.0, curvature:1.0, twirlAngle:1.2, pos:[-1.2,-1.5,0.6], rot:[0.2,-0.25,-0.4], scale:0.95 },
  { w:2.9, h:5.4, curvature:0.85, twirlAngle:-1.3, pos:[2.0,0.8,-0.8], rot:[-0.15,0.4,0.2], scale:1.05 },
  { w:2.5, h:4.8, curvature:1.15, twirlAngle:1.0, pos:[0.2,-2.2,-0.3], rot:[0.35,-0.15,-0.3], scale:0.88 },
];

const leafGroups = [];
const boids = [];

for (let li = 0; li < leaves.length; li++){
  const desc = leaves[li];
  const geom = buildLeaf(desc.w, desc.h, desc.curvature, desc.twirlAngle);
  const { samples, seeds } = sampleLeafSurface(geom, PARTICLES_PER_LEAF);
  
  const group = new THREE.Group();
  group.position.set(...desc.pos);
  group.rotation.set(...desc.rot);
  group.scale.setScalar(desc.scale);
  scene.add(group);
  
  const particleGeom = new THREE.BufferGeometry();
  particleGeom.setAttribute('position', new THREE.BufferAttribute(samples, 3));
  particleGeom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
  particleGeom.setAttribute('restPos', new THREE.BufferAttribute(samples.slice(), 3));
  
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value:0 },
      uPixel: { value: renderer.getPixelRatio() },
      uDisperse: { value:0 },
      uLeafIndex: { value: li },
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uPixel;
      uniform float uDisperse;
      uniform float uLeafIndex;
      attribute float seed;
      attribute vec3 restPos;
      varying vec3 vCol;
      varying float vAlpha;
      
      void main(){
        vec3 p = position;
        vec3 rest = restPos;
        
        /* ambient twirl breathing */
        float phase = uTime * 0.4 + seed * 6.28;
        float breathe = 0.02 * sin(phase * 0.6);
        p += vec3(breathe * sin(phase), breathe * cos(phase * 0.8), 0.0);
        
        vec4 mvRest = modelViewMatrix * vec4(rest, 1.0);
        vec4 mvCurr = modelViewMatrix * vec4(p, 1.0);
        vec3 worldP = (modelMatrix * vec4(p, 1.0)).xyz;
        
        float dist = -mvCurr.z;
        float energy = 0.5 + 0.5 * sin(phase);
        
        /* palette: warm amber on near-black */
        vec3 ochre = vec3(0.82, 0.62, 0.35);
        vec3 sienna = vec3(0.56, 0.38, 0.25);
        vec3 copper = vec3(0.76, 0.48, 0.30);
        
        float stripeMix = fract(uLeafIndex * 0.618 + seed * 3.0);
        vec3 base = mix(sienna, ochre, stripeMix);
        base = mix(base, copper, seed * 0.3);
        
        vCol = base;
        vAlpha = 0.6 + 0.4 * energy;
        
        gl_PointSize = (1.2 + 0.5 * energy) * uPixel * (38.0/dist);
        gl_Position = projectionMatrix * mvCurr;
      }
    `,
    fragmentShader: `
      varying vec3 vCol;
      varying float vAlpha;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float r = dot(d,d);
        if (r > 0.25) discard;
        float a = exp(-r * 14.0) * vAlpha;
        gl_FragColor = vec4(vCol * a, a);
      }
    `
  });
  
  const points = new THREE.Points(particleGeom, mat);
  group.add(points);
  
  leafGroups.push({ group, mat, geom: particleGeom, restPos: samples, worldRestPos: new Float32Array(samples.length) });
  
  /* initialize boids for this leaf */
  for (let i = 0; i < PARTICLES_PER_LEAF; i++){
    boids.push({
      leafIndex: li,
      localIndex: i,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      acc: new THREE.Vector3(),
    });
  }
}

/* boid parameters */
const COHESION_RADIUS = 1.2;
const SEPARATION_RADIUS = 0.35;
const ALIGNMENT_RADIUS = 1.0;
const COHESION_FORCE = 0.08;
const SEPARATION_FORCE = 0.25;
const ALIGNMENT_FORCE = 0.12;
const MAX_SPEED = 0.15;
const MAX_FORCE = 0.02;
const RETURN_FORCE = 0.18;

function limit(vec, max){
  const m = vec.length();
  if (m > max) vec.multiplyScalar(max/m);
}

function steer(desired, current){
  const s = desired.clone().sub(current);
  limit(s, MAX_FORCE);
  return s;
}

let disperseTarget = 0;
let disperseCurrent = 0;

addEventListener('pointermove', () => { disperseTarget = 1; });
addEventListener('pointerleave', () => { disperseTarget = 0; });
setInterval(() => { disperseTarget = 0; }, 3000);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  disperseCurrent += (disperseTarget - disperseCurrent) * 0.05;
  
  /* update world rest positions */
  for (let li = 0; li < leafGroups.length; li++){
    const lg = leafGroups[li];
    for (let i = 0; i < lg.restPos.length / 3; i++){
      const lp = new THREE.Vector3(lg.restPos[i*3], lg.restPos[i*3+1], lg.restPos[i*3+2]);
      lp.applyMatrix4(lg.group.matrixWorld);
      lg.worldRestPos[i*3] = lp.x;
      lg.worldRestPos[i*3+1] = lp.y;
      lg.worldRestPos[i*3+2] = lp.z;
    }
  }
  
  /* update boid positions from current geometry */
  for (let i = 0; i < boids.length; i++){
    const b = boids[i];
    const lg = leafGroups[b.leafIndex];
    const posArr = lg.geom.attributes.position.array;
    b.pos.set(posArr[b.localIndex*3], posArr[b.localIndex*3+1], posArr[b.localIndex*3+2]);
    b.pos.applyMatrix4(lg.group.matrixWorld);
  }
  
  if (disperseCurrent > 0.01){
    /* boid simulation */
    for (let i = 0; i < boids.length; i++){
      const b = boids[i];
      const neighbors = [];
      
      for (let j = 0; j < boids.length; j++){
        if (i === j) continue;
        const d = b.pos.distanceTo(boids[j].pos);
        if (d < COHESION_RADIUS) neighbors.push({ boid: boids[j], dist: d });
      }
      
      b.acc.set(0,0,0);
      
      /* cohesion */
      if (neighbors.length > 0){
        const center = new THREE.Vector3();
        neighbors.forEach(n => center.add(n.boid.pos));
        center.multiplyScalar(1/neighbors.length);
        const desired = center.clone().sub(b.pos);
        desired.normalize().multiplyScalar(MAX_SPEED);
        b.acc.add(steer(desired, b.vel).multiplyScalar(COHESION_FORCE));
      }
      
      /* separation */
      const separate = new THREE.Vector3();
      let sepCount = 0;
      neighbors.forEach(n => {
        if (n.dist < SEPARATION_RADIUS){
          const diff = b.pos.clone().sub(n.boid.pos);
          diff.normalize().divideScalar(n.dist);
          separate.add(diff);
          sepCount++;
        }
      });
      if (sepCount > 0){
        separate.divideScalar(sepCount);
        separate.normalize().multiplyScalar(MAX_SPEED);
        b.acc.add(steer(separate, b.vel).multiplyScalar(SEPARATION_FORCE));
      }
      
      /* alignment */
      const align = new THREE.Vector3();
      let alignCount = 0;
      neighbors.forEach(n => {
        if (n.dist < ALIGNMENT_RADIUS){
          align.add(n.boid.vel);
          alignCount++;
        }
      });
      if (alignCount > 0){
        align.divideScalar(alignCount);
        align.normalize().multiplyScalar(MAX_SPEED);
        b.acc.add(steer(align, b.vel).multiplyScalar(ALIGNMENT_FORCE));
      }
      
      /* return to rest */
      const lg = leafGroups[b.leafIndex];
      const restWorld = new THREE.Vector3(
        lg.worldRestPos[b.localIndex*3],
        lg.worldRestPos[b.localIndex*3+1],
        lg.worldRestPos[b.localIndex*3+2]
      );
      const toRest = restWorld.clone().sub(b.pos);
      toRest.normalize().multiplyScalar(MAX_SPEED);
      b.acc.add(steer(toRest, b.vel).multiplyScalar(RETURN_FORCE * (1 - disperseCurrent)));
      
      b.vel.add(b.acc);
      limit(b.vel, MAX_SPEED);
      b.pos.add(b.vel);
    }
    
    /* write back to geometry */
    for (let i = 0; i < boids.length; i++){
      const b = boids[i];
      const lg = leafGroups[b.leafIndex];
      const invMatrix = lg.group.matrixWorld.clone().invert();
      const localPos = b.pos.clone().applyMatrix4(invMatrix);
      const posArr = lg.geom.attributes.position.array;
      posArr[b.localIndex*3] = localPos.x;
      posArr[b.localIndex*3+1] = localPos.y;
      posArr[b.localIndex*3+2] = localPos.z;
    }
  } else {
    /* restore rest positions */
    for (let li = 0; li < leafGroups.length; li++){
      const lg = leafGroups[li];
      lg.geom.attributes.position.array.set(lg.restPos);
    }
  }
  
  /* mark geometry updated */
  leafGroups.forEach(lg => {
    lg.geom.attributes.position.needsUpdate = true;
    lg.mat.uniforms.uTime.value = elapsed;
    lg.mat.uniforms.uDisperse.value = disperseCurrent;
  });
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
