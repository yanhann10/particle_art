<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o9j · LiDAR forest scan · Quayola</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">o9j</div>
<div class="hint">LiDAR scan reconstruction · measurement noise preserved</div>
<div class="src">Quayola · Remains / Jardins d'Été (2018–2022)</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0b, 0.012);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0b, 1);
document.body.appendChild(renderer.domElement);

// L-system tree generator
class TreeNode {
  constructor(pos, dir, length, radius, depth) {
    this.pos = pos.clone();
    this.dir = dir.clone();
    this.length = length;
    this.radius = radius;
    this.depth = depth;
    this.children = [];
  }
}

function generateTree(seed) {
  const rng = mulberry32(seed);
  const root = new TreeNode(
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0, 1, 0),
    2.5,
    0.35,
    0
  );
  
  const stack = [root];
  const maxDepth = 8;
  const branchAngle = 28 * Math.PI / 180;
  
  while (stack.length > 0) {
    const node = stack.pop();
    if (node.depth >= maxDepth) continue;
    
    const endPos = node.pos.clone().add(
      node.dir.clone().multiplyScalar(node.length)
    );
    
    const numBranches = node.depth < 2 ? 2 : (rng() < 0.4 ? 2 : 1);
    const lengthDecay = 0.68 + rng() * 0.08;
    const radiusDecay = 0.72;
    
    for (let i = 0; i < numBranches; i++) {
      const angle = branchAngle * (0.8 + rng() * 0.4);
      const twist = rng() * Math.PI * 2;
      
      const newDir = node.dir.clone();
      const perpendicular = new THREE.Vector3(
        -node.dir.z * Math.cos(twist) + node.dir.x * Math.sin(twist),
        0,
        node.dir.x * Math.cos(twist) + node.dir.z * Math.sin(twist)
      );
      if (perpendicular.length() < 0.01) {
        perpendicular.set(Math.cos(twist), 0, Math.sin(twist));
      }
      perpendicular.normalize();
      
      const axis = new THREE.Vector3().crossVectors(node.dir, perpendicular);
      axis.normalize();
      newDir.applyAxisAngle(axis, angle * (i === 0 ? 1 : -0.8));
      newDir.normalize();
      
      const child = new TreeNode(
        endPos,
        newDir,
        node.length * lengthDecay,
        node.radius * radiusDecay,
        node.depth + 1
      );
      node.children.push(child);
      stack.push(child);
    }
  }
  
  return root;
}

// Convert tree to cylinder segments
function treeToSegments(node, segments = []) {
  if (node.children.length > 0) {
    const start = node.pos;
    for (const child of node.children) {
      segments.push({
        start: start.clone(),
        end: child.pos.clone(),
        radius: node.radius
      });
      treeToSegments(child, segments);
    }
  }
  return segments;
}

// Sample points on cylinder with LiDAR noise
function sampleCylinder(start, end, radius, count, depth, cameraPos, rng) {
  const points = [];
  const axis = new THREE.Vector3().subVectors(end, start);
  const length = axis.length();
  axis.normalize();
  
  for (let i = 0; i < count; i++) {
    const t = rng();
    const theta = rng() * Math.PI * 2;
    const r = radius * Math.sqrt(rng());
    
    const perpendicular1 = new THREE.Vector3();
    if (Math.abs(axis.y) < 0.9) {
      perpendicular1.crossVectors(axis, new THREE.Vector3(0, 1, 0));
    } else {
      perpendicular1.crossVectors(axis, new THREE.Vector3(1, 0, 0));
    }
    perpendicular1.normalize();
    
    const perpendicular2 = new THREE.Vector3().crossVectors(axis, perpendicular1);
    perpendicular2.normalize();
    
    const pos = start.clone()
      .add(axis.clone().multiplyScalar(t * length))
      .add(perpendicular1.clone().multiplyScalar(r * Math.cos(theta)))
      .add(perpendicular2.clone().multiplyScalar(r * Math.sin(theta)));
    
    // LiDAR noise: increases with distance from camera
    const distFromCamera = pos.distanceTo(cameraPos);
    const noiseFactor = 0.015 + depth * 0.008 + (distFromCamera / 40) * 0.025;
    
    pos.x += (rng() - 0.5) * noiseFactor * 8;
    pos.y += (rng() - 0.5) * noiseFactor * 8;
    pos.z += (rng() - 0.5) * noiseFactor * 8;
    
    // Occlusion simulation: random blocks missing
    if (rng() > 0.15 + depth * 0.08) {
      points.push(pos);
    }
  }
  
  return points;
}

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// Generate multiple trees
const allPoints = [];
const camCenter = new THREE.Vector3(0, 6, 0);

for (let treeIdx = 0; treeIdx < 5; treeIdx++) {
  const rng = mulberry32(12345 + treeIdx * 1000);
  const offsetX = (treeIdx - 2) * 6 + (rng() - 0.5) * 2;
  const offsetZ = (rng() - 0.5) * 8;
  
  const tree = generateTree(54321 + treeIdx * 777);
  const segments = treeToSegments(tree);
  
  segments.forEach(seg => {
    const density = Math.max(1, Math.floor(80 * seg.radius));
    const points = sampleCylinder(
      seg.start,
      seg.end,
      seg.radius,
      density,
      seg.start.y / 15,
      camCenter,
      rng
    );
    
    points.forEach(p => {
      p.x += offsetX;
      p.z += offsetZ;
      allPoints.push(p);
    });
  });
}

console.log(`Generated ${allPoints.length} LiDAR points`);

const positions = new Float32Array(allPoints.length * 3);
const distortions = new Float32Array(allPoints.length);

allPoints.forEach((p, i) => {
  positions[i * 3] = p.x;
  positions[i * 3 + 1] = p.y;
  positions[i * 3 + 2] = p.z;
  const dist = p.distanceTo(camCenter);
  distortions[i] = Math.min(1, dist / 30);
});

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float distortion;
    varying float vAlpha;
    varying float vDistortion;
    
    void main() {
      vec3 p = position;
      
      // Subtle drift to simulate scan instability
      float drift = sin(uTime * 0.3 + p.y * 0.5) * 0.02;
      p.x += drift * distortion;
      p.z += cos(uTime * 0.25 + p.x * 0.3) * 0.015 * distortion;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      // Size attenuation with measurement uncertainty
      float baseSize = 1.2 + distortion * 1.8;
      gl_PointSize = baseSize * uPixel * (45.0 / dist);
      
      vAlpha = 0.18 + (1.0 - distortion) * 0.22;
      vDistortion = distortion;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying float vDistortion;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Soft halo falloff
      float a = exp(-r * 12.0) * vAlpha;
      
      // Pale gray with slight warm tint
      vec3 col = vec3(0.72, 0.73, 0.71);
      
      // More distorted points get softer
      a *= 0.6 + (1.0 - vDistortion) * 0.4;
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('distortion', new THREE.BufferAttribute(distortions, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Ground plane suggestion
const groundGeom = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshBasicMaterial({ 
  color: 0x0d0d0e, 
  transparent: true, 
  opacity: 0.3 
});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.2;
scene.add(ground);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Slow orbit camera
const centroid = new THREE.Vector3(0, 6, 0);
const orbitRadius = 32;
const orbitSpeed = 0.035;

function loop(t) {
  t *= 0.001;
  uniforms.uTime.value = t;
  
  const angle = t * orbitSpeed;
  camera.position.x = centroid.x + Math.cos(angle) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(angle) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(angle * 0.3) * 4 + 8;
  camera.lookAt(centroid);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop(0);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
