<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 40% 35%, #0a1e2e 0%, #061520 40%, #020a10 75%, #000305 100%),

    mix-blend-mode: screen; opacity: 0.35;

  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; letter-spacing:0.06em; z-index:5; }

<div class="id">7oq</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── smooth pointer with momentum (Memo Akten style)
const pointer = { x: 0, y: 0 };
const pointerSmooth = { x: 0, y: 0 };
const pointerVel = { x: 0, y: 0 };
const LERP_ALPHA = 0.012;

addEventListener('pointermove', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = (e.clientY / innerHeight) * 2 - 1;
});

// ────────────── Riley wave-interference tidal field
const N = 90000;
const positions = new Float32Array(N * 3);
const basePositions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const phases = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;

function buildField(seed) {
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng()*Math.PI*2, k: 1.4+rng()*1.0, phase: rng()*Math.PI*2 };
  const w2 = { ang: rng()*Math.PI*2, k: 1.8+rng()*1.2, phase: rng()*Math.PI*2 };
  const w3 = { ang: rng()*Math.PI*2, k: 0.7+rng()*0.5, phase: rng()*Math.PI*2 };
  const radK = 1.1 + rng() * 0.5;

  let written = 0, attempts = 0;
  while (written < N && attempts < N * 16) {
    attempts++;
    const r = Math.sqrt(rng()) * 4.5;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x*Math.cos(w1.ang)*w1.k + z*Math.sin(w1.ang)*w1.k + w1.phase);
    const v2 = Math.sin(x*Math.cos(w2.ang)*w2.k + z*Math.sin(w2.ang)*w2.k + w2.phase);
    const v3 = Math.sin(x*Math.cos(w3.ang)*w3.k + z*Math.sin(w3.ang)*w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.08);
    if (!(f > 0 && rng() < fall * (0.35 + 0.65 * f))) continue;
    const petals = 5;
    const scallop = Math.cos(th * petals) * 0.2 * (r / 4.5);
    const y = -0.12 * r * r + scallop;
    basePositions[written*3] = x;
    basePositions[written*3+1] = y;
    basePositions[written*3+2] = z;
    positions[written*3] = x;
    positions[written*3+1] = y;
    positions[written*3+2] = z;
    seeds[written] = rng();
    phases[written] = rng() * Math.PI * 2;
    written++;
  }
  for (let i = written; i < N; i++) {
    basePositions[i*3] = 0; basePositions[i*3+1] = -3; basePositions[i*3+2] = 0;
    positions[i*3] = 0; positions[i*3+1] = -3; positions[i*3+2] = 0;
    seeds[i] = 0; phases[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uTide: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2 uPointer;
    uniform float uTide;
    attribute float seed;
    attribute float phase;
    varying float vDepth;
    varying float vSeed;
    varying float vGlow;
    void main(){
      vec3 p = position;

      // biomorphic tidal breathing — peristaltic wave radiates from center
      float r = length(p.xz);
      float th = atan(p.z, p.x);
      float tidePhase = r * 0.8 - uTime * 0.15 + phase;

      // slow radial expansion/contraction like breathing tissue
      float breathe = sin(tidePhase) * 0.12 * r;
      float vertPulse = sin(tidePhase * 1.3 + seed * 3.0) * 0.08;

      p.x += cos(th) * breathe;
      p.z += sin(th) * breathe;
      p.y += vertPulse;

      // vascular pulse — subtle squeeze along wave bands
      float vascFreq = uTime * 0.2 + r * 1.5;
      p.y += sin(vascFreq + seed * 6.28) * 0.04 * (1.0 - r * 0.1);

      // smooth pointer influence — tilt + gentle attraction
      float tiltX = uPointer.y * 0.15;
      float tiltZ = -uPointer.x * 0.15;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;

      // glow pulses with tide
      vGlow = 0.5 + 0.5 * sin(tidePhase * 0.7 + phase);

      float sz = (1.2 + 0.6 * vGlow) * uPixel * (5.5 / max(vDepth, 1.0));
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0);

      // oceanic palette: deep teal → cool blue → pale cyan
      vec3 deepTeal = vec3(0.02, 0.12, 0.18);
      vec3 midBlue  = vec3(0.08, 0.28, 0.42);
      vec3 paleCyan = vec3(0.45, 0.72, 0.82);

      float t = smoothstep(0.0, 1.0, vSeed);
      vec3 col = mix(deepTeal, midBlue, t);
      col = mix(col, paleCyan, vGlow * 0.5);

      // bioluminescent highlights on bright particles
      float luma = vGlow * (1.0 - vSeed * 0.4);
      col += vec3(0.10, 0.25, 0.30) * luma;

      // depth fog toward deep ocean
      float fog = clamp((vDepth - 9.0) / 12.0, 0.0, 0.7);
      vec3 fogCol = vec3(0.02, 0.06, 0.10);
      col = mix(col, fogCol, fog);

      float alpha = a * 0.65 * (1.0 - fog * 0.5) * (0.5 + 0.5 * vGlow);
      gl_FragColor = vec4(col, alpha);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── marine snow / bioluminescent motes
const N_DUST = 400;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++) {
  dustPos[i*3]     = (Math.random() - 0.5) * 20;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 12;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 14;
  dustSeed[i] = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.06 + seed * 6.28;
      // slow upward drift — marine snow rising
      p.x += sin(t * 0.9 + seed * 40.0) * 0.6;
      p.y += mod(uTime * 0.04 + seed * 9.0, 6.0) - 3.0;
      p.z += cos(t * 0.7 + seed * 25.0) * 0.5;

      // bioluminescent pulse
      vGlow = 0.2 + 0.8 * pow(max(0.0, sin(t * 1.7 + seed * 12.0)), 3.0);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + 1.8 * vGlow) * uPixel * (4.0 / max(-mv.z, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 20.0);
      vec3 col = mix(vec3(0.15, 0.45, 0.55), vec3(0.50, 0.85, 0.95), vGlow);
      gl_FragColor = vec4(col, a * 0.55 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── background fog layer — deep volumetric feel
const N_FOG = 200;
const fogGeom = new THREE.BufferGeometry();
const fogPos = new Float32Array(N_FOG * 3);
const fogSd = new Float32Array(N_FOG);
for (let i = 0; i < N_FOG; i++) {
  fogPos[i*3]     = (Math.random() - 0.5) * 30;
  fogPos[i*3 + 1] = (Math.random() - 0.5) * 16;
  fogPos[i*3 + 2] = -6 - Math.random() * 20;
  fogSd[i] = Math.random();
}
fogGeom.setAttribute('position', new THREE.BufferAttribute(fogPos, 3));
fogGeom.setAttribute('seed', new THREE.BufferAttribute(fogSd, 1));
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.03 + seed * 6.28;
      p.x += sin(t * 0.4) * 2.0;
      p.y += cos(t * 0.3 + seed * 10.0) * 1.0;
      vAlpha = 0.06 + 0.04 * sin(t * 0.8);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (30.0 + 20.0 * seed) * uPixel * (5.0 / max(-mv.z, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      float a = exp(-r * 3.0);
      vec3 col = vec3(0.04, 0.10, 0.16);
      gl_FragColor = vec4(col, a * vAlpha);
    }
  `
});
const fog = new THREE.Points(fogGeom, fogMat);
scene.add(fog);

// ────────────── interaction — click to regrow with smooth transition
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.phase.needsUpdate = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ────────────── animation loop
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // smooth pointer LERP with momentum
  const dx = pointer.x - pointerSmooth.x;
  const dy = pointer.y - pointerSmooth.y;
  pointerVel.x += dx * 0.008;
  pointerVel.y += dy * 0.008;
  pointerVel.x *= 0.96;
  pointerVel.y *= 0.96;
  pointerSmooth.x += pointerVel.x;
  pointerSmooth.y += pointerVel.y;
  uniforms.uPointer.value.set(pointerSmooth.x, pointerSmooth.y);

  // camera on slow rail — orbits with gentle vertical bob, creating depth
  const orbitR = 13 + Math.sin(t * 0.025) * 2;
  const orbitAngle = t * 0.018;
  const vertBob = Math.sin(t * 0.03 + 0.7) * 0.8;
  camera.position.set(
    Math.sin(orbitAngle) * orbitR,
    0.5 + vertBob,
    Math.cos(orbitAngle) * orbitR
  );
  // look slightly ahead of center for parallax depth feel
  const lookAhead = 0.3;
  camera.lookAt(
    Math.sin(orbitAngle + lookAhead) * 0.5,
    vertBob * 0.2,
    Math.cos(orbitAngle + lookAhead) * 0.5
  );

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
