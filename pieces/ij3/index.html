<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ij3 · patience arabesque · slow architecture</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .breath { position:fixed; right:14px; bottom:12px; opacity:0.35; font-size: 10px; 
            letter-spacing: 0.08em; color:#8a8f99; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 9px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">ij3</div>
<div class="breath" id="breathCounter">breath 0</div>
<div class="hint">remain still · transformation emerges over minutes</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// SLOW ART DIRECTIVE: nearly-static for 30s, then extremely gradual transformation
// over 60-120s. Ribbon color shifts from cool steel-blue through warm gold over
// 90s. Fog density slowly decreases, revealing depth. Camera drift is imperceptible
// frame-to-frame but accumulates over minutes. Breath counter increments every 4s
// (slow breath rate) to acknowledge patient viewers.

const scene = new THREE.Scene();
const FOG_INITIAL = 0.048;
const FOG_FINAL = 0.012;
scene.fog = new THREE.FogExp2(0x0a0a0f, FOG_INITIAL);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 7, 12);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xd4d8e0, 0.8);
lightKey.position.set(8, 14, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x12141a, 0.6));

const lightFill = new THREE.DirectionalLight(0x3a4058, 0.25);
lightFill.position.set(-5, 3, -6);
scene.add(lightFill);

// ─────────── differential growth (3D, from parent)
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE     = 0.003;
const PRESSURE  = 0.0030;
const RISE      = 0.0045;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// Pre-grow structure to stable state
for (let s = 0; s < 1200; s++) step();

// ─────────── ribbon renderer with slow color transition
let ribbonMesh = null;
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0x5a6d7a,  // cool steel-blue initial
  emissive: 0x0a0e12,
  roughness: 0.4,
  metalness: 0.6,
  side: THREE.DoubleSide,
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();
const breathCounter = document.getElementById('breathCounter');
let breathCount = 0;
let lastBreathTime = startTime;

function loop(){
  const elapsed = (performance.now() - startTime) / 1000;  // seconds
  
  // Breath counter: increment every 4 seconds (slow breath)
  if (elapsed - (lastBreathTime - startTime) / 1000 >= 4.0){
    breathCount++;
    breathCounter.textContent = `breath ${breathCount}`;
    lastBreathTime = performance.now();
  }
  
  // SLOW TRANSFORMATIONS (90s arc)
  // Phase 1: 0-30s — nearly frozen, imperceptible drift
  // Phase 2: 30-90s — color transition steel→gold, fog clears, camera orbits
  
  const COLOR_START_TIME = 30;
  const COLOR_END_TIME = 90;
  
  let colorT = Math.max(0, Math.min(1, (elapsed - COLOR_START_TIME) / (COLOR_END_TIME - COLOR_START_TIME)));
  // easeInOutCubic for smooth acceleration/deceleration
  colorT = colorT < 0.5 ? 4 * colorT * colorT * colorT : 1 - Math.pow(-2 * colorT + 2, 3) / 2;
  
  // Color interpolation: steel-blue (0x5a6d7a) → antique gold (0xc9a45a)
  const r0 = 0x5a / 255, g0 = 0x6d / 255, b0 = 0x7a / 255;
  const r1 = 0xc9 / 255, g1 = 0xa4 / 255, b1 = 0x5a / 255;
  const r = r0 + (r1 - r0) * colorT;
  const g = g0 + (g1 - g0) * colorT;
  const b = b0 + (b1 - b0) * colorT;
  ribbonMat.color.setRGB(r, g, b);
  
  // Emissive also warms slightly
  const e0r = 0x0a / 255, e0g = 0x0e / 255, e0b = 0x12 / 255;
  const e1r = 0x2a / 255, e1g = 0x1a / 255, e1b = 0x06 / 255;
  const er = e0r + (e1r - e0r) * colorT;
  const eg = e0g + (e1g - e0g) * colorT;
  const eb = e0b + (e1b - e0b) * colorT;
  ribbonMat.emissive.setRGB(er, eg, eb);
  
  // Fog density decreases over same period
  const fogDensity = FOG_INITIAL + (FOG_FINAL - FOG_INITIAL) * colorT;
  scene.fog.density = fogDensity;
  
  // Extremely slow camera orbit (imperceptible frame-to-frame)
  const orbitSpeed = 0.00008;  // radians per frame (~0.27°/minute)
  const orbitRadius = Math.hypot(camera.position.x, camera.position.z);
  const currentAngle = Math.atan2(camera.position.z, camera.position.x);
  const newAngle = currentAngle + orbitSpeed;
  camera.position.x = Math.cos(newAngle) * orbitRadius;
  camera.position.z = Math.sin(newAngle) * orbitRadius;
  camera.lookAt(0, 4, 0);
  
  // Very slow growth continues (barely perceptible vertex motion)
  if (elapsed > 20 && verts.length < MAX_VERTS){
    if (Math.random() < 0.015) step();  // ~1 step every 3-4 seconds
  }
  
  // Rebuild ribbon geometry
  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N_SAMPLES = Math.min(1200, verts.length * 3);
    
    const positions = new Float32Array(N_SAMPLES * 2 * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    
    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const tangent = curve.getTangentAt(tt).normalize();
      let lateral = new THREE.Vector3().crossVectors(tangent, up);
      if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
      lateral.normalize();
      
      // Width variation now extremely subtle (slow art = restraint)
      const width = 0.22 + 0.04 * Math.sin(tt * 28.0 + elapsed * 0.08);
      const left  = p.clone().addScaledVector(lateral, -width);
      const right = p.clone().addScaledVector(lateral,  width);
      positions[i*6]   = left.x;  positions[i*6+1] = left.y;  positions[i*6+2] = left.z;
      positions[i*6+3] = right.x; positions[i*6+4] = right.y; positions[i*6+5] = right.z;
    }
    
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      const a = i * 2, b = i * 2 + 1;
      const c = ni * 2, d = ni * 2 + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
    
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    
    if (ribbonMesh){ 
      scene.remove(ribbonMesh); 
      ribbonMesh.geometry.dispose(); 
    }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    scene.add(ribbonMesh);
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
