<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5gj · tender growth attractor</title>
<!-- MOTION: drift, intensity: gentle -->
<!-- CROSS-POLLINATE: borrowed Lorenz attractor (zs4) visual signature — continuous ribbon trail, additive glow, camera orbiting the form's dynamic center. Parent 5xv's differential-growth morphology is preserved but rendered as flowing attractor paths instead of static draping strings. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0806; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">5gj</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres × Lorenz · tender attractor ribbon</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender growth attractor — differential growth morphology reimagined 
   as Lorenz-style continuous ribbon trails. Each growth vertex becomes
   a dynamic attractor point; particles trace flowing paths with additive
   glow. The self-avoiding curve's evolution drives the attractor field. */

const BG = 0x0d0806;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(12, 8, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// --- differential growth parameters (parent 5xv) ---
const MAX_VERTS = 2800;
const ATTRACT   = 0.06;
const REPEL_R   = 0.52;
const REPEL_STR = 0.11;
const NOISE     = 0.003;
const PRESSURE  = 0.003;
const MAX_D     = 0.38;

// initialize: gentle spiral seed
const verts = [];
const NV0 = 30;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * Math.PI * 4;
  const r = 1.5 + t * 0.15;
  verts.push({ 
    x: Math.cos(t) * r, 
    z: Math.sin(t) * r, 
    y: t * 0.2 - 2,
    age: 0,
    vel: { x: 0, y: 0, z: 0 }
  });
}

// spatial hash
const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  // repulsion
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z, ey = v.y - u.y;
      const d2 = ex * ex + ez * ez + ey * ey;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
      dy[i] += ey * f * 0.5;
    }
  }
  // attraction toward polyline neighbors
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  // light pressure
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.sqrt(ox * ox + oy * oy + oz * oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dy[i] += (oy / d) * PRESSURE * 0.5;
    dz[i] += (oz / d) * PRESSURE;
  }

  // apply + noise
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i] + (Math.random() - 0.5) * NOISE * 0.7;
    verts[i].age += 0.0006;
    // store velocity for attractor field
    verts[i].vel = { x: dx[i], y: dy[i], z: dz[i] };
  }

  // subdivide
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.04,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.04,
        y: (a.y + b.y) * 0.5 + (Math.random() - 0.5) * 0.02,
        age: Math.max(a.age, b.age) * 0.75,
        vel: { x: (a.vel.x + b.vel.x) * 0.5, y: (a.vel.y + b.vel.y) * 0.5, z: (a.vel.z + b.vel.z) * 0.5 }
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- Lorenz-style ribbon particles ---
const N_PARTICLES = 40000;
const TRAIL_LEN = 180;
const particles = [];
for (let i = 0; i < N_PARTICLES; i++) {
  const ang = Math.random() * Math.PI * 2;
  const r = 2 + Math.random() * 3;
  particles.push({
    x: Math.cos(ang) * r,
    y: (Math.random() - 0.5) * 2,
    z: Math.sin(ang) * r,
    trail: [],
    seed: Math.random(),
    hue: Math.random()
  });
}

// attractor influence from growth vertices
function attractorField(p) {
  let fx = 0, fy = 0, fz = 0;
  let totalW = 0;
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const dx = v.x - p.x, dy = v.y - p.y, dz = v.z - p.z;
    const d2 = dx * dx + dy * dy + dz * dz + 0.1;
    const d = Math.sqrt(d2);
    // weight by inverse distance and vertex velocity
    const w = 1.0 / d2;
    fx += (dx + v.vel.x * 3) * w;
    fy += (dy + v.vel.y * 3) * w;
    fz += (dz + v.vel.z * 3) * w;
    totalW += w;
  }
  if (totalW > 0) {
    fx /= totalW;
    fy /= totalW;
    fz /= totalW;
  }
  return { x: fx, y: fy, z: fz };
}

function stepParticles(dt) {
  if (paused) return;
  for (const p of particles) {
    const f = attractorField(p);
    const speed = 0.022;
    p.x += f.x * speed * dt;
    p.y += f.y * speed * dt;
    p.z += f.z * speed * dt;
    // add gentle curl noise
    const t = performance.now() * 0.0002 + p.seed * 100;
    p.x += Math.sin(t + p.z * 0.3) * 0.006 * dt;
    p.y += Math.cos(t * 0.7 + p.x * 0.3) * 0.004 * dt;
    p.z += Math.sin(t * 0.5 + p.y * 0.3) * 0.006 * dt;
    
    p.trail.push({ x: p.x, y: p.y, z: p.z });
    if (p.trail.length > TRAIL_LEN) p.trail.shift();
  }
}

// render trails as additive point ribbons
const trailGeom = new THREE.BufferGeometry();
const maxTrailVerts = N_PARTICLES * TRAIL_LEN;
const trailPos = new Float32Array(maxTrailVerts * 3);
const trailAge = new Float32Array(maxTrailVerts);
const trailHue = new Float32Array(maxTrailVerts);
trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeom.setAttribute('age', new THREE.BufferAttribute(trailAge, 1));
trailGeom.setAttribute('hue', new THREE.BufferAttribute(trailHue, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const trailMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float age;
    attribute float hue;
    varying vec3 vCol;
    varying float vAlpha;

    vec3 hsl2rgb(float h, float s, float l) {
      float c = (1.0 - abs(2.0 * l - 1.0)) * s;
      float x = c * (1.0 - abs(mod(h * 6.0, 2.0) - 1.0));
      float m = l - c * 0.5;
      vec3 rgb;
      if (h < 0.166) rgb = vec3(c, x, 0.0);
      else if (h < 0.333) rgb = vec3(x, c, 0.0);
      else if (h < 0.5) rgb = vec3(0.0, c, x);
      else if (h < 0.666) rgb = vec3(0.0, x, c);
      else if (h < 0.833) rgb = vec3(x, 0.0, c);
      else rgb = vec3(c, 0.0, x);
      return rgb + m;
    }

    void main() {
      // tender palette: warm amber to soft peach to pale rose
      float h = mix(0.08, 0.96, hue);
      float s = 0.45 + 0.25 * sin(uTime * 0.4 + hue * 6.28);
      float l = 0.55 + 0.2 * age;
      vCol = hsl2rgb(h, s, l);
      
      vAlpha = age * 0.7;
      
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.5 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float glow = exp(-r * 16.0) * 0.6 + exp(-r * 6.0) * 0.4;
      float a = glow * vAlpha;
      
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const trailPoints = new THREE.Points(trailGeom, trailMat);
scene.add(trailPoints);

// faint guide curve
const wireGeom = new THREE.BufferGeometry();
const wirePos = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x3a2820,
  transparent: true,
  opacity: 0.18
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 400; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();
let lastT = start;

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastT) / 16.6, 3);
  lastT = now;
  uniforms.uTime.value = t;

  for (let s = 0; s < 2; s++) step();
  stepParticles(dt);

  const n = verts.length;
  
  // update wire
  for (let i = 0; i < n; i++) {
    wirePos[i * 3] = verts[i].x;
    wirePos[i * 3 + 1] = verts[i].y;
    wirePos[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // update trail rendering
  let idx = 0;
  for (const p of particles) {
    const tlen = p.trail.length;
    for (let i = 0; i < tlen; i++) {
      const pt = p.trail[i];
      trailPos[idx * 3] = pt.x;
      trailPos[idx * 3 + 1] = pt.y;
      trailPos[idx * 3 + 2] = pt.z;
      trailAge[idx] = i / tlen;
      trailHue[idx] = p.hue;
      idx++;
    }
  }
  trailGeom.setDrawRange(0, idx);
  trailGeom.attributes.position.needsUpdate = true;
  trailGeom.attributes.age.needsUpdate = true;

  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);

  statEl.textContent = `verts=${n} trails=${particles.length}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
