<title>gif · samadhi (stillness web)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<body>
<div class="id">gif</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── samadhi morph
// Continuous from ucz spider web: web contracts into a singular centered mandala
// All motion slows to stillness, camera stops orbiting, threads converge to radial symmetry
// Form transitions from sparse 3D network → dense radial bloom at origin
// Single breath cycle: the web inhales into unity, exhales gently

// ────────────── scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ────────────── web structure (from ucz, now converging)
const NODES = 300;
const BOUNDS = 8.0;
const anchors = [];
const rng = (() => { let s = 0xD1DAC; return () => { s = (s + 0x9E3779B9) | 0;
  let t = Math.imul(s ^ (s >>> 16), 0x85EBCA6B);
  t = Math.imul(t ^ (t >>> 13), 0xC2B2AE35);
  return ((t ^ (t >>> 16)) >>> 0) / 4294967296; }; })();

// generate same initial anchor structure as ucz
const hubs = [];
for (let i = 0; i < 5; i++){
  hubs.push(new THREE.Vector3(
    (rng() * 2 - 1) * BOUNDS * 0.6,
    (rng() * 2 - 1) * BOUNDS * 0.6,
    (rng() * 2 - 1) * BOUNDS * 0.6
  ));
}

for (let i = 0; i < NODES; i++){
  const hub = hubs[Math.floor(rng() * hubs.length)];
  const r = 0.8 + rng() * 1.5;
  const th = rng() * Math.PI * 2;
  const ph = Math.acos(2 * rng() - 1);
  const x = hub.x + r * Math.sin(ph) * Math.cos(th);
  const y = hub.y + r * Math.sin(ph) * Math.sin(th);
  const z = hub.z + r * Math.cos(ph);
  
  // NEW: compute target position — radial mandala layout at origin
  // each node moves toward a position on a sphere/disc based on its angle
  const angle = rng() * Math.PI * 2;
  const radius = 0.2 + rng() * 4.0;  // varied radii create layered mandala
  const height = (rng() - 0.5) * 0.8;  // slight depth variation
  const targetX = Math.cos(angle) * radius;
  const targetY = Math.sin(angle) * radius;
  const targetZ = height;
  
  anchors.push({
    pos: new THREE.Vector3(x, y, z),
    basePos: new THREE.Vector3(x, y, z),  // original ucz position
    targetPos: new THREE.Vector3(targetX, targetY, targetZ),  // samadhi convergence
    vel: new THREE.Vector3(0, 0, 0),
    seed: rng(),
    angle: angle  // for radial ordering
  });
}

// build edges (same as ucz)
const edges = [];
const MAX_LOCAL = 4;
const LONG_RANGE_PROB = 0.03;
const LONG_RANGE_COUNT = Math.floor(NODES * LONG_RANGE_PROB);

for (let i = 0; i < anchors.length; i++){
  const a = anchors[i];
  const dists = anchors.map((b, idx) => ({
    idx,
    d: idx === i ? Infinity : a.basePos.distanceTo(b.basePos)
  }));
  dists.sort((x, y) => x.d - y.d);
  const count = 2 + Math.floor(rng() * 3);
  for (let k = 0; k < count && k < dists.length; k++){
    const j = dists[k].idx;
    if (j > i) edges.push({ a: i, b: j, type: 'local' });
  }
}

for (let k = 0; k < LONG_RANGE_COUNT; k++){
  const i = Math.floor(rng() * anchors.length);
  const j = Math.floor(rng() * anchors.length);
  if (i !== j) edges.push({ a: i, b: j, type: 'long' });
}

// ────────────── render edges
const linePosArray = new Float32Array(edges.length * 6);
const lineColorArray = new Float32Array(edges.length * 6);

const colA = new THREE.Color(0xe8f2f8);
const colB = new THREE.Color(0xb8d4e8);
const colC = new THREE.Color(0xf0e8f8);

function updateLineGeometry(){
  for (let i = 0; i < edges.length; i++){
    const e = edges[i];
    const a = anchors[e.a].pos;
    const b = anchors[e.b].pos;
    linePosArray[i * 6 + 0] = a.x;
    linePosArray[i * 6 + 1] = a.y;
    linePosArray[i * 6 + 2] = a.z;
    linePosArray[i * 6 + 3] = b.x;
    linePosArray[i * 6 + 4] = b.y;
    linePosArray[i * 6 + 5] = b.z;
    const col = e.type === 'long' ? colC : (rng() > 0.5 ? colA : colB);
    lineColorArray[i * 6 + 0] = col.r;
    lineColorArray[i * 6 + 1] = col.g;
    lineColorArray[i * 6 + 2] = col.b;
    lineColorArray[i * 6 + 3] = col.r;
    lineColorArray[i * 6 + 4] = col.g;
    lineColorArray[i * 6 + 5] = col.b;
  }
}
updateLineGeometry();

const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePosArray, 3));
lineGeom.setAttribute('color', new THREE.BufferAttribute(lineColorArray, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.65,
  blending: THREE.AdditiveBlending
});
const lineObj = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lineObj);

// ────────────── render nodes
const nodeGeom = new THREE.BufferGeometry();
const nodePosArray = new Float32Array(NODES * 3);
const nodeSeedArray = new Float32Array(NODES);
for (let i = 0; i < anchors.length; i++){
  const a = anchors[i].pos;
  nodePosArray[i * 3 + 0] = a.x;
  nodePosArray[i * 3 + 1] = a.y;
  nodePosArray[i * 3 + 2] = a.z;
  nodeSeedArray[i] = anchors[i].seed;
}
nodeGeom.setAttribute('position', new THREE.BufferAttribute(nodePosArray, 3));
nodeGeom.setAttribute('seed', new THREE.BufferAttribute(nodeSeedArray, 1));

const nodeUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const nodeMat = new THREE.ShaderMaterial({
  uniforms: nodeUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vPulse;
    void main(){
      vec3 p = position;
      // slower pulse for samadhi stillness
      vPulse = 0.5 + 0.5 * sin(uTime * 0.6 + seed * 6.28);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (18.0 / dist) * (0.7 + 0.3 * vPulse);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vPulse;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * (0.5 + 0.5 * vPulse);
      vec3 col = vec3(0.9, 0.93, 0.96);
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const nodeObj = new THREE.Points(nodeGeom, nodeMat);
scene.add(nodeObj);

// ────────────── physics: transition from ucz wind → samadhi convergence
// Over time, anchors migrate from basePos toward targetPos (mandala center)
// Wind diminishes, spring to targetPos strengthens
const TRANSITION_DURATION = 8.0;  // seconds to complete convergence

function updatePhysics(dt, t){
  // compute transition progress (0→1 over TRANSITION_DURATION)
  const progress = Math.min(1.0, t / TRANSITION_DURATION);
  const ease = progress * progress * (3.0 - 2.0 * progress);  // smoothstep
  
  // wind diminishes to zero
  const windStrength = (1.0 - ease) * 0.08;
  const windX = (p, t) => Math.sin(p.y * 0.3 + t * 0.4) * Math.cos(p.z * 0.25 + t * 0.3);
  const windY = (p, t) => Math.cos(p.x * 0.35 + t * 0.5) * Math.sin(p.z * 0.2 + t * 0.35);
  const windZ = (p, t) => Math.sin(p.x * 0.25 + t * 0.45) * Math.cos(p.y * 0.3 + t * 0.4);
  
  // spring constant interpolates: pull from base → pull toward target
  const springToBase = 0.015 * (1.0 - ease);
  const springToTarget = 0.025 * ease;
  
  // damping increases (motion stills)
  const damping = 0.92 + 0.06 * ease;
  
  // breathing: gentle radial pulse once converged
  const breathAmp = ease * 0.15 * Math.sin(t * 0.5);
  
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i];
    
    // spring force (blend base → target)
    const dx = (a.basePos.x - a.pos.x) * springToBase + (a.targetPos.x - a.pos.x) * springToTarget;
    const dy = (a.basePos.y - a.pos.y) * springToBase + (a.targetPos.y - a.pos.y) * springToTarget;
    const dz = (a.basePos.z - a.pos.z) * springToBase + (a.targetPos.z - a.pos.z) * springToTarget;
    
    a.vel.x += dx;
    a.vel.y += dy;
    a.vel.z += dz;
    
    // wind (fading)
    a.vel.x += windX(a.pos, t) * windStrength * dt;
    a.vel.y += windY(a.pos, t) * windStrength * dt;
    a.vel.z += windZ(a.pos, t) * windStrength * dt;
    
    // damping
    a.vel.multiplyScalar(damping);
    
    // integrate
    a.pos.x += a.vel.x * dt;
    a.pos.y += a.vel.y * dt;
    a.pos.z += a.vel.z * dt;
    
    // breathing: radial expansion/contraction once converged
    if (ease > 0.5) {
      const dir = new THREE.Vector3(a.pos.x, a.pos.y, a.pos.z).normalize();
      a.pos.x += dir.x * breathAmp;
      a.pos.y += dir.y * breathAmp;
      a.pos.z += dir.z * breathAmp;
    }
  }

  // update buffers
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i].pos;
    nodePosArray[i * 3 + 0] = a.x;
    nodePosArray[i * 3 + 1] = a.y;
    nodePosArray[i * 3 + 2] = a.z;
  }
  nodeGeom.attributes.position.needsUpdate = true;
  updateLineGeometry();
  lineGeom.attributes.position.needsUpdate = true;
}

// ────────────── camera: slows orbit to stillness, centers on mandala
const CAM_RADIUS = 12.0;

// ────────────── render loop
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = 0;

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  nodeUniforms.uTime.value = t;

  // physics
  updatePhysics(dt, t);

  // camera: slow deceleration to frontal view
  const progress = Math.min(1.0, t / 8.0);
  const ease = progress * progress * (3.0 - 2.0 * progress);
  
  // orbit speed slows to zero
  const orbitSpeed = (1.0 - ease) * 0.12;
  const ang1 = t * orbitSpeed;
  const ang2 = t * orbitSpeed * 0.67;
  
  // position interpolates from figure-eight → frontal centered
  const cx = Math.sin(ang1) * CAM_RADIUS * 0.6 * (1.0 - ease);
  const cy = Math.sin(ang2 * 0.7) * 2.0 * (1.0 - ease);
  const cz = CAM_RADIUS * (Math.cos(ang2) * (1.0 - ease) + ease);
  
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}

  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
