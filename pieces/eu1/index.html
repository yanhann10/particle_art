<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eu1 · process structure (agents)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0e0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">eu1</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">casey reas · software structures · process</div>
<div class="stat" id="stat">agents=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Process-driven structure: agents follow deterministic steering rules.
// Rule 1: each agent seeks the nearest agent in a different state.
// Rule 2: upon reaching within threshold, the agent deposits a segment and switches state.
// Rule 3: agents move at constant velocity; no noise, no randomness beyond init.
// Result: a branching network that emerges from local attraction alone.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e0f);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// agent state
const N_AGENTS = 200;
const SPEED = 0.012;
const DEPOSIT_THRESHOLD = 0.25;
const BOUNDS = 8;

const agents = [];
for (let i = 0; i < N_AGENTS; i++){
  const theta = (i / N_AGENTS) * Math.PI * 2;
  const r = 3 + (i % 3) * 0.5;
  agents.push({
    x: Math.cos(theta) * r,
    y: 0,
    z: Math.sin(theta) * r,
    vx: 0, vy: 0, vz: 0,
    state: i % 2,  // binary state: 0 or 1
    lifetime: 0
  });
}

// deposited segments (each: {ax,ay,az, bx,by,bz, state})
const segments = [];

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(){
  if (paused) return;

  // update agents: seek nearest agent in opposite state
  for (let i = 0; i < agents.length; i++){
    const a = agents[i];
    let nearestDist = Infinity;
    let nearestIdx = -1;
    for (let j = 0; j < agents.length; j++){
      if (i === j || agents[j].state === a.state) continue;
      const dx = agents[j].x - a.x;
      const dy = agents[j].y - a.y;
      const dz = agents[j].z - a.z;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < nearestDist){
        nearestDist = d2;
        nearestIdx = j;
      }
    }
    if (nearestIdx >= 0){
      const b = agents[nearestIdx];
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dz = b.z - a.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
      a.vx = (dx / d) * SPEED;
      a.vy = (dy / d) * SPEED;
      a.vz = (dz / d) * SPEED;

      // if close, deposit segment and flip state
      if (d < DEPOSIT_THRESHOLD){
        segments.push({
          ax: a.x, ay: a.y, az: a.z,
          bx: b.x, by: b.y, bz: b.z,
          state: a.state
        });
        a.state = 1 - a.state;
      }
    }
    a.x += a.vx;
    a.y += a.vy;
    a.z += a.vz;
    a.lifetime += 1;

    // wrap bounds
    if (a.x < -BOUNDS) a.x += BOUNDS * 2;
    if (a.x >  BOUNDS) a.x -= BOUNDS * 2;
    if (a.z < -BOUNDS) a.z += BOUNDS * 2;
    if (a.z >  BOUNDS) a.z -= BOUNDS * 2;
    if (a.y < -BOUNDS * 0.5) a.y += BOUNDS;
    if (a.y >  BOUNDS * 0.5) a.y -= BOUNDS;
  }
}

// render segments as LineSegments — one geometry rebuilt each frame
const segGeo = new THREE.BufferGeometry();
const agentGeo = new THREE.BufferGeometry();

const segMat = new THREE.LineBasicMaterial({ color: 0x9ca3af, transparent: true, opacity: 0.28 });
const segLines = new THREE.LineSegments(segGeo, segMat);
scene.add(segLines);

// agents rendered as small spheres — monochrome gray with one red accent
const agentMat0 = new THREE.MeshBasicMaterial({ color: 0xa0a8b0 });
const agentMat1 = new THREE.MeshBasicMaterial({ color: 0xb84a3e });  // sparing red accent
const agentMeshes = [];
const agentSphereGeo = new THREE.SphereGeometry(0.08, 8, 6);
for (let i = 0; i < N_AGENTS; i++){
  const m = new THREE.Mesh(agentSphereGeo, agentMat0);
  m.visible = false;
  scene.add(m);
  agentMeshes.push(m);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-run 1200 steps so the network is recognizably formed
for (let s = 0; s < 1200; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();
function loop(){
  for (let s = 0; s < 3; s++) step();

  // rebuild segment geometry
  const segPositions = [];
  for (const seg of segments){
    segPositions.push(seg.ax, seg.ay, seg.az);
    segPositions.push(seg.bx, seg.by, seg.bz);
  }
  segGeo.setAttribute('position', new THREE.Float32BufferAttribute(segPositions, 3));

  // update agent positions and materials
  for (let i = 0; i < agents.length; i++){
    const a = agents[i];
    agentMeshes[i].position.set(a.x, a.y, a.z);
    agentMeshes[i].material = (a.state === 0) ? agentMat0 : agentMat1;
    agentMeshes[i].visible = true;
  }

  statEl.textContent = `agents=${agents.length} · segments=${segments.length}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
