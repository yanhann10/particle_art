<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jqm · Saraceno web scan — arachnid cosmology</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">jqm</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.008);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 0, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Deterministic RNG
let rngState = 734892;
function rng(){ 
  rngState |= 0; 
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Generate sparse 3D Delaunay-like anchor graph
const NUM_ANCHORS = 300;
const BOUNDS = { x: 40, y: 30, z: 50 };
const anchors = [];

class Anchor {
  constructor(x, y, z){
    this.pos = new THREE.Vector3(x, y, z);
    this.base = this.pos.clone();
    this.vel = new THREE.Vector3();
    this.connections = [];
    this.clustered = false;
  }
}

// Create cluster centers first — spider webs have knotted hubs
const NUM_CLUSTERS = 12;
const clusterCenters = [];
for (let i = 0; i < NUM_CLUSTERS; i++){
  clusterCenters.push(new THREE.Vector3(
    (rng() - 0.5) * BOUNDS.x,
    (rng() - 0.5) * BOUNDS.y,
    (rng() - 0.5) * BOUNDS.z
  ));
}

// Distribute anchors: 60% clustered near hubs, 40% scattered
for (let i = 0; i < NUM_ANCHORS; i++){
  let x, y, z;
  if (rng() < 0.6){
    // Near a cluster center
    const center = clusterCenters[Math.floor(rng() * clusterCenters.length)];
    const radius = 1.5 + rng() * 3.5;
    const theta = rng() * Math.PI * 2;
    const phi = Math.acos(rng() * 2 - 1);
    x = center.x + radius * Math.sin(phi) * Math.cos(theta);
    y = center.y + radius * Math.sin(phi) * Math.sin(theta);
    z = center.z + radius * Math.cos(phi);
  } else {
    // Scattered
    x = (rng() - 0.5) * BOUNDS.x;
    y = (rng() - 0.5) * BOUNDS.y;
    z = (rng() - 0.5) * BOUNDS.z;
  }
  anchors.push(new Anchor(x, y, z));
}

// ── Build edges: each anchor connects to 2-4 nearest neighbors
const edges = [];
for (let i = 0; i < anchors.length; i++){
  const a = anchors[i];
  const neighbors = [];
  
  // Find nearest neighbors
  for (let j = 0; j < anchors.length; j++){
    if (i === j) continue;
    const dist = a.pos.distanceTo(anchors[j].pos);
    neighbors.push({ idx: j, dist });
  }
  neighbors.sort((p, q) => p.dist - q.dist);
  
  // Connect to 2-4 nearest, probability falling off with distance
  const numConnections = 2 + Math.floor(rng() * 3);
  let connected = 0;
  for (let k = 0; k < neighbors.length && connected < numConnections; k++){
    const nb = neighbors[k];
    const prob = Math.exp(-nb.dist / 8.0);
    if (rng() < prob){
      // Check if already connected (avoid duplicates)
      const exists = edges.some(e => 
        (e.a === i && e.b === nb.idx) || (e.a === nb.idx && e.b === i)
      );
      if (!exists){
        edges.push({ a: i, b: nb.idx });
        connected++;
      }
    }
  }
}

// Add long-range guy-lines — structural support threads
const NUM_GUYLINES = 30;
for (let i = 0; i < NUM_GUYLINES; i++){
  const ai = Math.floor(rng() * anchors.length);
  const bi = Math.floor(rng() * anchors.length);
  if (ai === bi) continue;
  const dist = anchors[ai].pos.distanceTo(anchors[bi].pos);
  if (dist > 15 && dist < 45){
    edges.push({ a: ai, b: bi });
  }
}

// ── Render edges as luminous threads
const linePositions = new Float32Array(edges.length * 6);
const lineColors = new Float32Array(edges.length * 6);
for (let i = 0; i < edges.length; i++){
  const e = edges[i];
  const a = anchors[e.a].pos;
  const b = anchors[e.b].pos;
  const idx = i * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  
  // Pearlescent gradient: silver-white with faint blue-violet iridescence
  const h = 0.6 + rng() * 0.05; // near white
  const s = 0.05 + rng() * 0.05;
  const l = 0.7 + rng() * 0.2;
  const c = new THREE.Color().setHSL(h, s, l);
  
  lineColors[idx]   = c.r; lineColors[idx+1] = c.g; lineColors[idx+2] = c.b;
  lineColors[idx+3] = c.r; lineColors[idx+4] = c.g; lineColors[idx+5] = c.b;
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Render anchor nodes as tiny luminous sprites
const nodeGeo = new THREE.BufferGeometry();
const nodePositions = new Float32Array(anchors.length * 3);
const nodeSizes = new Float32Array(anchors.length);
const nodeColors = new Float32Array(anchors.length * 3);

for (let i = 0; i < anchors.length; i++){
  const a = anchors[i].pos;
  nodePositions[i*3] = a.x;
  nodePositions[i*3+1] = a.y;
  nodePositions[i*3+2] = a.z;
  nodeSizes[i] = 0.15 + rng() * 0.25;
  
  // Faint pearlescent white
  const c = new THREE.Color().setHSL(0.58 + rng()*0.04, 0.08, 0.85 + rng()*0.1);
  nodeColors[i*3] = c.r;
  nodeColors[i*3+1] = c.g;
  nodeColors[i*3+2] = c.b;
}

nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePositions, 3));
nodeGeo.setAttribute('size', new THREE.BufferAttribute(nodeSizes, 1));
nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeColors, 3));

const nodeMat = new THREE.PointsMaterial({
  size: 0.2,
  vertexColors: true,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true,
  fog: true
});

const nodes = new THREE.Points(nodeGeo, nodeMat);
scene.add(nodes);

// ── Soft spring + wind field for breathing motion
const windField = new THREE.Vector3();
const springK = 0.008;
const damping = 0.92;
const windStrength = 0.003;

function updateWind(t){
  windField.set(
    Math.sin(t * 0.12) * Math.cos(t * 0.07),
    Math.cos(t * 0.09) * Math.sin(t * 0.11),
    Math.sin(t * 0.08) * Math.cos(t * 0.13)
  ).multiplyScalar(windStrength);
}

function updateAnchors(dt){
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i];
    // Spring back to base
    const force = a.base.clone().sub(a.pos).multiplyScalar(springK);
    // Wind
    force.add(windField);
    // Integrate
    a.vel.add(force);
    a.vel.multiplyScalar(damping);
    a.pos.add(a.vel);
  }
}

// ── Camera path: slow walk-through inside the web volume
const cameraPath = {
  radius: 22,
  height: 5,
  speed: 0.008,
  lookOffset: new THREE.Vector3()
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
let lastTime = start;

function loop(now){
  const elapsed = (now - start) / 1000;
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Update wind field
  updateWind(elapsed);
  
  // Update anchor positions
  updateAnchors(dt);
  
  // Update geometry
  const posAttr = lineGeo.attributes.position;
  for (let i = 0; i < edges.length; i++){
    const e = edges[i];
    const a = anchors[e.a].pos;
    const b = anchors[e.b].pos;
    const idx = i * 6;
    posAttr.array[idx]   = a.x; posAttr.array[idx+1] = a.y; posAttr.array[idx+2] = a.z;
    posAttr.array[idx+3] = b.x; posAttr.array[idx+4] = b.y; posAttr.array[idx+5] = b.z;
  }
  posAttr.needsUpdate = true;
  
  const nodePosAttr = nodeGeo.attributes.position;
  for (let i = 0; i < anchors.length; i++){
    const a = anchors[i].pos;
    nodePosAttr.array[i*3] = a.x;
    nodePosAttr.array[i*3+1] = a.y;
    nodePosAttr.array[i*3+2] = a.z;
  }
  nodePosAttr.needsUpdate = true;

  // Camera: stereoscopic-style dolly through the web
  const angle = elapsed * cameraPath.speed;
  camera.position.set(
    Math.cos(angle) * cameraPath.radius,
    cameraPath.height + Math.sin(elapsed * 0.015) * 3.0,
    Math.sin(angle) * cameraPath.radius + Math.cos(elapsed * 0.011) * 8.0
  );
  
  // Look toward centroid with gentle drift
  cameraPath.lookOffset.set(
    Math.sin(elapsed * 0.021) * 4.0,
    Math.cos(elapsed * 0.018) * 3.0,
    Math.sin(elapsed * 0.024) * 5.0
  );
  camera.lookAt(cameraPath.lookOffset);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(start);
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
