<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xs4 · attractor cycler · 4 stages</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cfe1d4; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .stage { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 11px; letter-spacing: 0.08em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">xs4 · attractor cycler</div>
<div class="hint">click to cycle stage · pointer subtly nudges parameters</div>
<div class="stage" id="stage">stage 1/4 · lorenz</div>
<div class="src">100k GPGPU · fog + volumetric beam</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// 100k particles share the same buffer. A uniform `uMode` (0..3) selects which
// attractor's equations are integrated each frame. On click we transition to
// the next mode by lerping `uBlend` from 0→1 over 1.4s; during transition the
// integrator emits a weighted average of the OUTGOING and INCOMING fields,
// which produces a continuous morph through the design space rather than a
// discontinuous re-spawn.

const MODES = [
  { id: 'lorenz',     scale: 0.06, palette: [[0.20,0.32,0.78],[0.85,0.32,0.62],[0.98,0.86,0.50]] },
  { id: 'aizawa',     scale: 0.85, palette: [[0.20,0.62,0.45],[0.55,0.30,0.78],[0.92,0.95,0.98]] },
  { id: 'thomas',     scale: 0.55, palette: [[0.92,0.55,0.20],[0.98,0.78,0.32],[0.55,0.20,0.05]] },
  { id: 'halvorsen',  scale: 0.18, palette: [[0.42,0.78,0.92],[0.88,0.42,0.62],[0.92,0.92,0.85]] },
];

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

// state RTs
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random() - 0.5) * 1.4;
  init[i*4+1] = (Math.random() - 0.5) * 1.4;
  init[i*4+2] = (Math.random() - 0.5) * 1.4 + 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation: integrates whichever attractor uMode points at, blending toward uModeNext during transitions
const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.012 },
  uMode:     { value: 0 },
  uModeNext: { value: 0 },
  uBlend:    { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform int uMode;
    uniform int uModeNext;
    uniform float uBlend;
    varying vec2 vUv;

    vec3 lorenz(vec3 p){
      return vec3(
        10.0 * (p.y - p.x),
        p.x * (28.0 - p.z) - p.y,
        p.x * p.y - (8.0 / 3.0) * p.z
      ) * 0.06;  // scale down so all attractors live in similar volume
    }
    vec3 aizawa(vec3 p){
      const float a = 0.95, b = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1;
      return vec3(
        (p.z - b) * p.x - d * p.y,
        d * p.x + (p.z - b) * p.y,
        c + a * p.z - (p.z * p.z * p.z) / 3.0
            - (p.x * p.x + p.y * p.y) * (1.0 + e * p.z)
            + f * p.z * p.x * p.x * p.x
      );
    }
    vec3 thomasAttractor(vec3 p){
      const float B = 0.208186;
      return vec3(sin(p.y) - B * p.x, sin(p.z) - B * p.y, sin(p.x) - B * p.z) * 0.55;
    }
    vec3 halvorsen(vec3 p){
      const float a = 1.4;
      return vec3(
        -a * p.x - 4.0 * p.y - 4.0 * p.z - p.y * p.y,
        -a * p.y - 4.0 * p.z - 4.0 * p.x - p.z * p.z,
        -a * p.z - 4.0 * p.x - 4.0 * p.y - p.x * p.x
      ) * 0.18;
    }

    vec3 evalMode(int m, vec3 p){
      if (m == 0) return lorenz(p);
      if (m == 1) return aizawa(p);
      if (m == 2) return thomasAttractor(p);
                  return halvorsen(p);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 d_now  = evalMode(uMode,     p);
      vec3 d_next = evalMode(uModeNext, p);
      vec3 dp = mix(d_now, d_next, uBlend);

      p += dp * uDt;
      // soft clamp to keep particles from flying to infinity if a transition pushes them outside the basin
      float r = length(p);
      if (r > 8.0) p *= 8.0 / r;

      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ────────────── render scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060a, 0.06);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.5, 5.5);
camera.lookAt(0, 0, 0);

// volumetric light beam: a tall narrow cone with additive translucent shader.
// Off-axis to upper-left so it cuts diagonally across the scene.
const beamGeom = new THREE.ConeGeometry(1.2, 11, 24, 1, true);
beamGeom.translate(0, 5.5, 0);  // base at origin, tip up
const beamMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0.85, 0.92, 1.0) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `
    varying vec3 vLocal;
    varying float vYNorm;
    void main(){
      vLocal = position;
      vYNorm = position.y / 11.0;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor;
    varying vec3 vLocal;
    varying float vYNorm;
    void main(){
      // alpha falls off radially from cone axis AND vertically toward tip
      float radial = length(vec2(vLocal.x, vLocal.z));
      float r = 1.0 - smoothstep(0.0, 1.2 * (1.0 - vYNorm), radial);
      float vert = 1.0 - smoothstep(0.0, 1.0, vYNorm);
      float a = r * vert * 0.18;
      // very gentle flicker
      a *= 0.95 + 0.05 * sin(uTime * 0.7);
      gl_FragColor = vec4(uColor * a, a);
    }
  `
});
const beam = new THREE.Mesh(beamGeom, beamMat);
beam.position.set(-2.4, -3.0, -1.0);   // off-center upper-left
beam.rotation.z = -0.18;                // slight tilt
scene.add(beam);

// points
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uPalA:  { value: new THREE.Vector3() },
    uPalB:  { value: new THREE.Vector3() },
    uPalC:  { value: new THREE.Vector3() },
    uPalA2: { value: new THREE.Vector3() },
    uPalB2: { value: new THREE.Vector3() },
    uPalC2: { value: new THREE.Vector3() },
    uBlend: { value: 0 },
    uBeamPos: { value: new THREE.Vector3(-2.4, 0.0, -1.0) }   // approximate beam centerline at y=0
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: true,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform vec3 uPalA; uniform vec3 uPalB; uniform vec3 uPalC;
    uniform vec3 uPalA2; uniform vec3 uPalB2; uniform vec3 uPalC2;
    uniform float uBlend;
    uniform vec3  uBeamPos;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vBeam;
    varying float vFogDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;

      // brighten when intersecting the beam (cylinder around beam's vertical axis)
      vec2 toBeamXZ = vec2(p.x, p.z) - vec2(uBeamPos.x, uBeamPos.z);
      float beamProx = exp(-dot(toBeamXZ, toBeamXZ) * 3.5);
      vBeam = beamProx;

      // palette lerp: blend between current-mode palette and next-mode palette
      vec3 a = mix(uPalA, uPalA2, uBlend);
      vec3 b = mix(uPalB, uPalB2, uBlend);
      vec3 c = mix(uPalC, uPalC2, uBlend);
      float k = mod(age, 1.0);
      vec3 col = mix(a, b, smoothstep(0.0, 0.5, k));
      col = mix(col, c, smoothstep(0.5, 1.0, k));
      // beam-lit boost
      col = mix(col, col * 1.5 + vec3(0.05, 0.08, 0.12), beamProx * 0.6);
      vCol = col;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vFogDepth = -mv.z;
      gl_PointSize = (1.1 + 1.2 * beamProx) * uPixel * (8.0 / vFogDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying vec3 vCol;
    varying float vBeam;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      vec3 col = vCol;
      // expFog: factor = 1 - exp(-dens^2 * z^2)
      float fogF = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
      col = mix(col, fogColor, fogF);
      gl_FragColor = vec4(col * a * (0.45 + vBeam * 0.7), a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ────────────── stage state machine
let modeNow = 0;
let modeNext = 0;
let blendStartT = -1e9;
const TRANSITION_S = 1.4;
const stageEl = document.getElementById('stage');

function setMode(m){
  modeNow = m; modeNext = m;
  simUniforms.uMode.value = m; simUniforms.uModeNext.value = m;
  simUniforms.uBlend.value = 0.0;
  applyPalette(m, m, 0.0);
  stageEl.textContent = `stage ${m+1}/4 · ${MODES[m].id}`;
}

function applyPalette(m1, m2, b){
  const a = MODES[m1].palette, b2 = MODES[m2].palette;
  pointsMat.uniforms.uPalA.value.set(...a[0]); pointsMat.uniforms.uPalB.value.set(...a[1]); pointsMat.uniforms.uPalC.value.set(...a[2]);
  pointsMat.uniforms.uPalA2.value.set(...b2[0]); pointsMat.uniforms.uPalB2.value.set(...b2[1]); pointsMat.uniforms.uPalC2.value.set(...b2[2]);
  pointsMat.uniforms.uBlend.value = b;
}

setMode(0);

addEventListener('click', () => {
  const next = (modeNow + 1) % MODES.length;
  modeNext = next;
  simUniforms.uModeNext.value = next;
  blendStartT = performance.now();
  stageEl.textContent = `stage ${modeNow+1} → ${modeNext+1} · transitioning`;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer subtly nudges (placeholder hook — current attractors use fixed params, but the visual
// drift from the beam + fog gives a sense of variability. Future iter could nudge each attractor's params.)

const t0 = performance.now();
function loop(){
  const now = performance.now();

  // transition update
  if (modeNow !== modeNext){
    const u = Math.min(1.0, (now - blendStartT) / (TRANSITION_S * 1000));
    simUniforms.uBlend.value = u;
    applyPalette(modeNow, modeNext, u);
    if (u >= 1.0){
      // commit
      modeNow = modeNext;
      simUniforms.uMode.value = modeNow;
      simUniforms.uBlend.value = 0.0;
      applyPalette(modeNow, modeNow, 0.0);
      stageEl.textContent = `stage ${modeNow+1}/4 · ${MODES[modeNow].id}`;
    }
  }

  beamMat.uniforms.uTime.value = now / 1000;

  // sim 4 substeps for stability
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  // slow camera rotation reveals 3D
  const ang = (now - t0) * 0.00018;
  camera.position.x = Math.sin(ang) * 5.5;
  camera.position.z = Math.cos(ang) * 5.5;
  camera.position.y = Math.sin(ang * 0.7) * 1.2;
  camera.lookAt(0, 0, 0.5);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

// auto-cycle every 12s if user doesn't click (so the thumbnail captures variety)
setInterval(() => {
  if (modeNow === modeNext){
    const next = (modeNow + 1) % MODES.length;
    modeNext = next;
    simUniforms.uModeNext.value = next;
    blendStartT = performance.now();
  }
}, 12000);
</script>
</body>
</html>
