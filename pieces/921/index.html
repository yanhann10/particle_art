<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>921 · audio-reactive shells</title>
<!-- MOTION: pulsation, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #150a25; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:10; }
  button.start:hover { background:#22113a; }
  .panel { position: fixed; top: 14px; right: 14px; background: rgba(10,4,16,0.75);
           border: 1px solid rgba(74,42,106,0.4); border-radius: 6px; padding: 14px 16px;
           width: 220px; backdrop-filter: blur(8px); z-index: 5; }
  .ctrl { margin-bottom: 12px; }
  .ctrl:last-child { margin-bottom: 0; }
  .ctrl label { display: block; font-size: 10px; letter-spacing: 0.05em; margin-bottom: 4px;
                opacity: 0.8; text-transform: uppercase; }
  .ctrl .val { float: right; color: #b8a0d0; }
  .ctrl input[type=range] { width: 100%; height: 3px; background: #1a0f28; border-radius: 2px;
                            outline: none; -webkit-appearance: none; appearance: none; }
  .ctrl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
                                                    width: 10px; height: 10px; border-radius: 50%;
                                                    background: #8a6aaa; cursor: pointer; }
  .ctrl input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%;
                                                background: #8a6aaa; cursor: pointer; border: none; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">921</div>
<div class="hint" id="hint"></div>
<div class="panel">
  <div class="ctrl">
    <label>Particle Density <span class="val" id="valDensity">100%</span></label>
    <input type="range" id="sliderDensity" min="20" max="100" value="100" step="5">
  </div>
  <div class="ctrl">
    <label>Pulse Intensity <span class="val" id="valPulse">90%</span></label>
    <input type="range" id="sliderPulse" min="0" max="200" value="90" step="10">
  </div>
  <div class="ctrl">
    <label>Swirl Speed <span class="val" id="valSwirl">40%</span></label>
    <input type="range" id="sliderSwirl" min="0" max="150" value="40" step="5">
  </div>
  <div class="ctrl">
    <label>Hue Rotation <span class="val" id="valHue">0°</span></label>
    <input type="range" id="sliderHue" min="0" max="360" value="0" step="10">
  </div>
  <div class="ctrl">
    <label>Fog Density <span class="val" id="valFog">0%</span></label>
    <input type="range" id="sliderFog" min="0" max="100" value="0" step="5">
  </div>
  <div class="ctrl">
    <label>Size Multiplier <span class="val" id="valSize">100%</span></label>
    <input type="range" id="sliderSize" min="30" max="200" value="100" step="10">
  </div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

// parameter state
const params = {
  density: 1.0,
  pulseIntensity: 0.9,
  swirlSpeed: 0.4,
  hueRotation: 0,
  fogDensity: 0,
  sizeMultiplier: 1.0
};

// 5 concentric "shells" of particles, each shell tuned to a frequency band
const SHELLS = 5;
const BASE_PER_SHELL = 4000;
let positions = null, shellIdx = null, seeds = null, geom = null, points = null;

function rebuildGeometry() {
  const PER_SHELL = Math.floor(BASE_PER_SHELL * params.density);
  const N = SHELLS * PER_SHELL;
  positions = new Float32Array(N * 3);
  shellIdx  = new Float32Array(N);
  seeds     = new Float32Array(N);
  for (let s = 0; s < SHELLS; s++) {
    for (let i = 0; i < PER_SHELL; i++) {
      const idx = s * PER_SHELL + i;
      const r = 4 + s * 2.4;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2*Math.random()-1);
      positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[idx*3+2] = r * Math.cos(phi);
      shellIdx[idx] = s;
      seeds[idx]    = Math.random();
    }
  }
  if (geom) geom.dispose();
  geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
  geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
  if (points) {
    scene.remove(points);
    points.geometry = geom;
    scene.add(points);
  }
}

rebuildGeometry();

// fog
scene.fog = new THREE.FogExp2(0x0a0410, 0);

// uBands holds 5 normalized energies (bass, lo-mid, mid, hi-mid, treble)
const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBands: { value: uBands },
  uTreble: { value: 0 },
  uPulseIntensity: { value: params.pulseIntensity },
  uSwirlSpeed: { value: params.swirlSpeed },
  uHueRotation: { value: params.hueRotation },
  uSizeMultiplier: { value: params.sizeMultiplier }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform float uPulseIntensity;
    uniform float uSwirlSpeed;
    uniform float uHueRotation;
    uniform float uSizeMultiplier;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;

    vec3 hueRotate(vec3 col, float angle) {
      float c = cos(angle);
      float s = sin(angle);
      mat3 rot = mat3(
        0.213 + c*0.787 - s*0.213, 0.213 - c*0.213 + s*0.143, 0.213 - c*0.213 - s*0.787,
        0.715 - c*0.715 - s*0.715, 0.715 + c*0.285 + s*0.140, 0.715 - c*0.715 + s*0.715,
        0.072 - c*0.072 + s*0.928, 0.072 - c*0.072 - s*0.283, 0.072 + c*0.928 + s*0.072
      );
      return rot * col;
    }

    void main(){
      // energy for this shell — first 4 bands in uBands, 5th in uTreble
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;
      vEnergy = e;

      vec3 p = position;
      // radial pulse driven by band energy
      float r = length(p);
      vec3 dir = p / max(r, 0.001);
      float pulse = 1.0 + e * uPulseIntensity;
      p = dir * r * pulse;

      // tangential swirl
      float t = uTime * uSwirlSpeed + seed * 6.28 + shellIdx * 0.7;
      vec3 perp = normalize(cross(dir, vec3(0,1,0) + 0.1*sin(seed*9.0)));
      p += perp * sin(t) * (0.4 + e * 1.2);

      // palette: sodium-amber → ice-cyan duotone
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan = vec3(0.25, 0.85, 0.95);
      float k = clamp(shellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vec3 baseCol = mix(amber, cyan, k);
      baseCol = hueRotate(baseCol, uHueRotation);
      vCol = baseCol * (0.6 + e * 1.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 2.4 * e) * uPixel * (50.0 / dist) * uSizeMultiplier;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// audio
const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 frequency shells';
  } catch (e) {
    hint.textContent = 'mic denied — passive synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

// slider controls
const sliderDensity = document.getElementById('sliderDensity');
const sliderPulse = document.getElementById('sliderPulse');
const sliderSwirl = document.getElementById('sliderSwirl');
const sliderHue = document.getElementById('sliderHue');
const sliderFog = document.getElementById('sliderFog');
const sliderSize = document.getElementById('sliderSize');

const valDensity = document.getElementById('valDensity');
const valPulse = document.getElementById('valPulse');
const valSwirl = document.getElementById('valSwirl');
const valHue = document.getElementById('valHue');
const valFog = document.getElementById('valFog');
const valSize = document.getElementById('valSize');

sliderDensity.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valDensity.textContent = v + '%';
  params.density = v / 100;
  rebuildGeometry();
});

sliderPulse.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valPulse.textContent = v + '%';
  params.pulseIntensity = v / 100;
  uniforms.uPulseIntensity.value = params.pulseIntensity;
});

sliderSwirl.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valSwirl.textContent = v + '%';
  params.swirlSpeed = v / 100;
  uniforms.uSwirlSpeed.value = params.swirlSpeed;
});

sliderHue.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valHue.textContent = v + '°';
  params.hueRotation = v * Math.PI / 180;
  uniforms.uHueRotation.value = params.hueRotation;
});

sliderFog.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valFog.textContent = v + '%';
  params.fogDensity = v / 100;
  scene.fog.density = params.fogDensity * 0.015;
});

sliderSize.addEventListener('input', (e) => {
  const v = parseInt(e.target.value);
  valSize.textContent = v + '%';
  params.sizeMultiplier = v / 100;
  uniforms.uSizeMultiplier.value = params.sizeMultiplier;
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  points.rotation.y = t * 0.04;
  points.rotation.x = Math.sin(t * 0.06) * 0.12;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    // synthetic envelopes so passive mode is alive
    uBands.x = 0.35 + 0.35 * Math.sin(t*1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t*7.0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
