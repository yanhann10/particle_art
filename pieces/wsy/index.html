<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nest of You · cyber-nest metaball attractor</title>
<!-- MOTION: orbit, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">wsy</div>
<div class="hint">move pointer to sculpt the nest</div>
<div class="src">wang & söderström · lumen prize 2023</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Cyber-nest metaballs that orbit viewer-pointer attractor, accreting when slow, shedding when fast.
// SDF-like soft-blending via additive glow on instanced spheres.
// Palette: pearl #f4f1ed, lavender #c8b5d8, mercury #d4dae0

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0e, 0.08);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

// attractor point follows pointer with inertia
const attractor = new THREE.Vector3(0, 0, 0);
const targetAttractor = new THREE.Vector3(0, 0, 0);
const prevAttractor = new THREE.Vector3(0, 0, 0);
let attractorSpeed = 0;

addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth - 0.5) * 8;
  const ny = -(e.clientY / innerHeight - 0.5) * 6;
  targetAttractor.set(nx, ny, 0);
});

// metaball agents
const COUNT = 120;
const agents = [];
class Agent {
  constructor(){
    const r = Math.random() * 3 + 1.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = (Math.random() - 0.5) * Math.PI * 0.6;
    this.pos = new THREE.Vector3(
      r * Math.cos(theta) * Math.cos(phi),
      r * Math.sin(phi),
      r * Math.sin(theta) * Math.cos(phi)
    );
    this.vel = new THREE.Vector3();
    this.acc = new THREE.Vector3();
    this.baseRadius = 0.3 + Math.random() * 0.25;
    this.radius = this.baseRadius;
    this.targetRadius = this.baseRadius;
    this.age = Math.random();
    this.shedTimer = 0;
    this.stuck = false;
  }
  update(dt, attractor, speed){
    // orbit + attractor pull
    const toAttractor = new THREE.Vector3().subVectors(attractor, this.pos);
    const dist = toAttractor.length();
    const pullStrength = speed > 0.6 ? 0.3 : 1.2; // weak pull when fast = shedding
    this.acc.copy(toAttractor).multiplyScalar(pullStrength / Math.max(dist, 0.5));
    
    // orbital tangent force
    const tangent = new THREE.Vector3(-this.pos.y, this.pos.x, 0).normalize().multiplyScalar(0.4);
    this.acc.add(tangent);
    
    // cohesion with nearby agents
    let cohesion = new THREE.Vector3();
    let cohCount = 0;
    for (let other of agents){
      if (other === this) continue;
      const d = this.pos.distanceTo(other.pos);
      if (d < 1.5){
        cohesion.add(other.pos);
        cohCount++;
      }
    }
    if (cohCount > 0){
      cohesion.divideScalar(cohCount);
      cohesion.sub(this.pos).multiplyScalar(0.15);
      this.acc.add(cohesion);
    }
    
    this.vel.add(this.acc.multiplyScalar(dt));
    this.vel.multiplyScalar(0.96); // drag
    this.pos.add(this.vel.clone().multiplyScalar(dt));
    this.acc.set(0,0,0);
    
    // stick when slow, shed when fast
    if (speed < 0.3 && dist < 2.0){
      this.stuck = true;
      this.targetRadius = this.baseRadius * 1.4;
      this.shedTimer = 0;
    } else if (speed > 0.6){
      if (this.stuck){
        this.shedTimer += dt;
        if (this.shedTimer > 0.4){
          this.stuck = false;
          this.targetRadius = this.baseRadius * 0.6;
          this.shedTimer = 0;
        }
      }
    } else {
      this.targetRadius = this.baseRadius;
    }
    
    this.radius += (this.targetRadius - this.radius) * 0.08;
    this.age = (this.age + dt * 0.15) % 1.0;
  }
}

for (let i = 0; i < COUNT; i++){
  agents.push(new Agent());
}

// instanced mesh for spheres
const sphereGeom = new THREE.SphereGeometry(1, 16, 12);
const instancedGeom = new THREE.InstancedBufferGeometry().copy(sphereGeom);
instancedGeom.instanceCount = COUNT;

const offsets = new Float32Array(COUNT * 3);
const scales = new Float32Array(COUNT);
const ages = new Float32Array(COUNT);

instancedGeom.setAttribute('offset', new THREE.InstancedBufferAttribute(offsets, 3));
instancedGeom.setAttribute('scale', new THREE.InstancedBufferAttribute(scales, 1));
instancedGeom.setAttribute('age', new THREE.InstancedBufferAttribute(ages, 1));

const material = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 offset;
    attribute float scale;
    attribute float age;
    varying vec3 vNormal;
    varying float vAge;
    varying vec3 vViewPos;
    void main(){
      vAge = age;
      vNormal = normalize(normalMatrix * normal);
      vec3 pos = position * scale + offset;
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      vViewPos = mvPos.xyz;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vNormal;
    varying float vAge;
    varying vec3 vViewPos;
    uniform float time;
    void main(){
      float fresnel = pow(1.0 - abs(dot(vNormal, normalize(-vViewPos))), 2.0);
      
      // pearl → lavender → mercury palette
      vec3 pearl = vec3(0.957, 0.945, 0.929);
      vec3 lavender = vec3(0.784, 0.710, 0.847);
      vec3 mercury = vec3(0.831, 0.855, 0.878);
      
      float cycle = mod(vAge + fresnel * 0.3, 1.0);
      vec3 col = mix(pearl, lavender, smoothstep(0.0, 0.4, cycle));
      col = mix(col, mercury, smoothstep(0.6, 1.0, cycle));
      
      // soft glow core + fresnel rim
      float core = 0.3 + fresnel * 0.7;
      float alpha = core * 0.25;
      
      gl_FragColor = vec4(col * core, alpha);
    }
  `
});

const mesh = new THREE.Mesh(instancedGeom, material);
scene.add(mesh);

// ambient light
const ambient = new THREE.AmbientLight(0x2a2c34, 0.6);
scene.add(ambient);

// rim light
const rim = new THREE.PointLight(0xc8b5d8, 1.2, 20);
rim.position.set(5, 4, 8);
scene.add(rim);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  prevAttractor.copy(attractor);
  attractor.lerp(targetAttractor, 0.08);
  attractorSpeed = attractor.distanceTo(prevAttractor) / Math.max(dt, 0.001);
  attractorSpeed = Math.min(attractorSpeed, 2.0);
  
  for (let i = 0; i < COUNT; i++){
    agents[i].update(dt, attractor, attractorSpeed);
    offsets[i*3] = agents[i].pos.x;
    offsets[i*3+1] = agents[i].pos.y;
    offsets[i*3+2] = agents[i].pos.z;
    scales[i] = agents[i].radius;
    ages[i] = agents[i].age;
  }
  
  instancedGeom.attributes.offset.needsUpdate = true;
  instancedGeom.attributes.scale.needsUpdate = true;
  instancedGeom.attributes.age.needsUpdate = true;
  
  material.uniforms.time.value = now * 0.001;
  
  // gentle camera orbit
  const angle = now * 0.0001;
  camera.position.x = Math.sin(angle) * 12;
  camera.position.z = Math.cos(angle) * 12;
  camera.position.y = Math.sin(angle * 0.6) * 3;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
