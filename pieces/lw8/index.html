<title>lw8 · AUTO{}Construccion · speculative architecture assembly</title>

               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

<div class="id">lw8</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from 'three';

// CNDSD & Ivan Abreu (Lumen Prize 2023 Gold) — AUTO{}Construccion:
// stochastic L-system grows informal housing from cubes on a grid, then
// rhythmically DISSOLVES walls on a pulse, letting geometry fall and rebuild.
// Strict scaffold breaks into glitch-collapse. Rebar gray + cinder block + neon flashes.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0f0f11, 0.018);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(22, 18, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0f11, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xe0e0e2, 1.2);
lightKey.position.set(12, 20, 10);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x2a2a3a, 0.4));
const lightRim = new THREE.PointLight(0xff3366, 0.8, 50);
lightRim.position.set(-8, 4, -8);
scene.add(lightRim);

// ─────────── cube cell system
const CELL_SIZE = 1.0;
const MAX_CELLS = 600;

// L-system grammar for architecture growth:
// A → AB (add floor)
// B → CD (branch horizontally)
// C → C (maintain wall)
// D → empty (void/window)
// We'll grow in discrete steps, then collapse some on pulse

const cells = [];  // { gx, gy, gz, state:'solid'|'falling', vy, material_idx }

// seed: base platform
for (let x = -3; x <= 3; x++) for (let z = -3; z <= 3; z++){
  if (Math.random() < 0.6) cells.push({ gx:x, gy:0, gz:z, state:'solid', vy:0, mat:0 });
}

// stochastic growth rules applied in bursts
function growCell(c){
  const candidates = [];
  // try to add above (floor continuation)
  if (c.gy < 12 && Math.random() < 0.35) candidates.push({ gx:c.gx, gy:c.gy+1, gz:c.gz });
  // horizontal adjacency (walls)
  if (Math.random() < 0.4){
    const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
    const [dx, dz] = dirs[Math.floor(Math.random()*4)];
    candidates.push({ gx:c.gx+dx, gy:c.gy, gz:c.gz+dz });
  }
  // branch diagonal (corners)
  if (Math.random() < 0.2){
    const dx = Math.random() < 0.5 ? 1 : -1, dz = Math.random() < 0.5 ? 1 : -1;
    candidates.push({ gx:c.gx+dx, gy:c.gy, gz:c.gz+dz });
  }
  for (const cand of candidates){
    if (cells.length >= MAX_CELLS) break;
    const exists = cells.some(e => e.gx===cand.gx && e.gy===cand.gy && e.gz===cand.gz);
    if (!exists && Math.abs(cand.gx)<10 && Math.abs(cand.gz)<10){
      const mat = Math.random() < 0.85 ? 0 : (Math.random() < 0.5 ? 1 : 2);
      cells.push({ gx:cand.gx, gy:cand.gy, gz:cand.gz, state:'solid', vy:0, mat });
    }
  }
}

// ─────────── materials (rebar gray, cinder block, neon code-flash)
const matRebar = new THREE.MeshStandardMaterial({ color:0x505560, roughness:0.7, metalness:0.3 });
const matCinder = new THREE.MeshStandardMaterial({ color:0x707070, roughness:0.9, metalness:0.0 });
const matNeon = new THREE.MeshStandardMaterial({ color:0xff3366, emissive:0xff3366, emissiveIntensity:0.8, roughness:0.2, metalness:0.1 });
const materials = [matRebar, matCinder, matNeon];

const cubeGeo = new THREE.BoxGeometry(CELL_SIZE, CELL_SIZE, CELL_SIZE);

// ─────────── pulse system (downbeat collapse)
let pulsePhase = 0;
const PULSE_INTERVAL = 2.4;  // seconds between beats
let lastPulse = 0;

function onPulse(){
  // dissolve ~15% of solid cells above y=2 → falling state
  const candidates = cells.filter(c => c.state==='solid' && c.gy > 2);
  const count = Math.ceil(candidates.length * 0.15);
  for (let i = 0; i < count; i++){
    const c = candidates[Math.floor(Math.random()*candidates.length)];
    if (c.state === 'solid'){
      c.state = 'falling';
      c.vy = 0;
    }
  }
  // neon flash
  lightRim.intensity = 2.5;
}

function updateFalling(dt){
  for (const c of cells){
    if (c.state === 'falling'){
      c.vy -= 9.8 * dt;
      c.gy += c.vy * dt;
      if (c.gy < -5){
        // recycle: move back to mid-height, become solid again
        c.gy = 4 + Math.floor(Math.random()*4);
        c.gx += Math.floor((Math.random()-0.5)*6);
        c.gz += Math.floor((Math.random()-0.5)*6);
        c.state = 'solid';
        c.vy = 0;
      }
    }
  }
}

// ─────────── growth loop (burst every 0.5s)
let lastGrow = 0;
function growBurst(){
  const solidCells = cells.filter(c => c.state === 'solid');
  for (let i = 0; i < 5; i++){
    if (solidCells.length === 0) break;
    const seed = solidCells[Math.floor(Math.random()*solidCells.length)];
    growCell(seed);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let meshes = [];

function rebuildMeshes(){
  for (const m of meshes){ scene.remove(m); }
  meshes = [];
  for (const c of cells){
    const mat = materials[c.mat % 3];
    const mesh = new THREE.Mesh(cubeGeo, mat);
    mesh.position.set(c.gx*CELL_SIZE, c.gy*CELL_SIZE, c.gz*CELL_SIZE);
    scene.add(mesh);
    meshes.push(mesh);
  }
}
rebuildMeshes();

let lastTime = start;
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = Math.min((now - lastTime)/1000, 0.05);
  lastTime = now;

  // pulse check
  if (t - lastPulse >= PULSE_INTERVAL){
    lastPulse = t;
    onPulse();
  }
  // dim neon back
  lightRim.intensity += (0.8 - lightRim.intensity) * 0.08;

  // grow burst
  if (t - lastGrow >= 0.5){
    lastGrow = t;
    growBurst();
    rebuildMeshes();
  }

  // update falling
  updateFalling(dt);

  // sync mesh positions
  for (let i = 0; i < cells.length && i < meshes.length; i++){
    const c = cells[i];
    meshes[i].position.y = c.gy * CELL_SIZE;
  }

  // camera orbit
  const orbitRadius = 35;
  camera.position.x = Math.cos(t * 0.08) * orbitRadius;
  camera.position.z = Math.sin(t * 0.08) * orbitRadius;
  camera.position.y = 18 + Math.sin(t * 0.12) * 4;
  camera.lookAt(0, 6, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
