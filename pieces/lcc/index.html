<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lcc · harmattan instrument</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .panel {
    position:fixed; top:16px; right:16px; z-index:20;
    background: rgba(14,11,8,0.82); border:1px solid rgba(205,210,220,0.12);
    border-radius:6px; padding:14px 16px 10px; width:192px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .panel h3 {
    margin:0 0 10px; font-size:9px; text-transform:uppercase; letter-spacing:0.12em;
    color:rgba(205,210,220,0.45); font-weight:400;
  }
  .param { margin-bottom:9px; }
  .param label {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:10px; color:rgba(205,210,220,0.55); margin-bottom:3px; letter-spacing:0.03em;
  }
  .param label span { color:rgba(205,210,220,0.35); font-size:9px; }
  .param input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background:rgba(205,210,220,0.1); border-radius:2px; outline:none; cursor:pointer;
  }
  .param input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%;
    background:rgba(200,170,120,0.7); border:none; cursor:pointer;
  }
  .param input[type=range]::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%;
    background:rgba(200,170,120,0.7); border:none; cursor:pointer;
  }
</style>
</head>
<body>
<div class="id">lcc</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow · sliders to shape</div>

<div class="panel">
  <h3>parameters</h3>
  <div class="param">
    <label>density <span id="vDensity">80k</span></label>
    <input type="range" id="sDensity" min="0.1" max="1" step="0.01" value="1">
  </div>
  <div class="param">
    <label>gust <span id="vGust">auto</span></label>
    <input type="range" id="sGust" min="0" max="1" step="0.01" value="0.5">
  </div>
  <div class="param">
    <label>twist <span id="vTwist">0.90</span></label>
    <input type="range" id="sTwist" min="0" max="1" step="0.01" value="0.90">
  </div>
  <div class="param">
    <label>hue <span id="vHue">0°</span></label>
    <input type="range" id="sHue" min="0" max="1" step="0.005" value="0">
  </div>
  <div class="param">
    <label>grain <span id="vGrain">1.0×</span></label>
    <input type="range" id="sGrain" min="0.3" max="2.5" step="0.01" value="1.0">
  </div>
  <div class="param">
    <label>tempo <span id="vTempo">1.0×</span></label>
    <input type="range" id="sTempo" min="0.1" max="3.0" step="0.01" value="1.0">
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Slider state ── */
const sliders = {
  density: document.getElementById('sDensity'),
  gust:    document.getElementById('sGust'),
  twist:   document.getElementById('sTwist'),
  hue:     document.getElementById('sHue'),
  grain:   document.getElementById('sGrain'),
  tempo:   document.getElementById('sTempo'),
};
const labels = {
  density: document.getElementById('vDensity'),
  gust:    document.getElementById('vGust'),
  twist:   document.getElementById('vTwist'),
  hue:     document.getElementById('vHue'),
  grain:   document.getElementById('vGrain'),
  tempo:   document.getElementById('vTempo'),
};
function readSliders(){
  const d = +sliders.density.value;
  const g = +sliders.gust.value;
  const tw = +sliders.twist.value;
  const h = +sliders.hue.value;
  const gr = +sliders.grain.value;
  const te = +sliders.tempo.value;
  labels.density.textContent = Math.round(d*80)+'k';
  labels.gust.textContent    = g.toFixed(2);
  labels.twist.textContent   = tw.toFixed(2);
  labels.hue.textContent     = Math.round(h*360)+'°';
  labels.grain.textContent   = gr.toFixed(1)+'×';
  labels.tempo.textContent   = te.toFixed(1)+'×';
  return { density:d, gust:g, twist:tw, hue:h, grain:gr, tempo:te };
}

/* ── L-system ── */
const RULES = {
  'F': [
    { p:0.45, s:'FF[+F-F][-F+F][/F\\F]' },
    { p:0.30, s:'F[+F][-F]F' },
    { p:0.15, s:'F[/F][\\F]F' },
    { p:0.10, s:'F[+F-F]F[\\F/F]' },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const H=new THREE.Vector3(0,1,0), L=new THREE.Vector3(-1,0,0), U=new THREE.Vector3(0,0,1);
  const stack=[], segments=[];
  let pos=new THREE.Vector3(0,-7,0);
  let h=H.clone(), l=L.clone(), u=U.clone(), gen=0;
  const rotate=(axis,ang)=>{const q=new THREE.Quaternion().setFromAxisAngle(axis,ang);h.applyQuaternion(q);l.applyQuaternion(q);u.applyQuaternion(q);};
  for(const ch of str){
    switch(ch){
      case 'F':{const step=STEP_BASE*Math.pow(0.78,gen);const next=pos.clone().addScaledVector(h,step);segments.push({from:pos.clone(),to:next.clone(),gen});pos=next;break;}
      case '+':rotate(u,+ANGLE);break;case '-':rotate(u,-ANGLE);break;
      case '&':rotate(l,+ANGLE);break;case '^':rotate(l,-ANGLE);break;
      case '/':rotate(h,+ANGLE);break;case '\\':rotate(h,-ANGLE);break;
      case '[':stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen});gen+=1;break;
      case ']':{const f=stack.pop();pos=f.pos;h=f.h;l=f.l;u=f.u;gen=f.gen;break;}
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens=segments.map(s=>s.from.distanceTo(s.to));
  const total=lens.reduce((a,b)=>a+b,0);
  const positions=new Float32Array(totalN*3);
  const seeds=new Float32Array(totalN);
  const gens=new Float32Array(totalN);
  const v=new THREE.Vector3();
  let written=0;
  for(let i=0;i<segments.length;i++){
    const share=i===segments.length-1?totalN-written:Math.max(1,Math.floor(totalN*lens[i]/total));
    for(let k=0;k<share&&written<totalN;k++){
      const t=Math.random();
      v.lerpVectors(segments[i].from,segments[i].to,t);
      const jitter=0.04*Math.pow(0.85,segments[i].gen);
      v.x+=(Math.random()-0.5)*jitter;v.y+=(Math.random()-0.5)*jitter;v.z+=(Math.random()-0.5)*jitter;
      positions[written*3]=v.x;positions[written*3+1]=v.y;positions[written*3+2]=v.z;
      seeds[written]=Math.random();gens[written]=segments[i].gen;written++;
    }
  }
  return {positions,seeds,gens};
}

/* ── Scene ── */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200);
camera.position.set(10,5,18);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x0e0b08,1);
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,0,0);

const N=80000;
let geom,points;

const uniforms={
  uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()},
  uReady:{value:0}, uTwist:{value:0.92}, uGust:{value:0},
  uYMin:{value:-7.0}, uYMax:{value:6.0},
  uHue:{value:0.0}, uGrain:{value:1.0}, uDensity:{value:1.0},
};

const mat=new THREE.ShaderMaterial({
  uniforms, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime, uPixel, uReady, uTwist, uGust, uYMin, uYMax;
    uniform float uHue, uGrain, uDensity;
    attribute float seed;
    attribute float gen;
    varying vec3 vCol;
    varying float vAlpha;

    vec3 hueRotate(vec3 c, float angle){
      float s=sin(angle), co=cos(angle);
      vec3 k=vec3(0.57735);
      return c*co+cross(k,c)*s+k*dot(k,c)*(1.0-co);
    }

    void main(){
      /* density cull — particles above threshold shrink to zero */
      float visible = step(seed, uDensity);

      vec3 p=position;
      float t=uTime*0.5+seed*6.28;

      float sway=0.03*gen*(0.5+0.5*sin(t*0.7));
      p.x+=sway*sin(t+p.y*0.3)*(1.0-uTwist);
      p.z+=sway*cos(t*0.9+p.y*0.3)*(1.0-uTwist);

      vec3 entry=vec3(seed*4.0-2.0,25.0+seed*8.0,seed*4.0-2.0);
      p=mix(entry,p,smoothstep(0.0,1.0,uReady));

      float yNorm=clamp((p.y-uYMin)/(uYMax-uYMin),0.0,1.0);
      float theta=yNorm*6.2832;
      float sv=p.x*1.4+p.z*0.4;
      float R=5.0;
      float ht=theta*0.5;

      vec3 mPos;
      mPos.x=(R+sv*cos(ht))*cos(theta);
      mPos.z=(R+sv*cos(ht))*sin(theta);
      mPos.y=sv*sin(ht);

      float rot=uTwist*uTime*0.12;
      float cr=cos(rot),sr=sin(rot);
      vec3 mRot=vec3(mPos.x*cr-mPos.z*sr,mPos.y,mPos.x*sr+mPos.z*cr);

      float edgeDist=abs(sv)/(abs(sv)+0.8);
      float gustPhase=uTime*0.35+seed*6.28;
      float localGust=uGust*(0.5+0.5*sin(gustPhase*0.6+theta*2.0));

      vec3 windDir=normalize(vec3(0.75,0.18,0.55));
      float surfaceShift=localGust*0.4*(0.2+0.8*edgeDist);
      mRot+=windDir*surfaceShift;

      float detach=smoothstep(0.5,0.9,edgeDist)*smoothstep(0.4,0.85,seed);
      float peel=detach*uGust*2.8;
      mRot+=windDir*peel;
      mRot.y-=peel*0.35;

      float tremor=edgeDist*localGust*0.18;
      mRot.x+=tremor*sin(uTime*9.0+seed*40.0);
      mRot.z+=tremor*cos(uTime*7.5+seed*35.0);

      p=mix(p,mRot,uTwist);

      /* palette — El Anatsui with hue rotation */
      float energy=0.5+0.5*sin(t*0.5);
      vec3 ochre =vec3(0.78,0.58,0.30);
      vec3 sienna=vec3(0.52,0.34,0.22);
      vec3 dust  =vec3(0.92,0.84,0.66);
      vec3 copper=vec3(0.72,0.45,0.28);

      float stripK=yNorm;
      vec3 warmCol=mix(sienna,ochre,stripK);
      warmCol=mix(warmCol,copper,edgeDist*0.4);
      warmCol=mix(warmCol,dust,detach*uGust*0.8);
      warmCol+=0.04*vec3(sin(theta*3.0)*0.5+0.5,sin(theta*3.0+1.5)*0.3,0.0);

      vec3 silver=vec3(0.65,0.72,0.88);
      float silverBleed=(1.0-uGust)*0.15;
      warmCol=mix(warmCol,silver,silverBleed*(1.0-edgeDist));

      vCol=mix(vec3(0.45,0.30,0.20),warmCol,uTwist);
      vCol=hueRotate(vCol, uHue*6.2832);

      vAlpha=(0.55+0.45*energy)*(1.0-detach*uGust*0.4)*visible;

      vec4 mv=modelViewMatrix*vec4(p,1.0);
      float dist=-mv.z;
      gl_PointSize=(1.0+0.6*energy)*uPixel*(42.0/dist)*(0.4+0.6*uReady)*uGrain*visible;
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d=gl_PointCoord-0.5;
      float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*16.0)*vAlpha;
      if(a<0.003) discard;
      gl_FragColor=vec4(vCol*a,a);
    }
  `
});

let revealStart=0;
let treeBB={yMin:-7,yMax:6};

function regrow(seed){
  let s=seed>>>0;
  const rng=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const str=expand('F',5,rng);
  const segs=turtle(str);
  const bb=new THREE.Box3();
  for(const sg of segs){bb.expandByPoint(sg.from);bb.expandByPoint(sg.to);}
  const ctr=bb.getCenter(new THREE.Vector3());
  const mn=bb.min;
  for(const sg of segs){sg.from.x-=ctr.x;sg.from.z-=ctr.z;sg.from.y-=mn.y-(-7);sg.to.x-=ctr.x;sg.to.z-=ctr.z;sg.to.y-=mn.y-(-7);}
  const bb2=new THREE.Box3();
  for(const sg of segs){bb2.expandByPoint(sg.from);bb2.expandByPoint(sg.to);}
  treeBB.yMin=bb2.min.y;treeBB.yMax=bb2.max.y;
  uniforms.uYMin.value=treeBB.yMin;uniforms.uYMax.value=treeBB.yMax;

  const{positions,seeds,gens}=buildParticles(segs,N);
  if(!geom){
    geom=new THREE.BufferGeometry();
    geom.setAttribute('position',new THREE.BufferAttribute(positions,3));
    geom.setAttribute('seed',new THREE.BufferAttribute(seeds,1));
    geom.setAttribute('gen',new THREE.BufferAttribute(gens,1));
    points=new THREE.Points(geom,mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);geom.attributes.position.needsUpdate=true;
    geom.attributes.seed.array.set(seeds);geom.attributes.seed.needsUpdate=true;
    geom.attributes.gen.array.set(gens);geom.attributes.gen.needsUpdate=true;
  }
  geom.computeBoundingSphere();
  revealStart=performance.now();
}

regrow(Math.floor(Math.random()*1e9));
addEventListener('click',e=>{
  if(e.target.closest('.panel'))return;
  regrow(Math.floor(Math.random()*1e9));
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function smoothstep(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);}

const orbitTarget=new THREE.Vector3(0,0,0);
const start=performance.now();
let virtualTime=0, lastFrame=start;

function loop(){
  const now=performance.now();
  const params=readSliders();
  const dt=(now-lastFrame)/1000;
  lastFrame=now;
  virtualTime+=dt*params.tempo;

  uniforms.uTime.value=virtualTime;
  uniforms.uHue.value=params.hue;
  uniforms.uGrain.value=params.grain;
  uniforms.uDensity.value=params.density;

  if(revealStart>0){
    uniforms.uReady.value=Math.min(1.0,(now-revealStart)/2200);
  }

  const twistBase=params.twist;
  const relax=0.12*smoothstep(0,2,(virtualTime%24)-18)*(1-smoothstep(0,2,(virtualTime%24)-22));
  uniforms.uTwist.value=Math.max(0.0,twistBase-relax);

  /* gust: slider sets center intensity, auto-modulation around it */
  const gustCenter=params.gust;
  const gustSlow=gustCenter*Math.pow(Math.sin(virtualTime*0.22)*0.5+0.5,1.8);
  const gustMed=gustCenter*0.22*Math.sin(virtualTime*0.73+1.0);
  const gustFast=gustCenter*0.1*Math.sin(virtualTime*1.9+2.5);
  uniforms.uGust.value=Math.max(0,Math.min(1,gustSlow+gustMed+gustFast));

  const gust=uniforms.uGust.value;
  orbitTarget.x=gust*0.6;
  orbitTarget.y=gust*-0.2;
  controls.target.lerp(orbitTarget,0.03);
  controls.update();

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
