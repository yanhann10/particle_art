<!doctype html>
<html lang="en">
<head>
<!-- MOTION: drift, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>exd · trailing shells</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0a0410;overflow:hidden}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:0.06em;color:#cdd2dc;z-index:10}
.hint{position:fixed;left:14px;top:14px;opacity:0.55;font-size:11px;
      font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:0.04em;color:#cdd2dc;z-index:10}
</style>
</head>
<body>
<div class="id">exd</div>
<div class="hint" id="hint">click for mic · synthetic mode</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

/* ── render targets for feedback ── */
function makeRT(){
  return new THREE.WebGLRenderTarget(
    innerWidth * Math.min(devicePixelRatio, 2),
    innerHeight * Math.min(devicePixelRatio, 2),
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat, type: THREE.HalfFloatType }
  );
}
let rtA = makeRT(), rtB = makeRT();

/* ── particle scene ── */
const particleScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);

const SHELLS = 5, PER_SHELL = 4000, N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
for (let s = 0; s < SHELLS; s++){
  for (let i = 0; i < PER_SHELL; i++){
    const idx = s * PER_SHELL + i;
    const r = 4 + s * 2.4;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uBands:  { value: uBands },
  uTreble: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      float e;
      if(shellIdx<0.5)      e=uBands.x;
      else if(shellIdx<1.5) e=uBands.y;
      else if(shellIdx<2.5) e=uBands.z;
      else if(shellIdx<3.5) e=uBands.w;
      else                  e=uTreble;
      vEnergy=e;

      vec3 p=position;
      float r=length(p);
      vec3 dir=p/max(r,0.001);
      float pulse=1.0+e*0.9;
      p=dir*r*pulse;

      float t=uTime*0.4+seed*6.28+shellIdx*0.7;
      vec3 perp=normalize(cross(dir,vec3(0,1,0)+0.1*sin(seed*9.0)));
      p+=perp*sin(t)*(0.4+e*1.2);

      // palette: sodium-amber core → ice-cyan outer → violet at high energy
      vec3 amber  = vec3(0.98, 0.68, 0.22);
      vec3 cyan   = vec3(0.25, 0.85, 0.95);
      vec3 violet = vec3(0.72, 0.28, 0.92);
      float k=clamp(shellIdx/4.0+e*0.4,0.0,1.0);
      vCol=mix(amber,cyan,k);
      vCol=mix(vCol,violet,e*0.35);
      vCol*=(0.55+e*1.2);

      vec4 mv=modelViewMatrix*vec4(p,1.0);
      float dist=-mv.z;
      gl_PointSize=(1.0+2.2*e)*uPixel*(48.0/dist);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d=gl_PointCoord-0.5;
      float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*16.0)*(0.38+0.52*vEnergy);
      gl_FragColor=vec4(vCol*a,a);
    }
  `
});
const points = new THREE.Points(geom, mat);
particleScene.add(points);

/* ── feedback composite scene ── */
const quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadGeo = new THREE.PlaneGeometry(2,2);

const feedbackScene = new THREE.Scene();
const feedbackMat = new THREE.ShaderMaterial({
  uniforms: {
    tPrev:  { value: null },
    uDecay: { value: 0.925 },
    uAvgE:  { value: 0.25 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tPrev;
    uniform float uDecay;
    uniform float uAvgE;
    varying vec2 vUv;
    void main(){
      // subtle outward bloom distortion
      vec2 center=vec2(0.5);
      vec2 dir=vUv-center;
      float dist=length(dir);
      vec2 uv=vUv+dir*(0.0012+uAvgE*0.001);

      vec4 prev=texture2D(tPrev,uv);
      // chromatic decay: blues linger, ambers fade first → trails shift cool
      float d=uDecay+uAvgE*0.03;
      prev.r*=d*0.97;
      prev.g*=d*0.98;
      prev.b*=d*1.01;
      // gentle vignette on feedback to keep edges clean
      float vig=1.0-smoothstep(0.4,0.72,dist);
      prev*=mix(0.92,1.0,vig);
      gl_FragColor=prev;
    }
  `,
  depthTest: false, depthWrite: false
});
feedbackScene.add(new THREE.Mesh(quadGeo, feedbackMat));

const displayScene = new THREE.Scene();
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    tBuffer: { value: null },
    uGrain:  { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tBuffer;
    uniform float uGrain;
    varying vec2 vUv;

    float hash(vec2 p){
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }

    void main(){
      vec4 col=texture2D(tBuffer,vUv);
      // film grain — photochemical imperfection (Lia Halloran)
      float g=hash(vUv*vec2(1920.0,1080.0)+uGrain)*0.04-0.02;
      col.rgb+=g;
      // subtle tone mapping to prevent additive blowout
      col.rgb=col.rgb/(1.0+col.rgb*0.3);
      gl_FragColor=vec4(col.rgb,1.0);
    }
  `,
  depthTest: false, depthWrite: false
});
displayScene.add(new THREE.Mesh(quadGeo, displayMat));

/* ── resize ── */
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  const w=innerWidth*Math.min(devicePixelRatio,2);
  const h=innerHeight*Math.min(devicePixelRatio,2);
  rtA.setSize(w,h);
  rtB.setSize(w,h);
});

/* ── audio ── */
const hint=document.getElementById('hint');
let analyser=null, freqData=null, micActive=false;

async function startAudio(){
  if(micActive) return;
  micActive=true;
  hint.textContent='requesting mic…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();
    analyser.fftSize=512;
    analyser.smoothingTimeConstant=0.7;
    src.connect(analyser);
    freqData=new Uint8Array(analyser.frequencyBinCount);
    hint.textContent='live · trailing shells';
  }catch(e){
    hint.textContent='mic denied · synthetic trails';
    micActive=false;
  }
}
addEventListener('click',startAudio,{once:true});

function bandEnergy(arr,lo,hi){
  let s=0;
  for(let i=lo;i<hi;i++) s+=arr[i];
  return(s/(hi-lo))/255;
}

/* ── loop ── */
const start=performance.now();
function loop(){
  const t=(performance.now()-start)/1000;
  uniforms.uTime.value=t;
  // very slow drift instead of rotation — intentional departure from parent
  points.rotation.y=Math.sin(t*0.025)*0.3;
  points.rotation.x=Math.sin(t*0.018+1.0)*0.15;

  let avgE;
  if(analyser){
    analyser.getByteFrequencyData(freqData);
    const n=freqData.length;
    uBands.x=bandEnergy(freqData,0,Math.floor(n*0.04));
    uBands.y=bandEnergy(freqData,Math.floor(n*0.04),Math.floor(n*0.12));
    uBands.z=bandEnergy(freqData,Math.floor(n*0.12),Math.floor(n*0.30));
    uBands.w=bandEnergy(freqData,Math.floor(n*0.30),Math.floor(n*0.55));
    uniforms.uTreble.value=bandEnergy(freqData,Math.floor(n*0.55),n);
    avgE=(uBands.x+uBands.y+uBands.z+uBands.w+uniforms.uTreble.value)/5;
  }else{
    // synthetic envelopes — musically varied, always alive
    uBands.x=0.35+0.35*Math.sin(t*1.3);
    uBands.y=0.30+0.30*Math.sin(t*2.1+1.1);
    uBands.z=0.25+0.25*Math.sin(t*3.0+2.0);
    uBands.w=0.20+0.20*Math.sin(t*4.7+0.4);
    uniforms.uTreble.value=0.18+0.18*Math.sin(t*7.0);
    avgE=(uBands.x+uBands.y+uBands.z+uBands.w+uniforms.uTreble.value)/5;
  }

  // feedback decay adapts to energy: more energy → longer trails
  feedbackMat.uniforms.uDecay.value=0.91+avgE*0.06;
  feedbackMat.uniforms.uAvgE.value=avgE;
  displayMat.uniforms.uGrain.value=t*60.0;

  // ── render pipeline ──
  // 1. Composite faded previous frame into rtB
  renderer.setRenderTarget(rtB);
  renderer.clear();
  feedbackMat.uniforms.tPrev.value=rtA.texture;
  renderer.render(feedbackScene, quadCam);

  // 2. Render particles on top of rtB (no clear, additive)
  renderer.render(particleScene, camera);

  // 3. Display rtB to screen
  renderer.setRenderTarget(null);
  renderer.clear();
  displayMat.uniforms.tBuffer.value=rtB.texture;
  renderer.render(displayScene, quadCam);

  // 4. Swap
  const tmp=rtA; rtA=rtB; rtB=tmp;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
