<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h28 · Shiota — Two Home Countries</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">h28</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Single warm point light near the sphere — darkness is primary material
const warmL = new THREE.PointLight(0xff3010, 0.025, 50, 2.0);
warmL.position.set(1.0, 5.0, -2.0);
scene.add(warmL);
scene.add(new THREE.AmbientLight(0x050101, 0.004));

let seed = 7193842;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:28, h:22, d:24 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE SPHERE — the still center. Shiota's Two Home Countries:
// a pale sphere suspended in arterial red, the moon caught
// in a circulatory cosmos, a home you can see but never reach.
const sphereCenter = new THREE.Vector3(0.0, 0.8, 0.0);
const sphereR = 1.6;

const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xede4d0,
    emissive: 0xede4d0,
    emissiveIntensity: 0.7,
    roughness: 0.9,
    transparent: true,
    opacity: 0.32
  })
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

// Surface point on sphere
function sphereSurfPt(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y+Math.cos(v)*sphereR,
    sphereCenter.z+Math.sin(v)*Math.sin(u)*sphereR
  );
}

// ── FRAGMENTS — dark torn paper/charred matter caught in the web
// In Silence: the memory of fire, scraps of diary pages
const fragments = [];
for(let i=0; i<14; i++){
  const pts = [];
  const s = 0.05+rng()*0.12;
  const corners = [];
  for(let c=0; c<4; c++){
    const ca=(c/4)*Math.PI*2+rng()*0.5;
    const cr=s*(0.4+rng());
    corners.push(new THREE.Vector3(Math.cos(ca)*cr, Math.sin(ca)*cr, (rng()-0.5)*s*0.25));
  }
  for(let c=0; c<4; c++){
    const n=(c+1)%4;
    pts.push(corners[c].x,corners[c].y,corners[c].z, corners[n].x,corners[n].y,corners[n].z);
  }
  pts.push(corners[0].x,corners[0].y,corners[0].z, corners[2].x,corners[2].y,corners[2].z);
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x080503, transparent:true, opacity:0.4
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=2.8+rng()*6.5;
  fMesh.position.set(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.75,
    sphereCenter.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — cylindrical channels of negative space
// Tyler Hobbs: deliberate absence the camera can peer through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.7;
  const vr=5.0+rng()*3.5;
  voids.push({ x:sphereCenter.x+Math.cos(a)*vr, z:sphereCenter.z+Math.sin(a)*vr, r:1.4+rng()*0.6 });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz<v.r*v.r) return true;
  }
  return false;
}

// ── TRUNCATED-ICOSAHEDRON ANCHORS
// Manfred Mohr: let geometry generate the topology
const icoGeo = new THREE.IcosahedronGeometry(1, 2);
const icoPos = icoGeo.attributes.position;
const icoNormals = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNormals.push(v); }
}

const anchors = [];
const shellRadii = [3.0, 5.5, 8.0, 10.5, 12.5];
for(const sr of shellRadii){
  for(const n of icoNormals){
    const pt = new THREE.Vector3(
      sphereCenter.x+n.x*sr,
      sphereCenter.y+n.y*sr*0.82,
      sphereCenter.z+n.z*sr
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
      anchors.push(pt);
    }
  }
}
// Wall anchors
for(let i=0; i<50; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── BUILD THREAD NETWORK — 20,000 line budget
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES); // 0=suspension, 1=convergence, 2=proximity, 3=dendrite
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION THREADS — from ceiling to sphere top
// Tomas Saraceno: make the hanging physically legible
for(let i=0; i<10; i++){
  const a=(i/10)*Math.PI*2+(rng()-0.5)*0.12;
  const spread=0.15+rng()*0.25;
  const top = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*spread*3.0, hh, sphereCenter.z+Math.sin(a)*spread*3.0
  );
  const bot = new THREE.Vector3(
    sphereCenter.x+Math.cos(a)*0.06, sphereCenter.y-sphereR*0.9, sphereCenter.z+Math.sin(a)*0.06
  );
  setLine(top, bot, 0);
}

// ── CONVERGENCE — every thread a reaching hand toward the sphere
// The web wraps the remembered home — blood vessels around a heart
for(let i=0; i<anchors.length && li<NUM_LINES-4000; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  const count = d<4.0?5 : d<7.0?3 : d<10?2 : 1;
  for(let j=0; j<count && li<NUM_LINES-4000; j++){
    const target = sphereSurfPt();
    // Quayola: 10% of threads stop short — yearning, not arriving
    if(rng()<0.10){
      const dir = a.clone().sub(target).normalize();
      const gap = 0.2+rng()*1.2;
      setLine(a, target.clone().add(dir.multiplyScalar(gap)), 1);
    } else {
      setLine(a, target, 1);
    }
  }
}

// ── PROXIMITY WEB — anchor-to-anchor within threshold
// Casey Reas: density emerges from proximity alone
const THRESH = 5.0;
let lat=0, att=0;
while(lat<5000 && li<NUM_LINES-2000 && att<40000){
  att++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<12; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  lat++;
}

// ── DENDRITIC BRANCHES — short Y-forking chains
// Entangled Others: the network grows, not merely connects
for(let i=0; i<160 && li<NUM_LINES-6; i++){
  const root = anchors[Math.floor(rng()*anchors.length)];
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const segLen = 0.5+rng()*0.8;
  let cur = root.clone();
  for(let g=0; g<3 && li<NUM_LINES; g++){
    const next = cur.clone().add(dir.clone().multiplyScalar(segLen*(0.7**g)));
    dir.x+=(rng()-0.5)*0.5; dir.y+=(rng()-0.5)*0.35; dir.z+=(rng()-0.5)*0.5;
    dir.normalize();
    if(Math.abs(next.x)<hw && Math.abs(next.y)<hh && Math.abs(next.z)<hd){
      setLine(cur, next, 3);
      if(g===1 && rng()>0.45){
        const fk = dir.clone();
        fk.x+=(rng()-0.5)*1.1; fk.z+=(rng()-0.5)*1.1; fk.normalize();
        setLine(cur, cur.clone().add(fk.multiplyScalar(segLen*0.35)), 3);
      }
      cur = next;
    }
  }
}

// ── RADIAL FILAMENTS — threads radiating outward from sphere
// Like blood vessels or roots — the sphere's circulatory halo
for(let i=0; i<800 && li<NUM_LINES; i++){
  const sp = sphereSurfPt();
  const dir = sp.clone().sub(sphereCenter).normalize();
  dir.x+=(rng()-0.5)*0.3; dir.y+=(rng()-0.5)*0.2; dir.z+=(rng()-0.5)*0.3;
  dir.normalize();
  const len = 1.2+rng()*4.5;
  const end = sp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(sp, end, 3);
  }
}

// ── FILL remaining budget with long wall-to-sphere/anchor spans
while(li<NUM_LINES){
  const a=wallPt();
  const b=rng()<0.4 ? sphereSurfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single arterial red #c20018, per-category opacity
// Lia Halloran: depth through material differentiation
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.10, 0.07, 0.04, 0.035];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.12, 1.0-d*0.028);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  // Near the sphere, threads warm slightly — proximity to the heart
  const warmShift = d<4.0 ? 0.012*(1.0-d/4.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.4;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA DOLLY — a pilgrimage: enter the web from the dark,
// approach the sphere like approaching a lantern in a cathedral,
// circle it close enough to feel the threads cross your face,
// descend, rise, and finally recede into the arterial dark.
const pathLen = 2800;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;
  let x, y, z;

  if(t<0.07){
    // Far approach — the sphere is a pale glow in a red universe
    const lt=t/0.07;
    x = cx+12.0-lt*3.5;
    y = cy+2.0-lt*0.5;
    z = cz+7.0-lt*2.0;
  } else if(t<0.18){
    // Enter through a void corridor — threads part around you
    const lt=(t-0.07)/0.11;
    const rH=7.5-lt*3.0;
    const angle=lt*Math.PI*0.55+0.5;
    x = cx+Math.cos(angle)*rH;
    y = cy+1.5-lt*0.8;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.32){
    // Close orbit — the sphere at arm's length, threads crossing sight
    const lt=(t-0.18)/0.14;
    const rH=4.0+Math.sin(lt*Math.PI)*0.4;
    const angle=lt*Math.PI*1.3+1.2;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.3+Math.sin(lt*Math.PI*0.7)*0.8;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.42){
    // Face the sphere — stillness, the home you cannot enter
    const lt=(t-0.32)/0.10;
    x = cx+Math.sin(lt*Math.PI*0.12+2.7)*3.4;
    y = cy+0.5+lt*0.3;
    z = cz+Math.cos(lt*Math.PI*0.12+2.7)*3.2;
  } else if(t<0.52){
    // Descend — look up through the radial filaments
    const lt=(t-0.42)/0.10;
    x = cx+Math.sin(lt*Math.PI*0.25+3.0)*3.6;
    y = cy-lt*5.5;
    z = cz+Math.cos(lt*Math.PI*0.25+3.0)*3.4;
  } else if(t<0.62){
    // Below — the sphere overhead, threads hanging like roots
    const lt=(t-0.52)/0.10;
    const rH=3.5+lt*0.5;
    const angle=lt*Math.PI*0.45+3.3;
    x = cx+Math.cos(angle)*rH;
    y = cy-5.5+lt*2.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.74){
    // Rise through the web's body — immersed in thread
    const lt=(t-0.62)/0.12;
    x = cx+Math.sin(lt*Math.PI*0.8+4.0)*2.8;
    y = cy-3.5+lt*10.5;
    z = cz+Math.cos(lt*Math.PI*0.8+4.0)*3.0;
  } else if(t<0.85){
    // Above — looking down through suspension threads at the sphere
    const lt=(t-0.74)/0.11;
    const rH=3.0+lt*2.0;
    const angle=lt*Math.PI*0.5+5.2;
    x = cx+Math.cos(angle)*rH;
    y = cy+7.0-lt*2.5;
    z = cz+Math.sin(angle)*rH;
  } else {
    // Recede — the sphere fades, the web reclaims the dark
    const lt=(t-0.85)/0.15;
    const rH=5.0+lt*7.0;
    x = cx+Math.cos(lt*Math.PI*0.18+6.0)*rH;
    y = cy+4.5-lt*2.5;
    z = cz+Math.sin(lt*Math.PI*0.18+6.0)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — nearly imperceptible, glacial
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.02+basePositions[idx+1]*0.03+i*0.00008;
    const breath = Math.sin(elapsed*0.0008+phase)*0.00003;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.05;
      arr[vi+1] = basePositions[vi+1] + breath*0.035;
      arr[vi+2] = basePositions[vi+2] + breath*0.045;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — very slow, contemplative
  const speed = 0.000035;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at the sphere — the still center
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00012)*0.03;
  look.y += Math.cos(elapsed*0.00011)*0.06;
  look.z += Math.sin(elapsed*0.00025+0.5)*0.025;
  camera.lookAt(look);

  // Light breathes with the web
  warmL.intensity = 0.025+Math.sin(elapsed*0.00008)*0.004;

  // Sphere pulses very faintly
  sphereMesh.material.emissiveIntensity = 0.7+Math.sin(elapsed*0.0001)*0.04;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
