<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oig · Shiota — Archive Drift</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">oig</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.002));
const key1 = new THREE.PointLight(0x1a0505, 0.007, 32, 2.5);
key1.position.set(-7, 9, 5);
scene.add(key1);

const key2 = new THREE.PointLight(0x140303, 0.004, 28, 2.3);
key2.position.set(5, -6, -7);
scene.add(key2);

let seed = 734651;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ROOM VOLUME
const ROOM = { w: 28, h: 18, d: 24 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED KEY — the remembered object
const keyPos = new THREE.Vector3(-1.2, 0.8, 0.5);

const keyGeo = new THREE.BoxGeometry(0.22, 3.8, 0.22);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xd8cfc0,
  emissive: 0xb8a890,
  emissiveIntensity: 0.58,
  roughness: 0.92,
  metalness: 0.08
});
const keyShaft = new THREE.Mesh(keyGeo, keyMat);
keyShaft.position.copy(keyPos);
keyShaft.position.y -= 1.4;
scene.add(keyShaft);

const headGeo = new THREE.TorusGeometry(0.85, 0.18, 12, 20);
const keyHead = new THREE.Mesh(headGeo, keyMat);
keyHead.position.copy(keyPos);
keyHead.position.y += 1.2;
keyHead.rotation.x = Math.PI*0.5;
scene.add(keyHead);

const teethGeo = new THREE.BoxGeometry(1.2, 0.18, 0.22);
const keyTeeth = new THREE.Mesh(teethGeo, keyMat);
keyTeeth.position.copy(keyPos);
keyTeeth.position.y -= 3.4;
keyTeeth.position.x += 0.3;
scene.add(keyTeeth);

const keyGlow = new THREE.PointLight(0x180404, 0.005, 8, 2.8);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// KEY ANCHOR POINTS — on object surface
const keyAnchors = [];

// Shaft anchors
for(let i=0; i<42; i++){
  const t = i/41;
  const y = keyPos.y - 1.4 + (t-0.5)*3.8;
  const angle = (i%4)*(Math.PI*0.5);
  const x = keyPos.x + Math.cos(angle)*0.11;
  const z = keyPos.z + Math.sin(angle)*0.11;
  keyAnchors.push(new THREE.Vector3(x, y, z));
}

// Head anchors
for(let i=0; i<28; i++){
  const angle = (i/28)*Math.PI*2;
  const x = keyPos.x + Math.cos(angle)*0.85;
  const y = keyPos.y + 1.2;
  const z = keyPos.z + Math.sin(angle)*0.18;
  keyAnchors.push(new THREE.Vector3(x, y, z));
}

// Teeth anchors
for(let i=0; i<8; i++){
  const x = keyPos.x + 0.3 + (i/7 - 0.5)*1.2;
  const y = keyPos.y - 3.4;
  const z = keyPos.z + (i%2 === 0 ? 0.11 : -0.11);
  keyAnchors.push(new THREE.Vector3(x, y, z));
}

// WALL ANCHORS
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<120; i++) anchors.push(wallPt());

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to key top
const suspCount = 12;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2;
  const r = 0.6 + rng()*0.4;
  const x = keyPos.x + Math.cos(angle)*r;
  const z = keyPos.z + Math.sin(angle)*r;
  const y = keyPos.y + 2.8 + rng()*0.3;
  const sp = new THREE.Vector3(x, y, z);
  
  const ceilX = sp.x + (rng()-0.5)*1.0;
  const ceilZ = sp.z + (rng()-0.5)*1.0;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sp);
}

// CONVERGENCE THREADS — wall anchors to key (gathering the memory)
const convergeBudget = 9200;
for(let i=0; i<convergeBudget && li<NUM_LINES-10600; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 2.5) continue;
  
  let closest = keyAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<5; k++){
    const candidate = keyAnchors[Math.floor(rng()*keyAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 15% stop short — threads that almost reach but fail
  if(rng()<0.15){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.35 + rng()*0.52);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// RADIATING THREADS FROM KEY — the dispersal
for(let i=0; i<620 && li<NUM_LINES-8800; i++){
  const ka = keyAnchors[Math.floor(rng()*keyAnchors.length)];
  const dir = ka.clone().sub(keyPos).normalize();
  dir.x += (rng()-0.5)*0.7;
  dir.y += (rng()-0.5)*0.6;
  dir.z += (rng()-0.5)*0.7;
  dir.normalize();
  const len = 3.8 + rng()*10.5;
  const end = ka.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(ka, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor membrane
const THRESH = 6.8;
let webCount = 0, attempts = 0;
while(webCount<5200 && li<NUM_LINES-3400 && attempts<28000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<7; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>1.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// DENDRITIC BRANCHES near key — morphogenetic growth
for(let i=0; i<180 && li<NUM_LINES-2600; i++){
  const startDist = 4.2 + rng()*7.5;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.8;
  const start = keyPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.0,
    (rng()-0.5)*1.6,
    (rng()-0.5)*2.0
  ).normalize();
  
  const segLen = 1.1 + rng()*0.8;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-16 && rng()<0.58){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.48 + rng()*0.62
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.70));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-14 && rng()<0.40){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.48 - rng()*0.62
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.66));
      setLine(p1, p2b);
    }
  }
}

// HORIZONTAL CROSSING THREADS
for(let i=0; i<420 && li<NUM_LINES-1600; i++){
  const y = keyPos.y + (rng()-0.5)*6.5;
  const x1 = -hw + rng()*4.0;
  const z1 = (rng()-0.5)*ROOM.d*0.82;
  const x2 = hw - rng()*4.0;
  const z2 = (rng()-0.5)*ROOM.d*0.82;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS — floor to ceiling
for(let i=0; i<280 && li<NUM_LINES-1000; i++){
  const x = (rng()-0.5)*ROOM.w*0.80;
  const z = (rng()-0.5)*ROOM.d*0.80;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.2, hh, z + (rng()-0.5)*1.2);
  setLine(a, b);
}

// WALL-TO-WALL SPANS
let wallSpans = 0;
while(wallSpans<1600 && li<NUM_LINES-600){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>5.5 && d<19.0){
    setLine(a, b);
    wallSpans++;
  }
}

// FILL remaining capacity
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>5.8 && d<16.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.068,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, slow drift around the suspended key
const pathLen = 3200;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.22){
    // Approach from upper-right front
    const lt = t/0.22;
    const angle = Math.PI*0.20 + lt*Math.PI*0.45;
    const r = 14.0 - lt*4.5;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 6.5 - lt*3.5;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.46){
    // Circle left side at mid-height
    const lt = (t-0.22)/0.24;
    const angle = Math.PI*0.65 + lt*Math.PI*0.90;
    const r = 9.5 + Math.sin(lt*Math.PI*1.3)*1.1;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 1.0 + Math.cos(lt*Math.PI*1.4)*0.8;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.68){
    // Descend below, looking up through red mesh
    const lt = (t-0.46)/0.22;
    const angle = Math.PI*1.55 + lt*Math.PI*0.75;
    const r = 8.5 + Math.cos(lt*Math.PI)*1.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - lt*7.8;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, key silhouetted against void
    const lt = (t-0.68)/0.32;
    const angle = Math.PI*2.30 + lt*Math.PI*0.50;
    const r = 8.2 + lt*6.5;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 3.0 + lt*4.5;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.40%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.016 + basePositions[idx+1]*0.024 + i*0.000042;
    const breath = Math.sin(elapsed*0.00030 + phase)*0.000011;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.010;
      arr[vi+1] = basePositions[vi+1] + breath*0.008;
      arr[vi+2] = basePositions[vi+2] + breath*0.012;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Key subtle rotation
  keyShaft.rotation.y = Math.sin(elapsed*0.000034)*0.012;
  keyHead.rotation.z = Math.cos(elapsed*0.000026)*0.009;
  keyTeeth.rotation.y = Math.sin(elapsed*0.000030)*0.008;

  // Camera dolly
  const speed = 0.000015;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward key with drift
  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000068)*0.16,
    keyPos.y + Math.cos(elapsed*0.000052)*0.14,
    keyPos.z + Math.sin(elapsed*0.000040)*0.13
  );

  key1.intensity = 0.007 + Math.sin(elapsed*0.000046)*0.0034;
  keyGlow.intensity = 0.005 + Math.sin(elapsed*0.000058)*0.0026;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
