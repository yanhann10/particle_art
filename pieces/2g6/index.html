<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2g6 · Calder-balance · mobile tip</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">2g6</div>
<div class="hint">drag to orbit · click to pause/resume · watch for the tip</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Arabesque differential-growth ribbon (from er3/ajo lineage)
// SURPRISE: Calder mobile — flat red/black shapes dangle from the ribbon
// on thin wires, and periodically the ENTIRE structure tips dramatically
// to one side like an unbalanced mobile, holds… then gracefully recovers.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.018);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.1);
lightKey.position.set(6, 12, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.5));
const lightFill = new THREE.DirectionalLight(0x405078, 0.4);
lightFill.position.set(-6, 4, -4);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─── pivot group: entire sculpture tips via this ───
const pivot = new THREE.Group();
scene.add(pivot);

// ─── differential growth (inherited from ajo/5gm) ───
const MAX_VERTS = 1400;
const ATTRACT = 0.06, REPEL_R = 0.55, REPEL_STR = 0.14;
const NOISE = 0.003, PRESSURE = 0.0030, RISE = 0.0045, MAX_D = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0, cy2=0, cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for (let i=0;i<n;i++){
    const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0014;
  }
  const grown = [];
  for (let i=0;i<n;i++){
    const a=verts[i],b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,
        age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for (const v of grown) verts.push(v);
}
for (let s=0;s<1200;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

// ─── ribbon material (gold) ───
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0xc9a45a, emissive: 0x2a1a06,
  roughness: 0.32, metalness: 0.7, side: THREE.DoubleSide
});
let ribbonMesh = null;

// ─── Calder mobile elements ───
// Flat shapes hanging from thin wires off the ribbon.
// Palette: Calder's primary vocabulary — vermillion, matte black, a single
// cadmium yellow — against the gold ribbon. Restrained, not loud.
const MOBILE_COUNT = 18;
const CALDER_COLORS = [
  0xc4291c, // Calder vermillion
  0x1a1a1a, // matte black
  0xc4291c,
  0x1a1a1a,
  0xd4a820, // cadmium yellow (rare accent)
];

// Shape geometries: circles, crescents, small triangles
const shapeGeos = [];
// Flat disc
const discGeo = new THREE.CircleGeometry(0.32, 20);
shapeGeos.push(discGeo);
// Larger ellipse-ish disc
const bigDisc = new THREE.CircleGeometry(0.45, 20);
shapeGeos.push(bigDisc);
// Triangle
const triShape = new THREE.Shape();
triShape.moveTo(0, 0.38); triShape.lineTo(-0.3, -0.18); triShape.lineTo(0.3, -0.18);
triShape.closePath();
const triGeo = new THREE.ShapeGeometry(triShape);
shapeGeos.push(triGeo);
// Small disc
const smallDisc = new THREE.CircleGeometry(0.2, 16);
shapeGeos.push(smallDisc);

// Wire material
const wireMat = new THREE.LineBasicMaterial({ color: 0x888888, transparent: true, opacity: 0.5 });

// Create mobile elements
const mobileGroup = new THREE.Group();
pivot.add(mobileGroup);

const mobiles = [];
for (let i = 0; i < MOBILE_COUNT; i++){
  const geo = shapeGeos[i % shapeGeos.length];
  const mat = new THREE.MeshStandardMaterial({
    color: CALDER_COLORS[i % CALDER_COLORS.length],
    roughness: 0.6, metalness: 0.15,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);

  // Wire (line from attachment point down to shape)
  const wireGeo = new THREE.BufferGeometry();
  wireGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
  const wire = new THREE.Line(wireGeo, wireMat);

  mobileGroup.add(wire);
  mobileGroup.add(mesh);

  mobiles.push({
    mesh, wire, wireGeo,
    curveT: (i + 0.5) / MOBILE_COUNT, // position along ribbon curve
    wireLen: 0.6 + Math.random() * 1.2,
    swingPhase: Math.random() * Math.PI * 2,
    swingFreq: 0.4 + Math.random() * 0.6,
    scale: 0.6 + Math.random() * 0.5,
  });
}

let curveRef = null;

// ─── Tip/balance surprise timing ───
// Every ~16s, the structure tips dramatically to one side,
// hangs there for ~2s like a held breath, then slowly recovers.
const TIP_CYCLE = 16.0;
const TIP_START = 5.0;   // start tipping
const TIP_PEAK = 7.5;    // max tilt
const TIP_HOLD = 9.5;    // hold ends
const TIP_RECOVER = 12.0; // fully recovered

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

function tipEnvelope(t){
  const phase = t % TIP_CYCLE;
  if (phase < TIP_START) return 0;
  if (phase < TIP_PEAK) return smoothstep(TIP_START, TIP_PEAK, phase);
  if (phase < TIP_HOLD) return 1.0;
  if (phase < TIP_RECOVER) return 1.0 - smoothstep(TIP_HOLD, TIP_RECOVER, phase);
  return 0;
}

// Each cycle picks a random tip direction
let tipAngleTarget = Math.random() * Math.PI * 2;
let tipAxisX = Math.cos(tipAngleTarget);
let tipAxisZ = Math.sin(tipAngleTarget);
let lastCycleIndex = -1;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startT = performance.now();
function loop(){
  const t = (performance.now() - startT) / 1000;
  for (let s=0;s<4;s++) step();

  // Pick new tip direction each cycle
  const cycleIdx = Math.floor(t / TIP_CYCLE);
  if (cycleIdx !== lastCycleIndex){
    lastCycleIndex = cycleIdx;
    tipAngleTarget = (cycleIdx * 2.37) % (Math.PI * 2); // deterministic but varied
    tipAxisX = Math.cos(tipAngleTarget);
    tipAxisZ = Math.sin(tipAngleTarget);
  }

  // ─── rebuild ribbon ───
  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    curveRef = curve;
    const N = Math.min(1200, verts.length * 3);
    const positions = new Float32Array(N * 2 * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i=0;i<N;i++){
      const tt = i/N;
      const p = curve.getPointAt(tt);
      const tan = curve.getTangentAt(tt).normalize();
      let lat = new THREE.Vector3().crossVectors(tan, up);
      if (lat.lengthSq()<0.001) lat.set(1,0,0);
      lat.normalize();
      const width = 0.20 + 0.16 * Math.sin(tt*32.0 + t*0.4);
      const left = p.clone().addScaledVector(lat, -width);
      const right = p.clone().addScaledVector(lat, width);
      positions[i*6]=left.x; positions[i*6+1]=left.y; positions[i*6+2]=left.z;
      positions[i*6+3]=right.x; positions[i*6+4]=right.y; positions[i*6+5]=right.z;
    }
    for (let i=0;i<N;i++){
      const ni=(i+1)%N;
      const a=i*2, b=i*2+1, c=ni*2, d=ni*2+1;
      indices.push(a,b,c); indices.push(b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    if (ribbonMesh){ pivot.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    pivot.add(ribbonMesh);
  }

  // ─── surprise: Calder tip ───
  const tip = tipEnvelope(t);
  // Max tilt: ~18 degrees — dramatic but not disorienting
  const maxTilt = 0.32; // radians (~18°)
  const tiltX = tipAxisX * tip * maxTilt;
  const tiltZ = tipAxisZ * tip * maxTilt;

  // Compute centroid for tilt pivot
  let cx2=0, cy2=0, cz2=0;
  for (const v of verts){cx2+=v.x;cy2+=v.y;cz2+=v.z;}
  cx2/=verts.length; cy2/=verts.length; cz2/=verts.length;

  // Tilt entire pivot group around centroid
  pivot.position.set(0, 0, 0);
  pivot.rotation.set(0, 0, 0);

  // Apply tilt around centroid
  const euler = new THREE.Euler(tiltX, 0, tiltZ, 'XYZ');
  pivot.position.set(cx2, cy2, cz2);
  pivot.rotation.copy(euler);
  // Offset so rotation is around centroid
  const offset = new THREE.Vector3(-cx2, -cy2, -cz2).applyEuler(euler);
  pivot.position.add(offset);

  // ─── update mobile hanging shapes ───
  if (curveRef){
    const upV = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < mobiles.length; i++){
      const m = mobiles[i];
      const p = curveRef.getPointAt(m.curveT);
      const tan = curveRef.getTangentAt(m.curveT).normalize();

      // Pendulum swing — increases during tip
      const swingAmp = 0.15 + tip * 0.6;
      const swingAngle = Math.sin(t * m.swingFreq + m.swingPhase) * swingAmp;
      // Swing in the lateral direction
      let lat = new THREE.Vector3().crossVectors(tan, upV);
      if (lat.lengthSq() < 0.001) lat.set(1,0,0);
      lat.normalize();

      // Wire hangs down, swings laterally
      const hangDir = new THREE.Vector3(0, -1, 0)
        .addScaledVector(lat, Math.sin(swingAngle))
        .normalize();

      const endPt = p.clone().addScaledVector(hangDir, m.wireLen);

      // Update wire geometry
      const wPos = m.wireGeo.getAttribute('position');
      wPos.array[0] = p.x; wPos.array[1] = p.y; wPos.array[2] = p.z;
      wPos.array[3] = endPt.x; wPos.array[4] = endPt.y; wPos.array[5] = endPt.z;
      wPos.needsUpdate = true;

      // Position shape at wire end
      m.mesh.position.copy(endPt);
      m.mesh.scale.setScalar(m.scale);
      // Face the shape outward — look along lateral
      m.mesh.lookAt(endPt.clone().add(lat));

      // During tip, shapes sway more visibly
      m.mesh.rotation.z += swingAngle * 0.5;
    }
  }

  // Subtle color shift during tip: ribbon gets slightly cooler
  const goldBase = new THREE.Color(0xc9a45a);
  const silverTip = new THREE.Color(0x9a9aaa);
  ribbonMat.color.copy(goldBase).lerp(silverTip, tip * 0.3);

  // ─── camera tracking ───
  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
