<title>fgz · cyber-nest · metaball orbit accretion</title>
<!-- MOTION: gathering, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0712; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">fgz</div>
<div class="hint">move mouse to shape the nest · sphere velocity determines adhesion</div>
<div class="src">descended from 5gm · Wang & Söderström (Lumen 2023) · soft-body data-harvest</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Wang & Söderström's 'Nest of You' — a biomorphic accretion system where
// metaball-like soft spheres orbit a tracked attractor (mouse in 3D space)
// and stick when slow, forming a glossy cyber-nest around the silhouette.
// MECHANICS: each sphere has orbital velocity around the attractor; when
// velocity < threshold they transition to 'adhered' state and join the nest;
// fast spheres shed and re-orbit. Result: a living nest that grows around
// the pointer, reading as both organism and data exhaust.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0712, 0.022);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0712, 1);
document.body.appendChild(renderer.domElement);

// ambient + two colored key lights (pearl from above, lavender from side)
const amb = new THREE.AmbientLight(0xb8b4c0, 0.35);
scene.add(amb);
const key1 = new THREE.DirectionalLight(0xe8e4df, 0.7);
key1.position.set(4, 8, 6);
scene.add(key1);
const key2 = new THREE.DirectionalLight(0xb8a4d8, 0.5);
key2.position.set(-6, 2, 4);
scene.add(key2);

// attractor position (mouse-driven in normalized 3D space)
const attractor = new THREE.Vector3(0, 0, 0);
const mouse = { x: 0, y: 0 };
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

// sphere state: position, velocity (orbital around attractor), adhesion state
const N_SPHERES = 240;
const spheres = [];
const ORBIT_SPEED = 0.04;
const ADHERE_THRESH = 0.08; // velocity magnitude below which sphere adheres
const SHED_PROB = 0.002;    // chance per frame an adhered sphere re-orbits

for (let i = 0; i < N_SPHERES; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 3 + Math.random() * 4;
  spheres.push({
    pos: new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi)
    ),
    vel: new THREE.Vector3(
      (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.1,
      (Math.random() - 0.5) * 0.1
    ),
    adhered: false,
    targetPos: new THREE.Vector3(),  // locked position when adhered
    radius: 0.24 + Math.random() * 0.18,
    hue: Math.random() * 360
  });
}

// instanced mesh for all spheres
const sphereGeom = new THREE.SphereGeometry(1, 16, 16);
const sphereMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  vertexShader: `
    attribute vec3 iPos;
    attribute float iRadius;
    attribute float iHue;
    attribute float iAdhered;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vHue;
    varying float vAdhered;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vHue = iHue;
      vAdhered = iAdhered;
      vec3 p = position * iRadius + iPos;
      vPos = p;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vHue;
    varying float vAdhered;
    
    vec3 hsl2rgb(float h, float s, float l){
      float c = (1.0 - abs(2.0*l - 1.0)) * s;
      float x = c * (1.0 - abs(mod(h/60.0, 2.0) - 1.0));
      float m = l - c*0.5;
      vec3 rgb;
      if(h < 60.0) rgb = vec3(c,x,0);
      else if(h < 120.0) rgb = vec3(x,c,0);
      else if(h < 180.0) rgb = vec3(0,c,x);
      else if(h < 240.0) rgb = vec3(0,x,c);
      else if(h < 300.0) rgb = vec3(x,0,c);
      else rgb = vec3(c,0,x);
      return rgb + m;
    }
    
    void main(){
      // pearl base (high-luminance desaturated)
      vec3 pearl = vec3(0.94, 0.93, 0.89);
      // lavender tint on adhered spheres
      vec3 lavender = vec3(0.72, 0.65, 0.82);
      // mercury accent (silvery blue)
      vec3 mercury = vec3(0.78, 0.82, 0.88);
      
      // fresnel-like glossiness
      vec3 viewDir = normalize(-vPos);
      float fresnel = pow(1.0 - max(dot(vNormal, viewDir), 0.0), 2.8);
      
      // adhered spheres shift toward lavender with subtle hue variation
      vec3 base = mix(pearl, lavender, vAdhered * 0.6);
      base = mix(base, hsl2rgb(vHue, 0.15, 0.82), 0.12);
      
      // glossy highlight (mercury accent at grazing angles)
      vec3 col = mix(base, mercury, fresnel * 0.7);
      
      // soft edge falloff (metaball-like)
      float edgeFade = smoothstep(0.0, 0.3, dot(vNormal, viewDir));
      float alpha = 0.85 * edgeFade;
      
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  side: THREE.DoubleSide
});

const instancedMesh = new THREE.InstancedMesh(sphereGeom, sphereMat, N_SPHERES);
scene.add(instancedMesh);

// per-instance attributes
const iPosArray = new Float32Array(N_SPHERES * 3);
const iRadiusArray = new Float32Array(N_SPHERES);
const iHueArray = new Float32Array(N_SPHERES);
const iAdheredArray = new Float32Array(N_SPHERES);

const iGeom = instancedMesh.geometry;
iGeom.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPosArray, 3));
iGeom.setAttribute('iRadius', new THREE.InstancedBufferAttribute(iRadiusArray, 1));
iGeom.setAttribute('iHue', new THREE.InstancedBufferAttribute(iHueArray, 1));
iGeom.setAttribute('iAdhered', new THREE.InstancedBufferAttribute(iAdheredArray, 1));

// particle system for shed data-exhaust trails
const TRAIL_COUNT = 8000;
const trailPos = new Float32Array(TRAIL_COUNT * 3);
const trailLife = new Float32Array(TRAIL_COUNT);
let trailIdx = 0;

for (let i = 0; i < TRAIL_COUNT; i++){
  trailPos[i*3] = (Math.random() - 0.5) * 20;
  trailPos[i*3+1] = (Math.random() - 0.5) * 20;
  trailPos[i*3+2] = (Math.random() - 0.5) * 20;
  trailLife[i] = 0;
}

const trailGeom = new THREE.BufferGeometry();
trailGeom.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeom.setAttribute('life', new THREE.BufferAttribute(trailLife, 1));

const trailMat = new THREE.ShaderMaterial({
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() }
  },
  vertexShader: `
    uniform float uPixel;
    attribute float life;
    varying float vLife;
    void main(){
      vLife = life;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 1.2 * uPixel * (30.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLife;
    void main(){
      if(vLife <= 0.0) discard;
      vec2 d = gl_PointCoord - 0.5;
      if(dot(d,d) > 0.25) discard;
      float a = vLife * 0.5;
      vec3 col = vec3(0.78, 0.82, 0.88); // mercury trail
      gl_FragColor = vec4(col * a, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const trailPoints = new THREE.Points(trailGeom, trailMat);
scene.add(trailPoints);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  sphereMat.uniforms.uTime.value = t;

  // update attractor position (mouse in 3D — X/Y from mouse, Z oscillates gently)
  attractor.x += (mouse.x * 6 - attractor.x) * 0.08;
  attractor.y += (mouse.y * 6 - attractor.y) * 0.08;
  attractor.z += (Math.sin(t * 0.4) * 2 - attractor.z) * 0.05;

  // sphere physics: orbital around attractor with adhesion threshold
  for (let i = 0; i < N_SPHERES; i++){
    const s = spheres[i];
    
    if (s.adhered){
      // adhered spheres stay locked to their target position (nest structure)
      // with slight positional drift for organic feel
      s.pos.lerp(s.targetPos, 0.06);
      s.pos.x += (Math.random() - 0.5) * 0.002;
      s.pos.y += (Math.random() - 0.5) * 0.002;
      s.pos.z += (Math.random() - 0.5) * 0.002;
      
      // probabilistic shedding (sphere breaks free and re-orbits)
      if (Math.random() < SHED_PROB){
        s.adhered = false;
        // emit trail particle
        trailPos[trailIdx*3] = s.pos.x;
        trailPos[trailIdx*3+1] = s.pos.y;
        trailPos[trailIdx*3+2] = s.pos.z;
        trailLife[trailIdx] = 1.0;
        trailIdx = (trailIdx + 1) % TRAIL_COUNT;
        // give it initial velocity away from attractor
        const away = s.pos.clone().sub(attractor).normalize();
        s.vel.copy(away).multiplyScalar(0.15);
      }
    } else {
      // orbital physics: attract toward attractor with tangential velocity
      const toAtt = attractor.clone().sub(s.pos);
      const dist = toAtt.length();
      
      // gravitational pull toward attractor
      const force = toAtt.normalize().multiplyScalar(ORBIT_SPEED * 0.8 / Math.max(dist, 0.5));
      s.vel.add(force);
      
      // tangential drift (orbital motion, not straight infall)
      const tangent = new THREE.Vector3(-toAtt.z, 0, toAtt.x).normalize();
      s.vel.add(tangent.multiplyScalar(ORBIT_SPEED * 0.6));
      
      // drag
      s.vel.multiplyScalar(0.96);
      
      // update position
      s.pos.add(s.vel);
      
      // check adhesion threshold
      const speed = s.vel.length();
      if (speed < ADHERE_THRESH && dist < 4.5){
        s.adhered = true;
        s.targetPos.copy(s.pos); // lock current position as target
        s.vel.set(0, 0, 0);
      }
    }
    
    // write to instance attributes
    iPosArray[i*3] = s.pos.x;
    iPosArray[i*3+1] = s.pos.y;
    iPosArray[i*3+2] = s.pos.z;
    iRadiusArray[i] = s.radius;
    iHueArray[i] = s.hue;
    iAdheredArray[i] = s.adhered ? 1.0 : 0.0;
  }
  
  iGeom.attributes.iPos.needsUpdate = true;
  iGeom.attributes.iAdhered.needsUpdate = true;
  
  // decay trail particles
  for (let i = 0; i < TRAIL_COUNT; i++){
    if (trailLife[i] > 0){
      trailLife[i] -= 0.012;
      if (trailLife[i] < 0) trailLife[i] = 0;
    }
  }
  trailGeom.attributes.life.needsUpdate = true;
  
  // camera gentle orbit around nest center
  const camAngle = t * 0.08;
  const camDist = 18;
  camera.position.x = Math.sin(camAngle) * camDist * 0.3;
  camera.position.z = Math.cos(camAngle) * camDist;
  camera.position.y = Math.sin(t * 0.12) * 2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
