<!-- MOTION: unfurl, intensity: calm -->
<!-- Wake: the 7de moonbow calyx stirs from dormancy. Over 60s the cup
     shallows, petals lift along their vein-lines (not uniformly — petal-aligned
     mask tapers the rise), and the form opens like a bloom greeting first light.
     The moonbow spectral sweep is replaced by a slow dawn-wash: warm amber
     creeps across the form from screen-left, as if sunrise is touching the
     petals one by one. Camera pulls back gently as the form flares wider,
     ensuring the unfurled bloom never outgrows the frame.
     Palette: dusk bone / amber / twilight cool, all S<50%. -->
<title>ob7 · wake</title>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

/* ── background: warm gallery wall with vignette & paper grain ── */
const bgScene = new THREE.Scene();
const bgCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMat   = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec3 top = vec3(0.19, 0.16, 0.14);
      vec3 mid = vec3(0.16, 0.13, 0.11);
      vec3 bot = vec3(0.11, 0.09, 0.08);
      vec3 col = mix(bot, mid, smoothstep(0.0, 0.5, uv.y));
      col = mix(col, top, smoothstep(0.5, 1.0, uv.y));
      float vig = 1.0 - 0.35 * pow(length((uv - 0.5) * vec2(1.0, 0.8)), 2.0);
      col *= vig;
      float grain = fract(sin(dot(uv * 512.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }`
});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

/* ── particle system ── */
const N = 80000;
let geom, points;

const uniforms = {
  uTime:     { value: 0 },
  uPhase:    { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uRowFreq:  { value: 1.2 },
  uColFreq:  { value: 1.0 },
  uWaveAmp:  { value: 0.5 },
  uTwist:    { value: 0.0 },
  uMorph:    { value: 0.0 },
  uPetals:   { value: 5.0 },
  uCupDepth: { value: 4.0 },
  uLight1:   { value: new THREE.Vector3(1, 0.5, 0.3) },
  uLight2:   { value: new THREE.Vector3(-0.5, 0.3, 1) },
  uWake:     { value: 0.0 },
  uDawn:     { value: 0.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime, uPixel, uPhase;
    uniform float uRowFreq, uColFreq, uWaveAmp;
    uniform float uTwist, uMorph, uPetals, uCupDepth;
    uniform float uWake;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity, vHeight, vNR;
    varying vec3 vPos, vNorm;
    varying float vPetalAlign;
    varying float vDawnPos;

    void main(){
      float t  = uTime;
      float m  = uMorph;
      float w  = uWake;
      vec2  gp = gridPos;

      float r0    = length(gp);
      float maxR  = 12.0;
      float nr0   = clamp(r0 / maxR, 0.0, 1.0);
      float th0   = atan(gp.y, gp.x);

      /* ── Lorenz-inspired chaotic surface flow ── */
      float flowA = sin(th0 * 3.0 + t * 0.45) * 0.28
                  + cos(r0 * 0.5  - t * 0.32) * 0.18;
      float flowR = sin(r0 * 0.8 + t * 0.28 + th0 * 2.0) * 0.12;
      vec2 drift  = vec2(
        sin((th0 + flowA * seed) * 10.0 + t * 0.55) * nr0 * 0.35 * m,
        cos((th0 + flowA * seed) *  7.0 + t * 0.38) * nr0 * 0.35 * m
      );
      vec2 fgp = gp + drift;

      /* ── Riley wave interference ── */
      float rowW = sin(fgp.y * uRowFreq + t * 1.2 + uPhase) * uWaveAmp;
      float colW = sin(fgp.x * uColFreq + t * 0.70)          * uWaveAmp;

      float tw = uTwist * length(fgp) * 0.04;
      float ct = cos(tw), st = sin(tw);
      vec2 tw2 = vec2(fgp.x * ct - fgp.y * st,
                      fgp.x * st + fgp.y * ct);

      /* ── calyx morph ── */
      float r2  = length(fgp);
      float nr2 = clamp(r2 / maxR, 0.0, 1.0);
      float th2 = atan(fgp.y, fgp.x);

      /* petal alignment: 1 at petal center, 0 at petal edge */
      float petalRaw = cos(th2 * uPetals);
      float petalMask = 0.5 + 0.5 * petalRaw;

      /* wake: cup shallows, petals flare outward and lift at tips along veins */
      float wakeCupScale = 1.0 - w * 0.55;  /* cup becomes 45% shallower */
      float wakeFlare    = 1.0 + w * 0.35 * nr2; /* outer petals spread more */

      float cup     = uCupDepth * wakeCupScale * nr2 * nr2 * (0.6 + 0.4 * petalMask);
      float flare   = (1.0 + 0.15 * nr2 * nr2 * m) * wakeFlare;

      vec3 flatP = vec3(tw2.x + rowW, tw2.y + colW, 0.0);
      float cx = tw2.x * flare + rowW * (1.0 - 0.5 * m);
      float cy = tw2.y * flare + colW * (1.0 - 0.5 * m);
      float cz = cup * m;

      /* ── petal-tip lift: only along vein lines, tapered by radius ──
         Particles at rim AND aligned with petal veins rise;
         those between petals stay low. Creates feathered petal-tip silhouette. */
      float veinAlign = pow(petalMask, 2.5); /* sharpen to vein centerlines */
      float rimFade   = smoothstep(0.4, 0.85, nr2); /* only outer 40% lifts */
      float tipLift   = w * 2.4 * veinAlign * rimFade * m;
      /* gentle breathing at the tips */
      tipLift *= 1.0 + 0.12 * sin(t * 0.4 + th2 * 2.0);
      cz += tipLift;

      vec3 p = mix(flatP, vec3(cx, cy, cz), m);

      /* ── surface normal for lighting ── */
      float dzdr = uCupDepth * wakeCupScale * 2.0 * nr2 / maxR * (0.6 + 0.4 * petalMask) * m;
      float dzdt = uCupDepth * wakeCupScale * nr2 * nr2 * 0.4
                 * (-sin(th2 * uPetals) * uPetals) * m;
      float rSafe = r2 + 0.01;
      vec3 norm = normalize(vec3(
        -dzdr * cos(th2) + dzdt * sin(th2) / rSafe,
        -dzdr * sin(th2) - dzdt * cos(th2) / rSafe,
        1.0));
      /* tilt normals outward at lifted tips for rim-light catch */
      float tiltOut = tipLift * 0.15;
      norm.x += tiltOut * cos(th2);
      norm.y += tiltOut * sin(th2);
      vNorm = normalize(norm);

      /* ── density / veining ── */
      float interf = sin(fgp.y * uRowFreq * 2.0 + t * 1.2)
                   * sin(fgp.x * uColFreq * 2.0 + t * 0.7);
      float vein   = sin(th2 * uPetals * 3.0 + r2 * 1.5 + t * 0.4);
      vDensity = mix(interf, interf * 0.6 + vein * 0.4, m);
      vHeight  = cz;
      vPos     = p;
      vNR      = nr2;
      vPetalAlign = veinAlign;

      /* dawn position: left-to-right sweep */
      vDawnPos = p.x * 0.04 + 0.5;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * max(1.8, 3.6 - dist * 0.05);
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime, uWake, uDawn;
    uniform vec3  uLight1, uLight2;

    varying float vDensity, vHeight, vNR;
    varying vec3  vPos, vNorm;
    varying float vPetalAlign;
    varying float vDawnPos;

    void main(){
      vec2 dc = gl_PointCoord - 0.5;
      float rr = dot(dc, dc);
      if (rr > 0.25) discard;

      vec3 n = normalize(vNorm);

      /* ── desaturated Turrell drifting lights ── */
      float d1 = max(0.0, dot(n, normalize(uLight1)));
      float d2 = max(0.0, dot(n, normalize(uLight2)));
      vec3 c1  = vec3(0.82, 0.58, 0.42);   /* dusk warm */
      vec3 c2  = vec3(0.45, 0.48, 0.68);   /* twilight cool */

      vec3 ambient = vec3(0.14, 0.11, 0.09);
      vec3 lit     = ambient + c1 * d1 * 0.72 + c2 * d2 * 0.48;

      /* ── Lorenz flow glow ── */
      float flowGlow = smoothstep(-0.3, 0.6, vDensity) * 0.3;
      float phase    = sin(uTime * 0.12) * 0.5 + 0.5;
      vec3 trailCol  = mix(c1, c2, phase) * flowGlow * 0.25;

      /* ── base: warm bone ── */
      vec3 base = vec3(0.88, 0.83, 0.76);
      vec3 col  = base * lit + trailCol;

      /* rim catch-light */
      float rim = smoothstep(0.35, 1.0, vNR) * 0.18;
      col += rim * mix(c1, c2, 0.4) * 0.35;

      /* interior shadow */
      float inner = smoothstep(0.45, 0.0, vNR);
      col *= 0.72 + 0.28 * (1.0 - inner * 0.45);

      /* subtle height luminosity */
      col += smoothstep(0.0, 5.0, vHeight) * vec3(0.05, 0.03, 0.02);

      /* ── DAWN-WASH (replaces moonbow) ──
         Warm amber light creeps from screen-left across the form.
         uDawn (0→1 over 60s) controls how far the wash has reached.
         Particles on lifted petal-tips catch the light first. */
      float dawnEdge = uDawn * 1.4 - 0.2; /* sweep front, left to right */
      float dawnHit  = smoothstep(dawnEdge - 0.25, dawnEdge, vDawnPos);
      /* petal tips catch light earlier (like sun hitting high petals first) */
      float tipBonus = vPetalAlign * smoothstep(0.5, 0.9, vNR) * 0.2;
      dawnHit = clamp(dawnHit + tipBonus * uDawn, 0.0, 1.0);

      /* dawn tint: desaturated amber-rose, S~40% */
      vec3 dawnCol = vec3(0.78, 0.58, 0.44);
      /* warm the lit areas, keep shadows cool */
      col = mix(col, col * 0.85 + dawnCol * 0.22, dawnHit * 0.65);
      /* subtle luminance boost on petal veins in dawn */
      col += dawnCol * 0.08 * vPetalAlign * dawnHit * uWake;

      /* ── lifted petal tips get a faint translucency glow ── */
      float translu = smoothstep(1.0, 3.0, vHeight) * vPetalAlign * uWake;
      vec3 transCol = vec3(0.72, 0.52, 0.38); /* warm subsurface */
      col += transCol * translu * 0.12;

      float alpha = (0.70 + flowGlow * 0.25)
                  * (1.0 - smoothstep(0.17, 0.25, rr));
      gl_FragColor = vec4(col, alpha);
    }`
});

/* ── grid builder ── */
function buildGrid(rows, cols, seed){
  const pos  = new Float32Array(N * 3);
  const gpos = new Float32Array(N * 2);
  const sds  = new Float32Array(N);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const W = 24, H = 24;
  const cW = W / cols, cH = H / rows;
  let idx = 0;
  const ppc = Math.floor(N / (rows * cols));
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      for (let k = 0; k < ppc && idx < N; k++){
        const x = (j + rng() - 0.5) * cW - W * 0.5;
        const y = (i + rng() - 0.5) * cH - H * 0.5;
        pos[idx*3]=x; pos[idx*3+1]=y; pos[idx*3+2]=0;
        gpos[idx*2]=x; gpos[idx*2+1]=y;
        sds[idx] = rng(); idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng()-0.5)*W, y = (rng()-0.5)*H;
    pos[idx*3]=x; pos[idx*3+1]=y; pos[idx*3+2]=0;
    gpos[idx*2]=x; gpos[idx*2+1]=y;
    sds[idx]=rng(); idx++;
  }
  return { positions: pos, gridPositions: gpos, seeds: sds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value  = 0.3 + rng() * 0.5;
  uniforms.uTwist.value    = rng() * 4.0;
  uniforms.uPhase.value    = rng() * 6.28;
  uniforms.uPetals.value   = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value    = 0.0;
  uniforms.uWake.value     = 0.0;
  uniforms.uDawn.value     = 0.0;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos',  new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', e => { if (e.target.tagName === 'CANVAS') regenerate(); });

/* ── orbit (manual only, no auto-rotate) ── */
let isDrag = false, pX = 0, pY = 0;
let orbTh = 0, orbPh = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { isDrag = true; pX = e.clientX; pY = e.clientY; e.preventDefault(); });
addEventListener('pointermove', e => {
  if (!isDrag) return;
  orbTh -= (e.clientX - pX) * 0.005;
  orbPh  = Math.max(-0.4, Math.min(0.4, orbPh - (e.clientY - pY) * 0.005));
  pX = e.clientX; pY = e.clientY;
});
addEventListener('pointerup', () => { isDrag = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/* ── animate ── */
const t0 = performance.now();

/* Fixed 3/4 elevated camera with gentle pullback as form wakes */
const camBaseTheta = 0.45;
const camBasePhi   = 0.62;
const camRadiusMin = 22;
const camRadiusMax = 26; /* pulls back 4 units as petals flare */

function loop(){
  const now = performance.now();
  const t   = (now - t0) / 1000;
  uniforms.uTime.value = t;

  /* morph: flat → calyx (first 8s) */
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.015;

  /* wake: begins after calyx forms (~8s), reaches full unfurl by ~60s
     Smooth logistic curve so the opening feels organic, not linear */
  const wakeOnset = 8.0;
  const wakeDur   = 50.0;
  const wakeRaw   = Math.max(0, (t - wakeOnset) / wakeDur);
  const wakeSmooth = wakeRaw < 0.01 ? 0 : 1.0 / (1.0 + Math.exp(-8.0 * (wakeRaw - 0.5)));
  uniforms.uWake.value = Math.min(wakeSmooth, 1.0);

  /* dawn wash: trails wake by ~5s, same logistic shape */
  const dawnRaw = Math.max(0, (t - wakeOnset - 5.0) / wakeDur);
  const dawnSmooth = dawnRaw < 0.01 ? 0 : 1.0 / (1.0 + Math.exp(-8.0 * (dawnRaw - 0.5)));
  uniforms.uDawn.value = Math.min(dawnSmooth, 1.0);

  /* Turrell drifting lights — slow orbits, desaturated */
  const la1 = t * 0.13, la2 = t * 0.09 + 2.1;
  uniforms.uLight1.value.set(
    Math.sin(la1) * 0.8, 0.5 + 0.3 * Math.sin(la1 * 0.7), Math.cos(la1) * 0.6);
  uniforms.uLight2.value.set(
    Math.cos(la2) * 0.6, 0.3 + 0.2 * Math.cos(la2 * 0.5), Math.sin(la2) * 0.8);

  /* Camera: fixed 3/4 elevated + manual orbit offset.
     Pulls back gently as wake progresses to keep flared petals in frame.
     Single slow non-Y drift that settles. */
  const w = uniforms.uWake.value;
  const camRadius = camRadiusMin + (camRadiusMax - camRadiusMin) * w;
  const settle = Math.exp(-t * 0.08);
  const driftX = Math.sin(t * 0.04) * 0.06 * settle;
  const theta  = camBaseTheta + orbTh + driftX;
  const phi    = camBasePhi + orbPh;
  const cY     = 1.5 * uniforms.uMorph.value + w * 0.8;
  camera.position.set(
    camRadius * Math.sin(theta) * Math.sin(phi),
    cY + camRadius * Math.cos(phi),
    camRadius * Math.cos(theta) * Math.sin(phi));
  camera.lookAt(0, cY, 0);

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
