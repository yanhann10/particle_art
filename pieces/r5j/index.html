<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>r5j · memory trace commons · mneme</title>
<!-- MOTION: remembering, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c14; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">r5j · memory trace commons · mneme</div>
<div class="hint">infrastructure remembers itself · 300s cycle</div>
<div class="src">after Winger-Bearskin · mneme (memory-goddess) · traces reform from starfield</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// CONCEPT: MNEME — goddess of memory in Greek mythology, mother of the Muses.
// The parent's infrastructure-to-starfield dissolution now REVERSES periodically:
// ghost traces of the removed infrastructure re-emerge from the celestial field,
// flicker at half-opacity like memory-glimmers, then fade back into stars.
// Three-phase cycle: dissolve (roads→stars), remember (stars→ghost-roads), 
// forget (ghost-roads→stars). Memory as recursive pattern: the land remembers
// what was built upon it. Amber memory-traces pulse at the threshold of visibility.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c14, 0.008);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 18, 42);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c14, 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a1d28, 0.3));

// ───────────────────────────────────────────────────────────────────────────
// PARTICLE SYSTEM — three-state memory cycle
// ───────────────────────────────────────────────────────────────────────────
const PARTICLE_COUNT = 18000;
const CYCLE_DURATION = 300.0; // seconds — full remember-forget cycle
const DISSOLVE_PHASE = 80.0;  // roads → stars
const REMEMBER_PHASE = 100.0; // stars → ghost infrastructure (memory trace)
const FORGET_PHASE = 120.0;   // ghost → stars

// Built layer: orthogonal grids on terrain (roads, fences, power lines)
const builtPositions = new Float32Array(PARTICLE_COUNT * 3);
const builtColors = new Float32Array(PARTICLE_COUNT * 3);
const builtSizes = new Float32Array(PARTICLE_COUNT);

// Sky layer: deep field stars with gentle drift
const skyPositions = new Float32Array(PARTICLE_COUNT * 3);
const skyColors = new Float32Array(PARTICLE_COUNT * 3);
const skySizes = new Float32Array(PARTICLE_COUNT);

// Memory layer: ghost trace of infrastructure (desaturated amber)
const memoryColors = new Float32Array(PARTICLE_COUNT * 3);
const memorySizes = new Float32Array(PARTICLE_COUNT);

// Per-particle phase offsets for staggered transitions
const phaseOffset = new Float32Array(PARTICLE_COUNT);
const transitionDuration = 8.0; // seconds per particle to transition

// Color palettes
const sodiumOrange = new THREE.Color(0xff9d4a);
const warmAmber = new THREE.Color(0xffc266);
const cobaltDeep = new THREE.Color(0x1a3d5c);
const skyBlue = new THREE.Color(0x4a6fa5);
const starWhite = new THREE.Color(0xe8f0ff);
const memoryAmber = new THREE.Color(0xd4a574); // desaturated memory-trace
const memoryGlow = new THREE.Color(0xffcf9f);

// Seed all layers
for (let i = 0; i < PARTICLE_COUNT; i++){
  // Built layer: orthogonal grid infrastructure
  const gridType = Math.random();
  let bx, by, bz, bsize;
  
  if (gridType < 0.35){
    // Road grid
    const lane = Math.floor(Math.random() * 12) - 6;
    bx = (Math.random() - 0.5) * 120;
    by = 0.1 + Math.random() * 0.3;
    bz = lane * 6 + (Math.random() - 0.5) * 1.2;
    bsize = 0.35 + Math.random() * 0.25;
  } else if (gridType < 0.65){
    // Fence grid
    const fenceRow = Math.floor(Math.random() * 8) - 4;
    bx = fenceRow * 14 + (Math.random() - 0.5) * 0.8;
    by = Math.random() * 4.5;
    bz = (Math.random() - 0.5) * 100;
    bsize = 0.28 + Math.random() * 0.18;
  } else {
    // Power line grid
    const lineY = 8 + Math.random() * 6;
    bx = (Math.random() - 0.5) * 140;
    by = lineY;
    bz = (Math.random() - 0.5) * 90;
    bsize = 0.22 + Math.random() * 0.15;
  }
  
  builtPositions[i*3]   = bx;
  builtPositions[i*3+1] = by;
  builtPositions[i*3+2] = bz;
  builtSizes[i] = bsize;
  
  const builtCol = Math.random() < 0.7 ? sodiumOrange : warmAmber;
  builtColors[i*3]   = builtCol.r;
  builtColors[i*3+1] = builtCol.g;
  builtColors[i*3+2] = builtCol.b;
  
  // Memory layer: same position as built, but desaturated amber glow
  const memCol = Math.random() < 0.6 ? memoryAmber : memoryGlow;
  memoryColors[i*3]   = memCol.r;
  memoryColors[i*3+1] = memCol.g;
  memoryColors[i*3+2] = memCol.b;
  memorySizes[i] = bsize * 0.7; // slightly smaller ghost trace
  
  // Sky layer: deep field stars
  const skyR = 50 + Math.random() * 80;
  const skyTheta = Math.random() * Math.PI * 2;
  const skyPhi = Math.acos(2 * Math.random() - 1);
  skyPositions[i*3]   = skyR * Math.sin(skyPhi) * Math.cos(skyTheta);
  skyPositions[i*3+1] = skyR * Math.sin(skyPhi) * Math.sin(skyTheta) * 0.4 + Math.random() * 25;
  skyPositions[i*3+2] = skyR * Math.cos(skyPhi);
  
  const starType = Math.random();
  let skyCol;
  if (starType < 0.15){
    skyCol = starWhite;
  } else if (starType < 0.45){
    skyCol = skyBlue;
  } else {
    skyCol = cobaltDeep;
  }
  skyColors[i*3]   = skyCol.r;
  skyColors[i*3+1] = skyCol.g;
  skyColors[i*3+2] = skyCol.b;
  
  skySizes[i] = starType < 0.08 ? 1.2 + Math.random() * 0.6 : 0.18 + Math.random() * 0.35;
  
  // Stagger phase offsets for progressive memory emergence
  phaseOffset[i] = Math.random() * transitionDuration;
}

// Merged output
const mergedPositions = new Float32Array(PARTICLE_COUNT * 3);
const mergedColors = new Float32Array(PARTICLE_COUNT * 3);
const mergedSizes = new Float32Array(PARTICLE_COUNT);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(mergedPositions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(mergedColors, 3));
geom.setAttribute('size', new THREE.BufferAttribute(mergedSizes, 1));

const vertexShader = `
  attribute float size;
  varying vec3 vColor;
  void main(){
    vColor = color;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (300.0 / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const fragmentShader = `
  varying vec3 vColor;
  void main(){
    vec2 cxy = 2.0 * gl_PointCoord - 1.0;
    float r = dot(cxy, cxy);
    if (r > 1.0) discard;
    float alpha = 1.0 - smoothstep(0.3, 1.0, r);
    gl_FragColor = vec4(vColor, alpha);
  }
`;

const mat = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  transparent: true,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ───────────────────────────────────────────────────────────────────────────
// ANIMATION LOOP — three-phase memory cycle
// ───────────────────────────────────────────────────────────────────────────
const start = performance.now();

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const cycleTime = elapsed % CYCLE_DURATION;
  
  // Three phases:
  // 0-80s: DISSOLVE (built → sky)
  // 80-180s: REMEMBER (sky → memory-trace at built positions)
  // 180-300s: FORGET (memory-trace → sky)
  
  for (let i = 0; i < PARTICLE_COUNT; i++){
    const offset = phaseOffset[i];
    let t = 0; // interpolation factor
    let phase = 0; // 0=dissolve, 1=remember, 2=forget
    
    if (cycleTime < DISSOLVE_PHASE){
      // Phase 0: built → sky
      phase = 0;
      const localTime = cycleTime - offset;
      if (localTime > 0 && localTime < transitionDuration){
        t = localTime / transitionDuration;
        t = 1 - Math.pow(1 - t, 3); // ease out cubic
      } else if (localTime >= transitionDuration){
        t = 1;
      }
    } else if (cycleTime < DISSOLVE_PHASE + REMEMBER_PHASE){
      // Phase 1: sky → memory (ghost infrastructure)
      phase = 1;
      const phaseStart = DISSOLVE_PHASE + offset;
      const localTime = cycleTime - phaseStart;
      if (localTime > 0 && localTime < transitionDuration){
        t = localTime / transitionDuration;
        t = 1 - Math.pow(1 - t, 3);
      } else if (localTime >= transitionDuration){
        t = 1;
      }
    } else {
      // Phase 2: memory → sky (forgetting)
      phase = 2;
      const phaseStart = DISSOLVE_PHASE + REMEMBER_PHASE + offset;
      const localTime = cycleTime - phaseStart;
      if (localTime > 0 && localTime < transitionDuration){
        t = localTime / transitionDuration;
        t = 1 - Math.pow(1 - t, 3);
      } else if (localTime >= transitionDuration){
        t = 1;
      }
    }
    
    const bx = builtPositions[i*3];
    const by = builtPositions[i*3+1];
    const bz = builtPositions[i*3+2];
    const sx = skyPositions[i*3];
    const sy = skyPositions[i*3+1];
    const sz = skyPositions[i*3+2];
    
    if (phase === 0){
      // Dissolve: built → sky
      mergedPositions[i*3]   = bx + (sx - bx) * t;
      mergedPositions[i*3+1] = by + (sy - by) * t;
      mergedPositions[i*3+2] = bz + (sz - bz) * t;
      
      const bcr = builtColors[i*3];
      const bcg = builtColors[i*3+1];
      const bcb = builtColors[i*3+2];
      const scr = skyColors[i*3];
      const scg = skyColors[i*3+1];
      const scb = skyColors[i*3+2];
      
      mergedColors[i*3]   = bcr + (scr - bcr) * t;
      mergedColors[i*3+1] = bcg + (scg - bcg) * t;
      mergedColors[i*3+2] = bcb + (scb - bcb) * t;
      
      mergedSizes[i] = builtSizes[i] + (skySizes[i] - builtSizes[i]) * t;
      
    } else if (phase === 1){
      // Remember: sky → memory (ghost at built positions)
      mergedPositions[i*3]   = sx + (bx - sx) * t;
      mergedPositions[i*3+1] = sy + (by - sy) * t;
      mergedPositions[i*3+2] = sz + (bz - sz) * t;
      
      const scr = skyColors[i*3];
      const scg = skyColors[i*3+1];
      const scb = skyColors[i*3+2];
      const mcr = memoryColors[i*3];
      const mcg = memoryColors[i*3+1];
      const mcb = memoryColors[i*3+2];
      
      mergedColors[i*3]   = scr + (mcr - scr) * t;
      mergedColors[i*3+1] = scg + (mcg - scg) * t;
      mergedColors[i*3+2] = scb + (mcb - scb) * t;
      
      mergedSizes[i] = skySizes[i] + (memorySizes[i] - skySizes[i]) * t;
      
      // Memory flicker: pulse at threshold visibility
      const flicker = 0.3 + 0.15 * Math.sin(elapsed * 3.0 + i * 0.01);
      mergedColors[i*3]   *= (0.7 + flicker * t);
      mergedColors[i*3+1] *= (0.7 + flicker * t);
      mergedColors[i*3+2] *= (0.7 + flicker * t);
      
    } else {
      // Forget: memory → sky
      mergedPositions[i*3]   = bx + (sx - bx) * t;
      mergedPositions[i*3+1] = by + (sy - by) * t;
      mergedPositions[i*3+2] = bz + (sz - bz) * t;
      
      const mcr = memoryColors[i*3];
      const mcg = memoryColors[i*3+1];
      const mcb = memoryColors[i*3+2];
      const scr = skyColors[i*3];
      const scg = skyColors[i*3+1];
      const scb = skyColors[i*3+2];
      
      mergedColors[i*3]   = mcr + (scr - mcr) * t;
      mergedColors[i*3+1] = mcg + (scg - mcg) * t;
      mergedColors[i*3+2] = mcb + (scb - mcb) * t;
      
      mergedSizes[i] = memorySizes[i] + (skySizes[i] - memorySizes[i]) * t;
    }
    
    // Celestial drift once in sky-state
    if ((phase === 0 && t > 0.1) || (phase === 2 && t > 0.1)){
      const driftPhase = elapsed * 0.08 + i * 0.001;
      mergedPositions[i*3]   += Math.sin(driftPhase) * 0.015 * t;
      mergedPositions[i*3+1] += Math.cos(driftPhase * 0.7) * 0.008 * t;
    }
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.color.needsUpdate = true;
  geom.attributes.size.needsUpdate = true;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
