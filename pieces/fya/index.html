<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fya · aizawa attractor (woven)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">fya</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: scatter particles in a small box near the basin
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 0.6;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// GPGPU simulation — Aizawa attractor, unchanged
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:  { value: 0.012 },
  uA:   { value: 0.95 },
  uB:   { value: 0.70 },
  uC:   { value: 0.60 },
  uD:   { value: 3.50 },
  uE:   { value: 0.25 },
  uF:   { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

// --- LINE SEGMENT RENDERING ---
// Connect consecutive particles along each row of the texture grid.
// Particles in the same row were initialized near each other and trace
// nearby trajectories through the attractor, so segments follow the flow.
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

// Each row of W pixels yields (W-1) line segments = 2*(W-1) vertices.
// Total segments: H * (W-1) = 320 * 319 = 102,080
// Total vertices: 2 * 102,080 = 204,160
const segCount = H * (W - 1);
const vertCount = segCount * 2;

const uvIdxArr = new Float32Array(vertCount * 2);
let vi = 0;
for (let y = 0; y < H; y++) {
  const vTex = (y + 0.5) / H;
  for (let x = 0; x < W - 1; x++) {
    const u0 = (x + 0.5) / W;
    const u1 = (x + 1.5) / W;
    // vertex A of segment
    uvIdxArr[vi++] = u0;
    uvIdxArr[vi++] = vTex;
    // vertex B of segment
    uvIdxArr[vi++] = u1;
    uvIdxArr[vi++] = vTex;
  }
}

const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(vertCount * 3), 3));
lineGeom.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdxArr, 2));

const lineMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    void main(){
      // emerald → violet → silver palette (same as parent)
      vec3 a_col = vec3(0.20, 0.62, 0.45);
      vec3 b_col = vec3(0.55, 0.30, 0.78);
      vec3 c_col = vec3(0.92, 0.95, 0.98);
      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));
      // opacity 0.08–0.16 modulated by speed; additive blending accumulates density
      float alpha = 0.08 + vSpeed * 0.08;
      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});

const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

// resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer perturbations — same as parent
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth) - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

const t0 = performance.now();
function loop() {
  const now = performance.now();
  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;

  // 4 sub-steps per frame
  for (let i = 0; i < 4; i++) {
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  lineMat.uniforms.state.value = rtA.texture;

  // slow camera orbit
  const ang = (now - t0) * 0.00015;
  camera.position.x = Math.sin(ang) * 4;
  camera.position.z = Math.cos(ang) * 4;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 1.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
