<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7pc · tender light strings · bokeh</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">7pc</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · light string drape · depth-of-field bokeh</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender light strings with depth-of-field bokeh —
   Felix Gonzalez-Torres draped incandescent strands seen through
   a shallow-focus lens. Near lights are crisp pinpoints; far lights
   bloom into soft warm bokeh circles. Fog thickens with distance,
   swallowing the deepest drapes into amber haze. The result is
   intimate — like photographing the installation at f/1.4, the way
   you'd photograph something you're afraid of forgetting. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

// --- curve parameters ---
const MAX_VERTS = 3200;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 6;

const verts = [];
const NV0 = 40;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 6;
  const y = -Math.abs(t) * 1.2 + Math.sin(t * Math.PI * 2) * 0.3;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  let ccx = 0, ccz = 0;
  for (let i = 0; i < n; i++) { ccx += verts[i].x; ccz += verts[i].z; }
  ccx /= n; ccz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - ccx, oz = verts[i].z - ccz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
  }

  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- rendering: 40k particles as warm bokeh lights ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge   = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogNear:    { value: 8.0 },
  uFogFar:     { value: 45.0 },
  uFocalDist:  { value: 20.0 },
  uDofRange:   { value: 6.0 },
  uDofMax:     { value: 4.5 },
  uResolution: { value: new THREE.Vector2(innerWidth, innerHeight) }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFocalDist;
    uniform float uDofRange;
    uniform float uDofMax;
    uniform float uFogNear;
    uniform float uFogFar;
    attribute float seed;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    varying float vCoC; // circle of confusion — drives blur in frag

    void main() {
      vec3 p = position;

      // gentle sway
      float t = uTime * 0.3 + seed * 6.28;
      float sway = sin(t) * 0.008 * (1.0 + seed);
      p.x += sway;
      p.z += cos(t * 0.7) * 0.005;

      // pulse per-bulb
      float pulse = 0.85 + 0.15 * sin(uTime * 1.2 + seed * 40.0);

      // palette: warm filament amber → soft white
      vec3 amber  = vec3(1.0, 0.72, 0.32);
      vec3 warm   = vec3(1.0, 0.88, 0.72);
      vec3 white  = vec3(1.0, 0.96, 0.92);
      float k = clamp(age * 1.2, 0.0, 1.0);
      vCol = mix(amber, warm, k);
      vCol = mix(vCol, white, smoothstep(0.7, 1.0, k) * 0.3);
      vCol *= pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // --- depth of field ---
      // circle of confusion: 0 at focal plane, grows with distance from it
      float defocus = abs(dist - uFocalDist) / uDofRange;
      vCoC = clamp(defocus, 0.0, 1.0);

      // base size (focused)
      float baseSize = 1.8 * uPixel * (45.0 / dist);
      // bokeh bloom: out-of-focus lights grow into soft discs
      float bokehScale = 1.0 + vCoC * uDofMax;
      gl_PointSize = baseSize * bokehScale;

      // alpha: focused lights are brighter, bokeh lights are softer
      // this preserves energy — larger disc, lower alpha
      float focusAlpha = 0.55 + 0.2 * pulse;
      float bokehDim = 1.0 / (bokehScale * bokehScale);
      // don't dim too aggressively — keep bokeh visible
      bokehDim = mix(1.0, bokehDim, 0.6);
      vAlpha = focusAlpha * bokehDim;

      gl_Position = projectionMatrix * mv;

      // depth-cued fog — exponential-squared for soft falloff
      float fogDepth = max(0.0, dist - uFogNear);
      float fogRange = uFogFar - uFogNear;
      float fogRatio = fogDepth / fogRange;
      vFogFactor = clamp(1.0 - exp(-2.5 * fogRatio * fogRatio), 0.0, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    varying float vCoC;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // DOF-driven falloff profile:
      // focused → tight core + faint halo (crisp pinpoint)
      // defocused → broad soft disc (bokeh circle, flatter falloff)
      float sharpCore = exp(-r * 28.0);
      float sharpHalo = exp(-r * 10.0) * 0.3;
      float bokehDisc = smoothstep(0.25, 0.1, r); // flat disc with soft edge
      float bokehRing = smoothstep(0.25, 0.2, r) * smoothstep(0.08, 0.15, r) * 0.25; // subtle ring

      // blend between focused and bokeh profiles
      float focusedProfile = sharpCore + sharpHalo;
      float bokehProfile   = bokehDisc * 0.65 + bokehRing;
      float profile = mix(focusedProfile, bokehProfile, vCoC);

      float a = profile * vAlpha;

      // subtle chromatic shift in bokeh — warm fringe
      vec3 col = vCol;
      // out-of-focus lights get a slightly warmer, more diffuse tint
      vec3 bokehTint = vCol * vec3(1.05, 0.95, 0.85);
      col = mix(col, bokehTint, vCoC * 0.4);

      // depth-cued fog
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.85);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// faint wire between vertices
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x2a2420,
  transparent: true,
  opacity: 0.22
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uResolution.value.set(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 500; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;

  // update wire
  for (let i = 0; i < n; i++) {
    wirePositions[i * 3]     = verts[i].x;
    wirePositions[i * 3 + 1] = verts[i].y;
    wirePositions[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // camera tracks centroid gently
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // update focal distance to track centroid distance from camera
  const camDist = camera.position.distanceTo(controls.target);
  uniforms.uFocalDist.value += (camDist - uniforms.uFocalDist.value) * 0.03;

  // distribute particles along curve
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt(
      (b.x - a.x) ** 2 + (b.z - a.z) ** 2 + (b.y - a.y) ** 2
    );
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n - 1; i++) {
      const share = (i === n - 2)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[i + 1];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
        const spread = 0.015;
        rPos[written * 3]     = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * spread;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * spread;
        rAge[written] = Math.max(a.age, b.age);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
  }

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
