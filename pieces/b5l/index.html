<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b5l · geometric shells</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0520; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a0830; color:#e5d6f0; border:1px solid #5a2a8a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#2a1540; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · geometric shells</button>
<div class="id">b5l</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0520, 1);
document.body.appendChild(renderer.domElement);

const SHELLS = 5;
const SHAPES_PER_SHELL = 18;
const geomShapes = [];

// geometric primitives: triangles, hexagons, half-circles, rings, lines
function makeTriangle(){
  const g = new THREE.BufferGeometry();
  const v = new Float32Array([
    0, 1.2, 0,
    -1.0, -0.6, 0,
    1.0, -0.6, 0
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(v, 3));
  return g;
}

function makeHexagon(){
  const g = new THREE.BufferGeometry();
  const v = [];
  for(let i=0; i<6; i++){
    const a = (i/6)*Math.PI*2;
    v.push(Math.cos(a)*0.8, Math.sin(a)*0.8, 0);
  }
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3));
  return g;
}

function makeHalfCircle(){
  const g = new THREE.BufferGeometry();
  const v = [];
  for(let i=0; i<=12; i++){
    const a = (i/12)*Math.PI;
    v.push(Math.cos(a)*0.9, Math.sin(a)*0.9, 0);
  }
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3));
  return g;
}

function makeRing(){
  const g = new THREE.BufferGeometry();
  const v = [];
  for(let i=0; i<=20; i++){
    const a = (i/20)*Math.PI*2;
    v.push(Math.cos(a)*1.0, Math.sin(a)*1.0, 0);
  }
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(v), 3));
  return g;
}

function makeLine(){
  const g = new THREE.BufferGeometry();
  const v = new Float32Array([
    -1.2, 0, 0,
    1.2, 0, 0
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(v, 3));
  return g;
}

const geoTypes = [makeTriangle, makeHexagon, makeHalfCircle, makeRing, makeLine];

// color palette: hard-edged flat colors
const palette = [
  new THREE.Color(0xff3366), // hot pink
  new THREE.Color(0xffcc00), // electric yellow
  new THREE.Color(0x00ffaa), // mint
  new THREE.Color(0x3366ff), // electric blue
  new THREE.Color(0xee00ff)  // magenta
];

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uBands: { value: uBands },
  uTreble: { value: 0 }
};

const group = new THREE.Group();
scene.add(group);

for(let s=0; s<SHELLS; s++){
  const radius = 8 + s * 5;
  const color = palette[s % palette.length];
  
  for(let i=0; i<SHAPES_PER_SHELL; i++){
    const geoFunc = geoTypes[Math.floor(i / (SHAPES_PER_SHELL/geoTypes.length)) % geoTypes.length];
    const geo = geoFunc();
    
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        ...uniforms,
        shellIdx: { value: s },
        baseColor: { value: color }
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      vertexShader: `
        uniform float uTime;
        uniform float shellIdx;
        uniform vec4 uBands;
        uniform float uTreble;
        varying vec3 vColor;
        varying float vEnergy;
        
        void main(){
          float e;
          if (shellIdx < 0.5)      e = uBands.x;
          else if (shellIdx < 1.5) e = uBands.y;
          else if (shellIdx < 2.5) e = uBands.z;
          else if (shellIdx < 3.5) e = uBands.w;
          else                     e = uTreble;
          
          vEnergy = e;
          
          vec3 p = position;
          float scale = 1.0 + e * 0.6;
          p *= scale;
          
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 baseColor;
        varying float vEnergy;
        
        void main(){
          float alpha = 0.4 + vEnergy * 0.6;
          vec3 col = baseColor * (0.7 + vEnergy * 0.8);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });
    
    const lineMat = new THREE.LineBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.8,
      linewidth: 2
    });
    
    let mesh;
    if(geoFunc === makeLine || geoFunc === makeRing || geoFunc === makeHalfCircle){
      mesh = new THREE.Line(geo, lineMat);
    } else {
      mesh = new THREE.Line(geo, lineMat);
    }
    
    const angle = (i / SHAPES_PER_SHELL) * Math.PI * 2;
    mesh.position.x = Math.cos(angle) * radius;
    mesh.position.y = Math.sin(angle) * radius;
    mesh.position.z = 0;
    
    mesh.userData = {
      shellIdx: s,
      baseAngle: angle,
      radius: radius,
      rotOffset: i * 0.5,
      mat: mat
    };
    
    const tiltAngle = angle + Math.PI/2;
    mesh.rotation.z = tiltAngle;
    
    group.add(mesh);
    geomShapes.push(mesh);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 frequency shells';
  } catch (e) {
    hint.textContent = 'mic denied — synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t*1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t*7.0);
  }
  
  group.rotation.z = t * 0.08;
  group.rotation.x = Math.sin(t * 0.05) * 0.15;
  
  geomShapes.forEach((mesh, i) => {
    const ud = mesh.userData;
    let e;
    if (ud.shellIdx < 0.5)      e = uBands.x;
    else if (ud.shellIdx < 1.5) e = uBands.y;
    else if (ud.shellIdx < 2.5) e = uBands.z;
    else if (ud.shellIdx < 3.5) e = uBands.w;
    else                        e = uniforms.uTreble.value;
    
    const pulse = 1.0 + e * 0.3;
    const newAngle = ud.baseAngle + t * (0.1 + ud.shellIdx * 0.05);
    mesh.position.x = Math.cos(newAngle) * ud.radius * pulse;
    mesh.position.y = Math.sin(newAngle) * ud.radius * pulse;
    
    mesh.rotation.z = newAngle + Math.PI/2 + ud.rotOffset + e * 0.5;
    
    if(mesh.material.opacity !== undefined){
      mesh.material.opacity = 0.5 + e * 0.5;
    }
  });
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
