<title>re7 · narthex — threshold columns from soak-stain (Rachel Whiteread)</title>
<style>

canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">re7</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0ede8);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 1, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Deterministic RNG (inherited seed lineage)
let rngState = 193847;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── FBM noise for organic edges (from parent)
function fbm(x, y, octaves = 4){
  let sum = 0, amp = 1, freq = 1, maxVal = 0;
  for (let i = 0; i < octaves; i++){
    sum += amp * (Math.sin(x * freq + 17.3) * Math.cos(y * freq + 23.1) +
                   Math.sin((x + y) * freq * 0.7 + 41.9));
    maxVal += amp; amp *= 0.5; freq *= 2.0;
  }
  return sum / maxVal;
}

// ── Curl flow field (inherited from parent, attenuated)
function curlFlow(x, y, t){
  const scale = 0.08, speed = 0.05;
  const sx = x * scale, sy = y * scale, st = t * speed;
  const pot = Math.sin(sx + st) * Math.cos(sy * 1.3 + st * 0.7) +
              Math.sin((sx + sy) * 0.5 + st * 1.1) * 0.6;
  const eps = 0.01;
  const dx = (Math.sin((x + eps) * scale + st) * Math.cos(sy * 1.3 + st * 0.7) - pot) / eps;
  const dy = (Math.sin(sx + st) * Math.cos((y + eps) * scale * 1.3 + st * 0.7) - pot) / eps;
  return { vx: -dy * 0.25, vy: dx * 0.25 };
}

// ── Narthex architecture: 5 columns with arched tops
// Rachel Whiteread casts negative space — here the particles are the cast,
// the empty air between columns is the sacred interior hinted at
const NUM_COLUMNS = 5;
const COLUMN_SPACING = 3.2;
const COLUMN_WIDTH = 0.9;
const COLUMN_BASE = -7.5;
const COLUMN_TOP = 5.5;
const ARCH_PEAK = 7.2;
const NARTHEX_OFFSET_X = -(NUM_COLUMNS - 1) * COLUMN_SPACING * 0.5;

const columns = [];
for (let c = 0; c < NUM_COLUMNS; c++){
  columns.push({
    x: NARTHEX_OFFSET_X + c * COLUMN_SPACING,
    base: COLUMN_BASE,
    top: COLUMN_TOP,
    width: COLUMN_WIDTH + (rng() - 0.5) * 0.2
  });
}

// Arch between adjacent columns: parabolic curve
function archY(x, colL, colR){
  const cx = (colL.x + colR.x) * 0.5;
  const halfSpan = (colR.x - colL.x) * 0.5;
  const t = (x - cx) / halfSpan; // -1 to 1
  if (Math.abs(t) > 1) return -999;
  const peak = ARCH_PEAK - rng() * 0.0; // consistent
  return COLUMN_TOP + (peak - COLUMN_TOP) * (1 - t * t); // parabola
}

// SDF-like: distance to nearest column or arch surface
function distToNarthex(px, py){
  let minDist = 999;

  // Distance to columns (rectangles with FBM-warped edges)
  for (let c = 0; c < NUM_COLUMNS; c++){
    const col = columns[c];
    const warp = fbm(py * 0.8, c * 7.7, 3) * 0.25;
    const halfW = col.width * 0.5 + warp;
    const dx = Math.abs(px - col.x) - halfW;
    const dy = Math.max(col.base - py, py - col.top);
    const d = Math.max(dx, dy);
    minDist = Math.min(minDist, d);
  }

  // Distance to arches (thick curved bands between columns)
  for (let c = 0; c < NUM_COLUMNS - 1; c++){
    const colL = columns[c], colR = columns[c + 1];
    const cx = (colL.x + colR.x) * 0.5;
    const halfSpan = (colR.x - colL.x) * 0.5;
    const t = (px - cx) / halfSpan;
    if (Math.abs(t) <= 1.05){
      const peak = ARCH_PEAK;
      const archLine = COLUMN_TOP + (peak - COLUMN_TOP) * (1 - t * t);
      const archThickness = 0.7 + fbm(px * 1.2, 0, 2) * 0.15;
      const dy = Math.abs(py - archLine) - archThickness * 0.5;
      const dx = Math.abs(t) > 1 ? (Math.abs(t) - 1) * halfSpan : 0;
      const d = Math.max(dx, dy);
      minDist = Math.min(minDist, d);
    }
  }

  // Lintel / threshold slab at base
  const slabTop = COLUMN_BASE + 0.4;
  const slabLeft = columns[0].x - 1;
  const slabRight = columns[NUM_COLUMNS - 1].x + 1;
  if (px > slabLeft && px < slabRight){
    const dy = Math.max(COLUMN_BASE - 0.6 - py, py - slabTop);
    minDist = Math.min(minDist, dy);
  }

  return minDist;
}

// ── Particle system: parent's three pools morphing into narthex columns
const NUM_PARTICLES = 75000;
const positions = new Float32Array(NUM_PARTICLES * 3);
const colors = new Float32Array(NUM_PARTICLES * 3);
const velocities = new Float32Array(NUM_PARTICLES * 2);
const poolAssignment = new Uint8Array(NUM_PARTICLES);

// Parent palette shifted toward stone/shadow — Whiteread's plaster casts
const baseColors = [
  new THREE.Color(0.18, 0.22, 0.34), // deep slate-blue (from parent indigo)
  new THREE.Color(0.52, 0.20, 0.22), // muted brick (from parent brick-red)
  new THREE.Color(0.65, 0.58, 0.38)  // warm stone (from parent ochre)
];

// Parent's pool centers (preserved for initial placement)
const pools = [
  { x: -4.5, y: 1.2, r: 3.8 },
  { x: 2.8, y: -0.8, r: 4.2 },
  { x: -0.5, y: 3.5, r: 3.5 }
];

// Initialize particles in parent pool positions
for (let i = 0; i < NUM_PARTICLES; i++){
  const poolIdx = Math.floor(rng() * pools.length);
  const pool = pools[poolIdx];

  let angle = rng() * Math.PI * 2;
  let dist = Math.sqrt(rng()) * pool.r;
  const warp = fbm(Math.cos(angle) * 3, Math.sin(angle) * 3, 3) * pool.r * 0.35;
  dist += warp;

  positions[i * 3] = pool.x + Math.cos(angle) * dist;
  positions[i * 3 + 1] = pool.y + Math.sin(angle) * dist;
  positions[i * 3 + 2] = (rng() - 0.5) * 0.08;

  const col = baseColors[poolIdx];
  colors[i * 3] = col.r;
  colors[i * 3 + 1] = col.g;
  colors[i * 3 + 2] = col.b;

  poolAssignment[i] = poolIdx;
  velocities[i * 2] = 0;
  velocities[i * 2 + 1] = 0;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.10,
  vertexColors: true,
  transparent: true,
  opacity: 0.28,
  blending: THREE.NormalBlending,
  depthWrite: false
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ── Morph phase: particles attracted toward narthex surface over time
// morphT ramps 0→1 over ~20 seconds, blending pool flow with architectural attraction
let morphT = 0;

// Find nearest point on narthex for attraction
function attractToNarthex(px, py){
  const d = distToNarthex(px, py);
  if (d < 0) return { ax: 0, ay: 0, inside: true }; // already inside form

  // Gradient descent toward narthex surface
  const eps = 0.05;
  const gx = (distToNarthex(px + eps, py) - distToNarthex(px - eps, py)) / (2 * eps);
  const gy = (distToNarthex(px, py + eps) - distToNarthex(px, py - eps)) / (2 * eps);
  const glen = Math.sqrt(gx * gx + gy * gy) + 0.001;

  // Stronger pull when far, softer when close
  const strength = Math.min(d * 0.15, 0.8);
  return {
    ax: -gx / glen * strength,
    ay: -gy / glen * strength,
    inside: false
  };
}

// ── Color update: darken particles inside columns, warm glow at arches
function updateColors(elapsed){
  const posAttr = geometry.attributes.position;
  const colAttr = geometry.attributes.color;
  const mt = Math.min(morphT, 1);

  for (let i = 0; i < NUM_PARTICLES; i++){
    const px = posAttr.array[i * 3];
    const py = posAttr.array[i * 3 + 1];
    const pool = poolAssignment[i];
    const base = baseColors[pool];

    const d = distToNarthex(px, py);
    const insideness = d < 0 ? Math.min(-d * 1.5, 1) : 0;

    // Height-based warmth (arches glow warmer, base stays dark)
    const heightNorm = (py - COLUMN_BASE) / (ARCH_PEAK - COLUMN_BASE);
    const warmth = Math.max(0, heightNorm) * 0.15 * mt;

    // Inside the form: deepen & unify toward stone
    const stoneColor = new THREE.Color(0.32, 0.28, 0.24);
    const r = base.r * (1 - insideness * mt * 0.4) + stoneColor.r * insideness * mt * 0.4 + warmth;
    const g = base.g * (1 - insideness * mt * 0.4) + stoneColor.g * insideness * mt * 0.4 + warmth * 0.6;
    const b = base.b * (1 - insideness * mt * 0.35) + stoneColor.b * insideness * mt * 0.35;

    colAttr.array[i * 3] = Math.min(r, 1);
    colAttr.array[i * 3 + 1] = Math.min(g, 1);
    colAttr.array[i * 3 + 2] = Math.min(b, 1);
  }
  colAttr.needsUpdate = true;
}

// ── Centroid tracking for camera
function computeCentroid(){
  let cx = 0, cy = 0;
  const pa = geometry.attributes.position.array;
  for (let i = 0; i < NUM_PARTICLES; i++){
    cx += pa[i * 3];
    cy += pa[i * 3 + 1];
  }
  return { x: cx / NUM_PARTICLES, y: cy / NUM_PARTICLES };
}

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
let lastColorTime = 0;
const smoothCentroid = { x: 0, y: 0 };

function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Morph ramp: 0→1 over 20s, then hold at 1
  morphT = Math.min(elapsed / 20, 1);
  // After full morph, slow breathe to keep it alive
  const breathe = morphT >= 1 ? Math.sin(elapsed * 0.3) * 0.03 : 0;

  const posAttr = geometry.attributes.position;

  for (let i = 0; i < NUM_PARTICLES; i++){
    const px = posAttr.array[i * 3];
    const py = posAttr.array[i * 3 + 1];

    // Parent's curl flow (attenuated as morph progresses)
    const flow = curlFlow(px, py, elapsed);
    const flowScale = (1 - morphT * 0.7);
    velocities[i * 2] += flow.vx * 0.02 * flowScale;
    velocities[i * 2 + 1] += flow.vy * 0.02 * flowScale;

    // Narthex attraction (grows with morphT)
    if (morphT > 0.02){
      const attr = attractToNarthex(px, py);
      velocities[i * 2] += attr.ax * morphT * 0.06;
      velocities[i * 2 + 1] += attr.ay * morphT * 0.06;

      // If inside form, gentle vertical micro-drift (rising energy, like incense)
      if (attr.inside){
        velocities[i * 2 + 1] += 0.003 * morphT;
        // Slight lateral oscillation inside columns
        velocities[i * 2] += Math.sin(py * 2 + elapsed * 0.5 + i * 0.01) * 0.001;
      }
    }

    // Breathing pulse after morph complete
    if (breathe !== 0){
      const d = distToNarthex(px, py);
      if (d < 0.5 && d > -2){
        const norm = distToNarthex(px + 0.05, py) - distToNarthex(px - 0.05, py);
        const normy = distToNarthex(px, py + 0.05) - distToNarthex(px, py - 0.05);
        const nl = Math.sqrt(norm * norm + normy * normy) + 0.001;
        velocities[i * 2] += (norm / nl) * breathe * 0.3;
        velocities[i * 2 + 1] += (normy / nl) * breathe * 0.3;
      }
    }

    // Damping
    velocities[i * 2] *= 0.988;
    velocities[i * 2 + 1] *= 0.988;

    posAttr.array[i * 3] += velocities[i * 2];
    posAttr.array[i * 3 + 1] += velocities[i * 2 + 1];
  }
  posAttr.needsUpdate = true;

  // Color update every 0.4s
  if (elapsed - lastColorTime > 0.4){
    updateColors(elapsed);
    lastColorTime = elapsed;
  }

  // Camera tracks centroid, pulls back as form grows tall
  const cent = computeCentroid();
  smoothCentroid.x += (cent.x - smoothCentroid.x) * 0.02;
  smoothCentroid.y += (cent.y - smoothCentroid.y) * 0.02;

  const camZ = 22 + morphT * 3; // pull back as columns rise
  camera.position.x = smoothCentroid.x + Math.sin(elapsed * 0.06) * 0.6;
  camera.position.y = smoothCentroid.y + 0.5 + Math.cos(elapsed * 0.04) * 0.4;
  camera.position.z = camZ;
  camera.lookAt(smoothCentroid.x, smoothCentroid.y + 0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
