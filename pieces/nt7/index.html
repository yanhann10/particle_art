<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: gentle -->
<title>nt7 · luminous strata · James Turrell</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080610; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size:11px; letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">nt7 · luminous strata · James Turrell</div>
<div class="hint">Aten Reign 2013 · we eat light, drink it through our skins</div>
<div class="src">James Turrell · Roden Crater · Ganzfeld</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080610, 1);
document.body.appendChild(renderer.domElement);

// --- Turrell palette: 5 hand-picked colors ---
// Deep indigo base → cyan aperture → warm magenta → soft amber → pale rose
const PALETTE = [
  new THREE.Color(0.08, 0.06, 0.22),  // deep indigo-violet
  new THREE.Color(0.15, 0.55, 0.72),  // Turrell cyan (Aten Reign upper ring)
  new THREE.Color(0.72, 0.18, 0.45),  // magenta-rose (Ganzfeld transition)
  new THREE.Color(0.88, 0.62, 0.28),  // warm amber (Roden Crater sunset)
  new THREE.Color(0.82, 0.72, 0.78),  // pale rose-white (the innermost glow)
];

// --- Instanced planes ---
const LAYERS = 12;         // horizontal strata
const PER_LAYER = 280;     // planes per layer
const COUNT = LAYERS * PER_LAYER;

const planeGeo = new THREE.PlaneGeometry(1, 1);
const dummy = new THREE.Object3D();

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    attribute vec3 aColor;
    attribute float aLayer;
    attribute float aSeed;
    attribute float aSize;
    uniform float uTime;
    varying vec3 vColor;
    varying float vAlpha;
    varying vec2 vUv;

    void main(){
      vUv = uv;
      vColor = aColor;

      // breathing: gentle sinusoidal expansion per layer
      float layerPhase = aLayer * 0.52 + uTime * 0.18;
      float breathe = 1.0 + 0.12 * sin(layerPhase);
      float personalPhase = aSeed * 6.2832 + uTime * 0.25;
      float personalBreath = 1.0 + 0.06 * sin(personalPhase);

      // scale the instance matrix position by breathing
      vec4 worldPos = instanceMatrix * vec4(position * aSize * personalBreath, 1.0);
      // expand radially from center based on layer breathe
      vec3 wp = worldPos.xyz;
      float radialDist = length(wp.xz);
      vec2 radialDir = radialDist > 0.01 ? wp.xz / radialDist : vec2(0.0);
      wp.xz += radialDir * (breathe - 1.0) * radialDist;

      vec4 mv = viewMatrix * vec4(wp, 1.0);
      gl_Position = projectionMatrix * mv;

      // opacity: low base, varies with depth and seed
      float depthFade = smoothstep(120.0, 10.0, -mv.z);
      vAlpha = (0.04 + 0.04 * sin(personalPhase * 0.7)) * depthFade;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    varying vec2 vUv;
    void main(){
      // soft rectangular falloff — not a hard quad
      vec2 c = vUv - 0.5;
      float edge = 1.0 - smoothstep(0.3, 0.5, abs(c.x)) - smoothstep(0.3, 0.5, abs(c.y));
      edge = max(edge, 0.0);
      float a = vAlpha * edge;
      gl_FragColor = vec4(vColor * a * 1.8, a);
    }
  `
});

const mesh = new THREE.InstancedMesh(planeGeo, mat, COUNT);
mesh.frustumCulled = false;

// Per-instance attributes
const colorAttr = new Float32Array(COUNT * 3);
const layerAttr = new Float32Array(COUNT);
const seedAttr = new Float32Array(COUNT);
const sizeAttr = new Float32Array(COUNT);

// Build strata: concentric elliptical rings (like Aten Reign viewed from below)
// Each layer is a horizontal band at a different Y, with planes arranged in elliptical patterns
const layerSpacing = 2.8;
const baseY = -((LAYERS - 1) * layerSpacing) / 2;

for (let L = 0; L < LAYERS; L++){
  const t = L / (LAYERS - 1); // 0..1 from bottom to top
  const y = baseY + L * layerSpacing;

  // Color: interpolate through palette based on layer
  const palIdx = t * (PALETTE.length - 1);
  const pi0 = Math.floor(palIdx);
  const pi1 = Math.min(pi0 + 1, PALETTE.length - 1);
  const pf = palIdx - pi0;
  const layerColor = new THREE.Color().lerpColors(PALETTE[pi0], PALETTE[pi1], pf);

  // Ring radius varies: wider at edges, narrow at center (funnel shape like Aten Reign)
  const ringRadius = 6 + 10 * Math.pow(Math.abs(t - 0.5) * 2, 0.7);

  for (let p = 0; p < PER_LAYER; p++){
    const idx = L * PER_LAYER + p;
    const angle = (p / PER_LAYER) * Math.PI * 2 + (L * 0.3);
    const rVar = ringRadius * (0.6 + Math.random() * 0.8);
    const angleVar = angle + (Math.random() - 0.5) * 0.4;

    const x = Math.cos(angleVar) * rVar;
    const z = Math.sin(angleVar) * rVar;
    const yOff = (Math.random() - 0.5) * layerSpacing * 0.6;

    dummy.position.set(x, y + yOff, z);
    // Planes face roughly toward center-up, with variation
    dummy.lookAt(0, y, 0);
    dummy.rotateX((Math.random() - 0.5) * 0.5);
    dummy.rotateY((Math.random() - 0.5) * 0.5);
    dummy.updateMatrix();
    mesh.setMatrixAt(idx, dummy.matrix);

    // Slight per-instance color variation
    const hueShift = (Math.random() - 0.5) * 0.08;
    colorAttr[idx * 3]     = Math.max(0, layerColor.r + hueShift);
    colorAttr[idx * 3 + 1] = Math.max(0, layerColor.g + hueShift * 0.5);
    colorAttr[idx * 3 + 2] = Math.max(0, layerColor.b - hueShift * 0.3);

    layerAttr[idx] = L;
    seedAttr[idx] = Math.random();
    sizeAttr[idx] = 2.5 + Math.random() * 3.5; // plane size
  }
}

mesh.instanceMatrix.needsUpdate = true;
planeGeo.setAttribute('aColor', new THREE.InstancedBufferAttribute(colorAttr, 3));
planeGeo.setAttribute('aLayer', new THREE.InstancedBufferAttribute(layerAttr, 1));
planeGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seedAttr, 1));
planeGeo.setAttribute('aSize', new THREE.InstancedBufferAttribute(sizeAttr, 1));

scene.add(mesh);

// --- Ambient atmospheric fog planes: large translucent sheets filling the volume ---
const fogCount = 40;
const fogGeo = new THREE.PlaneGeometry(1, 1);
const fogMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    attribute vec3 aFogColor;
    attribute float aFogSeed;
    uniform float uTime;
    varying vec3 vColor;
    varying float vAlpha;
    varying vec2 vUv;
    void main(){
      vUv = uv;
      vColor = aFogColor;
      float breathe = 1.0 + 0.05 * sin(aFogSeed * 6.28 + uTime * 0.12);
      vec4 worldPos = instanceMatrix * vec4(position * breathe, 1.0);
      vec4 mv = viewMatrix * vec4(worldPos.xyz, 1.0);
      gl_Position = projectionMatrix * mv;
      float depthFade = smoothstep(150.0, 20.0, -mv.z);
      vAlpha = 0.015 * depthFade;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float r = length(c);
      float a = vAlpha * smoothstep(0.5, 0.15, r);
      gl_FragColor = vec4(vColor * a * 2.0, a);
    }
  `
});

const fogMesh = new THREE.InstancedMesh(fogGeo, fogMat, fogCount);
fogMesh.frustumCulled = false;
const fogColorAttr = new Float32Array(fogCount * 3);
const fogSeedAttr = new Float32Array(fogCount);
for (let i = 0; i < fogCount; i++){
  const t = i / fogCount;
  const y = (t - 0.5) * LAYERS * layerSpacing * 1.2;
  dummy.position.set(
    (Math.random() - 0.5) * 8,
    y,
    (Math.random() - 0.5) * 8
  );
  dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  dummy.scale.setScalar(20 + Math.random() * 25);
  dummy.updateMatrix();
  fogMesh.setMatrixAt(i, dummy.matrix);
  const ci = Math.floor(t * (PALETTE.length - 1));
  const cf = t * (PALETTE.length - 1) - ci;
  const fc = new THREE.Color().lerpColors(PALETTE[ci], PALETTE[Math.min(ci+1, PALETTE.length-1)], cf);
  fogColorAttr[i*3] = fc.r;
  fogColorAttr[i*3+1] = fc.g;
  fogColorAttr[i*3+2] = fc.b;
  fogSeedAttr[i] = Math.random();
}
fogMesh.instanceMatrix.needsUpdate = true;
fogGeo.setAttribute('aFogColor', new THREE.InstancedBufferAttribute(fogColorAttr, 3));
fogGeo.setAttribute('aFogSeed', new THREE.InstancedBufferAttribute(fogSeedAttr, 1));
scene.add(fogMesh);

// --- Camera: slow vertical drift through the strata (inhabitable) ---
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();

function loop(){
  const now = performance.now();
  const t = (now - startTime) / 1000;

  mat.uniforms.uTime.value = t;
  fogMat.uniforms.uTime.value = t;

  // Camera: slow ascending spiral inside the funnel
  const camCycleY = 80; // seconds for full vertical traverse
  const camCycleOrbit = 120;
  const yRange = LAYERS * layerSpacing * 0.4;
  const yCenter = 0;
  const camY = yCenter + Math.sin(t * Math.PI * 2 / camCycleY) * yRange;
  const camAngle = t * Math.PI * 2 / camCycleOrbit;
  const camRadius = 22 + 6 * Math.sin(t * 0.07);
  camera.position.set(
    Math.cos(camAngle) * camRadius,
    camY,
    Math.sin(camAngle) * camRadius
  );
  // Look slightly above center to emphasize the funnel
  camera.lookAt(0, camY * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;

  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);

    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
