<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0d1 · Shiota — Two Home Countries (Blood Moon)</title>
<!-- MOTION: breathe, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>

<body>
<div class="id">0d1</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0045);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060202, 0.02));

const pL = new THREE.PointLight(0xffe8d0, 0.09, 50, 1.8);
pL.position.set(2.0, 18.0, -3.0);
scene.add(pL);

let seed = 73926184;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 44, h: 36, d: 50 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a pale moon caught in arterial web
const sphereCenter = new THREE.Vector3(0.3, 0.8, -0.1);
const SPHERE_R = 1.8;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece2, emissive: 0xf2ece2, emissiveIntensity: 0.6,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.32
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner luminance core
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.7, 12, 8),
  new THREE.MeshBasicMaterial({ color: 0xfaf6f0, transparent: true, opacity: 0.05 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// Suspension wires — 5 threads from ceiling to sphere top
const suspPts = [];
for(let i = 0; i < 5; i++){
  const ox = (rng()-0.5)*0.3;
  const oz = (rng()-0.5)*0.25;
  suspPts.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.08, sphereCenter.y + SPHERE_R + 0.05, sphereCenter.z + oz*0.08
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.5
})));

// ── HELPERS
function sphereSurf(){
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2 * rng() - 1);
  return new THREE.Vector3(
    sphereCenter.x + Math.cos(u) * Math.sin(v) * SPHERE_R,
    sphereCenter.y + Math.cos(v) * SPHERE_R,
    sphereCenter.z + Math.sin(u) * Math.sin(v) * SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — truncated icosahedron shells around the sphere
const anchors = [];
const icoVerts = [];
for(let i = 0; i < 12; i++){
  const lat = (i === 0) ? Math.PI/2 : (i === 11) ? -Math.PI/2 :
    ((i <= 5) ? Math.atan(0.5) : -Math.atan(0.5));
  const lon = (i === 0 || i === 11) ? 0 :
    ((i <= 5) ? (i-1)*2*Math.PI/5 : (i-6)*2*Math.PI/5 + Math.PI/5);
  icoVerts.push(new THREE.Vector3(
    Math.cos(lat)*Math.cos(lon), Math.sin(lat), Math.cos(lat)*Math.sin(lon)
  ));
}

// Additional midpoint vertices for truncated icosahedron density
const midVerts = [];
for(let i = 0; i < icoVerts.length; i++){
  for(let j = i+1; j < icoVerts.length; j++){
    if(icoVerts[i].distanceTo(icoVerts[j]) < 1.2){
      midVerts.push(icoVerts[i].clone().add(icoVerts[j]).multiplyScalar(0.5).normalize());
    }
  }
}
const allDirs = [...icoVerts, ...midVerts];

const shellRadii = [3.0, 5.5, 9.0, 14.0, 20.0, 26.0];
for(const R of shellRadii){
  for(const v of allDirs){
    anchors.push(new THREE.Vector3(
      sphereCenter.x + v.x*R + (rng()-0.5)*R*0.04,
      sphereCenter.y + v.y*R + (rng()-0.5)*R*0.04,
      sphereCenter.z + v.z*R + (rng()-0.5)*R*0.04
    ));
  }
}

// Fill remaining anchors with wall-biased points
while(anchors.length < 700){
  const p = rng() < 0.3 ? wallPt() : wallPt().lerp(sphereCenter, 0.05 + rng()*0.25);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 6, sphereCenter.y + 9, sphereCenter.z + 7), r: 2.6 },
  { pos: new THREE.Vector3(sphereCenter.x + 7, sphereCenter.y - 6, sphereCenter.z - 6), r: 2.3 },
  { pos: new THREE.Vector3(sphereCenter.x + 4, sphereCenter.y + 11, sphereCenter.z + 2), r: 1.9 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── RADIAL QUANTIZATION — order near the sphere, chaos at the walls
const QUANT_ANGLE = Math.PI / 10;
function quantize(pt){
  const dx = pt.x - sphereCenter.x, dy = pt.y - sphereCenter.y, dz = pt.z - sphereCenter.z;
  const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
  if(d > 8.0 || d < 0.2) return pt;
  const blend = Math.max(0, 1.0 - d / 8.0);

  const theta = Math.atan2(dz, dx);
  const qTheta = Math.round(theta / QUANT_ANGLE) * QUANT_ANGLE;
  const lTheta = theta + (qTheta - theta) * blend * 0.55;

  const phi = Math.atan2(dy, Math.sqrt(dx*dx + dz*dz));
  const qPhi = Math.round(phi / QUANT_ANGLE) * QUANT_ANGLE;
  const lPhi = phi + (qPhi - phi) * blend * 0.45;

  const rH = Math.cos(lPhi) * d;
  return new THREE.Vector3(
    sphereCenter.x + Math.cos(lTheta) * rH,
    sphereCenter.y + Math.sin(lPhi) * d,
    sphereCenter.z + Math.sin(lTheta) * rH
  );
}

// ── BUILD THREADS — 19000 line segments
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const qa = quantize(a);
  const qb = quantize(b);
  const idx = li * 6;
  positions[idx]=qa.x; positions[idx+1]=qa.y; positions[idx+2]=qa.z;
  positions[idx+3]=qb.x; positions[idx+4]=qb.y; positions[idx+5]=qb.z;
  const mx=(qa.x+qb.x)*0.5, my=(qa.y+qb.y)*0.5, mz=(qa.z+qb.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Cat A: CONVERGENCE — blood vessels toward the moon-heart (52%)
const catA = Math.floor(NUM_LINES * 0.52);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.4){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  const target = sphereSurf();
  // 8% stop short — threads that almost reach but don't, presence-in-absence
  if(rng() < 0.08){
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng()*1.3));
  }
  setLine(a, target, 0);
}

// Cat B: STRUCTURAL WEB — anchor proximity lattice (20%)
const THRESHOLD = 7.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.20);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 120000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;

  // Dendritic branching — Y-forks
  if(rng() < 0.15 && li < NUM_LINES - 3){
    const mid = a.clone().lerp(best, 0.2 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.15 + rng()*0.5));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd, 1);
      catBcount++;
      if(rng() < 0.25 && li < NUM_LINES - 1){
        const mid2 = mid.clone().lerp(bEnd, 0.4 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.05 + rng()*0.25));
        if(!inVoid(bEnd2)){ setLine(mid2, bEnd2, 1); catBcount++; }
      }
    }
  }
}

// Cat C: COCOON — tight wrapping threads around the sphere surface (12%)
const catC = Math.floor(NUM_LINES * 0.12);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const s2 = sphereSurf();
  // Tangential with slight outward push
  const outA = s1.clone();
  const nA = s1.clone().sub(sphereCenter).normalize();
  outA.add(nA.multiplyScalar(rng()*0.15));
  outA.x += (rng()-0.5)*0.3;
  outA.z += (rng()-0.5)*0.3;
  const outB = s2.clone();
  const nB = s2.clone().sub(sphereCenter).normalize();
  outB.add(nB.multiplyScalar(rng()*0.15));
  outB.x += (rng()-0.5)*0.3;
  outB.z += (rng()-0.5)*0.3;
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB, 2);
}

// Cat D: GRAVITY — threads draping from sphere to floor (6%)
const catD = Math.floor(NUM_LINES * 0.06);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  // Bias toward lower hemisphere
  if(sp.y > sphereCenter.y) sp.y = sphereCenter.y - rng() * SPHERE_R;
  const floorPt = new THREE.Vector3(
    sp.x + (rng()-0.5)*4.0,
    -hh,
    sp.z + (rng()-0.5)*4.0
  );
  if(!inVoid(sp)) setLine(sp, floorPt, 3);
}

// Cat E: LONG SPANS — architectural wall-to-wall web (fill remaining)
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.35 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 4);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
const catOpacity = [0.075, 0.045, 0.065, 0.050, 0.035];
const colors = new Float32Array(li * 6);
const baseR = 0xc2/255, baseG = 0x00/255, baseB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.05;
  const bright = op / 0.075;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = baseR * bright;
    colors[i*6+v*3+1] = baseG * bright;
    colors[i*6+v*3+2] = baseB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, stones, diary pages caught in the web
const NUM_FRAGMENTS = 42;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.14;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.6);
  const h = sz * (0.4 + rng()*1.0);
  // Irregular quad — two triangles, hand-wobbled
  const verts = new Float32Array([
    w*(-0.3+rng()*0.15), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.08), 0,
    w*(0.12-rng()*0.25), -h*0.5, 0,
    w*(-0.3+rng()*0.15), h*0.5, 0,
    w*(0.22+rng()*0.28), h*(rng()*0.04), 0,
    w*(0.12-rng()*0.25), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.004 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.05, d*0.015),
    transparent: true,
    opacity: 0.1 + rng()*0.28,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.65){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.12 + rng()*0.76;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    // Float near the sphere
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.0 + rng()*9.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate, narrative arc
// Narrative: approach from within the web, orbit close to the sphere,
// descend below to look up through threads at the moon, rise — return
const pathLen = 1600;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;

  // Asymmetric orbit — viewer is inside the installation
  const rX = 4.8 + Math.sin(p * 0.5) * 1.8 + Math.cos(p * 1.1 + 0.8) * 0.5;
  const rZ = 6.0 + Math.cos(p * 0.4) * 2.2 + Math.sin(p * 0.9 + 1.2) * 0.6;

  const x = cx + Math.sin(p) * rX;
  // Vertical arc: hover, descend past the sphere, look up through threads, rise
  const yBase = cy + 0.3;
  const yWave = Math.sin(p * 0.3 + 0.6) * 5.5
    + Math.cos(p * 0.65 + 1.3) * 2.2
    + Math.sin(p * 1.15 + 3.0) * 0.4;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near-imperceptible, <0.5% variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.00025 * Math.max(0, 1.0 - dist / 35.0);
    const phase = basePositions[idx]*0.15 + basePositions[idx+1]*0.19 + i*0.0006;
    const breath = Math.sin(t*0.014 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.3;
      arr[vi+1] = basePositions[vi+1] + breath*0.2;
      arr[vi+2] = basePositions[vi+2] + breath*0.25;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera dolly
  const speed = 0.0005;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — gravitational center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0016)*0.06;
  look.y += Math.cos(t*0.0013)*0.05;
  look.z += Math.sin(t*0.0019)*0.04;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = 2.0 + Math.sin(t*0.0008)*0.2;
  pL.position.y = 18.0 + Math.cos(t*0.0006)*0.1;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
