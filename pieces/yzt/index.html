<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thread-bound lucy · after chiharu shiota</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc;
        letter-spacing:0.06em; z-index:2; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-family: ui-monospace, monospace; font-size:13px; color:#e5dcd2; opacity:0.6; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy …</div>
<div class="id">yzt</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 3, 40);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

/* ── config ── */
const SEGMENTS = 14000;
const loadingEl = document.getElementById('loading');

/* ── mouse ── */
const mouse = new THREE.Vector2(0, 0);
const smoothMouse = new THREE.Vector2(0, 0);
addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / innerWidth - 0.5) * 2;
  mouse.y = -(e.clientY / innerHeight - 0.5) * 2;
});

/* ── atmosphere: vignette quad ── */
const vignetteGeo = new THREE.PlaneGeometry(2, 2);
const vignetteMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float v = dot(c, c) * 1.8;
      gl_FragColor = vec4(0.0, 0.0, 0.0, v * 0.6);
    }
  `
});
const vignette = new THREE.Mesh(vignetteGeo, vignetteMat);
vignette.renderOrder = 999;
vignette.frustumCulled = false;
const vignetteScene = new THREE.Scene();
const vignetteCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
vignetteScene.add(vignette);

/* ── load Lucy ── */
const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
new PLYLoader().load(PLY_URL, (geometry) => {
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const center = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const scale = 16 / Math.max(size.x, size.y, size.z);
  geometry.translate(-center.x, -center.y, -center.z);
  geometry.scale(scale, scale, scale);

  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
  const sampler = new MeshSurfaceSampler(mesh).build();

  /* ── build thread geometry ── */
  const vCount = SEGMENTS * 2;
  const pos = new Float32Array(vCount * 3);
  const surfAttr = new Float32Array(vCount * 3);
  const farAttr = new Float32Array(vCount * 3);
  const seedAttr = new Float32Array(vCount);
  const endAttr = new Float32Array(vCount); // 0 = surface, 1 = far

  const tmp = new THREE.Vector3();
  const nrm = new THREE.Vector3();

  for (let i = 0; i < SEGMENTS; i++) {
    sampler.sample(tmp, nrm);
    const sx = tmp.x, sy = tmp.y, sz = tmp.z;
    const seed = Math.random();
    const i2 = i * 2;
    seedAttr[i2] = seed;
    seedAttr[i2 + 1] = seed;
    endAttr[i2] = 0.0;
    endAttr[i2 + 1] = 1.0;

    /* far-anchor strategy — Shiota's object-tied threads
       reaching toward architectural boundaries */
    let fx, fy, fz;
    const r = Math.random();

    if (r < 0.38) {
      /* upward — ceiling threads, dominant in Shiota's installations */
      fx = sx + (Math.random() - 0.5) * 10;
      fy = 13 + Math.random() * 7;
      fz = sz + (Math.random() - 0.5) * 10;
    } else if (r < 0.52) {
      /* downward — pooling at floor */
      fx = sx + (Math.random() - 0.5) * 6;
      fy = -11 - Math.random() * 3;
      fz = sz + (Math.random() - 0.5) * 6;
    } else if (r < 0.75) {
      /* lateral — wall threads */
      const ang = Math.random() * Math.PI * 2;
      const wallD = 13 + Math.random() * 7;
      fx = Math.cos(ang) * wallD;
      fy = sy + (Math.random() - 0.5) * 12;
      fz = Math.sin(ang) * wallD;
    } else {
      /* short near-surface threads — dense core gauze */
      const len = 0.8 + Math.random() * 2.5;
      const dx = nrm.x + (Math.random() - 0.5) * 0.7;
      const dy = nrm.y + (Math.random() - 0.5) * 0.7;
      const dz = nrm.z + (Math.random() - 0.5) * 0.7;
      const mag = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
      fx = sx + (dx / mag) * len;
      fy = sy + (dy / mag) * len;
      fz = sz + (dz / mag) * len;
    }

    const ia = i * 6;
    /* vertex A — surface end */
    pos[ia] = sx; pos[ia + 1] = sy; pos[ia + 2] = sz;
    surfAttr[ia] = sx; surfAttr[ia + 1] = sy; surfAttr[ia + 2] = sz;
    farAttr[ia] = fx; farAttr[ia + 1] = fy; farAttr[ia + 2] = fz;
    /* vertex B — far end */
    pos[ia + 3] = fx; pos[ia + 4] = fy; pos[ia + 5] = fz;
    surfAttr[ia + 3] = sx; surfAttr[ia + 4] = sy; surfAttr[ia + 5] = sz;
    farAttr[ia + 3] = fx; farAttr[ia + 4] = fy; farAttr[ia + 5] = fz;
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('surf', new THREE.BufferAttribute(surfAttr, 3));
  geom.setAttribute('far', new THREE.BufferAttribute(farAttr, 3));
  geom.setAttribute('seed', new THREE.BufferAttribute(seedAttr, 1));
  geom.setAttribute('end', new THREE.BufferAttribute(endAttr, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime:   { value: 0 },
      uReveal: { value: 0 },
      uMouse:  { value: new THREE.Vector2(0, 0) }
    },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uReveal;
      uniform vec2  uMouse;
      attribute vec3  surf;
      attribute vec3  far;
      attribute float seed;
      attribute float end;
      varying float vAlpha;

      void main() {
        /* reveal: threads grow from surface outward over time */
        float growDelay = seed * 0.6;
        float grow = clamp((uReveal - growDelay) / 0.8, 0.0, 1.0);
        grow = grow * grow * (3.0 - 2.0 * grow); /* smoothstep */

        vec3 p;
        if (end < 0.5) {
          p = surf;
        } else {
          p = mix(surf, far, grow);
        }

        /* sway — gentle sine wind, stronger at far ends */
        float swayStr = end * grow * 0.18;
        float phase = seed * 6.2831 + uTime * 0.25;
        p.x += sin(phase + p.y * 0.25) * swayStr;
        p.z += cos(phase * 0.73 + p.y * 0.18) * swayStr * 0.7;
        p.y += sin(phase * 0.5 + p.x * 0.1) * swayStr * 0.3;

        /* subtle mouse interaction — far ends drift toward pointer */
        float mPush = end * grow * 0.6;
        vec3 toMouse = vec3(uMouse.x * 12.0, uMouse.y * 8.0, 0.0) - p;
        float mDist = length(toMouse);
        p += toMouse * mPush * exp(-mDist * 0.08) * 0.08;

        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;

        /* alpha: shorter threads denser, longer threads more transparent */
        float threadLen = length(far - surf);
        float density = exp(-threadLen * 0.055);
        vAlpha = mix(0.035, 0.11, density) * grow;

        /* depth fog — distant threads fade */
        float depth = -mv.z;
        vAlpha *= exp(-depth * 0.008);

        /* breathing — subtle global pulse */
        vAlpha *= 0.9 + 0.1 * sin(uTime * 0.4 + seed * 3.14);
      }
    `,
    fragmentShader: `
      varying float vAlpha;
      void main() {
        /* Shiota crimson — #9c1f1f, slightly warm-shifted for additive glow */
        vec3 col = vec3(0.62, 0.13, 0.10);
        gl_FragColor = vec4(col * vAlpha, vAlpha);
      }
    `
  });

  const threads = new THREE.LineSegments(geom, mat);
  scene.add(threads);
  loadingEl.style.display = 'none';

  /* ── animate ── */
  const t0 = performance.now();

  function loop() {
    const elapsed = (performance.now() - t0) / 1000;
    mat.uniforms.uTime.value = elapsed;
    mat.uniforms.uReveal.value = Math.min(1.6, elapsed / 5.0);

    /* smooth mouse */
    smoothMouse.x += (mouse.x - smoothMouse.x) * 0.04;
    smoothMouse.y += (mouse.y - smoothMouse.y) * 0.04;
    mat.uniforms.uMouse.value.copy(smoothMouse);

    /* slow orbit — architectural viewing */
    const orbitR = 38;
    const orbitSpeed = 0.035;
    camera.position.x = Math.sin(elapsed * orbitSpeed) * orbitR;
    camera.position.z = Math.cos(elapsed * orbitSpeed) * orbitR;
    /* camera slightly above center, looking up at the thread canopy */
    camera.position.y = 2.5 + Math.sin(elapsed * 0.018) * 1.2;
    camera.lookAt(0, 1.5, 0);

    renderer.render(scene, camera);
    /* vignette overlay */
    renderer.autoClear = false;
    renderer.render(vignetteScene, vignetteCam);
    renderer.autoClear = true;

    requestAnimationFrame(loop);
  }
  loop();

}, (xhr) => {
  if (xhr.lengthComputable) {
    loadingEl.textContent = `loading lucy · ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
  }
}, () => {
  loadingEl.textContent = 'load failed — check network';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
