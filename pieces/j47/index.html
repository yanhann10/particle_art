<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j47 · words beyond words</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f1e8; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#1a1a1a; }
</style>
</head>
<body>
<div class="id">j47 · words beyond words</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Typographic ribbon: glyphs collapse into binary and re-coalesce
// A 3D Bezier stream of characters dissolving between letter and code

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4f1e8, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 35);
camera.lookAt(0, 0, 0);

// Poem fragments — cyclical, infinite
const poem = "WORDS BEYOND WORDS · language dissolves into code into thought into silence · 01100011 01101111 01100100 01100101 · the binary beneath the breath · TECHNELEGY · cursive streams of meaning · ".split('');

// Character atlas — we'll render each glyph as a sprite with SDF-style rendering
const N_GLYPHS = 280;
const glyphPool = [];

// Bezier ribbon spine
function bezier3(t, p0, p1, p2, p3) {
  const u = 1 - t;
  const tt = t * t, uu = u * u;
  const uuu = uu * u, ttt = tt * t;
  const out = new THREE.Vector3();
  out.copy(p0).multiplyScalar(uuu);
  out.addScaledVector(p1, 3 * uu * t);
  out.addScaledVector(p2, 3 * u * tt);
  out.addScaledVector(p3, ttt);
  return out;
}

const cp0 = new THREE.Vector3(-20, -5, -10);
const cp1 = new THREE.Vector3(-10, 12, 5);
const cp2 = new THREE.Vector3(10, -8, 8);
const cp3 = new THREE.Vector3(20, 6, -5);

// Build glyph instances
for (let i = 0; i < N_GLYPHS; i++) {
  const char = poem[i % poem.length];
  const t = (i / N_GLYPHS);
  const pos = bezier3(t, cp0, cp1, cp2, cp3);
  
  // phase: when to collapse into binary
  const phase = Math.random();
  const isBinary = (char === '0' || char === '1');
  
  glyphPool.push({
    char,
    pos,
    t,
    phase,
    isBinary,
    collapseT: 0,
    age: Math.random() * 10
  });
}

// Render each glyph as a small plane with text texture
const canv = document.createElement('canvas');
canv.width = 64; canv.height = 64;
const ctx = canv.getContext('2d');

function makeGlyphTexture(char) {
  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 48px "Georgia", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, 32, 32);
  const tex = new THREE.CanvasTexture(canv);
  tex.needsUpdate = true;
  return tex;
}

const glyphMeshes = [];
const glyphGeom = new THREE.PlaneGeometry(1.2, 1.2);

for (let i = 0; i < N_GLYPHS; i++) {
  const data = glyphPool[i];
  const tex = makeGlyphTexture(data.char);
  const mat = new THREE.MeshBasicMaterial({ 
    map: tex, 
    transparent: true, 
    opacity: 0.85,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(glyphGeom, mat);
  mesh.position.copy(data.pos);
  mesh.userData = data;
  scene.add(mesh);
  glyphMeshes.push(mesh);
}

// Binary collapse logic: letters explode into 0/1 fragments
const binaryFragments = [];
for (let i = 0; i < 40; i++) {
  const char = Math.random() > 0.5 ? '1' : '0';
  const tex = makeGlyphTexture(char);
  const mat = new THREE.MeshBasicMaterial({ 
    map: tex, 
    transparent: true, 
    opacity: 0,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(glyphGeom.clone(), mat);
  mesh.scale.setScalar(0.5);
  mesh.visible = false;
  scene.add(mesh);
  binaryFragments.push(mesh);
}

let nextFragIdx = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let time = 0;
function loop() {
  time += 0.016;
  
  // Flow glyphs along ribbon
  glyphMeshes.forEach((mesh, idx) => {
    const data = mesh.userData;
    data.age += 0.016;
    
    // advance along curve
    data.t = (data.t + 0.0008) % 1.0;
    data.pos = bezier3(data.t, cp0, cp1, cp2, cp3);
    mesh.position.copy(data.pos);
    
    // collapse cycle: letter → binary → letter
    const cycle = (data.age + data.phase * 6.28) % 8.0;
    if (cycle > 3.5 && cycle < 4.5 && !data.isBinary) {
      // collapse phase
      data.collapseT = Math.min(data.collapseT + 0.05, 1.0);
      mesh.material.opacity = 0.85 * (1.0 - data.collapseT);
      
      // spawn binary fragments
      if (data.collapseT > 0.3 && data.collapseT < 0.35 && Math.random() > 0.7) {
        const frag = binaryFragments[nextFragIdx % binaryFragments.length];
        nextFragIdx++;
        frag.visible = true;
        frag.position.copy(mesh.position);
        frag.position.x += (Math.random() - 0.5) * 3;
        frag.position.y += (Math.random() - 0.5) * 3;
        frag.material.opacity = 0.6;
        frag.userData = { life: 0, vel: new THREE.Vector3(
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.08,
          (Math.random() - 0.5) * 0.08
        )};
      }
    } else {
      // reform
      data.collapseT = Math.max(data.collapseT - 0.04, 0.0);
      mesh.material.opacity = 0.85 * (1.0 - data.collapseT * 0.5);
    }
    
    // billboard
    mesh.quaternion.copy(camera.quaternion);
  });
  
  // animate binary fragments
  binaryFragments.forEach(frag => {
    if (!frag.visible) return;
    const data = frag.userData;
    if (!data) return;
    data.life += 0.016;
    frag.position.add(data.vel);
    frag.material.opacity = Math.max(0, 0.6 - data.life * 0.15);
    if (data.life > 4.0) {
      frag.visible = false;
    }
  });
  
  // gentle camera drift
  camera.position.x = Math.sin(time * 0.08) * 4;
  camera.position.y = 8 + Math.cos(time * 0.12) * 2;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
