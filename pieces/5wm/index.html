<title>5wm · chladni cymatics</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08090b; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;

</style>

<body>
<div class="id">5wm</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Chladni Cymatics ──────────────────────────────────────────
   Ernst Chladni, Entdeckungen über die Theorie des Klanges (1787).
   Sand on a vibrating square plate settles onto nodal lines where
   amplitude = 0. Eigenmodes: u = cos(mπx)cos(nπy) − cos(nπx)cos(mπy).
   50 k GPGPU particles chase −∇|u|² toward the zero-set.
   Mode (m,n) slowly steps through resonant frequencies;
   each transition scatters particles into brief chaos before
   the next crystalline figure snaps into focus.

   Palette: warm sand (#e0cc9e, #f5edda, #8c7a59) on dark gunmetal
   plate — faithful to sand-on-black-metal laboratory aesthetic.
   Camera: gentle overhead orbit, spotlight geometry.
   Narrative arc: chaos → crystallization → scatter → new order.
   ───────────────────────────────────────────────────────────── */

const W = 224, H = 224;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08090b, 1);
document.body.appendChild(renderer.domElement);

const rtOpts = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtOpts);
let rtB = new THREE.WebGLRenderTarget(W, H, rtOpts);

/* ── init: uniform scatter on plate [-1,1]² ── */
const initData = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  initData[i * 4]     = (Math.random() * 2 - 1) * 0.97;
  initData[i * 4 + 1] = (Math.random() * 2 - 1) * 0.97;
  initData[i * 4 + 2] = 0;
  initData[i * 4 + 3] = 0;
}
const initTex = new THREE.DataTexture(initData, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camO = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA);
renderer.render(blitScene, camO);
renderer.setRenderTarget(null);

/* ── Chladni mode sequence ── */
const modes = [
  [1,2],[2,3],[1,3],[3,4],[2,5],[1,4],[3,5],[4,5],[2,4],[5,6],[3,7],[4,7]
];

const simU = {
  prev:   { value: rtA.texture },
  uM1:    { value: 1.0 },
  uN1:    { value: 2.0 },
  uM2:    { value: 2.0 },
  uN2:    { value: 3.0 },
  uBlend: { value: 0.0 },
  uForce: { value: 3.0 },
  uDamp:  { value: 0.91 },
  uNoise: { value: 0.002 },
  uSeed:  { value: 0.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D prev;
    uniform float uM1, uN1, uM2, uN2, uBlend;
    uniform float uForce, uDamp, uNoise, uSeed;
    varying vec2 vUv;

    #define PI 3.14159265359
    #define DT 0.014

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453);
    }

    /* Chladni eigenmode on square plate */
    float chladni(vec2 p, float m, float n){
      return cos(m*PI*p.x)*cos(n*PI*p.y)
           - cos(n*PI*p.x)*cos(m*PI*p.y);
    }

    /* Gradient of u² = 2u · ∇u  → particles roll downhill toward u=0 */
    vec2 gradU2(vec2 p, float m, float n){
      float u  = chladni(p, m, n);
      float dx = -m*PI*sin(m*PI*p.x)*cos(n*PI*p.y)
                 +n*PI*sin(n*PI*p.x)*cos(m*PI*p.y);
      float dy = -n*PI*cos(m*PI*p.x)*sin(n*PI*p.y)
                 +m*PI*cos(n*PI*p.x)*sin(m*PI*p.y);
      return 2.0 * u * vec2(dx, dy);
    }

    void main(){
      vec4 s  = texture2D(prev, vUv);
      vec2 pos = s.xy;
      vec2 vel = s.zw;

      vec2 g1 = gradU2(pos, uM1, uN1);
      vec2 g2 = gradU2(pos, uM2, uN2);
      vec2 g  = mix(g1, g2, uBlend);

      vec2 force = -g * uForce;

      /* Brownian jitter — deliberate granularity */
      vec2 rng = vec2(
        hash(vUv + uSeed)       - 0.5,
        hash(vUv + uSeed + 0.37) - 0.5
      );

      vel = vel * uDamp + force * DT + rng * uNoise;
      pos += vel * DT;

      /* Reflect off plate edges */
      if(pos.x >  1.0){ pos.x =  2.0 - pos.x; vel.x *= -0.4; }
      if(pos.x < -1.0){ pos.x = -2.0 - pos.x; vel.x *= -0.4; }
      if(pos.y >  1.0){ pos.y =  2.0 - pos.y; vel.y *= -0.4; }
      if(pos.y < -1.0){ pos.y = -2.0 - pos.y; vel.y *= -0.4; }

      gl_FragColor = vec4(pos, vel);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ── 3D Scene ── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 60);

/* Dark metallic plate */
const plateMat = new THREE.MeshStandardMaterial({
  color: 0x16181c, metalness: 0.88, roughness: 0.28, side: THREE.DoubleSide
});
const plate = new THREE.Mesh(new THREE.PlaneGeometry(2.12, 2.12), plateMat);
plate.rotation.x = -Math.PI / 2;
scene.add(plate);

/* Plate edge bevel */
const edgeGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.12, 2.12));
const edgeMat = new THREE.LineBasicMaterial({ color: 0x3c3f48, transparent: true, opacity: 0.35 });
const edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
edgeLine.rotation.x = -Math.PI / 2;
edgeLine.position.y = 0.002;
scene.add(edgeLine);

/* Lighting — warm spotlight above, cool fill from side */
const spot = new THREE.SpotLight(0xffe4c4, 1.6, 12, Math.PI * 0.22, 0.6, 1.2);
spot.position.set(0.3, 5, 0.5);
spot.target.position.set(0, 0, 0);
scene.add(spot);
scene.add(spot.target);

const fill = new THREE.DirectionalLight(0x8094aa, 0.25);
fill.position.set(-3, 1.5, -2);
scene.add(fill);

const amb = new THREE.AmbientLight(0x0e1014, 0.6);
scene.add(amb);

/* ── Sand particles ── */
const pGeo = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdx[i * 2]     = (x + 0.5) / W;
  uvIdx[i * 2 + 1] = (y + 0.5) / H;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
pGeo.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdx, 2));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uPx:   { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPx;
    attribute vec2 uvIdx;
    varying float vSpd;
    varying float vHash;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = vec3(s.x, 0.012, s.y);
      vSpd  = length(s.zw);
      vHash = fract(sin(dot(uvIdx, vec2(12.9898,78.233))) * 43758.5453);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* Settled grains are smaller; moving grains streak slightly larger */
      gl_PointSize = (0.7 + clamp(vSpd * 6.0, 0.0, 1.8)) * uPx * (5.5 / max(dist, 0.5));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSpd;
    varying float vHash;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if(r2 > 0.25) discard;
      float a = exp(-r2 * 18.0);

      /* Sand palette — 4 hand-picked tones:
         #e0cc9e warm sand, #f5edda bright highlight,
         #8c7a59 shadow grain, #c4a96a mid-tone */
      vec3 cWarm   = vec3(0.878, 0.800, 0.620);
      vec3 cBright = vec3(0.961, 0.929, 0.855);
      vec3 cShadow = vec3(0.549, 0.478, 0.349);
      vec3 cMid    = vec3(0.769, 0.663, 0.416);

      float sp = clamp(vSpd * 10.0, 0.0, 1.0);
      /* Per-grain variation via hash — some grains are brighter, some darker */
      vec3 base = mix(cShadow, cWarm, smoothstep(0.0, 0.45, vHash));
      base = mix(base, cMid, smoothstep(0.45, 0.75, vHash));
      vec3 col = mix(base, cBright, sp * 0.55);

      float alpha = a * (0.42 + sp * 0.45);
      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});
const pts = new THREE.Points(pGeo, pMat);
scene.add(pts);

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Pointer: nudge force strength ── */
let pointerForce = 3.0;
addEventListener('pointermove', (e) => {
  const ny = e.clientY / innerHeight;
  pointerForce = 2.0 + ny * 3.0;
});

/* ── Animation loop ── */
let modeIdx  = 0;
let modeTime = 0;
const modeDur   = 8.0;
const transDur  = 2.8;
const startT    = performance.now();
let lastT       = startT;

function loop() {
  const now = performance.now();
  const dt  = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  modeTime += dt;

  const cur  = modes[modeIdx % modes.length];
  const next = modes[(modeIdx + 1) % modes.length];

  if (modeTime > modeDur) {
    modeTime -= modeDur;
    modeIdx++;
  }

  /* Smooth blend in last transDur seconds of each mode */
  const raw = modeTime > (modeDur - transDur)
    ? (modeTime - (modeDur - transDur)) / transDur : 0.0;
  const blend = raw * raw * (3.0 - 2.0 * raw);

  simU.uM1.value    = cur[0];
  simU.uN1.value    = cur[1];
  simU.uM2.value    = next[0];
  simU.uN2.value    = next[1];
  simU.uBlend.value = blend;
  simU.uSeed.value  = now * 0.001;
  simU.uForce.value += (pointerForce - simU.uForce.value) * 0.05;

  /* Scatter noise rises during transitions — chaos before crystallization */
  simU.uNoise.value = 0.002 + blend * 0.016;

  /* 3 sim sub-steps per frame */
  for (let i = 0; i < 3; i++) {
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camO);
    [rtA, rtB] = [rtB, rtA];
  }
  renderer.setRenderTarget(null);
  pMat.uniforms.state.value = rtA.texture;

  /* Camera: gentle overhead orbit */
  const elapsed = (now - startT) * 0.001;
  const ang = elapsed * 0.055;
  const cR  = 3.6;
  const cH  = 2.8 + Math.sin(elapsed * 0.07) * 0.12;
  camera.position.set(Math.sin(ang) * cR, cH, Math.cos(ang) * cR);
  camera.lookAt(0, -0.06, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
