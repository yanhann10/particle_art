<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cr4 · lucy multi-state · hand-sculpted</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a080c; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; cursor:pointer; }
  #cam { position:fixed; right:14px; bottom:14px; width:240px; height:160px;
         border:1px solid #2a2025; border-radius:4px; transform:scaleX(-1); opacity:0.85; }
  #cam.hidden { display:none; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .state { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a141d; color:#e5dcd2; border:1px solid #4a3a44;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index:5; }
  button.start:hover { background:#26202a; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · stanford 3d scanning repo …</div>
<button class="start" id="startBtn" style="display:none">grant camera · sculpt with hands</button>
<video id="cam" class="hidden" autoplay playsinline muted></video>
<div class="id">cr4</div>
<div class="state" id="stateLabel">state: assembly</div>
<div class="hint" id="hint">click canvas to cycle states</div>
<div class="src">model: stanford 3d scanning repo · public-research</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 30);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a080c, 1);
document.body.appendChild(renderer.domElement);

const N = 60000;
const positions    = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const seeds        = new Float32Array(N);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uPinch: { value: 1.0 },
  uHand:  { value: new THREE.Vector3(0,0,0) },
  uActive:{ value: 0.0 },
  uState: { value: 0.0 },  // 0=assembly, 1=dissolution, 2=constellation
  uTransition: { value: 0.0 }  // crossfade 0→1
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPinch;
    uniform vec3  uHand;
    uniform float uActive;
    uniform float uState;
    uniform float uTransition;
    attribute vec3  rest;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    varying float vAlpha;
    
    vec3 stateAssembly(vec3 p, float t, float s){
      vec3 dir = normalize(p);
      p += dir * sin(t + s*6.28) * 0.06 * (1.0 + 0.5*sin(s*9.0));
      vec3 fromCenter = p;
      float disperse = mix(0.0, 1.5, uPinch * 0.5) * uActive;
      p += fromCenter * disperse;
      vec3 toHand = uHand - p;
      p += toHand * uActive * 0.04;
      return p;
    }
    
    vec3 stateDissolution(vec3 p, float t, float s){
      // particles drift downward and outward, dissolving like ash
      vec3 drift = vec3(sin(s*17.0), -1.0, cos(s*13.0));
      float fallTime = t * 0.3 + s * 2.0;
      p += drift * fallTime * 1.2;
      // hand pull still works
      vec3 toHand = uHand - p;
      p += toHand * uActive * 0.06;
      return p;
    }
    
    vec3 stateConstellation(vec3 p, float t, float s){
      // particles migrate to vertices of dodecahedron shell, pulsing
      float phi = (1.0 + sqrt(5.0)) * 0.5;
      float idx = floor(s * 20.0);
      vec3 target = vec3(0.0);
      if(idx < 1.0) target = normalize(vec3(1,1,1));
      else if(idx < 2.0) target = normalize(vec3(1,1,-1));
      else if(idx < 3.0) target = normalize(vec3(1,-1,1));
      else if(idx < 4.0) target = normalize(vec3(1,-1,-1));
      else if(idx < 5.0) target = normalize(vec3(-1,1,1));
      else if(idx < 6.0) target = normalize(vec3(-1,1,-1));
      else if(idx < 7.0) target = normalize(vec3(-1,-1,1));
      else if(idx < 8.0) target = normalize(vec3(-1,-1,-1));
      else if(idx < 9.0) target = normalize(vec3(0,phi,1.0/phi));
      else if(idx < 10.0) target = normalize(vec3(0,phi,-1.0/phi));
      else if(idx < 11.0) target = normalize(vec3(0,-phi,1.0/phi));
      else if(idx < 12.0) target = normalize(vec3(0,-phi,-1.0/phi));
      else if(idx < 13.0) target = normalize(vec3(1.0/phi,0,phi));
      else if(idx < 14.0) target = normalize(vec3(-1.0/phi,0,phi));
      else if(idx < 15.0) target = normalize(vec3(1.0/phi,0,-phi));
      else if(idx < 16.0) target = normalize(vec3(-1.0/phi,0,-phi));
      else if(idx < 17.0) target = normalize(vec3(phi,1.0/phi,0));
      else if(idx < 18.0) target = normalize(vec3(phi,-1.0/phi,0));
      else if(idx < 19.0) target = normalize(vec3(-phi,1.0/phi,0));
      else target = normalize(vec3(-phi,-1.0/phi,0));
      
      target *= 12.0;
      float pulse = sin(t*0.8 + s*12.0) * 0.4;
      target += normalize(target) * pulse;
      p = mix(p, target, smoothstep(0.0, 1.0, uTransition));
      
      vec3 toHand = uHand - p;
      p += toHand * uActive * 0.05;
      return p;
    }
    
    void main(){
      vec3 p = rest;
      float t = uTime * 0.5 + seed * 6.28;
      
      vec3 pAssembly = stateAssembly(rest, t, seed);
      vec3 pDissolution = stateDissolution(rest, t, seed);
      vec3 pConstellation = stateConstellation(rest, t, seed);
      
      if(uState < 0.5){
        // assembly → dissolution transition
        p = mix(pAssembly, pDissolution, uTransition);
      } else if(uState < 1.5){
        // dissolution → constellation transition
        p = mix(pDissolution, pConstellation, uTransition);
      } else {
        // constellation → assembly transition
        p = mix(pConstellation, pAssembly, uTransition);
      }
      
      vEnergy = 0.4 + 0.6*sin(t*0.7);
      
      // state-dependent color
      vec3 ivory = vec3(0.95, 0.92, 0.86);
      vec3 amber = vec3(0.98, 0.78, 0.55);
      vec3 ember = vec3(0.78, 0.32, 0.22);
      vec3 ashen = vec3(0.45, 0.42, 0.40);
      vec3 stellar = vec3(0.85, 0.92, 0.98);
      
      vec3 colAssembly = mix(ivory, mix(amber, ember, smoothstep(0.78, 1.0, vEnergy) * 0.6), vEnergy);
      vec3 colDissolution = mix(ashen, ember * 0.5, vEnergy * 0.3);
      vec3 colConstellation = mix(stellar, vec3(0.92, 0.95, 0.82), sin(seed*20.0)*0.5+0.5);
      
      if(uState < 0.5){
        vCol = mix(colAssembly, colDissolution, uTransition);
      } else if(uState < 1.5){
        vCol = mix(colDissolution, colConstellation, uTransition);
      } else {
        vCol = mix(colConstellation, colAssembly, uTransition);
      }
      
      // alpha fade during dissolution
      vAlpha = 1.0;
      if(uState > 0.4 && uState < 1.1){
        float fallDist = length(p - rest);
        vAlpha = 1.0 - smoothstep(8.0, 18.0, fallDist);
      }
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 1.6*vEnergy) * uPixel * (45.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 17.0) * (0.45 + 0.55*vEnergy) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');
const startBtn  = document.getElementById('startBtn');
const hintEl    = document.getElementById('hint');
const camEl     = document.getElementById('cam');
const stateLabel = document.getElementById('stateLabel');

const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 15 / maxAxis;
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp = new THREE.Vector3();
    for (let i = 0; i < N; i++){
      sampler.sample(tmp);
      restPositions[i*3]   = tmp.x;
      restPositions[i*3+1] = tmp.y;
      restPositions[i*3+2] = tmp.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

    loadingEl.style.display = 'none';
    startBtn.style.display = 'inline-block';
    modelLoaded = true;
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading lucy · ${pct}% · stanford 3d scanning repo`;
    }
  },
  (err) => {
    loadingEl.textContent = 'load failed — check network';
    console.error(err);
  });

let modelLoaded = false;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let handsActive = false;
async function loadMP(){
  const load = (src) => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.crossOrigin = 'anonymous';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js');
  await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js');
}
async function startHands(){
  startBtn.style.display = 'none';
  hintEl.textContent = 'requesting camera…';
  try { await loadMP(); }
  catch { hintEl.textContent = 'mediapipe load failed — click canvas to cycle states'; return; }
  const hands = new window.Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
  hands.onResults((res) => {
    if (!res.multiHandLandmarks || res.multiHandLandmarks.length === 0){
      uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 0.0, 0.05);
      return;
    }
    uniforms.uActive.value = THREE.MathUtils.lerp(uniforms.uActive.value, 1.0, 0.1);
    const lm = res.multiHandLandmarks[0];
    const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y, dz = lm[4].z - lm[8].z;
    const pinch = Math.min(2.0, Math.sqrt(dx*dx+dy*dy+dz*dz) * 6.0);
    uniforms.uPinch.value = THREE.MathUtils.lerp(uniforms.uPinch.value, pinch, 0.15);
    const palm = lm[9];
    const wx = (0.5 - palm.x) * 22;
    const wy = (0.5 - palm.y) * 14;
    uniforms.uHand.value.set(wx, wy, 0.0);
    hintEl.textContent = `hand · pinch=${pinch.toFixed(2)} · click canvas to cycle`;
  });
  camEl.classList.remove('hidden');
  const cam = new window.Camera(camEl, {
    onFrame: async () => { await hands.send({ image: camEl }); },
    width: 320, height: 240
  });
  cam.start();
  handsActive = true;
}
startBtn.addEventListener('click', startHands);

let currentState = 0;
let transitionStart = 0;
const STATE_NAMES = ['assembly', 'dissolution', 'constellation'];

renderer.domElement.addEventListener('click', () => {
  if(!modelLoaded) return;
  currentState = (currentState + 1) % 3;
  transitionStart = performance.now();
  stateLabel.textContent = `state: ${STATE_NAMES[currentState]}`;
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  if(transitionStart > 0){
    const elapsed = (performance.now() - transitionStart) / 1500;
    uniforms.uTransition.value = Math.min(1.0, elapsed);
    if(elapsed >= 1.0) transitionStart = 0;
  } else {
    uniforms.uTransition.value = 1.0;
  }
  
  uniforms.uState.value = currentState;
  
  points.rotation.y = t * 0.05;

  if (!handsActive) {
    uniforms.uPinch.value = 1.0 + 0.25 * Math.sin(t * 0.4);
    uniforms.uActive.value = 0.35;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
