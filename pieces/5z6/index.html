<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5z6 · Shiota — radial quantization web</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">5z6</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.012);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080000, 0.4));
const pL = new THREE.PointLight(0xffe0c8, 0.30, 45, 1.5);
pL.position.set(5.0, 6.5, -2.0);
scene.add(pL);

let seed = 83719204;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── SUSPENDED SPHERE — cottony pale moon
const sphereRadius = 2.6;
const spherePos = new THREE.Vector3(2.8, 1.2, -2.0);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf2eade,
    emissive: 0xf2eade,
    emissiveIntensity: 0.65,
    roughness: 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.85
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── ROOM — architectural scale
const ROOM = { w: 44, h: 32, d: 54 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── TRUNCATED ICOSAHEDRON ANCHORS (Manfred Mohr — geometry generates topology)
// Golden ratio vertices projected into room volume
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [];
// 12 icosahedron vertices
const iv = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
iv.forEach(v => {
  const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  icoVerts.push(new THREE.Vector3(v[0]/len, v[1]/len, v[2]/len));
});

// Scale icosahedron vertices into room at multiple radii from sphere
const structuralAnchors = [];
const radii = [4.5, 7.2, 11.0, 16.0];
radii.forEach(r => {
  icoVerts.forEach(v => {
    const p = v.clone().multiplyScalar(r).add(spherePos);
    if(Math.abs(p.x)<hw && Math.abs(p.y)<hh && Math.abs(p.z)<hd){
      structuralAnchors.push(p);
    }
  });
});

// ── VOID ZONES — deliberate negative space
const voids = [];
for(let i=0; i<4; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*16,
      spherePos.y + (rng()-0.5)*12,
      spherePos.z + (rng()-0.5)*16
    ),
    r: 1.6 + rng()*1.8
  });
}
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── FULL ANCHOR SET
const NUM_ANCHORS = 1100;
const anchors = [...structuralAnchors];

// Suspension anchors — ceiling
for(let i=0; i<8; i++){
  const p = new THREE.Vector3(
    spherePos.x + (rng()-0.5)*3.2,
    hh,
    spherePos.z + (rng()-0.5)*3.2
  );
  anchors.push(p);
}

// Dense shell around sphere
while(anchors.length < NUM_ANCHORS){
  let p;
  const r = rng();
  if(r < 0.50){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.6 + rng()*7.0;
    p = spherePos.clone().add(dir.multiplyScalar(dist));
  } else if(r < 0.75){
    p = wallPt();
    p.lerp(spherePos, 0.12 + rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p) && Math.abs(p.x)<hw && Math.abs(p.y)<hh && Math.abs(p.z)<hd){
    anchors.push(p);
  }
}

// ── RADIAL QUANTIZATION (Vera Molnár — order near sphere, chaos at walls)
// Threads near sphere snap to 15° angular increments
const QUANT_ANGLE = Math.PI / 12; // 15°
function quantizeNearSphere(p){
  const rel = p.clone().sub(spherePos);
  const dist = rel.length();
  if(dist < 8.0 && dist > sphereRadius){
    // Quantize azimuth and elevation
    const strength = 1.0 - (dist - sphereRadius) / (8.0 - sphereRadius);
    const az = Math.atan2(rel.z, rel.x);
    const el = Math.asin(Math.min(1, Math.max(-1, rel.y / dist)));
    const qAz = Math.round(az / QUANT_ANGLE) * QUANT_ANGLE;
    const qEl = Math.round(el / QUANT_ANGLE) * QUANT_ANGLE;
    const lAz = az + (qAz - az) * strength * 0.7;
    const lEl = el + (qEl - el) * strength * 0.7;
    const cosEl = Math.cos(lEl);
    return new THREE.Vector3(
      spherePos.x + Math.cos(lAz) * cosEl * dist,
      spherePos.y + Math.sin(lEl) * dist,
      spherePos.z + Math.sin(lAz) * cosEl * dist
    );
  }
  return p;
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereRadius));
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Suspension threads — 8 from ceiling to sphere top
for(let i=0; i<8; i++){
  const sa = anchors[structuralAnchors.length + i];
  for(let j=0; j<3; j++){
    const target = sphereSurf();
    target.y = spherePos.y + sphereRadius * (0.80 + rng()*0.15);
    setLine(sa, target);
  }
}

// Cat A: sphere-converging threads (44%) — quantized near sphere
const catA = Math.floor(NUM_LINES * 0.44);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.50 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeNearSphere(a);
  // 10% stop short
  if(rng() < 0.10){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.25 + rng()*1.4));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: wall-to-wall threads (26%) — large architectural spans
const catB = Math.floor(NUM_LINES * 0.26);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 18 && rng() > 0.06){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(quantizeNearSphere(a), quantizeNearSphere(b));
}

// Cat C: structural-anchor-to-anchor (geometric network)
const catC = Math.floor(NUM_LINES * 0.14);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const ai = Math.floor(rng()*structuralAnchors.length);
  const a = structuralAnchors[ai];
  if(inVoid(a)) continue;
  // Connect to nearest structural neighbor
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*structuralAnchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(structuralAnchors[bi]);
    if(d < bestD && d > 1.0 && d < 9.0){ bestD = d; best = structuralAnchors[bi]; }
  }
  if(best) setLine(a, best);
}

// Cat D: short dendritic filaments — fill remaining
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<14; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.5){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / stones caught in web
const NUM_FRAGS = 28;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.16;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz*(1.6+rng()*2.4), sz*0.015, sz*(0.8+rng()*1.5))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.03;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.38, d*0.28),
    transparent: true,
    opacity: 0.30 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.25 + rng()*0.50;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI*2, rng()*Math.PI*2, rng()*Math.PI*2);
  scene.add(mesh);
}

// ── CAMERA PATH — interior drift, asymmetric figure-eight weaving through web
const dollyPath = [];
const pathLen = 320;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;

  // Figure-eight lemniscate projected into 3D — viewer inside the web
  const lemnR = 9.5;
  const denom = 1 + Math.sin(phase)*Math.sin(phase)*0.3;
  const x = spherePos.x + Math.sin(phase) * lemnR / denom + Math.sin(phase*2.3)*1.8;
  const y = spherePos.y + Math.sin(phase*0.42 + 0.8)*4.8 + Math.cos(phase*0.7)*1.2;
  const z = spherePos.z + Math.cos(phase) * Math.cos(phase*0.5) * 11.0 + Math.sin(phase*0.3)*2.5;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Micro-breathing — sub-0.4% length variation
  const breathAmp = 0.004;
  const breathFreq = 0.09;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.25 + by*0.72 + bz*0.15 + (i/6)*0.006;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s*0.75;
    arr[i+1] = by + s*0.50;
    arr[i+2] = bz + s*0.35;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — glacial interior drift
  const speed = 0.003;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look at sphere with subtle wander
  const lookTarget = spherePos.clone();
  lookTarget.x += Math.sin(t*0.011)*0.4;
  lookTarget.y += Math.cos(t*0.008)*0.3;
  camera.lookAt(lookTarget);

  // Sphere breathes imperceptibly
  sphere.position.y = spherePos.y + Math.sin(t*0.010)*0.015;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
