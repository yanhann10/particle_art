<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meu · Shiota — Memory Lattice</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">meu</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080101, 0.005));
const key1 = new THREE.PointLight(0x1a0404, 0.014, 32, 2.1);
key1.position.set(-16, 18, 8);
scene.add(key1);

let seed = 743921;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 48, h: 28, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED OBJECT — off-white sphere (the remembered object)
const spherePos = new THREE.Vector3(0, 1.2, -1.4);
const sphereGeo = new THREE.SphereGeometry(1.8, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0,
  emissive: 0xd0c4b0,
  emissiveIntensity: 0.65,
  roughness: 0.92,
  metalness: 0.02
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0x1c0505, 0.009, 18, 2.6);
sphereGlow.position.copy(spherePos);
scene.add(sphereGlow);

// GRID ANCHORS — truncated icosahedron vertices projected into room volume
const phi = (1 + Math.sqrt(5))/2;
const baseVerts = [
  [0,1,3*phi],[0,1,-3*phi],[0,-1,3*phi],[0,-1,-3*phi],
  [1,3*phi,0],[1,-3*phi,0],[-1,3*phi,0],[-1,-3*phi,0],
  [3*phi,0,1],[3*phi,0,-1],[-3*phi,0,1],[-3*phi,0,-1],
  [2,1+2*phi,phi],[2,1+2*phi,-phi],[2,-1-2*phi,phi],[2,-1-2*phi,-phi],
  [-2,1+2*phi,phi],[-2,1+2*phi,-phi],[-2,-1-2*phi,phi],[-2,-1-2*phi,-phi],
  [1+2*phi,phi,2],[1+2*phi,-phi,2],[1+2*phi,phi,-2],[1+2*phi,-phi,-2],
  [-1-2*phi,phi,2],[-1-2*phi,-phi,2],[-1-2*phi,phi,-2],[-1-2*phi,-phi,-2],
  [phi,2,1+2*phi],[phi,2,-1-2*phi],[-phi,2,1+2*phi],[-phi,2,-1-2*phi],
  [phi,-2,1+2*phi],[phi,-2,-1-2*phi],[-phi,-2,1+2*phi],[-phi,-2,-1-2*phi]
];

const anchors = [];
const scale = 5.2;
for(let i=0; i<baseVerts.length; i++){
  const [x,y,z] = baseVerts[i];
  anchors.push(new THREE.Vector3(x*scale, y*scale, z*scale));
}

// SECONDARY ANCHORS — edge midpoints
const tempAnchors = [...anchors];
for(let i=0; i<tempAnchors.length; i++){
  const a = tempAnchors[i];
  let nearest = [];
  for(let j=0; j<tempAnchors.length; j++){
    if(i===j) continue;
    const d = a.distanceTo(tempAnchors[j]);
    if(d < 18.0) nearest.push(tempAnchors[j]);
  }
  if(nearest.length > 0){
    for(let k=0; k<Math.min(2, nearest.length); k++){
      const mid = a.clone().lerp(nearest[k], 0.5);
      anchors.push(mid);
    }
  }
}

// WALL PLANE ANCHORS
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange;
      const v = (j/steps - 0.5) * vRange;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.94, ROOM.d*0.94, 6));
anchors.push(...wallGrid('x', hw, ROOM.h*0.94, ROOM.d*0.94, 6));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.94, ROOM.d*0.94, 7));
anchors.push(...wallGrid('y', hh, ROOM.w*0.94, ROOM.d*0.94, 7));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.94, ROOM.h*0.94, 6));
anchors.push(...wallGrid('z', hd, ROOM.w*0.94, ROOM.h*0.94, 6));

// SPHERE SURFACE ANCHORS — fibonacci spiral sampling
const sphereAnchors = [];
const fibN = 48;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<fibN; i++){
  const y = 1 - (i / (fibN-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const p = new THREE.Vector3(x*1.8, y*1.8, z*1.8).add(spherePos);
  sphereAnchors.push(p);
}

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: SUSPENSION THREADS — ceiling to sphere top
const suspCount = 24;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2;
  const r = 0.62 + (i%5)*0.20;
  const x = spherePos.x + Math.cos(angle)*r;
  const z = spherePos.z + Math.sin(angle)*r*0.68;
  const sphereTop = new THREE.Vector3(x, spherePos.y + 1.8, z);
  
  const ceilX = sphereTop.x + (rng()-0.5)*3.2;
  const ceilZ = sphereTop.z + (rng()-0.5)*2.8;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sphereTop);
}

// CATEGORY B: RADIAL THREADS — sphere out to structure anchors (circulatory)
for(let i=0; i<sphereAnchors.length && li<NUM_LINES-19600; i++){
  const sa = sphereAnchors[i];
  const dir = sa.clone().sub(spherePos).normalize();
  
  // Primary radial
  const len1 = 18.0 + rng()*14.0;
  const end1 = sa.clone().add(dir.clone().multiplyScalar(len1));
  setLine(sa, end1);
  
  // Secondary branch at 65%
  if(rng()<0.44 && li<NUM_LINES-19400){
    const perpAxis = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branch = dir.clone().applyAxisAngle(perpAxis, 0.54 + rng()*0.42).normalize();
    const mid = sa.clone().add(dir.clone().multiplyScalar(len1*0.65));
    const end2 = mid.clone().add(branch.multiplyScalar(7.8 + rng()*5.6));
    setLine(mid, end2);
  }
}

// CATEGORY C: CONVERGENT THREADS — wall anchors to sphere surface (failing reach)
const convergeBudget = 3800;
for(let i=0; i<convergeBudget && li<NUM_LINES-15000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(spherePos);
  if(dSphere < 4.5) continue;
  
  let closest = sphereAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<5; k++){
    const candidate = sphereAnchors[Math.floor(rng()*sphereAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 22% fail to reach sphere — threads that fall short
  if(rng()<0.22){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.28 + rng()*0.58);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// CATEGORY D: TRUNCATED ICO EDGES — primary geometric skeleton
for(let i=0; i<tempAnchors.length && li<NUM_LINES-11000; i++){
  const a = tempAnchors[i];
  for(let j=i+1; j<tempAnchors.length && li<NUM_LINES-11000; j++){
    const b = tempAnchors[j];
    const d = a.distanceTo(b);
    if(d > 10.0 && d < 18.0){
      setLine(a, b);
    }
  }
}

// CATEGORY E: PROXIMITY WEB — nearest-neighbor within threshold
const THRESH = 11.2;
let webCount = 0, attempts = 0;
while(webCount<4200 && li<NUM_LINES-6000 && attempts<24000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY F: HORIZONTAL SPANS — crossing the void
for(let i=0; i<580 && li<NUM_LINES-5200; i++){
  const y = spherePos.y + (rng()-0.5)*11.0;
  const x1 = -hw + rng()*6.4;
  const z1 = (rng()-0.5)*ROOM.d*0.92;
  const x2 = hw - rng()*6.4;
  const z2 = (rng()-0.5)*ROOM.d*0.92;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// CATEGORY G: VERTICAL THREADS — floor to ceiling
for(let i=0; i<480 && li<NUM_LINES-4600; i++){
  const x = (rng()-0.5)*ROOM.w*0.90;
  const z = (rng()-0.5)*ROOM.d*0.90;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*2.0, hh, z + (rng()-0.5)*2.0);
  setLine(a, b);
}

// CATEGORY H: DIAGONAL CROSS-THREADS
for(let i=0; i<420 && li<NUM_LINES-4000; i++){
  const x1 = (rng()-0.5)*ROOM.w*0.88;
  const z1 = (rng()-0.5)*ROOM.d*0.88;
  const a = new THREE.Vector3(x1, -hh, z1);
  
  const x2 = x1 + (rng()-0.5)*10.4;
  const z2 = z1 + (rng()-0.5)*10.4;
  const b = new THREE.Vector3(x2, hh, z2);
  setLine(a, b);
}

// CATEGORY I: WALL-TO-WALL SPANS — long distance threads
let wallSpans = 0;
while(wallSpans<2400 && li<NUM_LINES-1400){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>10.0 && d<28.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY J: FILL remaining budget with medium-distance threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>8.0 && d<20.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.062,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — slow drift inside the network
const pathLen = 3200;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.24){
    const lt = t/0.24;
    const angle = Math.PI*0.08 + lt*Math.PI*0.96;
    const r = 22.4 - lt*8.6;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 10.8 - lt*7.6;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.50){
    const lt = (t-0.24)/0.26;
    const angle = Math.PI*1.04 + lt*Math.PI*1.46;
    const r = 13.8 + Math.sin(lt*Math.PI*1.4)*2.4;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 3.2 + Math.cos(lt*Math.PI*1.6)*2.2;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.76){
    const lt = (t-0.50)/0.26;
    const angle = Math.PI*2.50 + lt*Math.PI*1.08;
    const r = 11.6 + Math.cos(lt*Math.PI)*2.6;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y - 2.2 - lt*8.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.76)/0.24;
    const angle = Math.PI*3.58 + lt*Math.PI*0.76;
    const r = 10.8 + lt*10.4;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 4.6 + lt*6.4;
    z = spherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Sphere subtle breath
  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.008;
  sphere.scale.setScalar(breathScale);
  sphere.rotation.y = Math.sin(elapsed*0.000026)*0.04;
  sphere.rotation.x = Math.cos(elapsed*0.000032)*0.03;

  // Camera dolly
  const speed = 0.0000072;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    spherePos.x + Math.sin(elapsed*0.000042)*0.14,
    spherePos.y + Math.cos(elapsed*0.000036)*0.12,
    spherePos.z + Math.sin(elapsed*0.000030)*0.10
  );

  key1.intensity = 0.014 + Math.sin(elapsed*0.000044)*0.0042;
  sphereGlow.intensity = 0.009 + Math.sin(elapsed*0.000052)*0.0028;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
