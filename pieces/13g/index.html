<head>

<title>13g · Anadol coral latent morph (LNM hallucination)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1a1d; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#7fa8a3; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#7fa8a3; }
</style>
</head>
<body>
<div class="id">13g</div>
<div class="hint">click to regenerate reef seed</div>
<div class="src">Anadol · Large Nature Model · coral latent space</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a1d);
scene.fog = new THREE.FogExp2(0x0a1a1d, 0.018);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 8, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const hemiLight = new THREE.HemisphereLight(0x4db8a0, 0x1a3f3f, 0.6);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0x80d4c4, 0.8);
dirLight.position.set(5, 10, 3);
scene.add(dirLight);

const backLight = new THREE.DirectionalLight(0xff6b6b, 0.3);
backLight.position.set(-3, 2, -5);
scene.add(backLight);

// Substrate plane (reef floor)
const substrateGeo = new THREE.PlaneGeometry(40, 40, 80, 80);
const substratePositions = substrateGeo.attributes.position.array;
for (let i = 0; i < substratePositions.length; i += 3) {
  const x = substratePositions[i];
  const y = substratePositions[i + 1];
  const dist = Math.sqrt(x * x + y * y);
  substratePositions[i + 2] = Math.sin(x * 0.15) * Math.cos(y * 0.15) * 0.8 - dist * 0.02;
}
substrateGeo.computeVertexNormals();

const substrateMat = new THREE.MeshStandardMaterial({
  color: 0x1f3a3d,
  roughness: 0.9,
  metalness: 0.1
});
const substrate = new THREE.Mesh(substrateGeo, substrateMat);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = -2;
scene.add(substrate);

// Coral species archetypes
const coralArchetypes = [
  { name: 'brain', segments: 12, radius: 1.0, height: 0.8, twistFreq: 3.0 },
  { name: 'branch', segments: 8, radius: 0.2, height: 2.5, twistFreq: 0.5 },
  { name: 'plate', segments: 16, radius: 1.5, height: 0.3, twistFreq: 1.0 },
  { name: 'tube', segments: 10, radius: 0.6, height: 1.8, twistFreq: 2.0 },
];

function buildCoralGeometry(archetype, morphSeed) {
  const { segments, radius, height, twistFreq } = archetype;
  const geo = new THREE.CylinderGeometry(radius * 0.3, radius, height, segments, 8);
  const pos = geo.attributes.position.array;
  
  for (let i = 0; i < pos.length; i += 3) {
    const x = pos[i];
    const y = pos[i + 1];
    const z = pos[i + 2];
    const angle = Math.atan2(z, x);
    const dist = Math.sqrt(x * x + z * z);
    const twist = y * twistFreq + morphSeed * 6.28;
    const bump = Math.sin(angle * 5 + twist) * 0.15 * dist;
    pos[i] = x + Math.cos(twist) * bump;
    pos[i + 2] = z + Math.sin(twist) * bump;
  }
  
  geo.computeVertexNormals();
  return geo;
}

const coralMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor1: { value: new THREE.Color(0x4db8a0) },
    uColor2: { value: new THREE.Color(0xff6b6b) },
    uColor3: { value: new THREE.Color(0xa8e063) },
    uMorphPhase: { value: 0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDepth;
    
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vPosition = mvPos.xyz;
      vDepth = -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor1;
    uniform vec3 uColor2;
    uniform vec3 uColor3;
    uniform float uMorphPhase;
    
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying float vDepth;
    
    void main() {
      vec3 viewDir = normalize(-vPosition);
      float fresnel = pow(1.0 - max(0.0, dot(viewDir, vNormal)), 2.5);
      
      float phase1 = sin(uMorphPhase * 6.28) * 0.5 + 0.5;
      float phase2 = sin(uMorphPhase * 6.28 + 2.09) * 0.5 + 0.5;
      
      vec3 baseColor = mix(
        mix(uColor1, uColor2, phase1),
        uColor3,
        phase2
      );
      
      float sss = fresnel * 0.6 + 0.4;
      vec3 finalColor = baseColor * sss;
      
      float fogFactor = exp(-vDepth * 0.018);
      finalColor = mix(vec3(0.039, 0.102, 0.114), finalColor, fogFactor);
      
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `
});

const numCorals = 120;
const coralInstances = [];

function noise3D(x, y, z, seed) {
  const X = Math.floor(x) & 255;
  const Y = Math.floor(y) & 255;
  const Z = Math.floor(z) & 255;
  const hash = (X * 73856093) ^ (Y * 19349663) ^ (Z * 83492791) ^ seed;
  return ((hash >>> 0) % 10000) / 10000;
}

function perlin3D(x, y, z, seed) {
  const X = Math.floor(x);
  const Y = Math.floor(y);
  const Z = Math.floor(z);
  const fx = x - X;
  const fy = y - Y;
  const fz = z - Z;
  
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const u = fade(fx);
  const v = fade(fy);
  const w = fade(fz);
  
  const lerp = (a, b, t) => a + t * (b - a);
  
  const a = noise3D(X, Y, Z, seed);
  const b = noise3D(X + 1, Y, Z, seed);
  const c = noise3D(X, Y + 1, Z, seed);
  const d = noise3D(X + 1, Y + 1, Z, seed);
  const e = noise3D(X, Y, Z + 1, seed);
  const f = noise3D(X + 1, Y, Z + 1, seed);
  const g = noise3D(X, Y + 1, Z + 1, seed);
  const h = noise3D(X + 1, Y + 1, Z + 1, seed);
  
  return lerp(
    lerp(lerp(a, b, u), lerp(c, d, u), v),
    lerp(lerp(e, f, u), lerp(g, h, u), v),
    w
  );
}

function regenerateReef() {
  coralInstances.forEach(inst => {
    scene.remove(inst.mesh);
    inst.mesh.geometry.dispose();
  });
  coralInstances.length = 0;
  
  const globalSeed = Math.floor(Math.random() * 1e9);
  let s = globalSeed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  for (let i = 0; i < numCorals; i++) {
    const archetype = coralArchetypes[Math.floor(rng() * coralArchetypes.length)];
    const morphSeed = rng();
    
    const geo = buildCoralGeometry(archetype, morphSeed);
    const mat = coralMat.clone();
    const mesh = new THREE.Mesh(geo, mat);
    
    const angle = rng() * Math.PI * 2;
    const dist = rng() * 12 + 2;
    const x = Math.cos(angle) * dist;
    const z = Math.sin(angle) * dist;
    const y = Math.sin(x * 0.15) * Math.cos(z * 0.15) * 0.8 - Math.sqrt(x * x + z * z) * 0.02 - 2;
    
    mesh.position.set(x, y, z);
    mesh.rotation.y = rng() * Math.PI * 2;
    mesh.scale.setScalar(0.6 + rng() * 0.8);
    
    scene.add(mesh);
    
    coralInstances.push({
      mesh,
      mat,
      latentPos: [rng() * 10, rng() * 10, rng() * 10, rng() * 10],
      latentVel: [(rng() - 0.5) * 0.1, (rng() - 0.5) * 0.1, (rng() - 0.5) * 0.1, (rng() - 0.5) * 0.1],
      seed: Math.floor(rng() * 1e9)
    });
  }
}

regenerateReef();

// Plankton particles
const planktonCount = 3000;
const planktonGeo = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonVel = new Float32Array(planktonCount * 3);

for (let i = 0; i < planktonCount; i++) {
  planktonPos[i * 3] = (Math.random() - 0.5) * 30;
  planktonPos[i * 3 + 1] = (Math.random() - 0.5) * 20;
  planktonPos[i * 3 + 2] = (Math.random() - 0.5) * 30;
  planktonVel[i * 3] = (Math.random() - 0.5) * 0.02;
  planktonVel[i * 3 + 1] = Math.random() * 0.01 + 0.005;
  planktonVel[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
}

planktonGeo.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));

const planktonMat = new THREE.PointsMaterial({
  color: 0x80d4c4,
  size: 0.08,
  transparent: true,
  opacity: 0.4,
  depthWrite: false
});

const plankton = new THREE.Points(planktonGeo, planktonMat);
scene.add(plankton);

addEventListener('click', regenerateReef);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let orbitAngle = 0;

function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  
  // Update coral morph phases via latent space drift
  coralInstances.forEach(inst => {
    for (let i = 0; i < 4; i++) {
      inst.latentPos[i] += inst.latentVel[i];
      if (inst.latentPos[i] > 10 || inst.latentPos[i] < 0) {
        inst.latentVel[i] *= -1;
        inst.latentPos[i] = Math.max(0, Math.min(10, inst.latentPos[i]));
      }
    }
    
    const morphPhase = perlin3D(
      inst.latentPos[0] * 0.3,
      inst.latentPos[1] * 0.3,
      inst.latentPos[2] * 0.3,
      inst.seed
    );
    
    inst.mat.uniforms.uTime.value = elapsed;
    inst.mat.uniforms.uMorphPhase.value = morphPhase;
  });
  
  // Update plankton drift
  const positions = planktonGeo.attributes.position.array;
  for (let i = 0; i < planktonCount; i++) {
    positions[i * 3] += planktonVel[i * 3];
    positions[i * 3 + 1] += planktonVel[i * 3 + 1];
    positions[i * 3 + 2] += planktonVel[i * 3 + 2];
    
    if (positions[i * 3 + 1] > 10) {
      positions[i * 3 + 1] = -10;
    }
    if (Math.abs(positions[i * 3]) > 15) planktonVel[i * 3] *= -1;
    if (Math.abs(positions[i * 3 + 2]) > 15) planktonVel[i * 3 + 2] *= -1;
  }
  planktonGeo.attributes.position.needsUpdate = true;
  
  // Slow camera orbit
  orbitAngle += 0.0003;
  camera.position.x = Math.sin(orbitAngle) * 18;
  camera.position.z = Math.cos(orbitAngle) * 18;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
