<title>34s · Shiota — Two Home Countries (After Soul Trembles)</title>
<!-- MOTION: drift, intensity: calm -->
<style>

canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }

<body>
<div class="id">34s</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.007);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.06));

const pL = new THREE.PointLight(0xffe0c4, 0.18, 50, 1.6);
pL.position.set(-3.0, 18.0, 4.0);
scene.add(pL);

const pL2 = new THREE.PointLight(0xc20018, 0.04, 30, 2.0);
pL2.position.set(6.0, -8.0, -5.0);
scene.add(pL2);

let seed = 48261937;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 42, h: 36, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a pale moon caught in arterial web
// Shiota: the object is always ordinary, remembered, suspended — here a stone-like
// sphere evoking the seed image's cottony/mineral orb
const sphereCenter = new THREE.Vector3(1.2, 0.5, -0.3);
const SPHERE_R = 2.4;

const sphereGeo = new THREE.SphereGeometry(SPHERE_R, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0,
  emissive: 0xf0e8da,
  emissiveIntensity: 0.6,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.32,
  side: THREE.DoubleSide
});
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

// Inner glow core — denser, more luminous
const innerMat = new THREE.MeshBasicMaterial({
  color: 0xf8f3ec,
  transparent: true,
  opacity: 0.14
});
const innerSphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R * 0.78, 16, 12),
  innerMat
);
innerSphere.position.copy(sphereCenter);
scene.add(innerSphere);

// Suspension threads — ceiling to sphere top
const suspGeo = new THREE.BufferGeometry();
const suspPts = new Float32Array([
  sphereCenter.x - 0.1, hh, sphereCenter.z + 0.15,
  sphereCenter.x, sphereCenter.y + SPHERE_R, sphereCenter.z,
  sphereCenter.x + 0.25, hh, sphereCenter.z - 0.1,
  sphereCenter.x + 0.05, sphereCenter.y + SPHERE_R - 0.1, sphereCenter.z + 0.03,
  sphereCenter.x - 0.3, hh, sphereCenter.z - 0.2,
  sphereCenter.x - 0.08, sphereCenter.y + SPHERE_R + 0.05, sphereCenter.z - 0.04,
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPts, 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0404, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng() * 2 - 1;
  const th = rng() * Math.PI * 2;
  const r2 = Math.sqrt(1 - u*u);
  const jit = 1.0 + (rng()-0.5)*0.06;
  return new THREE.Vector3(
    sphereCenter.x + r2 * Math.cos(th) * SPHERE_R * jit,
    sphereCenter.y + u * SPHERE_R * jit,
    sphereCenter.z + r2 * Math.sin(th) * SPHERE_R * jit
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHOR POINTS — Fibonacci shells radiating from sphere
const NUM_ANCHORS = 680;
const anchors = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shellRadii = [3.5, 6.5, 10.5, 16.0, 22.0];
const ptsPerShell = [35, 50, 60, 55, 45];

for(let s = 0; s < shellRadii.length; s++){
  const R = shellRadii[s];
  const n = ptsPerShell[s];
  for(let i = 0; i < n; i++){
    const y = 1 - (i / (n-1)) * 2;
    const r = Math.sqrt(1 - y*y);
    const th = goldenAngle * i;
    const jx = (rng()-0.5)*0.8;
    const jy = (rng()-0.5)*0.8;
    const jz = (rng()-0.5)*0.8;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + r * Math.cos(th) * R + jx,
      sphereCenter.y + y * R + jy,
      sphereCenter.z + r * Math.sin(th) * R + jz
    ));
  }
}

while(anchors.length < NUM_ANCHORS){
  const p = rng() < 0.5 ? wallPt() : wallPt().lerp(sphereCenter, 0.12 + rng()*0.5);
  anchors.push(p);
}

// Void zones — negative space for visual breathing
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x - 9, sphereCenter.y + 6, sphereCenter.z + 8), r: 3.2 },
  { pos: new THREE.Vector3(sphereCenter.x + 7, sphereCenter.y - 7, sphereCenter.z - 9), r: 2.8 },
  { pos: new THREE.Vector3(sphereCenter.x + 10, sphereCenter.y + 10, sphereCenter.z + 5), r: 2.5 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — 20,000 max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-sphereCenter.x, dy = my-sphereCenter.y, dz = mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Cat A: Convergence threads — blood vessels reaching toward the sphere-heart
// "Threads converge around the suspended sphere like blood vessels around a heart"
const catA = Math.floor(NUM_LINES * 0.48);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.35){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 10% stop short — almost-arriving threads (the gap between reach and contact)
  if(rng() < 0.10){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.2));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: Anchor-to-anchor structural web — proximity rule (Casey Reas directive)
const THRESHOLD = 7.0;
let catBcount = 0;
const catBtarget = Math.floor(NUM_LINES * 0.26);
let attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 140000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 14; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  catBcount++;

  // Dendritic branching — capillary Y-forks (Andy Lomas)
  if(rng() < 0.18 && li < NUM_LINES - 4){
    const mid = a.clone().lerp(best, 0.15 + rng()*0.55);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.2 + rng()*0.8));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      catBcount++;
      if(rng() < 0.25 && li < NUM_LINES - 2){
        const mid2 = mid.clone().lerp(bEnd, 0.4 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.1 + rng()*0.4));
        if(!inVoid(bEnd2)){
          setLine(mid2, bEnd2);
          catBcount++;
          if(rng() < 0.12 && li < NUM_LINES){
            const mid3 = mid2.clone().lerp(bEnd2, 0.5);
            const bDir3 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
            const bEnd3 = mid3.clone().add(bDir3.multiplyScalar(0.06 + rng()*0.2));
            if(!inVoid(bEnd3)){ setLine(mid3, bEnd3); catBcount++; }
          }
        }
      }
    }
  }
}

// Cat C: Dense halo — threads orbiting close to the sphere surface
// Like the seed image: a knot of density around the pale center
const catC = Math.floor(NUM_LINES * 0.12);
for(let i = 0; i < catC && li < NUM_LINES; i++){
  const s1 = sphereSurf();
  const dir1 = s1.clone().sub(sphereCenter).normalize();
  const outA = s1.clone().add(dir1.multiplyScalar(0.15 + rng()*2.0));
  const tangent = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  tangent.sub(dir1.clone().multiplyScalar(tangent.dot(dir1))).normalize();
  const outB = s1.clone().add(dir1.multiplyScalar(0.15 + rng()*2.0)).add(tangent.multiplyScalar(0.6 + rng()*1.8));
  if(!inVoid(outA) && !inVoid(outB)) setLine(outA, outB);
}

// Cat D: Radial spokes — long straight lines from sphere surface to distant walls
// Creates the "circulatory cosmos" radiating structure
const catD = Math.floor(NUM_LINES * 0.06);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const sp = sphereSurf();
  const dir = sp.clone().sub(sphereCenter).normalize();
  const far = sp.clone().add(dir.multiplyScalar(12 + rng()*18));
  // Clamp to room bounds
  far.x = Math.max(-hw+0.5, Math.min(hw-0.5, far.x));
  far.y = Math.max(-hh+0.5, Math.min(hh-0.5, far.y));
  far.z = Math.max(-hd+0.5, Math.min(hd-0.5, far.z));
  if(!inVoid(far)) setLine(sp, far);
}

// Cat E: Fill remaining with wall-spanning architectural threads
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.4 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, memory shards caught in the web
const NUM_FRAGMENTS = 38;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.04 + rng()*0.12;
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.5);
  const h = sz * (0.5 + rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.25), h*0.5, 0,
    -w*0.5, h*(-0.12+rng()*0.12), 0,
    w*(0.08-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.25), h*0.5, 0,
    w*(0.25+rng()*0.3), h*(rng()*0.08), 0,
    w*(0.08-rng()*0.3), -h*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.015;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.1, d*0.04),
    transparent: true,
    opacity: 0.12 + rng()*0.32,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  if(rng() < 0.6){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.0 + rng()*10.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — inside the web, intimate, slow walk through the installation
// Asymmetric figure-8 that passes close to the sphere and pulls back through threads
const pathLen = 900;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;
  // Lemniscate-ish orbit — closer pass on one lobe, farther on the other
  const rBase = 5.0;
  const rX = rBase + Math.sin(p * 0.5 + 0.8) * 2.2 + Math.cos(p * 1.3 + 2.1) * 0.6;
  const rZ = rBase + 2.5 + Math.cos(p * 0.45) * 2.8 + Math.sin(p * 0.7 + 1.5) * 0.5;
  const x = cx + Math.sin(p) * rX;
  // Vertical: slow rise to look down through threads, sink to equator level
  const yBase = cy + 0.5;
  const yWave = Math.sin(p * 0.35 + 0.3) * 4.8 + Math.cos(p * 0.85 + 1.0) * 1.5;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — near imperceptible, static installation feel
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0005 * Math.max(0, 1.0 - dist / 30.0);
    const phase = basePositions[idx]*0.2 + basePositions[idx+1]*0.25 + i*0.001;
    const breath = Math.sin(t*0.02 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.28;
      arr[vi+1] = basePositions[vi+1] + breath*0.22;
      arr[vi+2] = basePositions[vi+2] + breath*0.26;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — walking through the installation
  const speed = 0.0006;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — gravitational center, the moon in the web
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0025)*0.12;
  look.y += Math.cos(t*0.002)*0.10;
  look.z += Math.sin(t*0.0028)*0.08;
  camera.lookAt(look);

  // Light drift
  pL.position.x = -3.0 + Math.sin(t*0.0012)*0.4;
  pL.position.y = 18.0 + Math.cos(t*0.001)*0.2;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
