<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>448 · soap-bubble tower · surprise</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
           letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px;
           letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">448</div>
<div class="hint">drag to orbit · click to pause/resume</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── scene ── */
const scene = new THREE.Scene();
const fogCol = new THREE.Color(0x0a0608);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xfff0e8, 0.9).translateX(5).translateY(10).translateZ(5));
scene.add(new THREE.AmbientLight(0x2a141c, 0.6));
const rimLight = new THREE.DirectionalLight(0x88aacc, 0.4);
rimLight.position.set(-5, 3, -5); scene.add(rimLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 5, 0);

/* ── differential growth (from t9w / 5gm lineage) ── */
const MAX_VERTS=1500, ATTRACT=0.06, REPEL_R=0.50, REPEL_STR=0.13;
const NOISE_S=0.003, PRESSURE=0.0028, RISE=0.0045, MAX_D=0.40;
const verts=[];
for(let i=0;i<16;i++){
  const th=i/16*Math.PI*2, r=1.4+(Math.random()-0.5)*0.1;
  verts.push({x:Math.cos(th)*r, y:0, z:Math.sin(th)*r, age:0});
}
const CELL=REPEL_R, grid=new Map();
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i];
    const k=Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);
  }
}
function gridNear(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL),out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const a=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));if(a)for(const j of a)out.push(j);}
  return out;
}
let paused=false;
function step(){
  if(paused)return; const n=verts.length; if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);
  for(let i=0;i<n;i++){const v=verts[i];for(const j of gridNear(v)){
    if(j===i)continue;const u=verts[j];
    const ex=v.x-u.x,ey=v.y-u.y,ez=v.z-u.z,d2=ex*ex+ey*ey+ez*ez;
    if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;const d=Math.sqrt(d2);
    const f=REPEL_STR*(1-d/REPEL_R)/d;dx[i]+=ex*f;dy[i]+=ey*f;dz[i]+=ez*f;}}
  for(let i=0;i<n;i++){const a=verts[(i-1+n)%n],b=verts[(i+1)%n],v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;}
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for(let i=0;i<n;i++){const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;dy[i]+=(oy/d)*PRESSURE*0.4;dz[i]+=(oz/d)*PRESSURE;}
  for(let i=0;i<n;i++){const ag=verts[i].age;
    const up=RISE*(0.3+1.2*Math.min(ag*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;verts[i].age+=0.0014;}
  const grown=[];
  for(let i=0;i<n;i++){const a=verts[i],b=verts[(i+1)%n];grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS)
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,
        age:Math.max(a.age,b.age)*0.5});}
  verts.length=0;for(const v of grown)verts.push(v);
}
for(let s=0;s<600;s++)step();
addEventListener('click',()=>{paused=!paused;});

/* ── soap-bubble shader (Pedrotti thin-film, restrained magenta/teal/gold) ── */
const bubbleMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0}, uBubble:{value:0},
    uLightDir:{value:new THREE.Vector3(0.5,0.8,0.5).normalize()},
    uFogColor:{value:fogCol}, uFogDensity:{value:0.04},
    uCamPos:{value:new THREE.Vector3()},
  },
  vertexShader:`
    attribute float aFilmThick;
    attribute float aBubbleLocal;
    varying vec3 vNorm, vWorldPos;
    varying float vFilm, vBub;
    void main(){
      vNorm = normalize(normalMatrix * normal);
      vec4 wp = modelMatrix * vec4(position,1.0);
      vWorldPos = wp.xyz;
      vFilm = aFilmThick;
      vBub = aBubbleLocal;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader:`
    precision highp float;
    uniform float uTime, uBubble;
    uniform vec3 uLightDir, uFogColor, uCamPos;
    uniform float uFogDensity;
    varying vec3 vNorm, vWorldPos;
    varying float vFilm, vBub;

    vec3 thinFilm(float cosT, float thick){
      float d = thick * cosT * 14.0 + uTime * 0.25;
      vec3 mag = vec3(0.72,0.16,0.52);
      vec3 tea = vec3(0.14,0.58,0.56);
      vec3 gld = vec3(0.82,0.70,0.38);
      float s1 = sin(d)*0.5+0.5;
      float s2 = cos(d*0.63)*0.5+0.5;
      return mix(mix(mag,tea,s1), gld, s2*0.30);
    }

    void main(){
      vec3 N = normalize(vNorm);
      vec3 V = normalize(uCamPos - vWorldPos);
      float NdV = max(dot(N,V),0.0);
      float NdL = max(dot(N,uLightDir),0.0);
      float fres = pow(1.0-NdV, 3.0);

      // vascular
      vec3 vasc = vec3(0.69,0.27,0.22)*(0.3+0.7*NdL) + vec3(0.16,0.03,0.03);

      // soap film
      vec3 film = thinFilm(NdV, vFilm);
      film += vec3(0.25,0.30,0.35)*fres*0.5;
      film *= 0.45 + 0.55*NdL;
      float filmAlpha = mix(0.30, 0.82, fres);

      float b = vBub * uBubble;
      vec3 col = mix(vasc, film, b);
      float a = mix(1.0, filmAlpha, b);

      // fog (manual FogExp2)
      float dist = length(vWorldPos - uCamPos);
      float fog = 1.0 - exp(-uFogDensity*uFogDensity*dist*dist);
      col = mix(col, uFogColor, fog);
      gl_FragColor = vec4(col, a);
    }`,
  transparent:true, side:THREE.DoubleSide, depthWrite:true,
});

/* ── tube mesh with structural bubble deformation ── */
let tubeMesh = null;
const _up = new THREE.Vector3(0,1,0);

function buildTube(t, bAmt){
  if(verts.length<10) return;
  let yMin=1e9, yMax=-1e9;
  for(const v of verts){if(v.y<yMin)yMin=v.y;if(v.y>yMax)yMax=v.y;}
  const yRange=Math.max(yMax-yMin,0.1);
  const pts=verts.map(v=>new THREE.Vector3(v.x,v.y,v.z));
  const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',0.5);
  const NS=Math.min(600,verts.length*2), RAD=10;
  const tot=NS*RAD;
  const pos=new Float32Array(tot*3), nrm=new Float32Array(tot*3);
  const aFilm=new Float32Array(tot), aBub=new Float32Array(tot);
  const idx=[];
  const pulse=1.0+0.10*Math.sin(t*1.6)*(1.0-bAmt);

  // bubble wave sweeps bottom→top over ~4s
  const cyc=t%20.0;
  const waveFront=(cyc-8.0)/5.0; // 0..1 in height, active 8-13s

  // sample points + curvature
  const sp=[];
  for(let i=0;i<NS;i++) sp.push(curve.getPointAt(i/NS));
  const curvArr=new Float32Array(NS);
  for(let i=0;i<NS;i++){
    const p=sp[(i-1+NS)%NS], n=sp[(i+1)%NS];
    curvArr[i]=p.clone().add(n).multiplyScalar(0.5).sub(sp[i]).length();
  }

  for(let i=0;i<NS;i++){
    const tt=i/NS, p=sp[i];
    const hFrac=Math.max(0,Math.min(1,(p.y-yMin)/yRange));

    // per-ring bubble strength
    let rb=0;
    if(bAmt>0){
      const dist=Math.abs(hFrac-waveFront);
      rb=bAmt*Math.max(0,1.0-dist*3.5);
      rb=Math.min(1,rb);
    }

    // vascular radius
    let rV=0.40*(1-hFrac*0.78);
    const node=Math.sin(tt*22)*0.5+0.5;
    rV*=(1+0.18*Math.pow(node,6))*pulse;

    // bubble: expand + thin
    const rB=rV*1.4;
    const r=rV*(1-rb)+rB*rb;

    const tang=curve.getTangentAt(tt).normalize();
    const norm=new THREE.Vector3().crossVectors(tang,_up).normalize();
    if(norm.lengthSq()<0.001)norm.set(1,0,0);
    const binorm=new THREE.Vector3().crossVectors(tang,norm).normalize();

    // structural drift: bubble rings separate and float outward
    let offX=0, offY=0, offZ=0;
    if(rb>0.25){
      const d=(rb-0.25)/0.75;
      const a1=i*1.7+3.1, a2=i*2.3+1.7;
      offX=Math.sin(a1)*0.35*d*norm.x + Math.cos(a2)*0.35*d*binorm.x;
      offY=d*0.20 + Math.sin(i*0.9)*0.08*d;
      offZ=Math.sin(a1)*0.35*d*norm.z + Math.cos(a2)*0.35*d*binorm.z;
    }

    // film thickness varies with curvature + age proxy
    const filmT=0.4 + curvArr[i]*10.0 + Math.sin(tt*50)*0.12;

    for(let j=0;j<RAD;j++){
      const ang=(j/RAD)*Math.PI*2;
      const ca=Math.cos(ang), sa=Math.sin(ang);

      // angular wall variation during bubble — membrane wrinkles
      let wr=r;
      if(rb>0.15){
        const warp=1.0 - rb*0.12*(Math.sin(ang*4+i*0.4)*0.5+0.5);
        wr*=warp;
      }

      const vi=i*RAD+j;
      pos[vi*3]  =norm.x*ca*wr+binorm.x*sa*wr+p.x+offX;
      pos[vi*3+1]=norm.y*ca*wr+binorm.y*sa*wr+p.y+offY;
      pos[vi*3+2]=norm.z*ca*wr+binorm.z*sa*wr+p.z+offZ;
      nrm[vi*3]  =norm.x*ca+binorm.x*sa;
      nrm[vi*3+1]=norm.y*ca+binorm.y*sa;
      nrm[vi*3+2]=norm.z*ca+binorm.z*sa;
      aFilm[vi]=filmT + Math.sin(ang*2.0+i*0.3)*0.15*curvArr[i]*5.0;
      aBub[vi]=rb;
    }
  }

  // faces — skip some during bubble to create membrane holes
  for(let i=0;i<NS;i++){
    const ni=(i+1)%NS;
    const rb=aBub[i*RAD];
    for(let j=0;j<RAD;j++){
      const nj=(j+1)%RAD;
      // structural gap: remove ~30% of faces in strong bubble regions
      if(rb>0.55){
        const h=((i*7+j*13)&15);
        if(h<5) continue;
      }
      const a=i*RAD+j, b=i*RAD+nj, c=ni*RAD+j, d=ni*RAD+nj;
      idx.push(a,b,c, b,d,c);
    }
  }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('aFilmThick',new THREE.BufferAttribute(aFilm,1));
  g.setAttribute('aBubbleLocal',new THREE.BufferAttribute(aBub,1));
  g.setIndex(idx);

  if(tubeMesh){scene.remove(tubeMesh);tubeMesh.geometry.dispose();}
  tubeMesh=new THREE.Mesh(g,bubbleMat);
  scene.add(tubeMesh);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});

const t0=performance.now();
(function loop(){
  const t=(performance.now()-t0)/1000;
  for(let s=0;s<2;s++) step();

  // surprise envelope: 20s cycle, bubble wave 7-14s
  const cyc=t%20.0;
  let bAmt=0;
  if(cyc>6.5 && cyc<14.5){
    if(cyc<7.5) bAmt=cyc-6.5;
    else if(cyc<12.5) bAmt=1.0;
    else bAmt=1.0-(cyc-12.5)/2.0;
  }
  bAmt=Math.max(0,Math.min(1,bAmt));

  bubbleMat.uniforms.uTime.value=t;
  bubbleMat.uniforms.uBubble.value=bAmt;
  bubbleMat.uniforms.uCamPos.value.copy(camera.position);

  buildTube(t,bAmt);

  let yMean=0;for(const v of verts)yMean+=v.y;yMean/=Math.max(verts.length,1);
  const tgtY=Math.max(yMean,2.0);
  controls.target.y+=(tgtY-controls.target.y)*0.04;
  camera.position.y+=(tgtY+4-camera.position.y)*0.04;
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
