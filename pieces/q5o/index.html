<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>q5o · limning</title>
<!-- MOTION: reveal, intensity: gentle -->
<!-- INTENT: The coiled Möbius tree-band from spw gains a limning phase — as the spring uncoils, edge particles illuminate into manuscript-gold tracing strokes that delineate the tree skeleton, while interior particles recede into parchment shadow. The act of outlining IS the surprise beat. -->
<!-- ALGO: L-system tree + Möbius twist + helical coil spring + edge-luminance limning via gen/edgeDist -->
<!-- ARTIST EVOCATION: The Très Riches Heures du Duc de Berry — gilded marginalia where the outline carries more meaning than the fill; Rebecca Horn's mechanical breathing retained from parent -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a07; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">q5o</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system (inherited lineage x09 → y3k → 5i1 → spw) ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const H = new THREE.Vector3(0,1,0);
  const L = new THREE.Vector3(-1,0,0);
  const U = new THREE.Vector3(0,0,1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(0.78, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return segments;
}

/* ── compute max gen for normalizing ── */
function maxGen(segments){
  let mx = 0;
  for (const s of segments) if (s.gen > mx) mx = s.gen;
  return mx || 1;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN);
  const mxG = maxGen(segments);
  const v = new THREE.Vector3();
  let written = 0;
  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length-1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written] = Math.random();
      gens[written]  = segments[i].gen / mxG; /* normalized 0–1 */
      written++;
    }
  }
  return { positions, seeds, gens };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 4, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a07, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = false;
controls.target.set(0, 0, 0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uReady:   { value: 0 },
  uTwist:   { value: 0.92 },
  uGust:    { value: 0 },
  uSpring:  { value: 0 },
  uLimn:    { value: 0 },   /* 0 = dormant, 1 = full limning illumination */
  uYMin:    { value: -7.0 },
  uYMax:    { value: 6.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uTwist;
    uniform float uGust;
    uniform float uSpring;
    uniform float uLimn;
    uniform float uYMin;
    uniform float uYMax;
    attribute float seed;
    attribute float gen;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;

      /* minimal tree sway */
      float sway = 0.03 * gen * (0.5 + 0.5*sin(t * 0.7));
      p.x += sway * sin(t + p.y * 0.3) * (1.0 - uTwist);
      p.z += sway * cos(t * 0.9 + p.y * 0.3) * (1.0 - uTwist);

      /* reveal animation */
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── Möbius + helical spring coil ── */
      float yNorm = clamp((p.y - uYMin) / (uYMax - uYMin), 0.0, 1.0);

      float coilWindings = mix(3.0, 1.0, uSpring);
      float theta = yNorm * 6.2832 * coilWindings;
      float s = p.x * 1.4 + p.z * 0.4;

      float R = mix(3.2, 5.5, uSpring);
      float ht = theta * 0.5;
      float vertSpread = mix(0.4, 1.0, uSpring);

      vec3 mPos;
      mPos.x = (R + s * cos(ht)) * cos(theta);
      mPos.z = (R + s * cos(ht)) * sin(theta);
      mPos.y = s * sin(ht) + (yNorm - 0.5) * 8.0 * vertSpread;

      /* harmattan gusts */
      float edgeDist = abs(s) / (abs(s) + 0.8);
      float gustPhase = uTime * 0.35 + seed * 6.28;
      float localGust = uGust * (0.5 + 0.5 * sin(gustPhase * 0.6 + theta * 2.0));
      vec3 windDir = normalize(vec3(0.75, 0.18, 0.55));
      float surfaceShift = localGust * 0.3 * (0.2 + 0.8 * edgeDist);
      mPos += windDir * surfaceShift;

      float detach = smoothstep(0.5, 0.9, edgeDist) * smoothstep(0.4, 0.85, seed);
      float peel = detach * uGust * 2.0;
      mPos += windDir * peel;
      mPos.y -= peel * 0.3;

      p = mix(p, mPos, uTwist);

      /* ── LIMNING: edge-awareness ──
         "edge" = high generation (branch tips) OR high edgeDist (strip margins)
         These particles become the illuminated outline during the limning phase */
      float edgeness = max(gen, edgeDist * 0.8);
      /* sharpen: only the outer ~30% of particles qualify as edge */
      float isEdge = smoothstep(0.55, 0.85, edgeness);
      /* interior particles: the opposite */
      float isInterior = 1.0 - isEdge;

      /* ── palette ── */
      float energy = 0.5 + 0.5 * sin(t * 0.5);

      /* base earth tones (inherited) */
      vec3 umber   = vec3(0.42, 0.30, 0.22);
      vec3 sienna  = vec3(0.52, 0.36, 0.25);
      vec3 ashBone = vec3(0.72, 0.66, 0.56);
      vec3 rust    = vec3(0.55, 0.35, 0.24);

      float stripK = yNorm;
      vec3 baseCol = mix(umber, sienna, stripK);
      baseCol = mix(baseCol, rust, edgeDist * 0.35);
      baseCol = mix(baseCol, ashBone, detach * uGust * 0.6);

      /* LIMNING gold: manuscript illumination — aged gold leaf, not bright */
      vec3 goldLeaf  = vec3(0.62, 0.50, 0.28);  /* aged gold */
      vec3 vellum    = vec3(0.58, 0.52, 0.40);   /* parchment highlight */
      vec3 inkShadow = vec3(0.18, 0.14, 0.10);   /* manuscript shadow */

      /* edge particles: during limning, shift toward gold-leaf tracing */
      float limnEdge = uLimn * isEdge;
      /* propagation wave: limning traces upward along yNorm */
      float traceWave = smoothstep(0.0, 1.0, uLimn * 2.0 - yNorm);
      limnEdge *= traceWave;

      vec3 limnCol = mix(goldLeaf, vellum, 0.3 * sin(theta * 2.0 + yNorm * 4.0));
      baseCol = mix(baseCol, limnCol, limnEdge * 0.75);

      /* interior particles: during limning, recede into ink shadow */
      float limnInterior = uLimn * isInterior * traceWave;
      baseCol = mix(baseCol, inkShadow, limnInterior * 0.55);

      /* spring-uncoil copper flash (inherited, subdued during limning) */
      vec3 copperFlash = vec3(0.62, 0.42, 0.26);
      float flashMix = uSpring * (1.0 - uSpring) * 4.0;
      float flashStr = flashMix * 0.25 * (0.5 + 0.5 * sin(theta * 3.0));
      flashStr *= (1.0 - uLimn * 0.6); /* limning subdues the copper */
      baseCol = mix(baseCol, copperFlash, flashStr);

      /* residual silver (inherited) */
      vec3 silver = vec3(0.55, 0.58, 0.64);
      float silverBleed = (1.0 - uGust) * 0.08;
      baseCol = mix(baseCol, silver, silverBleed * isInterior * (1.0 - uLimn));

      vCol = mix(vec3(0.38, 0.28, 0.20), baseCol, uTwist);

      /* ── alpha: limning reveals edges, dims interior ── */
      float baseAlpha = 0.50 + 0.40 * energy;
      baseAlpha -= detach * uGust * 0.35;

      /* edge particles brighten during limning */
      baseAlpha += limnEdge * 0.35;
      /* interior particles dim during limning — the outline reads */
      baseAlpha -= limnInterior * 0.28;
      /* ensure minimum visibility */
      baseAlpha = max(baseAlpha, 0.08);

      vAlpha = baseAlpha;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* edge particles slightly larger during limning — bolder stroke */
      float sizeBoost = 1.0 + limnEdge * 0.5;
      gl_PointSize = sizeBoost * (1.0 + 0.4 * energy) * uPixel * (42.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;
let treeBB = { yMin: -7, yMax: 6 };

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str);
  const bb = new THREE.Box3();
  for (const sg of segs){ bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segs){
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }
  const bb2 = new THREE.Box3();
  for (const sg of segs){ bb2.expandByPoint(sg.from); bb2.expandByPoint(sg.to); }
  treeBB.yMin = bb2.min.y;
  treeBB.yMax = bb2.max.y;
  uniforms.uYMin.value = treeBB.yMin;
  uniforms.uYMax.value = treeBB.yMax;

  const { positions, seeds, gens } = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }

  /* twist: Möbius dominant, gentle breathing */
  const twistBase = 0.90 + 0.06 * Math.cos(elapsed * 0.13);
  const relax = 0.10 * smoothstep(0, 2, (elapsed % 28) - 22) *
                       (1 - smoothstep(0, 2, (elapsed % 28) - 26));
  uniforms.uTwist.value = Math.max(0.0, twistBase - relax);

  /* ── SPRING-UNCOIL (inherited from spw) ── */
  const cycle = 36.0; /* slightly longer cycle to accommodate limning */
  const phase = elapsed % cycle;
  let spring = 0.0;
  if (phase > 22.0 && phase <= 24.0) {
    spring = smoothstep(22.0, 24.0, phase);
  } else if (phase > 24.0 && phase <= 26.5) {
    spring = 1.0 - 0.06 * Math.sin((phase - 24.0) * 4.0);
  } else if (phase > 26.5 && phase <= 32.0) {
    spring = 1.0 - smoothstep(26.5, 32.0, phase);
  }
  uniforms.uSpring.value = spring;

  /* ── LIMNING: the new layer ──
     Limning traces the edges during the spring-open beat.
     It rises slightly AFTER the spring begins (the reveal follows the uncoil),
     peaks while the spring holds open, then fades as the coil rewinds.
     Between uncoils, a gentle ambient limn breathes at ~15% — the manuscript
     is always faintly illuminated, the full tracing is the event. */
  let limn = 0.0;
  const ambientLimn = 0.12 + 0.04 * Math.sin(elapsed * 0.18);
  if (phase > 23.0 && phase <= 25.0) {
    /* rise: edges begin to glow as spring opens */
    limn = smoothstep(23.0, 25.0, phase);
  } else if (phase > 25.0 && phase <= 27.0) {
    /* hold: full illumination — the limned skeleton visible */
    limn = 1.0;
  } else if (phase > 27.0 && phase <= 32.0) {
    /* fade: gold recedes as coil rewinds */
    limn = 1.0 - smoothstep(27.0, 32.0, phase);
  }
  uniforms.uLimn.value = Math.max(ambientLimn, limn);

  /* harmattan gusts: suppress during limning so edges read cleanly */
  const gustSlow = Math.pow(Math.sin(elapsed * 0.22) * 0.5 + 0.5, 1.8);
  const gustMed  = 0.14 * Math.sin(elapsed * 0.73 + 1.0);
  const gustFast = 0.06 * Math.sin(elapsed * 1.9 + 2.5);
  const gustBase = Math.max(0, Math.min(1, gustSlow + gustMed + gustFast));
  uniforms.uGust.value = gustBase * (1.0 - spring * 0.7) * (1.0 - limn * 0.4);

  /* camera: single slow drift, settles */
  const driftT = Math.min(1.0, elapsed / 20.0);
  const driftEase = driftT * driftT * (3.0 - 2.0 * driftT);
  controls.target.x = -0.3 * driftEase;
  controls.target.y = -0.15 * driftEase;
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;

  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
