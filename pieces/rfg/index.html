<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiota — threads of absence</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#030303; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">rfg</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.FogExp2(0x030303, 0.028);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a0808, 1.2));
const dL = new THREE.DirectionalLight(0xffeedd, 0.5);
dL.position.set(-3, 5, 4);
scene.add(dL);
const pL = new THREE.PointLight(0x440a0a, 0.8, 20);
pL.position.set(0, 2, -4);
scene.add(pL);

let seed = 48291063;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }
function noise3(x,y,z){ return Math.sin(x*1.7+y*2.3)*Math.cos(y*1.1+z*3.1)*Math.sin(z*0.9+x*2.7); }

// ── Suspended sphere — distorted with low-freq noise (entangled_others directive)
const sphereR = 2.4;
const spherePos = new THREE.Vector3(0.8, 0.2, -5.5);
const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sPos = sphereGeo.attributes.position;
for(let i=0; i<sPos.count; i++){
  const x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
  const n = noise3(x*0.6, y*0.6, z*0.6) * 0.18;
  const len = Math.sqrt(x*x+y*y+z*z);
  const scale = (len + n) / len;
  sPos.setXYZ(i, x*scale, y*scale, z*scale);
}
sphereGeo.computeVertexNormals();

const sphereMesh = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({
  color: 0xf5ede2, emissive: 0xf5ede2, emissiveIntensity: 0.6,
  roughness: 0.88, metalness: 0.0, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide, depthWrite: false
}));
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

// ── Key — doubled scale (sasha_stiles directive)
const keyGroup = new THREE.Group();
const keyMat = new THREE.MeshStandardMaterial({ color:0x0a0a0a, roughness:0.55, metalness:0.9 });
const keyRing = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.1, 10, 18), keyMat);
const keyShaft = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.6, 0.07), keyMat);
keyShaft.position.y = -1.05;
const tooth1 = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.14, 0.07), keyMat);
tooth1.position.set(0.12, -1.6, 0);
const tooth2 = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.11, 0.07), keyMat);
tooth2.position.set(0.09, -1.38, 0);
const tooth3 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.10, 0.07), keyMat);
tooth3.position.set(0.11, -1.76, 0);
keyGroup.add(keyRing, keyShaft, tooth1, tooth2, tooth3);
keyGroup.scale.setScalar(2.0);
keyGroup.position.set(spherePos.x - 2.0, spherePos.y + 1.0, spherePos.z + 2.5);
keyGroup.rotation.set(0.3, 0.5, 0.3);
scene.add(keyGroup);

// ── Room boundaries — architectural volume
const ROOM = { w: 24, h: 18, d: 36 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── Density voids — 4 spherical zones with no threads (chiharu_shiota directive)
const voids = [
  { center: new THREE.Vector3(-4, 3, -3), r: 2.8 },
  { center: new THREE.Vector3(3, -2, -7), r: 2.2 },
  { center: new THREE.Vector3(-2, -3, -9), r: 2.5 },
  { center: new THREE.Vector3(5, 2, -2), r: 2.0 }
];

function inVoid(p){
  for(let i=0; i<voids.length; i++){
    if(p.distanceTo(voids[i].center) < voids[i].r) return true;
  }
  return false;
}

function midpoint(a, b){ return new THREE.Vector3((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2); }

// Anchor points — cluster around sphere + key
const NUM_ANCHORS = 1000;
const anchors = [];
const keyPos = keyGroup.position;
for(let i=0; i<NUM_ANCHORS; i++){
  let pt;
  if(rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    pt = spherePos.clone().add(dir.multiplyScalar(sphereR + 0.08 + rng()*3.5));
  } else if(rng() < 0.22){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    pt = keyPos.clone().add(dir.multiplyScalar(0.4 + rng()*3.0));
  } else if(rng() < 0.3){
    const p = wallPt(); p.lerp(spherePos, 0.2 + rng()*0.4); pt = p;
  } else {
    pt = wallPt();
  }
  anchors.push(pt);
}

// ── Build line segments — 20,000 max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurf(from){
  const dir = spherePos.clone().sub(from).normalize();
  return spherePos.clone().sub(dir.multiplyScalar(sphereR * (0.94 + rng()*0.08)));
}

function keySurf(){
  return keyPos.clone().add(new THREE.Vector3(
    (rng()-0.5)*0.8, (rng()-0.5)*2.0, (rng()-0.5)*0.3
  ));
}

function setLine(a, b){
  if(li >= NUM_LINES) return false;
  const mid = midpoint(a, b);
  if(inVoid(mid)) return false;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
  return true;
}

// Cat A: converging on sphere (35%)
const catA = Math.floor(NUM_LINES * 0.35);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(!setLine(a, sphereSurf(a))) i--;
}

// Cat B: converging on key (12%)
const catB = Math.floor(NUM_LINES * 0.12);
for(let i=0, tries=0; i<catB && li<NUM_LINES && tries<catB*3; tries++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(setLine(a, keySurf())) i++;
}

// Cat C: wall-to-wall through dense region (20%)
const catC = Math.floor(NUM_LINES * 0.20);
for(let i=0, tries=0; i<catC && li<NUM_LINES && tries<catC*4; tries++){
  const a = wallPt();
  const b = wallPt();
  const mid = midpoint(a, b);
  if(mid.distanceTo(spherePos) < 10){
    if(setLine(a, b)) i++;
  }
}

// Cat D: lateral cross-web between nearby anchors — 15% (refik_anadol directive)
const catD = Math.floor(NUM_LINES * 0.15);
for(let i=0, tries=0; i<catD && li<NUM_LINES && tries<catD*3; tries++){
  const ai = Math.floor(rng()*anchors.length);
  const bi = Math.floor(rng()*anchors.length);
  if(ai === bi) continue;
  const d = anchors[ai].distanceTo(anchors[bi]);
  if(d > 1.0 && d < 6.0){
    if(setLine(anchors[ai], anchors[bi])) i++;
  }
}

// Cat E: fill remaining with short local webs
let fillTries = 0;
while(li < NUM_LINES && fillTries < NUM_LINES * 2){
  fillTries++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.15){ bestD = d; best = anchors[bi]; }
  }
  if(best) setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── Dark fragments — charred paper caught in web
const NUM_FRAGS = 35;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.14;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz, sz*(0.3+rng()*1.6), sz*(0.3+rng()))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.02 + rng()*0.05;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.5, d*0.4),
    transparent: true, opacity: 0.5 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*li)*6;
  const t = rng();
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// ── Camera dolly path — INSIDE the web, slow figure-eight
const dollyPath = [];
const pathLen = 240;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const phase = t * Math.PI * 2;
  const x = spherePos.x + Math.sin(phase) * 5.0 + Math.sin(phase*2.1)*1.5;
  const y = spherePos.y + Math.sin(phase*0.6 + 1.0) * 2.5 + Math.cos(phase*1.3)*0.6;
  const z = spherePos.z + Math.cos(phase) * 6.5 + Math.sin(phase*0.4)*2.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Tiny breathing on threads — static feel with imperceptible life
  const breathAmp = 0.008;
  const breathFreq = 0.18;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.4 + by*0.9 + bz*0.25;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.6;
    arr[i+2] = bz + s*0.4;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera — slow continuous dolly
  const speed = 0.005;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target wanders between sphere and key
  const lookBlend = 0.5 + Math.sin(t * 0.015) * 0.4;
  const lookTarget = spherePos.clone().lerp(keyPos, lookBlend);
  lookTarget.x += Math.sin(t*0.023)*0.4;
  lookTarget.y += Math.cos(t*0.017)*0.25;
  camera.lookAt(lookTarget);

  // Key — imperceptible rotation
  keyGroup.rotation.z += 0.00025;
  keyGroup.rotation.x += 0.0001;

  // Sphere gentle pulse
  const pulse = 1.0 + Math.sin(t * 0.12) * 0.006;
  sphereMesh.scale.setScalar(pulse);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
