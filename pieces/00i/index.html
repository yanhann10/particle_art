<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>00i · vibratory · neto membrane lucy</title>
<!-- MOTION: breathe, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a08; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">00i</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 1, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a08, 1);
document.body.appendChild(renderer.domElement);

const N = 60000;
const positions = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const normals = new Float32Array(N * 3);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0.0 }
};

// Ernesto Neto palette: cinnamon stocking, turmeric spice, raw linen, nylon white
// Taut translucent membrane — NormalBlending, tight falloff per critic
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute vec3 rest;
    attribute vec3 norm;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = rest;
      float t = uTime;

      // Neto's pendulous droop: gravity sag modulated by height
      // Halved droop per critic — keep Lucy recognizable
      float heightFactor = smoothstep(-8.0, 8.0, p.y);
      float droopAmount = (1.0 - heightFactor) * 1.2;
      // Single slow membrane wave — removed wave3 per critic
      float wave1 = sin(p.y * 0.3 + t * 0.4) * 0.35;
      float wave2 = sin(p.x * 0.5 + t * 0.6 + seed * 1.5) * 0.2;
      float membrane = wave1 + wave2;

      // Droop pulls downward, membrane pushes along normal
      p.y -= droopAmount * (0.4 + 0.3 * sin(t * 0.25 + seed * 3.0));
      p += norm * membrane * 0.6;

      // Vibratory: fine high-frequency tremor along surface normal
      // Like spice granules vibrating inside stretched nylon
      float vibFreq = 8.0 + seed * 4.0;
      float vibAmp = 0.04 + 0.03 * sin(t * 0.3 + seed * 6.28);
      p += norm * sin(t * vibFreq + seed * 20.0) * vibAmp;

      // Slow inhale-exhale — the whole form breathes as one organism
      float breath = 1.0 + 0.025 * sin(t * 0.35);
      p *= breath;

      // Assembly reveal
      vec3 entry = vec3(sin(seed*40.0), cos(seed*30.0), sin(seed*22.0)) * 20.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // Palette: cinnamon / turmeric / raw linen / nylon bone
      vec3 cinnamon = vec3(0.72, 0.42, 0.22);
      vec3 turmeric = vec3(0.78, 0.58, 0.18);
      vec3 linen    = vec3(0.88, 0.82, 0.72);
      vec3 nylon    = vec3(0.92, 0.88, 0.82);

      // Color by height band — like Neto's spice-filled compartments
      float band = fract(p.y * 0.12 + seed * 0.3);
      vec3 col = mix(cinnamon, turmeric, smoothstep(0.0, 0.35, band));
      col = mix(col, linen, smoothstep(0.35, 0.7, band));
      col = mix(col, nylon, smoothstep(0.7, 1.0, band));

      // Slight warm shift for particles catching the membrane stretch
      float stretch = abs(membrane);
      col = mix(col, turmeric, stretch * 0.3);

      vCol = col;
      vAlpha = (0.55 + 0.25 * (1.0 - heightFactor)) * uReady;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + 0.6 * stretch) * uPixel * (38.0 / dist) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      // Tight falloff per critic — translucent fabric, not glow
      float a = exp(-r * 22.0) * vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

// Atmospheric side-light: warm amber from below-left (Neto gallery lighting)
// Implemented as a subtle background gradient quad
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, -1.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      // Warm gradient from bottom — gallery floor bounce light
      float g = smoothstep(0.0, 0.6, 1.0 - vUv.y);
      vec3 warm = vec3(0.18, 0.10, 0.05);
      vec3 dark = vec3(0.05, 0.04, 0.03);
      vec3 col = mix(dark, warm, g * 0.4);
      // Slight vignette
      float vig = 1.0 - smoothstep(0.3, 0.85, length(vUv - 0.5));
      gl_FragColor = vec4(col, 0.6 * vig + 0.15);
    }
  `
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false;
bgQuad.renderOrder = -1;
scene.add(bgQuad);

// Load Lucy
const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
let revealStart = 0;

loader.load(PLY_URL, (geometry) => {
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const center = bb.getCenter(new THREE.Vector3());
  const size = bb.getSize(new THREE.Vector3());
  const maxAxis = Math.max(size.x, size.y, size.z);
  const scale = 16 / maxAxis;
  geometry.translate(-center.x, -center.y, -center.z);
  geometry.scale(scale, scale, scale);

  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
  const sampler = new MeshSurfaceSampler(mesh).build();
  const tmpPos = new THREE.Vector3();
  const tmpNorm = new THREE.Vector3();

  for (let i = 0; i < N; i++){
    sampler.sample(tmpPos, tmpNorm);
    restPositions[i*3]   = tmpPos.x;
    restPositions[i*3+1] = tmpPos.y;
    restPositions[i*3+2] = tmpPos.z;
    normals[i*3]   = tmpNorm.x;
    normals[i*3+1] = tmpNorm.y;
    normals[i*3+2] = tmpNorm.z;
    seeds[i] = Math.random();
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('rest', new THREE.BufferAttribute(restPositions, 3));
  geom.setAttribute('norm', new THREE.BufferAttribute(normals, 3));
  geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

  revealStart = performance.now();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3000);
  }

  // Fixed contemplative camera — no rotation
  // Slight vertical drift to follow the drooping center of mass
  const breathY = Math.sin(t * 0.35) * 0.3;
  camera.position.y = 1 + breathY;
  camera.lookAt(0, -0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
