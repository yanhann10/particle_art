<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>l38 · Mohr + olifant — horn spiral ivory field</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f0e0d; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">l38</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0e0d);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// olifant: Roland's ivory horn from Chanson de Roland
// Transform Mohr's hypercube into a spiral horn form with ivory gradient
// Maintain pixelation but stretch into logarithmic spiral trumpet shape

// ── 4D HYPERCUBE VERTICES → HORN PROFILE
const hyper4D = [];
for(let i=0; i<16; i++){
  hyper4D.push([
    (i & 1) ? 1 : -1,
    (i & 2) ? 1 : -1,
    (i & 4) ? 1 : -1,
    (i & 8) ? 1 : -1
  ]);
}

const hyper4DEdges = [];
for(let i=0; i<16; i++){
  for(let b=0; b<4; b++){
    const j = i ^ (1 << b);
    if(j > i) hyper4DEdges.push([i, j]);
  }
}

// Project 4D → 3D then WARP into horn spiral
function project4DToHorn(v4, angle1, angle2, hornPhase){
  // Original Mohr projection
  const c1 = Math.cos(angle1), s1 = Math.sin(angle1);
  let x = v4[0]*c1 - v4[3]*s1;
  let y = v4[1];
  let z = v4[2];
  let w = v4[0]*s1 + v4[3]*c1;
  
  const c2 = Math.cos(angle2), s2 = Math.sin(angle2);
  const y2 = y*c2 - w*s2;
  w = y*s2 + w*c2;
  
  const scale = 12.0 / (w + 3.0);
  const proj = new THREE.Vector3(x * scale, y2 * scale, z * scale);
  
  // HORN WARP: logarithmic spiral trumpet
  // Distance from origin determines position along horn
  const r = Math.sqrt(proj.x*proj.x + proj.y*proj.y);
  const theta = Math.atan2(proj.y, proj.x);
  
  // Logarithmic spiral parameters (olifant's curve)
  const spiralTightness = 0.18;
  const hornLength = r * 2.8 + hornPhase * 8.0;
  const spiralAngle = theta + hornLength * spiralTightness;
  
  // Horn radius expands exponentially (trumpet flare)
  const hornRadius = 0.8 * Math.exp(hornLength * 0.08) * (1.0 + Math.abs(proj.z) * 0.15);
  
  // Final horn position
  return new THREE.Vector3(
    Math.cos(spiralAngle) * hornRadius,
    Math.sin(spiralAngle) * hornRadius,
    hornLength - 15.0
  );
}

// ── PIXELATION: maintain Mohr's plotter aesthetic
const PIXEL_SIZE = 0.35;
function quantize(v){
  return new THREE.Vector3(
    Math.round(v.x / PIXEL_SIZE) * PIXEL_SIZE,
    Math.round(v.y / PIXEL_SIZE) * PIXEL_SIZE,
    Math.round(v.z / PIXEL_SIZE) * PIXEL_SIZE
  );
}

// ── PARTICLE SYSTEM
const NUM_PARTICLES = 75000;
const positions = new Float32Array(NUM_PARTICLES * 3);
const colors = new Float32Array(NUM_PARTICLES * 3);

let pi = 0;
function addParticle(pos, ivoryBrightness, warmth){
  if(pi >= NUM_PARTICLES) return;
  positions[pi*3] = pos.x;
  positions[pi*3+1] = pos.y;
  positions[pi*3+2] = pos.z;
  
  // Ivory color palette: warm cream to pale gold
  const baseIvory = 0.85 + ivoryBrightness * 0.15;
  colors[pi*3] = baseIvory;
  colors[pi*3+1] = baseIvory * (0.92 + warmth * 0.05);
  colors[pi*3+2] = baseIvory * (0.78 + warmth * 0.08);
  pi++;
}

let angle1 = 0.3;
let angle2 = 0.7;
let hornPhase = 0.0;

function regenerateParticles(a1, a2, phase){
  pi = 0;
  
  const vertices3D = hyper4D.map(v => quantize(project4DToHorn(v, a1, a2, phase)));
  
  // Draw hypercube edges transformed into horn ribs
  for(const [i, j] of hyper4DEdges){
    const start = vertices3D[i];
    const end = vertices3D[j];
    const steps = Math.floor(start.distanceTo(end) / PIXEL_SIZE) + 1;
    
    for(let s=0; s<=steps; s++){
      const t = s / steps;
      const p = start.clone().lerp(end, t);
      const qp = quantize(p);
      
      // Brightness varies by depth along horn (darker at narrow end)
      const hornDepth = (qp.z + 15.0) / 30.0;
      const brightness = 0.6 + 0.4 * Math.max(0, hornDepth);
      const warmth = hornDepth;
      
      addParticle(qp, brightness, warmth);
      
      // At vertices, add carved detail rings (ivory etching)
      if(s === 0 || s === steps){
        const ringSize = 0.6 + hornDepth * 0.4;
        const ringDetail = 8;
        for(let rd=0; rd<ringDetail; rd++){
          const ringAngle = (rd / ringDetail) * Math.PI * 2;
          const offset = new THREE.Vector3(
            Math.cos(ringAngle) * ringSize,
            Math.sin(ringAngle) * ringSize,
            0
          );
          addParticle(quantize(qp.clone().add(offset)), brightness * 0.8, warmth);
        }
      }
    }
  }
  
  // Spiral ribs along horn length (structural support lines)
  const ribCount = 160;
  for(let r=0; r<ribCount && pi < NUM_PARTICLES; r++){
    const i = Math.floor(Math.random() * 16);
    const j = Math.floor(Math.random() * 16);
    if(i === j) continue;
    
    const start = vertices3D[i];
    const end = vertices3D[j];
    const steps = Math.floor(start.distanceTo(end) / (PIXEL_SIZE * 2)) + 1;
    
    for(let s=0; s<=steps && pi < NUM_PARTICLES; s++){
      const t = s / steps;
      const p = start.clone().lerp(end, t);
      const qp = quantize(p);
      const hornDepth = (qp.z + 15.0) / 30.0;
      const brightness = 0.3 + 0.4 * Math.max(0, hornDepth);
      const warmth = hornDepth;
      addParticle(qp, brightness, warmth);
    }
  }
  
  // Horn interior grain (ivory texture)
  while(pi < NUM_PARTICLES){
    const p = new THREE.Vector3(
      (Math.random() - 0.5) * 22,
      (Math.random() - 0.5) * 22,
      Math.random() * 30 - 15
    );
    const qp = quantize(p);
    const hornDepth = (qp.z + 15.0) / 30.0;
    const brightness = 0.2 + 0.3 * Math.max(0, hornDepth);
    const warmth = hornDepth * 0.8;
    addParticle(qp, brightness, warmth);
  }
}

regenerateParticles(angle1, angle2, hornPhase);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.14,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  sizeAttenuation: true,
  depthWrite: false
});

const points = new THREE.Points(geo, mat);
scene.add(points);

function updateCamera(){
  let cx = 0, cy = 0, cz = 0, count = 0;
  for(let i=0; i<pi; i++){
    cx += positions[i*3];
    cy += positions[i*3+1];
    cz += positions[i*3+2];
    count++;
  }
  if(count > 0){
    cx /= count; cy /= count; cz /= count;
    camera.position.x += (cx - camera.position.x + 3) * 0.02;
    camera.position.y += (cy - camera.position.y + 2) * 0.02;
    camera.position.z += (cz + 38 - camera.position.z) * 0.02;
    camera.lookAt(cx, cy, cz);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let rotating = true;
let rotationSpeed = 0.0008;
let hornGrowth = 0.0004;

addEventListener('click', () => {
  angle1 = Math.random() * Math.PI * 2;
  angle2 = Math.random() * Math.PI * 2;
  hornPhase = Math.random() * 2.0;
  regenerateParticles(angle1, angle2, hornPhase);
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  updateCamera();
});

addEventListener('mousemove', (e) => {
  const nx = e.clientX / innerWidth;
  rotationSpeed = 0.0003 + nx * 0.002;
  hornGrowth = 0.0002 + (1.0 - e.clientY / innerHeight) * 0.001;
});

function loop(t){
  if(rotating){
    angle1 += rotationSpeed;
    angle2 += rotationSpeed * 0.7;
    hornPhase += hornGrowth;
    
    const vertices3D = hyper4D.map(v => quantize(project4DToHorn(v, angle1, angle2, hornPhase)));
    
    let idx = 0;
    for(const [i, j] of hyper4DEdges){
      const start = vertices3D[i];
      const end = vertices3D[j];
      const steps = Math.floor(start.distanceTo(end) / PIXEL_SIZE) + 1;
      
      for(let s=0; s<=steps && idx < NUM_PARTICLES; s++){
        const t = s / steps;
        const p = start.clone().lerp(end, t);
        const qp = quantize(p);
        
        positions[idx*3] = qp.x;
        positions[idx*3+1] = qp.y;
        positions[idx*3+2] = qp.z;
        
        const hornDepth = (qp.z + 15.0) / 30.0;
        const brightness = 0.6 + 0.4 * Math.max(0, hornDepth);
        const baseIvory = 0.85 + brightness * 0.15;
        colors[idx*3] = baseIvory;
        colors[idx*3+1] = baseIvory * (0.92 + hornDepth * 0.05);
        colors[idx*3+2] = baseIvory * (0.78 + hornDepth * 0.08);
        
        idx++;
      }
    }
    
    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;
  }
  
  updateCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
