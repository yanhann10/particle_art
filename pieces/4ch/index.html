<html lang="en">
<head>

<!-- MOTION: accumulate, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0e; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">4ch</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(28, 18, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// palette — cinder block, rebar, concrete, neon code-flash
const PAL = [
  new THREE.Color(0x5a5a5e), // cinder
  new THREE.Color(0x6e6e72), // concrete mid
  new THREE.Color(0x3d3d42), // rebar dark
  new THREE.Color(0x7a7a7f), // concrete light
  new THREE.Color(0x484850), // shadow block
];
const NEON = new THREE.Color(0x00e87b);
const NEON2 = new THREE.Color(0x00c8ff);

// ─── L-system scaffold: generates branching room-columns
// grammar: F → F[+F]F[-F]F  with 3D angles snapped to 90° grid
const GRID = 1.05; // cube spacing
const MAX_BLOCKS = 6000;

class Block {
  constructor(x, y, z, gen, branch) {
    this.x = x; this.y = y; this.z = z;
    this.gen = gen; this.branch = branch;
    this.placed = false;
    this.placeTime = 0;
    this.falling = false;
    this.fallVel = 0;
    this.fallY = 0;
    this.flash = 0;
    this.colIdx = ((x * 7 + z * 13 + branch * 3) & 0xffff) % PAL.length;
  }
}

// generate scaffold positions via stochastic L-system
const blocks = [];
const occupied = new Set();
function posKey(x, y, z) { return `${x},${y},${z}`; }

function growBranch(sx, sy, sz, dirX, dirZ, gen, branchId, maxSteps) {
  let x = sx, y = sy, z = sz;
  for (let s = 0; s < maxSteps && blocks.length < MAX_BLOCKS; s++) {
    // stack upward
    const h = Math.floor(2 + Math.random() * 5);
    for (let dy = 0; dy < h && blocks.length < MAX_BLOCKS; dy++) {
      const k = posKey(x, y + dy, z);
      if (!occupied.has(k)) {
        occupied.add(k);
        blocks.push(new Block(x, y + dy, z, gen, branchId));
      }
    }
    // floor slab at top
    const floorY = y + h;
    const slabW = Math.floor(1 + Math.random() * 3);
    const slabD = Math.floor(1 + Math.random() * 3);
    for (let dx = -slabW; dx <= slabW && blocks.length < MAX_BLOCKS; dx++) {
      for (let dz = -slabD; dz <= slabD && blocks.length < MAX_BLOCKS; dz++) {
        const k = posKey(x + dx, floorY, z + dz);
        if (!occupied.has(k)) {
          occupied.add(k);
          blocks.push(new Block(x + dx, floorY, z + dz, gen, branchId));
        }
      }
    }
    // walls — partial, leaving gaps like informal construction
    for (let dx = -slabW; dx <= slabW; dx++) {
      for (let dy = 1; dy <= h && blocks.length < MAX_BLOCKS; dy++) {
        for (const wz of [-slabD, slabD]) {
          if (Math.random() < 0.55) {
            const k = posKey(x + dx, y + h + dy, z + wz);
            if (!occupied.has(k)) {
              occupied.add(k);
              blocks.push(new Block(x + dx, y + h + dy, z + wz, gen, branchId));
            }
          }
        }
      }
    }
    for (let dz = -slabD; dz <= slabD; dz++) {
      for (let dy = 1; dy <= h && blocks.length < MAX_BLOCKS; dy++) {
        for (const wx of [-slabW, slabW]) {
          if (Math.random() < 0.45) {
            const k = posKey(x + wx, y + h + dy, z + dz);
            if (!occupied.has(k)) {
              occupied.add(k);
              blocks.push(new Block(x + wx, y + h + dy, z + dz, gen, branchId));
            }
          }
        }
      }
    }
    y = floorY + h;
    // branch?
    if (Math.random() < 0.4 && gen < 3) {
      const bdx = (Math.random() < 0.5 ? -1 : 1) * Math.floor(2 + Math.random() * 4);
      const bdz = (Math.random() < 0.5 ? -1 : 1) * Math.floor(2 + Math.random() * 4);
      growBranch(x + bdx, y, z + bdz, bdx > 0 ? 1 : -1, bdz > 0 ? 1 : -1, gen + 1, branchId + s * 100, Math.floor(maxSteps * 0.6));
    }
    // lateral shift
    x += Math.floor((Math.random() - 0.5) * 3);
    z += Math.floor((Math.random() - 0.5) * 3);
  }
}

// seed several building columns across a ground plane
const SEEDS = 7;
for (let i = 0; i < SEEDS; i++) {
  const ang = (i / SEEDS) * Math.PI * 2 + Math.random() * 0.3;
  const r = 3 + Math.random() * 6;
  const sx = Math.round(Math.cos(ang) * r);
  const sz = Math.round(Math.sin(ang) * r);
  growBranch(sx, 0, sz, 0, 0, 0, i, 4 + Math.floor(Math.random() * 3));
}

// sort blocks by height for staged placement
blocks.sort((a, b) => a.y - b.y || a.gen - b.gen);

// ─── instanced mesh
const cubeGeo = new THREE.BoxGeometry(GRID * 0.92, GRID * 0.92, GRID * 0.92);
const cubeMat = new THREE.MeshStandardMaterial({
  roughness: 0.85,
  metalness: 0.15,
  flatShading: true,
});
const mesh = new THREE.InstancedMesh(cubeGeo, cubeMat, MAX_BLOCKS);
mesh.count = 0;
scene.add(mesh);

const dummy = new THREE.Object3D();
const color = new THREE.Color();

// ─── lighting — warm top, cool side, neon accent
const ambLight = new THREE.AmbientLight(0x1a1a22, 0.5);
scene.add(ambLight);

const topLight = new THREE.DirectionalLight(0xffe0b0, 0.9);
topLight.position.set(5, 30, 8);
scene.add(topLight);

const sideLight = new THREE.DirectionalLight(0x7090b0, 0.4);
sideLight.position.set(-12, 5, -10);
scene.add(sideLight);

const neonLight = new THREE.PointLight(0x00e87b, 2.5, 20);
neonLight.position.set(0, 6, 0);
scene.add(neonLight);

const neonLight2 = new THREE.PointLight(0x00c8ff, 1.5, 15);
neonLight2.position.set(4, 12, -3);
scene.add(neonLight2);

// ground plane — rough concrete
const groundGeo = new THREE.PlaneGeometry(80, 80);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x18181c,
  roughness: 1.0,
  metalness: 0.0,
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// ─── film grain overlay (lia_halloran)
const grainCanvas = document.createElement('canvas');
grainCanvas.width = 256; grainCanvas.height = 256;
const gctx = grainCanvas.getContext('2d');
const grainTex = new THREE.CanvasTexture(grainCanvas);
const grainMat = new THREE.MeshBasicMaterial({
  map: grainTex, transparent: true, opacity: 0.06,
  blending: THREE.AdditiveBlending, depthTest: false,
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
grainScene.add(grainQuad);

function updateGrain() {
  const d = gctx.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = Math.random() * 255;
    d.data[i] = v; d.data[i+1] = v; d.data[i+2] = v; d.data[i+3] = 40;
  }
  gctx.putImageData(d, 0, 0);
  grainTex.needsUpdate = true;
}

// ─── state
let placeCursor = 0;
const PLACE_RATE = 6;      // blocks per frame
let collapseTimer = 0;
const COLLAPSE_INTERVAL = 480; // frames between collapses
let frameCount = 0;

// collapse: pick a random branch section and make those blocks fall
function triggerCollapse() {
  const branchIds = [...new Set(blocks.filter(b => b.placed && !b.falling).map(b => b.branch))];
  if (branchIds.length === 0) return;
  const targetBranch = branchIds[Math.floor(Math.random() * branchIds.length)];
  // only collapse upper portion of this branch
  const branchBlocks = blocks.filter(b => b.branch === targetBranch && b.placed && !b.falling);
  if (branchBlocks.length < 3) return;
  branchBlocks.sort((a, b) => b.y - a.y);
  const collapseCount = Math.floor(branchBlocks.length * (0.3 + Math.random() * 0.4));
  for (let i = 0; i < collapseCount; i++) {
    const b = branchBlocks[i];
    b.falling = true;
    b.fallVel = 0;
    b.fallY = b.y * GRID;
    b.flash = 1.0; // neon flash on collapse
  }
}

// ─── centroid tracking
let centX = 0, centY = 8, centZ = 0;

function updateInstances() {
  let cx = 0, cy = 0, cz = 0, count = 0;
  let visCount = 0;

  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (!b.placed) continue;

    let py;
    if (b.falling) {
      b.fallVel += 0.018;
      b.fallY -= b.fallVel;
      // slight lateral drift
      b.x += (Math.random() - 0.5) * 0.03;
      b.z += (Math.random() - 0.5) * 0.03;
      py = b.fallY;
      b.flash *= 0.94;
      if (b.fallY < -8) {
        // respawn at original position after delay
        b.falling = false;
        b.placed = false;
        b.fallVel = 0;
        b.flash = 0;
        continue;
      }
    } else {
      py = b.y * GRID;
    }

    dummy.position.set(b.x * GRID, py, b.z * GRID);
    // subtle rotation jitter for hand-placed feel
    dummy.rotation.set(
      (Math.sin(b.x * 3.7 + b.z * 2.1) * 0.03),
      (Math.cos(b.y * 1.3 + b.x * 0.9) * 0.04),
      (Math.sin(b.z * 2.8 + b.y * 1.7) * 0.03)
    );
    if (b.falling) {
      dummy.rotation.x += b.fallVel * 0.5;
      dummy.rotation.z += b.fallVel * 0.3;
    }
    dummy.updateMatrix();
    mesh.setMatrixAt(visCount, dummy.matrix);

    // color
    if (b.flash > 0.1) {
      color.copy(b.flash > 0.5 ? NEON : NEON2).lerp(PAL[b.colIdx], 1 - b.flash);
    } else {
      color.copy(PAL[b.colIdx]);
      // subtle height-based warmth
      const warmth = Math.min(1, (b.y * GRID) / 30);
      color.lerp(new THREE.Color(0x8a7060), warmth * 0.15);
    }
    mesh.setColorAt(visCount, color);

    cx += b.x * GRID;
    cy += py;
    cz += b.z * GRID;
    count++;
    visCount++;
  }

  mesh.count = visCount;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

  if (count > 0) {
    centX = cx / count;
    centY = cy / count;
    centZ = cz / count;
  }
}

// ─── neon code-flash lines between close blocks (scaffold rebar)
const rebarMax = 800;
const rebarGeo = new THREE.BufferGeometry();
const rebarPositions = new Float32Array(rebarMax * 6);
rebarGeo.setAttribute('position', new THREE.BufferAttribute(rebarPositions, 3));
const rebarMat = new THREE.LineBasicMaterial({
  color: 0x00e87b, transparent: true, opacity: 0.12,
  blending: THREE.AdditiveBlending,
});
const rebarLines = new THREE.LineSegments(rebarGeo, rebarMat);
scene.add(rebarLines);

function updateRebar() {
  const placed = blocks.filter(b => b.placed && !b.falling);
  let idx = 0;
  // connect vertically adjacent blocks in same column
  for (let i = 0; i < placed.length && idx < rebarMax; i++) {
    const a = placed[i];
    for (let j = i + 1; j < placed.length && j < i + 20 && idx < rebarMax; j++) {
      const b = placed[j];
      const dx = (a.x - b.x) * GRID, dz = (a.z - b.z) * GRID;
      const dy = (a.y - b.y) * GRID;
      const d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < 4.5 && d2 > 0.5) {
        rebarPositions[idx * 6]     = a.x * GRID;
        rebarPositions[idx * 6 + 1] = a.y * GRID;
        rebarPositions[idx * 6 + 2] = a.z * GRID;
        rebarPositions[idx * 6 + 3] = b.x * GRID;
        rebarPositions[idx * 6 + 4] = b.y * GRID;
        rebarPositions[idx * 6 + 5] = b.z * GRID;
        idx++;
      }
    }
  }
  rebarGeo.setDrawRange(0, idx * 2);
  rebarGeo.attributes.position.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── main loop
let grainFrame = 0;
function animate() {
  frameCount++;

  // place new blocks
  for (let i = 0; i < PLACE_RATE && placeCursor < blocks.length; i++) {
    const b = blocks[placeCursor];
    if (!b.placed && !b.falling) {
      b.placed = true;
      b.placeTime = frameCount;
      b.flash = 0.6; // brief code-flash on placement
    }
    placeCursor++;
  }

  // collapse cycle
  collapseTimer++;
  if (collapseTimer >= COLLAPSE_INTERVAL) {
    collapseTimer = 0;
    triggerCollapse();
  }

  // re-place fallen blocks (loop the cursor back for unplaced ones)
  if (placeCursor >= blocks.length) {
    const unplaced = blocks.filter(b => !b.placed && !b.falling);
    if (unplaced.length > 0) placeCursor = blocks.indexOf(unplaced[0]);
  }

  // decay flash
  for (const b of blocks) {
    if (b.flash > 0 && !b.falling) b.flash *= 0.92;
  }

  updateInstances();

  // rebar lines update every 30 frames
  if (frameCount % 30 === 0) updateRebar();

  // neon light pulse
  const pulse = Math.sin(frameCount * 0.03) * 0.5 + 0.5;
  neonLight.intensity = 1.5 + pulse * 2.0;
  neonLight.position.y = centY * 0.5 + 2;
  neonLight2.position.y = centY * 0.8;

  // camera tracking
  controls.target.x += (centX - controls.target.x) * 0.02;
  controls.target.y += (Math.max(centY, 4) - controls.target.y) * 0.02;
  controls.target.z += (centZ - controls.target.z) * 0.02;
  controls.update();
  renderer.render(scene, camera);

  // grain overlay every 4 frames
  grainFrame++;
  if (grainFrame % 4 === 0) {
    updateGrain();
    renderer.autoClear = false;
    renderer.render(grainScene, grainCam);
    renderer.autoClear = true;
  }

  requestAnimationFrame(animate);
}
animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
