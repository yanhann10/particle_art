<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xff · Shiota — The Dress Remembers</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">xff</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.003);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060202, 0.02));

const pL = new THREE.PointLight(0xffd4a8, 0.06, 50, 1.8);
pL.position.set(-2, 18, 3);
scene.add(pL);

let seed = 73921648;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — presence-in-absence, the person is gone
// Bodice: narrow cylinder; Skirt: flared cone below
const dressCenter = new THREE.Vector3(0.4, 3.8, -0.5);
const BODICE_TOP = dressCenter.y + 2.2;
const BODICE_BOT = dressCenter.y + 0.2;
const SKIRT_BOT = dressCenter.y - 3.8;
const BODICE_R = 0.45;
const SKIRT_R = 1.6;

// Dress mesh — translucent cream, ghostly
const dressGroup = new THREE.Group();

const bodiceMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece0, emissive: 0xede4d0, emissiveIntensity: 0.55,
  roughness: 0.96, metalness: 0.0, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide
});

const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(BODICE_R * 0.7, BODICE_R, BODICE_TOP - BODICE_BOT, 12, 1, true),
  bodiceMat
);
bodice.position.set(dressCenter.x, (BODICE_TOP + BODICE_BOT) / 2, dressCenter.z);
dressGroup.add(bodice);

const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(BODICE_R, SKIRT_R, BODICE_BOT - SKIRT_BOT, 16, 1, true),
  bodiceMat.clone()
);
skirt.material.opacity = 0.18;
skirt.position.set(dressCenter.x, (BODICE_BOT + SKIRT_BOT) / 2, dressCenter.z);
dressGroup.add(skirt);

// Collar ring — faint suggestion of neckline
const collar = new THREE.Mesh(
  new THREE.TorusGeometry(BODICE_R * 0.75, 0.025, 6, 16),
  new THREE.MeshBasicMaterial({ color: 0xfcf6ee, transparent: true, opacity: 0.12 })
);
collar.position.set(dressCenter.x, BODICE_TOP + 0.02, dressCenter.z);
collar.rotation.x = Math.PI / 2;
dressGroup.add(collar);

scene.add(dressGroup);

// Inner glow — warm core
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 10, 6),
  new THREE.MeshBasicMaterial({ color: 0xfcf0e0, transparent: true, opacity: 0.03 })
);
innerGlow.position.set(dressCenter.x, dressCenter.y + 0.5, dressCenter.z);
scene.add(innerGlow);

// Suspension lines — hanger threads from ceiling
const suspPts = [];
for(let i = 0; i < 5; i++){
  const ox = (rng()-0.5) * 0.3;
  const oz = (rng()-0.5) * 0.25;
  suspPts.push(
    dressCenter.x + ox, hh, dressCenter.z + oz,
    dressCenter.x + ox * 0.08, BODICE_TOP + 0.03, dressCenter.z + oz * 0.08
  );
}
// Two wider shoulder straps
suspPts.push(
  dressCenter.x - 0.35, hh, dressCenter.z,
  dressCenter.x - BODICE_R * 0.6, BODICE_TOP, dressCenter.z
);
suspPts.push(
  dressCenter.x + 0.35, hh, dressCenter.z,
  dressCenter.x + BODICE_R * 0.6, BODICE_TOP, dressCenter.z
);
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.5
})));

// ── DRESS SURFACE SAMPLER
function dressSurf(){
  const t = rng();
  let y, r;
  if(t < 0.35){
    // Bodice
    y = BODICE_BOT + rng() * (BODICE_TOP - BODICE_BOT);
    const lt = (y - BODICE_BOT) / (BODICE_TOP - BODICE_BOT);
    r = BODICE_R * (1.0 - lt * 0.3);
  } else {
    // Skirt — more surface area, more threads
    y = SKIRT_BOT + rng() * (BODICE_BOT - SKIRT_BOT);
    const lt = (y - SKIRT_BOT) / (BODICE_BOT - SKIRT_BOT);
    r = SKIRT_R * (1.0 - lt) + BODICE_R * lt;
  }
  const a = rng() * Math.PI * 2;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(a) * r,
    y,
    dressCenter.z + Math.sin(a) * r
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — organic placement: rings rising around the dress, denser near hem
const anchors = [];

// Concentric rings at various heights — denser near skirt hem
const ringHeights = [-14, -11, -8, -5, -2, 0, 2, 4, 7, 10, 13];
for(const ry of ringHeights){
  const distFromDress = Math.abs(ry - dressCenter.y);
  const ringR = 2.0 + distFromDress * 0.55;
  const nPts = 6 + Math.floor(distFromDress * 1.0);
  for(let i = 0; i < nPts; i++){
    const a = (i / nPts) * Math.PI * 2 + (rng()-0.5)*0.18;
    const r = ringR * (0.8 + rng()*0.35);
    anchors.push(new THREE.Vector3(
      dressCenter.x + Math.cos(a) * r + (rng()-0.5)*0.5,
      ry + (rng()-0.5)*0.7,
      dressCenter.z + Math.sin(a) * r + (rng()-0.5)*0.5
    ));
  }
}

// Wall-biased architectural anchors
while(anchors.length < 480){
  const p = rng() < 0.35 ? wallPt() : wallPt().lerp(dressCenter, 0.05 + rng()*0.25);
  anchors.push(p);
}

// Void zones — negative space for the camera to peer through
const voids = [
  { pos: new THREE.Vector3(dressCenter.x - 4, dressCenter.y - 4, dressCenter.z + 5), r: 2.6 },
  { pos: new THREE.Vector3(dressCenter.x + 5, dressCenter.y + 4, dressCenter.z - 4), r: 2.0 },
  { pos: new THREE.Vector3(dressCenter.x + 2, dressCenter.y - 9, dressCenter.z - 3), r: 2.3 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-dressCenter.x)**2+(my-dressCenter.y)**2+(mz-dressCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — threads reach for the dress surface
// The web yearns toward the absent body
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.4){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }

  const target = dressSurf();

  // 12% stop short — threads that almost reach the dress but fail
  // presence-in-absence: the hand that cannot touch
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng() * 1.4;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — anchor-to-anchor, density from closeness
const THRESH = 5.5;
const catBtarget = Math.floor(NUM_LINES * 0.28);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 80000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Rule 3: HEM DRAPE — threads from skirt hem falling to floor
// Gravity pulls the web earthward beneath the dress
const catD = Math.floor(NUM_LINES * 0.10);
for(let i = 0; i < catD && li < NUM_LINES; i++){
  const hemAngle = rng() * Math.PI * 2;
  const hemPt = new THREE.Vector3(
    dressCenter.x + Math.cos(hemAngle) * SKIRT_R * (0.9 + rng()*0.15),
    SKIRT_BOT + (rng()-0.5)*0.3,
    dressCenter.z + Math.sin(hemAngle) * SKIRT_R * (0.9 + rng()*0.15)
  );
  const floorPt = new THREE.Vector3(
    hemPt.x + (rng()-0.5)*3.5,
    -hh,
    hemPt.z + (rng()-0.5)*3.5
  );
  if(!inVoid(hemPt)) setLine(hemPt, floorPt, 2);
}

// Fill remainder: architectural wall-to-wall spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.25 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity differentiation by category
const catOpacity = [0.075, 0.045, 0.06, 0.03];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat];
  const bright = op / 0.075;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, old letters, caught in thread
const NUM_FRAGMENTS = 32;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.08;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.8);
  const h = sz * (0.4 + rng()*1.0);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.2), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.1), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0,
    w*(-0.3+rng()*0.2), h*0.5, 0,
    w*(0.15+rng()*0.35), h*(rng()*0.05), 0,
    w*(0.1-rng()*0.3), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.05, d*0.02),
    transparent: true,
    opacity: 0.12 + rng()*0.22,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.55){
    // Place on a thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else if(rng() < 0.4){
    // Near the dress hem — fallen things
    const a = rng() * Math.PI * 2;
    const r = SKIRT_R + rng()*3.0;
    frag.position.set(
      dressCenter.x + Math.cos(a)*r,
      SKIRT_BOT - rng()*2.5,
      dressCenter.z + Math.sin(a)*r
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(2.0 + rng()*7.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative: begin far below in darkness among the draping threads,
// slowly rise through the web toward the dress, arrive at hem level,
// continue upward past the bodice, then drift back to look down at the dress
// from above — the arc of remembering.
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;

  let rH, y;
  if(t < 0.3){
    // Phase 1: deep below, among draping hem-threads, looking up
    const lt = t / 0.3;
    rH = 7.0 - lt * 1.5;
    y = cy - 12 + lt * 7;
  } else if(t < 0.55){
    // Phase 2: rising through the skirt-level web
    const lt = (t - 0.3) / 0.25;
    rH = 5.5 - lt * 1.2;
    y = cy - 5 + lt * 6 + Math.sin(lt * Math.PI) * 1.0;
  } else if(t < 0.8){
    // Phase 3: at dress level, intimate orbit — close to the absent body
    const lt = (t - 0.55) / 0.25;
    rH = 4.3 + Math.sin(lt * Math.PI) * 0.5;
    y = cy + 1 + lt * 3 + Math.sin(lt * Math.PI * 2) * 1.2;
  } else {
    // Phase 4: above, looking down — the whole web revealed as nervous system
    const lt = (t - 0.8) / 0.2;
    rH = 4.8 + lt * 1.5;
    y = cy + 4 + Math.sin(lt * Math.PI) * 3.0;
  }

  const x = cx + Math.sin(p * 1.1) * rH + Math.cos(p * 0.45 + 1.5) * 0.5;
  const z = cz + Math.cos(p * 1.1) * (rH * 1.1) + Math.sin(p * 0.5 + 0.9) * 0.4;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible sway, as if wind stirred
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.00015 * Math.max(0, 1.0 - dist / 22.0);
    const phase = basePositions[idx]*0.11 + basePositions[idx+1]*0.14 + i*0.0004;
    const breath = Math.sin(t*0.01 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.25;
      arr[vi+1] = basePositions[vi+1] + breath*0.12;
      arr[vi+2] = basePositions[vi+2] + breath*0.2;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera along path
  const speed = 0.0004;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress — the absent figure
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.0012)*0.04;
  look.y += Math.cos(t*0.001)*0.025 + 0.3;
  look.z += Math.sin(t*0.0015)*0.03;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = -2 + Math.sin(t*0.0006)*0.12;
  pL.position.y = 18 + Math.cos(t*0.0004)*0.06;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
