<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-25, 25, 25, -25, 0.1, 100);
camera.position.set(0, 0, 20);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf4ece1, 1);
document.body.appendChild(renderer.domElement);

// Domains preserved from parent, but flow shifts from linear to orbital (mantra = closed cycle)
const domains = [
  { cx: -14, cy: 12, r: 7, angle: 0.3, curl: 0.15, density: 0.85, orbit: 1.0 },
  { cx: 8, cy: 15, r: 6.5, angle: -0.6, curl: -0.12, density: 0.75, orbit: -1.0 },
  { cx: -18, cy: -8, r: 8, angle: 1.2, curl: 0.18, density: 0.9, orbit: 1.0 },
  { cx: 10, cy: -12, r: 7.5, angle: 2.1, curl: -0.1, density: 0.8, orbit: -1.0 },
  { cx: -5, cy: 0, r: 5, angle: 0.8, curl: 0.2, density: 0.65, orbit: 1.0 },
  { cx: 18, cy: 2, r: 6, angle: -1.4, curl: 0.14, density: 0.7, orbit: -1.0 },
  { cx: 2, cy: -22, r: 5.5, angle: 1.8, curl: -0.16, density: 0.6, orbit: 1.0 }
];

// Original centers for breathing reference
const domainOrigins = domains.map(d => ({ cx: d.cx, cy: d.cy }));

// Palette: warm earth tones deepened slightly — contemplative shift
const palette = [
  new THREE.Color(0x5c3a1a), // deep umber
  new THREE.Color(0xb03c0a), // oxide red (darker)
  new THREE.Color(0xc99a60), // ochre (muted)
  new THREE.Color(0x8c4525), // terracotta (deeper)
  new THREE.Color(0x7a5f3a), // burnt sienna (quiet)
  new THREE.Color(0x152e42), // Prussian blue (deeper)
  new THREE.Color(0x4d3528)  // dark umber
];

const domainColors = domains.map((d, i) => palette[i % palette.length]);

const N = 12000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const sizes = new Float32Array(N);
const ages = new Float32Array(N);
const domainIdx = new Int32Array(N); // track which domain each particle belongs to
const orbitRadius = new Float32Array(N); // distance from domain center for orbital motion

let particleIndex = 0;

for (let di = 0; di < domains.length; di++){
  const d = domains[di];
  const particlesInDomain = Math.floor(N * d.density / domains.reduce((sum, dd) => sum + dd.density, 0));
  const minSpacing = 0.4;
  const attempts = particlesInDomain * 20;
  const placed = [];

  for (let a = 0; a < attempts && placed.length < particlesInDomain; a++){
    const angle = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * d.r;
    const px = d.cx + Math.cos(angle) * rad;
    const py = d.cy + Math.sin(angle) * rad;

    let tooClose = false;
    for (const p of placed){
      const dx = p.x - px;
      const dy = p.y - py;
      if (dx*dx + dy*dy < minSpacing * minSpacing){
        tooClose = true;
        break;
      }
    }

    if (!tooClose && particleIndex < N){
      placed.push({ x: px, y: py });
      positions[particleIndex * 3] = px;
      positions[particleIndex * 3 + 1] = py;
      positions[particleIndex * 3 + 2] = (Math.random() - 0.5) * 0.5;

      const speed = 0.015 + Math.random() * 0.01;
      velocities[particleIndex * 3] = Math.cos(d.angle) * speed;
      velocities[particleIndex * 3 + 1] = Math.sin(d.angle) * speed;
      velocities[particleIndex * 3 + 2] = 0;

      const col = domainColors[di];
      colors[particleIndex * 3] = col.r;
      colors[particleIndex * 3 + 1] = col.g;
      colors[particleIndex * 3 + 2] = col.b;

      sizes[particleIndex] = 0.3 + Math.random() * 0.4;
      ages[particleIndex] = Math.random() * 1000;
      domainIdx[particleIndex] = di;
      orbitRadius[particleIndex] = rad;
      particleIndex++;
    }
  }
}

while (particleIndex < N){
  const di = Math.floor(Math.random() * domains.length);
  const d = domains[di];
  const angle = Math.random() * Math.PI * 2;
  const rad = Math.sqrt(Math.random()) * d.r;
  positions[particleIndex * 3] = d.cx + Math.cos(angle) * rad;
  positions[particleIndex * 3 + 1] = d.cy + Math.sin(angle) * rad;
  positions[particleIndex * 3 + 2] = 0;
  velocities[particleIndex * 3] = 0;
  velocities[particleIndex * 3 + 1] = 0;
  velocities[particleIndex * 3 + 2] = 0;
  const col = domainColors[di];
  colors[particleIndex * 3] = col.r;
  colors[particleIndex * 3 + 1] = col.g;
  colors[particleIndex * 3 + 2] = col.b;
  sizes[particleIndex] = 0.3;
  ages[particleIndex] = 0;
  domainIdx[particleIndex] = di;
  orbitRadius[particleIndex] = rad;
  particleIndex++;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBreath: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBreath;
    attribute float size;
    attribute float age;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vCol = color;
      // Mantric pulse: shared breathing rhythm across all particles
      float breathCycle = sin(uTime * 0.4) * 0.5 + 0.5; // slow 0-1 cycle
      float personalPhase = age * 0.3;
      float pulse = 0.6 + 0.4 * sin(personalPhase + uTime * 0.5) * (0.7 + 0.3 * breathCycle);
      vAlpha = 0.7 * pulse;

      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float breathSize = 1.0 + 0.15 * breathCycle;
      gl_PointSize = size * 120.0 * uPixel * breathSize;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;

      float edge = smoothstep(0.5, 0.3, r);
      float core = smoothstep(0.4, 0.0, r);
      float brush = edge * 0.5 + core * 0.5;

      float a = brush * vAlpha;
      gl_FragColor = vec4(vCol * (0.8 + 0.2 * core), a);
    }
  `,
  vertexColors: true
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geom.setAttribute('age', new THREE.BufferAttribute(ages, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  const aspect = innerWidth / innerHeight;
  const height = 50;
  const width = height * aspect;
  camera.left = -width / 2;
  camera.right = width / 2;
  camera.top = height / 2;
  camera.bottom = -height / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Mantra morph: flow transitions from linear streamlines to closed orbital paths
// Each domain's particles gradually circle their domain center
// Breath cycle modulates the system — inhale contracts, exhale expands
let morphProgress = 0; // 0 = parent linear flow, 1 = full orbital mantra

function getFlowVector(x, y, t){
  let fx = 0, fy = 0;
  let totalWeight = 0;

  for (const d of domains){
    const dx = x - d.cx;
    const dy = y - d.cy;
    const distSq = dx*dx + dy*dy;
    const rSq = d.r * d.r;

    if (distSq < rSq * 1.2){
      const weight = Math.max(0, 1.0 - distSq / (rSq * 1.2));

      // Linear flow component (parent behavior)
      const baseAngle = d.angle;
      const curlAngle = Math.atan2(dy, dx) + Math.PI / 2;
      const linearAngle = baseAngle + d.curl * curlAngle;
      const linX = Math.cos(linearAngle);
      const linY = Math.sin(linearAngle);

      // Orbital component (mantra: closed circular paths around domain center)
      const dist = Math.sqrt(distSq) + 0.001;
      const tangentX = -dy / dist * d.orbit;
      const tangentY = dx / dist * d.orbit;

      // Blend linear → orbital based on morphProgress
      const blendedX = linX * (1 - morphProgress) + tangentX * morphProgress;
      const blendedY = linY * (1 - morphProgress) + tangentY * morphProgress;

      fx += blendedX * weight;
      fy += blendedY * weight;
      totalWeight += weight;
    }
  }

  if (totalWeight > 0.01){
    fx /= totalWeight;
    fy /= totalWeight;
  }

  return { x: fx, y: fy };
}

function updateParticles(dt, t){
  // Shared breathing rhythm — all domains pulse together like a chant
  const breath = Math.sin(t * 0.4); // -1 to 1, ~15s full cycle
  const breathScale = 1.0 + breath * 0.08; // subtle contraction/expansion

  // Slowly increase morph toward full orbital mode over first 30 seconds
  morphProgress = Math.min(1.0, morphProgress + dt * 0.033);

  // Breath moves domain centers slightly toward global centroid
  const gcx = domainOrigins.reduce((s, d) => s + d.cx, 0) / domains.length;
  const gcy = domainOrigins.reduce((s, d) => s + d.cy, 0) / domains.length;

  for (let di = 0; di < domains.length; di++){
    const o = domainOrigins[di];
    const pullStrength = (1 - breathScale) * 0.5; // inhale pulls in
    domains[di].cx = o.cx + (gcx - o.cx) * pullStrength * morphProgress;
    domains[di].cy = o.cy + (gcy - o.cy) * pullStrength * morphProgress;
    domains[di].r = domains[di].r * 0.999 + (domains[di].r) * 0.001; // stable radius
  }

  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];

    const flow = getFlowVector(px, py, t);

    // Gentler acceleration — mantric calm
    const flowSpeed = 0.018 * (0.85 + 0.15 * (breath * 0.5 + 0.5)); // breath modulates speed
    velocities[i*3] += (flow.x * flowSpeed - velocities[i*3]) * 0.06;
    velocities[i*3+1] += (flow.y * flowSpeed - velocities[i*3+1]) * 0.06;

    // Slight radial pull toward orbit radius (keeps particles on circular tracks)
    const di = domainIdx[i];
    const d = domains[di];
    const dx = px - d.cx;
    const dy = py - d.cy;
    const dist = Math.sqrt(dx*dx + dy*dy) + 0.001;
    const targetR = orbitRadius[i] * breathScale;
    const radialPull = (targetR - dist) * 0.003 * morphProgress;
    velocities[i*3] += (dx / dist) * radialPull;
    velocities[i*3+1] += (dy / dist) * radialPull;

    positions[i*3] += velocities[i*3] * dt * 60;
    positions[i*3+1] += velocities[i*3+1] * dt * 60;

    // Domain containment
    let inAnyDomain = false;
    for (const dd of domains){
      const ddx = positions[i*3] - dd.cx;
      const ddy = positions[i*3+1] - dd.cy;
      if (ddx*ddx + ddy*ddy < dd.r * dd.r * 1.5){
        inAnyDomain = true;
        break;
      }
    }

    if (!inAnyDomain){
      // Return to home domain at orbital radius
      const angle = Math.random() * Math.PI * 2;
      const rad = orbitRadius[i] * 0.8;
      positions[i*3] = d.cx + Math.cos(angle) * rad;
      positions[i*3+1] = d.cy + Math.sin(angle) * rad;
      velocities[i*3] = 0;
      velocities[i*3+1] = 0;
    }

    ages[i] += dt;
  }

  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;
}

// Camera: gently track centroid of all domains
function updateCamera(t){
  const breath = Math.sin(t * 0.4);
  const gcx = domains.reduce((s, d) => s + d.cx, 0) / domains.length;
  const gcy = domains.reduce((s, d) => s + d.cy, 0) / domains.length;

  // Smooth camera drift toward centroid
  camera.position.x += (gcx * 0.3 - camera.position.x) * 0.01;
  camera.position.y += (gcy * 0.3 - camera.position.y) * 0.01;
  camera.lookAt(camera.position.x, camera.position.y, 0);

  // Subtle zoom breath
  const baseH = 50;
  const zoomBreath = baseH * (1 - breath * 0.03 * morphProgress);
  const aspect = innerWidth / innerHeight;
  const w = zoomBreath * aspect;
  camera.left = camera.position.x - w / 2;
  camera.right = camera.position.x + w / 2;
  camera.top = camera.position.y + zoomBreath / 2;
  camera.bottom = camera.position.y - zoomBreath / 2;
  camera.updateProjectionMatrix();
}

let lastTime = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;

  uniforms.uTime.value = t;
  uniforms.uBreath.value = Math.sin(t * 0.4) * 0.5 + 0.5;

  updateParticles(dt, t);
  updateCamera(t);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

(function(){

  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});

    var txt=document.getElementById('pc-input').value.trim();

    var btn=this;btn.textContent='…';btn.disabled=true;

    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})

      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
