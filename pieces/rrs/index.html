<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rrs · differential growth (disrupted weave)</title>
<!-- MOTION: growth, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#070a09; overflow:hidden;
               color:#dde6d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">rrs</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">disrupted-grid morphogenesis · pulled-thread weave</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a09, 0.032);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 9, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a09, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// --- DISRUPTION ZONES ---
// These are the "pulled threads" — deliberate breaks in the weave.
// Zone A: void (upper-left quadrant) — growth repelled, no particles
// Zone B: void (lower-right, smaller) — a puncture
// Zone C: density spike (off-center right) — knot of intensity
// Zone D: broken edge band — particles scatter wide, frayed selvage
const disruptions = [
  { x: -2.8, z: -2.1, r: 1.6, type: 'void' },      // A: large absence
  { x:  2.3, z:  2.7, r: 0.9, type: 'void' },      // B: small puncture
  { x:  3.1, z: -0.8, r: 1.2, type: 'dense' },     // C: density knot
  { x: -1.0, z:  3.4, r: 1.4, type: 'fray' },      // D: broken edge
];

function inDisruption(x, z) {
  for (const d of disruptions) {
    const dx = x - d.x, dz = z - d.z;
    const dist2 = dx*dx + dz*dz;
    if (dist2 < d.r * d.r) return { ...d, dist: Math.sqrt(dist2) };
  }
  return null;
}

// --- CURVE STATE ---
const MAX_VERTS = 4500;
const ATTRACT   = 0.06;
const REPEL_R   = 0.42;
const REPEL_STR = 0.12;
const NOISE     = 0.003;
const PRESSURE  = 0.0035;
const MAX_D     = 0.32;

const verts = [];
const NV0 = 24;
for (let i = 0; i < NV0; i++){
  const th = i / NV0 * Math.PI * 2;
  const r  = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, z: Math.sin(th) * r, y: 0, age: 0 });
}

// spatial hash
const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z){ return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const arr = grid.get((cx+dx) + ',' + (cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);

  // repulsion
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex*ex + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }

  // attraction
  for (let i = 0; i < n; i++){
    const a = verts[(i - 1 + n) % n];
    const b = verts[(i + 1) % n];
    const v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }

  // pressure
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  // DISRUPTION FORCES — void zones repel growth, dense zones attract
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const zone of disruptions){
      const ex = v.x - zone.x, ez = v.z - zone.z;
      const dist = Math.hypot(ex, ez) + 1e-6;
      if (zone.type === 'void' && dist < zone.r * 1.3){
        // strong repulsion from void center — curve bends around it
        const push = 0.04 * Math.max(0, 1 - dist / (zone.r * 1.3));
        dx[i] += (ex / dist) * push;
        dz[i] += (ez / dist) * push;
      }
      if (zone.type === 'dense' && dist < zone.r * 1.5){
        // slight attraction — curve wants to tangle here
        const pull = 0.008 * Math.max(0, 1 - dist / (zone.r * 1.5));
        dx[i] -= (ex / dist) * pull;
        dz[i] -= (ez / dist) * pull;
      }
    }
  }

  // apply + brownian
  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0006;
    verts[i].y = -Math.min(verts[i].age * 0.6, 1.4);
  }

  // subdivide
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex*ex + ez*ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS){
      // suppress subdivision inside void zones — keep them empty
      const mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
      const zone = inDisruption(mx, mz);
      if (!zone || zone.type !== 'void'){
        grown.push({ x: mx, z: mz,
                     y: (a.y + b.y) * 0.5, age: Math.max(a.age, b.age) * 0.85 });
      }
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- RENDERING ---
const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
const rZoneType  = new Float32Array(N_RENDER); // 0=normal, 1=dense, 2=fray
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('zoneType', new THREE.BufferAttribute(rZoneType, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    attribute float zoneType;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      p += 0.005 * vec3(sin(t), 0.0, cos(t));

      // base palette: algae → coral → bone
      vec3 colA = vec3(0.50, 0.90, 0.62); // young algae
      vec3 colB = vec3(0.95, 0.42, 0.38); // mature coral
      vec3 colC = vec3(0.92, 0.88, 0.78); // bone
      float k = clamp(age * 0.8, 0.0, 1.0);
      vCol = mix(colA, colB, k);
      vCol = mix(vCol, colC, smoothstep(0.85, 1.0, k) * 0.4);

      vAlpha = 0.65;

      // dense zone: warmer, brighter — the knot glows
      if (zoneType > 0.5 && zoneType < 1.5){
        vCol = mix(vCol, vec3(1.0, 0.55, 0.25), 0.45);
        vAlpha = 0.85;
      }
      // fray zone: desaturated, scattered — pulled thread
      if (zoneType > 1.5){
        vCol = mix(vCol, vec3(0.75, 0.72, 0.68), 0.5);
        vAlpha = 0.35;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // dense zone particles slightly larger
      float sz = 1.4;
      if (zoneType > 0.5 && zoneType < 1.5) sz = 1.9;
      if (zoneType > 1.5) sz = 1.1;

      gl_PointSize = sz * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// --- DUST MOTES --- atmospheric texture, sparse
const dustCount = 800;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustCount * 3);
const dustSeed = new Float32Array(dustCount);
for (let i = 0; i < dustCount; i++){
  dustPos[i*3]   = (Math.random() - 0.5) * 20;
  dustPos[i*3+1] = (Math.random() - 0.5) * 6 - 0.5;
  dustPos[i*3+2] = (Math.random() - 0.5) * 20;
  dustSeed[i] = Math.random();
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      float t = uTime * 0.15 + seed * 40.0;
      p.y += sin(t) * 0.3;
      p.x += cos(t * 0.7) * 0.15;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * (12.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vA = 0.08 + 0.04 * sin(seed * 20.0 + uTime);
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vA;
      gl_FragColor = vec4(vec3(0.7, 0.75, 0.65) * a, a);
    }
  `
});
scene.add(new THREE.Points(dustGeo, dustMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow 600 steps
for (let s = 0; s < 600; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 4; s++) step();

  // distribute particles along polyline with disruption awareness
  const n = verts.length;
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    const L = Math.sqrt(ex*ex + ez*ez + ey*ey);
    lengths.push(L); total += L;
  }
  if (total > 0){
    let written = 0;
    for (let i = 0; i < n; i++){
      const share = (i === n - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[(i + 1) % n];
      const midX = (a.x + b.x) * 0.5, midZ = (a.z + b.z) * 0.5;
      const zone = inDisruption(midX, midZ);

      for (let k = 0; k < share && written < N_RENDER; k++){
        const u = Math.random();
        let px = a.x + (b.x - a.x) * u;
        let py = a.y + (b.y - a.y) * u;
        let pz = a.z + (b.z - a.z) * u;

        let zt = 0; // zone type for shader

        if (zone) {
          if (zone.type === 'void'){
            // skip ~70% of particles in void zones — sparse emptiness
            if (Math.random() < 0.7) {
              rPositions[written*3]   = px + (Math.random()-0.5) * 0.02;
              rPositions[written*3+1] = -10; // hide off-screen
              rPositions[written*3+2] = pz;
              rAge[written] = 0;
              rZoneType[written] = 0;
              written++;
              continue;
            }
          } else if (zone.type === 'dense'){
            // density spike: tighter particle jitter, more particles on this segment
            px += (Math.random()-0.5) * 0.008;
            pz += (Math.random()-0.5) * 0.008;
            zt = 1;
          } else if (zone.type === 'fray'){
            // broken edge: scatter particles wide — pulled-thread effect
            const scatter = 0.15 + 0.25 * (1 - zone.dist / zone.r);
            px += (Math.random()-0.5) * scatter;
            pz += (Math.random()-0.5) * scatter;
            py += (Math.random()-0.5) * scatter * 0.4;
            zt = 2;
          }
        } else {
          px += (Math.random()-0.5) * 0.02;
          pz += (Math.random()-0.5) * 0.02;
        }

        rPositions[written*3]   = px;
        rPositions[written*3+1] = py;
        rPositions[written*3+2] = pz;
        rAge[written] = Math.max(a.age, b.age);
        rZoneType[written] = zt;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.zoneType.needsUpdate = true;
  }

  // camera tracks centroid with slight offset for asymmetry
  let cx = 0, cz = 0, cy = 0;
  for (let i = 0; i < n; i++){
    cx += verts[i].x; cz += verts[i].z; cy += verts[i].y;
  }
  cx /= n; cz /= n; cy /= n;
  controls.target.lerp(new THREE.Vector3(cx + 0.3, cy * 0.5, cz - 0.2), 0.02);

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
