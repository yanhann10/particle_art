<body>
<div class="id">5rs · the form that withdraws</div>
<div class="hint">graham harman / ooo — the object refuses full capture</div>
<div class="src">descended from sav · boids + withdrawal zones · variable fog</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Graham Harman: objects WITHDRAW from full apprehension. No single perspective
// captures the thing-in-itself. Here: the flock coalesces into a recognizable
// STANDING FIGURE (humanoid statue, arms at sides, head tilted), but:
//   - 4 'shy zones' where particles fade when camera approaches that azimuth
//   - variable fog density per sector — thick curtains block certain angles
//   - depth-clipping — some particles exceed near-plane and reappear rotated
//   - the viewer orbits but never sees all faces at once; something always hides
// The narrative: the flock IS a person, but the person refuses to be seen whole.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0e, 0.032);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.8, 140);
camera.position.set(0, 2, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── figure skeleton
// standing humanoid: head(0,3.2,0), torso(0,1.2,0), pelvis(0,0,0),
// shoulders(±0.8,2.4,0), elbows(±1.2,1.2,0), hands(±1.4,0.2,0),
// knees(±0.3,-1.6,0), feet(±0.35,-2.8,0)
const skeleton = [
  {x:0, y:3.2, z:0, r:0.5, name:'head'},
  {x:0, y:2.5, z:0, r:0.35, name:'neck'},
  {x:0, y:1.8, z:0, r:0.42, name:'chest'},
  {x:0, y:1.0, z:0, r:0.40, name:'abdomen'},
  {x:0, y:0.2, z:0, r:0.38, name:'pelvis'},
  {x:-0.8, y:2.4, z:0, r:0.20, name:'lshoulder'},
  {x:0.8, y:2.4, z:0, r:0.20, name:'rshoulder'},
  {x:-1.2, y:1.2, z:0, r:0.18, name:'lelbow'},
  {x:1.2, y:1.2, z:0, r:0.18, name:'relbow'},
  {x:-1.4, y:0.2, z:0, r:0.16, name:'lhand'},
  {x:1.4, y:0.2, z:0, r:0.16, name:'rhand'},
  {x:-0.3, y:-1.0, z:0, r:0.25, name:'lhip'},
  {x:0.3, y:-1.0, z:0, r:0.25, name:'rhip'},
  {x:-0.3, y:-1.8, z:0, r:0.22, name:'lknee'},
  {x:0.3, y:-1.8, z:0, r:0.22, name:'rknee'},
  {x:-0.35, y:-2.8, z:0, r:0.18, name:'lfoot'},
  {x:0.35, y:-2.8, z:0, r:0.18, name:'rfoot'}
];

// shy zones — azimuths where particles fade when camera nears
// each zone: {angle (radians), span (radians), density (0..1)}
const shyZones = [
  {angle: 0.3, span: 0.9, density: 0.85},      // front-right face
  {angle: 2.4, span: 1.1, density: 0.70},      // back-left shoulder
  {angle: 4.8, span: 0.8, density: 0.90},      // right profile
  {angle: -2.2, span: 1.0, density: 0.75}      // left side
];

// distribute particles per joint cluster
const N = 620;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const jointAffiliation = new Uint8Array(N);
const seedArr = new Float32Array(N);
let idx = 0;
for (let j = 0; j < skeleton.length; j++){
  const jnt = skeleton[j];
  const count = Math.floor(jnt.r * 65);
  for (let c = 0; c < count && idx < N; c++, idx++){
    const th = Math.random() * Math.PI * 2;
    const ph = Math.random() * Math.PI - Math.PI * 0.5;
    const rad = Math.random() * jnt.r * 0.85;
    pos[idx*3]     = jnt.x + Math.cos(th) * Math.cos(ph) * rad;
    pos[idx*3 + 1] = jnt.y + Math.sin(ph) * rad;
    pos[idx*3 + 2] = jnt.z + Math.sin(th) * Math.cos(ph) * rad;
    vel[idx*3]     = (Math.random() - 0.5) * 0.06;
    vel[idx*3 + 1] = (Math.random() - 0.5) * 0.06;
    vel[idx*3 + 2] = (Math.random() - 0.5) * 0.06;
    jointAffiliation[idx] = j;
    seedArr[idx] = Math.random();
  }
}
// fill remainder with ambient drift
for (; idx < N; idx++){
  pos[idx*3]     = (Math.random() - 0.5) * 3.5;
  pos[idx*3 + 1] = Math.random() * 5 - 2.5;
  pos[idx*3 + 2] = (Math.random() - 0.5) * 2.0;
  vel[idx*3]     = (Math.random() - 0.5) * 0.08;
  vel[idx*3 + 1] = (Math.random() - 0.5) * 0.08;
  vel[idx*3 + 2] = (Math.random() - 0.5) * 0.08;
  jointAffiliation[idx] = 255;
  seedArr[idx] = Math.random();
}

// boid cohesion toward assigned joint
const RETURN_STRENGTH = 0.008;
const DAMPING = 0.92;
function step(dt){
  for (let i = 0; i < N; i++){
    const jid = jointAffiliation[i];
    if (jid < skeleton.length){
      const jnt = skeleton[jid];
      const dx = jnt.x - pos[i*3];
      const dy = jnt.y - pos[i*3+1];
      const dz = jnt.z - pos[i*3+2];
      vel[i*3]     += dx * RETURN_STRENGTH;
      vel[i*3 + 1] += dy * RETURN_STRENGTH;
      vel[i*3 + 2] += dz * RETURN_STRENGTH;
    }
    vel[i*3]     *= DAMPING;
    vel[i*3 + 1] *= DAMPING;
    vel[i*3 + 2] *= DAMPING;
    pos[i*3]     += vel[i*3];
    pos[i*3 + 1] += vel[i*3 + 1];
    pos[i*3 + 2] += vel[i*3 + 2];
  }
}

// ────────────── render with shy-zone occlusion
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seedArr, 1));

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uCamAzimuth:{ value: 0 },
  // shy zone data (angle, span, density) × 4
  uShyAngles: { value: shyZones.map(z => z.angle) },
  uShySpans:  { value: shyZones.map(z => z.span) },
  uShyDens:   { value: shyZones.map(z => z.density) }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCamAzimuth;
    uniform float uShyAngles[4];
    uniform float uShySpans[4];
    uniform float uShyDens[4];
    attribute float seed;
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // compute azimuth of this particle
      float pAz = atan(p.x, p.z);
      // check shy zones — fade if camera azimuth near zone
      float shy = 1.0;
      for (int i = 0; i < 4; i++){
        float dAng = abs(uCamAzimuth - uShyAngles[i]);
        if (dAng > 3.14159) dAng = 6.28318 - dAng;
        if (dAng < uShySpans[i]){
          float fade = smoothstep(uShySpans[i], 0.0, dAng);
          shy = min(shy, 1.0 - fade * uShyDens[i]);
        }
      }
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // depth clipping near 0.8 — particles beyond near-plane wrap around
      if (dist < 0.8){
        mv.z = -120.0 + mod(dist + 120.0, 40.0);
        dist = -mv.z;
      }
      float baseSize = 1.2 + 0.4 * sin(uTime * 0.6 + seed * 6.28);
      gl_PointSize = baseSize * uPixel * (14.0 / dist);
      // fog + shy occlusion
      float fogFade = clamp(1.0 - (dist - 16.0) / 90.0, 0.0, 1.0);
      vAlpha = fogFade * shy;
      // palette: muted stone-gray + warm ochre accent for torso
      vec3 stone = vec3(0.65, 0.66, 0.68);
      vec3 ochre = vec3(0.78, 0.62, 0.42);
      float accent = smoothstep(0.4, 2.2, p.y) * smoothstep(2.6, 2.0, p.y);
      vCol = mix(stone, ochre, accent * 0.35);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a * 0.85, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// variable-density fog planes per shy zone
const fogPlanes = [];
for (let i = 0; i < shyZones.length; i++){
  const z = shyZones[i];
  const planeGeom = new THREE.PlaneGeometry(8, 8, 1, 1);
  const planeMat = new THREE.MeshBasicMaterial({
    color: 0x0a0a0e,
    transparent: true,
    opacity: z.density * 0.18,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const plane = new THREE.Mesh(planeGeom, planeMat);
  const rad = 10;
  plane.position.set(Math.sin(z.angle) * rad, 0.2, Math.cos(z.angle) * rad);
  plane.lookAt(0, 0.2, 0);
  scene.add(plane);
  fogPlanes.push({ mesh: plane, zone: z });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 180; s++) step(0.04);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = (now / 1000);
  step(dt);
  geom.attributes.position.needsUpdate = true;

  // slow orbit with slight figure-8 vertical drift
  const ang = now * 0.000085;
  const rad = 18;
  camera.position.x = Math.sin(ang) * rad;
  camera.position.z = Math.cos(ang) * rad;
  camera.position.y = 2 + Math.sin(ang * 1.7) * 1.2;
  camera.lookAt(0, 0.4, 0);
  uniforms.uCamAzimuth.value = Math.atan2(camera.position.x, camera.position.z);

  // pulse fog planes with camera approach
  for (const fp of fogPlanes){
    const dAng = Math.abs(uniforms.uCamAzimuth.value - fp.zone.angle);
    const proxFade = Math.max(0, 1.0 - Math.min(dAng, 6.28 - dAng) / fp.zone.span);
    fp.mesh.material.opacity = fp.zone.density * 0.18 * (0.5 + proxFade * 0.5);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
