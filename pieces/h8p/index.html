<title>h8p · erasure sky · infrastructure dissolving to commons</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e18; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">h8p</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Amelia Winger-Bearskin · I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY
// Two-layer particle landscape: orthogonal infrastructure (roads, power grids,
// sodium-orange light pollution) that progressively ERASES itself revealing
// the celestial commons beneath — a deep field of stars drifting slowly as
// the Indigenous sky reclaims the frame. The erasure is the art.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 18, 40);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e18, 1);
document.body.appendChild(renderer.domElement);

// ─────────── BUILT LAYER — orthogonal grid infrastructure
// Roads, power lines, fences — all drawn as orthogonal particle clusters
// with sodium-orange light pollution. These will FADE and SCATTER over time.
const BUILT_COUNT = 18000;
const builtPos = new Float32Array(BUILT_COUNT * 3);
const builtColor = new Float32Array(BUILT_COUNT * 3);
const builtOpacity = new Float32Array(BUILT_COUNT); // per-particle alpha
const builtVel = new Float32Array(BUILT_COUNT * 3); // erosion drift

// Sodium-orange infrastructure palette
const infraColors = [
  new THREE.Color(0xffb347), // sodium orange
  new THREE.Color(0xff8c1a), // amber
  new THREE.Color(0xffd699), // light pollution glow
  new THREE.Color(0x8c5c2e), // rust fence
];

// Generate orthogonal infrastructure patterns
for (let i = 0; i < BUILT_COUNT; i++){
  const pattern = Math.random();
  let x, y, z;
  
  if (pattern < 0.35){ // horizontal roads (parallel lines)
    const lane = Math.floor(Math.random() * 8) - 4;
    x = (Math.random() - 0.5) * 120;
    y = 0.1 + Math.random() * 0.4;
    z = lane * 12 + (Math.random() - 0.5) * 3;
  } else if (pattern < 0.60){ // vertical roads (perpendicular)
    const lane = Math.floor(Math.random() * 10) - 5;
    x = lane * 11 + (Math.random() - 0.5) * 2.5;
    y = 0.1 + Math.random() * 0.4;
    z = (Math.random() - 0.5) * 100;
  } else if (pattern < 0.80){ // power line towers (vertical clusters)
    const towerX = Math.floor(Math.random() * 8 - 4) * 18;
    const towerZ = Math.floor(Math.random() * 6 - 3) * 20;
    x = towerX + (Math.random() - 0.5) * 2;
    y = Math.random() * 14 + 2;
    z = towerZ + (Math.random() - 0.5) * 2;
  } else { // fence scatter (low horizontal)
    x = (Math.random() - 0.5) * 100;
    y = 0.8 + Math.random() * 1.2;
    z = (Math.random() - 0.5) * 80;
  }

  builtPos[i*3]   = x;
  builtPos[i*3+1] = y;
  builtPos[i*3+2] = z;

  const c = infraColors[Math.floor(Math.random() * infraColors.length)];
  builtColor[i*3]   = c.r;
  builtColor[i*3+1] = c.g;
  builtColor[i*3+2] = c.b;

  builtOpacity[i] = 0.75 + Math.random() * 0.25;

  // Erosion velocity — upward and outward drift when erasure begins
  builtVel[i*3]   = (Math.random() - 0.5) * 0.008;
  builtVel[i*3+1] = Math.random() * 0.012 + 0.006; // upward bias
  builtVel[i*3+2] = (Math.random() - 0.5) * 0.008;
}

const builtGeo = new THREE.BufferGeometry();
builtGeo.setAttribute('position', new THREE.BufferAttribute(builtPos, 3));
builtGeo.setAttribute('color', new THREE.BufferAttribute(builtColor, 3));
builtGeo.setAttribute('opacity', new THREE.BufferAttribute(builtOpacity, 1));

const builtMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  vertexShader: `
    attribute float opacity;
    varying vec3 vColor;
    varying float vOpacity;
    void main(){
      vColor = color;
      vOpacity = opacity;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 2.8 * (120.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vOpacity;
    void main(){
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float alpha = (1.0 - r*2.0) * vOpacity;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const builtPoints = new THREE.Points(builtGeo, builtMat);
scene.add(builtPoints);

// ─────────── SKY LAYER — celestial commons
// Deep starfield particles that drift slowly — the Indigenous sky that was
// always there, now visible as the built layer erases.
const SKY_COUNT = 24000;
const skyPos = new Float32Array(SKY_COUNT * 3);
const skyColor = new Float32Array(SKY_COUNT * 3);
const skySize = new Float32Array(SKY_COUNT);
const skyVel = new Float32Array(SKY_COUNT * 3);

// Cobalt night + starfield white palette
const skyColors = [
  new THREE.Color(0x1a2947), // deep cobalt
  new THREE.Color(0x2d4a73), // lighter cobalt
  new THREE.Color(0xe8f0ff), // starfield white
  new THREE.Color(0xa8c8ff), // cool white
  new THREE.Color(0x0d1a2e), // midnight
];

for (let i = 0; i < SKY_COUNT; i++){
  // Spherical distribution — sky surrounds the viewer
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  const r = 80 + Math.random() * 180;

  skyPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  skyPos[i*3+1] = r * Math.cos(phi) * 0.6 + 30; // bias upward
  skyPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

  const c = skyColors[Math.floor(Math.random() * skyColors.length)];
  skyColor[i*3]   = c.r;
  skyColor[i*3+1] = c.g;
  skyColor[i*3+2] = c.b;

  skySize[i] = 1.2 + Math.random() * 2.8;

  // Slow celestial drift
  skyVel[i*3]   = (Math.random() - 0.5) * 0.002;
  skyVel[i*3+1] = (Math.random() - 0.5) * 0.001;
  skyVel[i*3+2] = (Math.random() - 0.5) * 0.002;
}

const skyGeo = new THREE.BufferGeometry();
skyGeo.setAttribute('position', new THREE.BufferAttribute(skyPos, 3));
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColor, 3));
skyGeo.setAttribute('size', new THREE.BufferAttribute(skySize, 1));

const skyMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (150.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float alpha = (1.0 - r*2.0) * 0.7;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const skyPoints = new THREE.Points(skyGeo, skyMat);
scene.add(skyPoints);

// ─────────── ERASURE TIMELINE
// Phase 1 (0-20s): infrastructure visible, sky faint
// Phase 2 (20-80s): infrastructure fades and scatters upward, sky brightens
// Phase 3 (80s+): only sky remains — the commons reclaimed

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Erosion phase calculation
  const PHASE1_END = 20;
  const PHASE2_END = 80;
  let erasureFactor = 0;
  
  if (t > PHASE1_END){
    erasureFactor = Math.min(1.0, (t - PHASE1_END) / (PHASE2_END - PHASE1_END));
  }

  // Update built layer — fade and scatter
  for (let i = 0; i < BUILT_COUNT; i++){
    if (erasureFactor > 0){
      builtPos[i*3]   += builtVel[i*3] * erasureFactor;
      builtPos[i*3+1] += builtVel[i*3+1] * erasureFactor;
      builtPos[i*3+2] += builtVel[i*3+2] * erasureFactor;
      
      // Fade out as it rises
      builtOpacity[i] *= 0.998;
    }
  }
  builtGeo.attributes.position.needsUpdate = true;
  builtGeo.attributes.opacity.needsUpdate = true;

  // Update sky layer — slow celestial drift
  for (let i = 0; i < SKY_COUNT; i++){
    skyPos[i*3]   += skyVel[i*3];
    skyPos[i*3+1] += skyVel[i*3+1];
    skyPos[i*3+2] += skyVel[i*3+2];
  }
  skyGeo.attributes.position.needsUpdate = true;

  // Sky layer visibility — starts faint, becomes dominant
  const skyOpacity = 0.3 + erasureFactor * 0.7;
  skyMat.opacity = skyOpacity;

  // Camera slow drift — looking up as infrastructure erases
  camera.position.y += 0.008;
  camera.lookAt(0, camera.position.y * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
