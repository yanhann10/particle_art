<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h8p · erasure sky · infrastructure dissolving to commons</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e18; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">h8p</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Amelia Winger-Bearskin · I WOULD LIKE TO BE MIDNIGHT / I WOULD LIKE TO BE SKY
// Two-layer particle landscape: orthogonal infrastructure (roads, power grids,
// sodium-orange light pollution) that progressively ERASES itself revealing
// the celestial commons beneath — a deep field of stars drifting slowly as
// the Indigenous sky reclaims the frame. The erasure is the art.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 18, 40);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e18, 1);
document.body.appendChild(renderer.domElement);

// ─────────── BUILT LAYER — orthogonal grid infrastructure
// Roads, power lines, fences — all drawn as orthogonal particle clusters
// with sodium-orange light pollution. These will FADE and SCATTER over time.
const BUILT_COUNT = 18000;
const builtPos = new Float32Array(BUILT_COUNT * 3);
const builtColor = new Float32Array(BUILT_COUNT * 3);
const builtOpacity = new Float32Array(BUILT_COUNT); // per-particle alpha
const builtVel = new Float32Array(BUILT_COUNT * 3); // erosion drift

// Sodium-orange infrastructure palette
const infraColors = [
  new THREE.Color(0xffb347), // sodium orange
  new THREE.Color(0xff8c1a), // amber
  new THREE.Color(0xffd699), // light pollution glow
  new THREE.Color(0x8c5c2e), // rust fence
];

// Generate orthogonal infrastructure patterns
for (let i = 0; i < BUILT_COUNT; i++){
  const pattern = Math.random();
  let x, y, z;
  
  if (pattern < 0.35){ // horizontal roads (parallel lines)
    const lane = Math.floor(Math.random() * 8) - 4;
    x = (Math.random() - 0.5) * 120;
    y = 0.1 + Math.random() * 0.4;
    z = lane * 12 + (Math.random() - 0.5) * 3;
  } else if (pattern < 0.60){ // vertical roads (perpendicular)
    const lane = Math.floor(Math.random() * 10) - 5;
    x = lane * 11 + (Math.random() - 0.5) * 2.5;
    y = 0.1 + Math.random() * 0.4;
    z = (Math.random() - 0.5) * 100;
  } else if (pattern < 0.80){ // power line towers (vertical clusters)
    const towerX = Math.floor(Math.random() * 8 - 4) * 18;
    const towerZ = Math.floor(Math.random() * 6 - 3) * 20;
    x = towerX + (Math.random() - 0.5) * 2;
    y = Math.random() * 14 + 2;
    z = towerZ + (Math.random() - 0.5) * 2;
  } else { // fence scatter (low horizontal)
    x = (Math.random() - 0.5) * 100;
    y = 0.8 + Math.random() * 1.2;
    z = (Math.random() - 0.5) * 80;
  }

  builtPos[i*3]   = x;
  builtPos[i*3+1] = y;
  builtPos[i*3+2] = z;

  const c = infraColors[Math.floor(Math.random() * infraColors.length)];
  builtColor[i*3]   = c.r;
  builtColor[i*3+1] = c.g;
  builtColor[i*3+2] = c.b;

  builtOpacity[i] = 0.75 + Math.random() * 0.25;

  // Erosion velocity — upward and outward drift when erasure begins
  builtVel[i*3]   = (Math.random() - 0.5) * 0.008;
  builtVel[i*3+1] = Math.random() * 0.012 + 0.006; // upward bias
  builtVel[i*3+2] = (Math.random() - 0.5) * 0.008;
}

const builtGeo = new THREE.BufferGeometry();
builtGeo.setAttribute('position', new THREE.BufferAttribute(builtPos, 3));
builtGeo.setAttribute('color', new THREE.BufferAttribute(builtColor, 3));
builtGeo.setAttribute('opacity', new THREE.BufferAttribute(builtOpacity, 1));

const builtMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  vertexShader: `
    attribute float opacity;
    varying vec3 vColor;
    varying float vOpacity;
    void main(){
      vColor = color;
      vOpacity = opacity;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 2.8 * (120.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vOpacity;
    void main(){
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float alpha = (1.0 - r*2.0) * vOpacity;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const builtPoints = new THREE.Points(builtGeo, builtMat);
scene.add(builtPoints);

// ─────────── SKY LAYER — celestial commons
// Deep starfield particles that drift slowly — the Indigenous sky that was
// always there, now visible as the built layer erases.
const SKY_COUNT = 24000;
const skyPos = new Float32Array(SKY_COUNT * 3);
const skyColor = new Float32Array(SKY_COUNT * 3);
const skySize = new Float32Array(SKY_COUNT);
const skyVel = new Float32Array(SKY_COUNT * 3);

// Cobalt night + starfield white palette
const skyColors = [
  new THREE.Color(0x1a2947), // deep cobalt
  new THREE.Color(0x2d4a73), // lighter cobalt
  new THREE.Color(0xe8f0ff), // starfield white
  new THREE.Color(0xa8c8ff), // cool white
  new THREE.Color(0x0d1a2e), // midnight
];

for (let i = 0; i < SKY_COUNT; i++){
  // Spherical distribution — sky surrounds the viewer
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  const r = 80 + Math.random() * 180;

  skyPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  skyPos[i*3+1] = r * Math.cos(phi) * 0.6 + 30; // bias upward
  skyPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);

  const c = skyColors[Math.floor(Math.random() * skyColors.length)];
  skyColor[i*3]   = c.r;
  skyColor[i*3+1] = c.g;
  skyColor[i*3+2] = c.b;

  skySize[i] = 1.2 + Math.random() * 2.8;

  // Slow celestial drift
  skyVel[i*3]   = (Math.random() - 0.5) * 0.002;
  skyVel[i*3+1] = (Math.random() - 0.5) * 0.001;
  skyVel[i*3+2] = (Math.random() - 0.5) * 0.002;
}

const skyGeo = new THREE.BufferGeometry();
skyGeo.setAttribute('position', new THREE.BufferAttribute(skyPos, 3));
skyGeo.setAttribute('color', new THREE.BufferAttribute(skyColor, 3));
skyGeo.setAttribute('size', new THREE.BufferAttribute(skySize, 1));

const skyMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (150.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float alpha = (1.0 - r*2.0) * 0.7;
      gl_FragColor = vec4(vColor, alpha);
    }
  `
});

const skyPoints = new THREE.Points(skyGeo, skyMat);
scene.add(skyPoints);

// ─────────── ERASURE TIMELINE
// Phase 1 (0-20s): infrastructure visible, sky faint
// Phase 2 (20-80s): infrastructure fades and scatters upward, sky brightens
// Phase 3 (80s+): only sky remains — the commons reclaimed

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Erosion phase calculation
  const PHASE1_END = 20;
  const PHASE2_END = 80;
  let erasureFactor = 0;
  
  if (t > PHASE1_END){
    erasureFactor = Math.min(1.0, (t - PHASE1_END) / (PHASE2_END - PHASE1_END));
  }

  // Update built layer — fade and scatter
  for (let i = 0; i < BUILT_COUNT; i++){
    if (erasureFactor > 0){
      builtPos[i*3]   += builtVel[i*3] * erasureFactor;
      builtPos[i*3+1] += builtVel[i*3+1] * erasureFactor;
      builtPos[i*3+2] += builtVel[i*3+2] * erasureFactor;
      
      // Fade out as it rises
      builtOpacity[i] *= 0.998;
    }
  }
  builtGeo.attributes.position.needsUpdate = true;
  builtGeo.attributes.opacity.needsUpdate = true;

  // Update sky layer — slow celestial drift
  for (let i = 0; i < SKY_COUNT; i++){
    skyPos[i*3]   += skyVel[i*3];
    skyPos[i*3+1] += skyVel[i*3+1];
    skyPos[i*3+2] += skyVel[i*3+2];
  }
  skyGeo.attributes.position.needsUpdate = true;

  // Sky layer visibility — starts faint, becomes dominant
  const skyOpacity = 0.3 + erasureFactor * 0.7;
  skyMat.opacity = skyOpacity;

  // Camera slow drift — looking up as infrastructure erases
  camera.position.y += 0.008;
  camera.lookAt(0, camera.position.y * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
