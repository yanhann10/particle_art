<!-- MOTION: uncoil, intensity: gentle -->
<style>

canvas { display:block; }

.hash { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#8a9db3; opacity:0.45; font-size:9px; letter-spacing:0.08em; z-index:5; }
</style>

<div class="id">8vz</div>
<div class="hash"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const canvas = document.createElement('canvas');
canvas.width = 2; canvas.height = 512;
const ctx = canvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#0a1628');
grad.addColorStop(0.4, '#152844');
grad.addColorStop(0.75, '#1f3a5f');
grad.addColorStop(1, '#2a4f7a');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
scene.background = new THREE.CanvasTexture(canvas);
scene.fog = new THREE.FogExp2(0x0a1628, 0.016);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 12, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a2f4a, 0.4));
const keyLight = new THREE.DirectionalLight(0x2563a8, 1.2);
keyLight.position.set(-8, 16, 12);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x4a7fbb, 0.6);
fillLight.position.set(6, 8, -5);
scene.add(fillLight);

// ── Hash + RNG
function generateHash(){
  let h=''; const chars='0123456789abcdef';
  for(let i=0;i<64;i++) h+=chars[Math.floor(Math.random()*16)];
  return h;
}
let HASH = generateHash();
document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';

let rngState=0;
for(let i=0;i<8;i++) rngState ^= parseInt(HASH.substring(i*8,i*8+8),16);
rngState = rngState >>> 0;
function rng(){
  rngState|=0; rngState=rngState+0x6d2b79f5|0;
  let t=Math.imul(rngState^rngState>>>15,1|rngState);
  t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;
}

// ── Uncoil timing
const CYCLE = 24.0;       // seconds per full cycle
const UNCOIL_START = 0.35; // fraction of cycle where uncoil begins
const UNCOIL_PEAK = 0.5;   // peak extension
const RECOIL_END = 0.75;   // fully re-crystallized

function uncoilAmount(t){
  const phase = (t % CYCLE) / CYCLE;
  if(phase < UNCOIL_START) return 0;
  if(phase < UNCOIL_PEAK){
    const p = (phase - UNCOIL_START) / (UNCOIL_PEAK - UNCOIL_START);
    return smoothstep(p);
  }
  if(phase < RECOIL_END){
    const p = (phase - UNCOIL_PEAK) / (RECOIL_END - UNCOIL_PEAK);
    return 1.0 - smoothstep(p);
  }
  return 0;
}
function smoothstep(t){ return t*t*(3-2*t); }

// ── Crystal figures
const NUM_FIGURES = 3 + Math.floor(rng()*4);
const JOINTS_PER_FIGURE = 16;

class Figure {
  constructor(index){
    this.index = index;
    this.joints = [];
    this.springs = [];

    const angle = (index/NUM_FIGURES)*Math.PI*2 + rng()*0.5;
    const radius = 5 + rng()*4;
    const centerX = Math.cos(angle)*radius;
    const centerZ = Math.sin(angle)*radius;
    const centerY = 4 + rng()*3;

    this.phaseX = rng()*Math.PI*2;
    this.phaseY = rng()*Math.PI*2;
    this.phaseZ = rng()*Math.PI*2;
    this.ampX = 0.4+rng()*0.8;
    this.ampY = 0.6+rng()*1.2;
    this.ampZ = 0.4+rng()*0.8;
    this.freqX = 0.02+rng()*0.04;
    this.freqY = 0.015+rng()*0.035;
    this.freqZ = 0.025+rng()*0.03;
    this.growthPhase = rng()*Math.PI*2;
    this.growthFreq = 0.008+rng()*0.012;
    this.growthAmp = 0.3+rng()*0.5;

    // Per-figure uncoil parameters
    this.uncoilAxis = new THREE.Vector3(
      (rng()-0.5)*0.3, 1, (rng()-0.5)*0.3
    ).normalize();
    this.uncoilRadius = 2.5 + rng()*3.5;
    this.uncoilTurns = 1.5 + rng()*1.5;
    this.uncoilDelay = rng()*0.12; // slight stagger between figures

    const layers=4, nodesPerLayer=JOINTS_PER_FIGURE/layers;

    for(let layer=0;layer<layers;layer++){
      const layerT=layer/(layers-1);
      const layerY=centerY+layerT*10+(rng()-0.5)*0.4;
      const layerRadius=1.2+layerT*2.5+rng()*0.8;

      for(let n=0;n<nodesPerLayer;n++){
        const nodeAngle=(n/nodesPerLayer)*Math.PI*2+rng()*0.3;
        const x=centerX+Math.cos(nodeAngle)*layerRadius;
        const z=centerZ+Math.sin(nodeAngle)*layerRadius;
        const y=layerY+(rng()-0.5)*0.5;

        this.joints.push({
          pos: new THREE.Vector3(x,y,z),
          vel: new THREE.Vector3(),
          base: new THREE.Vector3(x,y,z),
          mass: 1.2+rng()*0.4,
          layer: layer,
          nodeIdx: n,
          // Each joint gets a unique spiral phase for the uncoil
          spiralPhase: (layer*nodesPerLayer+n)/(layers*nodesPerLayer)*Math.PI*2 + rng()*0.4
        });
      }
    }

    // Springs — within layers
    for(let layer=0;layer<layers;layer++){
      const start=layer*nodesPerLayer;
      for(let i=0;i<nodesPerLayer;i++){
        const a=start+i, b=start+((i+1)%nodesPerLayer);
        this.springs.push({
          a,b,
          restLen: this.joints[a].pos.distanceTo(this.joints[b].pos),
          stiffness: 0.12+rng()*0.08,
          damping: 0.92+rng()*0.06
        });
      }
    }
    // Between layers
    for(let layer=0;layer<layers-1;layer++){
      const startA=layer*nodesPerLayer, startB=(layer+1)*nodesPerLayer;
      for(let i=0;i<nodesPerLayer;i++){
        const a=startA+i, b=startB+i;
        this.springs.push({
          a,b,
          restLen: this.joints[a].pos.distanceTo(this.joints[b].pos),
          stiffness: 0.10+rng()*0.06,
          damping: 0.93+rng()*0.05
        });
        const bNext=startB+((i+1)%nodesPerLayer);
        this.springs.push({
          a, b:bNext,
          restLen: this.joints[a].pos.distanceTo(this.joints[bNext].pos),
          stiffness: 0.08+rng()*0.04,
          damping: 0.94
        });
      }
    }

    // Lapis color
    const cc=rng();
    if(cc<0.85){
      this.color = new THREE.Color().setHSL(0.58+rng()*0.08, 0.55+rng()*0.15, 0.3+rng()*0.2);
    } else {
      this.color = new THREE.Color().setHSL(0.12+rng()*0.05, 0.5+rng()*0.15, 0.4+rng()*0.15);
    }
    // Warm pyrite color revealed during uncoil
    this.pyriteColor = new THREE.Color().setHSL(0.1+rng()*0.06, 0.45+rng()*0.15, 0.5+rng()*0.1);
  }

  update(time, dt, uncoil){
    const growthScale = 1.0+Math.sin(time*this.growthFreq+this.growthPhase)*this.growthAmp*0.08;
    // Effective uncoil for this figure (staggered)
    const myUncoil = Math.max(0, Math.min(1,
      uncoilAmount(time - this.uncoilDelay * CYCLE)
    ));

    for(let i=0;i<this.joints.length;i++){
      const j=this.joints[i];
      const target=j.base.clone();

      // Normal crystal pressure waves
      const layerPhase=j.layer*Math.PI*0.5;
      const wx=Math.sin(time*this.freqX+this.phaseX+layerPhase)*this.ampX;
      const wy=Math.cos(time*this.freqY+this.phaseY+layerPhase*0.7)*this.ampY;
      const wz=Math.sin(time*this.freqZ+this.phaseZ+layerPhase*1.1)*this.ampZ;
      target.x+=wx*growthScale;
      target.y+=wy*growthScale;
      target.z+=wz*growthScale;

      // SURPRISE: spiral uncoil displacement
      if(myUncoil > 0.001){
        const spiralT = myUncoil;
        const spiralAngle = j.spiralPhase + spiralT * this.uncoilTurns * Math.PI * 2;
        const spiralR = spiralT * this.uncoilRadius * (0.5 + j.layer * 0.2);
        // Helix around the figure's uncoil axis
        // Build a local frame from uncoilAxis
        const up = this.uncoilAxis;
        const right = new THREE.Vector3(1,0,0);
        if(Math.abs(up.dot(right))>0.9) right.set(0,0,1);
        const tangent = new THREE.Vector3().crossVectors(up, right).normalize();
        const bitangent = new THREE.Vector3().crossVectors(up, tangent).normalize();

        target.x += (Math.cos(spiralAngle)*tangent.x + Math.sin(spiralAngle)*bitangent.x) * spiralR;
        target.y += (Math.cos(spiralAngle)*tangent.y + Math.sin(spiralAngle)*bitangent.y) * spiralR
                   + spiralT * 3.0 * (j.layer/3); // rise upward as they uncoil
        target.z += (Math.cos(spiralAngle)*tangent.z + Math.sin(spiralAngle)*bitangent.z) * spiralR;
      }

      const force=target.clone().sub(j.pos).multiplyScalar(0.15);
      j.vel.add(force.multiplyScalar(dt));
    }

    // Springs — weaken during uncoil
    const springMul = 1.0 - myUncoil*0.7; // springs soften as they uncoil
    for(let s of this.springs){
      const ja=this.joints[s.a], jb=this.joints[s.b];
      const delta=jb.pos.clone().sub(ja.pos);
      const dist=delta.length();
      if(dist<0.01) continue;
      const force=delta.normalize().multiplyScalar((dist-s.restLen)*s.stiffness*springMul);
      ja.vel.add(force.clone().multiplyScalar(dt/ja.mass));
      jb.vel.sub(force.clone().multiplyScalar(dt/jb.mass));
      ja.vel.multiplyScalar(s.damping);
      jb.vel.multiplyScalar(s.damping);
    }

    for(let j of this.joints){
      j.pos.add(j.vel.clone().multiplyScalar(dt));
      j.vel.multiplyScalar(0.94);
    }

    return myUncoil;
  }
}

const figures=[];
for(let i=0;i<NUM_FIGURES;i++) figures.push(new Figure(i));

// ── Lines
const totalLines=figures.reduce((s,f)=>s+f.springs.length,0);
const linePositions=new Float32Array(totalLines*6);
const lineColors=new Float32Array(totalLines*6);

const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePositions,3));
lineGeo.setAttribute('color',new THREE.BufferAttribute(lineColors,3));

const lineMat=new THREE.LineBasicMaterial({
  vertexColors:true, transparent:true, opacity:0.75,
  blending:THREE.AdditiveBlending, depthWrite:false, fog:true
});
const lines=new THREE.LineSegments(lineGeo,lineMat);
scene.add(lines);

// ── Joint points
const totalJoints=figures.length*JOINTS_PER_FIGURE;
const jointPositions=new Float32Array(totalJoints*3);
const jointColors=new Float32Array(totalJoints*3);
const jointGeo=new THREE.BufferGeometry();
jointGeo.setAttribute('position',new THREE.BufferAttribute(jointPositions,3));
jointGeo.setAttribute('color',new THREE.BufferAttribute(jointColors,3));

const jointMat=new THREE.PointsMaterial({
  size:0.40, vertexColors:true, transparent:true, opacity:0.85,
  blending:THREE.AdditiveBlending, depthWrite:false, fog:true
});
const points=new THREE.Points(jointGeo,jointMat);
scene.add(points);

// ── Trail particles — shed during uncoil like mineral dust
const TRAIL_COUNT = 2000;
const trailPositions = new Float32Array(TRAIL_COUNT*3);
const trailColors = new Float32Array(TRAIL_COUNT*3);
const trailAlphas = new Float32Array(TRAIL_COUNT);
const trailVelocities = [];
const trailLife = new Float32Array(TRAIL_COUNT);

for(let i=0;i<TRAIL_COUNT;i++){
  trailPositions[i*3]=0; trailPositions[i*3+1]=-100; trailPositions[i*3+2]=0;
  trailAlphas[i]=0; trailLife[i]=0;
  trailVelocities.push(new THREE.Vector3());
}
let trailHead = 0;

const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions,3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors,3));

const trailMat = new THREE.PointsMaterial({
  size: 0.18, vertexColors:true, transparent:true, opacity:0.5,
  blending:THREE.AdditiveBlending, depthWrite:false, fog:true
});
const trailPoints = new THREE.Points(trailGeo, trailMat);
scene.add(trailPoints);

// ── Floor
const floorGeo=new THREE.PlaneGeometry(120,120);
const floorMat=new THREE.MeshStandardMaterial({
  color:0x0f1a2e, roughness:0.95, metalness:0.05, transparent:true, opacity:0.35
});
const floor=new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x=-Math.PI/2; floor.position.y=-1;
scene.add(floor);

// ── Camera — fixed contemplative with subtle drift
const camBase = { x:0, y:14, z:38 };
const lookTarget = new THREE.Vector3(0, 8, 0);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

addEventListener('click',()=>{
  HASH=generateHash();
  document.querySelector('.hash').textContent=HASH.substring(0,16)+'…';
  location.reload();
});

// ── Animate
const start=performance.now();
let lastTime=start;

function loop(){
  const now=performance.now();
  const elapsed=(now-start)/1000;
  const dt=Math.min((now-lastTime)/1000, 0.033);
  lastTime=now;

  const globalUncoil = uncoilAmount(elapsed);

  // Update figures
  let figIdx=0;
  for(let fig of figures){
    const myUncoil = fig.update(elapsed, dt, globalUncoil);

    // Emit trail particles during uncoil
    if(myUncoil > 0.05 && Math.random() < myUncoil * 0.4){
      const srcJoint = fig.joints[Math.floor(Math.random()*fig.joints.length)];
      const idx = trailHead;
      trailPositions[idx*3]   = srcJoint.pos.x + (Math.random()-0.5)*0.3;
      trailPositions[idx*3+1] = srcJoint.pos.y + (Math.random()-0.5)*0.3;
      trailPositions[idx*3+2] = srcJoint.pos.z + (Math.random()-0.5)*0.3;

      // Mix lapis and pyrite for trail color
      const mixC = new THREE.Color().lerpColors(fig.color, fig.pyriteColor, 0.3+Math.random()*0.5);
      trailColors[idx*3]   = mixC.r*1.2;
      trailColors[idx*3+1] = mixC.g*1.2;
      trailColors[idx*3+2] = mixC.b*1.2;

      trailVelocities[idx].set(
        (Math.random()-0.5)*0.8,
        -0.2-Math.random()*0.5,
        (Math.random()-0.5)*0.8
      );
      trailLife[idx] = 1.0;
      trailHead = (trailHead+1)%TRAIL_COUNT;
    }
    figIdx++;
  }

  // Update trail particles
  for(let i=0;i<TRAIL_COUNT;i++){
    if(trailLife[i]<=0) continue;
    trailLife[i] -= dt*0.25;
    if(trailLife[i]<=0){
      trailPositions[i*3+1]=-100;
      continue;
    }
    trailVelocities[i].y -= dt*0.3; // gentle gravity
    trailPositions[i*3]   += trailVelocities[i].x*dt;
    trailPositions[i*3+1] += trailVelocities[i].y*dt;
    trailPositions[i*3+2] += trailVelocities[i].z*dt;
    // Fade color
    const fade = trailLife[i];
    trailColors[i*3]   *= (1-dt*0.3);
    trailColors[i*3+1] *= (1-dt*0.3);
    trailColors[i*3+2] *= (1-dt*0.3);
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;

  // Update line geometry with color shift during uncoil
  let lineIdx=0;
  const posArr=lineGeo.attributes.position.array;
  const colArr=lineGeo.attributes.color.array;
  for(let fig of figures){
    const myUncoil = Math.max(0, Math.min(1, uncoilAmount(elapsed - fig.uncoilDelay*CYCLE)));
    const currentColor = new THREE.Color().lerpColors(fig.color, fig.pyriteColor, myUncoil*0.6);

    for(let s of fig.springs){
      const idx=lineIdx*6;
      const ja=fig.joints[s.a], jb=fig.joints[s.b];
      posArr[idx]=ja.pos.x; posArr[idx+1]=ja.pos.y; posArr[idx+2]=ja.pos.z;
      posArr[idx+3]=jb.pos.x; posArr[idx+4]=jb.pos.y; posArr[idx+5]=jb.pos.z;

      colArr[idx]=currentColor.r; colArr[idx+1]=currentColor.g; colArr[idx+2]=currentColor.b;
      colArr[idx+3]=currentColor.r; colArr[idx+4]=currentColor.g; colArr[idx+5]=currentColor.b;
      lineIdx++;
    }
  }
  lineGeo.attributes.position.needsUpdate=true;
  lineGeo.attributes.color.needsUpdate=true;

  // Update joint positions + colors
  let jIdx=0;
  const jPosArr=jointGeo.attributes.position.array;
  const jColArr=jointGeo.attributes.color.array;
  for(let fig of figures){
    const myUncoil = Math.max(0, Math.min(1, uncoilAmount(elapsed - fig.uncoilDelay*CYCLE)));
    const currentColor = new THREE.Color().lerpColors(fig.color, fig.pyriteColor, myUncoil*0.6);
    // Points grow slightly during uncoil
    jointMat.size = 0.40 + myUncoil*0.25;

    for(let j of fig.joints){
      const idx=jIdx*3;
      jPosArr[idx]=j.pos.x; jPosArr[idx+1]=j.pos.y; jPosArr[idx+2]=j.pos.z;
      jColArr[idx]=currentColor.r*1.4;
      jColArr[idx+1]=currentColor.g*1.4;
      jColArr[idx+2]=currentColor.b*1.4;
      jIdx++;
    }
  }
  jointGeo.attributes.position.needsUpdate=true;
  jointGeo.attributes.color.needsUpdate=true;

  // Camera — still with very slow lateral drift, pulls back slightly during uncoil
  const driftX = Math.sin(elapsed*0.008)*2.5;
  const breathY = Math.sin(elapsed*0.015)*1.0;
  const uncoilPull = globalUncoil*6; // camera eases back to see the spectacle
  camera.position.set(
    camBase.x + driftX,
    camBase.y + breathY,
    camBase.z + uncoilPull
  );
  camera.lookAt(lookTarget);

  // Subtle ambient light warm-up during uncoil
  keyLight.color.setHSL(0.6 - globalUncoil*0.15, 0.5+globalUncoil*0.15, 0.45+globalUncoil*0.1);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
