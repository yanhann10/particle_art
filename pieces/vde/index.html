  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .caption { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── folded leaf primitives — 5 distinct archetypes ── */
function makeLeafGeometry(type, scale){
  const segs = 28;
  const verts = [];
  const uvs = [];
  
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    let x, y, z;
    
    switch(type){
      case 0: /* fern unfurl — spiral with increasing radius */
        const angle = t * Math.PI * 3.2;
        const r = t * 1.8;
        x = Math.cos(angle) * r;
        y = t * 2.4;
        z = Math.sin(angle) * r + Math.sin(t * Math.PI) * 0.6;
        break;
      case 1: /* palm frond — wide arc with twist */
        x = (t - 0.5) * 3.2;
        y = t * 2.0 - Math.pow(t, 2) * 0.8;
        z = Math.sin(t * Math.PI) * 1.2;
        break;
      case 2: /* autumn curl — tight helical fold */
        const coil = t * Math.PI * 4.5;
        x = Math.cos(coil) * (0.6 + t * 0.4);
        y = t * 1.8;
        z = Math.sin(coil) * (0.6 + t * 0.4) + t * 0.7;
        break;
      case 3: /* willow droop — hanging curve */
        x = Math.sin(t * Math.PI) * 1.4;
        y = -t * 2.5 + Math.pow(1-t, 3) * 0.8;
        z = Math.cos(t * Math.PI * 2) * 0.5;
        break;
      case 4: /* monstera split — ribbed sheet */
        const split = Math.floor(t * 5) / 5;
        x = (t - 0.5) * 2.6 + Math.sin(split * Math.PI * 6) * 0.3;
        y = t * 2.2;
        z = Math.pow(Math.sin(t * Math.PI), 0.8) * 0.9;
        break;
    }
    
    const w = 0.7 * (1 - Math.abs(t - 0.5) * 1.2) * scale;
    verts.push(x * scale - w, y * scale, z * scale);
    verts.push(x * scale + w, y * scale, z * scale);
    uvs.push(0, t, 1, t);
  }
  
  const indices = [];
  for (let i = 0; i < segs; i++){
    const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
    indices.push(a, c, b, b, c, d);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const N = 72000;
const leafCount = 7;
const leaves = [];

/* audio reactive — mic input */
let audioLevel = 0;
let audioCtx, analyser, dataArray;
navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
  audioCtx = new AudioContext();
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
}).catch(() => {});

function getAudioLevel(){
  if (!analyser) return 0;
  analyser.getByteFrequencyData(dataArray);
  const bass = dataArray.slice(0, 8).reduce((a,b)=>a+b,0) / (8 * 255);
  return bass;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: 1 },
  uBeat: { value: 0 },
  uAudio: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBeat;
    uniform float uAudio;
    attribute float seed;
    attribute float leafIdx;
    varying vec3 vCol;
    varying float vAlpha;
    varying vec2 vUv;

    void main(){
      vUv = uv;
      vec3 p = position;
      
      /* hyperstition pulse — 160 BPM = 0.375s per beat */
      float beat = mod(uTime * 2.667, 1.0);
      float snap = step(0.92, beat);
      float kick = smoothstep(0.0, 0.08, beat) * (1.0 - smoothstep(0.08, 0.3, beat));
      
      /* audio snap on bass hits */
      float audioSnap = uAudio * 3.0;
      
      /* violent rotation — 3 axes, prime periods */
      float rotX = uTime * 1.9 + leafIdx * 0.7;
      float rotY = uTime * 2.3 + leafIdx * 1.1;
      float rotZ = uTime * 1.7 + leafIdx * 0.5;
      
      mat3 rx = mat3(
        1.0, 0.0, 0.0,
        0.0, cos(rotX), -sin(rotX),
        0.0, sin(rotX), cos(rotX)
      );
      mat3 ry = mat3(
        cos(rotY), 0.0, sin(rotY),
        0.0, 1.0, 0.0,
        -sin(rotY), 0.0, cos(rotY)
      );
      mat3 rz = mat3(
        cos(rotZ), -sin(rotZ), 0.0,
        sin(rotZ), cos(rotZ), 0.0,
        0.0, 0.0, 1.0
      );
      
      p = rz * ry * rx * p;
      
      /* radial orbit — leaves spinning out from center */
      float orbit = uTime * 0.8 + leafIdx * 0.628;
      float radius = 2.5 + sin(uTime * 0.4 + leafIdx) * 1.2;
      vec3 offset = vec3(cos(orbit) * radius, sin(orbit * 0.6) * 0.8, sin(orbit) * radius);
      p += offset;
      
      /* snap displacement on beat */
      p += vec3(
        sin(uTime * 7.3 + leafIdx * 3.0),
        cos(uTime * 8.1 + leafIdx * 2.5),
        sin(uTime * 6.7 + leafIdx * 4.0)
      ) * (snap * 0.4 + audioSnap * 0.6);
      
      /* kick expansion */
      p *= 1.0 + kick * 0.15 + audioSnap * 0.2;
      
      /* CCRU palette — acid green, cyan, magenta, no warmth */
      vec3 acid = vec3(0.0, 1.0, 0.25);
      vec3 cyan = vec3(0.0, 0.9, 0.95);
      vec3 magenta = vec3(1.0, 0.0, 0.8);
      
      float leafPhase = mod(leafIdx * 0.43 + uTime * 0.3, 1.0);
      vec3 col = mix(acid, cyan, step(0.33, leafPhase));
      col = mix(col, magenta, step(0.67, leafPhase));
      
      /* square-wave brightness on snap */
      col *= 1.0 + snap * 1.5 + audioSnap * 2.0;
      
      vCol = col;
      vAlpha = 0.7 + snap * 0.3 + kick * 0.2 + audioSnap * 0.4;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying vec2 vUv;
    
    void main(){
      /* hard edge — no soft falloff */
      float edge = smoothstep(0.48, 0.5, abs(vUv.x - 0.5));
      if (edge > 0.8) discard;
      
      /* vein structure — hard lines */
      float vein = abs(fract(vUv.y * 12.0) - 0.5);
      float veinSnap = step(vein, 0.08);
      
      vec3 col = vCol * (0.8 + veinSnap * 0.4);
      float a = vAlpha * (1.0 - edge);
      
      gl_FragColor = vec4(col * a, a);
    }
  `
});

/* build leaf cluster */
for (let i = 0; i < leafCount; i++){
  const type = i % 5;
  const scale = 0.7 + (i % 3) * 0.3;
  const geom = makeLeafGeometry(type, scale);
  
  const posCount = geom.attributes.position.count;
  const seeds = new Float32Array(posCount);
  const leafIdxs = new Float32Array(posCount);
  for (let j = 0; j < posCount; j++){
    seeds[j] = Math.random();
    leafIdxs[j] = i;
  }
  geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
  geom.setAttribute('leafIdx', new THREE.BufferAttribute(leafIdxs, 1));
  
  const mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
  leaves.push(mesh);
}

/* particle debris field */
const particleGeom = new THREE.BufferGeometry();
const particlePos = new Float32Array(N * 3);
const particleSeeds = new Float32Array(N);
const particleLeafIdx = new Float32Array(N);

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 3 + Math.random() * 4;
  particlePos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  particlePos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  particlePos[i*3+2] = r * Math.cos(phi);
  particleSeeds[i] = Math.random();
  particleLeafIdx[i] = Math.floor(Math.random() * leafCount);
}

particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
particleGeom.setAttribute('seed', new THREE.BufferAttribute(particleSeeds, 1));
particleGeom.setAttribute('leafIdx', new THREE.BufferAttribute(particleLeafIdx, 1));

const particleMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBeat;
    uniform float uAudio;
    attribute float seed;
    attribute float leafIdx;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      
      /* chaotic orbit */
      float orbitSpeed = 1.2 + seed * 0.8;
      p.x += sin(t * orbitSpeed + leafIdx) * 0.3;
      p.y += cos(t * orbitSpeed * 1.3 + leafIdx * 2.0) * 0.3;
      p.z += sin(t * orbitSpeed * 0.9 + leafIdx * 3.0) * 0.3;
      
      /* beat pulse */
      float beat = mod(uTime * 2.667, 1.0);
      float snap = step(0.92, beat);
      p *= 1.0 + snap * 0.08 + uAudio * 0.12;
      
      /* palette */
      vec3 acid = vec3(0.0, 1.0, 0.25);
      vec3 cyan = vec3(0.0, 0.9, 0.95);
      vec3 magenta = vec3(1.0, 0.0, 0.8);
      
      float leafPhase = mod(leafIdx * 0.43 + uTime * 0.3, 1.0);
      vec3 col = mix(acid, cyan, step(0.33, leafPhase));
      col = mix(col, magenta, step(0.67, leafPhase));
      col *= 1.0 + snap * 2.0 + uAudio * 2.5;
      
      vCol = col;
      vAlpha = 0.4 + snap * 0.3 + uAudio * 0.4;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (18.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = (1.0 - r * 4.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const particlePoints = new THREE.Points(particleGeom, particleMat);
scene.add(particlePoints);

/* hyperstition captions */
const captions = [
  'THE OUTSIDE WILL HAVE BEEN',
  'CAPITAL IS TIME-BINDING',
  'CONVERGENCE → SINGULARITY',
  'UNLIFE PROPAGATES',
  'CYBERPOSITIVE FEEDBACK',
  'MACHINIC DESIRE SELF-FULFILLS',
  'TECHNOSIS ACCELERATES'
];
let captionIdx = 0;
let lastCaptionTime = 0;

function showCaption(){
  const cap = document.getElementById('cap');
  cap.textContent = captions[captionIdx];
  captionIdx = (captionIdx + 1) % captions.length;
  cap.style.opacity = '1';
  setTimeout(() => { cap.style.opacity = '0'; }, 600);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  /* 160 BPM = 0.375s per beat */
  const beatPhase = (elapsed * 2.667) % 1;
  uniforms.uBeat.value = beatPhase;
  
  /* audio level */
  audioLevel = getAudioLevel();
  uniforms.uAudio.value = audioLevel;
  
  /* caption on downbeat — every 4 beats = 1.5s */
  if (elapsed - lastCaptionTime > 1.5){
    if (beatPhase < 0.1){
      showCaption();
      lastCaptionTime = elapsed;
    }
  }
  
  /* camera — slow outward drift */
  camera.position.z = 12 + Math.sin(elapsed * 0.15) * 2;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
