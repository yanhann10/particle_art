<!DOCTYPE html>
<!-- MOTION: morph, intensity: gentle -->
<!-- PIECE: i0y — Brutalist↔Art-Deco↔Biophilic 3-Phase Morph -->
<!-- PALETTE: warm cement #a09080 / bronze #7a5a2a / deep green #2a5a2a -->
<!-- CONCEPT: Three-phase click morph on 60k particles. Phase 1 = brutalist stacked setbacks
     (warm cement). Phase 2 = art-deco tapered spire (bronze). Phase 3 = Gaudi branching canopy
     (deep green). Each phase fully commits to its register. LERP over 2s, no rotation between. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>i0y · brutalist↔deco↔biophilic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0906; overflow: hidden; width: 100vw; height: 100vh; }
  canvas { display: block; }
  #phase-label {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 0.18em;
    color: rgba(160,144,128,0.55); pointer-events: none; user-select: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="phase-label">BRUTALIST — click to advance</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0906);

const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 200);
camera.position.set(0, 6, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 5, 0);
controls.enableZoom = true;

// Lighting
scene.add(new THREE.AmbientLight(0x111008, 2.5));
const key = new THREE.DirectionalLight(0xfff8e8, 2.8);
key.position.set(5, 14, 6);
scene.add(key);
const fill = new THREE.DirectionalLight(0x8090a0, 0.9);
fill.position.set(-6, 3, -4);
scene.add(fill);

const N = 60000;

// Phase colors (per-particle RGB arrays)
const PHASE_COLORS = [
  // Brutalist: warm cement
  new THREE.Color(0xa09080),
  // Art-Deco: bronze
  new THREE.Color(0x7a5a2a),
  // Biophilic: deep green
  new THREE.Color(0x2a5a2a),
];

const PHASE_NAMES = ['BRUTALIST', 'ART-DECO', 'BIOPHILIC'];
const PHASE_HINTS = ['click to advance', 'click to advance', 'click to restart'];

// ── Pose generators ─────────────────────────────────────────────────────────

function genBrutalist(N) {
  // Stacked rectilinear setbacks: 5 tiers, each tier a rectangular prism
  const pos = new Float32Array(N * 3);
  const TIERS = [
    { y0: 0,  h: 2.0, hw: 5.0, hd: 5.0 }, // ground floor — wide
    { y0: 2,  h: 2.0, hw: 4.0, hd: 4.0 },
    { y0: 4,  h: 2.5, hw: 3.0, hd: 3.0 },
    { y0: 6.5,h: 2.0, hw: 2.0, hd: 2.0 },
    { y0: 8.5,h: 3.0, hw: 1.0, hd: 1.0 }, // top tower
  ];
  const weights = TIERS.map(t => t.h * (2*t.hw) * (2*t.hd));
  const total = weights.reduce((a,b)=>a+b,0);
  let i = 0;
  while (i < N) {
    // Pick tier by weight
    let r = Math.random() * total, acc = 0, ti = 0;
    for (let k = 0; k < TIERS.length; k++) { acc += weights[k]; if (r < acc) { ti = k; break; } }
    const { y0, h, hw, hd } = TIERS[ti];
    // Surface-biased: pick one of 6 faces
    const face = Math.floor(Math.random() * 6);
    let x, y, z;
    if (face === 0) { x = -hw; y = y0 + Math.random()*h; z = (Math.random()*2-1)*hd; }
    else if (face === 1) { x = hw; y = y0 + Math.random()*h; z = (Math.random()*2-1)*hd; }
    else if (face === 2) { x = (Math.random()*2-1)*hw; y = y0; z = (Math.random()*2-1)*hd; }
    else if (face === 3) { x = (Math.random()*2-1)*hw; y = y0+h; z = (Math.random()*2-1)*hd; }
    else if (face === 4) { x = (Math.random()*2-1)*hw; y = y0 + Math.random()*h; z = -hd; }
    else { x = (Math.random()*2-1)*hw; y = y0 + Math.random()*h; z = hd; }
    // Add noise jitter for brutalist roughness
    pos[i*3]   = x + (Math.random()-0.5)*0.08;
    pos[i*3+1] = y + (Math.random()-0.5)*0.08;
    pos[i*3+2] = z + (Math.random()-0.5)*0.08;
    i++;
  }
  return pos;
}

function genArtDeco(N) {
  // Tapered ornamental spire + 5-level setbacks + sunburst crown
  const pos = new Float32Array(N * 3);
  let i = 0;
  while (i < N) {
    const choice = Math.random();
    if (choice < 0.55) {
      // Spire: tapered cylinder, r decreases with height
      const y = Math.random() * 14;
      const r = 1.8 * (1 - y/16) + 0.05;
      const angle = Math.random() * Math.PI * 2;
      const ri = r * (0.85 + Math.random() * 0.3); // surface scatter
      pos[i*3]   = Math.cos(angle) * ri;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(angle) * ri;
    } else if (choice < 0.75) {
      // Vertical ornamental ridges: 16 ridges around the spire
      const ridge = Math.floor(Math.random() * 16);
      const angle = (ridge / 16) * Math.PI * 2;
      const y = Math.random() * 12;
      const r = 1.85 * (1 - y/16) + 0.06;
      pos[i*3]   = Math.cos(angle) * r;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(angle) * r;
    } else {
      // Sunburst crown at top (y=13..15): radial rays
      const angle = Math.random() * Math.PI * 2;
      const ray_r = Math.random() * 3.5;
      const y = 13 + Math.random() * 0.5 + ray_r * 0.1;
      pos[i*3]   = Math.cos(angle) * ray_r;
      pos[i*3+1] = y;
      pos[i*3+2] = Math.sin(angle) * ray_r;
    }
    i++;
  }
  return pos;
}

function genBiophilic(N) {
  // Gaudi-like branching canopy: recursive fork tree
  const pos = new Float32Array(N * 3);
  // Pre-build branch segments
  const branches = [];
  function addBranch(x, y, z, dx, dy, dz, len, depth) {
    if (depth <= 0 || len < 0.15) return;
    const ex = x + dx * len, ey = y + dy * len, ez = z + dz * len;
    branches.push({ x, y, z, ex, ey, ez, len });
    // Fork: 2-3 children
    const nFork = depth > 1 ? 3 : 2;
    for (let k = 0; k < nFork; k++) {
      const spread = 0.45 + Math.random() * 0.3;
      const ndx = dx * 0.7 + (Math.random()-0.5) * spread;
      const ndy = dy * 0.7 + Math.random() * 0.5;
      const ndz = dz * 0.7 + (Math.random()-0.5) * spread;
      const nl = Math.sqrt(ndx*ndx+ndy*ndy+ndz*ndz);
      addBranch(ex, ey, ez, ndx/nl, ndy/nl, ndz/nl, len*0.62, depth-1);
    }
  }
  // Trunk: 3 main columns for Gaudi catenary column effect
  for (let root = 0; root < 3; root++) {
    const rx = (root - 1) * 2.5;
    addBranch(rx, 0, 0, 0, 1, 0, 3.5, 4);
  }

  let i = 0;
  while (i < N) {
    const br = branches[Math.floor(Math.random() * branches.length)];
    const t = Math.random();
    // Point along branch + radial scatter (thicker at base)
    const r = 0.04 + (1 - t) * 0.06;
    const angle = Math.random() * Math.PI * 2;
    pos[i*3]   = br.x + (br.ex - br.x) * t + Math.cos(angle) * r;
    pos[i*3+1] = br.y + (br.ey - br.y) * t + Math.sin(angle) * r;
    pos[i*3+2] = br.z + (br.ez - br.z) * t;
    i++;
  }
  return pos;
}

// ── Build geometry ───────────────────────────────────────────────────────────
const poses = [
  genBrutalist(N),
  genArtDeco(N),
  genBiophilic(N),
];

// Attribute arrays
const posArr = new Float32Array(N * 3);
const colArr = new Float32Array(N * 3);

// Init at pose 0
for (let i = 0; i < N * 3; i++) posArr[i] = poses[0][i];
const c0 = PHASE_COLORS[0];
for (let i = 0; i < N; i++) {
  colArr[i*3] = c0.r + (Math.random()-0.5)*0.06;
  colArr[i*3+1] = c0.g + (Math.random()-0.5)*0.05;
  colArr[i*3+2] = c0.b + (Math.random()-0.5)*0.04;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));

const mat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.88,
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ── Morph state ─────────────────────────────────────────────────────────────
let currentPhase = 0;
let morphProgress = 1.0; // 1=fully at currentPhase, 0=at start of transition
let morphing = false;
let fromPhase = 0, toPhase = 0;
let morphStart = 0;
const MORPH_DUR = 2000; // ms

// Temp arrays for morph lerp
const fromPos = new Float32Array(N * 3);
const fromCol = new Float32Array(N * 3);

function startMorph(from, to) {
  fromPhase = from; toPhase = to;
  fromPos.set(posArr);
  fromCol.set(colArr);
  morphing = true;
  morphStart = performance.now();
  const label = document.getElementById('phase-label');
  label.textContent = PHASE_NAMES[to] + ' — ' + PHASE_HINTS[to];
}

document.addEventListener('click', () => {
  if (morphing) return;
  const next = (currentPhase + 1) % 3;
  startMorph(currentPhase, next);
  currentPhase = next;
});

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

// ── Animation ────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  if (morphing) {
    const elapsed = performance.now() - morphStart;
    const rawT = Math.min(elapsed / MORPH_DUR, 1.0);
    const t = easeInOut(rawT);

    const targetPos = poses[toPhase];
    const targetColor = PHASE_COLORS[toPhase];
    const fromColor = PHASE_COLORS[fromPhase];

    for (let i = 0; i < N; i++) {
      posArr[i*3]   = fromPos[i*3]   + (targetPos[i*3]   - fromPos[i*3])   * t;
      posArr[i*3+1] = fromPos[i*3+1] + (targetPos[i*3+1] - fromPos[i*3+1]) * t;
      posArr[i*3+2] = fromPos[i*3+2] + (targetPos[i*3+2] - fromPos[i*3+2]) * t;

      const baseR = fromColor.r + (targetColor.r - fromColor.r) * t;
      const baseG = fromColor.g + (targetColor.g - fromColor.g) * t;
      const baseB = fromColor.b + (targetColor.b - fromColor.b) * t;
      colArr[i*3]   = baseR + (fromCol[i*3]   - fromColor.r) * (1-t) + (Math.random()-0.5)*0.03*t;
      colArr[i*3+1] = baseG + (fromCol[i*3+1] - fromColor.g) * (1-t);
      colArr[i*3+2] = baseB + (fromCol[i*3+2] - fromColor.b) * (1-t);
    }

    geo.attributes.position.needsUpdate = true;
    geo.attributes.color.needsUpdate = true;

    if (rawT >= 1.0) {
      morphing = false;
      // Refresh color variation at landing
      const c = PHASE_COLORS[toPhase];
      for (let i = 0; i < N; i++) {
        colArr[i*3]   = c.r + (Math.random()-0.5)*0.06;
        colArr[i*3+1] = c.g + (Math.random()-0.5)*0.05;
        colArr[i*3+2] = c.b + (Math.random()-0.5)*0.04;
      }
      geo.attributes.color.needsUpdate = true;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const W2 = window.innerWidth, H2 = window.innerHeight;
  camera.aspect = W2 / H2;
  camera.updateProjectionMatrix();
  renderer.setSize(W2, H2);
});
</script>
</body>
</html>
