  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }

<body>
<div class="id">mi2</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres · gloaming · spring-chain Hooke's law</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*  Gloaming — five catenary light strings hang in twilight depth, drifting
    amber → lavender → indigo as night comes. Each strand is governed by a
    single physical law. Per-bulb guttering simulates filaments dying in the dusk.

    PHYSICAL LAW: Spring-chain (Hooke's Law + viscous damping + uniform gravity)
      Each interior particle i feels:
        F_spring = Σ_{j∈{i-1,i+1}}  k · (|r_ij| − L0) · r̂_ij   (restoring)
        F_damp   = −c · v_i                                        (damping)
        F_grav   = m · g  (downward, −y)                          (gravity)
      Endpoints are pinned (kinematic anchors, zero velocity).
      Integration: explicit Euler at fixed timestep dt.
      At rest the chain adopts a catenary; perturbations propagate as
      transverse waves and decay via viscous damping.
*/

const BG = 0x08070a;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1, 24);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -2, 0);

// --- Spring-chain physical constants ---
const K       = 80.0;   // spring stiffness  [Hooke's law: F = k·(|r|−L0)]
const C       = 6.0;    // viscous damping coefficient  [F = −c·v]
const G       = 9.8;    // gravitational acceleration (downward, −y)
const M       = 1.0;    // mass per particle (uniform)
const DT      = 0.004;  // Euler integration timestep [s]
const STEPS_PER_FRAME = 6; // sub-steps per animation frame

// --- Strand layout ---
const STRAND_COUNT = 5;
const NODES_PER    = 60;   // particles in each chain

const STRAND_Z     = [-2.8, -1.2, 0.0, 1.4, 3.0];
const STRAND_SAG   = [1.0,  1.3,  0.9, 1.15, 1.05]; // droop scale (rest-length ratio)
const STRAND_WIDTH = [5.5,  6.2,  5.0, 6.8,  5.8];  // half-span in x

// Build spring-chain strands.
// Each strand: { nodes: [{x,y,z,vx,vy,vz,pinned}], L0: rest_length_per_segment }
const strands = [];

function initStrand(si) {
  const W   = STRAND_WIDTH[si];
  const sag = STRAND_SAG[si];
  const z0  = STRAND_Z[si];
  const N   = NODES_PER;
  const nodes = [];

  // Place nodes along an initial catenary approximation so the chain
  // starts near equilibrium and doesn't thrash on the first frames.
  for (let i = 0; i < N; i++) {
    const t  = i / (N - 1);            // 0 → 1
    const tx = (t * 2 - 1);            // −1 → +1
    const x  = tx * W;
    // catenary-like sag: y = −sag · (cosh(a·tx) − 1) approximated by parabola
    const y  = -sag * 2.2 * tx * tx;
    nodes.push({
      x, y,
      z: z0 + (Math.random() - 0.5) * 0.1,
      vx: 0, vy: 0, vz: 0,
      pinned: i === 0 || i === N - 1   // endpoint anchors
    });
  }

  // Natural rest length: arc length of the initial curve divided by (N-1).
  // Using a slightly longer rest length than the straight-line spacing
  // lets the chain sag further under gravity, giving a deeper catenary.
  let arcLen = 0;
  for (let i = 0; i < N - 1; i++) {
    const a = nodes[i], b = nodes[i + 1];
    arcLen += Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
  }
  const L0 = arcLen / (N - 1);

  return { nodes, L0, z0 };
}

for (let si = 0; si < STRAND_COUNT; si++) {
  strands.push(initStrand(si));
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

// --- Physics integration: one Euler step for one strand ---
function stepStrand(strand) {
  const { nodes, L0 } = strand;
  const N = nodes.length;

  // Accumulate forces → accelerations
  const ax = new Float64Array(N);
  const ay = new Float64Array(N);
  const az = new Float64Array(N);

  for (let i = 0; i < N; i++) {
    const v = nodes[i];
    if (v.pinned) continue;

    // Gravity (downward)
    ay[i] -= G;

    // Damping
    ax[i] -= (C / M) * v.vx;
    ay[i] -= (C / M) * v.vy;
    az[i] -= (C / M) * v.vz;

    // Spring forces from left and right neighbors
    for (const j of [i - 1, i + 1]) {
      if (j < 0 || j >= N) continue;
      const u = nodes[j];
      const ex = u.x - v.x;
      const ey = u.y - v.y;
      const ez = u.z - v.z;
      const dist = Math.hypot(ex, ey, ez);
      if (dist < 1e-8) continue;
      // Hooke: F = k · (dist − L0) in the direction of the neighbor
      const fmag = (K / M) * (dist - L0) / dist;
      ax[i] += fmag * ex;
      ay[i] += fmag * ey;
      az[i] += fmag * ez;
    }
  }

  // Euler integration: v += a·dt,  x += v·dt
  for (let i = 0; i < N; i++) {
    const v = nodes[i];
    if (v.pinned) continue;
    v.vx += ax[i] * DT;
    v.vy += ay[i] * DT;
    v.vz += az[i] * DT;
    v.x  += v.vx * DT;
    v.y  += v.vy * DT;
    v.z  += v.vz * DT;
  }
}

function stepAll() {
  if (paused) return;
  for (const s of strands) stepStrand(s);
}

// --- Rendering: 40k particles distributed along all strands ---
const N_RENDER  = 40000;
const rPos      = new Float32Array(N_RENDER * 3);
const rSeeds    = new Float32Array(N_RENDER);
const rAge      = new Float32Array(N_RENDER);
const rStrand   = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('strandId', new THREE.BufferAttribute(rStrand, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.03 },
  uGloaming:   { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uGloaming;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    attribute float strandId;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      // guttering: per-bulb flicker that increases with gloaming
      float flickerFreq  = 3.0 + seed * 8.0;
      float flickerPhase = uTime * flickerFreq + seed * 100.0;
      float flicker = sin(flickerPhase) * sin(flickerPhase * 0.37) * sin(flickerPhase * 0.13);
      float gutterChance = smoothstep(0.3, 1.0, uGloaming) * 0.6;
      float gutter = mix(1.0, max(0.08, flicker * 0.5 + 0.5), gutterChance * step(0.7, seed));

      // pulse per-bulb
      float pulse = (0.85 + 0.15 * sin(uTime * 1.0 + seed * 40.0)) * gutter;

      // palette: amber → lavender → deep indigo as gloaming deepens
      vec3 amber    = vec3(1.0,  0.72, 0.32);
      vec3 warm     = vec3(1.0,  0.85, 0.65);
      vec3 lavender = vec3(0.72, 0.58, 0.82);
      vec3 indigo   = vec3(0.30, 0.22, 0.55);

      float k = clamp(age * 1.2, 0.0, 1.0);
      vec3 baseCol = mix(amber, warm, k);
      vec3 twilightCol = mix(lavender, indigo, smoothstep(0.4, 1.0, uGloaming));
      baseCol = mix(baseCol, twilightCol, uGloaming * 0.65);
      float strandShift = strandId * 0.08;
      baseCol = mix(baseCol, lavender, strandShift * uGloaming);

      vCol = baseCol * pulse;

      float baseBright = mix(0.6, 0.25, uGloaming * 0.5);
      vAlpha = baseBright + 0.15 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.6 * uPixel * (42.0 / dist);
      gl_Position  = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 22.0);
      float halo = exp(-r *  7.0) * 0.3;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Wire underlay — one line per strand
const wires = [];
for (let si = 0; si < STRAND_COUNT; si++) {
  const wg = new THREE.BufferGeometry();
  const wp = new Float32Array(NODES_PER * 3);
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  wg.setDrawRange(0, NODES_PER);
  const wm = new THREE.LineBasicMaterial({ color: 0x1e1a24, transparent: true, opacity: 0.25 });
  const wl = new THREE.Line(wg, wm);
  scene.add(wl);
  wires.push({ geom: wg, positions: wp, line: wl });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pre-settle: run physics without rendering so strands start in catenary pose
for (let s = 0; s < 800; s++) stepAll();

const statEl = document.getElementById('stat');
const startT = performance.now();

// Per-strand age accumulator (replaces per-vertex age from differential growth era)
const strandAge = new Float32Array(STRAND_COUNT);

function loop() {
  const t = (performance.now() - startT) / 1000;
  uniforms.uTime.value  = t;
  uniforms.uGloaming.value = Math.min(1.0, t / 90.0);

  // Physics sub-steps
  for (let s = 0; s < STEPS_PER_FRAME; s++) stepAll();

  // Update age slowly (drives colour drift along each strand)
  for (let si = 0; si < STRAND_COUNT; si++) strandAge[si] = Math.min(1.0, t / 120.0);

  // Collect segments for particle distribution
  const allSegments = [];  // { ax,ay,az, bx,by,bz, len, strandId }
  let totalLen = 0;
  let totalVerts = 0;
  let gcx = 0, gcy = 0, gcz = 0, gn = 0;

  for (let si = 0; si < STRAND_COUNT; si++) {
    const { nodes } = strands[si];
    const N = nodes.length;
    totalVerts += N;

    // Update wire
    const w = wires[si];
    for (let i = 0; i < N; i++) {
      w.positions[i * 3]     = nodes[i].x;
      w.positions[i * 3 + 1] = nodes[i].y;
      w.positions[i * 3 + 2] = nodes[i].z;
      gcx += nodes[i].x; gcy += nodes[i].y; gcz += nodes[i].z; gn++;
    }
    w.geom.attributes.position.needsUpdate = true;

    for (let i = 0; i < N - 1; i++) {
      const a = nodes[i], b = nodes[i + 1];
      const L = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
      allSegments.push({ ax: a.x, ay: a.y, az: a.z,
                         bx: b.x, by: b.y, bz: b.z,
                         len: L, strandId: si });
      totalLen += L;
    }
  }

  // Camera tracks centroid
  if (gn > 0) {
    gcx /= gn; gcy /= gn; gcz /= gn;
    controls.target.lerp(new THREE.Vector3(gcx, gcy, gcz), 0.02);
  }

  // Distribute 40k particles across segments proportional to length
  if (totalLen > 0) {
    let written = 0;
    const spread = 0.018;
    for (let si = 0; si < allSegments.length; si++) {
      const seg = allSegments[si];
      const share = (si === allSegments.length - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * seg.len / totalLen));
      const age = strandAge[seg.strandId];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u  = Math.random();
        // slight bias toward particle endpoints for bulb-cluster look
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
        rPos[written * 3]     = seg.ax + (seg.bx - seg.ax) * cu + (Math.random() - 0.5) * spread;
        rPos[written * 3 + 1] = seg.ay + (seg.by - seg.ay) * cu + (Math.random() - 0.5) * spread * 0.5;
        rPos[written * 3 + 2] = seg.az + (seg.bz - seg.az) * cu + (Math.random() - 0.5) * spread;
        rAge[written]    = age;
        rStrand[written] = seg.strandId / STRAND_COUNT;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.strandId.needsUpdate = true;
  }

  statEl.textContent = `nodes=${totalVerts}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
