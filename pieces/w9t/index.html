<!-- MOTION: pulse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }

</head>
<body>
<div class="id">w9t</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from ajo · arabesque ribbon · wink surprise</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ajo arabesque ribbon with a WINK: periodically, a vesica-piscis eye opens
   in the ribbon surface, a small amber iris peers through, blinks shut.
   Like Gehry's titanium skin briefly revealing it's alive. The surprise
   lands once every ~12s, holds ~2.5s, then the ribbon heals. */

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.025);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xfff2c0, 1.1);
lightKey.position.set(6, 12, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x100815, 0.5));
const lightFill = new THREE.DirectionalLight(0x405078, 0.4);
lightFill.position.set(-6, 4, -4);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────── differential growth (from ajo/5gm lineage)
const MAX_VERTS = 1400;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE     = 0.003;
const PRESSURE  = 0.0030;
const RISE      = 0.0045;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 1200; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─────────── ribbon material (antique gold on midnight)
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0xc9a45a,
  emissive: 0x2a1a06,
  roughness: 0.32,
  metalness: 0.7,
  side: THREE.DoubleSide,
});

// ─────────── the EYE — a small iris that peeks through the ribbon gap
const eyeGroup = new THREE.Group();
scene.add(eyeGroup);

// iris: a disc with concentric amber/dark rings
const irisGeo = new THREE.CircleGeometry(0.18, 32);
const irisMat = new THREE.MeshStandardMaterial({
  color: 0xb8863a,
  emissive: 0x4a3010,
  emissiveIntensity: 0.6,
  roughness: 0.4,
  metalness: 0.3,
  side: THREE.DoubleSide,
});
const irisMesh = new THREE.Mesh(irisGeo, irisMat);

// pupil: small dark circle
const pupilGeo = new THREE.CircleGeometry(0.07, 24);
const pupilMat = new THREE.MeshStandardMaterial({
  color: 0x0a0806,
  emissive: 0x000000,
  roughness: 0.9,
  side: THREE.DoubleSide,
});
const pupilMesh = new THREE.Mesh(pupilGeo, pupilMat);
pupilMesh.position.z = 0.005;

// highlight: tiny white glint
const glintGeo = new THREE.CircleGeometry(0.025, 12);
const glintMat = new THREE.MeshBasicMaterial({ color: 0xfff8e0, transparent: true, opacity: 0.9 });
const glintMesh = new THREE.Mesh(glintGeo, glintMat);
glintMesh.position.set(0.04, 0.03, 0.01);

eyeGroup.add(irisMesh, pupilMesh, glintMesh);
eyeGroup.visible = false;

// eyelid: a scaled disc that slides over the iris to close
const lidGeo = new THREE.CircleGeometry(0.24, 32);
const lidMat = new THREE.MeshStandardMaterial({
  color: 0xc9a45a,
  emissive: 0x2a1a06,
  roughness: 0.32,
  metalness: 0.7,
  side: THREE.DoubleSide,
});
const lidTop = new THREE.Mesh(lidGeo, lidMat);
const lidBot = new THREE.Mesh(lidGeo, lidMat);
eyeGroup.add(lidTop, lidBot);

// ─────────── wink timing
const WINK_PERIOD = 12.0;   // seconds between winks
const WINK_OPEN   = 1.2;    // time to fully open
const WINK_HOLD   = 1.8;    // hold open
const WINK_CLOSE  = 0.5;    // snap shut (fast — the wink)
const WINK_TOTAL  = WINK_OPEN + WINK_HOLD + WINK_CLOSE;

// pick the eye location: ~40% up the ribbon, a specific vertex index fraction
let eyeLocFrac = 0.38;
let eyePos = new THREE.Vector3(0, 3, 0);
let eyeNormal = new THREE.Vector3(0, 0, 1);
let eyeTangent = new THREE.Vector3(0, 1, 0);

let ribbonMesh = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 4; s++) step();

  // wink phase
  const winkCycle = t % WINK_PERIOD;
  const winkActive = winkCycle < WINK_TOTAL;
  let openness = 0; // 0 = closed, 1 = fully open
  if (winkActive){
    if (winkCycle < WINK_OPEN){
      // ease-out open
      const p = winkCycle / WINK_OPEN;
      openness = 1 - Math.pow(1 - p, 2.5);
    } else if (winkCycle < WINK_OPEN + WINK_HOLD){
      openness = 1;
    } else {
      // snap shut — fast ease-in (the wink)
      const p = (winkCycle - WINK_OPEN - WINK_HOLD) / WINK_CLOSE;
      openness = 1 - p * p;
    }
  }

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    const N_SAMPLES = Math.min(1200, verts.length * 3);

    // find eye position on curve
    const ep = curve.getPointAt(eyeLocFrac);
    const et = curve.getTangentAt(eyeLocFrac).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    let en = new THREE.Vector3().crossVectors(et, up);
    if (en.lengthSq() < 0.001) en.set(1, 0, 0);
    en.normalize();
    eyePos.copy(ep);
    eyeNormal.copy(en);
    eyeTangent.copy(et);

    const EYE_RADIUS = 0.45; // how far the ribbon parts for the eye

    const positions = new Float32Array(N_SAMPLES * 2 * 3);
    const indices = [];

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const tangent = curve.getTangentAt(tt).normalize();
      let lateral = new THREE.Vector3().crossVectors(tangent, up);
      if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
      lateral.normalize();

      // arabesque flare
      let width = 0.20 + 0.16 * Math.sin(tt * 32.0 + t * 0.4);

      // EYE GAP: near the eye location, spread the ribbon apart
      const distToEye = Math.abs(tt - eyeLocFrac);
      const wrapDist = Math.min(distToEye, 1 - distToEye); // handle wrap
      const eyeInfluence = Math.max(0, 1 - wrapDist / 0.025);
      if (eyeInfluence > 0 && openness > 0){
        // vesica piscis: the ribbon edges spread outward from the eye normal
        const spread = eyeInfluence * openness * EYE_RADIUS;
        // also widen slightly so the opening is almond-shaped
        width += spread * 0.3;
        // offset both edges away from the eye center along the normal
        const pushOut = en.clone().multiplyScalar(spread * 0.15);
        p.add(pushOut);
      }

      const left  = p.clone().addScaledVector(lateral, -width);
      const right = p.clone().addScaledVector(lateral,  width);

      // spread edges perpendicular to ribbon surface near eye
      if (eyeInfluence > 0 && openness > 0){
        const spread = eyeInfluence * openness * EYE_RADIUS;
        // push left edge "up" and right edge "down" relative to ribbon normal
        const biNormal = new THREE.Vector3().crossVectors(tangent, lateral).normalize();
        left.addScaledVector(biNormal, spread * 0.6);
        right.addScaledVector(biNormal, -spread * 0.6);
      }

      positions[i*6]   = left.x;  positions[i*6+1] = left.y;  positions[i*6+2] = left.z;
      positions[i*6+3] = right.x; positions[i*6+4] = right.y; positions[i*6+5] = right.z;
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      const a = i * 2, b = i * 2 + 1;
      const c = ni * 2, d = ni * 2 + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (ribbonMesh){ scene.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    scene.add(ribbonMesh);
  }

  // ─────────── position & animate the eye
  if (openness > 0.01){
    eyeGroup.visible = true;
    eyeGroup.position.copy(eyePos);
    // orient eye to face outward along the ribbon normal
    const lookAt = eyePos.clone().add(eyeNormal);
    eyeGroup.lookAt(lookAt);

    // iris + pupil scale with openness
    const sc = openness;
    irisMesh.scale.set(sc, sc, 1);
    pupilMesh.scale.set(sc, sc, 1);
    glintMesh.visible = openness > 0.5;
    glintMat.opacity = Math.min(1, (openness - 0.5) * 2) * 0.9;

    // eyelids: top slides down, bottom slides up to cover iris
    const lidOffset = 0.18 * (1 - openness);
    lidTop.position.set(0, 0.18 + lidOffset, -0.002);
    lidBot.position.set(0, -0.18 - lidOffset, -0.002);
    lidTop.visible = openness < 0.95;
    lidBot.visible = openness < 0.95;

    // subtle pupil tracking toward camera — the eye "sees" you
    if (openness > 0.6){
      const toCamera = camera.position.clone().sub(eyePos).normalize();
      // project onto the eye's local XY plane
      const localX = new THREE.Vector3().crossVectors(eyeNormal, new THREE.Vector3(0,1,0)).normalize();
      const localY = new THREE.Vector3().crossVectors(localX, eyeNormal).normalize();
      const dx = toCamera.dot(localX) * 0.03;
      const dy = toCamera.dot(localY) * 0.03;
      pupilMesh.position.set(dx, dy, 0.005);
      glintMesh.position.set(dx + 0.04, dy + 0.03, 0.01);
    }

    // emissive pulse when open — warm amber glow
    irisMat.emissiveIntensity = 0.4 + 0.4 * openness * (0.8 + 0.2 * Math.sin(t * 3));
  } else {
    eyeGroup.visible = false;
  }

  // camera tracking
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
