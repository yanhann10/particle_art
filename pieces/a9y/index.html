<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a9y · Shiota — key in the hand</title>
<!-- MOTION: sway, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">a9y</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.014);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.35));

const pL = new THREE.PointLight(0xffd0b0, 0.45, 55, 1.9);
pL.position.set(2.5, 9.0, -3.0);
scene.add(pL);

// Dim secondary from below — archive darkness (Morakana)
const pL2 = new THREE.PointLight(0x1a0505, 0.15, 30, 2.0);
pL2.position.set(-4, -6, 2);
scene.add(pL2);

let seed = 29471053;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── THE SUSPENDED SPHERE — pale moon, still center
const sphereRadius = 2.4;
const spherePos = new THREE.Vector3(2.2, 1.0, -1.5);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8da,
    emissive: 0xf0e8da,
    emissiveIntensity: 0.6,
    roughness: 0.92,
    metalness: 0.0,
    transparent: true,
    opacity: 0.78
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── SUSPENDED KEYS — "The Key in the Hand" (Venice 2015, 50,000 keys in red yarn)
// Each key: a small dark elongated shape caught in the thread mesh
const NUM_KEYS = 42;
const keyPositions = [];
for(let i=0; i<NUM_KEYS; i++){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  const dist = sphereRadius + 1.8 + rng()*9.0;
  const p = spherePos.clone().add(dir.multiplyScalar(dist));
  keyPositions.push(p);

  // Key body — elongated dark rectangle + ring
  const bodyLen = 0.12 + rng()*0.18;
  const bodyW = bodyLen * (0.25 + rng()*0.15);
  const d = 0.02 + rng()*0.04;
  const bodyMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.6, d*0.4),
    transparent: true,
    opacity: 0.35 + rng()*0.3
  });
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(bodyW, bodyLen, 0.008),
    bodyMat
  );
  body.position.copy(p);
  body.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(body);

  // Key ring — small torus at top
  if(rng() > 0.3){
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(bodyW*0.5, 0.006, 6, 8),
      bodyMat.clone()
    );
    ring.position.copy(p);
    ring.position.y += bodyLen*0.45;
    ring.rotation.set(rng()*3.14, rng()*3.14, 0);
    scene.add(ring);
  }
}

// ── ROOM — architectural volume
const ROOM = { w: 40, h: 28, d: 48 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — icosahedral skeleton + dense shell + key-neighborhood clusters
const anchors = [];

// Icosahedral base (Manfred Mohr)
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  anchors.push(new THREE.Vector3(
    v[0]*9 + spherePos.x, v[1]*7 + spherePos.y, v[2]*9 + spherePos.z
  ));
}

// Suspension points — ceiling
const suspAnchors = [];
for(let i=0; i<10; i++){
  const x = spherePos.x + (rng()-0.5)*5.0;
  const z = spherePos.z + (rng()-0.5)*5.0;
  const p = new THREE.Vector3(x, hh, z);
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones — intentional negative space (Tyler Hobbs)
const voids = [];
for(let i=0; i<4; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*14,
      spherePos.y + (rng()-0.5)*10,
      spherePos.z + (rng()-0.5)*14
    ),
    r: 1.8 + rng()*2.0
  });
}

function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense anchors — asymmetric, heavier on one side (handmade feel)
const biasX = -3.0; // density bias leftward
for(let i=anchors.length; i<1600; i++){
  let p;
  const r = rng();
  if(r < 0.40){
    // Shell around sphere
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.5 + rng()*8.0;
    p = spherePos.clone().add(dir.multiplyScalar(dist));
  } else if(r < 0.55){
    // Clusters around keys
    const ki = Math.floor(rng()*keyPositions.length);
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = keyPositions[ki].clone().add(dir.multiplyScalar(0.5 + rng()*3.0));
  } else if(r < 0.75){
    p = wallPt();
    p.lerp(spherePos, 0.15 + rng()*0.5);
    p.x += biasX * rng() * 0.3;
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereRadius));
}

// ── Radial quantization near sphere (Vera Molnar)
function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 12) return p;
  const strength = Math.max(0, 1 - d/12);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snap = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snap) * snap;
  const blended = theta + (snapped - theta) * strength * 0.55;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Suspension threads — ceiling to sphere top (Saraceno)
suspAnchors.forEach(sa => {
  for(let j=0; j<4; j++){
    const target = sphereSurf();
    target.y = Math.max(target.y, spherePos.y + sphereRadius*0.5);
    setLine(sa, target);
  }
});

// Suspension threads to keys — each key hangs from 1-3 threads from above
keyPositions.forEach(kp => {
  const nThreads = 1 + Math.floor(rng()*3);
  for(let j=0; j<nThreads; j++){
    const above = new THREE.Vector3(
      kp.x + (rng()-0.5)*1.5,
      kp.y + 3 + rng()*6,
      kp.z + (rng()-0.5)*1.5
    );
    setLine(above, kp);
  }
});

// Cat A: threads converging on sphere (40%) — circulatory vessel network
const catA = Math.floor(NUM_LINES * 0.40);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  // 15% stop short — presence-in-absence (Quayola, amplified)
  if(rng() < 0.15){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    const gap = 0.3 + rng()*1.8;
    target.add(dir.multiplyScalar(gap));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: threads between keys and sphere — keys caught in the web
const catB2 = Math.floor(NUM_LINES * 0.08);
for(let i=0; i<catB2 && li<NUM_LINES; i++){
  const ki = Math.floor(rng()*keyPositions.length);
  const kp = keyPositions[ki];
  if(rng() < 0.5){
    // Key to sphere surface
    setLine(kp, sphereSurf());
  } else {
    // Key to nearby anchor
    let best = null, bestD = Infinity;
    for(let j=0; j<15; j++){
      const ai = Math.floor(rng()*anchors.length);
      const d = kp.distanceTo(anchors[ai]);
      if(d < bestD && d > 0.3 && d < 7){ bestD = d; best = anchors[ai]; }
    }
    if(best) setLine(kp, best);
  }
}

// Cat C: wall-to-wall threads (22%) — architectural tension
const catC = Math.floor(NUM_LINES * 0.22);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 16 && rng() > 0.05){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat D: dendritic branching — short Y-forking chains (Entangled Others)
while(li < NUM_LINES - 150){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<14; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.0){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  if(rng() < 0.35 && li < NUM_LINES){
    const mid = a.clone().lerp(best, 0.35 + rng()*0.3);
    const brDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const brEnd = mid.clone().add(brDir.multiplyScalar(1.0 + rng()*2.2));
    if(!inVoid(brEnd)) setLine(mid, brEnd);
  }
}

// Fill remaining
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)) setLine(a, sphereSurf());
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper caught in threads
const NUM_FRAGS = 18;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03 + rng()*0.14;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz*(1.8+rng()*2.5), sz*0.012, sz*(0.6+rng()*1.0))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.012 + rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.2),
    transparent: true,
    opacity: 0.25 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.2 + rng()*0.6;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — slow interior drift, gentle sway, occasional upward gaze
const pathLen = 400;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;

  // Asymmetric interior path — weighted toward the key-dense side
  const x = spherePos.x + Math.sin(p)*6.5 + Math.sin(p*1.4+0.6)*3.0 + biasX*0.15;
  const y = spherePos.y + 0.8 + Math.sin(p*0.5+1.2)*4.2 + Math.cos(p*0.3)*2.0;
  const z = spherePos.z + Math.cos(p)*8.5 + Math.cos(p*0.8+1.8)*2.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Micro-breathing — imperceptible sway (<0.4% thread length variation)
  const arr = lineGeo.attributes.position.array;
  const bAmp = 0.003;
  const bFreq = 0.07;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const ph = bx*0.25 + by*0.6 + bz*0.12 + (i/6)*0.005;
    const s = Math.sin(t*bFreq + ph) * bAmp;
    const s2 = Math.sin(t*bFreq*0.7 + ph*1.3) * bAmp * 0.4;
    arr[i]   = bx + s*0.6 + s2*0.3;
    arr[i+1] = by + s*0.45;
    arr[i+2] = bz + s*0.3 + s2*0.2;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0022;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with slow pendular wander (sway)
  const look = spherePos.clone();
  look.x += Math.sin(t*0.009)*0.7;
  look.y += Math.cos(t*0.006)*0.4 + Math.sin(t*0.003)*0.2;
  camera.lookAt(look);

  // Sphere imperceptible pulse + gentle sway
  sphere.position.y = spherePos.y + Math.sin(t*0.008)*0.02;
  sphere.position.x = spherePos.x + Math.sin(t*0.005)*0.008;

  // Light wander
  pL.position.x = 2.5 + Math.sin(t*0.006)*1.8;
  pL.position.z = -3.0 + Math.cos(t*0.008)*1.4;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
