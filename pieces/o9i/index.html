<head>

<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1520; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">o9i</div>
<div class="hint">physics-driven inertia · slow temporal evolution · dusk ocean</div>
<div class="src">Memo Akten · Forms 2012 · sublime depth</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1520, 0.012);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 600);
camera.position.set(0, 8, 80);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1520, 1);
document.body.appendChild(renderer.domElement);

// Particle system with momentum and inertia
const N = 4200;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const accelerations = new Float32Array(N * 3);
const masses = new Float32Array(N);
const depths = new Float32Array(N); // layer depth for parallax
const phases = new Float32Array(N);

// Initialize particles in layered ocean volume
for (let i = 0; i < N; i++){
  const layer = Math.pow(Math.random(), 1.5); // bias toward foreground
  depths[i] = layer;
  
  const spread = 35 + layer * 45;
  positions[i*3]   = (Math.random() - 0.5) * spread;
  positions[i*3+1] = (Math.random() - 0.5) * spread * 0.4;
  positions[i*3+2] = (Math.random() - 0.5) * 80 - 20 + layer * 60;
  
  // Initial drift velocity — very gentle
  velocities[i*3]   = (Math.random() - 0.5) * 0.15;
  velocities[i*3+1] = (Math.random() - 0.5) * 0.08;
  velocities[i*3+2] = (Math.random() - 0.5) * 0.12;
  
  accelerations[i*3] = 0;
  accelerations[i*3+1] = 0;
  accelerations[i*3+2] = 0;
  
  masses[i] = 0.5 + Math.random() * 1.5;
  phases[i] = Math.random() * Math.PI * 2;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCameraZ: { value: camera.position.z }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCameraZ;
    attribute float mass;
    attribute float depth;
    attribute float phase;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // Slow breathing motion — particles drift up and down with different phases
      float breath = sin(uTime * 0.15 + phase) * 0.8;
      p.y += breath * (1.0 - depth * 0.5);
      
      // Oceanic palette: deep teal → cyan → pale blue
      vec3 c0 = vec3(0.08, 0.18, 0.28); // deep teal
      vec3 c1 = vec3(0.12, 0.35, 0.48); // ocean blue
      vec3 c2 = vec3(0.25, 0.55, 0.68); // cyan
      vec3 c3 = vec3(0.52, 0.72, 0.82); // pale blue
      
      float colorPhase = fract(phase / 6.28 + uTime * 0.03);
      vec3 col = mix(c0, c1, smoothstep(0.0, 0.33, colorPhase));
      col = mix(col, c2, smoothstep(0.33, 0.66, colorPhase));
      col = mix(col, c3, smoothstep(0.66, 1.0, colorPhase));
      
      // Depth-based color shift — deeper particles are darker
      col = mix(col * 0.4, col, depth);
      
      vCol = col;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float distFromCam = -mv.z;
      
      // Opacity based on distance and depth layer
      vAlpha = (1.0 - depth * 0.3) * smoothstep(120.0, 40.0, distFromCam);
      vAlpha *= 0.6 + 0.4 * sin(uTime * 0.2 + phase * 2.0);
      
      // Size inversely proportional to mass (lighter = larger visual presence)
      float sizeFactor = 2.0 / mass;
      gl_PointSize = (1.2 + sizeFactor * 0.8) * uPixel * (80.0 / distFromCam);
      gl_PointSize *= (1.0 + depth * 1.5); // foreground particles larger
      
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      
      // Soft radial falloff
      float intensity = 1.0 - smoothstep(0.0, 0.5, r);
      intensity = pow(intensity, 1.5);
      
      float alpha = intensity * vAlpha;
      gl_FragColor = vec4(vCol * alpha * 1.2, alpha);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('mass', new THREE.BufferAttribute(masses, 1));
geom.setAttribute('depth', new THREE.BufferAttribute(depths, 1));
geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Attractor — slow-moving focal point that particles drift toward
const attractor = new THREE.Vector3(0, 0, -10);
const attractorVel = new THREE.Vector3(0, 0, 0);
const attractorTarget = new THREE.Vector3();

function updateAttractorTarget(t){
  // Attractor traces a slow figure-eight in space
  attractorTarget.x = Math.sin(t * 0.08) * 18;
  attractorTarget.y = Math.sin(t * 0.12) * 8;
  attractorTarget.z = Math.cos(t * 0.06) * 25 - 15;
}

// Physics parameters — very low forces for slow integration
const ATTRACTOR_STRENGTH = 0.0008;
const DRAG = 0.992; // gentle drag
const REPULSION_DIST = 3.5;
const REPULSION_STRENGTH = 0.002;
const BOUNDARY = 60;
const BOUNDARY_STRENGTH = 0.001;

const tmpVec = new THREE.Vector3();

function updateParticles(dt){
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const mass = masses[i];
    
    // Reset acceleration
    accelerations[i*3] = 0;
    accelerations[i*3+1] = 0;
    accelerations[i*3+2] = 0;
    
    // Attraction to slow-moving attractor
    const dx = attractor.x - px;
    const dy = attractor.y - py;
    const dz = attractor.z - pz;
    const distSq = dx*dx + dy*dy + dz*dz;
    
    if (distSq > 1.0){
      const force = ATTRACTOR_STRENGTH / mass;
      accelerations[i*3]   += dx * force;
      accelerations[i*3+1] += dy * force;
      accelerations[i*3+2] += dz * force;
    }
    
    // Gentle repulsion from nearby particles
    for (let j = 0; j < N; j++){
      if (i === j || Math.random() > 0.15) continue; // sparse check
      
      const dx2 = positions[j*3] - px;
      const dy2 = positions[j*3+1] - py;
      const dz2 = positions[j*3+2] - pz;
      const distSq2 = dx2*dx2 + dy2*dy2 + dz2*dz2;
      
      if (distSq2 < REPULSION_DIST * REPULSION_DIST && distSq2 > 0.1){
        const dist = Math.sqrt(distSq2);
        const force = REPULSION_STRENGTH * (1.0 - dist / REPULSION_DIST) / mass;
        accelerations[i*3]   -= (dx2 / dist) * force;
        accelerations[i*3+1] -= (dy2 / dist) * force;
        accelerations[i*3+2] -= (dz2 / dist) * force;
      }
    }
    
    // Soft boundary containment
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > BOUNDARY * 0.6){
      const excess = distFromCenter - BOUNDARY * 0.6;
      const force = BOUNDARY_STRENGTH * excess / mass;
      accelerations[i*3]   -= (px / distFromCenter) * force;
      accelerations[i*3+1] -= (py / distFromCenter) * force;
      accelerations[i*3+2] -= (pz / distFromCenter) * force;
    }
    
    // Integrate velocity with drag
    velocities[i*3]   = (velocities[i*3] + accelerations[i*3] * dt) * DRAG;
    velocities[i*3+1] = (velocities[i*3+1] + accelerations[i*3+1] * dt) * DRAG;
    velocities[i*3+2] = (velocities[i*3+2] + accelerations[i*3+2] * dt) * DRAG;
    
    // Integrate position
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
  }
  
  geom.attributes.position.needsUpdate = true;
}

// Camera tracks centroid with heavy smoothing — feels like slow dolly movement
const centroid = new THREE.Vector3();
const cameraTarget = new THREE.Vector3(0, 8, 80);
const cameraLookTarget = new THREE.Vector3(0, 0, -10);

function updateCamera(t){
  // Compute centroid
  centroid.set(0, 0, 0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  // Camera target: orbit very slowly around centroid
  const orbitRadius = 75;
  const orbitHeight = 12;
  const angle = t * 0.015;
  cameraTarget.x = centroid.x + Math.cos(angle) * orbitRadius * 0.3;
  cameraTarget.y = centroid.y + Math.sin(t * 0.008) * orbitHeight + 6;
  cameraTarget.z = centroid.z + Math.sin(angle) * orbitRadius * 0.5 + 65;
  
  // Smooth camera movement — LERP with very low alpha for slow integration
  camera.position.lerp(cameraTarget, 0.008);
  
  // Look target also smoothly follows centroid
  cameraLookTarget.lerp(centroid, 0.012);
  camera.lookAt(cameraLookTarget);
  
  uniforms.uCameraZ.value = camera.position.z;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
const startTime = performance.now();

function loop(){
  const now = performance.now();
  const rawDt = (now - lastTime) / 1000;
  const dt = Math.min(rawDt, 0.05); // cap for stability
  lastTime = now;
  
  const t = (now - startTime) / 1000;
  
  uniforms.uTime.value = t;
  
  // Update attractor target and smoothly move attractor toward it
  updateAttractorTarget(t);
  attractorVel.x += (attractorTarget.x - attractor.x) * 0.002;
  attractorVel.y += (attractorTarget.y - attractor.y) * 0.002;
  attractorVel.z += (attractorTarget.z - attractor.z) * 0.002;
  attractorVel.multiplyScalar(0.98); // attractor has its own drag
  attractor.add(attractorVel);
  
  updateParticles(dt * 30); // scale for stable physics
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
