<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mut · parametric shells</title>
<!-- MOTION: pulsation, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size:11px; letter-spacing:0.04em; z-index:10; }
  .panel {
    position:fixed; top:14px; right:14px; z-index:20;
    background: rgba(12,6,22,0.82); border:1px solid rgba(120,80,170,0.25);
    border-radius:6px; padding:14px 16px 10px; width:210px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .panel h3 { margin:0 0 10px; font-size:10px; text-transform:uppercase; letter-spacing:0.12em;
              color:#8a7a9e; font-weight:400; }
  .param { margin-bottom:8px; }
  .param label { display:flex; justify-content:space-between; font-size:10px; color:#9a8aae;
                 letter-spacing:0.04em; margin-bottom:3px; }
  .param label span.val { color:#c8b8e0; }
  .param input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background: rgba(100,70,150,0.3); border-radius:2px; outline:none; cursor:pointer;
  }
  .param input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%;
    background:#b090d0; border:none; cursor:pointer;
  }
  .param input[type=range]::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%;
    background:#b090d0; border:none; cursor:pointer;
  }
  button.mic { position:fixed; left:14px; bottom:32px; background:none; border:1px solid rgba(120,80,170,0.35);
               color:#9a8aae; padding:4px 10px; border-radius:3px; cursor:pointer;
               font-family:inherit; font-size:10px; letter-spacing:0.06em; z-index:10; }
  button.mic:hover { border-color:rgba(160,120,210,0.5); color:#c8b8e0; }
</style>
</head>
<body>
<div class="panel">
  <h3>parameters</h3>
  <div class="param">
    <label>shell spread <span class="val" id="v0">1.00</span></label>
    <input type="range" id="p0" min="0.3" max="2.5" step="0.01" value="1.0">
  </div>
  <div class="param">
    <label>swirl <span class="val" id="v1">1.00</span></label>
    <input type="range" id="p1" min="0" max="3" step="0.01" value="1.0">
  </div>
  <div class="param">
    <label>pulse strength <span class="val" id="v2">0.90</span></label>
    <input type="range" id="p2" min="0" max="2.5" step="0.01" value="0.9">
  </div>
  <div class="param">
    <label>hue shift <span class="val" id="v3">0.00</span></label>
    <input type="range" id="p3" min="0" max="1" step="0.01" value="0.0">
  </div>
  <div class="param">
    <label>point scale <span class="val" id="v4">1.00</span></label>
    <input type="range" id="p4" min="0.2" max="3" step="0.01" value="1.0">
  </div>
  <div class="param">
    <label>orbit speed <span class="val" id="v5">1.00</span></label>
    <input type="range" id="p5" min="0" max="4" step="0.01" value="1.0">
  </div>
</div>
<button class="mic" id="micBtn">+ mic</button>
<div class="id">xm3</div>
<div class="hint" id="hint">synthetic · drag sliders to sculpt</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 4 + s * 2.4;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uBands:      { value: uBands },
  uTreble:     { value: 0 },
  uSpread:     { value: 1.0 },
  uSwirl:      { value: 1.0 },
  uPulse:      { value: 0.9 },
  uHueShift:   { value: 0.0 },
  uPointScale: { value: 1.0 },
  uOrbitSpeed: { value: 1.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    uniform float uSpread;
    uniform float uSwirl;
    uniform float uPulse;
    uniform float uHueShift;
    uniform float uPointScale;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;

    vec3 hueRotate(vec3 c, float angle){
      float s = sin(angle * 6.2832);
      float co = cos(angle * 6.2832);
      mat3 m = mat3(
        0.299+0.701*co+0.168*s, 0.587-0.587*co+0.330*s, 0.114-0.114*co-0.497*s,
        0.299-0.299*co-0.328*s, 0.587+0.413*co+0.035*s, 0.114-0.114*co+0.292*s,
        0.299-0.300*co+1.250*s, 0.587-0.588*co-1.050*s, 0.114+0.886*co-0.203*s
      );
      return clamp(m * c, 0.0, 1.0);
    }

    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;
      vEnergy = e;

      vec3 p = position;
      float baseR = 4.0 + shellIdx * 2.4;
      float spreadR = 4.0 + shellIdx * 2.4 * uSpread;
      p *= spreadR / max(baseR, 0.01);

      float r = length(p);
      vec3 dir = p / max(r, 0.001);
      float pulse = 1.0 + e * uPulse;
      p = dir * r * pulse;

      float t = uTime * 0.4 + seed * 6.28 + shellIdx * 0.7;
      vec3 perp = normalize(cross(dir, vec3(0,1,0) + 0.1*sin(seed*9.0)));
      p += perp * sin(t) * (0.4 + e * 1.2) * uSwirl;

      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan = vec3(0.25, 0.85, 0.95);
      float k = clamp(shellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vec3 baseCol = mix(amber, cyan, k);
      baseCol = hueRotate(baseCol, uHueShift);
      vCol = baseCol * (0.6 + e * 1.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 2.4 * e) * uPixel * (50.0 / dist) * uPointScale;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// slider wiring
const sliders = [
  { id:'p0', vid:'v0', key:'uSpread' },
  { id:'p1', vid:'v1', key:'uSwirl' },
  { id:'p2', vid:'v2', key:'uPulse' },
  { id:'p3', vid:'v3', key:'uHueShift' },
  { id:'p4', vid:'v4', key:'uPointScale' },
  { id:'p5', vid:'v5', key:'uOrbitSpeed' }
];
sliders.forEach(s => {
  const el = document.getElementById(s.id);
  const vl = document.getElementById(s.vid);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    uniforms[s.key].value = v;
    vl.textContent = v.toFixed(2);
  });
});

// audio (non-blocking — particles show immediately)
const hint = document.getElementById('hint');
const micBtn = document.getElementById('micBtn');
let analyser = null, freqData = null;
async function startAudio(){
  micBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 shells · drag sliders';
  } catch (e) {
    hint.textContent = 'mic denied · synthetic mode · drag sliders';
  }
}
micBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  const orb = uniforms.uOrbitSpeed.value;
  points.rotation.y = t * 0.04 * orb;
  points.rotation.x = Math.sin(t * 0.06 * orb) * 0.12;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t*1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t*7.0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
