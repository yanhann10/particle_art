<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9go · tender geometric garland (Manolo Gamboa Naon)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4efe8; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#3a3330; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; color:#3a3330; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#3a3330; }
</style>
<!-- MOTION: sway, intensity: calm -->
</head>
<body>
<div class="id">9go</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Manolo Gamboa Naon · geometric garland · hard-edged primitives</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Manolo Gamboa Naon direction: replace organic differential-growth with
   hard-edged geometric primitives assembled into a hanging garland.
   5 color blocks, no gradients, no noise, pure geometric hierarchy. */

const BG = 0xf4efe8;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// Color palette: Gonzalez-Torres tender pastels reinterpreted as flat blocks
const PALETTE = [
  0xd4867d, // muted coral
  0x7a9ca5, // slate blue
  0xe8c89f, // warm beige
  0xa87d72, // dusty rose
  0x5a6b6e  // charcoal
];

let paused = false;
addEventListener('click', () => { paused = !paused; });

// Geometric chain: alternating primitives hung in a catenary curve
const CHAIN_LENGTH = 45;
const SEGMENT_WIDTH = 0.7;
const CATENARY_SPAN = 14;
const CATENARY_SAG = 3.2;

// Shape library: hard-edged primitives
function createTriangle(color) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0.4);
  shape.lineTo(-0.35, -0.2);
  shape.lineTo(0.35, -0.2);
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createCircle(color) {
  const geom = new THREE.CircleGeometry(0.3, 6); // hexagon
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createRing(color) {
  const geom = new THREE.RingGeometry(0.2, 0.32, 6);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createSquare(color) {
  const geom = new THREE.PlaneGeometry(0.5, 0.5);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

function createHalfCircle(color) {
  const shape = new THREE.Shape();
  shape.absarc(0, 0, 0.3, 0, Math.PI, false);
  shape.lineTo(-0.3, 0);
  shape.closePath();
  const geom = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  return new THREE.Mesh(geom, mat);
}

const shapeFactories = [
  createTriangle,
  createCircle,
  createRing,
  createSquare,
  createHalfCircle
];

// Build the chain
const chain = [];
for (let i = 0; i < CHAIN_LENGTH; i++) {
  const t = (i / (CHAIN_LENGTH - 1)) * 2 - 1; // -1 to 1
  const x = t * (CATENARY_SPAN / 2);
  // catenary formula: y = a*cosh(x/a) - a
  const a = CATENARY_SPAN / (2 * Math.asinh(CATENARY_SAG / CATENARY_SPAN));
  const y = -a * Math.cosh(x / a) + a;

  const colorIndex = Math.floor((i / CHAIN_LENGTH) * PALETTE.length);
  const color = PALETTE[colorIndex];
  const shapeType = i % shapeFactories.length;
  const mesh = shapeFactories[shapeType](color);
  
  mesh.position.set(x, y, 0);
  mesh.userData.index = i;
  mesh.userData.phase = i * 0.3;
  chain.push(mesh);
  scene.add(mesh);
}

// Connecting lines between shapes (thin wire)
const lineMat = new THREE.LineBasicMaterial({ color: 0x9a8d85, transparent: true, opacity: 0.4 });
const lineGeom = new THREE.BufferGeometry();
const linePositions = new Float32Array((CHAIN_LENGTH - 1) * 2 * 3);
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const line = new THREE.Line(lineGeom, lineMat);
scene.add(line);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;

  if (!paused) {
    // Gentle sway — NO NOISE, pure sinusoidal motion (Gonzalez-Torres quiet register)
    for (let i = 0; i < CHAIN_LENGTH; i++) {
      const mesh = chain[i];
      const baseX = ((i / (CHAIN_LENGTH - 1)) * 2 - 1) * (CATENARY_SPAN / 2);
      const a = CATENARY_SPAN / (2 * Math.asinh(CATENARY_SAG / CATENARY_SPAN));
      const baseY = -a * Math.cosh(baseX / a) + a;

      // Sway amplitude decreases toward endpoints (pinned effect)
      const swayFactor = 1 - Math.abs((i / (CHAIN_LENGTH - 1)) * 2 - 1) ** 2;
      const swayX = Math.sin(t * 0.5 + mesh.userData.phase) * 0.12 * swayFactor;
      const swayY = Math.cos(t * 0.4 + mesh.userData.phase) * 0.08 * swayFactor;

      mesh.position.x = baseX + swayX;
      mesh.position.y = baseY + swayY;

      // Gentle rotation around Z axis only
      mesh.rotation.z = Math.sin(t * 0.6 + mesh.userData.phase) * 0.08;
    }

    // Update connecting lines
    for (let i = 0; i < CHAIN_LENGTH - 1; i++) {
      const a = chain[i];
      const b = chain[i + 1];
      linePositions[i * 6]     = a.position.x;
      linePositions[i * 6 + 1] = a.position.y;
      linePositions[i * 6 + 2] = a.position.z;
      linePositions[i * 6 + 3] = b.position.x;
      linePositions[i * 6 + 4] = b.position.y;
      linePositions[i * 6 + 5] = b.position.z;
    }
    lineGeom.attributes.position.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
