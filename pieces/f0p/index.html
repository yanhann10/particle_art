<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f0p · hyperstition wire</title>
<!-- MOTION: snap, intensity: explosive -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .caption { position:fixed; left:50%; top:50%; transform:translate(-50%, -50%);
             font-size:15px; font-weight:700; letter-spacing:0.12em; opacity:0; color:#00ff41;
             text-transform:uppercase; pointer-events:none; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">f0p</div>
<div class="caption" id="caption">THE OUTSIDE WILL HAVE BEEN</div>
<div class="src">CCRU · hyperstition · wire contagion · 160 BPM</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* CCRU HYPERSTITION WIRE — infection-grade differential growth at jungle tempo.
   The wire is an entity propagating itself. 160 BPM snap events. Acid-rave palette.
   Audio-reactive if mic granted (TR-808 bass-band triggers visual hits). No soft edges. */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// --- wire growth: fast, aggressive, self-replicating ---
const MAX_VERTS = 8000;
const ATTRACT   = 0.12;
const REPEL_R   = 0.22;
const REPEL_STR = 0.18;
const PRESSURE  = 0.008;
const MAX_D     = 0.28;

const verts = [];
const NV0 = 80;
for (let i = 0; i < NV0; i++) {
  const a = (i / NV0) * Math.PI * 2;
  verts.push({
    x: Math.cos(a) * 2.5,
    z: Math.sin(a) * 2.5,
    y: (Math.random() - 0.5) * 0.4,
    age: 0,
    snap: 0
  });
}

const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step() {
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : verts[n - 1];
    const next = i < n - 1 ? verts[i + 1] : verts[0];
    const v = verts[i];
    dx[i] += (prev.x - v.x) * ATTRACT;
    dz[i] += (prev.z - v.z) * ATTRACT;
    dy[i] += (prev.y - v.y) * ATTRACT;
    dx[i] += (next.x - v.x) * ATTRACT;
    dz[i] += (next.z - v.z) * ATTRACT;
    dy[i] += (next.y - v.y) * ATTRACT;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i];
    verts[i].z += dz[i];
    verts[i].y += dy[i];
    verts[i].age += 0.0008;
    verts[i].snap = Math.max(0, verts[i].snap - 0.08);
  }

  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5,
        z: (a.z + b.z) * 0.5,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.6,
        snap: 0
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- 160 BPM snap events (375ms period) ---
const BPM = 160;
const SNAP_PERIOD = 60000 / BPM;
let lastSnap = performance.now();
let snapActive = false;
const captionEl = document.getElementById('caption');
const captions = [
  'THE OUTSIDE WILL HAVE BEEN',
  'CONTAGION IS IDENTITY',
  'NUMOGRAM ASSEMBLES ITSELF',
  'TIME RUNS BACKWARDS FROM THE SINGULARITY',
  'CAPITAL ESCAPES CONTROL'
];
let captionIndex = 0;

// --- audio reactive (optional) ---
let audioCtx, analyser, freqData, micGranted = false;
navigator.mediaDevices?.getUserMedia({ audio: true }).then(stream => {
  audioCtx = new AudioContext();
  const source = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  source.connect(analyser);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  micGranted = true;
}).catch(() => {});

function getBassEnergy() {
  if (!micGranted) return 0;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let i = 0; i < 8; i++) sum += freqData[i];
  return sum / (8 * 255);
}

// --- rendering: 40k particles, hard-edge acid palette ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge   = new Float32Array(N_RENDER);
const rSnap  = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('snap',     new THREE.BufferAttribute(rSnap, 1));

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uSnapActive: { value: 0 },
  uBassHit:    { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uSnapActive;
    uniform float uBassHit;
    attribute float seed;
    attribute float age;
    attribute float snap;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;

      // rapid jitter on snap
      float jit = uSnapActive * 0.03 * sin(seed * 100.0);
      p.x += jit;
      p.z += cos(seed * 80.0) * jit;

      // bass-reactive displacement
      p.y += uBassHit * 0.08 * sin(seed * 50.0);

      // acid palette: green / cyan / magenta on black, no soft falloff
      vec3 acidGreen   = vec3(0.0, 1.0, 0.25);
      vec3 cyan        = vec3(0.0, 1.0, 1.0);
      vec3 magenta     = vec3(1.0, 0.0, 0.8);
      float k = fract(age * 3.0 + seed);
      vCol = k < 0.33 ? acidGreen : (k < 0.66 ? cyan : magenta);

      // snap flash: instant brightness jump
      float snapBoost = snap * 1.8;
      vCol += snapBoost;

      vAlpha = 0.85 + uSnapActive * 0.15 + uBassHit * 0.2;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 2.2 * uPixel * (40.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // hard-edge square-wave brightness: no smooth glow
      float a = step(r, 0.22) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// wire line: bright acid green on snap
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x00ff41,
  transparent: true,
  opacity: 0.6
});
const wireLine = new THREE.LineLoop(wireGeom, wireMat);
scene.add(wireLine);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

for (let s = 0; s < 200; s++) step();

const start = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;

  // 160 BPM snap event
  if (now - lastSnap > SNAP_PERIOD) {
    lastSnap = now;
    snapActive = true;
    captionEl.textContent = captions[captionIndex];
    captionIndex = (captionIndex + 1) % captions.length;
    captionEl.style.opacity = 1;
    setTimeout(() => { captionEl.style.opacity = 0; }, 120);

    // trigger snap on all vertices
    for (let i = 0; i < verts.length; i++) {
      if (Math.random() < 0.15) verts[i].snap = 1.0;
    }
    setTimeout(() => { snapActive = false; }, 80);
  }
  uniforms.uSnapActive.value = snapActive ? 1 : 0;

  // audio reactive
  const bassHit = getBassEnergy();
  uniforms.uBassHit.value = bassHit;
  if (bassHit > 0.6) {
    for (let i = 0; i < verts.length; i++) {
      if (Math.random() < 0.08) verts[i].snap = 0.8;
    }
  }

  // FAST growth: 12 steps per frame (jungle tempo)
  for (let s = 0; s < 12; s++) step();

  const n = verts.length;

  // wire update
  for (let i = 0; i < n; i++) {
    wirePositions[i * 3]     = verts[i].x;
    wirePositions[i * 3 + 1] = verts[i].y;
    wirePositions[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // camera slow rotation
  camera.position.x = Math.cos(t * 0.08) * 18;
  camera.position.z = Math.sin(t * 0.08) * 18;
  camera.lookAt(0, 0, 0);

  // distribute particles
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    const L = Math.hypot(b.x - a.x, b.z - a.z, b.y - a.y);
    lengths.push(L);
    total += L;
  }
  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n && written < N_RENDER; i++) {
      const share = (i === n - 1)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
      const a = verts[i], b = verts[(i + 1) % n];
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        rPos[written * 3]     = a.x + (b.x - a.x) * u;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * u;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * u;
        rAge[written]  = Math.max(a.age, b.age);
        rSnap[written] = Math.max(a.snap, b.snap);
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.snap.needsUpdate = true;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
