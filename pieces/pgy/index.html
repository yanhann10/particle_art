<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgy · Shiota — Uncertain Journey</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">pgy</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040201, 0.0014);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x060101, 0.004));
const warmL = new THREE.PointLight(0xff4518, 0.018, 40, 2.0);
warmL.position.set(0.3, 6.5, -1.0);
scene.add(warmL);

let seed = 7361029;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:28, h:22, d:24 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── SPHERE — the still center. Shiota's Uncertain Journey (2016):
// 750,000 meters of red yarn descending onto skeletal boat hulls at
// Blain|Southern Berlin. Here the sphere is the hull's ghost — the
// vessel reduced to its purest form, suspended in thread like a heart
// in a circulatory web.
const sphereCenter = new THREE.Vector3(0.0, 0.4, 0.0);
const sphereR = 1.7;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xede0cc, emissive: 0xede0cc, emissiveIntensity: 0.75,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.30, fog: true
});
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16), sphereMat
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

function surfPt(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=sphereR*(0.97+rng()*0.06);
  return new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r,
    sphereCenter.z+Math.cos(v)*r
  );
}

// ── KEY FRAGMENTS — 14 small crosses caught in the web
// Venice 2015: 50,000 keys donated by strangers, each carrying
// the memory of a door, a home, a person
const fragments = [];
for(let i=0; i<14; i++){
  const pts = [];
  const ks = 0.04+rng()*0.1;
  // cross shape — a key silhouette
  pts.push(-ks,0,0, ks,0,0);
  pts.push(0,-ks*1.6,0, 0,ks*0.6,0);
  // small tooth at bottom
  pts.push(-ks*0.4,-ks*1.4,0, -ks*0.4,-ks*1.6,0);
  if(rng()>0.5) pts.push(ks*0.3,-ks*1.2,0, ks*0.3,-ks*1.5,0);
  const fGeo = new THREE.BufferGeometry();
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0604, transparent:true, opacity:0.4
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=2.8+rng()*7.5;
  fMesh.position.set(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.75,
    sphereCenter.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28,rng()*6.28,rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── CYLINDRICAL VOID ZONES — vertical channels to look through
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.8;
  const vr=5.0+rng()*3.5;
  voids.push({
    x:sphereCenter.x+Math.cos(a)*vr,
    z:sphereCenter.z+Math.sin(a)*vr,
    r:1.1+rng()*0.8
  });
}
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dz=p.z-v.z;
    if(dx*dx+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ICOSAHEDRAL ANCHOR GRID — Manfred Mohr: let geometry generate topology
// Vertices of a subdivided icosahedron projected at multiple radii,
// compressed vertically for architectural room-feel
const icoGeo = new THREE.IcosahedronGeometry(1, 2);
const icoPos = icoGeo.attributes.position;
const icoNormals = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNormals.push(v); }
}

const anchors = [];
const shellRadii = [3.2, 5.5, 8.0, 11.0, 13.5];
for(const sr of shellRadii){
  for(const n of icoNormals){
    const pt = new THREE.Vector3(
      sphereCenter.x + n.x*sr,
      sphereCenter.y + n.y*sr*0.82,
      sphereCenter.z + n.z*sr
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw-0.3 && Math.abs(pt.y)<hh-0.3 && Math.abs(pt.z)<hd-0.3){
      anchors.push(pt);
    }
  }
}
// Wall anchors for long spans
for(let i=0; i<50; i++){
  const wp=wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── BUILD THREAD NETWORK — 20,000 segments, 2 core rules + support
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li]=Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li]=cat;
  li++;
}

// ── SUSPENSION — 10 taut threads from ceiling to sphere crown
// Saraceno: make the hanging physically legible
const suspPts = [];
for(let i=0; i<10; i++){
  const a=(i/10)*Math.PI*2+(rng()-0.5)*0.12;
  const topSpread=0.15+rng()*0.3;
  suspPts.push(
    sphereCenter.x+Math.cos(a)*topSpread*4.0, hh, sphereCenter.z+Math.sin(a)*topSpread*4.0,
    sphereCenter.x+Math.cos(a)*0.05, sphereCenter.y+sphereR*0.98, sphereCenter.z+Math.sin(a)*0.05
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts),3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color:0x0e0404, transparent:true, opacity:0.22
})));

// ── RULE 1: CONVERGENCE — every anchor reaches toward the sphere surface
// Casey Reas rule (1): anchor-to-nearest-object-surface
// The fundamental gesture — the entire room leans toward the remembered form
for(let i=0; i<anchors.length && li<NUM_LINES; i++){
  const a = anchors[i];
  const d = a.distanceTo(sphereCenter);
  // Closer anchors send more threads — density follows proximity
  const count = d<4?5 : d<7?3 : d<10?2 : 1;
  for(let j=0; j<count && li<NUM_LINES; j++){
    const target = surfPt();
    // 10% yearning threads — stop short, the gap between reaching and touching
    if(rng()<0.10){
      const dir = a.clone().sub(target).normalize();
      const gap = 0.2+rng()*1.2;
      setLine(a, target.clone().add(dir.multiplyScalar(gap)), 1);
    } else {
      setLine(a, target, 0);
    }
  }
}

// ── RULE 2: PROXIMITY WEB — anchor-to-anchor within threshold
// Casey Reas rule (2): anchor-to-anchor-if-within-threshold
// The tissue of relation — connection not mediated by the center
const THRESH = 5.5;
let lat=0, att=0;
while(lat<6500 && li<NUM_LINES && att<50000){
  att++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<16; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.6 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  lat++;
}

// ── GRAVITY DRAPE — threads hanging from lower hemisphere
// Weight pulling down, the room's grief made visible
for(let i=0; i<1200 && li<NUM_LINES; i++){
  const u=rng()*Math.PI*2;
  const v=Math.PI*0.5+rng()*Math.PI*0.5;
  const sp = new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y+Math.cos(v)*sphereR,
    sphereCenter.z+Math.sin(v)*Math.sin(u)*sphereR
  );
  const dropLen=1.2+rng()*4.5;
  const drift=(rng()-0.5)*0.4;
  setLine(sp, new THREE.Vector3(sp.x+drift, sp.y-dropLen, sp.z+(rng()-0.5)*0.3), 3);
}

// ── WALL SPANS — the architecture itself woven shut
while(li<NUM_LINES){
  const a=wallPt();
  const b=rng()<0.4 ? surfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — single arterial red #c20018
// Per-category opacity (Lia Halloran): material differentiation through density
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catAlpha = [0.085, 0.065, 0.042, 0.032];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.12, 1.0-d*0.032);
  const cat = lineCat[i];
  const a = catAlpha[cat]*distFade;
  const warmShift = d<4.5 ? 0.018*(1.0-d/4.5) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*a;
    colors[i*6+v*3+1] = bG*a;
    colors[i*6+v*3+2] = bB*a*0.5;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — a pilgrimage: enter the web from outside,
// spiral inward, pass beneath the sphere looking up through
// the gravity drape, rise through the convergence zone, recede
const pathLen = 3000;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;
  let x, y, z;

  if(t<0.10){
    // Distant approach — the web is a dark architecture, sphere a faint ember
    const lt=t/0.10;
    x = cx+11.0-lt*3.5;
    y = cy+3.0-lt*1.0;
    z = cz+7.0-lt*2.0;
  } else if(t<0.22){
    // Enter through a void channel — threads part then close around you
    const lt=(t-0.10)/0.12;
    const rH=7.5-lt*3.0;
    const angle=lt*Math.PI*0.5+0.5;
    x = cx+Math.cos(angle)*rH;
    y = cy+2.0-lt*1.5;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.38){
    // Circle close — inside the dense convergence zone, thread-light accumulates
    const lt=(t-0.22)/0.16;
    const rH=4.2+Math.sin(lt*Math.PI)*0.6;
    const angle=lt*Math.PI*1.1+1.2;
    x = cx+Math.cos(angle)*rH;
    y = cy+0.5+Math.sin(lt*Math.PI*0.7)*1.2;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.50){
    // Descend beneath — look up through gravity drape at the luminous form
    const lt=(t-0.38)/0.12;
    x = cx+Math.sin(lt*Math.PI*0.4+2.6)*3.8;
    y = cy+0.5-lt*6.5;
    z = cz+Math.cos(lt*Math.PI*0.4+2.6)*3.5;
  } else if(t<0.62){
    // Below the sphere — the drape threads hang around you like rain
    const lt=(t-0.50)/0.12;
    const rH=3.6+lt*0.8;
    const angle=lt*Math.PI*0.6+3.2;
    x = cx+Math.cos(angle)*rH;
    y = cy-6.0+lt*3.0;
    z = cz+Math.sin(angle)*rH;
  } else if(t<0.76){
    // Rise through the center — ascending through the web's body
    const lt=(t-0.62)/0.14;
    x = cx+Math.sin(lt*Math.PI+4.0)*2.8;
    y = cy-3.0+lt*9.0;
    z = cz+Math.cos(lt*Math.PI+4.0)*3.0;
  } else if(t<0.88){
    // Above — the web is a canopy, the sphere below like a pearl in a nest
    const lt=(t-0.76)/0.12;
    const rH=3.0+lt*3.0;
    const angle=lt*Math.PI*0.7+5.2;
    x = cx+Math.cos(angle)*rH;
    y = cy+6.0-lt*2.5;
    z = cz+Math.sin(angle)*rH;
  } else {
    // Recede — the form dissolves into architecture, presence fading
    const lt=(t-0.88)/0.12;
    const rH=6.0+lt*6.0;
    x = cx+Math.cos(lt*Math.PI*0.25+6.0)*rH;
    y = cy+3.5-lt*1.5;
    z = cz+Math.sin(lt*Math.PI*0.25+6.0)*rH;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, imperceptible
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.03+basePositions[idx+1]*0.04+i*0.00012;
    const breath = Math.sin(elapsed*0.0012+phase)*0.000022;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.07;
      arr[vi+1] = basePositions[vi+1] + breath*0.05;
      arr[vi+2] = basePositions[vi+2] + breath*0.06;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere pulse — single slow heartbeat
  sphereMat.emissiveIntensity = 0.75+Math.sin(elapsed*0.00035)*0.06;

  // Camera dolly
  const speed = 0.000042;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0002)*0.05;
  look.y += Math.cos(elapsed*0.00018)*0.1-0.03;
  look.z += Math.sin(elapsed*0.00035+0.6)*0.04;
  camera.lookAt(look);

  warmL.intensity = 0.018+Math.sin(elapsed*0.00012)*0.003;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
