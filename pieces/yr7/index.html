<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yr7 · Spider Web Scan (Saraceno)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">yr7 · Spider Web Scan</div>
<div class="hint">drag to orbit · scroll to zoom</div>
<div class="src">Tomás Saraceno · 3D web tomography · sparse luminous filaments</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Saraceno spider-web scan: sparse 3D graph in pitch black
// ~300 anchors, nearest-neighbor + occasional long-strand connectivity
// Nodes as tiny pearlescent sprites, edges as thin additive lines
// Gentle spring + wind perturbation — the web breathes

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 0, 0);

// Generate anchor nodes — clustered in 3–4 regions with sparse bridging
const N = 300;
const anchors = [];
const velocities = [];

// mulberry32
let seed = 0xABC1234;
function rng(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// 3 cluster centers
const clusterCenters = [
  new THREE.Vector3(-4, 2, 1),
  new THREE.Vector3(2, -1, -2),
  new THREE.Vector3(1, 3, 3),
];

for (let i = 0; i < N; i++){
  const cIdx = Math.floor(rng() * clusterCenters.length);
  const c = clusterCenters[cIdx];
  // scatter within radius 3–4 of cluster center
  const r = 3.0 + rng() * 1.5;
  const theta = rng() * Math.PI * 2;
  const phi = Math.acos(2 * rng() - 1);
  const x = c.x + r * Math.sin(phi) * Math.cos(theta);
  const y = c.y + r * Math.sin(phi) * Math.sin(theta);
  const z = c.z + r * Math.cos(phi);
  anchors.push(new THREE.Vector3(x, y, z));
  velocities.push(new THREE.Vector3(0, 0, 0));
}

// Build connectivity — nearest 2–4 neighbors + a few long strands
const edges = [];
const edgeSeeds = [];
for (let i = 0; i < N; i++){
  const dists = anchors.map((a, j) => ({ j, d: anchors[i].distanceTo(a) }));
  dists.sort((a, b) => a.d - b.d);
  const k = 2 + Math.floor(rng() * 3); // 2–4 neighbors
  for (let m = 1; m <= k && m < dists.length; m++){
    const j = dists[m].j;
    if (j > i) { // avoid duplicate
      edges.push([i, j]);
      edgeSeeds.push(rng());
    }
  }
  // occasional long strand
  if (rng() < 0.04){
    const farIdx = Math.floor(dists.length * 0.7 + rng() * dists.length * 0.3);
    if (farIdx < dists.length){
      const j = dists[farIdx].j;
      if (j > i){
        edges.push([i, j]);
        edgeSeeds.push(rng());
      }
    }
  }
}

// Line geometry for threads
const linePositions = new Float32Array(edges.length * 6);
const lineMat = new THREE.LineBasicMaterial({
  color: 0xc8d4e0,
  transparent: true,
  opacity: 0.18,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const lineMesh = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lineMesh);

function updateLineGeometry(){
  for (let i = 0; i < edges.length; i++){
    const [a, b] = edges[i];
    const pa = anchors[a];
    const pb = anchors[b];
    linePositions[i*6]   = pa.x;
    linePositions[i*6+1] = pa.y;
    linePositions[i*6+2] = pa.z;
    linePositions[i*6+3] = pb.x;
    linePositions[i*6+4] = pb.y;
    linePositions[i*6+5] = pb.z;
  }
  lineGeom.attributes.position.needsUpdate = true;
}
updateLineGeometry();

// Nodes as instanced spheres (tiny pearlescent points)
const nodeSphereGeom = new THREE.SphereGeometry(0.05, 6, 6);
const nodeInstances = new THREE.InstancedMesh(
  nodeSphereGeom,
  new THREE.MeshBasicMaterial({
    color: 0xe0edf5,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  }),
  N
);
scene.add(nodeInstances);

const mat = new THREE.Matrix4();
for (let i = 0; i < N; i++){
  mat.setPosition(anchors[i]);
  nodeInstances.setMatrixAt(i, mat);
}
nodeInstances.instanceMatrix.needsUpdate = true;

// Soft spring + wind field for breathing motion
const restPositions = anchors.map(a => a.clone());
const SPRING_K = 0.008;
const DAMPING = 0.92;
const WIND_SCALE = 0.006;

function updatePhysics(t){
  // wind field: Perlin-like offset with time
  for (let i = 0; i < N; i++){
    const rest = restPositions[i];
    const curr = anchors[i];
    // spring force back to rest
    const dx = rest.x - curr.x;
    const dy = rest.y - curr.y;
    const dz = rest.z - curr.z;
    velocities[i].x += dx * SPRING_K;
    velocities[i].y += dy * SPRING_K;
    velocities[i].z += dz * SPRING_K;
    // wind: low-frequency sine waves
    const wx = Math.sin(t * 0.2 + curr.y * 0.3) * WIND_SCALE;
    const wy = Math.cos(t * 0.15 + curr.x * 0.25) * WIND_SCALE;
    const wz = Math.sin(t * 0.18 + curr.z * 0.35) * WIND_SCALE;
    velocities[i].x += wx;
    velocities[i].y += wy;
    velocities[i].z += wz;
    // damping
    velocities[i].multiplyScalar(DAMPING);
    curr.add(velocities[i]);
  }
  // update instanced transforms
  for (let i = 0; i < N; i++){
    mat.setPosition(anchors[i]);
    nodeInstances.setMatrixAt(i, mat);
  }
  nodeInstances.instanceMatrix.needsUpdate = true;
  updateLineGeometry();
}

// Slow camera dolly — drift through the web
const CAM_RADIUS = 18;
const CAM_SPEED = 0.04;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  updatePhysics(t);
  
  // camera drift if user hasn't interacted recently
  if (!controls.autoRotate && t > 3.0 && controls.getAzimuthalAngle() === controls.getAzimuthalAngle()){
    // subtle orbital drift
    const angle = t * CAM_SPEED;
    camera.position.x = CAM_RADIUS * Math.cos(angle) * 0.7;
    camera.position.z = CAM_RADIUS * Math.sin(angle);
    camera.position.y = 2 + Math.sin(t * 0.08) * 3;
    camera.lookAt(0, 0, 0);
  }
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
