<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: fold, intensity: gentle -->
<!-- INTENT: Lucy as faceted metal Bicho — hinged geometric plates breathe and fold like Lygia Clark's participatory sculptures, a figure between solid form and kinetic potential -->
<title>46a · geometric · lygia clark bicho lucy</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0b0a0d; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:13px;
             color:#cdd2dc; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · folding into geometry …</div>
<div class="id">46a · geometric · lygia clark bicho</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 2, 32);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0a0d, 1);
document.body.appendChild(renderer.domElement);

/* ── atmosphere: subtle gradient backdrop (gallery floor light) ── */
const bgGeo = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false, transparent: true,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.999,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float g = smoothstep(0.0, 0.55, vUv.y);
      vec3 col = mix(vec3(0.10, 0.09, 0.11), vec3(0.06, 0.055, 0.07), g);
      gl_FragColor = vec4(col, 1.0);
    }`
});
const bgQuad = new THREE.Mesh(bgGeo, bgMat);
bgQuad.renderOrder = -1;
bgQuad.frustumCulled = false;
scene.add(bgQuad);

/* ── particles ── */
const N = 45000;
const restPos = new Float32Array(N * 3);
const normBuf = new Float32Array(N * 3);
const seedBuf = new Float32Array(N);

/* mouse → participatory fold (Clark's Bichos were handheld) */
const mouse = new THREE.Vector2(0, 0);
addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uReady:    { value: 0 },
  uCellSize: { value: 0.85 },
  uMouse:    { value: mouse }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uCellSize;
    uniform vec2  uMouse;
    attribute vec3  rest;
    attribute vec3  norm;
    attribute float seed;
    varying vec3  vCol;
    varying float vAlpha;

    float hash(vec3 p){
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
    }
    float hash2(vec3 p){
      return fract(sin(dot(p, vec3(269.5, 183.3, 419.2))) * 32451.7319);
    }

    vec3 rotateAxis(vec3 v, vec3 axis, float a){
      float c = cos(a), s = sin(a);
      return v * c + cross(axis, v) * s + axis * dot(axis, v) * (1.0 - c);
    }

    void main(){
      float cs = uCellSize;
      vec3 cell = floor(rest / cs) * cs + cs * 0.5;
      float h  = hash(cell);
      float h2 = hash2(cell);

      /* ── fold wave: travels upward through the figure ── */
      float waveY    = rest.y * 0.12;
      float waveTime = uTime * 0.18 + h * 6.2831 + waveY;
      float foldWave = sin(waveTime) * 0.5 + 0.5;

      /* ── mouse proximity boosts fold (participatory) ── */
      vec4 clipCell = projectionMatrix * modelViewMatrix * vec4(cell, 1.0);
      vec2 cellNDC  = clipCell.xy / clipCell.w;
      float mouseDist = length(cellNDC - uMouse);
      float mouseBoost = smoothstep(0.6, 0.1, mouseDist) * 0.5;

      float foldAmount = foldWave * (0.28 + mouseBoost);

      /* ── fold axis: tangent to surface in cell ── */
      vec3 n = normalize(norm);
      vec3 ref = abs(n.y) > 0.95 ? vec3(1,0,0) : vec3(0,1,0);
      vec3 tangent = normalize(cross(n, ref));
      // rotate tangent per-cell for variety
      tangent = rotateAxis(tangent, n, h * 6.2831);

      /* ── fold: one side of the cell hinges up ── */
      vec3 offset = rest - cell;
      float side  = dot(offset, tangent);
      float hinge = smoothstep(0.0, cs * 0.3, side);
      float foldAngle = foldAmount * hinge;

      vec3 foldedOffset = rotateAxis(offset, tangent, foldAngle);
      vec3 p = cell + foldedOffset;

      /* ── breathing: micro-displacement along normal ── */
      float breathe = sin(uTime * 0.25 + h * 3.14) * 0.015;
      p += n * breathe;

      /* ── reveal: geometric scatter → assembled form ── */
      float angle0 = seed * 6.2831 + h * 4.0;
      vec3 scattered = vec3(
        sin(angle0) * cos(seed * 11.0),
        cos(angle0 + 1.0),
        sin(seed * 22.0 + h2 * 5.0)
      ) * 22.0;
      p = mix(scattered, p, smoothstep(0.0, 1.0, uReady));

      /* ── palette: brushed aluminum / tarnished silver / blue-oxide patina ── */
      vec3 aluminum = vec3(0.72, 0.71, 0.69);
      vec3 tarnish  = vec3(0.50, 0.48, 0.44);
      vec3 patina   = vec3(0.40, 0.46, 0.48);
      vec3 edgeHL   = vec3(0.80, 0.77, 0.72);

      vCol = mix(aluminum, tarnish, h * 0.7 + 0.15);
      vCol = mix(vCol, patina, foldAngle * 1.8);
      // bright catch along the hinge crease
      float crease = smoothstep(0.0, 0.06, abs(side))
                   * (1.0 - smoothstep(0.06, 0.14, abs(side)));
      vCol = mix(vCol, edgeHL, crease * foldAngle * 2.5);

      vAlpha = (0.45 + 0.35 * uReady + 0.2 * (1.0 - foldAngle * 1.5));
      vAlpha *= smoothstep(0.0, 0.4, uReady);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.6 + 1.0 * foldAngle) * uPixel * (42.0 / dist)
                   * (0.25 + 0.75 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      /* square particles — geometric, not organic */
      vec2 uv = gl_PointCoord - 0.5;
      float edge = max(abs(uv.x), abs(uv.y));
      if(edge > 0.47) discard;
      float a = smoothstep(0.47, 0.35, edge) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── load Lucy ── */
const loadingEl = document.getElementById('loading');
const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
let revealStart = 0;

loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size   = bb.getSize(new THREE.Vector3());
    const scale  = 16 / Math.max(size.x, size.y, size.z);
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh    = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmpP    = new THREE.Vector3();
    const tmpN    = new THREE.Vector3();

    for (let i = 0; i < N; i++) {
      sampler.sample(tmpP, tmpN);
      restPos[i * 3]     = tmpP.x;
      restPos[i * 3 + 1] = tmpP.y;
      restPos[i * 3 + 2] = tmpP.z;
      normBuf[i * 3]     = tmpN.x;
      normBuf[i * 3 + 1] = tmpN.y;
      normBuf[i * 3 + 2] = tmpN.z;
      seedBuf[i]          = Math.random();
    }

    /* position attribute = rest (for bounding sphere) */
    const posBuf = new Float32Array(restPos);
    geom.setAttribute('position', new THREE.BufferAttribute(posBuf, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('norm',     new THREE.BufferAttribute(normBuf, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seedBuf, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading lucy · ${pct}% · folding into geometry`;
    }
  },
  (err) => {
    loadingEl.textContent = 'load failed — check network';
    console.error(err);
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── render loop ── */
const t0 = performance.now();
function loop() {
  const t = (performance.now() - t0) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3200);
  }

  /* very slow lateral drift — contemplative, not spinning */
  camera.position.x = Math.sin(t * 0.012) * 1.8;
  camera.position.y = 2.0 + Math.sin(t * 0.009 + 0.7) * 0.6;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<!-- piece-ctrl: gallery navigation (injected by pipeline) -->
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
  <button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button>
  <button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button>
  <input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'">
  <button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button>
</div>
<script>
(function(){
  var el=document.querySelector('.id')||{textContent:''};
  var pid=el.textContent.trim().split(/[\s·]/)[0]||'unknown';
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(k,id){try{var s=new Set(JSON.parse(localStorage.getItem(k)||'[]'));s.add(id);localStorage.setItem(k,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(a){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:a})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){var dis=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var ps=(d.pieces||[]).filter(function(p){return !dis.has(p.id);});var ix=ps.findIndex(function(p){return p.id===pid;});var nx=ix>=0&&ix+1<ps.length?ps[ix+1]:null;if(nx)location.href='/pieces/'+nx.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();}).then(function(d){
      var qs='?a='+pid+(d.job_id?'&job='+d.job_id:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    }).catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>

<!-- gp: grade panel (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0°</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId(),KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');for(var i=0;i<cs.length;i++)cs[i].style.filter=f;
  }
  var tries=0;(function w(){if(document.querySelector('canvas')||tries++>80){applyFilter();return;}setTimeout(w,100);})();
  function bind(k,id){var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[k]=parseFloat(el.value);vl.textContent=fmt(k,G[k]);applyFilter();});}
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    for(var k in G){document.getElementById('gp-'+k).value=G[k];document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);}applyFilter();}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return[];}}
  function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));}catch(e){}}
  function renderSaved(){var w=document.getElementById('gp-saved');w.innerHTML='';
    load().forEach(function(c,i){var b=document.createElement('button');b.className='gp-cfg';
      b.textContent='config '+(i+1);b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      w.appendChild(b);});}
  document.getElementById('gp-save').onclick=function(){var a=load();
    var c={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};a.push(c);store(a);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:c})}).catch(function(){});};
  renderSaved();
})();
</script>
</body>
</html>
