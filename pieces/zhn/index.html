<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zhn · coup-de-théâtre (calyx inversion)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f8f6f2; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; }
</style>
</head>
<body>
<div class="id">zhn</div>
<div class="hint">click to regenerate · orbit drag</div>
<div class="src">coup-de-théâtre · calyx inversion · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 12, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xf8f6f2, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points;

/* Track when we last regenerated for morph timing */
let regenTime = 0;

const uniforms = {
  uTime:     { value: 0 },
  uPhase:    { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uRowFreq:  { value: 1.2 },
  uColFreq:  { value: 1.0 },
  uWaveAmp:  { value: 0.5 },
  uTwist:    { value: 0.0 },
  uMorph:    { value: 0.0 },
  uPetals:   { value: 5.0 },
  uCupDepth: { value: 4.0 },
  uCoup:     { value: 0.0 },   // 0 = normal, 1 = fully inverted
  uCoupHue:  { value: 0.0 },   // blends color during coup
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uMorph;
    uniform float uPetals;
    uniform float uCupDepth;
    uniform float uCoup;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity;
    varying float vHeight;
    varying float vRadius;

    void main(){
      vec2 gp = gridPos;

      /* Riley wave interference */
      float rowWave = sin(gp.y * uRowFreq + uTime * 0.6 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.35) * uWaveAmp;

      float twist = uTwist * length(gp) * 0.04;
      float ct = cos(twist); float st = sin(twist);
      vec2 twisted = vec2(gp.x * ct - gp.y * st, gp.x * st + gp.y * ct);

      /* Calyx morph */
      float r = length(gp);
      float maxR = 12.0;
      float nr = clamp(r / maxR, 0.0, 1.0);
      float theta = atan(gp.y, gp.x);

      float petalShape = 0.5 + 0.5 * cos(theta * uPetals);
      float cupProfile = uCupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      float flare = 1.0 + 0.15 * nr * nr * uMorph;

      float m = uMorph;
      vec3 flatPos = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);

      float cx = twisted.x * flare + rowWave * (1.0 - 0.5 * m);
      float cy = twisted.y * flare + colWave * (1.0 - 0.5 * m);
      float cz = cupProfile * m;

      vec3 p = mix(flatPos, vec3(cx, cy, cz), m);

      /* === COUP-DE-THÉÂTRE: invert the cup === */
      // During the coup, petals flip downward (negate z) and splay outward
      float coup = uCoup;
      // Outer petals flip more dramatically
      float flipAmount = coup * nr;
      // Invert the cup height, and push outer rim downward past center
      float invertedZ = -cz * 1.3 - coup * nr * 2.0;
      // Splay outward during flip
      float splayFactor = 1.0 + coup * nr * 0.4;
      vec3 coupPos = vec3(cx * splayFactor, cy * splayFactor, mix(cz, invertedZ, coup) * m);

      p = mix(flatPos, mix(vec3(cx, cy, cz), coupPos, coup), m);

      /* Interference / veining */
      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 0.6)
                         * sin(gp.x * uColFreq * 2.0 + uTime * 0.35);
      float vein = sin(theta * uPetals * 3.0 + r * 1.5 + uTime * 0.2);
      vDensity = mix(interference, interference * 0.6 + vein * 0.4, m);
      vHeight = p.z;
      vRadius = nr;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * max(1.5, 3.0 - dist * 0.06);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDensity;
    varying float vHeight;
    varying float vRadius;

    uniform float uCoup;
    uniform float uCoupHue;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float val = step(0.0, vDensity);

      // Normal: warm brown ink on cream
      float tint = smoothstep(0.0, 4.0, vHeight);
      vec3 darkNormal  = mix(vec3(0.08, 0.07, 0.06), vec3(0.12, 0.14, 0.08), tint * 0.5);
      vec3 lightNormal = mix(vec3(0.97, 0.95, 0.92), vec3(0.93, 0.94, 0.88), tint * 0.3);

      // Coup reveal: deep theatrical crimson, exposed on the underside
      // The "inside" of the flower is revealed — a hidden blush
      float underside = smoothstep(0.0, -3.0, vHeight); // visible when z goes negative
      vec3 darkCoup  = mix(vec3(0.08, 0.07, 0.06), vec3(0.38, 0.06, 0.08), underside * 0.9);
      vec3 lightCoup = mix(vec3(0.97, 0.95, 0.92), vec3(0.95, 0.85, 0.84), underside * 0.5);

      // Blend between normal and coup colors
      vec3 dark  = mix(darkNormal, darkCoup, uCoupHue);
      vec3 light = mix(lightNormal, lightCoup, uCoupHue);

      vec3 col = mix(dark, light, val);

      float alpha = 1.0 - smoothstep(0.18, 0.25, r);
      gl_FragColor = vec4(col, alpha);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24, height = 24;
  const cellW = width / cols, cellH = height / rows;

  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  return { positions, gridPositions, seeds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.5;
  uniforms.uTwist.value = rng() * 4.0;
  uniforms.uPhase.value = rng() * 6.28;
  uniforms.uPetals.value = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value = 0.0;
  uniforms.uCoup.value = 0.0;
  uniforms.uCoupHue.value = 0.0;

  regenTime = performance.now();

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', (e) => {
  if (e.target.tagName === 'CANVAS') regenerate();
});

/* --- Orbit drag --- */
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.0, orbitPhi = 0.55;
const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.4, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/*
  Coup-de-théâtre timing (Jean Tinguely-inspired):
  The calyx forms peacefully over ~6s, holds serenely for ~4s,
  then suddenly flips inside-out over ~1.2s (the coup!),
  holds the reveal for ~2s, then gracefully recovers over ~3s.
  Cycle repeats every ~22s after the initial morph.
*/
function coupEnvelope(localT) {
  // localT = seconds since morph completed (~6s after regen)
  const cycle = 18.0; // cycle length in seconds
  const t = ((localT % cycle) + cycle) % cycle;

  // 0–4s:   serene hold (coup=0)
  // 4–5.2s: sudden flip (coup ramps to 1) — fast, theatrical
  // 5.2–7.2s: hold reveal (coup=1)
  // 7.2–10.2s: gentle recovery (coup eases back to 0)
  // 10.2–18s: rest

  if (t < 4.0) return 0.0;
  if (t < 5.2) {
    // Sharp ease-in: dramatic snap
    const p = (t - 4.0) / 1.2;
    return p * p * (3.0 - 2.0 * p); // smoothstep
  }
  if (t < 7.2) return 1.0;
  if (t < 10.2) {
    // Gentle ease-out: graceful recovery
    const p = (t - 7.2) / 3.0;
    const s = p * p * (3.0 - 2.0 * p);
    return 1.0 - s;
  }
  return 0.0;
}

const globalStart = performance.now();

function loop(){
  const now = performance.now();
  const t = (now - globalStart) / 1000;
  const sinceRegen = (now - regenTime) / 1000;
  uniforms.uTime.value = t;

  // Morph: flat → calyx over first ~6 seconds
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.015;

  // Coup only activates after initial morph is mostly done
  const morphDone = sinceRegen > 6.0;
  const coupTarget = morphDone ? coupEnvelope(sinceRegen - 6.0) : 0.0;
  // Smooth the coup value slightly for silky transitions
  uniforms.uCoup.value += (coupTarget - uniforms.uCoup.value) * 0.12;
  // Color follows coup with slight lag for dramatic effect
  uniforms.uCoupHue.value += (coupTarget - uniforms.uCoupHue.value) * 0.08;

  // Auto-orbit + manual
  const autoTheta = t * 0.08;
  const theta = autoTheta + orbitTheta;
  const phi = orbitPhi;
  const radius = 22;

  // Camera tracks centroid; during coup, dip slightly to see underside
  const centroidY = 1.5 * uniforms.uMorph.value - uniforms.uCoup.value * 1.0;
  // Slight zoom impulse during coup (camera pulls back to see the drama)
  const coupRadius = radius + uniforms.uCoup.value * 4.0;

  camera.position.set(
    coupRadius * Math.sin(theta) * Math.sin(phi),
    centroidY + coupRadius * Math.cos(phi),
    coupRadius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, centroidY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
