<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xv9 · luminous · Turrell aperture</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">xv9</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// James Turrell: perception of light itself as material. Not the illuminated
// object but the glow around it, the frame it creates, the way color saturates
// through atmospheric haze. Taking the parent's calligraphic differential-growth
// column and re-casting it: not an ink ribbon, but a LIGHT APERTURE suspended
// in dark space. The form becomes a portal — particles radiate from the curve
// edge like photons leaking through a skyspace cut. Soft pastel glow (Turrell's
// cyan-pink gradient twilight palette). Camera slow-drifts in orbit. Zero
// interaction. The piece breathes. Meditative pacing. Light as volume.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

// ─────────── differential growth (3D) — inherited structure, pared parameters
const MAX_VERTS = 1400;
const ATTRACT   = 0.05;
const REPEL_R   = 0.42;
const REPEL_STR = 0.11;
const NOISE     = 0.002;
const PRESSURE  = 0.0024;
const RISE      = 0.0035;
const MAX_D     = 0.34;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i / 16 * Math.PI * 2;
  const r = 1.2 + (Math.random() - 0.5) * 0.08;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.35;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.25 + 1.1 * Math.min(a * 1.4, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.4 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.04, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 600; s++) step();

// ─────────── particle system: photons radiating from aperture edge
// Each vert emits particles outward + slight drift. Particles have lifetime
// fade, soft additive blend (glow). Turrell palette: cyan-pink gradient.
const MAX_PARTICLES = 120000;
const positions = new Float32Array(MAX_PARTICLES * 3);
const velocities = new Float32Array(MAX_PARTICLES * 3);
const lifetimes = new Float32Array(MAX_PARTICLES);
const colors = new Float32Array(MAX_PARTICLES * 3);
let particleCount = 0;

function emitParticle(x, y, z, vx, vy, vz, hue){
  if (particleCount >= MAX_PARTICLES) return;
  const i = particleCount++;
  positions[i*3]   = x;
  positions[i*3+1] = y;
  positions[i*3+2] = z;
  velocities[i*3]   = vx;
  velocities[i*3+1] = vy;
  velocities[i*3+2] = vz;
  lifetimes[i] = 1.0;
  // Turrell twilight palette: cyan (180°) to pink (320°)
  const s = 0.7, l = 0.7;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const hp = hue / 60;
  const x2 = c * (1 - Math.abs(hp % 2 - 1));
  let r=0, g=0, b=0;
  if (hp < 1){ r=c; g=x2; } else if (hp<2){ r=x2; g=c; }
  else if (hp<3){ g=c; b=x2; } else if (hp<4){ g=x2; b=c; }
  else if (hp<5){ r=x2; b=c; } else { r=c; b=x2; }
  const m = l - c/2;
  colors[i*3]   = r+m;
  colors[i*3+1] = g+m;
  colors[i*3+2] = b+m;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const mat = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader: `
    attribute vec3 color;
    varying vec3 vColor;
    void main(){
      vColor = color;
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = 3.0 * (100.0 / -mvPos.z);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float alpha = 1.0 - smoothstep(0.3, 0.5, d);
      gl_FragColor = vec4(vColor * 1.5, alpha * 0.7);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const points = new THREE.Points(geo, mat);
scene.add(points);

// ─────────── simulation loop
let lastEmit = 0;
const EMIT_INTERVAL = 16;  // emit every N ms

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(t){
  // slow growth continuation
  for (let s = 0; s < 1; s++) step();

  // emit particles from aperture edge
  if (t - lastEmit > EMIT_INTERVAL && verts.length > 8){
    lastEmit = t;
    const EMIT_PER_TICK = 20;
    for (let e = 0; e < EMIT_PER_TICK; e++){
      const v = verts[Math.floor(Math.random() * verts.length)];
      // compute local normal (outward from centroid)
      let cx=0, cy=0, cz=0;
      for (const u of verts){ cx+=u.x; cy+=u.y; cz+=u.z; }
      cx /= verts.length; cy /= verts.length; cz /= verts.length;
      const nx = v.x - cx, ny = v.y - cy, nz = v.z - cz;
      const nd = Math.hypot(nx, ny, nz) + 1e-6;
      const speed = 0.006 + Math.random() * 0.008;
      const vx = (nx/nd) * speed + (Math.random()-0.5)*0.002;
      const vy = (ny/nd) * speed * 0.6 + (Math.random()-0.5)*0.002 + 0.003;
      const vz = (nz/nd) * speed + (Math.random()-0.5)*0.002;
      // Turrell twilight gradient: bottom cyan (180°), top pink (320°)
      const heightNorm = (v.y - 0) / 12;  // assume aperture ~0–12 y range
      const hue = 180 + heightNorm * 140;
      emitParticle(v.x, v.y, v.z, vx, vy, vz, hue);
    }
  }

  // update particles
  for (let i = 0; i < particleCount; i++){
    positions[i*3]   += velocities[i*3];
    positions[i*3+1] += velocities[i*3+1];
    positions[i*3+2] += velocities[i*3+2];
    velocities[i*3+1] += 0.00004;  // slight upward drift
    lifetimes[i] -= 0.0025;
    const life = Math.max(0, lifetimes[i]);
    const fade = Math.pow(life, 1.5);
    colors[i*3]   *= fade;
    colors[i*3+1] *= fade;
    colors[i*3+2] *= fade;
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  geo.setDrawRange(0, particleCount);

  // remove dead particles (compact array)
  let write = 0;
  for (let read = 0; read < particleCount; read++){
    if (lifetimes[read] > 0){
      if (write !== read){
        positions[write*3]   = positions[read*3];
        positions[write*3+1] = positions[read*3+1];
        positions[write*3+2] = positions[read*3+2];
        velocities[write*3]   = velocities[read*3];
        velocities[write*3+1] = velocities[read*3+1];
        velocities[write*3+2] = velocities[read*3+2];
        colors[write*3]   = colors[read*3];
        colors[write*3+1] = colors[read*3+1];
        colors[write*3+2] = colors[read*3+2];
        lifetimes[write] = lifetimes[read];
      }
      write++;
    }
  }
  particleCount = write;

  // camera drift + follow aperture centroid
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean * 0.5, 2.5);
  camera.position.y += (targetY + 5 - camera.position.y) * 0.01;
  camera.lookAt(0, targetY, 0);

  // slow rotation around aperture (Turrell's patient pacing)
  const elapsed = (t - start) * 0.001;
  const angle = elapsed * 0.04;
  const camDist = 12 + Math.sin(elapsed * 0.1) * 1.5;
  camera.position.x = Math.sin(angle) * camDist;
  camera.position.z = Math.cos(angle) * camDist;
  camera.lookAt(0, targetY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
</body>
</html>
