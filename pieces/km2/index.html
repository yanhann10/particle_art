<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frond morph · pinnate bouquet</title>
<!-- MOTION: twist, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">km2</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6, 4, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// Palette: warm amber on near-black — inherited from h7d
const PALETTE = [
  new THREE.Color(0xc59356),
  new THREE.Color(0x8b5a3c),
  new THREE.Color(0xa67c52),
  new THREE.Color(0x6b4423),
  new THREE.Color(0xd4a574),
];

const N = 80000;

// Build a frond: h7d's leaf strip morphed with pinnate leaflets
// Same calligraphic mid-vein + curling edge, but now branching sub-blades
function buildFrond(index, totalFronds) {
  const positions = [];
  const colors = [];
  const seeds = [];

  const rachisLen = 3.5 + Math.random() * 2.5;
  const curlIntensity = 0.6 + Math.random() * 1.2;
  const twistRate = 0.3 + Math.random() * 0.5;
  const bendAngle = (Math.random() - 0.5) * Math.PI * 0.6;
  const baseColor = PALETTE[index % PALETTE.length].clone();

  // Number of pinnae (leaflet pairs) along the rachis
  const numPinnae = 8 + Math.floor(Math.random() * 5);
  const pinnaLen = 0.8 + Math.random() * 0.5;
  const pinnaWidth = 0.18 + Math.random() * 0.08;

  // Rachis (main stem) — dense particle line, inherited from h7d midvein
  const rachisSegs = 60;
  for (let i = 0; i < rachisSegs; i++) {
    const t = i / (rachisSegs - 1);
    const y = t * rachisLen;
    const curlPhase = t * Math.PI * twistRate;
    const edgeCurl = Math.sin(curlPhase) * curlIntensity * (1 - t * 0.3);

    // Rachis position with h7d's bend
    const xr = edgeCurl * 0.15;
    const zr = -Math.pow(t, 2) * 0.2;
    const xb = xr * Math.cos(bendAngle) - y * Math.sin(bendAngle);
    const yb = xr * Math.sin(bendAngle) + y * Math.cos(bendAngle);

    // Thicken rachis with a small cluster
    for (let k = 0; k < 3; k++) {
      const jitter = 0.02;
      positions.push(
        xb + (Math.random() - 0.5) * jitter,
        yb + (Math.random() - 0.5) * jitter,
        zr + (Math.random() - 0.5) * jitter
      );
      const col = baseColor.clone().multiplyScalar(0.45 + 0.15 * t);
      colors.push(col.r, col.g, col.b);
      seeds.push(Math.random());
    }
  }

  // Pinnae (leaflets) — the "frond" morph of h7d's leaf surface
  for (let pi = 0; pi < numPinnae; pi++) {
    const tAttach = 0.12 + (pi / (numPinnae - 1)) * 0.82;
    const y0 = tAttach * rachisLen;
    const curlPhase = tAttach * Math.PI * twistRate;
    const edgeCurl = Math.sin(curlPhase) * curlIntensity * (1 - tAttach * 0.3);
    const xr = edgeCurl * 0.15;
    const zr = -Math.pow(tAttach, 2) * 0.2;
    const xbA = xr * Math.cos(bendAngle) - y0 * Math.sin(bendAngle);
    const ybA = xr * Math.sin(bendAngle) + y0 * Math.cos(bendAngle);

    // Pinna length tapers toward tip and base — like h7d's width taper
    const taperT = Math.sin(tAttach * Math.PI) * (0.4 + 0.6 * Math.pow(1 - Math.abs(tAttach - 0.5) * 2, 0.6));
    const thisLen = pinnaLen * taperT * (0.7 + 0.6 * Math.random());

    // Two pinnae per node — left and right
    for (let side = -1; side <= 1; side += 2) {
      // Angle of pinna relative to rachis — upward near tip, outward at middle
      const pinnaAngle = side * (0.8 + 0.4 * (1 - tAttach));
      const pinnaDropAngle = -0.15 - 0.3 * (1 - tAttach); // slight droop

      // Fill each pinna as a blade: dense grid of particles
      const bladeSegs = 14;
      const bladeWidth = 8;
      for (let bi = 0; bi < bladeSegs; bi++) {
        const bt = bi / (bladeSegs - 1);
        for (let bj = 0; bj < bladeWidth; bj++) {
          const bs = (bj / (bladeWidth - 1) - 0.5) * 2; // -1 to 1

          // Blade tapers to tip
          const bladeTaper = 1 - Math.pow(bt, 1.5);
          const halfW = pinnaWidth * bladeTaper;
          const localX = bt * thisLen;
          const localY = bs * halfW;
          // Slight dish like h7d's parabolic cross-section
          const localZ = -Math.pow(Math.abs(bs), 1.8) * 0.06;

          // Rotate pinna into world space
          const cosA = Math.cos(pinnaAngle);
          const sinA = Math.sin(pinnaAngle);
          const cosD = Math.cos(pinnaDropAngle);
          const sinD = Math.sin(pinnaDropAngle);

          let wx = localX * cosA - localY * sinA;
          let wy = localY * cosA + localX * sinA;
          let wz = localZ + localX * sinD;
          wy *= cosD;

          // Translate to rachis attach point
          wx += xbA;
          wy += ybA;
          wz += zr;

          positions.push(wx, wy, wz);

          // Color: h7d scheme — darker at edges/base, lighter at vein/tip
          const edgeDist = Math.abs(bs);
          const tipness = Math.pow(bt, 1.5);
          const veinProx = 1 - edgeDist;
          const col = baseColor.clone();
          col.multiplyScalar(0.4 + 0.35 * veinProx + 0.25 * tipness + 0.1 * tAttach);
          colors.push(col.r, col.g, col.b);
          seeds.push(Math.random());
        }
      }
    }
  }

  return { positions, colors, seeds };
}

// Bouquet arrangement — same 7-element cluster from h7d
const leafConfigs = [
  { scale: 1.0, rotX: 0.2, rotY: 0, rotZ: 0, offsetX: -0.8, offsetY: 0, offsetZ: 0.3 },
  { scale: 0.85, rotX: -0.3, rotY: Math.PI * 0.4, rotZ: 0.2, offsetX: 0.9, offsetY: 0.5, offsetZ: -0.4 },
  { scale: 1.15, rotX: 0.1, rotY: Math.PI * 0.7, rotZ: -0.15, offsetX: 0.3, offsetY: 1.2, offsetZ: 0.6 },
  { scale: 0.95, rotX: -0.4, rotY: Math.PI * 1.1, rotZ: 0.3, offsetX: -1.2, offsetY: 1.8, offsetZ: -0.3 },
  { scale: 1.05, rotX: 0.25, rotY: Math.PI * 1.5, rotZ: -0.2, offsetX: 0.6, offsetY: 2.4, offsetZ: 0.2 },
  { scale: 0.75, rotX: -0.15, rotY: Math.PI * 0.25, rotZ: 0.4, offsetX: -0.5, offsetY: 3.0, offsetZ: 0.5 },
  { scale: 0.9, rotX: 0.35, rotY: Math.PI * 1.8, rotZ: -0.25, offsetX: 0.2, offsetY: 3.5, offsetZ: -0.2 },
];

const allPositions = [];
const allColors = [];
const allSeeds = [];

for (let i = 0; i < leafConfigs.length; i++) {
  const frondData = buildFrond(i, leafConfigs.length);
  const cfg = leafConfigs[i];

  const mat4 = new THREE.Matrix4();
  mat4.makeRotationFromEuler(new THREE.Euler(cfg.rotX, cfg.rotY, cfg.rotZ, 'XYZ'));
  mat4.scale(new THREE.Vector3(cfg.scale, cfg.scale, cfg.scale));

  const offset = new THREE.Vector3(cfg.offsetX, cfg.offsetY, cfg.offsetZ);

  for (let j = 0; j < frondData.positions.length; j += 3) {
    const v = new THREE.Vector3(
      frondData.positions[j],
      frondData.positions[j + 1],
      frondData.positions[j + 2]
    );
    v.applyMatrix4(mat4);
    v.add(offset);

    allPositions.push(v.x, v.y, v.z);
    allColors.push(frondData.colors[j], frondData.colors[j + 1], frondData.colors[j + 2]);
    allSeeds.push(frondData.seeds[j / 3]);
  }
}

// Pad/trim to exactly N particles
while (allPositions.length / 3 < N) {
  const idx = Math.floor(Math.random() * (allPositions.length / 3)) * 3;
  allPositions.push(
    allPositions[idx] + (Math.random() - 0.5) * 0.015,
    allPositions[idx + 1] + (Math.random() - 0.5) * 0.015,
    allPositions[idx + 2] + (Math.random() - 0.5) * 0.015
  );
  allColors.push(allColors[idx], allColors[idx + 1], allColors[idx + 2]);
  allSeeds.push(Math.random());
}

const positions = new Float32Array(allPositions.slice(0, N * 3));
const colorsArr = new Float32Array(allColors.slice(0, N * 3));
const seedsArr = new Float32Array(allSeeds.slice(0, N));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seedsArr, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
};

// Shader DNA inherited from h7d — same breathing, shimmer, point rendering
const material = new THREE.ShaderMaterial({
  uniforms,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec3 p = position;

      // Breathing motion — inherited from h7d
      float breathPhase = uTime * 0.4 + seed * 6.28;
      float breath = sin(breathPhase) * 0.06;
      p *= (1.0 + breath);

      // Frond sway — pinnae tremble slightly more than h7d's drift
      float drift = seed * 6.28;
      p.x += sin(uTime * 0.25 + drift + p.y * 0.5) * 0.05;
      p.z += cos(uTime * 0.2 + drift + 1.5 + p.y * 0.3) * 0.04;

      vCol = color;

      // Shimmer — same as h7d
      float shimmer = 0.5 + 0.5 * sin(uTime * 1.5 + seed * 12.56);
      vAlpha = 0.6 + 0.3 * shimmer;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (48.0 / dist) * (0.8 + 0.4 * shimmer);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, material);
scene.add(points);

// Lighting — inherited from h7d
const ambient = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffddaa, 0.3);
dirLight.position.set(5, 8, 3);
scene.add(dirLight);

// Track centroid for camera — inherited from h7d
const bbox = new THREE.Box3().setFromBufferAttribute(geom.attributes.position);
const centroid = bbox.getCenter(new THREE.Vector3());
controls.target.copy(centroid);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
