<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j4z · luminous · Turrell</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">j4z</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 70);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
document.body.appendChild(renderer.domElement);

// Turrell: perception of light itself; the space *between* as subject
// luminous volumes created by particles defining threshold zones
// slow transformation, no urgency, pure phenomenological experience

const N = 18000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const phases = new Float32Array(N);

// Initialize particles in a flat plane that will slowly curl into volumetric light
for (let i = 0; i < N; i++){
  const angle = Math.random() * Math.PI * 2;
  const r = 15 + Math.random() * 20;
  positions[i*3]   = Math.cos(angle) * r;
  positions[i*3+1] = (Math.random() - 0.5) * 0.8;
  positions[i*3+2] = Math.sin(angle) * r;
  
  velocities[i*3] = 0;
  velocities[i*3+1] = 0;
  velocities[i*3+2] = 0;
  
  phases[i] = Math.random();
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uIntensity: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, 
  depthWrite: false, 
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uIntensity;
    attribute float phase;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // Turrell breathing: slow periodic expansion/contraction
      float breath = 0.92 + 0.08 * sin(uTime * 0.15 + phase * 6.28);
      p *= breath;
      
      // vertical drift — light rising like perception
      float drift = uTime * 0.4 * (phase - 0.5);
      p.y += drift;
      
      // radial pulsing — Ganzfeld effect, boundaries dissolving
      float radialPhase = phase * 3.14159 + uTime * 0.1;
      float radialPulse = 0.5 + 0.5 * sin(radialPhase);
      
      // Turrell palette: single pure hue, luminosity as content
      // cyan-white threshold — Skyspace luminosity
      vec3 lightColor = vec3(0.65, 0.85, 1.0);
      float luminosity = 0.3 + 0.7 * radialPulse;
      vCol = lightColor * luminosity * uIntensity;
      
      vAlpha = (0.15 + 0.35 * radialPulse) * uIntensity;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (2.0 + 4.0 * radialPulse) * uPixel * (100.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      
      // soft glow — light as substance
      float falloff = exp(-r * 8.0);
      float a = falloff * vAlpha;
      
      gl_FragColor = vec4(vCol * a * 2.0, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Turrell camera: still observer in slowly transforming light field
const centroid = new THREE.Vector3();
let cameraPhase = 0;

function updateParticles(t){
  // Slow morphology: plane → torus → vertical column
  const morphPhase = (t * 0.08) % 3.0;
  
  for (let i = 0; i < N; i++){
    const phase = phases[i];
    const baseAngle = phase * Math.PI * 2;
    const baseR = 15 + phase * 20;
    
    let targetX, targetY, targetZ;
    
    if (morphPhase < 1.0){
      // plane → torus
      const blend = morphPhase;
      const torusR = 18;
      const tubeR = 8;
      const torusAngle = baseAngle;
      const tubeAngle = phase * Math.PI * 4;
      
      const tx = (torusR + tubeR * Math.cos(tubeAngle)) * Math.cos(torusAngle);
      const ty = tubeR * Math.sin(tubeAngle);
      const tz = (torusR + tubeR * Math.cos(tubeAngle)) * Math.sin(torusAngle);
      
      const px = Math.cos(baseAngle) * baseR;
      const py = (phase - 0.5) * 0.8;
      const pz = Math.sin(baseAngle) * baseR;
      
      targetX = px + (tx - px) * blend;
      targetY = py + (ty - py) * blend;
      targetZ = pz + (tz - pz) * blend;
      
    } else if (morphPhase < 2.0){
      // torus → vertical column
      const blend = morphPhase - 1.0;
      const torusR = 18;
      const tubeR = 8;
      const torusAngle = baseAngle;
      const tubeAngle = phase * Math.PI * 4;
      
      const tx = (torusR + tubeR * Math.cos(tubeAngle)) * Math.cos(torusAngle);
      const ty = tubeR * Math.sin(tubeAngle);
      const tz = (torusR + tubeR * Math.cos(tubeAngle)) * Math.sin(torusAngle);
      
      const colR = 12;
      const cx = Math.cos(baseAngle * 3) * colR;
      const cy = (phase - 0.5) * 35;
      const cz = Math.sin(baseAngle * 3) * colR;
      
      targetX = tx + (cx - tx) * blend;
      targetY = ty + (cy - ty) * blend;
      targetZ = tz + (cz - tz) * blend;
      
    } else {
      // column → plane (close loop)
      const blend = morphPhase - 2.0;
      const colR = 12;
      const cx = Math.cos(baseAngle * 3) * colR;
      const cy = (phase - 0.5) * 35;
      const cz = Math.sin(baseAngle * 3) * colR;
      
      const px = Math.cos(baseAngle) * baseR;
      const py = (phase - 0.5) * 0.8;
      const pz = Math.sin(baseAngle) * baseR;
      
      targetX = cx + (px - cx) * blend;
      targetY = cy + (py - cy) * blend;
      targetZ = cz + (pz - cz) * blend;
    }
    
    // Gentle attraction to target
    velocities[i*3]   += (targetX - positions[i*3]) * 0.012;
    velocities[i*3+1] += (targetY - positions[i*3+1]) * 0.012;
    velocities[i*3+2] += (targetZ - positions[i*3+2]) * 0.012;
    
    // Damping — Turrell stillness
    velocities[i*3]   *= 0.92;
    velocities[i*3+1] *= 0.92;
    velocities[i*3+2] *= 0.92;
    
    positions[i*3]   += velocities[i*3];
    positions[i*3+1] += velocities[i*3+1];
    positions[i*3+2] += velocities[i*3+2];
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();
}

function updateCamera(t){
  // Compute centroid
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  // Turrell observer: minimal movement, perception over time
  cameraPhase += 0.0003;
  const orbitR = 70;
  const cx = Math.cos(cameraPhase) * orbitR;
  const cz = Math.sin(cameraPhase) * orbitR;
  const cy = Math.sin(cameraPhase * 0.4) * 8;
  
  camera.position.x = centroid.x + cx;
  camera.position.y = centroid.y + cy;
  camera.position.z = centroid.z + cz;
  camera.lookAt(centroid);
}

const startTime = performance.now();

function loop(){
  const t = (performance.now() - startTime) / 1000;
  
  // Fade in luminosity over first 4 seconds — Turrell reveal
  uniforms.uIntensity.value = Math.min(t / 4.0, 1.0);
  
  uniforms.uTime.value = t;
  updateParticles(t);
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
