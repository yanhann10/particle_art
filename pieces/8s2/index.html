<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8s2 · genealogical morphing · Nouf Aljowaysir</title>
<!-- MOTION: morph, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">8s2 · genealogical morphing · Nouf Aljowaysir</div>
<div class="hint" id="hint">between generations · the face that never was</div>
<div class="src">Lumen Prize 2023 · latent ancestry</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0c0a, 1);
document.body.appendChild(renderer.domElement);

// Generate facial point cloud — canonical topology
const N = 8200;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const lags = new Float32Array(N); // per-particle morph lag

// Three latent anchors — great-grandparent, grandparent, self
const anchor0 = new Float32Array(N * 3);
const anchor1 = new Float32Array(N * 3);
const anchor2 = new Float32Array(N * 3);

// Base face topology — ellipsoid with feature regions
function generateFaceTopology(){
  for (let i = 0; i < N; i++){
    const u = Math.random();
    const v = Math.random();
    
    // Assign feature regions probabilistically
    const featureRoll = Math.random();
    let x, y, z;
    
    if (featureRoll < 0.35){ // main oval
      const theta = u * Math.PI * 2;
      const phi = Math.acos(2 * v - 1);
      const rx = 3.8, ry = 5.2, rz = 3.2;
      x = rx * Math.sin(phi) * Math.cos(theta);
      y = ry * Math.sin(phi) * Math.sin(theta) - 0.5;
      z = rz * Math.cos(phi);
    } else if (featureRoll < 0.50){ // eye regions
      const side = Math.random() < 0.5 ? -1 : 1;
      const r = 0.6 + Math.random() * 0.4;
      const theta = Math.random() * Math.PI * 2;
      x = side * (1.8 + Math.cos(theta) * r);
      y = 1.5 + Math.sin(theta) * r;
      z = 2.2 + (Math.random() - 0.5) * 0.8;
    } else if (featureRoll < 0.62){ // nose
      const t = Math.pow(Math.random(), 1.5);
      x = (Math.random() - 0.5) * 0.9;
      y = 1.2 - t * 2.8;
      z = 2.8 - t * 1.4;
    } else if (featureRoll < 0.75){ // mouth
      const theta = (Math.random() - 0.5) * Math.PI * 0.6;
      const r = 0.8 + Math.random() * 0.3;
      x = Math.sin(theta) * r * 1.5;
      y = -2.2 + Math.abs(Math.sin(theta)) * 0.3;
      z = 1.8 + Math.cos(theta) * 0.5;
    } else { // cheek/jaw structure
      const side = Math.random() < 0.5 ? -1 : 1;
      const t = Math.random();
      x = side * (2.5 + Math.random() * 1.2);
      y = 1.0 - t * 4.0;
      z = 1.0 + (1 - t) * 1.5;
    }
    
    positions[i*3] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;
    
    seeds[i] = Math.random();
    lags[i] = 0.15 + Math.random() * 0.35; // memory lag coefficient
  }
}

generateFaceTopology();

// Generate three distinct facial variations via procedural distortion
function generateAnchor(target, seed){
  const rng = () => {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  };
  
  // Cheekbone width variation
  const cheekWidth = 0.85 + rng() * 0.3;
  // Jaw sharpness
  const jawSharp = 0.9 + rng() * 0.2;
  // Forehead height
  const foreheadShift = -0.4 + rng() * 0.8;
  // Nose bridge
  const noseBridge = 0.9 + rng() * 0.3;
  // Eye spacing
  const eyeSpacing = 0.92 + rng() * 0.16;
  
  for (let i = 0; i < N; i++){
    let x = positions[i*3];
    let y = positions[i*3+1];
    let z = positions[i*3+2];
    
    // Apply feature deformations
    if (Math.abs(x) > 1.5 && y > -1.0){ // cheeks
      x *= cheekWidth;
      z *= (1.0 + (cheekWidth - 1.0) * 0.3);
    }
    
    if (y < -1.0){ // jaw
      x *= jawSharp;
      z *= (2.0 - jawSharp);
    }
    
    if (y > 2.0){ // forehead
      y += foreheadShift;
      z += foreheadShift * 0.3;
    }
    
    if (Math.abs(x) > 1.0 && y > 0.8 && y < 2.5){ // eyes
      x *= eyeSpacing;
    }
    
    if (Math.abs(x) < 0.8 && y > 0.0 && y < 2.0){ // nose
      z *= noseBridge;
    }
    
    // Micro-jitter per anchor
    x += (rng() - 0.5) * 0.12;
    y += (rng() - 0.5) * 0.12;
    z += (rng() - 0.5) * 0.12;
    
    target[i*3] = x;
    target[i*3+1] = y;
    target[i*3+2] = z;
  }
}

generateAnchor(anchor0, 12847);  // great-grandparent
generateAnchor(anchor1, 67394);  // grandparent
generateAnchor(anchor2, 39281);  // self

// Palette: sepia → rose → ink (genealogical photograph palette)
const palette = [
  new THREE.Color(0x8b7355), // sepia brown
  new THREE.Color(0xa67c6d), // warm sepia
  new THREE.Color(0xc49186), // rose
  new THREE.Color(0xb57b7e), // dusty rose
  new THREE.Color(0x4a3c3a)  // ink shadow
];

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float lag;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      
      // Color by depth and generational phase
      float phase = uTime * 0.08;
      float genCycle = fract(phase);
      
      // Sepia → rose → ink gradient
      vec3 c0 = vec3(0.545, 0.451, 0.333); // sepia
      vec3 c1 = vec3(0.769, 0.569, 0.525); // rose
      vec3 c2 = vec3(0.290, 0.235, 0.227); // ink
      
      float blend1 = smoothstep(0.25, 0.5, genCycle);
      float blend2 = smoothstep(0.6, 0.85, genCycle);
      vec3 col = mix(c0, c1, blend1);
      col = mix(col, c2, blend2);
      
      // Depth tint
      float depth = (p.z + 4.0) / 8.0;
      col *= 0.7 + depth * 0.3;
      
      vCol = col;
      vAlpha = 0.35 + depth * 0.25 + seed * 0.15;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + seed * 0.6) * uPixel * (50.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('lag', new THREE.BufferAttribute(lags, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

// Soft ambient fog
scene.fog = new THREE.Fog(0x0f0c0a, 15, 45);

// Dim warm side light
const light = new THREE.PointLight(0xffd4a3, 0.3, 80);
light.position.set(-12, 8, 15);
scene.add(light);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hintEl = document.getElementById('hint');

// Morph state
let morphPhase = 0;
const MORPH_CYCLE = 24.0; // seconds per full cycle

function updateMorph(t){
  morphPhase = (t / MORPH_CYCLE) % 3.0;
  
  let src, dst, blend;
  let genLabel;
  
  if (morphPhase < 1.0){
    src = anchor0;
    dst = anchor1;
    blend = morphPhase;
    genLabel = 'great-grandparent → grandparent';
  } else if (morphPhase < 2.0){
    src = anchor1;
    dst = anchor2;
    blend = morphPhase - 1.0;
    genLabel = 'grandparent → self';
  } else {
    src = anchor2;
    dst = anchor0;
    blend = morphPhase - 2.0;
    genLabel = 'self → great-grandparent';
  }
  
  // Ease with slow middle — the in-between is the truth
  const eased = blend < 0.5 
    ? 2 * blend * blend 
    : 1 - Math.pow(-2 * blend + 2, 2) / 2;
  
  for (let i = 0; i < N; i++){
    const lag = lags[i];
    const laggedBlend = Math.max(0, Math.min(1, eased - lag * 0.3 + lag * eased));
    
    const sx = src[i*3];
    const sy = src[i*3+1];
    const sz = src[i*3+2];
    const dx = dst[i*3];
    const dy = dst[i*3+1];
    const dz = dst[i*3+2];
    
    // Interpolate with jitter — memory is imperfect
    const jitterAmt = Math.abs(laggedBlend - 0.5) * 0.08;
    const jx = (Math.sin(t * 0.7 + seeds[i] * 100) * 0.5 + 0.5) * jitterAmt;
    const jy = (Math.sin(t * 0.5 + seeds[i] * 200) * 0.5 + 0.5) * jitterAmt;
    const jz = (Math.sin(t * 0.9 + seeds[i] * 300) * 0.5 + 0.5) * jitterAmt;
    
    positions[i*3]   = sx + (dx - sx) * laggedBlend + (Math.random() - 0.5) * jx;
    positions[i*3+1] = sy + (dy - sy) * laggedBlend + (Math.random() - 0.5) * jy;
    positions[i*3+2] = sz + (dz - sz) * laggedBlend + (Math.random() - 0.5) * jz;
  }
  
  geom.attributes.position.needsUpdate = true;
  
  const transitPercent = ((eased * 100) | 0);
  hintEl.textContent = `${genLabel} · ${transitPercent}% · the face that never was`;
}

// Slow orbital camera
const centroid = new THREE.Vector3(0, 0, 0);
function updateCamera(t){
  const orbitRadius = 28;
  const angle = t * 0.04;
  camera.position.x = Math.sin(angle) * orbitRadius * 0.4;
  camera.position.z = Math.cos(angle) * orbitRadius;
  camera.position.y = Math.sin(angle * 0.3) * 3;
  camera.lookAt(centroid);
}

const start = performance.now();

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  
  uniforms.uTime.value = t;
  updateMorph(t);
  updateCamera(t);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
