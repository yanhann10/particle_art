<meta charset="utf-8">

<title>uv7 · face bloom · Parallels×portrait</title>
<!-- MOTION: bloom, intensity: responsive -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; cursor:none; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">uv7 · face bloom</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// uv7 — hybrid of as2 (Parallels) × kxu (botanical calyx trails)
// Vertical amber rails at rest; mouse proximity + auto-pulse blooms rails into
// a human face silhouette. Rails displace laterally to reveal eyes, nose, mouth.
// Background: #0a0a0a. Color: amber #c9850a → skin tone #e8c090 at face features.

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
camera.lookAt(0, 0, 0);

// ── Rail system ────────────────────────────────────────────────────────────
const RAIL_COUNT = 80;
const PARTICLES_PER_RAIL = 120;
const TOTAL = RAIL_COUNT * PARTICLES_PER_RAIL; // 9600

// Rail base X: evenly spaced −10 to +10
const railBaseX = [];
for (let i = 0; i < RAIL_COUNT; i++) {
  railBaseX.push(-10 + (i / (RAIL_COUNT - 1)) * 20);
}

// ── Face field function ────────────────────────────────────────────────────
// rx in [-10, +10], ry in [-8, +8]
// Returns lateral displacement magnitude (always positive; sign applied by caller)
function faceField(rx, ry) {
  // Head outline — oval rim
  const headDist = Math.sqrt((rx / 5.5) ** 2 + ((ry - 0.5) / 7.5) ** 2);
  const headRim = Math.exp(-((headDist - 0.9) ** 2) / 0.006) * 3.5;

  // Left eye — ellipse rim
  const lex = rx + 2.2, ley = ry - 2.8;
  const leftEyeDist = Math.sqrt((lex / 1.3) ** 2 + (ley / 0.8) ** 2);
  const leftEye = Math.exp(-((leftEyeDist - 0.55) ** 2) / 0.02) * 4.0;

  // Right eye
  const rex = rx - 2.2, rey = ry - 2.8;
  const rightEyeDist = Math.sqrt((rex / 1.3) ** 2 + (rey / 0.8) ** 2);
  const rightEye = Math.exp(-((rightEyeDist - 0.55) ** 2) / 0.02) * 4.0;

  // Nose bridge — narrow vertical ridge
  const noseDist = Math.sqrt((rx / 0.6) ** 2 + ((ry + 0.5) / 2.0) ** 2);
  const nose = Math.exp(-(noseDist ** 2) / 0.15) * 1.5;

  // Mouth — horizontal arc
  const mouthY = ry + 3.5;
  const mouthDist = Math.sqrt((Math.max(0, Math.abs(rx) - 2.5)) ** 2 + (mouthY / 0.5) ** 2);
  const mouth = Math.exp(-(mouthDist ** 2) / 0.04) * 3.5;

  // Scale up 1.5× so face features are large enough in the thumbnail
  return (headRim + leftEye + rightEye + nose + mouth) * 1.5;
}

// ── Pre-compute face displacement per rail×particle ────────────────────────
const faceDisp = [];
for (let r = 0; r < RAIL_COUNT; r++) {
  faceDisp[r] = new Float32Array(PARTICLES_PER_RAIL);
  for (let p = 0; p < PARTICLES_PER_RAIL; p++) {
    const y = -8 + (p / (PARTICLES_PER_RAIL - 1)) * 16;
    faceDisp[r][p] = faceField(railBaseX[r], y);
  }
}

// Particle state
const particles = [];
for (let r = 0; r < RAIL_COUNT; r++) {
  for (let p = 0; p < PARTICLES_PER_RAIL; p++) {
    particles.push({
      rail: r,
      pIdx: p,
      y: -8 + (p / (PARTICLES_PER_RAIL - 1)) * 16,
      vy: 0.25 + Math.random() * 0.45,
      phase: Math.random() * Math.PI * 2,
      history: []
    });
  }
}

// Per-rail bloom blend (0=rail, 1=face)
const railBloom = new Float32Array(RAIL_COUNT).fill(0);
const railBloomVel = new Float32Array(RAIL_COUNT).fill(0);

// ── Particle geometry ──────────────────────────────────────────────────────
const segmentGeom = new THREE.BufferGeometry();
const segY = 0.20;
segmentGeom.setAttribute('position', new THREE.Float32BufferAttribute([
  0, -segY, 0,
  0,  segY, 0
], 3));

const instancedGeom = new THREE.InstancedBufferGeometry();
instancedGeom.index = segmentGeom.index;
instancedGeom.attributes.position = segmentGeom.attributes.position;

const offsets = new Float32Array(TOTAL * 3);
const opacities = new Float32Array(TOTAL);
const bloomFactors = new Float32Array(TOTAL);
const skinFactors = new Float32Array(TOTAL); // 1 when on a face feature
instancedGeom.setAttribute('offset', new THREE.InstancedBufferAttribute(offsets, 3));
instancedGeom.setAttribute('opacity', new THREE.InstancedBufferAttribute(opacities, 1));
instancedGeom.setAttribute('bloom', new THREE.InstancedBufferAttribute(bloomFactors, 1));
instancedGeom.setAttribute('skin', new THREE.InstancedBufferAttribute(skinFactors, 1));
instancedGeom.instanceCount = TOTAL;

const lineMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uAmberColor: { value: new THREE.Color(0.789, 0.522, 0.039) }, // #c9850a
    uSkinColor:  { value: new THREE.Color(0.910, 0.753, 0.565) }, // #e8c090
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute vec3 offset;
    attribute float opacity;
    attribute float bloom;
    attribute float skin;
    varying float vOpacity;
    varying float vBloom;
    varying float vSkin;
    uniform float uTime;
    void main(){
      vOpacity = opacity;
      vBloom = bloom;
      vSkin = skin;
      vec3 pos = position + offset;
      float swayAmt = mix(0.035, 0.004, bloom);
      float sway = sin(uTime * 0.6 + offset.y * 0.3 + offset.x * 0.2) * swayAmt;
      pos.x += sway;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uAmberColor;
    uniform vec3 uSkinColor;
    varying float vOpacity;
    varying float vBloom;
    varying float vSkin;
    void main(){
      // blend amber → skin tone based on face feature proximity and bloom
      vec3 col = mix(uAmberColor, uSkinColor, vSkin * vBloom);
      gl_FragColor = vec4(col, vOpacity);
    }
  `
});

const lines = new THREE.LineSegments(instancedGeom, lineMat);
scene.add(lines);

// ── Trail system ────────────────────────────────────────────────────────────
const TRAIL_DEPTH = 4;
const TRAIL_SAMPLE_EVERY = 60; // ms
let lastTrailSample = 0;
const trailBuf = [];
for (let t = 0; t < TRAIL_DEPTH; t++) {
  trailBuf.push(new Float32Array(TOTAL * 2));
}
let trailHead = 0;

let trailLines = null;
let trailGeom = null;

const trailMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float trailAge;
    varying float vAge;
    void main(){
      vAge = trailAge;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAge;
    void main(){
      float alpha = (1.0 - vAge) * 0.55;
      vec3 col = mix(vec3(0.910, 0.753, 0.565), vec3(0.789, 0.522, 0.039), vAge);
      gl_FragColor = vec4(col, alpha);
    }
  `
});

function rebuildTrails() {
  if (trailLines) scene.remove(trailLines);
  trailGeom = null;
  trailLines = null;

  const linePositions = [];
  const ages = [];

  const SAMPLE_STEP = 4;
  for (let i = 0; i < TOTAL; i += SAMPLE_STEP) {
    for (let t = 0; t < TRAIL_DEPTH - 1; t++) {
      const f0 = (trailHead - t + TRAIL_DEPTH) % TRAIL_DEPTH;
      const f1 = (trailHead - t - 1 + TRAIL_DEPTH) % TRAIL_DEPTH;
      const age = t / TRAIL_DEPTH;

      const x0 = trailBuf[f0][i * 2];
      const y0 = trailBuf[f0][i * 2 + 1];
      const x1 = trailBuf[f1][i * 2];
      const y1 = trailBuf[f1][i * 2 + 1];

      const dx = x1 - x0;
      const dy = y1 - y0;
      if (dx * dx + dy * dy < 0.0001) continue;

      linePositions.push(x0, y0, 0, x1, y1, 0);
      ages.push(age, age + 1 / TRAIL_DEPTH);
    }
  }

  if (linePositions.length === 0) return;

  trailGeom = new THREE.BufferGeometry();
  trailGeom.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  trailGeom.setAttribute('trailAge', new THREE.Float32BufferAttribute(ages, 1));
  trailLines = new THREE.LineSegments(trailGeom, trailMat);
  scene.add(trailLines);
}

// ── Mouse tracking ──────────────────────────────────────────────────────────
let mouseNDC = new THREE.Vector2(9999, 9999);
let mouseWorldX = 0, mouseWorldY = 0;
let mousePresent = false;
let lastMouseMove = 0;

addEventListener('mousemove', (e) => {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  mouseNDC.set(x, y);
  mousePresent = true;
  lastMouseMove = performance.now();
});

// Cursor crosshair
const cursorGeom = new THREE.BufferGeometry();
cursorGeom.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.2, 0, 0,  0.2, 0, 0,
   0, -0.2, 0,  0, 0.2, 0
], 3));
const cursorMat = new THREE.LineBasicMaterial({ color: 0xff9922, transparent: true, opacity: 0.35 });
const cursor = new THREE.LineSegments(cursorGeom, cursorMat);
scene.add(cursor);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Main loop ───────────────────────────────────────────────────────────────
let lastT = performance.now();
// Start time for auto-bloom pulse reference
const startTime = performance.now();

function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const time = now / 1000;
  lineMat.uniforms.uTime.value = time;
  trailMat.uniforms.uTime.value = time;

  // Mouse fade-out: if no move in 3s, treat as absent
  if (now - lastMouseMove > 3000) mousePresent = false;

  // Project mouse to world
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouseNDC, camera);
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const isect = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(plane, isect)) {
    mouseWorldX = isect.x;
    mouseWorldY = isect.y;
  }
  cursor.position.set(mouseWorldX, mouseWorldY, 0);
  cursor.visible = mousePresent;

  // ── Auto-bloom pulse: 6-second cycle, 0 → 1 → 0
  // Use a smooth sine-based envelope. At t=0 it rises, peaks at 3s, falls at 6s.
  // We want it to reach ~0.6 by t=3s (validator capture time).
  const elapsed = (now - startTime) / 1000; // seconds since page load
  const CYCLE = 6.0;
  // sin² gives a nice 0→1→0 shape over one full cycle
  const autoBloom = Math.sin((elapsed / CYCLE) * Math.PI) ** 2;
  // At t=3s: sin(π/2)^2 = 1.0 — peak bloom at mid-cycle

  // Update bloom per rail: max of mouse proximity and auto-bloom
  for (let r = 0; r < RAIL_COUNT; r++) {
    const baseX = railBaseX[r];
    const dx = mouseWorldX - baseX;
    const distX = Math.abs(dx);

    const sigma = 3.5;
    let mouseBloom = mousePresent
      ? Math.exp(-(distX * distX) / (2 * sigma * sigma))
      : 0;

    // Combine: take max of mouse bloom and auto-bloom
    const bloomTarget = Math.max(mouseBloom, autoBloom);

    // Smooth spring toward target
    const k = 5.0;
    const damping = 0.85;
    const force = (bloomTarget - railBloom[r]) * k;
    railBloomVel[r] += force * dt;
    railBloomVel[r] *= damping;
    railBloom[r] = Math.max(0, Math.min(1, railBloom[r] + railBloomVel[r] * dt));

    // Decay when no stimulus
    if (!mousePresent && autoBloom < 0.01) {
      railBloom[r] *= 0.97;
      railBloomVel[r] *= 0.9;
    }
  }

  // Update particles
  for (let i = 0; i < TOTAL; i++) {
    const p = particles[i];
    p.y += p.vy * dt;
    if (p.y > 8) p.y -= 16;
    if (p.y < -8) p.y += 16;

    const bloom = railBloom[p.rail];
    const railX = railBaseX[p.rail];

    // Map current particle y back to nearest precomputed index for faceDisp
    // faceDisp is indexed by particle slot p (0..PARTICLES_PER_RAIL-1)
    // But since particles drift in y, we re-compute faceField at current y
    // (cheaper than full precompute given drift; use precomputed only at init)
    const faceD = faceField(railX, p.y);

    // Sign: rails left of center push left, right push right → face silhouette
    const sign = railX < 0 ? -1 : (railX > 0 ? 1 : 0);
    const worldX = railX + faceD * bloom * sign;

    // Skin tint: particles where faceDisp > 2.0 get skin color
    const skinFactor = Math.min(1.0, Math.max(0, (faceD - 2.0) / 2.0));

    // Opacity
    const edgeFade = 1.0 - Math.abs(p.y) / 8.5;
    let opacity = Math.max(0.72, edgeFade);
    const dyMouse = Math.abs(p.y - mouseWorldY);
    if (mousePresent && dyMouse < 3.0) {
      opacity += (1.0 - dyMouse / 3.0) * 0.5;
    }
    opacity += bloom * 0.3;
    opacity = Math.min(1.0, opacity);
    const pulse = 0.88 + 0.12 * Math.sin(time + p.phase);
    opacity *= pulse;

    offsets[i * 3]     = worldX;
    offsets[i * 3 + 1] = p.y;
    offsets[i * 3 + 2] = 0;
    opacities[i] = opacity;
    bloomFactors[i] = bloom;
    skinFactors[i] = skinFactor;
  }

  instancedGeom.attributes.offset.needsUpdate = true;
  instancedGeom.attributes.opacity.needsUpdate = true;
  instancedGeom.attributes.bloom.needsUpdate = true;
  instancedGeom.attributes.skin.needsUpdate = true;

  // Trail sampling
  if (now - lastTrailSample > TRAIL_SAMPLE_EVERY) {
    lastTrailSample = now;
    trailHead = (trailHead + 1) % TRAIL_DEPTH;
    const slot = trailBuf[trailHead];
    let anyBloom = false;
    for (let i = 0; i < TOTAL; i++) {
      const bloom = bloomFactors[i];
      if (bloom > 0.05) anyBloom = true;
      slot[i * 2]     = offsets[i * 3];
      slot[i * 2 + 1] = offsets[i * 3 + 1];
    }
    if (anyBloom || mousePresent) {
      rebuildTrails();
    } else if (trailLines) {
      scene.remove(trailLines);
      trailLines = null;
    }
  }

  // Slow camera drift
  const ang = now * 0.00008;
  camera.position.x = Math.sin(ang) * 1.5;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
