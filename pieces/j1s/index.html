<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MOTION: drift, intensity: gentle -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>j1s · lorenz dissolution</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06070b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">j1s</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ───────── constants ───────── */
const W = 320, H = 320, N = W * H;
const ASCALE = 0.055;            // attractor → scene scale
const CAM_RADIUS = 5.2;
const LOOK_Y = 0.9;

/* ───────── renderer ───────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070b, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 1.3, CAM_RADIUS);
camera.lookAt(0, LOOK_Y, 0);

/* ───────── lighting — warm amber from above, cold teal from below ───────── */
const warmLight = new THREE.DirectionalLight(0xd4a056, 0.7);
warmLight.position.set(1, 5, 2);
scene.add(warmLight);
const coolLight = new THREE.DirectionalLight(0x2a5a6a, 0.35);
coolLight.position.set(-1, -3, -1);
scene.add(coolLight);
scene.add(new THREE.AmbientLight(0x10101a, 0.4));

/* ───────── ortho cam for GPGPU passes ───────── */
const camOrtho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* ───────── ping-pong RTs ───────── */
const rtP = {
  type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false
};
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

/* ───────── particle init helper ───────── */
function seedParticles(surfacePts) {
  const d = new Float32Array(N * 4);
  const hasSurf = surfacePts && surfacePts.length > 8;
  const nv = hasSurf ? surfacePts.length / 3 : 0;
  for (let i = 0; i < N; i++) {
    if (hasSurf) {
      const si = (Math.floor(Math.random() * nv)) * 3;
      // map soldier local coords (~[-0.3,0.3] x [0,1.8] x [-0.2,0.2]) to attractor space
      d[i * 4]     = surfacePts[si]     / ASCALE + (Math.random() - 0.5) * 4;
      d[i * 4 + 1] = (surfacePts[si+1] - 1.0) / ASCALE + (Math.random() - 0.5) * 4;
      d[i * 4 + 2] = surfacePts[si+2]  / ASCALE + 25.0 + (Math.random() - 0.5) * 4;
    } else {
      d[i * 4]     = (Math.random() * 2 - 1) * 8;
      d[i * 4 + 1] = (Math.random() * 2 - 1) * 8;
      d[i * 4 + 2] = (Math.random() * 2 - 1) * 8 + 25;
    }
    d[i * 4 + 3] = Math.random();
  }
  const tex = new THREE.DataTexture(d, W, H, THREE.RGBAFormat, THREE.FloatType);
  tex.needsUpdate = true;
  const mat = new THREE.ShaderMaterial({
    uniforms: { tex: { value: tex } },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
    fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
      void main(){ gl_FragColor=texture2D(tex,vUv); }`
  });
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
  renderer.setRenderTarget(rtA);
  renderer.render(s, camOrtho);
  renderer.setRenderTarget(null);
  mat.dispose(); tex.dispose();
}
seedParticles(null);        // immediate fallback — visible in <1s

/* ───────── Lorenz sim shader ───────── */
const simU = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0 / 3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    precision highp float;
    uniform sampler2D prev;
    uniform float uDt, uSigma, uRho, uBeta;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }`
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ───────── point cloud render ───────── */
const pGeom = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdx[i * 2]     = (x + 0.5) / W;
  uvIdx[i * 2 + 1] = (y + 0.5) / H;
}
pGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
pGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(uvIdx, 2));

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 },
    uScale: { value: ASCALE }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uTime, uScale;
    attribute vec2 uvIdx;
    varying float vAge, vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(vec3(
        10.0*(p.y-p.x), p.x*28.0-p.y-p.x*p.z, p.x*p.y-2.6667*p.z
      ))*0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge   = s.w;
      p.z -= 25.0;
      p   *= uScale;
      p.y += 1.0;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.7 + 1.4*vSpeed) * uPixel * (18.0 / max(dist, 0.4));
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vAge, vSpeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r * 16.0);
      // palette: prussian indigo → dusty rose → warm amber
      vec3 c1 = vec3(0.12, 0.20, 0.56);
      vec3 c2 = vec3(0.74, 0.28, 0.48);
      vec3 c3 = vec3(0.94, 0.80, 0.42);
      float k = mod(vAge + vSpeed*0.4, 1.0);
      vec3 col = mix(c1, c2, smoothstep(0.0, 0.5, k));
      col = mix(col, c3, smoothstep(0.5, 1.0, k));
      gl_FragColor = vec4(col * a * (0.30 + vSpeed*0.9), a*0.65);
    }`
});
const pts = new THREE.Points(pGeom, pMat);
scene.add(pts);

/* ───────── soldier model ───────── */
new GLTFLoader().load(
  'https://raw.githubusercontent.com/mrdoob/three.js/r160/examples/models/gltf/Soldier.glb',
  (gltf) => {
    const model = gltf.scene;
    let bestPts = null;
    model.traverse((ch) => {
      if (!ch.isMesh) return;
      // dark silhouette material — the still center of the storm
      ch.material = new THREE.MeshStandardMaterial({
        color: 0x08080f,
        roughness: 0.92,
        metalness: 0.05,
        transparent: true,
        opacity: 0.55
      });
      // collect surface vertices for particle re-seed
      const pos = ch.geometry.attributes.position;
      if (pos && (!bestPts || pos.count > bestPts.length / 3)) {
        const arr = new Float32Array(pos.count * 3);
        for (let i = 0; i < pos.count; i++) {
          arr[i * 3]     = pos.getX(i);
          arr[i * 3 + 1] = pos.getY(i);
          arr[i * 3 + 2] = pos.getZ(i);
        }
        bestPts = arr;
      }
    });
    model.position.set(0, 0, 0);
    scene.add(model);
    if (bestPts) seedParticles(bestPts);
  },
  undefined,
  () => { /* fallback particles already visible */ }
);

/* ───────── ground hint ───────── */
const gMat = new THREE.MeshStandardMaterial({
  color: 0x06070b, roughness: 0.98, metalness: 0,
  transparent: true, opacity: 0.35
});
const gMesh = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), gMat);
gMesh.rotation.x = -Math.PI / 2;
gMesh.position.y = -0.005;
scene.add(gMesh);

/* ───────── film grain overlay ───────── */
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float g = h(vUv*900.0 + uTime*137.0)*0.055;
      gl_FragColor = vec4(vec3(g), g*0.4);
    }`
});
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const grainScene = new THREE.Scene();
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat));

/* ───────── interaction ───────── */
const tgt = { sigma: 10.0, rho: 28.0 };
addEventListener('pointermove', (e) => {
  const nx = e.clientX / innerWidth - 0.5;
  const ny = e.clientY / innerHeight - 0.5;
  tgt.rho   = 28.0 + ny * 6.0;
  tgt.sigma = 10.0 + nx * 2.5;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ───────── main loop ───────── */
function loop() {
  const now = performance.now();
  simU.uSigma.value += (tgt.sigma - simU.uSigma.value) * 0.05;
  simU.uRho.value   += (tgt.rho   - simU.uRho.value)   * 0.05;

  for (let i = 0; i < 4; i++) {
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pMat.uniforms.state.value = rtA.texture;
  pMat.uniforms.uTime.value = now * 0.001;

  // slow deliberate orbit
  const ang = now * 0.00007;
  camera.position.x = Math.sin(ang) * CAM_RADIUS;
  camera.position.z = Math.cos(ang) * CAM_RADIUS;
  camera.position.y = 1.25 + Math.sin(ang * 0.6) * 0.25;
  camera.lookAt(0, LOOK_Y, 0);

  renderer.render(scene, camera);

  // grain pass
  grainMat.uniforms.uTime.value = now * 0.001;
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
