<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>ym6 · withdrawn object</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08090d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">ym6</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ── scene ──
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 1.5, 80);
camera.position.set(18, 7, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08090d, 1);
document.body.appendChild(renderer.domElement);

// ── L-system cypress (pose A) ──
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F' },
    { p: 0.25, s: 'FF[/f]\\F' },
    { p: 0.20, s: 'F[+f-f][/f\\f]F' },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]' },
    { p: 0.4, s: 'f' },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(), h = new THREE.Vector3(0,1,0),
      l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1), gen = 0;
  const rot = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen }); pos = next; break;
      }
      case '+': rot(u, +ANGLE); break; case '-': rot(u, -ANGLE); break;
      case '&': rot(l, +ANGLE); break; case '^': rot(l, -ANGLE); break;
      case '/': rot(h, +ANGLE*1.5); break; case '\\': rot(h, -ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const cypressSegs = turtle(expand('F', 6, rng));

// ── art-deco tower (pose B) ──
function sampleArtDeco(N){
  const out = new Float32Array(N * 3), pos = new THREE.Vector3();
  const tiers = [
    { hw: 4.5, y0: 0, y1: 4, ridges: 14 },
    { hw: 3.4, y0: 4, y1: 7.5, ridges: 12 },
    { hw: 2.4, y0: 7.5, y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13, ridges: 8 },
    { hw: 0.85, y0: 13, y1: 15, ridges: 6 },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;
  const W = Math.floor(N*0.55), B = Math.floor(N*0.25), S = Math.floor(N*0.12), C = N-W-B-S;
  let i = 0;
  const tw = tiers.map(t => 8*t.hw*(t.y1-t.y0));
  const twT = tw.reduce((a,b)=>a+b,0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = ti===tiers.length-1 ? W-i : Math.max(1, Math.floor(tw[ti]/twT*W));
    for (let k = 0; k < count && i < W; k++){
      const face = Math.floor(Math.random()*4);
      const r = Math.floor(Math.random()*t.ridges);
      const rf = (r+0.5)/t.ridges;
      const along = (rf*2-1)*t.hw;
      const y = t.y0+Math.random()*(t.y1-t.y0);
      const j = 0.04;
      switch(face){
        case 0: pos.set(t.hw+(Math.random()-.5)*j,y,along); break;
        case 1: pos.set(-t.hw+(Math.random()-.5)*j,y,along); break;
        case 2: pos.set(along,y,t.hw+(Math.random()-.5)*j); break;
        case 3: pos.set(along,y,-t.hw+(Math.random()-.5)*j); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }
  for (let k=0; k<B && i<W+B; k++){
    const ti=Math.floor(Math.random()*tiers.length), t=tiers[ti];
    const edge=Math.random()<0.6?t.y1:t.y0, face=Math.floor(Math.random()*4);
    const along=(Math.random()*2-1)*t.hw, j=0.02;
    switch(face){
      case 0: pos.set(t.hw,edge+(Math.random()-.5)*j,along); break;
      case 1: pos.set(-t.hw,edge+(Math.random()-.5)*j,along); break;
      case 2: pos.set(along,edge+(Math.random()-.5)*j,t.hw); break;
      case 3: pos.set(along,edge+(Math.random()-.5)*j,-t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  for (let k=0; k<S && i<W+B+S; k++){
    const t=Math.random(), y=spireTop+t*(spireApex-spireTop);
    const r=spireBase*(1-t), th=Math.random()*Math.PI*2;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  const chevrons=16;
  for (let k=0; k<C && i<N; k++){
    const ch=Math.floor(Math.random()*chevrons);
    const th=(ch+.5)/chevrons*Math.PI*2, along=Math.random();
    const r=0.7+along*1.3, y=spireTop-0.4+along*0.8+(Math.random()-.5)*0.05;
    pos.set(Math.cos(th)*r,y,Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ── build particle data ──
const N = 70000;
const treePos = new Float32Array(N*3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const N_SKEL = Math.floor(N*0.55), N_FOL = N - N_SKEL;
let written = 0;
const v = new THREE.Vector3();

for (let i = 0; i < cypressSegs.length; i++){
  const share = i===cypressSegs.length-1 ? N_SKEL-written : Math.max(1,Math.floor(N_SKEL*lens[i]/totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const j = 0.05*Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]=v.x+(Math.random()-.5)*j;
    treePos[written*3+1]=v.y+(Math.random()-.5)*j;
    treePos[written*3+2]=v.z+(Math.random()-.5)*j;
    seeds[written]=Math.random(); written++;
  }
}
{
  let yMin=Infinity, yMax=-Infinity;
  for (const s of cypressSegs){ yMin=Math.min(yMin,s.from.y,s.to.y); yMax=Math.max(yMax,s.from.y,s.to.y); }
  const haloYStart = yMin + (yMax-yMin)*0.16;
  const RIDGES=8, SPIRAL=0.9, TUFT_COUNT=24;
  const tuftYs=[], tuftThs=[];
  for (let i=0;i<TUFT_COUNT;i++){
    tuftYs.push(haloYStart+(i+.5)/TUFT_COUNT*(yMax-haloYStart));
    tuftThs.push(Math.random()*Math.PI*2);
  }
  const NR=Math.floor(N_FOL*0.6), NT=N_FOL-NR;
  for (let k=0;k<NR&&written<N;k++){
    const yt=Math.random(), y=haloYStart+yt*(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-.45,2));
    const baseR=0.05+0.95*taper;
    const ridge=Math.floor(Math.random()*RIDGES);
    const ridgeTh=ridge/RIDGES*Math.PI*2+y*SPIRAL;
    const th=ridgeTh+(Math.random()-.5)*0.3;
    const r=baseR*(0.55+0.45*Math.random());
    treePos[written*3]=Math.cos(th)*r;
    treePos[written*3+1]=y+(Math.random()-.5)*0.05;
    treePos[written*3+2]=Math.sin(th)*r;
    seeds[written]=Math.random(); written++;
  }
  for (let k=0;k<NT&&written<N;k++){
    const t=Math.floor(Math.random()*TUFT_COUNT);
    const yt=(tuftYs[t]-haloYStart)/(yMax-haloYStart);
    const taper=Math.max(0.18,1-1.5*Math.pow(yt-.45,2));
    const baseR=0.05+0.95*taper;
    const reach=baseR+0.1+Math.random()*0.35;
    const localTh=tuftThs[t]+(Math.random()-.5)*0.4;
    const localR=reach+(Math.random()-.5)*0.18;
    treePos[written*3]=Math.cos(localTh)*localR;
    treePos[written*3+1]=tuftYs[t]+(Math.random()-.5)*0.4;
    treePos[written*3+2]=Math.sin(localTh)*localR;
    seeds[written]=Math.random(); written++;
  }
}
while(written<N){ treePos[written*3]=0;treePos[written*3+1]=0;treePos[written*3+2]=0;seeds[written]=Math.random();written++; }

function fitToHeight(arr, h){
  let minY=Infinity, maxY=-Infinity, cx=0, cz=0;
  const n=arr.length/3;
  for(let i=0;i<n;i++){ minY=Math.min(minY,arr[i*3+1]); maxY=Math.max(maxY,arr[i*3+1]); cx+=arr[i*3]; cz+=arr[i*3+2]; }
  cx/=n; cz/=n; const s=h/(maxY-minY);
  for(let i=0;i<n;i++){ arr[i*3]=(arr[i*3]-cx)*s; arr[i*3+1]=(arr[i*3+1]-minY)*s; arr[i*3+2]=(arr[i*3+2]-cz)*s; }
}
fitToHeight(treePos,16); fitToHeight(towerPos,16);

// ── shy zones: 4 regions that withdraw when camera approaches ──
// positions in object space; each has a radius of influence
const shyZones = [
  new THREE.Vector4(0, 14, 0, 3.5),    // crown
  new THREE.Vector4(3, 6, 2, 3.0),     // lower right flank
  new THREE.Vector4(-2, 10, -3, 2.8),  // mid-left back
  new THREE.Vector4(1, 2, -1, 3.2),    // base
];

// ── shader material ──
const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uMix:     { value: 0.35 },
  uCamPos:  { value: new THREE.Vector3() },
  uShy0:    { value: shyZones[0] },
  uShy1:    { value: shyZones[1] },
  uShy2:    { value: shyZones[2] },
  uShy3:    { value: shyZones[3] },
  uFogCol:  { value: new THREE.Color(0x08090d) },
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uMix;
    uniform vec3 uCamPos;
    uniform vec4 uShy0, uShy1, uShy2, uShy3;
    attribute vec3 treePos, towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    // shy-zone fade: particle fades when camera is near the zone it belongs to
    float shyFade(vec3 p, vec4 zone, vec3 cam){
      float dP = length(p - zone.xyz);          // particle distance to zone center
      float inZone = 1.0 - smoothstep(0.0, zone.w, dP);  // 1 at center, 0 outside
      float dC = length(cam - zone.xyz);         // camera distance to zone center
      float camClose = 1.0 - smoothstep(8.0, 18.0, dC);  // 1 when camera near, 0 when far
      return 1.0 - inZone * camClose * 0.92;     // withdrawal strength
    }

    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // gentle sway — organic drift, dampened by morph
      float t = uTime * 0.4 + seed * 6.28;
      float sway = (1.0 - m * 0.6) * 0.05 * (p.y / 16.0);
      p.x += sway * sin(t);
      p.z += sway * cos(t * 0.7);

      // breathing — form inhales/exhales subtly
      float breath = sin(uTime * 0.15) * 0.03;
      p.xz *= 1.0 + breath;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // compute shy zone withdrawal
      float shy = shyFade(p, uShy0, uCamPos)
                * shyFade(p, uShy1, uCamPos)
                * shyFade(p, uShy2, uCamPos)
                * shyFade(p, uShy3, uCamPos);

      // variable-density fog: thicker at mid-height, thinner at extremes
      float fogBand = 0.6 + 0.4 * sin(p.y * 0.35 + uTime * 0.08);
      float fogAmt = 1.0 - exp(-dist * 0.022 * fogBand);

      // depth fade — particles beyond 45 units dissolve
      float depthFade = smoothstep(55.0, 35.0, dist);

      // near-clip dissolution — particles very close to camera break apart
      float nearDissolve = smoothstep(2.0, 4.5, dist);

      // palette: muted sage-grey ↔ tarnished bronze — desaturated, withdrawn
      // Harman: the object's sensual qualities are never the real object
      vec3 sageA  = vec3(0.22, 0.28, 0.24);   // deep sage
      vec3 sageB  = vec3(0.48, 0.56, 0.44);   // mid sage
      vec3 sageC  = vec3(0.72, 0.76, 0.62);   // pale sage highlight
      vec3 bronA  = vec3(0.30, 0.24, 0.18);   // dark tarnished bronze
      vec3 bronB  = vec3(0.58, 0.48, 0.34);   // mid bronze
      vec3 bronC  = vec3(0.82, 0.74, 0.58);   // warm bronze highlight

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol = mix(sageA, sageB, hk);
      treeCol = mix(treeCol, sageC, smoothstep(0.75, 1.0, hk) * 0.5);
      vec3 decoCol = mix(bronA, bronB, hk);
      decoCol = mix(decoCol, bronC, smoothstep(0.8, 1.0, hk) * 0.5);

      // the color itself is ambiguous — never fully one palette
      vCol = mix(treeCol, decoCol, m);
      // slight per-particle color drift so it doesn't look uniform
      vCol *= 0.85 + 0.15 * sin(seed * 47.0 + uTime * 0.1);

      float energy = 0.4 + 0.3 * sin(t * 0.6);
      vAlpha = energy * shy * (1.0 - fogAmt * 0.85) * depthFade * nearDissolve;

      // particles shrink as they withdraw (shy + fog)
      float sz = (0.7 + 0.5 * energy) * uPixel * (45.0 / dist);
      sz *= shy * mix(0.5, 1.0, depthFade);
      gl_PointSize = max(sz, 0.5);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float soft = exp(-r * 16.0);
      float a = soft * vAlpha;
      if (a < 0.003) discard;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── fog veil planes: two translucent planes that drift through the scene ──
// These create bands of occlusion — parts of the form vanish behind them
const veilGeo = new THREE.PlaneGeometry(40, 20);
const veilMat1 = new THREE.MeshBasicMaterial({
  color: 0x0a0b10, transparent: true, opacity: 0.0, side: THREE.DoubleSide,
  depthWrite: false, blending: THREE.NormalBlending
});
const veilMat2 = veilMat1.clone();
const veil1 = new THREE.Mesh(veilGeo, veilMat1);
const veil2 = new THREE.Mesh(veilGeo, veilMat2);
veil1.position.set(0, 8, 0);
veil2.position.set(0, 8, 0);
scene.add(veil1, veil2);

// ── dust motes: sparse environmental particles for atmosphere ──
const dustN = 800;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(dustN * 3);
const dustSeed = new Float32Array(dustN);
for (let i = 0; i < dustN; i++){
  dustPos[i*3]   = (Math.random()-0.5) * 50;
  dustPos[i*3+1] = Math.random() * 24;
  dustPos[i*3+2] = (Math.random()-0.5) * 50;
  dustSeed[i] = Math.random();
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('seed', new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel;
    attribute float seed;
    varying float vA;
    void main(){
      vec3 p = position;
      p.y = mod(p.y + uTime * 0.08 * (0.5 + seed), 24.0);
      p.x += sin(uTime * 0.12 + seed * 20.0) * 0.3;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (12.0 / dist);
      vA = 0.08 * smoothstep(60.0, 10.0, dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vA;
      gl_FragColor = vec4(vec3(0.55, 0.58, 0.52) * a, a);
    }
  `
});
scene.add(new THREE.Points(dustGeo, dustMat));

// ── resize ──
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── animation ──
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // morph: perpetually ambiguous — drifts between 0.25 and 0.75, never resolves
  // two incommensurate sine waves so it never repeats cleanly
  const m1 = Math.sin(t * 0.062) * 0.22;
  const m2 = Math.sin(t * 0.041 + 1.7) * 0.13;
  uniforms.uMix.value = 0.5 + m1 + m2;

  // camera: slow contemplative orbit, varying radius and height
  // the camera tries to see the whole but the form always partially escapes
  const orbT = t * 0.035;
  const radius = 20 + Math.sin(t * 0.027) * 5;
  const camY = 7.5 + Math.sin(t * 0.019 + 0.8) * 3;
  camera.position.set(
    Math.sin(orbT) * radius,
    camY,
    Math.cos(orbT) * radius
  );
  // look slightly off-center — never directly at the object's heart
  const lookOff = Math.sin(t * 0.023) * 1.2;
  camera.lookAt(lookOff, 8 + Math.sin(t * 0.015) * 0.8, lookOff * 0.5);
  uniforms.uCamPos.value.copy(camera.position);

  // veil planes: drift through the scene, fading in/out
  // they create moving bands of occlusion
  const v1Ang = t * 0.03;
  veil1.rotation.y = v1Ang;
  veil1.position.z = Math.sin(t * 0.045) * 6;
  veilMat1.opacity = 0.15 + 0.12 * Math.sin(t * 0.07);

  const v2Ang = t * 0.022 + Math.PI * 0.6;
  veil2.rotation.y = v2Ang;
  veil2.rotation.x = 0.15;
  veil2.position.x = Math.cos(t * 0.038) * 5;
  veilMat2.opacity = 0.10 + 0.10 * Math.sin(t * 0.055 + 2.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
