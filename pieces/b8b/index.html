<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b8b · thread field · Chiharu Shiota</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">b8b · thread field · Chiharu Shiota</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.015);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 12, 45);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0a, 1);
document.body.appendChild(renderer.domElement);

// Shiota's suspended dress — central object anchoring the thread field
const dressGeometry = new THREE.CylinderGeometry(1.2, 3.5, 9, 24, 12, false);
// Deform to silhouette shape
const dressPos = dressGeometry.attributes.position;
for (let i = 0; i < dressPos.count; i++){
  const y = dressPos.getY(i);
  const x = dressPos.getX(i);
  const z = dressPos.getZ(i);
  const r = Math.sqrt(x*x + z*z);
  const yFactor = (y + 4.5) / 9;
  const bulge = 1 + 0.4 * Math.sin(yFactor * Math.PI) * (1 - Math.abs(yFactor - 0.5) * 2);
  dressPos.setXYZ(i, x * bulge, y, z * bulge);
}
dressGeometry.computeVertexNormals();

const dressMat = new THREE.MeshBasicMaterial({ 
  color: 0x1a1a1a, 
  transparent: true, 
  opacity: 0.3,
  side: THREE.DoubleSide
});
const dress = new THREE.Mesh(dressGeometry, dressMat);
dress.position.y = 4;
scene.add(dress);

// Sample anchor points from dress surface
const sampler = new MeshSurfaceSampler(dress).build();
const dressAnchors = [];
const NUM_DRESS_ANCHORS = 600;
const _pos = new THREE.Vector3();
for (let i = 0; i < NUM_DRESS_ANCHORS; i++){
  sampler.sample(_pos);
  dressAnchors.push(_pos.clone());
}

// Wall anchor clusters — Shiota threads reach toward architectural boundaries
const wallAnchors = [];
const WALL_CLUSTERS = 8;
const ROOM_WIDTH = 50;
const ROOM_HEIGHT = 30;
const ROOM_DEPTH = 50;

for (let c = 0; c < WALL_CLUSTERS; c++){
  const side = Math.floor(Math.random() * 4);
  let baseX, baseY, baseZ;
  
  switch(side){
    case 0: // left wall
      baseX = -ROOM_WIDTH/2;
      baseY = (Math.random() - 0.3) * ROOM_HEIGHT;
      baseZ = (Math.random() - 0.5) * ROOM_DEPTH;
      break;
    case 1: // right wall
      baseX = ROOM_WIDTH/2;
      baseY = (Math.random() - 0.3) * ROOM_HEIGHT;
      baseZ = (Math.random() - 0.5) * ROOM_DEPTH;
      break;
    case 2: // back wall
      baseX = (Math.random() - 0.5) * ROOM_WIDTH;
      baseY = (Math.random() - 0.3) * ROOM_HEIGHT;
      baseZ = -ROOM_DEPTH/2;
      break;
    case 3: // front wall
      baseX = (Math.random() - 0.5) * ROOM_WIDTH;
      baseY = (Math.random() - 0.3) * ROOM_HEIGHT;
      baseZ = ROOM_DEPTH/2;
      break;
  }
  
  const clusterSize = 80 + Math.floor(Math.random() * 60);
  for (let i = 0; i < clusterSize; i++){
    const offset = new THREE.Vector3(
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 8
    );
    wallAnchors.push(new THREE.Vector3(baseX, baseY, baseZ).add(offset));
  }
}

// Floor anchor points — threads pool downward
const floorAnchors = [];
const FLOOR_DENSITY = 400;
const floorY = -12;
for (let i = 0; i < FLOOR_DENSITY; i++){
  const x = (Math.random() - 0.5) * 35;
  const z = (Math.random() - 0.5) * 35;
  const y = floorY + Math.random() * 2;
  floorAnchors.push(new THREE.Vector3(x, y, z));
}

// Ceiling anchor points — suspension
const ceilingAnchors = [];
const CEILING_DENSITY = 180;
const ceilingY = 18;
for (let i = 0; i < CEILING_DENSITY; i++){
  const x = (Math.random() - 0.5) * 25;
  const z = (Math.random() - 0.5) * 25;
  const y = ceilingY + (Math.random() - 0.5) * 2;
  ceilingAnchors.push(new THREE.Vector3(x, y, z));
}

// Generate thread segments — Shiota's signature: object-to-space
const segments = [];
const NUM_THREADS = 14000;

function createThread(start, end, swayFactor){
  segments.push({
    start: start.clone(),
    end: end.clone(),
    originalStart: start.clone(),
    originalEnd: end.clone(),
    swayFactor
  });
}

// Dress-to-wall threads (primary network)
for (let i = 0; i < NUM_THREADS * 0.4; i++){
  const dressAnchor = dressAnchors[Math.floor(Math.random() * dressAnchors.length)];
  const wallAnchor = wallAnchors[Math.floor(Math.random() * wallAnchors.length)];
  createThread(dressAnchor, wallAnchor, 0.6 + Math.random() * 0.4);
}

// Dress-to-floor threads (weight, gravity)
for (let i = 0; i < NUM_THREADS * 0.25; i++){
  const dressAnchor = dressAnchors[Math.floor(Math.random() * dressAnchors.length)];
  const floorAnchor = floorAnchors[Math.floor(Math.random() * floorAnchors.length)];
  createThread(dressAnchor, floorAnchor, 0.3 + Math.random() * 0.3);
}

// Ceiling-to-dress threads (suspension)
for (let i = 0; i < NUM_THREADS * 0.15; i++){
  const ceilingAnchor = ceilingAnchors[Math.floor(Math.random() * ceilingAnchors.length)];
  const dressAnchor = dressAnchors[Math.floor(Math.random() * dressAnchors.length)];
  createThread(ceilingAnchor, dressAnchor, 0.2 + Math.random() * 0.2);
}

// Wall-to-wall threads (architectural web)
for (let i = 0; i < NUM_THREADS * 0.12; i++){
  const wall1 = wallAnchors[Math.floor(Math.random() * wallAnchors.length)];
  const wall2 = wallAnchors[Math.floor(Math.random() * wallAnchors.length)];
  if (wall1.distanceTo(wall2) > 5){
    createThread(wall1, wall2, 0.8 + Math.random() * 0.4);
  }
}

// Floor-to-wall threads (pooled base)
for (let i = 0; i < NUM_THREADS * 0.08; i++){
  const floorAnchor = floorAnchors[Math.floor(Math.random() * floorAnchors.length)];
  const wallAnchor = wallAnchors[Math.floor(Math.random() * wallAnchors.length)];
  createThread(floorAnchor, wallAnchor, 0.5 + Math.random() * 0.3);
}

// Build line geometry
const linePositions = new Float32Array(segments.length * 6);
const lineOpacities = new Float32Array(segments.length * 2);

for (let i = 0; i < segments.length; i++){
  linePositions[i*6]   = segments[i].start.x;
  linePositions[i*6+1] = segments[i].start.y;
  linePositions[i*6+2] = segments[i].start.z;
  linePositions[i*6+3] = segments[i].end.x;
  linePositions[i*6+4] = segments[i].end.y;
  linePositions[i*6+5] = segments[i].end.z;
  
  const baseOpacity = 0.08 + Math.random() * 0.04;
  lineOpacities[i*2] = baseOpacity;
  lineOpacities[i*2+1] = baseOpacity;
}

const lineGeometry = new THREE.BufferGeometry();
lineGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeometry.setAttribute('opacity', new THREE.BufferAttribute(lineOpacities, 1));

const lineMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float opacity;
    varying float vOpacity;
    void main(){
      vOpacity = opacity;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vOpacity;
    void main(){
      vec3 crimson = vec3(0.61, 0.12, 0.12);
      gl_FragColor = vec4(crimson * vOpacity, vOpacity);
    }
  `
});

const lineSegments = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(lineSegments);

// Subtle camera drift
const cameraTarget = new THREE.Vector3(0, 4, 0);
let cameraAngle = 0;

// Pointer-driven sway
let mouseX = 0, mouseY = 0;
addEventListener('pointermove', e => {
  mouseX = (e.clientX / innerWidth - 0.5) * 2;
  mouseY = (e.clientY / innerHeight - 0.5) * 2;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  
  // Slow camera orbit
  cameraAngle += 0.0003;
  const radius = 45;
  camera.position.x = Math.cos(cameraAngle) * radius;
  camera.position.z = Math.sin(cameraAngle) * radius;
  camera.position.y = 12 + Math.sin(cameraAngle * 0.5) * 4;
  camera.lookAt(cameraTarget);
  
  // Subtle thread sway
  const swayX = Math.sin(t * 0.3) * 0.4 + mouseX * 0.8;
  const swayY = Math.cos(t * 0.25) * 0.3 + mouseY * 0.6;
  
  for (let i = 0; i < segments.length; i++){
    const seg = segments[i];
    const sway = new THREE.Vector3(swayX, swayY, 0).multiplyScalar(seg.swayFactor * 0.15);
    
    seg.start.copy(seg.originalStart).add(sway);
    seg.end.copy(seg.originalEnd).add(sway.multiplyScalar(0.8));
    
    linePositions[i*6]   = seg.start.x;
    linePositions[i*6+1] = seg.start.y;
    linePositions[i*6+2] = seg.start.z;
    linePositions[i*6+3] = seg.end.x;
    linePositions[i*6+4] = seg.end.y;
    linePositions[i*6+5] = seg.end.z;
  }
  
  lineGeometry.attributes.position.needsUpdate = true;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
