<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: spreading, intensity: gentle -->
<title>jeq · physarum transport network</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#080a07; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">jeq</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/*  Physarum polycephalum pheromone-trail simulation — GPGPU
    Reference: Jeff Jones (2010) "Characteristics of pattern formation
    and evolution in approximations of Physarum transport networks"
    ~100 k agents sense / turn / deposit on a 2D trail field.
    Emergent anastomosis networks — non-human cognition driving form.  */

const AW = 320, AH = 320;          // agent texture  → 102 400 agents
const TW = 1024, TH = 1024;        // trail field resolution

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080a07, 1);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const ortho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quad = () => new THREE.PlaneGeometry(2,2);

/* ── render-target factories ── */
function nearestRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
    depthBuffer: false });
}
function linearRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
    depthBuffer: false });
}

let agentA = nearestRT(AW, AH), agentB = nearestRT(AW, AH);
let trailA = linearRT(TW, TH),  trailB = linearRT(TW, TH);

/* ── seed agents: asymmetric off-center clusters ── */
const seed = new Float32Array(AW * AH * 4);
const clusters = [[TW*0.38,TH*0.35,90],[TW*0.62,TH*0.55,70],
                   [TW*0.25,TH*0.65,60],[TW*0.72,TH*0.3,55],[TW*0.5,TH*0.78,50]];
for (let i = 0; i < AW * AH; i++) {
  const c = clusters[i % clusters.length];
  const r = Math.random() * c[2] + 3;
  const a = Math.random() * Math.PI * 2;
  seed[i*4]   = c[0] + Math.cos(a) * r;
  seed[i*4+1] = c[1] + Math.sin(a) * r;
  seed[i*4+2] = Math.random() * Math.PI * 2;
  seed[i*4+3] = Math.random();
}
const seedTex = new THREE.DataTexture(seed, AW, AH, THREE.RGBAFormat, THREE.FloatType);
seedTex.needsUpdate = true;

/* ── generic blit material ── */
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: seedTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(quad(), blitMat));

renderer.setRenderTarget(agentA);
renderer.clear(); renderer.render(blitScene, ortho);
renderer.setRenderTarget(null);

/* ── agent update: sense → turn → move ── */
const agentMat = new THREE.ShaderMaterial({
  uniforms: {
    uAgents: { value: null }, uTrail: { value: null },
    uRes: { value: new THREE.Vector2(TW, TH) },
    uSD: { value: 9.0 }, uSA: { value: 0.42 },
    uTS: { value: 0.32 }, uMS: { value: 1.1 },
    uTime: { value: 0 }, uRng: { value: Math.random()*999 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uAgents, uTrail;
    uniform vec2 uRes;
    uniform float uSD, uSA, uTS, uMS, uTime, uRng;
    varying vec2 vUv;
    float hash(vec2 p){
      vec3 q=fract(vec3(p.xyx)*0.1031);
      q+=dot(q,q.yzx+33.33);
      return fract((q.x+q.y)*q.z);
    }
    float sense(vec2 pos, float ang){
      vec2 sp = pos + vec2(cos(ang),sin(ang)) * uSD;
      sp = mod(sp, uRes);
      return texture2D(uTrail, sp/uRes).r;
    }
    void main(){
      vec4 ag = texture2D(uAgents, vUv);
      vec2 p = ag.xy; float ang = ag.z; float age = ag.w;
      float rn = hash(vUv*127.7 + uTime*0.1 + uRng);
      float sL = sense(p, ang + uSA);
      float sC = sense(p, ang);
      float sR = sense(p, ang - uSA);
      if(sC >= sL && sC >= sR){ /* straight */ }
      else if(sC < sL && sC < sR){ ang += (rn>0.5?1.0:-1.0)*uTS; }
      else if(sL > sR){ ang += uTS; }
      else { ang -= uTS; }
      p += vec2(cos(ang),sin(ang)) * uMS;
      p = mod(p, uRes);
      age = mod(age + 0.0008, 1.0);
      gl_FragColor = vec4(p, ang, age);
    }
  `
});
const agentScene = new THREE.Scene();
agentScene.add(new THREE.Mesh(quad(), agentMat));

/* ── deposit: render agents as 1 px points onto trail (additive) ── */
const depGeom = new THREE.BufferGeometry();
const depUV = new Float32Array(AW*AH*2);
for (let y=0;y<AH;y++) for (let x=0;x<AW;x++){
  const i=y*AW+x;
  depUV[i*2]=(x+.5)/AW; depUV[i*2+1]=(y+.5)/AH;
}
depGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(AW*AH*3),3));
depGeom.setAttribute('uvIdx', new THREE.BufferAttribute(depUV,2));

const depMat = new THREE.ShaderMaterial({
  uniforms: { uAgents:{value:null}, uRes:{value:new THREE.Vector2(TW,TH)} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D uAgents; uniform vec2 uRes; attribute vec2 uvIdx;
    void main(){
      vec4 a=texture2D(uAgents,uvIdx);
      vec2 ndc=(a.xy/uRes)*2.0-1.0;
      gl_Position=vec4(ndc,0.0,1.0); gl_PointSize=1.0;
    }`,
  fragmentShader: `void main(){ gl_FragColor=vec4(0.018,0.014,0.009,1.0); }`
});
const depScene = new THREE.Scene();
depScene.add(new THREE.Points(depGeom, depMat));

/* ── diffuse + decay ── */
const diffMat = new THREE.ShaderMaterial({
  uniforms: { uTrail:{value:null}, uRes:{value:new THREE.Vector2(TW,TH)},
              uDecay:{value:0.962} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uTrail; uniform vec2 uRes; uniform float uDecay;
    varying vec2 vUv;
    void main(){
      vec2 px=1.0/uRes; vec4 s=vec4(0.0);
      for(int dy=-1;dy<=1;dy++) for(int dx=-1;dx<=1;dx++)
        s+=texture2D(uTrail, vUv+vec2(float(dx),float(dy))*px);
      s/=9.0;
      vec4 o=texture2D(uTrail,vUv);
      gl_FragColor=mix(o,s,0.92)*uDecay;
    }`
});
const diffScene = new THREE.Scene();
diffScene.add(new THREE.Mesh(quad(), diffMat));

/* ── display: trail → screen with bioluminescent palette ── */
const dispMat = new THREE.ShaderMaterial({
  uniforms: { uTrail:{value:null}, uTime:{value:0} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uTrail; uniform float uTime; varying vec2 vUv;
    void main(){
      float t = texture2D(uTrail, vUv).r;
      /* palette: dark loam → deep moss → bioluminescent → foxfire → amber node
         inspired by foxfire (Panellus stipticus) bioluminescence on the forest floor */
      vec3 c0 = vec3(0.031, 0.039, 0.027);   // near-black loam
      vec3 c1 = vec3(0.055, 0.12, 0.085);    // dark moss
      vec3 c2 = vec3(0.10, 0.32, 0.24);      // deep bioluminescent
      vec3 c3 = vec3(0.22, 0.65, 0.48);      // foxfire green
      vec3 c4 = vec3(0.78, 0.62, 0.30);      // amber convergence node

      float v = pow(clamp(t * 7.5, 0.0, 1.0), 1.05);
      vec3 col;
      if(v < 0.12)      col = mix(c0, c1, v / 0.12);
      else if(v < 0.32) col = mix(c1, c2, (v-0.12)/0.20);
      else if(v < 0.62) col = mix(c2, c3, (v-0.32)/0.30);
      else               col = mix(c3, c4, (v-0.62)/0.38);

      // film grain — photochemical imperfection (Lia Halloran)
      float gr = (fract(sin(dot(vUv*400.0+uTime*0.3,vec2(12.9898,78.233)))*43758.5453)-0.5)*0.035;
      col += gr;

      // asymmetric vignette — off-center, non-human gaze
      vec2 vc = vUv - vec2(0.44, 0.40);
      col *= 1.0 - dot(vc, vc) * 0.75;

      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`
});
const dispScene = new THREE.Scene();
dispScene.add(new THREE.Mesh(quad(), dispMat));

/* ── resize ── */
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

/* ── slow parameter drift: sensor distance & angle breathe over time ── */
let frame = 0;
function loop(){
  frame++;
  const t = frame * 0.016;

  // organic parameter drift — network restructures slowly
  agentMat.uniforms.uSD.value = 9.0 + Math.sin(t * 0.04) * 2.5;
  agentMat.uniforms.uSA.value = 0.42 + Math.sin(t * 0.025 + 1.3) * 0.12;
  agentMat.uniforms.uMS.value = 1.1 + Math.sin(t * 0.018 + 2.7) * 0.15;

  // 1. update agents
  agentMat.uniforms.uAgents.value = agentA.texture;
  agentMat.uniforms.uTrail.value = trailA.texture;
  agentMat.uniforms.uTime.value = t;
  renderer.setRenderTarget(agentB);
  renderer.clear(); renderer.render(agentScene, ortho);
  let tmp = agentA; agentA = agentB; agentB = tmp;

  // 2. deposit: copy trail then add agent deposits
  blitMat.uniforms.tex.value = trailA.texture;
  renderer.setRenderTarget(trailB);
  renderer.clear(); renderer.render(blitScene, ortho);
  depMat.uniforms.uAgents.value = agentA.texture;
  renderer.setRenderTarget(trailB);
  renderer.render(depScene, ortho);   // additive, no clear
  tmp = trailA; trailA = trailB; trailB = tmp;

  // 3. diffuse + decay
  diffMat.uniforms.uTrail.value = trailA.texture;
  renderer.setRenderTarget(trailB);
  renderer.clear(); renderer.render(diffScene, ortho);
  tmp = trailA; trailA = trailB; trailB = tmp;

  // 4. display
  dispMat.uniforms.uTrail.value = trailA.texture;
  dispMat.uniforms.uTime.value = t;
  renderer.setRenderTarget(null);
  renderer.clear(); renderer.render(dispScene, ortho);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
