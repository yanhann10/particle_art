<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8nl · Riley wave grid (momentary color burst)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ffffff; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; }
</style>
</head>
<body>
<div class="id">8nl</div>
<div class="hint">click to regenerate pattern</div>
<div class="src">Riley · wave interference · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 30;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points, mat;
let lastClickTime = 0;
let burstPhase = 0;

const uniforms = {
  uTime: { value: 0 },
  uPhase: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uRowFreq: { value: 0 },
  uColFreq: { value: 0 },
  uWaveAmp: { value: 0 },
  uTwist: { value: 0 },
  uBurst: { value: 0 },
};

mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: false,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uBurst;
    
    attribute vec2 gridPos;
    attribute float seed;
    
    varying float vDensity;
    varying vec2 vGridPos;
    varying float vSeed;
    
    void main(){
      vec2 gp = gridPos;
      
      float rowWave = sin(gp.y * uRowFreq + uTime * 0.8 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.5) * uWaveAmp;
      
      float twist = uTwist * length(gp) * 0.05;
      float ct = cos(twist);
      float st = sin(twist);
      vec2 twisted = vec2(
        gp.x * ct - gp.y * st,
        gp.x * st + gp.y * ct
      );
      
      vec3 p = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);
      
      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 0.8) * 
                          sin(gp.x * uColFreq * 2.0 + uTime * 0.5);
      vDensity = interference;
      vGridPos = gp;
      vSeed = seed;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * 2.2;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uBurst;
    varying float vDensity;
    varying vec2 vGridPos;
    varying float vSeed;
    
    vec3 hue2rgb(float h){
      h = fract(h);
      float r = abs(h * 6.0 - 3.0) - 1.0;
      float g = 2.0 - abs(h * 6.0 - 2.0);
      float b = 2.0 - abs(h * 6.0 - 4.0);
      return clamp(vec3(r, g, b), 0.0, 1.0);
    }
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float val = step(0.0, vDensity);
      
      // Surprise: momentary color burst that ripples through the pattern
      float burstIntensity = uBurst * smoothstep(0.0, 0.1, uBurst) * smoothstep(1.0, 0.7, uBurst);
      
      if (burstIntensity > 0.01){
        // Color wave propagates from center outward
        float distFromCenter = length(vGridPos);
        float colorWave = fract(distFromCenter * 0.08 - uBurst * 3.0);
        float hue = colorWave + vSeed * 0.3;
        vec3 burstColor = hue2rgb(hue);
        
        // Only colorize the "black" stripes
        float colorMask = (1.0 - val) * burstIntensity;
        vec3 col = mix(vec3(val), burstColor, colorMask);
        gl_FragColor = vec4(col, 1.0);
      } else {
        // Normal black and white
        vec3 col = vec3(val);
        gl_FragColor = vec4(col, 1.0);
      }
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);
  
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const width = 24;
  const height = 24;
  const cellW = width / cols;
  const cellH = height / rows;
  
  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;
        
        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        
        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;
        
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  
  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  
  return { positions, gridPositions, seeds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);
  
  uniforms.uRowFreq.value = 0.8 + rng() * 1.2;
  uniforms.uColFreq.value = 0.8 + rng() * 1.2;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.7;
  uniforms.uTwist.value = rng() * 6.28;
  uniforms.uPhase.value = rng() * 6.28;
  
  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  
  // Trigger color burst surprise
  lastClickTime = performance.now();
  burstPhase = 0;
}

regenerate();
addEventListener('click', regenerate);

addEventListener('resize', () => {
  const newAspect = innerWidth / innerHeight;
  camera.left = frustumSize * newAspect / -2;
  camera.right = frustumSize * newAspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  
  // Animate color burst: rises quickly, fades slowly
  const timeSinceClick = (now - lastClickTime) / 1000;
  if (timeSinceClick < 2.5){
    if (timeSinceClick < 0.3){
      burstPhase = timeSinceClick / 0.3;
    } else {
      burstPhase = 1.0 - (timeSinceClick - 0.3) / 2.2;
    }
    uniforms.uBurst.value = Math.max(0, burstPhase);
  } else {
    uniforms.uBurst.value = 0;
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
