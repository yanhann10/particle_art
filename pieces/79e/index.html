<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>79e · wind-dispersed point cloud</title>
<!-- MOTION: drift, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; cursor:crosshair; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">79e · wind-dispersed point cloud</div>
<div class="hint">move mouse to blow wind · particles drift + fall under gravity</div>
<div class="src">bunny point cloud · 35k particles · lateral drift on input</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Stanford bunny approximate point cloud — hand-coded vertices for recognizability
// ~35k particles distributed across bunny body + ears + feet
// rest pose = bunny silhouette; mouse movement = lateral wind force + gravity

const BUNNY_APPROX = [
  // body core — ellipsoid centered at origin, ~1.2 units tall
  ...Array.from({length: 8000}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.5 + Math.random() * 0.15;
    return {
      x: r * Math.sin(phi) * Math.cos(theta) * 0.8,
      y: r * Math.cos(phi) * 0.6,
      z: r * Math.sin(phi) * Math.sin(theta) * 0.7,
    };
  }),
  // head — sphere offset upward + forward
  ...Array.from({length: 4000}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.28 + Math.random() * 0.08;
    return {
      x: r * Math.sin(phi) * Math.cos(theta) * 0.9 + 0.0,
      y: r * Math.cos(phi) + 0.75,
      z: r * Math.sin(phi) * Math.sin(theta) * 0.9 + 0.6,
    };
  }),
  // left ear — tall thin ellipsoid
  ...Array.from({length: 1800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.08 + Math.random() * 0.03;
    return {
      x: r * Math.sin(phi) * Math.cos(theta) * 0.4 - 0.18,
      y: r * Math.cos(phi) * 2.2 + 1.15,
      z: r * Math.sin(phi) * Math.sin(theta) * 0.4 + 0.65,
    };
  }),
  // right ear
  ...Array.from({length: 1800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.08 + Math.random() * 0.03;
    return {
      x: r * Math.sin(phi) * Math.cos(theta) * 0.4 + 0.18,
      y: r * Math.cos(phi) * 2.2 + 1.15,
      z: r * Math.sin(phi) * Math.sin(theta) * 0.4 + 0.65,
    };
  }),
  // tail — small sphere at rear
  ...Array.from({length: 600}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.09 + Math.random() * 0.02;
    return {
      x: r * Math.sin(phi) * Math.cos(theta),
      y: r * Math.cos(phi) + 0.35,
      z: r * Math.sin(phi) * Math.sin(theta) - 0.55,
    };
  }),
  // front-left foot
  ...Array.from({length: 800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const r = 0.08 + Math.random() * 0.02;
    const h = Math.random() * 0.25;
    return {
      x: r * Math.cos(theta) - 0.25,
      y: -0.55 - h,
      z: r * Math.sin(theta) + 0.35,
    };
  }),
  // front-right foot
  ...Array.from({length: 800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const r = 0.08 + Math.random() * 0.02;
    const h = Math.random() * 0.25;
    return {
      x: r * Math.cos(theta) + 0.25,
      y: -0.55 - h,
      z: r * Math.sin(theta) + 0.35,
    };
  }),
  // back-left foot
  ...Array.from({length: 800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const r = 0.09 + Math.random() * 0.02;
    const h = Math.random() * 0.28;
    return {
      x: r * Math.cos(theta) - 0.28,
      y: -0.52 - h,
      z: r * Math.sin(theta) - 0.25,
    };
  }),
  // back-right foot
  ...Array.from({length: 800}, () => {
    const theta = Math.random() * Math.PI * 2;
    const r = 0.09 + Math.random() * 0.02;
    const h = Math.random() * 0.28;
    return {
      x: r * Math.cos(theta) + 0.28,
      y: -0.52 - h,
      z: r * Math.sin(theta) - 0.25,
    };
  }),
  // whiskers — sparse line segments from snout
  ...Array.from({length: 200}, () => {
    const side = Math.random() < 0.5 ? -1 : 1;
    const t = Math.random();
    return {
      x: side * (0.12 + t * 0.4),
      y: 0.68 + (Math.random() - 0.5) * 0.08,
      z: 0.75 + t * 0.3,
    };
  }),
  // fur halo — sparse particles around body for volume
  ...Array.from({length: 16000}, () => {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 0.72 + Math.random() * 0.22;
    return {
      x: r * Math.sin(phi) * Math.cos(theta) * 0.85,
      y: r * Math.cos(phi) * 0.65 + (Math.random() - 0.5) * 0.15,
      z: r * Math.sin(phi) * Math.sin(theta) * 0.75,
    };
  }),
];

const N = BUNNY_APPROX.length;

// scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0e, 0.045);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.8, 4.5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0.2, 0);
controls.enablePan = false;
controls.minDistance = 2;
controls.maxDistance = 12;

// light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xfff8e7, 0.8);
dirLight.position.set(2, 4, 3);
scene.add(dirLight);

// mouse tracking for wind force
let mouseNormX = 0;
let mouseNormY = 0;
let mouseVelocityX = 0;
let mouseVelocityY = 0;
let lastMouseX = 0;
let lastMouseY = 0;

addEventListener('mousemove', (e) => {
  const x = (e.clientX / innerWidth) * 2 - 1;
  const y = -(e.clientY / innerHeight) * 2 + 1;
  mouseVelocityX = x - lastMouseX;
  mouseVelocityY = y - lastMouseY;
  lastMouseX = x;
  lastMouseY = y;
  mouseNormX = x;
  mouseNormY = y;
});

// particle system
const restPositions = new Float32Array(N * 3);
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const masses = new Float32Array(N);

for (let i = 0; i < N; i++){
  const p = BUNNY_APPROX[i];
  restPositions[i*3]   = p.x;
  restPositions[i*3+1] = p.y;
  restPositions[i*3+2] = p.z;
  positions[i*3]   = p.x;
  positions[i*3+1] = p.y;
  positions[i*3+2] = p.z;
  velocities[i*3] = 0;
  velocities[i*3+1] = 0;
  velocities[i*3+2] = 0;
  seeds[i] = Math.random();
  // mass variation — heavier particles (feet, body core) resist wind more
  masses[i] = 0.7 + Math.random() * 0.6;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixelRatio;
    attribute float seed;
    varying float vDepth;
    varying vec3 vColor;
    void main(){
      vec3 p = position;
      float t = uTime * 0.8 + seed * 6.28;
      // subtle idle sway
      p.x += 0.008 * sin(t * 1.2 + p.y * 2.0);
      p.z += 0.008 * cos(t * 0.9 + p.y * 2.0);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
      
      // size variation by depth + seed
      float sz = (0.8 + seed * 0.4) * uPixelRatio * (35.0 / vDepth);
      gl_PointSize = sz;
      
      // palette — warm cream to pale ochre to soft gray
      vec3 a = vec3(0.92, 0.88, 0.82);
      vec3 b = vec3(0.82, 0.72, 0.58);
      vec3 c = vec3(0.68, 0.70, 0.72);
      float k = seed;
      vColor = mix(a, b, smoothstep(0.3, 0.7, k));
      vColor = mix(vColor, c, smoothstep(0.75, 1.0, k));
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying vec3 vColor;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 18.0);
      float halo = exp(-r * 6.0) * 0.3;
      float a = core + halo;
      // fade with depth
      a *= smoothstep(12.0, 3.0, vDepth);
      gl_FragColor = vec4(vColor * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// physics params
const WIND_FORCE = 0.08;
const GRAVITY = -0.015;
const DRAG = 0.92;
const RETURN_SPRING = 0.04;
const RETURN_DAMPING = 0.88;
const FLOOR_Y = -0.8;
const FLOOR_BOUNCE = 0.35;

function physicsStep(dt){
  const windX = mouseVelocityX * WIND_FORCE;
  const windZ = mouseVelocityY * WIND_FORCE * 0.5;
  
  for (let i = 0; i < N; i++){
    const m = masses[i];
    const invMass = 1.0 / m;
    
    // wind force — stronger on lighter particles
    velocities[i*3]   += windX * invMass * dt;
    velocities[i*3+2] += windZ * invMass * dt;
    
    // gravity
    velocities[i*3+1] += GRAVITY * dt;
    
    // spring back to rest position
    const dx = restPositions[i*3]   - positions[i*3];
    const dy = restPositions[i*3+1] - positions[i*3+1];
    const dz = restPositions[i*3+2] - positions[i*3+2];
    
    velocities[i*3]   += dx * RETURN_SPRING * dt;
    velocities[i*3+1] += dy * RETURN_SPRING * dt;
    velocities[i*3+2] += dz * RETURN_SPRING * dt;
    
    // drag
    velocities[i*3]   *= DRAG;
    velocities[i*3+1] *= DRAG;
    velocities[i*3+2] *= DRAG;
    
    // integrate
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    // floor collision
    if (positions[i*3+1] < FLOOR_Y){
      positions[i*3+1] = FLOOR_Y;
      velocities[i*3+1] *= -FLOOR_BOUNCE;
      velocities[i*3]   *= 0.85; // friction
      velocities[i*3+2] *= 0.85;
    }
    
    // damping on return velocity
    const vdx = velocities[i*3];
    const vdy = velocities[i*3+1];
    const vdz = velocities[i*3+2];
    const returnDot = vdx * dx + vdy * dy + vdz * dz;
    if (returnDot > 0){
      velocities[i*3]   *= RETURN_DAMPING;
      velocities[i*3+1] *= RETURN_DAMPING;
      velocities[i*3+2] *= RETURN_DAMPING;
    }
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();
  
  // decay mouse velocity
  mouseVelocityX *= 0.92;
  mouseVelocityY *= 0.92;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = start;

function loop(now){
  const elapsed = (now - start) / 1000;
  const dt = Math.min((now - lastT) / 1000, 0.05) * 60; // fixed timestep ~60fps
  lastT = now;
  
  mat.uniforms.uTime.value = elapsed;
  
  physicsStep(dt);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
