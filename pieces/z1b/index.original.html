<script type="importmap">

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0025);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Single warm point light near sphere — darkness is primary material
scene.add(new THREE.AmbientLight(0x080202, 0.008));
const pL = new THREE.PointLight(0xffa880, 0.04, 40, 2.0);
pL.position.set(-1.5, 3.5, 1.0);
scene.add(pL);

let seed = 73291485;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── THE SPHERE — held breath, luminous core
const sphereCenter = new THREE.Vector3(0.0, 0.2, 0.0);
const sphereR = 1.35;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8d8,
    emissive: 0xf2ead5,
    emissiveIntensity: 0.85,
    roughness: 0.96,
    metalness: 0.0,
    transparent: true,
    opacity: 0.35
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner glow — smaller bright core inside
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR*0.7, 16, 12),
  new THREE.MeshBasicMaterial({
    color: 0xfff5e8,
    transparent: true,
    opacity: 0.12
  })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// ── ARCHITECTURAL VOLUME — 28×24×32 room
const ROOM = { w:28, h:24, d:32 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

// ── VOID ZONES — 3 cylindrical clearings for negative space
const voids = [];
for(let i = 0; i < 3; i++){
  const a = (i/3)*Math.PI*2 + rng()*0.6;
  const dist = 4.5 + rng()*2.5;
  voids.push({
    x: sphereCenter.x + Math.cos(a)*dist,
    y: sphereCenter.y + (rng()-0.5)*2.5,
    z: sphereCenter.z + Math.sin(a)*dist,
    r: 1.8 + rng()*1.2
  });
}

function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.x, dy=p.y-v.y, dz=p.z-v.z;
    if(dx*dx+dy*dy+dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ARTERIAL CORRIDORS — 14 main veins from walls to sphere
// Threads cluster along these paths, creating visible bundles like blood vessels
const NUM_VEINS = 14;
const veinData = [];
for(let i = 0; i < NUM_VEINS; i++){
  const target = sphereSurf();
  const wallBase = wallPt();
  // Each vein has a cluster of 5-8 wall anchors nearby
  const clusterSize = 5 + Math.floor(rng()*4);
  const cluster = [wallBase];
  for(let j = 1; j < clusterSize; j++){
    cluster.push(wallBase.clone().add(new THREE.Vector3(
      (rng()-0.5)*2.0, (rng()-0.5)*2.0, (rng()-0.5)*2.0
    )));
  }
  veinData.push({ target, cluster, targetNormal: target.clone().sub(sphereCenter).normalize() });
}

// ── ANCHOR POINTS — concentric shells
const anchors = [];
const shells = [2.2, 3.5, 5.0, 7.0, 9.5, 12.0];
for(const sr of shells){
  const count = Math.floor(18 + sr*1.6);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.85+rng()*0.3);
    const pt = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.8,
      sphereCenter.z + Math.cos(v)*r
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
}
for(let i = 0; i < 80; i++){
  const pt = wallPt();
  if(!inVoid(pt)) anchors.push(pt);
}

// ── SUSPENSION THREADS — 8 lines from ceiling to sphere top
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.25;
  const topR = 0.2 + rng()*0.6;
  const botR = 0.01 + rng()*0.02;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*topR, hh, sphereCenter.z + Math.sin(a)*topR,
    sphereCenter.x + Math.cos(a)*botR, sphereCenter.y + sphereR - 0.01, sphereCenter.z + Math.sin(a)*botR
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0202, transparent: true, opacity: 0.5
})));

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  if(inVoid(a) && inVoid(b)) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: ARTERIAL CONVERGENCE — threads clustered along vein corridors
// ~50% of budget = 10,000 threads
for(let vi = 0; vi < NUM_VEINS && li < 10000; vi++){
  const vein = veinData[vi];
  const threadsPerVein = Math.floor(10000/NUM_VEINS);
  for(let i = 0; i < threadsPerVein && li < 10000; i++){
    // Pick origin from this vein's wall cluster
    const origin = vein.cluster[Math.floor(rng()*vein.cluster.length)].clone();
    // Add scatter along the vein path
    const scatter = 0.3 + rng()*1.2;
    origin.add(new THREE.Vector3(
      (rng()-0.5)*scatter, (rng()-0.5)*scatter, (rng()-0.5)*scatter
    ));

    // Target: sphere surface near this vein's endpoint
    const tgtScatter = rng()*0.6;
    const tangent1 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5)
      .cross(vein.targetNormal).normalize();
    const target = vein.target.clone().add(tangent1.multiplyScalar(tgtScatter));
    // Re-project onto sphere
    const dir = target.clone().sub(sphereCenter).normalize();
    target.copy(sphereCenter).add(dir.multiplyScalar(sphereR));

    // 18% yearning threads — stop short
    if(rng() < 0.18){
      const toOrigin = origin.clone().sub(target).normalize();
      const gap = 0.15 + rng()*1.4;
      const stopped = target.clone().add(toOrigin.multiplyScalar(gap));
      setLine(origin, stopped, 0);
    } else {
      setLine(origin, target, 0);
    }
  }
}

// RULE 2: SCATTERED CONVERGENCE — non-vein threads to random sphere points
const scatterTarget = Math.min(NUM_LINES, li + 3000);
while(li < scatterTarget){
  const origin = rng()<0.4 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  const target = sphereSurf();
  if(rng() < 0.15){
    const toOrigin = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng()*1.0;
    setLine(origin, target.clone().add(toOrigin.multiplyScalar(gap)), 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 3: LATERAL — anchor-to-nearest-anchor within threshold
const THRESH = 4.0;
const latTarget = Math.min(NUM_LINES, li + 3500);
let attempts = 0;
while(li < latTarget && attempts < 50000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 1);
}

// RULE 4: DENDRITIC BRANCHING — chains growing from sphere surface
for(let i = 0; i < 200 && li < NUM_LINES-100; i++){
  let pt = sphereSurf();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*5);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.3 + rng()*0.55;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.3, (rng()-0.5)*0.3, (rng()-0.5)*0.3
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.clone().multiplyScalar(len));
    setLine(pt, next, 2);

    // Y-fork with 35% chance at gen 1-2
    if(c >= 1 && c <= 2 && rng() < 0.35 && li < NUM_LINES){
      const fDev = new THREE.Vector3(
        (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
      );
      const fDir = prevDir.clone().add(fDev).normalize();
      const fLen = 0.25 + rng()*0.4;
      const fPt = pt.clone().add(fDir.multiplyScalar(fLen));
      setLine(pt, fPt, 2);
      if(rng() < 0.45 && li < NUM_LINES){
        const f2Dir = fDir.clone().add(new THREE.Vector3(
          (rng()-0.5)*0.4, (rng()-0.5)*0.4, (rng()-0.5)*0.4
        )).normalize();
        const f2Pt = fPt.clone().add(f2Dir.multiplyScalar(0.2+rng()*0.3));
        setLine(fPt, f2Pt, 2);
      }
    }
    pt = next;
    prevDir = dir;
  }
}

// Fill remainder with sparse architectural spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.12 ? sphereSurf() : wallPt();
  setLine(a, b, 1);
}

const basePositions = new Float32Array(positions);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — single arterial crimson #c20018
// Category opacities: converge 0.10, lateral 0.045, branch 0.065
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catOp = [0.10, 0.045, 0.065];

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  // Threads near sphere glow brighter — arterial density
  const distFade = Math.max(0.3, 1.0 - d*0.055);
  const baseOp = catOp[lineCat[i]] * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.82;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, torn memories
const NUM_FRAGMENTS = 32;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.07;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.4+rng()*0.9);
  const h = sz*(0.5+rng()*1.1);
  // Irregular quadrilateral — torn paper feel
  const verts = new Float32Array([
    w*(-0.45+rng()*0.15), h*0.5, sz*(rng()-0.5)*0.15,
    -w*0.5, h*(-0.15+rng()*0.1), sz*(rng()-0.5)*0.15,
    w*(0.15-rng()*0.25), -h*0.5, sz*(rng()-0.5)*0.15,
    w*(-0.45+rng()*0.15), h*0.5, sz*(rng()-0.5)*0.15,
    w*(0.25+rng()*0.1), h*(rng()*0.08), sz*(rng()-0.5)*0.15,
    w*(0.15-rng()*0.25), -h*0.5, sz*(rng()-0.5)*0.15
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.004 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.025),
    transparent: true,
    opacity: 0.2 + rng()*0.25,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  // Place along thread lines, preferring convergence threads
  const si = Math.floor(rng()*li)*6;
  const t = 0.15+rng()*0.7;
  frag.position.set(
    basePositions[si]*(1-t)+basePositions[si+3]*t,
    basePositions[si+1]*(1-t)+basePositions[si+4]*t,
    basePositions[si+2]*(1-t)+basePositions[si+5]*t
  );
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — cinematic narrative: intimacy → revelation → submersion → return
// Phase 1: Start very close to sphere, almost touching, looking through dense threads
// Phase 2: Slowly pull back to reveal the cathedral
// Phase 3: Rise above, looking down through the canopy of threads
// Phase 4: Descend below the sphere, looking up — threads converge overhead
// Phase 5: Drift back to intimacy
const pathLen = 3000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y, angleOffset;
  if(t < 0.15){
    // Phase 1: intimate — barely outside the sphere
    const lt = t/0.15;
    rH = 2.2 + lt*0.5;
    y = cy - 0.3 + lt*0.4;
    angleOffset = 0;
  } else if(t < 0.35){
    // Phase 2: slow reveal — pulling outward through the web
    const lt = (t-0.15)/0.2;
    const ease = lt*lt*(3-2*lt); // smoothstep
    rH = 2.7 + ease*5.0;
    y = cy + 0.1 + ease*2.5;
    angleOffset = lt*0.3;
  } else if(t < 0.5){
    // Phase 3: high vantage — looking down through thread canopy
    const lt = (t-0.35)/0.15;
    rH = 7.7 - lt*1.5;
    y = cy + 2.6 + Math.sin(lt*Math.PI)*2.0;
    angleOffset = 0.3 + lt*0.15;
  } else if(t < 0.7){
    // Phase 4: descent below — submerged, looking up
    const lt = (t-0.5)/0.2;
    const ease = lt*lt*(3-2*lt);
    rH = 6.2 - ease*0.8;
    y = cy + 4.6 - ease*10.0;
    angleOffset = 0.45 - lt*0.1;
  } else if(t < 0.88){
    // Phase 5: rising, tightening orbit — gathering back
    const lt = (t-0.7)/0.18;
    const ease = lt*lt*(3-2*lt);
    rH = 5.4 - ease*2.5;
    y = cy - 5.4 + ease*5.5;
    angleOffset = 0.35 - lt*0.2;
  } else {
    // Phase 6: return to intimacy
    const lt = (t-0.88)/0.12;
    const ease = lt*lt*(3-2*lt);
    rH = 2.9 - ease*0.7;
    y = cy + 0.1 - ease*0.4;
    angleOffset = 0.15 - lt*0.15;
  }

  const angle = p*0.82 + angleOffset;
  const x = cx + Math.sin(angle)*rH;
  const z = cz + Math.cos(angle)*rH*1.08;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

// Cardiac pulse function — sharp systole, slow diastole
function cardiac(phase){
  const p = ((phase % 1) + 1) % 1;
  if(p < 0.08) return Math.sin(p/0.08*Math.PI*0.5); // systole rise
  if(p < 0.15) return Math.cos((p-0.08)/0.07*Math.PI*0.5); // systole fall
  return 0; // diastole rest
}

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread cardiac breathing — pulse radiates from sphere outward
  const arr = lineGeo.attributes.position.array;
  const pulseSpeed = 0.12; // beats per second — very slow heartbeat
  const pulseWaveSpeed = 3.0; // propagation speed outward
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    // Radial delay — pulse reaches far threads later
    const delay = dist / pulseWaveSpeed;
    const phase = elapsed * pulseSpeed - delay * pulseSpeed;
    const beat = cardiac(phase);
    const amp = 0.00006 * beat * Math.max(0, 1.0-dist/18.0);
    // Direction: radially outward from sphere
    const mx = (basePositions[idx]+basePositions[idx+3])*0.5 - sphereCenter.x;
    const my = (basePositions[idx+1]+basePositions[idx+4])*0.5 - sphereCenter.y;
    const mz = (basePositions[idx+2]+basePositions[idx+5])*0.5 - sphereCenter.z;
    const ml = Math.sqrt(mx*mx+my*my+mz*mz) + 0.001;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + (mx/ml)*amp;
      arr[vi+1] = basePositions[vi+1] + (my/ml)*amp;
      arr[vi+2] = basePositions[vi+2] + (mz/ml)*amp;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere subtle pulse — breathing opacity
  sphere.material.opacity = 0.35 + cardiac(elapsed*pulseSpeed)*0.04;

  // Camera dolly — glacial drift through the cathedral
  const speed = 0.00012;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle drift
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0006)*0.03;
  look.y += Math.cos(elapsed*0.0004)*0.15;
  look.z += Math.sin(elapsed*0.0007+0.5)*0.025;
  camera.lookAt(look);

  // Light: slow warm drift
  pL.position.x = -1.5 + Math.sin(elapsed*0.0003)*0.06;
  pL.position.y = 3.5 + Math.cos(elapsed*0.0002)*0.04;
  pL.intensity = 0.04 + cardiac(elapsed*pulseSpeed)*0.006;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';};
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
