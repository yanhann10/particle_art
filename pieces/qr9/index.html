<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qr9 · Shiota — Suspended Memory</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">qr9</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0042);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.014));
const key1 = new THREE.PointLight(0x3a0606, 0.032, 42, 1.8);
key1.position.set(-18, 19, 12);
scene.add(key1);

let seed = 892047;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 58, h: 40, d: 52 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED KEY — the remembered object (simplified sphere as symbolic key form)
const keyPos = new THREE.Vector3(3.2, 1.4, -2.6);

const keyBodyGeo = new THREE.SphereGeometry(2.8, 24, 16);
const keyBodyMesh = new THREE.Mesh(keyBodyGeo, new THREE.MeshStandardMaterial({
  color: 0xece6da,
  emissive: 0xd8cec0,
  emissiveIntensity: 0.58,
  metalness: 0.28,
  roughness: 0.86
}));
keyBodyMesh.position.copy(keyPos);
scene.add(keyBodyMesh);

const keyRingGeo = new THREE.TorusGeometry(1.2, 0.18, 8, 16);
const keyRingMesh = new THREE.Mesh(keyRingGeo, new THREE.MeshStandardMaterial({
  color: 0xe4ddd0,
  emissive: 0xc8beb0,
  emissiveIntensity: 0.48,
  metalness: 0.32,
  roughness: 0.82
}));
keyRingMesh.position.set(keyPos.x - 2.4, keyPos.y + 2.0, keyPos.z);
keyRingMesh.rotation.x = Math.PI/2;
keyRingMesh.rotation.z = Math.PI*0.18;
scene.add(keyRingMesh);

const keyGlow = new THREE.PointLight(0x1a0505, 0.026, 24, 2.2);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// ANCHOR POINT GENERATION

const anchors = [];

// ZONE 1: Dense shell around key body — threads converge here
const innerCount = 180;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 3.8 + rng()*1.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 2: Ring convergence — anchors around the key ring
const ringCount = 64;
for(let i=0; i<ringCount; i++){
  const t = (i/ringCount) * Math.PI*2;
  const rx = 1.6 + rng()*0.6;
  const x = keyRingMesh.position.x + Math.cos(t)*rx;
  const y = keyRingMesh.position.y + Math.sin(t)*rx;
  const z = keyRingMesh.position.z + (rng()-0.5)*0.8;
  anchors.push(new THREE.Vector3(x, y, z));
}

// ZONE 3: Mid-distance orbital shell
const midCount = 240;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 9.2 + rng()*5.6;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 4: Far shell
const outerCount = 160;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 16.4 + rng()*7.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 5: Wall anchors
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*2.2;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*2.2;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.88, ROOM.d*0.88, 4));
anchors.push(...wallGrid('x', hw, ROOM.h*0.88, ROOM.d*0.88, 4));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('y', hh, ROOM.w*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.88, ROOM.h*0.88, 4));
anchors.push(...wallGrid('z', hd, ROOM.w*0.88, ROOM.h*0.88, 4));

// ZONE 6: Volume scatter
for(let i=0; i<280; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const y = (rng()-0.5)*ROOM.h*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  anchors.push(new THREE.Vector3(x, y, z));
}

// RED THREAD NETWORK — 20,000 segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Radial convergence to key body surface
const convergeCount = 7200;
for(let i=0; i<convergeCount && li<NUM_LINES-12800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 3.4) continue;
  
  const dir = keyPos.clone().sub(a).normalize();
  const targetDist = dKey - 2.8 - rng()*1.2;
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Ring suspension threads — vertical lines to key ring
const ringThreads = 48;
for(let i=0; i<ringThreads && li<NUM_LINES-12752; i++){
  const t = (i/ringThreads) * Math.PI*2;
  const rx = 1.4;
  const ringPt = new THREE.Vector3(
    keyRingMesh.position.x + Math.cos(t)*rx,
    keyRingMesh.position.y + Math.sin(t)*rx,
    keyRingMesh.position.z
  );
  
  const ceiling = new THREE.Vector3(ringPt.x + (rng()-0.5)*1.6, hh - rng()*2.0, ringPt.z + (rng()-0.5)*1.6);
  setLine(ringPt, ceiling);
}

// CATEGORY C: Key radiants — threads extending outward from key surface
const radialCount = 2400;
for(let i=0; i<radialCount && li<NUM_LINES-10352; i++){
  const y = 1 - (i / radialCount) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*2.8, y*2.8, z*2.8).add(keyPos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 5.4 + rng()*9.2;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY D: Horizontal webs — concentric rings at various heights
const webLevels = 9;
const threadsPerLevel = 72;
for(let l=0; l<webLevels && li<NUM_LINES-9704; l++){
  const r = 6.8 + l*2.4;
  const yBase = keyPos.y + (l-webLevels/2)*3.2;
  
  for(let i=0; i<threadsPerLevel && li<NUM_LINES-9704; i++){
    const t0 = (i/threadsPerLevel) * Math.PI*2;
    const t1 = t0 + Math.PI*2/threadsPerLevel;
    
    const x0 = keyPos.x + Math.cos(t0)*r;
    const z0 = keyPos.z + Math.sin(t0)*r;
    const x1 = keyPos.x + Math.cos(t1)*r;
    const z1 = keyPos.z + Math.sin(t1)*r;
    
    const y0 = yBase + Math.sin(t0*4)*0.8;
    const y1 = yBase + Math.sin(t1*4)*0.8;
    
    setLine(
      new THREE.Vector3(x0, y0, z0),
      new THREE.Vector3(x1, y1, z1)
    );
  }
}

// CATEGORY E: Meridian arcs — vertical loops through key
const meridians = 36;
const ptsPerMeridian = 12;
for(let m=0; m<meridians && li<NUM_LINES-9308; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 10.4 + (m%4)*1.8;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-9308; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      keyPos.y + Math.sin(phi0)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      keyPos.y + Math.sin(phi1)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY F: Wall-to-wall spans
let wallSpans = 0;
while(wallSpans<1800 && li<NUM_LINES-7508){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>18.0 && d<48.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY G: Horizontal crossing threads
for(let i=0; i<1200 && li<NUM_LINES-6308; i++){
  const y = keyPos.y + (rng()-0.5)*22.0;
  const x0 = -hw + rng()*8.0;
  const z0 = (rng()-0.5)*ROOM.d*0.86;
  const x1 = hw - rng()*8.0;
  const z1 = (rng()-0.5)*ROOM.d*0.86;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY H: Vertical suspension threads
for(let i=0; i<480 && li<NUM_LINES-5828; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  const y0 = -hh + rng()*3.2;
  const y1 = hh - rng()*3.2;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY I: Proximity web — local neighborhood connections
const THRESH = 11.2;
let webCount = 0, attempts = 0;
while(webCount<1800 && li<NUM_LINES-4028 && attempts<16000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>4.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY J: Diagonal cross-room threads
for(let i=0; i<800 && li<NUM_LINES-3228; i++){
  const x0 = -hw + rng()*6.0;
  const y0 = -hh + rng()*6.0;
  const z0 = -hd + rng()*6.0;
  const x1 = hw - rng()*6.0;
  const y1 = hh - rng()*6.0;
  const z1 = hd - rng()*6.0;
  setLine(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
}

// CATEGORY K: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.0 && d<26.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.072,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow walk inside the web
const pathLen = 3200;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.18 + lt*Math.PI*1.14;
    const r = 24.0 - lt*9.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 14.2 - lt*8.4;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*1.32 + lt*Math.PI*1.64;
    const r = 14.8 + Math.sin(lt*Math.PI*2.2)*3.6;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 5.8 + Math.cos(lt*Math.PI*1.6)*3.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.76){
    const lt = (t-0.52)/0.24;
    const angle = Math.PI*2.96 + lt*Math.PI*1.12;
    const r = 12.6 + Math.cos(lt*Math.PI)*2.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - 2.4 - lt*9.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.76)/0.24;
    const angle = Math.PI*4.08 + lt*Math.PI*0.74;
    const r = 10.2 + lt*13.4;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 6.4 + lt*8.2;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.005;
  keyBodyMesh.scale.setScalar(breathScale);
  keyRingMesh.scale.setScalar(1.0 + Math.sin(elapsed*0.00034)*0.004);

  const speed = 0.0000058;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000026)*0.22,
    keyPos.y + Math.cos(elapsed*0.000032)*0.18,
    keyPos.z + Math.sin(elapsed*0.000022)*0.16
  );

  key1.intensity = 0.032 + Math.sin(elapsed*0.000044)*0.009;
  keyGlow.intensity = 0.026 + Math.sin(elapsed*0.000052)*0.007;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
