<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>q7e · epiphany cell (Bourgeois → light breaks through)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0808; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">q7e</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Chain from si0 (haunted Bourgeois cell) → epiphany
// The enclosed, trembling membrane begins to fracture.
// Light breaks through cracks — Leonard Cohen's "crack in everything."
// Technique reference: James Turrell's Roden Crater — light as revelation substance.
// The cell doesn't explode; it fissures slowly, and radiant particles
// stream outward through the openings like dawn through shutters.
// Palette: bruise base persists, but amber/gold light bleeds through fractures.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0808, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.03;
controls.target.set(0, 0, 0);

const MAX_VERTS = 3200;
const ATTRACT   = 0.075;
const REPEL_R   = 0.38;
const REPEL_STR = 0.09;
const NOISE     = 0.0015;
const PRESSURE  = 0.0018;
const MAX_D     = 0.28;
const BREATHE_AMPLITUDE = 0.12;
const BREATHE_FREQ = 0.35;

// fracture parameters — 3 fracture planes that widen over time
const NUM_FRACTURES = 3;
const fractures = [];
for (let i = 0; i < NUM_FRACTURES; i++){
  const theta = (i / NUM_FRACTURES) * Math.PI * 2 + 0.4;
  const phi = (Math.random() - 0.5) * 1.2;
  fractures.push({
    nx: Math.cos(phi) * Math.cos(theta),
    ny: Math.sin(phi),
    nz: Math.cos(phi) * Math.sin(theta),
    width: 0,        // grows over time
    maxWidth: 0.25 + Math.random() * 0.15,
    speed: 0.008 + Math.random() * 0.006,
    delay: 4 + i * 6  // seconds before this fracture starts
  });
}

function inFracture(x, y, z, cx, cy, cz, time){
  const rx = x - cx, ry = y - cy, rz = z - cz;
  for (const f of fractures){
    if (time < f.delay) continue;
    const dist = Math.abs(rx * f.nx + ry * f.ny + rz * f.nz);
    if (dist < f.width) return true;
  }
  return false;
}

const verts = [];
const NV0 = 32;
for (let i = 0; i < NV0; i++){
  for (let j = 0; j < 8; j++){
    const theta = i / NV0 * Math.PI * 2;
    const phi   = (j / 8 - 0.5) * Math.PI;
    const rx = 2.2, ry = 1.4, rz = 2.2;
    const x = rx * Math.cos(phi) * Math.cos(theta);
    const y = ry * Math.sin(phi);
    const z = rz * Math.cos(phi) * Math.sin(theta);
    verts.push({ x, y, z, age: 0, tension: Math.random() });
  }
}

const CELL = REPEL_R;
const grid = new Map();
function hashKey(x, y, z){
  return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL);
}
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i], k = hashKey(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step(breathePhase, time){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;

  rebuildGrid();
  const dx = new Float32Array(n);
  const dy = new Float32Array(n);
  const dz = new Float32Array(n);

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }

  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v).slice(0, 6);
    let ax=0, ay=0, az=0, count=0;
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      ax += u.x; ay += u.y; az += u.z; count++;
    }
    if (count > 0){
      ax /= count; ay /= count; az /= count;
      dx[i] += (ax - v.x) * ATTRACT;
      dy[i] += (ay - v.y) * ATTRACT;
      dz[i] += (az - v.z) * ATTRACT;
    }
  }

  let centX=0, centY=0, centZ=0;
  for (let i=0; i<n; i++){ centX += verts[i].x; centY += verts[i].y; centZ += verts[i].z; }
  centX/=n; centY/=n; centZ/=n;
  const breathe = Math.sin(breathePhase) * BREATHE_AMPLITUDE;

  // fracture effect: verts near fracture planes get pushed outward more
  for (let i=0; i<n; i++){
    const ox = verts[i].x - centX, oy = verts[i].y - centY, oz = verts[i].z - centZ;
    const d = Math.sqrt(ox*ox + oy*oy + oz*oz) + 1e-6;
    let push = PRESSURE + breathe;
    // near-fracture verts get extra outward push (the cell opening)
    if (inFracture(verts[i].x, verts[i].y, verts[i].z, centX, centY, centZ, time)){
      push += 0.006;
    }
    dx[i] += (ox/d) * push;
    dy[i] += (oy/d) * push;
    dz[i] += (oz/d) * push;
  }

  for (let i=0; i<n; i++){
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0004;
    verts[i].tension += (Math.random()-0.5)*0.006;
  }

  const toAdd = [];
  for (let i=0; i<n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j <= i) continue;
      const u = verts[j];
      const ex = u.x - v.x, ey = u.y - v.y, ez = u.z - v.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > MAX_D*MAX_D && verts.length + toAdd.length < MAX_VERTS){
        toAdd.push({
          x: (v.x+u.x)*0.5, y: (v.y+u.y)*0.5, z: (v.z+u.z)*0.5,
          age: Math.max(v.age, u.age)*0.9, tension: (v.tension + u.tension)*0.5
        });
      }
    }
  }
  for (const w of toAdd) verts.push(w);
}

// rendering — membrane + interior wisps + light rays through fractures
const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rSeeds     = new Float32Array(N_RENDER);
const rAge       = new Float32Array(N_RENDER);
const rType      = new Float32Array(N_RENDER); // 0=membrane, 1=wisp, 2=light ray
for (let i=0; i<N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('ptype',    new THREE.BufferAttribute(rType, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uEpiphany: { value: 0 }, // 0→1 as fractures open
  fogColor: { value: new THREE.Color(0x0a0808) },
  fogDensity: { value: 0.045 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uEpiphany;
    attribute float seed;
    attribute float age;
    attribute float ptype;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;
      if (ptype < 0.5){
        // membrane
        p += 0.008 * vec3(sin(t), cos(t*1.3), sin(t*0.7));
      } else if (ptype < 1.5){
        // interior wisp
        p += 0.015 * vec3(sin(t*0.6), cos(t*0.9), sin(t*1.1));
      } else {
        // light ray — gentle outward drift
        p += 0.02 * vec3(sin(t*0.3), cos(t*0.5), sin(t*0.4));
      }

      // palette: bruise base + warm amber light for epiphany
      vec3 bone   = vec3(0.88, 0.84, 0.78);
      vec3 blood  = vec3(0.52, 0.18, 0.20);
      vec3 shadow = vec3(0.22, 0.24, 0.28);
      vec3 amber  = vec3(0.95, 0.75, 0.35);
      vec3 warm   = vec3(1.0, 0.92, 0.72);

      float k = clamp(age * 1.2, 0.0, 1.0);

      if (ptype > 1.5){
        // light particles: warm amber → white
        float lk = 0.5 + 0.5 * sin(t * 0.2 + seed * 3.14);
        vCol = mix(amber, warm, lk);
        vAlpha = 0.5 + 0.3 * uEpiphany;
      } else if (ptype < 0.5){
        // membrane: bruise palette, slightly warmed by epiphany
        vCol = mix(blood, bone, k);
        vCol = mix(vCol, shadow, smoothstep(0.7, 1.0, k) * 0.5);
        vCol = mix(vCol, amber, uEpiphany * 0.15 * smoothstep(0.3, 0.8, k));
        vAlpha = 0.7;
      } else {
        // interior wisps: slightly brightened
        vCol = mix(blood, bone, k);
        vCol = mix(vCol, shadow, smoothstep(0.7, 1.0, k) * 0.5);
        vCol = mix(vCol, warm, uEpiphany * 0.25);
        vAlpha = 0.3 + uEpiphany * 0.15;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vFogDepth = -mv.z;
      float dist = vFogDepth;
      float sz = (ptype > 1.5) ? 2.2 : 1.6;
      gl_PointSize = sz * uPixel * (35.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float core = exp(-r * 16.0);
      float a = core * vAlpha;
      vec3 col = vCol * core;
      float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
      col = mix(col, fogColor, fogFactor);
      a *= (1.0 - fogFactor * 0.6);
      gl_FragColor = vec4(col, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s=0; s<400; s++) step(0, 0);

function updateCamera(){
  if (verts.length === 0) return;
  let cx=0, cy=0, cz=0;
  for (const v of verts){ cx+=v.x; cy+=v.y; cz+=v.z; }
  cx/=verts.length; cy/=verts.length; cz/=verts.length;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  const breathePhase = t * BREATHE_FREQ * Math.PI * 2;

  // grow fractures over time
  for (const f of fractures){
    if (t > f.delay && f.width < f.maxWidth){
      f.width += f.speed * 0.016; // ~per frame at 60fps
      if (f.width > f.maxWidth) f.width = f.maxWidth;
    }
  }

  // epiphany progress: 0 before any fracture, ramps to 1 as all fractures open
  let epiphanySum = 0;
  for (const f of fractures) epiphanySum += f.width / f.maxWidth;
  uniforms.uEpiphany.value = Math.min(1, epiphanySum / NUM_FRACTURES);

  for (let s=0; s<3; s++) step(breathePhase, t);

  const n = verts.length;
  let centX=0, centY=0, centZ=0;
  for (const v of verts){ centX+=v.x; centY+=v.y; centZ+=v.z; }
  centX/=n; centY/=n; centZ/=n;

  // distribute particles: 55% membrane, 20% wisps, 25% light rays (scales with epiphany)
  const lightFraction = 0.25 * uniforms.uEpiphany.value;
  const nLight = Math.floor(N_RENDER * lightFraction);
  const nWisp = Math.floor(N_RENDER * 0.20);
  const nMembrane = N_RENDER - nLight - nWisp;

  // membrane particles
  for (let i=0; i<nMembrane; i++){
    const v = verts[Math.floor(Math.random() * n)];
    const jitter = 0.04;
    rPositions[i*3]   = v.x + (Math.random()-0.5)*jitter;
    rPositions[i*3+1] = v.y + (Math.random()-0.5)*jitter;
    rPositions[i*3+2] = v.z + (Math.random()-0.5)*jitter;
    rAge[i] = v.age + v.tension * 0.1;
    rType[i] = 0;
  }

  // interior wisps
  for (let i=nMembrane; i<nMembrane+nWisp; i++){
    const v = verts[Math.floor(Math.random() * n)];
    const blend = 0.3 + Math.random() * 0.5;
    rPositions[i*3]   = v.x * (1-blend) + centX * blend + (Math.random()-0.5)*0.1;
    rPositions[i*3+1] = v.y * (1-blend) + centY * blend + (Math.random()-0.5)*0.1;
    rPositions[i*3+2] = v.z * (1-blend) + centZ * blend + (Math.random()-0.5)*0.1;
    rAge[i] = v.age * 0.6;
    rType[i] = 1;
  }

  // light ray particles — emanate from centroid outward through fracture planes
  for (let i=nMembrane+nWisp; i<N_RENDER; i++){
    const f = fractures[Math.floor(Math.random() * NUM_FRACTURES)];
    if (f.width < 0.01){
      // fracture not yet open — hide particle at centroid (invisible)
      rPositions[i*3] = centX;
      rPositions[i*3+1] = centY;
      rPositions[i*3+2] = centZ;
      rAge[i] = 0;
      rType[i] = 1;
      continue;
    }
    // ray from centroid outward along fracture normal direction
    const rayLen = 1.0 + Math.random() * 4.5;
    const spread = f.width * 2.0; // lateral spread within fracture
    // pick a random tangent direction
    let tx = -f.nz, ty = 0, tz = f.nx;
    const tlen = Math.sqrt(tx*tx+ty*ty+tz*tz) + 1e-6;
    tx/=tlen; ty/=tlen; tz/=tlen;
    // second tangent via cross product
    let bx = f.ny*tz - f.nz*ty;
    let by = f.nz*tx - f.nx*tz;
    let bz = f.nx*ty - f.ny*tx;
    const spreadA = (Math.random()-0.5) * spread;
    const spreadB = (Math.random()-0.5) * spread;

    rPositions[i*3]   = centX + f.nx * rayLen + tx * spreadA + bx * spreadB;
    rPositions[i*3+1] = centY + f.ny * rayLen + ty * spreadA + by * spreadB;
    rPositions[i*3+2] = centZ + f.nz * rayLen + tz * spreadA + bz * spreadB;
    rAge[i] = 0.3 + Math.random() * 0.5;
    rType[i] = 2;
  }

  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;
  geom.attributes.ptype.needsUpdate = true;

  updateCamera();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
