<style>

canvas{display:block}

<body>
<div class="id">5ij</div>
<div class="src">MillenniumTNG · MPA Garching 2024</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ──────────────────────────────────────────── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.5, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04040a, 1);
document.body.appendChild(renderer.domElement);

/* ── cosmic web graph ───────────────────────────────── */
const NUM_NODES = 160;
const K = 4;
const CUBE_H = 44;
const MAX_EDGE_LEN = 32;

const nodes = [];
for (let i = 0; i < NUM_NODES; i++){
  nodes.push(new THREE.Vector3(
    (Math.random()-0.5)*CUBE_H*2,
    (Math.random()-0.5)*CUBE_H*2,
    (Math.random()-0.5)*CUBE_H*2
  ));
}

// k-nearest-neighbor graph → filament edges
const edgeSet = new Set();
for (let i = 0; i < NUM_NODES; i++){
  const dists = [];
  for (let j = 0; j < NUM_NODES; j++){
    if (i===j) continue;
    const d = nodes[i].distanceTo(nodes[j]);
    if (d < MAX_EDGE_LEN) dists.push({j,d});
  }
  dists.sort((a,b)=>a.d-b.d);
  for (let k = 0; k < Math.min(K, dists.length); k++){
    const lo = Math.min(i, dists[k].j), hi = Math.max(i, dists[k].j);
    edgeSet.add(lo*1000+hi);
  }
}
const edges = [...edgeSet].map(v => [Math.floor(v/1000), v%1000]);

/* ── particle placement along filaments + at nodes ── */
const PPE = 80;            // particles per edge
const NPC = 90;            // particles per node cluster
const nEdge = edges.length;
const nFilament = nEdge * PPE;
const nCluster = NUM_NODES * NPC;
const N = nFilament + nCluster;

const pos   = new Float32Array(N*3);
const drift = new Float32Array(N*3);
const prox  = new Float32Array(N);
const seed  = new Float32Array(N);

function gaussRand(){ return Math.sqrt(-2*Math.log(Math.max(Math.random(),1e-8)))*Math.cos(Math.PI*2*Math.random()); }

const _up  = new THREE.Vector3();
const _p1  = new THREE.Vector3();
const _p2  = new THREE.Vector3();
const _dir = new THREE.Vector3();

let idx = 0;

for (const [ai, bi] of edges){
  const a = nodes[ai], b = nodes[bi];
  _dir.subVectors(b, a);
  const len = _dir.length();
  _dir.normalize();

  // stable perpendicular frame
  _up.set(0,1,0);
  if (Math.abs(_dir.y) > 0.9) _up.set(1,0,0);
  _p1.crossVectors(_dir, _up).normalize();
  _p2.crossVectors(_dir, _p1).normalize();

  for (let p = 0; p < PPE; p++){
    const t = Math.random();
    const bx = a.x + (b.x-a.x)*t;
    const by = a.y + (b.y-a.y)*t;
    const bz = a.z + (b.z-a.z)*t;

    // Gaussian scatter perpendicular, tighter at midpoint
    const proxVal = 2*Math.abs(t-0.5);  // 1 near nodes, 0 at center
    const sigma = 0.35 + 0.45*proxVal;
    const r = Math.abs(gaussRand())*sigma;
    const ang = Math.random()*Math.PI*2;
    const ox = _p1.x*Math.cos(ang)*r + _p2.x*Math.sin(ang)*r;
    const oy = _p1.y*Math.cos(ang)*r + _p2.y*Math.sin(ang)*r;
    const oz = _p1.z*Math.cos(ang)*r + _p2.z*Math.sin(ang)*r;

    pos[idx*3]   = bx + ox;
    pos[idx*3+1] = by + oy;
    pos[idx*3+2] = bz + oz;

    // drift toward nearest node
    const sign = t < 0.5 ? -1 : 1;
    drift[idx*3]   = _dir.x * sign;
    drift[idx*3+1] = _dir.y * sign;
    drift[idx*3+2] = _dir.z * sign;

    prox[idx] = Math.pow(proxVal, 1.8);
    seed[idx] = Math.random();
    idx++;
  }
}

// node cluster particles
for (let i = 0; i < NUM_NODES; i++){
  const nd = nodes[i];
  for (let p = 0; p < NPC; p++){
    const r = Math.pow(Math.random(), 0.6) * 1.1;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[idx*3]   = nd.x + r*Math.sin(ph)*Math.cos(th);
    pos[idx*3+1] = nd.y + r*Math.sin(ph)*Math.sin(th);
    pos[idx*3+2] = nd.z + r*Math.cos(ph);
    drift[idx*3] = drift[idx*3+1] = drift[idx*3+2] = 0;
    prox[idx] = 0.85 + 0.15*Math.random();
    seed[idx] = Math.random();
    idx++;
  }
}

/* ── filament backbone lines ────────────────────────── */
const linePos = new Float32Array(edges.length * 6);
const lineAlpha = new Float32Array(edges.length * 2);
for (let e = 0; e < edges.length; e++){
  const a = nodes[edges[e][0]], b = nodes[edges[e][1]];
  linePos[e*6]   = a.x; linePos[e*6+1] = a.y; linePos[e*6+2] = a.z;
  linePos[e*6+3] = b.x; linePos[e*6+4] = b.y; linePos[e*6+5] = b.z;
  const edgeLen = a.distanceTo(b);
  const la = 1.0 - edgeLen/MAX_EDGE_LEN;
  lineAlpha[e*2]   = la;
  lineAlpha[e*2+1] = la;
}

const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
lineGeom.setAttribute('alpha', new THREE.BufferAttribute(lineAlpha, 1));
const lineMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: {value:0} },
  vertexShader: `
    attribute float alpha;
    varying float vA;
    void main(){
      vA = alpha;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying float vA;
    void main(){
      vec3 c = vec3(0.14, 0.22, 0.42);
      float a = vA * 0.08;
      gl_FragColor = vec4(c*a, a);
    }`
});
scene.add(new THREE.LineSegments(lineGeom, lineMat));

/* ── particle material ──────────────────────────────── */
const uniforms = {
  uTime:  {value:0},
  uPixel: {value: renderer.getPixelRatio()}
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute vec3 drift;
    attribute float prox;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // gravitational infall oscillation along filament
      float phase = seed*6.2831 + uTime*0.12;
      float disp = sin(phase) * (1.0 - prox) * 1.8;
      p += drift * disp;
      // subtle cluster breathing
      float breathe = sin(uTime*0.25 + seed*4.0) * prox * 0.15;
      p += normalize(p + vec3(0.001)) * breathe;

      // IllustrisTNG palette: deep blue filament → gold → magenta at nodes
      vec3 cFil  = vec3(0.18, 0.28, 0.55);
      vec3 cWarm = vec3(0.85, 0.62, 0.22);
      vec3 cHot  = vec3(0.92, 0.35, 0.55);
      float pq = prox;
      vec3 col = mix(cFil, cWarm, smoothstep(0.2, 0.7, pq));
      col = mix(col, cHot, smoothstep(0.75, 1.0, pq) * 0.55);
      // faint shimmer
      col *= 0.9 + 0.1*sin(uTime*0.4 + seed*12.0);
      vCol = col;

      vAlpha = 0.06 + 0.85 * smoothstep(0.0, 0.8, pq);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (0.7 + 2.8*pq + 0.5*sin(phase*0.7)*pq) * uPixel * (90.0/max(dist,1.0));
      gl_PointSize = clamp(sz, 0.5, 18.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d,d);
      if (r2 > 0.25) discard;
      float core = exp(-r2 * 14.0);
      float halo = exp(-r2 * 4.0) * 0.3;
      float a = (core + halo) * vAlpha;
      // subtle dither to break banding
      float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)))*43758.5453);
      a *= 0.94 + 0.12*n;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('drift',    new THREE.BufferAttribute(drift, 3));
geom.setAttribute('prox',     new THREE.BufferAttribute(prox, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seed, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── camera ─────────────────────────────────────────── */
// compute centroid once for camera target
const centroid = new THREE.Vector3();
for (let i = 0; i < N; i++){
  centroid.x += pos[i*3]; centroid.y += pos[i*3+1]; centroid.z += pos[i*3+2];
}
centroid.multiplyScalar(1/N);

const CAM_R = 115;
const camTarget = new THREE.Vector3();

function updateCamera(t){
  // very slow orbit — one revolution per ~200 seconds
  const a = t * 0.031;
  const va = t * 0.017;
  camera.position.set(
    centroid.x + Math.cos(a) * CAM_R,
    centroid.y + Math.sin(va) * 18,
    centroid.z + Math.sin(a) * CAM_R
  );
  // camera target drifts gently around centroid
  camTarget.set(
    centroid.x + Math.sin(t*0.009)*4,
    centroid.y + Math.cos(t*0.013)*3,
    centroid.z + Math.sin(t*0.011)*4
  );
  camera.lookAt(camTarget);
}

/* ── resize ─────────────────────────────────────────── */
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/* ── render loop ────────────────────────────────────── */
const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) * 0.001;
  uniforms.uTime.value = t;
  updateCamera(t);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;

  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
