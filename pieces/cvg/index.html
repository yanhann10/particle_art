<title>cvg · manfred mohr · 8-cube projection</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 11px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing:0.04em; }
</style>

<body>
<div class="id">cvg · manfred mohr · 8-cube projection</div>
<div class="hint" id="hint">8-dimensional hypercube · algorithmic edge selection</div>
<div class="src">manfred mohr · P-197 / P-411 space.color · bitforms 2019</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const DIM = 8; // 8-dimensional hypercube
const N_VERTICES = Math.pow(2, DIM); // 256 vertices
const vertices = [];

// Generate all 2^n vertices of the n-cube in {-1,1}^n
for (let i = 0; i < N_VERTICES; i++){
  const v = [];
  for (let d = 0; d < DIM; d++){
    v.push((i & (1 << d)) ? 1 : -1);
  }
  vertices.push(v);
}

// Generate all edges: two vertices differ in exactly one coordinate
const edges = [];
for (let i = 0; i < N_VERTICES; i++){
  for (let d = 0; d < DIM; d++){
    const j = i ^ (1 << d); // flip bit d
    if (j > i) { // avoid duplicates
      edges.push([i, j]);
    }
  }
}

// Orthonormalized random projection matrix R^8 → R^3 (Gram-Schmidt)
function randomOrthoMatrix(){
  const M = [];
  for (let col = 0; col < 3; col++){
    let v = [];
    for (let row = 0; row < DIM; row++){
      v.push((Math.random()-0.5)*2);
    }
    // Gram-Schmidt orthogonalization
    for (let prev = 0; prev < col; prev++){
      const dot = v.reduce((acc, val, idx) => acc + val * M[prev][idx], 0);
      for (let row = 0; row < DIM; row++){
        v[row] -= dot * M[prev][row];
      }
    }
    // normalize
    const len = Math.sqrt(v.reduce((acc, val) => acc + val*val, 0));
    v = v.map(x => x / len);
    M.push(v);
  }
  return M;
}

const projMatrix = randomOrthoMatrix();

// Project vertex from R^8 → R^3
function project(vertex, rotation){
  // Apply Givens rotation in randomly chosen 2-plane of R^8
  const v = vertex.slice();
  const c = Math.cos(rotation), s = Math.sin(rotation);
  // Rotate in plane (dim 0, dim 1)
  const tmp0 = v[0]*c - v[1]*s;
  const tmp1 = v[0]*s + v[1]*c;
  v[0] = tmp0; v[1] = tmp1;
  // Rotate in plane (dim 2, dim 3)
  const tmp2 = v[2]*c - v[3]*s;
  const tmp3 = v[2]*s + v[3]*c;
  v[2] = tmp2; v[3] = tmp3;
  // Rotate in plane (dim 4, dim 5)
  const tmp4 = v[4]*c - v[5]*s;
  const tmp5 = v[4]*s + v[5]*c;
  v[4] = tmp4; v[5] = tmp5;
  // Rotate in plane (dim 6, dim 7)
  const tmp6 = v[6]*c - v[7]*s;
  const tmp7 = v[6]*s + v[7]*c;
  v[6] = tmp6; v[7] = tmp7;

  // Project via matrix
  const p = [0,0,0];
  for (let axis = 0; axis < 3; axis++){
    for (let d = 0; d < DIM; d++){
      p[axis] += projMatrix[axis][d] * v[d];
    }
  }
  return new THREE.Vector3(p[0], p[1], p[2]);
}

// Edge selection rule (Mohr-inspired): keep edges where sum of vertex bit-parity differs by rule
// Rule: keep edge if (popcount(i) + popcount(j)) mod 3 == 0
function edgeVisible(i, j){
  const popcountI = vertices[i].filter(x => x > 0).length;
  const popcountJ = vertices[j].filter(x => x > 0).length;
  return (popcountI + popcountJ) % 3 === 0;
}

// Mohr palette: primaries on black
const palette = [
  new THREE.Color(0xff0000), // red
  new THREE.Color(0x0040ff), // blue
  new THREE.Color(0xffdd00), // yellow
  new THREE.Color(0xffffff)  // white
];

// Build line geometry
const lineMaterial = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 1 });
const lineGeometry = new THREE.BufferGeometry();
const linePositions = [];
const lineColors = [];

function rebuildLines(rotation){
  linePositions.length = 0;
  lineColors.length = 0;
  edges.forEach(([i, j], idx) => {
    if (!edgeVisible(i, j)) return;
    const p1 = project(vertices[i], rotation);
    const p2 = project(vertices[j], rotation);
    const scale = 8.0;
    linePositions.push(p1.x * scale, p1.y * scale, p1.z * scale);
    linePositions.push(p2.x * scale, p2.y * scale, p2.z * scale);
    // Color per edge: deterministic from edge index
    const col = palette[idx % palette.length];
    lineColors.push(col.r, col.g, col.b);
    lineColors.push(col.r, col.g, col.b);
  });
  lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
  lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));
  lineGeometry.computeBoundingSphere();
}

rebuildLines(0);
const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
scene.add(lines);

// Add vertex markers at projected positions (small spheres)
const vertexGeom = new THREE.SphereGeometry(0.08, 8, 8);
const vertexMats = palette.map(col => new THREE.MeshBasicMaterial({ color: col }));
const vertexMeshes = [];

function rebuildVertices(rotation){
  vertexMeshes.forEach(m => scene.remove(m));
  vertexMeshes.length = 0;
  vertices.forEach((v, i) => {
    const p = project(v, rotation);
    const scale = 8.0;
    const mesh = new THREE.Mesh(vertexGeom, vertexMats[i % palette.length]);
    mesh.position.set(p.x * scale, p.y * scale, p.z * scale);
    scene.add(mesh);
    vertexMeshes.push(mesh);
  });
}

rebuildVertices(0);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hintEl = document.getElementById('hint');
const start = performance.now();
let lastRotation = 0;

function loop(){
  const t = (performance.now() - start) / 1000;
  // Slow rotation in the 8D space
  const rotation = t * 0.08;
  
  // Rebuild geometry every ~0.1s (smooth enough, not too expensive)
  if (Math.abs(rotation - lastRotation) > 0.02){
    rebuildLines(rotation);
    rebuildVertices(rotation);
    lastRotation = rotation;
    // Update hint with edge count
    const visibleEdges = edges.filter(([i,j]) => edgeVisible(i,j)).length;
    hintEl.textContent = `8-dimensional hypercube · ${visibleEdges}/${edges.length} edges by rule`;
  }

  // Slight camera drift for compositional interest
  camera.position.x = Math.sin(t * 0.03) * 2;
  camera.position.y = Math.cos(t * 0.05) * 1.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
