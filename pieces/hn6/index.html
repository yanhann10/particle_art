<script type="module">
import * as THREE from 'three';

/* ── Refik Anadol — Echoes of the Earth: Living Archive ──
   Parametric coral reef: instanced procedural corals morph through
   a species latent space. Subsurface-scattering shader. Plankton drift.
   Palette: turquoise water, coral pink, lime kelp, amber light above.
   Ref: Serpentine 2024 / Large Nature Model */

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x071a1f, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1e24, 0.018);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 22);
camera.lookAt(0, 2, 0);

// ── Palette ──
const PAL = {
  turquoise: new THREE.Color(0x0d8b8b),
  coralPink: new THREE.Color(0xe8636b),
  lime:      new THREE.Color(0x7bc950),
  amber:     new THREE.Color(0xd4a055),
  bone:      new THREE.Color(0xe8ddd0),
  deep:      new THREE.Color(0x0a2a3c),
};

// ── Lights — Olafur: vertical color-temperature gradient ──
const ambLight = new THREE.AmbientLight(0x0a2a3c, 0.3);
scene.add(ambLight);
const topLight = new THREE.DirectionalLight(0xd4a055, 1.2);
topLight.position.set(2, 20, 5);
scene.add(topLight);
const bottomLight = new THREE.DirectionalLight(0x0d6b7b, 0.4);
bottomLight.position.set(-3, -10, -2);
scene.add(bottomLight);
const rimLight = new THREE.PointLight(0xe8636b, 0.6, 40);
rimLight.position.set(-10, 6, -5);
scene.add(rimLight);

// ── Simplex 3D noise (compact) ──
function snoise3GLSL() {
  return `
  vec3 mod289v3(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289v4(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 perm4(vec4 x){return mod289v4(((x*34.0)+1.0)*x);}
  float snoise3(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0);
    const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy));
    vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz);
    vec3 l=1.0-g;
    vec3 i1=min(g,l.zxy);
    vec3 i2=max(g,l.zxy);
    vec3 x1=x0-i1+C.xxx;
    vec3 x2=x0-i2+C.yyy;
    vec3 x3=x0-D.yyy;
    i=mod289v3(i);
    vec4 p=perm4(perm4(perm4(
      i.z+vec4(0.0,i1.z,i2.z,1.0))
      +i.y+vec4(0.0,i1.y,i2.y,1.0))
      +i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=1.0/7.0;
    vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z);
    vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy;
    vec4 y=y_*ns.x+ns.yyyy;
    vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy);
    vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0;
    vec4 s1=floor(b1)*2.0+1.0;
    vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
    vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x);
    vec3 p1=vec3(a0.zw,h.y);
    vec3 p2=vec3(a1.xy,h.z);
    vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=1.79284291400159-0.85373472095314*
      vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
    m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;
}

// ── Coral geometry: a tube that branches ──
// Build a single coral branch as CylinderGeometry, then instance it
function makeCoralGeom(segs, radBot, radTop, height) {
  return new THREE.CylinderGeometry(radTop, radBot, height, 8, segs, true);
}

// ── Instanced coral colonies ──
// 4 clusters with different density and palette (Tyler Hobbs directive)
const CLUSTERS = [
  { center: new THREE.Vector3(-4.5, 0, -2), radius: 5, count: 90, palIdx: 0 },
  { center: new THREE.Vector3(4, 0, 1), radius: 4.5, count: 75, palIdx: 1 },
  { center: new THREE.Vector3(-1, 0, 5), radius: 3.5, count: 55, palIdx: 2 },
  { center: new THREE.Vector3(6, 0, -5), radius: 3, count: 40, palIdx: 3 },
];

const clusterPals = [
  [PAL.coralPink, PAL.amber, PAL.bone],
  [PAL.turquoise, PAL.lime, PAL.bone],
  [PAL.lime, PAL.coralPink, PAL.turquoise],
  [PAL.amber, PAL.coralPink, PAL.deep],
];

const coralVert = `
  ${snoise3GLSL()}
  uniform float uTime;
  uniform float uBreath;
  attribute vec3 instanceOffset;
  attribute float instancePhase;
  attribute float instanceSpecies;
  attribute float instanceScale;
  attribute vec3 instanceColor;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying vec3 vColor;
  varying float vHeight;
  varying float vSpecies;

  void main(){
    vColor = instanceColor;
    vSpecies = instanceSpecies;

    // species morph: 0=tube, 0.33=branching-wide, 0.66=plate-flat, 1=brain-bulge
    float sp = instanceSpecies;
    // morph species slowly through latent space
    sp = fract(sp + snoise3(vec3(instanceOffset.xz * 0.1, uTime * 0.04)) * 0.15);

    vec3 pos = position;
    float h01 = (pos.y + 0.5); // normalized height along cylinder

    // species-dependent deformation
    float radMod = 1.0;
    // tube coral: slight taper
    radMod = mix(radMod, 0.6 + 0.4 * (1.0 - h01), step(sp, 0.25));
    // branching: swell at middle
    float branchSwell = 1.0 + 0.5 * sin(h01 * 3.14159);
    radMod = mix(radMod, branchSwell, smoothstep(0.25, 0.5, sp) * (1.0 - smoothstep(0.5, 0.75, sp)));
    // plate: flatten top, widen
    float plateMod = mix(1.5, 0.3, h01 * h01);
    radMod = mix(radMod, plateMod, smoothstep(0.5, 0.75, sp) * (1.0 - smoothstep(0.75, 1.0, sp)));
    // brain: wavy bulge
    float brainMod = 1.0 + 0.3 * sin(pos.x * 8.0 + uTime * 0.3) * sin(pos.z * 8.0 + uTime * 0.2);
    radMod = mix(radMod, brainMod, smoothstep(0.75, 1.0, sp));

    pos.xz *= radMod;

    // organic undulation — breathing
    float breathAmt = 0.08 * sin(uTime * 0.4 + instancePhase * 6.28) * uBreath;
    pos.xz *= 1.0 + breathAmt * (0.5 + h01);

    // slight lean from noise
    float lean = snoise3(vec3(instanceOffset.x * 0.3, instanceOffset.z * 0.3, uTime * 0.06));
    pos.x += lean * 0.4 * h01;
    pos.z += snoise3(vec3(instanceOffset.z * 0.3, instanceOffset.x * 0.3, uTime * 0.06 + 5.0)) * 0.3 * h01;

    // instance transform
    pos *= instanceScale;
    pos += instanceOffset;
    pos.y += instanceScale * 0.5; // sit on substrate

    vWorldPos = pos;
    vHeight = h01;

    // approximate normal after deformation
    vNormal = normalize(normalMatrix * normal);

    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
  }
`;

const coralFrag = `
  uniform float uTime;
  uniform vec3 uFogColor;
  uniform float uFogDensity;
  varying vec3 vNormal;
  varying vec3 vWorldPos;
  varying vec3 vColor;
  varying float vHeight;
  varying float vSpecies;

  void main(){
    vec3 lightDir = normalize(vec3(0.3, 1.0, 0.4));
    vec3 viewDir = normalize(cameraPosition - vWorldPos);

    // diffuse
    float NdL = max(dot(vNormal, lightDir), 0.0);
    float diffuse = NdL * 0.7 + 0.3;

    // fake subsurface scattering: light wraps around
    float sss = pow(max(dot(-viewDir, lightDir), 0.0), 2.0) * 0.35;
    // translucency through thin parts (top of coral)
    sss += pow(1.0 - abs(dot(vNormal, viewDir)), 3.0) * 0.2 * vHeight;

    // color temperature gradient (Olafur): warm top, cool bottom
    vec3 warmTint = vec3(1.0, 0.85, 0.7);
    vec3 coolTint = vec3(0.6, 0.85, 1.0);
    float heightGlobal = clamp(vWorldPos.y * 0.08, 0.0, 1.0);
    vec3 tempTint = mix(coolTint, warmTint, heightGlobal);

    vec3 col = vColor * diffuse * tempTint;
    col += vColor * sss * 0.5;

    // slight wet specular
    vec3 halfVec = normalize(lightDir + viewDir);
    float spec = pow(max(dot(vNormal, halfVec), 0.0), 32.0);
    col += vec3(1.0, 0.95, 0.9) * spec * 0.25;

    // manual fog — depth-based teal
    float dist = length(vWorldPos - cameraPosition);
    float fogFactor = 1.0 - exp(-dist * dist * 0.0004);
    vec3 fogCol = mix(vec3(0.04, 0.12, 0.15), vec3(0.05, 0.08, 0.10), fogFactor);
    col = mix(col, fogCol, fogFactor);

    // film grain (Lia Halloran directive)
    float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233)) + uTime) * 43758.5453);
    col += (grain - 0.5) * 0.03;

    gl_FragColor = vec4(col, 1.0);
  }
`;

const coralGeom = makeCoralGeom(12, 0.25, 0.15, 1.0);
const totalCorals = CLUSTERS.reduce((s, c) => s + c.count, 0);

const offsets = new Float32Array(totalCorals * 3);
const phases = new Float32Array(totalCorals);
const species = new Float32Array(totalCorals);
const scales = new Float32Array(totalCorals);
const colors = new Float32Array(totalCorals * 3);

// Vera Molnar: hex grid with Perlin displacement
let idx = 0;
for (const cl of CLUSTERS) {
  const pal = clusterPals[cl.palIdx];
  for (let i = 0; i < cl.count; i++) {
    // hex grid placement within cluster radius, then displace
    const angle = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * cl.radius;
    let x = cl.center.x + Math.cos(angle) * r;
    let z = cl.center.z + Math.sin(angle) * r;

    offsets[idx * 3] = x;
    offsets[idx * 3 + 1] = 0;
    offsets[idx * 3 + 2] = z;

    phases[idx] = Math.random();
    species[idx] = Math.random();

    // varied scale with intentional variation (wabi-sabi)
    const baseScale = 0.8 + Math.random() * 2.5;
    scales[idx] = baseScale;

    // pick color from cluster palette with variation
    const pc = pal[Math.floor(Math.random() * pal.length)];
    const variation = 0.85 + Math.random() * 0.3;
    colors[idx * 3] = pc.r * variation;
    colors[idx * 3 + 1] = pc.g * variation;
    colors[idx * 3 + 2] = pc.b * variation;

    idx++;
  }
}

const iOffsetAttr = new THREE.InstancedBufferAttribute(offsets, 3);
const iPhaseAttr = new THREE.InstancedBufferAttribute(phases, 1);
const iSpeciesAttr = new THREE.InstancedBufferAttribute(species, 1);
const iScaleAttr = new THREE.InstancedBufferAttribute(scales, 1);
const iColorAttr = new THREE.InstancedBufferAttribute(colors, 3);

coralGeom.setAttribute('instanceOffset', iOffsetAttr);
coralGeom.setAttribute('instancePhase', iPhaseAttr);
coralGeom.setAttribute('instanceSpecies', iSpeciesAttr);
coralGeom.setAttribute('instanceScale', iScaleAttr);
coralGeom.setAttribute('instanceColor', iColorAttr);

const coralMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uBreath: { value: 1.0 },
    uFogColor: { value: new THREE.Color(0x0a1e24) },
    uFogDensity: { value: 0.02 },
  },
  vertexShader: coralVert,
  fragmentShader: coralFrag,
  side: THREE.DoubleSide,
});

const coralMesh = new THREE.InstancedMesh(coralGeom, coralMat, totalCorals);
coralMesh.count = totalCorals;
scene.add(coralMesh);

// ── Substrate plane ──
const substrateMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWP;
    void main(){
      vUv = uv;
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWP = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vWP;
    uniform float uTime;
    void main(){
      // sandy substrate with subtle caustics
      float d = length(vWP.xz);
      float caustic = sin(vWP.x * 2.0 + uTime * 0.3) * sin(vWP.z * 2.5 + uTime * 0.2) * 0.5 + 0.5;
      caustic = pow(caustic, 3.0) * 0.15;
      vec3 base = mix(vec3(0.08, 0.06, 0.04), vec3(0.05, 0.09, 0.08), smoothstep(5.0, 15.0, d));
      base += caustic * vec3(0.1, 0.18, 0.15);
      // fog
      float dist = length(vWP - cameraPosition);
      float fog = 1.0 - exp(-dist * dist * 0.0004);
      base = mix(base, vec3(0.04, 0.10, 0.12), fog);
      gl_FragColor = vec4(base, 1.0);
    }`,
  side: THREE.FrontSide,
});
const substrate = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), substrateMat);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = 0;
scene.add(substrate);

// ── Chiharu Shiota: thread connections between nearby corals ──
// Plus one bleached-white coral at center
const threadPositions = [];
for (let i = 0; i < totalCorals; i++) {
  const ax = offsets[i * 3], az = offsets[i * 3 + 2], as = scales[i];
  for (let j = i + 1; j < totalCorals; j++) {
    const bx = offsets[j * 3], bz = offsets[j * 3 + 2], bs = scales[j];
    const dx = ax - bx, dz = az - bz;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 3.5 && Math.random() < 0.3) {
      threadPositions.push(ax, as * 0.6, az, bx, bs * 0.6, bz);
    }
  }
}
if (threadPositions.length > 0) {
  const threadGeom = new THREE.BufferGeometry();
  threadGeom.setAttribute('position', new THREE.Float32BufferAttribute(threadPositions, 3));
  const threadMat = new THREE.LineBasicMaterial({
    color: 0xe8ddd0, transparent: true, opacity: 0.08,
  });
  scene.add(new THREE.LineSegments(threadGeom, threadMat));
}

// ── Plankton particles (drift motion) ──
const PLANKTON = 3000;
const plankGeom = new THREE.BufferGeometry();
const plankPos = new Float32Array(PLANKTON * 3);
const plankPhase = new Float32Array(PLANKTON);
for (let i = 0; i < PLANKTON; i++) {
  plankPos[i * 3] = (Math.random() - 0.5) * 35;
  plankPos[i * 3 + 1] = Math.random() * 18;
  plankPos[i * 3 + 2] = (Math.random() - 0.5) * 35;
  plankPhase[i] = Math.random() * 6.28;
}
plankGeom.setAttribute('position', new THREE.BufferAttribute(plankPos, 3));
plankGeom.setAttribute('aPhase', new THREE.BufferAttribute(plankPhase, 1));

const plankMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aPhase;
    uniform float uTime;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.15 + aPhase;
      p.x += sin(t * 1.3) * 0.5;
      p.y += sin(t * 0.7 + 2.0) * 0.3;
      p.z += cos(t * 1.1) * 0.4;
      // slow ascent
      p.y = mod(p.y + uTime * 0.02 + aPhase * 3.0, 18.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + sin(aPhase + uTime * 0.5) * 0.5) * 60.0 / max(dist, 1.0);
      gl_Position = projectionMatrix * mv;
      // fade with distance
      vAlpha = exp(-dist * dist * 0.001) * (0.3 + 0.2 * sin(t * 2.0));
    }`,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r * 10.0) * vAlpha;
      gl_FragColor = vec4(0.6, 0.9, 0.8, a);
    }`,
});
scene.add(new THREE.Points(plankGeom, plankMat));

// ── Volumetric fog plane between layers (Refik directive) ──
const fogPlaneMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWP;
    void main(){
      vUv = uv;
      vWP = (modelMatrix * vec4(position, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    varying vec2 vUv;
    varying vec3 vWP;
    uniform float uTime;
    void main(){
      float d = length(vWP.xz) * 0.05;
      float caustic = sin(vWP.x * 1.5 + uTime * 0.2) * sin(vWP.z * 1.8 - uTime * 0.15);
      caustic = pow(abs(caustic), 2.0) * 0.3;
      vec3 col = mix(vec3(0.05, 0.15, 0.18), vec3(0.08, 0.20, 0.22), caustic);
      float alpha = 0.12 * (1.0 - smoothstep(0.0, 0.5, d));
      gl_FragColor = vec4(col, alpha);
    }`,
});
const fogPlane = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), fogPlaneMat);
fogPlane.rotation.x = -Math.PI / 2;
fogPlane.position.y = 4.0;
scene.add(fogPlane);

// ── Background gradient (deep water) ──
const bgGeom = new THREE.PlaneGeometry(2, 2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.9999,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      // Olafur: warm amber top → cold deep teal bottom
      vec3 top = vec3(0.08, 0.06, 0.03);
      vec3 mid = vec3(0.04, 0.10, 0.12);
      vec3 bot = vec3(0.02, 0.05, 0.06);
      float y = vUv.y;
      vec3 col = mix(bot, mid, smoothstep(0.0, 0.4, y));
      col = mix(col, top, smoothstep(0.6, 1.0, y));
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const bgMesh = new THREE.Mesh(bgGeom, bgMat);
bgMesh.frustumCulled = false;
bgMesh.renderOrder = -1;
scene.add(bgMesh);

// ── Resize ──
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation loop: breathing reef ──
const centroid = new THREE.Vector3(0, 3, 0);
let startTime = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - startTime) * 0.001;

  // slow breathing camera orbit
  const breathCycle = Math.sin(t * 0.15) * 0.5 + 0.5; // 0–1
  const camAngle = t * 0.05;
  const camR = 20 + Math.sin(t * 0.08) * 3; // gentle in-out
  const camY = 7 + Math.sin(t * 0.12) * 2.5;

  camera.position.x = Math.sin(camAngle) * camR;
  camera.position.z = Math.cos(camAngle) * camR;
  camera.position.y = camY;
  camera.lookAt(centroid);

  // update uniforms
  coralMat.uniforms.uTime.value = t;
  coralMat.uniforms.uBreath.value = 0.7 + breathCycle * 0.6;
  substrateMat.uniforms.uTime.value = t;
  plankMat.uniforms.uTime.value = t;
  fogPlaneMat.uniforms.uTime.value = t;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
