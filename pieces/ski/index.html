<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>ski · attractor instrument · 4 stages</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .stage { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size:11px; letter-spacing:0.08em; }
  #panel {
    position:fixed; top:16px; right:16px; width:192px;
    background:rgba(6,10,18,0.82); border:1px solid rgba(140,155,180,0.12);
    border-radius:6px; padding:14px 14px 10px; z-index:10;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  #panel .ptitle { font-size:9px; letter-spacing:0.12em; text-transform:uppercase;
                   opacity:0.4; margin-bottom:10px; }
  .ctrl { margin-bottom:9px; }
  .ctrl label { display:flex; justify-content:space-between; font-size:10px; opacity:0.6;
                margin-bottom:3px; letter-spacing:0.03em; }
  .ctrl label span.val { opacity:0.85; font-variant-numeric:tabular-nums; }
  .ctrl input[type=range] {
    -webkit-appearance:none; appearance:none; width:100%; height:3px;
    background:rgba(140,155,180,0.15); border-radius:2px; outline:none;
    cursor:pointer;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:10px; height:10px; border-radius:50%;
    background:rgba(180,195,220,0.7); border:none; cursor:pointer;
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width:10px; height:10px; border-radius:50%;
    background:rgba(180,195,220,0.7); border:none; cursor:pointer;
  }
</style>
</head>
<body>
<div class="id">ski</div>
<div class="hint">click to cycle attractor · sliders shape the field</div>
<div class="stage" id="stage">stage 1/4 · lorenz</div>

<div id="panel">
  <div class="ptitle">parameters</div>
  <div class="ctrl">
    <label>motion intensity <span class="val" id="v_motion">1.00</span></label>
    <input type="range" id="s_motion" min="0.05" max="3.0" step="0.01" value="1.0">
  </div>
  <div class="ctrl">
    <label>hue shift <span class="val" id="v_hue">0°</span></label>
    <input type="range" id="s_hue" min="0" max="360" step="1" value="0">
  </div>
  <div class="ctrl">
    <label>fog density <span class="val" id="v_fog">0.06</span></label>
    <input type="range" id="s_fog" min="0.0" max="0.25" step="0.005" value="0.06">
  </div>
  <div class="ctrl">
    <label>point scale <span class="val" id="v_size">1.00</span></label>
    <input type="range" id="s_size" min="0.3" max="3.0" step="0.05" value="1.0">
  </div>
  <div class="ctrl">
    <label>orbit speed <span class="val" id="v_orbit">1.00</span></label>
    <input type="range" id="s_orbit" min="0.0" max="4.0" step="0.05" value="1.0">
  </div>
  <div class="ctrl">
    <label>beam glow <span class="val" id="v_beam">1.00</span></label>
    <input type="range" id="s_beam" min="0.0" max="2.5" step="0.05" value="1.0">
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── slider state ── */
const P = {
  motion: 1.0, hue: 0, fog: 0.06, size: 1.0, orbit: 1.0, beam: 1.0
};
function bindSlider(id, key, fmt){
  const s = document.getElementById('s_'+id);
  const v = document.getElementById('v_'+id);
  s.addEventListener('input', ()=>{ P[key]=parseFloat(s.value); v.textContent=fmt(P[key]); });
}
bindSlider('motion','motion', v=>v.toFixed(2));
bindSlider('hue','hue', v=>v.toFixed(0)+'°');
bindSlider('fog','fog', v=>v.toFixed(3));
bindSlider('size','size', v=>v.toFixed(2));
bindSlider('orbit','orbit', v=>v.toFixed(2));
bindSlider('beam','beam', v=>v.toFixed(2));

/* ── hue rotation helper ── */
function rotHue(rgb, deg){
  const rad = deg * Math.PI / 180;
  const cos = Math.cos(rad), sin = Math.sin(rad);
  const [r,g,b] = rgb;
  return [
    (0.299+0.701*cos+0.168*sin)*r + (0.587-0.587*cos+0.330*sin)*g + (0.114-0.114*cos-0.497*sin)*b,
    (0.299-0.299*cos-0.328*sin)*r + (0.587+0.413*cos+0.035*sin)*g + (0.114-0.114*cos+0.292*sin)*b,
    (0.299-0.300*cos+1.250*sin)*r + (0.587-0.588*cos-1.050*sin)*g + (0.114+0.886*cos-0.203*sin)*b
  ].map(v=>Math.max(0,Math.min(1,v)));
}

const MODES = [
  { id:'lorenz',    basinCenter:[0,0,27],    basinSize:8,
    normCenter:[0,0,25], normScale:25, pal:[[0.20,0.32,0.78],[0.85,0.32,0.62],[0.98,0.86,0.50]] },
  { id:'aizawa',    basinCenter:[0.1,0,0],   basinSize:0.6,
    normCenter:[0,0,0],  normScale:1.6, pal:[[0.20,0.62,0.45],[0.55,0.30,0.78],[0.92,0.95,0.98]] },
  { id:'thomas',    basinCenter:[0.5,0,0.5], basinSize:1.2,
    normCenter:[0,0,0],  normScale:5.0, pal:[[0.92,0.55,0.20],[0.98,0.78,0.32],[0.55,0.20,0.05]] },
  { id:'halvorsen', basinCenter:[-1,-1,-1],  basinSize:1.8,
    normCenter:[0,0,0],  normScale:7.0, pal:[[0.42,0.78,0.92],[0.88,0.42,0.62],[0.92,0.92,0.85]] },
];

const W=320, H=320, N=W*H;

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type:THREE.HalfFloatType, format:THREE.RGBAFormat,
  minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter,
  wrapS:THREE.ClampToEdgeWrapping, wrapT:THREE.ClampToEdgeWrapping, depthBuffer:false };
let rtA = new THREE.WebGLRenderTarget(W,H,rtParams);
let rtB = new THREE.WebGLRenderTarget(W,H,rtParams);

function makeInitTexture(mi){
  const m=MODES[mi]; const d=new Float32Array(N*4);
  for(let i=0;i<N;i++){
    d[i*4]=m.basinCenter[0]+(Math.random()-0.5)*m.basinSize;
    d[i*4+1]=m.basinCenter[1]+(Math.random()-0.5)*m.basinSize;
    d[i*4+2]=m.basinCenter[2]+(Math.random()-0.5)*m.basinSize;
    d[i*4+3]=Math.random();
  }
  const t=new THREE.DataTexture(d,W,H,THREE.RGBAFormat,THREE.FloatType);
  t.needsUpdate=true; return t;
}

const camOrtho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat=new THREE.ShaderMaterial({
  uniforms:{ tex:{value:makeInitTexture(0)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene=new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

function reinitTo(mi){
  blitMat.uniforms.tex.value=makeInitTexture(mi);
  renderer.setRenderTarget(rtA); renderer.render(blitScene,camOrtho);
  renderer.setRenderTarget(rtB); renderer.render(blitScene,camOrtho);
  renderer.setRenderTarget(null);
}
reinitTo(0);

/* ── GPGPU sim ── */
const simU = { prev:{value:rtA.texture}, uDt:{value:0}, uMode:{value:0}, uMotion:{value:1.0} };
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D prev; uniform float uDt; uniform int uMode; uniform float uMotion;
    varying vec2 vUv;
    vec3 lorenz(vec3 p){ return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y-(8.0/3.0)*p.z); }
    vec3 aizawa(vec3 p){
      const float a=0.95,b=0.7,c=0.6,d=3.5,e=0.25,f=0.1;
      return vec3((p.z-b)*p.x-d*p.y, d*p.x+(p.z-b)*p.y,
                  c+a*p.z-p.z*p.z*p.z/3.0-(p.x*p.x+p.y*p.y)*(1.0+e*p.z)+f*p.z*p.x*p.x*p.x);
    }
    vec3 thomasA(vec3 p){ const float B=0.208186;
      return vec3(sin(p.y)-B*p.x, sin(p.z)-B*p.y, sin(p.x)-B*p.z); }
    vec3 halvorsen(vec3 p){ const float a=1.4;
      return vec3(-a*p.x-4.0*p.y-4.0*p.z-p.y*p.y, -a*p.y-4.0*p.z-4.0*p.x-p.z*p.z,
                  -a*p.z-4.0*p.x-4.0*p.y-p.x*p.x); }
    void main(){
      vec4 s=texture2D(prev,vUv); vec3 p=s.xyz; float age=s.w;
      vec3 dp;
      if(uMode==0) dp=lorenz(p); else if(uMode==1) dp=aizawa(p);
      else if(uMode==2) dp=thomasA(p); else dp=halvorsen(p);
      float dt=uDt*uMotion;
      if(uMode==0) dt*=0.15; else if(uMode==3) dt*=0.4;
      p+=dp*dt; age=mod(age+dt*0.06,1.0);
      gl_FragColor=vec4(p,age);
    }`
});
const simScene=new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),simMat));

/* ── render scene ── */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,50);
camera.position.set(0,0.6,5); camera.lookAt(0,0,0);

/* volumetric beam */
const beamGeom=new THREE.ConeGeometry(1.2,11,24,1,true);
beamGeom.translate(0,5.5,0);
const beamMat=new THREE.ShaderMaterial({
  uniforms:{ uTime:{value:0}, uColor:{value:new THREE.Color(0.85,0.92,1.0)}, uIntensity:{value:1.0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
  vertexShader:`varying vec3 vLocal; varying float vYNorm;
    void main(){ vLocal=position; vYNorm=position.y/11.0;
                 gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform float uTime; uniform vec3 uColor; uniform float uIntensity;
    varying vec3 vLocal; varying float vYNorm;
    void main(){
      float radial=length(vec2(vLocal.x,vLocal.z));
      float r=1.0-smoothstep(0.0,1.2*(1.0-vYNorm),radial);
      float vert=1.0-smoothstep(0.0,1.0,vYNorm);
      float a=r*vert*0.20*(0.95+0.05*sin(uTime*0.7))*uIntensity;
      gl_FragColor=vec4(uColor*a,a);
    }`
});
const beam=new THREE.Mesh(beamGeom,beamMat);
beam.position.set(-2.4,-3.0,-1.0); beam.rotation.z=-0.18;
scene.add(beam);

/* points */
const ptGeom=new THREE.BufferGeometry();
const idxArr=new Float32Array(N*2);
for(let y=0;y<H;y++) for(let x=0;x<W;x++){
  const i=y*W+x; idxArr[i*2]=(x+0.5)/W; idxArr[i*2+1]=(y+0.5)/H;
}
ptGeom.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
ptGeom.setAttribute('uvIdx',new THREE.BufferAttribute(idxArr,2));

const ptMat=new THREE.ShaderMaterial({
  uniforms:{
    state:{value:rtA.texture}, uPixel:{value:renderer.getPixelRatio()},
    uPalA:{value:new THREE.Vector3(...MODES[0].pal[0])},
    uPalB:{value:new THREE.Vector3(...MODES[0].pal[1])},
    uPalC:{value:new THREE.Vector3(...MODES[0].pal[2])},
    uNormCenter:{value:new THREE.Vector3(...MODES[0].normCenter)},
    uNormScale:{value:MODES[0].normScale},
    uFade:{value:1.0}, uBeamPos:{value:new THREE.Vector3(-2.4,0,-1)},
    uPtScale:{value:1.0}, uFogDensity:{value:0.0035}
  },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform sampler2D state; uniform float uPixel;
    uniform vec3 uPalA,uPalB,uPalC,uNormCenter,uBeamPos;
    uniform float uNormScale,uFade,uPtScale;
    attribute vec2 uvIdx;
    varying vec3 vCol; varying float vBeam,vAlpha,vFogDepth;
    void main(){
      vec4 s=texture2D(state,uvIdx); vec3 p=s.xyz; float age=s.w;
      vec3 disp=(p-uNormCenter)/uNormScale;
      vec2 toBeam=disp.xz-vec2(uBeamPos.x,uBeamPos.z);
      float beamProx=exp(-dot(toBeam,toBeam)*3.5);
      vBeam=beamProx;
      float k=mod(age,1.0);
      vec3 col=mix(uPalA,uPalB,smoothstep(0.0,0.5,k));
      col=mix(col,uPalC,smoothstep(0.5,1.0,k));
      col=mix(col,col*1.5+vec3(0.05,0.08,0.12),beamProx*0.6);
      vCol=col; vAlpha=uFade;
      vec4 mv=modelViewMatrix*vec4(disp,1.0);
      vFogDepth=-mv.z;
      gl_PointSize=(2.0+1.6*beamProx)*uPixel*(3.0/vFogDepth)*uPtScale;
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying vec3 vCol; varying float vBeam,vAlpha,vFogDepth;
    uniform float uFogDensity;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*14.0);
      float fogF=1.0-exp(-uFogDensity*vFogDepth*vFogDepth);
      vec3 col=mix(vCol,vec3(0.025,0.030,0.040),fogF);
      gl_FragColor=vec4(col*a*(0.6+vBeam*0.6)*vAlpha, a*vAlpha);
    }`
});
const pts=new THREE.Points(ptGeom,ptMat);
scene.add(pts);

/* ── mode switching ── */
let mode=0, switching=false, switchStartT=0, switchTargetMode=0;
const SWITCH_S=1.4;
const stageEl=document.getElementById('stage');
function setStageText(){ stageEl.textContent=`stage ${mode+1}/4 · ${MODES[mode].id}`; }
setStageText();

function applyPalette(m){
  const h=P.hue;
  ptMat.uniforms.uPalA.value.set(...rotHue(MODES[m].pal[0],h));
  ptMat.uniforms.uPalB.value.set(...rotHue(MODES[m].pal[1],h));
  ptMat.uniforms.uPalC.value.set(...rotHue(MODES[m].pal[2],h));
  ptMat.uniforms.uNormCenter.value.set(...MODES[m].normCenter);
  ptMat.uniforms.uNormScale.value=MODES[m].normScale;
  simU.uMode.value=m;
}

function startSwitch(t){ if(!switching){ switching=true; switchStartT=performance.now(); switchTargetMode=t; } }

/* click on canvas only (not panel) */
renderer.domElement.addEventListener('click', ()=>startSwitch((mode+1)%MODES.length));

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

setInterval(()=>{ if(!switching) startSwitch((mode+1)%MODES.length); }, 14000);

let lastT=performance.now(), lastHue=0;
function loop(){
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000);
  lastT=now;

  /* sync slider params */
  simU.uMotion.value=P.motion;
  ptMat.uniforms.uPtScale.value=P.size;
  ptMat.uniforms.uFogDensity.value=P.fog*0.06; // remap 0-0.25 → 0-0.015
  beamMat.uniforms.uIntensity.value=P.beam;
  beamMat.uniforms.uTime.value=now/1000;
  simU.uDt.value=dt;

  /* live hue update */
  if(P.hue!==lastHue){ lastHue=P.hue; applyPalette(mode); }

  /* wipe transition */
  if(switching){
    const u=(now-switchStartT)/(SWITCH_S*1000);
    if(u<0.5){
      ptMat.uniforms.uFade.value=1.0-u*2.0;
    } else if(u<1.0){
      if(ptMat.uniforms.uFade.value<=0.05 && mode!==switchTargetMode){
        mode=switchTargetMode; applyPalette(mode); reinitTo(mode); setStageText();
      }
      ptMat.uniforms.uFade.value=(u-0.5)*2.0;
    } else { ptMat.uniforms.uFade.value=1.0; switching=false; }
  }

  /* sim substeps */
  for(let i=0;i<4;i++){
    simU.prev.value=rtA.texture;
    renderer.setRenderTarget(rtB); renderer.render(simScene,camOrtho);
    const tmp=rtA; rtA=rtB; rtB=tmp;
  }
  renderer.setRenderTarget(null);
  ptMat.uniforms.state.value=rtA.texture;

  /* camera orbit */
  const ang=now*0.00018*P.orbit;
  camera.position.x=Math.sin(ang)*5;
  camera.position.z=Math.cos(ang)*5;
  camera.position.y=Math.sin(ang*0.7)*1.0;
  camera.lookAt(0,0,0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
