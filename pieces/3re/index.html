<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3re · Shiota — Leaf Vessel</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">3re</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020000, 0.0020);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x040000, 0.002));
const warmL = new THREE.PointLight(0xff2008, 0.012, 35, 2.0);
warmL.position.set(-2, 8, 3);
scene.add(warmL);

let seed = 9173482;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:22, h:18, d:20 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

// ── THE VESSEL — a single suspended leaf-bowl formed FROM leaves
// Each leaf a scale in the surface, leaf-AS-basic-unit principle
// The vessel holds nothing but memory — an empty cup
const vesselCenter = new THREE.Vector3(0, 0.5, 0);
const vesselR = 2.2;

// Generate vessel surface as tessellated leaf-scale patches
const leafPatches = [];
const phiSegments = 16;
const thetaSegments = 10;

for(let p=0; p<phiSegments; p++){
  for(let t=0; t<thetaSegments; t++){
    const phi = (p/phiSegments)*Math.PI*2;
    const theta = (t/thetaSegments)*Math.PI*0.65; // hemisphere plus collar
    
    const x = vesselCenter.x + Math.sin(theta)*Math.cos(phi)*vesselR;
    const y = vesselCenter.y - Math.cos(theta)*vesselR*1.1;
    const z = vesselCenter.z + Math.sin(theta)*Math.sin(phi)*vesselR;
    
    const normal = new THREE.Vector3(x-vesselCenter.x, y-vesselCenter.y, z-vesselCenter.z).normalize();
    
    // Each patch is a small leaf shape
    const leafW = 0.18 + rng()*0.08;
    const leafH = leafW * (1.4 + rng()*0.3);
    
    const right = new THREE.Vector3(-normal.z, 0, normal.x).normalize();
    const up = normal.clone().cross(right).normalize();
    
    // Leaf outline — pointed ovate
    const leafPts = [];
    for(let i=0; i<=8; i++){
      const lt = i/8;
      const angle = (lt-0.5)*Math.PI;
      const r = Math.sin(lt*Math.PI)*leafW*0.5;
      const h = (lt-0.5)*leafH;
      const lx = Math.cos(angle)*r;
      const ly = h;
      const wp = new THREE.Vector3(
        x + right.x*lx + up.x*ly,
        y + right.y*lx + up.y*ly,
        z + right.z*lx + up.z*ly
      );
      leafPts.push(wp);
    }
    
    // Leaf midvein — slight offset inward
    const midStart = new THREE.Vector3(x,y,z).add(normal.clone().multiplyScalar(-0.02));
    const midEnd = midStart.clone().add(up.clone().multiplyScalar(leafH*0.9));
    
    leafPatches.push({ pts: leafPts, mid: [midStart, midEnd], center: new THREE.Vector3(x,y,z) });
  }
}

// Draw vessel as white translucent surface
const vesselGeo = new THREE.SphereGeometry(vesselR, 32, 20, 0, Math.PI*2, 0, Math.PI*0.65);
const vesselMat = new THREE.MeshStandardMaterial({
  color: 0xe8dcc8, emissive: 0xf0e4d0, emissiveIntensity: 0.6,
  roughness: 0.94, transparent: true, opacity: 0.28, side: THREE.DoubleSide
});
const vesselMesh = new THREE.Mesh(vesselGeo, vesselMat);
vesselMesh.position.copy(vesselCenter);
vesselMesh.position.y -= vesselR*0.55;
scene.add(vesselMesh);

const glowV = new THREE.PointLight(0xfff5e8, 0.006, 6, 2);
glowV.position.copy(vesselCenter);
scene.add(glowV);

// ── ANCHOR NETWORK — icosahedral shell + vessel surface + walls
const icoGeo = new THREE.IcosahedronGeometry(1, 1);
const icoPos = icoGeo.attributes.position;
const icoNorms = [];
const seen = new Set();
for(let i=0; i<icoPos.count; i++){
  const v = new THREE.Vector3().fromBufferAttribute(icoPos, i).normalize();
  const key = `${(v.x*1000|0)},${(v.y*1000|0)},${(v.z*1000|0)}`;
  if(!seen.has(key)){ seen.add(key); icoNorms.push(v); }
}

const anchors = [];
const shellRadii = [3.8, 5.5, 7.5, 9.5];
for(const sr of shellRadii){
  for(const n of icoNorms){
    const pt = new THREE.Vector3(
      vesselCenter.x + n.x*sr,
      vesselCenter.y + n.y*sr*0.75,
      vesselCenter.z + n.z*sr
    );
    if(Math.abs(pt.x)<hw-0.5 && Math.abs(pt.y)<hh-0.5 && Math.abs(pt.z)<hd-0.5){
      anchors.push(pt);
    }
  }
}

// Vessel surface anchors — leaf patch centers
for(const lp of leafPatches){
  anchors.push(lp.center);
}

// Wall anchors
function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}
for(let i=0; i<45; i++) anchors.push(wallPt());

// ── BUILD THREAD NETWORK — 20,000 line segments max
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// ── SUSPENSION — ceiling threads to vessel rim
const rimPoints = [];
for(let i=0; i<12; i++){
  const angle = (i/12)*Math.PI*2;
  const rx = Math.cos(angle)*vesselR;
  const rz = Math.sin(angle)*vesselR;
  rimPoints.push(new THREE.Vector3(vesselCenter.x+rx, vesselCenter.y+vesselR*0.5, vesselCenter.z+rz));
}
for(const rp of rimPoints){
  const top = new THREE.Vector3(rp.x+(rng()-0.5)*0.5, hh, rp.z+(rng()-0.5)*0.5);
  setLine(top, rp);
}

// ── LEAF OUTLINES — each patch perimeter
for(const lp of leafPatches){
  for(let i=0; i<lp.pts.length-1; i++){
    setLine(lp.pts[i], lp.pts[i+1]);
  }
}

// ── LEAF MIDVEINS
for(const lp of leafPatches){
  setLine(lp.mid[0], lp.mid[1]);
}

// ── CONVERGENCE — anchors to nearest vessel surface
for(let i=0; i<anchors.length && li<NUM_LINES-100; i++){
  const a = anchors[i];
  const d = a.distanceTo(vesselCenter);
  if(d<vesselR*1.1) continue; // skip vessel-surface anchors themselves
  
  const count = d<4.0 ? 2 : 1;
  for(let j=0; j<count && li<NUM_LINES-50; j++){
    // Target a random vessel patch center
    const target = leafPatches[Math.floor(rng()*leafPatches.length)].center;
    setLine(a, target);
  }
}

// ── PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 4.2;
let webCount=0, attempts=0;
while(webCount<3500 && li<NUM_LINES-1000 && attempts<25000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<8; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// ── RADIAL THREADS from vessel surface outward
for(let i=0; i<800 && li<NUM_LINES-500; i++){
  const lp = leafPatches[Math.floor(rng()*leafPatches.length)];
  const dir = lp.center.clone().sub(vesselCenter).normalize();
  dir.x += (rng()-0.5)*0.3;
  dir.y += (rng()-0.5)*0.25;
  dir.z += (rng()-0.5)*0.3;
  dir.normalize();
  const len = 1.5 + rng()*3.0;
  const end = lp.center.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(lp.center, end);
  }
}

// ── FILL remaining with wall spans
while(li<NUM_LINES-1){
  const a = wallPt();
  const b = anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.07,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// ── CAMERA PATH — slow orbit and descent around the vessel
const pathLen = 2800;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.18){
    // Approach from above-right
    const lt = t/0.18;
    x = vesselCenter.x + 8.0 - lt*3.0;
    y = vesselCenter.y + 5.5 - lt*1.5;
    z = vesselCenter.z + 6.5 - lt*2.0;
  } else if(t<0.40){
    // Orbit at mid-height, seeing vessel in web
    const lt = (t-0.18)/0.22;
    const angle = lt*Math.PI*1.3 + 0.5;
    const r = 5.5 + Math.sin(lt*Math.PI)*0.4;
    x = vesselCenter.x + Math.cos(angle)*r;
    y = vesselCenter.y + 1.0 + Math.sin(lt*Math.PI*0.5)*0.8;
    z = vesselCenter.z + Math.sin(angle)*r;
  } else if(t<0.62){
    // Descend below vessel, looking up through the web
    const lt = (t-0.40)/0.22;
    const angle = lt*Math.PI*0.9 + 2.8;
    const r = 4.8;
    x = vesselCenter.x + Math.cos(angle)*r;
    y = vesselCenter.y - lt*5.5;
    z = vesselCenter.z + Math.sin(angle)*r;
  } else if(t<0.80){
    // Rise along the side, threads crossing vision
    const lt = (t-0.62)/0.18;
    x = vesselCenter.x + Math.sin(lt*Math.PI*0.4+3.5)*4.5;
    y = vesselCenter.y - 5.5 + lt*10.0;
    z = vesselCenter.z + Math.cos(lt*Math.PI*0.4+3.5)*4.8;
  } else {
    // Recede into darkness
    const lt = (t-0.80)/0.20;
    const r = 5.0 + lt*6.0;
    x = vesselCenter.x + Math.cos(lt*Math.PI*0.3+4.5)*r;
    y = vesselCenter.y + 4.0 - lt*2.0;
    z = vesselCenter.z + Math.sin(lt*Math.PI*0.3+4.5)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.04+basePositions[idx+1]*0.03+i*0.0002;
    const breath = Math.sin(elapsed*0.0008+phase)*0.00003;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.03;
      arr[vi+1] = basePositions[vi+1] + breath*0.02;
      arr[vi+2] = basePositions[vi+2] + breath*0.035;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000028;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    vesselCenter.x + Math.sin(elapsed*0.00012)*0.05,
    vesselCenter.y + Math.cos(elapsed*0.00010)*0.06,
    vesselCenter.z
  );

  warmL.intensity = 0.012 + Math.sin(elapsed*0.00008)*0.003;
  glowV.intensity = 0.006 + Math.sin(elapsed*0.00009)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
