<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jur · spider web scan</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">jur · spider web scan</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 0, 35);

// generate sparse 3D web graph
// anchor nodes: clustered + scattered
const anchorCount = 280;
const anchors = [];
const anchorVels = [];

// main cluster zones (2-3 dense knots)
const clusters = [
  { pos: new THREE.Vector3(-8, 4, -5), radius: 4.5, count: 80 },
  { pos: new THREE.Vector3(6, -3, 2), radius: 5.0, count: 85 },
  { pos: new THREE.Vector3(-2, 8, -8), radius: 3.5, count: 60 }
];

let idx = 0;
clusters.forEach(c => {
  for (let i = 0; i < c.count; i++){
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const r = Math.pow(Math.random(), 0.6) * c.radius;
    const p = new THREE.Vector3(
      c.pos.x + r * Math.sin(phi) * Math.cos(theta),
      c.pos.y + r * Math.sin(phi) * Math.sin(theta),
      c.pos.z + r * Math.cos(phi)
    );
    anchors.push(p);
    anchorVels.push(new THREE.Vector3(
      (Math.random()-0.5)*0.002,
      (Math.random()-0.5)*0.002,
      (Math.random()-0.5)*0.002
    ));
    idx++;
  }
});

// scattered peripheral nodes
while (anchors.length < anchorCount){
  anchors.push(new THREE.Vector3(
    (Math.random()-0.5) * 30,
    (Math.random()-0.5) * 30,
    (Math.random()-0.5) * 30
  ));
  anchorVels.push(new THREE.Vector3(
    (Math.random()-0.5)*0.001,
    (Math.random()-0.5)*0.001,
    (Math.random()-0.5)*0.001
  ));
}

// build edge graph: nearest neighbors + long-range guy-lines
const edges = [];
const maxLocal = 4;
const maxLongRange = 3;

function dist(a, b){ return a.distanceTo(b); }

anchors.forEach((a, i) => {
  // find nearest neighbors
  const dists = anchors.map((b, j) => ({ j, d: i===j ? Infinity : dist(a, b) }));
  dists.sort((x, y) => x.d - y.d);
  
  // local connections
  const localCount = 2 + Math.floor(Math.random() * (maxLocal - 1));
  for (let k = 0; k < Math.min(localCount, dists.length); k++){
    const j = dists[k].j;
    if (j > i && Math.random() < 0.85){ // avoid duplicate edges
      edges.push([i, j, dists[k].d]);
    }
  }
  
  // occasional long-range thread
  if (Math.random() < 0.12){
    const farIdx = Math.floor(Math.random() * anchors.length);
    if (farIdx !== i && dist(a, anchors[farIdx]) > 12){
      edges.push([i, farIdx, dist(a, anchors[farIdx])]);
    }
  }
});

// render threads as additive lines
const threadGeom = new THREE.BufferGeometry();
const threadPos = new Float32Array(edges.length * 6);
edges.forEach((e, i) => {
  const [a, b] = [anchors[e[0]], anchors[e[1]]];
  threadPos[i*6]   = a.x; threadPos[i*6+1] = a.y; threadPos[i*6+2] = a.z;
  threadPos[i*6+3] = b.x; threadPos[i*6+4] = b.y; threadPos[i*6+5] = b.z;
});
threadGeom.setAttribute('position', new THREE.BufferAttribute(threadPos, 3));

const threadMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    varying float vLen;
    void main(){
      vec3 p = position;
      // subtle fiber shimmer
      float phase = uTime * 0.3 + p.x * 0.4 + p.y * 0.3;
      p += vec3(sin(phase)*0.02, cos(phase*1.1)*0.02, sin(phase*0.8)*0.02);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      vLen = length(p);
    }
  `,
  fragmentShader: `
    varying float vLen;
    void main(){
      // faint pearlescent silver
      vec3 col = vec3(0.78, 0.82, 0.88);
      float a = 0.16;
      // depth fog
      float fog = exp(-vLen * 0.025);
      gl_FragColor = vec4(col * fog, a * fog);
    }
  `
});

const threadLines = new THREE.LineSegments(threadGeom, threadMat);
scene.add(threadLines);

// render anchor nodes as tiny sprites
const nodeGeom = new THREE.BufferGeometry();
const nodePos = new Float32Array(anchors.length * 3);
anchors.forEach((a, i) => {
  nodePos[i*3] = a.x; nodePos[i*3+1] = a.y; nodePos[i*3+2] = a.z;
});
nodeGeom.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));

const nodeMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uPixel;
    varying float vDist;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDist = -mv.z;
      gl_PointSize = uPixel * (45.0 / vDist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDist;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0);
      vec3 col = vec3(0.88, 0.92, 0.98);
      float fog = exp(-vDist * 0.03);
      gl_FragColor = vec4(col * fog, a * fog * 0.7);
    }
  `
});

const nodePoints = new THREE.Points(nodeGeom, nodeMat);
scene.add(nodePoints);

// wind field + spring relaxation
const restPos = anchors.map(a => a.clone());
const damping = 0.92;
const springK = 0.008;
const windPhase = Math.random() * 100;

function updateAnchors(t){
  anchors.forEach((a, i) => {
    const rest = restPos[i];
    const vel = anchorVels[i];
    
    // spring back to rest
    const dx = rest.x - a.x;
    const dy = rest.y - a.y;
    const dz = rest.z - a.z;
    vel.x += dx * springK;
    vel.y += dy * springK;
    vel.z += dz * springK;
    
    // wind (slow low-frequency)
    const wx = Math.sin(t * 0.4 + windPhase + i * 0.1) * 0.0008;
    const wy = Math.cos(t * 0.3 + windPhase + i * 0.15) * 0.0006;
    const wz = Math.sin(t * 0.35 + windPhase + i * 0.12) * 0.0007;
    vel.x += wx;
    vel.y += wy;
    vel.z += wz;
    
    vel.multiplyScalar(damping);
    a.add(vel);
  });
  
  // update geometry
  anchors.forEach((a, i) => {
    nodePos[i*3] = a.x; nodePos[i*3+1] = a.y; nodePos[i*3+2] = a.z;
  });
  nodeGeom.attributes.position.needsUpdate = true;
  
  edges.forEach((e, i) => {
    const [a, b] = [anchors[e[0]], anchors[e[1]]];
    threadPos[i*6]   = a.x; threadPos[i*6+1] = a.y; threadPos[i*6+2] = a.z;
    threadPos[i*6+3] = b.x; threadPos[i*6+4] = b.y; threadPos[i*6+5] = b.z;
  });
  threadGeom.attributes.position.needsUpdate = true;
}

// camera dolly path (slow walk-through)
const camPath = [
  new THREE.Vector3(0, 0, 35),
  new THREE.Vector3(-4, 2, 28),
  new THREE.Vector3(3, -2, 22),
  new THREE.Vector3(-2, 5, 16),
  new THREE.Vector3(0, 0, 12)
];
const lookPath = [
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(-6, 3, -3),
  new THREE.Vector3(4, -2, 0),
  new THREE.Vector3(-2, 6, -5),
  new THREE.Vector3(0, 0, -8)
];

function lerpVec(a, b, t){
  return new THREE.Vector3().lerpVectors(a, b, t);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let startTime = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - startTime) / 1000;
  
  updateAnchors(t);
  
  threadMat.uniforms.uTime.value = t;
  nodeMat.uniforms.uTime.value = t;
  
  // camera dolly (60s cycle)
  const cycle = (t % 60) / 60;
  const seg = Math.floor(cycle * (camPath.length - 1));
  const local = (cycle * (camPath.length - 1)) % 1;
  const nextSeg = Math.min(seg + 1, camPath.length - 1);
  
  const pos = lerpVec(camPath[seg], camPath[nextSeg], local);
  const look = lerpVec(lookPath[seg], lookPath[nextSeg], local);
  camera.position.copy(pos);
  camera.lookAt(look);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
