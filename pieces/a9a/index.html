<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>a9a · Shiota — arterial cathedral</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">a9a</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.018);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080202, 0.4));

// Single warm point light — Eliasson: darkness is the primary material
const pL = new THREE.PointLight(0xffd8c0, 0.55, 50, 1.8);
pL.position.set(3.0, 7.5, -2.0);
scene.add(pL);

let seed = 83712649;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── THE SUSPENDED SPHERE — cottony pale moon, still center of the circulatory cosmos
const sphereRadius = 2.6;
const spherePos = new THREE.Vector3(2.8, 0.6, -2.0);

const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0,
  emissive: 0xf2ebe0,
  emissiveIntensity: 0.65,
  roughness: 0.95,
  metalness: 0.0,
  transparent: true,
  opacity: 0.82
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── ROOM — architectural volume, walk-in scale
const ROOM = { w: 38, h: 26, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron projected into room + organic scatter
const NUM_ANCHORS = 1400;
const anchors = [];

// Icosahedral base anchors (Manfred Mohr — geometry generates topology)
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  const scale = 8.5;
  const p = new THREE.Vector3(v[0]*scale + spherePos.x, v[1]*scale*0.7 + spherePos.y, v[2]*scale + spherePos.z);
  anchors.push(p);
}

// Suspension anchors — ceiling to sphere
const suspAnchors = [];
for(let i=0; i<8; i++){
  const x = spherePos.x + (rng()-0.5)*3.2;
  const z = spherePos.z + (rng()-0.5)*3.2;
  const p = new THREE.Vector3(x, hh, z);
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [];
for(let i=0; i<3; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*12,
      spherePos.y + (rng()-0.5)*8,
      spherePos.z + (rng()-0.5)*12
    ),
    r: 2.0 + rng()*1.8
  });
}

function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense shell around sphere
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.48){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereRadius + 0.6 + rng()*7.0;
    p = spherePos.clone().add(dir.multiplyScalar(dist));
  } else if(r < 0.72){
    p = wallPt();
    p.lerp(spherePos, 0.2 + rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereRadius));
}

// ── Radial quantization (Vera Molnar) — threads near sphere snap to angular increments
function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 10) return p; // far threads stay free
  const strength = Math.max(0, 1 - d/10);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snapAngle = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snapAngle) * snapAngle;
  const blended = theta + (snapped - theta) * strength * 0.6;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Suspension threads — physically legible hanging (Saraceno)
suspAnchors.forEach(sa => {
  for(let j=0; j<3; j++){
    const target = sphereSurf();
    target.y = Math.max(target.y, spherePos.y + sphereRadius*0.6);
    setLine(sa, target);
  }
});

// Cat A: threads converging on sphere (44%) — circulatory vessel network
const catA = Math.floor(NUM_LINES * 0.44);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  // 10% stop short — threads that fail to reach (Quayola)
  if(rng() < 0.10){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    const gap = 0.4 + rng()*1.4;
    target.add(dir.multiplyScalar(gap));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: wall-to-wall threads (26%) — architectural tension
const catB = Math.floor(NUM_LINES * 0.26);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 14 && rng() > 0.06){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat C: dendritic branching filaments — short Y-forking chains (Entangled Others)
const catCstart = li;
while(li < NUM_LINES - 200){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  // Find nearby anchor
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < 5.5){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Branch: fork at midpoint (1-2 generations)
  if(rng() < 0.3 && li < NUM_LINES){
    const mid = a.clone().lerp(best, 0.4 + rng()*0.2);
    const branchDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branchEnd = mid.clone().add(branchDir.multiplyScalar(1.2 + rng()*2.5));
    if(!inVoid(branchEnd)) setLine(mid, branchEnd);
  }
}

// Fill remaining with short sphere-converging threads
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)) setLine(a, sphereSurf());
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, stones, memory detritus
const NUM_FRAGS = 28;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.16;
  const geo = rng()>0.6
    ? new THREE.BoxGeometry(sz*(2.0+rng()*2.0), sz*0.015, sz*(0.8+rng()*1.2))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.03;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.35, d*0.25),
    transparent: true,
    opacity: 0.3 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = 0.2 + rng()*0.6;
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — asymmetric interior dolly weaving through the web
const pathLen = 320;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;

  // Figure-8-ish interior path — viewer always INSIDE the web
  const x = spherePos.x + Math.sin(p)*7.0 + Math.sin(p*1.3+0.8)*3.5;
  const y = spherePos.y + 1.2 + Math.sin(p*0.6+1.5)*3.8 + Math.cos(p*0.35)*1.8;
  const z = spherePos.z + Math.cos(p)*9.0 + Math.cos(p*0.7+2.1)*2.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Micro-breathing — imperceptible anchor jitter (<0.4% thread length variation)
  const arr = lineGeo.attributes.position.array;
  const bAmp = 0.004;
  const bFreq = 0.09;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const ph = bx*0.3 + by*0.7 + bz*0.15 + (i/6)*0.006;
    const s = Math.sin(t*bFreq + ph) * bAmp;
    arr[i]   = bx + s*0.7;
    arr[i+1] = by + s*0.5;
    arr[i+2] = bz + s*0.35;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.003;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with slow wander
  const look = spherePos.clone();
  look.x += Math.sin(t*0.011)*0.6;
  look.y += Math.cos(t*0.008)*0.35;
  camera.lookAt(look);

  // Sphere imperceptible pulse
  sphere.position.y = spherePos.y + Math.sin(t*0.01)*0.015;

  // Point light slow wander — subtle shifts in illumination
  pL.position.x = 3.0 + Math.sin(t*0.007)*1.5;
  pL.position.z = -2.0 + Math.cos(t*0.009)*1.2;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
