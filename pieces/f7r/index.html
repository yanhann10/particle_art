<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f7r · cursor flow field</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08090c; overflow:hidden;
               color:#cfd4dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 11px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">f7r · cursor flow field</div>
<div class="hint">move cursor · click to inject</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Full-screen quad GPGPU-lite using ping-pong textures of particle state.
// State stored in pixels of a (W x H) RGBA texture: rg = position, ba = velocity.
// We then render a Points cloud sampling that texture for positions.

const W = 256, H = 256;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08090c, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// Two ping-pong RTs holding particle state (encoded in floats)
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init state texture: positions in [-1,1], zero velocity
const initData = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  initData[i*4]   = (Math.random()*2-1);
  initData[i*4+1] = (Math.random()*2-1);
  initData[i*4+2] = 0; initData[i*4+3] = 0;
}
const initTex = new THREE.DataTexture(initData, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

// blit init → rtA
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor = texture2D(tex, vUv); }`
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat);
const blitScene = new THREE.Scene(); blitScene.add(quad);
renderer.setRenderTarget(rtA); renderer.render(blitScene, camera);
renderer.setRenderTarget(null);

// simulation pass
const simUniforms = {
  prev: { value: rtA.texture },
  uMouse: { value: new THREE.Vector2(0,0) },
  uClick: { value: 0 },
  uTime:  { value: 0 },
  uDt:    { value: 0.016 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform vec2  uMouse;
    uniform float uClick;
    uniform float uTime;
    uniform float uDt;
    varying vec2 vUv;

    vec3 hash3(vec3 p){
      p = vec3(dot(p, vec3(127.1,311.7,74.7)),
               dot(p, vec3(269.5,183.3,246.1)),
               dot(p, vec3(113.5,271.9,124.6)));
      return -1.0 + 2.0*fract(sin(p)*43758.5453123);
    }
    float noise(vec3 p){
      vec3 i=floor(p), f=fract(p);
      vec3 u=f*f*(3.0-2.0*f);
      return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)),
                         dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                     mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),
                         dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                 mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),
                         dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                     mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),
                         dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);
    }
    vec2 curl(vec2 p, float t){
      const float e = 0.05;
      float n1 = noise(vec3(p.x, p.y + e, t));
      float n2 = noise(vec3(p.x, p.y - e, t));
      float n3 = noise(vec3(p.x + e, p.y, t));
      float n4 = noise(vec3(p.x - e, p.y, t));
      return vec2(n1 - n2, -(n3 - n4));
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec2 pos = s.xy;
      vec2 vel = s.zw;

      // curl-noise advection
      vec2 c = curl(pos * 1.6 + vec2(uTime*0.15, 0.0), uTime*0.2);
      vel += c * 0.6 * uDt;

      // mouse repel/attract
      vec2 toMouse = uMouse - pos;
      float dm = length(toMouse) + 0.01;
      vec2 nm = toMouse / dm;
      // attract weakly always; click adds strong outward shove
      vel += nm * 0.15 * uDt / max(dm, 0.05);
      vel -= nm * uClick * 1.4 * uDt / max(dm, 0.05);

      // damping
      vel *= 0.965;
      pos += vel * uDt * 8.0;

      // wrap edges
      if (pos.x >  1.05) pos.x = -1.0;
      if (pos.x < -1.05) pos.x =  1.0;
      if (pos.y >  1.05) pos.y = -1.0;
      if (pos.y < -1.05) pos.y =  1.0;

      gl_FragColor = vec4(pos, vel);
    }
  `
});
const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat);
const simScene = new THREE.Scene(); simScene.add(simQuad);

// render points sampling state texture
const renderScene = new THREE.Scene();
const renderCam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
renderCam.position.set(0, 0, 2.4);

const pointsGeom = new THREE.BufferGeometry();
const idx = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idx[i*2]   = (x + 0.5) / W;
  idx[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idx, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = vec3(s.xy, 0.0);
      vSpeed = length(s.zw);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + vSpeed * 6.0) * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSpeed;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      // cool steel → hot copper as speed rises
      vec3 a_col = vec3(0.42, 0.62, 0.85);
      vec3 b_col = vec3(0.95, 0.55, 0.30);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.6, vSpeed));
      gl_FragColor = vec4(col * a * (0.5 + vSpeed*1.3), a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
renderScene.add(points);

addEventListener('resize', () => {
  renderCam.aspect = innerWidth/innerHeight;
  renderCam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer
const mouse = new THREE.Vector2(0,0);
addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * -2 + 1;
});
let click = 0;
addEventListener('pointerdown', () => { click = 1.0; });

let last = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  simUniforms.prev.value = rtA.texture;
  simUniforms.uMouse.value.copy(mouse);
  simUniforms.uClick.value = click;
  simUniforms.uTime.value = now / 1000;
  simUniforms.uDt.value = dt;
  click *= 0.85;

  renderer.setRenderTarget(rtB);
  renderer.render(simScene, camera);
  renderer.setRenderTarget(null);
  // swap
  const tmp = rtA; rtA = rtB; rtB = tmp;

  pointsMat.uniforms.state.value = rtA.texture;
  renderer.render(renderScene, renderCam);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
