<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u8e · Shiota — Red Vessel</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">u8e</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.006));
const key1 = new THREE.PointLight(0x180404, 0.012, 28, 2.2);
key1.position.set(-8, 10, 6);
scene.add(key1);

const key2 = new THREE.PointLight(0x0e0303, 0.007, 24, 2.0);
key2.position.set(6, -5, -8);
scene.add(key2);

let seed = 892471;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 34, h: 20, d: 30 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED SPHERE — off-white cottony center
const spherePos = new THREE.Vector3(1.2, 0.4, -0.8);
const sphereGeo = new THREE.SphereGeometry(2.2, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xe8dfd0,
  emissive: 0xc8b8a0,
  emissiveIntensity: 0.65,
  roughness: 0.88,
  metalness: 0.08
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0x1a0404, 0.009, 10, 2.4);
sphereGlow.position.copy(spherePos);
scene.add(sphereGlow);

// SPHERE SURFACE ANCHORS — spiral distribution
const sphereAnchors = [];
const fibCount = 180;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

for(let i=0; i<fibCount; i++){
  const y = 1 - (i / (fibCount - 1)) * 2;
  const radius = Math.sqrt(1 - y * y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const pt = new THREE.Vector3(x, y, z).multiplyScalar(2.2).add(spherePos);
  sphereAnchors.push(pt);
}

// WALL ANCHORS
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<140; i++) anchors.push(wallPt());

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to sphere top
const suspCount = 16;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2 + 0.1;
  const r = 0.48 + (i%4)*0.12;
  const x = spherePos.x + Math.cos(angle)*r;
  const z = spherePos.z + Math.sin(angle)*r*0.72;
  const sp = new THREE.Vector3(x, spherePos.y + 2.2, z);
  
  const ceilX = sp.x + (rng()-0.5)*1.8;
  const ceilZ = sp.z + (rng()-0.5)*1.6;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sp);
}

// CONVERGENCE THREADS — wall to sphere (blood vessels converging on the heart)
const convergeBudget = 10200;
for(let i=0; i<convergeBudget && li<NUM_LINES-9800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(spherePos);
  if(dSphere < 3.2) continue;
  
  let closest = sphereAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<6; k++){
    const candidate = sphereAnchors[Math.floor(rng()*sphereAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 18% stop short — threads that fail to reach the surface
  if(rng()<0.18){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.35 + rng()*0.52);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// RADIATING THREADS FROM SPHERE
for(let i=0; i<920 && li<NUM_LINES-8000; i++){
  const sa = sphereAnchors[Math.floor(rng()*sphereAnchors.length)];
  const dir = sa.clone().sub(spherePos).normalize();
  dir.x += (rng()-0.5)*0.82;
  dir.y += (rng()-0.5)*0.76;
  dir.z += (rng()-0.5)*0.82;
  dir.normalize();
  const len = 4.2 + rng()*11.8;
  const end = sa.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(sa, end);
  }
}

// PROXIMITY WEB — anchor to anchor
const THRESH = 8.8;
let webCount = 0, attempts = 0;
while(webCount<4800 && li<NUM_LINES-3800 && attempts<24000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>2.0 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// DENDRITIC BRANCHES near sphere — Y-forking vascular growth
for(let i=0; i<280 && li<NUM_LINES-2400; i++){
  const startDist = 5.2 + rng()*8.6;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.76;
  const start = spherePos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*1.8,
    (rng()-0.5)*1.5,
    (rng()-0.5)*1.8
  ).normalize();
  
  const segLen = 1.6 + rng()*1.2;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-22 && rng()<0.72){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.68 + rng()*0.76
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.78));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-20 && rng()<0.58){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.68 - rng()*0.76
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.74));
      setLine(p1, p2b);
      
      if(li<NUM_LINES-18 && rng()<0.36){
        const fork3 = fork1.clone().applyAxisAngle(
          new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
          0.62 + rng()*0.64
        ).normalize();
        const p3 = p2a.clone().add(fork3.multiplyScalar(segLen*0.62));
        setLine(p2a, p3);
      }
    }
  }
}

// HORIZONTAL CROSSING THREADS
for(let i=0; i<480 && li<NUM_LINES-1400; i++){
  const y = spherePos.y + (rng()-0.5)*7.6;
  const x1 = -hw + rng()*4.2;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  const x2 = hw - rng()*4.2;
  const z2 = (rng()-0.5)*ROOM.d*0.90;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS
for(let i=0; i<320 && li<NUM_LINES-900; i++){
  const x = (rng()-0.5)*ROOM.w*0.88;
  const z = (rng()-0.5)*ROOM.d*0.88;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.2, hh, z + (rng()-0.5)*1.2);
  setLine(a, b);
}

// WALL-TO-WALL SPANS
let wallSpans = 0;
while(wallSpans<1400 && li<NUM_LINES-400){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>7.5 && d<20.0){
    setLine(a, b);
    wallSpans++;
  }
}

// FILL remaining with long-range connections
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>8.5 && d<18.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.082,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — spiraling inward through the lattice toward the sphere
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.28){
    const lt = t/0.28;
    const angle = Math.PI*0.15 + lt*Math.PI*0.75;
    const r = 16.5 - lt*5.8;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 7.2 - lt*4.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.56){
    const lt = (t-0.28)/0.28;
    const angle = Math.PI*0.90 + lt*Math.PI*1.15;
    const r = 10.7 + Math.sin(lt*Math.PI*1.5)*1.4;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 0.6 + Math.cos(lt*Math.PI*1.7)*1.2;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.56)/0.22;
    const angle = Math.PI*2.05 + lt*Math.PI*0.85;
    const r = 9.2 + Math.cos(lt*Math.PI)*1.6;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y - 0.8 - lt*6.4;
    z = spherePos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*2.90 + lt*Math.PI*0.65;
    const r = 8.8 + lt*7.0;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 2.6 + lt*4.8;
    z = spherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath on threads
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<Math.min(li, 7000); i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.018 + basePositions[idx+1]*0.024 + i*0.000048;
    const breath = Math.sin(elapsed*0.00032 + phase)*0.000010;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.010;
      arr[vi+1] = basePositions[vi+1] + breath*0.009;
      arr[vi+2] = basePositions[vi+2] + breath*0.011;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere subtle pulse
  const pulse = 1.0 + Math.sin(elapsed*0.000042)*0.008;
  sphere.scale.setScalar(pulse);

  // Camera dolly
  const speed = 0.000012;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    spherePos.x + Math.sin(elapsed*0.000064)*0.18,
    spherePos.y + Math.cos(elapsed*0.000052)*0.14,
    spherePos.z + Math.sin(elapsed*0.000044)*0.12
  );

  key1.intensity = 0.012 + Math.sin(elapsed*0.000046)*0.0038;
  sphereGlow.intensity = 0.009 + Math.sin(elapsed*0.000056)*0.0032;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
