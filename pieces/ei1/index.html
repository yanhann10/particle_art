<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ei1 · vase spiral dispersion · point-cloud interaction</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">ei1</div>
<div class="hint">move pointer to disperse · particles spiral outward from axis</div>

<!-- MOTION: spiral, intensity: gentle -->

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Vase-shaped point cloud that spirals outward when pointer moves.
// At rest: recognizable vessel form (amphora / ceramic vase).
// On input: particles spiral around vertical axis while dispersing radially.
// Inspired by Antony Gormley's disaggregated body-clouds and the Persian
// ceramics tradition where vessel surface is subdivided into rotating bands.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xe8dcc8, 1.2);
lightKey.position.set(5, 8, 6);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x1a1520, 0.6));
const lightFill = new THREE.PointLight(0x4a5a7a, 0.5, 30);
lightFill.position.set(-4, 3, -3);
scene.add(lightFill);

// ─────────── vase point cloud (amphora profile)
const N = 3200;
const particles = [];
const vaseProfile = [
  { r: 0.4, y: 0.0 },     // base
  { r: 1.2, y: 0.8 },     // belly
  { r: 1.4, y: 2.0 },     // widest
  { r: 1.15, y: 3.2 },    // shoulder
  { r: 0.85, y: 4.0 },    // neck
  { r: 1.0, y: 4.6 },     // lip flare
  { r: 0.9, y: 5.0 },     // rim
];

function getRadius(yVal) {
  for (let i = 0; i < vaseProfile.length - 1; i++) {
    const p0 = vaseProfile[i], p1 = vaseProfile[i + 1];
    if (yVal >= p0.y && yVal <= p1.y) {
      const t = (yVal - p0.y) / (p1.y - p0.y);
      return p0.r + (p1.r - p0.r) * t;
    }
  }
  return vaseProfile[0].r;
}

for (let i = 0; i < N; i++) {
  const yBase = Math.random() * 5.0;
  const radius = getRadius(yBase);
  const theta = Math.random() * Math.PI * 2;
  const rVar = radius + (Math.random() - 0.5) * 0.15;
  const xBase = Math.cos(theta) * rVar;
  const zBase = Math.sin(theta) * rVar;
  
  particles.push({
    xBase, yBase, zBase,
    x: xBase, y: yBase, z: zBase,
    theta: theta,
    radiusBase: rVar,
    dispersionPhase: Math.random() * Math.PI * 2,
  });
}

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);

for (let i = 0; i < N; i++) {
  positions[i * 3] = particles[i].x;
  positions[i * 3 + 1] = particles[i].y;
  positions[i * 3 + 2] = particles[i].z;
  
  const yNorm = particles[i].yBase / 5.0;
  const warm = new THREE.Color(0xd4b896);
  const cool = new THREE.Color(0x7a8ca0);
  const col = warm.clone().lerp(cool, yNorm * 0.6);
  colors[i * 3] = col.r;
  colors[i * 3 + 1] = col.g;
  colors[i * 3 + 2] = col.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

const pointCloud = new THREE.Points(geometry, material);
scene.add(pointCloud);

// ─────────── spiral dispersion on pointer input
let mouseX = 0, mouseY = 0;
let targetMouseX = 0, targetMouseY = 0;

addEventListener('mousemove', (e) => {
  targetMouseX = (e.clientX / innerWidth) * 2 - 1;
  targetMouseY = -(e.clientY / innerHeight) * 2 + 1;
});

addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    targetMouseX = (e.touches[0].clientX / innerWidth) * 2 - 1;
    targetMouseY = -(e.touches[0].clientY / innerHeight) * 2 + 1;
  }
}, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  
  mouseX += (targetMouseX - mouseX) * 0.08;
  mouseY += (targetMouseY - mouseY) * 0.08;
  
  const inputMag = Math.sqrt(mouseX * mouseX + mouseY * mouseY);
  const dispersionAmount = Math.min(inputMag * 2.2, 1.0);
  
  for (let i = 0; i < N; i++) {
    const p = particles[i];
    
    // spiral parameters
    const spiralSpeed = 1.8 + Math.sin(p.dispersionPhase) * 0.6;
    const spiralAngle = p.theta + dispersionAmount * spiralSpeed * Math.PI * 2;
    const radialExpansion = dispersionAmount * (2.5 + Math.sin(p.dispersionPhase + t * 0.3) * 0.8);
    
    const targetRadius = p.radiusBase + radialExpansion;
    const targetX = Math.cos(spiralAngle) * targetRadius;
    const targetZ = Math.sin(spiralAngle) * targetRadius;
    const targetY = p.yBase + dispersionAmount * Math.sin(p.dispersionPhase + t * 0.5) * 1.2;
    
    p.x += (targetX - p.x) * 0.06;
    p.y += (targetY - p.y) * 0.06;
    p.z += (targetZ - p.z) * 0.06;
    
    positions[i * 3] = p.x;
    positions[i * 3 + 1] = p.y;
    positions[i * 3 + 2] = p.z;
  }
  
  geometry.attributes.position.needsUpdate = true;
  
  const yMean = particles.reduce((sum, p) => sum + p.y, 0) / N;
  camera.position.y += (yMean - 0.5 - camera.position.y) * 0.03;
  
  pointCloud.rotation.y = t * 0.08;
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
