<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<!-- Dadras attractor: double-wing shape.
     150k THREE.Points, AdditiveBlending.
     Palette: salmon-rose (#e06050), varies by z-height (darker at bottom, brighter at top).
     Pure mathematical beauty — no UI labels beyond the ID tag. -->
<title>i0y · dadras attractor</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">i0y · dadras attractor</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Dadras system ─────────────────────────────────────────────────────────────
// dx/dt = y - p*x + q*y*z
// dy/dt = r*y - x*z + z
// dz/dt = c*x*y - e*z
// p=3, q=2.7, r=1.7, c=2, e=9, dt=0.01
// Produces a distinctive double-wing shape (butterfly-like but asymmetric).

const N  = 150000;
const DT = 0.003;   // smaller step: Dadras can diverge at dt=0.01
const P = 3, Q = 2.7, R = 1.7, C = 2, E = 9;

// ── Integrate 150k particles along the attractor trajectory ──────────────────
const positions = new Float32Array(N * 3);
const colors    = new Float32Array(N * 3);

// Warm-up: run 10000 steps to settle onto the attractor manifold
let x = 1.0, y = -2.0, z = 1.5;
for (let i = 0; i < 10000; i++) {
  const dx = y - P*x + Q*y*z;
  const dy = R*y - x*z + z;
  const dz = C*x*y - E*z;
  x += dx * DT;  y += dy * DT;  z += dz * DT;
  // Safety: reset if diverging
  if (!isFinite(x) || Math.abs(x) > 100) { x=1.0; y=-2.0; z=1.5; }
}

// Collect trajectory with NaN guard
const traj = new Float32Array(N * 3);
let validN = 0;
for (let i = 0; i < N; i++) {
  const dx = y - P*x + Q*y*z;
  const dy = R*y - x*z + z;
  const dz = C*x*y - E*z;
  const nx = x + dx*DT, ny = y + dy*DT, nz = z + dz*DT;
  if (isFinite(nx) && isFinite(ny) && isFinite(nz) &&
      Math.abs(nx) < 50 && Math.abs(ny) < 50 && Math.abs(nz) < 50) {
    x = nx; y = ny; z = nz;
    traj[i*3] = x;  traj[i*3+1] = y;  traj[i*3+2] = z;
    validN++;
  } else {
    // Reset to attractor neighborhood
    x = 1.0 + (Math.random()-0.5)*0.5;
    y = -2.0 + (Math.random()-0.5)*0.5;
    z = 1.5 + (Math.random()-0.5)*0.5;
    traj[i*3] = x;  traj[i*3+1] = y;  traj[i*3+2] = z;
  }
}

// Compute z range for color mapping
let zMin = Infinity, zMax = -Infinity;
for (let i = 0; i < N; i++) {
  if (isFinite(traj[i*3+2]) && traj[i*3+2] < zMin) zMin = traj[i*3+2];
  if (isFinite(traj[i*3+2]) && traj[i*3+2] > zMax) zMax = traj[i*3+2];
}
const zRange = zMax - zMin || 1.0;

// Center + color by z
let cx = 0, cy = 0, cz = 0;
for (let i = 0; i < N; i++) { cx += traj[i*3]; cy += traj[i*3+1]; cz += traj[i*3+2]; }
cx /= N; cy /= N; cz /= N;

for (let i = 0; i < N; i++) {
  positions[i*3]   = traj[i*3]   - cx;
  positions[i*3+1] = traj[i*3+1] - cy;
  positions[i*3+2] = traj[i*3+2] - cz;

  // z-based brightness: salmon-rose base (#e06050 = 0.878, 0.376, 0.314)
  // bottom (zMin) → dark (×0.25), top (zMax) → full brightness (×1.0)
  const tz = (traj[i*3+2] - zMin) / zRange;  // 0 at bottom, 1 at top
  const bright = 0.22 + 0.78 * tz;
  colors[i*3]   = 0.878 * bright;
  colors[i*3+1] = 0.376 * bright;
  colors[i*3+2] = 0.314 * bright;
}

// ── Three.js scene ────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.01, 500);
camera.position.set(0, 4, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.4;

// Points geometry
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size:         0.10,
  vertexColors: true,
  blending:     THREE.AdditiveBlending,
  transparent:  true,
  depthWrite:   false,
  sizeAttenuation: true
});

scene.add(new THREE.Points(geo, mat));

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
