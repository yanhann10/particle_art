<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>g6a · Shiota — Letters Never Sent</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">g6a</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0028);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 250);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.008));
const pL = new THREE.PointLight(0xffc898, 0.028, 45, 1.9);
pL.position.set(3, 16, -2);
scene.add(pL);

let seed = 41928367;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

const ROOM = { w:32, h:28, d:36 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

// ── THE SPHERE — a letter folded and refolded until it became stone.
// Shiota: "The things we cannot say become objects."
const sphereCenter = new THREE.Vector3(0.6, 0.8, -0.5);
const sphereR = 1.6;

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xede4d2, emissive: 0xddd0b8, emissiveIntensity: 0.6,
    roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.28
  })
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner glow — the words still warm inside
const inner = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.3, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xfaf0dc, transparent: true, opacity: 0.035 })
);
inner.position.copy(sphereCenter);
scene.add(inner);

// ── Suspension lines — 8 threads from ceiling
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.4;
  const topR = 0.3 + rng()*1.2;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*topR, hh, sphereCenter.z + Math.sin(a)*topR,
    sphereCenter.x + Math.cos(a)*0.03, sphereCenter.y + sphereR - 0.05, sphereCenter.z + Math.sin(a)*0.03
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x060101, transparent: true, opacity: 0.45
})));

function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR*0.9,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ANCHORS — concentric ellipsoidal shells, vertically stretched
// Letters stack upward; the web is a column more than a sphere
const anchors = [];
const shellRadii = [2.8, 5.0, 8.0, 11.5, 15.5];
for(const sr of shellRadii){
  const count = Math.floor(10 + sr*2.2);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.82+rng()*0.36);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r*0.85,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*1.15,
      sphereCenter.z + Math.cos(v)*r*0.9
    ));
  }
}
// Wall anchors
for(let i = anchors.length; i < 350; i++){
  const wp = wallPt();
  anchors.push(rng()<0.15 ? wp : wp.lerp(sphereCenter, rng()*0.08));
}

// Void columns — vertical negative space, like gaps between sentences
const voids = [
  { pos: new THREE.Vector3(-4.5, 0, 5.5), r:2.2 },
  { pos: new THREE.Vector3(6, -2, -3), r:1.8 },
  { pos: new THREE.Vector3(1, 6, -8), r:2.5 }
];
function inVoid(p){
  for(const v of voids){
    const dx=p.x-v.pos.x, dz=p.z-v.pos.z;
    if(Math.sqrt(dx*dx+dz*dz)<v.r) return true;
  }
  return false;
}

// ── BUILD THREADS
const NUM_LINES = 14000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: REACHING — 50% of threads stretch toward the sphere
// Each thread is a sentence begun and sometimes abandoned
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.5){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  let target = sphereSurf();

  // 18% stop short — the letter written but never mailed,
  // the word on the tip of the tongue that dissolves
  if(rng() < 0.18){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3 + rng()*1.8;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: KINSHIP — anchor-to-anchor within proximity threshold
// The lateral bonds: letters that reply to each other across distance
const THRESH = 5.0;
const catBtarget = Math.floor(NUM_LINES * 0.28);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 50000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// BRANCHING CHAINS — short dendritic threads radiating outward
// like postscripts trailing off the page
for(let i = 0; i < 120 && li < NUM_LINES; i++){
  let pt = sphereSurf();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 2 + Math.floor(rng()*3);
  let prevDir = radial.clone();
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.3 + rng()*0.7;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.6, (rng()-0.5)*0.4, (rng()-0.5)*0.6
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    if(!inVoid(next)) setLine(pt, next, 2);
    // Fork
    if(rng() < 0.35 && li < NUM_LINES){
      const mid = pt.clone().lerp(next, 0.5);
      const fDir = dir.clone().add(new THREE.Vector3(
        (rng()-0.5)*1.6, (rng()-0.5)*1.2, (rng()-0.5)*1.6
      )).normalize();
      const fEnd = mid.clone().add(fDir.multiplyScalar(0.2+rng()*0.45));
      if(!inVoid(fEnd)) setLine(mid, fEnd, 2);
    }
    pt = next;
    prevDir = dir;
  }
}

// Fill remaining: long architectural spans — the room's skeleton
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.12 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color with opacity differentiation
const catOpacity = [0.08, 0.045, 0.06, 0.018];
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.018;
  const bright = op / 0.08;
  // Threads nearer center are slightly more saturated
  const distFade = Math.max(0.45, 1.0 - lineDist[i]*0.018);
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright * distFade;
    colors[i*6+v*3+1] = bG * bright * distFade;
    colors[i*6+v*3+2] = bB * bright * distFade * 0.8;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — scraps of paper, ink-stained,
// caught in the web like insects in amber.
// Each one a letter that got stuck on the way.
const NUM_FRAGMENTS = 18;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.02 + rng()*0.055;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.4+rng()*0.7);
  const h = sz*(0.5+rng()*0.9);
  const verts = new Float32Array([
    w*(-0.4+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.08,
    -w*0.5, h*(-0.2+rng()*0.1), (rng()-0.5)*sz*0.08,
    w*(0.1-rng()*0.3), -h*0.5, (rng()-0.5)*sz*0.08,
    w*(-0.4+rng()*0.2), h*0.5, (rng()-0.5)*sz*0.08,
    w*(0.25+rng()*0.12), h*(rng()*0.04), (rng()-0.5)*sz*0.08,
    w*(0.1-rng()*0.3), -h*0.5, (rng()-0.5)*sz*0.08
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.004 + rng()*0.01;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.025, d*0.008),
    transparent: true,
    opacity: 0.1 + rng()*0.2,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  if(rng()<0.65){
    const si = Math.floor(rng()*li)*6;
    const t = 0.2+rng()*0.6;
    frag.position.set(
      basePositions[si]*(1-t)+basePositions[si+3]*t,
      basePositions[si+1]*(1-t)+basePositions[si+4]*t,
      basePositions[si+2]*(1-t)+basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.5+rng()*4.5));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA — narrative of suspension
// The camera inhabits the web as a held breath.
// Phase 1: Close to the sphere, slightly below — reading distance.
//          The threads above are a dark sky of ink lines.
// Phase 2: Slow vertical ascent — rising through layers of the web
//          like turning pages. Threads pass across the lens.
// Phase 3: Above the sphere, looking down — the whole network
//          radiates below like a city seen from a departing plane.
// Phase 4: Gentle descent and return — gravity wins, the letter
//          settles back into the pile. The reading begins again.
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y, xOff=0, zOff=0;
  if(t < 0.25){
    // Phase 1: intimate — just outside the densest threads
    const lt = t/0.25;
    rH = 2.8 + lt*0.8;
    y = cy - 1.2 + lt*0.6;
    xOff = Math.sin(lt*Math.PI*0.4)*0.5;
  } else if(t < 0.5){
    // Phase 2: ascending — rising through the web like smoke
    const lt = (t-0.25)/0.25;
    rH = 3.6 + lt*3.0;
    y = cy - 0.6 + lt*5.5;
    xOff = Math.sin(lt*Math.PI)*1.5;
    zOff = Math.cos(lt*Math.PI*0.6)*0.8;
  } else if(t < 0.75){
    // Phase 3: overhead — looking down through the canopy
    const lt = (t-0.5)/0.25;
    rH = 6.6 - lt*1.5;
    y = cy + 4.9 - lt*2.0;
    xOff = Math.cos(lt*Math.PI)*0.6;
    zOff = Math.sin(lt*Math.PI*0.8)*1.0;
  } else {
    // Phase 4: descent — returning, the letter unsent again
    const lt = (t-0.75)/0.25;
    rH = 5.1 - lt*2.3;
    y = cy + 2.9 - lt*4.1;
    zOff = Math.sin(lt*Math.PI*0.5)*0.4;
  }

  const x = cx + Math.sin(p*1.05)*rH + xOff;
  const z = cz + Math.cos(p*1.05)*(rH*0.95) + zOff;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — imperceptible tremor,
  // the paper stirring when a door opens in another room
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00008 * Math.max(0, 1.0-dist/16.0);
    const phase = basePositions[idx]*0.08 + basePositions[idx+1]*0.1 + i*0.0003;
    const breath = Math.sin(elapsed*0.004+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.1;
      arr[vi+2] = basePositions[vi+2] + breath*0.16;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — suspended, contemplative
  const speed = 0.00018;
  const pathT = (elapsed*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — but with a slow vertical drift,
  // as if the gaze keeps slipping off the object
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.0006)*0.03;
  look.y += Math.cos(elapsed*0.00045)*0.25 + 0.08;
  look.z += Math.sin(elapsed*0.0007+0.3)*0.025;
  camera.lookAt(look);

  // Light — barely there, archive darkness
  pL.position.x = 3 + Math.sin(elapsed*0.00025)*0.06;
  pL.position.y = 16 + Math.cos(elapsed*0.00015)*0.03;
  pL.intensity = 0.028 + Math.sin(elapsed*0.00035)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
