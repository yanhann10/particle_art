<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bu5 · Shiota — The Key in the Hand</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">bu5</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.003));
const keyL = new THREE.PointLight(0x1a0606, 0.010, 32, 2.4);
keyL.position.set(-6, 8, 7);
scene.add(keyL);

let seed = 592847;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// SUSPENDED OBJECT — single large key (simplified mesh representation)
const keyPos = new THREE.Vector3(1.2, 0.8, 0);
const keyGroup = new THREE.Group();

// Key head (circular)
const headGeo = new THREE.TorusGeometry(0.45, 0.12, 12, 24);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xd4cfc4,
  emissive: 0xc8bfb0,
  emissiveIntensity: 0.42,
  roughness: 0.88,
  metalness: 0.08
});
const keyHead = new THREE.Mesh(headGeo, keyMat);
keyHead.rotation.y = Math.PI/2;
keyGroup.add(keyHead);

// Key shaft
const shaftGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.4, 12);
const keyShaft = new THREE.Mesh(shaftGeo, keyMat);
keyShaft.position.y = -1.2;
keyGroup.add(keyShaft);

// Key teeth (4 small extrusions)
for(let i=0; i<4; i++){
  const toothGeo = new THREE.BoxGeometry(0.16, 0.18, 0.08);
  const tooth = new THREE.Mesh(toothGeo, keyMat);
  tooth.position.set(0.12, -1.8 - i*0.22, 0);
  keyGroup.add(tooth);
}

keyGroup.position.copy(keyPos);
keyGroup.rotation.x = 0.15;
keyGroup.rotation.z = -0.08;
scene.add(keyGroup);

// Key glow
const keyGlow = new THREE.PointLight(0x1a0505, 0.007, 7, 2.6);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// ROOM VOLUME
const ROOM = { w: 26, h: 18, d: 24 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHORS — wall grid + ceiling grid
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.94; z=(rng()-0.5)*ROOM.d*0.94; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.94; z=(rng()-0.5)*ROOM.d*0.94; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.94; z=(rng()-0.5)*ROOM.d*0.94; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.94; z=(rng()-0.5)*ROOM.d*0.94; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.94; y=(rng()-0.5)*ROOM.h*0.94; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.94; y=(rng()-0.5)*ROOM.h*0.94; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<68; i++) anchors.push(wallPt());

// KEY ATTACHMENT POINTS — perimeter around key for thread convergence
const keyPts = [];
const steps = 28;

// Head circle perimeter
for(let i=0; i<steps; i++){
  const theta = (i/steps)*Math.PI*2;
  const r = 0.57;
  keyPts.push(new THREE.Vector3(
    keyPos.x + Math.cos(theta)*r*Math.cos(0.15),
    keyPos.y + Math.sin(theta)*r,
    keyPos.z + Math.cos(theta)*r*Math.sin(0.15)
  ));
}

// Shaft points
for(let i=0; i<14; i++){
  const t = i/14;
  keyPts.push(new THREE.Vector3(
    keyPos.x + 0.08*Math.cos(t*Math.PI*2),
    keyPos.y - 0.1 - t*2.3,
    keyPos.z + 0.08*Math.sin(t*Math.PI*2)
  ));
}

// Teeth tips
for(let i=0; i<4; i++){
  keyPts.push(new THREE.Vector3(
    keyPos.x + 0.20,
    keyPos.y - 1.8 - i*0.22,
    keyPos.z
  ));
}

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to key head (the hanging mechanism)
const ceilingSuspPts = [];
for(let i=0; i<8; i++){
  const angle = (i/8)*Math.PI*2;
  const r = 0.35 + rng()*0.15;
  ceilingSuspPts.push(new THREE.Vector3(
    keyPos.x + Math.cos(angle)*r,
    hh,
    keyPos.z + Math.sin(angle)*r
  ));
}

for(const cp of ceilingSuspPts){
  let closest = keyPts[0];
  let closestD = cp.distanceTo(closest);
  for(let k=0; k<8; k++){
    const kp = keyPts[Math.floor(rng()*keyPts.length)];
    const d = cp.distanceTo(kp);
    if(d < closestD && kp.y > keyPos.y - 0.3){ closestD=d; closest=kp; }
  }
  setLine(cp, closest);
}

// CONVERGENCE THREADS — anchors to key perimeter (circulatory network)
const convergenceBudget = 6200;
for(let i=0; i<convergenceBudget && li<NUM_LINES-13500; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 2.0) continue;
  
  let closest = keyPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<7; k++){
    const candidate = keyPts[Math.floor(rng()*keyPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 12% stop short — the gap
  if(rng()<0.12){
    const shortDir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.40 + rng()*0.50);
    const shortEnd = a.clone().add(shortDir.multiplyScalar(shortLen));
    setLine(a, shortEnd);
  } else {
    setLine(a, closest);
  }
}

// RADIAL THREADS FROM KEY — threads radiating outward
for(let i=0; i<320 && li<NUM_LINES-12800; i++){
  const kp = keyPts[Math.floor(rng()*keyPts.length)];
  const dir = kp.clone().sub(keyPos).normalize();
  dir.x += (rng()-0.5)*0.6;
  dir.y += (rng()-0.5)*0.4;
  dir.z += (rng()-0.5)*0.6;
  dir.normalize();
  const len = 2.2 + rng()*6.5;
  const end = kp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(kp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 5.8;
let webCount = 0, attempts = 0;
while(webCount<4800 && li<NUM_LINES-7800 && attempts<32000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<9; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>1.0 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans (architectural cage)
let wallSpans = 0;
while(wallSpans<1800 && li<NUM_LINES-5800){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>3.8 && d<19.0){
    setLine(a, b);
    wallSpans++;
  }
}

// Y-FORKING DENDRITIC CHAINS near key
for(let i=0; i<220 && li<NUM_LINES-4200; i++){
  const startDist = 2.6 + rng()*6.2;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.7;
  const start = keyPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.2,
    (rng()-0.5)*1.8,
    (rng()-0.5)*2.2
  ).normalize();
  
  const segLen = 0.90 + rng()*0.70;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-14 && rng()<0.70){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.60 + rng()*0.50
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.72));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-12 && rng()<0.52){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.60 - rng()*0.50
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.68));
      setLine(p1, p2b);
      
      if(li<NUM_LINES-10 && rng()<0.32){
        const fork3 = fork1.clone().applyAxisAngle(
          new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
          0.42 + rng()*0.32
        ).normalize();
        const p3 = p2a.clone().add(fork3.multiplyScalar(segLen*0.58));
        setLine(p2a, p3);
      }
    }
  }
}

// HORIZONTAL CROSSING THREADS
for(let i=0; i<280 && li<NUM_LINES-2400; i++){
  const y = keyPos.y + (rng()-0.5)*5.2;
  const x1 = -hw + rng()*3.2;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  const x2 = hw - rng()*3.2;
  const z2 = (rng()-0.5)*ROOM.d*0.90;
  const a = new THREE.Vector3(x1, y, z1);
  const b = new THREE.Vector3(x2, y, z2);
  setLine(a, b);
}

// VERTICAL THREADS — floor to ceiling
for(let i=0; i<160 && li<NUM_LINES-1800; i++){
  const x = (rng()-0.5)*ROOM.w*0.86;
  const z = (rng()-0.5)*ROOM.d*0.86;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*0.8, hh, z + (rng()-0.5)*0.8);
  setLine(a, b);
}

// FILL remaining capacity with sparse long spans
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>4.8 && d<16.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.076,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, orbiting key slowly
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.18){
    // Approach from front-right above
    const lt = t/0.18;
    const angle = Math.PI*0.25 + lt*Math.PI*0.32;
    const r = 10.5 - lt*2.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 5.5 - lt*2.8;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.38){
    // Descend below key, looking up through red lattice
    const lt = (t-0.18)/0.20;
    const angle = Math.PI*0.57 + lt*Math.PI*0.70;
    const r = 7.8 + Math.sin(lt*Math.PI)*1.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - lt*6.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.62){
    // Orbit close on left side, mid-height
    const lt = (t-0.38)/0.24;
    const angle = Math.PI*1.27 + lt*Math.PI*0.82;
    const r = 6.2 + Math.cos(lt*Math.PI*1.8)*0.95;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 0.8 + Math.sin(lt*Math.PI*1.4)*0.65;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, key centered and silhouetted
    const lt = (t-0.62)/0.38;
    const angle = Math.PI*2.09 + lt*Math.PI*0.55;
    const r = 6.5 + lt*5.0;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 2.2 + lt*3.5;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.40%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.018 + basePositions[idx+1]*0.026 + i*0.000048;
    const breath = Math.sin(elapsed*0.00032 + phase)*0.000012;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.011;
      arr[vi+1] = basePositions[vi+1] + breath*0.009;
      arr[vi+2] = basePositions[vi+2] + breath*0.013;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Key subtle rotation
  keyGroup.rotation.y = Math.sin(elapsed*0.000038)*0.009;
  keyGroup.rotation.z = -0.08 + Math.cos(elapsed*0.000028)*0.007;

  // Camera dolly
  const speed = 0.000020;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward key with subtle drift
  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000075)*0.14,
    keyPos.y + Math.cos(elapsed*0.000058)*0.12,
    keyPos.z + Math.sin(elapsed*0.000042)*0.10
  );

  keyL.intensity = 0.010 + Math.sin(elapsed*0.000048)*0.0038;
  keyGlow.intensity = 0.007 + Math.sin(elapsed*0.000065)*0.0028;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
