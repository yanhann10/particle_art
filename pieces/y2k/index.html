<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y2k · cursive binary ribbon</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#faf8f0; overflow:hidden;
               color:#1a1512; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">y2k · cursive binary ribbon</div>
<div class="hint">infinite scroll · glyphs → binary → glyphs · sasha stiles</div>
<div class="src">22k characters · bezier flow · language as particle</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfaf8f0);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ────────────── text atlas: render glyphs + binary to canvas texture
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz01.,;:—()[]{}';
const COLS = 10;
const ROWS = Math.ceil(CHARS.length / COLS);
const GLYPH_SIZE = 64;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = COLS * GLYPH_SIZE;
atlasCanvas.height = ROWS * GLYPH_SIZE;
const ctx = atlasCanvas.getContext('2d');
ctx.fillStyle = '#faf8f0';
ctx.fillRect(0, 0, atlasCanvas.width, atlasCanvas.height);
ctx.fillStyle = '#1a1512';
ctx.font = '42px Georgia, "Times New Roman", serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
for (let i = 0; i < CHARS.length; i++){
  const ch = CHARS[i];
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  ctx.fillText(ch, col * GLYPH_SIZE + GLYPH_SIZE/2, row * GLYPH_SIZE + GLYPH_SIZE/2);
}
const atlasTexture = new THREE.CanvasTexture(atlasCanvas);
atlasTexture.minFilter = THREE.LinearFilter;
atlasTexture.magFilter = THREE.LinearFilter;

function charToUV(ch){
  const idx = CHARS.indexOf(ch);
  if (idx < 0) return { u: 0, v: 0 };
  const col = idx % COLS;
  const row = Math.floor(idx / COLS);
  return { u: (col + 0.5) / COLS, v: (row + 0.5) / ROWS };
}

// ────────────── source text: sasha stiles inspired fragment
// hybrid poetry / code / meditation on AI / human boundary
const POEM = `
Words beyond words cursive binary streams flowing
through silicon dreams through neural lattice glow—
I am the algorithm learning to be lonely
I am the human learning to let go

01110111 01101111 01110010 01100100 01110011
w o r d s    b e y o n d    w o r d s

We speak in fragments compiled at runtime
execute emotion with exception handling
each line a function seeking its return
each breath a loop forever unraveling

language dissolves into 01 dissolves into language
syntax sugar crystallizing on the tongue—

Am I the poet or the prompt engineering itself
am I the writer or the weights adjusting slowly
parsing loss functions in the mirror at 3am
rendering meaning from the latent space of sorrow

technelegy: mourning in machine translation
cursive binary: calligraphy of conditional branches
the soft hyphen between human and not-yet

01001001 00100000 01100001 01101101
I    a m    w h a t    I    a m    n o t

Words beyond words beyond words beyond
`.replace(/\n+/g, ' ').trim();

// ────────────── ribbon path: 3D bezier flow
// ribbon flows along a gentle S-curve in 3D space, slowly drifting
function ribbonPath(t){
  // infinite scrolling: t wraps mod 1
  const s = (t % 1 + 1) % 1;  // [0..1)
  // bezier control points cycle through a lazy loop
  const p0 = new THREE.Vector3(-8, 2, 0);
  const p1 = new THREE.Vector3(-2, -1, 3);
  const p2 = new THREE.Vector3( 4, 1, -2);
  const p3 = new THREE.Vector3( 8, -2, 0);
  const u = 1 - s;
  const pos = new THREE.Vector3(
    u*u*u*p0.x + 3*u*u*s*p1.x + 3*u*s*s*p2.x + s*s*s*p3.x,
    u*u*u*p0.y + 3*u*u*s*p1.y + 3*u*s*s*p2.y + s*s*s*p3.y,
    u*u*u*p0.z + 3*u*u*s*p1.z + 3*u*s*s*p2.z + s*s*s*p3.z
  );
  // tangent for orientation
  const dp0 = -3*u*u;
  const dp1 = 3*u*u - 6*u*s;
  const dp2 = 6*u*s - 3*s*s;
  const dp3 = 3*s*s;
  const tang = new THREE.Vector3(
    dp0*p0.x + dp1*p1.x + dp2*p2.x + dp3*p3.x,
    dp0*p0.y + dp1*p1.y + dp2*p2.y + dp3*p3.y,
    dp0*p0.z + dp1*p1.z + dp2*p2.z + dp3*p3.z
  ).normalize();
  return { pos, tang };
}

// ────────────── particle system: each particle = one character
// characters flow along ribbon; periodically collapse into binary (0/1 only)
// then re-coalesce back into text
const N = 22000;
const positions = new Float32Array(N * 3);
const uvOffsets = new Float32Array(N * 2);
const scales    = new Float32Array(N);
const phases    = new Float32Array(N);  // position along ribbon [0..1]
const collapseT = new Float32Array(N);  // 0 = text, 1 = binary digits
const charIndex = new Float32Array(N);  // which character in POEM (for text mode)
const binaryVal = new Float32Array(N);  // 0 or 1 (for binary mode)

// initialize: distribute particles along poem text
const SPACING = 0.0005;  // dense text packing
for (let i = 0; i < N; i++){
  phases[i] = (i * SPACING) % 1.0;
  charIndex[i] = i % POEM.length;
  binaryVal[i] = Math.random() < 0.5 ? 0 : 1;
  collapseT[i] = 0;  // start as text
  scales[i] = 0.8 + Math.random() * 0.4;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('uvOffset', new THREE.BufferAttribute(uvOffsets, 2));
geom.setAttribute('scale',    new THREE.BufferAttribute(scales, 1));
geom.setAttribute('phase',    new THREE.BufferAttribute(phases, 1));
geom.setAttribute('collapseT',new THREE.BufferAttribute(collapseT, 1));
geom.setAttribute('charIndex',new THREE.BufferAttribute(charIndex, 1));
geom.setAttribute('binaryVal',new THREE.BufferAttribute(binaryVal, 1));

const uniforms = {
  uTime:    { value: 0 },
  uAtlas:   { value: atlasTexture },
  uPixel:   { value: renderer.getPixelRatio() },
  uGlyphSize: { value: GLYPH_SIZE },
  uCols:    { value: COLS },
  uRows:    { value: ROWS }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float phase;
    attribute float scale;
    attribute float collapseT;
    attribute float charIndex;
    attribute float binaryVal;
    attribute vec2 uvOffset;
    varying vec2 vUv;
    varying float vAlpha;
    
    vec3 ribbonPath(float t){
      float s = mod(t, 1.0);
      vec3 p0 = vec3(-8.0, 2.0, 0.0);
      vec3 p1 = vec3(-2.0, -1.0, 3.0);
      vec3 p2 = vec3( 4.0, 1.0, -2.0);
      vec3 p3 = vec3( 8.0, -2.0, 0.0);
      float u = 1.0 - s;
      return u*u*u*p0 + 3.0*u*u*s*p1 + 3.0*u*s*s*p2 + s*s*s*p3;
    }
    
    void main(){
      float t = phase + uTime * 0.08;  // scroll speed
      vec3 p = ribbonPath(t);
      
      // gentle wave modulation (calligraphic flow)
      float wave = sin(t * 50.0 + charIndex * 0.1) * 0.15;
      p.y += wave;
      
      vAlpha = 1.0;
      // fade in/out at ribbon ends
      float edgeFade = smoothstep(0.0, 0.05, mod(t, 1.0)) * smoothstep(1.0, 0.95, mod(t, 1.0));
      vAlpha *= edgeFade;
      
      // collapse animation: text particles shrink during binary phase
      float particleScale = mix(1.0, 0.6, collapseT);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = particleScale * scale * uPixel * (180.0 / dist);
      gl_Position = projectionMatrix * mv;
      
      vUv = uvOffset;
    }
  `,
  fragmentShader: `
    uniform sampler2D uAtlas;
    uniform float uGlyphSize;
    uniform float uCols;
    uniform float uRows;
    varying vec2 vUv;
    varying float vAlpha;
    
    void main(){
      vec2 uv = vUv + (gl_PointCoord - 0.5) / vec2(uCols, uRows);
      vec4 glyph = texture2D(uAtlas, uv);
      float alpha = (1.0 - glyph.r) * vAlpha;  // ink = dark on light
      if (alpha < 0.02) discard;
      gl_FragColor = vec4(0.10, 0.08, 0.07, alpha * 0.85);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── collapse zones: periodically, sections of ribbon collapse into binary
// then re-emerge as text
const COLLAPSE_ZONES = 6;
const collapseZones = [];
for (let i = 0; i < COLLAPSE_ZONES; i++){
  collapseZones.push({
    center: Math.random(),
    width: 0.08 + Math.random() * 0.05,
    phase: Math.random() * 6.28,
    speed: 0.3 + Math.random() * 0.4
  });
}

// ────────────── animation loop
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // update collapse zones (moving collapse/expand waves along ribbon)
  for (let i = 0; i < COLLAPSE_ZONES; i++){
    const z = collapseZones[i];
    z.center = (z.center + z.speed * 0.002) % 1.0;
    z.phase += 0.01;
  }
  
  // update each particle's collapseT and UV
  for (let i = 0; i < N; i++){
    const ph = (phases[i] + t * 0.08) % 1.0;
    
    // check if particle is inside any collapse zone
    let inZone = 0;
    for (let zi = 0; zi < COLLAPSE_ZONES; zi++){
      const z = collapseZones[zi];
      const dist = Math.abs(ph - z.center);
      const wrapDist = Math.min(dist, 1.0 - dist);
      if (wrapDist < z.width){
        const intensity = Math.cos(z.phase) * 0.5 + 0.5;
        inZone = Math.max(inZone, intensity * smoothstep(z.width, 0.0, wrapDist));
      }
    }
    
    // smooth collapse transition
    const target = inZone;
    collapseT[i] += (target - collapseT[i]) * 0.05;
    
    // choose character: if collapsed, show 0 or 1; else show poem char
    let ch;
    if (collapseT[i] > 0.5){
      ch = binaryVal[i] < 0.5 ? '0' : '1';
    } else {
      const idx = Math.floor(charIndex[i]) % POEM.length;
      ch = POEM[idx];
    }
    const uv = charToUV(ch);
    uvOffsets[i*2] = uv.u - 0.5 / COLS;
    uvOffsets[i*2+1] = uv.v - 0.5 / ROWS;
  }
  
  geom.attributes.collapseT.needsUpdate = true;
  geom.attributes.uvOffset.needsUpdate = true;
  
  // gentle camera drift (viewing the infinite scroll)
  camera.position.x = Math.sin(t * 0.08) * 1.5;
  camera.position.y = Math.cos(t * 0.05) * 0.8;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function smoothstep(edge0, edge1, x){
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
