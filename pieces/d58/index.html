<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s7k · selcouth lucy · Lee Bul strange wonder</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#060810; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#e5dcd2; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · selcouth drift …</div>
<div class="id">s7k</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 600);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060810, 1);
document.body.appendChild(renderer.domElement);

/* ── instance layout: central Lucy + 3 concentric rings (from parent zq3) ── */
const COPIES = 30;
const PER_CENTER = 28000;
const PER_RING   = 1200;
const N = PER_CENTER + (COPIES - 1) * PER_RING;

const copyOffsets = [];
const copyScales  = [];

copyOffsets.push(new THREE.Vector3(0, 0, 0));
copyScales.push(1.0);

for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 22, 0, Math.sin(a) * 22));
  copyScales.push(0.52);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.28;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 42, 0, Math.sin(a) * 42));
  copyScales.push(0.33);
}
for (let i = 0; i < 11; i++) {
  const a = (i / 11) * Math.PI * 2 + 0.14;
  copyOffsets.push(new THREE.Vector3(Math.cos(a) * 64, 0, Math.sin(a) * 64));
  copyScales.push(0.21);
}

const restPositions = new Float32Array(N * 3);
const localRest     = new Float32Array(N * 3);
const seedsArr      = new Float32Array(N);
const scaleArr      = new Float32Array(N);

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uReady:     { value: 0.0 },
  uDotFreq:   { value: 2.6 },
  uDotRad:    { value: 0.34 }
};

/* ── shaders: selcouth morph of Kusama parent ── */
/* Lee Bul – cybernetic strangeness; dots lift from skin, form twists uncannily */
const vertexShader = `
  uniform float uTime;
  uniform float uPixel;
  uniform float uReady;
  uniform float uDotFreq;
  uniform float uDotRad;
  attribute vec3  rest;
  attribute vec3  localR;
  attribute float seed;
  attribute float sc;
  varying vec3  vCol;
  varying float vAlpha;
  varying float vGlow;

  float polkaDot(vec3 p, float freq, float rad) {
    vec3 cell = fract(p * freq + 0.5) - 0.5;
    return 1.0 - smoothstep(rad - 0.05, rad + 0.05, length(cell));
  }

  void main() {
    float t = uTime * 0.25 + seed * 6.2831;

    /* selcouth twist — uncanny slow spiral distortion along y-axis */
    vec3 lr = localR;
    float twistAng = sin(lr.y * 0.22 + uTime * 0.08) * 0.35 * smoothstep(0.0, 1.0, uReady);
    float ct = cos(twistAng), st = sin(twistAng);
    lr = vec3(lr.x * ct - lr.z * st, lr.y, lr.x * st + lr.z * ct);

    /* dot pattern in twisted local space */
    float freq = uDotFreq + 0.12 * sin(uTime * 0.18);
    float dot  = polkaDot(lr, freq, uDotRad);

    /* selcouth palette: deep indigo dots on pale spectral surface (Lee Bul) */
    vec3 dotColor   = vec3(0.18, 0.14, 0.58);   /* deep indigo   */
    vec3 fieldColor = vec3(0.86, 0.88, 0.94);    /* spectral pale */

    /* some dots shift to teal over time — strange iridescence */
    vec3 dotColor2  = vec3(0.08, 0.42, 0.52);    /* teal variant  */
    float irid = sin(seed * 40.0 + uTime * 0.12) * 0.5 + 0.5;
    vec3 finalDot = mix(dotColor, dotColor2, irid * dot);
    vCol = mix(fieldColor, finalDot, dot);

    /* reconstruct world position from twisted local */
    vec3 off = rest - localR * sc;  /* copy offset */
    vec3 p = lr * sc + off;

    /* obsessive breathing from parent */
    vec3 dir = normalize(lr + 0.001);
    p += dir * sin(t) * 0.035 * sc;

    /* selcouth detachment: ~12% of dot-positive particles lift off the surface */
    float detachChance = step(0.88, seed) * dot;
    float detachPhase = sin(uTime * 0.2 + seed * 12.566) * 0.5 + 0.5;
    float detachDist = detachChance * detachPhase * 2.8 * sc;
    p += dir * detachDist;
    vGlow = detachChance * detachPhase;

    /* the detached dots glow brighter — selcouth luminance */
    vCol = mix(vCol, vec3(0.55, 0.45, 0.92), vGlow * 0.6);

    /* assembly reveal — spiral inward (from parent) */
    float angle = seed * 6.2831 * 4.0;
    float radius = 50.0 + seed * 30.0;
    vec3 entry = vec3(cos(angle) * radius, sin(seed * 20.0) * 25.0, sin(angle) * radius);
    float reveal = smoothstep(0.0, 1.0, uReady);
    p = mix(entry, p, reveal);

    vAlpha = reveal * (0.82 + 0.18 * dot + 0.25 * vGlow);

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float camDist = -mv.z;
    float baseSz = (1.6 + 0.7 * dot + 1.2 * vGlow) * uPixel * (42.0 / max(camDist, 1.0)) * reveal;
    gl_PointSize = max(1.0, baseSz);
    gl_Position  = projectionMatrix * mv;
  }
`;

const fragmentShader = `
  varying vec3  vCol;
  varying float vAlpha;
  varying float vGlow;
  void main() {
    vec2 d = gl_PointCoord - 0.5;
    float r2 = dot(d, d);
    if (r2 > 0.25) discard;
    /* detached particles get softer edge for glow effect */
    float edge = mix(0.06, 0.15, vGlow);
    float a = smoothstep(0.25, edge, r2) * vAlpha;
    /* subtle additive glow for floating dots */
    vec3 col = vCol * (1.0 + vGlow * 0.4);
    gl_FragColor = vec4(col * a, a);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  blending: THREE.NormalBlending,
  vertexShader,
  fragmentShader
});

const geom   = new THREE.BufferGeometry();
const points  = new THREE.Points(geom, mat);
scene.add(points);

/* ── ground plane: selcouth glass floor — dots become faint spectral echoes ── */
const floorGeo = new THREE.PlaneGeometry(200, 200, 1, 1);
floorGeo.rotateX(-Math.PI / 2);
const floorMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: true,
  uniforms: { uTime: uniforms.uTime, uReady: uniforms.uReady },
  vertexShader: `
    varying vec3 vWPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform float uReady;
    varying vec3 vWPos;
    void main() {
      float freq = 0.18 + 0.008 * sin(uTime * 0.15);
      vec2 cell = fract(vWPos.xz * freq + 0.5) - 0.5;
      float d = length(cell);
      float dot = 1.0 - smoothstep(0.28, 0.34, d);
      /* selcouth floor: dots become faint indigo on near-black */
      vec3 col = mix(vec3(0.03, 0.03, 0.06), vec3(0.20, 0.16, 0.48), dot);
      /* subtle shimmer */
      col += vec3(0.02, 0.04, 0.08) * sin(vWPos.x * 0.5 + uTime * 0.1) * dot;
      float fade = smoothstep(100.0, 30.0, length(vWPos.xz));
      gl_FragColor = vec4(col, fade * 0.30 * uReady);
    }
  `
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -8.5;
scene.add(floor);

/* ── load Stanford Lucy ── */
const loadingEl = document.getElementById('loading');
let revealStart = 0;

new PLYLoader().load(
  'https://threejs.org/examples/models/ply/binary/Lucy100k.ply',
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size   = bb.getSize(new THREE.Vector3());
    const baseScale = 15 / Math.max(size.x, size.y, size.z);
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(baseScale, baseScale, baseScale);

    const mesh    = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp     = new THREE.Vector3();

    let idx = 0;
    for (let c = 0; c < COPIES; c++) {
      const count = c === 0 ? PER_CENTER : PER_RING;
      const s   = copyScales[c];
      const off = copyOffsets[c];
      for (let i = 0; i < count; i++) {
        sampler.sample(tmp);
        const lx = tmp.x * s, ly = tmp.y * s, lz = tmp.z * s;
        localRest[idx * 3]     = lx;
        localRest[idx * 3 + 1] = ly;
        localRest[idx * 3 + 2] = lz;
        restPositions[idx * 3]     = lx + off.x;
        restPositions[idx * 3 + 1] = ly + off.y;
        restPositions[idx * 3 + 2] = lz + off.z;
        seedsArr[idx] = Math.random();
        scaleArr[idx] = s;
        idx++;
      }
    }

    const posArr = new Float32Array(N * 3);
    geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('localR',   new THREE.BufferAttribute(localRest, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seedsArr, 1));
    geom.setAttribute('sc',       new THREE.BufferAttribute(scaleArr, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      loadingEl.textContent = `loading lucy · ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  () => { loadingEl.textContent = 'load failed — check network'; }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ── */
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3500);
  }

  /* camera: slow orbit with selcouth drift — slightly more vertical range,
     occasional gentle altitude shifts for uncanny perspective */
  const orbitR = 30 + 6 * Math.sin(t * 0.055);
  const angle  = t * 0.045;
  const camY   = 5 + 4.5 * Math.sin(t * 0.06) + 2.0 * Math.sin(t * 0.023);
  camera.position.set(Math.sin(angle) * orbitR, camY, Math.cos(angle) * orbitR);
  camera.lookAt(0, 0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
