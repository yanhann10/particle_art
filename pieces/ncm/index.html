<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ncm · vespers macroblock · DCT twilight drift</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0f1a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<!-- MOTION: drift, intensity: contemplative -->
<div class="id">ncm · vespers macroblock</div>
<div class="hint">DCT twilight ripple · bell-toll teleport every 12s</div>
<div class="src">102k GPGPU · vespers palette after Menkman</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Chain from zhn (Rosa Menkman macroblock glitch) through "vespers"
// The glitch grid quiets into evening prayer — macroblocks become
// stained-glass panels, DCT drift slows to incense-rise, bit-flips
// become bell tolls. Palette: twilight indigo, fading amber, muted rose.
// Reference: Menkman's "The Glitch Moment/um" meets Rothko chapel dusk.

const W = 320, H = 320;
const N = W * H;
const GRID = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0f1a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(){
  const init = new Float32Array(N * 4);
  // distribute particles in vertical columns (cathedral proportions)
  // 30 wide × 50 tall — taller than wide, like gothic windows
  const gridW = 30, gridH = 50;
  for (let i = 0; i < N; i++){
    const gx = Math.floor(Math.random() * gridW);
    const gy = Math.floor(Math.random() * gridH);
    const bx = Math.random() * GRID;
    const by = Math.random() * GRID;
    init[i*4]   = (gx * GRID + bx) - (gridW * GRID * 0.5);
    init[i*4+1] = (gy * GRID + by) - (gridH * GRID * 0.5);
    init[i*4+2] = 0;
    init[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation: DCT basis drift slowed for vespers + upward bias (incense rise)
// bell-toll teleport replaces bit-flip
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:   { value: 0.0 },
  uTime: { value: 0.0 },
  uBellTollActive: { value: 0 },
  uBellBlock: { value: new THREE.Vector2(0, 0) },
  uBellTarget: { value: new THREE.Vector2(0, 0) },
  uTwilightPhase: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uTime;
    uniform int uBellTollActive;
    uniform vec2 uBellBlock;
    uniform vec2 uBellTarget;
    uniform float uTwilightPhase;
    varying vec2 vUv;

    const float GRID = 8.0;
    const float PI = 3.14159265359;

    float dctBasis(vec2 coord, float u, float v){
      float cu = u == 0.0 ? 0.70710678 : 1.0;
      float cv = v == 0.0 ? 0.70710678 : 1.0;
      return cu * cv * cos(PI * u * (coord.x + 0.5) / GRID) * cos(PI * v * (coord.y + 0.5) / GRID);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // vertical cathedral grid: 30 wide × 50 tall
      float halfW = 30.0 * GRID * 0.5;
      float halfH = 50.0 * GRID * 0.5;
      vec2 blockOrigin = floor((p.xy + vec2(halfW, halfH)) / GRID) * GRID - vec2(halfW, halfH);
      vec2 localCoord = p.xy - blockOrigin;

      // bell-toll teleport: slower, more deliberate than bit-flip
      if (uBellTollActive == 1){
        vec2 currentBlock = floor((p.xy + vec2(halfW, halfH)) / GRID);
        if (distance(currentBlock, uBellBlock) < 0.5){
          vec2 newOrigin = uBellTarget * GRID - vec2(halfW, halfH);
          p.xy = newOrigin + localCoord;
          blockOrigin = newOrigin;
        }
      }

      // vespers DCT drift: slower, with upward bias (like incense rising)
      float drift1 = dctBasis(localCoord, 1.0, 0.0) * sin(uTime * 0.4 + age * 6.28);
      float drift2 = dctBasis(localCoord, 0.0, 1.0) * cos(uTime * 0.55 + age * 6.28);
      float drift3 = dctBasis(localCoord, 1.0, 1.0) * sin(uTime * 0.3 + age * 3.14);

      // upward bias — particles gently rise like prayer smoke
      float rise = 0.06 * (0.5 + 0.5 * sin(uTime * 0.2 + age * 3.14));

      vec2 driftVec = vec2(
        (drift1 + drift3) * 0.08,
        (drift2 + drift3) * 0.08 + rise
      );
      p.xy += driftVec * uDt * 12.0;

      // twilight breathing: blocks slowly contract/expand like breathing
      float breathe = sin(uTime * 0.15 + blockOrigin.x * 0.02 + blockOrigin.y * 0.01) * 0.3;
      vec2 center = blockOrigin + GRID * 0.5;
      vec2 toCenter = center - p.xy;
      p.xy += toCenter * breathe * uDt * 0.4;

      // wrap within macroblock
      p.xy = blockOrigin + mod(p.xy - blockOrigin + GRID * 0.5, GRID) - GRID * 0.5;

      age = mod(age + uDt * 0.08, 1.0); // slower aging for vespers
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 1000);
camera.position.set(0, 0, 320);
camera.lookAt(0, 0, 0);

// background: deep twilight with vertical banding (stained glass leading)
const bgGeom = new THREE.PlaneGeometry(800, 800);
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      // vertical leading lines (like stained glass mullions)
      float vert = smoothstep(0.0, 0.02, abs(fract(vUv.x * 15.0) - 0.5));
      float horiz = smoothstep(0.0, 0.01, abs(fract(vUv.y * 25.0) - 0.5));
      float lead = min(vert, horiz);

      // twilight gradient: warm horizon fading to deep indigo above
      float gradient = vUv.y;
      vec3 indigo = vec3(0.06, 0.06, 0.14);
      vec3 horizon = vec3(0.12, 0.08, 0.10);
      vec3 base = mix(horizon, indigo, gradient);

      // subtle warm glow near center bottom (last light)
      float lastLight = exp(-length(vUv - vec2(0.5, 0.2)) * 3.0) * 0.03;
      base += vec3(lastLight * 1.2, lastLight * 0.8, lastLight * 0.3);

      base *= lead * 0.95 + 0.05;
      // slow twilight pulse
      base *= 0.95 + 0.05 * sin(uTime * 0.1);
      gl_FragColor = vec4(base, 1.0);
    }
  `,
  depthWrite: true
});
const bgPlane = new THREE.Mesh(bgGeom, bgMat);
bgPlane.position.z = -10;
scene.add(bgPlane);

// points geometry
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

// vespers palette: deep indigo, fading amber, muted rose, twilight gray
const palette = [
  new THREE.Vector3(0.22, 0.18, 0.52), // deep indigo
  new THREE.Vector3(0.88, 0.62, 0.18), // fading amber
  new THREE.Vector3(0.62, 0.28, 0.38), // muted rose
  new THREE.Vector3(0.24, 0.26, 0.34)  // twilight gray
];

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uPal0:  { value: palette[0] },
    uPal1:  { value: palette[1] },
    uPal2:  { value: palette[2] },
    uPal3:  { value: palette[3] },
    uTime:  { value: 0 },
    uTwilightPhase: { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform vec3 uPal0, uPal1, uPal2, uPal3;
    uniform float uTime;
    uniform float uTwilightPhase;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;

      float halfW = 30.0 * 8.0 * 0.5;
      float halfH = 50.0 * 8.0 * 0.5;
      vec2 blockCoord = floor((p.xy + vec2(halfW, halfH)) / 8.0);
      float blockHash = fract(sin(dot(blockCoord, vec2(12.9898, 78.233))) * 43758.5453);

      // chroma subsampling preserved from parent
      float chromaU = floor(blockCoord.x / 2.0);
      float chromaV = floor(blockCoord.y / 2.0);
      float chromaHash = fract(sin(dot(vec2(chromaU, chromaV), vec2(91.3176, 41.789))) * 19134.5312);

      int paletteIdx = int(chromaHash * 4.0);
      vec3 col;
      if (paletteIdx == 0)      col = uPal0;
      else if (paletteIdx == 1) col = uPal1;
      else if (paletteIdx == 2) col = uPal2;
      else                      col = uPal3;

      // vespers: height-based warmth — lower particles warmer (last light),
      // upper particles cooler (approaching night)
      float heightNorm = (p.y + halfH) / (halfH * 2.0);
      vec3 warmShift = vec3(0.12, 0.06, -0.04) * (1.0 - heightNorm);
      vec3 coolShift = vec3(-0.06, -0.03, 0.08) * heightNorm;
      col += warmShift + coolShift;

      // slower, deeper breathing brightness (contemplative)
      float brightness = 0.45 + 0.35 * sin(age * 6.28 + uTime * 0.2);
      // twilight fade: overall dimming with slow oscillation
      float twilight = 0.7 + 0.3 * sin(uTime * 0.08);
      vCol = col * brightness * twilight;
      vAlpha = 0.6 + 0.3 * sin(age * 6.28 + blockHash * 6.28);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 2.2 * uPixel * (200.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      gl_FragColor = vec4(vCol * a * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// bell-toll event scheduler (slower, more solemn than bit-flip)
let bellActive = false;
let bellEndTime = 0;

function triggerBellToll(){
  if (bellActive) return;
  bellActive = true;
  bellEndTime = performance.now() + 800; // longer window — resonance of a bell

  const srcX = Math.floor(Math.random() * 30);
  const srcY = Math.floor(Math.random() * 50);
  const tgtX = Math.floor(Math.random() * 30);
  const tgtY = Math.floor(Math.random() * 50);

  simUniforms.uBellBlock.value.set(srcX, srcY);
  simUniforms.uBellTarget.value.set(tgtX, tgtY);
  simUniforms.uBellTollActive.value = 1;
}

setInterval(triggerBellToll, 12000); // bell toll every 12s

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  const t = now / 1000;
  simUniforms.uDt.value = dt;
  simUniforms.uTime.value = t;
  simUniforms.uTwilightPhase.value = 0.5 + 0.5 * Math.sin(t * 0.05);
  pointsMat.uniforms.uTime.value = t;
  pointsMat.uniforms.uTwilightPhase.value = simUniforms.uTwilightPhase.value;
  bgMat.uniforms.uTime.value = t;

  if (bellActive && now > bellEndTime){
    bellActive = false;
    simUniforms.uBellTollActive.value = 0;
  }

  // sim substeps (2 instead of 3 — slower, more meditative)
  for (let i = 0; i < 2; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // slow contemplative camera drift — barely moving, like kneeling
  camera.position.x = Math.sin(t * 0.03) * 8;
  camera.position.y = Math.cos(t * 0.05) * 5 + Math.sin(t * 0.02) * 3;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
