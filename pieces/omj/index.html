<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omj · suspended dress · thread constellation</title>
<!-- MOTION: suspension, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0608; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">omj</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

// Chiharu Shiota thread installation: a dress suspended in space,
// 12000 red threads radiating outward to walls, ceiling, floor.
// Each thread is one LineSegments — two anchors, straight path.
// Palette: crimson #9c1f1f, additive blending, low opacity (0.07).
// Threads encode memory, distance, loss — the dress as emotional center.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0608, 0.015);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 6, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 4, 0);

// single dim point light near dress
const light = new THREE.PointLight(0xfff0e8, 0.35, 50);
light.position.set(0, 6, 3);
scene.add(light);
scene.add(new THREE.AmbientLight(0x1a0f14, 0.3));

// dress geometry: simple A-line shape, shoulders to hem
const dressGeo = new THREE.CylinderGeometry(0.6, 1.4, 3.2, 16, 8);
dressGeo.translate(0, 4, 0);
const dressMat = new THREE.MeshStandardMaterial({
  color: 0x1a1214,
  roughness: 0.9,
  metalness: 0.0,
  emissive: 0x0a0506,
  emissiveIntensity: 0.3
});
const dress = new THREE.Mesh(dressGeo, dressMat);
scene.add(dress);

// sample dress surface for thread anchor points
const sampler = new MeshSurfaceSampler(dress).build();
const dressAnchors = [];
const DRESS_SAMPLES = 600;
const _pos = new THREE.Vector3(), _norm = new THREE.Vector3();
for (let i = 0; i < DRESS_SAMPLES; i++){
  sampler.sample(_pos, _norm);
  dressAnchors.push(_pos.clone());
}

// define wall/ceiling/floor anchor space
// room: width=28, height=18, depth=28
const ww = 14, hh = 9, dd = 14;
const wallAnchors = [];
const WALL_COUNT = 2400;
for (let i = 0; i < WALL_COUNT; i++){
  const side = Math.floor(Math.random() * 6);
  let x, y, z;
  if (side === 0){ x = -ww; y = (Math.random()-0.5)*hh*1.8; z = (Math.random()-0.5)*dd*1.8; } // left
  else if (side === 1){ x = ww; y = (Math.random()-0.5)*hh*1.8; z = (Math.random()-0.5)*dd*1.8; } // right
  else if (side === 2){ x = (Math.random()-0.5)*ww*1.8; y = hh; z = (Math.random()-0.5)*dd*1.8; } // ceiling
  else if (side === 3){ x = (Math.random()-0.5)*ww*1.8; y = -hh*0.3; z = (Math.random()-0.5)*dd*1.8; } // floor
  else if (side === 4){ x = (Math.random()-0.5)*ww*1.8; y = (Math.random()-0.5)*hh*1.8; z = -dd; } // back
  else { x = (Math.random()-0.5)*ww*1.8; y = (Math.random()-0.5)*hh*1.8; z = dd; } // front
  wallAnchors.push(new THREE.Vector3(x, y, z));
}

// build thread segments: each dress anchor → one random wall anchor
const threadCount = 12000;
const threadPositions = new Float32Array(threadCount * 2 * 3);
for (let i = 0; i < threadCount; i++){
  const a = dressAnchors[Math.floor(Math.random() * dressAnchors.length)];
  const b = wallAnchors[Math.floor(Math.random() * wallAnchors.length)];
  threadPositions[i * 6]     = a.x;
  threadPositions[i * 6 + 1] = a.y;
  threadPositions[i * 6 + 2] = a.z;
  threadPositions[i * 6 + 3] = b.x;
  threadPositions[i * 6 + 4] = b.y;
  threadPositions[i * 6 + 5] = b.z;
}
const threadGeo = new THREE.BufferGeometry();
threadGeo.setAttribute('position', new THREE.BufferAttribute(threadPositions, 3));
const threadMat = new THREE.LineBasicMaterial({
  color: 0x9c1f1f,       // Shiota crimson
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const threads = new THREE.LineSegments(threadGeo, threadMat);
scene.add(threads);

// pointer state for subtle sway
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;

  // subtle rotation of dress
  dress.rotation.y = t * 0.04;

  // subtle thread sway — shift anchors by pointer influence
  const positions = threadGeo.attributes.position.array;
  for (let i = 0; i < threadCount; i++){
    // re-sample dress anchor (first point of segment)
    const a = dressAnchors[i % dressAnchors.length];
    const sway = Math.sin(t * 0.3 + i * 0.01) * 0.015;
    positions[i * 6]     = a.x + pointer.x * sway * 2;
    positions[i * 6 + 1] = a.y + pointer.y * sway * 0.8;
    positions[i * 6 + 2] = a.z + Math.sin(t * 0.2 + i * 0.02) * sway * 1.5;
    // wall anchor (second point) stays fixed
  }
  threadGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
