<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>l4n · spinal branch · asymmetric backbone</title>
<!-- MOTION: sway, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#050403; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">l4n</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres × Bourgeois · spinal architecture · raking light</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Spinal backbone with asymmetric branches.
   One dominant diagonal spine, 4 branches each with distinct character:
   Branch 0: DENSE — tight subdivision, many particles, thick
   Branch 1: SPARSE — restricted growth, skeletal
   Branch 2: BENT — starts one direction, curves back
   Branch 3: STRAIGHT — rigid, minimal deviation
   Palette: white-gold luminance against near-black void.
   Reference: Louise Bourgeois' spinal columns + Gonzalez-Torres' light strings. */

const BG = 0x050403;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4, 3, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const MAX_VERTS = 4800;
const ATTRACT   = 0.045;
const REPEL_R   = 0.42;
const REPEL_STR = 0.09;
const NOISE     = 0.0015;
const PRESSURE  = 0.0015;
const GRAVITY   = 0.003;
const MAX_D     = 0.32;
const ANCHOR_N  = 3;

// Spine + 4 branches
const branches = [];

function makeBranch(pts, type, maxVerts) {
  const verts = [];
  for (let i = 0; i < pts.length; i++) {
    verts.push({
      x: pts[i][0], y: pts[i][1], z: pts[i][2],
      age: 0,
      pinY: i < ANCHOR_N || i >= pts.length - ANCHOR_N,
      frac: i / (pts.length - 1)
    });
  }
  return { verts, type, maxVerts };
}

// SPINE: diagonal from lower-left to upper-right, slight S-curve
{
  const pts = [];
  const N0 = 50;
  for (let i = 0; i < N0; i++) {
    const t = i / (N0 - 1);
    const x = -7 + t * 14;
    const y = -3.5 + t * 7 + Math.sin(t * Math.PI) * 0.6;
    const z = Math.sin(t * Math.PI * 1.5) * 0.3;
    pts.push([x, y, z]);
  }
  branches.push(makeBranch(pts, 'spine', 1600));
}

// Find spine position at fraction t
function spineAt(t) {
  const v = branches[0].verts;
  const idx = Math.floor(t * (v.length - 1));
  const p = v[Math.min(idx, v.length - 1)];
  return [p.x, p.y, p.z];
}

// BRANCH 0: DENSE — off spine at 30%, angle upper-left, many vertices
{
  const anchor = spineAt(0.30);
  const pts = [];
  const N0 = 35;
  const ang = Math.PI * 0.72; // ~130°
  for (let i = 0; i < N0; i++) {
    const t = i / (N0 - 1);
    const len = t * 4.5;
    pts.push([
      anchor[0] + Math.cos(ang) * len,
      anchor[1] + Math.sin(ang) * len * 0.7 + t * t * 0.3,
      anchor[2] + Math.sin(t * 2) * 0.15
    ]);
  }
  branches.push(makeBranch(pts, 'dense', 1200));
}

// BRANCH 1: SPARSE — off spine at 55%, downward angle
{
  const anchor = spineAt(0.55);
  const pts = [];
  const N0 = 20;
  const ang = -Math.PI * 0.38;
  for (let i = 0; i < N0; i++) {
    const t = i / (N0 - 1);
    const len = t * 3.8;
    pts.push([
      anchor[0] + Math.cos(ang) * len + t * 0.5,
      anchor[1] + Math.sin(ang) * len,
      anchor[2] + t * 0.2
    ]);
  }
  branches.push(makeBranch(pts, 'sparse', 500));
}

// BRANCH 2: BENT — off spine at 72%, starts right then curves down
{
  const anchor = spineAt(0.72);
  const pts = [];
  const N0 = 30;
  for (let i = 0; i < N0; i++) {
    const t = i / (N0 - 1);
    const len = t * 4.0;
    const bend = t * t * Math.PI * 0.6;
    const baseAng = -Math.PI * 0.15;
    pts.push([
      anchor[0] + Math.cos(baseAng + bend) * len,
      anchor[1] + Math.sin(baseAng + bend) * len * 0.5 - t * t * 1.2,
      anchor[2] + Math.sin(t * 3) * 0.25
    ]);
  }
  branches.push(makeBranch(pts, 'bent', 800));
}

// BRANCH 3: STRAIGHT — off spine at 15%, rigid upward-right
{
  const anchor = spineAt(0.15);
  const pts = [];
  const N0 = 18;
  const ang = Math.PI * 0.25;
  for (let i = 0; i < N0; i++) {
    const t = i / (N0 - 1);
    const len = t * 3.0;
    pts.push([
      anchor[0] + Math.cos(ang) * len,
      anchor[1] + Math.sin(ang) * len,
      anchor[2]
    ]);
  }
  branches.push(makeBranch(pts, 'straight', 400));
}

const CELL = REPEL_R;

function stepBranch(branch) {
  const verts = branch.verts;
  const n = verts.length;
  if (n >= branch.maxVerts) return;

  const grid = new Map();
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    const k = Math.floor(v.x / CELL) + ',' + Math.floor(v.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }

  function nearby(v) {
    const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
    const out = [];
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const arr = grid.get((cx + dx) + ',' + (cz + dz));
      if (arr) for (const idx of arr) out.push(idx);
    }
    return out;
  }

  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }

  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    const aStr = branch.type === 'straight' ? ATTRACT * 1.8 : ATTRACT;
    if (prev) {
      dx[i] += (prev.x - v.x) * aStr;
      dz[i] += (prev.z - v.z) * aStr;
      dy[i] += (prev.y - v.y) * aStr;
    }
    if (next) {
      dx[i] += (next.x - v.x) * aStr;
      dz[i] += (next.z - v.z) * aStr;
      dy[i] += (next.y - v.y) * aStr;
    }
  }

  for (let i = 0; i < n; i++) {
    const grav = verts[i].pinY ? GRAVITY * 0.02 : GRAVITY * 0.4;
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.3;
    verts[i].age += 0.0003;
  }

  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);

    let canSub = true;
    if (branch.type === 'sparse') canSub = Math.random() > 0.6;
    if (branch.type === 'straight') canSub = Math.random() > 0.3;

    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    const dist2 = ex * ex + ez * ez + ey * ey;
    const threshold = branch.type === 'dense' ? MAX_D * 0.8 : MAX_D;

    if (canSub && dist2 > threshold * threshold && verts.length + grown.length < branch.maxVerts) {
      const jitter = branch.type === 'bent' ? 0.04 : 0.015;
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * jitter,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * jitter,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false,
        frac: (a.frac + b.frac) * 0.5
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

const N_RENDER = 40000;
const rPos    = new Float32Array(N_RENDER * 3);
const rSeeds  = new Float32Array(N_RENDER);
const rAge    = new Float32Array(N_RENDER);
const rBranch = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('branchId', new THREE.BufferAttribute(rBranch, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.028 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uFogDensity;
    attribute float seed;
    attribute float age;
    attribute float branchId;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      float t = uTime * 0.25 + seed * 6.28;
      float sway = sin(t) * 0.006 * (1.0 + seed * 0.5);
      p.x += sway;
      p.z += cos(t * 0.6) * 0.004;

      float pulse = 0.88 + 0.12 * sin(uTime * 0.9 + seed * 30.0);

      // White-gold palette — spine brightest, branches vary
      vec3 brightGold = vec3(1.0, 0.92, 0.72);
      vec3 warmWhite  = vec3(1.0, 0.96, 0.88);
      vec3 paleAmber  = vec3(1.0, 0.85, 0.58);
      vec3 coldWhite  = vec3(0.95, 0.95, 1.0);
      vec3 dimGold    = vec3(0.85, 0.72, 0.45);

      vec3 base;
      if (branchId < 0.5) {
        // Spine: brightest white-gold
        base = mix(brightGold, warmWhite, age * 1.5);
      } else if (branchId < 1.5) {
        // Dense branch: saturated amber-gold
        base = mix(paleAmber, brightGold, age * 1.2);
      } else if (branchId < 2.5) {
        // Sparse branch: dim gold, skeletal
        base = mix(dimGold, paleAmber, age) * 0.7;
      } else if (branchId < 3.5) {
        // Bent branch: cold white shift
        base = mix(warmWhite, coldWhite, age * 1.3);
      } else {
        // Straight branch: pure warm white
        base = mix(warmWhite, brightGold, age * 0.8);
      }

      vCol = base * pulse;

      // Spine particles brighter, sparse dimmer
      float baseAlpha = branchId < 0.5 ? 0.65 : (branchId < 2.5 && branchId > 1.5 ? 0.35 : 0.5);
      vAlpha = baseAlpha + 0.15 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // Size varies: spine thick, sparse thin
      float sz = branchId < 0.5 ? 2.2 : (branchId < 2.5 && branchId > 1.5 ? 1.2 : 1.7);
      gl_PointSize = sz * uPixel * (42.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 28.0);
      float halo = exp(-r * 6.0) * 0.3;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.85);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Wire lines per branch
const wireLines = [];
for (let s = 0; s < branches.length; s++) {
  const wireGeom = new THREE.BufferGeometry();
  const wirePos = new Float32Array(branches[s].maxVerts * 3);
  wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePos, 3));
  const opacity = s === 0 ? 0.22 : 0.12;
  const wireMat = new THREE.LineBasicMaterial({
    color: 0x1a1610,
    transparent: true,
    opacity
  });
  const wireLine = new THREE.Line(wireGeom, wireMat);
  scene.add(wireLine);
  wireLines.push({ geom: wireGeom, positions: wirePos });
}

// Raking side-light for dramatic shadows
const sideLight = new THREE.PointLight(0xffe8c8, 0.4, 50);
sideLight.position.set(12, 5, -3);
scene.add(sideLight);

const dimFill = new THREE.PointLight(0x8090b0, 0.08, 40);
dimFill.position.set(-8, -2, 6);
scene.add(dimFill);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Pre-grow
for (let pre = 0; pre < 400; pre++) {
  for (const b of branches) stepBranch(b);
}

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (!paused) {
    for (let rep = 0; rep < 2; rep++) {
      for (const b of branches) stepBranch(b);
    }
  }

  let totalVerts = 0;
  for (const b of branches) totalVerts += b.verts.length;

  // Update wires
  for (let s = 0; s < branches.length; s++) {
    const b = branches[s];
    const n = b.verts.length;
    const wire = wireLines[s];
    for (let i = 0; i < n; i++) {
      wire.positions[i * 3]     = b.verts[i].x;
      wire.positions[i * 3 + 1] = b.verts[i].y;
      wire.positions[i * 3 + 2] = b.verts[i].z;
    }
    wire.geom.setDrawRange(0, n);
    wire.geom.attributes.position.needsUpdate = true;
  }

  // Track centroid — weight spine more
  let cx = 0, cy = 0, cz = 0, wt = 0;
  for (let s = 0; s < branches.length; s++) {
    const b = branches[s];
    const w = s === 0 ? 3 : 1;
    for (const v of b.verts) {
      cx += v.x * w; cy += v.y * w; cz += v.z * w;
      wt += w;
    }
  }
  if (wt > 0) {
    cx /= wt; cy /= wt; cz /= wt;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
  }

  // Distribute particles — budget proportional to branch maxVerts
  const totalMax = branches.reduce((s, b) => s + b.maxVerts, 0);
  let written = 0;

  for (let s = 0; s < branches.length; s++) {
    const b = branches[s];
    const verts = b.verts;
    const n = verts.length;
    if (n < 2) continue;

    const budget = s === branches.length - 1
      ? N_RENDER - written
      : Math.floor(N_RENDER * b.maxVerts / totalMax);

    const lengths = [];
    let total = 0;
    for (let i = 0; i < n - 1; i++) {
      const a = verts[i], bn = verts[i + 1];
      const L = Math.sqrt((bn.x-a.x)**2 + (bn.z-a.z)**2 + (bn.y-a.y)**2);
      lengths.push(L);
      total += L;
    }

    if (total > 0) {
      let branchWritten = 0;
      for (let i = 0; i < n - 1 && written < N_RENDER; i++) {
        const share = (i === n - 2)
          ? budget - branchWritten
          : Math.max(1, Math.floor(budget * lengths[i] / total));
        const a = verts[i], bn = verts[i + 1];

        for (let k = 0; k < share && written < N_RENDER; k++) {
          const u = Math.random();
          const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;
          const spread = s === 0 ? 0.018 : 0.012;
          rPos[written * 3]     = a.x + (bn.x - a.x) * cu + (Math.random() - 0.5) * spread;
          rPos[written * 3 + 1] = a.y + (bn.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
          rPos[written * 3 + 2] = a.z + (bn.z - a.z) * cu + (Math.random() - 0.5) * spread;
          rAge[written] = Math.max(a.age, bn.age);
          rBranch[written] = s;
          written++;
          branchWritten++;
        }
      }
    }
  }

  geom.attributes.position.needsUpdate = true;
  geom.attributes.age.needsUpdate = true;
  geom.attributes.branchId.needsUpdate = true;

  statEl.textContent = `vertices=${totalVerts}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
