<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>u7m · Shiota — Absent Bodies</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">u7m</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0018);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.002));
const dim1 = new THREE.PointLight(0x1a0505, 0.006, 42, 2.8);
dim1.position.set(-9, 11, 8);
scene.add(dim1);

const dim2 = new THREE.PointLight(0x180404, 0.004, 38, 2.6);
dim2.position.set(7, -6, -5);
scene.add(dim2);

let seed = 719263;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// SUSPENDED DRESS — simple mesh silhouette
const dressPos = new THREE.Vector3(0.8, 1.2, -0.6);
const dressGroup = new THREE.Group();

const dressMat = new THREE.MeshStandardMaterial({
  color: 0xe8e0d4,
  emissive: 0xd4cabb,
  emissiveIntensity: 0.38,
  roughness: 0.92,
  metalness: 0.02
});

// Bodice (narrow box)
const bodiceGeo = new THREE.BoxGeometry(1.2, 1.6, 0.6);
const bodice = new THREE.Mesh(bodiceGeo, dressMat);
bodice.position.y = 0.8;
dressGroup.add(bodice);

// Skirt (cone)
const skirtGeo = new THREE.ConeGeometry(1.8, 3.2, 16);
const skirt = new THREE.Mesh(skirtGeo, dressMat);
skirt.position.y = -1.2;
dressGroup.add(skirt);

// Sleeves (small boxes)
const sleeveGeo = new THREE.BoxGeometry(0.4, 1.0, 0.4);
const sleeveL = new THREE.Mesh(sleeveGeo, dressMat);
sleeveL.position.set(-0.8, 0.6, 0);
sleeveL.rotation.z = 0.4;
dressGroup.add(sleeveL);

const sleeveR = new THREE.Mesh(sleeveGeo, dressMat);
sleeveR.position.set(0.8, 0.6, 0);
sleeveR.rotation.z = -0.4;
dressGroup.add(sleeveR);

dressGroup.position.copy(dressPos);
dressGroup.rotation.y = 0.12;
scene.add(dressGroup);

// Dress glow
const dressGlow = new THREE.PointLight(0x1a0404, 0.005, 9, 2.4);
dressGlow.position.copy(dressPos);
scene.add(dressGlow);

// ROOM VOLUME
const ROOM = { w: 32, h: 22, d: 28 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHORS — wall grid
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.92; z=(rng()-0.5)*ROOM.d*0.92; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.92; y=(rng()-0.5)*ROOM.h*0.92; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<84; i++) anchors.push(wallPt());

// DRESS ATTACHMENT POINTS — perimeter sampling for thread convergence
const dressPts = [];

// Bodice edges
for(let i=0; i<20; i++){
  const t = i/20;
  const angle = t*Math.PI*2;
  const r = 0.65;
  dressPts.push(new THREE.Vector3(
    dressPos.x + Math.cos(angle)*r,
    dressPos.y + 0.8 + (rng()-0.5)*1.4,
    dressPos.z + Math.sin(angle)*r*0.5
  ));
}

// Skirt perimeter at multiple heights
for(let layer=0; layer<4; layer++){
  const y = dressPos.y - 0.4 - layer*0.7;
  const r = 1.0 + layer*0.35;
  const steps = 14 + layer*3;
  for(let i=0; i<steps; i++){
    const angle = (i/steps)*Math.PI*2;
    dressPts.push(new THREE.Vector3(
      dressPos.x + Math.cos(angle)*r,
      y,
      dressPos.z + Math.sin(angle)*r*0.85
    ));
  }
}

// Sleeve tips
dressPts.push(new THREE.Vector3(dressPos.x - 1.0, dressPos.y + 0.4, dressPos.z));
dressPts.push(new THREE.Vector3(dressPos.x + 1.0, dressPos.y + 0.4, dressPos.z));

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to dress shoulders/hanger
const suspPts = [
  new THREE.Vector3(dressPos.x - 0.7, dressPos.y + 1.6, dressPos.z),
  new THREE.Vector3(dressPos.x + 0.7, dressPos.y + 1.6, dressPos.z),
  new THREE.Vector3(dressPos.x, dressPos.y + 1.8, dressPos.z - 0.3),
  new THREE.Vector3(dressPos.x, dressPos.y + 1.8, dressPos.z + 0.3),
  new THREE.Vector3(dressPos.x - 0.4, dressPos.y + 1.7, dressPos.z - 0.2),
  new THREE.Vector3(dressPos.x + 0.4, dressPos.y + 1.7, dressPos.z + 0.2)
];

for(const sp of suspPts){
  const ceilX = sp.x + (rng()-0.5)*0.8;
  const ceilZ = sp.z + (rng()-0.5)*0.8;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sp);
}

// CONVERGENCE THREADS — anchors to dress perimeter (blood vessels to the form)
const convergeBudget = 7200;
for(let i=0; i<convergeBudget && li<NUM_LINES-12500; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dDress = a.distanceTo(dressPos);
  if(dDress < 2.2) continue;
  
  let closest = dressPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<8; k++){
    const candidate = dressPts[Math.floor(rng()*dressPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 10% stop short — threads that almost reach
  if(rng()<0.10){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.45 + rng()*0.45);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// RADIATING THREADS FROM DRESS — outward hemorrhage
for(let i=0; i<420 && li<NUM_LINES-11600; i++){
  const dp = dressPts[Math.floor(rng()*dressPts.length)];
  const dir = dp.clone().sub(dressPos).normalize();
  dir.x += (rng()-0.5)*0.7;
  dir.y += (rng()-0.5)*0.5;
  dir.z += (rng()-0.5)*0.7;
  dir.normalize();
  const len = 3.0 + rng()*8.5;
  const end = dp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(dp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor membrane
const THRESH = 6.8;
let webCount = 0, attempts = 0;
while(webCount<5400 && li<NUM_LINES-5800 && attempts<36000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>1.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL SPANS — architectural cage
let wallSpans = 0;
while(wallSpans<2200 && li<NUM_LINES-3400){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>4.5 && d<22.0){
    setLine(a, b);
    wallSpans++;
  }
}

// DENDRITIC BRANCHES near dress (morphogenetic growth)
for(let i=0; i<180 && li<NUM_LINES-2800; i++){
  const startDist = 3.2 + rng()*7.5;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.8;
  const start = dressPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.4,
    (rng()-0.5)*2.0,
    (rng()-0.5)*2.4
  ).normalize();
  
  const segLen = 1.1 + rng()*0.8;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-16 && rng()<0.68){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.55 + rng()*0.60
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.76));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-14 && rng()<0.48){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.55 - rng()*0.60
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.72));
      setLine(p1, p2b);
    }
  }
}

// HORIZONTAL CROSSING THREADS
for(let i=0; i<320 && li<NUM_LINES-1800; i++){
  const y = dressPos.y + (rng()-0.5)*6.5;
  const x1 = -hw + rng()*4.0;
  const z1 = (rng()-0.5)*ROOM.d*0.88;
  const x2 = hw - rng()*4.0;
  const z2 = (rng()-0.5)*ROOM.d*0.88;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS — floor to ceiling
for(let i=0; i<200 && li<NUM_LINES-1200; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.2, hh, z + (rng()-0.5)*1.2);
  setLine(a, b);
}

// FILL remaining capacity
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>5.5 && d<18.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.068,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, slow dolly
const pathLen = 3200;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.22){
    // Approach from front-left upper
    const lt = t/0.22;
    const angle = Math.PI*1.1 + lt*Math.PI*0.38;
    const r = 12.5 - lt*3.5;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 6.2 - lt*3.2;
    z = dressPos.z + Math.sin(angle)*r;
  } else if(t<0.44){
    // Circle right side, mid-height
    const lt = (t-0.22)/0.22;
    const angle = Math.PI*1.48 + lt*Math.PI*0.90;
    const r = 9.0 + Math.sin(lt*Math.PI*1.6)*1.4;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 0.6 + Math.cos(lt*Math.PI*1.3)*0.8;
    z = dressPos.z + Math.sin(angle)*r;
  } else if(t<0.68){
    // Descend below, looking up through red lattice
    const lt = (t-0.44)/0.24;
    const angle = Math.PI*2.38 + lt*Math.PI*0.75;
    const r = 8.5 + Math.cos(lt*Math.PI)*1.1;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y - lt*7.8;
    z = dressPos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, dress silhouetted
    const lt = (t-0.68)/0.32;
    const angle = Math.PI*3.13 + lt*Math.PI*0.50;
    const r = 8.2 + lt*6.5;
    x = dressPos.x + Math.cos(angle)*r;
    y = dressPos.y + 2.8 + lt*4.5;
    z = dressPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.38%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.016 + basePositions[idx+1]*0.024 + i*0.000042;
    const breath = Math.sin(elapsed*0.00028 + phase)*0.000011;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.010;
      arr[vi+1] = basePositions[vi+1] + breath*0.008;
      arr[vi+2] = basePositions[vi+2] + breath*0.012;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Dress subtle rotation
  dressGroup.rotation.y = 0.12 + Math.sin(elapsed*0.000032)*0.008;

  // Camera dolly
  const speed = 0.000018;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward dress with drift
  camera.lookAt(
    dressPos.x + Math.sin(elapsed*0.000068)*0.16,
    dressPos.y + Math.cos(elapsed*0.000052)*0.14,
    dressPos.z + Math.sin(elapsed*0.000038)*0.12
  );

  dim1.intensity = 0.006 + Math.sin(elapsed*0.000044)*0.0032;
  dressGlow.intensity = 0.005 + Math.sin(elapsed*0.000058)*0.0024;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
