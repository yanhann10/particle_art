<title>1tp · 7-cube projection with selective edge law</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background: #000000;
    color: #cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">1tp · 7-cube projection with selective edge law</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Manfred Mohr P-197 / P-411 space.color lineage: a 7-dimensional hypercube projected
// into 3D, edges drawn as crisp cylinders, color from a discrete palette (primaries on black).
// Animation: slow rotation in a random 2-plane of R^7 (Givens rotation) — non-Euclidean tumbling.
// Edge-selection rule: keep edge IFF the sum of dimensional-difference-bits is odd (a diagonal law).
// No bloom, no fog — pure geometric line drawing.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// ────────────── 7-cube vertices: 2^7 = 128 corners
const DIM = 7;
const N_VERT = 1 << DIM;
const vertices = [];
for (let i = 0; i < N_VERT; i++){
  const v = [];
  for (let d = 0; d < DIM; d++) v.push((i & (1 << d)) ? 1 : -1);
  vertices.push(v);
}

// random orthonormal projection matrix R^7 → R^3 via Gram-Schmidt
const rng = (() => {
  let s = Math.floor(Math.random() * 1e9) >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
})();
function randomVec(n){
  const v = [];
  for (let i = 0; i < n; i++) v.push(rng() * 2 - 1);
  const m = Math.sqrt(v.reduce((s,x) => s + x*x, 0));
  return v.map(x => x / m);
}
function dot(a, b){ return a.reduce((s, x, i) => s + x * b[i], 0); }
function sub(a, b){ return a.map((x, i) => x - b[i]); }
function scale(v, c){ return v.map(x => x * c); }
const basis = [randomVec(DIM), randomVec(DIM), randomVec(DIM)];
// orthogonalize
for (let i = 1; i < 3; i++){
  for (let j = 0; j < i; j++){
    const proj = dot(basis[i], basis[j]);
    basis[i] = sub(basis[i], scale(basis[j], proj));
  }
  const m = Math.sqrt(dot(basis[i], basis[i]));
  basis[i] = scale(basis[i], 1 / m);
}
function project(v){
  return new THREE.Vector3(dot(v, basis[0]), dot(v, basis[1]), dot(v, basis[2]));
}

// Mohr-style discrete palette: primaries on black
const palette = [
  0xff0030, // red
  0x0060ff, // blue
  0xffdd00, // yellow
  0xffffff  // white
];

// edge-selection rule: two vertices are connected by an edge IFF they differ in exactly one dimension.
// for a Mohr-style selective law: keep edge IFF sum of (coordinate XOR bits) is odd — a diagonal rule.
const edges = [];
for (let i = 0; i < N_VERT; i++){
  for (let j = i + 1; j < N_VERT; j++){
    const diff = i ^ j;
    // count set bits
    let bits = 0;
    for (let d = 0; d < DIM; d++) if (diff & (1 << d)) bits++;
    if (bits === 1){
      // edge exists; apply selection law: keep if sum of indices mod 4 is 0 or 3 (half the edges)
      const rule = (i + j) % 4;
      if (rule === 0 || rule === 3){
        edges.push({ a: i, b: j, color: palette[(i ^ j) % palette.length] });
      }
    }
  }
}

// render edges as instanced cylinders
const cylinderGeom = new THREE.CylinderGeometry(0.022, 0.022, 1, 6);
cylinderGeom.rotateZ(Math.PI / 2);
const edgeMeshes = edges.map(e => {
  const mat = new THREE.MeshBasicMaterial({ color: e.color });
  const mesh = new THREE.Mesh(cylinderGeom, mat);
  mesh.userData.edgeData = e;
  scene.add(mesh);
  return mesh;
});

// rotation state in R^7: pick two random dimensions to rotate in
const dim1 = Math.floor(rng() * DIM);
let dim2 = Math.floor(rng() * DIM);
while (dim2 === dim1) dim2 = Math.floor(rng() * DIM);
let angle = 0;

function rotate7D(v, theta){
  // Givens rotation in the (dim1, dim2) plane
  const out = [...v];
  const c = Math.cos(theta), s = Math.sin(theta);
  const a = v[dim1], b = v[dim2];
  out[dim1] = c * a - s * b;
  out[dim2] = s * a + c * b;
  return out;
}

// centroid tracking for camera (though hypercube is centered, projection can drift)
function updateEdges(theta){
  const rotated = vertices.map(v => rotate7D(v, theta));
  const projected = rotated.map(v => project(v));
  // scale to fit
  const scale = 3.5;
  projected.forEach(p => p.multiplyScalar(scale));
  // update edge geometry
  edgeMeshes.forEach(mesh => {
    const e = mesh.userData.edgeData;
    const pA = projected[e.a];
    const pB = projected[e.b];
    const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(pB, pA);
    const len = dir.length();
    mesh.position.copy(mid);
    mesh.scale.x = len;
    mesh.lookAt(pB);
  });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  // slow rotation: 0.08 rad/sec in the chosen 2-plane
  angle = t * 0.08;
  updateEdges(angle);
  // very slow camera orbit in 3D space (not hypercube rotation — this is viewpoint drift)
  camera.position.x = Math.sin(t * 0.04) * 0.8;
  camera.position.y = Math.cos(t * 0.03) * 0.6;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
