<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1tp · 7-cube projection with selective edge law</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background: #000000;
    color: #cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">1tp · 7-cube projection with selective edge law</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Manfred Mohr P-197 / P-411 space.color lineage: a 7-dimensional hypercube projected
// into 3D, edges drawn as crisp cylinders, color from a discrete palette (primaries on black).
// Animation: slow rotation in a random 2-plane of R^7 (Givens rotation) — non-Euclidean tumbling.
// Edge-selection rule: keep edge IFF the sum of dimensional-difference-bits is odd (a diagonal law).
// No bloom, no fog — pure geometric line drawing.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// ────────────── 7-cube vertices: 2^7 = 128 corners
const DIM = 7;
const N_VERT = 1 << DIM;
const vertices = [];
for (let i = 0; i < N_VERT; i++){
  const v = [];
  for (let d = 0; d < DIM; d++) v.push((i & (1 << d)) ? 1 : -1);
  vertices.push(v);
}

// random orthonormal projection matrix R^7 → R^3 via Gram-Schmidt
const rng = (() => {
  let s = Math.floor(Math.random() * 1e9) >>> 0;
  return () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
})();
function randomVec(n){
  const v = [];
  for (let i = 0; i < n; i++) v.push(rng() * 2 - 1);
  const m = Math.sqrt(v.reduce((s,x) => s + x*x, 0));
  return v.map(x => x / m);
}
function dot(a, b){ return a.reduce((s, x, i) => s + x * b[i], 0); }
function sub(a, b){ return a.map((x, i) => x - b[i]); }
function scale(v, c){ return v.map(x => x * c); }
const basis = [randomVec(DIM), randomVec(DIM), randomVec(DIM)];
// orthogonalize
for (let i = 1; i < 3; i++){
  for (let j = 0; j < i; j++){
    const proj = dot(basis[i], basis[j]);
    basis[i] = sub(basis[i], scale(basis[j], proj));
  }
  const m = Math.sqrt(dot(basis[i], basis[i]));
  basis[i] = scale(basis[i], 1 / m);
}
function project(v){
  return new THREE.Vector3(dot(v, basis[0]), dot(v, basis[1]), dot(v, basis[2]));
}

// Mohr-style discrete palette: primaries on black
const palette = [
  0xff0030, // red
  0x0060ff, // blue
  0xffdd00, // yellow
  0xffffff  // white
];

// edge-selection rule: two vertices are connected by an edge IFF they differ in exactly one dimension.
// for a Mohr-style selective law: keep edge IFF sum of (coordinate XOR bits) is odd — a diagonal rule.
const edges = [];
for (let i = 0; i < N_VERT; i++){
  for (let j = i + 1; j < N_VERT; j++){
    const diff = i ^ j;
    // count set bits
    let bits = 0;
    for (let d = 0; d < DIM; d++) if (diff & (1 << d)) bits++;
    if (bits === 1){
      // edge exists; apply selection law: keep if sum of indices mod 4 is 0 or 3 (half the edges)
      const rule = (i + j) % 4;
      if (rule === 0 || rule === 3){
        edges.push({ a: i, b: j, color: palette[(i ^ j) % palette.length] });
      }
    }
  }
}

// render edges as instanced cylinders
const cylinderGeom = new THREE.CylinderGeometry(0.022, 0.022, 1, 6);
cylinderGeom.rotateZ(Math.PI / 2);
const edgeMeshes = edges.map(e => {
  const mat = new THREE.MeshBasicMaterial({ color: e.color });
  const mesh = new THREE.Mesh(cylinderGeom, mat);
  mesh.userData.edgeData = e;
  scene.add(mesh);
  return mesh;
});

// rotation state in R^7: pick two random dimensions to rotate in
const dim1 = Math.floor(rng() * DIM);
let dim2 = Math.floor(rng() * DIM);
while (dim2 === dim1) dim2 = Math.floor(rng() * DIM);
let angle = 0;

function rotate7D(v, theta){
  // Givens rotation in the (dim1, dim2) plane
  const out = [...v];
  const c = Math.cos(theta), s = Math.sin(theta);
  const a = v[dim1], b = v[dim2];
  out[dim1] = c * a - s * b;
  out[dim2] = s * a + c * b;
  return out;
}

// centroid tracking for camera (though hypercube is centered, projection can drift)
function updateEdges(theta){
  const rotated = vertices.map(v => rotate7D(v, theta));
  const projected = rotated.map(v => project(v));
  // scale to fit
  const scale = 3.5;
  projected.forEach(p => p.multiplyScalar(scale));
  // update edge geometry
  edgeMeshes.forEach(mesh => {
    const e = mesh.userData.edgeData;
    const pA = projected[e.a];
    const pB = projected[e.b];
    const mid = new THREE.Vector3().addVectors(pA, pB).multiplyScalar(0.5);
    const dir = new THREE.Vector3().subVectors(pB, pA);
    const len = dir.length();
    mesh.position.copy(mid);
    mesh.scale.x = len;
    mesh.lookAt(pB);
  });
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  // slow rotation: 0.08 rad/sec in the chosen 2-plane
  angle = t * 0.08;
  updateEdges(angle);
  // very slow camera orbit in 3D space (not hypercube rotation — this is viewpoint drift)
  camera.position.x = Math.sin(t * 0.04) * 0.8;
  camera.position.y = Math.cos(t * 0.03) * 0.6;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
