<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nsw · komorebi</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c08; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">nsw</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Chain from qbv (aria / Meredith Monk / stretched Aizawa with upward drift
// and vocal envelope). "Komorebi" (木漏れ日: sunlight filtering through leaves)
// transforms the piece: attractor maintains vertical stretch BUT particles now
// scatter horizontally in discrete layers — like light beams slicing through
// canopy at different heights. Each layer receives unique phase-offset breathing
// (simulating shifting leaf-gaps as wind moves branches). Released particles
// drift in slow downward spirals — scattered motes descending through shafts
// of light. Palette shifts from amber/warm toward cooler green-gold with
// brighter highlights (direct sun vs. filtered light dapple).
// Reference: James Turrell's Roden Crater skyspaces — discrete light zones
// shifting with celestial motion.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c08, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.5;
  init[i*4+1] = (Math.random()*2-1) * 0.5;
  init[i*4+2] = (Math.random()*2-1) * 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ── simulation ── qbv aria params + komorebi layering ── */
const simUniforms = {
  prev:        { value: rtA.texture },
  uDt:         { value: 0.010 },
  uA:          { value: 0.95 },
  uB:          { value: 0.70 },
  uC:          { value: 0.60 },
  uD:          { value: 3.50 },
  uE:          { value: 0.25 },
  uF:          { value: 0.10 },
  uTime:       { value: 0.0 },
  uBreath:     { value: 0.0 },
  uKomorebi:   { value: 0.0 }   // 0→1 morph factor: light-shaft layering
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uTime, uBreath, uKomorebi;
    varying vec2 vUv;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      float h = hash(vUv);

      // qbv breathing (inherited)
      float breath = sin(uTime * 0.4 + h * 6.28) * 0.5 + 0.5;
      float localA = uA + breath * uBreath * 0.06;
      float localC = uC + breath * uBreath * 0.04;

      // ── komorebi layering: particles stratify into horizontal layers ──
      // quantize y-position into discrete "light shaft" zones
      float numLayers = 5.0;
      float layer = floor((p.y + 2.0) * numLayers / 4.0);
      float layerPhase = layer / numLayers;
      
      // each layer breathes at its own offset (simulating leaf movement)
      float layerBreath = sin(uTime * 0.35 + layerPhase * 6.28) * 0.5 + 0.5;
      float layeredModA = localA + layerBreath * uKomorebi * 0.04;

      // qbv vocal envelope (inherited, but now interpreted as intensity per layer)
      float voicePhase = mod(age + h * 0.3, 1.0);
      float crescendo  = smoothstep(0.0, 0.3, voicePhase);
      float sustain    = 1.0 - smoothstep(0.55, 1.0, voicePhase);
      float envelope   = crescendo * sustain;

      // maintain qbv vertical stretch (aria legacy), but dampen horizontal pull
      float yStretch = 1.0 + 0.5 * envelope;
      
      // aizawa integration (qbv base)
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        (uD * p.x + (p.z - uB) * p.y) * yStretch,
        localC + layeredModA * p.z - (p.z*p.z*p.z)/3.0
              - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
              + uF * p.z * p.x*p.x*p.x
      );

      // komorebi scattering: particles drift horizontally within their layer
      // (light motes suspended in a shaft, moving sideways as leaf-gap shifts)
      float scatterAngle = h * 6.2832 + layerPhase * 3.14159;
      vec3 lateralDrift = vec3(
        cos(scatterAngle + uTime * 0.2) * 0.05 * uKomorebi * envelope,
        0.0,
        sin(scatterAngle + uTime * 0.2) * 0.05 * uKomorebi * envelope
      );
      dp += lateralDrift;

      // qbv release: particles drift away
      // komorebi change: drift DOWNWARD in slow spiral (settling dust in shafts)
      float release = smoothstep(0.6, 1.0, age);
      float spiralAngle = h * 6.2832 + age * 4.0;
      vec3 drift = vec3(
        sin(spiralAngle) * 0.08 * release * (1.0 + uKomorebi * 0.3),
        -0.15 * release * (1.0 + uKomorebi * 0.2),
        cos(spiralAngle) * 0.08 * release * (1.0 + uKomorebi * 0.3)
      );
      float attractorStrength = 1.0 - release * 0.7;

      p += (dp * attractorStrength + drift) * uDt;

      age = mod(age + uDt * 0.035, 1.0);

      // on reset, respawn near attractor (inherited from qbv)
      if(age < uDt * 0.04){
        p = vec3(
          (hash(vUv + 0.1) * 2.0 - 1.0) * 0.4,
          (hash(vUv + 0.2) * 2.0 - 1.0) * 0.4,
          (hash(vUv + 0.3) * 2.0 - 1.0) * 0.4
        );
      }

      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

/* ── render points ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 60);
camera.position.set(0, 0, 5);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:      { value: rtB.texture },
    uPixel:     { value: renderer.getPixelRatio() },
    uBreath:    { value: 0.0 },
    uKomorebi:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uKomorebi;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vRelease;
    varying float vEnvelope;
    varying float vLayer;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vRelease = smoothstep(0.6, 1.0, vAge);

      // vocal envelope (inherited from qbv)
      float h = fract(sin(dot(uvIdx, vec2(127.1,311.7)))*43758.5453);
      float voicePhase = mod(vAge + h * 0.3, 1.0);
      float crescendo  = smoothstep(0.0, 0.3, voicePhase);
      float sustain    = 1.0 - smoothstep(0.55, 1.0, voicePhase);
      vEnvelope = crescendo * sustain;

      // komorebi: particles in direct light-shafts appear brighter/larger
      float numLayers = 5.0;
      vLayer = floor((p.y + 2.0) * numLayers / 4.0) / numLayers;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mv.z, 0.1);
      // particles at layer peaks (direct sunbeam) grow slightly
      float layerIntensity = sin(vLayer * 3.14159 * 2.0) * 0.5 + 0.5;
      float komorebiSize = 1.0 + uKomorebi * layerIntensity * 0.4;
      float sz = (1.3 + vRelease * 1.0) * komorebiSize * uPixel * (7.0 / dist);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vRelease;
    varying float vEnvelope;
    varying float vLayer;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;

      float a = exp(-r * 10.0);

      // palette: shift from qbv warm amber toward cooler green-gold dapple
      vec3 directSun  = vec3(1.0, 0.92, 0.72);  // bright highlights (direct beam)
      vec3 filtered   = vec3(0.78, 0.88, 0.62); // cooler green-gold (through leaves)
      vec3 shadow     = vec3(0.52, 0.58, 0.42); // dim undergrowth tone
      vec3 faded      = vec3(0.45, 0.48, 0.38); // settling motes

      float life = smoothstep(0.0, 0.15, vAge) * (1.0 - smoothstep(0.7, 1.0, vAge));

      // layer determines color: particles in "direct shaft" zones get directSun
      float layerIntensity = sin(vLayer * 3.14159 * 2.0) * 0.5 + 0.5;
      vec3 col = mix(filtered, directSun, layerIntensity * 0.6);
      col = mix(col, shadow, (1.0 - life) * 0.3);
      col = mix(col, faded, vRelease);

      // envelope brightens particles at crescendo (inherited qbv logic)
      float opacity = a * (0.32 + life * 0.58) * (1.0 - vRelease * 0.5);
      opacity *= (1.0 + vEnvelope * 0.25);

      gl_FragColor = vec4(col * opacity, opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer: gentle parameter nudge (inherited from qbv via 6rs)
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.05;
  target.c = 0.60 + ny * 0.06;
});

// centroid tracking (inherited from qbv)
const centroid = new THREE.Vector3(0, 0, 0.8);
const centroidTarget = new THREE.Vector3(0, 0, 0.8);
let frameCount = 0;

function sampleCentroid(elapsed, komorebiFactor){
  const t = elapsed;
  centroidTarget.set(
    Math.sin(t * 0.1) * 0.15,
    -0.05 + Math.sin(t * 0.07) * 0.06,
    0.82 + Math.sin(t * 0.13) * 0.12
  );
}

const t0 = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  // komorebi morph factor: 0→1 over ~35 seconds
  const komorebiFactor = Math.min(elapsed / 35.0, 1.0);

  // qbv breathing oscillation (inherited)
  const breathCycle = Math.sin(elapsed * 0.3) * 0.5 + 0.5;
  simUniforms.uBreath.value = breathCycle;
  simUniforms.uTime.value = elapsed;
  simUniforms.uKomorebi.value = komorebiFactor;
  pointsMat.uniforms.uBreath.value = breathCycle;
  pointsMat.uniforms.uKomorebi.value = komorebiFactor;

  // gentle parameter easing (inherited from qbv via 6rs)
  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.03;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.03;

  // 3 substeps (inherited from qbv via 6rs)
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);
  pointsMat.uniforms.state.value = rtA.texture;

  // camera: slow orbit tracking centroid (inherited from qbv)
  frameCount++;
  if (frameCount % 60 === 0) sampleCentroid(elapsed, komorebiFactor);
  centroid.lerp(centroidTarget, 0.02);

  const ang = elapsed * 0.08;
  const radius = 4.4 + Math.sin(elapsed * 0.12) * 0.3;
  camera.position.set(
    Math.sin(ang) * radius + centroid.x,
    Math.sin(ang * 0.6) * 0.5 + centroid.y + 0.25,
    Math.cos(ang) * radius + centroid.z
  );
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
