<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rt4 · folded leaves</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">rt4</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.enableRotate = true;
controls.autoRotate = false;

const N = 60000;

/* ── Build leaf-twirl geometry: a curved strip with particles ── */
function buildLeafTwirl(opts){
  const {
    length = 8.0,
    width = 2.5,
    curlAngle = Math.PI * 1.2,
    twistAngle = Math.PI * 0.6,
    veinCurve = 0.3,
    segments = 40,
    particlesPerLeaf = 6000
  } = opts;
  
  const positions = [];
  const seeds = [];
  
  // Build curved vein path
  for (let i = 0; i < segments; i++){
    const t = i / (segments - 1);
    
    // Vein curves slightly
    const x = veinCurve * Math.sin(t * Math.PI);
    const y = t * length - length * 0.5;
    const z = 0;
    
    // Width tapers toward tip
    const w = width * (1.0 - t * 0.7);
    
    // Curl: leaf edge lifts and curls inward
    const curl = curlAngle * Math.pow(t, 1.5);
    const twist = twistAngle * t;
    
    // Sample particles across width
    const samplesPerSeg = Math.floor(particlesPerLeaf / segments);
    for (let j = 0; j < samplesPerSeg; j++){
      const u = (j / samplesPerSeg) - 0.5; // -0.5 to 0.5 across width
      
      // Position on flat leaf
      let px = x + u * w;
      let py = y;
      let pz = z;
      
      // Apply curl (edge lifts up and rotates inward)
      const edgeFactor = Math.abs(u) * 2.0; // 0 at center, 1 at edge
      const liftZ = edgeFactor * Math.sin(curl) * w * 0.5;
      const pullX = edgeFactor * (1.0 - Math.cos(curl)) * w * 0.3 * Math.sign(u);
      
      pz += liftZ;
      px -= pullX;
      
      // Apply twist along length
      const ct = Math.cos(twist);
      const st = Math.sin(twist);
      const rx = px * ct - pz * st;
      const rz = px * st + pz * ct;
      px = rx;
      pz = rz;
      
      // Subtle jitter for organic feel
      px += (Math.random() - 0.5) * 0.08;
      py += (Math.random() - 0.5) * 0.08;
      pz += (Math.random() - 0.5) * 0.08;
      
      positions.push(px, py, pz);
      seeds.push(Math.random());
    }
  }
  
  return { positions, seeds };
}

/* ── Build arrangement of 7 leaf-twirl elements ── */
function buildLeafArrangement(){
  const allPositions = [];
  const allSeeds = [];
  
  // Configuration for 7 leaves in a loose spiral bouquet
  const leaves = [
    // Central large fern frond
    { length: 10, width: 3.2, curlAngle: Math.PI * 1.4, twistAngle: Math.PI * 0.5, 
      veinCurve: 0.4, offset: [0, 0, 0], rotation: [0, 0, 0], scale: 1.0 },
    
    // Left curling palm
    { length: 8.5, width: 2.8, curlAngle: Math.PI * 1.1, twistAngle: Math.PI * 0.7, 
      veinCurve: 0.5, offset: [-3.5, 1.2, 1.5], rotation: [0.3, -0.6, -0.4], scale: 0.85 },
    
    // Right autumn leaf
    { length: 7, width: 2.3, curlAngle: Math.PI * 0.9, twistAngle: Math.PI * 0.4, 
      veinCurve: 0.25, offset: [3.2, -0.8, 0.8], rotation: [-0.2, 0.5, 0.6], scale: 0.75 },
    
    // Back tall frond
    { length: 9.5, width: 2.6, curlAngle: Math.PI * 1.3, twistAngle: Math.PI * 0.6, 
      veinCurve: 0.35, offset: [0.5, 2.5, -2.0], rotation: [0.4, 0.2, 0.1], scale: 0.9 },
    
    // Lower left small curl
    { length: 6, width: 2.0, curlAngle: Math.PI * 0.8, twistAngle: Math.PI * 0.9, 
      veinCurve: 0.3, offset: [-2.5, -3.0, 0.5], rotation: [-0.5, -0.4, -0.8], scale: 0.65 },
    
    // Right side twisting
    { length: 7.5, width: 2.4, curlAngle: Math.PI * 1.0, twistAngle: Math.PI * 0.8, 
      veinCurve: 0.45, offset: [2.8, 1.8, -1.2], rotation: [0.3, 0.7, 0.5], scale: 0.8 },
    
    // Front accent leaf
    { length: 6.5, width: 2.1, curlAngle: Math.PI * 1.15, twistAngle: Math.PI * 0.5, 
      veinCurve: 0.2, offset: [-1.2, -1.5, 2.5], rotation: [-0.4, -0.3, 0.3], scale: 0.7 }
  ];
  
  const particlesPerLeaf = Math.floor(N / leaves.length);
  
  for (const leaf of leaves){
    const { positions, seeds } = buildLeafTwirl({
      length: leaf.length,
      width: leaf.width,
      curlAngle: leaf.curlAngle,
      twistAngle: leaf.twistAngle,
      veinCurve: leaf.veinCurve,
      particlesPerLeaf
    });
    
    // Apply transform
    const mat = new THREE.Matrix4();
    const rot = new THREE.Euler(leaf.rotation[0], leaf.rotation[1], leaf.rotation[2]);
    mat.makeRotationFromEuler(rot);
    mat.scale(new THREE.Vector3(leaf.scale, leaf.scale, leaf.scale));
    
    for (let i = 0; i < positions.length; i += 3){
      const v = new THREE.Vector3(positions[i], positions[i+1], positions[i+2]);
      v.applyMatrix4(mat);
      v.add(new THREE.Vector3(leaf.offset[0], leaf.offset[1], leaf.offset[2]));
      allPositions.push(v.x, v.y, v.z);
    }
    
    allSeeds.push(...seeds);
  }
  
  return { positions: new Float32Array(allPositions), seeds: new Float32Array(allSeeds) };
}

const { positions, seeds } = buildLeafArrangement();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uGust:  { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uGust;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.4 + seed * 6.28;

      /* gentle sway — leaves breathing in wind */
      float sway = 0.15 * sin(t * 0.6 + p.y * 0.2);
      p.x += sway * uGust;
      p.z += sway * 0.5 * cos(t * 0.5);

      /* subtle tremor on edges */
      float dist = length(p.xz);
      float edge = smoothstep(3.0, 8.0, dist);
      float tremor = edge * uGust * 0.08;
      p.x += tremor * sin(uTime * 8.0 + seed * 40.0);
      p.z += tremor * cos(uTime * 6.0 + seed * 35.0);

      /* ── Palette: warm amber, sienna, ochre on near-black ── */
      float energy = 0.4 + 0.3 * sin(t * 0.5);
      
      vec3 ochre  = vec3(0.72, 0.54, 0.28);
      vec3 sienna = vec3(0.48, 0.30, 0.18);
      vec3 amber  = vec3(0.82, 0.62, 0.34);
      vec3 rust   = vec3(0.58, 0.36, 0.22);
      
      float heightMix = (p.y + 5.0) / 10.0;
      vec3 col = mix(sienna, ochre, heightMix);
      col = mix(col, amber, edge * 0.4);
      col = mix(col, rust, seed * 0.3);
      
      /* faint warm glow */
      col += 0.03 * vec3(
        sin(p.y * 0.5 + uTime * 0.3) * 0.5 + 0.5,
        0.2,
        0.0
      );

      vCol = col;
      vAlpha = 0.5 + 0.3 * energy;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      gl_PointSize = (1.2 + 0.5 * energy) * uPixel * (45.0/depth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  /* gentle breathing gust */
  const gustSlow = Math.pow(Math.sin(elapsed * 0.18) * 0.5 + 0.5, 1.5);
  const gustFast = 0.15 * Math.sin(elapsed * 1.2);
  uniforms.uGust.value = Math.max(0, Math.min(1, gustSlow + gustFast));

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<script src="/audio-reactive.js" defer></script>
</body>
</html>
