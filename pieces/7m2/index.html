<div class="id">7m2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.012);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.2));

const pL = new THREE.PointLight(0xffd8b0, 0.4, 45, 1.8);
pL.position.set(-1.5, 9.0, 2.0);
scene.add(pL);

let seed = 83927461;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — architectural void
const ROOM = { w: 36, h: 24, d: 42 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — Shiota's iconic remembered garment
// A simple white dress: cone (skirt) + cylinder (bodice) + line (hanger)
const dressCenter = new THREE.Vector3(0.0, 1.2, 0.0);
const SKIRT_R = 1.6, SKIRT_H = 3.8;
const BODICE_R = 0.55, BODICE_H = 1.4;
const skirtBottom = dressCenter.y - SKIRT_H * 0.4;
const skirtTop = dressCenter.y + SKIRT_H * 0.6;
const bodiceTop = skirtTop + BODICE_H;

const dressGroup = new THREE.Group();

// Skirt — inverted cone, wider at bottom
const skirtGeo = new THREE.ConeGeometry(SKIRT_R, SKIRT_H, 16, 1, true);
const dressMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc,
  emissive: 0xf0e8dc,
  emissiveIntensity: 0.55,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.4,
  side: THREE.DoubleSide
});
const skirt = new THREE.Mesh(skirtGeo, dressMat);
skirt.position.set(dressCenter.x, dressCenter.y + SKIRT_H*0.1, dressCenter.z);
skirt.rotation.x = Math.PI; // flip so wide end is down
dressGroup.add(skirt);

// Bodice — narrow cylinder
const bodiceGeo = new THREE.CylinderGeometry(BODICE_R*0.7, BODICE_R, BODICE_H, 12, 1, true);
const bodice = new THREE.Mesh(bodiceGeo, dressMat);
bodice.position.set(dressCenter.x, skirtTop + BODICE_H*0.5, dressCenter.z);
dressGroup.add(bodice);

// Hanger wire — thin dark line at top
const hangerGeo = new THREE.BufferGeometry();
const hangerPts = new Float32Array([
  dressCenter.x - 0.9, bodiceTop + 0.6, dressCenter.z,
  dressCenter.x, bodiceTop + 1.1, dressCenter.z,
  dressCenter.x, bodiceTop + 1.1, dressCenter.z,
  dressCenter.x + 0.9, bodiceTop + 0.6, dressCenter.z,
  dressCenter.x, bodiceTop + 1.1, dressCenter.z,
  dressCenter.x, bodiceTop + 0.05, dressCenter.z
]);
hangerGeo.setAttribute('position', new THREE.BufferAttribute(hangerPts, 3));
dressGroup.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x1a1a1a, transparent: true, opacity: 0.7
})));

scene.add(dressGroup);

// ── PALE SPHERE — secondary presence, a moon behind the dress
const spherePos = new THREE.Vector3(5.5, 3.0, -4.0);
const SPHERE_R = 1.8;
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xede6da,
    emissive: 0xede6da,
    emissiveIntensity: 0.5,
    roughness: 0.95,
    transparent: true,
    opacity: 0.35,
    side: THREE.DoubleSide
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// Suspension wires from ceiling to hanger
const suspGeo = new THREE.BufferGeometry();
const sp = new Float32Array([
  dressCenter.x - 0.2, hh, dressCenter.z + 0.1,
  dressCenter.x, bodiceTop + 1.1, dressCenter.z,
  dressCenter.x + 0.3, hh, dressCenter.z - 0.15,
  dressCenter.x, bodiceTop + 1.1, dressCenter.z,
  spherePos.x, hh, spherePos.z,
  spherePos.x, spherePos.y + SPHERE_R, spherePos.z,
  spherePos.x - 0.4, hh, spherePos.z + 0.3,
  spherePos.x - 0.2, spherePos.y + SPHERE_R*0.9, spherePos.z + 0.15
]);
suspGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
suspGeo.setIndex([0,1, 2,3, 4,5, 6,7]);
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x140806, transparent: true, opacity: 0.55
})));

// ── DRESS SURFACE SAMPLER — points on skirt cone + bodice cylinder
function dressSurf(){
  const r = rng();
  if(r < 0.65){
    // Skirt surface — cone
    const t = rng(); // 0=top(narrow), 1=bottom(wide)
    const radius = BODICE_R + (SKIRT_R - BODICE_R) * t;
    const angle = rng() * Math.PI * 2;
    const y = skirtTop - t * SKIRT_H;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(angle) * radius,
      y,
      dressCenter.z + Math.sin(angle) * radius
    );
  } else {
    // Bodice surface
    const t = rng();
    const angle = rng() * Math.PI * 2;
    const radius = BODICE_R * (0.7 + 0.3 * (1 - t));
    const y = skirtTop + t * BODICE_H;
    return new THREE.Vector3(
      dressCenter.x + Math.cos(angle) * radius,
      y,
      dressCenter.z + Math.sin(angle) * radius
    );
  }
}

function sphereSurf(){
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2 * rng() - 1);
  return new THREE.Vector3(
    spherePos.x + Math.sin(v)*Math.cos(u)*SPHERE_R,
    spherePos.y + Math.sin(v)*Math.sin(u)*SPHERE_R,
    spherePos.z + Math.cos(v)*SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron vertices as skeleton (Mohr)
const NUM_ANCHORS = 850;
const anchors = [];

// Truncated icosahedron vertices (soccer ball) at two scales
const phi = (1 + Math.sqrt(5)) / 2;
const truncIcoVerts = [
  [0, 1, 3*phi], [0, 1, -3*phi], [0, -1, 3*phi], [0, -1, -3*phi],
  [1, 3*phi, 0], [-1, 3*phi, 0], [1, -3*phi, 0], [-1, -3*phi, 0],
  [3*phi, 0, 1], [-3*phi, 0, 1], [3*phi, 0, -1], [-3*phi, 0, -1],
  [2, 1+2*phi, phi], [-2, 1+2*phi, phi], [2, -(1+2*phi), phi], [-2, -(1+2*phi), phi],
  [2, 1+2*phi, -phi], [-2, 1+2*phi, -phi], [2, -(1+2*phi), -phi], [-2, -(1+2*phi), -phi],
  [phi, 2, 1+2*phi], [-phi, 2, 1+2*phi], [phi, -2, 1+2*phi], [-phi, -2, 1+2*phi],
  [phi, 2, -(1+2*phi)], [-phi, 2, -(1+2*phi)], [phi, -2, -(1+2*phi)], [-phi, -2, -(1+2*phi)],
  [1+2*phi, phi, 2], [-(1+2*phi), phi, 2], [1+2*phi, -phi, 2], [-(1+2*phi), -phi, 2],
  [1+2*phi, phi, -2], [-(1+2*phi), phi, -2], [1+2*phi, -phi, -2], [-(1+2*phi), -phi, -2]
];

// Place at two scales around dress
for(const v of truncIcoVerts){
  const norm = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  const s1 = 2.2/norm, s2 = 5.5/norm;
  anchors.push(new THREE.Vector3(
    dressCenter.x + v[0]*s1, dressCenter.y + 1.5 + v[1]*s1, dressCenter.z + v[2]*s1
  ));
  anchors.push(new THREE.Vector3(
    dressCenter.x + v[0]*s2, dressCenter.y + 0.5 + v[1]*s2, dressCenter.z + v[2]*s2
  ));
}

// Void zones — negative space windows
const voids = [];
for(let i=0; i<3; i++){
  voids.push({
    pos: new THREE.Vector3(
      dressCenter.x + (rng()-0.5)*16,
      dressCenter.y + (rng()-0.5)*10,
      dressCenter.z + (rng()-0.5)*16
    ),
    r: 2.5 + rng()*1.8
  });
}
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Fill remaining anchors — shell around dress + scattered
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.4){
    p = dressSurf();
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p.add(dir.multiplyScalar(1.5 + rng()*5.0));
  } else if(r < 0.6){
    p = wallPt().lerp(dressCenter, 0.2 + rng()*0.4);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// ── BUILD 20,000 TAUT RED THREADS — two rules (Casey Reas):
// Rule 1: anchor → nearest object surface
// Rule 2: anchor → anchor if within threshold distance
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-dressCenter.x, dy = my-dressCenter.y-1.0, dz = mz-dressCenter.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Suspension threads — ceiling to dress/sphere top
for(let i=0; i<12 && li<NUM_LINES; i++){
  const cx = dressCenter.x + (rng()-0.5)*5;
  const cz = dressCenter.z + (rng()-0.5)*5;
  const top = new THREE.Vector3(cx, hh, cz);
  if(rng() < 0.7){
    setLine(top, dressSurf());
  } else {
    setLine(top, sphereSurf());
  }
}

// Rule 1: anchor → dress surface (55%) — threads converge like vessels to a heart
const catA = Math.floor(NUM_LINES * 0.50);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a;
  if(rng() < 0.45){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  // 7% stop short — reaching but never arriving (Quayola)
  if(rng() < 0.07){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.2));
    setLine(a, target);
  } else if(rng() < 0.15){
    // Some threads to the sphere — connecting the two objects
    setLine(a, sphereSurf());
  } else {
    setLine(a, dressSurf());
  }
}

// Threads between dress and sphere — the relation line
for(let i=0; i<120 && li<NUM_LINES; i++){
  setLine(dressSurf(), sphereSurf());
}

// Rule 2: anchor → anchor within threshold (25%) — structural web
const THRESHOLD = 6.5;
let rule2count = 0;
const rule2target = Math.floor(NUM_LINES * 0.22);
let rule2attempts = 0;
while(rule2count < rule2target && li < NUM_LINES && rule2attempts < 80000){
  rule2attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  if(inVoid(best)) continue;

  setLine(a, best);
  rule2count++;

  // Y-fork branching — dendritic capillaries
  if(rng() < 0.25 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.25 + rng()*0.4);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.5 + rng()*1.4));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      rule2count++;
    }
  }
}

// Wall-to-wall structural threads (remaining)
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.6 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── LEAF FRAGMENTS — tiny leaf shapes caught in the web (leaf-as-basic-unit)
// Each leaf is a flat diamond/teardrop shape — like pressed autumn leaves in a diary
const NUM_LEAVES = 40;
for(let i=0; i<NUM_LEAVES; i++){
  const sz = 0.04 + rng()*0.12;
  // Leaf shape: elongated diamond via custom BufferGeometry
  const leafGeo = new THREE.BufferGeometry();
  const w = sz * (0.3 + rng()*0.4);
  const h = sz * (1.0 + rng()*0.6);
  const verts = new Float32Array([
    0, h*0.5, 0,    // tip
    -w*0.5, 0, 0,   // left
    0, -h*0.5, 0,   // bottom
    0, h*0.5, 0,    // tip
    w*0.5, 0, 0,    // right
    0, -h*0.5, 0    // bottom
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.01 + rng()*0.03;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.25, d*0.1),
    transparent: true,
    opacity: 0.18 + rng()*0.3,
    side: THREE.DoubleSide
  });
  const leaf = new THREE.Mesh(leafGeo, leafMat);

  // Place along threads or near dress
  if(rng() < 0.5){
    const si = Math.floor(rng()*li)*6;
    const t = 0.15 + rng()*0.7;
    leaf.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    leaf.position.copy(dressCenter).add(dir.multiplyScalar(2.0 + rng()*6.0));
    leaf.position.y += 1.0;
  }
  leaf.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(leaf);
}

// ── CAMERA — slow vertical drift inside the web, intimate architectural walk
const pathLen = 520;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;
  // Slow elliptical drift with vertical breathing — rise and fall through the web
  const x = cx + Math.sin(p)*5.5 + Math.sin(p*1.3+0.9)*1.8;
  const y = cy + 1.0 + Math.sin(p*0.35+0.3)*5.0 + Math.cos(p*0.8)*1.2;
  const z = cz + Math.cos(p)*7.0 + Math.cos(p*0.7+1.5)*2.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── THREAD MICRO-BREATHING — imperceptible drift, <0.5% variation
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0015 * Math.max(0, 1.0 - dist / 20.0);
    const phase = basePositions[idx]*0.3 + basePositions[idx+1]*0.35 + i*0.0018;
    const breath = Math.sin(t*0.04 + phase) * amp;
    for(let v=0; v<2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.45;
      arr[vi+1] = basePositions[vi+1] + breath*0.35;
      arr[vi+2] = basePositions[vi+2] + breath*0.42;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — viewer walking slowly through the installation
  const speed = 0.0014;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward dress with gentle wander — presence-in-absence
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.006)*0.35;
  look.y += 1.2 + Math.cos(t*0.004)*0.25;
  look.z += Math.sin(t*0.005)*0.2;
  camera.lookAt(look);

  // Light — single warm source, darkness is primary material (Morakana)
  pL.position.x = -1.5 + Math.sin(t*0.003)*1.0;
  pL.position.y = 9.0 + Math.cos(t*0.0025)*0.4;
  pL.position.z = 2.0 + Math.cos(t*0.005)*0.7;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
