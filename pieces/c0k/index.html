<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ring station · Manfred Mohr — hypercube torus</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000008; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">c0k</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 25, 60);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── TORUS PARAMETERS ──
const MAJOR_R = 16;
const MINOR_R = 2.5;
const TORUS_COUNT = 30000;
const RIM_COUNT = 24;
const STAR_COUNT = 5000;
const ENGINE_COUNT = 800;
const STRUT_COUNT = 4000;
const DUST_COUNT = 2000;
const TOTAL = TORUS_COUNT + RIM_COUNT + STAR_COUNT + ENGINE_COUNT + STRUT_COUNT + DUST_COUNT;

const positions = new Float32Array(TOTAL * 3);
const colors = new Float32Array(TOTAL * 3);
const sizes = new Float32Array(TOTAL);

let idx = 0;

function addPt(x, y, z, r, g, b, sz) {
  positions[idx*3] = x;
  positions[idx*3+1] = y;
  positions[idx*3+2] = z;
  colors[idx*3] = r;
  colors[idx*3+1] = g;
  colors[idx*3+2] = b;
  sizes[idx] = sz;
  idx++;
}

// ── 1. TORUS SURFACE PARTICLES ──
// Mohr-style: quantize angular positions to discrete steps (plotter grid on curved surface)
const ANGLE_QUANT = Math.PI * 2 / 360; // 1-degree quantization

for (let i = 0; i < TORUS_COUNT; i++) {
  let theta = Math.random() * Math.PI * 2;
  let phi = Math.random() * Math.PI * 2;

  // Quantize angles to give pixelated/plotter feel (Mohr's discrete aesthetic)
  theta = Math.round(theta / ANGLE_QUANT) * ANGLE_QUANT;
  phi = Math.round(phi / ANGLE_QUANT) * ANGLE_QUANT;

  // Slight radial variation for surface texture
  const mr = MINOR_R + (Math.random() - 0.5) * 0.4;

  const x = (MAJOR_R + mr * Math.cos(phi)) * Math.cos(theta);
  const y = mr * Math.sin(phi);
  const z = (MAJOR_R + mr * Math.cos(phi)) * Math.sin(theta);

  // Steel-blue with depth-based brightness variation
  const facing = Math.abs(Math.cos(phi)); // brighter on outer face
  const base = 0.6 + facing * 0.4;
  const r = 0.3 * base;
  const g = 0.4 * base;
  const b = 0.6 * base;

  // Panel lines: darken particles near certain angular thresholds
  const panelTheta = (theta % (Math.PI / 6));
  const panelPhi = (phi % (Math.PI / 4));
  const isPanel = panelTheta < 0.03 || panelPhi < 0.03;
  const panelDim = isPanel ? 0.4 : 1.0;

  const sz = 2.5 + Math.random() * 2.5;
  addPt(x, y, z, r * panelDim, g * panelDim, b * panelDim, sz);
}

const torusEnd = idx;

// ── 2. INNER RIM LIGHTS ──
// 24 bright amber navigation beacons on the inner equator
const rimStartIdx = idx;
for (let i = 0; i < RIM_COUNT; i++) {
  const theta = (i / RIM_COUNT) * Math.PI * 2;
  // Inner equator: phi = PI (inside of torus)
  const innerR = MAJOR_R - MINOR_R * 0.85;
  const x = innerR * Math.cos(theta);
  const y = 0;
  const z = innerR * Math.sin(theta);

  addPt(x, y, z, 1.0, 0.6, 0.1, 14);
}

// Additional glow halos around each rim light
for (let i = 0; i < RIM_COUNT; i++) {
  const theta = (i / RIM_COUNT) * Math.PI * 2;
  const innerR = MAJOR_R - MINOR_R * 0.85;
  const cx = innerR * Math.cos(theta);
  const cz = innerR * Math.sin(theta);

  // 3 halo particles per light
  for (let h = 0; h < 3; h++) {
    const ox = (Math.random() - 0.5) * 1.2;
    const oy = (Math.random() - 0.5) * 1.2;
    const oz = (Math.random() - 0.5) * 1.2;
    addPt(cx + ox, oy, cz + oz, 1.0, 0.5, 0.05, 6);
  }
}

// ── 3. STRUCTURAL STRUTS ──
// Mohr-inspired: 4 radial strut bundles connecting hub to ring (quantized lines)
const STRUT_QUANT = 0.5;
const strutAngles = [0, Math.PI/2, Math.PI, Math.PI*1.5];
const strutsPerBeam = Math.floor(STRUT_COUNT / strutAngles.length);

for (const sa of strutAngles) {
  const outerX = (MAJOR_R - MINOR_R) * Math.cos(sa);
  const outerZ = (MAJOR_R - MINOR_R) * Math.sin(sa);

  for (let i = 0; i < strutsPerBeam; i++) {
    const t = Math.random();
    let x = outerX * t;
    let y = (Math.random() - 0.5) * 0.6;
    let z = outerZ * t;

    // Quantize to grid
    x = Math.round(x / STRUT_QUANT) * STRUT_QUANT;
    y = Math.round(y / STRUT_QUANT) * STRUT_QUANT;
    z = Math.round(z / STRUT_QUANT) * STRUT_QUANT;

    const brightness = 0.25 + t * 0.35;
    addPt(x, y, z, brightness * 0.5, brightness * 0.55, brightness * 0.7, 2.0);
  }
}

// ── 4. ENGINE GLOW ──
// Cyan thruster cluster at one angular position on the torus exterior
const engineTheta = Math.PI * 0.25;
const engineCx = (MAJOR_R + MINOR_R + 1.5) * Math.cos(engineTheta);
const engineCz = (MAJOR_R + MINOR_R + 1.5) * Math.sin(engineTheta);
const engineStartIdx = idx;

for (let i = 0; i < ENGINE_COUNT; i++) {
  // Cone-shaped exhaust pointing outward from torus surface
  const spread = Math.random() * 3.0;
  const dirX = Math.cos(engineTheta);
  const dirZ = Math.sin(engineTheta);

  const x = engineCx + dirX * spread + (Math.random() - 0.5) * spread * 0.5;
  const y = (Math.random() - 0.5) * spread * 0.4;
  const z = engineCz + dirZ * spread + (Math.random() - 0.5) * spread * 0.5;

  const fade = 1.0 - spread / 3.0;
  addPt(x, y, z, 0.2 * fade, 0.9 * fade, 1.0 * fade, 3.0 + (1.0 - fade) * 4.0);
}

const engineEndIdx = idx;

// ── 5. AMBIENT DUST ──
// Sparse particles near the station suggesting micro-debris / atmosphere
for (let i = 0; i < DUST_COUNT; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = MAJOR_R + (Math.random() - 0.5) * 12;
  const x = r * Math.cos(theta);
  const y = (Math.random() - 0.5) * 8;
  const z = r * Math.sin(theta);

  addPt(x, y, z, 0.15, 0.18, 0.25, 1.2);
}

// ── 6. STAR FIELD ──
for (let i = 0; i < STAR_COUNT; i++) {
  // Distribute on a sphere shell at radius 100-200
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  const r = 100 + Math.random() * 100;

  const x = r * Math.sin(phi) * Math.cos(theta);
  const y = r * Math.sin(phi) * Math.sin(theta);
  const z = r * Math.cos(phi);

  // Slight color variation: warm/cool stars
  const temp = Math.random();
  const sr = 0.8 + temp * 0.2;
  const sg = 0.85 + (1 - temp) * 0.15;
  const sb = 0.9 + (1 - temp) * 0.1;

  addPt(x, y, z, sr, sg, sb, 0.8 + Math.random() * 0.5);
}

// ── GEOMETRY ──
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

// Custom shader for per-particle sizes + additive blending
const vertShader = `
  attribute float size;
  varying vec3 vColor;
  varying float vSize;
  void main() {
    vColor = color;
    vSize = size;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (300.0 / -mvPosition.z);
    gl_PointSize = clamp(gl_PointSize, 0.5, 40.0);
    gl_Position = projectionMatrix * mvPosition;
  }
`;

const fragShader = `
  varying vec3 vColor;
  varying float vSize;
  void main() {
    vec2 uv = gl_PointCoord - 0.5;
    float d = length(uv);
    if (d > 0.5) discard;
    // Soft glow falloff
    float alpha = smoothstep(0.5, 0.05, d);
    // Brighter core for large particles (rim lights, engine)
    float core = smoothstep(0.3, 0.0, d);
    vec3 col = vColor + vColor * core * 0.5;
    gl_FragColor = vec4(col, alpha * 0.9);
  }
`;

const mat = new THREE.ShaderMaterial({
  vertexShader: vertShader,
  fragmentShader: fragShader,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const points = new THREE.Points(geo, mat);
scene.add(points);

// ── CAMERA ──
let camAngle = 0;
const camRadius = 60;
const camHeight = 25;

// ── INTERACTION ──
let targetAngleOffset = 0;

addEventListener('mousemove', (e) => {
  const nx = (e.clientX / innerWidth - 0.5) * 2;
  targetAngleOffset = nx * 0.3;
});

addEventListener('click', () => {
  // Shift camera to a new vantage on click
  camAngle += Math.PI / 3;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── ANIMATION ──
const ROT_SPEED = 0.0003;
let frame = 0;

function loop() {
  frame++;

  // Slow station rotation
  points.rotation.y += ROT_SPEED;

  // Camera orbits very slowly with mouse influence
  camAngle += 0.00015;
  const ca = camAngle + targetAngleOffset;
  camera.position.x += (Math.sin(ca) * camRadius - camera.position.x) * 0.02;
  camera.position.z += (Math.cos(ca) * camRadius - camera.position.z) * 0.02;
  camera.position.y += (camHeight + Math.sin(frame * 0.001) * 5 - camera.position.y) * 0.02;
  camera.lookAt(0, 0, 0);

  // Animate rim lights: gentle pulse
  const pulse = 0.85 + 0.15 * Math.sin(frame * 0.03);
  for (let i = rimStartIdx; i < rimStartIdx + RIM_COUNT; i++) {
    colors[i*3] = 1.0 * pulse;
    colors[i*3+1] = 0.6 * pulse;
    colors[i*3+2] = 0.1 * pulse;
  }

  // Animate engine glow: flicker
  for (let i = engineStartIdx; i < engineEndIdx; i++) {
    const flicker = 0.7 + 0.3 * Math.sin(frame * 0.07 + i * 0.5);
    const baseFade = colors[i*3+2]; // use blue channel as reference
    colors[i*3] = 0.2 * flicker;
    colors[i*3+1] = 0.9 * flicker;
    colors[i*3+2] = 1.0 * flicker;
  }

  // Animate star twinkle
  const starStart = idx - STAR_COUNT;
  for (let i = starStart; i < idx; i++) {
    const twinkle = 0.6 + 0.4 * Math.sin(frame * 0.02 + i * 7.13);
    sizes[i] = (0.8 + Math.sin(i) * 0.3) * twinkle;
  }

  geo.attributes.color.needsUpdate = true;
  geo.attributes.size.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
