<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2ie · Shiota — presence in absence</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#030303; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">2ie</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030303);
scene.fog = new THREE.FogExp2(0x030303, 0.032);

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a0808, 1.0));
const dL = new THREE.DirectionalLight(0xffeedd, 0.4);
dL.position.set(-3, 5, 4);
scene.add(dL);
const pL = new THREE.PointLight(0x330808, 0.6, 18);
pL.position.set(0, 2, -3);
scene.add(pL);

let seed = 91827364;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── Suspended sphere — translucent so threads read through it
const sphereR = 2.2;
const spherePos = new THREE.Vector3(0, 0.3, -5);
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e6d8, emissive: 0xf0e6d8, emissiveIntensity: 0.5,
    roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.18,
    side: THREE.DoubleSide, depthWrite: false
  })
);
sphereMesh.position.copy(spherePos);
scene.add(sphereMesh);

// Faint wireframe overlay on sphere
const wireframe = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 1.002, 16, 10),
  new THREE.MeshBasicMaterial({
    color: 0xf0e6d8, wireframe: true, transparent: true, opacity: 0.06
  })
);
wireframe.position.copy(spherePos);
scene.add(wireframe);

// ── Enlarged key — the remembered object, promoted to central role
const keyGroup = new THREE.Group();
const keyRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.48, 0.09, 10, 16),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.6, metalness:0.85 })
);
const keyShaft = new THREE.Mesh(
  new THREE.BoxGeometry(0.12, 1.4, 0.06),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.6, metalness:0.85 })
);
keyShaft.position.y = -0.92;
// Two teeth on the key
const tooth1 = new THREE.Mesh(
  new THREE.BoxGeometry(0.22, 0.12, 0.06),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.6, metalness:0.85 })
);
tooth1.position.set(0.10, -1.45, 0);
const tooth2 = new THREE.Mesh(
  new THREE.BoxGeometry(0.18, 0.10, 0.06),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.6, metalness:0.85 })
);
tooth2.position.set(0.08, -1.25, 0);
keyGroup.add(keyRing, keyShaft, tooth1, tooth2);
keyGroup.position.set(spherePos.x - 1.6, spherePos.y + 0.8, spherePos.z + 2.0);
keyGroup.rotation.set(0.25, 0.6, 0.35);
scene.add(keyGroup);

// ── Room boundaries — architectural cube
const ROOM = { w: 22, h: 16, d: 34 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// Anchor points — dense cluster around sphere + key
const NUM_ANCHORS = 900;
const anchors = [];
const keyPos = keyGroup.position;
for(let i=0; i<NUM_ANCHORS; i++){
  if(rng() < 0.38){
    // Near sphere surface
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const dist = sphereR + 0.06 + rng()*3.0;
    anchors.push(spherePos.clone().add(dir.multiplyScalar(dist)));
  } else if(rng() < 0.2){
    // Near key
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    anchors.push(keyPos.clone().add(dir.multiplyScalar(0.3 + rng()*2.5)));
  } else if(rng() < 0.35){
    // Midfield
    const p = wallPt();
    p.lerp(spherePos, 0.25 + rng()*0.35);
    anchors.push(p);
  } else {
    anchors.push(wallPt());
  }
}

// ── Build 20,000 line segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
let li = 0;

function sphereSurf(from){
  const dir = spherePos.clone().sub(from).normalize();
  return spherePos.clone().sub(dir.multiplyScalar(sphereR * (0.96 + rng()*0.06)));
}

function keySurf(){
  return keyPos.clone().add(new THREE.Vector3(
    (rng()-0.5)*0.6, (rng()-0.5)*1.6, (rng()-0.5)*0.2
  ));
}

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// Cat A: converging on sphere from walls/anchors (40%)
const catA = Math.floor(NUM_LINES * 0.40);
for(let i=0; i<catA && li<NUM_LINES; i++){
  const a = rng()<0.55 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, sphereSurf(a));
}

// Cat B: converging on key (12%)
const catB = Math.floor(NUM_LINES * 0.12);
for(let i=0; i<catB && li<NUM_LINES; i++){
  const a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  setLine(a, keySurf());
}

// Cat C: wall-to-wall threads through sphere region (25%)
const catC = Math.floor(NUM_LINES * 0.25);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(spherePos) > 9 && rng() > 0.15){ i--; continue; }
  setLine(a, b);
}

// Cat D: short local web between nearby anchors — fills remaining
while(li < NUM_LINES){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.12){ bestD = d; best = anchors[bi]; }
  }
  if(!best) best = wallPt();
  setLine(a, best);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── Dark fragments — charred paper, memory shards, caught in threads
const NUM_FRAGS = 30;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03 + rng()*0.12;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz, sz*(0.2+rng()*1.8), sz*(0.3+rng()))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.02 + rng()*0.04;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.55, d*0.45),
    transparent: true, opacity: 0.45 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  const si = Math.floor(rng()*NUM_LINES)*6;
  const t = rng();
  mesh.position.set(
    basePositions[si]*(1-t) + basePositions[si+3]*t,
    basePositions[si+1]*(1-t) + basePositions[si+4]*t,
    basePositions[si+2]*(1-t) + basePositions[si+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
}

// ── Camera — slow dolly THROUGH the densest thread region
// Path: start outside, pass near sphere, continue through, loop back
const dollyPath = [];
const pathLen = 200;
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  // Figure-eight-ish path through the web, centered on sphere
  const phase = t * Math.PI * 2;
  const x = spherePos.x + Math.sin(phase) * 4.5 + Math.sin(phase*2.3)*1.2;
  const y = spherePos.y + Math.sin(phase*0.7 + 1.2) * 2.2 + Math.cos(phase*1.1)*0.8;
  const z = spherePos.z + Math.cos(phase) * 6.0 + Math.sin(phase*0.5)*2.0;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // Tiny breathing jitter on threads — <0.5% length variation
  const breathAmp = 0.01;
  const breathFreq = 0.2;
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<NUM_LINES*6; i+=3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.5 + by*1.1 + bz*0.3;
    const s = Math.sin(t*breathFreq + phase) * breathAmp;
    arr[i]   = bx + s;
    arr[i+1] = by + s*0.7;
    arr[i+2] = bz + s*0.5;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly — slow continuous path through the web
  const speed = 0.006;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward a point that slowly wanders between sphere and key
  const lookBlend = 0.5 + Math.sin(t * 0.019) * 0.4;
  const lookTarget = spherePos.clone().lerp(keyPos, lookBlend);
  lookTarget.x += Math.sin(t*0.027)*0.5;
  lookTarget.y += Math.cos(t*0.019)*0.3;
  camera.lookAt(lookTarget);

  // Key — imperceptible rotation
  keyGroup.rotation.z += 0.0003;
  keyGroup.rotation.x += 0.00015;

  // Sphere slight pulse
  const pulse = 1.0 + Math.sin(t * 0.15) * 0.008;
  sphereMesh.scale.setScalar(pulse);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
