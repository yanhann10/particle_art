<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: gentle -->
<title>93d · audio-reactive wash shells</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size:11px; letter-spacing:0.04em; }
  button.start { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
                 background:rgba(21,10,37,0.85); color:#e5d6f0; border:1px solid #4a2a6a;
                 padding:12px 22px; border-radius:4px; cursor:pointer; z-index:10;
                 font-family:inherit; font-size:13px; letter-spacing:0.06em; }
  button.start:hover { background:#22113a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">93d</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

/* ── geometry: instanced planes ── */
const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;

const basePlane = new THREE.PlaneGeometry(1, 1, 1, 1);
const instGeo = new THREE.InstancedBufferGeometry();
instGeo.index = basePlane.index;
instGeo.setAttribute('position', basePlane.getAttribute('position'));
instGeo.setAttribute('uv', basePlane.getAttribute('uv'));
instGeo.instanceCount = N;

const offsets   = new Float32Array(N * 3);
const shellArr  = new Float32Array(N);
const seedArr   = new Float32Array(N);

for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 4 + s * 2.4;
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    offsets[idx * 3]     = r * Math.sin(phi) * Math.cos(theta);
    offsets[idx * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    offsets[idx * 3 + 2] = r * Math.cos(phi);
    shellArr[idx] = s;
    seedArr[idx]  = Math.random();
  }
}

instGeo.setAttribute('iOffset',   new THREE.InstancedBufferAttribute(offsets, 3));
instGeo.setAttribute('iShellIdx', new THREE.InstancedBufferAttribute(shellArr, 1));
instGeo.setAttribute('iSeed',     new THREE.InstancedBufferAttribute(seedArr, 1));

/* ── uniforms ── */
const uBands = new THREE.Vector4(0, 0, 0, 0);
const uniforms = {
  uTime:   { value: 0 },
  uBands:  { value: uBands },
  uTreble: { value: 0 }
};

/* ── shader material ── */
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */ `
    uniform float uTime;
    uniform vec4  uBands;
    uniform float uTreble;

    attribute vec3  iOffset;
    attribute float iShellIdx;
    attribute float iSeed;

    varying vec3  vCol;
    varying float vAlpha;
    varying vec2  vUv;

    /* build basis that maps local +Z to 'dir' */
    mat3 basisFromDir(vec3 dir) {
      vec3 ref = abs(dir.y) < 0.95 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
      vec3 right = normalize(cross(ref, dir));
      vec3 up    = cross(dir, right);
      return mat3(right, up, dir);
    }

    void main() {
      /* energy for this shell */
      float e;
      if      (iShellIdx < 0.5) e = uBands.x;
      else if (iShellIdx < 1.5) e = uBands.y;
      else if (iShellIdx < 2.5) e = uBands.z;
      else if (iShellIdx < 3.5) e = uBands.w;
      else                       e = uTreble;

      /* ── motion law (unchanged from parent) ── */
      vec3 p = iOffset;
      float r = length(p);
      vec3 dir = p / max(r, 0.001);
      float pulse = 1.0 + e * 0.9;
      p = dir * r * pulse;

      float t = uTime * 0.4 + iSeed * 6.2832 + iShellIdx * 0.7;
      vec3 perp = normalize(cross(dir, vec3(0.0, 1.0, 0.0) + 0.1 * sin(iSeed * 9.0)));
      p += perp * sin(t) * (0.4 + e * 1.2);

      /* ── orientation: align plane normal to radial + seed tilt ── */
      vec3 radial = normalize(p);
      /* tilt by seed for per-flake variation */
      float tiltA = (iSeed - 0.5) * 0.7;
      float tiltB = (fract(iSeed * 7.13) - 0.5) * 0.7;
      vec3 tiltAxis = normalize(cross(radial, vec3(sin(iSeed * 13.0), cos(iSeed * 7.0), sin(iSeed * 11.0))));
      /* Rodrigues tilt */
      float ct = cos(tiltA); float st = sin(tiltA);
      radial = radial * ct + cross(tiltAxis, radial) * st
             + tiltAxis * dot(tiltAxis, radial) * (1.0 - ct);
      radial = normalize(radial);

      mat3 orient = basisFromDir(radial);

      /* plane scale — larger to create wash overlap */
      float scale = 0.45 + 0.3 * iSeed + 0.35 * e;
      vec3 localVert = position * scale;           /* position = plane vertex */
      vec3 worldPos  = p + orient * localVert;

      /* ── palette: sodium-amber → ice-cyan (parent logic) ── */
      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan  = vec3(0.25, 0.85, 0.95);
      float k = clamp(iShellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vCol = mix(amber, cyan, k);
      vCol *= (0.6 + e * 1.4);

      /* ── opacity 0.04–0.12: overlap = composition ── */
      vAlpha = 0.04 + 0.08 * (iSeed * 0.5 + e * 0.5);

      vUv = uv;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(worldPos, 1.0);
    }
  `,
  fragmentShader: /* glsl */ `
    varying vec3  vCol;
    varying float vAlpha;
    varying vec2  vUv;

    void main() {
      /* soft radial falloff — wash, not hard quad */
      vec2 c  = vUv - 0.5;
      float r2 = dot(c, c) * 4.0;          /* 0 at center, 1 at edge */
      float falloff = exp(-r2 * 5.0);       /* gaussian-ish soft disc */
      float a = vAlpha * falloff;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const mesh = new THREE.Mesh(instGeo, mat);
scene.add(mesh);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── audio ── */
const hint     = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio() {
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 frequency shells';
  } catch (e) {
    hint.textContent = 'mic denied — passive synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi) {
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi - lo)) / 255;
}

/* ── render loop ── */
const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  mesh.rotation.y = t * 0.04;
  mesh.rotation.x = Math.sin(t * 0.06) * 0.12;

  if (analyser) {
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n * 0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n * 0.04), Math.floor(n * 0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n * 0.12), Math.floor(n * 0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n * 0.30), Math.floor(n * 0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n * 0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t * 1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t * 2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t * 3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t * 4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t * 7.0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
