<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hn4 · two faces · each incomplete · merge</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070a; overflow:hidden;
               color:#e6dcd6; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 10px; letter-spacing: 0.06em; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading head scan · two figures emerging…</div>
<div class="id">hn4 · two faces · each incomplete · merge</div>
<div class="hint">drag to orbit · click to pull them together / push apart</div>
<div class="src">descended from w64 · burning man emotional infrastructure</div>
<div class="stat" id="stat">apart · 100%</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Two head clouds face each other. Each is INCOMPLETE — random spherical
// regions of particles are missing from each head. The missing regions of
// head A are precisely WHERE head B's existing particles would land if
// B were translated into A's position. So when the two heads are pulled
// together, the missing parts of each are filled by particles from the
// other — they merge into one whole face.
//
// State: uMix ∈ [0,1].  0 = far apart (each head visibly broken).
//                       1 = perfectly overlapped, complete (the merge).
// Click toggles target. Auto-oscillates slowly.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08070a, 0.05);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const N = 50000;        // 25k per head
const PER = N / 2;
const APART_OFFSET = 5.0;   // each head sits at x = ±5 when uMix=0

// ─────────────────────────── data
const restA_far  = new Float32Array(PER * 3);
const restB_far  = new Float32Array(PER * 3);
const restMerged = new Float32Array(N * 3);
const seeds      = new Float32Array(N);
const head      = new Float32Array(N);   // 0 for A, 1 for B

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 },          // 0 = apart, 1 = merged
  uReady: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    uniform float uReady;
    attribute vec3 restFar;     // far-pose position for this particle
    attribute vec3 restMerged;  // merged-pose position
    attribute float seed;
    attribute float head;        // 0 or 1
    varying vec3  vCol;
    varying float vEnergy;
    varying float vHead;
    void main(){
      vHead = head;
      // ease the morph
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(restFar, restMerged, m);

      // breath: tiny shimmer per particle
      float t = uTime * 0.4 + seed * 6.28;
      p += 0.012 * vec3(sin(t), cos(t*1.1), sin(t*0.8));

      // reveal: particles spiral in from a horizontal ring
      float th = seed * 6.28;
      vec3 entry = vec3(cos(th)*15.0, 0.0, sin(th)*15.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.5 + 0.5 * sin(t * 0.8);
      // two head palettes that converge toward white at merge:
      // head A: warm bone (porcelain/ivory)
      // head B: cool steel (ash/pewter)
      // when m=1 both heads share the merge — equal weight on a warm-cool blend
      vec3 colA = vec3(0.95, 0.86, 0.78);   // bone
      vec3 colB = vec3(0.62, 0.72, 0.85);   // steel
      vec3 base = (head < 0.5) ? colA : colB;
      // at merge, all particles drift toward shared cream
      vec3 mergeCol = vec3(0.92, 0.92, 0.88);
      vCol = mix(base, mergeCol, m * 0.7);
      // subtle warm/cool accent variation
      vCol *= (0.85 + 0.30 * vEnergy);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 0.6 * vEnergy) * uPixel * (40.0 / dist) * (0.4 + 0.6 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * (0.45 + 0.40 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

let revealStart = 0;

// ─────────────────────────── load + sample
const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';
const loader = new GLTFLoader();
loader.load(HEAD_URL,
  (gltf) => {
    // collect ALL meshes — pick the largest one (the head proper) by triangle count
    const meshes = [];
    gltf.scene.traverse(o => { if (o.isMesh && o.geometry?.attributes?.position) meshes.push(o); });
    if (meshes.length === 0){ document.getElementById('loading').textContent = 'no mesh'; return; }
    let target = meshes[0];
    for (const m of meshes){
      if ((m.geometry.attributes.position.count) > (target.geometry.attributes.position.count)){
        target = m;
      }
    }
    target.updateMatrixWorld(true);

    // bake transform, normalize to ~6-unit max axis
    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scl = 5 / maxAxis;
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    // sample N points across the surface (this is the merged pose — one full head)
    const tmp = new THREE.Vector3();
    for (let i = 0; i < N; i++){
      sampler.sample(tmp);
      restMerged[i*3]   = tmp.x;
      restMerged[i*3+1] = tmp.y;
      restMerged[i*3+2] = tmp.z;
      seeds[i] = Math.random();
    }

    // build hole structure: 6 spherical regions of "missing" zones, randomly placed.
    // each particle is assigned to head A or head B based on which holes it falls in:
    //   - hole regions for head A → particle belongs to head B (covers what A is missing)
    //   - non-hole regions in A → particle belongs to head A (it stays; B is missing here)
    // result: A has its OWN particles in the non-hole regions; B has particles in
    // exactly the regions A is missing. They are COMPLEMENTARY.
    const holes = [];
    for (let h = 0; h < 6; h++){
      holes.push({
        x: (Math.random() - 0.5) * 4,
        y: (Math.random() - 0.5) * 4,
        z: (Math.random() - 0.5) * 4,
        r: 0.7 + Math.random() * 0.7
      });
    }
    function inAnyHole(x, y, z){
      for (const h of holes){
        const dx = x - h.x, dy = y - h.y, dz = z - h.z;
        if (dx*dx + dy*dy + dz*dz < h.r * h.r) return true;
      }
      return false;
    }

    let countA = 0, countB = 0;
    for (let i = 0; i < N; i++){
      const x = restMerged[i*3], y = restMerged[i*3+1], z = restMerged[i*3+2];
      if (inAnyHole(x, y, z)){
        head[i] = 1;       // belongs to B (filling A's hole)
        countB++;
      } else {
        head[i] = 0;       // belongs to A
        countA++;
      }
    }

    // far-pose positions: head A at x=-APART_OFFSET, head B at x=+APART_OFFSET.
    // Each is rotated +/-90° around Y so they FACE each other.
    // For head A: rotate the merged position so head looks toward +x, then translate to -x
    // For head B: rotate so head looks toward -x, then translate to +x
    const tmpV = new THREE.Vector3();
    const rotA = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI / 2);
    const rotB = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -Math.PI / 2);
    for (let i = 0; i < N; i++){
      tmpV.set(restMerged[i*3], restMerged[i*3+1], restMerged[i*3+2]);
      if (head[i] === 0){
        tmpV.applyQuaternion(rotA);
        tmpV.x -= APART_OFFSET;
      } else {
        tmpV.applyQuaternion(rotB);
        tmpV.x += APART_OFFSET;
      }
      // store in the per-head buffers for shader's restFar attribute
      // (we store it in a single per-particle far buffer — one array, indexed by particle)
      // but I declared restA_far and restB_far separately above; instead just use restFar buffer
    }

    // build one per-particle "restFar" array
    const restFar = new Float32Array(N * 3);
    for (let i = 0; i < N; i++){
      tmpV.set(restMerged[i*3], restMerged[i*3+1], restMerged[i*3+2]);
      const q = (head[i] === 0) ? rotA : rotB;
      tmpV.applyQuaternion(q);
      tmpV.x += (head[i] === 0) ? -APART_OFFSET : APART_OFFSET;
      restFar[i*3]   = tmpV.x;
      restFar[i*3+1] = tmpV.y;
      restFar[i*3+2] = tmpV.z;
    }

    geom.setAttribute('position',   new THREE.BufferAttribute(restFar.slice(), 3));
    geom.setAttribute('restFar',    new THREE.BufferAttribute(restFar, 3));
    geom.setAttribute('restMerged', new THREE.BufferAttribute(restMerged, 3));
    geom.setAttribute('seed',       new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('head',       new THREE.BufferAttribute(head, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
    document.getElementById('stat').textContent = `apart · A=${countA} B=${countB}`;
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading head scan · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; });

// ─────────────────────────── interaction
let target = 0;
let mix = 0;
addEventListener('click', () => { target = 1 - target; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 2400);
  }

  // auto-oscillate slowly so the thumbnail catches a meaningful state
  // (Math.floor(t/9) % 2 alternates 0 and 1 every 9s)
  const auto = (Math.floor(t / 9) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  mix += (desired - mix) * 0.018;
  uniforms.uMix.value = mix;

  if (revealStart > 0){
    const pct = Math.round(mix * 100);
    statEl.textContent = mix < 0.5
      ? `apart · merge ${pct}%`
      : `merging · ${pct}%`;
  }

  // gentle camera oscillation — mostly orbit-controls
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
