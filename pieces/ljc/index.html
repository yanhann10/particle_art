<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ljc · zimoun mechanical yo-yo slices</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08070b; overflow:hidden;
               color:#dcd4d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading head scan …</div>
<div class="id">ljc</div>
<div class="hint">drag to orbit · scroll to zoom</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08070b, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const N = 60000;
const NUM_SLICES = 14;

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uReady:     { value: 0 },
  uSliceY:    { value: new Float32Array(NUM_SLICES) },
  uSliceSpread: { value: new Float32Array(NUM_SLICES) },
  uFlash:     { value: 0 },
  uFogColor:  { value: new THREE.Color(0x08070b) },
  uFogDensity:{ value: 0.032 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uSliceY[${NUM_SLICES}];
    uniform float uSliceSpread[${NUM_SLICES}];
    uniform float uFlash;
    attribute vec3 rest;
    attribute float seed;
    attribute float sliceId;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;

    void main(){
      float sid = sliceId;
      int si = int(sid);

      // base position
      vec3 p = rest;

      // reveal: spiral in
      float th = seed * 6.28;
      vec3 entry = vec3(cos(th) * 14.0, p.y * 0.2, sin(th) * 14.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // yo-yo displacement per slice
      float yoOffset = 0.0;
      float spreadAmt = 0.0;
      for (int i = 0; i < ${NUM_SLICES}; i++) {
        if (i == si) {
          yoOffset = uSliceY[i];
          spreadAmt = uSliceSpread[i];
        }
      }

      // apply yo-yo: drop the slice down, plus slight horizontal spread when extended
      p.y += yoOffset * uReady;
      // spread particles outward from center when slice is extended (string tension visual)
      float ext = abs(yoOffset) / 3.5;
      p.x *= 1.0 + spreadAmt * 0.12 * ext;
      p.z *= 1.0 + spreadAmt * 0.12 * ext;

      float t = uTime * 0.5 + seed * 6.28;
      p += 0.008 * vec3(sin(t), cos(t * 1.1), sin(t * 0.7));

      // color: porcelain base, warm gold flash on snap-back
      vec3 porcelain = vec3(0.88, 0.83, 0.80);
      vec3 graphite  = vec3(0.38, 0.35, 0.37);
      vec3 gold      = vec3(1.0, 0.82, 0.36);
      float k = 0.4 + 0.35 * sin(seed * 9.0) + 0.15 * (0.5 + 0.5 * sin(t * 0.8));
      k = clamp(k, 0.0, 1.0);
      vCol = mix(porcelain, graphite, k);

      // flash gold when snapping back
      float sliceFlashPhase = fract(sid / float(${NUM_SLICES}));
      float flashK = uFlash * smoothstep(0.0, 0.15, 1.0 - abs(sliceFlashPhase - fract(uTime * 0.11)));
      vCol = mix(vCol, gold, flashK * 0.6);

      // string particles: faint line from slice top to original position when displaced
      float energy = 0.5 + 0.5 * sin(t * 0.8);
      vAlpha = (0.40 + 0.30 * energy) * (0.3 + 0.7 * uReady);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vFogDepth = -mv.z;
      float dist = -mv.z;
      gl_PointSize = (0.8 + 0.4 * energy) * uPixel * (42.0 / dist) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      vec3 col = vCol * a;
      // manual fog
      float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
      col = mix(col, uFogColor * a, fogFactor);
      gl_FragColor = vec4(col, a);
    }
  `
});

// string material: thin lines connecting slices to their anchor
const stringMat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uReady;
    varying float vA;
    attribute float alpha;
    void main(){
      vA = alpha * uReady;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    void main(){
      gl_FragColor = vec4(vec3(0.65, 0.60, 0.56), vA * 0.18);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

// string geometry: one line per slice from top anchor to slice center
const stringGeom = new THREE.BufferGeometry();
const stringPositions = new Float32Array(NUM_SLICES * 2 * 3);
const stringAlphas = new Float32Array(NUM_SLICES * 2);
for (let i = 0; i < NUM_SLICES; i++) {
  stringAlphas[i * 2] = 1.0;
  stringAlphas[i * 2 + 1] = 0.5;
}
stringGeom.setAttribute('position', new THREE.BufferAttribute(stringPositions, 3));
stringGeom.setAttribute('alpha', new THREE.BufferAttribute(stringAlphas, 1));
const strings = new THREE.LineSegments(stringGeom, stringMat);
scene.add(strings);

let revealStart = 0;
const sliceCenters = new Float32Array(NUM_SLICES); // rest Y center per slice
const slicePhases = new Float32Array(NUM_SLICES);
for (let i = 0; i < NUM_SLICES; i++) slicePhases[i] = Math.random() * Math.PI * 2;

const HEAD_URL = 'https://threejs.org/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';
const loader = new GLTFLoader();
loader.load(HEAD_URL,
  (gltf) => {
    let target = null;
    gltf.scene.traverse(o => { if (!target && o.isMesh && o.geometry?.attributes?.position) target = o; });
    if (!target) { document.getElementById('loading').textContent = 'no mesh'; return; }
    target.updateMatrixWorld(true);

    const g = target.geometry.clone();
    g.applyMatrix4(target.matrixWorld);
    g.computeBoundingBox();
    const bb = g.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scl = 8 / maxAxis;
    g.translate(-center.x, -center.y, -center.z);
    g.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(g.toNonIndexed(), target.material);
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const restPos = new Float32Array(N * 3);
    const seeds = new Float32Array(N);
    const sliceIds = new Float32Array(N);
    const tmp = new THREE.Vector3();

    // sample all points first to find Y range
    for (let i = 0; i < N; i++) {
      sampler.sample(tmp);
      restPos[i * 3] = tmp.x;
      restPos[i * 3 + 1] = tmp.y;
      restPos[i * 3 + 2] = tmp.z;
      seeds[i] = Math.random();
    }

    // find Y bounds
    let yMin = Infinity, yMax = -Infinity;
    for (let i = 0; i < N; i++) {
      const y = restPos[i * 3 + 1];
      if (y < yMin) yMin = y;
      if (y > yMax) yMax = y;
    }
    const yRange = yMax - yMin;

    // assign slices & compute slice centers
    const sliceCount = new Float32Array(NUM_SLICES);
    const sliceSumY = new Float32Array(NUM_SLICES);
    for (let i = 0; i < N; i++) {
      const y = restPos[i * 3 + 1];
      const norm = (y - yMin) / yRange;
      const si = Math.min(NUM_SLICES - 1, Math.floor(norm * NUM_SLICES));
      sliceIds[i] = si;
      sliceSumY[si] += y;
      sliceCount[si]++;
    }
    for (let i = 0; i < NUM_SLICES; i++) {
      sliceCenters[i] = sliceCount[i] > 0 ? sliceSumY[i] / sliceCount[i] : 0;
    }

    geom.setAttribute('position', new THREE.BufferAttribute(restPos.slice(), 3));
    geom.setAttribute('rest', new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('sliceId', new THREE.BufferAttribute(sliceIds, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading head scan · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// yo-yo physics per slice
// Each slice has its own phase. They do a cascading drop-and-return like
// a Zimoun installation: mechanical, repetitive, slightly out of sync.
function yoyoDisplacement(t, phase, sliceIdx) {
  // period ~4s per yo-yo cycle, staggered by slice
  const period = 3.8 + sliceIdx * 0.07;
  const stagger = sliceIdx * 0.35;
  const ct = Math.max(0, t - 2.5 - stagger); // start after reveal + stagger
  const cycle = ct / period;
  const frac = cycle - Math.floor(cycle);

  // yo-yo shape: fast drop (0→0.3), hang (0.3→0.4), snap back (0.4→0.55), settle (0.55→1.0)
  let drop = 0;
  if (frac < 0.25) {
    // accelerating drop
    const f = frac / 0.25;
    drop = f * f;
  } else if (frac < 0.38) {
    // hang at bottom with slight bounce
    const f = (frac - 0.25) / 0.13;
    drop = 1.0 - 0.08 * Math.sin(f * Math.PI);
  } else if (frac < 0.52) {
    // snap back up
    const f = (frac - 0.38) / 0.14;
    drop = 1.0 - f * f * f; // cubic ease-in for fast snap
  } else {
    // gentle settle with micro-oscillation
    const f = (frac - 0.52) / 0.48;
    drop = 0.04 * Math.sin(f * Math.PI * 3) * Math.exp(-f * 4);
  }

  // max drop distance: varies by slice (top slices drop more, like longer string)
  const maxDrop = 1.2 + (NUM_SLICES - 1 - sliceIdx) * 0.18;
  return -drop * maxDrop * Math.min(1, ct * 0.5); // fade in displacement
}

const topAnchorY = 6.0; // where strings attach above the head
const start = performance.now();

function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    const reveal = Math.min(1.0, (performance.now() - revealStart) / 2400);
    uniforms.uReady.value = reveal;

    // compute per-slice yo-yo offsets
    let centroidY = 0;
    let flashAccum = 0;
    for (let i = 0; i < NUM_SLICES; i++) {
      const disp = yoyoDisplacement(elapsed, slicePhases[i], i);
      uniforms.uSliceY.value[i] = disp;
      uniforms.uSliceSpread.value[i] = Math.abs(disp) > 0.3 ? 1.0 : 0.0;
      centroidY += (sliceCenters[i] + disp) / NUM_SLICES;

      // flash when snapping back (large positive velocity moment)
      const disp2 = yoyoDisplacement(elapsed + 0.016, slicePhases[i], i);
      const vel = (disp2 - disp) / 0.016;
      if (vel > 2.0) flashAccum += (vel - 2.0) * 0.1;
    }
    uniforms.uFlash.value = Math.min(1, flashAccum);

    // update string geometry: line from anchor to slice center
    const sp = strings.geometry.attributes.position.array;
    for (let i = 0; i < NUM_SLICES; i++) {
      const yOff = uniforms.uSliceY.value[i];
      // top anchor
      sp[i * 6 + 0] = 0;
      sp[i * 6 + 1] = topAnchorY;
      sp[i * 6 + 2] = 0;
      // slice center
      sp[i * 6 + 3] = 0;
      sp[i * 6 + 4] = sliceCenters[i] + yOff;
      sp[i * 6 + 5] = 0;
    }
    strings.geometry.attributes.position.needsUpdate = true;

    // camera tracks centroid Y so yo-yo arc stays in frame
    const targetCamY = centroidY * 0.4;
    camera.position.y += (targetCamY - camera.position.y) * 0.03;
    controls.target.y += (centroidY * 0.3 - controls.target.y) * 0.03;
  }

  // slow auto-rotate
  points.rotation.y = Math.sin(elapsed * 0.15) * 0.4 + elapsed * 0.04;
  strings.rotation.y = points.rotation.y;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
