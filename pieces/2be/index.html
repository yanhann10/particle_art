<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2be · cosmic web</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">2be</div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Voronoi-edge cosmic web (IllustrisTNG / MillenniumTNG topology) ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(60, 45, 80);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

/* Generate Voronoi cells in cube [-50,50]^3 */
const NCELLS = 200;
const BOUNDS = 50;
const sites = [];
for (let i = 0; i < NCELLS; i++){
  sites.push(new THREE.Vector3(
    (Math.random() - 0.5) * 2 * BOUNDS,
    (Math.random() - 0.5) * 2 * BOUNDS,
    (Math.random() - 0.5) * 2 * BOUNDS
  ));
}

/* Build Delaunay tetrahedralization edges — Voronoi dual */
function delaunayEdges(pts){
  const edges = new Set();
  /* naive O(n²) pair-based edge generation: connect each site to K nearest */
  const K = 6;
  for (let i = 0; i < pts.length; i++){
    const dists = [];
    for (let j = 0; j < pts.length; j++){
      if (i === j) continue;
      dists.push({ idx: j, d: pts[i].distanceTo(pts[j]) });
    }
    dists.sort((a, b) => a.d - b.d);
    for (let k = 0; k < Math.min(K, dists.length); k++){
      const j = dists[k].idx;
      const key = i < j ? `${i}-${j}` : `${j}-${i}`;
      edges.add(key);
    }
  }
  const result = [];
  for (const key of edges){
    const [a, b] = key.split('-').map(Number);
    result.push({ a: pts[a], b: pts[b], len: pts[a].distanceTo(pts[b]) });
  }
  return result;
}
const edges = delaunayEdges(sites);

/* Distribute 50k particles along filaments (edges) with Gaussian perpendicular falloff */
const N = 50000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const edgeIDs = new Float32Array(N);

const totalLen = edges.reduce((s, e) => s + e.len, 0);
let written = 0;
for (let i = 0; i < edges.length && written < N; i++){
  const e = edges[i];
  const share = Math.max(1, Math.floor(N * e.len / totalLen));
  for (let k = 0; k < share && written < N; k++){
    const t = Math.random();
    const mid = new THREE.Vector3().lerpVectors(e.a, e.b, t);
    /* Gaussian perpendicular displacement — filament has "width" */
    const dir = new THREE.Vector3().subVectors(e.b, e.a).normalize();
    const perp1 = new THREE.Vector3(dir.y, -dir.x, 0).normalize();
    if (perp1.length() < 0.01) perp1.set(0, 0, 1);
    const perp2 = new THREE.Vector3().crossVectors(dir, perp1).normalize();
    /* box-muller Gaussian */
    const u1 = Math.random(), u2 = Math.random();
    const rad = Math.sqrt(-2 * Math.log(u1 + 1e-9)) * 0.6;
    const theta = 2 * Math.PI * u2;
    mid.addScaledVector(perp1, rad * Math.cos(theta));
    mid.addScaledVector(perp2, rad * Math.sin(theta));

    positions[written * 3]     = mid.x;
    positions[written * 3 + 1] = mid.y;
    positions[written * 3 + 2] = mid.z;
    velocities[written * 3]     = 0;
    velocities[written * 3 + 1] = 0;
    velocities[written * 3 + 2] = 0;
    seeds[written] = Math.random();
    edgeIDs[written] = i;
    written++;
  }
}

/* Place dense cluster particles at nodes (sites) */
const clusterN = Math.min(3000, N - written);
for (let i = 0; i < clusterN && written < N; i++){
  const site = sites[Math.floor(Math.random() * sites.length)];
  /* tight cluster around node */
  const r = Math.random() * 1.5;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const x = site.x + r * Math.sin(phi) * Math.cos(theta);
  const y = site.y + r * Math.sin(phi) * Math.sin(theta);
  const z = site.z + r * Math.cos(phi);
  positions[written * 3]     = x;
  positions[written * 3 + 1] = y;
  positions[written * 3 + 2] = z;
  velocities[written * 3]     = 0;
  velocities[written * 3 + 1] = 0;
  velocities[written * 3 + 2] = 0;
  seeds[written] = Math.random();
  edgeIDs[written] = -1;
  written++;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('edgeID', new THREE.BufferAttribute(edgeIDs, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute float seed;
    attribute float edgeID;
    attribute vec3 velocity;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.08 + seed * 6.28;

      /* particles drift toward nearest node (gravitational infall) */
      p += velocity * uTime * 0.15;

      /* filament turbulence — slow undulation */
      if (edgeID >= 0.0){
        float wave = sin(t * 0.5 + p.x * 0.02) * cos(t * 0.6 + p.y * 0.02);
        p += vec3(wave * 0.3, wave * 0.2, wave * 0.25);
      }

      /* reveal animation — fade in from origin */
      vec3 entry = vec3(0.0, 0.0, 0.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* distance from origin — for color mapping */
      float distFromOrigin = length(p);
      float edgeDist = distFromOrigin / 70.0;

      /* IllustrisTNG palette: blue-white core, golden filaments, magenta clusters */
      vec3 coreWhite = vec3(0.95, 0.98, 1.0);
      vec3 filamentGold = vec3(0.88, 0.65, 0.35);
      vec3 clusterMagenta = vec3(0.82, 0.35, 0.68);
      vec3 voidBlue = vec3(0.12, 0.18, 0.35);

      vec3 col;
      if (edgeID < 0.0){
        /* cluster particle — hot magenta */
        col = mix(coreWhite, clusterMagenta, 0.6);
        vAlpha = 0.9 + 0.1 * sin(t * 2.0);
      } else {
        /* filament particle — golden near nodes, cool mid-filament */
        float energy = 0.5 + 0.5 * sin(t * 0.8 + seed * 10.0);
        col = mix(filamentGold, voidBlue, smoothstep(0.0, 1.0, edgeDist));
        col = mix(col, coreWhite, (1.0 - edgeDist) * 0.3);
        vAlpha = (0.4 + 0.3 * energy) * (1.0 - edgeDist * 0.5);
      }

      vCol = col * uReady;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float baseSize = edgeID < 0.0 ? 3.5 : 1.8;
      gl_PointSize = baseSize * uPixel * (50.0 / dist) * uReady;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

/* Compute initial velocities toward nearest site */
const vel = geom.attributes.velocity.array;
for (let i = 0; i < written; i++){
  const px = positions[i * 3];
  const py = positions[i * 3 + 1];
  const pz = positions[i * 3 + 2];
  let minD = Infinity, nearest = null;
  for (const s of sites){
    const d = Math.hypot(s.x - px, s.y - py, s.z - pz);
    if (d < minD){ minD = d; nearest = s; }
  }
  if (nearest){
    const dx = nearest.x - px;
    const dy = nearest.y - py;
    const dz = nearest.z - pz;
    const mag = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (mag > 1e-6){
      vel[i * 3]     = (dx / mag) * 0.15;
      vel[i * 3 + 1] = (dy / mag) * 0.15;
      vel[i * 3 + 2] = (dz / mag) * 0.15;
    }
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
const revealDuration = 3000;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;
  uniforms.uReady.value = Math.min(1.0, (now - start) / revealDuration);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
