<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>talisman · physarum inscription · carved stone amulet</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#05060a; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
      color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
</style>
</head>
<body>
<div class="id">trx</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/*
  Talisman: carved stone amulet bearing slime-mold inscription.
  The Physarum network is no longer simulated substrate — it becomes
  the *form itself*, trails extruded as raised relief ridges across
  a breathing stone disc. Food sources become inset gemstone nodes
  that catch rim light. The object pulses with total trail energy.

  Ref: Mesopotamian cylinder seals (raised inscription); Etruscan
  gemstone amulets with biological motifs (liver of Piacenza).
  Visual: Andreas Gysin — computational talismans as ritual objects.

  Palette (oxidized bronze + jade):
    #05060a — void background
    #2a2418 — aged bronze disc base
    #5a8a18 — jade inscription (high trails)
    #c89830 — amber gemstone nodes (food sources)
*/

// ─── Physarum simulation (inherited from parent) ───
const W = 128, H = 128;
const trail = new Float32Array(W * H);
const trailB = new Float32Array(W * H);

const foods = [
  { x: 0.14, y: 0.28 }, { x: 0.71, y: 0.15 },
  { x: 0.38, y: 0.76 }, { x: 0.84, y: 0.62 },
  { x: 0.52, y: 0.42 }, { x: 0.22, y: 0.60 },
  { x: 0.90, y: 0.38 }, { x: 0.60, y: 0.85 },
];

const N_AGENTS = 2400;
const ax = new Float32Array(N_AGENTS);
const ay = new Float32Array(N_AGENTS);
const aa = new Float32Array(N_AGENTS);

for (let i = 0; i < N_AGENTS; i++) {
  const f = foods[i % foods.length];
  ax[i] = (f.x + (Math.random() - 0.5) * 0.06) * W;
  ay[i] = (f.y + (Math.random() - 0.5) * 0.06) * H;
  aa[i] = Math.random() * Math.PI * 2;
}

const SA = 0.52, SD = 7.0, TS = 0.38, MS = 1.0;
const DEPOSIT = 0.7, DECAY = 0.965, DIFFUSE = 0.16;

function sense(px, py, angle) {
  const sx = Math.round(px + Math.cos(angle) * SD);
  const sy = Math.round(py + Math.sin(angle) * SD);
  if (sx < 0 || sx >= W || sy < 0 || sy >= H) return 0;
  return trail[sy * W + sx];
}

function simStep() {
  for (let i = 0; i < N_AGENTS; i++) {
    const sL = sense(ax[i], ay[i], aa[i] - SA);
    const sC = sense(ax[i], ay[i], aa[i]);
    const sR = sense(ax[i], ay[i], aa[i] + SA);
    if (sC >= sL && sC >= sR) { }
    else if (sL > sR) aa[i] -= TS * (0.5 + Math.random() * 0.5);
    else if (sR > sL) aa[i] += TS * (0.5 + Math.random() * 0.5);
    else aa[i] += (Math.random() - 0.5) * TS * 2;

    ax[i] += Math.cos(aa[i]) * MS;
    ay[i] += Math.sin(aa[i]) * MS;
    if (ax[i] < 0) ax[i] += W; if (ax[i] >= W) ax[i] -= W;
    if (ay[i] < 0) ay[i] += H; if (ay[i] >= H) ay[i] -= H;

    const ix = ~~ax[i], iy = ~~ay[i];
    trail[iy * W + ix] = Math.min(trail[iy * W + ix] + DEPOSIT, 8.0);
  }
  for (const f of foods) {
    const fx = ~~(f.x * W), fy = ~~(f.y * H);
    for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
      const px = fx + dx, py = fy + dy;
      if (px >= 0 && px < W && py >= 0 && py < H)
        trail[py * W + px] = Math.min(trail[py * W + px] + 1.8, 10.0);
    }
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let sum = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      sum += trail[((y + dy + H) % H) * W + (x + dx + W) % W]; c++;
    }
    trailB[y * W + x] = (trail[y * W + x] * (1 - DIFFUSE) + (sum / c) * DIFFUSE) * DECAY;
  }
  for (let i = 0; i < W * H; i++) trail[i] = trailB[i];
}

for (let i = 0; i < 400; i++) simStep();

// ─── Three.js scene ───
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

// ritual lighting — single warm rim from above-right
const key = new THREE.DirectionalLight(0xc89830, 1.8);
key.position.set(4, 8, 3);
scene.add(key);
scene.add(new THREE.AmbientLight(0x0a0a08, 0.15));

// back rim for depth
const rim = new THREE.DirectionalLight(0x5a8a18, 0.4);
rim.position.set(-2, 3, -4);
scene.add(rim);

// ─── Disc geometry with displacement ───
const DISC_R = 3.5;
const discGeo = new THREE.PlaneGeometry(DISC_R * 2, DISC_R * 2, W - 1, H - 1);
const discPos = discGeo.attributes.position;

// heightmap from trail — store original Z for animation
const baseZ = new Float32Array(discPos.count);
for (let i = 0; i < discPos.count; i++) baseZ[i] = discPos.getZ(i);

function updateDiscHeight() {
  const maxH = 0.35; // max relief height
  for (let i = 0; i < discPos.count; i++) {
    const vx = discPos.getX(i);
    const vy = discPos.getY(i);
    // map vertex world → trail UV
    const u = (vx / (DISC_R * 2) + 0.5);
    const v = (vy / (DISC_R * 2) + 0.5);
    const tx = Math.floor(u * W);
    const ty = Math.floor(v * H);
    if (tx >= 0 && tx < W && ty >= 0 && ty < H) {
      const val = trail[ty * W + tx];
      const h = Math.pow(Math.min(val / 5.0, 1.0), 1.2) * maxH;
      discPos.setZ(i, baseZ[i] + h);
    }
  }
  discPos.needsUpdate = true;
  discGeo.computeVertexNormals();
}

updateDiscHeight();

// disc material — aged bronze base, jade-tinted relief
const discMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vHeight;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vPos = (modelMatrix * vec4(position, 1.0)).xyz;
      vHeight = position.z;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    uniform float fogDensity;
    varying vec3 vNormal;
    varying vec3 vPos;
    varying float vHeight;

    void main() {
      // base bronze
      vec3 base = vec3(0.165, 0.141, 0.094);
      // jade inscription on raised areas
      vec3 jade = vec3(0.353, 0.541, 0.094);
      float t = smoothstep(0.0, 0.3, vHeight);
      vec3 col = mix(base, jade, t * 0.7);

      // rim lighting
      float rim = pow(1.0 - abs(dot(vNormal, vec3(0, 0, 1))), 2.5);
      col += vec3(0.6, 0.5, 0.3) * rim * 0.4;

      // manual fog
      float depth = length(vPos - cameraPosition);
      float fogFactor = 1.0 - exp(-fogDensity * fogDensity * depth * depth);
      col = mix(col, fogColor, fogFactor);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  uniforms: {
    fogColor: { value: scene.fog.color },
    fogDensity: { value: scene.fog.density }
  },
  side: THREE.DoubleSide,
});

const disc = new THREE.Mesh(discGeo, discMat);
scene.add(disc);

// ─── Gemstone nodes at food sources (inset into disc surface) ───
const gemGeo = new THREE.OctahedronGeometry(0.18, 1);
const gemMat = new THREE.MeshStandardMaterial({
  color: 0xc89830, emissive: 0x6a4818, emissiveIntensity: 0.8,
  roughness: 0.25, metalness: 0.4,
});

const gems = [];
for (const f of foods) {
  const wx = (f.x - 0.5) * DISC_R * 2;
  const wy = (f.y - 0.5) * DISC_R * 2;
  const gem = new THREE.Mesh(gemGeo, gemMat);
  gem.position.set(wx, wy, 0.08); // slightly recessed into relief
  gem.rotation.set(Math.random() * 0.4, Math.random() * 0.4, Math.random() * Math.PI * 2);
  disc.add(gem); // parent to disc so it rotates with it
  gems.push(gem);
}

// ─── Instanced ridge tubes along trail gradients ───
// Extract high-intensity trail positions and build tubes
const TUBE_THRESHOLD = 2.5;
const tubePositions = [];
for (let y = 1; y < H - 1; y++) {
  for (let x = 1; x < W - 1; x++) {
    const v = trail[y * W + x];
    if (v > TUBE_THRESHOLD) {
      // gradient direction
      const gx = trail[y * W + (x + 1)] - trail[y * W + (x - 1)];
      const gy = trail[(y + 1) * W + x] - trail[(y - 1) * W + x];
      const wx = (x / W - 0.5) * DISC_R * 2;
      const wy = (y / H - 0.5) * DISC_R * 2;
      const h = Math.pow(Math.min(v / 5.0, 1.0), 1.2) * 0.35;
      tubePositions.push({ x: wx, y: wy, z: h, gx, gy, v });
    }
  }
}

// Build instanced thin tubes
const tubeGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.08, 4, 1);
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0x5a8a18, emissive: 0x2a3808, emissiveIntensity: 0.5,
  roughness: 0.6, metalness: 0.2,
});
const tubes = new THREE.InstancedMesh(tubeGeo, tubeMat, tubePositions.length);
disc.add(tubes);

const dummy = new THREE.Object3D();
tubePositions.forEach((p, i) => {
  dummy.position.set(p.x, p.y, p.z);
  const ang = Math.atan2(p.gy, p.gx);
  dummy.rotation.set(Math.PI / 2, 0, ang);
  dummy.scale.y = 0.8 + (p.v / 8.0) * 0.5;
  dummy.updateMatrix();
  tubes.setMatrixAt(i, dummy.matrix);
});
tubes.instanceMatrix.needsUpdate = true;

// ─── Grain overlay ───
const grainCvs = document.createElement('canvas');
grainCvs.width = 256; grainCvs.height = 256;
const gctx = grainCvs.getContext('2d');
const grainTex = new THREE.CanvasTexture(grainCvs);
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const grainPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.MeshBasicMaterial({ map: grainTex, transparent: true, depthTest: false, opacity: 0.08 })
);
grainPlane.renderOrder = 999;
grainScene.add(grainPlane);

function updateGrain() {
  const d = gctx.createImageData(256, 256).data.buffer;
  const u8 = new Uint8ClampedArray(d);
  for (let i = 0; i < 256 * 256; i++) {
    const v = Math.random() * 15;
    u8[i * 4] = u8[i * 4 + 1] = u8[i * 4 + 2] = v;
    u8[i * 4 + 3] = 25;
  }
  gctx.putImageData(new ImageData(u8, 256, 256), 0, 0);
  grainTex.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
let fc = 0;

// compute total trail energy for breathing scale
function totalEnergy() {
  let sum = 0;
  for (let i = 0; i < W * H; i++) sum += trail[i];
  return sum / (W * H);
}

function loop() {
  const t = (performance.now() - t0) / 1000;

  simStep();
  if (fc % 2 === 0) updateDiscHeight();

  // breathing scale keyed to trail energy
  const energy = totalEnergy();
  const breathe = 1.0 + Math.sin(t * 0.4) * 0.03 + (energy / 2.0) * 0.02;
  disc.scale.set(breathe, breathe, breathe);

  // slow rotation + gentle wobble
  disc.rotation.z = t * 0.08;
  disc.rotation.x = Math.sin(t * 0.15) * 0.08;
  disc.rotation.y = Math.cos(t * 0.12) * 0.05;

  // camera: slow orbit, slightly off-axis
  const ca = t * 0.04;
  const cr = 8 + Math.sin(t * 0.06) * 0.8;
  const ch = 3 + Math.cos(t * 0.07) * 0.6;
  camera.position.set(Math.cos(ca) * cr, ch, Math.sin(ca) * cr);
  camera.lookAt(0, 0, 0);

  renderer.autoClear = true;
  renderer.render(scene, camera);

  if (fc % 3 === 0) updateGrain();
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);

  fc++;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
