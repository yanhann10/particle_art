<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cl2 · esoteric mandala · hilma af klint</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a080c; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">cl2</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a080c, 1);
document.body.appendChild(renderer.domElement);

const N = 60000;
const positions = new Float32Array(N * 3);
const rest = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const bands = new Float32Array(N); // which concentric band 0-1
const roles = new Float32Array(N); // 0=ring, 1=petal, 2=spiral, 3=triangle

// Hilma af Klint mandala geometry
// Band 0: central eye (small dense circle)
// Band 1-3: concentric rings with petal overlaps
// Band 4: spiral arms radiating outward
// Band 5: outer triangulated subdivisions
// Band 6: outermost ring with symbolic dots

const PI2 = Math.PI * 2;
let idx = 0;

function place(x, y, z, band, role) {
  if (idx >= N) return;
  rest[idx*3] = x;
  rest[idx*3+1] = y;
  rest[idx*3+2] = z;
  seeds[idx] = Math.random();
  bands[idx] = band;
  roles[idx] = role;
  idx++;
}

// Central eye - dense filled circle (r=0..1.2)
for (let i = 0; i < 4000; i++) {
  const r = Math.sqrt(Math.random()) * 1.2;
  const a = Math.random() * PI2;
  place(Math.cos(a)*r, Math.sin(a)*r, 0, 0, 0);
}

// Ring 1 - r~2.2, thin
for (let i = 0; i < 3000; i++) {
  const a = Math.random() * PI2;
  const r = 2.2 + (Math.random()-0.5)*0.15;
  place(Math.cos(a)*r, Math.sin(a)*r, 0, 0.15, 0);
}

// Petal layer 1 - 7 petals at r~2.5-4
const petalCount1 = 7;
for (let i = 0; i < 8000; i++) {
  const petal = Math.floor(Math.random() * petalCount1);
  const baseAngle = (petal / petalCount1) * PI2;
  const spread = (Math.random()-0.5) * 0.38;
  const a = baseAngle + spread;
  // petal shape: ellipse elongated radially
  const along = 2.5 + Math.random() * 1.8;
  const across = spread * along * 0.5;
  const x = Math.cos(a) * along;
  const y = Math.sin(a) * along;
  const z = Math.sin(along * 0.8) * 0.3; // slight dome
  place(x, y, z, 0.3, 1);
}

// Ring 2 - r~4.5
for (let i = 0; i < 3000; i++) {
  const a = Math.random() * PI2;
  const r = 4.5 + (Math.random()-0.5)*0.12;
  place(Math.cos(a)*r, Math.sin(a)*r, 0, 0.4, 0);
}

// Petal layer 2 - 12 petals at r~4.8-6.5, offset
const petalCount2 = 12;
for (let i = 0; i < 10000; i++) {
  const petal = Math.floor(Math.random() * petalCount2);
  const baseAngle = (petal / petalCount2) * PI2 + PI2/(petalCount2*2);
  const spread = (Math.random()-0.5) * 0.25;
  const a = baseAngle + spread;
  const along = 4.8 + Math.random() * 1.7;
  const z = Math.sin((along-4.8)*1.2) * 0.4;
  place(Math.cos(a)*along, Math.sin(a)*along, z, 0.55, 1);
}

// Ring 3 - r~7
for (let i = 0; i < 3500; i++) {
  const a = Math.random() * PI2;
  const r = 7.0 + (Math.random()-0.5)*0.15;
  place(Math.cos(a)*r, Math.sin(a)*r, 0, 0.65, 0);
}

// Spiral arms - 3 golden spirals from center outward
for (let i = 0; i < 8000; i++) {
  const arm = Math.floor(Math.random() * 3);
  const t = Math.random();
  const r = 1.5 + t * 6.5;
  const a = arm * PI2/3 + t * PI2 * 1.5 + (Math.random()-0.5)*0.18;
  const z = Math.sin(t * Math.PI) * 0.6;
  place(Math.cos(a)*r, Math.sin(a)*r, z, t, 2);
}

// Triangulated subdivisions - 6 triangles arranged around r~8-10
for (let i = 0; i < 9000; i++) {
  const tri = Math.floor(Math.random() * 6);
  const baseAngle = (tri / 6) * PI2;
  // triangle vertices
  const t1 = Math.random(), t2 = Math.random();
  const s = t1 + t2 > 1 ? 1-t1 : t1;
  const u = t1 + t2 > 1 ? 1-t2 : t2;
  // triangle from r=8 pointing outward
  const innerR = 7.8, outerR = 10.0, halfW = 0.42;
  const rr = innerR + (outerR - innerR) * s;
  const aa = baseAngle + (u - 0.5) * halfW * (1.0 - s*0.6);
  const z = s * 0.3;
  place(Math.cos(aa)*rr, Math.sin(aa)*rr, z, 0.8, 3);
}

// Outermost ring - r~10.5
for (let i = 0; i < 4000; i++) {
  const a = Math.random() * PI2;
  const r = 10.5 + (Math.random()-0.5)*0.2;
  place(Math.cos(a)*r, Math.sin(a)*r, 0, 1.0, 0);
}

// Symbolic dots on outer ring - 24 clusters
for (let i = 0; i < 7500 && idx < N; i++) {
  const dot = Math.floor(Math.random() * 24);
  const baseAngle = (dot / 24) * PI2;
  const r = 10.5;
  const cx = Math.cos(baseAngle) * r;
  const cy = Math.sin(baseAngle) * r;
  const spread = 0.25;
  place(cx + (Math.random()-0.5)*spread, cy + (Math.random()-0.5)*spread, (Math.random()-0.5)*0.1, 1.0, 0);
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('rest', new THREE.BufferAttribute(rest, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('band', new THREE.BufferAttribute(bands, 1));
geom.setAttribute('role', new THREE.BufferAttribute(roles, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReveal: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReveal;
    attribute vec3 rest;
    attribute float seed;
    attribute float band;
    attribute float role;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      float t = uTime;

      // radial bloom reveal: particles appear from center outward
      float revealEdge = uReveal * 1.3;
      float particleR = length(rest.xy) / 11.0;
      float appear = smoothstep(particleR - 0.15, particleR + 0.05, revealEdge);
      if (appear < 0.001) {
        gl_Position = vec4(0.0, 0.0, -2.0, 1.0);
        gl_PointSize = 0.0;
        vAlpha = 0.0;
        return;
      }

      vec3 p = rest;

      // slow rotation per band - inner rotates opposite to outer
      float rotSpeed = mix(0.08, -0.04, band);
      float ra = t * rotSpeed;
      float cr = cos(ra), sr = sin(ra);
      p.xy = mat2(cr, -sr, sr, cr) * p.xy;

      // petals: gentle breathing radial pulse
      if (role > 0.5 && role < 1.5) {
        float pulse = sin(t * 0.3 + band * 6.28) * 0.15;
        p.xy *= 1.0 + pulse;
      }

      // spirals: slow twist
      if (role > 1.5 && role < 2.5) {
        float twist = sin(t * 0.2 + seed * 6.28) * 0.3;
        float a2 = atan(p.y, p.x) + twist * 0.1;
        float r2 = length(p.xy);
        p.x = cos(a2) * r2;
        p.y = sin(a2) * r2;
      }

      // triangles: subtle z-oscillation
      if (role > 2.5) {
        p.z += sin(t * 0.25 + seed * 12.0) * 0.4;
      }

      // gentle per-particle drift
      p += vec3(
        sin(t * 0.4 + seed * 20.0),
        cos(t * 0.35 + seed * 15.0),
        sin(t * 0.3 + seed * 25.0)
      ) * 0.04;

      // Hilma af Klint palette: deep gold, rose, ultramarine blue, cream
      // mapped by band position and role
      vec3 gold = vec3(0.85, 0.72, 0.28);
      vec3 rose = vec3(0.82, 0.38, 0.42);
      vec3 blue = vec3(0.22, 0.32, 0.68);
      vec3 cream = vec3(0.94, 0.91, 0.82);
      vec3 deepBlue = vec3(0.12, 0.15, 0.42);

      vec3 col;
      // center eye: gold-cream
      if (band < 0.2) {
        col = mix(gold, cream, seed * 0.5);
      }
      // inner petals: rose
      else if (band < 0.45 && role > 0.5 && role < 1.5) {
        col = mix(rose, cream, seed * 0.3);
      }
      // mid rings: blue
      else if (band < 0.5) {
        col = mix(blue, cream, seed * 0.25);
      }
      // outer petals: gold-rose gradient
      else if (band < 0.7 && role > 0.5 && role < 1.5) {
        col = mix(gold, rose, seed);
      }
      // spirals: deep blue to gold
      else if (role > 1.5 && role < 2.5) {
        col = mix(deepBlue, gold, band);
      }
      // triangles: rose to blue
      else if (role > 2.5) {
        col = mix(rose, blue, seed * 0.7 + 0.15);
      }
      // outer ring: cream-gold
      else {
        col = mix(cream, gold, seed * 0.4);
      }

      vCol = col;

      float energy = 0.5 + 0.5 * sin(t * 0.5 + seed * 6.28 + band * 3.0);
      vAlpha = (0.4 + 0.6 * energy) * appear;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + energy * 1.0) * uPixel * (40.0 / dist) * appear;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;

  // reveal over 4 seconds - radial bloom from center
  uniforms.uReveal.value = Math.min(1.0, elapsed / 4.0);

  // slow gentle tilt to show slight 3D depth
  const tiltX = Math.sin(elapsed * 0.06) * 0.15;
  const tiltY = Math.cos(elapsed * 0.08) * 0.1;
  camera.position.set(
    Math.sin(tiltY) * 28,
    Math.sin(tiltX) * 3,
    Math.cos(tiltY) * 28
  );
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
