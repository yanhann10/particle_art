<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>49j · echoes of the earth</title>
<!-- MOTION: morph, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a1418; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">49j · echoes of the earth</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a1418, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a1418, 0.009);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 18, 45);
camera.lookAt(0, 4, 0);

// volumetric fog plane between camera and reef
const fogPlaneGeom = new THREE.PlaneGeometry(200, 200, 1, 1);
const fogPlaneMat = new THREE.MeshBasicMaterial({
  color: 0x1a3d47,
  transparent: true,
  opacity: 0.08,
  side: THREE.DoubleSide,
  depthWrite: false
});
const fogPlane = new THREE.Mesh(fogPlaneGeom, fogPlaneMat);
fogPlane.rotation.x = -Math.PI / 2;
fogPlane.position.y = 12;
scene.add(fogPlane);

// substrate plane — dark reef floor
const substrateMat = new THREE.MeshStandardMaterial({
  color: 0x0d1f26,
  roughness: 0.95,
  metalness: 0.05
});
const substrate = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), substrateMat);
substrate.rotation.x = -Math.PI / 2;
substrate.position.y = 0;
substrate.receiveShadow = true;
scene.add(substrate);

// lighting: warm amber from above, cold teal from below (Eliasson directive)
const topLight = new THREE.DirectionalLight(0xffcc88, 1.2);
topLight.position.set(20, 40, 15);
scene.add(topLight);

const bottomLight = new THREE.HemisphereLight(0x1a5c6b, 0x0d1f26, 0.6);
scene.add(bottomLight);

const ambLight = new THREE.AmbientLight(0x1a3d47, 0.3);
scene.add(ambLight);

// coral species archetypes: tube, branch, plate, brain
// each is a THREE.BufferGeometry that morphs params over time via Perlin drift

function coralTubeGeometry(r1=0.4, r2=0.3, h=3.0, segs=16){
  const g = new THREE.CylinderGeometry(r2, r1, h, segs, 8, false);
  g.translate(0, h*0.5, 0);
  return g;
}

function coralBranchGeometry(h=4.0, branches=5){
  const g = new THREE.BufferGeometry();
  const verts = [], indices = [];
  const trunk = 0.3;
  // trunk
  for (let i = 0; i <= 8; i++){
    const t = i / 8;
    const y = t * h * 0.6;
    const r = trunk * (1.0 - t * 0.3);
    for (let j = 0; j < 8; j++){
      const a = (j / 8) * Math.PI * 2;
      verts.push(Math.cos(a)*r, y, Math.sin(a)*r);
    }
  }
  // branches at top
  const branchH = h * 0.4;
  for (let b = 0; b < branches; b++){
    const ang = (b / branches) * Math.PI * 2;
    const baseY = h * 0.5;
    const dx = Math.cos(ang) * 0.8;
    const dz = Math.sin(ang) * 0.8;
    for (let i = 0; i <= 6; i++){
      const t = i / 6;
      const y = baseY + t * branchH;
      const r = trunk * 0.5 * (1.0 - t);
      for (let j = 0; j < 6; j++){
        const a2 = (j / 6) * Math.PI * 2;
        verts.push(dx + Math.cos(a2)*r, y, dz + Math.sin(a2)*r);
      }
    }
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.computeVertexNormals();
  return g;
}

function coralPlateGeometry(w=3.0, d=3.0, waves=6){
  const g = new THREE.PlaneGeometry(w, d, 20, 20);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const wave = Math.sin(x * waves) * Math.cos(z * waves) * 0.3;
    pos.setY(i, wave);
  }
  g.computeVertexNormals();
  g.rotateX(-Math.PI / 2);
  g.translate(0, 1.5, 0);
  return g;
}

function coralBrainGeometry(r=1.5, folds=8){
  const g = new THREE.SphereGeometry(r, 24, 16);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const l = Math.sqrt(x*x+y*y+z*z);
    const fold = Math.sin(x * folds) * Math.cos(z * folds) * 0.2;
    const nr = l + fold;
    pos.setXYZ(i, x/l*nr, y/l*nr, z/l*nr);
  }
  g.computeVertexNormals();
  g.translate(0, r, 0);
  return g;
}

const archetypes = [
  coralTubeGeometry(0.4, 0.3, 3.0, 16),
  coralBranchGeometry(4.5, 6),
  coralPlateGeometry(3.5, 3.5, 6),
  coralBrainGeometry(1.8, 8)
];

// subsurface scattering shader for wet coral feel
const coralMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0xff6b9d) },
    uSSSColor: { value: new THREE.Color(0xffcc88) },
    uLightDir: { value: new THREE.Vector3(1, 2, 1).normalize() }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vViewPos = -mvPos.xyz;
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor;
    uniform vec3 uSSSColor;
    uniform vec3 uLightDir;
    varying vec3 vNormal;
    varying vec3 vViewPos;
    void main(){
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewPos);
      vec3 L = uLightDir;
      float ndl = max(dot(N, L), 0.0);
      // fake SSS: backlight bleed
      float backLight = max(0.0, -dot(N, L)) * 0.6;
      vec3 sss = uSSSColor * backLight;
      vec3 diffuse = uColor * (0.3 + ndl * 0.7);
      vec3 col = diffuse + sss;
      // rim light
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.0) * 0.4;
      col += vec3(rim);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// instanced corals — 180 instances, each drifts through 4D species space
const coralCount = 180;
const dummy = new THREE.Object3D();

// we'll morph between archetypes by storing per-instance 'species coords' [s0,s1,s2,s3]
// and lerping geometry positions at render time. For simplicity, pick one base archetype per instance
// and modulate its material color + scale to simulate morph. Full geometry interpolation is expensive
// without GPGPU, so we fake it via color + transform + shader tricks (Anadol's work often shows morph via color/texture).

const instancedMeshes = archetypes.map(geom => {
  const mat = coralMat.clone();
  return new THREE.InstancedMesh(geom, mat, Math.ceil(coralCount / archetypes.length));
});
instancedMeshes.forEach(m => scene.add(m));

// per-instance data: position, species drift seed, current color
const instances = [];
for (let i = 0; i < coralCount; i++){
  const archetype = i % archetypes.length;
  const angle = (i / coralCount) * Math.PI * 2;
  const rad = 8 + Math.random() * 18;
  const x = Math.cos(angle) * rad + (Math.random()-0.5)*6;
  const z = Math.sin(angle) * rad + (Math.random()-0.5)*6;
  const scale = 0.6 + Math.random() * 0.8;
  instances.push({
    archetype,
    x, z,
    scale,
    seed: Math.random() * 1000,
    colorPhase: Math.random(),
    morphSpeed: 0.15 + Math.random() * 0.25
  });
}

// color palette: turquoise water, coral pink, lime kelp, amber
const palette = [
  new THREE.Color(0x40e0d0), // turquoise
  new THREE.Color(0xff6b9d), // coral pink
  new THREE.Color(0xc8ff00), // lime
  new THREE.Color(0xffcc88)  // amber
];

// plankton particles
const planktonCount = 4000;
const planktonGeom = new THREE.BufferGeometry();
const planktonPos = new Float32Array(planktonCount * 3);
const planktonVel = [];
for (let i = 0; i < planktonCount; i++){
  planktonPos[i*3]   = (Math.random()-0.5) * 100;
  planktonPos[i*3+1] = Math.random() * 30 + 2;
  planktonPos[i*3+2] = (Math.random()-0.5) * 100;
  planktonVel.push({
    vx: (Math.random()-0.5) * 0.02,
    vy: (Math.random()-0.5) * 0.01,
    vz: (Math.random()-0.5) * 0.02
  });
}
planktonGeom.setAttribute('position', new THREE.BufferAttribute(planktonPos, 3));
const planktonMat = new THREE.PointsMaterial({
  color: 0x80d0ff,
  size: 0.08,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const plankton = new THREE.Points(planktonGeom, planktonMat);
scene.add(plankton);

// simple 4D Perlin-like noise (sum of sin waves)
function noise4D(x, y, z, w){
  return (
    Math.sin(x * 1.3 + y * 1.7 + z * 2.1 + w * 1.1) * 0.5 +
    Math.sin(x * 2.7 - y * 1.9 + z * 1.3 + w * 2.3) * 0.3 +
    Math.sin(x * 1.1 + y * 2.9 - z * 1.7 + w * 1.9) * 0.2
  );
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let time = 0;
function loop(){
  time += 0.016;

  // update plankton drift
  const pPos = plankton.geometry.attributes.position;
  for (let i = 0; i < planktonCount; i++){
    let x = pPos.getX(i) + planktonVel[i].vx;
    let y = pPos.getY(i) + planktonVel[i].vy;
    let z = pPos.getZ(i) + planktonVel[i].vz;
    if (x < -50) x = 50; if (x > 50) x = -50;
    if (y < 2) y = 30; if (y > 30) y = 2;
    if (z < -50) z = 50; if (z > 50) z = -50;
    pPos.setXYZ(i, x, y, z);
  }
  pPos.needsUpdate = true;

  // update coral instances: drift through species latent space via 4D noise
  const counts = archetypes.map(() => 0);
  instances.forEach((inst, i) => {
    const idx = counts[inst.archetype]++;
    const mesh = instancedMeshes[inst.archetype];
    // 4D coords in species space
    const s0 = inst.seed;
    const s1 = inst.seed + 100;
    const s2 = inst.seed + 200;
    const s3 = time * inst.morphSpeed;
    const drift = noise4D(s0 * 0.3, s1 * 0.3, s2 * 0.3, s3);
    // map drift to palette color
    const colorIdx = ((drift + 1.0) * 0.5 * palette.length) % palette.length;
    const c1 = palette[Math.floor(colorIdx)];
    const c2 = palette[Math.ceil(colorIdx) % palette.length];
    const colT = colorIdx - Math.floor(colorIdx);
    const col = new THREE.Color().lerpColors(c1, c2, colT);
    mesh.material.uniforms.uColor.value.copy(col);
    // morph scale slightly
    const scaleVar = 1.0 + drift * 0.15;
    dummy.position.set(inst.x, 0, inst.z);
    dummy.scale.set(inst.scale * scaleVar, inst.scale * scaleVar, inst.scale * scaleVar);
    dummy.rotation.y = inst.seed * 2.0 + time * 0.05;
    dummy.updateMatrix();
    mesh.setMatrixAt(idx, dummy.matrix);
  });
  instancedMeshes.forEach(m => { m.instanceMatrix.needsUpdate = true; });

  // update material time uniform for all archetypes
  instancedMeshes.forEach(m => { m.material.uniforms.uTime.value = time; });

  // slow camera orbit
  const camAngle = time * 0.08;
  const camRad = 45;
  camera.position.x = Math.sin(camAngle) * camRad;
  camera.position.z = Math.cos(camAngle) * camRad;
  camera.position.y = 18 + Math.sin(time * 0.1) * 3;
  // track centroid of reef (origin)
  camera.lookAt(0, 4, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
