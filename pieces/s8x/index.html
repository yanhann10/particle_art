<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s8x · boids multi-state cycle · Reynolds + vortex + dispersal</title>
<!-- MOTION: flocking, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0b0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; cursor:pointer; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .state { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">s8x · boids multi-state cycle · Reynolds + vortex + dispersal</div>
<div class="state" id="stateLabel">state: murmuration</div>
<div class="hint" id="hint">click to cycle states · Reynolds 1986 emergent behavior</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b0f, 1);
document.body.appendChild(renderer.domElement);

const N = 3200;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const trails = new Float32Array(N);

// Initialize boids in a dispersed sphere
for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 12;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  
  const vtheta = Math.random() * Math.PI * 2;
  const vphi = Math.acos(2 * Math.random() - 1);
  const speed = 0.8 + Math.random() * 0.4;
  velocities[i*3]   = speed * Math.sin(vphi) * Math.cos(vtheta);
  velocities[i*3+1] = speed * Math.sin(vphi) * Math.sin(vtheta);
  velocities[i*3+2] = speed * Math.cos(vphi);
  
  seeds[i] = Math.random();
  trails[i] = Math.random() * 0.3;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uState: { value: 0 },
  uTransition: { value: 1.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uState;
    uniform float uTransition;
    attribute float seed;
    attribute float trail;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.3;
      float pulse = 0.5 + 0.5 * sin(phase);
      
      // State 0: murmuration (dawn colors)
      vec3 c0_0 = vec3(0.22, 0.18, 0.38); // indigo
      vec3 c0_1 = vec3(0.78, 0.45, 0.52); // rose
      vec3 c0_2 = vec3(0.92, 0.76, 0.48); // gold
      
      // State 1: vortex (deep ocean cyan to electric white)
      vec3 c1_0 = vec3(0.08, 0.24, 0.32); // deep teal
      vec3 c1_1 = vec3(0.22, 0.58, 0.68); // cyan
      vec3 c1_2 = vec3(0.88, 0.95, 0.98); // electric white
      
      // State 2: dispersal (ember cooling — hot orange to ash gray)
      vec3 c2_0 = vec3(0.92, 0.42, 0.18); // hot ember
      vec3 c2_1 = vec3(0.72, 0.58, 0.48); // warm ash
      vec3 c2_2 = vec3(0.38, 0.36, 0.40); // cold gray
      
      vec3 col;
      if (uState < 0.5){
        float blend = smoothstep(0.3, 0.7, pulse);
        col = mix(c0_0, c0_1, blend);
        col = mix(col, c0_2, smoothstep(0.7, 1.0, pulse) * 0.6);
      } else if (uState < 1.5){
        float distFromCenter = length(p);
        float radialGrad = smoothstep(0.0, 25.0, distFromCenter);
        col = mix(c1_0, c1_1, radialGrad);
        col = mix(col, c1_2, smoothstep(0.7, 1.0, pulse) * 0.5);
      } else {
        float coolingFactor = smoothstep(0.0, 1.0, seed);
        col = mix(c2_0, c2_1, coolingFactor);
        col = mix(col, c2_2, smoothstep(0.5, 1.0, coolingFactor));
      }
      
      vCol = col;
      vAlpha = (0.5 + 0.5 * pulse + trail * 0.4) * uTransition;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeBase = uState < 1.5 ? (1.8 + 1.2*pulse + trail*2.0) : (2.2 + 0.8*pulse);
      gl_PointSize = sizeBase * uPixel * (60.0/dist) * uTransition;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('trail', new THREE.BufferAttribute(trails, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// State machine
let currentState = 0; // 0: murmuration, 1: vortex, 2: dispersal
let transitionProgress = 1.0;
let isTransitioning = false;
const TRANSITION_DURATION = 1.2; // seconds
let transitionStart = 0;

const stateNames = ['murmuration', 'vortex', 'dispersal'];
const stateLabel = document.getElementById('stateLabel');
const hintEl = document.getElementById('hint');

function transitionToState(newState){
  if (isTransitioning) return;
  currentState = newState;
  isTransitioning = true;
  transitionProgress = 0.0;
  transitionStart = performance.now();
  stateLabel.textContent = `state: ${stateNames[currentState]}`;
}

renderer.domElement.addEventListener('click', () => {
  const nextState = (currentState + 1) % 3;
  transitionToState(nextState);
});

// Reynolds boids parameters
const PERCEPTION = 3.5;
const SEPARATION_DIST = 1.2;
const COHESION_FORCE = 0.02;
const ALIGNMENT_FORCE = 0.08;
const SEPARATION_FORCE = 0.15;
const BOUNDARY_FORCE = 0.25;
const MAX_SPEED = 1.8;
const MIN_SPEED = 0.6;
const BOUNDARY = 25;

const tmpVec = new THREE.Vector3();
const avgVel = new THREE.Vector3();
const avgPos = new THREE.Vector3();
const steering = new THREE.Vector3();

const CELL_SIZE = PERCEPTION * 1.5;
let spatialGrid = new Map();

function getSpatialKey(x, y, z){
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  return `${cx},${cy},${cz}`;
}

function rebuildSpatialGrid(){
  spatialGrid.clear();
  for (let i = 0; i < N; i++){
    const key = getSpatialKey(positions[i*3], positions[i*3+1], positions[i*3+2]);
    if (!spatialGrid.has(key)) spatialGrid.set(key, []);
    spatialGrid.get(key).push(i);
  }
}

function getNeighborCells(x, y, z){
  const cells = [];
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  for (let dx = -1; dx <= 1; dx++){
    for (let dy = -1; dy <= 1; dy++){
      for (let dz = -1; dz <= 1; dz++){
        const key = `${cx+dx},${cy+dy},${cz+dz}`;
        if (spatialGrid.has(key)) cells.push(...spatialGrid.get(key));
      }
    }
  }
  return cells;
}

function updateMurmuration(dt){
  rebuildSpatialGrid();
  
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const vx = velocities[i*3];
    const vy = velocities[i*3+1];
    const vz = velocities[i*3+2];
    
    avgPos.set(0,0,0);
    avgVel.set(0,0,0);
    steering.set(0,0,0);
    let cohesionCount = 0;
    let alignmentCount = 0;
    
    const neighbors = getNeighborCells(px, py, pz);
    
    for (const j of neighbors){
      if (i === j) continue;
      const dx = positions[j*3] - px;
      const dy = positions[j*3+1] - py;
      const dz = positions[j*3+2] - pz;
      const distSq = dx*dx + dy*dy + dz*dz;
      
      if (distSq < PERCEPTION * PERCEPTION && distSq > 0.01){
        const dist = Math.sqrt(distSq);
        
        avgPos.x += positions[j*3];
        avgPos.y += positions[j*3+1];
        avgPos.z += positions[j*3+2];
        cohesionCount++;
        
        avgVel.x += velocities[j*3];
        avgVel.y += velocities[j*3+1];
        avgVel.z += velocities[j*3+2];
        alignmentCount++;
        
        if (dist < SEPARATION_DIST){
          const force = (SEPARATION_DIST - dist) / SEPARATION_DIST;
          steering.x -= (dx / dist) * force * SEPARATION_FORCE;
          steering.y -= (dy / dist) * force * SEPARATION_FORCE;
          steering.z -= (dz / dist) * force * SEPARATION_FORCE;
        }
      }
    }
    
    if (cohesionCount > 0){
      avgPos.multiplyScalar(1 / cohesionCount);
      const dx = avgPos.x - px;
      const dy = avgPos.y - py;
      const dz = avgPos.z - pz;
      steering.x += dx * COHESION_FORCE;
      steering.y += dy * COHESION_FORCE;
      steering.z += dz * COHESION_FORCE;
    }
    
    if (alignmentCount > 0){
      avgVel.multiplyScalar(1 / alignmentCount);
      steering.x += (avgVel.x - vx) * ALIGNMENT_FORCE;
      steering.y += (avgVel.y - vy) * ALIGNMENT_FORCE;
      steering.z += (avgVel.z - vz) * ALIGNMENT_FORCE;
    }
    
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > BOUNDARY * 0.7){
      const force = Math.pow((distFromCenter - BOUNDARY * 0.7) / (BOUNDARY * 0.3), 2);
      steering.x -= (px / distFromCenter) * force * BOUNDARY_FORCE;
      steering.y -= (py / distFromCenter) * force * BOUNDARY_FORCE;
      steering.z -= (pz / distFromCenter) * force * BOUNDARY_FORCE;
    }
    
    velocities[i*3]   += steering.x * dt;
    velocities[i*3+1] += steering.y * dt;
    velocities[i*3+2] += steering.z * dt;
    
    const speed = Math.sqrt(
      velocities[i*3]*velocities[i*3] + 
      velocities[i*3+1]*velocities[i*3+1] + 
      velocities[i*3+2]*velocities[i*3+2]
    );
    if (speed > MAX_SPEED){
      velocities[i*3]   *= MAX_SPEED / speed;
      velocities[i*3+1] *= MAX_SPEED / speed;
      velocities[i*3+2] *= MAX_SPEED / speed;
    } else if (speed < MIN_SPEED && speed > 0.01){
      velocities[i*3]   *= MIN_SPEED / speed;
      velocities[i*3+1] *= MIN_SPEED / speed;
      velocities[i*3+2] *= MIN_SPEED / speed;
    }
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    trails[i] = THREE.MathUtils.lerp(trails[i], speed / MAX_SPEED, 0.1);
  }
}

function updateVortex(dt, t){
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    const r = Math.sqrt(px*px + pz*pz);
    const theta = Math.atan2(pz, px);
    const vortexSpeed = 2.5 / (1 + r * 0.15);
    const radialPull = -0.08 * (r - 15);
    
    const tangentX = -Math.sin(theta) * vortexSpeed;
    const tangentZ = Math.cos(theta) * vortexSpeed;
    const radialX = Math.cos(theta) * radialPull;
    const radialZ = Math.sin(theta) * radialPull;
    
    const verticalOscillation = Math.sin(t * 0.8 + seeds[i] * 6.28) * 0.15;
    
    velocities[i*3] = tangentX + radialX;
    velocities[i*3+1] = verticalOscillation;
    velocities[i*3+2] = tangentZ + radialZ;
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    trails[i] = THREE.MathUtils.lerp(trails[i], vortexSpeed / 3.0, 0.15);
  }
}

function updateDispersal(dt, t){
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    const expansionRate = 0.5 + seeds[i] * 0.5;
    const driftAngle = seeds[i] * 6.28 + t * 0.2;
    
    const dirX = px / (distFromCenter + 0.01);
    const dirY = py / (distFromCenter + 0.01);
    const dirZ = pz / (distFromCenter + 0.01);
    
    const drift = 0.3 * Math.sin(driftAngle);
    
    velocities[i*3] = dirX * expansionRate + Math.cos(driftAngle) * drift;
    velocities[i*3+1] = dirY * expansionRate * 0.3 - 0.2;
    velocities[i*3+2] = dirZ * expansionRate + Math.sin(driftAngle) * drift;
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    trails[i] = THREE.MathUtils.lerp(trails[i], 0.2, 0.1);
  }
}

function updateBoids(dt, t){
  if (currentState === 0){
    updateMurmuration(dt);
  } else if (currentState === 1){
    updateVortex(dt, t);
  } else {
    updateDispersal(dt, t);
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;
  geom.computeBoundingSphere();
}

const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  let orbitRadius = 45;
  let orbitSpeed = 0.08;
  
  if (currentState === 1){
    orbitRadius = 55;
    orbitSpeed = 0.12;
  } else if (currentState === 2){
    orbitRadius = 65;
    orbitSpeed = 0.05;
  }
  
  const angle = performance.now() * 0.00008 * orbitSpeed;
  camera.position.x = centroid.x + Math.cos(angle) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(angle) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(angle * 0.5) * 12;
  camera.lookAt(centroid);
}

let lastTime = performance.now();
const start = performance.now();
let frameCount = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;
  
  if (isTransitioning){
    const elapsed = (now - transitionStart) / 1000;
    transitionProgress = Math.min(elapsed / TRANSITION_DURATION, 1.0);
    uniforms.uTransition.value = transitionProgress;
    if (transitionProgress >= 1.0){
      isTransitioning = false;
    }
  }
  
  frameCount++;
  if (frameCount % 60 === 0){
    let descriptor = '';
    if (currentState === 0){
      let avgSpeed = 0;
      for (let i = 0; i < N; i++){
        const vx = velocities[i*3];
        const vy = velocities[i*3+1];
        const vz = velocities[i*3+2];
        avgSpeed += Math.sqrt(vx*vx + vy*vy + vz*vz);
      }
      avgSpeed /= N;
      const coherence = (avgSpeed / MAX_SPEED * 100).toFixed(0);
      descriptor = `coherence: ${coherence}%`;
    } else if (currentState === 1){
      descriptor = 'angular momentum';
    } else {
      descriptor = 'entropy increasing';
    }
    hintEl.textContent = `${stateNames[currentState]} · ${descriptor} · click to cycle`;
  }
  
  uniforms.uTime.value = t;
  uniforms.uState.value = currentState;
  updateBoids(dt * 60, t);
  updateCamera();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
