<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: breathe, intensity: calm -->
<!-- Lissajous × Lorenz cross-pollination.
     Lissajous skeleton: x=A*sin(a*t+δ), y=B*sin(b*t) with ratios 3:4 and 5:4.
     Lorenz perturbation: add epsilon * Lorenz derivative at each point (organic breathing).
     8 overlapping figures at phase offsets δ = 0, π/4, π/2, ... 7π/4.
     Line2 for thick 2px lines. Alpha 0.4 per figure. Depth varies per figure.
     Palette: electric indigo (#4040d8) on near-black (#080810). -->
<title>ahx · lissajous × lorenz</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080810; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .src{ position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">ahx · lissajous × lorenz</div>
<div class="src">8 figures · lorenz perturbation</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Lorenz derivative (for perturbation) ─────────────────────────────────────
function lorenzDeriv(x, y, z) {
  const s = 10, r = 28, b = 8/3;
  return [s*(y-x), x*(r-z)-y, x*y - b*z];
}

// ── Lissajous × Lorenz figure ─────────────────────────────────────────────────
// Two ratio sets: 3:4 and 5:4, alternating per figure
// 8 figures with δ = k*π/4
const FIGURES  = 8;
const PTS      = 800;   // points per figure
const EPS      = 0.018; // Lorenz perturbation strength

// Lissajous params
const RATIOS = [
  { a: 3, b: 4 },  // 3:4
  { a: 5, b: 4 },  // 5:4
];

// Scale parameters
const SCALE_X = 3.2;
const SCALE_Y = 3.2;
const DEPTH_SPREAD = 4.0; // z range across 8 figures

// Build geometry for one figure
function buildFigure(ratio, delta, zOffset, time) {
  const pts = [];
  for (let i = 0; i <= PTS; i++) {
    const tParam = (i / PTS) * Math.PI * 2 * 4; // 4 cycles for full figure closure

    // Lissajous base
    let x = SCALE_X * Math.sin(ratio.a * tParam + delta);
    let y = SCALE_Y * Math.sin(ratio.b * tParam);
    let z = zOffset;

    // Lorenz perturbation at (x, y, z)
    const [dlx, dly, dlz] = lorenzDeriv(x, y, z);
    const pertScale = EPS * (1 + 0.3 * Math.sin(time * 0.7 + delta));
    x += dlx * pertScale;
    y += dly * pertScale;
    z += dlz * pertScale * 0.08; // small z perturbation for depth breathing

    pts.push(x, y, z);
  }
  return pts;
}

// ── Three.js scene ────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080810, 1);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0, 0, 14);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.2;

// Electric indigo: #4040d8 = (0.251, 0.251, 0.847)
// Slight hue variation per figure for depth hierarchy
const BASE_HUE_R = 0.251;
const BASE_HUE_G = 0.251;
const BASE_HUE_B = 0.847;

// Create line objects for each figure
const lines    = [];
const lineGeos = [];

for (let f = 0; f < FIGURES; f++) {
  const delta  = f * Math.PI / 4;
  const ratio  = RATIOS[f % 2];
  const zOff   = (f / (FIGURES - 1) - 0.5) * DEPTH_SPREAD;

  // Build initial positions
  const pts = buildFigure(ratio, delta, zOff, 0);
  const posArr = new Float32Array(pts);

  const geo = new THREE.BufferGeometry();
  const posBuf = new THREE.BufferAttribute(posArr, 3);
  posBuf.setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', posBuf);

  // Slight hue variation: inner figures more purple, outer more blue
  const hueShift = (f / FIGURES) * 0.15;
  const mat = new THREE.LineBasicMaterial({
    color:       new THREE.Color(
                   BASE_HUE_R - hueShift * 0.1,
                   BASE_HUE_G + hueShift * 0.05,
                   BASE_HUE_B - hueShift * 0.08
                 ),
    transparent: true,
    opacity:     0.40,
    blending:    THREE.NormalBlending,
    linewidth:   1
  });

  const line = new THREE.Line(geo, mat);
  scene.add(line);
  lines.push({ ratio, delta, zOff, posBuf });
  lineGeos.push(geo);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate: continuously update Lorenz perturbation ─────────────────────────
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.012;

  for (let f = 0; f < FIGURES; f++) {
    const { ratio, delta, zOff, posBuf } = lines[f];
    const pts = buildFigure(ratio, delta, zOff, time);
    for (let i = 0; i < pts.length; i++) {
      posBuf.array[i] = pts[i];
    }
    posBuf.needsUpdate = true;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
