<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2dw · data-flow field · Refik Anadol</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08050d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">2dw</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 12, 85);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08050d, 1);
document.body.appendChild(renderer.domElement);

// GPGPU setup for 220k particles
const PARTICLE_COUNT = 220000;
const WIDTH = 512;
const HEIGHT = Math.ceil(PARTICLE_COUNT / WIDTH);

// Position FBO
const positionData = new Float32Array(WIDTH * HEIGHT * 4);
for (let i = 0; i < WIDTH * HEIGHT; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 15 + Math.random() * 35;
  positionData[i*4]   = r * Math.sin(phi) * Math.cos(theta);
  positionData[i*4+1] = r * Math.sin(phi) * Math.sin(theta) - 8;
  positionData[i*4+2] = r * Math.cos(phi);
  positionData[i*4+3] = Math.random(); // lifetime phase
}

const positionTexture = new THREE.DataTexture(positionData, WIDTH, HEIGHT, THREE.RGBAFormat, THREE.FloatType);
positionTexture.needsUpdate = true;

// Velocity FBO
const velocityData = new Float32Array(WIDTH * HEIGHT * 4);
for (let i = 0; i < WIDTH * HEIGHT; i++){
  velocityData[i*4]   = (Math.random() - 0.5) * 0.2;
  velocityData[i*4+1] = (Math.random() - 0.5) * 0.2;
  velocityData[i*4+2] = (Math.random() - 0.5) * 0.2;
  velocityData[i*4+3] = 0.3 + Math.random() * 0.7; // flow influence
}

const velocityTexture = new THREE.DataTexture(velocityData, WIDTH, HEIGHT, THREE.RGBAFormat, THREE.FloatType);
velocityTexture.needsUpdate = true;

// FBO render targets
const positionRT1 = new THREE.WebGLRenderTarget(WIDTH, HEIGHT, {
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat, type: THREE.FloatType
});
const positionRT2 = positionRT1.clone();
const velocityRT1 = positionRT1.clone();
const velocityRT2 = positionRT1.clone();

const fboScene = new THREE.Scene();
const fboCamera = new THREE.OrthographicCamera(-0.5, 0.5, 0.5, -0.5, 0, 1);
const fboQuad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1));
fboScene.add(fboQuad);

// Position update shader
const positionMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tPosition: { value: null },
    tVelocity: { value: null },
    uTime: { value: 0 },
    uDelta: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tPosition;
    uniform sampler2D tVelocity;
    uniform float uTime;
    uniform float uDelta;
    varying vec2 vUv;
    
    void main(){
      vec4 pos = texture2D(tPosition, vUv);
      vec4 vel = texture2D(tVelocity, vUv);
      
      vec3 p = pos.xyz;
      vec3 v = vel.xyz;
      
      // Smooth flow field - data pour aesthetic
      float fx = sin(p.y * 0.08 + uTime * 0.3) * cos(p.z * 0.06 + uTime * 0.2);
      float fy = sin(p.x * 0.07 - uTime * 0.25) * cos(p.z * 0.09);
      float fz = sin(p.x * 0.06 + uTime * 0.15) * cos(p.y * 0.08 - uTime * 0.2);
      
      vec3 flowForce = vec3(fx, fy, fz) * 0.15;
      
      // Attractor to create architectural volume
      vec3 attractorPos = vec3(
        sin(uTime * 0.12) * 18.0,
        cos(uTime * 0.08) * 12.0 - 8.0,
        sin(uTime * 0.15) * 15.0
      );
      vec3 toAttractor = attractorPos - p;
      float distToAttractor = length(toAttractor);
      vec3 attractorForce = normalize(toAttractor) * (0.03 / (1.0 + distToAttractor * 0.05));
      
      v += (flowForce + attractorForce) * uDelta * 60.0;
      v *= 0.985; // gentle damping
      
      p += v * uDelta * 60.0;
      
      // Soft boundary sphere
      float distFromOrigin = length(p + vec3(0, 8, 0));
      if (distFromOrigin > 55.0){
        vec3 toOrigin = normalize(vec3(0, -8, 0) - p);
        p = normalize(p + vec3(0, 8, 0)) * 55.0 - vec3(0, 8, 0);
        v = toOrigin * length(v) * 0.5;
      }
      
      // Update lifetime phase
      float phase = pos.w + uDelta * 0.3;
      
      gl_FragColor = vec4(p, phase);
    }
  `
});

// Velocity update shader
const velocityMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tPosition: { value: null },
    tVelocity: { value: null },
    uTime: { value: 0 },
    uDelta: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tPosition;
    uniform sampler2D tVelocity;
    uniform float uTime;
    uniform float uDelta;
    varying vec2 vUv;
    
    void main(){
      vec4 vel = texture2D(tVelocity, vUv);
      gl_FragColor = vel; // velocity is updated in position shader
    }
  `
});

// Initialize FBOs
renderer.setRenderTarget(positionRT1);
renderer.clear();
const initPosMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: positionTexture })
);
fboScene.add(initPosMesh);
renderer.render(fboScene, fboCamera);
fboScene.remove(initPosMesh);

renderer.setRenderTarget(velocityRT1);
renderer.clear();
const initVelMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: velocityTexture })
);
fboScene.add(initVelMesh);
renderer.render(fboScene, fboCamera);
fboScene.remove(initVelMesh);
renderer.setRenderTarget(null);

// Particle display
const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleUvs = new Float32Array(PARTICLE_COUNT * 2);

for (let i = 0; i < PARTICLE_COUNT; i++){
  const x = (i % WIDTH) / WIDTH;
  const y = Math.floor(i / WIDTH) / HEIGHT;
  particleUvs[i*2] = x;
  particleUvs[i*2+1] = y;
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
particleGeometry.setAttribute('uv', new THREE.BufferAttribute(particleUvs, 2));

const particleMaterial = new THREE.ShaderMaterial({
  uniforms: {
    tPosition: { value: null },
    tVelocity: { value: null },
    uTime: { value: 0 },
    uPixel: { value: renderer.getPixelRatio() }
  },
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D tPosition;
    uniform sampler2D tVelocity;
    uniform float uTime;
    uniform float uPixel;
    varying vec3 vColor;
    varying float vAlpha;
    
    void main(){
      vec4 pos = texture2D(tPosition, uv);
      vec4 vel = texture2D(tVelocity, uv);
      
      vec3 p = pos.xyz;
      float phase = pos.w;
      float speed = length(vel.xyz);
      
      // Pearlescent cyan-violet duotone with white-hot highlights
      vec3 cyan = vec3(0.6, 0.85, 0.95);     // pearlescent cyan
      vec3 violet = vec3(0.75, 0.65, 0.95);  // pearlescent violet
      vec3 white = vec3(1.0, 1.0, 1.0);      // white-hot core
      
      float colorPhase = sin(phase * 3.14159) * 0.5 + 0.5;
      vec3 baseColor = mix(cyan, violet, colorPhase);
      
      // White-hot highlights on fast particles
      float hotness = smoothstep(0.4, 1.0, speed * 3.0);
      vColor = mix(baseColor, white, hotness * 0.6);
      
      // Glow intensity
      float pulse = sin(phase * 6.28318) * 0.3 + 0.7;
      vAlpha = (0.15 + speed * 0.4 + hotness * 0.3) * pulse;
      
      vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
      float dist = -mvPos.z;
      
      // Larger particles for architectural scale feeling
      float sizeBase = 1.2 + speed * 2.5 + hotness * 3.0;
      gl_PointSize = sizeBase * uPixel * (120.0 / dist);
      
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    
    void main(){
      vec2 center = gl_PointCoord - 0.5;
      float r = dot(center, center);
      if (r > 0.25) discard;
      
      // Soft radial falloff for glow
      float intensity = exp(-r * 12.0);
      float alpha = intensity * vAlpha;
      
      // Bloom-feeling glow
      vec3 glowColor = vColor * (1.0 + intensity * 0.8);
      
      gl_FragColor = vec4(glowColor * alpha, alpha);
    }
  `
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

// Subtle fog for depth
scene.fog = new THREE.FogExp2(0x08050d, 0.008);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let posReadIndex = 0;
let velReadIndex = 0;
let lastTime = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;
  
  // Update FBOs
  const posRead = posReadIndex === 0 ? positionRT1 : positionRT2;
  const posWrite = posReadIndex === 0 ? positionRT2 : positionRT1;
  const velRead = velReadIndex === 0 ? velocityRT1 : velocityRT2;
  const velWrite = velReadIndex === 0 ? velocityRT2 : velocityRT1;
  
  positionMaterial.uniforms.tPosition.value = posRead.texture;
  positionMaterial.uniforms.tVelocity.value = velRead.texture;
  positionMaterial.uniforms.uTime.value = t;
  positionMaterial.uniforms.uDelta.value = dt;
  
  fboQuad.material = positionMaterial;
  renderer.setRenderTarget(posWrite);
  renderer.render(fboScene, fboCamera);
  
  velocityMaterial.uniforms.tPosition.value = posWrite.texture;
  velocityMaterial.uniforms.tVelocity.value = velRead.texture;
  velocityMaterial.uniforms.uTime.value = t;
  velocityMaterial.uniforms.uDelta.value = dt;
  
  fboQuad.material = velocityMaterial;
  renderer.setRenderTarget(velWrite);
  renderer.render(fboScene, fboCamera);
  
  renderer.setRenderTarget(null);
  
  posReadIndex = 1 - posReadIndex;
  velReadIndex = 1 - velReadIndex;
  
  // Update particle material
  particleMaterial.uniforms.tPosition.value = posWrite.texture;
  particleMaterial.uniforms.tVelocity.value = velWrite.texture;
  particleMaterial.uniforms.uTime.value = t;
  
  // Slow camera orbit for architectural reveal
  const orbitRadius = 75;
  const orbitSpeed = 0.04;
  camera.position.x = Math.sin(t * orbitSpeed) * orbitRadius;
  camera.position.z = Math.cos(t * orbitSpeed) * orbitRadius;
  camera.position.y = 12 + Math.sin(t * orbitSpeed * 0.5) * 15;
  camera.lookAt(0, -8, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
