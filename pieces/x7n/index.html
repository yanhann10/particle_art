<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x7n · reaction-diffusion flow</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05060a; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; color:#cdd2dc; opacity:0.55;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
        letter-spacing: 0.06em; pointer-events:none; }
</style>
</head>
<body>
<div class="id">x7n</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

const N = 30000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const phases = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r = Math.pow(Math.random(), 0.5) * 14;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.55;
  positions[i*3+2] = r * Math.cos(phi);
  seeds[i] = Math.random();
  phases[i] = Math.random() * 6.2831;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float phase;
    varying float vLife;
    varying vec3  vCol;

    vec3 hash3(vec3 p){
      p = vec3( dot(p, vec3(127.1, 311.7, 74.7)),
                dot(p, vec3(269.5, 183.3, 246.1)),
                dot(p, vec3(113.5, 271.9, 124.6)) );
      return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
    }
    
    float noise(vec3 p){
      vec3 i = floor(p), f = fract(p);
      vec3 u = f*f*(3.0-2.0*f);
      return mix( mix( mix( dot(hash3(i+vec3(0,0,0)), f-vec3(0,0,0)),
                            dot(hash3(i+vec3(1,0,0)), f-vec3(1,0,0)), u.x),
                       mix( dot(hash3(i+vec3(0,1,0)), f-vec3(0,1,0)),
                            dot(hash3(i+vec3(1,1,0)), f-vec3(1,1,0)), u.x), u.y),
                  mix( mix( dot(hash3(i+vec3(0,0,1)), f-vec3(0,0,1)),
                            dot(hash3(i+vec3(1,0,1)), f-vec3(1,0,1)), u.x),
                       mix( dot(hash3(i+vec3(0,1,1)), f-vec3(0,1,1)),
                            dot(hash3(i+vec3(1,1,1)), f-vec3(1,1,1)), u.x), u.y), u.z);
    }

    // Gray-Scott reaction-diffusion approximation
    vec3 reactionDiffusion(vec3 p, float t){
      float scale = 0.18;
      vec3 sp = p * scale + vec3(0.0, t * 0.25, 0.0);
      
      // Sample two fields: u (activator) and v (inhibitor)
      float u = noise(sp) * 0.5 + 0.5;
      float v = noise(sp + vec3(17.3, 24.1, 31.7)) * 0.5 + 0.5;
      
      // Laplacian approximation
      const float e = 0.15;
      float u_lap = 0.0;
      u_lap += noise(sp + vec3(e,0,0)) + noise(sp - vec3(e,0,0));
      u_lap += noise(sp + vec3(0,e,0)) + noise(sp - vec3(0,e,0));
      u_lap += noise(sp + vec3(0,0,e)) + noise(sp - vec3(0,0,e));
      u_lap = (u_lap - 6.0 * u * 2.0 + 3.0) * 0.5;
      
      float v_lap = 0.0;
      vec3 sp_v = sp + vec3(17.3, 24.1, 31.7);
      v_lap += noise(sp_v + vec3(e,0,0)) + noise(sp_v - vec3(e,0,0));
      v_lap += noise(sp_v + vec3(0,e,0)) + noise(sp_v - vec3(0,e,0));
      v_lap += noise(sp_v + vec3(0,0,e)) + noise(sp_v - vec3(0,0,e));
      v_lap = (v_lap - 6.0 * v * 2.0 + 3.0) * 0.5;
      
      // Gray-Scott parameters (spiral/wave regime)
      float F = 0.035 + 0.015 * sin(t * 0.3);
      float k = 0.062 + 0.008 * cos(t * 0.4);
      
      // Reaction terms
      float uvv = u * v * v;
      float du = u_lap * 0.16 - uvv + F * (1.0 - u);
      float dv = v_lap * 0.08 + uvv - (F + k) * v;
      
      // Create flow field from gradients
      vec3 grad_u = vec3(
        noise(sp + vec3(e,0,0)) - noise(sp - vec3(e,0,0)),
        noise(sp + vec3(0,e,0)) - noise(sp - vec3(0,e,0)),
        noise(sp + vec3(0,0,e)) - noise(sp - vec3(0,0,e))
      );
      
      vec3 grad_v = vec3(
        noise(sp_v + vec3(e,0,0)) - noise(sp_v - vec3(e,0,0)),
        noise(sp_v + vec3(0,e,0)) - noise(sp_v - vec3(0,e,0)),
        noise(sp_v + vec3(0,0,e)) - noise(sp_v - vec3(0,0,e))
      );
      
      // Perpendicular flow from gradient cross product
      vec3 flow = cross(grad_u, grad_v) + grad_u * du * 2.0;
      return normalize(flow + vec3(0.01)) * (0.5 + u * 1.5);
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.12 + seed * 6.2831;
      
      // Apply reaction-diffusion flow
      vec3 flow = reactionDiffusion(p, t);
      p += flow * (1.8 + 0.9 * sin(t * 0.5 + phase));
      
      // Pulsing life from reaction dynamics
      float localField = noise(p * 0.18 + vec3(0.0, t * 0.25, 0.0)) * 0.5 + 0.5;
      vLife = 0.3 + 0.7 * localField;
      vLife *= 0.6 + 0.4 * sin(t * 0.8 + phase);
      
      // Reaction-diffusion inspired palette: cyan->magenta->orange
      vec3 a = vec3(0.12, 0.78, 0.88);  // cyan (activator)
      vec3 b = vec3(0.92, 0.28, 0.72);  // magenta (inhibitor)
      vec3 c = vec3(0.98, 0.65, 0.22);  // orange (reaction)
      
      float reactMix = smoothstep(0.3, 0.7, localField);
      vCol = mix(a, b, reactMix);
      vCol = mix(vCol, c, smoothstep(0.75, 0.95, vLife) * 0.6);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 2.0 * vLife) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLife;
    varying vec3  vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * (0.5 + 0.5 * vLife);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  points.rotation.y = t * 0.035;
  points.rotation.x = Math.sin(t * 0.08) * 0.15;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
