<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>improv · tinguely-jam · cosmic machine stutter</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04030a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy · cosmic data sculpture …</div>
<div class="id">rhp</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 600);
camera.position.set(0, 2, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04030a, 1);
document.body.appendChild(renderer.domElement);

const N = 72000;
const restPos = new Float32Array(N * 3);
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const normals = new Float32Array(N * 3);

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0.0 },
  uStutter: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uStutter;
    attribute vec3 rest;
    attribute vec3 norm;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    vec3 mod289(vec3 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec4 mod289(vec4 x){ return x - floor(x*(1.0/289.0))*289.0; }
    vec4 perm(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      vec3 i = floor(v + dot(v, vec3(C.y)));
      vec3 x0 = v - i + dot(i, vec3(C.x));
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g, l.zxy);
      vec3 i2 = max(g, l.zxy);
      vec3 x1 = x0 - i1 + C.x;
      vec3 x2 = x0 - i2 + C.y;
      vec3 x3 = x0 - 0.5;
      i = mod289(i);
      vec4 p = perm(perm(perm(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 1.0/7.0;
      vec3 ns = n_ * vec3(0.0, 1.0, 2.0) - vec3(0.0, 0.5, 1.0);
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 xx = x_ * ns.x + ns.yyyy;
      vec4 yy = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(xx) - abs(yy);
      vec4 b0 = vec4(xx.xy, yy.xy);
      vec4 b1 = vec4(xx.zw, yy.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 nr = 1.79284291400159 - 0.85373472095314 *
        vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3));
      p0 *= nr.x; p1 *= nr.y; p2 *= nr.z; p3 *= nr.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    void main(){
      float t = uTime;
      vec3 p = rest;

      // Anadol flow field
      float flowScale = 0.18;
      float flowSpeed = 0.12;
      vec3 flowSample = p * flowScale + vec3(t * flowSpeed, t * flowSpeed * 0.7, t * flowSpeed * 0.5);

      float nx = snoise(flowSample);
      float ny = snoise(flowSample + vec3(31.7, 0.0, 0.0));
      float nz = snoise(flowSample + vec3(0.0, 47.3, 0.0));
      vec3 flow = vec3(nx, ny, nz);

      float flowMag = 1.2 + 0.6 * sin(seed * 6.28 + t * 0.3);
      p += flow * flowMag * 0.5;

      // surface lift
      float liftNoise = snoise(rest * 0.25 + vec3(0.0, t * 0.08, 0.0));
      float liftMask = smoothstep(0.35, 0.7, liftNoise);
      vec3 liftDir = normalize(norm + flow * 0.3);
      float liftPhase = sin(t * 0.4 + seed * 12.56 + liftNoise * 3.0);
      float liftAmount = liftMask * max(0.0, liftPhase) * 2.8;
      p += liftDir * liftAmount;

      // breathing pulse
      vec3 radial = normalize(p);
      p += radial * sin(t * 0.25 + seed * 6.28) * 0.15;

      // shimmer
      float shimmer = snoise(rest * 1.5 + t * 0.6) * 0.08;
      p += norm * shimmer;

      // TINGUELY SURPRISE: mechanical stutter-freeze (every ~5s)
      // Particles freeze in place, then snap back to motion like a jammed machine
      float stutterEnvelope = uStutter;
      if (stutterEnvelope > 0.0) {
        // freeze position sample from earlier moment
        float tFrozen = t - 0.5; // sample from half-second ago
        vec3 frozenSample = p * flowScale + vec3(tFrozen * flowSpeed, tFrozen * flowSpeed * 0.7, tFrozen * flowSpeed * 0.5);
        float nxF = snoise(frozenSample);
        float nyF = snoise(frozenSample + vec3(31.7, 0.0, 0.0));
        float nzF = snoise(frozenSample + vec3(0.0, 47.3, 0.0));
        vec3 flowF = vec3(nxF, nyF, nzF);
        
        vec3 pFrozen = rest;
        pFrozen += flowF * flowMag * 0.5;
        float liftNoiseF = snoise(rest * 0.25 + vec3(0.0, tFrozen * 0.08, 0.0));
        float liftMaskF = smoothstep(0.35, 0.7, liftNoiseF);
        vec3 liftDirF = normalize(norm + flowF * 0.3);
        float liftPhaseF = sin(tFrozen * 0.4 + seed * 12.56 + liftNoiseF * 3.0);
        float liftAmountF = liftMaskF * max(0.0, liftPhaseF) * 2.8;
        pFrozen += liftDirF * liftAmountF;
        
        // mix frozen position in during stutter
        p = mix(p, pFrozen, stutterEnvelope);
      }

      // assembly
      vec3 cosmicEntry = vec3(
        sin(seed * 73.1 + seed * seed * 11.0) * 40.0,
        cos(seed * 47.3) * 40.0 + 10.0,
        sin(seed * 91.7) * 40.0
      );
      float reveal = smoothstep(0.0, 1.0, uReady);
      p = mix(cosmicEntry, p, reveal);

      // color
      float energy = 0.3 + 0.7 * (0.5 + 0.5 * sin(t * 0.5 + seed * 6.28));
      float lift01 = liftAmount / 2.8;

      vec3 deepBlue  = vec3(0.08, 0.10, 0.28);
      vec3 cyan      = vec3(0.25, 0.65, 0.85);
      vec3 whitePeak = vec3(0.82, 0.90, 1.0);

      // TINGUELY color shift: during stutter, particles turn orange-red (machine heat)
      vec3 stutterOrange = vec3(1.0, 0.42, 0.15);
      
      vec3 col = mix(deepBlue, cyan, energy);
      col = mix(col, whitePeak, lift01 * 0.7 + energy * energy * 0.3);
      col = mix(col, stutterOrange, stutterEnvelope * 0.85);

      float alphaBase = 0.35 + 0.45 * energy;
      alphaBase += lift01 * 0.3;
      alphaBase += stutterEnvelope * 0.4; // brighten during stutter

      vCol = col;
      vAlpha = alphaBase * reveal;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (1.2 + 1.4 * energy + lift01 * 1.0) * uPixel * (42.0 / dist);
      gl_PointSize = sz * (0.3 + 0.7 * reveal);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if(r > 0.25) discard;
      float falloff = exp(-r * 14.0);
      float a = falloff * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');

const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
const loader = new PLYLoader();
let revealStart = 0;
let centroid = new THREE.Vector3();

loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const scale = 16 / maxAxis;
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmpPos = new THREE.Vector3();
    const tmpNrm = new THREE.Vector3();

    for (let i = 0; i < N; i++) {
      sampler.sample(tmpPos, tmpNrm);
      restPos[i * 3]     = tmpPos.x;
      restPos[i * 3 + 1] = tmpPos.y;
      restPos[i * 3 + 2] = tmpPos.z;
      normals[i * 3]     = tmpNrm.x;
      normals[i * 3 + 1] = tmpNrm.y;
      normals[i * 3 + 2] = tmpNrm.z;
      seeds[i] = Math.random();
      centroid.x += tmpPos.x;
      centroid.y += tmpPos.y;
      centroid.z += tmpPos.z;
    }
    centroid.divideScalar(N);

    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPos, 3));
    geom.setAttribute('norm',     new THREE.BufferAttribute(normals, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      loadingEl.textContent = `loading lucy · ${pct}% · cosmic data sculpture`;
    }
  },
  (err) => {
    loadingEl.textContent = 'load failed — check network';
    console.error(err);
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();

function loop() {
  const elapsed = (performance.now() - startTime) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 3500);
  }

  // TINGUELY STUTTER LOGIC: every ~5.2 seconds, freeze for 0.35s
  const stutterCycle = 5.2;
  const stutterDuration = 0.35;
  const cyclePhase = (elapsed % stutterCycle);
  
  let stutterValue = 0.0;
  if (cyclePhase < stutterDuration) {
    // sharp freeze, then pop back
    let t = cyclePhase / stutterDuration;
    // quick in, quick out (like a mechanical jam releasing)
    stutterValue = Math.sin(t * Math.PI);
  }
  uniforms.uStutter.value = stutterValue;

  // camera orbit (stutter affects this too for mechanical feel)
  const orbitRadius = 30 + 3 * Math.sin(elapsed * 0.06);
  let orbitAngle = elapsed * 0.08;
  
  // during stutter, camera also freezes momentarily
  if (stutterValue > 0.0) {
    const frozenAngle = Math.floor(elapsed / stutterCycle) * stutterCycle * 0.08;
    orbitAngle = orbitAngle * (1.0 - stutterValue) + frozenAngle * stutterValue;
  }
  
  const camY = centroid.y + 2.5 * Math.sin(elapsed * 0.05);
  camera.position.set(
    centroid.x + Math.sin(orbitAngle) * orbitRadius,
    camY,
    centroid.z + Math.cos(orbitAngle) * orbitRadius
  );
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
