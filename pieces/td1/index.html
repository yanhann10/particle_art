<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>td1 · hail-mary signal</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#030308; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>
</head>
<body>
<div class="id">td1</div>
<div class="hint">microphone drives the signal · drag to orbit</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── FFT / Microphone ── */
const fft = new Float32Array(5); // 5 bands: sub-bass, bass, mid, presence, brilliance
let analyser = null, dataArray = null, micActive = false;

// synthetic fallback — piece is alive without mic
function synthFFT(t) {
  fft[0] = 0.35 + 0.25 * Math.sin(t * 0.31);
  fft[1] = 0.30 + 0.20 * Math.sin(t * 0.53 + 1.0);
  fft[2] = 0.25 + 0.15 * Math.sin(t * 0.97 + 2.0);
  fft[3] = 0.15 + 0.10 * Math.sin(t * 1.7 + 3.0);
  fft[4] = 0.10 + 0.08 * Math.sin(t * 2.3 + 4.0);
}

async function initMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    document.querySelector('.hint').textContent = 'mic active · drag to orbit';
  } catch(e) {
    // fallback to synthetic
  }
}

function updateFFT(t) {
  if (micActive && analyser) {
    analyser.getByteFrequencyData(dataArray);
    const n = dataArray.length;
    const bandSize = Math.floor(n / 5);
    for (let b = 0; b < 5; b++) {
      let sum = 0;
      for (let i = b * bandSize; i < (b + 1) * bandSize && i < n; i++) {
        sum += dataArray[i];
      }
      fft[b] = (sum / bandSize) / 255.0;
    }
  } else {
    synthFFT(t);
  }
}

// request mic on first click
let micRequested = false;
addEventListener('click', () => {
  if (!micRequested) { micRequested = true; initMic(); }
}, { once: true });

/* ── L-system (inherited from x09 → y3k → 5i1) ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng) {
  let s = axiom;
  for (let d = 0; d < depth; d++) {
    let out = '';
    for (const ch of s) {
      if (ch in RULES) {
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]) {
          acc += opt.p;
          if (r <= acc) { out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str) {
  const H = new THREE.Vector3(0,1,0);
  const L = new THREE.Vector3(-1,0,0);
  const U = new THREE.Vector3(0,0,1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0,-7,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str) {
    switch(ch) {
      case 'F': {
        const step = STEP_BASE * Math.pow(0.78, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return segments;
}

function buildParticles(segments, totalN) {
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b,0);
  const positions = new Float32Array(totalN*3);
  const seeds = new Float32Array(totalN);
  const gens = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;
  for (let i = 0; i < segments.length; i++) {
    const share = i === segments.length-1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++) {
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5)*jitter;
      v.y += (Math.random()-0.5)*jitter;
      v.z += (Math.random()-0.5)*jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written] = Math.random();
      gens[written]  = segments[i].gen;
      written++;
    }
  }
  return { positions, seeds, gens };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 4, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x030308, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReady:  { value: 0 },
  uTwist:  { value: 0.92 },
  uGust:   { value: 0 },
  uYMin:   { value: -7.0 },
  uYMax:   { value: 6.0 },
  uBand0:  { value: 0.0 },
  uBand1:  { value: 0.0 },
  uBand2:  { value: 0.0 },
  uBand3:  { value: 0.0 },
  uBand4:  { value: 0.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uTwist;
    uniform float uGust;
    uniform float uYMin;
    uniform float uYMax;
    uniform float uBand0;
    uniform float uBand1;
    uniform float uBand2;
    uniform float uBand3;
    uniform float uBand4;
    attribute float seed;
    attribute float gen;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;

      /* sub-bass drives structural sway */
      float sway = 0.05 * gen * uBand0;
      p.x += sway * sin(t + p.y * 0.3);
      p.z += sway * cos(t * 0.9 + p.y * 0.3);

      /* reveal animation */
      vec3 entry = vec3(seed*4.0-2.0, 25.0+seed*8.0, seed*4.0-2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── Möbius transform ── */
      float yNorm = clamp((p.y - uYMin) / (uYMax - uYMin), 0.0, 1.0);
      float theta = yNorm * 6.2832;
      float s = p.x * 1.4 + p.z * 0.4;
      float R = 5.0;
      float ht = theta * 0.5;

      vec3 mPos;
      mPos.x = (R + s * cos(ht)) * cos(theta);
      mPos.z = (R + s * cos(ht)) * sin(theta);
      mPos.y = s * sin(ht);

      /* rotation — mid-freq band modulates speed */
      float rot = uTwist * uTime * (0.08 + 0.08 * uBand2);
      float cr = cos(rot), sr = sin(rot);
      vec3 mRot = vec3(mPos.x*cr - mPos.z*sr, mPos.y, mPos.x*sr + mPos.z*cr);

      /* ── signal erosion: bass band drives wind/gust ── */
      float edgeDist = abs(s) / (abs(s) + 0.8);
      float gustPhase = uTime * 0.35 + seed * 6.28;
      float localGust = uGust * (0.5 + 0.5 * sin(gustPhase * 0.6 + theta * 2.0));

      vec3 windDir = normalize(vec3(0.75, 0.18, 0.55));
      float surfaceShift = localGust * 0.4 * (0.2 + 0.8 * edgeDist);
      mRot += windDir * surfaceShift;

      float detach = smoothstep(0.5, 0.9, edgeDist) * smoothstep(0.4, 0.85, seed);
      float peel = detach * uGust * 2.8;
      mRot += windDir * peel;
      mRot.y -= peel * 0.35;

      /* presence band → high-freq tremor (signal static) */
      float tremor = edgeDist * (0.06 + 0.25 * uBand3);
      mRot.x += tremor * sin(uTime * 9.0 + seed * 40.0);
      mRot.z += tremor * cos(uTime * 7.5 + seed * 35.0);

      /* brilliance band → particle scatter/expansion (signal reaching outward) */
      float scatter = uBand4 * 0.6 * edgeDist;
      mRot += normalize(mRot + 0.001) * scatter;

      p = mix(p, mRot, uTwist);

      /* ── Tau-Ceti palette: xenon blue + sodium amber + pale pink ── */
      float energy = 0.5 + 0.5 * sin(t * 0.5);

      vec3 xenonBlue   = vec3(0.45, 0.62, 0.92);
      vec3 deepBlue    = vec3(0.15, 0.22, 0.48);
      vec3 sodiumAmber = vec3(0.92, 0.68, 0.28);
      vec3 palePink    = vec3(0.82, 0.62, 0.72);
      vec3 signalWhite = vec3(0.90, 0.92, 0.96);

      float stripK = yNorm;
      /* base: deep blue to xenon along the strip */
      vec3 col = mix(deepBlue, xenonBlue, stripK);

      /* mid-freq pushes toward amber (signal warmth) */
      col = mix(col, sodiumAmber, uBand2 * 0.45 * (0.5 + 0.5 * sin(theta * 2.0)));

      /* edge particles pick up pale pink */
      col = mix(col, palePink, edgeDist * 0.25);

      /* brilliance drives bright signal flashes */
      col = mix(col, signalWhite, uBand4 * detach * 0.6);

      /* peeled particles lighten */
      col = mix(col, signalWhite * 0.8, detach * uGust * 0.5);

      /* faint shimmer */
      col += 0.03 * vec3(
        sin(theta * 3.0) * 0.5 + 0.5,
        sin(theta * 3.0 + 1.5) * 0.3,
        sin(theta * 3.0 + 3.0) * 0.4
      );

      vCol = mix(vec3(0.12, 0.15, 0.30), col, uTwist);

      /* alpha: sub-bass makes the whole form breathe */
      vAlpha = (0.45 + 0.35 * energy + 0.2 * uBand0) * (1.0 - detach * uGust * 0.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* bass band pumps particle size */
      float sizePump = 1.0 + 0.5 * uBand1;
      gl_PointSize = (1.0 + 0.6 * energy) * sizePump * uPixel * (42.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;
let treeBB = { yMin: -7, yMax: 6 };

function regrow(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str);
  const bb = new THREE.Box3();
  for (const sg of segs) { bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const sg of segs) {
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y - (-7);
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y - (-7);
  }
  const bb2 = new THREE.Box3();
  for (const sg of segs) { bb2.expandByPoint(sg.from); bb2.expandByPoint(sg.to); }
  treeBB.yMin = bb2.min.y;
  treeBB.yMax = bb2.max.y;
  uniforms.uYMin.value = treeBB.yMin;
  uniforms.uYMax.value = treeBB.yMax;

  const { positions, seeds, gens } = buildParticles(segs, N);
  if (!geom) {
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(42);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

/* smoothed band values for gentle transitions */
const smoothBand = new Float32Array(5);

const start = performance.now();
function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }

  /* update FFT bands */
  updateFFT(elapsed);

  /* smooth the bands to avoid jitter */
  for (let i = 0; i < 5; i++) {
    smoothBand[i] += (fft[i] - smoothBand[i]) * 0.12;
  }

  uniforms.uBand0.value = smoothBand[0];
  uniforms.uBand1.value = smoothBand[1];
  uniforms.uBand2.value = smoothBand[2];
  uniforms.uBand3.value = smoothBand[3];
  uniforms.uBand4.value = smoothBand[4];

  /* twist: Möbius dominant, sub-bass modulates breathing */
  const twistBase = 0.88 + 0.10 * Math.cos(elapsed * 0.13) + 0.04 * smoothBand[0];
  const relax = 0.10 * smoothstep(0, 2, (elapsed % 30) - 24) *
                       (1 - smoothstep(0, 2, (elapsed % 30) - 28));
  uniforms.uTwist.value = Math.max(0.0, Math.min(1.0, twistBase - relax));

  /* gust driven by bass band — audio is the wind */
  const gustBase = smoothBand[1] * 0.7;
  const gustSlow = 0.15 * Math.sin(elapsed * 0.22);
  uniforms.uGust.value = Math.max(0, Math.min(1, gustBase + gustSlow));

  /* camera: gentle orbit drift, sub-bass pushes slight pull-back */
  const drift = elapsed * 0.015;
  const pullback = 1.0 + smoothBand[0] * 0.3;
  const camR = 22 * pullback;
  const targetX = camR * Math.sin(drift) * 0.15;
  const targetZ = camR * Math.cos(drift) * 0.15;
  controls.target.lerp(new THREE.Vector3(targetX * 0.03, smoothBand[0] * -0.3, targetZ * 0.03), 0.02);
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
