<body>
<div class="id">td1</div>
<div class="hint">microphone drives the signal · drag to orbit · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── FFT / Microphone ── */
const fft = new Float32Array(5);
let analyser = null, dataArray = null, micActive = false;

function synthFFT(t) {
  fft[0] = 0.35 + 0.25 * Math.sin(t * 0.31);
  fft[1] = 0.30 + 0.20 * Math.sin(t * 0.53 + 1.0);
  fft[2] = 0.25 + 0.15 * Math.sin(t * 0.97 + 2.0);
  fft[3] = 0.15 + 0.10 * Math.sin(t * 1.7  + 3.0);
  fft[4] = 0.10 + 0.08 * Math.sin(t * 2.3  + 4.0);
}

async function initMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    micActive = true;
    document.querySelector('.hint').textContent = 'mic active · drag to orbit · click to regrow';
  } catch(e) { /* fallback to synthetic */ }
}

function updateFFT(t) {
  if (micActive && analyser) {
    analyser.getByteFrequencyData(dataArray);
    const n = dataArray.length;
    const bandSize = Math.floor(n / 5);
    for (let b = 0; b < 5; b++) {
      let sum = 0;
      for (let i = b * bandSize; i < (b + 1) * bandSize && i < n; i++) sum += dataArray[i];
      fft[b] = (sum / bandSize) / 255.0;
    }
  } else {
    synthFFT(t);
  }
}

let micRequested = false;
addEventListener('click', () => {
  if (!micRequested) { micRequested = true; initMic(); }
});

/* ── SEEDED RNG (mulberry32) ── */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ── CURLY LEAF GENERATOR ──
   Each leaf is an Euler spiral (Cornu/clothoid) segment — curvature increases
   linearly, producing the tight-then-opening scroll of a fiddlehead or fern frond.
   Secondary side pinnae are added as shorter sub-spirals.
   Returns an array of {from, to, gen} segments.
*/
function buildLeafSegments(rng, opts = {}) {
  const {
    tightness   = 0.7,   // curvature rate (0.3–1.2)
    size        = 1.0,   // overall scale
    pinnaeCount = 6,     // number of side frond pairs
    pinnaeScale = 0.45,  // side pinnae relative length
  } = opts;

  const segments = [];
  const STEPS = 120;     // integration steps for main spiral
  const dt = 1.0 / STEPS;

  // Euler spiral: x(t) = ∫cos(k t²/2) dt, y(t) = ∫sin(k t²/2) dt
  // We integrate numerically and scale by `size`.
  const k = tightness * Math.PI * 2.0;
  const spiralPts = [];
  let sx = 0, sy = 0, theta = 0;
  for (let i = 0; i <= STEPS; i++) {
    const tParam = i * dt;
    spiralPts.push(new THREE.Vector3(sx * size, sy * size, 0));
    theta = k * tParam * tParam * 0.5;
    sx += Math.cos(theta) * dt;
    sy += Math.sin(theta) * dt;
  }

  // Main spine segments (gen 0)
  for (let i = 0; i < spiralPts.length - 1; i++) {
    segments.push({ from: spiralPts[i].clone(), to: spiralPts[i + 1].clone(), gen: 0 });
  }

  // Side pinnae: at regular intervals along the main spiral
  const pinnaStep = Math.floor(STEPS / (pinnaeCount + 1));
  for (let pi = 1; pi <= pinnaeCount; pi++) {
    const baseIdx = pi * pinnaStep;
    if (baseIdx >= spiralPts.length - 1) continue;
    const basePos = spiralPts[baseIdx].clone();

    // Tangent direction at this point
    const tParam = baseIdx * dt;
    const mainTheta = k * tParam * tParam * 0.5;
    const tx = Math.cos(mainTheta);
    const ty = Math.sin(mainTheta);
    // Normal (perpendicular)
    const nx = -ty, ny = tx;

    // Pinna on both sides, shrinking as we go up the frond
    const pinnaShrink = 1.0 - (pi / (pinnaeCount + 1)) * 0.6;
    const pinnaLen = size * pinnaeScale * pinnaShrink;
    const subSteps = 30;
    const subK = k * 0.6;

    for (const side of [1, -1]) {
      // mini Euler spiral rotated to pinna direction
      let px = 0, py = 0, pTheta = 0;
      let prev = basePos.clone();
      for (let j = 0; j < subSteps; j++) {
        const tp = j / subSteps;
        pTheta = subK * tp * tp * 0.5;
        const localX = Math.cos(pTheta) * (1 / subSteps);
        const localY = Math.sin(pTheta) * (1 / subSteps);
        // Rotate local coords into the frame of the pinna (outward from main frond)
        const angle = Math.atan2(ty, tx) + side * (Math.PI * 0.5 - 0.3);
        const ca = Math.cos(angle), sa = Math.sin(angle);
        const wx = (ca * localX - sa * localY) * pinnaLen * subSteps;
        const wy = (sa * localX + ca * localY) * pinnaLen * subSteps;
        const cur = new THREE.Vector3(
          basePos.x + px + wx,
          basePos.y + py + wy,
          basePos.z
        );
        segments.push({ from: prev.clone(), to: cur.clone(), gen: 1 + pi });
        prev = cur.clone();
        px += wx;
        py += wy;
      }
    }
  }

  return segments;
}

/* ── WORLD LAYOUT: 8 leaves in a grid-jittered arrangement ── */
const NUM_LEAVES = 8;
const N_TOTAL = 80000;
const N_PER_LEAF = Math.floor(N_TOTAL / NUM_LEAVES);

// Grid-jitter positions spread across the world space
// 2×4 grid, each cell ≈ 10 units wide, 12 units tall
// positions in world XZ plane, leaves grow upward in Y
function computeLeafPositions(rng) {
  const positions = [];
  const cols = 4, rows = 2;
  const cellW = 10.0, cellH = 12.0;
  const offX = -(cols * cellW) / 2;
  const offZ = -(rows * cellH) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const jx = (rng() - 0.5) * cellW * 0.5;
      const jz = (rng() - 0.5) * cellH * 0.5;
      positions.push(new THREE.Vector3(
        offX + c * cellW + cellW * 0.5 + jx,
        -3.0 + (rng() - 0.5) * 2.0,
        offZ + r * cellH + cellH * 0.5 + jz
      ));
    }
  }
  return positions;
}

// Per-leaf aesthetic params
function computeLeafParams(rng) {
  return {
    tightness:   0.3 + rng() * 0.9,   // 0.3–1.2
    size:        1.8 + rng() * 2.2,   // 1.8–4.0
    pinnaeCount: 3 + Math.floor(rng() * 6), // 3–8
    pinnaeScale: 0.35 + rng() * 0.25, // 0.35–0.60
    // tilt: small static X/Z tilt in radians, stays fixed (no rotation)
    tiltX: (rng() - 0.5) * 0.4,
    tiltZ: (rng() - 0.5) * 0.4,
    // audio band assignment for this leaf (0–4)
    audioBand: Math.floor(rng() * 5),
    // colour hue offset
    hueOff: rng(),
  };
}

/* ── buildParticles for a single leaf's segments ── */
function buildLeafParticles(segments, n, leafIdx, tiltX, tiltZ) {
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a, b) => a + b, 0.0001);
  const positions = new Float32Array(n * 3);
  const seeds     = new Float32Array(n);
  const gens      = new Float32Array(n);
  const leafIds   = new Float32Array(n);
  const v = new THREE.Vector3();
  // rotation matrix for static tilt (around X then Z, no Y)
  const qx = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), tiltX);
  const qz = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1), tiltZ);
  const qtilt = qz.multiply(qx);

  let written = 0;
  for (let i = 0; i < segments.length; i++) {
    const share = i === segments.length - 1
      ? n - written
      : Math.max(1, Math.floor(n * lens[i] / total));
    for (let k = 0; k < share && written < n; k++) {
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.035 * Math.pow(0.82, segments[i].gen);
      v.x += (Math.random() - 0.5) * jitter;
      v.y += (Math.random() - 0.5) * jitter;
      v.z += (Math.random() - 0.5) * jitter;
      // Apply static tilt (baked into geometry, not runtime rotation)
      v.applyQuaternion(qtilt);
      positions[written * 3]     = v.x;
      positions[written * 3 + 1] = v.y;
      positions[written * 3 + 2] = v.z;
      seeds[written]   = Math.random();
      gens[written]    = segments[i].gen;
      leafIds[written] = leafIdx;
      written++;
    }
  }
  return { positions, seeds, gens, leafIds };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 8, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x030308, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

/* ── Combined geometry for all leaves ── */
const allPositions = new Float32Array(N_TOTAL * 3);
const allSeeds     = new Float32Array(N_TOTAL);
const allGens      = new Float32Array(N_TOTAL);
const allLeafIds   = new Float32Array(N_TOTAL);
// Per-leaf offsets (world position) baked as attributes
const allOffX      = new Float32Array(N_TOTAL);
const allOffY      = new Float32Array(N_TOTAL);
const allOffZ      = new Float32Array(N_TOTAL);
// Per-leaf audio band index
const allBand      = new Float32Array(N_TOTAL);
// Per-leaf hue
const allHue       = new Float32Array(N_TOTAL);

let geom = null, points = null;
let revealStart = 0;

// Store leaf params for regrowing
let leafWorldPositions = [];
let leafParams = [];

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReady:  { value: 0 },
  // 5 smoothed audio bands
  uBand0:  { value: 0.0 },
  uBand1:  { value: 0.0 },
  uBand2:  { value: 0.0 },
  uBand3:  { value: 0.0 },
  uBand4:  { value: 0.0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uBand0;
    uniform float uBand1;
    uniform float uBand2;
    uniform float uBand3;
    uniform float uBand4;

    attribute float seed;
    attribute float gen;
    attribute float leafId;
    attribute float offX;
    attribute float offY;
    attribute float offZ;
    attribute float bandIdx;  /* which audio band this leaf listens to (0–4) */
    attribute float hue;

    varying vec3  vCol;
    varying float vAlpha;

    /* pick band value by index */
    float getBand(float idx) {
      if (idx < 0.5) return uBand0;
      if (idx < 1.5) return uBand1;
      if (idx < 2.5) return uBand2;
      if (idx < 3.5) return uBand3;
      return uBand4;
    }

    /* simple HSL→RGB for per-leaf colour variation */
    vec3 hsl2rgb(float h, float s, float l) {
      vec3 rgb = clamp(abs(mod(h*6.0 + vec3(0.0,4.0,2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
      return l + s * (rgb - 0.5) * (1.0 - abs(2.0*l - 1.0));
    }

    void main(){
      /* world position = leaf-local position + baked offset */
      vec3 p = position + vec3(offX, offY, offZ);

      float bandVal = getBand(bandIdx);
      float t = uTime * 0.4 + seed * 6.28318;

      /* ── organic sway: no rotation, just sinusoidal displacement ──
         sub-bass sways the whole leaf gently;
         the assigned band adds a per-leaf breathing pulse. */
      float sway = 0.04 * (1.0 + gen * 0.5) * (uBand0 * 0.6 + bandVal * 0.8);
      p.x += sway * sin(t + offZ * 0.2 + gen * 0.5);
      p.z += sway * cos(t * 0.85 + offX * 0.2 + gen * 0.4);
      /* slight upward breath from band energy */
      p.y += bandVal * 0.25 * sin(t * 1.3 + seed * 3.14);

      /* ── reveal animation: particles rain down from above ── */
      vec3 entry = vec3(offX + (seed - 0.5) * 3.0,
                        offY + 18.0 + seed * 6.0,
                        offZ + (seed - 0.5) * 3.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── high-freq tremor on tips (gen > 2) ── */
      float tipFactor = smoothstep(1.0, 4.0, gen);
      float tremor = tipFactor * (0.04 + 0.18 * uBand3);
      p.x += tremor * sin(uTime * 8.5  + seed * 37.0);
      p.z += tremor * cos(uTime * 7.1  + seed * 31.0);

      /* brilliance band → scatter at leaf tips */
      float scatter = uBand4 * 0.45 * tipFactor;
      vec3 dir = normalize(position + 0.001);
      p += dir * scatter;

      /* ── colour: organic green-gold palette, per-leaf hue shift ── */
      float energy = 0.5 + 0.5 * sin(t * 0.4);

      /* base green-to-gold sweep via hue attribute */
      float h = mod(hue + 0.28 + 0.08 * sin(t * 0.3), 1.0); /* 0.28≈green, shift toward gold */
      float s = 0.55 + 0.25 * bandVal;
      float l = 0.30 + 0.18 * energy + 0.12 * uBand2;

      vec3 baseCol = hsl2rgb(h, s, l);

      /* tip-glow: bright pale jade when band is active */
      vec3 tipGlow = vec3(0.78, 0.96, 0.72);
      baseCol = mix(baseCol, tipGlow, tipFactor * bandVal * 0.55);

      /* brilliance flashes white */
      vec3 white = vec3(0.95, 0.97, 0.90);
      baseCol = mix(baseCol, white, uBand4 * tipFactor * 0.4);

      /* sub-bass gives the whole world a deep-teal breath */
      vec3 teal = vec3(0.12, 0.38, 0.42);
      baseCol = mix(baseCol, teal, uBand0 * (1.0 - tipFactor) * 0.35);

      vCol = baseCol;

      /* ── alpha: breathe with energy + band ── */
      vAlpha = (0.40 + 0.30 * energy + 0.25 * bandVal) * smoothstep(0.0, 0.05, uReady);

      /* ── point sizing: bass pumps size; tips slightly bigger ── */
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mv.z, 0.5);
      float sizePump = 1.0 + 0.55 * uBand1;
      float tipBoost = 1.0 + 0.4 * tipFactor;
      gl_PointSize = (1.0 + 0.5 * energy) * sizePump * tipBoost * uPixel * (38.0 / dist);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

/* ── BUILD / REBUILD all leaves ── */
function buildWorld(masterSeed) {
  const rng = makeRng(masterSeed);

  leafWorldPositions = computeLeafPositions(rng);
  leafParams = [];
  for (let i = 0; i < NUM_LEAVES; i++) {
    leafParams.push(computeLeafParams(rng));
  }

  let offset = 0;
  for (let i = 0; i < NUM_LEAVES; i++) {
    const lp = leafParams[i];
    const segs = buildLeafSegments(rng, {
      tightness:   lp.tightness,
      size:        lp.size,
      pinnaeCount: lp.pinnaeCount,
      pinnaeScale: lp.pinnaeScale,
    });
    const worldPos = leafWorldPositions[i];
    const n = (i === NUM_LEAVES - 1) ? N_TOTAL - offset : N_PER_LEAF;
    const { positions, seeds, gens } = buildLeafParticles(segs, n, i, lp.tiltX, lp.tiltZ);

    allPositions.set(positions, offset * 3);
    allSeeds.set(seeds, offset);
    allGens.set(gens, offset);

    for (let j = 0; j < n; j++) {
      allLeafIds[offset + j] = i;
      allOffX[offset + j]    = worldPos.x;
      allOffY[offset + j]    = worldPos.y;
      allOffZ[offset + j]    = worldPos.z;
      allBand[offset + j]    = lp.audioBand;
      allHue[offset + j]     = lp.hueOff;
    }
    offset += n;
  }

  if (!geom) {
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(allPositions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(allSeeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(allGens, 1));
    geom.setAttribute('leafId',   new THREE.BufferAttribute(allLeafIds, 1));
    geom.setAttribute('offX',     new THREE.BufferAttribute(allOffX, 1));
    geom.setAttribute('offY',     new THREE.BufferAttribute(allOffY, 1));
    geom.setAttribute('offZ',     new THREE.BufferAttribute(allOffZ, 1));
    geom.setAttribute('bandIdx',  new THREE.BufferAttribute(allBand, 1));
    geom.setAttribute('hue',      new THREE.BufferAttribute(allHue, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    const attrs = ['position','seed','gen','leafId','offX','offY','offZ','bandIdx','hue'];
    for (const a of attrs) { geom.attributes[a].needsUpdate = true; }
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

let worldSeed = 42;
buildWorld(worldSeed);

/* ── Click to regrow (new random world) ── */
addEventListener('click', () => {
  worldSeed = (Math.random() * 0xFFFFFF) | 0;
  buildWorld(worldSeed);
});

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

const smoothBand = new Float32Array(5);
const start = performance.now();

function loop() {
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2400);
  }

  updateFFT(elapsed);

  for (let i = 0; i < 5; i++) {
    smoothBand[i] += (fft[i] - smoothBand[i]) * 0.10;
  }
  uniforms.uBand0.value = smoothBand[0];
  uniforms.uBand1.value = smoothBand[1];
  uniforms.uBand2.value = smoothBand[2];
  uniforms.uBand3.value = smoothBand[3];
  uniforms.uBand4.value = smoothBand[4];

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
