<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9t9 · calligraphic cycle · four states of ink</title>
<!-- MOTION: morph, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .state { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em;
           transition: opacity 0.3s; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">9t9</div>
<div class="state" id="stateLabel">ink stroke</div>
<div class="hint">click to cycle states · drag to orbit</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const STATES = [
  { name:'ink stroke',    bg:0x08080d, formColor:0xe8dcc0, fogDensity:0.014 },
  { name:'leaf canopy',   bg:0x0a0d08, formColor:0x8ab560, fogDensity:0.018 },
  { name:'thread web',    bg:0x06080d, formColor:0x7ca8d0, fogDensity:0.010 },
  { name:'ember drift',   bg:0x0d0808, formColor:0xe8a040, fogDensity:0.020 }
];
let stateIdx = 0, crossT = 1.0;
const stateLabel = document.getElementById('stateLabel');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(STATES[0].bg, STATES[0].fogDensity);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(STATES[0].bg, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─── differential growth (from 2iy/5gm) ───
const MAX_VERTS=1800, ATTRACT=0.06, REPEL_R=0.46, REPEL_STR=0.13;
const NOISE_S=0.003, PRESSURE=0.0028, RISE=0.0042, MAX_D=0.36;
const verts = [];
for(let i=0;i<18;i++){
  const th=i/18*Math.PI*2, r=1.4+(Math.random()-0.5)*0.1;
  verts.push({x:Math.cos(th)*r, y:0, z:Math.sin(th)*r, age:0});
}
const CELL=REPEL_R, grid=new Map();
function key3(x,y,z){return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL);}
function rebuildGrid(){
  grid.clear();
  for(let i=0;i<verts.length;i++){
    const v=verts[i],k=key3(v.x,v.y,v.z);
    if(!grid.has(k))grid.set(k,[]);grid.get(k).push(i);
  }
}
function nbrs(v){
  const cx=Math.floor(v.x/CELL),cy=Math.floor(v.y/CELL),cz=Math.floor(v.z/CELL),out=[];
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const a=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));if(a)for(const i of a)out.push(i);
  } return out;
}
let growPaused=false;
function step(){
  if(growPaused)return;
  const n=verts.length;if(n>=MAX_VERTS)return;
  rebuildGrid();
  const dx=new Float32Array(n),dy=new Float32Array(n),dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of nbrs(v)){if(j===i)continue;const u=verts[j];
      const ex=v.x-u.x,ey=v.y-u.y,ez=v.z-u.z,d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6)continue;
      const d=Math.sqrt(d2),f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f;dy[i]+=ey*f;dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n],b=verts[(i+1)%n],v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=verts[i].x;cy+=verts[i].y;cz+=verts[i].z;}
  cx/=n;cy/=n;cz/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx,oy=verts[i].y-cy,oz=verts[i].z-cz,d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;dy[i]+=(oy/d)*PRESSURE*0.4;dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age,up=RISE*(0.3+1.2*Math.min(a*1.5,1));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+up;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i],b=verts[(i+1)%n];grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS)
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,age:Math.max(a.age,b.age)*0.5});
  }
  verts.length=0;for(const v of grown)verts.push(v);
}
for(let s=0;s<700;s++)step();

// ─── state renderers ───
let activeGroup = new THREE.Group();
scene.add(activeGroup);

// Shared material refs
const tubeMat = new THREE.MeshBasicMaterial({color:0xe8dcc0,transparent:true,opacity:0.88});
const leafMat = new THREE.MeshBasicMaterial({color:0x8ab560,transparent:true,opacity:0.82,side:THREE.DoubleSide});
const lineMat = new THREE.LineBasicMaterial({color:0x7ca8d0,transparent:true,opacity:0.35});
const dotMat  = new THREE.PointsMaterial({color:0x7ca8d0,size:0.06,transparent:true,opacity:0.7});
const emberMat= new THREE.PointsMaterial({color:0xe8a040,size:0.09,transparent:true,opacity:0.75});

// leaf geometry template — a tapered quad
const leafGeo = new THREE.BufferGeometry();
const lv = new Float32Array([0,0,0, 0.04,0.12,0, 0,0.28,0, -0.04,0.12,0]);
leafGeo.setAttribute('position',new THREE.BufferAttribute(lv,3));
leafGeo.setIndex([0,1,2, 0,2,3]);
leafGeo.computeVertexNormals();

function clearGroup(){
  while(activeGroup.children.length){
    const c=activeGroup.children[0];
    activeGroup.remove(c);
    if(c.geometry)c.geometry.dispose();
  }
}

function buildInkTube(){
  clearGroup();
  if(verts.length<8)return;
  const pts=verts.map(v=>new THREE.Vector3(v.x,v.y,v.z));
  const curve=new THREE.CatmullRomCurve3(pts,true,'catmullrom',0.5);
  const NS=Math.min(800,verts.length*2), RAD=6;
  const radii=new Array(NS);
  for(let i=0;i<NS;i++){
    const t=i/NS,dt=1/NS;
    const t1=curve.getTangent((t-dt+1)%1),t2=curve.getTangent(t),t3=curve.getTangent((t+dt)%1);
    const curv=(2-t1.dot(t2)-t2.dot(t3))*0.5;
    radii[i]=0.018+0.10*Math.min(1,curv*8);
  }
  const pos=new Float32Array(NS*RAD*3),idx=[];
  const up=new THREE.Vector3(0,1,0);
  for(let i=0;i<NS;i++){
    const t=i/NS,p=curve.getPointAt(t),tan=curve.getTangentAt(t).normalize();
    const n=new THREE.Vector3().crossVectors(tan,up).normalize();
    if(n.lengthSq()<0.001)n.set(1,0,0);
    const bn=new THREE.Vector3().crossVectors(tan,n).normalize();
    const r=radii[i];
    for(let j=0;j<RAD;j++){
      const a=(j/RAD)*Math.PI*2;
      const vv=new THREE.Vector3().copy(n).multiplyScalar(Math.cos(a)*r)
        .add(bn.clone().multiplyScalar(Math.sin(a)*r)).add(p);
      pos[(i*RAD+j)*3]=vv.x;pos[(i*RAD+j)*3+1]=vv.y;pos[(i*RAD+j)*3+2]=vv.z;
    }
  }
  for(let i=0;i<NS;i++){const ni=(i+1)%NS;
    for(let j=0;j<RAD;j++){const nj=(j+1)%RAD;
      const a=i*RAD+j,b=i*RAD+nj,c=ni*RAD+j,d=ni*RAD+nj;
      idx.push(a,b,c,b,d,c);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  tubeMat.color.set(STATES[0].formColor);
  activeGroup.add(new THREE.Mesh(g,tubeMat));
}

function buildLeaves(){
  clearGroup();
  const n=verts.length;if(n<8)return;
  // Place a leaf at every 3rd vertex, oriented along tangent, with size variation
  const dummy=new THREE.Object3D();
  const mesh=new THREE.InstancedMesh(leafGeo,leafMat,Math.floor(n/3));
  let ci=0;
  for(let i=0;i<n&&ci<mesh.count;i+=3){
    const v=verts[i],nxt=verts[(i+1)%n];
    const tx=nxt.x-v.x,ty=nxt.y-v.y,tz=nxt.z-v.z;
    const len=Math.hypot(tx,ty,tz)+1e-6;
    dummy.position.set(v.x,v.y,v.z);
    // orient leaf along tangent with some twist
    dummy.lookAt(v.x+tx/len,v.y+ty/len,v.z+tz/len);
    dummy.rotateZ(i*0.618*Math.PI*2); // golden-angle twist
    const s=0.6+Math.sin(i*0.37)*0.4;
    dummy.scale.set(s,s,s);
    dummy.updateMatrix();
    mesh.setMatrixAt(ci,dummy.matrix);
    ci++;
  }
  mesh.instanceMatrix.needsUpdate=true;
  leafMat.color.set(STATES[1].formColor);
  activeGroup.add(mesh);

  // Add thin branch lines connecting every 6th vertex
  const branchPts=[];
  for(let i=0;i<n;i+=2)branchPts.push(verts[i].x,verts[i].y,verts[i].z);
  const bg=new THREE.BufferGeometry();
  bg.setAttribute('position',new THREE.Float32BufferAttribute(branchPts,3));
  const branchMat=new THREE.LineBasicMaterial({color:0x5a7040,transparent:true,opacity:0.3});
  activeGroup.add(new THREE.Line(bg,branchMat));
}

function buildThreadWeb(){
  clearGroup();
  const n=verts.length;if(n<8)return;
  // Lines connecting each vertex to its nearest non-adjacent neighbor
  const linePts=[];
  for(let i=0;i<n;i+=2){
    const v=verts[i];
    let bestD=Infinity,bestJ=-1;
    for(let j=0;j<n;j+=3){
      if(Math.abs(j-i)<4)continue;
      const dx=v.x-verts[j].x,dy=v.y-verts[j].y,dz=v.z-verts[j].z;
      const d2=dx*dx+dy*dy+dz*dz;
      if(d2<bestD&&d2>0.01){bestD=d2;bestJ=j;}
    }
    if(bestJ>=0&&bestD<2.5){
      linePts.push(v.x,v.y,v.z,verts[bestJ].x,verts[bestJ].y,verts[bestJ].z);
    }
  }
  const lg=new THREE.BufferGeometry();
  lg.setAttribute('position',new THREE.Float32BufferAttribute(linePts,3));
  lineMat.color.set(STATES[2].formColor);
  activeGroup.add(new THREE.LineSegments(lg,lineMat));

  // Small dots at vertices
  const dp=new Float32Array(n*3);
  for(let i=0;i<n;i++){dp[i*3]=verts[i].x;dp[i*3+1]=verts[i].y;dp[i*3+2]=verts[i].z;}
  const dg=new THREE.BufferGeometry();
  dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
  dotMat.color.set(STATES[2].formColor);
  activeGroup.add(new THREE.Points(dg,dotMat));
}

// Ember state: particles drift upward from their positions
let emberOffsets=null;
function buildEmberDrift(){
  clearGroup();
  const n=verts.length;if(n<8)return;
  emberOffsets=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    emberOffsets[i*3]=(Math.random()-0.5)*0.02;
    emberOffsets[i*3+1]=0.005+Math.random()*0.015;
    emberOffsets[i*3+2]=(Math.random()-0.5)*0.02;
  }
  const pp=new Float32Array(n*3);
  for(let i=0;i<n;i++){pp[i*3]=verts[i].x;pp[i*3+1]=verts[i].y;pp[i*3+2]=verts[i].z;}
  const pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
  emberMat.color.set(STATES[3].formColor);
  activeGroup.add(new THREE.Points(pg,emberMat));
}

function updateEmberDrift(){
  if(stateIdx!==3||!emberOffsets)return;
  const pts=activeGroup.children[0];
  if(!pts||!pts.geometry)return;
  const pos=pts.geometry.attributes.position;
  const n=pos.count;
  for(let i=0;i<n;i++){
    pos.array[i*3]+=emberOffsets[i*3];
    pos.array[i*3+1]+=emberOffsets[i*3+1];
    pos.array[i*3+2]+=emberOffsets[i*3+2];
    // gentle sine wobble
    pos.array[i*3]+=Math.sin(performance.now()*0.001+i)*0.002;
  }
  pos.needsUpdate=true;
}

const builders=[buildInkTube, buildLeaves, buildThreadWeb, buildEmberDrift];
builders[0]();

// ─── click cycle ───
let clickCooldown=0;
addEventListener('click', (e)=>{
  if(e.target.closest('.hint'))return;
  const now=performance.now();
  if(now-clickCooldown<400)return;
  clickCooldown=now;
  stateIdx=(stateIdx+1)%4;
  crossT=0;
  stateLabel.textContent=STATES[stateIdx].name;
  builders[stateIdx]();
});

// ─── cross-fade helpers ───
const bgColor=new THREE.Color();
const targetBg=new THREE.Color();

function lerpState(dt){
  if(crossT>=1)return;
  crossT=Math.min(1,crossT+dt*2.5); // ~0.4s fade
  const s=STATES[stateIdx];
  targetBg.set(s.bg);
  bgColor.copy(renderer.getClearColor(new THREE.Color()));
  bgColor.lerp(targetBg,crossT);
  renderer.setClearColor(bgColor,1);
  scene.fog.color.copy(bgColor);
  scene.fog.density+=(s.fogDensity-scene.fog.density)*crossT;
  // fade opacity
  const opacity=0.3+0.7*crossT;
  tubeMat.opacity=0.88*opacity;
  leafMat.opacity=0.82*opacity;
  lineMat.opacity=0.35*opacity;
  dotMat.opacity=0.7*opacity;
  emberMat.opacity=0.75*opacity;
}

// ─── resize ───
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ─── main loop ───
let lastT=performance.now();
function loop(){
  const now=performance.now(),dt=(now-lastT)/1000;lastT=now;

  // grow only in ink and leaf states
  if(stateIdx<2)for(let s=0;s<2;s++)step();

  // rebuild ink tube continuously when in state 0
  if(stateIdx===0&&verts.length>8)buildInkTube();
  if(stateIdx===3)updateEmberDrift();

  lerpState(dt);

  // camera follow centroid
  let ym=0;for(const v of verts)ym+=v.y;ym/=Math.max(verts.length,1);
  const tY=Math.max(ym,2);
  controls.target.y+=(tY-controls.target.y)*0.04;
  camera.position.y+=(tY+4-camera.position.y)*0.04;

  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
