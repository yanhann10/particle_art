<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gnc · substrate lines</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f4f1ed; overflow:hidden;
               color:#3a3632; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#3a3632; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">gnc</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Jared Tarbell · Substrate · line-crossing growth</div>
<div class="stat" id="stat">lines=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Substrate — lines spawn from edges, grow perpendicular,
   stop on collision, spawn new perpendicular lines at crossing.
   Tarbell's urban-organic maze rendered as particle clusters. */

const BG = 0xf4f1ed;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.012);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 18, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

// substrate state
const BOUNDS = 18;
const STEP = 0.08;
const MAX_LINES = 300;
const lines = [];
let paused = false;
let generation = 0;

class Line {
  constructor(x, z, angle, gen) {
    this.points = [{x, z}];
    this.angle = angle;
    this.alive = true;
    this.gen = gen;
  }
  step() {
    if (!this.alive) return;
    const last = this.points[this.points.length - 1];
    const nx = last.x + Math.cos(this.angle) * STEP;
    const nz = last.z + Math.sin(this.angle) * STEP;
    
    // check bounds
    if (Math.abs(nx) > BOUNDS || Math.abs(nz) > BOUNDS) {
      this.alive = false;
      return;
    }
    
    // check collision with existing lines
    for (const other of lines) {
      if (other === this || !other.alive) continue;
      for (let i = 0; i < other.points.length - 1; i++) {
        const a = other.points[i];
        const b = other.points[i + 1];
        if (segmentIntersect(last.x, last.z, nx, nz, a.x, a.z, b.x, b.z)) {
          this.alive = false;
          // spawn new line perpendicular at intersection point
          const ix = (last.x + nx) / 2;
          const iz = (last.z + nz) / 2;
          const newAngle = this.angle + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1);
          if (lines.length < MAX_LINES) {
            lines.push(new Line(ix, iz, newAngle, generation + 1));
          }
          return;
        }
      }
    }
    
    this.points.push({x: nx, z: nz});
  }
}

function segmentIntersect(x1, z1, x2, z2, x3, z3, x4, z4) {
  const den = (x1 - x2) * (z3 - z4) - (z1 - z2) * (x3 - x4);
  if (Math.abs(den) < 1e-8) return false;
  const t = ((x1 - x3) * (z3 - z4) - (z1 - z3) * (x3 - x4)) / den;
  const u = -((x1 - x2) * (z1 - z3) - (z1 - z2) * (x1 - x3)) / den;
  return t > 0.05 && t < 0.95 && u > 0.05 && u < 0.95;
}

// seed initial lines from edges
for (let i = 0; i < 8; i++) {
  const edge = Math.floor(Math.random() * 4);
  let x, z, angle;
  if (edge === 0) { // top
    x = (Math.random() - 0.5) * BOUNDS * 2;
    z = BOUNDS;
    angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  } else if (edge === 1) { // right
    x = BOUNDS;
    z = (Math.random() - 0.5) * BOUNDS * 2;
    angle = Math.PI + (Math.random() - 0.5) * 0.6;
  } else if (edge === 2) { // bottom
    x = (Math.random() - 0.5) * BOUNDS * 2;
    z = -BOUNDS;
    angle = Math.PI / 2 + (Math.random() - 0.5) * 0.6;
  } else { // left
    x = -BOUNDS;
    z = (Math.random() - 0.5) * BOUNDS * 2;
    angle = 0 + (Math.random() - 0.5) * 0.6;
  }
  lines.push(new Line(x, z, angle, 0));
}

addEventListener('click', () => { paused = !paused; });

function stepSubstrate() {
  if (paused) return;
  let anyAlive = false;
  for (const line of lines) {
    if (line.alive) {
      line.step();
      anyAlive = true;
    }
  }
  if (anyAlive) generation++;
}

// render: 40k particles along lines
const N_RENDER = 40000;
const rPos = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rGen = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('gen', new THREE.BufferAttribute(rGen, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float gen;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec3 p = position;
      
      // subtle vertical offset by generation — later lines float slightly higher
      p.y += gen * 0.015;
      
      // very gentle drift
      float t = uTime * 0.15 + seed * 6.28;
      p.x += sin(t) * 0.004;
      p.z += cos(t * 0.8) * 0.004;
      
      // palette: warm earth tones, subtle variation by generation
      // Tarbell substrate: ochre → rust → charcoal
      vec3 ochre = vec3(0.82, 0.68, 0.45);
      vec3 rust = vec3(0.72, 0.42, 0.28);
      vec3 charcoal = vec3(0.25, 0.22, 0.20);
      vec3 warmGray = vec3(0.55, 0.50, 0.48);
      
      float gn = mod(gen, 4.0) / 3.0;
      vec3 c1 = mix(ochre, rust, gn);
      vec3 c2 = mix(warmGray, charcoal, gn);
      vCol = mix(c1, c2, seed);
      
      vAlpha = 0.4 + seed * 0.3;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      gl_PointSize = 1.5 * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      float core = exp(-r * 20.0);
      float soft = exp(-r * 6.0) * 0.4;
      float a = (core + soft) * vAlpha;
      
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 1200; s++) stepSubstrate();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  for (let s = 0; s < 2; s++) stepSubstrate();
  
  // compute total line length
  let totalLen = 0;
  const lineLengths = [];
  for (const line of lines) {
    let len = 0;
    for (let i = 0; i < line.points.length - 1; i++) {
      const a = line.points[i];
      const b = line.points[i + 1];
      len += Math.hypot(b.x - a.x, b.z - a.z);
    }
    lineLengths.push(len);
    totalLen += len;
  }
  
  // distribute particles
  if (totalLen > 0) {
    let written = 0;
    for (let li = 0; li < lines.length && written < N_RENDER; li++) {
      const line = lines[li];
      const share = Math.max(1, Math.floor(N_RENDER * lineLengths[li] / totalLen));
      
      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const totalPts = line.points.length;
        if (totalPts < 2) continue;
        
        const idx = Math.min(totalPts - 2, Math.floor(u * (totalPts - 1)));
        const a = line.points[idx];
        const b = line.points[idx + 1];
        const v = Math.random();
        
        const spread = 0.02;
        rPos[written * 3] = a.x + (b.x - a.x) * v + (Math.random() - 0.5) * spread;
        rPos[written * 3 + 1] = (Math.random() - 0.5) * 0.05;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * v + (Math.random() - 0.5) * spread;
        rGen[written] = line.gen;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gen.needsUpdate = true;
  }
  
  // camera tracks centroid
  let cx = 0, cz = 0, count = 0;
  for (const line of lines) {
    for (const pt of line.points) {
      cx += pt.x;
      cz += pt.z;
      count++;
    }
  }
  if (count > 0) {
    cx /= count;
    cz /= count;
    controls.target.lerp(new THREE.Vector3(cx, 0, cz), 0.02);
  }
  
  statEl.textContent = `lines=${lines.length} gen=${generation}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
