<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v8k · umbra · Boltanski shadow</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#080807; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>
</head>
<body>
<div class="id">v8k</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Chain from l7f (Salcedo ghostly) through UMBRA:
   Christian Boltanski's shadow installations — simple forms
   projecting enormous, trembling shadows onto walls. The
   vascular tower now becomes the occluding body; a single
   warm light source behind it casts a vast shadow-particle
   field onto a spectral back-plane. The absence zones deepen
   into true umbral voids — not dissolution but eclipse.
   Penumbral edges glow faintly amber where light just
   barely reaches past the form. ── */

const BG = new THREE.Color(0x080807);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080807, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(12, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

// occluded museum lighting — dimmer than l7f
const keyLight = new THREE.DirectionalLight(0xd8d0c8, 0.25);
keyLight.position.set(4, 12, 6);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0x100e0c, 0.5));

// the shadow-casting light: warm, positioned behind/below the form
const shadowSource = new THREE.PointLight(0xc8a878, 0.55, 40);
shadowSource.position.set(-3, 2, -6);
scene.add(shadowSource);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.03;
controls.target.set(0, 5, 0);

// ─── differential growth core (inherited from l7f/9qc) ───
const MAX_VERTS = 1200;
const ATTRACT = 0.05, REPEL_R = 0.50, REPEL_STR = 0.11;
const NOISE_S = 0.002, PRESSURE = 0.0022, RISE = 0.004, MAX_D = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i/16 * Math.PI*2;
  const r = 1.3 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr) for(const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of gridNeighbors(v)){
      if(j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx_=0,cy_=0,cz_=0;
  for(let i=0;i<n;i++){cx_+=verts[i].x;cy_+=verts[i].y;cz_+=verts[i].z;}
  cx_/=n; cy_/=n; cz_/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx_, oy=verts[i].y-cy_, oz=verts[i].z-cz_;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}
for(let s=0;s<600;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

// ─── umbral absence: voids deepen into true darkness, penumbral edges glow ───
function absenceAt(tt, time){
  const v1 = Math.sin(tt*5.3 + time*0.05)*0.5+0.5;
  const v2 = Math.sin(tt*8.7 + time*0.03+1.7)*0.5+0.5;
  const v3 = Math.sin(tt*3.1 + time*0.08+3.1)*0.5+0.5;
  return Math.pow(v1*v2*0.7 + v3*0.3, 0.7);
}

// ─── form particles: darker than l7f, umbral tones ───
const FORM_P = 16000;
const fGeo = new THREE.BufferGeometry();
const fPos = new Float32Array(FORM_P*3);
const fAlpha = new Float32Array(FORM_P);
const fSize = new Float32Array(FORM_P);
const fEdge = new Float32Array(FORM_P); // penumbra edge glow factor
fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
fGeo.setAttribute('alpha', new THREE.BufferAttribute(fAlpha, 1));
fGeo.setAttribute('size', new THREE.BufferAttribute(fSize, 1));
fGeo.setAttribute('edge', new THREE.BufferAttribute(fEdge, 1));

const fMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uColor1: { value: new THREE.Color(0x504a45) },
    uColor2: { value: new THREE.Color(0x3a3530) },
    uEdgeColor: { value: new THREE.Color(0x9a7a50) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    attribute float size;
    attribute float edge;
    varying float vAlpha;
    varying float vFog;
    varying float vEdge;
    void main(){
      vAlpha = alpha;
      vEdge = edge;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.018*0.018*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, size * (10.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor1, uColor2, uEdgeColor, uFogColor;
    varying float vAlpha, vFog, vEdge;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float soft = smoothstep(0.5, 0.12, d);
      vec3 col = mix(uColor1, uColor2, vEdge*0.3);
      col = mix(col, uEdgeColor, vEdge * 0.4);
      col = mix(col, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `
});
scene.add(new THREE.Points(fGeo, fMat));

// ─── shadow projection particles (Boltanski): projected onto a back-wall plane ───
const SHADOW_P = 10000;
const sGeo = new THREE.BufferGeometry();
const sPos = new Float32Array(SHADOW_P*3);
const sAlpha = new Float32Array(SHADOW_P);
const sSize = new Float32Array(SHADOW_P);
sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
sGeo.setAttribute('alpha', new THREE.BufferAttribute(sAlpha, 1));
sGeo.setAttribute('size', new THREE.BufferAttribute(sSize, 1));

const WALL_Z = 10.0; // back wall distance
const sMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uColor: { value: new THREE.Color(0x020201) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    attribute float size;
    varying float vAlpha, vFog;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.018*0.018*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, size * (12.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor, uFogColor;
    varying float vAlpha, vFog;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float soft = smoothstep(0.5, 0.05, d);
      vec3 col = mix(uColor, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `
});
scene.add(new THREE.Points(sGeo, sMat));

// ─── ash: slower, darker drift — motes in eclipsed air ───
const ASH = 2000;
const aGeo = new THREE.BufferGeometry();
const aPos = new Float32Array(ASH*3);
const aAlpha = new Float32Array(ASH);
const aDrift = new Float32Array(ASH*3);
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('alpha', new THREE.BufferAttribute(aAlpha, 1));

for(let i=0;i<ASH;i++){
  aPos[i*3]=(Math.random()-0.5)*16;
  aPos[i*3+1]=Math.random()*20;
  aPos[i*3+2]=(Math.random()-0.5)*16;
  aDrift[i*3]=(Math.random()-0.5)*0.001;
  aDrift[i*3+1]=-0.0015-Math.random()*0.002;
  aDrift[i*3+2]=(Math.random()-0.5)*0.001;
  aAlpha[i]=Math.random()*0.08;
}

const aMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uColor: { value: new THREE.Color(0x706860) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha, vFog;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.018*0.018*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, 1.8 * (8.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor, uFogColor;
    varying float vAlpha, vFog;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      vec3 col = mix(uColor, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * smoothstep(0.5, 0.1, d));
    }
  `
});
scene.add(new THREE.Points(aGeo, aMat));

// ─── threads: darker, heavier — shadows of hair ───
const THREAD_N = 30, THREAD_SEG = 14;
const threadGroup = new THREE.Group();
scene.add(threadGroup);
const threadMat = new THREE.LineBasicMaterial({
  color: 0x2a2520, transparent: true, opacity: 0.2
});
let threadsBuilt = false;

const threadSeeds = [];
for(let i=0;i<THREAD_N;i++){
  threadSeeds.push({
    t: (i+0.5)/THREAD_N,
    len: 0.8+Math.random()*3.0,
    sway: (Math.random()-0.5)*0.3,
    phase: Math.random()*Math.PI*2
  });
}

function buildThreads(curve, yMin, yMax){
  while(threadGroup.children.length){
    const c=threadGroup.children[0]; c.geometry.dispose(); threadGroup.remove(c);
  }
  for(const s of threadSeeds){
    const p = curve.getPointAt(s.t);
    if(p.y < yMin+(yMax-yMin)*0.25) continue;
    const pts=[];
    for(let j=0;j<=THREAD_SEG;j++){
      const f=j/THREAD_SEG;
      pts.push(new THREE.Vector3(
        p.x + s.sway*f*f,
        p.y - s.len*f,
        p.z + Math.sin(f*3+s.phase)*0.04
      ));
    }
    threadGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts), threadMat
    ));
  }
  threadsBuilt = true;
}

// occluded inner warmth — dimmer, more amber
const innerLight = new THREE.PointLight(0x8a6840, 0.15, 12);
innerLight.position.set(0, 5, 0);
scene.add(innerLight);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let prevTime = start, lastThreadT = -99;
const up = new THREE.Vector3(0,1,0);
const lightPos = new THREE.Vector3();

function loop(){
  const now = performance.now();
  const t = (now-start)/1000;
  prevTime = now;

  step();

  // shadow source orbits slowly — like a candle carried past
  shadowSource.position.set(
    -3 + Math.sin(t*0.06)*2,
    2 + Math.sin(t*0.04)*0.5,
    -6 + Math.cos(t*0.05)*1.5
  );
  lightPos.copy(shadowSource.position);
  // flicker like a candle
  shadowSource.intensity = 0.45 + 0.15*Math.sin(t*3.7)*Math.sin(t*5.3);

  if(verts.length > 8){
    let yMin=Infinity, yMax=-Infinity, cxV=0, cyV=0, czV=0;
    for(const v of verts){
      if(v.y<yMin) yMin=v.y; if(v.y>yMax) yMax=v.y;
      cxV+=v.x; cyV+=v.y; czV+=v.z;
    }
    cxV/=verts.length; cyV/=verts.length; czV/=verts.length;
    const yRange = Math.max(yMax-yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    if(t-lastThreadT > 5){ buildThreads(curve, yMin, yMax); lastThreadT=t; }

    // populate form particles — darker, with penumbra edge detection
    const SAMPLES = Math.min(600, verts.length*2);
    const RING = Math.max(2, Math.floor(FORM_P / SAMPLES));
    let pi = 0;

    for(let i=0; i<SAMPLES && pi<FORM_P; i++){
      const tt = i/SAMPLES;
      const p = curve.getPointAt(tt);
      const hFrac = Math.max(0, Math.min(1, (p.y-yMin)/yRange));

      let r = 0.30 * (1.0 - hFrac*0.60);
      const node = Math.sin(tt*22.0)*0.5+0.5;
      r *= 1.0 + 0.12*Math.pow(node, 6);
      r *= 1.0 + 0.012*Math.sin(t*0.3 + tt*6.0);

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if(normal.lengthSq()<0.001) normal.set(1,0,0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      const absence = absenceAt(tt, t);
      // umbral transition: absence creates deep voids
      const umbralDepth = Math.pow(absence, 1.5);
      // penumbra = edge zone where absence transitions
      const penumbra = absence > 0.3 && absence < 0.7 ? 
        1.0 - Math.abs(absence - 0.5) * 5.0 : 0.0;

      for(let j=0; j<RING && pi<FORM_P; j++){
        const ang = (j/RING)*Math.PI*2 + (Math.random()-0.5)*0.4;
        const rr = r * (0.6 + Math.random()*0.7);
        const scatter = 0.02*(1.0 + umbralDepth*3.0);

        const px = p.x + normal.x*Math.cos(ang)*rr + binormal.x*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;
        const py = p.y + normal.y*Math.cos(ang)*rr + binormal.y*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;
        const pz = p.z + normal.z*Math.cos(ang)*rr + binormal.z*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;

        fPos[pi*3]=px; fPos[pi*3+1]=py; fPos[pi*3+2]=pz;

        // umbral: deep voids go nearly black, penumbra edges glow
        const baseA = 0.18 + 0.42*(1.0 - umbralDepth);
        const topFade = hFrac > 0.82 ? 1.0-(hFrac-0.82)/0.18 : 1.0;
        fAlpha[pi] = baseA * topFade;
        fEdge[pi] = Math.max(0, penumbra);
        fSize[pi] = 2.0 + Math.random()*2.0;
        pi++;
      }
    }
    for(;pi<FORM_P;pi++){ fAlpha[pi]=0; fEdge[pi]=0; }
    fGeo.attributes.position.needsUpdate = true;
    fGeo.attributes.alpha.needsUpdate = true;
    fGeo.attributes.size.needsUpdate = true;
    fGeo.attributes.edge.needsUpdate = true;

    // ─── shadow projection: ray from light through form onto back wall ───
    let si = 0;
    const projScale = 2.8;
    for(let i=0; i<SAMPLES && si<SHADOW_P; i++){
      const tt = i/SAMPLES;
      const p = curve.getPointAt(tt);
      const absence = absenceAt(tt, t);
      // shadow is stronger where form is present (low absence)
      const shadowStr = Math.pow(1.0 - absence, 1.2);
      if(shadowStr < 0.15) continue;

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if(normal.lengthSq()<0.001) normal.set(1,0,0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      let r = 0.30 * (1.0 - Math.max(0,Math.min(1,(p.y-yMin)/yRange))*0.60);

      const shadowRing = Math.max(1, Math.floor((SHADOW_P/SAMPLES)*shadowStr));
      for(let j=0; j<shadowRing && si<SHADOW_P; j++){
        const ang = (j/shadowRing)*Math.PI*2 + (Math.random()-0.5)*0.6;
        const rr = r * (0.5 + Math.random()*0.8);
        const fx = p.x + normal.x*Math.cos(ang)*rr + binormal.x*Math.sin(ang)*rr;
        const fy = p.y + normal.y*Math.cos(ang)*rr + binormal.y*Math.sin(ang)*rr;
        const fz = p.z + normal.z*Math.cos(ang)*rr + binormal.z*Math.sin(ang)*rr;

        // project from light through point onto wall at z=WALL_Z
        const dx = fx - lightPos.x, dy = fy - lightPos.y, dz = fz - lightPos.z;
        if(Math.abs(dz) < 0.001) continue;
        const wallT = (WALL_Z - lightPos.z) / dz;
        if(wallT < 0) continue;

        const wx = lightPos.x + dx * wallT * projScale;
        const wy = lightPos.y + dy * wallT * projScale;

        // scatter for soft shadow edge
        const softR = 0.15 + (1.0 - shadowStr)*0.6;
        sPos[si*3]   = wx + (Math.random()-0.5)*softR;
        sPos[si*3+1] = wy + (Math.random()-0.5)*softR;
        sPos[si*3+2] = WALL_Z + (Math.random()-0.5)*0.3;

        sAlpha[si] = shadowStr * 0.25 * (0.6 + Math.random()*0.4);
        sSize[si] = 3.0 + Math.random()*4.0;
        si++;
      }
    }
    for(;si<SHADOW_P;si++) sAlpha[si]=0;
    sGeo.attributes.position.needsUpdate = true;
    sGeo.attributes.alpha.needsUpdate = true;
    sGeo.attributes.size.needsUpdate = true;

    innerLight.position.set(cxV, cyV, czV);
    innerLight.intensity = 0.12 + 0.05*Math.sin(t*0.2);

    // camera tracks centroid
    const tgtY = Math.max(cyV, 2.0);
    controls.target.x += (cxV - controls.target.x)*0.015;
    controls.target.y += (tgtY - controls.target.y)*0.025;
    controls.target.z += (czV - controls.target.z)*0.015;
    camera.position.y += (tgtY+3.5 - camera.position.y)*0.018;
  }

  // ash drift
  for(let i=0;i<ASH;i++){
    aPos[i*3]   += aDrift[i*3] + Math.sin(t*0.35+i*0.37)*0.0002;
    aPos[i*3+1] += aDrift[i*3+1];
    aPos[i*3+2] += aDrift[i*3+2] + Math.cos(t*0.3+i*0.53)*0.0002;
    if(aPos[i*3+1]<-1){
      aPos[i*3]=(Math.random()-0.5)*16;
      aPos[i*3+1]=18+Math.random()*4;
      aPos[i*3+2]=(Math.random()-0.5)*16;
    }
    aAlpha[i] = Math.min(0.08, Math.max(0, aPos[i*3+1]*0.005));
  }
  aGeo.attributes.position.needsUpdate = true;
  aGeo.attributes.alpha.needsUpdate = true;

  // threads sway
  if(threadsBuilt){
    for(const child of threadGroup.children){
      const arr = child.geometry.attributes.position.array;
      for(let j=3; j<arr.length; j+=3){
        const frac = j / arr.length;
        arr[j] += Math.sin(t*0.15 + frac*4)*0.00012;
        arr[j+2] += Math.cos(t*0.13 + frac*3)*0.00008;
      }
      child.geometry.attributes.position.needsUpdate = true;
    }
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
