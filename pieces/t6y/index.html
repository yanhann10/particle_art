<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>t6y · celadon</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">t6y · celadon</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev:  { value: rtA.texture },
  uDt:   { value: 0.012 },
  uA:    { value: 0.95 },
  uB:    { value: 0.70 },
  uC:    { value: 0.60 },
  uD:    { value: 3.50 },
  uE:    { value: 0.25 },
  uF:    { value: 0.10 },
  uGust: { value: 0.0 },
  uGlaze: { value: 0.0 },
  uTime: { value: 0.0 },
  uRes:  { value: new THREE.Vector2(W, H) }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uGust, uGlaze, uTime;
    uniform vec2 uRes;
    varying vec2 vUv;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      vec2 pid = vUv * uRes;

      // Aizawa attractor field (parent base)
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );

      float h1 = hash(pid);
      float h2 = hash(pid + 71.0);
      float h3 = hash(pid + 137.0);

      // Leaf-flurry gust (inherited from parent, fading as glaze increases)
      if(uGust > 0.01){
        float phase = h1 * 6.2832;
        float freq = 3.0 + h2 * 5.0;
        float flutter_x = sin(uTime * freq + phase) * (0.8 + h3);
        float flutter_y = cos(uTime * freq * 0.7 + phase * 1.3) * (0.6 + h1);
        float flutter_z = sin(uTime * freq * 0.5 + phase * 0.7) * 0.4;
        vec3 centroid = vec3(0.0, 0.0, 1.0);
        vec3 outward = normalize(p - centroid + vec3(0.001));
        float dist = length(p - centroid);
        vec3 gustForce = outward * (2.5 / (1.0 + dist))
                       + vec3(flutter_x, flutter_y - 0.6, flutter_z) * 1.8;
        // Gust weakens as glaze takes over
        dp += gustForce * uGust * (1.0 - uGlaze);
      }

      // Celadon glaze dynamics: viscous laminar flow replacing chaotic leaf scatter
      // Particles pool into rivulets flowing downward along the attractor surface
      if(uGlaze > 0.01){
        float g = uGlaze;

        // Assign particles to rivulet channels based on hash
        float channel = floor(h1 * 7.0); // 7 rivulet streams
        float channelPhase = channel * 0.897;

        // Rivulet axis: particles flow toward vertical drip lines on the attractor
        // The attractor centroid ~(0,0,1), rivulets drip from top to bottom
        float theta = channelPhase + 0.3 * sin(uTime * 0.2 + channel);
        vec3 rivAxis = vec3(cos(theta) * 0.4, -1.0, sin(theta) * 0.4);

        // Lateral attraction: pull particles toward their rivulet center line
        vec3 rivCenter = vec3(cos(theta) * 0.5, p.y, sin(theta) * 0.5 + 1.0);
        vec3 toRiv = rivCenter - p;
        toRiv.y = 0.0; // only lateral pull
        float latDist = length(toRiv);

        // Viscous downward flow with surface tension (particles bunch together)
        float flowSpeed = 0.4 + 0.3 * h2;
        // Slow near bottom, pool there
        float pooling = smoothstep(-1.5, -0.5, p.y);
        flowSpeed *= (1.0 - pooling * 0.8);

        vec3 glazeForce = vec3(0.0);
        // Lateral cohesion into rivulets
        glazeForce += toRiv * 2.0 * smoothstep(0.0, 0.8, latDist);
        // Gravity drip
        glazeForce.y -= flowSpeed;
        // Slight viscous damping of attractor velocity
        dp *= mix(1.0, 0.3, g);
        // Surface tension: slow particles near neighbors (approximated by damping high velocities)
        float speed = length(dp);
        if(speed > 1.5) dp *= 1.5 / speed;

        dp += glazeForce * g * 1.5;

        // Contain: if particle drips below -2, wrap to top with lateral offset toward rivulet
        if(p.y < -2.0){
          p.y = 1.8 + h3 * 0.5;
          p.x = cos(theta) * (0.3 + h2 * 0.3);
          p.z = sin(theta) * (0.3 + h2 * 0.3) + 1.0;
        }
      }

      // Damping increases with glaze — viscous medium
      float damping = mix(1.0, 0.92, uGlaze);
      p += dp * uDt * damping;

      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// Render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 80);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uGust:  { value: 0.0 },
    uGlaze: { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uGust;
    uniform float uGlaze;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vGlaze;
    varying float vY;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vGust = uGust;
      vGlaze = uGlaze;
      vY = p.y;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // Size: during gust, larger (leaf). During glaze, variable — thicker in pooling regions
      float gustSize = 1.0 + uGust * 1.2 * (1.0 - uGlaze);
      // Pooling particles at bottom are bigger (thick glaze accumulation)
      float poolFactor = smoothstep(-1.8, -0.5, p.y) * uGlaze;
      float glazeSize = 1.0 + poolFactor * 1.8;
      float sz = (1.1 + 1.5 * vSpeed) * uPixel * (8.0 / max(dist, 0.5)) * gustSize * glazeSize;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vGlaze;
    varying float vY;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);

      // Parent palette: emerald → violet → silver (leaf-flurry)
      vec3 a_leaf = vec3(0.20, 0.62, 0.45);
      vec3 b_leaf = vec3(0.55, 0.30, 0.78);
      vec3 c_leaf = vec3(0.92, 0.95, 0.98);

      // Autumn gust palette (inherited from parent)
      vec3 a_aut = vec3(0.85, 0.55, 0.12);
      vec3 b_aut = vec3(0.72, 0.28, 0.10);
      vec3 c_aut = vec3(0.98, 0.92, 0.78);

      // Celadon glaze palette: Ru ware jade-grey-green (Longquan celadon reference)
      vec3 a_cel = vec3(0.55, 0.74, 0.62); // jade green
      vec3 b_cel = vec3(0.40, 0.58, 0.50); // deeper celadon
      vec3 c_cel = vec3(0.78, 0.86, 0.80); // pale crackle highlight

      // Transition: leaf → celadon as glaze increases
      float gustBlend = vGust * (1.0 - vGlaze);
      vec3 ca = mix(a_leaf, a_aut, gustBlend);
      vec3 cb = mix(b_leaf, b_aut, gustBlend);
      vec3 cc = mix(c_leaf, c_aut, gustBlend);

      ca = mix(ca, a_cel, vGlaze);
      cb = mix(cb, b_cel, vGlaze);
      cc = mix(cc, c_cel, vGlaze);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(ca, cb, smoothstep(0.0, 0.5, k));
      col = mix(col, cc, smoothstep(0.5, 1.0, k));

      // In glaze mode, pooling regions glow slightly brighter (thicker glaze = more luminous)
      float poolGlow = smoothstep(-1.8, -0.5, vY) * vGlaze * 0.3;
      col += poolGlow * vec3(0.1, 0.15, 0.1);

      // Opacity: glaze particles slightly more opaque (denser material)
      float opacity = a * (0.45 + vSpeed * 0.9 + vGlaze * 0.2);
      gl_FragColor = vec4(col * opacity, opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();
// Gust timing (from parent): every ~11s, a ~2.5s flurry — fades as glaze takes over
const gustPeriod = 11.0;
const gustDuration = 2.5;
const gustAttack = 0.4;
const gustDecay = 1.8;

// Glaze transition: starts at ~8s, fully celadon by ~30s
const glazeStart = 8.0;
const glazeFull = 30.0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;

  // Glaze progression: 0 → 1 over time
  const glaze = Math.min(1.0, Math.max(0.0, (elapsed - glazeStart) / (glazeFull - glazeStart)));
  simUniforms.uGlaze.value = glaze;
  pointsMat.uniforms.uGlaze.value = glaze;

  // Gust envelope (weakens as glaze increases)
  const cycleT = elapsed % gustPeriod;
  let gust = 0.0;
  if(cycleT < gustDuration){
    if(cycleT < gustAttack){
      gust = (cycleT / gustAttack);
      gust = gust * gust;
    } else {
      const decayT = (cycleT - gustAttack) / gustDecay;
      gust = Math.max(0.0, 1.0 - decayT);
      gust = gust * gust;
    }
  }
  // Gusts fade with glaze
  gust *= (1.0 - glaze * 0.85);
  simUniforms.uGust.value = gust;
  pointsMat.uniforms.uGust.value = gust;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // Camera: slow orbit, pulls back during gust; as glaze sets, settles to a contemplative angle
  const ang = elapsed * 0.12;
  const baseDist = mix(4.0, 3.5, glaze); // closer for glaze detail
  const camDist = baseDist + gust * 2.0;
  camera.position.x = Math.sin(ang) * camDist;
  camera.position.z = Math.cos(ang) * camDist;
  // Camera tilts down slightly as glaze drips downward
  const camY = mix(Math.sin(ang * 0.7) * 1.0, 0.3, glaze);
  camera.position.y = camY;
  // Look at centroid which shifts down as glaze pools
  const lookY = mix(1.0, 0.2, glaze);
  camera.lookAt(0, lookY, 1.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function mix(a, b, t){ return a + (b - a) * t; }

loop();
</script>
