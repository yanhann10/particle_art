<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CROSS-POLLINATE: sibling zs4 (Lorenz attractor) chosen as most different from
     botanical calyx. Borrowing Lorenz's warm-amber→deep-indigo trajectory palette
     and chaotic drift perturbation, mapped onto the parent's cupped petal bowl.
     Turrell-style drifting light reveals curvature; warm gallery-wall backdrop. -->
<!-- MOTION: drift, intensity: gentle -->
<title>wm7 · calyx × Lorenz</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               background: linear-gradient(175deg, #e8ddd0 0%, #d9ccbb 30%, #c7b9a7 60%, #b5a593 100%);
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">wm7</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 12, 18);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points;

const uniforms = {
  uTime:     { value: 0 },
  uPhase:    { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uRowFreq:  { value: 1.2 },
  uColFreq:  { value: 1.0 },
  uWaveAmp:  { value: 0.5 },
  uTwist:    { value: 0.0 },
  uMorph:    { value: 0.0 },
  uPetals:   { value: 5.0 },
  uCupDepth: { value: 4.0 },
  uLightDir: { value: new THREE.Vector3(1, 0.5, 0.3) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;
    uniform float uMorph;
    uniform float uPetals;
    uniform float uCupDepth;
    uniform vec3  uLightDir;

    attribute vec2  gridPos;
    attribute float seed;

    varying float vDensity;
    varying float vHeight;
    varying float vNdotL;
    varying float vRadial;

    void main(){
      vec2 gp = gridPos;

      /* Riley wave interference — speed ~2× per user direction */
      float rowWave = sin(gp.y * uRowFreq + uTime * 1.2 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.7) * uWaveAmp;

      float twist = uTwist * length(gp) * 0.04;
      float ct = cos(twist); float st = sin(twist);
      vec2 twisted = vec2(gp.x * ct - gp.y * st, gp.x * st + gp.y * ct);

      float r     = length(gp);
      float maxR  = 12.0;
      float nr    = clamp(r / maxR, 0.0, 1.0);
      float theta = atan(gp.y, gp.x);

      /* Lorenz-inspired chaotic drift projected onto surface */
      float lx = sin(theta * 2.7 + uTime * 0.3) * nr * 0.45;
      float ly = cos(r * 0.5 + uTime * 0.25) * sin(theta * 1.3 + uTime * 0.15) * 0.35;

      /* Petal lobes + cup profile */
      float petalShape = 0.5 + 0.5 * cos(theta * uPetals);
      float cupProfile = uCupDepth * nr * nr * (0.6 + 0.4 * petalShape);
      float flare      = 1.0 + 0.15 * nr * nr * uMorph;

      float m = uMorph;
      vec3 flatPos = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);

      float cx = twisted.x * flare + rowWave * (1.0 - 0.5 * m) + lx * m;
      float cy = twisted.y * flare + colWave * (1.0 - 0.5 * m) + ly * m;
      float cz = cupProfile * m;

      vec3 p = mix(flatPos, vec3(cx, cy, cz), m);

      /* Approximate surface normal from cup gradient for Turrell lighting */
      float drdx   = gp.x / max(r, 0.001);
      float drdy   = gp.y / max(r, 0.001);
      float dz_dr  = uCupDepth * 2.0 * nr / maxR * (0.6 + 0.4 * petalShape);
      vec3  norm   = normalize(vec3(-dz_dr * drdx * m, -dz_dr * drdy * m, 1.0));
      vNdotL       = max(dot(norm, normalize(uLightDir)), 0.0);

      /* Interference + veining (faster) */
      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 1.2)
                         * sin(gp.x * uColFreq * 2.0 + uTime * 0.7);
      float vein = sin(theta * uPetals * 3.0 + r * 1.5 + uTime * 0.4);
      vDensity = mix(interference, interference * 0.6 + vein * 0.4, m);
      vHeight  = cz;
      vRadial  = nr;

      vec4 mv   = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * max(1.8, 3.5 - dist * 0.06);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDensity;
    varying float vHeight;
    varying float vNdotL;
    varying float vRadial;

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      /*
       * Lorenz-attractor palette: warm amber core → deep indigo rim
       *   amber ochre  #d18c40   (0.82, 0.55, 0.25)
       *   pale gold    #f3d194   (0.95, 0.82, 0.58)
       *   deep navy    #263861   (0.15, 0.22, 0.38)
       *   dark teal    #40667a   (0.25, 0.40, 0.48)
       *   peach light  #ffd9a6   (1.00, 0.85, 0.65)
       */
      float heightMix = smoothstep(0.0, 5.0, vHeight);
      float radialMix = smoothstep(0.2, 0.9, vRadial);
      float blend     = heightMix * 0.6 + radialMix * 0.4;

      vec3 warmBase  = vec3(0.82, 0.55, 0.25);
      vec3 warmLight = vec3(0.95, 0.82, 0.58);
      vec3 coolBase  = vec3(0.15, 0.22, 0.38);
      vec3 coolMid   = vec3(0.25, 0.40, 0.48);

      vec3 baseCol  = mix(warmBase, coolBase, blend);
      vec3 lightCol = mix(warmLight, coolMid, blend * 0.7);

      /* Interference drives dark/light alternation */
      float val = smoothstep(-0.3, 0.3, vDensity);
      vec3 col  = mix(baseCol, lightCol, val);

      /* Turrell soft light — warm peach illumination drifting across curvature */
      float turrell = pow(vNdotL, 1.5);
      vec3 turrellTint = vec3(1.0, 0.85, 0.65);
      col = mix(col, col * turrellTint * 1.4, turrell * 0.45);

      /* Subtle ambient shadow inside the cup */
      col *= 1.0 - smoothstep(0.0, 2.0, vHeight) * 0.15;

      float alpha = (1.0 - smoothstep(0.18, 0.25, r2)) * 0.92;
      gl_FragColor = vec4(col, alpha);
    }
  `
});

/* ---- particle grid builder ---- */
function buildGrid(rows, cols, seed) {
  const positions     = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds         = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const w = 24, h = 24;
  const cellW = w / cols, cellH = h / rows;
  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++) {
    for (let j = 0; j < cols && idx < N; j++) {
      const ppc = Math.floor(N / (rows * cols));
      for (let k = 0; k < ppc && idx < N; k++) {
        const x = (j + rng() - 0.5) * cellW - w * 0.5;
        const y = (i + rng() - 0.5) * cellH - h * 0.5;
        positions[idx * 3]     = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;
        gridPositions[idx * 2]     = x;
        gridPositions[idx * 2 + 1] = y;
        seeds[idx] = rng();
        idx++;
      }
    }
  }
  while (idx < N) {
    const x = (rng() - 0.5) * w;
    const y = (rng() - 0.5) * h;
    positions[idx * 3]     = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2]     = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }
  return { positions, gridPositions, seeds };
}

function regenerate() {
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value  = 0.3 + rng() * 0.5;
  uniforms.uTwist.value    = rng() * 4.0;
  uniforms.uPhase.value    = rng() * 6.28;
  uniforms.uPetals.value   = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value    = 0.0;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom) {
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos',  new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', (e) => {
  if (e.target.tagName === 'CANVAS') regenerate();
});

/* ---- orbit drag ---- */
let isDragging = false, prevX = 0, prevY = 0;
let orbitTheta = 0.0, orbitPhi = 0.55;

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true; prevX = e.clientX; prevY = e.clientY;
  e.preventDefault();
});
addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  orbitTheta -= (e.clientX - prevX) * 0.005;
  orbitPhi = Math.max(0.1, Math.min(1.4, orbitPhi - (e.clientY - prevY) * 0.005));
  prevX = e.clientX; prevY = e.clientY;
});
addEventListener('pointerup', () => { isDragging = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/* ---- render loop ---- */
const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  /* Morph: flat → calyx */
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.015;

  /* Turrell light: slow drift (~40 s orbit, gentle elevation oscillation) */
  const lAngle = t * 0.157;
  const lElev  = 0.4 + 0.3 * Math.sin(t * 0.09);
  uniforms.uLightDir.value.set(
    Math.cos(lAngle) * Math.cos(lElev),
    Math.sin(lElev) + 0.3,
    Math.sin(lAngle) * Math.cos(lElev)
  ).normalize();

  /* Camera: auto-orbit + manual + centroid tracking */
  const autoTheta = t * 0.08;
  const theta  = autoTheta + orbitTheta;
  const phi    = orbitPhi;
  const radius = 22;
  const centroidY = 1.5 * uniforms.uMorph.value;

  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    centroidY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi)
  );
  camera.lookAt(0, centroidY, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
