<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7kk · Shiota — Key in Blood</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">7kk</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0042);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.014));
const key1 = new THREE.PointLight(0x1a0404, 0.022, 34, 2.1);
key1.position.set(-12, 14, 11);
scene.add(key1);

let seed = 482917;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 58, h: 42, d: 52 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// THE KEY — suspended object at center, scaled to be visually dominant
const keyPos = new THREE.Vector3(0, 0, 0);
const keyGroup = new THREE.Group();
keyGroup.position.copy(keyPos);

// Key shaft
const shaftGeo = new THREE.CylinderGeometry(0.12, 0.12, 6.4, 8);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0xd8cbb8,
  emissive: 0xc2b5a0,
  emissiveIntensity: 0.48,
  metalness: 0.68,
  roughness: 0.42
});
const shaft = new THREE.Mesh(shaftGeo, keyMat);
shaft.rotation.z = Math.PI/2;
keyGroup.add(shaft);

// Key head (circular bow)
const bowGeo = new THREE.TorusGeometry(1.4, 0.14, 8, 16);
const bow = new THREE.Mesh(bowGeo, keyMat);
bow.position.set(-3.2, 0, 0);
bow.rotation.y = Math.PI/2;
keyGroup.add(bow);

// Key teeth (simple notches)
for(let i=0; i<3; i++){
  const tooth = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.6, 0.08),
    keyMat
  );
  tooth.position.set(2.2 + i*0.52, -0.38, 0);
  keyGroup.add(tooth);
}

scene.add(keyGroup);

const keyGlow = new THREE.PointLight(0x1a0404, 0.028, 24, 2.6);
keyGlow.position.copy(keyPos);
scene.add(keyGlow);

// ANCHOR GENERATION — 720 total anchors for 20k lines

const anchors = [];

// ZONE 1: Tight shell around key — 100 anchors
const innerCount = 100;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 3.8 + rng()*1.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 2: Mid-orbital shell — 140 anchors
const midCount = 140;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 7.2 + rng()*4.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 3: Far shell — 120 anchors
const outerCount = 120;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 13.0 + rng()*7.8;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(keyPos));
}

// ZONE 4: Wall anchors — sparse grid on each face
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*2.6;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*2.6;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.84, ROOM.d*0.84, 3));
anchors.push(...wallGrid('x', hw, ROOM.h*0.84, ROOM.d*0.84, 3));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.84, ROOM.d*0.84, 4));
anchors.push(...wallGrid('y', hh, ROOM.w*0.84, ROOM.d*0.84, 4));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.84, ROOM.h*0.84, 3));
anchors.push(...wallGrid('z', hd, ROOM.w*0.84, ROOM.h*0.84, 3));

// ZONE 5: Volume scatter — 160 anchors
for(let i=0; i<160; i++){
  const x = (rng()-0.5)*ROOM.w*0.80;
  const y = (rng()-0.5)*ROOM.h*0.80;
  const z = (rng()-0.5)*ROOM.d*0.80;
  anchors.push(new THREE.Vector3(x, y, z));
}

// THREAD NETWORK — exactly 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Radial convergence to key — 7000 threads
const convergeCount = 7000;
for(let i=0; i<convergeCount && li<NUM_LINES-13000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dKey = a.distanceTo(keyPos);
  if(dKey < 3.2) continue;
  
  const dir = keyPos.clone().sub(a).normalize();
  const stopDist = 3.0 + rng()*1.4;
  const targetDist = dKey - stopDist;
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Vertical threads from ceiling to key — 60 suspension threads
const suspCount = 60;
for(let i=0; i<suspCount && li<NUM_LINES-12940; i++){
  const t = (i/suspCount)*Math.PI*2;
  const rx = 0.4 + rng()*0.8;
  const topPt = new THREE.Vector3(
    keyPos.x + Math.cos(t)*rx,
    keyPos.y + 3.2,
    keyPos.z + Math.sin(t)*rx
  );
  
  const ceilPt = new THREE.Vector3(
    topPt.x + (rng()-0.5)*2.0,
    hh - rng()*1.2,
    topPt.z + (rng()-0.5)*2.0
  );
  
  setLine(topPt, ceilPt);
}

// CATEGORY C: Meridian arcs through key — vertical great circles — 2800 threads
const meridians = 38;
const ptsPerMeridian = 74;
for(let m=0; m<meridians && li<NUM_LINES-10080; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 10.8 + (m%4)*2.0;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-10080; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      keyPos.y + Math.sin(phi0)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      keyPos.y + Math.sin(phi1)*r,
      keyPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY D: Horizontal latitude rings — 2200 threads
const latitudes = 22;
const ptsPerLat = 100;
for(let l=0; l<latitudes && li<NUM_LINES-7880; l++){
  const phi = -Math.PI/2 + (l/latitudes)*Math.PI;
  const r = 8.8 + (l%3)*1.4;
  const y = keyPos.y + Math.sin(phi)*r;
  const ringR = Math.cos(phi)*r;
  
  for(let i=0; i<ptsPerLat-1 && li<NUM_LINES-7880; i++){
    const t0 = (i/ptsPerLat)*Math.PI*2;
    const t1 = ((i+1)/ptsPerLat)*Math.PI*2;
    
    const p0 = new THREE.Vector3(
      keyPos.x + Math.cos(t0)*ringR,
      y,
      keyPos.z + Math.sin(t0)*ringR
    );
    const p1 = new THREE.Vector3(
      keyPos.x + Math.cos(t1)*ringR,
      y,
      keyPos.z + Math.sin(t1)*ringR
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Key radiants — threads extending from key outward — 1800 threads
const radialCount = 1800;
for(let i=0; i<radialCount && li<NUM_LINES-6080; i++){
  const y = 1 - (i / radialCount) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*3.2, y*3.2, z*3.2).add(keyPos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 3.8 + rng()*10.4;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY F: Wall-to-wall spans — 1600 threads
let wallSpans = 0;
while(wallSpans<1600 && li<NUM_LINES-4480){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>14.0 && d<48.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY G: Horizontal crossing threads — 1200 threads
for(let i=0; i<1200 && li<NUM_LINES-3280; i++){
  const y = keyPos.y + (rng()-0.5)*24.0;
  const x0 = -hw + rng()*6.0;
  const z0 = (rng()-0.5)*ROOM.d*0.82;
  const x1 = hw - rng()*6.0;
  const z1 = (rng()-0.5)*ROOM.d*0.82;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY H: Vertical threads — 500 threads
for(let i=0; i<500 && li<NUM_LINES-2780; i++){
  const x = (rng()-0.5)*ROOM.w*0.80;
  const z = (rng()-0.5)*ROOM.d*0.80;
  const y0 = -hh + rng()*2.4;
  const y1 = hh - rng()*2.4;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY I: Proximity web — local connections — 1200 threads
const THRESH = 11.8;
let webCount = 0, attempts = 0;
while(webCount<1200 && li<NUM_LINES-1580 && attempts<16000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY J: Diagonal cross-room — 600 threads
for(let i=0; i<600 && li<NUM_LINES-980; i++){
  const x0 = -hw + rng()*4.5;
  const y0 = -hh + rng()*4.5;
  const z0 = -hd + rng()*4.5;
  const x1 = hw - rng()*4.5;
  const y1 = hh - rng()*4.5;
  const z1 = hd - rng()*4.5;
  setLine(new THREE.Vector3(x0, y0, z0), new THREE.Vector3(x1, y1, z1));
}

// CATEGORY K: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>5.5 && d<26.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.072,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow dolly inside the web looking at key
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.18 + lt*Math.PI*1.44;
    const r = 24.0 - lt*8.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 14.8 - lt*8.2;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*1.62 + lt*Math.PI*1.58;
    const r = 15.2 + Math.sin(lt*Math.PI*2.2)*3.8;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 6.6 + Math.cos(lt*Math.PI*1.6)*3.4;
    z = keyPos.z + Math.sin(angle)*r;
  } else if(t<0.76){
    const lt = (t-0.52)/0.24;
    const angle = Math.PI*3.20 + lt*Math.PI*1.32;
    const r = 13.2 + Math.cos(lt*Math.PI)*3.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y - 2.2 - lt*9.6;
    z = keyPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.76)/0.24;
    const angle = Math.PI*4.52 + lt*Math.PI*0.88;
    const r = 10.8 + lt*13.2;
    x = keyPos.x + Math.cos(angle)*r;
    y = keyPos.y + 6.8 + lt*8.8;
    z = keyPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  const rotSpeed = 0.000042;
  keyGroup.rotation.y = elapsed * rotSpeed;

  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.004;
  keyGroup.scale.setScalar(breathScale);

  const speed = 0.0000068;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    keyPos.x + Math.sin(elapsed*0.000024)*0.22,
    keyPos.y + Math.cos(elapsed*0.000032)*0.18,
    keyPos.z + Math.sin(elapsed*0.000022)*0.16
  );

  key1.intensity = 0.022 + Math.sin(elapsed*0.000044)*0.008;
  keyGlow.intensity = 0.028 + Math.sin(elapsed*0.000052)*0.007;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
