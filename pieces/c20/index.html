<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>c20 · Shiota — Two Home Countries</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">c20</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0018);

const camera = new THREE.PerspectiveCamera(64, innerWidth/innerHeight, 0.1, 280);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.015));
const pL = new THREE.PointLight(0xffd8b0, 0.04, 60, 1.6);
pL.position.set(-3, 16, 4);
scene.add(pL);

let seed = 48271953;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

const ROOM = { w:38, h:32, d:42 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

// ── THE SPHERE — off-white, cottony, the still center
// "Two Home Countries": the sphere is neither here nor there,
// suspended between origins. A moon caught in a circulatory cosmos.
const sphereCenter = new THREE.Vector3(1.2, 0.8, -0.5);
const sphereR = 1.65;

const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece0, emissive: 0xe8dcc6, emissiveIntensity: 0.6,
  roughness: 0.92, metalness: 0.0, transparent: true, opacity: 0.28
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// Inner luminance — warmth trapped inside the form
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR * 0.45, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xfcf0e0, transparent: true, opacity: 0.03 })
);
innerGlow.position.copy(sphereCenter);
scene.add(innerGlow);

// ── Suspension threads — 8 dark lines from ceiling to sphere top
const suspPts = [];
for(let i = 0; i < 8; i++){
  const a = (i/8)*Math.PI*2 + (rng()-0.5)*0.4;
  const sTop = 0.6 + rng()*1.2;
  const sBot = 0.03 + rng()*0.08;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*sTop, hh, sphereCenter.z + Math.sin(a)*sTop,
    sphereCenter.x + Math.cos(a)*sBot, sphereCenter.y + sphereR - 0.05, sphereCenter.z + Math.sin(a)*sBot
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0a0303, transparent: true, opacity: 0.45
})));

// ── Sample sphere surface
function sphereSurf(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR*0.95,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ANCHORS — concentric shells around the sphere like orbital layers
const anchors = [];
const shells = [3.0, 5.5, 8.5, 12, 16];
for(const sr of shells){
  const nPts = Math.floor(14 + sr*2.5);
  for(let i = 0; i < nPts; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.82+rng()*0.36);
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r + (rng()-0.5)*0.6,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.85 + (rng()-0.5)*0.5,
      sphereCenter.z + Math.cos(v)*r + (rng()-0.5)*0.6
    ));
  }
}
while(anchors.length < 420){
  const p = rng()<0.25 ? wallPt() : wallPt().lerp(sphereCenter, 0.02+rng()*0.15);
  anchors.push(p);
}

// Void zones — deliberate negative space windows
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x-4, sphereCenter.y-5, sphereCenter.z+6), r:2.4 },
  { pos: new THREE.Vector3(sphereCenter.x+6, sphereCenter.y+3, sphereCenter.z-3), r:1.8 },
  { pos: new THREE.Vector3(sphereCenter.x+1, sphereCenter.y-8, sphereCenter.z-6), r:2.1 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos)<v.r) return true;
  return false;
}

// ── BUILD THREADS — blood vessels converging on the moon
const NUM_LINES = 18000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE — threads reaching for the sphere
// The web is a circulatory cosmos; every line is a capillary
// carrying memory toward the suspended heart
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng()<0.42){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  const target = sphereSurf();

  // 10% stop short — threads that fail to reach the home they seek
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.15 + rng()*1.0;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: PROXIMITY — anchor-to-anchor within threshold
// Connective tissue: the relations between places, not just to the center
const THRESH = 5.0;
const catBtarget = Math.floor(NUM_LINES * 0.30);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 70000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// RADIAL FILAMENTS — short branching thread-chains near the sphere
// Dendritic growth: 3-5 segments forking from sphere surface outward
for(let i = 0; i < 200 && li < NUM_LINES; i++){
  let pt = sphereSurf();
  const dir = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*3);
  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.4 + rng()*0.9;
    // Slight random deviation from radial direction
    const devDir = dir.clone().add(new THREE.Vector3(
      (rng()-0.5)*0.6, (rng()-0.5)*0.6, (rng()-0.5)*0.6
    )).normalize();
    const next = pt.clone().add(devDir.multiplyScalar(len));
    if(!inVoid(next)){
      setLine(pt, next, 2);
    }
    pt = next;
    // Fork: occasionally branch
    if(rng() < 0.35 && li < NUM_LINES){
      const forkDir = dir.clone().add(new THREE.Vector3(
        (rng()-0.5)*1.2, (rng()-0.5)*1.2, (rng()-0.5)*1.2
      )).normalize();
      const forkEnd = pt.clone().add(forkDir.multiplyScalar(0.3+rng()*0.6));
      if(!inVoid(forkEnd)) setLine(pt, forkEnd, 2);
    }
  }
}

// Fill remainder: architectural wall-to-wall spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.12 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity by category:
// convergence (brightest), proximity (mid), filament (mid-warm), architectural (faintest)
const catOpacity = [0.08, 0.05, 0.065, 0.025];
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.025;
  const bright = op / 0.08;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, old photographs, passport pages
// caught in the web: the detritus of a life between two countries
const NUM_FRAGMENTS = 18;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.03 + rng()*0.07;
  const fGeo = new THREE.BufferGeometry();
  const w = sz*(0.4+rng()*0.7);
  const h = sz*(0.5+rng()*0.9);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.15), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.08), 0,
    w*(0.1-rng()*0.2), -h*0.5, 0,
    w*(-0.3+rng()*0.15), h*0.5, 0,
    w*(0.15+rng()*0.2), h*(rng()*0.04), 0,
    w*(0.1-rng()*0.2), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  const d = 0.006 + rng()*0.015;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.04, d*0.015),
    transparent: true,
    opacity: 0.14 + rng()*0.2,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);
  if(rng()<0.5){
    const si = Math.floor(rng()*li)*6;
    const t = 0.2+rng()*0.6;
    frag.position.set(
      basePositions[si]*(1-t)+basePositions[si+3]*t,
      basePositions[si+1]*(1-t)+basePositions[si+4]*t,
      basePositions[si+2]*(1-t)+basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(2.5+rng()*6));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative arc:
// Begin deep inside the web, close to the sphere — intimate, disorienting.
// The viewer is tangled in the threads, surrounded by red.
// Slowly drift outward and upward — the sphere recedes, the architecture reveals itself.
// Then loop back inward: the pull of home, the return that never quite completes.
const pathLen = 2000;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.25){
    // Phase 1: intimate — just outside the sphere, inside the dense convergence
    const lt = t/0.25;
    rH = 3.5 + lt*1.5;
    y = cy - 1.0 + lt*2.5;
  } else if(t < 0.5){
    // Phase 2: drifting outward — threads begin to thin, architecture emerges
    const lt = (t-0.25)/0.25;
    rH = 5.0 + lt*3.0;
    y = cy + 1.5 + lt*3.0 + Math.sin(lt*Math.PI)*1.0;
  } else if(t < 0.75){
    // Phase 3: the wide view — seeing the room, the sphere a pale moon
    const lt = (t-0.5)/0.25;
    rH = 8.0 + Math.sin(lt*Math.PI)*1.5;
    y = cy + 4.5 + Math.sin(lt*Math.PI*0.8)*2.0;
  } else {
    // Phase 4: return — pulled back toward the sphere
    const lt = (t-0.75)/0.25;
    rH = 8.0 - lt*4.5;
    y = cy + 4.5 - lt*5.5;
  }

  const x = cx + Math.sin(p*1.05)*rH + Math.cos(p*0.38+1.2)*0.35;
  const z = cz + Math.cos(p*1.05)*(rH*1.03) + Math.sin(p*0.42+0.7)*0.3;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now()-t0)/1000;

  // Thread micro-breathing — the room inhales around the sphere
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00012 * Math.max(0, 1.0-dist/20.0);
    const phase = basePositions[idx]*0.11 + basePositions[idx+1]*0.13 + i*0.0003;
    const breath = Math.sin(t*0.006+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.2;
      arr[vi+1] = basePositions[vi+1] + breath*0.1;
      arr[vi+2] = basePositions[vi+2] + breath*0.18;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera dolly
  const speed = 0.00025;
  const pathT = (t*speed)%1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the sphere — the still center, the home
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.0008)*0.03;
  look.y += Math.cos(t*0.0006)*0.02 + 0.15;
  look.z += Math.sin(t*0.0009)*0.025;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = -3 + Math.sin(t*0.00035)*0.1;
  pL.position.y = 16 + Math.cos(t*0.0002)*0.05;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
