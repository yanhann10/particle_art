<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: PROPAGATE, intensity: gentle -->
<title>km4 · attractor propagate · wavefront lorenz</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">km4 · attractor propagate</div>
<div class="hint">wavefront activation · lorenz basin → orbit</div>
<div class="src">100k GPGPU · propagating seed</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// PROPAGATE motion: particles activate in spatial-proximity wavefronts from a moving seed point.
// Each particle starts dormant, activates when seed passes within threshold, then begins orbit.
// Seed traces a slow helical path through the Lorenz basin so activation ripples outward.
// Once activated particles integrate Lorenz, fade-in over 0.8s, then sustain orbit visibility.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(){
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    const r = 8.0 * Math.pow(Math.random(), 0.5);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    init[i*4]   = r * Math.sin(phi) * Math.cos(theta);
    init[i*4+1] = r * Math.sin(phi) * Math.sin(theta);
    init[i*4+2] = 27 + r * Math.cos(phi);
    init[i*4+3] = 0.0; // activation time (0 = not yet activated)
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true;
  return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:   { value: 0.0 },
  uTime: { value: 0.0 },
  uSeedPos: { value: new THREE.Vector3(0, 0, 27) },
  uActivationRadius: { value: 2.8 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uTime;
    uniform vec3 uSeedPos;
    uniform float uActivationRadius;
    varying vec2 vUv;

    vec3 lorenz(vec3 p){
      return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y - (8.0/3.0)*p.z);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float activationTime = s.w;

      // check if particle should activate
      if (activationTime == 0.0){
        float distToSeed = length(p - uSeedPos);
        if (distToSeed < uActivationRadius){
          activationTime = uTime;
        }
      }

      // if activated, integrate Lorenz
      if (activationTime > 0.0){
        vec3 dp = lorenz(p);
        p += dp * uDt * 0.15;
      }

      gl_FragColor = vec4(p, activationTime);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060a, 0.05);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.6, 5);
camera.lookAt(0, 0, 0);

// seed visualization (small bright sphere)
const seedGeom = new THREE.SphereGeometry(0.15, 16, 16);
const seedMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
const seedMesh = new THREE.Mesh(seedGeom, seedMat);
scene.add(seedMesh);

// activation wavefront ring (expanding transparent torus)
const ringGeom = new THREE.TorusGeometry(2.8, 0.08, 8, 24);
const ringMat = new THREE.MeshBasicMaterial({ 
  color: 0x4488ff, 
  transparent: true, 
  opacity: 0.35,
  side: THREE.DoubleSide
});
const ringMesh = new THREE.Mesh(ringGeom, ringMat);
scene.add(ringMesh);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0.0 },
    uPalA:  { value: new THREE.Vector3(0.20, 0.32, 0.78) },
    uPalB:  { value: new THREE.Vector3(0.85, 0.32, 0.62) },
    uPalC:  { value: new THREE.Vector3(0.98, 0.86, 0.50) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    uniform vec3 uPalA, uPalB, uPalC;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float activationTime = s.w;

      vec3 disp = p / 25.0;
      disp.z = (disp.z - 1.08);

      float age = 0.0;
      float visible = 0.0;
      if (activationTime > 0.0){
        float timeSinceActivation = uTime - activationTime;
        visible = smoothstep(0.0, 0.8, timeSinceActivation);
        age = mod(timeSinceActivation * 0.3, 1.0);
      }

      float k = mod(age, 1.0);
      vec3 col = mix(uPalA, uPalB, smoothstep(0.0, 0.5, k));
      col = mix(col, uPalC, smoothstep(0.5, 1.0, k));
      vCol = col;
      vAlpha = visible;

      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      vFogDepth = -mv.z;
      gl_PointSize = 2.2 * uPixel * (3.0 / vFogDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      float fogF = 1.0 - exp(-0.0035 * vFogDepth * vFogDepth);
      vec3 col = mix(vCol, vec3(0.025, 0.030, 0.040), fogF);
      gl_FragColor = vec4(col * a * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
let globalTime = 0.0;

function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  globalTime += dt;

  // seed traces helical path through Lorenz basin
  const phase = globalTime * 0.22;
  const radius = 6.0;
  const seedX = radius * Math.cos(phase);
  const seedY = radius * Math.sin(phase);
  const seedZ = 27 + 4.0 * Math.sin(phase * 2.3);
  simUniforms.uSeedPos.value.set(seedX, seedY, seedZ);
  simUniforms.uTime.value = globalTime;
  pointsMat.uniforms.uTime.value = globalTime;

  // update seed mesh position (in display coords)
  seedMesh.position.set(seedX / 25, seedY / 25, (seedZ - 27) / 25);
  ringMesh.position.copy(seedMesh.position);
  ringMesh.lookAt(camera.position);

  simUniforms.uDt.value = dt;
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  const ang = globalTime * 0.00012;
  camera.position.x = Math.sin(ang) * 5.2;
  camera.position.z = Math.cos(ang) * 5.2;
  camera.position.y = Math.sin(ang * 0.6) * 0.8 + 0.4;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
