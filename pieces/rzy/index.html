<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rzy · Chladni plate resonance</title>
<!-- MOTION: settling, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background: linear-gradient(135deg, #1a1410 0%, #0d0a08 60%, #050403 100%);
    color: #cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.90' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.04  0 0 0 0 0.03  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.70'/></svg>");
    mix-blend-mode: multiply; opacity: 0.65;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color: #cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.48; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">rzy</div>
<div class="hint">cymatics — click to pulse the plate — sand self-organizes along nodal lines</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Ernst Chladni's resonant plate experiment: sand particles on a vibrating square plate
// migrate to nodal lines (u=0) of eigenmodes u(x,y) = cos(mπx/L)cos(nπy/L) − cos(nπx/L)cos(mπy/L).
// Each mode produces a distinct geometric pattern. Particles move downhill along −∇|u|,
// plus Brownian jitter. Click to pulse the mode, cycling (m,n). The form is BIOMORPHIC:
// particles gather not mechanically but with tidal pulsing, slow breathing expansion/contraction
// at the nodal zones — organic accumulation, not rigid snapping.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 8, 12);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a08);
document.body.appendChild(renderer.domElement);

// ────────────── PLATE — dark metal square
const plateSize = 6;
const plateGeom = new THREE.PlaneGeometry(plateSize, plateSize);
const plateMat  = new THREE.MeshStandardMaterial({ color: 0x1a1612, metalness: 0.82, roughness: 0.26 });
const plate = new THREE.Mesh(plateGeom, plateMat);
plate.rotation.x = -Math.PI / 2;
scene.add(plate);

// edge frame — thin metal borders
const frameGeom = new THREE.EdgesGeometry(plateGeom);
const frameMat  = new THREE.LineBasicMaterial({ color: 0x4a3f36, linewidth: 1 });
const frame = new THREE.LineSegments(frameGeom, frameMat);
frame.rotation.x = -Math.PI / 2;
scene.add(frame);

// ────────────── PARTICLES — sand grains
const N = 50000;
const L = plateSize;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 2);  // 2D on plate
const seeds = new Float32Array(N);

// initial scatter across plate
for (let i = 0; i < N; i++){
  positions[i*3]     = (Math.random() - 0.5) * L * 0.96;
  positions[i*3 + 1] = 0.01;  // just above plate
  positions[i*3 + 2] = (Math.random() - 0.5) * L * 0.96;
  velocities[i*2]    = 0;
  velocities[i*2+1]  = 0;
  seeds[i] = Math.random();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uPulse:  { value: 0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPulse;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      // gentle vertical bob — particles breathe with the mode, not fixed
      float t = uTime * 0.8 + seed * 6.28;
      float breath = sin(t * 0.6) * 0.012 + 0.012;
      p.y += breath * (1.0 + uPulse * 0.5);
      // glow intensifies at pulse moment
      vGlow = 0.5 + 0.5 * sin(t) + uPulse * 0.8;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.2 + 0.3 * vGlow) * uPixel * (6.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0);
      // sand: pale warm white with slight amber
      vec3 col = vec3(0.92, 0.88, 0.78) * (0.7 + 0.3 * vGlow);
      gl_FragColor = vec4(col, a * 0.85);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── EIGENMODE STATE
let m = 2, n = 1;  // mode indices
let modePhase = 0;
let pulseAmp = 0;

// Chladni eigenmode: u(x,y) = cos(m π x/L) cos(n π y/L) − cos(n π x/L) cos(m π y/L)
function eigenmode(x, y, phase){
  const px = x / L;
  const py = y / L;
  const u1 = Math.cos(m * Math.PI * px) * Math.cos(n * Math.PI * py);
  const u2 = Math.cos(n * Math.PI * px) * Math.cos(m * Math.PI * py);
  return (u1 - u2) * Math.cos(phase);
}

// gradient of |u|
function gradient(x, y, phase){
  const eps = 0.02;
  const u0 = Math.abs(eigenmode(x, y, phase));
  const ux = (Math.abs(eigenmode(x + eps, y, phase)) - u0) / eps;
  const uy = (Math.abs(eigenmode(x, y + eps, phase)) - u0) / eps;
  return { x: ux, y: uy };
}

// ────────────── LIGHTING — warm single source from above-left
const light = new THREE.DirectionalLight(0xffe8c3, 1.4);
light.position.set(-4, 6, 3);
scene.add(light);
const ambient = new THREE.AmbientLight(0x4a3a28, 0.35);
scene.add(ambient);

// ────────────── INTERACTION — click to pulse mode
addEventListener('click', () => {
  // cycle mode
  if (m === 2 && n === 1) { m = 3; n = 1; }
  else if (m === 3 && n === 1) { m = 3; n = 2; }
  else if (m === 3 && n === 2) { m = 4; n = 1; }
  else if (m === 4 && n === 1) { m = 4; n = 2; }
  else if (m === 4 && n === 2) { m = 5; n = 2; }
  else if (m === 5 && n === 2) { m = 3; n = 3; }
  else { m = 2; n = 1; }
  pulseAmp = 1.0;  // trigger pulse
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ────────────── SIMULATION LOOP
const start = performance.now();
const damping = 0.88;
const attractStrength = 0.035;
const brownianScale = 0.008;
const dt = 1.0 / 60.0;

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  uniforms.uTime.value = elapsed;
  
  // mode phase oscillates slowly — the plate vibrates, mode evolves
  modePhase = elapsed * 1.8;
  
  // pulse decay
  pulseAmp *= 0.94;
  uniforms.uPulse.value = pulseAmp;
  
  // BIOMORPHIC MOTION: particles don't snap to nodal lines — they pulse toward them
  // in tidal waves, then breathe back slightly. Accumulation is organic, not mechanical.
  const tidePeriod = 2.4;
  const tidePhase  = Math.sin(elapsed * (2 * Math.PI / tidePeriod));
  const gatherFactor = 0.5 + 0.5 * tidePhase;  // oscillates 0→1→0
  
  for (let i = 0; i < N; i++){
    let x = positions[i*3];
    let z = positions[i*3 + 2];
    let vx = velocities[i*2];
    let vz = velocities[i*2+1];
    
    // clamp to plate bounds with soft bounce
    const margin = L * 0.48;
    if (Math.abs(x) > margin){ x = Math.sign(x) * margin; vx *= -0.3; }
    if (Math.abs(z) > margin){ z = Math.sign(z) * margin; vz *= -0.3; }
    
    // gradient descent toward nodal lines — but scaled by tidal gatherFactor
    const grad = gradient(x, z, modePhase);
    const force = attractStrength * gatherFactor;
    vx -= grad.x * force;
    vz -= grad.y * force;
    
    // Brownian jitter — particles never fully settle, always trembling
    vx += (Math.random() - 0.5) * brownianScale;
    vz += (Math.random() - 0.5) * brownianScale;
    
    // damping
    vx *= damping;
    vz *= damping;
    
    // integrate
    x += vx * dt;
    z += vz * dt;
    
    positions[i*3]     = x;
    positions[i*3 + 2] = z;
    velocities[i*2]    = vx;
    velocities[i*2+1]  = vz;
  }
  geom.attributes.position.needsUpdate = true;
  
  // camera slow orbit — the plate rotates slightly to show the pattern from varying angles
  const orbitRadius = 12;
  const orbitSpeed  = 0.08;
  camera.position.x = Math.sin(elapsed * orbitSpeed) * orbitRadius * 0.4;
  camera.position.z = Math.cos(elapsed * orbitSpeed) * orbitRadius;
  camera.position.y = 8 + Math.sin(elapsed * 0.12) * 0.6;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
