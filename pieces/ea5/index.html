<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ea5 · parity violation</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color:#2a1a08; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">ea5</div>
<div class="hint">click to regrow · the left hand doesn't know what the right hand is doing</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: A symmetric Riley-interference calyx that periodically suffers
// "parity violation" — the left-hand particles gently decay/cascade downward
// while the right side holds steady, then recovers. Nature prefers one hand.
// The surprise is subtle, physics-poetic: mirror symmetry quietly breaks and heals.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const basePositions = new Float32Array(N * 3); // store original positions for recovery
const seeds = new Float32Array(N);
const sides = new Float32Array(N); // -1 left, +1 right

let regrowSeed = Math.random() * 1e9;
function buildField(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng() * Math.PI * 2, k: 1.6 + rng() * 1.2, phase: rng() * Math.PI * 2 };
  const w2 = { ang: rng() * Math.PI * 2, k: 2.1 + rng() * 1.4, phase: rng() * Math.PI * 2 };
  const w3 = { ang: rng() * Math.PI * 2, k: 0.8 + rng() * 0.6, phase: rng() * Math.PI * 2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0;
  let attempts = 0;
  while (written < N && attempts < N * 16){
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x * Math.cos(w1.ang) * w1.k + z * Math.sin(w1.ang) * w1.k + w1.phase);
    const v2 = Math.sin(x * Math.cos(w2.ang) * w2.k + z * Math.sin(w2.ang) * w2.k + w2.phase);
    const v3 = Math.sin(x * Math.cos(w3.ang) * w3.k + z * Math.sin(w3.ang) * w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r * r * 0.10);
    const accept = (f > 0) && (rng() < fall * (0.4 + 0.6 * f));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
    const y = -0.15 * r * r + scallop;
    positions[written*3]     = x;
    positions[written*3 + 1] = y;
    positions[written*3 + 2] = z;
    basePositions[written*3]     = x;
    basePositions[written*3 + 1] = y;
    basePositions[written*3 + 2] = z;
    seeds[written] = rng();
    sides[written] = x < 0 ? -1.0 : 1.0;
    written++;
  }
  for (let i = written; i < N; i++){
    positions[i*3] = 0; positions[i*3+1] = -2; positions[i*3+2] = 0;
    basePositions[i*3] = 0; basePositions[i*3+1] = -2; basePositions[i*3+2] = 0;
    seeds[i] = 0; sides[i] = 1.0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('side',     new THREE.BufferAttribute(sides, 1));

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uPointer:{ value: new THREE.Vector2(0, 0) },
  uViolation: { value: 0.0 } // 0 = symmetric, 1 = full violation
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uViolation;
    attribute float seed;
    attribute float side;
    varying float vDepth;
    varying float vSeed;
    varying float vDecay;
    void main(){
      vec3 p = position;

      // parity violation: left-side particles (side < 0) decay downward
      // proportional to uViolation. Each particle has its own decay rate from seed.
      float isLeft = step(0.0, -side); // 1 if left, 0 if right
      float decayStrength = isLeft * uViolation;
      // particles with lower seed values decay first (like radioactive decay)
      float threshold = uViolation * 1.2;
      float particleDecay = isLeft * smoothstep(0.0, 0.8, threshold - seed);

      // decay motion: drift down + slight outward scatter
      p.y -= particleDecay * (1.8 + seed * 1.2);
      p.x -= particleDecay * seed * 0.4;
      // fade factor
      vDecay = particleDecay;

      // pointer tilt
      float tiltX = uPointer.y * 0.22;
      float tiltZ = -uPointer.x * 0.22;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);
      q = vec3(q.x * cb - q.y * sb, q.x * sb + q.y * cb, q.z);

      // breath
      float t = uTime * 0.22 + seed * 6.28;
      q.y += 0.03 * sin(t) * (1.0 - vDecay);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;
      gl_PointSize = (1.4 + 0.8 * sin(t * 0.7)) * uPixel * (5.0 / vDepth);
      // shrink decaying particles
      gl_PointSize *= (1.0 - vDecay * 0.6);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vDecay;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);

      // normal ink tones
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));

      // decaying particles shift cooler — a subtle blue-grey, like Cerenkov glow
      vec3 decayCol = vec3(0.14, 0.12, 0.18);
      col = mix(col, decayCol, vDecay * 0.7);

      // depth haze
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      // fade decaying particles
      float finalAlpha = a * 0.78 * (1.0 - haze * 0.6) * (1.0 - vDecay * 0.5);
      gl_FragColor = vec4(col, finalAlpha);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── DUST MOTES
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 14;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 8;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t * 1.3 + seed * 30.0) * 0.4;
      p.y -= mod(uTime * 0.08 + seed * 7.0, 4.0) - 2.0;
      p.z += cos(t * 1.1 + seed * 22.0) * 0.3;
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55 * smoothstep(-0.2, 0.6, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4 * vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ── Interaction
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.side.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Parity violation cycle
// The violation builds slowly (~12s cycle): 8s symmetric, 4s of violation, then recovery.
// Like radioactive beta-decay: the system is stable, then the weak force acts,
// then equilibrium restores. The left half preferentially decays.
function violationEnvelope(t){
  const cycle = 18.0; // full cycle length
  const phase = ((t + 4.0) % cycle) / cycle; // offset so first violation hits ~8s in
  // 0..0.55 = stable (symmetric), 0.55..0.75 = violation ramps up, 0.75..0.85 = peak, 0.85..1.0 = recovery
  if (phase < 0.55) return 0.0;
  if (phase < 0.72) return smoothstep(0.55, 0.72, phase);
  if (phase < 0.82) return 1.0;
  return 1.0 - smoothstep(0.82, 1.0, phase);
}

function smoothstep(a, b, x){ const t = Math.max(0, Math.min(1, (x-a)/(b-a))); return t*t*(3-2*t); }

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // Compute violation and update positions on CPU for proper recovery
  const v = violationEnvelope(t);
  uniforms.uViolation.value = v;

  // gentle camera drift
  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
