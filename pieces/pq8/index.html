<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pq8 · plot-twist foliage · Beesley</title>
<!-- MOTION: drift + periodic twist, intensity: gentle → surprise → gentle -->
<style>
  html,body{margin:0;padding:0;height:100%;background:#0a0c0e;overflow:hidden}
  canvas{display:block}
  .id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
      letter-spacing:0.06em;color:#cdd2dc;font-family:ui-monospace,"SF Mono",Menlo,monospace}
</style>
</head>
<body>
<div class="id">pq8</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Leaf Surface Builder (proper quad-strip mesh) ── */
function createLeafSurface(width, length, curvature, veinTwist, wSegs = 10, lSegs = 28) {
  const verts = [];
  const uvs = [];
  const idxs = [];

  for (let j = 0; j <= lSegs; j++) {
    const t = j / lSegs;
    const y = t * length;
    const taper = Math.sin(t * Math.PI) * (1.0 - t * 0.35);
    const halfW = width * 0.5 * Math.max(taper, 0.04);
    const curlA = curvature * t * t;
    const twistA = veinTwist * t;
    const ct = Math.cos(twistA), st = Math.sin(twistA);

    for (let i = 0; i <= wSegs; i++) {
      const s = (i / wSegs) * 2 - 1;
      const x = s * halfW;
      const veinZ = -Math.abs(s) * halfW * 0.18;
      const cz = veinZ + x * Math.sin(curlA) * 0.35;
      const cx = x * Math.cos(curlA);
      verts.push(cx * ct - cz * st, y, cx * st + cz * ct);
      uvs.push(i / wSegs, t);
    }
  }

  for (let j = 0; j < lSegs; j++) {
    for (let i = 0; i < wSegs; i++) {
      const a = j * (wSegs + 1) + i;
      const b = a + 1;
      const c = a + (wSegs + 1);
      const d = c + 1;
      idxs.push(a, c, b, b, c, d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idxs);
  g.computeVertexNormals();
  return g;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0e, 0.012);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 2.5, 0);
controls.minDistance = 6;
controls.maxDistance = 35;

/* ── Lighting ── */
const keyLight = new THREE.DirectionalLight(0x88ccaa, 1.1);
keyLight.position.set(-4, 8, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x1a2a30, 0.5);
fillLight.position.set(3, 1, -5);
scene.add(fillLight);

scene.add(new THREE.AmbientLight(0x112218, 0.35));

/* ── Leaf Cluster ── */
const leafGroup = new THREE.Group();
const greenBase = new THREE.Color(0x5a9068);
const amberTwist = new THREE.Color(0xc4864a);

const leafConfigs = [
  { w:2.4, l:6.0, c:1.6, v:0.8,  p:[0,0,0],        r:[0,0,0] },
  { w:1.8, l:4.8, c:-2.0,v:-1.2, p:[-2.6,0.6,0.4],  r:[0.3,-0.5,0.2] },
  { w:2.0, l:5.2, c:2.2, v:1.5,  p:[2.4,0.4,-0.3],  r:[-0.2,0.7,-0.25] },
  { w:1.4, l:3.8, c:-1.4,v:1.0,  p:[-1.6,2.8,0.7],  r:[0.4,-0.3,0.35] },
  { w:1.6, l:4.0, c:2.8, v:-1.6, p:[1.8,-1.0,0.5],  r:[-0.35,0.5,0.4] },
  { w:1.8, l:4.6, c:1.0, v:0.5,  p:[0.2,2.0,-1.4],  r:[0.1,0.15,-0.1] },
  { w:1.5, l:3.8, c:-1.8,v:1.3,  p:[-0.7,-0.6,1.6], r:[0.25,0.25,-0.15] },
];

const leafMeshes = [];
const leafRestColors = [];

leafConfigs.forEach(cfg => {
  const geom = createLeafSurface(cfg.w, cfg.l, cfg.c, cfg.v);
  const shade = greenBase.clone().offsetHSL(
    (Math.random() - 0.5) * 0.03,
    (Math.random() - 0.5) * 0.08,
    (Math.random() - 0.5) * 0.06
  );
  leafRestColors.push(shade.clone());
  const mat = new THREE.MeshStandardMaterial({
    color: shade,
    roughness: 0.72,
    metalness: 0.1,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.9,
  });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(...cfg.p);
  mesh.rotation.set(...cfg.r);
  leafMeshes.push(mesh);
  leafGroup.add(mesh);
});

scene.add(leafGroup);

/* ── Particle System (80k, scattered around leaf cluster) ── */
const PCOUNT = 80000;
const pPos = new Float32Array(PCOUNT * 3);
const pHome = new Float32Array(PCOUNT * 3);
const pSeed = new Float32Array(PCOUNT);

for (let i = 0; i < PCOUNT; i++) {
  // scatter in a leaf-cluster-shaped ellipsoid
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = Math.pow(Math.random(), 0.45);
  const rx = 5.0, ry = 4.5, rz = 3.5;
  const x = r * rx * Math.sin(phi) * Math.cos(theta);
  const y = r * ry * Math.sin(phi) * Math.sin(theta) + 2.0;
  const z = r * rz * Math.cos(phi);
  pPos[i * 3] = x;
  pPos[i * 3 + 1] = y;
  pPos[i * 3 + 2] = z;
  pHome[i * 3] = x;
  pHome[i * 3 + 1] = y;
  pHome[i * 3 + 2] = z;
  pSeed[i] = Math.random();
}

const pGeom = new THREE.BufferGeometry();
pGeom.setAttribute('position', new THREE.Float32BufferAttribute(pPos, 3));
pGeom.setAttribute('home', new THREE.Float32BufferAttribute(pHome, 3));
pGeom.setAttribute('seed', new THREE.Float32BufferAttribute(pSeed, 1));

const pUniforms = {
  uTime: { value: 0 },
  uTwist: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uGreen: { value: new THREE.Color(0x5a9068) },
  uAmber: { value: new THREE.Color(0xc4864a) },
};

const pMat = new THREE.ShaderMaterial({
  uniforms: pUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uTwist;
    uniform float uPixel;
    attribute vec3 home;
    attribute float seed;
    varying float vTwist;
    varying float vAlpha;
    varying float vDist;

    void main() {
      float t = uTime * 0.3 + seed * 6.2831;
      vec3 p = home;

      // gentle drift in normal state
      float drift = 1.0 - uTwist;
      p.x += sin(t * 0.7 + seed * 12.0) * 0.25 * drift;
      p.y += cos(t * 0.5 + seed * 8.0) * 0.2 * drift;
      p.z += sin(t * 0.6 + seed * 10.0) * 0.2 * drift;

      // burst outward during twist (autumn shedding)
      vec3 dir = normalize(p - vec3(0.0, 2.0, 0.0));
      float burstR = 3.5 + seed * 4.0;
      p += dir * burstR * uTwist;
      // add tumble during burst
      p.x += sin(t * 2.0 + seed * 20.0) * uTwist * 1.2;
      p.y -= uTwist * (1.0 + seed * 2.5); // gravity pull
      p.z += cos(t * 1.8 + seed * 15.0) * uTwist * 0.8;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDist = -mv.z;
      gl_PointSize = (1.8 + seed * 1.2) * uPixel * (30.0 / max(vDist, 1.0));
      gl_Position = projectionMatrix * mv;

      vTwist = uTwist;
      vAlpha = 0.5 + 0.3 * sin(t);
      // fade slightly at distance
      vAlpha *= smoothstep(60.0, 10.0, vDist);
    }
  `,
  fragmentShader: `
    uniform vec3 uGreen;
    uniform vec3 uAmber;
    uniform float uTwist;
    varying float vTwist;
    varying float vAlpha;
    varying float vDist;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      float soft = smoothstep(0.5, 0.15, r);

      vec3 col = mix(uGreen, uAmber, vTwist);
      float a = soft * vAlpha;

      // manual fog (avoid fog:true compile issues)
      float fogD = 0.012;
      float fogF = exp(-fogD * fogD * vDist * vDist);
      col = mix(vec3(0.039, 0.047, 0.055), col, fogF);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const pPoints = new THREE.Points(pGeom, pMat);
scene.add(pPoints);

/* ── Plot-Twist Timing (Philip Beesley–style reactive shudder) ──
   Cycle: 14s calm → 1s snap-shut → 2s amber hold → 3s reopen
   Like Mimosa pudica touched: the whole cluster folds and flushes,
   then slowly recovers. */
const CYCLE = 20.0;
const SNAP_START = 14.0;
const SNAP_END = 15.0;
const HOLD_END = 17.0;
const REOPEN_END = 20.0;

function twistCurve(elapsed) {
  const phase = elapsed % CYCLE;
  if (phase < SNAP_START) return 0;
  if (phase < SNAP_END) {
    // rapid snap shut
    const t = (phase - SNAP_START) / (SNAP_END - SNAP_START);
    return t * t * (3 - 2 * t); // smoothstep
  }
  if (phase < HOLD_END) return 1;
  if (phase < REOPEN_END) {
    // slow reopen
    const t = (phase - HOLD_END) / (REOPEN_END - HOLD_END);
    return 1 - t * t * (3 - 2 * t);
  }
  return 0;
}

/* ── Store original leaf rotations for fold animation ── */
const leafRestRots = leafConfigs.map(c => new THREE.Euler(...c.r));
const leafRestScales = leafMeshes.map(() => new THREE.Vector3(1, 1, 1));

/* ── Animation ── */
const centroid = new THREE.Vector3();
const targetCentroid = new THREE.Vector3(0, 2.5, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
const tmpColor = new THREE.Color();

function loop() {
  const elapsed = (performance.now() - t0) / 1000;
  const twist = twistCurve(elapsed);

  pUniforms.uTime.value = elapsed;
  pUniforms.uTwist.value = twist;

  // Leaf color and fold
  leafMeshes.forEach((mesh, idx) => {
    // Color: green → amber
    tmpColor.copy(leafRestColors[idx]).lerp(amberTwist, twist);
    mesh.material.color.copy(tmpColor);

    // Fold: scale width down, curl rotation increases
    const foldScale = 1.0 - twist * 0.6;
    mesh.scale.set(foldScale, 1.0 + twist * 0.05, foldScale);

    // Add extra curl rotation during twist
    const rest = leafRestRots[idx];
    mesh.rotation.set(
      rest.x + twist * 0.8 * (idx % 2 === 0 ? 1 : -1),
      rest.y + twist * 0.3,
      rest.z + twist * 0.5 * (idx % 3 === 0 ? 1 : -1)
    );

    // Slight opacity drop during twist (leaves becoming translucent)
    mesh.material.opacity = 0.9 - twist * 0.15;
  });

  // Light color shifts during twist
  keyLight.color.lerpColors(
    new THREE.Color(0x88ccaa),
    new THREE.Color(0xcc9966),
    twist
  );

  // Gentle cluster breathing (suppressed during twist)
  const breathe = (1 - twist) * Math.sin(elapsed * 0.08) * 0.1;
  leafGroup.rotation.y = breathe;

  // Camera tracks centroid
  leafGroup.getWorldPosition(centroid);
  centroid.y += 2.0;
  targetCentroid.lerp(centroid, 0.02);
  controls.target.lerp(targetCentroid, 0.04);
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
