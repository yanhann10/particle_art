<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jcl · obsessive dots · Kusama growth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0408; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">jcl · obsessive dots · Kusama growth</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">descended from ajo · Yayoi Kusama · obsessive polka-dot infinity</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Kusama obsessive-dot growth ──
   The ajo arabesque ribbon becomes a fleshy tubular form — think pumpkin
   tendril or gourd stem — covered obsessively in polka dots. Hundreds of
   small cream-white spheres tile the crimson tube surface with the kind of
   compulsive regularity Kusama applies to everything she touches. The
   differential growth still drives the form; the dots just colonize it.
   Palette: deep cadmium red tube, warm cream dots, dark plum background.
*/

const scene = new THREE.Scene();
const BG = 0x0a0408;
scene.fog = new THREE.FogExp2(BG, 0.018);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
camera.position.set(6, 9, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.DirectionalLight(0xfff0d8, 1.0).translateX(5).translateY(14).translateZ(6));
scene.add(new THREE.AmbientLight(0x1a0810, 0.6));
const fill = new THREE.DirectionalLight(0x604050, 0.35);
fill.position.set(-6, 3, -5);
scene.add(fill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

/* ── differential growth (inherited from ajo / 5gm) ── */
const MAX_VERTS = 1200;
const ATTRACT   = 0.06;
const REPEL_R   = 0.55;
const REPEL_STR = 0.14;
const NOISE     = 0.003;
const PRESSURE  = 0.003;
const RISE      = 0.005;
const MAX_D     = 0.42;

const verts = [];
for (let i = 0; i < 14; i++) {
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const k = Math.floor(v.x / CELL) + ',' + Math.floor(v.y / CELL) + ',' + Math.floor(v.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v) {
  const cx = Math.floor(v.x / CELL), cy = Math.floor(v.y / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of neighbors(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dy[i] += (oy / d) * PRESSURE * 0.4;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i] + (Math.random() - 0.5) * NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 - 0.05, z: (a.z + b.z) * 0.5,
        age: Math.max(a.age, b.age) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 1200; s++) step();
addEventListener('click', () => { paused = !paused; });

/* ── tube material: deep cadmium red ── */
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xb81c1c,
  emissive: 0x1a0505,
  roughness: 0.55,
  metalness: 0.15,
  side: THREE.DoubleSide,
});

/* ── dots: instanced cream-white spheres ── */
const DOT_COUNT = 4000;
const dotGeo = new THREE.SphereGeometry(0.07, 8, 6);
const dotMat = new THREE.MeshStandardMaterial({
  color: 0xfff5e0,
  emissive: 0x1a1810,
  roughness: 0.3,
  metalness: 0.05,
});
const dots = new THREE.InstancedMesh(dotGeo, dotMat, DOT_COUNT);
dots.count = 0;
scene.add(dots);

const TUBE_RADIUS = 0.38;
const TUBE_SEGMENTS = 10;

let tubeMesh = null;

/* ── place dots on tube surface ── */
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _s = new THREE.Vector3(1, 1, 1);

function placeDots(curve, nSamples, time) {
  let count = 0;
  const up = new THREE.Vector3(0, 1, 0);
  // Rings of dots along the tube — obsessive, tightly packed
  const ringSpacing = 0.28; // distance between rings along curve
  const totalLen = curve.getLength();
  const nRings = Math.floor(totalLen / ringSpacing);
  const dotsPerRing = 8;

  for (let r = 0; r < nRings && count < DOT_COUNT; r++) {
    const tt = r / nRings;
    const p = curve.getPointAt(tt);
    const tangent = curve.getTangentAt(tt).normalize();

    let lateral = new THREE.Vector3().crossVectors(tangent, up);
    if (lateral.lengthSq() < 0.001) lateral.set(1, 0, 0);
    lateral.normalize();
    const binorm = new THREE.Vector3().crossVectors(tangent, lateral).normalize();

    // Pulse: dots breathe slightly — obsessive rhythm
    const pulse = 1.0 + 0.08 * Math.sin(time * 2.2 + r * 0.7);
    const dotScale = 0.9 * pulse;

    for (let d = 0; d < dotsPerRing; d++) {
      if (count >= DOT_COUNT) break;
      const angle = (d / dotsPerRing) * Math.PI * 2 + (r % 2) * (Math.PI / dotsPerRing);
      const rad = TUBE_RADIUS + 0.04;
      const px = p.x + (Math.cos(angle) * lateral.x + Math.sin(angle) * binorm.x) * rad;
      const py = p.y + (Math.cos(angle) * lateral.y + Math.sin(angle) * binorm.y) * rad;
      const pz = p.z + (Math.cos(angle) * lateral.z + Math.sin(angle) * binorm.z) * rad;

      _s.setScalar(dotScale);
      _m.compose(new THREE.Vector3(px, py, pz), _q, _s);
      dots.setMatrixAt(count, _m);
      count++;
    }
  }
  dots.count = count;
  dots.instanceMatrix.needsUpdate = true;
}

/* ── build tube geometry from curve ── */
function buildTube(curve) {
  const g = new THREE.TubeGeometry(curve, Math.min(800, verts.length * 2), TUBE_RADIUS, TUBE_SEGMENTS, true);
  if (tubeMesh) { scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
  tubeMesh = new THREE.Mesh(g, tubeMat);
  scene.add(tubeMesh);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let frameCount = 0;

function loop() {
  const t = (performance.now() - start) / 1000;
  for (let s = 0; s < 3; s++) step();
  frameCount++;

  if (verts.length > 8) {
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);

    // Rebuild tube and dots every few frames for perf
    if (frameCount % 3 === 0) {
      buildTube(curve);
      const nSamples = Math.min(1000, verts.length * 3);
      placeDots(curve, nSamples, t);
    }
  }

  // Camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (const v of verts) { cx += v.x; cy += v.y; cz += v.z; }
  cx /= Math.max(verts.length, 1);
  cy /= Math.max(verts.length, 1);
  cz /= Math.max(verts.length, 1);

  const targetY = Math.max(cy, 2.0);
  controls.target.x += (cx - controls.target.x) * 0.03;
  controls.target.y += (targetY - controls.target.y) * 0.04;
  controls.target.z += (cz - controls.target.z) * 0.03;
  const desiredCamY = targetY + 3.5;
  camera.position.y += (desiredCamY - camera.position.y) * 0.03;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
