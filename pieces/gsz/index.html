<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>gsz · fractal fern dust · barnsley IFS</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#060908;overflow:hidden}
canvas{display:block}
.id{position:fixed;left:14px;bottom:12px;font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#cdd2dc;opacity:0.55;font-size:11px;letter-spacing:0.06em}
</style>
</head>
<body>
<div class="id">gsz</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060908, 1);
document.body.appendChild(renderer.domElement);

/* ── 3D Barnsley fern via chaos game ──
   Classic 2D IFS rotated around the stem axis to produce
   a rotationally-symmetric tree-fern canopy.
   Reference: Michael Barnsley, "Fractals Everywhere" (1988). */

const N = 60000;
const rest   = new Float32Array(N * 3);
const seeds  = new Float32Array(N);
const height = new Float32Array(N);  // normalized 0..1

function genFern() {
  let x = 0, y = 0;
  // warm-up
  for (let i = 0; i < 80; i++) {
    const r = Math.random();
    let nx, ny;
    if (r < 0.01)      { nx = 0;                       ny = 0.16 * y; }
    else if (r < 0.86) { nx = 0.85*x + 0.04*y;         ny = -0.04*x + 0.85*y + 1.6; }
    else if (r < 0.93) { nx = 0.2*x - 0.26*y;          ny = 0.23*x + 0.22*y + 1.6; }
    else                { nx = -0.15*x + 0.28*y;        ny = 0.26*x + 0.24*y + 0.44; }
    x = nx; y = ny;
  }

  let minY = 1e9, maxY = -1e9;
  const raw = [];
  for (let i = 0; i < N; i++) {
    const r = Math.random();
    let nx, ny;
    if (r < 0.01)      { nx = 0;                       ny = 0.16 * y; }
    else if (r < 0.86) { nx = 0.85*x + 0.04*y;         ny = -0.04*x + 0.85*y + 1.6; }
    else if (r < 0.93) { nx = 0.2*x - 0.26*y;          ny = 0.23*x + 0.22*y + 1.6; }
    else                { nx = -0.15*x + 0.28*y;        ny = 0.26*x + 0.24*y + 0.44; }
    x = nx; y = ny;

    // rotate around y-axis for 3D canopy
    const theta = Math.random() * Math.PI * 2;
    const radius = Math.abs(x);
    const px = Math.cos(theta) * radius * 1.6;
    const py = y * 1.3 - 7;
    const pz = Math.sin(theta) * radius * 1.6;

    rest[i*3]   = px;
    rest[i*3+1] = py;
    rest[i*3+2] = pz;
    seeds[i]    = Math.random();
    raw.push(py);
    if (py < minY) minY = py;
    if (py > maxY) maxY = py;
  }
  const range = maxY - minY || 1;
  for (let i = 0; i < N; i++) {
    height[i] = (raw[i] - minY) / range;
  }
}
genFern();

// centroid
let cx = 0, cy = 0, cz = 0;
for (let i = 0; i < N; i++) {
  cx += rest[i*3]; cy += rest[i*3+1]; cz += rest[i*3+2];
}
cx /= N; cy /= N; cz /= N;

/* ── shader material ── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0.0 },
  uDust:  { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uDust;
    attribute vec3  rest;
    attribute float seed;
    attribute float ht;
    varying vec3  vCol;
    varying float vAlpha;
    varying float vSeed;

    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec3 p = rest;
      float t = uTime;

      /* breathing – radial pulse from stem */
      vec3 stemDir = normalize(p - vec3(0.0, p.y, 0.0) + 0.001);
      p += stemDir * sin(t*0.4 + seed*6.28) * 0.1 * (0.3 + ht);

      /* wind sway – stronger at tips */
      float windT = t*0.55 + p.y*0.25 + seed*3.14;
      p.x += sin(windT) * 0.15 * (0.2 + ht*0.8);
      p.z += cos(windT*0.8 + 1.0) * 0.10 * (0.2 + ht*0.8);

      /* dust dispersal – particles drift outward */
      float h1 = hash(seed*127.1);
      float h2 = hash(seed*269.5);
      float h3 = hash(seed*419.3);
      vec3 dustOff = vec3(
        sin(t*0.3 + h1*6.28) * (2.5 + h1*5.0),
        cos(t*0.22 + h2*6.28) * (2.0 + h2*3.5),
        sin(t*0.35 + h3*6.28) * (2.5 + h3*5.0)
      );
      p = mix(p, p + dustOff, uDust);

      /* reveal: fly in from scattered sphere */
      vec3 entry = vec3(
        sin(seed*40.0+1.0)*22.0,
        cos(seed*30.0+2.0)*22.0,
        sin(seed*22.0+3.0)*22.0
      );
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* palette: 5 hand-picked colors
         #122416 deep moss
         #2a5a3a forest
         #6b9b5e faded sage
         #c9943e warm amber
         #a05e28 burnt copper */
      vec3 c1 = vec3(0.071, 0.141, 0.086);
      vec3 c2 = vec3(0.165, 0.353, 0.227);
      vec3 c3 = vec3(0.420, 0.608, 0.369);
      vec3 c4 = vec3(0.788, 0.580, 0.243);
      vec3 c5 = vec3(0.627, 0.369, 0.157);

      float h = ht;
      vec3 col;
      if (h < 0.25)      col = mix(c1, c2, h / 0.25);
      else if (h < 0.50) col = mix(c2, c3, (h - 0.25) / 0.25);
      else if (h < 0.78) col = mix(c3, c4, (h - 0.50) / 0.28);
      else                col = mix(c4, c5, (h - 0.78) / 0.22);

      float energy = 0.5 + 0.5 * sin(t*0.6 + seed*5.0);
      col *= 0.65 + 0.35 * energy;

      /* dust desaturates slightly */
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(col, vec3(lum), uDust * 0.35);

      vCol   = col;
      vAlpha = (0.30 + 0.50 * energy) * (0.2 + 0.8 * uReady);
      vSeed  = seed;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 2.2 * hash(seed*7.7)) * uPixel * (55.0 / dist) * (0.2 + 0.8*uReady);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    varying vec3  vCol;
    varying float vAlpha;
    varying float vSeed;

    void main(){
      vec2 uv = gl_PointCoord - 0.5;

      /* leaf-shaped point sprite: per-particle rotation, elongated ellipse */
      float angle = vSeed * 3.14159265;
      float ca = cos(angle), sa = sin(angle);
      vec2 ruv = vec2(ca*uv.x - sa*uv.y, sa*uv.x + ca*uv.y);
      ruv.x *= 1.9;  /* elongate along major axis */
      float r = dot(ruv, ruv);
      if (r > 0.25) discard;

      /* midrib vein */
      float vein = smoothstep(0.015, 0.0, abs(ruv.y)) * 0.12;

      float falloff = exp(-r * 14.0);
      float a = falloff * vAlpha;
      vec3  col = vCol * (1.0 - vein);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
geom.setAttribute('rest',     new THREE.BufferAttribute(rest, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('ht',       new THREE.BufferAttribute(height, 1));

const pts = new THREE.Points(geom, mat);
scene.add(pts);

/* ── film-grain overlay (Lia Halloran / cyanotype imperfection) ── */
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    float h21(vec2 p){
      p = fract(p * vec2(233.34, 851.74));
      p += dot(p, p+23.45);
      return fract(p.x*p.y);
    }
    void main(){
      float g = h21(gl_FragCoord.xy + uTime*97.0)*0.055 - 0.0275;
      gl_FragColor = vec4(vec3(g), abs(g)*0.8);
    }
  `
});
const grainScene = new THREE.Scene();
const grainCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat));

/* ── subtle background gradient (warm top → cool bottom) ── */
const bgMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec3 top = vec3(0.055, 0.048, 0.035);
      vec3 bot = vec3(0.020, 0.030, 0.035);
      gl_FragColor = vec4(mix(bot, top, vUv.y), 1.0);
    }
  `
});
const bgScene = new THREE.Scene();
const bgCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat);
bgScene.add(bgPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animation loop ── */
const t0 = performance.now();

function sstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function loop() {
  const now = performance.now();
  const t = (now - t0) / 1000;
  uniforms.uTime.value  = t;
  grainMat.uniforms.uTime.value = t;

  /* reveal over 3s */
  uniforms.uReady.value = Math.min(1.0, (now - t0) / 3000);

  /* dust cycle: cohere 9s → disperse 4s → hold 3s → cohere 4s = 20s */
  const cycle = 20;
  const ph = t % cycle;
  let dust;
  if      (ph < 9)  dust = 0;
  else if (ph < 13) dust = sstep(9, 13, ph);
  else if (ph < 16) dust = 1;
  else               dust = 1 - sstep(16, 20, ph);
  uniforms.uDust.value = dust;

  /* camera orbit tracking centroid */
  const oR = 22 + dust * 4;  // pull back slightly when dispersed
  const oS = 0.07;
  camera.position.x = cx + Math.sin(t * oS) * oR;
  camera.position.z = cz + Math.cos(t * oS) * oR;
  camera.position.y = cy + 3.5 + Math.sin(t * 0.04) * 2;
  camera.lookAt(cx, cy + 1, cz);

  /* render layers */
  renderer.autoClear = true;
  renderer.render(bgScene, bgCam);
  renderer.autoClear = false;
  renderer.render(scene, camera);
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
