<title>0in · ayoung kim · courier city graph</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1e24; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">0in</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Ayoung Kim — Delivery Dancer's Sphere — fictive city as wireframe topological
// graph viewed from above: Voronoi building footprints extruded as wireframe
// boxes, courier particles traversing graph edges, trails accumulating as
// chartreuse/magenta glowing paths on slate ground. High-angle orbital camera,
// slow drift. The city is both diagram and hallucination — CGI precision meets
// AI-generated overlay logic.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1e24, 0.015);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.5, 200);
camera.position.set(0, 32, 28);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1e24, 1);
document.body.appendChild(renderer.domElement);

// ───────────────────────────── Voronoi city graph
// Lloyd-relaxed Voronoi sites → building footprints + street graph
const CITY_W = 40, CITY_H = 40;
const N_SITES = 80;
const sites = [];
for (let i = 0; i < N_SITES; i++){
  sites.push({ x: (Math.random()-0.5)*CITY_W, y: (Math.random()-0.5)*CITY_H });
}
// Lloyd relaxation: 4 passes to regularize
for (let pass = 0; pass < 4; pass++){
  const regions = sites.map(s => ({ s, pts: [] }));
  const grid = 80;
  for (let ix = 0; ix < grid; ix++){
    for (let iy = 0; iy < grid; iy++){
      const px = (ix/grid - 0.5)*CITY_W, py = (iy/grid - 0.5)*CITY_H;
      let best = 0, dMin = 1e9;
      for (let i = 0; i < N_SITES; i++){
        const dx = px - sites[i].x, dy = py - sites[i].y;
        const d = dx*dx + dy*dy;
        if (d < dMin){ dMin = d; best = i; }
      }
      regions[best].pts.push({ x: px, y: py });
    }
  }
  for (let i = 0; i < N_SITES; i++){
    const pts = regions[i].pts;
    if (pts.length === 0) continue;
    let cx = 0, cy = 0;
    for (const p of pts){ cx += p.x; cy += p.y; }
    sites[i].x = cx / pts.length;
    sites[i].y = cy / pts.length;
  }
}
// Build adjacency: a site is neighbor of another if distance < threshold
const ADJ_THRESH = 7.5;
const adj = sites.map(() => []);
for (let i = 0; i < N_SITES; i++){
  for (let j = i+1; j < N_SITES; j++){
    const dx = sites[i].x - sites[j].x, dy = sites[i].y - sites[j].y;
    if (dx*dx + dy*dy < ADJ_THRESH*ADJ_THRESH){
      adj[i].push(j); adj[j].push(i);
    }
  }
}

// ───────────────────────────── Building wireframe extrusions
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
const buildingMat = new THREE.LineBasicMaterial({ color: 0x3d4756, transparent: true, opacity: 0.6 });
for (const s of sites){
  // random footprint size + height
  const w = 0.8 + Math.random()*1.2, d = 0.8 + Math.random()*1.2;
  const h = 1.5 + Math.random()*4;
  const box = new THREE.BoxGeometry(w, h, d);
  const edges = new THREE.EdgesGeometry(box);
  const lines = new THREE.LineSegments(edges, buildingMat);
  lines.position.set(s.x, h*0.5, s.y);
  s.height = h; s.width = w; s.depth = d; // store for later
  buildingGroup.add(lines);
}

// ───────────────────────────── Street graph as wire edges
const streetGroup = new THREE.Group();
scene.add(streetGroup);
const streetMat = new THREE.LineBasicMaterial({ color: 0x4a5568, transparent: true, opacity: 0.4 });
const streetEdges = [];
for (let i = 0; i < N_SITES; i++){
  for (const j of adj[i]){
    if (j > i) streetEdges.push([i, j]);
  }
}
for (const [i, j] of streetEdges){
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(sites[i].x, 0.02, sites[i].y),
    new THREE.Vector3(sites[j].x, 0.02, sites[j].y)
  ]);
  streetGroup.add(new THREE.LineSegments(geo, streetMat));
}

// ───────────────────────────── Ground plane (slate)
const groundGeo = new THREE.PlaneGeometry(CITY_W*1.2, CITY_H*1.2);
groundGeo.rotateX(-Math.PI/2);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x23272e, transparent: true, opacity: 0.85 });
const ground = new THREE.Mesh(groundGeo, groundMat);
scene.add(ground);

// ───────────────────────────── Courier particles
const N_COURIERS = 120;
const couriers = [];
for (let i = 0; i < N_COURIERS; i++){
  const src = Math.floor(Math.random()*N_SITES);
  let dest = Math.floor(Math.random()*N_SITES);
  while (dest === src) dest = Math.floor(Math.random()*N_SITES);
  // BFS path from src to dest
  const path = bfs(src, dest, adj);
  if (path.length > 1){
    couriers.push({
      path,
      idx: 0,
      t: Math.random(),
      speed: 0.012 + Math.random()*0.008,
      color: Math.random() < 0.5 ? new THREE.Color(0xb4ff39) : new THREE.Color(0xff39e8), // chartreuse / magenta
      trailPoints: []
    });
  }
}
function bfs(start, end, adj){
  const queue = [[start]], visited = new Set([start]);
  while (queue.length){
    const path = queue.shift();
    const node = path[path.length - 1];
    if (node === end) return path;
    for (const nb of adj[node]){
      if (!visited.has(nb)){
        visited.add(nb);
        queue.push([...path, nb]);
      }
    }
  }
  return [start, end]; // fallback direct
}

// ───────────────────────────── Trail rendering: accumulated LineSegments
const trailGroup = new THREE.Group();
scene.add(trailGroup);
const MAX_TRAIL_SEGS = 8000;
const trailPositions = new Float32Array(MAX_TRAIL_SEGS * 2 * 3); // two verts per segment
const trailColors = new Float32Array(MAX_TRAIL_SEGS * 2 * 3);
const trailAlphas = new Float32Array(MAX_TRAIL_SEGS * 2);
let trailCount = 0;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
trailGeo.setAttribute('alpha', new THREE.BufferAttribute(trailAlphas, 1));
const trailMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    varying vec3 vCol;
    void main(){
      vAlpha = alpha;
      vCol = color;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vCol;
    void main(){
      gl_FragColor = vec4(vCol, vAlpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  vertexColors: true
});
const trailLines = new THREE.LineSegments(trailGeo, trailMat);
scene.add(trailLines);

function addTrailSegment(a, b, color, alpha){
  if (trailCount >= MAX_TRAIL_SEGS) return;
  const i = trailCount * 2;
  trailPositions[i*3]   = a.x; trailPositions[i*3+1] = a.y; trailPositions[i*3+2] = a.z;
  trailPositions[i*3+3] = b.x; trailPositions[i*3+4] = b.y; trailPositions[i*3+5] = b.z;
  trailColors[i*3]   = color.r; trailColors[i*3+1] = color.g; trailColors[i*3+2] = color.b;
  trailColors[i*3+3] = color.r; trailColors[i*3+4] = color.g; trailColors[i*3+5] = color.b;
  trailAlphas[i]   = alpha;
  trailAlphas[i+1] = alpha * 0.7;
  trailCount++;
}

// ───────────────────────────── Lighting (minimal ambient)
const ambient = new THREE.AmbientLight(0x9ca3af, 0.4);
scene.add(ambient);
const directional = new THREE.DirectionalLight(0xffffff, 0.3);
directional.position.set(5, 10, 3);
scene.add(directional);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Update couriers
  for (const c of couriers){
    if (c.idx >= c.path.length - 1){
      // arrived — pick new destination
      const dest = Math.floor(Math.random()*N_SITES);
      const newPath = bfs(c.path[c.path.length - 1], dest, adj);
      c.path = newPath;
      c.idx = 0;
      c.t = 0;
    }
    c.t += c.speed;
    if (c.t >= 1){
      c.t -= 1;
      c.idx++;
      if (c.idx >= c.path.length - 1){
        const dest = Math.floor(Math.random()*N_SITES);
        const newPath = bfs(c.path[c.path.length - 1], dest, adj);
        c.path = newPath;
        c.idx = 0;
        c.t = 0;
      }
    }
    const a = sites[c.path[c.idx]], b = sites[c.path[c.idx + 1]];
    const px = a.x + (b.x - a.x)*c.t;
    const py = 0.3;
    const pz = a.y + (b.y - a.y)*c.t;
    const pos = new THREE.Vector3(px, py, pz);
    // add trail segment if we've moved
    if (c.trailPoints.length > 0){
      const last = c.trailPoints[c.trailPoints.length - 1];
      const dist = pos.distanceTo(last);
      if (dist > 0.15){
        addTrailSegment(last, pos, c.color, 0.5);
        c.trailPoints.push(pos.clone());
        if (c.trailPoints.length > 80) c.trailPoints.shift();
      }
    } else {
      c.trailPoints.push(pos.clone());
    }
  }
  trailGeo.setDrawRange(0, trailCount * 2);
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
  trailGeo.attributes.alpha.needsUpdate = true;

  // Slow orbital drift
  const angle = elapsed * 0.08;
  const radius = 35;
  camera.position.x = Math.sin(angle) * radius;
  camera.position.z = Math.cos(angle) * radius;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
