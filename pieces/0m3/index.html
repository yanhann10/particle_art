<title>0m3 · lorenz attractor (naïve)</title>
<!-- MOTION: sway, intensity: gentle -->
<style>

               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; z-index:10; }

<body>
<div class="id">0m3 · lorenz attractor</div>
<div class="hint">σ ρ β · move pointer to nudge parameters</div>
<div class="src">naïve painting · anti-polish · 100k GPGPU</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Lorenz attractor with deliberate imperfection —
// after Amy Sillman's "anti-mastery" principle and
// the 2025 naïve-painting counter-trend.
// Hand-jitter, brushstroke-scale particles, wobbly camera.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false }); // no AA — raw pixels
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07080c, 1);
document.body.appendChild(renderer.domElement);

// ---- ping-pong state RTs ----
const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// init: scatter particles — intentionally uneven seeding
const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  // asymmetric seed: more particles on one side
  const bias = (i % 7 < 3) ? 1.0 : -0.6;
  init[i*4]   = (Math.random()*2-1) * 8.0 * (1.0 + bias * 0.15);
  init[i*4+1] = (Math.random()*2-1) * 8.0;
  init[i*4+2] = (Math.random()*2-1) * 8.0 + 25.0;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- simulation pass ----
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 },
  uTime:  { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uSigma;
    uniform float uRho;
    uniform float uBeta;
    uniform float uTime;
    varying vec2 vUv;

    // cheap hash for per-particle asymmetry
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // per-particle parameter wobble — breaks perfect symmetry
      float h = hash(vUv);
      float sigLocal = uSigma + (h - 0.5) * 0.4;
      float rhoLocal = uRho + (hash(vUv + 0.1) - 0.5) * 0.6;

      vec3 dp = vec3(
        sigLocal * (p.y - p.x),
        p.x * (rhoLocal - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ---- render pass ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 80);
camera.lookAt(0, 0, 25);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
// per-particle random seed baked into an attribute
const rndArr = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
  rndArr[i] = Math.random();
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));
pointsGeom.setAttribute('aRnd',     new THREE.BufferAttribute(rndArr, 1));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    attribute float aRnd;
    varying float vAge;
    varying float vSpeed;
    varying float vRnd;
    varying float vBrush;

    // hash
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;

      float speed = length(vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x*p.z,
        p.x * p.y - (8.0/3.0) * p.z
      )) * 0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vRnd = aRnd;

      // --- JITTER: 8-12% positional displacement ---
      float jitterAmt = 0.08 + aRnd * 0.04; // 8-12%
      float h1 = hash(uvIdx + uTime * 0.003);
      float h2 = hash(uvIdx * 1.7 + uTime * 0.002);
      float h3 = hash(uvIdx * 2.3 - uTime * 0.004);
      // jitter scaled to local position magnitude
      float mag = length(p) * jitterAmt;
      p.x += (h1 - 0.5) * mag;
      p.y += (h2 - 0.5) * mag;
      p.z += (h3 - 0.5) * mag;

      // shift attractor center
      p.z -= 25.0;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // --- BRUSHSTROKE particles: ~7% are 3-5x larger ---
      vBrush = 0.0;
      float baseSize = (1.1 + 1.6 * vSpeed) * uPixel * (60.0 / dist);
      if (aRnd > 0.93) {
        // big brushstroke mark
        float scale = 3.0 + aRnd * 8.0; // 3-5x (mapped from 0.93-1.0)
        baseSize *= scale;
        vBrush = 1.0;
      } else if (aRnd > 0.88) {
        // medium emphasis marks
        baseSize *= 1.8 + aRnd * 1.5;
        vBrush = 0.5;
      }

      gl_PointSize = baseSize;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vRnd;
    varying float vBrush;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;

      // brushstroke particles: softer falloff, more opaque
      float falloff = vBrush > 0.5 ? 6.0 : 14.0;
      float a = exp(-r * falloff);

      // palette: hand-mixed — slightly different per particle
      // indigo / rose / ochre with per-particle hue shifts
      vec3 a_col = vec3(0.18 + vRnd*0.06, 0.30 + vRnd*0.04, 0.75 - vRnd*0.08);
      vec3 b_col = vec3(0.88 - vRnd*0.1, 0.28 + vRnd*0.08, 0.58 + vRnd*0.06);
      vec3 c_col = vec3(0.95 + vRnd*0.04, 0.82 - vRnd*0.06, 0.42 + vRnd*0.1);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));

      // brushstrokes are denser/more saturated
      float intensity = 0.45 + vSpeed * 0.9;
      if (vBrush > 0.5) {
        intensity *= 0.7; // less bright but more opaque
        a *= 1.4;
        col = mix(col, col * 1.15, 0.3); // slightly oversaturated
      } else if (vBrush > 0.3) {
        intensity *= 0.85;
        a *= 1.2;
      }

      gl_FragColor = vec4(col * a * intensity, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ---- grain overlay (full-screen quad) ----
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0.0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  transparent: true, depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453);
    }
    void main(){
      vec2 px = gl_FragCoord.xy;
      float grain = hash(px + uTime * 7.13) * 0.06 - 0.03;
      // slight warm tint at bottom, cool at top — uneven background
      float yGrad = gl_FragCoord.y / uRes.y;
      vec3 tint = mix(vec3(0.02, 0.01, 0.005), vec3(-0.005, 0.0, 0.01), yGrad);
      gl_FragColor = vec4(tint + grain, 0.35);
    }
  `
});
const grainScene = new THREE.Scene();
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  grainMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

// pointer nudges parameters
const target = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.0;
  target.sigma = 10.0 + nx * 2.5;
});

// --- wobbly camera path: hand-held, not mechanical ---
// pre-bake a few random wobble offsets for organic sway
const wobbleSeeds = [];
for (let i = 0; i < 6; i++) wobbleSeeds.push(Math.random() * 6.28);

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;
  const tSec = now / 1000;

  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;
  simUniforms.uTime.value  = tSec;

  // step sim
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = tSec;

  // --- wobbly sway camera: asymmetric orbit + gentle drift ---
  const baseAng = now * 0.00009; // slower than parent
  // layered sine wobbles at incommensurate frequencies
  const wx = Math.sin(baseAng * 1.0 + wobbleSeeds[0]) * 78
           + Math.sin(baseAng * 2.7 + wobbleSeeds[1]) * 4.5
           + Math.sin(baseAng * 7.1 + wobbleSeeds[2]) * 1.2;
  const wz = Math.cos(baseAng * 1.0 + wobbleSeeds[3]) * 78
           + Math.cos(baseAng * 3.1 + wobbleSeeds[4]) * 5.2
           + Math.sin(baseAng * 5.3 + wobbleSeeds[5]) * 1.8;
  // vertical drift — not level, slightly drunk
  const wy = Math.sin(baseAng * 0.7 + 1.3) * 6.0
           + Math.sin(baseAng * 2.3 + 0.7) * 2.5;

  camera.position.set(wx, wy, wz);
  // look slightly off-center — not perfect centering
  const lookOff = Math.sin(baseAng * 0.4) * 2.0;
  camera.lookAt(lookOff, Math.sin(baseAng * 0.6) * 1.5, 0);

  renderer.render(scene, camera);

  // grain overlay
  grainMat.uniforms.uTime.value = tSec;
  renderer.autoClear = false;
  renderer.render(grainScene, camOrtho);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
