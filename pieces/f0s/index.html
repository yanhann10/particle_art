<!doctype html>
<html lang="en">
<head>
<!-- MOTION: pulse, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f0s · relational aizawa</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .info  { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; text-align:right; line-height:1.6; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">f0s</div>
<div class="info" id="social-info">1 peer · 0 pulses</div>
<div class="hint">open in multiple tabs — the field is shared</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── social layer ─────────────────────────────────── */
const myId = Math.random().toString(36).slice(2,10);
const peers = new Map();
let myPointer = { x: 0.0, y: 0.0 };
let pulseCount = 0;
let priceMomentum = 0.0;
let lastPrice = 0;
let wsConnected = false;

const channel = new BroadcastChannel('aizawa-relational-field');
channel.onmessage = (e) => {
  const d = e.data;
  if (d.id === myId) return;
  if (d.type === 'heartbeat') {
    peers.set(d.id, { lastSeen: Date.now(), px: d.px, py: d.py });
  } else if (d.type === 'leave') {
    peers.delete(d.id);
  }
};

setInterval(() => {
  channel.postMessage({ type:'heartbeat', id:myId, px:myPointer.x, py:myPointer.y });
  const now = Date.now();
  for (const [id, p] of peers) { if (now - p.lastSeen > 3000) peers.delete(id); }
  updateInfoDisplay();
}, 400);

addEventListener('beforeunload', () => channel.postMessage({ type:'leave', id:myId }));

function connectWS() {
  try {
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onopen = () => { wsConnected = true; };
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        const price = parseFloat(data.p);
        if (lastPrice > 0) {
          priceMomentum += (price - lastPrice) / lastPrice * 800;
        }
        lastPrice = price;
        pulseCount++;
      } catch(_){}
    };
    ws.onclose = () => { wsConnected = false; setTimeout(connectWS, 8000); };
    ws.onerror = () => { try { ws.close(); } catch(_){} };
  } catch(_) {}
}
connectWS();

const infoEl = document.getElementById('social-info');
function updateInfoDisplay() {
  const n = peers.size + 1;
  const peerWord = n === 1 ? 'peer' : 'peers';
  const wsTag = wsConnected ? ' · live' : '';
  infoEl.textContent = `${n} ${peerWord} · ${pulseCount} pulses${wsTag}`;
}

/* ── renderer ─────────────────────────────────────── */
const W = 320, H = 320, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1)*0.6;
  init[i*4+1] = (Math.random()*2-1)*0.6;
  init[i*4+2] = (Math.random()*2-1)*0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex:{ value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

/* ── simulation ───────────────────────────────────── */
const simUniforms = {
  prev:       { value: rtA.texture },
  uDt:        { value: 0.012 },
  uA:         { value: 0.95 },
  uB:         { value: 0.70 },
  uC:         { value: 0.60 },
  uD:         { value: 3.50 },
  uE:         { value: 0.25 },
  uF:         { value: 0.10 },
  uSocial:    { value: 0.0 },
  uPulse:     { value: 0.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uSocial, uPulse;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // social modulation: more peers widen the basin slightly
      float a = uA + uSocial * 0.03;
      float d = uD + uSocial * 0.15;
      // price pulse briefly perturbs coupling
      float f = uF + uPulse * 0.04;

      vec3 dp = vec3(
        (p.z - uB) * p.x - d * p.y,
        d * p.x + (p.z - uB) * p.y,
        uC + a * p.z - (p.z*p.z*p.z)/3.0
             - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
             + f * p.z * p.x*p.x*p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

/* ── points ───────────────────────────────────────── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0, 0, 4);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x+0.5)/W;
  idxArr[i*2+1] = (y+0.5)/H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtB.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uSocial:  { value: 0.0 },
    uPulse:   { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel, uSocial, uPulse;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vSocial;
    varying float vPulse;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vSocial = uSocial;
      vPulse = uPulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sz = (1.1 + 1.5*vSpeed) * uPixel * (8.0/dist);
      // social presence slightly expands particles
      sz *= 1.0 + uSocial * 0.08;
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vSocial;
    varying float vPulse;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);

      // solo palette: warm copper / amber / cream
      vec3 solo_a = vec3(0.78, 0.42, 0.18);
      vec3 solo_b = vec3(0.90, 0.65, 0.30);
      vec3 solo_c = vec3(0.98, 0.93, 0.85);

      // social palette: teal / violet / ice
      vec3 soc_a = vec3(0.15, 0.52, 0.58);
      vec3 soc_b = vec3(0.50, 0.28, 0.72);
      vec3 soc_c = vec3(0.88, 0.92, 0.98);

      float k = mod(vAge + vSpeed * 0.4, 1.0);

      // blend palettes based on social density
      float sf = clamp(vSocial / 4.0, 0.0, 1.0);
      vec3 ca = mix(solo_a, soc_a, sf);
      vec3 cb = mix(solo_b, soc_b, sf);
      vec3 cc = mix(solo_c, soc_c, sf);

      vec3 col = mix(ca, cb, smoothstep(0.0, 0.5, k));
      col = mix(col, cc, smoothstep(0.5, 1.0, k));

      // price pulse: brief warm flash
      col += vec3(0.35, 0.25, 0.10) * vPulse * (1.0 - r*4.0);

      float brightness = 0.45 + vSpeed * 0.9;
      // social presence lifts base brightness
      brightness += sf * 0.15;

      gl_FragColor = vec4(col * a * brightness, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

/* ── vignette overlay ─────────────────────────────── */
const vignetteScene = new THREE.Scene();
const vignetteMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uSocial: { value: 0.0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uSocial;
    void main(){
      vec2 c = vUv - 0.5;
      float v = dot(c,c);
      // vignette softens as more peers join
      float strength = 0.75 - clamp(uSocial/6.0, 0.0, 0.3);
      float alpha = smoothstep(0.15, 0.85, v) * strength;
      gl_FragColor = vec4(0.02, 0.03, 0.04, alpha);
    }
  `
});
vignetteScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), vignetteMat));

/* ── grain overlay ────────────────────────────────── */
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uTime: { value: 0.0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float g = hash(vUv * 800.0 + uTime * 13.7);
      gl_FragColor = vec4(vec3(g), 0.04);
    }
  `
});
const grainScene = new THREE.Scene();
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), grainMat));

/* ── resize ───────────────────────────────────────── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── pointer ──────────────────────────────────────── */
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  myPointer.x = (e.clientX / innerWidth) - 0.5;
  myPointer.y = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + myPointer.x * 0.08;
  target.c = 0.60 + myPointer.y * 0.10;
});

/* ── main loop ────────────────────────────────────── */
let t0 = performance.now();
let smoothPulse = 0.0;
let smoothSocial = 0.0;

function loop(){
  const now = performance.now();
  const dt = Math.min((now - t0) * 0.001, 0.05);

  // social state
  const peerCount = peers.size;

  // average peer pointer influence into attractor params
  let avgPx = myPointer.x, avgPy = myPointer.y;
  if (peerCount > 0) {
    for (const [, p] of peers) { avgPx += p.px; avgPy += p.py; }
    avgPx /= (peerCount + 1);
    avgPy /= (peerCount + 1);
    target.a = 0.95 + avgPx * 0.08;
    target.c = 0.60 + avgPy * 0.10;
  }

  // smooth social and pulse values
  smoothSocial += (peerCount - smoothSocial) * 0.03;
  priceMomentum *= 0.92;
  smoothPulse += (Math.abs(priceMomentum) - smoothPulse) * 0.15;
  smoothPulse = Math.min(smoothPulse, 1.0);

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uSocial.value = smoothSocial;
  simUniforms.uPulse.value = smoothPulse;

  // GPGPU sim steps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uSocial.value = smoothSocial;
  pointsMat.uniforms.uPulse.value = smoothPulse;

  // camera orbit — speed modulated by social presence
  const baseSpeed = 0.00015;
  const socialSpeed = baseSpeed * (1.0 + smoothSocial * 0.12);
  const ang = (now - t0) * socialSpeed;
  const camDist = 4.0 + smoothSocial * 0.3;
  camera.position.x = Math.sin(ang) * camDist;
  camera.position.z = Math.cos(ang) * camDist;
  camera.position.y = Math.sin(ang * 0.7) * 1.0;
  camera.lookAt(0, 0, 1.0);

  // render
  renderer.render(scene, camera);

  // overlays
  renderer.autoClear = false;
  vignetteMat.uniforms.uSocial.value = smoothSocial;
  renderer.render(vignetteScene, camOrtho);
  grainMat.uniforms.uTime.value = now * 0.001;
  renderer.render(grainScene, camOrtho);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
