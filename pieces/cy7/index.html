<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cy7 · tender nodal dust (Ernst Chladni)</title>
<!-- MOTION: organizing, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0c0a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">cy7</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Ernst Chladni · cymatics eigenmode · nodal self-organization</div>
<div class="stat" id="stat">mode=(1,1)</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender nodal dust — Chladni eigenmodes, soft lighting.
   Felix Gonzalez-Torres spirit: quiet, intimate register.
   50k sand particles self-organize into nodal patterns
   on a dark bronze plate as mode (m,n) slowly cycles.
   Particles move along −∇|u(x,y)| toward zero-lines. */

const BG = 0x0f0c0a;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.018);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 16, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);

// plate geometry — dark bronze rectangle
const L = 10;
const plate = new THREE.Mesh(
  new THREE.PlaneGeometry(L, L, 1, 1),
  new THREE.MeshStandardMaterial({
    color: 0x1a1612,
    metalness: 0.5,
    roughness: 0.8
  })
);
plate.receiveShadow = true;
scene.add(plate);

// thin border edges — soft highlight
const borderGeom = new THREE.EdgesGeometry(plate.geometry);
const borderMat = new THREE.LineBasicMaterial({ color: 0x3a3230, transparent: true, opacity: 0.35 });
const border = new THREE.LineSegments(borderGeom, borderMat);
scene.add(border);

// lighting: soft warm side-light + dim ambient
const ambient = new THREE.AmbientLight(0x2a2420, 0.4);
scene.add(ambient);
const key = new THREE.DirectionalLight(0xffebd0, 0.7);
key.position.set(8, 12, 6);
key.castShadow = false;
scene.add(key);
const rim = new THREE.DirectionalLight(0xd4c4b0, 0.3);
rim.position.set(-5, 2, -8);
scene.add(rim);

// mode sequence (m,n) — carefully chosen to produce distinct Chladni figures
const modes = [
  [1,1], [2,1], [2,2], [3,2], [3,3], [4,2], [4,3], [5,3], [4,4], [5,4], [6,3], [5,5]
];
let modeIdx = 0;
let modeLerp = 0;
let currentM = modes[0][0];
let currentN = modes[0][1];

function eigenmode(x, y, m, n) {
  // Chladni eigenmode for square plate: u(x,y) = cos(mπx/L)cos(nπy/L) − cos(nπx/L)cos(mπy/L)
  const mx = Math.cos(m * Math.PI * x / L);
  const my = Math.cos(m * Math.PI * y / L);
  const nx = Math.cos(n * Math.PI * x / L);
  const ny = Math.cos(n * Math.PI * y / L);
  return mx * ny - nx * my;
}

function gradient(x, y, m, n, eps = 0.01) {
  const u0 = eigenmode(x, y, m, n);
  const ux = eigenmode(x + eps, y, m, n);
  const uy = eigenmode(x, y + eps, m, n);
  return {
    dx: (ux - u0) / eps,
    dy: (uy - u0) / eps
  };
}

// particles
const N_PARTICLES = 50000;
const particles = [];
for (let i = 0; i < N_PARTICLES; i++) {
  particles.push({
    x: (Math.random() - 0.5) * L * 0.98,
    y: (Math.random() - 0.5) * L * 0.98,
    vx: 0,
    vy: 0,
    seed: Math.random()
  });
}

// rendering
const rPos = new Float32Array(N_PARTICLES * 3);
const rSeeds = new Float32Array(N_PARTICLES);
for (let i = 0; i < N_PARTICLES; i++) {
  rSeeds[i] = particles[i].seed;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(rSeeds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vAlpha;
    varying vec3 vCol;

    void main() {
      vec3 p = position;
      
      // gentle vertical hover — sand grains vibrate slightly
      float hover = sin(uTime * 2.0 + seed * 40.0) * 0.006;
      p.z += hover + 0.01;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 1.2 * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;

      // palette: warm sand colors (F.G.-T. warmth)
      vec3 sand1 = vec3(0.96, 0.94, 0.88);
      vec3 sand2 = vec3(0.98, 0.90, 0.78);
      vec3 sand3 = vec3(1.0, 0.88, 0.70);
      float k = fract(seed * 7.13);
      vCol = mix(sand1, sand2, smoothstep(0.3, 0.7, k));
      vCol = mix(vCol, sand3, smoothstep(0.75, 1.0, k) * 0.4);

      // soft shimmer
      float shimmer = 0.85 + 0.15 * sin(uTime * 1.5 + seed * 25.0);
      vCol *= shimmer;

      vAlpha = 0.7;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vCol;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 18.0);
      float soft = exp(-r * 6.0) * 0.25;
      float a = (core + soft) * vAlpha;

      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
points.position.z = 0.01;
scene.add(points);

let paused = false;
addEventListener('click', () => { paused = !paused; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();

function step() {
  if (paused) return;

  // cycle through modes slowly — 12 seconds per mode
  const modeT = (performance.now() - start) / 1000 / 12;
  const newIdx = Math.floor(modeT) % modes.length;
  if (newIdx !== modeIdx) {
    modeIdx = newIdx;
    modeLerp = 0;
  }
  modeLerp = Math.min(1, modeLerp + 0.006);
  
  const [m0, n0] = modes[modeIdx];
  const [m1, n1] = modes[(modeIdx + 1) % modes.length];
  
  // lerp mode parameters for smooth transitions
  const t = modeLerp * modeLerp * (3 - 2 * modeLerp); // smoothstep
  currentM = m0 + (m1 - m0) * t;
  currentN = n0 + (n1 - n0) * t;

  // physics: move particles along −∇|u(x,y)| toward nodal lines
  const DAMPING = 0.92;
  const FORCE = 0.015;
  const BROWNIAN = 0.005;
  const BOUNDARY = L * 0.48;

  for (let i = 0; i < N_PARTICLES; i++) {
    const p = particles[i];
    
    // gradient descent toward zero-amplitude lines
    const grad = gradient(p.x, p.y, currentM, currentN);
    const u = eigenmode(p.x, p.y, currentM, currentN);
    const mag = Math.abs(u);
    
    // force proportional to |u| — stronger away from nodes
    const fx = -grad.dx * mag * FORCE;
    const fy = -grad.dy * mag * FORCE;

    p.vx = (p.vx + fx) * DAMPING;
    p.vy = (p.vy + fy) * DAMPING;

    // Brownian jitter — prevents exact convergence, keeps texture alive
    p.vx += (Math.random() - 0.5) * BROWNIAN;
    p.vy += (Math.random() - 0.5) * BROWNIAN;

    p.x += p.vx;
    p.y += p.vy;

    // soft boundary — reflect particles that escape plate edges
    if (Math.abs(p.x) > BOUNDARY) {
      p.x = Math.sign(p.x) * BOUNDARY;
      p.vx *= -0.5;
    }
    if (Math.abs(p.y) > BOUNDARY) {
      p.y = Math.sign(p.y) * BOUNDARY;
      p.vy *= -0.5;
    }
  }

  // update buffer
  for (let i = 0; i < N_PARTICLES; i++) {
    rPos[i * 3]     = particles[i].x;
    rPos[i * 3 + 1] = particles[i].y;
    rPos[i * 3 + 2] = 0;
  }
  geom.attributes.position.needsUpdate = true;
}

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 2; s++) step();

  const [m, n] = modes[modeIdx];
  statEl.textContent = `mode=(${m},${n})${paused ? ' · paused' : ''}`;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// pre-settle: let particles organize before first render
for (let s = 0; s < 400; s++) step();

loop();
</script>
</body>
</html>
