<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: growth, intensity: gentle -->
<title>m3y · substrate venation · jared tarbell</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#0c0a08; overflow:hidden; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
      font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; letter-spacing:0.06em; z-index:2; }
</style>
</head>
<body>
<div class="id">m3y</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 52);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0a08, 1);
document.body.appendChild(renderer.domElement);

/* ── Substrate algorithm (Jared Tarbell, 2003) ── */
const W = 900, H = 900;
const grid = new Int16Array(W * H).fill(-1);
const MAX_CRACKS = 280;
const MAX_P = 120000;

class Crack {
  constructor(x, y, angle, gen) {
    this.x = x; this.y = y;
    this.angle = angle;
    this.gen = Math.min(gen, 11);
    this.alive = true;
    this.pts = [{x, y}];
    this.age = 0;
  }
  step() {
    if (!this.alive) return;
    const rad = this.angle * Math.PI / 180;
    this.x += Math.cos(rad) * 0.42;
    this.y += Math.sin(rad) * 0.42;
    const ix = Math.round(this.x), iy = Math.round(this.y);
    if (ix < 1 || ix >= W-1 || iy < 1 || iy >= H-1) { this.alive = false; return; }
    const idx = iy * W + ix;
    if (grid[idx] >= 0 && this.age > 3) {
      this.alive = false;
      return true; // crossed
    }
    grid[idx] = Math.round(this.angle + 360) % 360;
    this.pts.push({x: this.x, y: this.y});
    this.age++;
    return false;
  }
}

let cracks = [];
let segments = [];

function aliveCount() { let n=0; for (const c of cracks) if (c.alive) n++; return n; }

function spawnAt(x, y, angle, gen) {
  if (aliveCount() >= MAX_CRACKS) return;
  if (gen > 11) return;
  angle = ((angle % 360) + 360) % 360;
  cracks.push(new Crack(x, y, angle, gen));
}

function seedEdge() {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = 0; y = Math.random() * H; }
  else if (side === 1) { x = W-1; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = 0; }
  else { x = Math.random() * W; y = H-1; }
  const base = Math.floor(Math.random() * 4) * 90;
  spawnAt(x, y, base + (Math.random()-0.5)*8, 0);
}

function seedRandom() {
  const x = 50 + Math.random() * (W-100);
  const y = 50 + Math.random() * (H-100);
  const angle = Math.floor(Math.random() * 4) * 90 + (Math.random()-0.5)*5;
  spawnAt(x, y, angle, 0);
}

// Initial seeds: mix of edge and interior
for (let i = 0; i < 6; i++) seedEdge();
for (let i = 0; i < 6; i++) seedRandom();

function runBatch(steps) {
  for (let s = 0; s < steps; s++) {
    if (Math.random() < 0.006 && aliveCount() < 15) {
      if (Math.random() < 0.5) seedEdge(); else seedRandom();
    }
    for (const c of cracks) {
      if (!c.alive) continue;
      const crossed = c.step();
      if (!c.alive && c.pts.length > 4) {
        segments.push({pts: c.pts, gen: c.gen});
        if (crossed) {
          const last = c.pts[c.pts.length-1];
          spawnAt(last.x, last.y, c.angle + 90 + (Math.random()-0.5)*4, c.gen+1);
          spawnAt(last.x, last.y, c.angle - 90 + (Math.random()-0.5)*4, c.gen+1);
        }
      }
    }
  }
}

// Pre-compute enough for immediate visibility
runBatch(12000);

/* ── Particle buffers ── */
const pos = new Float32Array(MAX_P * 3);
const col = new Float32Array(MAX_P * 3);
const siz = new Float32Array(MAX_P);
const rnd = new Float32Array(MAX_P);
const gen = new Float32Array(MAX_P);

// Palette: sandstone → terracotta → umber → copper-patina → parchment
const PAL = [
  [0.94, 0.88, 0.76],  // aged parchment
  [0.88, 0.74, 0.54],  // sandstone
  [0.82, 0.58, 0.38],  // warm ochre
  [0.76, 0.44, 0.30],  // terracotta
  [0.62, 0.38, 0.28],  // sienna
  [0.50, 0.44, 0.38],  // warm gray
  [0.42, 0.50, 0.46],  // aged verdigris
  [0.68, 0.62, 0.50],  // dust
  [0.56, 0.34, 0.26],  // burnt umber
  [0.74, 0.68, 0.58],  // bone
  [0.46, 0.42, 0.36],  // charcoal warm
  [0.84, 0.70, 0.52],  // amber
];

let pCount = 0;

function buildParticles() {
  let idx = 0;
  const sc = 32 / W;
  const ox = -16, oy = -16;
  for (const seg of segments) {
    if (idx >= MAX_P) break;
    const sp = 1.4 + seg.gen * 0.25;
    const c = PAL[seg.gen % PAL.length];
    const npts = seg.pts.length;
    for (let i = 0; i < npts && idx < MAX_P; i += sp) {
      const p = seg.pts[Math.min(Math.floor(i), npts-1)];
      const r = Math.random();
      pos[idx*3]   = p.x * sc + ox + (Math.random()-0.5)*0.06;
      pos[idx*3+1] = p.y * sc + oy + (Math.random()-0.5)*0.06;
      pos[idx*3+2] = seg.gen * 0.12 + (Math.random()-0.5)*0.08;
      const v = 0.85 + Math.random() * 0.3;
      col[idx*3]   = c[0] * v;
      col[idx*3+1] = c[1] * v;
      col[idx*3+2] = c[2] * v;
      siz[idx] = 0.8 + Math.random()*1.2 - seg.gen*0.03;
      rnd[idx] = r;
      gen[idx] = seg.gen;
      idx++;
    }
  }
  pCount = idx;
}

buildParticles();

/* ── Three.js points ── */
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geom.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
geom.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));
geom.setAttribute('aRand', new THREE.BufferAttribute(rnd, 1));
geom.setAttribute('aGen', new THREE.BufferAttribute(gen, 1));
geom.setDrawRange(0, pCount);

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:   { value: 0 },
    uPixel:  { value: renderer.getPixelRatio() },
    uReveal: { value: 0 }
  },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uReveal;
    attribute vec3 aColor;
    attribute float aSize, aRand, aGen;
    varying vec3 vCol;
    varying float vAlpha, vAngle;
    void main() {
      vec3 p = position;
      float ph = uTime * 0.25 + aRand * 6.2831;
      // subtle breathing
      p.z += sin(ph) * 0.06;
      p.x += sin(ph * 0.7 + 1.5) * 0.025;
      p.y += cos(ph * 0.6) * 0.025;

      // generation-based reveal
      float thresh = uReveal * 13.0;
      float fade = smoothstep(aGen - 0.3, aGen + 0.8, thresh);

      vCol = aColor;
      vAlpha = fade * (0.45 + 0.25 * sin(ph * 0.35));
      vAngle = aRand * 6.2831;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = max(1.0, aSize * uPixel * (38.0 / -mv.z) * fade);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha, vAngle;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float c = cos(vAngle), s = sin(vAngle);
      vec2 r = vec2(uv.x*c - uv.y*s, uv.x*s + uv.y*c);
      // leaf: tapered ellipse
      float lx = r.x * 2.0;
      float ly = r.y * 3.2 + r.y * r.y * 1.5; // taper
      float d = lx*lx + ly*ly;
      if (d > 0.25) discard;
      float a = exp(-d * 14.0) * vAlpha;
      // midrib vein
      float vein = exp(-abs(r.x) * 35.0) * 0.25;
      vec3 fc = vCol + vein * vec3(0.12, 0.10, 0.06);
      gl_FragColor = vec4(fc * a, a);
    }
  `
});

const pts = new THREE.Points(geom, mat);
scene.add(pts);

/* ── Atmosphere: warm parchment-dark gradient + grain ── */
const bgMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  depthWrite: false, depthTest: false,
  vertexShader: `varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=vec4(position.xy,0.999,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec3 center = vec3(0.065, 0.052, 0.040);
      vec3 edge   = vec3(0.035, 0.028, 0.022);
      float d = length(vUv - 0.5);
      vec3 c = mix(center, edge, smoothstep(0.0, 0.72, d));
      // warm light from upper-left
      float light = max(0.0, 1.0 - length(vUv - vec2(0.2, 0.8)) * 1.3);
      c += vec3(0.025, 0.018, 0.010) * light;
      // film grain
      float g = fract(sin(dot(vUv*900.0 + uTime*2.7, vec2(12.9898,78.233)))*43758.5453);
      c += (g - 0.5) * 0.022;
      gl_FragColor = vec4(c, 1.0);
    }
  `
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2,2), bgMat);
bg.frustumCulled = false; bg.renderOrder = -1;
scene.add(bg);

/* ── Resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── Growth loop ── */
let lastGrow = 0, dirty = false, lastRebuild = 0;
const t0 = performance.now();

function loop() {
  const now = performance.now();
  const t = (now - t0) / 1000;

  mat.uniforms.uTime.value = t;
  mat.uniforms.uReveal.value = Math.min(1.0, t / 10.0);
  bgMat.uniforms.uTime.value = t;

  // Continue growing substrate
  if (pCount < MAX_P * 0.92 && now - lastGrow > 120) {
    const prev = segments.length;
    runBatch(300);
    if (segments.length > prev) dirty = true;
    lastGrow = now;
  }

  // Rebuild particle buffers periodically
  if (dirty && now - lastRebuild > 400) {
    buildParticles();
    geom.attributes.position.needsUpdate = true;
    geom.attributes.aColor.needsUpdate = true;
    geom.attributes.aSize.needsUpdate = true;
    geom.attributes.aRand.needsUpdate = true;
    geom.attributes.aGen.needsUpdate = true;
    geom.setDrawRange(0, pCount);
    dirty = false;
    lastRebuild = now;
  }

  // Slow camera drift — breathing, not orbiting
  const cx = Math.sin(t * 0.035) * 2.0;
  const cy = Math.cos(t * 0.028) * 1.2 + 0.5;
  const cz = 50 + Math.sin(t * 0.018) * 3;
  camera.position.set(cx, cy, cz);
  camera.lookAt(0, 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
