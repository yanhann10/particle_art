<head>

<!-- MOTION: drift, intensity: calm -->
<title>zva · lidar orchard · scan artifacts</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#060608; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }

<body>
<div class="id">zva</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ══════════════════════════════════════════════════════════════════
   Quayola — Remains / Jardins d'Été mutation
   A procedural tree skeleton converted to a LiDAR-style point cloud.
   Scan errors are the aesthetic: Gaussian displacement grows with
   depth-from-scanner, occlusion gaps erase random clusters, foliage
   zones become soft halos of scattered dots. Near-monochrome
   pale gray on near-black. Slow drift orbit.
   ══════════════════════════════════════════════════════════════════ */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 300);
camera.position.set(18, 10, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060608, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 6, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

// ─────────── seeded PRNG for deterministic tree
let _seed = 73491;
function srand(s){ _seed = s; }
function rand(){ _seed = (_seed * 16807 + 0) % 2147483647; return (_seed & 0x7fffffff) / 0x7fffffff; }
function randGauss(){ return Math.sqrt(-2*Math.log(rand()+1e-9)) * Math.cos(6.2832*rand()); }

// ─────────── fractal tree generation
// Each branch: {base: Vec3, end: Vec3, radius: number, depth: number, isFoliage: bool}
const branches = [];
const MAX_DEPTH = 7;

function growTree(base, dir, radius, depth, lengthScale){
  if (depth > MAX_DEPTH) return;
  const len = (2.8 + rand() * 1.4) * lengthScale;
  const end = new THREE.Vector3(
    base.x + dir.x * len,
    base.y + dir.y * len,
    base.z + dir.z * len
  );
  const isFoliage = depth >= 5;
  branches.push({ base: base.clone(), end: end.clone(), radius, depth, isFoliage });

  if (depth >= MAX_DEPTH) return;

  // branching: 2-3 children
  const nChildren = depth < 3 ? 2 + (rand() > 0.6 ? 1 : 0) : 2 + (rand() > 0.4 ? 1 : 0);
  for (let c = 0; c < nChildren; c++){
    const spreadAngle = 0.3 + rand() * 0.45;
    // random rotation axis perpendicular to dir
    const perp = new THREE.Vector3(rand()-0.5, rand()-0.5, rand()-0.5);
    perp.cross(dir).normalize();
    if (perp.lengthSq() < 0.001) perp.set(1, 0, 0);
    const childDir = dir.clone().applyAxisAngle(perp, spreadAngle);
    // slight droop for realism
    childDir.y -= 0.05 * depth;
    childDir.normalize();
    const childRadius = radius * (0.55 + rand() * 0.18);
    growTree(end, childDir, childRadius, depth + 1, lengthScale * (0.72 + rand() * 0.12));
  }
}

srand(42917);
// main trunk
growTree(
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(0.02, 1, 0.01).normalize(),
  0.45, 0, 1.0
);
// second smaller tree offset
srand(88103);
growTree(
  new THREE.Vector3(-5, 0, 3),
  new THREE.Vector3(-0.05, 1, 0.03).normalize(),
  0.35, 0, 0.85
);
// third distant tree
srand(19457);
growTree(
  new THREE.Vector3(7, 0, -4),
  new THREE.Vector3(0.03, 1, -0.02).normalize(),
  0.30, 0, 0.75
);

// ─────────── sample point cloud from branches
// LiDAR simulation: points on cylinder surfaces + foliage halos
// Noise increases with distance from a virtual scanner position
const SCANNER_POS = new THREE.Vector3(20, 5, 20);
const points = [];
const alphas = [];
const sizes = [];

// palette: near-monochrome with subtle warmth variation
// trunk: slightly warm gray, foliage: slightly cool gray, some pale green hints
const colors = [];

for (const br of branches){
  const seg = new THREE.Vector3().subVectors(br.end, br.base);
  const segLen = seg.length();
  if (segLen < 0.01) continue;

  // points per branch depends on depth (foliage gets more scattered points)
  const density = br.isFoliage ? 28 + rand() * 20 : 14 + rand() * 10;
  const nPts = Math.floor(density * segLen / 2.0);

  // occlusion gap: randomly skip ~18% of branches entirely
  if (rand() < 0.18) continue;

  // secondary occlusion: random rectangular void zones
  const hasVoid = rand() < 0.3;
  const voidT0 = rand() * 0.6;
  const voidT1 = voidT0 + 0.15 + rand() * 0.25;

  for (let i = 0; i < nPts; i++){
    const t = rand();

    // skip points in void zone
    if (hasVoid && t > voidT0 && t < voidT1) continue;

    const posOnAxis = br.base.clone().addScaledVector(seg, t);
    const r = br.radius * (1.0 - t * 0.3); // taper

    // random direction perpendicular to segment
    const tangent = seg.clone().normalize();
    const randVec = new THREE.Vector3(rand()-0.5, rand()-0.5, rand()-0.5);
    const perp = randVec.cross(tangent).normalize();
    if (perp.lengthSq() < 0.001) continue;

    let pt;
    if (br.isFoliage){
      // foliage: scattered halo, not tight cylinder
      const spread = r * 2.5 + rand() * 1.8;
      pt = posOnAxis.clone().addScaledVector(perp, (rand()-0.5) * spread * 2);
      pt.y += (rand()-0.5) * spread;
    } else {
      // trunk/branch: points on cylinder surface
      const angle = rand() * Math.PI * 2;
      const perpB = new THREE.Vector3().crossVectors(tangent, perp).normalize();
      pt = posOnAxis.clone()
        .addScaledVector(perp, Math.cos(angle) * r)
        .addScaledVector(perpB, Math.sin(angle) * r);
    }

    // LiDAR noise: grows with distance from scanner
    const distFromScanner = pt.distanceTo(SCANNER_POS);
    const noiseScale = 0.008 + 0.012 * (distFromScanner / 30.0);
    pt.x += randGauss() * noiseScale * distFromScanner;
    pt.y += randGauss() * noiseScale * distFromScanner * 0.7;
    pt.z += randGauss() * noiseScale * distFromScanner;

    points.push(pt.x, pt.y, pt.z);

    // color: near-monochrome
    let gray;
    if (br.isFoliage){
      // foliage: slightly cooler, brighter
      gray = 0.55 + rand() * 0.25;
      const g = gray + rand() * 0.04; // faint green tint
      colors.push(gray * 0.95, g, gray * 0.93);
    } else {
      // wood: slightly warmer
      gray = 0.40 + rand() * 0.20;
      colors.push(gray * 1.02, gray, gray * 0.95);
    }

    // alpha: slightly transparent for distant points
    const aFalloff = Math.max(0.3, 1.0 - distFromScanner / 50.0);
    alphas.push(aFalloff * (0.6 + rand() * 0.4));

    // size: attenuate with distance, foliage slightly larger
    const baseSize = br.isFoliage ? 2.2 : 1.6;
    sizes.push(baseSize * (0.7 + rand() * 0.6));
  }
}

// ─────────── ground scatter: sparse ground-return points
for (let i = 0; i < 3000; i++){
  const x = (rand() - 0.5) * 30;
  const z = (rand() - 0.5) * 30;
  const y = (rand() - 0.5) * 0.15;
  // skip if under a tree trunk area (some occlusion shadow)
  const nearTrunk = Math.hypot(x, z) < 1.5 ||
                    Math.hypot(x + 5, z - 3) < 1.2 ||
                    Math.hypot(x - 7, z + 4) < 1.0;
  if (nearTrunk && rand() < 0.7) continue;

  const dist = new THREE.Vector3(x, y, z).distanceTo(SCANNER_POS);
  const ns = 0.005 * dist;
  points.push(x + randGauss()*ns, y + randGauss()*ns*0.3, z + randGauss()*ns);
  const g = 0.22 + rand() * 0.12;
  colors.push(g, g * 1.01, g * 0.98);
  alphas.push(0.25 + rand() * 0.2);
  sizes.push(1.0 + rand() * 0.5);
}

// ─────────── build geometry
const N = points.length / 3;
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.setAttribute('alpha', new THREE.Float32BufferAttribute(alphas, 1));
geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

// ─────────── custom shader for per-point alpha and size
const pointMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float alpha;
    attribute float size;
    attribute vec3 color;
    varying float vAlpha;
    varying vec3 vColor;
    void main(){
      vAlpha = alpha;
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (280.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      // soft circular falloff
      float a = vAlpha * smoothstep(1.0, 0.3, d);
      gl_FragColor = vec4(vColor, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const cloud = new THREE.Points(geo, pointMat);
scene.add(cloud);

// ─────────── subtle film grain overlay via post-processing noise
// (done as a screen-space plane for photochemical imperfection)
const grainMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float n = hash(vUv * 800.0 + uTime * 3.7);
      // very subtle grain
      gl_FragColor = vec4(vec3(n), 0.035);
    }
  `,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthTest: false,
  depthWrite: false,
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
const grainScene = new THREE.Scene();
const grainCam = new THREE.Camera();
grainScene.add(grainQuad);

// ─────────── resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─────────── centroid tracking
let cx = 0, cy = 6, cz = 0;
{
  let sx=0, sy=0, sz=0;
  for (let i = 0; i < N; i++){
    sx += points[i*3]; sy += points[i*3+1]; sz += points[i*3+2];
  }
  cx = sx/N; cy = sy/N; cz = sz/N;
}
controls.target.set(cx, Math.max(cy, 4), cz);

// ─────────── animation loop
const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) * 0.001;

  // gentle vertical drift of the point cloud — scanner vibration artifact
  const posArr = geo.attributes.position.array;
  // we don't modify points each frame for perf; the drift is in the camera

  controls.update();

  // subtle camera height breathing
  camera.position.y += Math.sin(t * 0.15) * 0.002;

  renderer.render(scene, camera);

  // grain overlay
  grainMat.uniforms.uTime.value = t;
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
