<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5i2 · glitch attractor · datamosh</title>
<!-- MOTION: stutter, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#080508; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; image-rendering: pixelated; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; 
           text-shadow: 0 0 8px rgba(255,0,100,0.3); }
  .stage { position:fixed; right:14px; bottom:12px; opacity:0.6; font-size: 11px; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="id">5i2 · glitch attractor</div>
<div class="hint">embracing breakdown · error as information</div>
<div class="stage" id="stage">lorenz · frame 0</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 256, H = 256;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080508, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(){
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    init[i*4]   = (Math.random() - 0.5) * 8;
    init[i*4+1] = (Math.random() - 0.5) * 8;
    init[i*4+2] = 27 + (Math.random() - 0.5) * 8;
    init[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:   { value: 0.0 },
  uGlitchBlock: { value: new THREE.Vector4(0,0,0,0) }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform vec4 uGlitchBlock;
    varying vec2 vUv;

    vec3 lorenz(vec3 p){
      return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y - (8.0/3.0)*p.z);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 dp = lorenz(p);
      p += dp * uDt * 0.15;
      age = mod(age + uDt * 0.06, 1.0);

      // GLITCH: 8x8 block quantization in random region
      vec2 blockOrigin = uGlitchBlock.xy;
      vec2 blockSize = vec2(uGlitchBlock.z, uGlitchBlock.w);
      if (vUv.x >= blockOrigin.x && vUv.x < blockOrigin.x + blockSize.x &&
          vUv.y >= blockOrigin.y && vUv.y < blockOrigin.y + blockSize.y){
        vec2 local = (vUv - blockOrigin) / blockSize;
        vec2 block = floor(local * 8.0) / 8.0;
        vec2 sampleUV = blockOrigin + block * blockSize;
        vec4 bSample = texture2D(prev, sampleUV);
        p = bSample.xyz;
      }

      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.8, 4.5);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    uChromaticShift: { value: 0.0 },
    uPosterize: { value: 6.0 },
    uZalgoStretch: { value: new THREE.Vector2(0,0) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uChromaticShift;
    uniform vec2 uZalgoStretch;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAge;
    varying vec2 vUvIdx;
    void main(){
      vUvIdx = uvIdx;
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;
      vAge = age;

      vec3 disp = p / 25.0;

      // zalgo vertical stretch in random regions
      if (abs(disp.x - uZalgoStretch.x) < 0.15 && abs(disp.z - uZalgoStretch.y) < 0.15){
        disp.y += sin(age * 31.4) * 0.3;
      }

      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      gl_PointSize = 2.5 * (3.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D state;
    uniform float uChromaticShift;
    uniform float uPosterize;
    varying vec3 vCol;
    varying float vAge;
    varying vec2 vUvIdx;

    vec3 quantize(vec3 c, float levels){
      return floor(c * levels) / levels;
    }

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;

      // RGB channel separation
      vec4 sR = texture2D(state, vUvIdx + vec2(uChromaticShift, 0.0));
      vec4 sG = texture2D(state, vUvIdx);
      vec4 sB = texture2D(state, vUvIdx - vec2(uChromaticShift, 0.0));

      float ageR = sR.w;
      float ageG = sG.w;
      float ageB = sB.w;

      // posterized palette
      vec3 colR = vec3(0.95, 0.15, 0.35);
      vec3 colG = vec3(0.20, 0.85, 0.40);
      vec3 colB = vec3(0.15, 0.25, 0.95);
      vec3 colW = vec3(0.98, 0.98, 0.92);

      float kr = mod(ageR, 1.0);
      float kg = mod(ageG, 1.0);
      float kb = mod(ageB, 1.0);

      vec3 cR = mix(colR, colW, step(0.5, kr));
      vec3 cG = mix(colG, colW, step(0.5, kg));
      vec3 cB = mix(colB, colW, step(0.5, kb));

      vec3 col = vec3(cR.r, cG.g, cB.b);
      col = quantize(col, uPosterize);

      float a = exp(-r * 12.0);
      gl_FragColor = vec4(col * a, a * 0.85);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
let frame = 0;
let skipFrames = 0;
let glitchBlockTimer = 0;
const stageEl = document.getElementById('stage');

function loop(){
  const now = performance.now();
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  frame++;

  // frame-skip jitter: occasionally skip or double-render
  if (Math.random() < 0.04){
    skipFrames = Math.floor(Math.random() * 3) + 1;
  }
  if (skipFrames > 0){
    skipFrames--;
    requestAnimationFrame(loop);
    return;
  }
  if (Math.random() < 0.03){
    dt *= (Math.random() * 2.5 + 0.5);
  }

  simUniforms.uDt.value = dt;

  // glitch block: spawn new 8x8 region every 2.5s
  glitchBlockTimer -= dt;
  if (glitchBlockTimer <= 0){
    glitchBlockTimer = 2.5 + Math.random() * 1.5;
    simUniforms.uGlitchBlock.value.set(
      Math.random() * 0.7,
      Math.random() * 0.7,
      0.05 + Math.random() * 0.25,
      0.05 + Math.random() * 0.25
    );
  }

  // chromatic aberration: pulsing
  pointsMat.uniforms.uChromaticShift.value = 0.008 + 0.012 * Math.sin(now * 0.002);

  // posterize flicker
  pointsMat.uniforms.uPosterize.value = Math.random() < 0.15 ? 4.0 : 6.0;

  // zalgo stretch: random region every 4s
  if (frame % 240 === 0){
    pointsMat.uniforms.uZalgoStretch.value.set(
      (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * 2
    );
  }

  // sim 3 substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // stutter camera: quantized rotation
  const ang = Math.floor(now * 0.0002 * 8) / 8;
  camera.position.x = Math.sin(ang) * 4.5;
  camera.position.z = Math.cos(ang) * 4.5;
  camera.position.y = Math.sin(ang * 0.6) * 0.9 + 0.8;
  camera.lookAt(0, 0, 0);

  stageEl.textContent = `lorenz · frame ${frame}`;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
