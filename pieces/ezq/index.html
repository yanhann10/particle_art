<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ezq · Tinguely chaos machine (kinetic)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a1a; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#999; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#999; }
</style>
</head>
<body>
<div class="id">ezq</div>
<div class="hint">click to jam the machine</div>
<div class="src">Tinguely · junk kinetics · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 0, 45);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1a1a, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points, mat;

// Machine parts: spinning wheels, cams, cranks at different speeds
const parts = [];
const partCount = 12;

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uJam: { value: 0 },
};

mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uJam;
    
    attribute float partId;
    attribute float localAngle;
    attribute float radius;
    attribute float axisX;
    attribute float axisY;
    attribute float axisZ;
    attribute float speed;
    attribute float phase;
    attribute float wobble;
    
    varying float vBrightness;
    
    void main(){
      // Each part rotates around its own axis at its own speed
      float t = uTime * speed + phase;
      
      // Add jam stuttering
      float jam = sin(uTime * 15.0 + partId * 3.14) * uJam;
      t += jam * 0.5;
      
      // Rotation axis (normalized)
      vec3 axis = normalize(vec3(axisX, axisY, axisZ));
      
      // Initial position on circle
      float a = localAngle;
      vec3 circlePos = vec3(cos(a) * radius, sin(a) * radius, 0.0);
      
      // Rotate around axis using Rodrigues formula
      float ct = cos(t);
      float st = sin(t);
      vec3 rotated = circlePos * ct + 
                     cross(axis, circlePos) * st + 
                     axis * dot(axis, circlePos) * (1.0 - ct);
      
      // Add wobble (mechanical imperfection)
      float w = sin(t * 3.0 + phase) * wobble;
      rotated += axis * w;
      
      // Part center offset
      float spreadX = (partId - float(${partCount}) * 0.5) * 3.5;
      float spreadY = sin(partId * 0.7) * 2.0;
      float spreadZ = cos(partId * 0.5) * 3.0;
      vec3 center = vec3(spreadX, spreadY, spreadZ);
      
      vec3 p = center + rotated;
      
      // Brightness varies with speed and position
      vBrightness = 0.3 + 0.7 * abs(sin(t + phase));
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = length(mv.xyz);
      gl_PointSize = uPixel * (80.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vBrightness;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Rusty metal colors - orange, rust red, dirty yellow
      vec3 rust = mix(
        vec3(0.9, 0.4, 0.1),
        vec3(0.95, 0.7, 0.2),
        vBrightness
      );
      
      float alpha = (1.0 - r * 4.0) * 0.8;
      
      gl_FragColor = vec4(rust * vBrightness, alpha);
    }
  `
});

function buildMachine(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  
  parts.length = 0;
  
  for (let i = 0; i < partCount; i++){
    const particlesPerPart = Math.floor(N / partCount);
    const r = 1.5 + rng() * 3.0; // wheel radius
    const spd = (0.3 + rng() * 2.0) * (rng() > 0.5 ? 1 : -1); // speed with direction
    const ph = rng() * Math.PI * 2;
    const wob = rng() * 0.3; // wobble amount
    
    // Random rotation axis
    const axX = rng() * 2 - 1;
    const axY = rng() * 2 - 1;
    const axZ = rng() * 2 - 1;
    const axLen = Math.sqrt(axX*axX + axY*axY + axZ*axZ);
    
    parts.push({
      count: particlesPerPart,
      radius: r,
      speed: spd,
      phase: ph,
      wobble: wob,
      axisX: axX / axLen,
      axisY: axY / axLen,
      axisZ: axZ / axLen,
    });
  }
  
  const positions = new Float32Array(N * 3);
  const partIds = new Float32Array(N);
  const localAngles = new Float32Array(N);
  const radii = new Float32Array(N);
  const axisXs = new Float32Array(N);
  const axisYs = new Float32Array(N);
  const axisZs = new Float32Array(N);
  const speeds = new Float32Array(N);
  const phases = new Float32Array(N);
  const wobbles = new Float32Array(N);
  
  let idx = 0;
  for (let i = 0; i < partCount && idx < N; i++){
    const part = parts[i];
    for (let j = 0; j < part.count && idx < N; j++){
      const a = (j / part.count) * Math.PI * 2;
      
      positions[idx * 3] = 0;
      positions[idx * 3 + 1] = 0;
      positions[idx * 3 + 2] = 0;
      
      partIds[idx] = i;
      localAngles[idx] = a;
      radii[idx] = part.radius;
      axisXs[idx] = part.axisX;
      axisYs[idx] = part.axisY;
      axisZs[idx] = part.axisZ;
      speeds[idx] = part.speed;
      phases[idx] = part.phase;
      wobbles[idx] = part.wobble;
      
      idx++;
    }
  }
  
  return { positions, partIds, localAngles, radii, axisXs, axisYs, axisZs, speeds, phases, wobbles };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  const data = buildMachine(seed);
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
    geom.setAttribute('partId', new THREE.BufferAttribute(data.partIds, 1));
    geom.setAttribute('localAngle', new THREE.BufferAttribute(data.localAngles, 1));
    geom.setAttribute('radius', new THREE.BufferAttribute(data.radii, 1));
    geom.setAttribute('axisX', new THREE.BufferAttribute(data.axisXs, 1));
    geom.setAttribute('axisY', new THREE.BufferAttribute(data.axisYs, 1));
    geom.setAttribute('axisZ', new THREE.BufferAttribute(data.axisZs, 1));
    geom.setAttribute('speed', new THREE.BufferAttribute(data.speeds, 1));
    geom.setAttribute('phase', new THREE.BufferAttribute(data.phases, 1));
    geom.setAttribute('wobble', new THREE.BufferAttribute(data.wobbles, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(data.positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.partId.array.set(data.partIds);
    geom.attributes.partId.needsUpdate = true;
    geom.attributes.localAngle.array.set(data.localAngles);
    geom.attributes.localAngle.needsUpdate = true;
    geom.attributes.radius.array.set(data.radii);
    geom.attributes.radius.needsUpdate = true;
    geom.attributes.axisX.array.set(data.axisXs);
    geom.attributes.axisX.needsUpdate = true;
    geom.attributes.axisY.array.set(data.axisYs);
    geom.attributes.axisY.needsUpdate = true;
    geom.attributes.axisZ.array.set(data.axisZs);
    geom.attributes.axisZ.needsUpdate = true;
    geom.attributes.speed.array.set(data.speeds);
    geom.attributes.speed.needsUpdate = true;
    geom.attributes.phase.array.set(data.phases);
    geom.attributes.phase.needsUpdate = true;
    geom.attributes.wobble.array.set(data.wobbles);
    geom.attributes.wobble.needsUpdate = true;
  }
  
  // Trigger a jam
  uniforms.uJam.value = 1.0;
  setTimeout(() => { uniforms.uJam.value = 0; }, 800);
}

regenerate();

addEventListener('click', regenerate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

// Camera orbit
let angle = 0;
const start = performance.now();

function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  uniforms.uTime.value = t;
  
  // Slow orbit
  angle += 0.003;
  camera.position.x = Math.cos(angle) * 45;
  camera.position.z = Math.sin(angle) * 45;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
