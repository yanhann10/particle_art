<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gvr · seismic field · USGS live earthquakes</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .src   { position:fixed; right:14px; bottom:12px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .data  { position:fixed; left:14px; top:14px; opacity:0.5; font-size:10px; letter-spacing:0.04em; max-width:320px; line-height:1.5; }
</style>
</head>
<body>
<div class="id">gvr</div>
<div class="src">USGS earthquake feed · 30s refresh</div>
<div class="data" id="dataInfo">loading seismic data...</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 256, H = 256, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping, depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// Earthquake data: up to 8 attractors derived from recent quakes
const MAX_QUAKES = 8;
let quakeData = new Float32Array(MAX_QUAKES * 4); // xyz + magnitude
let quakeCount = 0;
let totalEnergy = 0;
let largestMag = 0;
let quakeLabel = '';

// Seed fallback data so piece renders immediately
function seedFallback(){
  const fallback = [
    { lat: 35.6, lon: 139.7, depth: 30, mag: 4.2 },
    { lat: -33.4, lon: -70.6, depth: 80, mag: 5.1 },
    { lat: 37.7, lon: -122.4, depth: 10, mag: 2.8 },
    { lat: 64.1, lon: -21.9, depth: 5, mag: 3.5 },
    { lat: -6.2, lon: 106.8, depth: 120, mag: 4.8 },
    { lat: 51.5, lon: -0.1, depth: 15, mag: 1.9 },
  ];
  setQuakePositions(fallback);
  quakeLabel = '6 seed quakes (awaiting live data)';
}

function latLonToXYZ(lat, lon, depth){
  const x = (lon / 180.0) * 3.0;
  const z = (lat / 90.0) * 3.0;
  const y = -(depth / 300.0) * 2.0;
  return [x, y, z];
}

function setQuakePositions(quakes){
  quakeCount = Math.min(quakes.length, MAX_QUAKES);
  totalEnergy = 0; largestMag = 0;
  for (let i = 0; i < MAX_QUAKES * 4; i++) quakeData[i] = 0;
  for (let i = 0; i < quakeCount; i++){
    const q = quakes[i];
    const [x, y, z] = latLonToXYZ(q.lat, q.lon, q.depth);
    quakeData[i*4]   = x;
    quakeData[i*4+1] = y;
    quakeData[i*4+2] = z;
    quakeData[i*4+3] = q.mag;
    totalEnergy += Math.pow(10, 1.5 * q.mag);
    if (q.mag > largestMag) largestMag = q.mag;
  }
}

async function fetchQuakes(){
  try {
    const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
    const json = await res.json();
    const features = json.features.slice(0, 32);
    // sort by magnitude descending, take top MAX_QUAKES
    features.sort((a,b) => b.properties.mag - a.properties.mag);
    const top = features.slice(0, MAX_QUAKES);
    const quakes = top.map(f => ({
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0],
      depth: Math.max(1, f.geometry.coordinates[2]),
      mag: f.properties.mag
    }));
    setQuakePositions(quakes);
    quakeLabel = `${json.metadata.count} M2.5+ quakes today · showing top ${quakeCount}`;
    document.getElementById('dataInfo').textContent = quakeLabel + ` · largest M${largestMag.toFixed(1)}`;
  } catch(e){
    document.getElementById('dataInfo').textContent = 'feed unavailable · using seed data';
  }
}

seedFallback();
fetchQuakes();
setInterval(fetchQuakes, 30000);

// init texture: scatter particles around quake positions
function makeInitTexture(){
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    const qi = Math.floor(Math.random() * Math.max(1, quakeCount));
    const cx = quakeData[qi*4], cy = quakeData[qi*4+1], cz = quakeData[qi*4+2];
    const spread = 1.2;
    init[i*4]   = cx + (Math.random()-0.5) * spread;
    init[i*4+1] = cy + (Math.random()-0.5) * spread;
    init[i*4+2] = cz + (Math.random()-0.5) * spread;
    init[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

function reinit(){
  blitMat.uniforms.tex.value = makeInitTexture();
  renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(null);
}
reinit();

// quake uniform texture: 1x8 RGBA float (pos.xyz + mag)
const quakeTex = new THREE.DataTexture(quakeData, MAX_QUAKES, 1, THREE.RGBAFormat, THREE.FloatType);
quakeTex.needsUpdate = true;

const simUniforms = {
  prev: { value: rtA.texture },
  uDt: { value: 0.0 },
  uQuakes: { value: quakeTex },
  uQuakeCount: { value: quakeCount },
  uTotalEnergy: { value: 1.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform sampler2D uQuakes;
    uniform float uDt;
    uniform int uQuakeCount;
    uniform float uTotalEnergy;
    varying vec2 vUv;

    vec3 hash3(vec2 p){
      vec3 q = vec3(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)), dot(p,vec2(419.2,371.9)));
      return fract(sin(q)*43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 force = vec3(0.0);
      // attract toward each quake center, strength proportional to magnitude
      for (int i = 0; i < 8; i++){
        if (i >= uQuakeCount) break;
        vec4 q = texture2D(uQuakes, vec2((float(i)+0.5)/8.0, 0.5));
        vec3 qpos = q.xyz;
        float mag = q.w;
        vec3 dir = qpos - p;
        float dist = length(dir) + 0.01;
        // gravitational pull scaled by magnitude
        float strength = mag * 0.12 / (dist * dist + 0.3);
        force += normalize(dir) * strength;
      }

      // add orbital component to prevent collapse
      vec3 orbital = vec3(-force.z, force.y * 0.3, force.x) * 0.4;
      force += orbital;

      // damping
      force -= p * 0.008;

      // subtle noise perturbation
      vec3 n = hash3(vUv + vec2(age)) - 0.5;
      force += n * 0.15;

      p += force * uDt * 2.0;
      age = mod(age + uDt * 0.04, 1.0);

      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 60);
camera.position.set(0, 2, 8);

// ground fog plane
const fogGeo = new THREE.PlaneGeometry(20, 20);
const fogMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv;
    void main(){
      float d = length(vUv - 0.5);
      float a = 0.04 * (1.0 - smoothstep(0.0, 0.5, d)) * (0.8 + 0.2*sin(uTime*0.3));
      gl_FragColor = vec4(0.15, 0.18, 0.25, a);
    }`
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.rotation.x = -Math.PI/2;
fogPlane.position.y = -2.5;
scene.add(fogPlane);

// amber directional light effect via a second fog plane
const warmGeo = new THREE.PlaneGeometry(12, 12);
const warmMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv;
    void main(){
      float d = length(vUv - vec2(0.3, 0.5));
      float a = 0.025 * (1.0 - smoothstep(0.0, 0.4, d)) * (0.9 + 0.1*sin(uTime*0.2));
      gl_FragColor = vec4(0.9, 0.6, 0.2, a);
    }`
});
const warmPlane = new THREE.Mesh(warmGeo, warmMat);
warmPlane.rotation.x = -Math.PI/2;
warmPlane.position.y = -2.0;
scene.add(warmPlane);

// particle points
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx', new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uQuakes: { value: quakeTex },
    uQuakeCount: { value: quakeCount },
    uTime: { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform sampler2D uQuakes;
    uniform int uQuakeCount;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;

      // find nearest quake for coloring
      float nearMag = 2.0;
      float minD = 100.0;
      for (int i = 0; i < 8; i++){
        if (i >= uQuakeCount) break;
        vec4 q = texture2D(uQuakes, vec2((float(i)+0.5)/8.0, 0.5));
        float d = length(p - q.xyz);
        if (d < minD){ minD = d; nearMag = q.w; }
      }

      // color: low mag = cool teal, high mag = warm amber/red
      float t = clamp((nearMag - 2.0) / 5.0, 0.0, 1.0);
      vec3 cool = vec3(0.15, 0.45, 0.65);
      vec3 mid  = vec3(0.7, 0.55, 0.25);
      vec3 hot  = vec3(0.95, 0.25, 0.15);
      vec3 col = mix(cool, mid, smoothstep(0.0, 0.5, t));
      col = mix(col, hot, smoothstep(0.5, 1.0, t));

      // age shimmer
      col += 0.08 * sin(age * 6.28 + uTime);

      vCol = col;
      vAlpha = 0.7 + 0.3 * (1.0 - smoothstep(0.0, 2.5, minD));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      gl_PointSize = (1.8 + 1.2 * t) * uPixel * (4.0 / max(depth, 0.5));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * vAlpha;
      // depth fog
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// quake marker spheres (small glowing dots at each epicenter)
const markerGeo = new THREE.SphereGeometry(0.06, 8, 8);
const markers = [];
for (let i = 0; i < MAX_QUAKES; i++){
  const mat = new THREE.MeshBasicMaterial({ color: 0xff6633, transparent: true, opacity: 0.0 });
  const m = new THREE.Mesh(markerGeo, mat);
  scene.add(m);
  markers.push(m);
}

function updateMarkers(){
  for (let i = 0; i < MAX_QUAKES; i++){
    if (i < quakeCount){
      markers[i].position.set(quakeData[i*4], quakeData[i*4+1], quakeData[i*4+2]);
      const mag = quakeData[i*4+3];
      const s = 0.5 + mag * 0.3;
      markers[i].scale.setScalar(s);
      markers[i].material.opacity = 0.3 + mag * 0.08;
      const t = clamp01((mag - 2) / 5);
      markers[i].material.color.setRGB(0.3 + t*0.65, 0.5 - t*0.3, 0.6 - t*0.5);
    } else {
      markers[i].material.opacity = 0.0;
    }
  }
}
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
let lastReinit = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  // update quake texture periodically
  quakeTex.image = { data: quakeData, width: MAX_QUAKES, height: 1 };
  quakeTex.needsUpdate = true;
  simUniforms.uQuakeCount.value = quakeCount;
  pointsMat.uniforms.uQuakeCount.value = quakeCount;

  // reinit particles when data changes significantly (every 30s with fetch)
  if (now - lastReinit > 32000){
    reinit();
    lastReinit = now;
  }

  updateMarkers();
  fogMat.uniforms.uTime.value = t;
  warmMat.uniforms.uTime.value = t;
  pointsMat.uniforms.uTime.value = t;
  simUniforms.uDt.value = dt;

  // sim substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);
  pointsMat.uniforms.state.value = rtA.texture;

  // camera orbits slowly, elevated view of the seismic field
  const ang = t * 0.12;
  camera.position.x = Math.sin(ang) * 7;
  camera.position.z = Math.cos(ang) * 7;
  camera.position.y = 2.5 + Math.sin(t * 0.08) * 0.8;
  camera.lookAt(0, -0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
