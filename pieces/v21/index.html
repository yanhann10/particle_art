<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v21 · helix branch kaleidoscope</title>
<!-- MOTION: PULSE, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden; }
  canvas { display:block; }
</style>
</head>
<body>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.z = 10.5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

/* Intense lighting */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1.7);
directionalLight.position.set(18, 18, 20);
scene.add(directionalLight);

const rimLight = new THREE.DirectionalLight(0x88bbff, 0.9);
rimLight.position.set(-16, -14, -16);
scene.add(rimLight);

/* Colors */
const COLORS = {
  copper: new THREE.Color(0xa86d3b),
  gold: new THREE.Color(0xdaa520),
  silver: new THREE.Color(0xffffff),
  teal: new THREE.Color(0x88d3d3),
};

/* Helper: create helix points */
function helixPoints(offset, coils, height, segments = 140) {
  const pts = [];
  for (let i = 0; i < segments; i++) {
    const t = i / (segments - 1);
    const ang = t * Math.PI * 2 * coils;
    const y = t * height - height / 2;
    pts.push(new THREE.Vector3(
      0.5 * Math.cos(ang) + offset,
      y,
      0.5 * Math.sin(ang)
    ));
  }
  return pts;
}

/* Kaleidoscope: 8 mirrors */
const kaleidoscope = new THREE.Group();
scene.add(kaleidoscope);

const MIRRORS = 8;
for (let m = 0; m < MIRRORS; m++) {
  const yaw = (m / MIRRORS) * Math.PI * 2;

  const pts1 = helixPoints(+0.35, 2.5, 3, 160);
  const pts2 = helixPoints(-0.35, 2.5, 3, 160);

  /* Solid mesh tubes */
  const curve1 = new THREE.CatmullRomCurve3(pts1);
  const curve2 = new THREE.CatmullRomCurve3(pts2);
  const tubeGeo1 = new THREE.TubeGeometry(curve1, 80, 0.07, 5, false);
  const tubeGeo2 = new THREE.TubeGeometry(curve2, 80, 0.07, 5, false);

  const mat1 = new THREE.MeshPhongMaterial({
    color: COLORS.copper,
    shininess: 90,
    emissive: 0x000000
  });
  const mat2 = new THREE.MeshPhongMaterial({
    color: COLORS.gold,
    shininess: 90,
    emissive: 0x000000
  });

  const mesh1 = new THREE.Mesh(tubeGeo1, mat1);
  const mesh2 = new THREE.Mesh(tubeGeo2, mat2);

  /* Sharp cubic nodes: larger and denser */
  const cubeSize = 0.055;
  const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
  const cubeMat1 = new THREE.MeshPhongMaterial({ color: COLORS.silver, shininess: 120 });
  const cubeMat2 = new THREE.MeshPhongMaterial({ color: COLORS.teal, shininess: 120 });

  // Every 4th point for denser cubes
  for (let i = 0; i < pts1.length; i += 4) {
    const cube = new THREE.Mesh(cubeGeo, cubeMat1);
    cube.position.copy(pts1[i]);
    mesh1.add(cube);
  }

  for (let i = 0; i < pts2.length; i += 4) {
    const cube = new THREE.Mesh(cubeGeo, cubeMat2);
    cube.position.copy(pts2[i]);
    mesh2.add(cube);
  }

  mesh1.rotation.y = yaw;
  mesh1.rotation.x = Math.sin(yaw) * 0.1;
  mesh2.rotation.y = yaw;
  mesh2.rotation.x = Math.sin(yaw) * 0.1;

  kaleidoscope.add(mesh1, mesh2);
}

/* Atmospheric particles */
const particleGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(60000 * 3);
const colors = new Float32Array(60000 * 3);

for (let i = 0; i < 60000; i++) {
  const theta = Math.random() * Math.PI * 2;
  const rad = 0.08 + Math.random() * 4.2;
  const y = (Math.random() - 0.5) * 3.8;

  positions[i * 3] = rad * Math.cos(theta);
  positions[i * 3 + 1] = y;
  positions[i * 3 + 2] = rad * Math.sin(theta);

  const col = Math.random() > 0.5 ? COLORS.teal : COLORS.silver;
  colors[i * 3] = col.r * 0.85;
  colors[i * 3 + 1] = col.g * 0.85;
  colors[i * 3 + 2] = col.b * 0.85;
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const particleMaterial = new THREE.PointsMaterial({
  size: 0.026,
  vertexColors: true,
  transparent: true,
  opacity: 0.42,
  sizeAttenuation: true
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

/* Animation */
let startTime = Date.now();

function animate() {
  requestAnimationFrame(animate);

  const elapsed = (Date.now() - startTime) / 1000;

  kaleidoscope.rotation.y = elapsed * 0.08;
  kaleidoscope.rotation.z = Math.sin(elapsed * 0.04) * 0.08;

  particleMaterial.opacity = 0.42 + Math.sin(elapsed * 0.5) * 0.2;

  renderer.render(scene, camera);
}

animate();

/* Window resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
