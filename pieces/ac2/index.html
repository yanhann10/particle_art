<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ac2 · curl-noise nebula</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05060a; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; color:#cdd2dc; opacity:0.55;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
        letter-spacing: 0.06em; pointer-events:none; }
</style>
</head>
<body>
<div class="id">ac2 · curl-noise nebula</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05060a, 1);
document.body.appendChild(renderer.domElement);

const N = 30000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r = Math.pow(Math.random(), 0.5) * 14;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2*Math.random()-1);
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) * 0.55;
  positions[i*3+2] = r * Math.cos(phi);
  seeds[i] = Math.random();
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vLife;
    varying vec3  vCol;

    // simplex-ish curl noise (cheap)
    vec3 hash3(vec3 p){
      p = vec3( dot(p, vec3(127.1, 311.7, 74.7)),
                dot(p, vec3(269.5, 183.3, 246.1)),
                dot(p, vec3(113.5, 271.9, 124.6)) );
      return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
    }
    float noise(vec3 p){
      vec3 i = floor(p), f = fract(p);
      vec3 u = f*f*(3.0-2.0*f);
      return mix( mix( mix( dot(hash3(i+vec3(0,0,0)), f-vec3(0,0,0)),
                            dot(hash3(i+vec3(1,0,0)), f-vec3(1,0,0)), u.x),
                       mix( dot(hash3(i+vec3(0,1,0)), f-vec3(0,1,0)),
                            dot(hash3(i+vec3(1,1,0)), f-vec3(1,1,0)), u.x), u.y),
                  mix( mix( dot(hash3(i+vec3(0,0,1)), f-vec3(0,0,1)),
                            dot(hash3(i+vec3(1,0,1)), f-vec3(1,0,1)), u.x),
                       mix( dot(hash3(i+vec3(0,1,1)), f-vec3(0,1,1)),
                            dot(hash3(i+vec3(1,1,1)), f-vec3(1,1,1)), u.x), u.y), u.z);
    }
    vec3 curl(vec3 p){
      const float e = 0.1;
      vec3 dx = vec3(e,0,0), dy = vec3(0,e,0), dz = vec3(0,0,e);
      float n1 = noise(p+dy)-noise(p-dy);
      float n2 = noise(p+dz)-noise(p-dz);
      float n3 = noise(p+dx)-noise(p-dx);
      float n4 = noise(p+dy*1.3)-noise(p-dy*1.3);
      return normalize(vec3(n1-n2, n2-n3, n3-n4));
    }

    void main(){
      vec3 p = position;
      float t = uTime * 0.08 + seed * 6.2831;
      vec3 flow = curl(p * 0.12 + vec3(0.0, t*0.5, 0.0));
      p += flow * (1.6 + 0.7*sin(t*0.3));
      vLife = 0.5 + 0.5*sin(t*0.7 + seed*3.14);
      // soft cosmic palette: violet -> teal -> warm
      vec3 a = vec3(0.42, 0.31, 0.69);
      vec3 b = vec3(0.18, 0.62, 0.71);
      vec3 c = vec3(0.95, 0.66, 0.42);
      vCol = mix(a, b, vLife);
      vCol = mix(vCol, c, smoothstep(0.78, 1.0, vLife) * 0.7);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.4 + 1.6 * vLife) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vLife;
    varying vec3  vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.55 + 0.45*vLife);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  points.rotation.y = t * 0.04;
  points.rotation.x = Math.sin(t * 0.07) * 0.18;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
