<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p43 · double-pendulum phase-space · bifurcation exploration</title>
<!-- MOTION: drift, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">p43</div>
<div class="hint">move pointer X to shift gravity · watch phase-space orbit bifurcate</div>
<div class="src">double-pendulum ODEs · poincaré section · lyapunov divergence</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// DOUBLE PENDULUM — two coupled nonlinear ODEs showing phase-space structure:
// θ1, θ2 = angles from vertical
// ω1, ω2 = angular velocities
// 4D phase space (θ1, ω1, θ2, ω2) projected to 3D for visualization
// Pointer X controls effective gravity (bifurcation parameter)
// As g shifts: fixed point → periodic → period-doubling → chaos
// We render BOTH the trajectory trace (thin line) and the attractor structure
// (accumulated point cloud). The form IS the phase-space geometry.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.018);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 12, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xe8dcc0, 0.8);
lightKey.position.set(10, 18, 8);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x1a1522, 0.6));
const lightFill = new THREE.DirectionalLight(0x4a5f88, 0.35);
lightFill.position.set(-8, 6, -10);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// ─────────── double-pendulum state
const m1 = 1.0, m2 = 1.0;     // masses
const L1 = 1.0, L2 = 1.0;     // lengths
let g_param = 3.5;            // gravity — bifurcation parameter (user-controlled)

// State: θ1, ω1, θ2, ω2
let theta1 = Math.PI * 0.65;
let omega1 = 0.0;
let theta2 = Math.PI * 0.55;
let omega2 = 0.0;

// Poincaré section — sample state when θ1 crosses zero with ω1 > 0
const poincarePoints = [];
const MAX_POINCARE = 4000;

// RK4 integrator for coupled double-pendulum ODEs
function derivatives(th1, w1, th2, w2){
  const delta = th2 - th1;
  const den1 = (m1 + m2) * L1 - m2 * L1 * Math.cos(delta) * Math.cos(delta);
  const den2 = (L2 / L1) * den1;

  const dth1 = w1;
  const dth2 = w2;

  const term1 = m2 * L1 * w1 * w1 * Math.sin(delta) * Math.cos(delta);
  const term2 = m2 * g_param * Math.sin(th2) * Math.cos(delta);
  const term3 = m2 * L2 * w2 * w2 * Math.sin(delta);
  const term4 = -(m1 + m2) * g_param * Math.sin(th1);
  const dw1 = (term1 + term2 + term3 + term4) / den1;

  const term5 = -m2 * L2 * w2 * w2 * Math.sin(delta) * Math.cos(delta);
  const term6 = (m1 + m2) * g_param * Math.sin(th1) * Math.cos(delta);
  const term7 = -(m1 + m2) * L1 * w1 * w1 * Math.sin(delta);
  const term8 = -(m1 + m2) * g_param * Math.sin(th2);
  const dw2 = (term5 + term6 + term7 + term8) / den2;

  return { dth1, dw1, dth2, dw2 };
}

function rk4Step(dt){
  const k1 = derivatives(theta1, omega1, theta2, omega2);
  const k2 = derivatives(
    theta1 + k1.dth1 * dt * 0.5,
    omega1 + k1.dw1 * dt * 0.5,
    theta2 + k1.dth2 * dt * 0.5,
    omega2 + k1.dw2 * dt * 0.5
  );
  const k3 = derivatives(
    theta1 + k2.dth1 * dt * 0.5,
    omega1 + k2.dw1 * dt * 0.5,
    theta2 + k2.dth2 * dt * 0.5,
    omega2 + k2.dw2 * dt * 0.5
  );
  const k4 = derivatives(
    theta1 + k3.dth1 * dt,
    omega1 + k3.dw1 * dt,
    theta2 + k3.dth2 * dt,
    omega2 + k3.dw2 * dt
  );

  const prevTh1 = theta1;
  theta1 += (k1.dth1 + 2*k2.dth1 + 2*k3.dth1 + k4.dth1) * dt / 6;
  omega1 += (k1.dw1 + 2*k2.dw1 + 2*k3.dw1 + k4.dw1) * dt / 6;
  theta2 += (k1.dth2 + 2*k2.dth2 + 2*k3.dth2 + k4.dth2) * dt / 6;
  omega2 += (k1.dw2 + 2*k2.dw2 + 2*k3.dw2 + k4.dw2) * dt / 6;

  // Poincaré section: sample when θ1 crosses zero upward
  if (prevTh1 < 0 && theta1 >= 0 && omega1 > 0){
    if (poincarePoints.length >= MAX_POINCARE) poincarePoints.shift();
    poincarePoints.push({ th2: theta2, w2: omega2 });
  }
}

// ─────────── phase-space visualization
// We'll render TWO things:
// 1. The continuous trajectory as a thin line in 3D (θ1, ω1, θ2 axes)
// 2. The Poincaré section points as glowing dots in 2D (θ2, ω2 plane)

const trajectoryPositions = [];
const MAX_TRAJ = 3000;

const trajGeo = new THREE.BufferGeometry();
const trajMat = new THREE.LineBasicMaterial({ 
  color: 0x88b0d8,
  transparent: true,
  opacity: 0.6,
  linewidth: 1
});
const trajLine = new THREE.Line(trajGeo, trajMat);
scene.add(trajLine);

// Poincaré section points (attractor structure)
const poincareGeo = new THREE.BufferGeometry();
const poincareMat = new THREE.PointsMaterial({
  color: 0xe8a860,
  size: 0.12,
  transparent: true,
  opacity: 0.8,
  sizeAttenuation: true,
  blending: THREE.AdditiveBlending
});
const poincareCloud = new THREE.Points(poincareGeo, poincareMat);
scene.add(poincareCloud);

// Current state marker (large glowing sphere)
const markerGeo = new THREE.SphereGeometry(0.18, 16, 16);
const markerMat = new THREE.MeshStandardMaterial({
  color: 0xf0c080,
  emissive: 0xe89040,
  emissiveIntensity: 0.9,
  roughness: 0.3,
  metalness: 0.5
});
const marker = new THREE.Mesh(markerGeo, markerMat);
scene.add(marker);

// Reference grid in Poincaré plane (subtle)
const gridHelper = new THREE.GridHelper(12, 24, 0x2a2e3a, 0x1a1d26);
gridHelper.position.y = -6;
gridHelper.rotation.x = Math.PI / 2;
scene.add(gridHelper);

// ─────────── pointer control for bifurcation parameter
let pointerX = 0.5;
addEventListener('pointermove', e => {
  pointerX = e.clientX / innerWidth;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const DT = 0.008;
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;

  // Map pointer X to gravity: 2.0 (stable) → 8.0 (chaotic)
  // At low g: fixed point or simple periodic
  // At high g: period-doubling cascade → chaos
  g_param = 2.0 + pointerX * 6.0;

  // Integrate ODE
  for (let i = 0; i < 3; i++) rk4Step(DT);

  // Map phase-space state to 3D position for trajectory
  // θ1 ∈ [-π, π] → X ∈ [-6, 6]
  // ω1 ∈ [-8, 8] → Y ∈ [-6, 6]
  // θ2 ∈ [-π, π] → Z ∈ [-6, 6]
  const x = (theta1 / Math.PI) * 6;
  const y = Math.max(-6, Math.min(6, omega1 * 0.75));
  const z = (theta2 / Math.PI) * 6;

  trajectoryPositions.push(x, y, z);
  if (trajectoryPositions.length > MAX_TRAJ * 3){
    trajectoryPositions.splice(0, 3);
  }

  // Update trajectory line
  const trajArr = new Float32Array(trajectoryPositions);
  trajGeo.setAttribute('position', new THREE.BufferAttribute(trajArr, 3));
  trajGeo.attributes.position.needsUpdate = true;

  // Update Poincaré section cloud
  if (poincarePoints.length > 0){
    const poincareArr = new Float32Array(poincarePoints.length * 3);
    for (let i = 0; i < poincarePoints.length; i++){
      const p = poincarePoints[i];
      poincareArr[i*3]   = (p.th2 / Math.PI) * 6;      // X = θ2
      poincareArr[i*3+1] = Math.max(-6, Math.min(6, p.w2 * 0.75)); // Y = ω2
      poincareArr[i*3+2] = 0;                          // Z = 0 (projected plane)
    }
    poincareGeo.setAttribute('position', new THREE.BufferAttribute(poincareArr, 3));
    poincareGeo.attributes.position.needsUpdate = true;
  }

  // Update current-state marker
  marker.position.set(x, y, z);

  // Adjust camera framing — track centroid of trajectory + Poincaré cloud
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < trajectoryPositions.length; i += 3){
    cx += trajectoryPositions[i];
    cy += trajectoryPositions[i+1];
    cz += trajectoryPositions[i+2];
    count++;
  }
  if (count > 0){
    cx /= count; cy /= count; cz /= count;
    controls.target.x += (cx - controls.target.x) * 0.02;
    controls.target.y += (cy - controls.target.y) * 0.02;
    controls.target.z += (cz - controls.target.z) * 0.02;
  }

  // Slow auto-rotation to show 3D structure
  camera.position.x = Math.cos(t * 0.08) * 28;
  camera.position.z = Math.sin(t * 0.08) * 28;
  camera.lookAt(controls.target);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
