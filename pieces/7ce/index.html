  .hint  { position:fixed; left:14px; top:14px; opacity:0.5; font-size: 10px; letter-spacing: 0.04em; }

<body>
<div class="id">7ce · physarum</div>
<div class="hint">self-organizing pheromone network · 65k agents</div>
<div class="src">GPGPU trail diffusion · Sage Jenson / mxsage</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Physarum polycephalum agent-based system:
// Each agent has (x,y,angle). Agents:
//  1. sense pheromone ahead-left, ahead, ahead-right
//  2. turn toward strongest sense
//  3. move forward, deposit pheromone
// Pheromone field diffuses + decays each frame.
// Trail texture rendered as additive glow — organic network emergence.

const W = 512, H = 512;
const N = 65536;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c10, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
                   wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, depthBuffer: false };

let trailA = new THREE.WebGLRenderTarget(W, H, rtParams);
let trailB = new THREE.WebGLRenderTarget(W, H, rtParams);

let agentA = new THREE.WebGLRenderTarget(256, 256, { ...rtParams, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
let agentB = new THREE.WebGLRenderTarget(256, 256, { ...rtParams, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// initialize agents: random positions in a central annulus (0.2-0.6 from center), random angles
function makeAgentInit(){
  const init = new Float32Array(256 * 256 * 4);
  for (let i = 0; i < 256*256; i++){
    const ang = Math.random() * Math.PI * 2;
    const r = 0.2 + Math.random() * 0.4;
    init[i*4]   = 0.5 + Math.cos(ang) * r;
    init[i*4+1] = 0.5 + Math.sin(ang) * r;
    init[i*4+2] = Math.random() * Math.PI * 2;
    init[i*4+3] = 1.0;
  }
  const t = new THREE.DataTexture(init, 256, 256, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

blitMat.uniforms.tex.value = makeAgentInit();
renderer.setRenderTarget(agentA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(agentB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// clear trail
const clearMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const clearScene = new THREE.Scene();
clearScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), clearMat));
renderer.setRenderTarget(trailA); renderer.render(clearScene, camOrtho);
renderer.setRenderTarget(trailB); renderer.render(clearScene, camOrtho);
renderer.setRenderTarget(null);

// agent update: sense-steer-move-deposit
const agentUniforms = {
  agents: { value: agentA.texture },
  trail:  { value: trailA.texture },
  uDt:    { value: 0.016 },
  uTime:  { value: 0 },
  uSensorAngle:   { value: 0.40 },  // radians
  uSensorOffset:  { value: 9.0 / W },
  uTurnSpeed:     { value: 0.9 },
  uMoveSpeed:     { value: 0.002 },
  uDepositAmount: { value: 0.8 }
};
const agentMat = new THREE.ShaderMaterial({
  uniforms: agentUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D agents;
    uniform sampler2D trail;
    uniform float uDt;
    uniform float uTime;
    uniform float uSensorAngle;
    uniform float uSensorOffset;
    uniform float uTurnSpeed;
    uniform float uMoveSpeed;
    uniform float uDepositAmount;
    varying vec2 vUv;

    float sense(vec2 pos, float angle){
      vec2 dir = vec2(cos(angle), sin(angle));
      vec2 samplePos = pos + dir * uSensorOffset;
      return texture2D(trail, samplePos).r;
    }

    float hash(float n){ return fract(sin(n)*43758.5453); }

    void main(){
      vec4 a = texture2D(agents, vUv);
      vec2 pos = a.xy;
      float angle = a.z;

      // sense three directions
      float fwd = sense(pos, angle);
      float left = sense(pos, angle - uSensorAngle);
      float right = sense(pos, angle + uSensorAngle);

      // steer toward strongest
      float randTurn = (hash(uTime + pos.x*10000.0 + pos.y*20000.0) - 0.5) * 0.3;
      if (fwd > left && fwd > right){
        // continue straight
      } else if (fwd < left && fwd < right){
        // random turn when ambiguous
        angle += randTurn * uTurnSpeed * uDt;
      } else if (left > right){
        angle -= uTurnSpeed * uDt;
      } else if (right > left){
        angle += uTurnSpeed * uDt;
      }

      // move forward
      vec2 dir = vec2(cos(angle), sin(angle));
      pos += dir * uMoveSpeed * uDt;

      // wrap edges
      if (pos.x < 0.0) pos.x += 1.0;
      if (pos.x > 1.0) pos.x -= 1.0;
      if (pos.y < 0.0) pos.y += 1.0;
      if (pos.y > 1.0) pos.y -= 1.0;

      gl_FragColor = vec4(pos, angle, 1.0);
    }
  `
});
const agentScene = new THREE.Scene();
agentScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), agentMat));

// deposit: render agents as additive points into trail texture
const depositGeom = new THREE.BufferGeometry();
const depositPos = new Float32Array(256*256*2);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++){
  const i = y * 256 + x;
  depositPos[i*2]   = (x + 0.5) / 256;
  depositPos[i*2+1] = (y + 0.5) / 256;
}
depositGeom.setAttribute('uvIdx', new THREE.BufferAttribute(depositPos, 2));
depositGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(256*256*3), 3));

const depositMat = new THREE.ShaderMaterial({
  uniforms: {
    agents: { value: agentA.texture },
    uDepositAmount: { value: 0.8 },
    uTrailRes: { value: new THREE.Vector2(W, H) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D agents;
    uniform vec2 uTrailRes;
    attribute vec2 uvIdx;
    varying float vAmount;
    void main(){
      vec4 a = texture2D(agents, uvIdx);
      vec2 pos = a.xy;
      vAmount = 1.0;
      // map 0-1 to clip -1 to 1
      gl_Position = vec4(pos * 2.0 - 1.0, 0.0, 1.0);
      gl_PointSize = 2.0;
    }
  `,
  fragmentShader: `
    uniform float uDepositAmount;
    varying float vAmount;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 8.0);
      gl_FragColor = vec4(uDepositAmount * a * vAmount, 0.0, 0.0, 1.0);
    }
  `
});
const depositPoints = new THREE.Points(depositGeom, depositMat);
const depositScene = new THREE.Scene();
const depositCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
depositScene.add(depositPoints);

// diffusion + decay
const diffuseUniforms = {
  trail: { value: trailA.texture },
  uDecay: { value: 0.96 },
  uDiffuse: { value: 0.25 },
  uTexelSize: { value: new THREE.Vector2(1.0/W, 1.0/H) }
};
const diffuseMat = new THREE.ShaderMaterial({
  uniforms: diffuseUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D trail;
    uniform float uDecay;
    uniform float uDiffuse;
    uniform vec2 uTexelSize;
    varying vec2 vUv;
    void main(){
      float center = texture2D(trail, vUv).r;
      float n = texture2D(trail, vUv + vec2(0, uTexelSize.y)).r;
      float s = texture2D(trail, vUv - vec2(0, uTexelSize.y)).r;
      float e = texture2D(trail, vUv + vec2(uTexelSize.x, 0)).r;
      float w = texture2D(trail, vUv - vec2(uTexelSize.x, 0)).r;
      float diffused = mix(center, (n+s+e+w) * 0.25, uDiffuse);
      float val = diffused * uDecay;
      gl_FragColor = vec4(val, 0.0, 0.0, 1.0);
    }
  `
});
const diffuseScene = new THREE.Scene();
diffuseScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), diffuseMat));

// render scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 20);
camera.position.set(0, 0, 2.8);
camera.lookAt(0, 0, 0);

// display trail as textured quad with custom color mapping
const displayMat = new THREE.ShaderMaterial({
  uniforms: {
    trail: { value: trailA.texture },
    uTime: { value: 0 },
    uPalA: { value: new THREE.Color(0.18, 0.62, 0.78) },
    uPalB: { value: new THREE.Color(0.92, 0.88, 0.42) },
    uPalC: { value: new THREE.Color(0.98, 0.55, 0.32) }
  },
  transparent: true,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D trail;
    uniform float uTime;
    uniform vec3 uPalA, uPalB, uPalC;
    varying vec2 vUv;
    void main(){
      float val = texture2D(trail, vUv).r;
      val = pow(val, 0.7);
      
      // map to gradient
      vec3 col = mix(uPalA, uPalB, smoothstep(0.0, 0.6, val));
      col = mix(col, uPalC, smoothstep(0.6, 1.0, val));
      
      // add slight grain
      float noise = fract(sin(dot(vUv + uTime * 0.001, vec2(12.9898,78.233))) * 43758.5453);
      col += (noise - 0.5) * 0.015;
      
      float alpha = smoothstep(0.0, 0.05, val);
      gl_FragColor = vec4(col, alpha);
    }
  `
});
const displayQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), displayMat);
scene.add(displayQuad);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  agentUniforms.uDt.value = dt;
  agentUniforms.uTime.value = now / 1000;
  displayMat.uniforms.uTime.value = now / 1000;

  // 1. agent sense-steer-move
  agentUniforms.agents.value = agentA.texture;
  agentUniforms.trail.value = trailA.texture;
  renderer.setRenderTarget(agentB);
  renderer.render(agentScene, camOrtho);
  let tmp = agentA; agentA = agentB; agentB = tmp;

  // 2. deposit pheromone
  depositMat.uniforms.agents.value = agentA.texture;
  renderer.setRenderTarget(trailB);
  renderer.render(depositScene, depositCamera);

  // 3. diffuse + decay trail
  diffuseUniforms.trail.value = trailB.texture;
  renderer.setRenderTarget(trailA);
  renderer.render(diffuseScene, camOrtho);
  
  renderer.setRenderTarget(null);

  // 4. render to screen
  displayMat.uniforms.trail.value = trailA.texture;
  
  // slow camera rotation
  const ang = now * 0.00008;
  camera.position.x = Math.sin(ang) * 0.15;
  camera.position.y = Math.cos(ang * 1.3) * 0.1;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
