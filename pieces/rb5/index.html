<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Dancer's Sphere · Ayoung Kim · courier-trail cartography</title>
<!-- MOTION: traverse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1d22; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">rb5 · Delivery Dancer's Sphere · courier-trail cartography</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Ayoung Kim — Delivery Dancer's Sphere (2024, Venice)
// Speculative AI cartography: fictive city graph seen from high angle
// Voronoi building footprints → wireframe extrusions
// Courier particles traverse street-graph, leaving fading trails (heatmap)
// Chartreuse + magenta on slate gray, game-engine overhead aesthetic

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1d22, 0.008);
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 48, 32);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1d22, 1);
document.body.appendChild(renderer.domElement);

// ─────────── Voronoi city graph
const CITY_R = 28;
const N_SITES = 42;
const sites = [];
for (let i = 0; i < N_SITES; i++){
  const r = Math.sqrt(Math.random()) * CITY_R;
  const th = Math.random() * Math.PI * 2;
  sites.push({ x: Math.cos(th)*r, z: Math.sin(th)*r, id: i });
}

// build Voronoi cells (naive: sample grid, assign to nearest site)
const GRID_RES = 80;
const cellMap = new Map();
for (let i = 0; i < N_SITES; i++) cellMap.set(i, []);
for (let ix = -GRID_RES; ix <= GRID_RES; ix++){
  for (let iz = -GRID_RES; iz <= GRID_RES; iz++){
    const px = (ix / GRID_RES) * CITY_R;
    const pz = (iz / GRID_RES) * CITY_R;
    let best = 0, bestD = 1e9;
    for (let s = 0; s < N_SITES; s++){
      const dx = px - sites[s].x, dz = pz - sites[s].z;
      const d = dx*dx + dz*dz;
      if (d < bestD){ bestD = d; best = s; }
    }
    cellMap.get(best).push({ x: px, z: pz });
  }
}

// extract cell boundaries (edges where neighbor grid cell belongs to different site)
const edges = new Set();
for (let ix = -GRID_RES; ix < GRID_RES; ix++){
  for (let iz = -GRID_RES; iz < GRID_RES; iz++){
    const px = (ix / GRID_RES) * CITY_R, pz = (iz / GRID_RES) * CITY_R;
    const px2 = ((ix+1) / GRID_RES) * CITY_R, pz2 = ((iz+1) / GRID_RES) * CITY_R;
    let s1 = -1, s2 = -1, s3 = -1;
    // find site for current, right, down
    for (let s = 0; s < N_SITES; s++){
      const dx1 = px - sites[s].x, dz1 = pz - sites[s].z;
      if (s1 < 0 || dx1*dx1 + dz1*dz1 < 1e9) s1 = s;
      const dx2 = px2 - sites[s].x, dz2 = pz - sites[s].z;
      if (s2 < 0 || dx2*dx2 + dz2*dz2 < 1e9) s2 = s;
      const dx3 = px - sites[s].x, dz3 = pz2 - sites[s].z;
      if (s3 < 0 || dx3*dx3 + dz3*dz3 < 1e9) s3 = s;
    }
    if (s1 !== s2) edges.add([Math.min(s1,s2), Math.max(s1,s2)].join(','));
    if (s1 !== s3) edges.add([Math.min(s1,s3), Math.max(s1,s3)].join(','));
  }
}

// graph adjacency
const graph = new Map();
for (let i = 0; i < N_SITES; i++) graph.set(i, []);
for (const e of edges){
  const [a, b] = e.split(',').map(Number);
  graph.get(a).push(b);
  graph.get(b).push(a);
}

// building extrusions (wireframe boxes at each Voronoi site)
const buildingGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
const buildingMat = new THREE.LineBasicMaterial({ color: 0x3a4a58, transparent: true, opacity: 0.35 });
const buildings = new THREE.Group();
for (const s of sites){
  const h = 1.5 + Math.random() * 4.5;
  const w = 0.6 + Math.random() * 1.2;
  const mesh = new THREE.LineSegments(buildingGeo, buildingMat);
  mesh.position.set(s.x, h * 0.5, s.z);
  mesh.scale.set(w, h, w);
  buildings.add(mesh);
}
scene.add(buildings);

// street-graph edges (wireframe lines on ground)
const streetPositions = [];
for (const e of edges){
  const [a, b] = e.split(',').map(Number);
  streetPositions.push(sites[a].x, 0.02, sites[a].z);
  streetPositions.push(sites[b].x, 0.02, sites[b].z);
}
const streetGeo = new THREE.BufferGeometry();
streetGeo.setAttribute('position', new THREE.Float32BufferAttribute(streetPositions, 3));
const streetMat = new THREE.LineBasicMaterial({ color: 0x505a68, transparent: true, opacity: 0.25 });
const streetMesh = new THREE.LineSegments(streetGeo, streetMat);
scene.add(streetMesh);

// ─────────── courier particles
const MAX_COURIERS = 18;
const couriers = [];
class Courier {
  constructor(){
    this.path = [];   // [node_id, ...]
    this.idx = 0;
    this.t = 0;       // interpolation 0..1 between path[idx] and path[idx+1]
    this.trail = [];  // [{x,y,z,age}, ...]
    this.speed = 0.012 + Math.random() * 0.008;
    // random start/end
    const start = Math.floor(Math.random() * N_SITES);
    let end = start;
    while (end === start) end = Math.floor(Math.random() * N_SITES);
    // BFS shortest path
    const queue = [[start]], visited = new Set([start]);
    let found = null;
    while (queue.length > 0 && !found){
      const p = queue.shift();
      const last = p[p.length - 1];
      if (last === end){ found = p; break; }
      for (const nb of graph.get(last)){
        if (!visited.has(nb)){
          visited.add(nb);
          queue.push([...p, nb]);
        }
      }
    }
    this.path = found || [start, end];
  }
  update(){
    if (this.idx >= this.path.length - 1) return false; // reached end
    this.t += this.speed;
    if (this.t >= 1.0){
      this.t = 0;
      this.idx++;
      if (this.idx >= this.path.length - 1) return false;
    }
    const a = sites[this.path[this.idx]];
    const b = sites[this.path[this.idx + 1]];
    const x = a.x + (b.x - a.x) * this.t;
    const z = a.z + (b.z - a.z) * this.t;
    const y = 0.3 + Math.sin(this.t * Math.PI) * 0.2; // arc motion
    this.trail.push({ x, y, z, age: 0 });
    if (this.trail.length > 120) this.trail.shift();
    for (const p of this.trail) p.age++;
    return true;
  }
}

// spawn couriers over time
let spawnTimer = 0;
function spawnCourier(){
  if (couriers.length < MAX_COURIERS){
    couriers.push(new Courier());
  }
}

// trail rendering (line segments with fading alpha)
const trailMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float alpha;
    varying float vAlpha;
    void main(){
      vAlpha = alpha;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 color1;
    uniform vec3 color2;
    varying float vAlpha;
    void main(){
      vec3 col = mix(color1, color2, vAlpha * 0.5);
      gl_FragColor = vec4(col, vAlpha * 0.6);
    }
  `,
  uniforms: {
    color1: { value: new THREE.Color(0xa0ff3c) },  // chartreuse
    color2: { value: new THREE.Color(0xff3c8a) }   // magenta
  }
});
const trailGeo = new THREE.BufferGeometry();
const maxTrailVerts = MAX_COURIERS * 120 * 2;
const trailPositions = new Float32Array(maxTrailVerts * 3);
const trailAlphas = new Float32Array(maxTrailVerts);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeo.setAttribute('alpha', new THREE.BufferAttribute(trailAlphas, 1));
const trailMesh = new THREE.LineSegments(trailGeo, trailMat);
scene.add(trailMesh);

function updateTrails(){
  let offset = 0;
  for (const c of couriers){
    for (let i = 0; i < c.trail.length - 1; i++){
      const p = c.trail[i], q = c.trail[i+1];
      const alpha = 1.0 - p.age / 120;
      trailPositions[offset*3]   = p.x;
      trailPositions[offset*3+1] = p.y;
      trailPositions[offset*3+2] = p.z;
      trailAlphas[offset] = alpha;
      offset++;
      trailPositions[offset*3]   = q.x;
      trailPositions[offset*3+1] = q.y;
      trailPositions[offset*3+2] = q.z;
      trailAlphas[offset] = alpha;
      offset++;
    }
  }
  trailGeo.setDrawRange(0, offset);
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.alpha.needsUpdate = true;
}

// slow camera rotation
let cameraAngle = 0;
const CAM_RADIUS = 50;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  spawnTimer++;
  if (spawnTimer > 90){
    spawnTimer = 0;
    spawnCourier();
  }
  for (let i = couriers.length - 1; i >= 0; i--){
    if (!couriers[i].update()){
      couriers.splice(i, 1);
    }
  }
  updateTrails();
  
  // camera orbit
  cameraAngle += 0.0008;
  camera.position.x = Math.cos(cameraAngle) * CAM_RADIUS;
  camera.position.z = Math.sin(cameraAngle) * CAM_RADIUS;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
