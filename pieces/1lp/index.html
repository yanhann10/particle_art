<!-- MOTION: collapse, intensity: vigorous -->

<body>
<div class="id">1lp</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// AUTO{}Construccion mutation — CNDSD & Ivan Abreu (Lumen 2023 Gold)
// Differential-growth ring (from parent 2iy) becomes an urban footprint.
// Instanced cubes grow upward as informal housing — rooms stacking on rooms,
// occasionally branching sideways. Every ~6s a collapse wave dissolves a sector:
// cubes detach, fall under gravity, fade, recycle. The city breathes.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(16, 14, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// ── Lighting: single warm overhead + cold ambient
const warmLight = new THREE.PointLight(0xffe0b0, 1.8, 60);
warmLight.position.set(3, 22, 2);
scene.add(warmLight);
scene.add(new THREE.AmbientLight(0x1a1a2e, 0.6));
const rimLight = new THREE.DirectionalLight(0x4060a0, 0.4);
rimLight.position.set(-10, 8, -6);
scene.add(rimLight);

// ── Differential growth ring (simplified from 2iy) — urban footprint
const GROWTH_MAX = 400;
const gVerts = [];
for (let i = 0; i < 24; i++) {
  const th = (i / 24) * Math.PI * 2;
  const r = 3.2 + (Math.random() - 0.5) * 0.3;
  gVerts.push({ x: Math.cos(th) * r, z: Math.sin(th) * r });
}

function growthStep() {
  const n = gVerts.length;
  if (n >= GROWTH_MAX) return;
  const dx = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = gVerts[i];
    for (let j = 0; j < n; j++) {
      if (j === i) continue;
      const u = gVerts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > 0.5 * 0.5 || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = 0.12 * (1 - d / 0.5) / d;
      dx[i] += ex * f; dz[i] += ez * f;
    }
    const a = gVerts[(i - 1 + n) % n], b = gVerts[(i + 1) % n];
    dx[i] += (a.x + b.x - 2 * v.x) * 0.05;
    dz[i] += (a.z + b.z - 2 * v.z) * 0.05;
  }
  let cx = 0, cz = 0;
  for (const v of gVerts) { cx += v.x; cz += v.z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = gVerts[i].x - cx, oz = gVerts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * 0.003;
    dz[i] += (oz / d) * 0.003;
    gVerts[i].x += dx[i] + (Math.random() - 0.5) * 0.002;
    gVerts[i].z += dz[i] + (Math.random() - 0.5) * 0.002;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = gVerts[i], b = gVerts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex * ex + ez * ez > 0.35 * 0.35 && n + grown.length < GROWTH_MAX) {
      grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5 });
    }
  }
  gVerts.length = 0;
  for (const v of grown) gVerts.push(v);
}
for (let s = 0; s < 300; s++) growthStep();

// ── Palette — rebar gray, cinder block, concrete, neon code-flash
const PAL = [
  new THREE.Color(0x5a5a5a), // rebar gray
  new THREE.Color(0x8c857a), // cinder block
  new THREE.Color(0xb5ada2), // concrete light
  new THREE.Color(0x6e685e), // dark concrete
  new THREE.Color(0x4a4a4a), // shadow gray
];
const NEON = new THREE.Color(0x00e87b);
const NEON2 = new THREE.Color(0x00c8ff);

// ── Instanced cubes — the building blocks
const MAX_CUBES = 4500;
const cubeGeo = new THREE.BoxGeometry(0.38, 0.38, 0.38);
const cubeMat = new THREE.MeshStandardMaterial({
  roughness: 0.85,
  metalness: 0.15,
  vertexColors: false,
});

const instMesh = new THREE.InstancedMesh(cubeGeo, cubeMat, MAX_CUBES);
instMesh.count = 0;
scene.add(instMesh);

// Per-cube state
const cubes = [];
// state: 'growing', 'stable', 'falling', 'dead'
function makeCube(x, y, z, colIdx) {
  return {
    x, y, z,
    vy: 0,
    state: 'growing',
    age: 0,
    flash: 1.0, // neon flash on placement, fades
    colIdx: colIdx ?? Math.floor(Math.random() * PAL.length),
    stackHeight: 0,
    siteIdx: -1,
  };
}

// ── Building sites from growth ring
const sites = [];
function refreshSites() {
  sites.length = 0;
  const step = Math.max(1, Math.floor(gVerts.length / 120));
  for (let i = 0; i < gVerts.length; i += step) {
    const v = gVerts[i];
    sites.push({
      x: v.x, z: v.z,
      maxH: 3 + Math.floor(Math.random() * 10),
      curH: 0,
      colZone: Math.floor(Math.random() * PAL.length),
      cooldown: 0,
    });
  }
  // fill some interior sites
  let cx = 0, cz = 0;
  for (const v of gVerts) { cx += v.x; cz += v.z; }
  cx /= gVerts.length; cz /= gVerts.length;
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 2.0;
    sites.push({
      x: cx + Math.cos(angle) * r,
      z: cz + Math.sin(angle) * r,
      maxH: 4 + Math.floor(Math.random() * 8),
      curH: 0,
      colZone: Math.floor(Math.random() * PAL.length),
      cooldown: 0,
    });
  }
}
refreshSites();

// ── L-system-ish growth: each tick, pick sites and stack cubes
function growBuildings(count) {
  for (let c = 0; c < count; c++) {
    if (cubes.length >= MAX_CUBES - 10) break;
    // pick a random site that can grow
    const candidates = sites.filter(s => s.curH < s.maxH && s.cooldown <= 0);
    if (candidates.length === 0) break;
    const site = candidates[Math.floor(Math.random() * candidates.length)];

    const y = site.curH * 0.4;
    // sometimes branch sideways (informal housing overhang)
    let bx = site.x, bz = site.z;
    if (site.curH > 2 && Math.random() < 0.2) {
      const ang = Math.random() * Math.PI * 2;
      bx += Math.cos(ang) * 0.35;
      bz += Math.sin(ang) * 0.35;
    }
    const cube = makeCube(bx, y, bz, site.colZone);
    cube.siteIdx = sites.indexOf(site);
    cube.stackHeight = site.curH;
    cubes.push(cube);
    site.curH++;
    site.cooldown = 1 + Math.floor(Math.random() * 3);
  }
  for (const s of sites) if (s.cooldown > 0) s.cooldown--;
}

// ── Collapse wave
let lastCollapse = 0;
const COLLAPSE_INTERVAL = 6.0; // seconds
function collapseWave(time) {
  if (time - lastCollapse < COLLAPSE_INTERVAL) return;
  lastCollapse = time;

  // pick a random sector angle
  const angle = Math.random() * Math.PI * 2;
  const spread = 0.6 + Math.random() * 0.5; // radians

  let collapsed = 0;
  for (const cube of cubes) {
    if (cube.state === 'dead' || cube.state === 'falling') continue;
    const a = Math.atan2(cube.z, cube.x);
    let diff = Math.abs(a - angle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff < spread && cube.y > 0.2) {
      // higher cubes more likely to fall
      if (Math.random() < 0.4 + cube.stackHeight * 0.06) {
        cube.state = 'falling';
        cube.vy = 0;
        collapsed++;
        // reset site
        if (cube.siteIdx >= 0 && cube.siteIdx < sites.length) {
          const s = sites[cube.siteIdx];
          s.curH = Math.max(0, s.curH - 1);
          s.maxH = 3 + Math.floor(Math.random() * 10); // new target
        }
      }
    }
  }
  // neon flash on collapse — briefly flash some cubes
  if (collapsed > 0) {
    for (const cube of cubes) {
      if (cube.state === 'falling') cube.flash = 1.0;
    }
  }
}

// ── Ground plane grid (construction grid lines)
const gridHelper = new THREE.GridHelper(20, 40, 0x1a1a22, 0x111118);
gridHelper.position.y = -0.01;
scene.add(gridHelper);

// ── Update instanced mesh
const dummy = new THREE.Object3D();
const col = new THREE.Color();

function updateInstances() {
  let count = 0;
  for (let i = 0; i < cubes.length && count < MAX_CUBES; i++) {
    const c = cubes[i];
    if (c.state === 'dead') continue;

    dummy.position.set(c.x, c.y, c.z);
    // slight random rotation for imperfection
    dummy.rotation.set(0, (c.x * 3.7 + c.z * 2.1) % 0.15, 0);

    if (c.state === 'growing') {
      const s = Math.min(c.age * 4, 1.0);
      dummy.scale.setScalar(s);
    } else if (c.state === 'falling') {
      const tumble = c.age * 2;
      dummy.rotation.x = tumble;
      dummy.rotation.z = tumble * 0.7;
      dummy.scale.setScalar(1.0);
    } else {
      dummy.scale.setScalar(1.0);
    }
    dummy.updateMatrix();
    instMesh.setMatrixAt(count, dummy.matrix);

    // color
    if (c.flash > 0.3) {
      col.copy(c.state === 'falling' ? NEON : NEON2).multiplyScalar(c.flash);
    } else {
      col.copy(PAL[c.colIdx % PAL.length]);
      // darken lower cubes slightly
      const darkFactor = 0.7 + 0.3 * Math.min(c.y / 4.0, 1.0);
      col.multiplyScalar(darkFactor);
    }
    instMesh.setColorAt(count, col);
    count++;
  }
  instMesh.count = count;
  instMesh.instanceMatrix.needsUpdate = true;
  if (instMesh.instanceColor) instMesh.instanceColor.needsUpdate = true;
}

// ── Thin rebar lines connecting nearby sites (Chiharu Shiota nod)
const rebarMat = new THREE.LineBasicMaterial({ color: 0x3a3a3a, transparent: true, opacity: 0.3 });
let rebarLines = null;
function buildRebar() {
  if (rebarLines) { scene.remove(rebarLines); rebarLines.geometry.dispose(); }
  const pts = [];
  for (let i = 0; i < sites.length; i++) {
    for (let j = i + 1; j < sites.length; j++) {
      const dx = sites[i].x - sites[j].x, dz = sites[i].z - sites[j].z;
      const d = dx * dx + dz * dz;
      if (d < 2.5 && d > 0.3) {
        const y1 = sites[i].curH * 0.4;
        const y2 = sites[j].curH * 0.4;
        pts.push(new THREE.Vector3(sites[i].x, y1, sites[i].z));
        pts.push(new THREE.Vector3(sites[j].x, y2, sites[j].z));
      }
    }
  }
  if (pts.length > 0) {
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    rebarLines = new THREE.LineSegments(geo, rebarMat);
    scene.add(rebarLines);
  }
}

// ── Film grain overlay (Lia Halloran nod) via fullscreen quad
const grainVS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`;
const grainFS = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  void main(){
    float g = hash(vUv*vec2(1920.0,1080.0)+uTime*100.0);
    gl_FragColor = vec4(vec3(g), 0.04);
  }
`;
const grainMat = new THREE.ShaderMaterial({
  vertexShader: grainVS,
  fragmentShader: grainFS,
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthTest: false,
  depthWrite: false,
});
const grainQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat);
const grainScene = new THREE.Scene();
grainScene.add(grainQuad);
const grainCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ── Initial build
for (let i = 0; i < 60; i++) growBuildings(8);
// age them so they appear
for (const c of cubes) { c.age = 1; c.state = 'stable'; c.flash = 0; }
buildRebar();

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Main loop
const t0 = performance.now();
let rebarTimer = 0;

function loop() {
  const elapsed = (performance.now() - t0) * 0.001;

  // grow a few cubes per frame
  growBuildings(2);

  // occasionally grow the footprint ring
  if (Math.random() < 0.02) growthStep();

  // collapse wave
  collapseWave(elapsed);

  // update cube physics
  for (const c of cubes) {
    c.age += 0.016;
    c.flash *= 0.93;
    if (c.state === 'growing' && c.age > 0.3) c.state = 'stable';
    if (c.state === 'falling') {
      c.vy -= 0.012; // gravity
      c.y += c.vy;
      // slight horizontal drift
      c.x += (Math.random() - 0.5) * 0.01;
      c.z += (Math.random() - 0.5) * 0.01;
      if (c.y < -8) c.state = 'dead';
    }
  }

  // cull dead cubes periodically
  if (elapsed % 10 < 0.02) {
    for (let i = cubes.length - 1; i >= 0; i--) {
      if (cubes[i].state === 'dead') cubes.splice(i, 1);
    }
  }

  // rebuild rebar occasionally
  rebarTimer += 0.016;
  if (rebarTimer > 2.0) {
    rebarTimer = 0;
    buildRebar();
  }

  updateInstances();

  // camera: gentle orbit + track centroid height
  let yMean = 0, xMean = 0, zMean = 0, alive = 0;
  for (const c of cubes) {
    if (c.state === 'dead') continue;
    xMean += c.x; yMean += c.y; zMean += c.z; alive++;
  }
  if (alive > 0) { xMean /= alive; yMean /= alive; zMean /= alive; }
  controls.target.x += (xMean - controls.target.x) * 0.02;
  controls.target.y += (Math.max(yMean, 1.5) - controls.target.y) * 0.03;
  controls.target.z += (zMean - controls.target.z) * 0.02;

  controls.update();
  renderer.render(scene, camera);

  // grain overlay
  grainMat.uniforms.uTime.value = elapsed;
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
