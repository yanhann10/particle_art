<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b98 · atmospheric fields (rothko)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">b98</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Rothko in particles: take the differential growth curve and transform it into
// soft, bleeding color fields. Instead of rendering coral structure, we extract
// horizontal bands from the curve's Y-distribution, then blur them into atmospheric
// rectangles that vibrate and breathe. The piece inherits the organic growth rhythm
// but sheds the literal form—what remains is contemplative color stratification.
//
// Strategy:
//   - Evolve the differential growth curve silently (no structural display)
//   - Sort vertices into Y-bands (top/middle/bottom)
//   - Each band becomes a horizontal field of particles with its own color
//   - Particles drift slowly, fade at edges → soft rectangles
//   - Camera fixed, looking at stacked color planes
//   - Palette: deep ochre, burnt sienna, charcoal → Rothko's warm/dark register

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

// Differential growth params (silent evolution)
const MAX_VERTS = 3000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE = 0.0035;
const MAX_D    = 0.32;

const verts = [];
const NV0 = 24;
for (let i = 0; i < NV0; i++){
  const th = i / NV0 * Math.PI * 2;
  const r  = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, z: Math.sin(th) * r, y: 0, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x, z){ return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const arr = grid.get((cx+dx) + ',' + (cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex*ex + ez*ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i - 1 + n) % n];
    const b = verts[(i + 1) % n];
    const v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cz += verts[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0006;
    verts[i].y = -Math.min(verts[i].age * 0.6, 1.4);
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z;
    if (ex*ex + ez*ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({ x: (a.x + b.x) * 0.5, z: (a.z + b.z) * 0.5,
                   y: (a.y + b.y) * 0.5, age: Math.max(a.age, b.age) * 0.85 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// Pre-grow
for (let s = 0; s < 600; s++) step();

// Particle rendering: 40k particles distributed into three horizontal bands
const N_RENDER = 40000;
const rPositions = new Float32Array(N_RENDER * 3);
const rBand = new Float32Array(N_RENDER);      // 0=top, 1=mid, 2=bottom
const rPhase = new Float32Array(N_RENDER);
for (let i = 0; i < N_RENDER; i++) rPhase[i] = Math.random() * 6.28;

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPositions, 3));
geom.setAttribute('band', new THREE.BufferAttribute(rBand, 1));
geom.setAttribute('phase', new THREE.BufferAttribute(rPhase, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  fogColor: { value: new THREE.Color(0x1a1612) },
  fogDensity: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float band;
    attribute float phase;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      // slow breathing drift
      float t = uTime * 0.15 + phase;
      p.x += sin(t) * 0.08;
      p.y += cos(t * 0.7) * 0.05;

      // Rothko palette: ochre (top), burnt sienna (mid), charcoal (bottom)
      vec3 col0 = vec3(0.72, 0.52, 0.28);  // warm ochre
      vec3 col1 = vec3(0.58, 0.28, 0.18);  // burnt sienna
      vec3 col2 = vec3(0.18, 0.15, 0.14);  // charcoal

      if (band < 0.5) vCol = col0;
      else if (band < 1.5) vCol = col1;
      else vCol = col2;

      // fade at horizontal edges for soft rectangle effect
      float edgeFade = smoothstep(0.0, 2.0, abs(p.x)) * smoothstep(12.0, 9.0, abs(p.x));
      vAlpha = 1.0 - edgeFade * 0.7;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = 2.2 * uPixel * (30.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 fogColor;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0) * 0.85 * vAlpha;
      vec3 col = mix(vCol, fogColor, 0.1);
      gl_FragColor = vec4(col, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // Continue silent evolution
  for (let s = 0; s < 4; s++) step();

  // Extract Y-range and partition into three bands
  const n = verts.length;
  if (n > 0){
    let yMin = Infinity, yMax = -Infinity;
    for (let i = 0; i < n; i++){
      yMin = Math.min(yMin, verts[i].y);
      yMax = Math.max(yMax, verts[i].y);
    }
    const span = yMax - yMin + 0.01;
    const bands = [[], [], []];
    for (let i = 0; i < n; i++){
      const norm = (verts[i].y - yMin) / span;
      const b = Math.floor(norm * 2.99);
      bands[Math.min(b, 2)].push(verts[i]);
    }

    // Distribute particles across bands
    let written = 0;
    for (let b = 0; b < 3; b++){
      const vList = bands[b];
      if (vList.length === 0) continue;
      const share = Math.floor(N_RENDER / 3);
      for (let k = 0; k < share && written < N_RENDER; k++){
        const v = vList[Math.floor(Math.random() * vList.length)];
        // spread horizontally into wide rectangle
        const wx = (Math.random() - 0.5) * 18.0;
        const wy = (Math.random() - 0.5) * 1.8;
        const wz = (Math.random() - 0.5) * 0.4;
        rPositions[written*3]   = wx;
        rPositions[written*3+1] = v.y + wy;
        rPositions[written*3+2] = wz;
        rBand[written] = b;
        written++;
      }
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.band.needsUpdate = true;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
