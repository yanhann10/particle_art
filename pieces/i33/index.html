<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i33 · adire-lorenz cloth</title>
<!-- MOTION: weaving, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0e18; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">i33</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// YORUBA ADIRE RESIST-DYE MOTIF AS COMPOSITIONAL SUBSTRATE
// Instead of uniform particle scatter, we populate along 6 traditional adire geometric patterns:
// (1) ewe-aran (fern leaf) — diagonal zigzags
// (2) olokun (sea god) — concentric circles
// (3) ibadan (fortress) — nested rectangles
// (4) àdìrẹ elẹ́kọ̀ (cassava starch resist) — radial burst from center
// (5) triangular grid (representing mud-cloth stencil)
// (6) vertical warp lines (the cloth's textile structure)
// Each pattern region seeds particles on a 2D manifold in Lorenz phase-space, so the attractor WEAVES through the resist zones.
// The shape IS the cloth — Lorenz trajectories act as the dye flowing through the resist boundaries.

const W = 280, H = 280;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0e18, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

// ADIRE PATTERN GENERATOR — each particle is seeded on one of 6 motifs
function adirePattern(u, v, patternID) {
  // u,v ∈ [0,1] — map to phase-space positions based on adire geometry
  const cx = u * 2 - 1, cy = v * 2 - 1; // centered on [-1,1]
  let x = 0, y = 0, z = 25;
  const scale = 12;
  
  switch(patternID % 6){
    case 0: // ewe-aran (fern zigzag) — diagonal alternating waves
      x = cx * scale + Math.sin(cy * 8) * 2.5;
      y = cy * scale;
      z = 25 + Math.cos(cx * 6) * 3;
      break;
    case 1: // olokun (concentric circles) — radial rings
      const r1 = Math.sqrt(cx*cx + cy*cy);
      const th1 = Math.atan2(cy, cx);
      x = Math.cos(th1) * (r1 * scale + Math.sin(r1 * 18) * 1.8);
      y = Math.sin(th1) * (r1 * scale + Math.sin(r1 * 18) * 1.8);
      z = 25 + r1 * 4;
      break;
    case 2: // ibadan (nested rectangles)
      const rectR = Math.max(Math.abs(cx), Math.abs(cy));
      const ang2 = Math.atan2(cy, cx);
      x = cx * scale + Math.sin(rectR * 14) * 2.2;
      y = cy * scale + Math.cos(rectR * 14) * 2.2;
      z = 25 + rectR * 5;
      break;
    case 3: // àdìrẹ elẹ́kọ̀ (radial starburst from center)
      const r3 = Math.sqrt(cx*cx + cy*cy);
      const th3 = Math.atan2(cy, cx);
      const arms = 12;
      const armWave = Math.sin(th3 * arms) * 3;
      x = cx * scale + Math.cos(th3) * armWave;
      y = cy * scale + Math.sin(th3) * armWave;
      z = 25 + r3 * 3.5 + armWave;
      break;
    case 4: // triangular grid (resist stencil)
      const gridS = 0.12;
      const triX = Math.floor(u / gridS);
      const triY = Math.floor(v / gridS);
      const offX = (triY % 2) * 0.5;
      x = ((u / gridS - triX + offX) * 2 - 1) * scale;
      y = ((v / gridS - triY) * 2 - 1) * scale;
      z = 25 + ((triX + triY) % 3) * 2.5;
      break;
    case 5: // vertical warp threads (cloth weave structure)
      const warpID = Math.floor(u * 18);
      x = (warpID / 9 - 1) * scale + Math.sin(v * 12) * 1.2;
      y = (v * 2 - 1) * scale;
      z = 25 + Math.cos(warpID * 2.1 + v * 6) * 2.8;
      break;
  }
  return {x, y, z};
}

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const u = (i % W) / W;
  const v = Math.floor(i / W) / H;
  const pattern = Math.floor(Math.random() * 6);
  const pos = adirePattern(u, v, pattern);
  init[i*4]   = pos.x + (Math.random() - 0.5) * 0.8;
  init[i*4+1] = pos.y + (Math.random() - 0.5) * 0.8;
  init[i*4+2] = pos.z + (Math.random() - 0.5) * 0.8;
  init[i*4+3] = pattern / 6.0; // encode pattern-id as age channel
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// LORENZ INTEGRATION with subtle damping to keep particles near cloth surface
const simUniforms = {
  prev: { value: rtA.texture },
  uDt:    { value: 0.004 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 },
  uDamping: { value: 0.992 } // slight pull back toward substrate
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uSigma;
    uniform float uRho;
    uniform float uBeta;
    uniform float uDamping;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float patternID = s.w;
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      p += dp * uDt;
      // damping toward z=25 plane to keep particles weaving near cloth surface
      p.z += (25.0 - p.z) * (1.0 - uDamping);
      gl_FragColor = vec4(p, patternID);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// RENDER POINTS with indigo palette (traditional adire dye color) + resist-white highlights
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, -35, 65);
camera.lookAt(0, 0, 25);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vPattern;
    varying float vDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vPattern = s.w;
      p.z -= 25.0;
      vDepth = p.z;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.4 + abs(vDepth) * 0.08) * uPixel * (50.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vPattern;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 12.0);
      // YORUBA INDIGO PALETTE: deep indigo base → mid-blue → resist-white at pattern edges
      // pattern-id encoded in vPattern ∈ [0,1] — 6 discrete zones
      float pid = floor(vPattern * 6.0);
      vec3 indigoDeep = vec3(0.08, 0.12, 0.28);   // deep dye
      vec3 indigoMid  = vec3(0.18, 0.32, 0.62);   // mid tone
      vec3 resistWhite = vec3(0.92, 0.94, 0.98);  // cassava-starch resist (undyed)
      // assign color by pattern region
      vec3 col = indigoDeep;
      if (pid < 1.5) col = mix(indigoDeep, indigoMid, 0.6);          // ewe-aran
      else if (pid < 2.5) col = mix(indigoMid, resistWhite, 0.3);   // olokun (lighter rings)
      else if (pid < 3.5) col = indigoMid;                           // ibadan
      else if (pid < 4.5) col = mix(indigoMid, resistWhite, 0.5);   // starburst (bright arms)
      else if (pid < 5.5) col = mix(indigoDeep, resistWhite, 0.25); // triangular grid
      else col = mix(indigoDeep, indigoMid, 0.4);                    // warp threads
      // depth fade for cloth layering
      col = mix(col, indigoDeep, smoothstep(-3.0, 3.0, vDepth) * 0.4);
      gl_FragColor = vec4(col * a * 1.1, a * 0.7);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// subtle ambient light to suggest fabric texture
scene.fog = new THREE.Fog(0x0a0e18, 40, 110);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  lastTime = now;

  // step sim 3 substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;
  
  // gentle camera arc — viewing the cloth from above-side, slow weave motion
  const t = now * 0.00008;
  camera.position.x = Math.sin(t) * 28;
  camera.position.y = -35 + Math.cos(t * 0.7) * 8;
  camera.position.z = 65 + Math.sin(t * 0.5) * 6;
  camera.lookAt(0, 0, 25);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
