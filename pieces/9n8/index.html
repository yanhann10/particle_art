<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9n8 · corrupted vessel · glitch aesthetics</title>
<!-- MOTION: distortion, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; image-rendering: pixelated; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">9n8</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Rosa Menkman / datamosh-inspired glitch piece
// Posterize to 6 colors · 8x8 JPEG-block displacement · RGB channel split · frame jitter · vertical stretch on corruption events

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(7, 6, 12);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 1.2);
light.position.set(4, 10, 6);
scene.add(light);
scene.add(new THREE.AmbientLight(0x111111, 0.4));

// ─────────── differential growth (simplified from parent)
const MAX_VERTS = 1200;
const ATTRACT   = 0.08;
const REPEL_R   = 0.45;
const REPEL_STR = 0.14;
const NOISE     = 0.004;
const PRESSURE  = 0.003;
const RISE      = 0.005;
const MAX_D     = 0.35;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.2 + (Math.random() - 0.5) * 0.12;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.3;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.4 + 1.1 * Math.min(a * 1.6, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.6 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0016;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.06, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.55
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}
for (let s = 0; s < 500; s++) step();

let tubeMesh = null;
const tubeMat = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0 },
    corrupt: { value: 0 }
  },
  vertexShader: `
    varying vec3 vPos;
    varying vec3 vNorm;
    void main(){
      vPos = position;
      vNorm = normal;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    uniform float corrupt;
    varying vec3 vPos;
    varying vec3 vNorm;

    vec3 posterize(vec3 c, float levels){
      return floor(c * levels) / levels;
    }

    void main(){
      // 6-color posterization palette (Menkman-style reduced depth)
      vec3 base = vec3(0.68, 0.26, 0.22);   // arterial red
      float y = vPos.y;
      vec3 col = mix(base, vec3(0.08, 0.02, 0.02), smoothstep(0.0, 12.0, y));
      float light = max(0.0, dot(vNorm, normalize(vec3(1,1,1))));
      col *= 0.4 + 0.6 * light;

      // posterize to 6 discrete levels
      col = posterize(col, 6.0);

      // corruption event: shift toward cyan/magenta glitch tones
      if (corrupt > 0.5){
        col = mix(col, vec3(0.1, 0.8, 0.9), 0.4 * sin(vPos.x * 3.0 + time * 2.0));
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

// ─────────── glitch post-process on canvas
let corruptionTimer = 0;
let lastFrameData = null;

function applyGlitchEffects(ctx, w, h, t){
  const imageData = ctx.getImageData(0, 0, w, h);
  const d = imageData.data;

  // 1. JPEG-style 8x8 block displacement in random zones
  const BLOCK = 8;
  for (let by = 0; by < Math.floor(h / BLOCK); by++){
    for (let bx = 0; bx < Math.floor(w / BLOCK); bx++){
      if (Math.random() < 0.08){   // 8% of blocks corrupted
        const sx = bx * BLOCK, sy = by * BLOCK;
        const dx = sx + Math.floor((Math.random() - 0.5) * 24);
        const dy = sy + Math.floor((Math.random() - 0.5) * 24);
        for (let i = 0; i < BLOCK; i++){
          for (let j = 0; j < BLOCK; j++){
            const srcIdx = ((sy + i) * w + (sx + j)) * 4;
            const dstX = Math.max(0, Math.min(w-1, dx + j));
            const dstY = Math.max(0, Math.min(h-1, dy + i));
            const dstIdx = (dstY * w + dstX) * 4;
            d[dstIdx] = d[srcIdx];
            d[dstIdx+1] = d[srcIdx+1];
            d[dstIdx+2] = d[srcIdx+2];
          }
        }
      }
    }
  }

  // 2. RGB channel separation (chromatic aberration on steroids)
  const tempR = new Uint8ClampedArray(w * h);
  const tempG = new Uint8ClampedArray(w * h);
  const tempB = new Uint8ClampedArray(w * h);
  for (let i = 0; i < w * h; i++){
    tempR[i] = d[i*4];
    tempG[i] = d[i*4+1];
    tempB[i] = d[i*4+2];
  }
  const shiftR = Math.floor(8 * Math.sin(t * 0.7));
  const shiftG = 0;
  const shiftB = Math.floor(-8 * Math.cos(t * 0.5));
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i = y * w + x;
      const xR = Math.max(0, Math.min(w-1, x + shiftR));
      const xB = Math.max(0, Math.min(w-1, x + shiftB));
      d[i*4]   = tempR[y * w + xR];
      d[i*4+1] = tempG[i];
      d[i*4+2] = tempB[y * w + xB];
    }
  }

  // 3. Vertical pixel stretch on corruption event (zalgo-like)
  if (corruptionTimer > 0){
    for (let x = 0; x < w; x++){
      if (Math.random() < 0.15){
        const stretchH = Math.floor(Math.random() * 40 + 10);
        const srcY = Math.floor(Math.random() * h);
        const srcIdx = (srcY * w + x) * 4;
        const r = d[srcIdx], g = d[srcIdx+1], b = d[srcIdx+2];
        for (let dy = 0; dy < stretchH; dy++){
          const dstY = Math.max(0, Math.min(h-1, srcY + dy));
          const dstIdx = (dstY * w + x) * 4;
          d[dstIdx] = r; d[dstIdx+1] = g; d[dstIdx+2] = b;
        }
      }
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

// ─────────── frame-skip jitter (datamosh-style hold old frame)
function maybeFrameSkip(){
  if (Math.random() < 0.03){   // 3% chance each frame
    return true;
  }
  return false;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let skipFrames = 0;

function loop(){
  const t = (performance.now() - start) / 1000;

  // physics step
  for (let s = 0; s < 2; s++) step();

  // rebuild tube
  if (verts.length > 8){
    let yMin = Infinity, yMax = -Infinity;
    for (const v of verts){ if (v.y < yMin) yMin = v.y; if (v.y > yMax) yMax = v.y; }
    const yRange = Math.max(yMax - yMin, 0.1);
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
    const N_SAMPLES = Math.min(600, verts.length * 2);
    const RADIAL = 7;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i = 0; i < N_SAMPLES; i++){
      const tt = i / N_SAMPLES;
      const p = curve.getPointAt(tt);
      const heightFrac = Math.max(0, Math.min(1, (p.y - yMin) / yRange));
      let r = 0.38 * (1 - heightFrac * 0.75);
      const node = Math.sin(tt * 20.0) * 0.5 + 0.5;
      r *= (1.0 + 0.16 * Math.pow(node, 5));
      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        positions[(i * RADIAL + j) * 3]     = v.x;
        positions[(i * RADIAL + j) * 3 + 1] = v.y;
        positions[(i * RADIAL + j) * 3 + 2] = v.z;
      }
    }
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    if (tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  // trigger corruption event every ~8 seconds
  if (Math.floor(t) % 8 === 0 && Math.floor(t * 10) % 80 < 2){
    corruptionTimer = 1.2;  // 1.2 seconds of corruption
    tubeMat.uniforms.corrupt.value = 1.0;
  }
  if (corruptionTimer > 0){
    corruptionTimer -= 0.016;
    if (corruptionTimer <= 0){
      tubeMat.uniforms.corrupt.value = 0.0;
    }
  }

  // camera follows centroid
  let yMean = 0; for (const v of verts) yMean += v.y; yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 3.0);
  camera.position.y += (targetY + 3 - camera.position.y) * 0.03;
  camera.lookAt(0, targetY, 0);

  tubeMat.uniforms.time.value = t;

  // frame-skip jitter (datamosh hold)
  if (skipFrames > 0){
    skipFrames--;
  } else {
    if (maybeFrameSkip()){
      skipFrames = Math.floor(Math.random() * 4 + 2);  // hold 2-5 frames
    }
    renderer.render(scene, camera);
    const ctx = renderer.domElement.getContext('2d', { willReadFrequently: true });
    applyGlitchEffects(ctx, renderer.domElement.width, renderer.domElement.height, t);
  }

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
