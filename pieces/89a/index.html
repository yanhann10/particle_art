<!-- MOTION: growth, intensity: gentle -->
<style>

  body {
    background:
      radial-gradient(ellipse at 28% 35%, #fdfaf0 0%, #f5ead5 42%, #d4b88a 82%, #7a5634 100%),

  }

<script type="module">
import * as THREE from 'three';

// Differential growth membrane emitting curl-traced ink strokes — each vertex
// birth event spawns a flourish. The membrane breathes and pulses organically
// while ink traces curl away from its surface. Biomorphic motion: peristaltic
// waves, vascular pulsing, slow tidal expansion. Not algorithmic redraws.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── DIFFERENTIAL GROWTH MEMBRANE
// Vertices connected in a loop, each has target_distance to neighbors.
// On each frame: if distance > threshold, insert new vertex → emit ink stroke.
// Forces: collision repulsion + cohesion pull + drift from curl field.

class DiffGrowthMembrane {
  constructor(){
    this.vertices = [];
    this.targetDist = 0.14;
    this.splitThreshold = 0.24;
    this.minDist = 0.08;
    this.seed = Math.random() * 1e6;
    // start with a small circle
    const n0 = 24;
    const r0 = 1.2;
    for (let i = 0; i < n0; i++){
      const a = (i / n0) * Math.PI * 2;
      this.vertices.push({
        x: Math.cos(a) * r0,
        y: Math.sin(a) * r0,
        vx: 0, vy: 0,
        age: 0,
        birthTime: 0
      });
    }
  }
  step(time){
    const n = this.vertices.length;
    if (n > 1200) return []; // cap to prevent runaway
    // collision + cohesion
    for (let i = 0; i < n; i++){
      const v = this.vertices[i];
      v.vx *= 0.85; v.vy *= 0.85;
      // repulsion
      for (let j = 0; j < n; j++){
        if (i === j) continue;
        const u = this.vertices[j];
        const dx = v.x - u.x, dy = v.y - u.y;
        const d = Math.sqrt(dx*dx + dy*dy) + 1e-6;
        if (d < this.minDist * 2.0){
          const f = (this.minDist * 2.0 - d) / d * 0.012;
          v.vx += dx * f; v.vy += dy * f;
        }
      }
      // cohesion to neighbors
      const prev = this.vertices[(i - 1 + n) % n];
      const next = this.vertices[(i + 1) % n];
      const cx = (prev.x + next.x) * 0.5 - v.x;
      const cy = (prev.y + next.y) * 0.5 - v.y;
      v.vx += cx * 0.015; v.vy += cy * 0.015;
      // curl drift — organic breathing field
      const angle = time * 0.3 + Math.sin(v.x * 1.8 + time * 0.2) * 2.0;
      const curlX = Math.cos(angle) * 0.006;
      const curlY = Math.sin(angle) * 0.006;
      v.vx += curlX; v.vy += curlY;
      // peristaltic pulse — radial expansion/contraction
      const r = Math.sqrt(v.x*v.x + v.y*v.y) + 1e-6;
      const pulse = Math.sin(time * 0.4 + r * 2.2) * 0.008;
      v.vx += (v.x / r) * pulse;
      v.vy += (v.y / r) * pulse;
    }
    // integrate
    for (let v of this.vertices){
      v.x += v.vx; v.y += v.vy;
      v.age += 0.016;
    }
    // split edges that exceed threshold → emit ink strokes at birth
    const newStrokes = [];
    let i = 0;
    while (i < this.vertices.length){
      const v0 = this.vertices[i];
      const v1 = this.vertices[(i + 1) % this.vertices.length];
      const dx = v1.x - v0.x, dy = v1.y - v0.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d > this.splitThreshold){
        const mid = {
          x: (v0.x + v1.x) * 0.5,
          y: (v0.y + v1.y) * 0.5,
          vx: (v0.vx + v1.vx) * 0.5,
          vy: (v0.vy + v1.vy) * 0.5,
          age: 0,
          birthTime: time
        };
        this.vertices.splice(i + 1, 0, mid);
        // emit ink stroke from birth site
        newStrokes.push({ x: mid.x, y: mid.y, t: time });
        i += 2;
      } else {
        i++;
      }
    }
    return newStrokes;
  }
  getPositions(){
    const arr = [];
    for (let v of this.vertices){
      arr.push(v.x, v.y, 0);
    }
    return new Float32Array(arr);
  }
}

const membrane = new DiffGrowthMembrane();

// membrane line render
const membraneGeom = new THREE.BufferGeometry();
const membranePos = membrane.getPositions();
membraneGeom.setAttribute('position', new THREE.BufferAttribute(membranePos, 3));
const membraneMat = new THREE.LineBasicMaterial({ color: 0x1a0e06, transparent: true, opacity: 0.65, linewidth: 2 });
const membraneLine = new THREE.LineLoop(membraneGeom, membraneMat);
scene.add(membraneLine);

// ────────────── INK STROKES — curl-traced lines emitted from vertex births
// Each stroke is a sequence of points following a curl-noise field.
class InkStroke {
  constructor(x, y, birthTime){
    this.points = [{ x, y, z: 0 }];
    this.birthTime = birthTime;
    this.seed = Math.random() * 1e5;
    this.maxLength = 60 + Math.random() * 80;
    this.dead = false;
  }
  step(time, dt){
    if (this.dead) return;
    const head = this.points[this.points.length - 1];
    // curl field with time + seed offset
    const t = time + this.seed * 0.1;
    const angle = t * 0.8 + Math.sin(head.x * 2.3 + t * 0.3) * 3.0 + Math.cos(head.y * 1.9 + t * 0.25) * 2.5;
    const vx = Math.cos(angle) * 0.025;
    const vy = Math.sin(angle) * 0.025;
    // slight outward bias from membrane centroid
    const cx = 0, cy = 0;
    const dx = head.x - cx, dy = head.y - cy;
    const r = Math.sqrt(dx*dx + dy*dy) + 1e-6;
    const biasX = (dx / r) * 0.008;
    const biasY = (dy / r) * 0.008;
    const nx = head.x + vx + biasX;
    const ny = head.y + vy + biasY;
    this.points.push({ x: nx, y: ny, z: 0 });
    if (this.points.length > this.maxLength) this.dead = true;
  }
  getGeometry(){
    const arr = [];
    for (let p of this.points) arr.push(p.x, p.y, p.z);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    return geom;
  }
}

const inkStrokes = [];
const inkLines = [];

// ────────────── DUST MOTES
const N_DUST = 180;
const dustGeom = new THREE.BufferGeometry();
const dustPos = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random() - 0.5) * 16;
  dustPos[i*3 + 1] = (Math.random() - 0.5) * 10;
  dustPos[i*3 + 2] = (Math.random() - 0.5) * 10;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.08 + seed * 6.28;
      p.x += sin(t * 1.2 + seed * 28.0) * 0.5;
      p.y -= mod(uTime * 0.06 + seed * 6.0, 5.0) - 2.5;
      p.z += cos(t * 1.05 + seed * 21.0) * 0.4;
      float sx = -p.x / 8.0;
      float sy =  p.y / 5.0;
      vGlow = clamp(0.25 + 0.60 * smoothstep(-0.2, 0.65, sx + sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.9 + 1.3 * vGlow) * uPixel * (5.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 22.0);
      vec3 col = vec3(1.00, 0.95, 0.80) * vGlow;
      gl_FragColor = vec4(col, a * 0.68 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── LOOP
const start = performance.now();
let lastTime = 0;
function loop(){
  const now = performance.now();
  const t = (now - start) / 1000;
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  dustMat.uniforms.uTime.value = t;
  // step membrane
  const newStrokes = membrane.step(t);
  for (let s of newStrokes){
    const stroke = new InkStroke(s.x, s.y, s.t);
    inkStrokes.push(stroke);
  }
  // update membrane line
  const mpos = membrane.getPositions();
  membraneGeom.setAttribute('position', new THREE.BufferAttribute(mpos, 3));
  membraneGeom.attributes.position.needsUpdate = true;
  // step ink strokes
  for (let stroke of inkStrokes){
    if (!stroke.dead) stroke.step(t, dt);
  }
  // cull old strokes that have faded
  const aliveCutoff = t - 12.0;
  for (let i = inkStrokes.length - 1; i >= 0; i--){
    if (inkStrokes[i].birthTime < aliveCutoff){
      if (inkLines[i]){
        scene.remove(inkLines[i]);
        inkLines[i].geometry.dispose();
        inkLines[i].material.dispose();
      }
      inkStrokes.splice(i, 1);
      inkLines.splice(i, 1);
    }
  }
  // update/create ink line meshes
  for (let i = 0; i < inkStrokes.length; i++){
    const stroke = inkStrokes[i];
    if (!inkLines[i]){
      const geom = stroke.getGeometry();
      const age = t - stroke.birthTime;
      const fade = Math.min(age / 1.5, 1.0);
      const mat = new THREE.LineBasicMaterial({ color: 0x2a1608, transparent: true, opacity: 0.55 * fade, linewidth: 1 });
      const line = new THREE.Line(geom, mat);
      scene.add(line);
      inkLines[i] = line;
    } else {
      const geom = stroke.getGeometry();
      inkLines[i].geometry.dispose();
      inkLines[i].geometry = geom;
      const age = t - stroke.birthTime;
      const fade = Math.min(age / 1.5, 1.0);
      const decay = Math.max(0, 1.0 - (age - 8.0) / 4.0);
      inkLines[i].material.opacity = 0.55 * fade * decay;
    }
  }
  // camera gentle drift
  camera.position.x = Math.sin(t * 0.04) * 0.5;
  camera.position.y = 0.3 + Math.sin(t * 0.035 + 1.2) * 0.35;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
