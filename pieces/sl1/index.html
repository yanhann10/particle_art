<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sl1 · Shiota — Thread Constellation</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">sl1</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0035);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.004));
const key1 = new THREE.PointLight(0x220606, 0.012, 28, 2.0);
key1.position.set(-12, 14, 6);
scene.add(key1);

const key2 = new THREE.PointLight(0x100404, 0.008, 24, 2.2);
key2.position.set(10, -8, -12);
scene.add(key2);

let seed = 892347;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 42, h: 24, d: 38 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED SPHERE — cream-white luminous core
const spherePos = new THREE.Vector3(0, 0.4, -0.8);
const sphereGeo = new THREE.SphereGeometry(1.2, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xe8dcd0,
  emissive: 0xc8b8a8,
  emissiveIntensity: 0.72,
  roughness: 0.88,
  metalness: 0.06
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(spherePos);
scene.add(sphere);

const sphereGlow = new THREE.PointLight(0x1e0606, 0.010, 14, 2.4);
sphereGlow.position.copy(spherePos);
scene.add(sphereGlow);

// SPHERE SURFACE ANCHORS — geodesic sampling
const sphereAnchors = [];
const PHI = (1 + Math.sqrt(5))/2;
const icoVerts = [
  [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
  [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
  [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]
];
for(let i=0; i<icoVerts.length; i++){
  const v = new THREE.Vector3(...icoVerts[i]).normalize().multiplyScalar(1.2);
  sphereAnchors.push(spherePos.clone().add(v));
}
// Additional latitude rings
for(let lat=0; lat<5; lat++){
  const theta = (lat+1)/6 * Math.PI;
  const r = Math.sin(theta)*1.2;
  const y = Math.cos(theta)*1.2;
  const count = 8 + lat*2;
  for(let i=0; i<count; i++){
    const phi = i/count * Math.PI*2;
    const x = Math.cos(phi)*r;
    const z = Math.sin(phi)*r;
    sphereAnchors.push(spherePos.clone().add(new THREE.Vector3(x, y, z)));
  }
}

// WALL ANCHORS — vertex-based placement on room faces
const anchors = [];

function gridAnchors(face, uSteps, vSteps){
  const pts = [];
  for(let i=0; i<=uSteps; i++){
    for(let j=0; j<=vSteps; j++){
      const u = i/uSteps;
      const v = j/vSteps;
      let x, y, z;
      switch(face){
        case 0: x=-hw; y=(v-0.5)*ROOM.h*0.96; z=(u-0.5)*ROOM.d*0.96; break;
        case 1: x= hw; y=(v-0.5)*ROOM.h*0.96; z=(u-0.5)*ROOM.d*0.96; break;
        case 2: y=-hh; x=(u-0.5)*ROOM.w*0.96; z=(v-0.5)*ROOM.d*0.96; break;
        case 3: y= hh; x=(u-0.5)*ROOM.w*0.96; z=(v-0.5)*ROOM.d*0.96; break;
        case 4: z=-hd; x=(u-0.5)*ROOM.w*0.96; y=(v-0.5)*ROOM.h*0.96; break;
        default:z= hd; x=(u-0.5)*ROOM.w*0.96; y=(v-0.5)*ROOM.h*0.96; break;
      }
      pts.push(new THREE.Vector3(x, y, z));
    }
  }
  return pts;
}

for(let f=0; f<6; f++){
  anchors.push(...gridAnchors(f, 7, 5));
}

// RED THREAD NETWORK — 20,000 line segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to sphere top
const suspCount = 18;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2;
  const r = 0.48 + (i%4)*0.16;
  const x = spherePos.x + Math.cos(angle)*r;
  const z = spherePos.z + Math.sin(angle)*r*0.72;
  const sphereTop = new THREE.Vector3(x, spherePos.y + 1.2, z);
  
  const ceilX = sphereTop.x + (rng()-0.5)*2.8;
  const ceilZ = sphereTop.z + (rng()-0.5)*2.4;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, sphereTop);
}

// RADIAL THREADS — sphere out to walls (circulatory system)
for(let i=0; i<sphereAnchors.length && li<NUM_LINES-18800; i++){
  const sa = sphereAnchors[i];
  const dir = sa.clone().sub(spherePos).normalize();
  
  // Primary radial
  const len1 = 16.0 + rng()*12.0;
  const end1 = sa.clone().add(dir.clone().multiplyScalar(len1));
  setLine(sa, end1);
  
  // Secondary branch at 60%
  if(rng()<0.48 && li<NUM_LINES-18600){
    const branch = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.62 + rng()*0.48
    ).normalize();
    const mid = sa.clone().add(dir.clone().multiplyScalar(len1*0.6));
    const end2 = mid.clone().add(branch.multiplyScalar(8.4 + rng()*6.0));
    setLine(mid, end2);
  }
}

// CONVERGENT THREADS — anchors to nearest sphere point
const convergeBudget = 4200;
for(let i=0; i<convergeBudget && li<NUM_LINES-14000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dSphere = a.distanceTo(spherePos);
  if(dSphere < 4.0) continue;
  
  let closest = sphereAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<6; k++){
    const candidate = sphereAnchors[Math.floor(rng()*sphereAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 18% fail to reach
  if(rng()<0.18){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.32 + rng()*0.52);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// MERIDIAN THREADS — vertical great circles through sphere
const meridians = 12;
for(let m=0; m<meridians; m++){
  const angle = m/meridians * Math.PI*2;
  const steps = 24;
  let prev = null;
  for(let s=0; s<=steps; s++){
    const theta = s/steps * Math.PI;
    const r = Math.sin(theta)*1.2;
    const y = Math.cos(theta)*1.2;
    const x = Math.cos(angle)*r;
    const z = Math.sin(angle)*r;
    const pt = spherePos.clone().add(new THREE.Vector3(x, y, z));
    if(prev && li<NUM_LINES-9800){
      setLine(prev, pt);
    }
    prev = pt;
  }
}

// LATITUDE THREADS — horizontal circles through sphere
const latitudes = 10;
for(let lat=0; lat<latitudes; lat++){
  const theta = (lat+0.5)/latitudes * Math.PI;
  const r = Math.sin(theta)*1.2;
  const y = Math.cos(theta)*1.2;
  const steps = 18;
  let prev = null;
  let first = null;
  for(let s=0; s<=steps; s++){
    const phi = s/steps * Math.PI*2;
    const x = Math.cos(phi)*r;
    const z = Math.sin(phi)*r;
    const pt = spherePos.clone().add(new THREE.Vector3(x, y, z));
    if(s===0) first = pt;
    if(prev && li<NUM_LINES-9200){
      setLine(prev, pt);
    }
    prev = pt;
  }
  if(first && prev && li<NUM_LINES-9200){
    setLine(prev, first);
  }
}

// ANCHOR-TO-ANCHOR WEB — proximity network
const THRESH = 8.8;
let webCount = 0, attempts = 0;
while(webCount<3600 && li<NUM_LINES-5000 && attempts<18000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.0 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// HORIZONTAL THREADS — crossing the void
for(let i=0; i<680 && li<NUM_LINES-4000; i++){
  const y = spherePos.y + (rng()-0.5)*10.0;
  const x1 = -hw + rng()*5.2;
  const z1 = (rng()-0.5)*ROOM.d*0.94;
  const x2 = hw - rng()*5.2;
  const z2 = (rng()-0.5)*ROOM.d*0.94;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS
for(let i=0; i<520 && li<NUM_LINES-3200; i++){
  const x = (rng()-0.5)*ROOM.w*0.92;
  const z = (rng()-0.5)*ROOM.d*0.92;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.6, hh, z + (rng()-0.5)*1.6);
  setLine(a, b);
}

// DIAGONAL CROSS-THREADS
for(let i=0; i<460 && li<NUM_LINES-2600; i++){
  const x1 = (rng()-0.5)*ROOM.w*0.90;
  const z1 = (rng()-0.5)*ROOM.d*0.90;
  const a = new THREE.Vector3(x1, -hh, z1);
  
  const x2 = x1 + (rng()-0.5)*9.2;
  const z2 = z1 + (rng()-0.5)*9.2;
  const b = new THREE.Vector3(x2, hh, z2);
  setLine(a, b);
}

// WALL-TO-WALL SPANS
let wallSpans = 0;
while(wallSpans<2200 && li<NUM_LINES-400){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>9.0 && d<24.0){
    setLine(a, b);
    wallSpans++;
  }
}

// FILL remaining budget
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.0 && d<18.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.068,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — slow drift inside the network
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.28){
    const lt = t/0.28;
    const angle = Math.PI*0.12 + lt*Math.PI*0.88;
    const r = 19.4 - lt*7.2;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 9.2 - lt*6.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.54){
    const lt = (t-0.28)/0.26;
    const angle = Math.PI*1.00 + lt*Math.PI*1.32;
    const r = 12.2 + Math.sin(lt*Math.PI*1.6)*2.0;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 1.8 + Math.cos(lt*Math.PI*1.8)*1.8;
    z = spherePos.z + Math.sin(angle)*r;
  } else if(t<0.78){
    const lt = (t-0.54)/0.24;
    const angle = Math.PI*2.32 + lt*Math.PI*0.98;
    const r = 10.8 + Math.cos(lt*Math.PI)*2.2;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y - 1.6 - lt*7.6;
    z = spherePos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.78)/0.22;
    const angle = Math.PI*3.30 + lt*Math.PI*0.82;
    const r = 10.2 + lt*8.8;
    x = spherePos.x + Math.cos(angle)*r;
    y = spherePos.y + 3.8 + lt*5.8;
    z = spherePos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Sphere subtle rotation
  sphere.rotation.y = Math.sin(elapsed*0.000032)*0.05;
  sphere.rotation.x = Math.cos(elapsed*0.000038)*0.04;

  // Camera dolly
  const speed = 0.000008;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    spherePos.x + Math.sin(elapsed*0.000048)*0.12,
    spherePos.y + Math.cos(elapsed*0.000042)*0.10,
    spherePos.z + Math.sin(elapsed*0.000036)*0.08
  );

  key1.intensity = 0.012 + Math.sin(elapsed*0.000038)*0.0036;
  sphereGlow.intensity = 0.010 + Math.sin(elapsed*0.000046)*0.0032;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
