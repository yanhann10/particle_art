<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twz · mythic · Kiefer tower</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">twz</div>
<div class="hint">drag to orbit · scroll to zoom · click to pause/resume</div>
<div class="src">from 5gm · Kiefer ash-lead tower · differential growth</div>
<div class="stat" id="stat">vertices=0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.032);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 10, 16);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// ─────────────────────────── curve state (full 3D) from 5gm
const MAX_VERTS = 4000;
const ATTRACT  = 0.06;
const REPEL_R  = 0.42;
const REPEL_STR= 0.12;
const NOISE    = 0.003;
const PRESSURE = 0.0028;
const RISE     = 0.0045;
const MAX_D    = 0.32;
let paused = false;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function gkey(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = gkey(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++)
    for (let dy=-1; dy<=1; dy++)
      for (let dz=-1; dz<=1; dz++){
        const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if (arr) for (const idx of arr) out.push(idx);
      }
  return out;
}

function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    const cands = neighbors(v);
    for (const j of cands){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x+b.x-2*v.x)*ATTRACT;
    dy[i] += (a.y+b.y-2*v.y)*ATTRACT;
    dz[i] += (a.z+b.z-2*v.z)*ATTRACT;
  }
  let ccx=0, ccy=0, ccz=0;
  for (let i = 0; i < n; i++){ ccx+=verts[i].x; ccy+=verts[i].y; ccz+=verts[i].z; }
  ccx/=n; ccy/=n; ccz/=n;
  for (let i = 0; i < n; i++){
    const ox=verts[i].x-ccx, oy=verts[i].y-ccy, oz=verts[i].z-ccz;
    const d = Math.hypot(ox,oy,oz)+1e-6;
    dx[i] += (ox/d)*PRESSURE;
    dy[i] += (oy/d)*PRESSURE*0.4;
    dz[i] += (oz/d)*PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a*1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE*0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.0012;
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez > MAX_D*MAX_D && verts.length+grown.length < MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
                   age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

for (let s = 0; s < 800; s++) step();
addEventListener('click', () => { paused = !paused; });

// ─── 1D vein noise: precompute a looping noise band for gold-leaf seams
// Uses layered sine waves keyed to curve index for streak clustering
const VEIN_TABLE_SIZE = 512;
const veinTable = new Float32Array(VEIN_TABLE_SIZE);
for (let i = 0; i < VEIN_TABLE_SIZE; i++){
  const t = i / VEIN_TABLE_SIZE * Math.PI * 2;
  // layered frequencies → clustered streaks, not uniform sparkle
  let v = 0.5 * Math.sin(t * 3.0 + 1.7) + 0.3 * Math.sin(t * 7.0 + 0.3)
        + 0.2 * Math.sin(t * 13.0 + 4.1) + 0.15 * Math.sin(t * 23.0 + 2.8);
  // sharpen into streaks: raise to power, threshold
  v = Math.max(0, v);
  v = Math.pow(v, 2.5);
  veinTable[i] = v;
}
function sampleVein(curveU){ // curveU in [0,1]
  const fi = ((curveU % 1.0) + 1.0) % 1.0 * VEIN_TABLE_SIZE;
  const i0 = Math.floor(fi) % VEIN_TABLE_SIZE;
  const i1 = (i0 + 1) % VEIN_TABLE_SIZE;
  const frac = fi - Math.floor(fi);
  return veinTable[i0] * (1 - frac) + veinTable[i1] * frac;
}

// ─── tower particles: 50k
const N_RENDER = 50000;
const rPos = new Float32Array(N_RENDER * 3);
const rSeed = new Float32Array(N_RENDER);
const rAge = new Float32Array(N_RENDER);
const rHeight = new Float32Array(N_RENDER);
const rVein = new Float32Array(N_RENDER); // gold vein intensity per particle
for (let i = 0; i < N_RENDER; i++) rSeed[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeed, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('hgt',      new THREE.BufferAttribute(rHeight, 1));
geom.setAttribute('vein',     new THREE.BufferAttribute(rVein, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uYMax:  { value: 1 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uYMax;
    attribute float seed;
    attribute float age;
    attribute float hgt;
    attribute float vein;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.3 + seed * 6.28;
      p.x += 0.004 * sin(t);
      p.z += 0.004 * cos(t);

      float h = clamp(hgt / max(uYMax, 0.5), 0.0, 1.0);

      // Kiefer palette: charcoal ash at base → lead grey mid → burnt ochre crest
      vec3 ash    = vec3(0.18, 0.16, 0.14);   // charcoal
      vec3 lead   = vec3(0.38, 0.36, 0.33);   // lead grey
      vec3 ochre  = vec3(0.62, 0.44, 0.22);   // burnt sienna/ochre
      vec3 col = mix(ash, lead, smoothstep(0.0, 0.5, h));
      col = mix(col, ochre, smoothstep(0.5, 0.95, h));

      // Gold-leaf vein seams: routed through 1D noise along curve index
      // vein attribute carries clustered intensity — reads as linear seams not sparkle
      vec3 gold = vec3(0.85, 0.72, 0.28);
      float veinGlow = vein * smoothstep(0.75, 0.92, h); // veins only near crest
      col = mix(col, gold, clamp(veinGlow * 1.8, 0.0, 1.0));

      vCol = col;
      // slightly brighter at height for monumental drama
      vAlpha = mix(0.45, 0.7, h) + veinGlow * 0.3;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.3 + veinGlow * 0.8) * uPixel * (40.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      // manual fog mixing (avoid fog:true compile issues)
      vec3 fogCol = vec3(0.039, 0.035, 0.031);
      float fogFactor = 1.0;
      gl_FragColor = vec4(mix(fogCol, vCol, fogFactor) * a, a);
    }
  `
});
const towerPts = new THREE.Points(geom, mat);
scene.add(towerPts);

// ─── cinder / ash fall system: 8k particles that shed from the tower
// and ACCUMULATE at the base (Kiefer's ruin-at-the-foot)
const N_CINDER = 8000;
const cPos    = new Float32Array(N_CINDER * 3);
const cVel    = new Float32Array(N_CINDER * 3);
const cLife   = new Float32Array(N_CINDER);   // 0→1 lifecycle
const cSeed   = new Float32Array(N_CINDER);
const cGround = new Float32Array(N_CINDER);   // 1 if settled on ground
for (let i = 0; i < N_CINDER; i++){
  cSeed[i] = Math.random();
  cLife[i] = Math.random(); // stagger initial lives
  cGround[i] = 0;
  // init offscreen
  cPos[i*3] = 0; cPos[i*3+1] = -10; cPos[i*3+2] = 0;
  cVel[i*3] = 0; cVel[i*3+1] = 0; cVel[i*3+2] = 0;
}

const cGeom = new THREE.BufferGeometry();
cGeom.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
cGeom.setAttribute('seed',     new THREE.BufferAttribute(cSeed, 1));
cGeom.setAttribute('life',     new THREE.BufferAttribute(cLife, 1));
cGeom.setAttribute('grounded', new THREE.BufferAttribute(cGround, 1));

const cUniforms = { uTime: uniforms.uTime, uPixel: uniforms.uPixel };
const cMat = new THREE.ShaderMaterial({
  uniforms: cUniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float life;
    attribute float grounded;
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec3 p = position;
      float t = uTime * 0.2 + seed * 6.28;
      if (grounded < 0.5) {
        p.x += 0.003 * sin(t * 2.0);
        p.z += 0.003 * cos(t * 1.7);
      }
      // falling ash: warm grey fading
      // grounded ash: stays visible longer, pools at base
      vec3 ashCol = vec3(0.35, 0.30, 0.25);
      vec3 groundCol = vec3(0.22, 0.18, 0.14);
      vCol = mix(ashCol, groundCol, grounded);

      // grounded particles stay highly visible (Kiefer accumulation)
      float fallAlpha = (1.0 - life) * 0.5;
      float groundAlpha = 0.38; // persistent debris
      vA = mix(fallAlpha, groundAlpha, grounded);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float sz = mix(1.0, 1.6, grounded); // grounded ash slightly larger
      gl_PointSize = sz * uPixel * (35.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vA;
    varying vec3 vCol;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vA;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const cinderPts = new THREE.Points(cGeom, cMat);
scene.add(cinderPts);

// cinder simulation: spawn from tower upper region, fall, settle at base
function spawnCinder(i, yMax){
  const n = verts.length;
  if (n < 2) return;
  // pick a random vertex in the upper 40% of the tower
  const minSpawnY = yMax * 0.6;
  let tries = 0, vi = 0;
  do { vi = Math.floor(Math.random() * n); tries++; }
  while (verts[vi].y < minSpawnY && tries < 20);
  const v = verts[vi];
  cPos[i*3]   = v.x + (Math.random()-0.5)*0.3;
  cPos[i*3+1] = v.y + (Math.random()-0.5)*0.2;
  cPos[i*3+2] = v.z + (Math.random()-0.5)*0.3;
  // slow downward + slight outward drift
  const ang = Math.random() * Math.PI * 2;
  cVel[i*3]   = Math.cos(ang) * 0.006;
  cVel[i*3+1] = -0.012 - Math.random() * 0.008; // fall
  cVel[i*3+2] = Math.sin(ang) * 0.006;
  cLife[i] = 0;
  cGround[i] = 0;
}

function updateCinders(dt, yMax){
  const GROUND_Y = -0.3; // ground plane slightly below y=0
  for (let i = 0; i < N_CINDER; i++){
    if (cGround[i] > 0.5){
      // grounded: very slow fade, then respawn
      cLife[i] += dt * 0.02; // very slow decay — ash lingers
      if (cLife[i] > 1.0) spawnCinder(i, yMax);
      continue;
    }
    cLife[i] += dt * 0.15;
    if (cLife[i] > 1.0){ spawnCinder(i, yMax); continue; }
    // physics
    cPos[i*3]   += cVel[i*3];
    cPos[i*3+1] += cVel[i*3+1];
    cPos[i*3+2] += cVel[i*3+2];
    cVel[i*3+1] -= 0.00008; // gentle gravity
    // wind sway
    const t = uniforms.uTime.value + cSeed[i] * 10;
    cVel[i*3]   += Math.sin(t * 0.7) * 0.0001;
    cVel[i*3+2] += Math.cos(t * 0.5) * 0.0001;
    // check ground: settle and become debris
    if (cPos[i*3+1] <= GROUND_Y){
      cPos[i*3+1] = GROUND_Y + Math.random() * 0.05;
      // spread slightly on landing
      cPos[i*3]   += (Math.random()-0.5) * 0.1;
      cPos[i*3+2] += (Math.random()-0.5) * 0.1;
      cGround[i] = 1;
      cLife[i] = 0; // restart life counter for ground persistence
    }
  }
  cGeom.attributes.position.needsUpdate = true;
  cGeom.attributes.life.needsUpdate = true;
  cGeom.attributes.grounded.needsUpdate = true;
}

// init cinders
{ const yMax = verts.reduce((m,v) => Math.max(m,v.y), 0);
  for (let i = 0; i < N_CINDER; i++) spawnCinder(i, yMax); }

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const start = performance.now();
let lastT = 0;

function loop(){
  const now = (performance.now() - start) / 1000;
  const dt = Math.min(now - lastT, 0.05);
  lastT = now;
  uniforms.uTime.value = now;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;
  let yMax = 0;
  if (n > 1){
    const lengths = []; let total = 0;
    for (let i = 0; i < n; i++){
      const a = verts[i], b = verts[(i+1)%n];
      const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
      const L = Math.sqrt(ex*ex+ey*ey+ez*ez);
      lengths.push(L); total += L;
      if (a.y > yMax) yMax = a.y;
    }
    if (total > 0){
      let written = 0;
      let cumLen = 0; // track cumulative length for vein noise lookup
      for (let i = 0; i < n; i++){
        const share = (i === n-1) ? N_RENDER - written
                    : Math.max(1, Math.floor(N_RENDER * lengths[i] / total));
        const a = verts[i], b = verts[(i+1)%n];
        const curveU = cumLen / total; // normalized position along curve
        const nextU  = (cumLen + lengths[i]) / total;
        const veinVal = sampleVein(curveU); // clustered vein intensity
        for (let k = 0; k < share && written < N_RENDER; k++){
          const u = Math.random();
          rPos[written*3]   = a.x+(b.x-a.x)*u + (Math.random()-0.5)*0.016;
          rPos[written*3+1] = a.y+(b.y-a.y)*u + (Math.random()-0.5)*0.016;
          rPos[written*3+2] = a.z+(b.z-a.z)*u + (Math.random()-0.5)*0.016;
          rAge[written]     = Math.max(a.age, b.age);
          rHeight[written]  = a.y + (b.y-a.y)*u;
          // vein intensity interpolated along segment with local variation
          const localU = curveU + (nextU - curveU) * u;
          rVein[written] = sampleVein(localU);
          written++;
        }
        cumLen += lengths[i];
      }
      geom.attributes.position.needsUpdate = true;
      geom.attributes.age.needsUpdate = true;
      geom.attributes.hgt.needsUpdate = true;
      geom.attributes.vein.needsUpdate = true;
    }
  }
  uniforms.uYMax.value = Math.max(yMax, 1.0);

  // update cinders
  updateCinders(dt, yMax);

  // camera tracking
  let yMean = 0;
  if (n > 0){ for (let i = 0; i < n; i++) yMean += verts[i].y; yMean /= n; }
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  const desiredCamY = targetY + 4;
  camera.position.y += (desiredCamY - camera.position.y) * 0.04;

  statEl.textContent = `vertices=${n} · height=${yMax.toFixed(1)} · ash=${N_CINDER}${paused?' · paused':''}`;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
