<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEW_ID · topological hair-cage</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">NEW_ID</div>
<div class="hint">drag to orbit · scroll to zoom</div>
<div class="src">topological → Mona Hatoum · 70k particles · hair-cage deformation</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────── scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// ────────────── topological cage: klein bottle as foundational geometry
// Hatoum's work centers on the domestic made strange through topological distortion.
// Rather than a literal Klein bottle, we construct a cage from hairlike curves that
// follow a non-orientable surface trajectory — the unease comes from curves that
// should be inside appearing outside, boundaries that fail to separate.

const N = 70000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const indices = new Float32Array(N);  // parametric position along curve

// Generate cage structure: 180 hair-strand curves wrapping a distorted torus
// that inverts through itself (klein-bottle-like self-intersection).
// Each strand is a continuous curve with ~390 particles.
const STRANDS = 180;
const PTS_PER_STRAND = Math.floor(N / STRANDS);

// Klein bottle parametric with Hatoum-style domestic distortion:
// the form appears as a cage of black hair, tight at poles, loose in middle,
// with strands passing through each other impossibly.
function kleinBottlePoint(u, v) {
  // u: around the tube [0, 2π]
  // v: along the length [0, 2π]
  const a = 2.5;  // major radius
  const n = 1.8;  // figure-8 parameter
  
  const cosu = Math.cos(u);
  const sinu = Math.sin(u);
  const cosv = Math.cos(v);
  const sinv = Math.sin(v);
  const cos2u = Math.cos(2*u);
  
  // Modified figure-8 klein bottle that reads as cage-like
  const r = a * (1.0 + 0.4 * Math.sin(v));
  const x = r * cosu * (1.0 + 0.3 * sinv);
  const y = r * sinu * (1.0 + 0.3 * sinv);
  const z = n * sinv * (1.0 + 0.4 * cos2u);
  
  return new THREE.Vector3(x, y, z);
}

let idx = 0;
for (let s = 0; s < STRANDS; s++) {
  const u_base = (s / STRANDS) * Math.PI * 2;
  // Each strand spirals: starts at one u, drifts slowly around
  const u_drift = 0.4 * Math.PI;
  
  for (let i = 0; i < PTS_PER_STRAND && idx < N; i++) {
    const t = i / (PTS_PER_STRAND - 1);  // [0, 1]
    const v = t * Math.PI * 2;
    const u = u_base + t * u_drift;
    
    const p = kleinBottlePoint(u, v);
    
    // Hair-like perturbation: fine-scale noise along strand
    // giving organic, drawn quality (not smooth mathematical surface)
    const hairNoise = 0.08;
    const freq = 12.0 + s * 0.3;
    const phase = s * 0.5;
    p.x += hairNoise * Math.sin(v * freq + phase);
    p.y += hairNoise * Math.cos(v * freq * 1.1 + phase * 1.3);
    p.z += hairNoise * Math.sin(v * freq * 0.9 + phase * 0.7);
    
    // Thickness variation: strands taper near ends
    const taper = Math.sin(t * Math.PI);
    const thickness = 0.02 + 0.01 * taper;
    const radial = Math.random() * thickness;
    const theta = Math.random() * Math.PI * 2;
    
    // Tangent approximation for cross-section orientation
    const eps = 0.01;
    const pNext = kleinBottlePoint(u + eps, v);
    const tangent = new THREE.Vector3().subVectors(pNext, p).normalize();
    const perp1 = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const perp2 = new THREE.Vector3().crossVectors(tangent, perp1);
    
    p.addScaledVector(perp1, Math.cos(theta) * radial);
    p.addScaledVector(perp2, Math.sin(theta) * radial);
    
    positions[idx*3] = p.x;
    positions[idx*3+1] = p.y;
    positions[idx*3+2] = p.z;
    seeds[idx] = s / STRANDS;  // strand identity
    indices[idx] = t;          // position along strand
    idx++;
  }
}

// Fill remaining with zeros
while (idx < N) {
  positions[idx*3] = 0;
  positions[idx*3+1] = 0;
  positions[idx*3+2] = 0;
  seeds[idx] = 0;
  indices[idx] = 0;
  idx++;
}

// ────────────── shader: domestic unease through slow topological breathing
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('index',    new THREE.BufferAttribute(indices, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float index;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // Hatoum's signature: slow, unsettling breathing/pulsing
      // The cage contracts and expands as if it's respiring,
      // topology deforming (strands that were inside move outside)
      float breathe = 1.0 + 0.08 * sin(uTime * 0.4 + seed * 6.28);
      p *= breathe;
      
      // Secondary twist deformation: non-orientable surface rotates through itself
      float twist = uTime * 0.15 + seed * 3.14;
      float ct = cos(twist);
      float st = sin(twist);
      float px = p.x * ct - p.y * st;
      float py = p.x * st + p.y * ct;
      p.x = px;
      p.y = py;
      
      // Gentle strand-specific undulation (hair moves independently)
      float wave = 0.12 * sin(uTime * 0.6 + seed * 12.0 + index * 8.0);
      p.z += wave;
      
      // Hatoum palette: deep burgundy-black (dried blood / oxidized iron)
      // against warm grey (steel wool / surgical instruments)
      vec3 darkHair = vec3(0.08, 0.04, 0.05);   // near-black with red undertone
      vec3 warmMetal = vec3(0.35, 0.32, 0.30);  // oxidized steel
      
      // Strands fade dark→light based on position in topology
      // (creating sense of depth and impossible intersection)
      float blend = 0.5 + 0.5 * sin(seed * 25.0 + index * 6.28);
      vCol = mix(darkHair, warmMetal, blend);
      
      // Visibility varies along strand (creates cage bars effect)
      vAlpha = 0.3 + 0.7 * sin(index * 3.14159);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      
      // Hair-fine particles, slightly thicker at strand centers
      float thickness = 0.8 + 0.4 * sin(index * 3.14);
      gl_PointSize = thickness * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      
      // Sharp hair-like particles (not soft clouds)
      float alpha = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * alpha, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── camera tracking: follow centroid as form breathes
const centroid = new THREE.Vector3();
function updateCentroid() {
  centroid.set(0, 0, 0);
  for (let i = 0; i < N; i++) {
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
}
updateCentroid();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // Camera orbits slowly, maintaining Hatoum's clinical gallery presentation
  const orbitSpeed = 0.08;
  const radius = 18;
  camera.position.x = Math.sin(t * orbitSpeed) * radius;
  camera.position.z = Math.cos(t * orbitSpeed) * radius;
  camera.position.y = Math.sin(t * orbitSpeed * 0.3) * 3;
  
  controls.target.copy(centroid);
  camera.lookAt(centroid);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
