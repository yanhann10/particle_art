<!-- MOTION: crystalline growth + geological pressure, intensity: meditative -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a1628; }

.hash { position:fixed; right:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#8a9db3; opacity:0.45; font-size:9px; letter-spacing:0.08em; z-index:5; }

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
// Deep stone gradient — night to ultramarine
const canvas = document.createElement('canvas');
canvas.width = 2;
canvas.height = 512;
const ctx = canvas.getContext('2d');
const grad = ctx.createLinearGradient(0, 0, 0, 512);
grad.addColorStop(0, '#0a1628');
grad.addColorStop(0.4, '#152844');
grad.addColorStop(0.75, '#1f3a5f');
grad.addColorStop(1, '#2a4f7a');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2, 512);
const bgTex = new THREE.CanvasTexture(canvas);
scene.background = bgTex;
scene.fog = new THREE.FogExp2(0x0a1628, 0.018);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 12, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Deep blue light — mineral luminescence
const ambLight = new THREE.AmbientLight(0x1a2f4a, 0.4);
scene.add(ambLight);
const keyLight = new THREE.DirectionalLight(0x2563a8, 1.2);
keyLight.position.set(-8, 16, 12);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x4a7fbb, 0.6);
fillLight.position.set(6, 8, -5);
scene.add(fillLight);

// ── Hash generation and seeded RNG
function generateHash(){
  let h = '';
  const chars = '0123456789abcdef';
  for(let i=0; i<64; i++) h += chars[Math.floor(Math.random()*16)];
  return h;
}

let HASH = generateHash();
document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';

// Seed RNG from hash
let rngState = 0;
for(let i=0; i<8; i++){
  rngState ^= parseInt(HASH.substring(i*8, i*8+8), 16);
}
rngState = rngState >>> 0;

function rng(){
  rngState |= 0;
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Derive crystallization parameters from hash
const NUM_FIGURES = 3 + Math.floor(rng() * 4); // 3-6 crystal formations
const JOINTS_PER_FIGURE = 16; // More nodes for angular geometry

class Figure {
  constructor(index){
    this.index = index;
    this.joints = [];
    this.springs = [];
    
    // Hash-derived initial placement — closer, denser
    const angle = (index / NUM_FIGURES) * Math.PI * 2 + rng() * 0.5;
    const radius = 5 + rng() * 4;
    const centerX = Math.cos(angle) * radius;
    const centerZ = Math.sin(angle) * radius;
    const centerY = 4 + rng() * 3;
    
    // Phase offsets — slower geological rhythms
    this.phaseX = rng() * Math.PI * 2;
    this.phaseY = rng() * Math.PI * 2;
    this.phaseZ = rng() * Math.PI * 2;
    
    // Amplitude — minimal, crystalline rigidity
    this.ampX = 0.4 + rng() * 0.8;
    this.ampY = 0.6 + rng() * 1.2;
    this.ampZ = 0.4 + rng() * 0.8;
    
    // Frequency — very slow pressure waves
    this.freqX = 0.02 + rng() * 0.04;
    this.freqY = 0.015 + rng() * 0.035;
    this.freqZ = 0.025 + rng() * 0.03;
    
    // Growth offset — mineral accretion
    this.growthPhase = rng() * Math.PI * 2;
    this.growthFreq = 0.008 + rng() * 0.012;
    this.growthAmp = 0.3 + rng() * 0.5;
    
    // Crystal lattice structure
    const layers = 4;
    const nodesPerLayer = JOINTS_PER_FIGURE / layers;
    
    for(let layer=0; layer<layers; layer++){
      const layerT = layer / (layers - 1);
      const layerY = centerY + layerT * 10 + (rng()-0.5) * 0.4;
      const layerRadius = 1.2 + layerT * 2.5 + rng() * 0.8;
      
      for(let n=0; n<nodesPerLayer; n++){
        const nodeAngle = (n / nodesPerLayer) * Math.PI * 2 + rng() * 0.3;
        const x = centerX + Math.cos(nodeAngle) * layerRadius;
        const z = centerZ + Math.sin(nodeAngle) * layerRadius;
        const y = layerY + (rng()-0.5) * 0.5;
        
        this.joints.push({
          pos: new THREE.Vector3(x, y, z),
          vel: new THREE.Vector3(),
          base: new THREE.Vector3(x, y, z),
          mass: 1.2 + rng() * 0.4, // heavier, more stable
          layer: layer
        });
      }
    }
    
    // Spring connections — crystalline lattice
    // Connect within layers
    for(let layer=0; layer<layers; layer++){
      const start = layer * nodesPerLayer;
      for(let i=0; i<nodesPerLayer; i++){
        const a = start + i;
        const b = start + ((i + 1) % nodesPerLayer);
        const restLen = this.joints[a].pos.distanceTo(this.joints[b].pos);
        const stiffness = 0.12 + rng() * 0.08; // very stiff
        const damping = 0.92 + rng() * 0.06;
        this.springs.push({ a, b, restLen, stiffness, damping });
      }
    }
    
    // Connect between layers
    for(let layer=0; layer<layers-1; layer++){
      const startA = layer * nodesPerLayer;
      const startB = (layer + 1) * nodesPerLayer;
      for(let i=0; i<nodesPerLayer; i++){
        const a = startA + i;
        const b = startB + i;
        const restLen = this.joints[a].pos.distanceTo(this.joints[b].pos);
        const stiffness = 0.10 + rng() * 0.06;
        const damping = 0.93 + rng() * 0.05;
        this.springs.push({ a, b, restLen, stiffness, damping });
        
        // Diagonal connections for rigidity
        const bNext = startB + ((i + 1) % nodesPerLayer);
        const restLen2 = this.joints[a].pos.distanceTo(this.joints[bNext].pos);
        this.springs.push({ a, b: bNext, restLen: restLen2, stiffness: 0.08 + rng() * 0.04, damping: 0.94 });
      }
    }
    
    // Lapis lazuli color — deep ultramarine with gold pyrite flecks
    const colorChoice = rng();
    if(colorChoice < 0.85){
      // Primary lapis blue
      this.color = new THREE.Color().setHSL(
        0.58 + rng() * 0.08, // blue range
        0.75 + rng() * 0.2,
        0.35 + rng() * 0.25
      );
    } else {
      // Gold pyrite inclusions
      this.color = new THREE.Color().setHSL(
        0.12 + rng() * 0.05, // gold
        0.65 + rng() * 0.25,
        0.45 + rng() * 0.2
      );
    }
  }
  
  update(time, dt){
    // Growth pulse — slow mineral accretion
    const growthScale = 1.0 + Math.sin(time * this.growthFreq + this.growthPhase) * this.growthAmp * 0.08;
    
    // Apply minimal motion — geological pressure
    for(let i=0; i<this.joints.length; i++){
      const j = this.joints[i];
      const target = j.base.clone();
      
      // Subtle pressure waves with layer-dependent phase
      const layerPhase = j.layer * Math.PI * 0.5;
      const wx = Math.sin(time * this.freqX + this.phaseX + layerPhase) * this.ampX;
      const wy = Math.cos(time * this.freqY + this.phaseY + layerPhase * 0.7) * this.ampY;
      const wz = Math.sin(time * this.freqZ + this.phaseZ + layerPhase * 1.1) * this.ampZ;
      
      target.x += wx * growthScale;
      target.y += wy * growthScale;
      target.z += wz * growthScale;
      
      // Strong attraction to maintain crystal structure
      const force = target.clone().sub(j.pos).multiplyScalar(0.15);
      j.vel.add(force.multiplyScalar(dt));
    }
    
    // Spring forces — strong for rigidity
    for(let s of this.springs){
      const ja = this.joints[s.a];
      const jb = this.joints[s.b];
      const delta = jb.pos.clone().sub(ja.pos);
      const dist = delta.length();
      if(dist < 0.01) continue;
      const force = delta.normalize().multiplyScalar((dist - s.restLen) * s.stiffness);
      ja.vel.add(force.multiplyScalar(dt / ja.mass));
      jb.vel.sub(force.multiplyScalar(dt / jb.mass));
      ja.vel.multiplyScalar(s.damping);
      jb.vel.multiplyScalar(s.damping);
    }
    
    // Integrate with high damping
    for(let j of this.joints){
      j.pos.add(j.vel.clone().multiplyScalar(dt));
      j.vel.multiplyScalar(0.94); // High damping for stability
    }
  }
}

// Create crystal formations
const figures = [];
for(let i=0; i<NUM_FIGURES; i++){
  figures.push(new Figure(i));
}

// ── Build line geometry
const totalLines = figures.reduce((sum, f) => sum + f.springs.length, 0);
const linePositions = new Float32Array(totalLines * 6);
const lineColors = new Float32Array(totalLines * 6);
let lineIdx = 0;

for(let fig of figures){
  for(let s of fig.springs){
    const idx = lineIdx * 6;
    const ja = fig.joints[s.a];
    const jb = fig.joints[s.b];
    linePositions[idx]   = ja.pos.x;
    linePositions[idx+1] = ja.pos.y;
    linePositions[idx+2] = ja.pos.z;
    linePositions[idx+3] = jb.pos.x;
    linePositions[idx+4] = jb.pos.y;
    linePositions[idx+5] = jb.pos.z;
    
    lineColors[idx]   = fig.color.r;
    lineColors[idx+1] = fig.color.g;
    lineColors[idx+2] = fig.color.b;
    lineColors[idx+3] = fig.color.r;
    lineColors[idx+4] = fig.color.g;
    lineColors[idx+5] = fig.color.b;
    
    lineIdx++;
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(lineColors, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.75,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// ── Joint point sprites
const jointGeo = new THREE.BufferGeometry();
const jointPositions = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
const jointColors = new Float32Array(figures.length * JOINTS_PER_FIGURE * 3);
let jointIdx = 0;

for(let fig of figures){
  for(let j of fig.joints){
    const idx = jointIdx * 3;
    jointPositions[idx]   = j.pos.x;
    jointPositions[idx+1] = j.pos.y;
    jointPositions[idx+2] = j.pos.z;
    
    jointColors[idx]   = fig.color.r * 1.4;
    jointColors[idx+1] = fig.color.g * 1.4;
    jointColors[idx+2] = fig.color.b * 1.4;
    
    jointIdx++;
  }
}

jointGeo.setAttribute('position', new THREE.BufferAttribute(jointPositions, 3));
jointGeo.setAttribute('color', new THREE.BufferAttribute(jointColors, 3));

const jointMat = new THREE.PointsMaterial({
  size: 0.40,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const points = new THREE.Points(jointGeo, jointMat);
scene.add(points);

// ── Stone floor
const floorGeo = new THREE.PlaneGeometry(120, 120);
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x0f1a2e,
  roughness: 0.95,
  metalness: 0.05,
  transparent: true,
  opacity: 0.35
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
scene.add(floor);

// ── Camera orbit — very slow rotation
const cameraPath = {
  radius: 38,
  height: 14,
  speed: 0.003,
  lookHeight: 8
};

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Regenerate on click
addEventListener('click', () => {
  HASH = generateHash();
  document.querySelector('.hash').textContent = HASH.substring(0,16)+'…';
  location.reload();
});

// ── Animate
const start = performance.now();
let lastTime = start;

function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;
  
  // Update all crystal formations
  for(let fig of figures){
    fig.update(elapsed, dt);
  }
  
  // Update line geometry
  lineIdx = 0;
  const posAttr = lineGeo.attributes.position;
  const posArr = posAttr.array;
  for(let fig of figures){
    for(let s of fig.springs){
      const idx = lineIdx * 6;
      const ja = fig.joints[s.a];
      const jb = fig.joints[s.b];
      posArr[idx]   = ja.pos.x;
      posArr[idx+1] = ja.pos.y;
      posArr[idx+2] = ja.pos.z;
      posArr[idx+3] = jb.pos.x;
      posArr[idx+4] = jb.pos.y;
      posArr[idx+5] = jb.pos.z;
      lineIdx++;
    }
  }
  posAttr.needsUpdate = true;
  
  // Update joint geometry
  jointIdx = 0;
  const jointPosAttr = jointGeo.attributes.position;
  const jointPosArr = jointPosAttr.array;
  for(let fig of figures){
    for(let j of fig.joints){
      const idx = jointIdx * 3;
      jointPosArr[idx]   = j.pos.x;
      jointPosArr[idx+1] = j.pos.y;
      jointPosArr[idx+2] = j.pos.z;
      jointIdx++;
    }
  }
  jointPosAttr.needsUpdate = true;
  
  // Camera slow orbit with subtle vertical oscillation
  const angle = elapsed * cameraPath.speed;
  const breathY = Math.sin(elapsed * 0.015) * 1.2;
  camera.position.set(
    Math.cos(angle) * cameraPath.radius,
    cameraPath.height + breathY,
    Math.sin(angle) * cameraPath.radius
  );
  camera.lookAt(0, cameraPath.lookHeight, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
