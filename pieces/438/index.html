<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: pulse, intensity: gentle -->
<title>438 · relational lucy · shared field</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a080c; overflow:hidden;
               color:#e5dcd2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:10; }
  .social { position:fixed; right:14px; bottom:12px; opacity:0.45; font-size:10px;
            letter-spacing:0.04em; text-align:right; line-height:1.6; z-index:10; }
  .loading { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
             font-size:13px; opacity:0.6; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading lucy …</div>
<div class="id">438</div>
<div class="social" id="social">peers: 1<br>pulses: 0</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 32);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a080c, 1);
document.body.appendChild(renderer.domElement);

/* ── social state ── */
const myId = Math.random().toString(36).slice(2, 8);
const peers = new Map(); // id → { x, y, hue, lastSeen }
let peerCount = 1;
let totalPulses = 0;
let pulseMomentum = 0;   // smoothed price delta
let pulseWave = 0;        // 0→1 on each tick, decays
let lastPrice = 0;
const socialEl = document.getElementById('social');

/* ── BroadcastChannel: tab-to-tab ── */
let bc = null;
try {
  bc = new BroadcastChannel('relational-lucy');
  bc.onmessage = (e) => {
    const d = e.data;
    if (d.type === 'presence') {
      peers.set(d.id, { x: d.x, y: d.y, hue: d.hue, lastSeen: performance.now() });
    } else if (d.type === 'leave') {
      peers.delete(d.id);
    }
  };
  addEventListener('beforeunload', () => { bc.postMessage({ type: 'leave', id: myId }); });
} catch(e) { /* BroadcastChannel not supported — solo mode */ }

const myHue = Math.random();
let mouseNorm = { x: 0, y: 0 };
addEventListener('mousemove', (e) => {
  mouseNorm.x = (e.clientX / innerWidth - 0.5) * 2;
  mouseNorm.y = -(e.clientY / innerHeight - 0.5) * 2;
});

/* ── WebSocket: Binance BTC ticker for external pulse ── */
let ws = null;
let wsConnected = false;
let ticksPerSec = 0;
let tickCounter = 0;
let lastTickReset = performance.now();

function connectWS() {
  try {
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onopen = () => { wsConnected = true; };
    ws.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        const price = parseFloat(d.p);
        if (lastPrice > 0) {
          const delta = (price - lastPrice) / lastPrice;
          pulseMomentum = pulseMomentum * 0.92 + delta * 800;
          pulseWave = Math.min(1.0, pulseWave + 0.3);
        }
        lastPrice = price;
        totalPulses++;
        tickCounter++;
      } catch(err) {}
    };
    ws.onclose = () => { wsConnected = false; setTimeout(connectWS, 5000); };
    ws.onerror = () => { ws.close(); };
  } catch(e) { /* WebSocket blocked — solo mode */ }
}
connectWS();

/* ── particles ── */
const N = 60000;
const positions     = new Float32Array(N * 3);
const restPositions = new Float32Array(N * 3);
const seeds         = new Float32Array(N);

const uniforms = {
  uTime:      { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uReady:     { value: 0.0 },
  uPulse:     { value: 0.0 },       // market pulse wave
  uMomentum:  { value: 0.0 },       // price direction: neg=cool, pos=warm
  uPeerCount: { value: 1.0 },
  uPeerA:     { value: new THREE.Vector3(0,0,0) }, // up to 3 peer attractors
  uPeerB:     { value: new THREE.Vector3(0,0,0) },
  uPeerC:     { value: new THREE.Vector3(0,0,0) },
  uPeerAlpha: { value: new THREE.Vector3(0,0,0) }, // per-peer activity
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uReady, uPulse, uMomentum, uPeerCount;
    uniform vec3 uPeerA, uPeerB, uPeerC, uPeerAlpha;
    attribute vec3 rest;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = rest;
      float t = uTime * 0.4 + seed * 6.2831;

      // breathing — amplitude grows with peer count (more alive when watched)
      float breathAmp = 0.04 + 0.03 * min(uPeerCount, 5.0);
      vec3 dir = normalize(p + vec3(0.001));
      p += dir * sin(t) * breathAmp * (1.0 + 0.4 * sin(seed * 11.0));

      // market pulse: radial shock wave from center
      float dist = length(p);
      float wave = sin(dist * 1.8 - uTime * 3.0) * uPulse * 0.6;
      p += dir * wave;

      // peer gravity wells — each peer pulls particles gently
      vec3 toA = uPeerA - p;
      p += toA * uPeerAlpha.x * 0.012;
      vec3 toB = uPeerB - p;
      p += toB * uPeerAlpha.y * 0.012;
      vec3 toC = uPeerC - p;
      p += toC * uPeerAlpha.z * 0.012;

      // reveal: particles fly in from scattered sphere
      vec3 entry = vec3(sin(seed*40.0), cos(seed*30.0), sin(seed*22.0)) * 20.0;
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      // palette: Bourriaud's relational warmth — ivory/amber base
      // shifts cooler (teal) on price drop, warmer (ember) on rise
      float energy = 0.4 + 0.6 * sin(t * 0.7);
      float mom = clamp(uMomentum, -1.0, 1.0);

      // warm base: ivory → amber → ember
      vec3 warm1 = vec3(0.95, 0.90, 0.82);
      vec3 warm2 = vec3(0.96, 0.72, 0.45);
      vec3 warm3 = vec3(0.82, 0.35, 0.20);
      // cool shift: dusty blue → deep teal
      vec3 cool1 = vec3(0.72, 0.80, 0.88);
      vec3 cool2 = vec3(0.35, 0.58, 0.72);

      vec3 base = mix(warm1, warm2, energy);
      base = mix(base, warm3, smoothstep(0.75, 1.0, energy) * 0.5);
      // momentum blend
      vec3 coolBase = mix(cool1, cool2, energy);
      float coolFac = max(0.0, -mom) * 0.5;
      float warmFac = max(0.0, mom) * 0.3;
      base = mix(base, coolBase, coolFac);
      base = mix(base, warm3, warmFac);

      // peer count tints: more peers = faint violet undertone (social warmth)
      float socialTint = min(uPeerCount - 1.0, 4.0) * 0.04;
      base = mix(base, vec3(0.85, 0.72, 0.92), socialTint);

      vCol = base;
      vAlpha = (0.4 + 0.6 * energy) * (0.3 + 0.7 * uReady);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float d = -mv.z;
      gl_PointSize = (1.0 + 1.4 * energy) * uPixel * (42.0 / d) * (0.3 + 0.7 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── atmospheric fog plane (Bourriaud: context is part of the work) ── */
const fogGeo = new THREE.PlaneGeometry(80, 60);
const fogMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uTime: uniforms.uTime, uPulse: uniforms.uPulse },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
  `,
  fragmentShader: `
    uniform float uTime, uPulse;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv - 0.5;
      float r = length(c);
      float fog = exp(-r * r * 3.5) * (0.015 + 0.02 * uPulse);
      vec3 col = mix(vec3(0.18, 0.12, 0.10), vec3(0.10, 0.14, 0.20), r);
      gl_FragColor = vec4(col * fog, fog);
    }
  `
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.position.z = -5;
scene.add(fogPlane);

/* ── film grain overlay ── */
const grainGeo = new THREE.PlaneGeometry(2, 2);
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uTime: uniforms.uTime },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){
      float g = hash(vUv * 800.0 + uTime * 7.0);
      gl_FragColor = vec4(vec3(g), 0.03);
    }
  `
});
const grainQuad = new THREE.Mesh(grainGeo, grainMat);
const grainScene = new THREE.Scene();
const grainCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
grainScene.add(grainQuad);

/* ── load Lucy ── */
const loadingEl = document.getElementById('loading');
const PLY_URL = 'https://threejs.org/examples/models/ply/binary/Lucy100k.ply';
let revealStart = 0;

const loader = new PLYLoader();
loader.load(PLY_URL,
  (geometry) => {
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const bb = geometry.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const scale = 15 / Math.max(size.x, size.y, size.z);
    geometry.translate(-center.x, -center.y, -center.z);
    geometry.scale(scale, scale, scale);

    const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial());
    const sampler = new MeshSurfaceSampler(mesh).build();
    const tmp = new THREE.Vector3();
    for (let i = 0; i < N; i++){
      sampler.sample(tmp);
      restPositions[i*3]   = tmp.x;
      restPositions[i*3+1] = tmp.y;
      restPositions[i*3+2] = tmp.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('rest',     new THREE.BufferAttribute(restPositions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

    loadingEl.style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      loadingEl.textContent = `loading lucy · ${(xhr.loaded/xhr.total*100).toFixed(0)}%`;
    }
  },
  () => { loadingEl.textContent = 'load failed — check network'; }
);

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── broadcast presence ── */
let broadcastTimer = 0;
function broadcastPresence(t) {
  if (!bc || t - broadcastTimer < 0.1) return;
  broadcastTimer = t;
  bc.postMessage({
    type: 'presence', id: myId,
    x: mouseNorm.x, y: mouseNorm.y,
    hue: myHue
  });
}

/* ── prune stale peers ── */
function prunePeers() {
  const now = performance.now();
  for (const [id, p] of peers) {
    if (now - p.lastSeen > 3000) peers.delete(id);
  }
}

/* ── main loop ── */
const startTime = performance.now();
function loop(){
  const t = (performance.now() - startTime) / 1000;
  uniforms.uTime.value = t;

  // reveal
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 2800);
  }

  // pulse decay
  pulseWave *= 0.94;
  uniforms.uPulse.value = pulseWave;
  uniforms.uMomentum.value = THREE.MathUtils.lerp(uniforms.uMomentum.value, Math.tanh(pulseMomentum), 0.05);

  // peers
  prunePeers();
  peerCount = 1 + peers.size;
  uniforms.uPeerCount.value = peerCount;

  // map up to 3 peers to attractor uniforms
  const peerArr = Array.from(peers.values());
  const pU = [uniforms.uPeerA, uniforms.uPeerB, uniforms.uPeerC];
  const pA = uniforms.uPeerAlpha.value;
  for (let i = 0; i < 3; i++) {
    if (i < peerArr.length) {
      pU[i].value.set(peerArr[i].x * 10, peerArr[i].y * 8, 0);
      if (i === 0) pA.x = 1;
      else if (i === 1) pA.y = 1;
      else pA.z = 1;
    } else {
      if (i === 0) pA.x *= 0.95;
      else if (i === 1) pA.y *= 0.95;
      else pA.z *= 0.95;
    }
  }

  broadcastPresence(t);

  // gentle orbit — slow enough to be contemplative
  points.rotation.y = t * 0.035;

  // camera: slight breathing + peer-influenced sway
  const camSway = Math.sin(t * 0.15) * 0.8 * Math.min(peerCount, 4);
  camera.position.x = THREE.MathUtils.lerp(camera.position.x, camSway, 0.02);
  camera.position.y = THREE.MathUtils.lerp(camera.position.y, Math.sin(t * 0.1) * 0.5, 0.02);
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  // update ticks/sec counter
  const now = performance.now();
  if (now - lastTickReset > 1000) {
    ticksPerSec = tickCounter;
    tickCounter = 0;
    lastTickReset = now;
  }

  // social readout
  socialEl.innerHTML =
    `peers: ${peerCount}<br>` +
    `pulses: ${totalPulses}` +
    (wsConnected ? ` · ${ticksPerSec}/s` : '') +
    (lastPrice > 0 ? `<br>btc: ${lastPrice.toFixed(0)}` : '');

  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
