<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9wp · Shiota — The Key in the Hand</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">9wp</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x020101, 0.0024);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.006));
const pL = new THREE.PointLight(0xff4828, 0.015, 50, 2.2);
pL.position.set(-5, 8, 4);
scene.add(pL);
const fillL = new THREE.PointLight(0xffecd8, 0.008, 28, 2.0);
fillL.position.set(6, 1, -3);
scene.add(fillL);

let seed = 7183629;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// ── ARCHITECTURAL VOLUME — 32×26×28 chamber
const ROOM = { w:32, h:26, d:28 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE SUSPENDED SPHERE — pale, cottony heart
const sphereCenter = new THREE.Vector3(1.5, 1.0, 0.0);
const sphereR = 2.1;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ead8,
  emissive: 0xf2ead8,
  emissiveIntensity: 0.60,
  roughness: 0.94,
  metalness: 0.0,
  transparent: true,
  opacity: 0.30,
  fog: true
});
const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereR, 24, 16), sphereMat
);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── A SINGLE KEY — Shiota's Venice Biennale signature object
// Suspended 4 units above and left of the sphere
const keyPos = new THREE.Vector3(-2.8, 4.6, 1.2);
const keyGroup = new THREE.Group();
keyGroup.position.copy(keyPos);

// Key bow (ring)
const bowGeo = new THREE.TorusGeometry(0.18, 0.025, 6, 12);
const keyMat = new THREE.MeshStandardMaterial({
  color: 0x1a1612, emissive: 0x0a0806, emissiveIntensity: 0.2,
  roughness: 0.85, metalness: 0.3, transparent: true, opacity: 0.7
});
const bow = new THREE.Mesh(bowGeo, keyMat);
bow.rotation.x = Math.PI/2;
keyGroup.add(bow);

// Key shaft
const shaftGeo = new THREE.BoxGeometry(0.035, 0.38, 0.015);
const shaft = new THREE.Mesh(shaftGeo, keyMat);
shaft.position.y = -0.28;
keyGroup.add(shaft);

// Key teeth (two small notches)
const toothGeo = new THREE.BoxGeometry(0.06, 0.025, 0.015);
const t1 = new THREE.Mesh(toothGeo, keyMat);
t1.position.set(0.035, -0.42, 0);
keyGroup.add(t1);
const t2 = new THREE.Mesh(toothGeo, keyMat);
t2.position.set(0.035, -0.38, 0);
keyGroup.add(t2);

keyGroup.rotation.set(0.15, 0.4, -0.12);
scene.add(keyGroup);

// ── VOID ZONES — 3 cylindrical cuts through the thread volume
// Deliberate negative space the camera can look through
const voids = [
  { cx: -3.5, cy: 0, cz: 4.0, r: 1.8, axis: 'y' },
  { cx: 5.0, cy: 2.0, cz: -2.5, r: 1.5, axis: 'y' },
  { cx: 0.0, cy: -3.0, cz: -4.0, r: 2.0, axis: 'y' }
];
function inVoid(p){
  for(const v of voids){
    const dx = p.x - v.cx, dz = p.z - v.cz;
    if(Math.sqrt(dx*dx+dz*dz) < v.r) return true;
  }
  return false;
}

// ── DARK FRAGMENTS — 22 small scraps caught in the web
const fragments = [];
for(let i = 0; i < 22; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3 + Math.floor(rng()*3);
  const fSize = 0.05 + rng()*0.14;
  for(let j = 0; j < nPts; j++){
    verts.push(
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.25,
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.25
    );
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color: 0x0d0a08, transparent: true, opacity: 0.50
  }));
  let pos;
  do {
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = 3.2 + rng()*9.0;
    pos = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.7,
      sphereCenter.z + Math.cos(v)*r
    );
  } while(pos.distanceTo(sphereCenter) < sphereR+1.2 || inVoid(pos));
  fMesh.position.copy(pos);
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── ANCHOR FIELD
const anchors = [];
const shells = [3.2, 5.5, 7.8, 10.5, 13.5];
for(const sr of shells){
  const count = Math.floor(18 + sr*1.6);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.8+rng()*0.4);
    const pt = new THREE.Vector3(
      sphereCenter.x + Math.sin(v)*Math.cos(u)*r,
      sphereCenter.y + Math.sin(v)*Math.sin(u)*r*0.78,
      sphereCenter.z + Math.cos(v)*r
    );
    if(!inVoid(pt)) anchors.push(pt);
  }
}
for(let i = 0; i < 55; i++){
  const wp = wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── SUSPENSION THREADS — ceiling to sphere + ceiling to key
const suspPts = [];
// Sphere suspension
for(let i = 0; i < 7; i++){
  const a = (i/7)*Math.PI*2 + (rng()-0.5)*0.3;
  suspPts.push(
    sphereCenter.x + Math.cos(a)*0.3, hh, sphereCenter.z + Math.sin(a)*0.3,
    sphereCenter.x + Math.cos(a+rng()*0.2)*sphereR*0.35, sphereCenter.y+sphereR*0.96, sphereCenter.z + Math.sin(a+rng()*0.2)*sphereR*0.35
  );
}
// Key suspension — 3 fine threads from ceiling
for(let i = 0; i < 3; i++){
  const ox = (rng()-0.5)*0.15;
  const oz = (rng()-0.5)*0.15;
  suspPts.push(
    keyPos.x+ox, hh, keyPos.z+oz,
    keyPos.x+(rng()-0.5)*0.08, keyPos.y+0.18, keyPos.z+(rng()-0.5)*0.08
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0c0303, transparent: true, opacity: 0.28
})));

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return false;
  // Cull lines whose midpoint falls in a void zone
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  if(inVoid({x:mx,y:my,z:mz})) return false;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  li++;
  return true;
}

function sphereSurfPt(){
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    sphereCenter.x + Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y + Math.sin(v)*Math.sin(u)*sphereR,
    sphereCenter.z + Math.cos(v)*sphereR
  );
}

// RULE 1: CONVERGENCE — 50% — threads from anchors/walls toward sphere
// Vera Molnár radial quantization: near sphere, threads snap to 12° sectors
const catA = Math.floor(NUM_LINES * 0.50);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.42) origin = anchors[Math.floor(rng()*anchors.length)];
  else origin = wallPt();

  let target = sphereSurfPt();

  // Near-sphere threads: quantize arrival angle to 15° increments
  const distToSphere = origin.distanceTo(sphereCenter);
  if(distToSphere < 8.0){
    const dir = target.clone().sub(sphereCenter);
    let theta = Math.atan2(dir.z, dir.x);
    theta = Math.round(theta / (Math.PI/12)) * (Math.PI/12);
    const phi = Math.acos(Math.max(-1, Math.min(1, dir.y / sphereR)));
    target = new THREE.Vector3(
      sphereCenter.x + Math.sin(phi)*Math.cos(theta)*sphereR,
      sphereCenter.y + Math.cos(phi)*sphereR,
      sphereCenter.z + Math.sin(phi)*Math.sin(theta)*sphereR
    );
  }

  // 15% yearning threads — stop short, presence-in-absence
  if(rng() < 0.15){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng()*1.8;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped);
  } else {
    setLine(origin, target);
  }
}

// RULE 2: KEY CONVERGENCE — 8% — threads from nearby anchors toward the key
const catK = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < catK && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.5){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    // Points from the sphere-key corridor
    const t = rng();
    origin = sphereCenter.clone().lerp(keyPos, t).add(
      new THREE.Vector3((rng()-0.5)*3, (rng()-0.5)*2, (rng()-0.5)*3)
    );
  }
  // Target near the key with slight scatter
  const target = keyPos.clone().add(
    new THREE.Vector3((rng()-0.5)*0.4, (rng()-0.5)*0.5, (rng()-0.5)*0.4)
  );
  // 20% stop short — the key is barely reachable
  if(rng() < 0.20){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.15 + rng()*0.8;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)));
  } else {
    setLine(origin, target);
  }
}

// RULE 3: LATERAL — anchor-to-anchor within proximity
const THRESH = 6.5;
const catBtarget = Math.floor(NUM_LINES * 0.20);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 50000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  if(setLine(a, best)) catBcount++;
}

// RULE 4: DENDRITIC CHAINS — 180 branching filaments from sphere vicinity
for(let i = 0; i < 180 && li < NUM_LINES; i++){
  let pt = sphereSurfPt();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3 + Math.floor(rng()*5);
  let prevDir = radial.clone();

  for(let c = 0; c < chainLen && li < NUM_LINES; c++){
    const len = 0.4 + rng()*1.0;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.5, (rng()-0.5)*0.5, (rng()-0.5)*0.5
    );
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next);

    // Y-fork at generation 1 or 2
    if((c === 1 || c === 2) && rng() < 0.35 && li < NUM_LINES){
      const fDev = new THREE.Vector3(
        (rng()-0.5)*0.8, (rng()-0.5)*0.8, (rng()-0.5)*0.8
      );
      const fDir = prevDir.clone().add(fDev).normalize();
      const fLen = 0.25 + rng()*0.55;
      setLine(pt, pt.clone().add(fDir.multiplyScalar(fLen)));
    }

    pt = next;
    prevDir = dir;
  }
}

// RULE 5: SPHERE-KEY BRIDGE — a denser corridor of threads between the two objects
const bridgeCount = Math.floor(NUM_LINES * 0.04);
for(let i = 0; i < bridgeCount && li < NUM_LINES; i++){
  const t0 = rng();
  const t1 = Math.min(1, t0 + 0.15 + rng()*0.3);
  const scatter = 1.2 + rng()*1.5;
  const a = sphereCenter.clone().lerp(keyPos, t0).add(
    new THREE.Vector3((rng()-0.5)*scatter, (rng()-0.5)*scatter*0.6, (rng()-0.5)*scatter)
  );
  const b = sphereCenter.clone().lerp(keyPos, t1).add(
    new THREE.Vector3((rng()-0.5)*scatter, (rng()-0.5)*scatter*0.6, (rng()-0.5)*scatter)
  );
  setLine(a, b);
}

// Fill remainder with wall-spanning and wall-to-sphere threads
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.35 ? sphereSurfPt() :
            (rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt());
  setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — blood-red #c20018, depth-modulated
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  // Closer to sphere = brighter, warmer
  const distFade = Math.max(0.18, 1.0 - d*0.05);
  // Warm shift near sphere — slightly more orange
  const warmShift = d < 5.0 ? 0.02*(1.0-d/5.0) : 0.0;
  // Key proximity — threads near key also brighten
  const idx = i*6;
  const mx = (positions[idx]+positions[idx+3])*0.5;
  const my = (positions[idx+1]+positions[idx+4])*0.5;
  const mz = (positions[idx+2]+positions[idx+5])*0.5;
  const dKey = Math.sqrt((mx-keyPos.x)**2+(my-keyPos.y)**2+(mz-keyPos.z)**2);
  const keyBright = dKey < 3.0 ? 0.03*(1.0-dKey/3.0) : 0.0;

  const baseOp = (0.09 + keyBright) * distFade;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = (bR + warmShift) * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.7;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.07,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — narrative arc: intimacy → revelation → contemplation → return
const pathLen = 2400;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;

  let rH, y;
  if(t < 0.15){
    // ACT 1: Very close, low, among the threads — can barely see the sphere
    const lt = t/0.15;
    rH = 3.5 + lt*0.8;
    y = cy - 3.0 + lt*1.5;
  } else if(t < 0.30){
    // Slow rise — sphere emerges through the veil of threads
    const lt = (t-0.15)/0.15;
    rH = 4.3 + lt*3.5;
    y = cy - 1.5 + lt*5.0;
  } else if(t < 0.42){
    // ACT 2: High and far — the full network is visible, architectural scale
    const lt = (t-0.30)/0.12;
    rH = 7.8 + lt*2.5;
    y = cy + 3.5 + Math.sin(lt*Math.PI)*2.8;
  } else if(t < 0.52){
    // Descent toward the key — discovering the second object
    const lt = (t-0.42)/0.10;
    rH = 10.3 - lt*5.0;
    y = cy + 6.3 - lt*2.8;
    // Shift orbit center toward key
  } else if(t < 0.62){
    // ACT 3: Passing between sphere and key — the bridge corridor
    const lt = (t-0.52)/0.10;
    rH = 5.3 - lt*1.0;
    y = cy + 3.5 - lt*1.5;
  } else if(t < 0.78){
    // Descend and approach — intimate return to the sphere
    const lt = (t-0.62)/0.16;
    rH = 4.3 + lt*1.2;
    y = cy + 2.0 - lt*4.5;
  } else if(t < 0.90){
    // ACT 4: Very low, looking up through thread canopy at the sphere above
    const lt = (t-0.78)/0.12;
    rH = 5.5 - lt*0.5;
    y = cy - 2.5 + lt*1.0;
  } else {
    // Return to starting position
    const lt = (t-0.90)/0.10;
    rH = 5.0 - lt*1.5;
    y = cy - 1.5 - lt*1.5;
  }

  // Slight figure-8 wobble in orbit
  const wobble = Math.sin(p*1.44)*0.8;
  const x = cx + Math.sin(p*0.68 + wobble*0.05)*rH;
  const z = cz + Math.cos(p*0.68)*rH*1.06;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — <0.4% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00005 * Math.max(0, 1.0-dist/20.0);
    const phase = basePositions[idx]*0.035 + basePositions[idx+1]*0.055 + i*0.00012;
    const breath = Math.sin(elapsed*0.0025+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.14;
      arr[vi+1] = basePositions[vi+1] + breath*0.09;
      arr[vi+2] = basePositions[vi+2] + breath*0.11;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere luminance pulse — slow, like breathing
  sphereMat.emissiveIntensity = 0.60 + Math.sin(elapsed*0.0007)*0.05;

  // Key gentle rotation — barely perceptible, like hanging in a draft
  keyGroup.rotation.z = -0.12 + Math.sin(elapsed*0.0004)*0.015;
  keyGroup.rotation.y = 0.4 + Math.sin(elapsed*0.00025)*0.008;

  // Camera dolly — 180 seconds per loop
  const speed = 1.0/180.0;
  const pathT = ((elapsed*speed)%1.0+1.0)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look target shifts between sphere and key depending on camera phase
  const look = sphereCenter.clone();
  // When camera is in key-discovery phase (t ~0.48-0.58), bias toward key
  const camPhase = pathT;
  if(camPhase > 0.46 && camPhase < 0.58){
    const kBlend = Math.sin((camPhase-0.46)/0.12*Math.PI)*0.4;
    look.lerp(keyPos, kBlend);
  }
  look.x += Math.sin(elapsed*0.0004)*0.04;
  look.y += Math.cos(elapsed*0.0003)*0.15;
  look.z += Math.sin(elapsed*0.00055+0.3)*0.03;
  camera.lookAt(look);

  // Light micro-drift
  pL.position.x = -5 + Math.sin(elapsed*0.00018)*0.05;
  pL.position.y = 8 + Math.cos(elapsed*0.0001)*0.04;
  pL.intensity = 0.015 + Math.sin(elapsed*0.00025)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;

  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}

</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
