<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>84b · withdrawn object</title>
<!-- MOTION: orbit, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a12; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a0f24; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#261935; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · approach the withdrawn</button>
<div class="id">84b</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0a12, 0.055);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.8, 90);
camera.position.set(18, 8, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0a12, 1);
document.body.appendChild(renderer.domElement);

// statue silhouette — human figure partially constructed
const N = 18000;
const positions = new Float32Array(N * 3);
const zones = new Float32Array(N); // which shy zone
const seeds = new Float32Array(N);
const baseRadius = new Float32Array(N);

// procedural statue: head, torso, arms, legs — rough volumes
for (let i = 0; i < N; i++){
  const u = i / N;
  let x, y, z, zone, br;
  
  if (u < 0.15){ // head
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2*Math.random()-1);
    const r = 1.2 + Math.random() * 0.4;
    x = r * Math.sin(ph) * Math.cos(th);
    y = 6.5 + r * Math.sin(ph) * Math.sin(th);
    z = r * Math.cos(ph);
    zone = 0; // top shy zone
    br = r;
  } else if (u < 0.50){ // torso
    const th = Math.random() * Math.PI * 2;
    const h = Math.random() * 4.5 + 1.8;
    const r = 1.3 + Math.sin(h * 0.6) * 0.5;
    x = r * Math.cos(th);
    y = h;
    z = r * Math.sin(th);
    zone = 1; // front shy zone
    br = r;
  } else if (u < 0.70){ // arms
    const side = Math.random() < 0.5 ? 1 : -1;
    const seg = Math.random();
    const bx = side * 1.6;
    const by = 5.0 - seg * 2.5;
    const bz = -seg * 1.2;
    x = bx + (Math.random()-0.5) * 0.7;
    y = by + (Math.random()-0.5) * 0.5;
    z = bz + (Math.random()-0.5) * 0.5;
    zone = side > 0 ? 2 : 3; // left/right shy zones
    br = 0.5;
  } else { // legs
    const side = Math.random() < 0.5 ? 1 : -1;
    const seg = Math.random();
    const bx = side * 0.6;
    const by = 1.8 - seg * 1.8;
    const bz = 0;
    x = bx + (Math.random()-0.5) * 0.5;
    y = by + (Math.random()-0.5) * 0.4;
    z = bz + (Math.random()-0.5) * 0.5;
    zone = 1; // shares front zone
    br = 0.45;
  }
  
  positions[i*3] = x;
  positions[i*3+1] = y;
  positions[i*3+2] = z;
  zones[i] = zone;
  seeds[i] = Math.random();
  baseRadius[i] = br;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('zone', new THREE.BufferAttribute(zones, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('baseRadius', new THREE.BufferAttribute(baseRadius, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBands: { value: uBands },
  uTreble: { value: 0 },
  uCamPos: { value: camera.position.clone() },
  uShyZones: { value: [
    new THREE.Vector3(0, 7, 0),    // head top
    new THREE.Vector3(0, 3.5, 2.5), // torso front
    new THREE.Vector3(2.2, 4, 0),   // right arm
    new THREE.Vector3(-2.2, 4, 0)   // left arm
  ]}
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4 uBands;
    uniform float uTreble;
    uniform vec3 uCamPos;
    uniform vec3 uShyZones[4];
    attribute float zone;
    attribute float seed;
    attribute float baseRadius;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main(){
      vec3 p = position;
      
      // breath expansion keyed to audio
      float energy = (uBands.x + uBands.y + uBands.z + uBands.w + uTreble) * 0.2;
      float breathe = 1.0 + energy * 0.15 * sin(uTime * 1.8 + seed * 6.28);
      vec3 center = vec3(0, 3.5, 0);
      p = center + (p - center) * breathe;
      
      // local drift
      p.x += sin(uTime * 0.7 + seed * 12.0) * 0.08;
      p.y += sin(uTime * 0.5 + seed * 9.0) * 0.06;
      p.z += sin(uTime * 0.6 + seed * 15.0) * 0.08;
      
      // shy zone withdrawal — fade when camera approaches
      int z = int(zone);
      vec3 shyCenter = uShyZones[z];
      float distToShy = length(uCamPos - shyCenter);
      float shyness = smoothstep(3.0, 9.0, distToShy);
      
      // additional occlusion by depth fog
      float distToCam = length(p - uCamPos);
      float depthFade = smoothstep(28.0, 12.0, distToCam);
      
      vAlpha = shyness * depthFade * (0.6 + energy * 0.8);
      
      // palette: ash-gray → burnt-sienna → cold-violet
      vec3 ash = vec3(0.72, 0.70, 0.68);
      vec3 sienna = vec3(0.82, 0.45, 0.28);
      vec3 violet = vec3(0.48, 0.38, 0.65);
      
      float hNorm = (p.y + 1.0) / 9.0;
      vec3 col;
      if (hNorm < 0.5){
        col = mix(sienna, ash, hNorm * 2.0);
      } else {
        col = mix(ash, violet, (hNorm - 0.5) * 2.0);
      }
      col *= (0.5 + energy * 0.7);
      vCol = col;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.8 + baseRadius * 1.2 + energy * 1.5) * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float soft = exp(-r * 12.0);
      float a = soft * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// atmospheric dust motes
const dustN = 1200;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++){
  dustPos[i*3] = (Math.random()-0.5) * 40;
  dustPos[i*3+1] = Math.random() * 15 - 2;
  dustPos[i*3+2] = (Math.random()-0.5) * 40;
}
const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.12,
  color: 0x8a7a95,
  transparent: true,
  opacity: 0.15,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;

async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'circling the withdrawn';
  } catch (e) {
    hint.textContent = 'mic denied — passive orbit';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
const orbitRadius = 18;
const orbitHeight = 8;
const orbitSpeed = 0.08;

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  // slow orbit around statue
  const angle = t * orbitSpeed;
  camera.position.x = Math.cos(angle) * orbitRadius;
  camera.position.z = Math.sin(angle) * orbitRadius;
  camera.position.y = orbitHeight + Math.sin(t * 0.15) * 2.5;
  camera.lookAt(0, 3.5, 0);
  uniforms.uCamPos.value.copy(camera.position);
  
  dust.rotation.y = t * 0.02;
  
  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    uBands.x = 0.28 + 0.25 * Math.sin(t*1.1);
    uBands.y = 0.22 + 0.20 * Math.sin(t*1.7 + 0.8);
    uBands.z = 0.18 + 0.18 * Math.sin(t*2.3 + 1.5);
    uBands.w = 0.15 + 0.15 * Math.sin(t*3.2 + 2.1);
    uniforms.uTreble.value = 0.12 + 0.12 * Math.sin(t*5.0);
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
