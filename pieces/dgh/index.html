<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dgh · suminagashi marbling</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#e8dcc8; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#3a3a38; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; color:#3a3a38; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; color:#3a3a38; }
</style>
</head>
<body>
<div class="id">dgh</div>
<div class="hint">drag pointer to comb ink rings</div>
<div class="src">suminagashi paper marbling · semi-lagrangian dye advection</div>

<!-- MOTION: drift, intensity: calm -->

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Suminagashi marbling: concentric ink rings on viscous surface, dragged with stylus.
// 2D semi-Lagrangian dye advection with NO viscosity diffusion to keep boundaries sharp.
// Pointer drags add Gaussian impulses to velocity field.
// Visual: sharp ink boundaries, concentric rings expanding, then combed into feathers/spirals.

const RES = 512;  // fluid grid resolution
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xe8dcc8, 1);
document.body.appendChild(renderer.domElement);

const rtParams = {
  type: THREE.HalfFloatType,
  format: THREE.RGBAFormat,
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  wrapS: THREE.RepeatWrapping,
  wrapT: THREE.RepeatWrapping,
  depthBuffer: false
};

// ping-pong pairs: velocity (RG), dye (RGBA)
let velA = new THREE.WebGLRenderTarget(RES, RES, rtParams);
let velB = new THREE.WebGLRenderTarget(RES, RES, rtParams);
let dyeA = new THREE.WebGLRenderTarget(RES, RES, rtParams);
let dyeB = new THREE.WebGLRenderTarget(RES, RES, rtParams);

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const quadGeom = new THREE.PlaneGeometry(2,2);

// ---- init dye: concentric rings of monochrome ink ----
const initDyeData = new Float32Array(RES * RES * 4);
for (let y = 0; y < RES; y++) {
  for (let x = 0; x < RES; x++) {
    const i = (y * RES + x) * 4;
    const cx = x / RES - 0.5;
    const cy = y / RES - 0.5;
    const r = Math.sqrt(cx*cx + cy*cy);
    // 6 concentric rings from center
    const ring = Math.floor(r * 18.0) % 2;
    const ink = ring === 0 ? 0.0 : 0.95;
    initDyeData[i]   = ink * 0.08;  // R: dark indigo
    initDyeData[i+1] = ink * 0.12;  // G
    initDyeData[i+2] = ink * 0.18;  // B
    initDyeData[i+3] = 1.0;         // A: always 1 for dye presence
  }
}
const initDyeTex = new THREE.DataTexture(initDyeData, RES, RES, THREE.RGBAFormat, THREE.FloatType);
initDyeTex.needsUpdate = true;

const blitScene = new THREE.Scene();
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initDyeTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
blitScene.add(new THREE.Mesh(quadGeom.clone(), blitMat));
renderer.setRenderTarget(dyeA);
renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// ---- advection shader: semi-Lagrangian backtrack ----
const advectMat = new THREE.ShaderMaterial({
  uniforms: {
    uField: { value: null },
    uVel:   { value: null },
    uDt:    { value: 0.016 },
    uDx:    { value: 1.0 / RES }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uField;
    uniform sampler2D uVel;
    uniform float uDt;
    uniform float uDx;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(uVel, vUv).xy;
      vec2 backPos = vUv - vel * uDt * uDx * 60.0;
      gl_FragColor = texture2D(uField, backPos);
    }
  `
});
const advectScene = new THREE.Scene();
advectScene.add(new THREE.Mesh(quadGeom.clone(), advectMat));

// ---- add impulse to velocity (Gaussian splat from pointer drag) ----
const impulseMat = new THREE.ShaderMaterial({
  uniforms: {
    uVel:    { value: null },
    uPos:    { value: new THREE.Vector2(0.5, 0.5) },
    uForce:  { value: new THREE.Vector2(0, 0) },
    uRadius: { value: 0.012 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uVel;
    uniform vec2 uPos;
    uniform vec2 uForce;
    uniform float uRadius;
    varying vec2 vUv;
    void main(){
      vec2 vel = texture2D(uVel, vUv).xy;
      vec2 d = vUv - uPos;
      float r2 = dot(d, d);
      float splat = exp(-r2 / (uRadius * uRadius));
      vel += uForce * splat * 0.008;
      gl_FragColor = vec4(vel, 0.0, 1.0);
    }
  `
});
const impulseScene = new THREE.Scene();
impulseScene.add(new THREE.Mesh(quadGeom.clone(), impulseMat));

// ---- dissipation (reduce velocity over time to keep surface stable) ----
const dissipMat = new THREE.ShaderMaterial({
  uniforms: {
    uField: { value: null },
    uDecay: { value: 0.985 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D uField;
    uniform float uDecay;
    varying vec2 vUv;
    void main(){
      vec4 f = texture2D(uField, vUv);
      gl_FragColor = f * uDecay;
    }
  `
});
const dissipScene = new THREE.Scene();
dissipScene.add(new THREE.Mesh(quadGeom.clone(), dissipMat));

// ---- 3D render: textured plane showing dye, slow tilt ----
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 3.5);
camera.lookAt(0, 0, 0);

const planeMat = new THREE.ShaderMaterial({
  uniforms: {
    uDye: { value: dyeA.texture }
  },
  side: THREE.DoubleSide,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D uDye;
    varying vec2 vUv;
    void main(){
      vec4 dye = texture2D(uDye, vUv);
      // blend dye onto cream background
      vec3 cream = vec3(0.91, 0.86, 0.78);
      vec3 col = mix(cream, dye.rgb, dye.a);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});
const plane = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2, 1, 1), planeMat);
scene.add(plane);

// add subtle paper texture via grain overlay
const grainMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  transparent: true,
  depthWrite: false,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      float n = hash(vUv * 1024.0 + uTime * 0.01);
      float grain = n * 0.03;
      gl_FragColor = vec4(vec3(grain), 1.0);
    }
  `,
  blending: THREE.MultiplyBlending
});
const grainPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 3.2, 1, 1), grainMat);
grainPlane.position.z = 0.001;
scene.add(grainPlane);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer tracking
const pointer = { x: 0.5, y: 0.5, px: 0.5, py: 0.5, down: false };
addEventListener('pointerdown', () => { pointer.down = true; });
addEventListener('pointerup', () => { pointer.down = false; });
addEventListener('pointermove', (e) => {
  pointer.px = pointer.x;
  pointer.py = pointer.y;
  pointer.x = e.clientX / innerWidth;
  pointer.y = 1.0 - (e.clientY / innerHeight);
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.033);
  lastTime = now;

  // if pointer moved, add impulse to velocity
  if (pointer.down) {
    const dx = pointer.x - pointer.px;
    const dy = pointer.y - pointer.py;
    if (Math.abs(dx) > 0.0001 || Math.abs(dy) > 0.0001) {
      impulseMat.uniforms.uVel.value = velA.texture;
      impulseMat.uniforms.uPos.value.set(pointer.x, pointer.y);
      impulseMat.uniforms.uForce.value.set(dx * 100, dy * 100);
      renderer.setRenderTarget(velB);
      renderer.render(impulseScene, camOrtho);
      const tmp = velA; velA = velB; velB = tmp;
    }
  }

  // advect velocity by itself (no external force, just self-advection)
  advectMat.uniforms.uField.value = velA.texture;
  advectMat.uniforms.uVel.value = velA.texture;
  advectMat.uniforms.uDt.value = dt;
  renderer.setRenderTarget(velB);
  renderer.render(advectScene, camOrtho);
  let tmp = velA; velA = velB; velB = tmp;

  // dissipate velocity
  dissipMat.uniforms.uField.value = velA.texture;
  renderer.setRenderTarget(velB);
  renderer.render(dissipScene, camOrtho);
  tmp = velA; velA = velB; velB = tmp;

  // advect dye by velocity
  advectMat.uniforms.uField.value = dyeA.texture;
  advectMat.uniforms.uVel.value = velA.texture;
  renderer.setRenderTarget(dyeB);
  renderer.render(advectScene, camOrtho);
  tmp = dyeA; dyeA = dyeB; dyeB = tmp;

  renderer.setRenderTarget(null);

  // update display
  planeMat.uniforms.uDye.value = dyeA.texture;
  grainMat.uniforms.uTime.value = now / 1000;

  // slow tilt: plane rotates gently around Y axis
  const ang = now * 0.00008;
  plane.rotation.y = Math.sin(ang) * 0.15;
  plane.rotation.x = Math.cos(ang * 0.7) * 0.08;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
