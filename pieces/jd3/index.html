<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jd3 · Riley iridescence (thin-film surprise)</title>
<!-- MOTION: shimmer, intensity: calm -->
</head>
<style>
  html, body { margin:0; padding:0; height:100%; background:#ffffff; overflow:hidden;
               color:#333; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; color:#666; z-index:10; }
</style>
<body>
<div class="id">jd3</div>
<div class="hint">click to regenerate · watch for the shimmer</div>
<div class="src">Riley · thin-film iridescence · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 30;
const camera = new THREE.OrthographicCamera(
  frustumSize * aspect / -2, frustumSize * aspect / 2,
  frustumSize / 2, frustumSize / -2,
  0.1, 100
);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0xffffff, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
let geom, points, mat;

const uniforms = {
  uTime: { value: 0 },
  uPhase: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uRowFreq: { value: 0 },
  uColFreq: { value: 0 },
  uWaveAmp: { value: 0 },
  uTwist: { value: 0 },
};

mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uPhase;
    uniform float uRowFreq;
    uniform float uColFreq;
    uniform float uWaveAmp;
    uniform float uTwist;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity;
    varying vec2 vGrid;

    void main(){
      vec2 gp = gridPos;

      float rowWave = sin(gp.y * uRowFreq + uTime * 0.8 + uPhase) * uWaveAmp;
      float colWave = sin(gp.x * uColFreq + uTime * 0.5) * uWaveAmp;

      float twist = uTwist * length(gp) * 0.05;
      float ct = cos(twist);
      float st = sin(twist);
      vec2 twisted = vec2(
        gp.x * ct - gp.y * st,
        gp.x * st + gp.y * ct
      );

      vec3 p = vec3(twisted.x + rowWave, twisted.y + colWave, 0.0);

      float interference = sin(gp.y * uRowFreq * 2.0 + uTime * 0.8) *
                          sin(gp.x * uColFreq * 2.0 + uTime * 0.5);
      vDensity = interference;
      vGrid = gp;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = uPixel * 2.2;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    varying float vDensity;
    varying vec2 vGrid;

    // Muted thin-film: mother-of-pearl, not neon
    vec3 thinFilm(float theta){
      // Phase-shifted cosines → spectral band
      vec3 c;
      c.r = 0.5 + 0.5 * cos(6.28318 * (theta + 0.00));
      c.g = 0.5 + 0.5 * cos(6.28318 * (theta + 0.33));
      c.b = 0.5 + 0.5 * cos(6.28318 * (theta + 0.67));
      // Heavy desaturation — aged nacre, not rainbow
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(vec3(lum), c, 0.30);
      // Warm shift — bone/parchment undertone
      c = c * vec3(1.02, 0.98, 0.94);
      return c;
    }

    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // Base B&W op-art
      float val = step(0.0, vDensity);
      vec3 bw = vec3(val);

      // Surprise envelope: 14s cycle, ~4s of iridescence
      // Slow bloom that sweeps diagonally across the grid
      float cycle = uTime * 0.4488; // ~14s period
      float envelope = sin(cycle);
      // Sharpen into a brief bloom window
      float bloom = smoothstep(0.55, 0.85, envelope);

      // Diagonal sweep: iridescence arrives as a wave front
      float sweepPhase = (vGrid.x + vGrid.y) * 0.06 - uTime * 0.3;
      float sweep = 0.5 + 0.5 * sin(sweepPhase);

      // Thin-film angle depends on interference density + position
      float filmTheta = vDensity * 1.2 + length(vGrid) * 0.08 + uTime * 0.04;
      vec3 irid = thinFilm(filmTheta);

      // Only the dark bands pick up color (like oil settling in grooves)
      float inGroove = 1.0 - val; // black bands
      float colorAmount = bloom * sweep * inGroove;

      // Mix: black bands get iridescent tint, white stays white
      vec3 tinted = mix(vec3(0.08, 0.07, 0.06), irid * 0.75, colorAmount);
      vec3 col = mix(tinted, vec3(1.0), val);

      // During bloom, white bands get faintest pearl sheen too
      float whiteSheen = bloom * sweep * val * 0.08;
      col += thinFilm(filmTheta + 0.5) * whiteSheen;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

function buildGrid(rows, cols, seed){
  const positions = new Float32Array(N * 3);
  const gridPositions = new Float32Array(N * 2);
  const seeds = new Float32Array(N);

  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const width = 24;
  const height = 24;
  const cellW = width / cols;
  const cellH = height / rows;

  let idx = 0;
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      const pointsPerCell = Math.floor(N / (rows * cols));
      for (let k = 0; k < pointsPerCell && idx < N; k++){
        const x = (j + rng() - 0.5) * cellW - width * 0.5;
        const y = (i + rng() - 0.5) * cellH - height * 0.5;

        positions[idx * 3] = x;
        positions[idx * 3 + 1] = y;
        positions[idx * 3 + 2] = 0;

        gridPositions[idx * 2] = x;
        gridPositions[idx * 2 + 1] = y;

        seeds[idx] = rng();
        idx++;
      }
    }
  }

  while (idx < N){
    const x = (rng() - 0.5) * width;
    const y = (rng() - 0.5) * height;
    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = 0;
    gridPositions[idx * 2] = x;
    gridPositions[idx * 2 + 1] = y;
    seeds[idx] = rng();
    idx++;
  }

  return { positions, gridPositions, seeds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value = 0.8 + rng() * 1.2;
  uniforms.uColFreq.value = 0.8 + rng() * 1.2;
  uniforms.uWaveAmp.value = 0.3 + rng() * 0.7;
  uniforms.uTwist.value = rng() * 6.28;
  uniforms.uPhase.value = rng() * 6.28;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos', new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
  regenerate();
});

addEventListener('resize', () => {
  const newAspect = innerWidth / innerHeight;
  camera.left = frustumSize * newAspect / -2;
  camera.right = frustumSize * newAspect / 2;
  camera.top = frustumSize / 2;
  camera.bottom = frustumSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

const start = performance.now();
function loop(){
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
