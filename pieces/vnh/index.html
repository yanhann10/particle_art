<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>limning · illuminated vault edges</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#12110f; overflow:hidden;
               color:#ccc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
</style>
</head>
<body>
<div class="id">vnh</div>
<div class="hint">drag to orbit · click to regenerate</div>
<div class="src">Cennini limning technique → gilt vault outlines · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 4, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x12110f, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const NUM_RIBS = 5;
const TIERS = 4;
const SEGMENTS_PER_RIB = 7;
const TOTAL_PANELS = NUM_RIBS * SEGMENTS_PER_RIB;
const TRACE_COUNT = 28000;
const CORNICE_COUNT = 12000;
const PANEL_COUNT = N - TRACE_COUNT - CORNICE_COUNT;
const PARTICLES_PER_PANEL = Math.floor(PANEL_COUNT / TOTAL_PANELS);

const PANEL_W = 0.9, PANEL_H = 1.5, PANEL_D = 0.22;

let panelDefs = [], foldTargets = [], foldCurrents = [], corniceDefs = [];
let ribLengths = [];
let seed = 42;

function makeRng(s) {
  let st = s >>> 0;
  return () => {
    st |= 0; st = st + 0x6D2B79F5 | 0;
    let t = Math.imul(st ^ st >>> 15, 1 | st);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function definePanels() {
  panelDefs = []; foldTargets = []; foldCurrents = [];
  corniceDefs = []; ribLengths = [];
  const rng = makeRng(seed);
  const vaultRise = 6.0 + rng() * 1.5;
  const vaultSpan = 9.0 + rng() * 2.0;

  for (let ribIdx = 0; ribIdx < NUM_RIBS; ribIdx++) {
    const ribAngle = (ribIdx / NUM_RIBS) * Math.PI * 2 + rng() * 0.15;
    const ribLen = 0.7 + rng() * 0.5;
    ribLengths.push(ribLen);
    const ribRadius = vaultSpan * 0.38 * ribLen;
    const ribBaseX = Math.cos(ribAngle) * ribRadius;
    const ribBaseZ = Math.sin(ribAngle) * ribRadius;
    const apexAngle = 0.9 + rng() * 0.25;

    for (let seg = 0; seg < SEGMENTS_PER_RIB; seg++) {
      const t = seg / (SEGMENTS_PER_RIB - 1);
      let localAngle, yPos, isLeft;
      if (t < 0.5) {
        isLeft = true;
        const arcT = t * 2.0;
        localAngle = arcT * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.85 * ribLen;
      } else {
        isLeft = false;
        const arcT = (t - 0.5) * 2.0;
        localAngle = (1.0 - arcT) * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.85 * ribLen;
      }
      const xOff = (isLeft ? -1 : 1) * Math.cos(localAngle) * (vaultSpan * 0.14);
      const x = ribBaseX + xOff * Math.cos(ribAngle);
      const z = ribBaseZ + xOff * Math.sin(ribAngle);
      const hingeRot = localAngle + (isLeft ? -Math.PI / 2 : Math.PI / 2);

      panelDefs.push({
        basePos: [x, yPos, z],
        hingeRot, ribAngle, segmentT: t, ribIdx,
        accent: seg === Math.floor(SEGMENTS_PER_RIB / 2)
      });
      const baseFold = (rng() - 0.5) * 0.4;
      foldTargets.push(baseFold);
      foldCurrents.push(baseFold * 0.8);
    }
  }

  for (let ti = 0; ti < TIERS; ti++) {
    const h = vaultRise * 0.12 + (ti / (TIERS - 1)) * vaultRise * 0.7;
    const projDepth = 0.5 + rng() * 0.4;
    const profileH = 0.15 + rng() * 0.12;
    const dentilCount = 14 + Math.floor(rng() * 10);
    const corniceRadius = vaultSpan * 0.36 + projDepth;
    corniceDefs.push({ height: h, radius: corniceRadius, projDepth, profileH, dentilCount, accent: ti === TIERS - 1 });
  }
}

const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const alphas = new Float32Array(N);
const sizes = new Float32Array(N);
const panelIdsArr = new Float32Array(N);
const localCoords = new Float32Array(N * 3);
const particleType = new Uint8Array(N); // 0=panel edge, 1=cornice, 2=trace
const tracePhase = new Float32Array(N);
const traceEdge = new Float32Array(N * 2); // which edge segment for traces

function populateAll() {
  const rng = makeRng(seed + 7);
  const vellum = [0.88, 0.82, 0.68];
  const vellumDk = [0.55, 0.50, 0.40];
  const inkDark = [0.20, 0.18, 0.15];
  const goldBright = [0.92, 0.75, 0.28];
  const goldDeep = [0.78, 0.58, 0.15];
  const copper = [0.70, 0.38, 0.18];

  let idx = 0;

  /* Panel particles — 85% on edges (limning = outlining) */
  for (let p = 0; p < TOTAL_PANELS && idx < PANEL_COUNT; p++) {
    const count = PARTICLES_PER_PANEL;
    for (let k = 0; k < count && idx < PANEL_COUNT; k++) {
      particleType[idx] = 0;
      panelIdsArr[idx] = p;
      const edgeChance = rng();
      let fx, fy, fz;
      if (edgeChance < 0.85) {
        const edge = Math.floor(rng() * 12);
        const t = rng();
        const hw = PANEL_W * 0.5, hh = PANEL_H * 0.5, hd = PANEL_D * 0.5;
        switch (edge) {
          case 0:  fx = -hw; fy = -hh + t * PANEL_H; fz = -hd; break;
          case 1:  fx = hw;  fy = -hh + t * PANEL_H; fz = -hd; break;
          case 2:  fx = -hw; fy = -hh + t * PANEL_H; fz = hd;  break;
          case 3:  fx = hw;  fy = -hh + t * PANEL_H; fz = hd;  break;
          case 4:  fx = -hw + t * PANEL_W; fy = -hh; fz = -hd; break;
          case 5:  fx = -hw + t * PANEL_W; fy = hh;  fz = -hd; break;
          case 6:  fx = -hw + t * PANEL_W; fy = -hh; fz = hd;  break;
          case 7:  fx = -hw + t * PANEL_W; fy = hh;  fz = hd;  break;
          case 8:  fx = -hw; fy = -hh; fz = -hd + t * PANEL_D; break;
          case 9:  fx = hw;  fy = -hh; fz = -hd + t * PANEL_D; break;
          case 10: fx = -hw; fy = hh;  fz = -hd + t * PANEL_D; break;
          default: fx = hw;  fy = hh;  fz = -hd + t * PANEL_D; break;
        }
        fx += (rng() - 0.5) * 0.04;
        fy += (rng() - 0.5) * 0.04;
        fz += (rng() - 0.5) * 0.04;
      } else {
        fx = (rng() - 0.5) * PANEL_W;
        fy = (rng() - 0.5) * PANEL_H;
        fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      }
      localCoords[idx * 3] = fx;
      localCoords[idx * 3 + 1] = fy;
      localCoords[idx * 3 + 2] = fz;

      const shade = 0.85 + rng() * 0.15;
      if (edgeChance < 0.85) {
        const g = rng() > 0.3 ? inkDark : vellumDk;
        colors[idx * 3] = g[0] * shade;
        colors[idx * 3 + 1] = g[1] * shade;
        colors[idx * 3 + 2] = g[2] * shade;
      } else {
        colors[idx * 3] = vellum[0] * shade;
        colors[idx * 3 + 1] = vellum[1] * shade;
        colors[idx * 3 + 2] = vellum[2] * shade;
      }
      alphas[idx] = edgeChance < 0.85 ? 0.7 : 0.35;
      sizes[idx] = 1.0;
      idx++;
    }
  }

  /* Cornice particles */
  const corniceStart = idx;
  const particlesPerTier = Math.floor(CORNICE_COUNT / TIERS);
  for (let ti = 0; ti < TIERS && idx < corniceStart + CORNICE_COUNT; ti++) {
    const cd = corniceDefs[ti];
    const count = ti < TIERS - 1 ? particlesPerTier : corniceStart + CORNICE_COUNT - idx;
    for (let k = 0; k < count && idx < N; k++) {
      particleType[idx] = 1;
      panelIdsArr[idx] = ti;
      const angle = rng() * Math.PI * 2;
      const profileT = rng();
      let projOffset, yOffset;
      if (profileT < 0.3) {
        projOffset = cd.projDepth * (0.6 + rng() * 0.4);
        yOffset = 0;
      } else if (profileT < 0.5) {
        const ct = (profileT - 0.3) / 0.2;
        projOffset = cd.projDepth * (1.0 - ct * 0.4);
        yOffset = cd.profileH * (0.5 + Math.sin(ct * Math.PI) * 0.3);
      } else if (profileT < 0.7) {
        const dentilAngle = angle * cd.dentilCount;
        projOffset = cd.projDepth * (Math.sin(dentilAngle) > 0.2 ? 0.8 : 0.4);
        yOffset = -cd.profileH * 0.4;
      } else {
        projOffset = cd.projDepth * (0.5 + rng() * 0.5);
        yOffset = -cd.profileH * (0.6 + rng() * 0.3);
      }
      const r = cd.radius + projOffset * (0.8 + rng() * 0.4 - 0.2);
      localCoords[idx * 3] = Math.cos(angle) * r;
      localCoords[idx * 3 + 1] = cd.height + yOffset;
      localCoords[idx * 3 + 2] = Math.sin(angle) * r;
      positions[idx * 3] = localCoords[idx * 3];
      positions[idx * 3 + 1] = localCoords[idx * 3 + 1];
      positions[idx * 3 + 2] = localCoords[idx * 3 + 2];
      const shade = 0.8 + rng() * 0.2;
      const base = cd.accent ? copper : (rng() > 0.5 ? vellumDk : inkDark);
      colors[idx * 3] = base[0] * shade;
      colors[idx * 3 + 1] = base[1] * shade;
      colors[idx * 3 + 2] = base[2] * shade;
      alphas[idx] = 0.5;
      sizes[idx] = 1.0;
      idx++;
    }
  }

  /* Trace particles — animated golden sweeps along panel edges (the limning act) */
  const traceStart = idx;
  for (let k = 0; idx < N; k++, idx++) {
    particleType[idx] = 2;
    const p = Math.floor(rng() * TOTAL_PANELS);
    panelIdsArr[idx] = p;
    tracePhase[idx] = rng() * Math.PI * 2;

    // pick an edge
    const edge = Math.floor(rng() * 12);
    traceEdge[idx * 2] = edge;
    traceEdge[idx * 2 + 1] = rng(); // position along edge

    localCoords[idx * 3] = 0;
    localCoords[idx * 3 + 1] = 0;
    localCoords[idx * 3 + 2] = 0;

    const gShade = 0.85 + rng() * 0.15;
    const g = rng() > 0.4 ? goldBright : goldDeep;
    colors[idx * 3] = g[0] * gShade;
    colors[idx * 3 + 1] = g[1] * gShade;
    colors[idx * 3 + 2] = g[2] * gShade;
    alphas[idx] = 0.9;
    sizes[idx] = 2.8;
  }
}

function edgePos(edge, t, hw, hh, hd) {
  switch (edge) {
    case 0:  return [-hw, -hh + t * hh * 2, -hd];
    case 1:  return [hw,  -hh + t * hh * 2, -hd];
    case 2:  return [-hw, -hh + t * hh * 2, hd];
    case 3:  return [hw,  -hh + t * hh * 2, hd];
    case 4:  return [-hw + t * hw * 2, -hh, -hd];
    case 5:  return [-hw + t * hw * 2, hh,  -hd];
    case 6:  return [-hw + t * hw * 2, -hh, hd];
    case 7:  return [-hw + t * hw * 2, hh,  hd];
    case 8:  return [-hw, -hh, -hd + t * hd * 2];
    case 9:  return [hw,  -hh, -hd + t * hd * 2];
    case 10: return [-hw, hh,  -hd + t * hd * 2];
    default: return [hw,  hh,  -hd + t * hd * 2];
  }
}

function updatePositions(folds, time) {
  const v = new THREE.Vector3();
  const axis = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion();
  const hw = PANEL_W * 0.5, hh = PANEL_H * 0.5, hd = PANEL_D * 0.5;

  for (let i = 0; i < N; i++) {
    if (particleType[i] === 1) {
      const ti = panelIdsArr[i] | 0;
      const ox = localCoords[i * 3], oy = localCoords[i * 3 + 1], oz = localCoords[i * 3 + 2];
      const angle = Math.atan2(oz, ox);
      const r = Math.sqrt(ox * ox + oz * oz);
      const breathe = Math.sin(time * 0.22 + ti * 1.3 + angle * 2.0) * 0.12;
      positions[i * 3] = Math.cos(angle) * (r + breathe);
      positions[i * 3 + 1] = oy + Math.sin(time * 0.16 + ti * 0.8) * 0.05;
      positions[i * 3 + 2] = Math.sin(angle) * (r + breathe);
      continue;
    }

    const p = panelIdsArr[i] | 0;
    const def = panelDefs[p];

    if (particleType[i] === 2) {
      // Trace: animate along edges
      const edge = traceEdge[i * 2] | 0;
      const phase = tracePhase[i];
      const speed = 0.15 + (p % 7) * 0.03;
      const rawT = (time * speed + phase) % 1.0;
      // ping-pong
      const t = rawT < 0.5 ? rawT * 2.0 : 2.0 - rawT * 2.0;
      const ep = edgePos(edge, t, hw, hh, hd);
      v.set(ep[0], ep[1], ep[2]);

      // pulse alpha based on position
      const pulse = 0.6 + 0.4 * Math.sin(time * 1.5 + phase * 3.0);
      alphas[i] = pulse;
    } else {
      v.set(localCoords[i * 3], localCoords[i * 3 + 1], localCoords[i * 3 + 2]);
    }

    const foldAngle = folds[p];
    quat.setFromAxisAngle(axis, foldAngle);
    v.applyQuaternion(quat);

    const orientQuat = new THREE.Quaternion();
    orientQuat.setFromAxisAngle(axis, def.ribAngle);
    const normalQuat = new THREE.Quaternion();
    normalQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), def.hingeRot);
    orientQuat.multiply(normalQuat);
    v.applyQuaternion(orientQuat);

    v.x += def.basePos[0];
    v.y += def.basePos[1];
    v.z += def.basePos[2];

    positions[i * 3] = v.x;
    positions[i * 3 + 1] = v.y;
    positions[i * 3 + 2] = v.z;
  }
}

seed = Math.floor(Math.random() * 1e9);
definePanels();
populateAll();
updatePositions(foldCurrents, 0);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));
geom.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  depthTest: true,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 color;
    attribute float aAlpha;
    attribute float aSize;
    varying vec3 vColor;
    varying float vAlpha;
    varying float vDepth;
    void main(){
      vColor = color;
      vAlpha = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDepth = -mv.z;
      gl_PointSize = uPixel * aSize * (2.0 + 14.0 / max(vDepth, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;
      float soft = 1.0 - smoothstep(0.15, 0.25, r2);
      float shade = clamp(1.0 - vDepth * 0.013, 0.3, 1.0);
      vec3 col = vColor * shade;
      float fogFactor = smoothstep(35.0, 70.0, vDepth);
      vec3 fogCol = vec3(0.071, 0.067, 0.059);
      col = mix(col, fogCol, fogFactor);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `
});

const cloud = new THREE.Points(geom, mat);
scene.add(cloud);

let azimuth = 0.4, elevation = 0.25, radius = 20;
let targetAz = azimuth, targetEl = elevation;
let isDragging = false, lastMx = 0, lastMy = 0;
let autoRotate = true;

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  isDragging = true; autoRotate = false;
  lastMx = e.clientX; lastMy = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  targetAz -= (e.clientX - lastMx) * 0.005;
  targetEl += (e.clientY - lastMy) * 0.005;
  targetEl = Math.max(-1.3, Math.min(1.3, targetEl));
  lastMx = e.clientX; lastMy = e.clientY;
});
canvas.addEventListener('pointerup', () => { isDragging = false; });
canvas.addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9);
  definePanels(); populateAll();
  geom.attributes.color.needsUpdate = true;
  geom.attributes.aAlpha.needsUpdate = true;
  geom.attributes.aSize.needsUpdate = true;
  autoRotate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = renderer.getPixelRatio();
});

function computeCentroid() {
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < N; i += 50) {
    cx += positions[i * 3]; cy += positions[i * 3 + 1]; cz += positions[i * 3 + 2]; count++;
  }
  return new THREE.Vector3(cx / count, cy / count, cz / count);
}

const startTime = performance.now();
const lookTarget = new THREE.Vector3(0, 2.5, 0);

function loop() {
  const t = (performance.now() - startTime) / 1000;

  for (let i = 0; i < TOTAL_PANELS; i++) {
    const baseAngle = foldTargets[i];
    const breathe = Math.sin(t * 0.25 + i * 0.9) * 0.3;
    const harmonic = Math.sin(t * 0.1 + i * 1.4) * 0.12;
    foldCurrents[i] += (baseAngle + breathe + harmonic - foldCurrents[i]) * 0.03;
  }

  updatePositions(foldCurrents, t);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.aAlpha.needsUpdate = true;
  geom.computeBoundingSphere();

  if (autoRotate) targetAz += 0.0012;
  azimuth += (targetAz - azimuth) * 0.06;
  elevation += (targetEl - elevation) * 0.06;

  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.04);

  camera.position.set(
    lookTarget.x + radius * Math.cos(elevation) * Math.sin(azimuth),
    lookTarget.y + radius * Math.sin(elevation),
    lookTarget.z + radius * Math.cos(elevation) * Math.cos(azimuth)
  );
  camera.lookAt(lookTarget);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
