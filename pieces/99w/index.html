<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x06070a, 0.016);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06070a, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

/* ── repeatable rng ── */
const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

/* ── L-system cypress (pose A) ── */
const RULES = {
  'F': [{ p:0.55, s:'F[+f][-f]F' }, { p:0.25, s:'FF[/f]\\F' }, { p:0.20, s:'F[+f-f][/f\\f]F' }],
  'f': [{ p:0.6, s:'f[+f][-f]' }, { p:0.4, s:'f' }]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, r){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const rv = r(); let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (rv <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [], segments = [];
  let pos = new THREE.Vector3(), h = new THREE.Vector3(0,1,0),
      l = new THREE.Vector3(-1,0,0), u = new THREE.Vector3(0,0,1), gen = 0;
  const rot = (ax, a) => { const q = new THREE.Quaternion().setFromAxisAngle(ax, a);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q); };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from:pos.clone(), to:next.clone(), gen }); pos = next; break; }
      case '+': rot(u, +ANGLE); break; case '-': rot(u, -ANGLE); break;
      case '&': rot(l, +ANGLE); break; case '^': rot(l, -ANGLE); break;
      case '/': rot(h, +ANGLE*1.5); break; case '\\': rot(h, -ANGLE*1.5); break;
      case '[': stack.push({pos:pos.clone(),h:h.clone(),l:l.clone(),u:u.clone(),gen}); gen++; break;
      case ']': { const f = stack.pop(); pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen; break; }
    }
  }
  return segments;
}

const cypressSegs = turtle(expand('F', 6, rng));

/* ── DISRUPTION ZONES ──
   4 intentional breaks — pulled threads in the weave.
   Zone A: rectangular void carved from tower tier 1 (+x face, z∈[-2,1]) — empty absence
   Zone B: density spike at tower base corner (-x,-z) — particles pile up 3×
   Zone C: spire shifted +1.4x off-center — asymmetric crown
   Zone D: tier 3 horizontal band dissolves — particles scatter outward at y≈10.5
   On cypress side: A→vertical scar, B→dense knot, C→leaning crown, D→ragged gap */

const VOID_A = { face:0, zMin:-2, zMax:1, yMin:4.5, yMax:7.0 }; // tower void
const SPIKE_B = { xMin:-4.5, xMax:-2.5, zMin:-4.5, zMax:-2.5, yMin:0, yMax:3 }; // density zone
const SPIRE_SHIFT = 1.4; // off-center spire
const SCATTER_Y = 10.5; // dissolving band height
const SCATTER_BAND = 0.6;

/* ── art-deco tower (pose B) with disruptions ── */
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();
  const tiers = [
    { hw:4.5, y0:0.0, y1:4.0, ridges:14 },
    { hw:3.4, y0:4.0, y1:7.5, ridges:12 },
    { hw:2.4, y0:7.5, y1:10.5, ridges:10 },
    { hw:1.5, y0:10.5, y1:13.0, ridges:8 },
    { hw:0.85, y0:13.0, y1:15.0, ridges:6 },
  ];
  const spireBase = 0.6;
  const W = Math.floor(N*0.50), B = Math.floor(N*0.22),
        S = Math.floor(N*0.12), SP = Math.floor(N*0.06), C = N-W-B-S-SP;
  let i = 0;

  // wall ridges
  const tw = tiers.map(t => 8*t.hw*(t.y1-t.y0));
  const twt = tw.reduce((a,b)=>a+b,0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = ti === tiers.length-1 ? W-i : Math.floor(tw[ti]/twt*W);
    const end = Math.min(i+count, W);
    while(i < end){
      const face = Math.floor(Math.random()*4);
      const r = Math.floor(Math.random()*t.ridges);
      const rf = (r+0.5)/t.ridges;
      const along = (rf*2-1)*t.hw;
      const y = t.y0 + Math.random()*(t.y1-t.y0);
      const j = 0.04;
      switch(face){
        case 0: pos.set(t.hw+(Math.random()-.5)*j, y, along); break;
        case 1: pos.set(-t.hw+(Math.random()-.5)*j, y, along); break;
        case 2: pos.set(along, y, t.hw+(Math.random()-.5)*j); break;
        case 3: pos.set(along, y, -t.hw+(Math.random()-.5)*j); break;
      }
      // VOID A: skip particles in the void zone (face 0, tier 1-ish)
      if (face === 0 && pos.z >= VOID_A.zMin && pos.z <= VOID_A.zMax
          && pos.y >= VOID_A.yMin && pos.y <= VOID_A.yMax) continue;
      // SCATTER D: at dissolving band, push particles outward
      if (Math.abs(pos.y - SCATTER_Y) < SCATTER_BAND){
        const scatter = Math.pow(Math.random(), 0.5) * 3.5;
        const th = Math.random() * Math.PI * 2;
        pos.x += Math.cos(th) * scatter;
        pos.z += Math.sin(th) * scatter;
        pos.y += (Math.random()-0.5) * 0.8;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }

  // horizontal bands
  const bEnd = i + B;
  while (i < bEnd){
    const ti = Math.floor(Math.random()*tiers.length);
    const t = tiers[ti];
    const edge = Math.random()<0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random()*4);
    const f = Math.random()*2-1;
    const along = f * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set(t.hw, edge+(Math.random()-.5)*j, along); break;
      case 1: pos.set(-t.hw, edge+(Math.random()-.5)*j, along); break;
      case 2: pos.set(along, edge+(Math.random()-.5)*j, t.hw); break;
      case 3: pos.set(along, edge+(Math.random()-.5)*j, -t.hw); break;
    }
    // VOID A check
    if (face === 0 && pos.z >= VOID_A.zMin && pos.z <= VOID_A.zMax
        && pos.y >= VOID_A.yMin && pos.y <= VOID_A.yMax) continue;
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // spire — shifted off-center (DISRUPTION C)
  const sEnd = i + S;
  while (i < sEnd){
    const t = Math.random();
    const y = 15 + t * 5.5;
    const r = spireBase * (1-t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th)*r + SPIRE_SHIFT, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // SPIKE B: extra-dense cluster at base corner
  const spEnd = i + SP;
  while (i < spEnd){
    pos.set(
      SPIKE_B.xMin + Math.random()*(SPIKE_B.xMax-SPIKE_B.xMin),
      SPIKE_B.yMin + Math.random()*(SPIKE_B.yMax-SPIKE_B.yMin),
      SPIKE_B.zMin + Math.random()*(SPIKE_B.zMax-SPIKE_B.zMin)
    );
    // cluster tighter — cube root distribution toward center
    const cx = (SPIKE_B.xMin+SPIKE_B.xMax)/2, cz = (SPIKE_B.zMin+SPIKE_B.zMax)/2;
    pos.x = cx + (pos.x-cx)*Math.pow(Math.random(),0.4);
    pos.z = cz + (pos.z-cz)*Math.pow(Math.random(),0.4);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  // sunburst crown — also shifted with spire
  while (i < N){
    const ch = Math.floor(Math.random()*16);
    const th = (ch+0.5)/16 * Math.PI * 2;
    const along = Math.random();
    const r = 0.7 + along * 1.3;
    const y = 14.6 + along * 0.8 + (Math.random()-.5)*0.05;
    pos.set(Math.cos(th)*r + SPIRE_SHIFT, y, Math.sin(th)*r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

/* ── build particle arrays ── */
const N = 70000;
const treePos = new Float32Array(N*3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);
const disruption = new Float32Array(N); // 0=normal, 1=in disruption zone

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b,0);
const N_SKEL = Math.floor(N * 0.50);
const N_FOL = N - N_SKEL;
let written = 0;
const v = new THREE.Vector3();

// CYPRESS DISRUPTIONS:
// Scar: vertical gap at angle ~70°, height 30-65% — a lightning scar
const SCAR_ANGLE = 1.22; // ~70°
const SCAR_WIDTH = 0.35; // angular width
const SCAR_Y0 = 0.30, SCAR_Y1 = 0.65; // fractional height
// Dense knot at height ~25%, all angles
const KNOT_Y = 0.25, KNOT_BAND = 0.06;
// Leaning crown: top 15% tilts +x
const LEAN_Y = 0.85, LEAN_AMT = 0.8;

for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length-1 ? (N_SKEL-written) : Math.max(1, Math.floor(N_SKEL*lens[i]/totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const j = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-.5)*j;
    treePos[written*3+1] = v.y + (Math.random()-.5)*j;
    treePos[written*3+2] = v.z + (Math.random()-.5)*j;
    seeds[written] = Math.random();
    written++;
  }
}

// foliage with disruptions
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin,s.from.y,s.to.y); yMax = Math.max(yMax,s.from.y,s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8, SPIRAL = 0.9;
  const TUFT_COUNT = 24;
  const tuftYs = [], tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    tuftYs.push(haloYStart + ((i+0.5)/TUFT_COUNT) * (yMax-haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }

  const N_RIDGE = Math.floor(N_FOL * 0.60);
  const N_TUFT = N_FOL - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5*Math.pow(yt-0.45, 2));
    let baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random()*RIDGES);
    const ridgeTh = (ridge/RIDGES)*Math.PI*2 + y*SPIRAL;
    let th = ridgeTh + (Math.random()-.5)*0.30;
    let r = baseR * (0.55 + 0.45*Math.random());
    let px = Math.cos(th)*r, py = y + (Math.random()-.5)*0.05, pz = Math.sin(th)*r;

    // SCAR: reject particles in the scar zone
    const normTh = ((th % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    const yFrac = (y - haloYStart) / (yMax - haloYStart);
    if (Math.abs(normTh - SCAR_ANGLE) < SCAR_WIDTH && yFrac > SCAR_Y0 && yFrac < SCAR_Y1){
      disruption[written] = 1.0;
      // push these particles OUT as scattered debris
      px += Math.cos(SCAR_ANGLE) * (0.5 + Math.random()*1.2);
      pz += Math.sin(SCAR_ANGLE) * (0.5 + Math.random()*1.2);
    }
    // KNOT: density spike near knot height
    if (Math.abs(yFrac - KNOT_Y) < KNOT_BAND){
      r *= 1.3; // thicken
      px = Math.cos(th)*r; pz = Math.sin(th)*r;
      disruption[written] = 0.5;
    }
    // LEAN: top tilts
    if (yFrac > LEAN_Y){
      const lean = (yFrac - LEAN_Y) / (1.0 - LEAN_Y) * LEAN_AMT;
      px += lean;
    }

    treePos[written*3]=px; treePos[written*3+1]=py; treePos[written*3+2]=pz;
    seeds[written] = Math.random();
    written++;
  }

  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random()*TUFT_COUNT);
    const tuftY = tuftYs[t];
    const tuftTh = tuftThetas[t];
    const yt = (tuftY-haloYStart) / (yMax-haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5*Math.pow(yt-0.45, 2));
    const baseR = 0.05 + 0.95*taper;
    const reach = baseR + 0.1 + Math.random()*0.35;
    const localY = tuftY + (Math.random()-.5)*0.4;
    const localTh = tuftTh + (Math.random()-.5)*0.4;
    const localR = reach + (Math.random()-.5)*0.18;
    let px = Math.cos(localTh)*localR, pz = Math.sin(localTh)*localR;

    // LEAN for tufts too
    const yFrac = (localY-haloYStart)/(yMax-haloYStart);
    if (yFrac > LEAN_Y){
      px += (yFrac-LEAN_Y)/(1.0-LEAN_Y)*LEAN_AMT;
    }

    treePos[written*3]=px; treePos[written*3+1]=localY; treePos[written*3+2]=pz;
    seeds[written] = Math.random();
    written++;
  }
}
while(written < N){ treePos[written*3]=0; treePos[written*3+1]=0; treePos[written*3+2]=0; seeds[written]=Math.random(); written++; }

// mark disruption zones in tower too
for (let i = 0; i < N; i++){
  const tx = towerPos[i*3], ty = towerPos[i*3+1], tz = towerPos[i*3+2];
  // void zone
  if (tx > 3.2 && tz >= VOID_A.zMin && tz <= VOID_A.zMax && ty >= VOID_A.yMin && ty <= VOID_A.yMax)
    disruption[i] = Math.max(disruption[i], 1.0);
  // spike zone
  if (tx >= SPIKE_B.xMin && tx <= SPIKE_B.xMax && tz >= SPIKE_B.zMin && tz <= SPIKE_B.zMax && ty <= SPIKE_B.yMax)
    disruption[i] = Math.max(disruption[i], 0.5);
  // scatter band
  if (Math.abs(ty - SCATTER_Y) < SCATTER_BAND)
    disruption[i] = Math.max(disruption[i], 0.7);
}

/* ── normalize both poses ── */
function fitToHeight(arr, targetH){
  let minY=Infinity, maxY=-Infinity, cx=0, cz=0;
  const n = arr.length/3;
  for (let i=0;i<n;i++){
    minY=Math.min(minY,arr[i*3+1]); maxY=Math.max(maxY,arr[i*3+1]);
    cx+=arr[i*3]; cz+=arr[i*3+2];
  }
  cx/=n; cz/=n;
  const s = targetH/(maxY-minY);
  for (let i=0;i<n;i++){
    arr[i*3]=(arr[i*3]-cx)*s; arr[i*3+1]=(arr[i*3+1]-minY)*s; arr[i*3+2]=(arr[i*3+2]-cz)*s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

/* ── shader ── */
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uMix:   { value: 0 },
  uBreath:{ value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('disrupt',  new THREE.BufferAttribute(disruption, 1));

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uMix, uBreath;
    attribute vec3 treePos, towerPos;
    attribute float seed, disrupt;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      // breathing: whole form subtly expands/contracts (~5s cycle)
      float breath = 1.0 + uBreath * 0.035;
      p.xz *= breath;

      // sway — organic at m=0, rigid at m=1
      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = (1.0 - m) * 0.06 * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      // disrupted particles: subtle tremor
      if (disrupt > 0.3) {
        float tremor = disrupt * 0.08 * sin(uTime * 2.5 + seed * 20.0);
        p.x += tremor;
        p.z += tremor * 0.7;
      }

      float energy = 0.5 + 0.5 * sin(t * 0.8);

      // palette: forest greens → bronze/cream, with rust accent at disruptions
      vec3 treeA  = vec3(0.15, 0.32, 0.18);
      vec3 treeB  = vec3(0.48, 0.72, 0.30);
      vec3 treeC  = vec3(0.80, 0.88, 0.50);
      vec3 decoA  = vec3(0.40, 0.28, 0.16);
      vec3 decoB  = vec3(0.88, 0.68, 0.36);
      vec3 decoC  = vec3(0.96, 0.91, 0.80);
      vec3 ruptCol = vec3(0.72, 0.30, 0.18); // burnt sienna accent

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 tCol = mix(treeA, treeB, hk);
      tCol = mix(tCol, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      vec3 dCol = mix(decoA, decoB, hk);
      dCol = mix(dCol, decoC, smoothstep(0.85, 1.0, hk) * 0.7);
      vec3 col = mix(tCol, dCol, m);

      // disruption zones get the rust accent
      col = mix(col, ruptCol, disrupt * 0.55);

      vCol = col;
      // disrupted scattered particles slightly dimmer
      float disruptFade = 1.0 - disrupt * 0.25;
      vAlpha = (0.4 + 0.6 * energy) * disruptFade;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.85 + 0.7 * energy) * uPixel * (48.0 / dist);
      // density-spike particles slightly larger
      if (disrupt > 0.3 && disrupt < 0.6) gl_PointSize *= 1.25;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── dust motes for atmosphere ── */
const dustN = 600;
const dustGeo = new THREE.BufferGeometry();
const dustP = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++){
  dustP[i*3]   = (Math.random()-0.5)*30;
  dustP[i*3+1] = Math.random()*20;
  dustP[i*3+2] = (Math.random()-0.5)*30;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustP, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.08, color: 0x887766, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(dustGeo, dustMat));

/* ── subtle side-light gradient (warm from above, cool below) ── */
const gradGeo = new THREE.PlaneGeometry(80, 40);
const gradMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: {},
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `varying vec2 vUv; void main(){
    vec3 warm = vec3(0.12, 0.07, 0.03);
    vec3 cool = vec3(0.02, 0.04, 0.06);
    vec3 c = mix(cool, warm, vUv.y);
    gl_FragColor = vec4(c, 0.08);
  }`
});
const gradPlane = new THREE.Mesh(gradGeo, gradMat);
gradPlane.position.set(0, 10, -20);
scene.add(gradPlane);

/* ── interaction ── */
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();

function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  uniforms.uBreath.value = Math.sin(t * 0.22 * Math.PI * 2); // ~4.5s cycle

  const auto = (Math.floor(t / 12) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.018;
  uniforms.uMix.value = phase;

  const pct = Math.round((1-phase)*100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100-pct}%`;

  // gentle camera orbit, slightly asymmetric path (not a perfect circle — intentional)
  const ang = t * 0.045;
  const camR = 22 + 2.5 * Math.sin(ang * 1.7); // breathing radius
  camera.position.x = Math.sin(ang) * camR;
  camera.position.z = Math.cos(ang) * camR;
  camera.position.y = 6 + 1.5 * Math.sin(t * 0.08);
  camera.lookAt(0.3, 8, 0); // slightly off-center target — matches the spire shift
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
