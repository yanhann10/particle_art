<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m0d · hyperstition vascular</title>
<!--
  PALETTE REASON:
  The vascular L-system evokes a dried botanical specimen — a pressed fern root
  cross-section, an ink-drawn anatomy plate aged on parchment. Three colors:
    DOMINANT  (~70%) — Warm Umber  #3D2210: trunk mass and body weight; darkness
                        that holds the form's volume, not mere background fill.
    SUPPORT   (~25%) — Sap Amber   #C4882A: the growth-edge color; where living
                        sap catches oblique light along new branch rims.
    ACCENT    (~5%)  — Bone White  #E8DECE: terminus flash only — the rarest
                        moment, maximum peristaltic tension at deepest branch tips.
  Hierarchy: darkness holds the mass → amber traces the growth edge → bone marks
  the terminus. Background #0D0907: near-black earth, not void — aged paper ground.
-->
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d0907; }
body { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
body::before {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:3;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px,
    transparent 1px, transparent 3px
  );
  mix-blend-mode: multiply;
}
body::after {
  content:""; position:fixed; inset:0; pointer-events:none; z-index:2;
  background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,0.68) 100%);
}
canvas { display:block; position:relative; z-index:0; }
.id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; color:#cdd2dc; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<div class="id">m0d</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 120);
camera.position.set(1.5, 2.0, 11);
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0907, 1);
document.body.appendChild(renderer.domElement);

let audioLevel = 0, bassLevel = 0, analyser = null, freqData = null;
async function initAudio() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(e) {}
}
initAudio();
function updateAudio() {
  if (!analyser) return;
  analyser.getByteFrequencyData(freqData);
  let sum = 0, bassSum = 0;
  for (let i = 0; i < freqData.length; i++) { sum += freqData[i]; if (i < 8) bassSum += freqData[i]; }
  audioLevel = sum / (freqData.length * 255);
  bassLevel = bassSum / (8 * 255);
}

const N = 80000;
const positions = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const branchIds = new Float32Array(N);

let regrowSeed = Math.random() * 1e9;

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildVascularField(seed) {
  const rng = mulberry32(seed >>> 0);
  const branches = [];
  const maxDepth = 6;
  function grow(x, y, z, angle, angleZ, depth) {
    if (depth > maxDepth) return;
    const len = 1.2 * (1 - depth * 0.08) * (0.7 + rng() * 0.6);
    const steps = 12; const pts = [];
    let cx = x, cy = y, cz = z;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const wobble = Math.sin(t * Math.PI * 3 + rng() * 6.28) * 0.08 * (1 + depth * 0.3);
      cx = x + Math.cos(angle) * Math.cos(angleZ) * len * t + wobble * Math.sin(angle);
      cy = y + Math.sin(angleZ) * len * t + wobble * Math.cos(angleZ);
      cz = z + Math.sin(angle) * Math.cos(angleZ) * len * t + wobble * Math.cos(angle);
      pts.push({ x: cx, y: cy, z: cz });
    }
    branches.push({ pts, depth });
    const nBranch = depth < 3 ? 2 + Math.floor(rng() * 2) : 1 + Math.floor(rng() * 2);
    for (let b = 0; b < nBranch; b++) {
      const spread = 0.4 + rng() * 0.5;
      grow(cx, cy, cz, angle + (rng()-0.5)*spread*2, angleZ + (rng()-0.5)*spread, depth + 1);
    }
  }
  const nRoots = 3 + Math.floor(rng() * 3);
  for (let r = 0; r < nRoots; r++) grow(0, 0, 0, rng() * Math.PI * 2, (rng()-0.5)*1.2, 0);

  let written = 0;
  const total = branches.length;
  while (written < N) {
    const br = branches[Math.floor(rng() * total)];
    const pts = br.pts;
    const pi = Math.floor(rng() * (pts.length - 1));
    const t = rng();
    const p0 = pts[pi], p1 = pts[Math.min(pi+1, pts.length-1)];
    const thick = 0.15 * (1 - br.depth / (maxDepth + 1)) + 0.02;
    const i3 = written * 3;
    positions[i3]   = p0.x + (p1.x - p0.x) * t + (rng()-0.5)*2*thick;
    positions[i3+1] = p0.y + (p1.y - p0.y) * t + (rng()-0.5)*2*thick;
    positions[i3+2] = p0.z + (p1.z - p0.z) * t + (rng()-0.5)*thick;
    seeds[written] = rng();
    branchIds[written] = br.depth / maxDepth;
    written++;
  }
}
buildVascularField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('branchId', new THREE.BufferAttribute(branchIds, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uBeat:    { value: 0 },
  uBass:    { value: 0 },
  uPointer: { value: new THREE.Vector2(0, 0) }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uBeat, uBass;
    uniform vec2 uPointer;
    attribute float seed, branchId;
    varying float vSeed, vBranch, vPulse, vDepth;
    void main() {
      vec3 p = position;
      float dist = length(p);
      // Slow peristaltic sine — 110 BPM, contemplative
      float pulsePhase = dist * 2.0 - uTime * 1.833 * 6.2832;
      float pulse = 0.5 + 0.5 * sin(pulsePhase);
      vPulse = pulse;
      float breathe = sin(uTime * 1.833 * 0.5) * 0.11;
      p *= 1.0 + breathe * (1.0 - branchId);
      p *= 1.0 + uBass * 0.22;
      vec3 radDir = normalize(p + 0.001);
      p += radDir * pulse * 0.045 * (1.0 + uBass * 0.35);
      vec3 pw = vec3(uPointer * 4.0, 0.0);
      vec3 diff = p - pw;
      float d2 = dot(diff, diff);
      if (d2 < 4.0) p += normalize(diff) * (2.0 - sqrt(d2)) * 0.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z; vSeed = seed; vBranch = branchId;
      float sz = (1.5 + pulse * 1.1 + uBass * 1.4) * uPixel * (6.0 / max(vDepth, 1.0));
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vSeed, vBranch, vPulse, vDepth;
    uniform float uTime, uBeat, uBass;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d,d) > 0.22) discard;

      // Warm Umber #3D2210 — dominant 70%: trunk mass, body weight
      // Sap Amber  #C4882A — support  25%: growth edge, sap rim on new branches
      // Bone White #E8DECE — accent    5%: terminus flash, deepest-tip tension only
      vec3 umber = vec3(0.239, 0.133, 0.063);
      vec3 amber = vec3(0.769, 0.533, 0.165);
      vec3 bone  = vec3(0.910, 0.871, 0.808);

      // Quadratic blend: heavy umber bias, amber earned only at true tips
      float tipness = smoothstep(0.0, 0.8, vBranch);
      vec3 col = mix(umber, amber, tipness * tipness);

      // Bone accent: only deepest tips at pulse peak — rarest 5%
      float boneWeight = step(0.88, vBranch) * step(0.75, vPulse);
      col = mix(col, bone, boneWeight * (0.35 + uBeat * 0.35));

      // Brightness modulates within the palette, no hue shift
      col *= 0.60 + 0.50 * vPulse;

      // Depth fog to #0D0907 — warm dark, same temperature as background
      float fog = clamp((vDepth - 5.0) / 17.0, 0.0, 0.78);
      col = mix(col, vec3(0.051, 0.035, 0.027), fog);

      float alpha = (0.88 + 0.12 * vPulse) * (1.0 - fog * 0.45);
      gl_FragColor = vec4(col, alpha);
    }
  `
});
scene.add(new THREE.Points(geom, mat));

// Glyph scatter — palette-consistent umber→amber drift
const gc = document.createElement('canvas'); gc.width = 256; gc.height = 256;
const gctx = gc.getContext('2d');
gctx.fillStyle = '#000'; gctx.fillRect(0,0,256,256);
'∂∇∫∮∞≡≢⊕⊗⊲⊳⧫◊◈⌬⏣'.split('').forEach((g, idx) => {
  gctx.fillStyle = '#fff'; gctx.font = '48px ui-monospace,monospace';
  gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(g, (idx%4)*64+32, Math.floor(idx/4)*64+32);
});
const glyphTex = new THREE.CanvasTexture(gc); glyphTex.minFilter = THREE.LinearFilter;

const NG = 480, gGeom = new THREE.BufferGeometry();
const gPos = new Float32Array(NG*3), gSd = new Float32Array(NG);
for (let i = 0; i < NG; i++) {
  gPos[i*3] = (Math.random()-0.5)*10; gPos[i*3+1] = (Math.random()-0.5)*10;
  gPos[i*3+2] = (Math.random()-0.5)*6; gSd[i] = Math.random();
}
gGeom.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
gGeom.setAttribute('seed',     new THREE.BufferAttribute(gSd, 1));
scene.add(new THREE.Points(gGeom, new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uMap: { value: glyphTex } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel; attribute float seed;
    varying float vSeed, vAlpha;
    void main() {
      vec3 p = position;
      float t = uTime * 0.22 + seed * 40.0;
      p.x += sin(t*0.7)*1.1; p.y += cos(t*0.5)*0.9; p.z += sin(t*0.3+seed*10.0)*0.5;
      float cy = fract(uTime*0.055 + seed);
      vAlpha = smoothstep(0.0,0.1,cy)*smoothstep(1.0,0.7,cy)*0.25;
      vSeed = seed;
      vec4 mv = modelViewMatrix * vec4(p,1.0);
      gl_PointSize = 13.0*uPixel*(4.0/max(-mv.z,1.0));
      gl_Position = projectionMatrix*mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uMap; uniform float uTime;
    varying float vSeed, vAlpha;
    void main() {
      float idx = floor(vSeed*16.0);
      vec2 uv = gl_PointCoord*0.25 + vec2(mod(idx,4.0)*0.25, floor(idx/4.0)*0.25);
      float g = texture2D(uMap, uv).r;
      if (g < 0.3) discard;
      float t = sin(uTime*0.7+vSeed*6.28)*0.5+0.5;
      // umber → amber within palette, no outside colors
      vec3 col = mix(vec3(0.239,0.133,0.063), vec3(0.769,0.533,0.165), t);
      gl_FragColor = vec4(col, g*vAlpha);
    }
  `
})));

addEventListener('pointermove', e => uniforms.uPointer.value.set(
  (e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1));
addEventListener('click', () => {
  regrowSeed = Math.random()*1e9;
  buildVascularField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.branchId.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function computeCentroid() {
  let cx=0,cy=0,cz=0; const pos=geom.attributes.position.array;
  const step=Math.floor(N/2000);
  for (let i=0;i<N;i+=step){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2];}
  const c=Math.ceil(N/step); return new THREE.Vector3(cx/c,cy/c,cz/c);
}

const start = performance.now();
const lookTarget = new THREE.Vector3();

function loop() {
  const t = (performance.now()-start)/1000;
  uniforms.uTime.value = t;
  updateAudio();
  uniforms.uBass.value += (bassLevel - uniforms.uBass.value) * 0.3;
  // 110 BPM beat
  uniforms.uBeat.value = ((t*110/60)%1) < 0.18 ? 1 : 0;

  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.04);

  // Contemplative camera: three independent slow sinusoids, no Y-axis orbit
  camera.position.x = 1.5 + Math.sin(t * 0.051) * 0.5;
  camera.position.y = 2.0 + Math.sin(t * 0.073) * 0.9;
  camera.position.z = 11.0 + Math.sin(t * 0.039) * 0.7;
  camera.lookAt(lookTarget);

  renderer.setClearColor(0x0d0907, 1);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(k,id){try{var s=new Set(JSON.parse(localStorage.getItem(k)||'[]'));s.add(id);localStorage.setItem(k,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(a){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:a})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim(); if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){var qs='?a='+pid+(d.job_id?'&job='+d.job_id:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>
