<title>6pt · aria from moiré</title>
<!-- MOTION: ascend, intensity: gentle -->
<!-- CREATIVE_CONSTRAINT: one sustained vocal line — flat moiré gathers into a single rising column -->
<!-- ALGO_PATTERN: standing wave harmonics on cylindrical resonant surface -->
<!-- EVOKES: Anish Kapoor's void columns meets Riley's wave fields — breath made visible in parchment ink -->
<!-- INTENT: The Riley moiré disk slowly gathers and rises into a single sustained column of breath — an aria. Harmonic standing-wave bands wrap the column like nodes in a resonating tube. Gentle vibrato sways the form. Click to take a new breath. -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }

    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; }

<div class="id">6pt</div>
<div class="hint">click to breathe again · drag to nudge</div>
<div class="src">descended from qwf · aria · breath column</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ARIA — chain from qwf (Riley moiré swerve):
// The flat ink-on-parchment interference pattern gathers itself
// and rises into a single sustained column of breath — an aria.
// Standing-wave harmonics wrap the column like nodes in a resonating
// tube. The moiré bands become vocal-cord vibrations. Vibrato sways
// the column gently. Click to exhale and re-inhale: the column
// disperses to the flat field, then gathers and rises again.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.2, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

/* ── particle disk: parent layout preserved for morph ── */
const N = 80000;
const positions = new Float32Array(N * 3);
const seedAttr  = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const r  = Math.sqrt(Math.random()) * 4.0;
  const th = Math.random() * Math.PI * 2;
  positions[i * 3]     = r * Math.cos(th);
  positions[i * 3 + 1] = 0;
  positions[i * 3 + 2] = r * Math.sin(th);
  seedAttr[i] = Math.random();
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seedAttr, 1));

/* ── wave parameters (from parent, randomised on click) ── */
function randomWaves() {
  const TAU = Math.PI * 2;
  return {
    w1: new THREE.Vector3(Math.random() * TAU, 1.6 + Math.random() * 1.2, Math.random() * TAU),
    w2: new THREE.Vector3(Math.random() * TAU, 2.1 + Math.random() * 1.4, Math.random() * TAU),
    w3: new THREE.Vector3(Math.random() * TAU, 0.8 + Math.random() * 0.6, Math.random() * TAU),
    radK: 1.3 + Math.random() * 0.6
  };
}
let waves = randomWaves();

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uMorph:   { value: 0 },
  uWave1:   { value: waves.w1 },
  uWave2:   { value: waves.w2 },
  uWave3:   { value: waves.w3 },
  uRadK:    { value: waves.radK }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime, uPixel, uMorph;
    uniform vec2  uPointer;
    uniform vec3  uWave1, uWave2, uWave3;
    uniform float uRadK;
    attribute float seed;
    varying float vField, vSeed, vDepth, vHeight;

    void main(){
      vec2 p2 = vec2(position.x, position.z);
      float r = length(p2);
      float th = atan(position.z, position.x);

      // ── FLAT STATE (parent moiré) ──
      float v1 = sin(p2.x*cos(uWave1.x)*uWave1.y + p2.y*sin(uWave1.x)*uWave1.y + uWave1.z);
      float v2 = sin(p2.x*cos(uWave2.x)*uWave2.y + p2.y*sin(uWave2.x)*uWave2.y + uWave2.z);
      float v3 = sin(p2.x*cos(uWave3.x)*uWave3.y + p2.y*sin(uWave3.x)*uWave3.y + uWave3.z);
      float vR = sin(r * uRadK);
      float fFlat = (v1 + v2 + v3 + vR) * 0.25;
      float fall = exp(-r * r * 0.10);
      float visFlat = smoothstep(-0.05, 0.18, fFlat) * fall;

      float scallop = cos(th * 6.0) * 0.18 * (r / 4.0);
      float yFlat = -0.15 * r * r + scallop;
      // gentle breathing on flat state
      float bt = uTime * 0.22 + seed * 6.28;
      yFlat += 0.03 * sin(bt);
      vec3 flatPos = vec3(position.x, yFlat, position.z);

      // ── COLUMN STATE (aria) ──
      float colH = 7.0;
      // height: blend seed with inverted radius → center rises first
      float hNorm = mix(seed, 1.0 - clamp(r / 4.0, 0.0, 1.0), 0.35);
      float yCol = hNorm * colH - 0.8;

      // taper: wide base → narrow waist → slight bell at top
      float baseTaper = mix(1.35, 0.28, hNorm);
      float bell = 0.22 * smoothstep(0.86, 1.0, hNorm);

      // standing-wave harmonics modulate column radius
      float PI = 3.14159;
      float h1 = sin(hNorm * PI);
      float h2 = sin(hNorm * PI * 2.0);
      float h3 = sin(hNorm * PI * 3.0);
      float harmR = 0.10 * h1
                   + 0.06 * h2 * sin(uTime * 0.35)
                   + 0.04 * h3 * sin(uTime * 0.55);

      float colR = baseTaper + bell + harmR;
      float colX = colR * cos(th);
      float colZ = colR * sin(th);

      // vibrato: gentle lateral sway, stronger at top
      float vibAmp = 0.14 * uMorph * smoothstep(0.0, 0.5, hNorm);
      colX += vibAmp * sin(uTime * 2.1 + hNorm * 1.8);
      colZ += vibAmp * 0.35 * cos(uTime * 2.1 + hNorm * 1.8 + 1.0);

      // column breathing
      yCol += 0.04 * sin(bt * 0.8) * hNorm;

      vec3 colPos = vec3(colX, yCol, colZ);

      // column visibility: harmonic bands wrap the surface
      float cV  = sin(th * 2.5 + hNorm * 9.0 + uTime * 0.12);
      float cV2 = sin(hNorm * 13.0 - uTime * 0.09);
      float visCol = smoothstep(-0.15, 0.50, cV + cV2 * 0.55)
                   * smoothstep(0.0, 0.07, hNorm)
                   * smoothstep(1.0, 0.91, hNorm);

      // ── MORPH ──
      vec3 pos = mix(flatPos, colPos, uMorph);
      float vis = mix(visFlat, visCol, uMorph);

      // pointer tilt (gentle, reduced during column)
      float tiltScale = 1.0 - uMorph * 0.55;
      float tiltX = uPointer.y * 0.16 * tiltScale;
      float tiltZ = -uPointer.x * 0.16 * tiltScale;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(pos.x, pos.y*ca - pos.z*sa, pos.y*sa + pos.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth  = -mv.z;
      vField  = vis;
      vSeed   = seed;
      vHeight = hNorm * uMorph;

      float sz = (1.3 + 0.7 * sin(bt * 0.6)) * uPixel * (5.0 / vDepth);
      gl_PointSize = vis > 0.01 ? sz : 0.0;
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vField, vSeed, vDepth, vHeight;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r * 19.0);

      // ink tones: voice warms as it rises
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 inkGlow = vec3(0.40, 0.25, 0.11);
      vec3 col = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));
      col = mix(col, inkGlow, vHeight * 0.45);

      // depth haze toward parchment
      float haze = clamp((vDepth - 8.0) / 7.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      gl_FragColor = vec4(col, a * 0.76 * vField * (1.0 - haze * 0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

/* ── dust motes: drift upward during aria ── */
const N_DUST = 280;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]   = (Math.random()-0.5)*14;
  dustPos[i*3+1] = (Math.random()-0.5)*10;
  dustPos[i*3+2] = (Math.random()-0.5)*8;
  dustSeed[i]    = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uMorph: uniforms.uMorph },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uMorph;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime*0.10 + seed*6.28;
      p.x += sin(t*1.3 + seed*30.0)*0.4;
      // updraft during column phase
      float drift = mod(uTime*(0.06 + uMorph*0.12) + seed*7.0, 5.0) - 2.5;
      p.y = mix(p.y - drift, p.y + drift*1.4, uMorph);
      p.z += cos(t*1.1 + seed*22.0)*0.3;
      float sx = -p.x/7.0, sy = p.y/5.0;
      vGlow = clamp(0.28 + 0.50*smoothstep(-0.2, 0.6, sx+sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.3*vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if(r > 0.25) discard;
      float a = exp(-r*24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a*0.65*vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

/* ── interaction ── */
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth) * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
let morphOrigin = 0;
addEventListener('click', () => {
  waves = randomWaves();
  uniforms.uWave1.value.copy(waves.w1);
  uniforms.uWave2.value.copy(waves.w2);
  uniforms.uWave3.value.copy(waves.w3);
  uniforms.uRadK.value = waves.radK;
  morphOrigin = (performance.now() - startMs) / 1000;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── smoothstep helper ── */
function ss(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

/* ── animation ── */
const startMs = performance.now();
let prevT = 0;

function loop(){
  const t  = (performance.now() - startMs) / 1000;
  prevT = t;
  uniforms.uTime.value = t;

  // morph: flat → column over 12s, starting 3s after origin
  const mt = t - morphOrigin;
  const morph = ss(3, 15, mt);
  uniforms.uMorph.value = morph;

  // camera: rises and pulls in to frame column
  const camY = 0.2 + morph * 2.6;
  const camZ = 12 - morph * 2.8;
  camera.position.set(Math.sin(t * 0.028) * 0.22, camY, camZ);
  camera.lookAt(0, morph * 2.8, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim().split(/[\s·]/)[0]||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
