<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b1t · flow-field sculpture with collision-avoided streamlines</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #1a1612 0%, #0d0a08 60%, #050302 100%);
  }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4;  font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">b1t · flow-field sculpture with collision-avoided streamlines</div>
<div class="hint">no input — watch streamlines pack without overlap · fidenza in 3D</div>
<div class="src">descended from sav · tyler hobbs collision-packing · muted earth palette</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Tyler Hobbs Fidenza signature: flow-field streamlines that NEVER OVERLAP.
// Each curve packs against existing curves like river deltas or wood grain.
// The constraint produces a Voronoi-like calm that's visually opposite to
// tangled free-flow. This is Fidenza lifted to 3D sculpture — the streamlines
// are thick ribbons with varying width (like pressure-loaded brushwork) and
// the plane they live on has gentle height-painting derived from the flow-field
// itself. Camera orbits slowly. Palette: muted earth tones — burnt umber,
// ochre, cream, charcoal — the 'Luxe' mode from the original. No specular,
// flat painterly shading.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0a08, 0.022);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 180);
camera.position.set(0, 18, 28);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ambient + directional light for sculptural depth
const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
dirLight.position.set(5, 8, 4);
scene.add(dirLight);

// ────────────── flow-field on 2D grid
const GRID_W = 80;
const GRID_H = 80;
const CELL_SIZE = 0.5;
const flowField = [];

function simplex2(x, y){
  // minimal perlin-like noise
  const G2 = (3.0 - Math.sqrt(3.0)) / 6.0;
  const s = (x + y) * 0.5 * (Math.sqrt(3.0) - 1.0);
  const i = Math.floor(x + s);
  const j = Math.floor(y + s);
  const t = (i + j) * G2;
  const X0 = i - t;
  const Y0 = j - t;
  const x0 = x - X0;
  const y0 = y - Y0;
  const i1 = (x0 > y0) ? 1 : 0;
  const j1 = (x0 > y0) ? 0 : 1;
  const x1 = x0 - i1 + G2;
  const y1 = y0 - j1 + G2;
  const x2 = x0 - 1.0 + 2.0 * G2;
  const y2 = y0 - 1.0 + 2.0 * G2;
  const gi0 = (i * 1619 + j * 31337) & 0xff;
  const gi1 = ((i + i1) * 1619 + (j + j1) * 31337) & 0xff;
  const gi2 = ((i + 1) * 1619 + (j + 1) * 31337) & 0xff;
  function grad(gi, dx, dy){
    const a = ((gi & 1) ? -dx : dx);
    const b = ((gi & 2) ? -dy : dy);
    return a + b;
  }
  let n0 = 0, n1 = 0, n2 = 0;
  let t0 = 0.5 - x0*x0 - y0*y0;
  if (t0 > 0){ t0 *= t0; n0 = t0 * t0 * grad(gi0, x0, y0); }
  let t1 = 0.5 - x1*x1 - y1*y1;
  if (t1 > 0){ t1 *= t1; n1 = t1 * t1 * grad(gi1, x1, y1); }
  let t2 = 0.5 - x2*x2 - y2*y2;
  if (t2 > 0){ t2 *= t2; n2 = t2 * t2 * grad(gi2, x2, y2); }
  return 70.0 * (n0 + n1 + n2);
}

function flowAngle(x, y){
  const nx = x * 0.08;
  const ny = y * 0.08;
  const n1 = simplex2(nx, ny);
  const n2 = simplex2(nx + 100.3, ny + 200.7);
  return (n1 + n2) * Math.PI * 1.4;
}

for (let j = 0; j < GRID_H; j++){
  for (let i = 0; i < GRID_W; i++){
    const x = (i - GRID_W * 0.5) * CELL_SIZE;
    const y = (j - GRID_H * 0.5) * CELL_SIZE;
    const angle = flowAngle(x, y);
    flowField.push({ x, y, angle });
  }
}

// height-paint: flow magnitude modulates Z
const heightMap = [];
for (let j = 0; j < GRID_H; j++){
  for (let i = 0; i < GRID_W; i++){
    const x = (i - GRID_W * 0.5) * CELL_SIZE;
    const y = (j - GRID_H * 0.5) * CELL_SIZE;
    const n = simplex2(x * 0.05, y * 0.05) * 0.3;
    const n2 = simplex2(x * 0.12 + 50, y * 0.12 + 30) * 0.15;
    heightMap.push(n + n2);
  }
}

// collision quadtree for streamline packing
class Quadtree {
  constructor(bounds, capacity = 8){
    this.bounds = bounds;
    this.capacity = capacity;
    this.points = [];
    this.divided = false;
  }
  subdivide(){
    const {x, y, w, h} = this.bounds;
    const hw = w / 2, hh = h / 2;
    this.ne = new Quadtree({x: x + hw, y: y + hh, w: hw, h: hh}, this.capacity);
    this.nw = new Quadtree({x: x,      y: y + hh, w: hw, h: hh}, this.capacity);
    this.se = new Quadtree({x: x + hw, y: y,      w: hw, h: hh}, this.capacity);
    this.sw = new Quadtree({x: x,      y: y,      w: hw, h: hh}, this.capacity);
    this.divided = true;
  }
  insert(pt){
    const {x, y, w, h} = this.bounds;
    if (pt.x < x || pt.x > x + w || pt.y < y || pt.y > y + h) return false;
    if (this.points.length < this.capacity){
      this.points.push(pt);
      return true;
    }
    if (!this.divided) this.subdivide();
    return this.ne.insert(pt) || this.nw.insert(pt) || this.se.insert(pt) || this.sw.insert(pt);
  }
  query(range, found = []){
    const {x, y, w, h} = this.bounds;
    if (range.x > x + w || range.x + range.w < x || range.y > y + h || range.y + range.h < y) return found;
    for (const pt of this.points){
      if (pt.x >= range.x && pt.x <= range.x + range.w && pt.y >= range.y && pt.y <= range.y + range.h){
        found.push(pt);
      }
    }
    if (this.divided){
      this.ne.query(range, found);
      this.nw.query(range, found);
      this.se.query(range, found);
      this.sw.query(range, found);
    }
    return found;
  }
}

const qtBounds = { x: -GRID_W * CELL_SIZE * 0.5, y: -GRID_H * CELL_SIZE * 0.5, w: GRID_W * CELL_SIZE, h: GRID_H * CELL_SIZE };
const occupiedQT = new Quadtree(qtBounds, 8);

function isOccupied(x, y, minDist){
  const range = { x: x - minDist, y: y - minDist, w: minDist * 2, h: minDist * 2 };
  const nearby = occupiedQT.query(range);
  for (const pt of nearby){
    const dx = pt.x - x;
    const dy = pt.y - y;
    if (dx*dx + dy*dy < minDist * minDist) return true;
  }
  return false;
}

// integrate streamline following flow field, collision-avoiding
function traceStreamline(startX, startY, maxSteps, stepSize, minDist){
  const path = [];
  let x = startX;
  let y = startY;
  for (let s = 0; s < maxSteps; s++){
    if (isOccupied(x, y, minDist)) break;
    path.push({ x, y });
    occupiedQT.insert({ x, y });
    const angle = flowAngle(x, y);
    x += Math.cos(angle) * stepSize;
    y += Math.sin(angle) * stepSize;
    const limit = Math.max(GRID_W, GRID_H) * CELL_SIZE * 0.5;
    if (Math.abs(x) > limit || Math.abs(y) > limit) break;
  }
  return path;
}

// generate streamlines with varying scale
const streamlines = [];
const STREAMLINE_COUNT = 140;
const rng = () => Math.random();

for (let i = 0; i < STREAMLINE_COUNT; i++){
  const scale = rng() < 0.3 ? 0.5 : (rng() < 0.6 ? 1.0 : 1.8);
  const minDist = 0.35 * scale;
  const stepSize = 0.22 * scale;
  const maxSteps = Math.floor(200 / scale);
  const sx = (rng() - 0.5) * GRID_W * CELL_SIZE * 0.85;
  const sy = (rng() - 0.5) * GRID_H * CELL_SIZE * 0.85;
  const path = traceStreamline(sx, sy, maxSteps, stepSize, minDist);
  if (path.length > 8){
    streamlines.push({ path, scale });
  }
}

// muted earth palette: burnt umber, ochre, cream, charcoal
const palette = [
  new THREE.Color(0.52, 0.30, 0.18), // burnt umber
  new THREE.Color(0.70, 0.54, 0.28), // ochre
  new THREE.Color(0.88, 0.82, 0.68), // cream
  new THREE.Color(0.22, 0.20, 0.18), // charcoal
  new THREE.Color(0.58, 0.42, 0.26)  // mid-brown
];

// render streamlines as thick ribbons with varying width
for (let sl of streamlines){
  const { path, scale } = sl;
  if (path.length < 2) continue;
  const curve3D = [];
  for (let i = 0; i < path.length; i++){
    const p = path[i];
    const idx = Math.min(GRID_W * GRID_H - 1, Math.max(0, 
      Math.floor((p.y / CELL_SIZE + GRID_H * 0.5) * GRID_W + (p.x / CELL_SIZE + GRID_W * 0.5))
    ));
    const z = heightMap[idx] || 0;
    curve3D.push(new THREE.Vector3(p.x, z, p.y));
  }
  const curve = new THREE.CatmullRomCurve3(curve3D);
  const tubeDetail = Math.max(3, Math.min(12, Math.floor(path.length / 8)));
  const radialSegments = 6;
  // varying thickness: thicker at middle, tapers at ends
  const radiusFunc = (u) => {
    const env = Math.sin(u * Math.PI);
    const baseR = 0.12 * scale;
    const jitter = Math.sin(u * 16.7) * 0.02;
    return baseR * env * (1.0 + jitter);
  };
  const geom = new THREE.TubeGeometry(curve, tubeDetail, 0.1, radialSegments, false);
  // manually adjust radius per-vertex
  const positions = geom.attributes.position.array;
  for (let i = 0; i < positions.length; i += 3){
    const idx = Math.floor(i / 3);
    const ring = idx % (radialSegments + 1);
    const slice = Math.floor(idx / (radialSegments + 1));
    const u = slice / tubeDetail;
    const r = radiusFunc(u);
    const center = curve.getPointAt(u);
    const x = positions[i];
    const y = positions[i + 1];
    const z = positions[i + 2];
    const dx = x - center.x;
    const dy = y - center.y;
    const dz = z - center.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) + 1e-6;
    positions[i]     = center.x + (dx / dist) * r;
    positions[i + 1] = center.y + (dy / dist) * r;
    positions[i + 2] = center.z + (dz / dist) * r;
  }
  geom.computeVertexNormals();
  const color = palette[Math.floor(rng() * palette.length)];
  const mat = new THREE.MeshLambertMaterial({ color, flatShading: false, fog: true });
  const mesh = new THREE.Mesh(geom, mat);
  scene.add(mesh);
}

// ground plane with subtle texture
const planeGeom = new THREE.PlaneGeometry(GRID_W * CELL_SIZE, GRID_H * CELL_SIZE, GRID_W - 1, GRID_H - 1);
const planePos = planeGeom.attributes.position.array;
for (let i = 0; i < planePos.length; i += 3){
  const idx = i / 3;
  planePos[i + 2] = heightMap[idx] || 0;
}
planeGeom.computeVertexNormals();
const planeMat = new THREE.MeshLambertMaterial({ color: 0x18120e, flatShading: false, fog: true });
const plane = new THREE.Mesh(planeGeom, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -0.3;
scene.add(plane);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  lastT = now;
  // slow orbit
  const angle = now * 0.00008;
  camera.position.x = Math.sin(angle) * 28;
  camera.position.z = Math.cos(angle) * 28;
  camera.position.y = 18 + Math.sin(angle * 0.7) * 3;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
