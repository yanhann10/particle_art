<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0bb · explosive · Cai Guo-Qiang</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">0bb</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Cai Guo-Qiang: BUILD → DETONATE → CHAR. The tower grows as 5gm did, but at 
// intervals vertical sections spontaneously BURST — rapid radial explosion 
// leaving charred ember trails. Each burst is BRIEF (0.6s flash), then particles 
// fade to black char. Bursts cascade up the tower as it rises. Camera tracks 
// the growth centroid so the form stays framed. NO simultaneous overlapping 
// bursts — one at a time, clear silhouette, then ember fade.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0c0f, 0.032);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(9, 7, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0f, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 4, 0);

// ─────────────────────────── tower growth (from 5gm)
const MAX_VERTS = 3200;
const ATTRACT = 0.06, REPEL_R = 0.42, REPEL_STR = 0.12, NOISE = 0.003;
const PRESSURE = 0.0028, RISE = 0.0045, MAX_D = 0.32;
let paused = false;

const verts = [];
for (let i = 0; i < 24; i++){
  const th = i / 24 * Math.PI * 2, r = 1.3 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R;
const grid = new Map();
function key(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i=0; i<verts.length; i++){
    const v=verts[i], k=key(v.x,v.y,v.z);
    if(!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++)
    for(let dy=-1;dy<=1;dy++)
      for(let dz=-1;dz<=1;dz++){
        const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
        if(arr) for(const idx of arr) out.push(idx);
      }
  return out;
}

function stepTower(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i], cands=neighbors(v);
    for(const j of cands){
      if(j===i) continue;
      const u=verts[j], ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2), f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){ cx+=verts[i].x; cy+=verts[i].y; cz+=verts[i].z; }
  cx/=n; cy/=n; cz/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx, oy=verts[i].y-cy, oz=verts[i].z-cz;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE;
    dy[i]+=(oy/d)*PRESSURE*0.4;
    dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0012;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5, age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}

for(let s=0;s<800;s++) stepTower();

addEventListener('click',()=>{ paused=!paused; });

// ─────────────────────────── tower render (base structure — duotone ember palette)
const N_TOWER=32000;
const tPos=new Float32Array(N_TOWER*3);
const tSeed=new Float32Array(N_TOWER);
const tHeight=new Float32Array(N_TOWER);
for(let i=0;i<N_TOWER;i++) tSeed[i]=Math.random();

const geomT=new THREE.BufferGeometry();
geomT.setAttribute('position', new THREE.BufferAttribute(tPos,3));
geomT.setAttribute('seed', new THREE.BufferAttribute(tSeed,1));
geomT.setAttribute('hgt', new THREE.BufferAttribute(tHeight,1));

const unifT={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}, uYMax:{value:1}};
const matT=new THREE.ShaderMaterial({
  uniforms:unifT, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime; uniform float uPixel; uniform float uYMax;
    attribute float seed; attribute float hgt;
    varying vec3 vCol;
    void main(){
      vec3 p=position;
      float t=uTime*0.5+seed*6.28;
      p.x+=0.005*sin(t); p.z+=0.005*cos(t);
      float h=clamp(hgt/max(uYMax,0.5),0.,1.);
      vec3 a=vec3(0.95,0.42,0.18); // ember base
      vec3 b=vec3(0.22,0.18,0.16); // char
      vCol=mix(a,b,smoothstep(0.,1.,h));
      vec4 mv=modelViewMatrix*vec4(p,1.);
      gl_PointSize=1.2*uPixel*(40./-mv.z);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float a=exp(-r*18.)*0.55;
      gl_FragColor=vec4(vCol*a,a);
    }
  `
});
const pointsT=new THREE.Points(geomT,matT);
scene.add(pointsT);

// ─────────────────────────── burst system (ONE active burst at a time)
const MAX_BURST=8000;
const bPos=new Float32Array(MAX_BURST*3);
const bVel=new Float32Array(MAX_BURST*3);
const bLife=new Float32Array(MAX_BURST);
const bSeed=new Float32Array(MAX_BURST);
for(let i=0;i<MAX_BURST;i++) bSeed[i]=Math.random();

const geomB=new THREE.BufferGeometry();
geomB.setAttribute('position', new THREE.BufferAttribute(bPos,3));
geomB.setAttribute('life', new THREE.BufferAttribute(bLife,1));
geomB.setAttribute('seed', new THREE.BufferAttribute(bSeed,1));

const unifB={uTime:{value:0}, uPixel:{value:renderer.getPixelRatio()}};
const matB=new THREE.ShaderMaterial({
  uniforms:unifB, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime; uniform float uPixel;
    attribute float life; attribute float seed;
    varying vec3 vCol; varying float vAlpha;
    void main(){
      vec3 p=position;
      // flash → ember → char (0→1)
      float phase=1.-life;
      vec3 flash=vec3(1.0,0.92,0.75);
      vec3 ember=vec3(0.98,0.45,0.18);
      vec3 char=vec3(0.12,0.10,0.09);
      vec3 col=mix(flash,ember,smoothstep(0.,0.3,phase));
      col=mix(col,char,smoothstep(0.3,1.,phase));
      vCol=col;
      // fade: bright flash → dim char
      vAlpha=life*life;
      vec4 mv=modelViewMatrix*vec4(p,1.);
      float sz=2.0*uPixel*(50./-mv.z);
      gl_PointSize=sz*(0.6+0.4*life);
      gl_Position=projectionMatrix*mv;
    }
  `,
  fragmentShader:`
    varying vec3 vCol; varying float vAlpha;
    void main(){
      vec2 d=gl_PointCoord-0.5; float r=dot(d,d);
      if(r>0.25) discard;
      float core=exp(-r*16.);
      float a=core*vAlpha*0.8;
      gl_FragColor=vec4(vCol*a,a);
    }
  `
});
const pointsB=new THREE.Points(geomB,matB);
scene.add(pointsB);

let burstActive=false;
let burstTimer=0;
let nextBurstIn=2.5;

function triggerBurst(yCenter){
  // Spawn radial burst at yCenter (±0.4 band)
  burstActive=true; burstTimer=0;
  for(let i=0;i<MAX_BURST;i++){
    const y=yCenter+(Math.random()-0.5)*0.8;
    const th=Math.random()*Math.PI*2, phi=Math.acos(1-2*Math.random());
    const speed=0.35+Math.random()*0.25;
    const vx=Math.sin(phi)*Math.cos(th)*speed;
    const vy=Math.cos(phi)*speed*0.7; // slightly upward bias
    const vz=Math.sin(phi)*Math.sin(th)*speed;
    // origin near tower form
    const r=1.2+Math.random()*0.3;
    bPos[i*3]=Math.cos(th)*r; bPos[i*3+1]=y; bPos[i*3+2]=Math.sin(th)*r;
    bVel[i*3]=vx; bVel[i*3+1]=vy; bVel[i*3+2]=vz;
    bLife[i]=1.0;
  }
  geomB.attributes.position.needsUpdate=true;
  geomB.attributes.life.needsUpdate=true;
}

function stepBurst(dt){
  if(!burstActive) return;
  burstTimer+=dt;
  const BURST_DURATION=0.6; // short flash
  if(burstTimer>BURST_DURATION){
    burstActive=false; burstTimer=0;
    for(let i=0;i<MAX_BURST;i++) bLife[i]=0;
    geomB.attributes.life.needsUpdate=true;
    return;
  }
  const decay=dt*2.8; // rapid fade
  for(let i=0;i<MAX_BURST;i++){
    bPos[i*3]+=bVel[i*3]*dt;
    bPos[i*3+1]+=bVel[i*3+1]*dt;
    bPos[i*3+2]+=bVel[i*3+2]*dt;
    bVel[i*3+1]-=dt*0.3; // slight gravity
    bLife[i]=Math.max(0,bLife[i]-decay);
  }
  geomB.attributes.position.needsUpdate=true;
  geomB.attributes.life.needsUpdate=true;
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const start=performance.now();
let lastT=start;
function loop(){
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.05);
  lastT=now;
  unifT.uTime.value=(now-start)/1000;
  unifB.uTime.value=(now-start)/1000;

  for(let s=0;s<3;s++) stepTower();

  // distribute tower particles
  const n=verts.length;
  let yMax=0, yMean=0;
  if(n>1){
    const lengths=[]; let total=0;
    for(let i=0;i<n;i++){
      const a=verts[i], b=verts[(i+1)%n];
      const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
      const L=Math.sqrt(ex*ex+ey*ey+ez*ez);
      lengths.push(L); total+=L;
      if(a.y>yMax) yMax=a.y;
      yMean+=a.y;
    }
    yMean/=n;
    if(total>0){
      let written=0;
      for(let i=0;i<n;i++){
        const share=(i===n-1)?N_TOWER-written:Math.max(1,Math.floor(N_TOWER*lengths[i]/total));
        const a=verts[i], b=verts[(i+1)%n];
        for(let k=0;k<share&&written<N_TOWER;k++){
          const u=Math.random();
          tPos[written*3]=a.x+(b.x-a.x)*u+(Math.random()-0.5)*0.018;
          tPos[written*3+1]=a.y+(b.y-a.y)*u+(Math.random()-0.5)*0.018;
          tPos[written*3+2]=a.z+(b.z-a.z)*u+(Math.random()-0.5)*0.018;
          tHeight[written]=a.y+(b.y-a.y)*u;
          written++;
        }
      }
      geomT.attributes.position.needsUpdate=true;
      geomT.attributes.hgt.needsUpdate=true;
    }
  }
  unifT.uYMax.value=Math.max(yMax,1);

  // camera tracks centroid
  const targetY=Math.max(yMean,3);
  controls.target.y+=(targetY-controls.target.y)*0.03;
  const desiredCamY=targetY+5;
  camera.position.y+=(desiredCamY-camera.position.y)*0.03;

  // burst cascade: trigger one burst at a time, spacing 2.5-4s
  if(!burstActive && !paused){
    nextBurstIn-=dt;
    if(nextBurstIn<=0 && yMax>1){
      const burstY=Math.random()*(yMax-0.5)+0.5; // random height along tower
      triggerBurst(burstY);
      nextBurstIn=2.5+Math.random()*1.5;
    }
  }
  stepBurst(dt);

  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
