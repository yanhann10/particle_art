<!doctype html>
<html lang="en">
<head>
<!-- MOTION: breathe, intensity: gentle -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i0y · coral polyp colony</title>
<!-- Palette rationale: ivory (#f0ece4) polyps on deep ocean black (#020508) —
     maximum contrast without brightness fatigue; bioluminescent teal (#00d4b8)
     blossoms echo the Symbiodinium algae that glow in living coral;
     the whole palette reads as a deep-sea night dive. -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#020508; overflow:hidden;
               color:#a8c8c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">i0y · coral polyp colony</div>
<div class="hint">drag to orbit · colony breathes at ~0.05 Hz</div>
<div class="src">descended from t9w · 10 polyps · bioluminescent tips</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// CORAL POLYP COLONY
// 10 distinct polyps, each with a tapered trunk + 3-4 branches at the tip.
// Each polyp has a blossom SphereGeometry at each branch tip that glows teal.
// Colony breathing: swell 1.2x → contract 0.85x at ~0.05 Hz, random phase per polyp.
// Camera drifts laterally — NO auto-rotation.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 4, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x020508, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 2, 0);
controls.autoRotate = false; // NO auto-rotation

// Lighting — deep ocean ambiance with warm key to reveal ivory trunks
scene.add(new THREE.AmbientLight(0x0a1820, 1.0));
const keyLight = new THREE.DirectionalLight(0xf8f0e0, 1.2); // warm white key
keyLight.position.set(3, 12, 8);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x40d0c0, 0.4);
rimLight.position.set(-4, 2, -3);
scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xe8d8c0, 0.5); // fill from front
fillLight.position.set(0, 5, 10);
scene.add(fillLight);
// Subtle blue caustic from below
const bottomLight = new THREE.PointLight(0x003050, 0.8, 20);
bottomLight.position.set(0, -3, 0);
scene.add(bottomLight);

// ────────── polyp builder
const polyps = [];

// Material definitions
const trunkMat = new THREE.MeshStandardMaterial({
  color: 0xf0ece4,
  emissive: 0x201810,
  emissiveIntensity: 0.15,
  roughness: 0.55,
  metalness: 0.02,
});
const blossomMat = new THREE.MeshStandardMaterial({
  color: 0x00d4b8,
  roughness: 0.3,
  metalness: 0.1,
  emissive: 0x00d4b8,
  emissiveIntensity: 0.4,
});

function makePolyp(x, z, height, trunkRadius, nBranches, phase) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);

  // Trunk: tapered TubeGeometry along a curved path
  const trunkPts = [];
  const segments = 8;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const bx = Math.sin(t * 0.8) * trunkRadius * 0.5;
    const bz = Math.cos(t * 1.1) * trunkRadius * 0.3;
    trunkPts.push(new THREE.Vector3(bx, t * height, bz));
  }
  const trunkCurve = new THREE.CatmullRomCurve3(trunkPts);

  // Custom TubeGeometry with tapering
  const trunkGeo = new THREE.TubeGeometry(trunkCurve, 12, trunkRadius, 7, false);
  // Taper: modify radial positions — scale down top vertices
  const pos = trunkGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = THREE.MathUtils.clamp(y / height, 0, 1);
    // taper factor 1→0.3 from base to tip
    const taper = 1 - t * 0.7;
    const cx = trunkPts[0].x;
    const cz = trunkPts[0].z;
    // approximate center at this y: interpolate along curve
    const approxCenter = trunkCurve.getPoint(t);
    const dx = pos.getX(i) - approxCenter.x;
    const dz = pos.getZ(i) - approxCenter.z;
    pos.setX(i, approxCenter.x + dx * taper);
    pos.setZ(i, approxCenter.z + dz * taper);
  }
  pos.needsUpdate = true;
  trunkGeo.computeVertexNormals();
  const trunk = new THREE.Mesh(trunkGeo, trunkMat);
  group.add(trunk);

  // Branches from the tip
  const tipY = height;
  const blossoms = [];
  for (let b = 0; b < nBranches; b++) {
    const angle = (b / nBranches) * Math.PI * 2 + Math.random() * 0.3;
    const branchLen = height * (0.25 + Math.random() * 0.2);
    const spread = trunkRadius * 4 + Math.random() * 0.3;
    // Branch curve
    const bPts = [
      new THREE.Vector3(0, tipY, 0),
      new THREE.Vector3(
        Math.cos(angle) * spread * 0.4,
        tipY + branchLen * 0.5,
        Math.sin(angle) * spread * 0.4
      ),
      new THREE.Vector3(
        Math.cos(angle) * spread,
        tipY + branchLen,
        Math.sin(angle) * spread
      ),
    ];
    const bCurve = new THREE.CatmullRomCurve3(bPts);
    const branchGeo = new THREE.TubeGeometry(bCurve, 6, trunkRadius * 0.35, 5, false);
    const branch = new THREE.Mesh(branchGeo, trunkMat);
    group.add(branch);

    // Blossom at tip
    const tipPt = bPts[2];
    const blossomGeo = new THREE.SphereGeometry(0.1, 8, 6);
    const blossom = new THREE.Mesh(blossomGeo, blossomMat);
    blossom.position.copy(tipPt);
    group.add(blossom);
    blossoms.push(blossom);

    // Small point light at blossom for local teal glow
    const blossomLight = new THREE.PointLight(0x00d4b8, 0.5, 3.0);
    blossomLight.position.copy(tipPt);
    group.add(blossomLight);
  }

  scene.add(group);
  polyps.push({ group, phase, height, blossoms });
  return group;
}

// ── Place 10 polyps in a colony arrangement
const N_POLYPS = 10;
const polyp_configs = [
  // [x, z, height, trunkRadius, nBranches]
  [ 0,    0,   3.5, 0.18, 4],
  [ 2.2,  0.8, 2.8, 0.15, 3],
  [-1.8,  1.2, 3.0, 0.16, 4],
  [ 1.0, -2.0, 2.5, 0.14, 3],
  [-2.5, -1.5, 2.2, 0.13, 3],
  [ 3.2, -0.5, 2.0, 0.12, 3],
  [-3.0,  0.5, 1.8, 0.12, 4],
  [ 0.5,  2.8, 1.5, 0.10, 3],
  [ 2.8,  2.2, 1.6, 0.11, 3],
  [-1.0, -3.0, 1.4, 0.10, 3],
];

for (let i = 0; i < N_POLYPS; i++) {
  const [x, z, h, r, nb] = polyp_configs[i];
  const phase = Math.random() * Math.PI * 2;
  makePolyp(x, z, h, r, nb, phase);
}

// Ground plane — dark substrate
const groundGeo = new THREE.PlaneGeometry(16, 16);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x010306, roughness: 0.9 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.05;
scene.add(ground);

// ────────── lateral camera drift (NO auto-rotate)
let time = 0;
const driftAmplitude = 1.5;
const driftSpeed = 0.08; // slow lateral drift
const initialCamX = camera.position.x;
const initialCamZ = camera.position.z;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let paused = false;
renderer.domElement.addEventListener('click', () => { paused = !paused; });

function animate(ts) {
  requestAnimationFrame(animate);
  if (paused) return;
  time = ts * 0.001;

  // Lateral drift — camera moves gently side to side
  camera.position.x = initialCamX + Math.sin(time * driftSpeed) * driftAmplitude;
  camera.position.z = initialCamZ + Math.cos(time * driftSpeed * 0.7) * driftAmplitude * 0.4;

  // Breathing: swell 1.2x → contract 0.85x at ~0.05 Hz
  for (const p of polyps) {
    const breathe = 0.05; // Hz
    const swellMin = 0.85;
    const swellMax = 1.2;
    const s = swellMin + (swellMax - swellMin) * (0.5 + 0.5 * Math.sin(time * breathe * Math.PI * 2 + p.phase));
    p.group.scale.set(s, s, s);

    // Blossom pulse intensity
    const glowPulse = 0.3 + 0.35 * Math.sin(time * breathe * Math.PI * 2 + p.phase + 0.5);
    for (const blossom of p.blossoms) {
      blossom.material.emissiveIntensity = glowPulse;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate(0);
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
