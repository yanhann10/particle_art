<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ww9 · swerve</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#06080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }

<body>
<div class="id">ww9 · swerve</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x06080a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.6;
  init[i*4+1] = (Math.random()*2-1) * 0.6;
  init[i*4+2] = (Math.random()*2-1) * 0.6;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev:      { value: rtA.texture },
  uDt:       { value: 0.012 },
  uA:        { value: 0.95 },
  uB:        { value: 0.70 },
  uC:        { value: 0.60 },
  uD:        { value: 3.50 },
  uE:        { value: 0.25 },
  uF:        { value: 0.10 },
  uGust:     { value: 0.0 },
  uSwerve:   { value: 0.0 },
  uSwerveDir:{ value: new THREE.Vector3(1,0,0) },
  uTime:     { value: 0.0 },
  uRes:      { value: new THREE.Vector2(W, H) }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    uniform float uGust, uSwerve, uTime;
    uniform vec3 uSwerveDir;
    uniform vec2 uRes;
    varying vec2 vUv;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // Aizawa attractor
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z * p.z * p.z) / 3.0
              - (p.x * p.x + p.y * p.y) * (1.0 + uE * p.z)
              + uF * p.z * p.x * p.x * p.x
      );

      // Leaf-flurry gust
      if(uGust > 0.01){
        vec2 pid = vUv * uRes;
        float h1 = hash(pid);
        float h2 = hash(pid + 71.0);
        float h3 = hash(pid + 137.0);
        float phase = h1 * 6.2832;
        float freq = 3.0 + h2 * 5.0;
        float flutter_x = sin(uTime * freq + phase) * (0.8 + h3);
        float flutter_y = cos(uTime * freq * 0.7 + phase * 1.3) * (0.6 + h1);
        float flutter_z = sin(uTime * freq * 0.5 + phase * 0.7) * 0.4;
        vec3 centroid = vec3(0.0, 0.0, 1.0);
        vec3 outward = normalize(p - centroid + vec3(0.001));
        float dist = length(p - centroid);
        vec3 gustForce = outward * (2.5 / (1.0 + dist))
                       + vec3(flutter_x, flutter_y - 0.6, flutter_z) * 1.8;
        dp += gustForce * uGust;
      }

      // SWERVE: sudden lateral yank — all particles sheared in one direction
      // like the whole attractor got shoulder-checked
      if(uSwerve > 0.01){
        vec2 pid = vUv * uRes;
        float h1 = hash(pid + 200.0);
        // shear force: strongest near the centroid, so the core visibly lurches
        vec3 centroid = vec3(0.0, 0.0, 1.0);
        float proximity = 1.0 / (1.0 + length(p - centroid) * 0.8);
        // main lateral push + slight per-particle jitter so it's not rigid
        vec3 swerveForce = uSwerveDir * (6.0 * proximity)
                         + uSwerveDir.yzx * sin(h1 * 6.28 + uTime * 8.0) * 0.8;
        dp += swerveForce * uSwerve;
      }

      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// Render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 80);
camera.position.set(0, 0, 4);
camera.lookAt(0, 0, 0);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:    { value: rtB.texture },
    uPixel:   { value: renderer.getPixelRatio() },
    uGust:    { value: 0.0 },
    uSwerve:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uGust;
    uniform float uSwerve;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vSwerve;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vGust = uGust;
      vSwerve = uSwerve;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeBoost = 1.0 + uGust * 1.2 + uSwerve * 0.6;
      gl_PointSize = (1.1 + 1.5 * vSpeed) * uPixel * (8.0 / max(dist, 0.5)) * sizeBoost;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vGust;
    varying float vSwerve;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);

      // Normal palette: emerald → violet → silver
      vec3 a_col = vec3(0.20, 0.62, 0.45);
      vec3 b_col = vec3(0.55, 0.30, 0.78);
      vec3 c_col = vec3(0.92, 0.95, 0.98);

      // Autumn palette for gust
      vec3 a_aut = vec3(0.85, 0.55, 0.12);
      vec3 b_aut = vec3(0.72, 0.28, 0.10);
      vec3 c_aut = vec3(0.98, 0.92, 0.78);

      // Swerve palette: electric teal flash — Bridget Riley op-art contrast
      vec3 a_swv = vec3(0.10, 0.95, 0.88);
      vec3 b_swv = vec3(0.95, 0.15, 0.55);
      vec3 c_swv = vec3(1.0, 1.0, 1.0);

      // Blend: base → gust autumn → swerve electric
      vec3 ca = mix(mix(a_col, a_aut, vGust), a_swv, vSwerve);
      vec3 cb = mix(mix(b_col, b_aut, vGust), b_swv, vSwerve);
      vec3 cc = mix(mix(c_col, c_aut, vGust), c_swv, vSwerve);

      float k = mod(vAge + vSpeed * 0.4, 1.0);
      vec3 col = mix(ca, cb, smoothstep(0.0, 0.5, k));
      col = mix(col, cc, smoothstep(0.5, 1.0, k));

      // During swerve: boost brightness for that flash-pop
      float bright = 1.0 + vSwerve * 0.6;

      gl_FragColor = vec4(col * a * (0.45 + vSpeed * 0.9) * bright, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.08;
  target.c = 0.60 + ny * 0.10;
});

let t0 = performance.now();

// Gust timing (from parent): every ~11s, ~2.5s flurry
const gustPeriod = 11.0;
const gustDuration = 2.5;
const gustAttack = 0.4;
const gustDecay = 1.8;

// Swerve timing: every ~17s (deliberately out of phase with gust)
// quick snap-on (0.15s), hold (0.2s), elastic recovery (1.2s)
const swervePeriod = 17.0;
const swerveSnap = 0.15;
const swerveHold = 0.2;
const swerveRecover = 1.2;
const swerveDuration = swerveSnap + swerveHold + swerveRecover;
let swerveCount = 0;
let lastSwerveIdx = -1;

// Camera swerve offset for sympathetic lurch
let camSwerveX = 0;
let camSwerveY = 0;

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.04;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.04;
  simUniforms.uTime.value = elapsed;

  // --- Gust envelope ---
  const gustCycleT = elapsed % gustPeriod;
  let gust = 0.0;
  if(gustCycleT < gustDuration){
    if(gustCycleT < gustAttack){
      gust = gustCycleT / gustAttack;
      gust = gust * gust;
    } else {
      const decayT = (gustCycleT - gustAttack) / gustDecay;
      gust = Math.max(0.0, 1.0 - decayT);
      gust = gust * gust;
    }
  }
  simUniforms.uGust.value = gust;
  pointsMat.uniforms.uGust.value = gust;

  // --- Swerve envelope ---
  const swerveIdx = Math.floor(elapsed / swervePeriod);
  const swerveCycleT = elapsed % swervePeriod;
  let swerve = 0.0;

  // Pick a new random direction each swerve cycle
  if(swerveIdx !== lastSwerveIdx){
    lastSwerveIdx = swerveIdx;
    swerveCount++;
    // Rotate swerve direction: each time a different lateral angle
    const ang = swerveCount * 2.399 + 0.7; // golden angle for variety
    simUniforms.uSwerveDir.value.set(
      Math.cos(ang),
      Math.sin(ang) * 0.6,
      Math.sin(ang * 0.7) * 0.3
    ).normalize();
  }

  if(swerveCycleT < swerveDuration){
    if(swerveCycleT < swerveSnap){
      // Snap on — fast ease-in
      const t = swerveCycleT / swerveSnap;
      swerve = t * t * t; // cubic snap
    } else if(swerveCycleT < swerveSnap + swerveHold){
      // Brief hold at peak
      swerve = 1.0;
    } else {
      // Elastic recovery — slight overshoot then settle
      const t = (swerveCycleT - swerveSnap - swerveHold) / swerveRecover;
      // damped spring: overshoots to -0.15 then settles
      swerve = Math.max(0.0, (1.0 - t) * Math.cos(t * Math.PI * 2.5) * Math.exp(-t * 3.0));
    }
  }
  simUniforms.uSwerve.value = swerve;
  pointsMat.uniforms.uSwerve.value = swerve;

  // Camera sympathetic lurch
  const dir = simUniforms.uSwerveDir.value;
  camSwerveX += (swerve * dir.x * 0.6 - camSwerveX) * 0.12;
  camSwerveY += (swerve * dir.y * 0.4 - camSwerveY) * 0.12;

  // Sim steps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // Camera orbit + gust pullback + swerve lurch
  const ang = elapsed * 0.15;
  const camDist = 4.0 + gust * 2.5;
  camera.position.x = Math.sin(ang) * camDist + camSwerveX;
  camera.position.z = Math.cos(ang) * camDist;
  camera.position.y = Math.sin(ang * 0.7) * 1.0 + camSwerveY;
  camera.lookAt(camSwerveX * 0.3, camSwerveY * 0.2, 1.0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
