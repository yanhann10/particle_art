<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lull · differential-growth vessel at rest · Hiroshi Sugimoto seascape stillness</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04050a; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">h97</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*
  Hiroshi Sugimoto — seascape stillness.
  Chain from zn6 (Cai Guo-Qiang controlled detonation vessel):
  The word "lull" passes through the explosive vessel. The detonations have
  ceased. The form settles into deep quietude — differential growth slows to
  near-imperceptible drift. Color cools from Kapoor red to deep slate-indigo,
  as if the vessel is cooling after its last explosion, entering a long
  exhale. A faint luminous breath remains — the vessel slowly pulses in
  brightness like a sleeping creature. Rare firefly motes drift upward
  from the rim, the last embers of spent energy dissipating into dark air.
*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 14, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04050a, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, 1, 0);

/* ─── Bowl profile ─── */
const NUM_RINGS = 28;
const DEPTH = 5;
const RIM_R = 9;
const rings = [];

for (let ri = 0; ri < NUM_RINGS; ri++) {
  const t = ri / (NUM_RINGS - 1);
  const y = -DEPTH + t * t * (DEPTH + 4);
  const radius = 0.4 + t * t * (RIM_R - 0.4);
  const nv = Math.floor(14 + t * 40);
  const verts = [];
  for (let i = 0; i < nv; i++) {
    const th = (i / nv) * Math.PI * 2;
    verts.push({
      x: Math.cos(th) * radius + (Math.random() - 0.5) * 0.08,
      y: y + (Math.random() - 0.5) * 0.12,
      z: Math.sin(th) * radius + (Math.random() - 0.5) * 0.08,
      age: 0
    });
  }
  rings.push({ verts, maxVerts: Math.floor(nv * 5), t });
}

/* ─── Differential growth per ring — slowed for lull ─── */
const ATTRACT  = 0.025;
const REPEL_R  = 0.48;
const REPEL_S  = 0.065;
const MAX_EDGE = 0.38;

function stepRing(ring) {
  const v = ring.verts, n = v.length;
  if (n < 3) return;
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const ex = v[i].x - v[j].x, ey = v[i].y - v[j].y, ez = v[i].z - v[j].z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_S * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
      dx[j] -= ex * f; dy[j] -= ey * f; dz[j] -= ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = v[(i - 1 + n) % n], b = v[(i + 1) % n], c = v[i];
    dx[i] += (a.x + b.x - 2 * c.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * c.y) * ATTRACT * 0.25;
    dz[i] += (a.z + b.z - 2 * c.z) * ATTRACT;
  }
  for (let i = 0; i < n; i++) {
    v[i].x += dx[i] * 0.5 + (Math.random() - 0.5) * 0.0006;
    v[i].y += dy[i] * 0.5 + (Math.random() - 0.5) * 0.0003;
    v[i].z += dz[i] * 0.5 + (Math.random() - 0.5) * 0.0006;
    v[i].age += 0.001;
  }
  if (n >= ring.maxVerts) return;
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = v[i], b = v[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_EDGE * MAX_EDGE && grown.length + (n - i) < ring.maxVerts) {
      grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, z: (a.z + b.z) * 0.5, age: 0 });
    }
  }
  ring.verts = grown;
}

// Warm up — fully grown, settled
for (let s = 0; s < 600; s++) {
  for (const r of rings) stepRing(r);
}

/* ─── Breathing state — replaces explosion ─── */
// The vessel breathes very slowly: a gentle luminous pulse
const BREATH_PERIOD = 12.0; // seconds per full breath cycle

/* ─── Point-cloud renderer ─── */
const MAX_PTS = 80000;
const pos  = new Float32Array(MAX_PTS * 3);
const col  = new Float32Array(MAX_PTS * 3);
const sz   = new Float32Array(MAX_PTS);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
geo.setAttribute('aSize',    new THREE.BufferAttribute(sz, 1));

const mat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      vCol = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = aSize * (280.0 / dist);
      gl_Position = projectionMatrix * mv;
      vAlpha = smoothstep(120.0, 10.0, dist);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.12, d) * vAlpha;
      vec3 c = vCol + 0.04 * smoothstep(0.3, 0.0, d);
      gl_FragColor = vec4(c, a * 0.92);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const pointCloud = new THREE.Points(geo, mat);
scene.add(pointCloud);

/* ─── Fill particles with breathing color shift ─── */
function fillParticles(breath) {
  let idx = 0;
  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    const t = ring.t;

    for (let vi = 0; vi < ring.verts.length; vi++) {
      if (idx >= MAX_PTS) break;
      const v = ring.verts[vi];

      pos[idx * 3]     = v.x;
      pos[idx * 3 + 1] = v.y;
      pos[idx * 3 + 2] = v.z;

      // Lulled palette: deep slate-indigo, with breath brightening slightly
      // Base: cool dark indigo-grey. Rim gets slightly more blue.
      const bright = t * t;
      const breathGlow = breath * 0.15;

      // Cooled vessel — slate blue-grey with faint indigo warmth
      const baseR = 0.06 + bright * 0.12 + breathGlow * 0.08;
      const baseG = 0.07 + bright * 0.16 + breathGlow * 0.12;
      const baseB = 0.12 + bright * 0.32 + breathGlow * 0.18;

      // Faint ember memory at the very bottom (nadir) — last warmth cooling
      const nadir = (1.0 - t) * (1.0 - t);
      const emberR = nadir * 0.18 * (1.0 + breath * 0.3);
      const emberG = nadir * 0.04;
      const emberB = nadir * 0.02;

      col[idx * 3]     = baseR + emberR;
      col[idx * 3 + 1] = baseG + emberG;
      col[idx * 3 + 2] = baseB + emberB;

      // Size: slightly smaller, denser, quieter. Breath makes a subtle swell.
      sz[idx] = (1.8 + t * 3.2) * (1.0 + breath * 0.08);
      idx++;
    }

    // Interpolated particles between rings
    if (ri < rings.length - 1) {
      const next = rings[ri + 1];
      const nA = ring.verts.length, nB = next.verts.length;
      const count = Math.min(nA, nB, 30);

      for (let i = 0; i < count; i++) {
        if (idx >= MAX_PTS) break;
        const ai = Math.floor(i / count * nA);
        const bi = Math.floor(i / count * nB);
        const a = ring.verts[ai];
        const bv = next.verts[bi];
        const mix = 0.3 + Math.random() * 0.4;

        pos[idx * 3]     = a.x + (bv.x - a.x) * mix;
        pos[idx * 3 + 1] = a.y + (bv.y - a.y) * mix;
        pos[idx * 3 + 2] = a.z + (bv.z - a.z) * mix;

        const tMid = t + (next.t - t) * mix;
        const bri = tMid * tMid;
        const bg = breath * 0.15;
        const nad = (1.0 - tMid) * (1.0 - tMid);

        col[idx * 3]     = 0.06 + bri * 0.12 + bg * 0.08 + nad * 0.18 * (1.0 + breath * 0.3);
        col[idx * 3 + 1] = 0.07 + bri * 0.16 + bg * 0.12 + nad * 0.04;
        col[idx * 3 + 2] = 0.12 + bri * 0.32 + bg * 0.18 + nad * 0.02;

        sz[idx] = (1.5 + tMid * 2.2) * (1.0 + breath * 0.08);
        idx++;
      }
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aColor.needsUpdate = true;
  geo.attributes.aSize.needsUpdate = true;
  geo.setDrawRange(0, idx);
}

/* ─── Firefly embers — rare, slow, drifting upward from rim ─── */
const EMBER_MAX = 120;
const emberPos = new Float32Array(EMBER_MAX * 3);
const emberSz  = new Float32Array(EMBER_MAX);
const emberCol = new Float32Array(EMBER_MAX * 3);
const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
emberGeo.setAttribute('aSize', new THREE.BufferAttribute(emberSz, 1));
emberGeo.setAttribute('aColor', new THREE.BufferAttribute(emberCol, 3));

const emberMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      vCol = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = aSize * (200.0 / dist);
      gl_Position = projectionMatrix * mv;
      vAlpha = smoothstep(80.0, 5.0, dist);
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    varying vec3 vCol;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d) * vAlpha;
      gl_FragColor = vec4(vCol, a * 0.5);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});

const embers = new THREE.Points(emberGeo, emberMat);
scene.add(embers);

const emberData = [];
let emberAccum = 0;

function updateEmbers(dt) {
  // Emit very rarely — ~1 ember per second
  emberAccum += dt;
  if (emberAccum > 0.8 + Math.random() * 1.5 && emberData.length < EMBER_MAX) {
    emberAccum = 0;
    // Pick a rim vertex (high t)
    const ri = NUM_RINGS - 1 - Math.floor(Math.random() * 4);
    const ring = rings[ri];
    const v = ring.verts[Math.floor(Math.random() * ring.verts.length)];
    emberData.push({
      x: v.x + (Math.random() - 0.5) * 0.5,
      y: v.y + 0.3,
      z: v.z + (Math.random() - 0.5) * 0.5,
      vx: (Math.random() - 0.5) * 0.015,
      vy: 0.012 + Math.random() * 0.02,
      vz: (Math.random() - 0.5) * 0.015,
      life: 1.0,
      decay: 0.003 + Math.random() * 0.004,
      // warm amber fading to cool blue
      warmth: 0.7 + Math.random() * 0.3
    });
  }

  for (let i = emberData.length - 1; i >= 0; i--) {
    const e = emberData[i];
    e.x += e.vx;
    e.y += e.vy;
    e.z += e.vz;
    // Gentle lateral drift
    e.vx += (Math.random() - 0.5) * 0.002;
    e.vz += (Math.random() - 0.5) * 0.002;
    e.life -= e.decay;
    e.warmth *= 0.997; // cool as it rises
    if (e.life <= 0) emberData.splice(i, 1);
  }

  for (let i = 0; i < EMBER_MAX; i++) {
    if (i < emberData.length) {
      const e = emberData[i];
      emberPos[i * 3]     = e.x;
      emberPos[i * 3 + 1] = e.y;
      emberPos[i * 3 + 2] = e.z;
      // Fade from warm amber to cool slate-blue
      const w = e.warmth;
      const pulse = 0.7 + 0.3 * Math.sin(e.life * 12.0); // firefly flicker
      emberCol[i * 3]     = (0.3 + w * 0.6) * pulse;
      emberCol[i * 3 + 1] = (0.35 + w * 0.3) * pulse;
      emberCol[i * 3 + 2] = (0.5 + (1 - w) * 0.4) * pulse;
      emberSz[i] = e.life * 2.5 * pulse;
    } else {
      emberSz[i] = 0;
    }
  }
  emberGeo.attributes.position.needsUpdate = true;
  emberGeo.attributes.aSize.needsUpdate = true;
  emberGeo.attributes.aColor.needsUpdate = true;
  emberGeo.setDrawRange(0, emberData.length);
}

let time = 0;
let lastT = performance.now() / 1000;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── Render loop ─── */
function loop() {
  const now = performance.now() / 1000;
  const dt = Math.min(now - lastT, 0.05);
  lastT = now;
  time += 0.002; // half the parent's speed — everything slowed for lull

  // Breathing: very slow sinusoidal pulse
  const breath = 0.5 + 0.5 * Math.sin(now * (2 * Math.PI / BREATH_PERIOD));

  // Differential growth — very slow, one step every other frame
  if (Math.random() < 0.5) {
    for (const r of rings) stepRing(r);
  }

  fillParticles(breath);
  updateEmbers(dt);

  // Background: deep dark blue-black, very subtle breath
  const bgBreath = breath * 0.008;
  renderer.setClearColor(new THREE.Color(0.016 + bgBreath, 0.02 + bgBreath, 0.04 + bgBreath * 2), 1);

  // Camera: very slow drift — meditative
  const orbitR = 24 + Math.sin(time * 0.15) * 1.5;
  const baseAngle = time * 0.04; // half parent orbit speed

  if (!controls.enabled || !controls._isDragging) {
    camera.position.x += (Math.sin(baseAngle) * orbitR - camera.position.x) * 0.005;
    camera.position.z += (Math.cos(baseAngle) * orbitR - camera.position.z) * 0.005;
    camera.position.y += (11 + Math.sin(time * 0.1) * 1.5 - camera.position.y) * 0.005;
  }

  // Track centroid
  let cx = 0, cy = 0, cz = 0, cnt = 0;
  for (const r of rings) {
    for (const v of r.verts) { cx += v.x; cy += v.y; cz += v.z; cnt++; }
  }
  if (cnt > 0) { cx /= cnt; cy /= cnt; cz /= cnt; }
  controls.target.x += (cx - controls.target.x) * 0.015;
  controls.target.y += (cy - controls.target.y) * 0.015;
  controls.target.z += (cz - controls.target.z) * 0.015;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
