<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s8t · living tide sculpture · noaa buoy 46042</title>
<!-- MOTION: undulation, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#070a0d; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; color:#cdd2dc; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.65; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; max-width: 320px; text-align: right; line-height: 1.45; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">fetching pacific conditions · noaa buoy 46042 …</div>
<div class="id">s8t · living tide sculpture · noaa buoy 46042</div>
<div class="hint" id="hint"></div>
<div class="src" id="src">data: noaa national data buoy center · buoy 46042 monterey bay · 15-min live ocean telemetry</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 8, 28);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a0d, 1);
document.body.appendChild(renderer.domElement);

let N = 45000; // base count, modulated by wave height
const positions    = new Float32Array(N * 3);
const seeds        = new Float32Array(N);

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uWaveHeight: { value: 2.0 },  // meters
  uWavePeriod: { value: 8.0 },  // seconds
  uWindSpeed:  { value: 5.0 },  // m/s
  uWaterTemp:  { value: 14.0 }, // celsius
  uReady: { value: 0.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uWaveHeight;
    uniform float uWavePeriod;
    uniform float uWindSpeed;
    uniform float uWaterTemp;
    uniform float uReady;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      float phase = seed * 6.28;
      float cycleTime = uTime * (6.28 / uWavePeriod);
      
      // spiral shell form — particles distributed in conch-like nautilus
      float theta = seed * 12.0 * 6.28;
      float radius = seed * 9.0;
      float height = seed * 14.0 - 7.0;
      
      vec3 p = vec3(
        cos(theta) * radius,
        height,
        sin(theta) * radius
      );
      
      // wave undulation: height drives vertical displacement
      float wave = sin(cycleTime + phase) * uWaveHeight * 0.6;
      p.y += wave * (1.0 - seed * 0.4);
      
      // swell breathing: radius pulses with wave period
      float swell = sin(cycleTime * 0.5 + phase * 2.0) * 0.3;
      p.xz *= 1.0 + swell * (uWaveHeight / 3.0);
      
      // wind turbulence: high-altitude particles drift
      float windLayer = smoothstep(2.0, 7.0, p.y);
      p.x += sin(uTime * 0.4 + seed * 8.0) * uWindSpeed * 0.08 * windLayer;
      p.z += cos(uTime * 0.3 + seed * 6.0) * uWindSpeed * 0.06 * windLayer;
      
      // assembly reveal
      vec3 entry = vec3(
        cos(seed * 40.0) * 25.0,
        sin(seed * 30.0) * 25.0,
        sin(seed * 22.0) * 25.0
      );
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));
      
      // color: water temperature gradient
      // cold (10°C) → deep teal, warm (18°C) → amber-green
      float tempNorm = clamp((uWaterTemp - 10.0) / 8.0, 0.0, 1.0);
      vec3 coldCol = vec3(0.12, 0.35, 0.42); // deep pacific teal
      vec3 warmCol = vec3(0.28, 0.52, 0.38); // kelp green
      vec3 foamCol = vec3(0.82, 0.88, 0.85); // whitecap foam
      
      float depthFactor = smoothstep(-5.0, 3.0, p.y);
      vec3 baseCol = mix(coldCol, warmCol, tempNorm);
      vCol = mix(baseCol, foamCol, depthFactor * 0.6);
      
      // energy from wave cycle
      float energy = 0.3 + 0.7 * abs(sin(cycleTime + phase));
      vAlpha = energy * (0.4 + 0.6 * uReady);
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float sizeMod = 1.0 + (uWaveHeight / 4.0);
      gl_PointSize = (0.8 + 1.2 * energy) * uPixel * (50.0 / dist) * sizeMod * uReady;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a * 1.4, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

const loadingEl = document.getElementById('loading');
const hintEl    = document.getElementById('hint');
const srcEl     = document.getElementById('src');

// generate initial particle cloud
function generateParticles(count) {
  N = count;
  const pos = new Float32Array(N * 3);
  const sds = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    pos[i*3] = 0; pos[i*3+1] = 0; pos[i*3+2] = 0;
    sds[i] = Math.random();
  }
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('seed', new THREE.BufferAttribute(sds, 1));
}
generateParticles(N);

// NOAA NDBC API — Buoy 46042 Monterey Bay
// Real-time oceanographic data: wave height, period, wind speed, water temp
const BUOY_URL = 'https://www.ndbc.noaa.gov/data/realtime2/46042.txt';
let fetchAttempts = 0;
let lastData = null;

async function fetchBuoyData() {
  try {
    const res = await fetch(BUOY_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const lines = text.trim().split('\n');
    if (lines.length < 3) throw new Error('insufficient data');
    
    // NDBC format: line 0 = headers, line 1 = units, line 2+ = data rows
    // We take the most recent (line 2)
    const headers = lines[0].split(/\s+/);
    const latest = lines[2].split(/\s+/);
    
    const data = {};
    headers.forEach((h, i) => { data[h] = latest[i]; });
    
    // Extract oceanographic parameters
    const waveHeight = parseFloat(data.WVHT || '2.0'); // significant wave height (m)
    const wavePeriod = parseFloat(data.DPD || '8.0');  // dominant wave period (s)
    const windSpeed  = parseFloat(data.WSPD || '5.0'); // wind speed (m/s)
    const waterTemp  = parseFloat(data.WTMP || '14.0');// water temp (°C)
    
    // Validate and clamp
    const vh = isNaN(waveHeight) ? 2.0 : Math.max(0.5, Math.min(8.0, waveHeight));
    const vp = isNaN(wavePeriod) ? 8.0 : Math.max(4.0, Math.min(20.0, wavePeriod));
    const ws = isNaN(windSpeed)  ? 5.0 : Math.max(0.0, Math.min(25.0, windSpeed));
    const wt = isNaN(waterTemp)  ? 14.0 : Math.max(8.0, Math.min(22.0, waterTemp));
    
    lastData = { vh, vp, ws, wt, time: data.YY + '-' + data.MM + '-' + data.DD + ' ' + data.hh + ':' + data.mm };
    
    uniforms.uWaveHeight.value = vh;
    uniforms.uWavePeriod.value = vp;
    uniforms.uWindSpeed.value = ws;
    uniforms.uWaterTemp.value = wt;
    
    // Particle count scales with wave energy (height × 1/period)
    const energy = vh / (vp / 10.0);
    const targetCount = Math.floor(35000 + energy * 8000);
    if (Math.abs(targetCount - N) > 5000) {
      generateParticles(targetCount);
    }
    
    hintEl.textContent = `wave ${vh.toFixed(1)}m · period ${vp.toFixed(1)}s · wind ${ws.toFixed(1)}m/s · ${wt.toFixed(1)}°C · ${lastData.time} UTC`;
    
    loadingEl.style.display = 'none';
    if (uniforms.uReady.value === 0) revealStart = performance.now();
    
    fetchAttempts = 0;
  } catch (err) {
    fetchAttempts++;
    console.warn('NOAA fetch failed:', err);
    if (fetchAttempts === 1) {
      // First failure: use fallback and show message
      loadingEl.textContent = 'live data unavailable · fallback to median pacific conditions';
      setTimeout(() => { loadingEl.style.display = 'none'; }, 3000);
      if (uniforms.uReady.value === 0) revealStart = performance.now();
    }
  }
}

fetchBuoyData();
setInterval(fetchBuoyData, 30000); // update every 30s

let revealStart = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 2800);
  }
  
  // gentle camera orbit — follows the swell
  camera.position.x = Math.sin(t * 0.06) * 26;
  camera.position.z = Math.cos(t * 0.06) * 26;
  camera.position.y = 8 + Math.sin(t * 0.12) * 2;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
