<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vaulted clark bichos · hinged arch panels</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1a1a; overflow:hidden;
               color:#ccc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; color:#888; z-index:10; }
</style>
</head>
<body>
<div class="id">j28</div>
<div class="hint">drag to orbit · click to revault</div>
<div class="src">Clark bichos → vaulted ribs · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1a1a, 1);
document.body.appendChild(renderer.domElement);

const N = 80000;
const NUM_RIBS = 9;
const SEGMENTS_PER_RIB = 8;
const TOTAL_PANELS = NUM_RIBS * SEGMENTS_PER_RIB;
const PARTICLES_PER_PANEL = Math.floor(N / TOTAL_PANELS);

const PANEL_W = 0.85, PANEL_H = 1.4, PANEL_D = 0.32;

let panelDefs = [];
let foldTargets = [];
let foldCurrents = [];

function definePanels() {
  panelDefs = [];
  foldTargets = [];
  foldCurrents = [];

  const rng = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

  /* Each rib: sequence of hinged panels forming a pointed arch */
  const vaultRise = 5.5 + rng() * 1.5;
  const vaultSpan = 9.0 + rng() * 2.0;
  
  for (let ribIdx = 0; ribIdx < NUM_RIBS; ribIdx++) {
    const ribAngle = (ribIdx / NUM_RIBS) * Math.PI * 2;
    const ribRadius = vaultSpan * 0.4;
    
    const ribBaseX = Math.cos(ribAngle) * ribRadius;
    const ribBaseZ = Math.sin(ribAngle) * ribRadius;
    
    /* Pointed arch: two halves meeting at apex */
    const apexAngle = 0.85 + rng() * 0.3; // steepness
    
    for (let seg = 0; seg < SEGMENTS_PER_RIB; seg++) {
      const panelIdx = ribIdx * SEGMENTS_PER_RIB + seg;
      const t = seg / (SEGMENTS_PER_RIB - 1);
      
      /* Two-arc pointed arch: each half is quarter circle */
      let localAngle, yPos, isLeft;
      if (t < 0.5) {
        // Left ascending arc
        isLeft = true;
        const arcT = t * 2.0;
        localAngle = arcT * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.8;
      } else {
        // Right descending arc
        isLeft = false;
        const arcT = (t - 0.5) * 2.0;
        localAngle = (1.0 - arcT) * apexAngle;
        yPos = Math.sin(localAngle) * vaultRise * 0.8;
      }
      
      const xOffset = isLeft ? 
        -Math.cos(localAngle) * (vaultSpan * 0.15) :
        Math.cos(localAngle) * (vaultSpan * 0.15);
      
      /* Panel position along rib path */
      const x = ribBaseX + xOffset * Math.cos(ribAngle);
      const y = yPos;
      const z = ribBaseZ + xOffset * Math.sin(ribAngle);
      
      /* Hinge angle: normal to arc */
      const hingeRot = localAngle + (isLeft ? -Math.PI/2 : Math.PI/2);
      
      const accentProb = seg === Math.floor(SEGMENTS_PER_RIB / 2) ? 0.7 : 0.1;
      
      panelDefs.push({
        basePos: [x, y, z],
        hingeRot: hingeRot,
        ribAngle: ribAngle,
        segmentT: t,
        accent: rng() < accentProb
      });
      
      /* Fold targets: breathe open/closed around neutral */
      const baseFold = (rng() - 0.5) * 0.6;
      foldTargets.push(baseFold);
      foldCurrents.push(baseFold * 0.8);
    }
  }
}

let seed = 42;

function makeRng(s) {
  let st = s >>> 0;
  return () => {
    st |= 0; st = st + 0x6D2B79F5 | 0;
    let t = Math.imul(st ^ st >>> 15, 1 | st);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const panelIds = new Float32Array(N);
const localCoords = new Float32Array(N * 3);

function populatePanels() {
  const rng = makeRng(seed + 7);

  const silver = [0.72, 0.73, 0.74];
  const silverDark = [0.45, 0.46, 0.48];
  const copper = [0.72, 0.35, 0.18];

  let idx = 0;
  for (let p = 0; p < TOTAL_PANELS && idx < N; p++) {
    const count = p < TOTAL_PANELS - 1 ? PARTICLES_PER_PANEL : N - idx;
    const isAccent = panelDefs[p].accent;

    for (let k = 0; k < count; k++) {
      const lx = (rng() - 0.5) * PANEL_W;
      const ly = (rng() - 0.5) * PANEL_H;
      const lz = (rng() - 0.5) * PANEL_D;

      /* Surface bias for metal sheet */
      const face = rng();
      let fx = lx, fy = ly, fz = lz;
      if (face < 0.4) fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      else if (face < 0.6) fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
      else if (face < 0.75) fy = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_H;

      /* Edge concentration */
      const edgeBias = rng();
      if (edgeBias < 0.2) {
        fx = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_W;
        fz = (rng() > 0.5 ? 0.5 : -0.5) * PANEL_D;
      }

      localCoords[idx * 3] = fx;
      localCoords[idx * 3 + 1] = fy;
      localCoords[idx * 3 + 2] = fz;
      panelIds[idx] = p;

      const shade = 0.85 + rng() * 0.15;
      if (isAccent) {
        colors[idx * 3] = copper[0] * shade;
        colors[idx * 3 + 1] = copper[1] * shade;
        colors[idx * 3 + 2] = copper[2] * shade;
      } else {
        const base = rng() > 0.4 ? silver : silverDark;
        colors[idx * 3] = base[0] * shade;
        colors[idx * 3 + 1] = base[1] * shade;
        colors[idx * 3 + 2] = base[2] * shade;
      }

      idx++;
    }
  }
}

function updatePositions(folds) {
  const v = new THREE.Vector3();
  const axis = new THREE.Vector3();
  const quat = new THREE.Quaternion();
  
  for (let i = 0; i < N; i++) {
    const p = panelIds[i] | 0;
    const def = panelDefs[p];
    
    v.set(localCoords[i*3], localCoords[i*3+1], localCoords[i*3+2]);
    
    /* Hinge fold rotation */
    const foldAngle = folds[p];
    axis.set(0, 1, 0); // vertical hinge
    quat.setFromAxisAngle(axis, foldAngle);
    v.applyQuaternion(quat);
    
    /* Orient panel along rib curve */
    const orientQuat = new THREE.Quaternion();
    orientQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), def.ribAngle);
    
    const normalQuat = new THREE.Quaternion();
    normalQuat.setFromAxisAngle(new THREE.Vector3(0, 0, 1), def.hingeRot);
    
    orientQuat.multiply(normalQuat);
    v.applyQuaternion(orientQuat);
    
    /* Translate to base position */
    v.x += def.basePos[0];
    v.y += def.basePos[1];
    v.z += def.basePos[2];
    
    positions[i*3] = v.x;
    positions[i*3+1] = v.y;
    positions[i*3+2] = v.z;
  }
}

seed = Math.floor(Math.random() * 1e9);
definePanels();
populatePanels();
updatePositions(foldCurrents);

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uPixel: { value: renderer.getPixelRatio() },
  },
  vertexColors: true,
  transparent: true,
  depthWrite: true,
  depthTest: true,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vDepth = -mv.z;
      gl_PointSize = uPixel * (2.5 + 14.0 / max(vDepth, 1.0));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r2 = dot(d, d);
      if (r2 > 0.25) discard;

      float shade = clamp(1.0 - vDepth * 0.015, 0.35, 1.0);
      vec3 col = vColor * shade;

      float fogFactor = smoothstep(35.0, 70.0, vDepth);
      vec3 fogCol = vec3(0.102, 0.102, 0.102);
      col = mix(col, fogCol, fogFactor);

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const cloud = new THREE.Points(geom, mat);
scene.add(cloud);

let azimuth = 0.4, elevation = 0.3, radius = 20;
let targetAz = azimuth, targetEl = elevation;
let isDragging = false, lastMx = 0, lastMy = 0;
let autoRotate = true;

const canvas = renderer.domElement;
canvas.addEventListener('pointerdown', e => {
  isDragging = true;
  autoRotate = false;
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastMx;
  const dy = e.clientY - lastMy;
  targetAz -= dx * 0.005;
  targetEl += dy * 0.005;
  targetEl = Math.max(-1.3, Math.min(1.3, targetEl));
  lastMx = e.clientX;
  lastMy = e.clientY;
});
canvas.addEventListener('pointerup', () => { isDragging = false; });

canvas.addEventListener('click', () => {
  seed = Math.floor(Math.random() * 1e9);
  definePanels();
  populatePanels();
  geom.attributes.color.needsUpdate = true;
  autoRotate = true;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  mat.uniforms.uPixel.value = renderer.getPixelRatio();
});

function computeCentroid() {
  let cx = 0, cy = 0, cz = 0;
  const step = 50;
  let count = 0;
  for (let i = 0; i < N; i += step) {
    cx += positions[i*3];
    cy += positions[i*3+1];
    cz += positions[i*3+2];
    count++;
  }
  return new THREE.Vector3(cx/count, cy/count, cz/count);
}

const startTime = performance.now();
const lookTarget = new THREE.Vector3(0, 2, 0);

function loop() {
  const t = (performance.now() - startTime) / 1000;

  /* Autonomous breathing fold */
  for (let i = 0; i < TOTAL_PANELS; i++) {
    const baseAngle = foldTargets[i];
    const breathe = Math.sin(t * 0.35 + i * 0.8) * 0.4;
    const harmonic = Math.sin(t * 0.15 + i * 1.3) * 0.18;
    const target = baseAngle + breathe + harmonic;
    foldCurrents[i] += (target - foldCurrents[i]) * 0.04;
  }

  updatePositions(foldCurrents);
  geom.attributes.position.needsUpdate = true;
  geom.computeBoundingSphere();

  if (autoRotate) {
    targetAz += 0.0018;
  }
  azimuth += (targetAz - azimuth) * 0.06;
  elevation += (targetEl - elevation) * 0.06;

  const centroid = computeCentroid();
  lookTarget.lerp(centroid, 0.04);

  camera.position.set(
    lookTarget.x + radius * Math.cos(elevation) * Math.sin(azimuth),
    lookTarget.y + radius * Math.sin(elevation),
    lookTarget.z + radius * Math.cos(elevation) * Math.cos(azimuth)
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
