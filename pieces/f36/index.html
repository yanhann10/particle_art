<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>f36 · flamingo · animated point-cloud</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0c0710; overflow:hidden;
               color:#f4dee0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
             font-size: 13px; opacity: 0.6; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="loading" id="loading">loading flamingo · three.js examples …</div>
<div class="id">f36 · flamingo</div>
<div class="hint">drag to orbit · animated wing flap</div>
<div class="src">model: Flamingo.glb · three.js examples (CC-attribution)</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 22);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0710, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const N = 60000;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec3 p = position;
      // wing-flap: x-distance from spine drives vertical oscillation, soft falloff at body
      float wingX = abs(p.x);
      float flap = sin(uTime * 4.5) * 0.55;
      p.y += wingX * flap * smoothstep(1.0, 5.0, wingX);
      // small per-particle shimmer
      float t = uTime * 0.7 + seed * 6.28;
      p += 0.05 * vec3(sin(t), cos(t*1.1), sin(t*0.8));

      // reveal: particles arc in from above-screen into rest pose
      vec3 entry = p + vec3(0, 18.0 + seed * 6.0, 18.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vEnergy = 0.5 + 0.5 * sin(t * 0.8);
      // hot-pink → coral → cream
      vec3 a = vec3(0.96, 0.30, 0.55);
      vec3 b = vec3(0.99, 0.60, 0.55);
      vec3 c = vec3(0.99, 0.92, 0.85);
      float k = clamp(0.35 + 0.45 * sin(seed * 11.0) + 0.2 * vEnergy, 0.0, 1.0);
      vCol = mix(a, b, k);
      vCol = mix(vCol, c, smoothstep(0.78, 1.0, k) * 0.55);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      // smaller per-particle size so additive density doesn't burn to white
      gl_PointSize = (0.6 + 0.5 * vEnergy) * uPixel * (60.0 / dist) * (0.4 + 0.6 * uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // tighter gaussian, lower peak to keep colors saturated under additive blending
      float a = exp(-r * 22.0) * (0.40 + 0.35 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
const points = new THREE.Points(geom, mat);
scene.add(points);

let revealStart = 0;
const FLAMINGO_URL = 'https://threejs.org/examples/models/gltf/Flamingo.glb';

const loader = new GLTFLoader();
loader.load(FLAMINGO_URL,
  (gltf) => {
    let target = null;
    gltf.scene.traverse(o => { if (!target && o.isMesh && o.geometry?.attributes?.position) target = o; });
    if (!target) { document.getElementById('loading').textContent = 'no mesh'; return; }
    target.updateMatrixWorld(true);

    // bake world transform, then re-frame to fit a 14-unit max-axis box centered on origin
    const baseGeom = target.geometry.clone();
    baseGeom.applyMatrix4(target.matrixWorld);
    baseGeom.computeBoundingBox();
    const bb = baseGeom.boundingBox;
    const center = bb.getCenter(new THREE.Vector3());
    const size = bb.getSize(new THREE.Vector3());
    const maxAxis = Math.max(size.x, size.y, size.z);
    const TARGET = 14;
    const scl = TARGET / maxAxis;
    baseGeom.translate(-center.x, -center.y, -center.z);
    baseGeom.scale(scl, scl, scl);

    const sampleMesh = new THREE.Mesh(baseGeom.toNonIndexed(), target.material);
    const sampler = new MeshSurfaceSampler(sampleMesh).build();

    const positions = new Float32Array(N * 3);
    const seeds = new Float32Array(N);
    const tmp = new THREE.Vector3();
    for (let i = 0; i < N; i++){
      sampler.sample(tmp);
      positions[i*3]   = tmp.x;
      positions[i*3+1] = tmp.y;
      positions[i*3+2] = tmp.z;
      seeds[i] = Math.random();
    }
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.computeBoundingSphere();

    document.getElementById('loading').style.display = 'none';
    revealStart = performance.now();
  },
  (xhr) => {
    if (xhr.lengthComputable) {
      const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
      document.getElementById('loading').textContent = `loading flamingo · ${pct}%`;
    }
  },
  (err) => { console.error(err); document.getElementById('loading').textContent = 'load failed'; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;
  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (performance.now() - revealStart) / 2200);
  }
  // gentle auto-orbit when user isn't dragging
  points.rotation.y = Math.sin(t * 0.18) * 0.4;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
