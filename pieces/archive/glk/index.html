<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glk · talisman · hammered-ward</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#07060b; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">glk</div>
<div class="hint">drag to orbit · click to pause/resume · watch for the pulse</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Chain from 2g6 (Calder-balance ribbon with mobile shapes)
// TALISMAN: the hanging Calder shapes become protective ward symbols —
// concentric rings, eye-of-protection, spirals, runic crosses.
// The ribbon takes on hammered bronze patina. The tip mechanic becomes
// a periodic pulse of protective energy that travels through the ribbon
// and illuminates each talisman in sequence.
// Technique reference: Alexander Calder's mobiles crossed with
// Ernst Haeckel's Kunstformen — biomorphic sacred geometry.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07060b, 0.016);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07060b, 1);
document.body.appendChild(renderer.domElement);

const lightKey = new THREE.DirectionalLight(0xffe8c0, 1.0);
lightKey.position.set(6, 12, 4);
scene.add(lightKey);
scene.add(new THREE.AmbientLight(0x0c0818, 0.5));
const lightFill = new THREE.DirectionalLight(0x2a3858, 0.4);
lightFill.position.set(-6, 4, -4);
scene.add(lightFill);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

const pivot = new THREE.Group();
scene.add(pivot);

// ─── differential growth (inherited) ───
const MAX_VERTS = 1400;
const ATTRACT = 0.06, REPEL_R = 0.55, REPEL_STR = 0.14;
const NOISE = 0.003, PRESSURE = 0.0030, RISE = 0.0045, MAX_D = 0.42;

const verts = [];
for (let i = 0; i < 14; i++){
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of gridNeighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x-u.x, ey = v.y-u.y, ez = v.z-u.z;
      const d2 = ex*ex+ey*ey+ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0, cy2=0, cz2=0;
  for (let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n;cy2/=n;cz2/=n;
  for (let i=0;i<n;i++){
    const ox=verts[i].x-cx2,oy=verts[i].y-cy2,oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for (let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0014;
  }
  const grown = [];
  for (let i=0;i<n;i++){
    const a=verts[i],b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x,ey=b.y-a.y,ez=b.z-a.z;
    if (ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,
        age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for (const v of grown) verts.push(v);
}
for (let s=0;s<1200;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

// ─── ribbon material (hammered bronze) ───
const ribbonMat = new THREE.MeshStandardMaterial({
  color: 0x8b6834, emissive: 0x1a0e04,
  roughness: 0.55, metalness: 0.8, side: THREE.DoubleSide
});
let ribbonMesh = null;

// ─── talisman shapes (replacing Calder flat shapes) ───
const MOBILE_COUNT = 16;

// Palette: aged bronze, dark patina, lapis accent
const TALISMAN_COLORS = [
  0x7a5c2e, // dark bronze
  0x2a3a6a, // lapis blue
  0x7a5c2e,
  0x2a3a6a,
  0x9a7a3a, // lighter bronze accent
];

// Shape generators: ward circle (torus), eye shape, spiral disc, runic cross
function makeWardRing(){
  const group = new THREE.Group();
  // Outer ring
  const outer = new THREE.Mesh(
    new THREE.TorusGeometry(0.30, 0.035, 8, 24),
    null
  );
  group.add(outer);
  // Inner ring
  const inner = new THREE.Mesh(
    new THREE.TorusGeometry(0.18, 0.025, 8, 16),
    null
  );
  group.add(inner);
  // Center dot
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 8, 8),
    null
  );
  group.add(dot);
  group.userData.meshes = [outer, inner, dot];
  return group;
}

function makeEyeShape(){
  const group = new THREE.Group();
  // Eye outline (torus squeezed)
  const eyeRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.26, 0.03, 8, 24),
    null
  );
  eyeRing.scale.set(1, 0.55, 1);
  group.add(eyeRing);
  // Iris
  const iris = new THREE.Mesh(
    new THREE.TorusGeometry(0.10, 0.025, 8, 16),
    null
  );
  group.add(iris);
  // Pupil
  const pupil = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 8, 8),
    null
  );
  group.add(pupil);
  group.userData.meshes = [eyeRing, iris, pupil];
  return group;
}

function makeSpiralDisc(){
  const group = new THREE.Group();
  // Disc backing
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 20),
    null
  );
  group.add(disc);
  // Spiral wire on top
  const pts = [];
  for (let i = 0; i < 80; i++){
    const t = i / 80;
    const a = t * Math.PI * 4;
    const r = 0.04 + t * 0.22;
    pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r, 0.02));
  }
  const spiralGeo = new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(pts), 60, 0.015, 5, false
  );
  const spiral = new THREE.Mesh(spiralGeo, null);
  group.add(spiral);
  group.userData.meshes = [disc, spiral];
  return group;
}

function makeRunicCross(){
  const group = new THREE.Group();
  // Vertical bar
  const vBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.06, 0.52, 0.02),
    null
  );
  group.add(vBar);
  // Horizontal bar
  const hBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 0.06, 0.02),
    null
  );
  hBar.position.y = 0.08;
  group.add(hBar);
  // Circle around intersection
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.16, 0.02, 8, 20),
    null
  );
  ring.position.y = 0.08;
  group.add(ring);
  group.userData.meshes = [vBar, hBar, ring];
  return group;
}

const shapeFactories = [makeWardRing, makeEyeShape, makeSpiralDisc, makeRunicCross];

// Chain material (replacing thin wire)
const chainMat = new THREE.MeshStandardMaterial({
  color: 0x5a4a2a, roughness: 0.6, metalness: 0.7
});

const mobileGroup = new THREE.Group();
pivot.add(mobileGroup);

const mobiles = [];
for (let i = 0; i < MOBILE_COUNT; i++){
  const factory = shapeFactories[i % shapeFactories.length];
  const talisman = factory();
  const baseColor = new THREE.Color(TALISMAN_COLORS[i % TALISMAN_COLORS.length]);
  const mat = new THREE.MeshStandardMaterial({
    color: baseColor,
    emissive: 0x000000,
    roughness: 0.5, metalness: 0.6,
    side: THREE.DoubleSide
  });
  // Apply material to all sub-meshes
  for (const m of talisman.userData.meshes) m.material = mat;

  // Chain link (small torus segments) — simplified as a cylinder wire
  const chainLen = 0.6 + Math.random() * 1.0;
  const chainGeo = new THREE.CylinderGeometry(0.012, 0.012, chainLen, 6);
  const chain = new THREE.Mesh(chainGeo, chainMat);

  mobileGroup.add(chain);
  mobileGroup.add(talisman);

  mobiles.push({
    talisman, chain, mat, baseColor: baseColor.clone(),
    chainLen,
    curveT: (i + 0.5) / MOBILE_COUNT,
    swingPhase: Math.random() * Math.PI * 2,
    swingFreq: 0.3 + Math.random() * 0.4,
    scale: 0.55 + Math.random() * 0.45,
  });
}

let curveRef = null;

// ─── Pulse mechanic (evolved from Calder tip) ───
// A wave of protective energy travels along the ribbon every ~12s,
// lighting each talisman as it passes. The structure sways gently
// (inherited tip, but subdued — talismans steady the mobile).
const PULSE_CYCLE = 12.0;
const PULSE_DURATION = 3.5; // how long the wave takes to traverse

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

// Gentle sway (remnant of Calder tip, subdued)
const SWAY_CYCLE = 20.0;
let swayAngle = 0;
let lastSwayIdx = -1;
let swayAxisX = 1, swayAxisZ = 0;

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startT = performance.now();
const glowColor = new THREE.Color(0x4488cc);
const bronzeEmit = new THREE.Color(0x1a0e04);
const pulseEmit = new THREE.Color(0x1a2a4a);

function loop(){
  const t = (performance.now() - startT) / 1000;
  for (let s=0;s<4;s++) step();

  // Gentle sway (inherited from tip, much softer)
  const swayIdx = Math.floor(t / SWAY_CYCLE);
  if (swayIdx !== lastSwayIdx){
    lastSwayIdx = swayIdx;
    swayAngle = (swayIdx * 2.37) % (Math.PI * 2);
    swayAxisX = Math.cos(swayAngle);
    swayAxisZ = Math.sin(swayAngle);
  }
  const swayAmount = Math.sin(t * 0.3) * 0.08; // very gentle

  // Pulse wave position along curve [0..1]
  const pulsePhase = (t % PULSE_CYCLE) / PULSE_CYCLE;
  const pulseWaveCenter = pulsePhase * (1.0 + PULSE_DURATION / PULSE_CYCLE);
  const pulseWaveWidth = 0.12;

  // ─── rebuild ribbon ───
  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.0);
    curveRef = curve;
    const N = Math.min(1200, verts.length * 3);
    const positions = new Float32Array(N * 2 * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);

    for (let i=0;i<N;i++){
      const tt = i/N;
      const p = curve.getPointAt(tt);
      const tan = curve.getTangentAt(tt).normalize();
      let lat = new THREE.Vector3().crossVectors(tan, up);
      if (lat.lengthSq()<0.001) lat.set(1,0,0);
      lat.normalize();
      const width = 0.22 + 0.14 * Math.sin(tt*28.0 + t*0.3);
      const left = p.clone().addScaledVector(lat, -width);
      const right = p.clone().addScaledVector(lat, width);
      positions[i*6]=left.x; positions[i*6+1]=left.y; positions[i*6+2]=left.z;
      positions[i*6+3]=right.x; positions[i*6+4]=right.y; positions[i*6+5]=right.z;
    }
    for (let i=0;i<N;i++){
      const ni=(i+1)%N;
      const a=i*2, b=i*2+1, c=ni*2, d=ni*2+1;
      indices.push(a,b,c); indices.push(b,d,c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    if (ribbonMesh){ pivot.remove(ribbonMesh); ribbonMesh.geometry.dispose(); }
    ribbonMesh = new THREE.Mesh(g, ribbonMat);
    pivot.add(ribbonMesh);
  }

  // ─── gentle sway (subdued tip) ───
  let cx2=0, cy2=0, cz2=0;
  for (const v of verts){cx2+=v.x;cy2+=v.y;cz2+=v.z;}
  cx2/=verts.length; cy2/=verts.length; cz2/=verts.length;

  pivot.position.set(0, 0, 0);
  pivot.rotation.set(0, 0, 0);
  const euler = new THREE.Euler(swayAxisX * swayAmount, 0, swayAxisZ * swayAmount, 'XYZ');
  pivot.position.set(cx2, cy2, cz2);
  pivot.rotation.copy(euler);
  const offset = new THREE.Vector3(-cx2, -cy2, -cz2).applyEuler(euler);
  pivot.position.add(offset);

  // ─── ribbon pulse glow ───
  // Ribbon emissive pulses as wave passes
  const ribbonPulse = Math.max(0, 1.0 - Math.abs(pulseWaveCenter - 0.5) * 4);
  ribbonMat.emissive.copy(bronzeEmit).lerp(pulseEmit, ribbonPulse * 0.5);

  // ─── update talisman pendants ───
  if (curveRef){
    const upV = new THREE.Vector3(0, 1, 0);
    for (let i = 0; i < mobiles.length; i++){
      const m = mobiles[i];
      const p = curveRef.getPointAt(m.curveT);
      const tan = curveRef.getTangentAt(m.curveT).normalize();

      // Pendulum swing (gentle)
      const swingAmp = 0.10 + Math.abs(swayAmount) * 1.5;
      const swingAngle2 = Math.sin(t * m.swingFreq + m.swingPhase) * swingAmp;
      let lat = new THREE.Vector3().crossVectors(tan, upV);
      if (lat.lengthSq() < 0.001) lat.set(1,0,0);
      lat.normalize();

      const hangDir = new THREE.Vector3(0, -1, 0)
        .addScaledVector(lat, Math.sin(swingAngle2))
        .normalize();

      const endPt = p.clone().addScaledVector(hangDir, m.chainLen);

      // Position chain
      const midPt = p.clone().add(endPt).multiplyScalar(0.5);
      m.chain.position.copy(midPt);
      m.chain.scale.set(1, m.chainLen, 1);
      m.chain.lookAt(endPt);
      m.chain.rotateX(Math.PI / 2);

      // Position talisman at chain end
      m.talisman.position.copy(endPt);
      m.talisman.scale.setScalar(m.scale);
      m.talisman.lookAt(endPt.clone().add(lat));
      m.talisman.rotation.z += swingAngle2 * 0.4;

      // Pulse glow on this talisman
      const dist = Math.abs(m.curveT - pulseWaveCenter);
      const wrapDist = Math.min(dist, 1.0 - dist); // wrap around
      const glow = Math.max(0, 1.0 - wrapDist / pulseWaveWidth);
      const glowEased = glow * glow;

      // Emissive glow during pulse
      m.mat.emissive.set(0, 0, 0).lerp(glowColor, glowEased * 0.7);
      // Slight color shift toward lighter during pulse
      m.mat.color.copy(m.baseColor).lerp(new THREE.Color(0xaabbdd), glowEased * 0.3);

      // Gentle slow rotation of the talisman (as if turning on its chain)
      m.talisman.rotation.y = t * 0.15 + i * 0.8;
    }
  }

  // ─── camera tracking ───
  let yMean = 0;
  for (const v of verts) yMean += v.y;
  yMean /= Math.max(verts.length, 1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
