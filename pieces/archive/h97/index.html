<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h97 · leaf-flurry · attractor shed</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#04060a; overflow:hidden;
               color:#cfe1d4; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id    { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint  { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .stage { position:fixed; right:14px; bottom:12px; opacity:0.7; font-size: 11px; letter-spacing: 0.08em; }
  .src   { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }

<body>
<div class="id">h97</div>
<div class="hint">click to cycle stage · leaves shed every ~18s</div>
<div class="stage" id="stage">stage 1/4 · lorenz</div>
<div class="src">100k GPGPU · leaf-flurry surprise</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const MODES = [
  { id: 'lorenz',    basinCenter: [0, 0, 27],  basinSize: 8,
    normCenter:[0, 0, 25],  normScale: 25,  pal: [[0.20,0.32,0.78],[0.85,0.32,0.62],[0.98,0.86,0.50]] },
  { id: 'aizawa',    basinCenter: [0.1, 0, 0], basinSize: 0.6,
    normCenter:[0, 0, 0],   normScale: 1.6, pal: [[0.20,0.62,0.45],[0.55,0.30,0.78],[0.92,0.95,0.98]] },
  { id: 'thomas',    basinCenter: [0.5, 0, 0.5], basinSize: 1.2,
    normCenter:[0, 0, 0],   normScale: 5.0, pal: [[0.92,0.55,0.20],[0.98,0.78,0.32],[0.55,0.20,0.05]] },
  { id: 'halvorsen', basinCenter: [-1, -1, -1], basinSize: 1.8,
    normCenter:[0, 0, 0],   normScale: 7.0, pal: [[0.42,0.78,0.92],[0.88,0.42,0.62],[0.92,0.92,0.85]] },
];

// Autumn leaf palette for the flurry moment
const LEAF_PAL = [
  [0.92, 0.42, 0.12],  // burnt orange
  [0.85, 0.22, 0.10],  // crimson
  [0.95, 0.78, 0.18],  // gold
];

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x04060a, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(modeIdx){
  const m = MODES[modeIdx];
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    init[i*4]   = m.basinCenter[0] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+1] = m.basinCenter[1] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+2] = m.basinCenter[2] + (Math.random() - 0.5) * m.basinSize;
    init[i*4+3] = Math.random();
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true; return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture(0) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

function reinitTo(modeIdx){
  blitMat.uniforms.tex.value = makeInitTexture(modeIdx);
  renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
  renderer.setRenderTarget(null);
}
reinitTo(0);

// simulation shader — now with flurry force
const simUniforms = {
  prev:    { value: rtA.texture },
  uDt:     { value: 0.0 },
  uMode:   { value: 0 },
  uFlurry: { value: 0.0 },
  uTime:   { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform int uMode;
    uniform float uFlurry;
    uniform float uTime;
    varying vec2 vUv;

    // pseudo-random from UV
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    vec3 lorenz(vec3 p){
      return vec3(10.0*(p.y-p.x), p.x*(28.0-p.z)-p.y, p.x*p.y - (8.0/3.0)*p.z);
    }
    vec3 aizawa(vec3 p){
      const float a=0.95, b=0.7, c=0.6, d=3.5, e=0.25, f=0.1;
      return vec3((p.z-b)*p.x - d*p.y, d*p.x + (p.z-b)*p.y,
                  c + a*p.z - p.z*p.z*p.z/3.0 - (p.x*p.x + p.y*p.y)*(1.0+e*p.z) + f*p.z*p.x*p.x*p.x);
    }
    vec3 thomasA(vec3 p){
      const float B = 0.208186;
      return vec3(sin(p.y)-B*p.x, sin(p.z)-B*p.y, sin(p.x)-B*p.z);
    }
    vec3 halvorsen(vec3 p){
      const float a = 1.4;
      return vec3(-a*p.x - 4.0*p.y - 4.0*p.z - p.y*p.y,
                  -a*p.y - 4.0*p.z - 4.0*p.x - p.z*p.z,
                  -a*p.z - 4.0*p.x - 4.0*p.y - p.x*p.x);
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      vec3 dp;
      if (uMode == 0)      dp = lorenz(p);
      else if (uMode == 1) dp = aizawa(p);
      else if (uMode == 2) dp = thomasA(p);
      else                 dp = halvorsen(p);

      float dt = uDt;
      if (uMode == 0) dt *= 0.15;
      else if (uMode == 3) dt *= 0.4;

      // leaf-flurry: when active, particles shed from the attractor
      // like leaves tearing off a tree in a gust
      if (uFlurry > 0.01) {
        float h = hash(vUv);
        float phase = h * 6.2832;
        // individual flutter — each particle gets its own sinusoidal tumble
        float flutter_x = sin(uTime * 4.0 + phase) * 2.5;
        float flutter_z = cos(uTime * 3.3 + phase * 1.7) * 2.0;
        // gravity pull downward in native coords
        float gravity = -6.0;
        // scale forces by attractor's native scale so the shed is visible
        float nativeScale = 1.0;
        if (uMode == 0) nativeScale = 25.0;
        else if (uMode == 1) nativeScale = 1.6;
        else if (uMode == 2) nativeScale = 5.0;
        else nativeScale = 7.0;

        vec3 flurryForce = vec3(flutter_x, gravity, flutter_z) * nativeScale * 0.15;
        // blend: at full flurry, attractor force is suppressed, flurry dominates
        float suppress = smoothstep(0.0, 0.6, uFlurry);
        dp = mix(dp, flurryForce, suppress * (0.5 + 0.5 * h));
      }

      p += dp * dt;
      age = mod(age + dt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ─────────────────────────── render scene ───────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 50);
camera.position.set(0, 0.6, 5);
camera.lookAt(0, 0, 0);

// volumetric beam
const beamGeom = new THREE.ConeGeometry(1.2, 11, 24, 1, true);
beamGeom.translate(0, 5.5, 0);
const beamMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(0.85, 0.92, 1.0) } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vLocal; varying float vYNorm;
    void main(){ vLocal=position; vYNorm=position.y/11.0;
                 gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uTime; uniform vec3 uColor;
    varying vec3 vLocal; varying float vYNorm;
    void main(){
      float radial = length(vec2(vLocal.x, vLocal.z));
      float r = 1.0 - smoothstep(0.0, 1.2*(1.0-vYNorm), radial);
      float vert = 1.0 - smoothstep(0.0, 1.0, vYNorm);
      float a = r * vert * 0.20 * (0.95 + 0.05*sin(uTime*0.7));
      gl_FragColor = vec4(uColor*a, a);
    }`
});
const beam = new THREE.Mesh(beamGeom, beamMat);
beam.position.set(-2.4, -3.0, -1.0);
beam.rotation.z = -0.18;
scene.add(beam);

// points geometry
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtA.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uPalA:  { value: new THREE.Vector3(...MODES[0].pal[0]) },
    uPalB:  { value: new THREE.Vector3(...MODES[0].pal[1]) },
    uPalC:  { value: new THREE.Vector3(...MODES[0].pal[2]) },
    uNormCenter: { value: new THREE.Vector3(...MODES[0].normCenter) },
    uNormScale:  { value: MODES[0].normScale },
    uFade:       { value: 1.0 },
    uBeamPos:    { value: new THREE.Vector3(-2.4, 0.0, -1.0) },
    uFlurry:     { value: 0.0 },
    // leaf palette injected as uniforms
    uLeafA: { value: new THREE.Vector3(...LEAF_PAL[0]) },
    uLeafB: { value: new THREE.Vector3(...LEAF_PAL[1]) },
    uLeafC: { value: new THREE.Vector3(...LEAF_PAL[2]) }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform vec3  uPalA, uPalB, uPalC;
    uniform vec3  uLeafA, uLeafB, uLeafC;
    uniform vec3  uNormCenter;
    uniform float uNormScale;
    uniform float uFade;
    uniform vec3  uBeamPos;
    uniform float uFlurry;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vBeam;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;
      vec3 disp = (p - uNormCenter) / uNormScale;

      vec2 toBeam = disp.xz - vec2(uBeamPos.x, uBeamPos.z);
      float beamProx = exp(-dot(toBeam, toBeam) * 3.5);
      vBeam = beamProx;

      // base attractor palette
      float k = mod(age, 1.0);
      vec3 col = mix(uPalA, uPalB, smoothstep(0.0, 0.5, k));
      col = mix(col, uPalC, smoothstep(0.5, 1.0, k));

      // during flurry: crossfade to warm autumn leaf colors
      if (uFlurry > 0.01) {
        vec3 leafCol = mix(uLeafA, uLeafB, smoothstep(0.0, 0.5, k));
        leafCol = mix(leafCol, uLeafC, smoothstep(0.5, 1.0, k));
        col = mix(col, leafCol, uFlurry * 0.85);
      }

      col = mix(col, col*1.5 + vec3(0.05,0.08,0.12), beamProx*0.6);
      vCol = col;
      vAlpha = uFade;

      vec4 mv = modelViewMatrix * vec4(disp, 1.0);
      vFogDepth = -mv.z;
      // particles grow slightly during flurry (leaf-like)
      float flurrySize = 1.0 + uFlurry * 1.8;
      gl_PointSize = (2.0 + 1.6 * beamProx) * flurrySize * uPixel * (3.0 / vFogDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vBeam;
    varying float vAlpha;
    varying float vFogDepth;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      float fogF = 1.0 - exp(-0.0035 * vFogDepth * vFogDepth);
      vec3 col = mix(vCol, vec3(0.025, 0.030, 0.040), fogF);
      gl_FragColor = vec4(col * a * (0.6 + vBeam*0.6) * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// ─────────────────────────── mode-switch wipe ───────────────────────────
let mode = 0;
let switching = false;
let switchStartT = 0;
let switchTargetMode = 0;
const SWITCH_S = 1.4;

const stageEl = document.getElementById('stage');
function setStageText(){ stageEl.textContent = `stage ${mode+1}/4 · ${MODES[mode].id}`; }
setStageText();

function updateUniformsForMode(m){
  pointsMat.uniforms.uPalA.value.set(...MODES[m].pal[0]);
  pointsMat.uniforms.uPalB.value.set(...MODES[m].pal[1]);
  pointsMat.uniforms.uPalC.value.set(...MODES[m].pal[2]);
  pointsMat.uniforms.uNormCenter.value.set(...MODES[m].normCenter);
  pointsMat.uniforms.uNormScale.value = MODES[m].normScale;
  simUniforms.uMode.value = m;
}

function startSwitch(target){
  if (switching) return;
  switching = true;
  switchStartT = performance.now();
  switchTargetMode = target;
}

addEventListener('click', () => startSwitch((mode + 1) % MODES.length));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// auto-cycle every 14s
setInterval(() => { if (!switching) startSwitch((mode + 1) % MODES.length); }, 14000);

// ─────────────────────────── leaf-flurry surprise ───────────────────────────
// Every ~18s, the attractor sheds its particles like leaves in a gust.
// Ramps up over 1.5s, holds 2s, recovers over 2.5s. A Calder-mobile tip moment.
let flurryPhase = -1;  // -1 = idle
let flurryStartT = 0;
const FLURRY_RAMP_UP = 1.5;
const FLURRY_HOLD    = 2.0;
const FLURRY_RECOVER = 2.5;
const FLURRY_TOTAL   = FLURRY_RAMP_UP + FLURRY_HOLD + FLURRY_RECOVER;
const FLURRY_INTERVAL = 18000; // ms between flurries

function triggerFlurry(){
  if (flurryPhase >= 0 || switching) return;
  flurryPhase = 0;
  flurryStartT = performance.now();
}

// first flurry after 8s, then every 18s
setTimeout(triggerFlurry, 8000);
setInterval(() => { triggerFlurry(); }, FLURRY_INTERVAL);

function updateFlurry(now){
  if (flurryPhase < 0) {
    simUniforms.uFlurry.value = 0.0;
    pointsMat.uniforms.uFlurry.value = 0.0;
    return;
  }
  const elapsed = (now - flurryStartT) / 1000;
  let f = 0.0;
  if (elapsed < FLURRY_RAMP_UP) {
    // smooth ramp up
    f = smoothstepJS(elapsed / FLURRY_RAMP_UP);
  } else if (elapsed < FLURRY_RAMP_UP + FLURRY_HOLD) {
    // full flurry — slight wobble
    f = 0.85 + 0.15 * Math.sin((elapsed - FLURRY_RAMP_UP) * 3.0);
  } else if (elapsed < FLURRY_TOTAL) {
    // recover: particles recaptured by attractor
    const t = (elapsed - FLURRY_RAMP_UP - FLURRY_HOLD) / FLURRY_RECOVER;
    f = 1.0 - smoothstepJS(t);
  } else {
    f = 0.0;
    flurryPhase = -1;
  }
  simUniforms.uFlurry.value = f;
  pointsMat.uniforms.uFlurry.value = f;
}

function smoothstepJS(t){
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

// ─────────────────────────── render loop ───────────────────────────
let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const timeSec = now / 1000;

  beamMat.uniforms.uTime.value = timeSec;
  simUniforms.uDt.value = dt;
  simUniforms.uTime.value = timeSec;

  // flurry update
  updateFlurry(now);

  // during flurry, tint the beam warm
  const fl = simUniforms.uFlurry.value;
  beamMat.uniforms.uColor.value.setRGB(
    0.85 + fl * 0.10,
    0.92 - fl * 0.35,
    1.0  - fl * 0.55
  );

  // wipe transition
  if (switching){
    const u = (now - switchStartT) / (SWITCH_S * 1000);
    if (u < 0.5){
      pointsMat.uniforms.uFade.value = 1.0 - u * 2.0;
    } else if (u < 1.0){
      if (pointsMat.uniforms.uFade.value <= 0.05 && mode !== switchTargetMode){
        mode = switchTargetMode;
        updateUniformsForMode(mode);
        reinitTo(mode);
        setStageText();
      }
      pointsMat.uniforms.uFade.value = (u - 0.5) * 2.0;
    } else {
      pointsMat.uniforms.uFade.value = 1.0;
      switching = false;
    }
  }

  // sim 4 substeps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // slow camera turn; during flurry, camera tilts slightly downward to follow shed
  const ang = now * 0.00018;
  camera.position.x = Math.sin(ang) * 5;
  camera.position.z = Math.cos(ang) * 5;
  camera.position.y = Math.sin(ang * 0.7) * 1.0 - fl * 0.8;
  camera.lookAt(0, -fl * 0.5, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
