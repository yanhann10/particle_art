<html>
<head>
  <meta charset="utf-8">
  <title>9f6 — incision fold</title>
  <style>*{margin:0;padding:0}body{background:#090909;overflow:hidden}</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ── Scene ─────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0908);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.01, 50);
camera.position.set(0, -1.2, 4.8);
camera.lookAt(0, 0.3, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.05;
ctrl.target.set(0, 0.2, 0);

// ── Lighting — raking light from one side to show relief depth ────────────
scene.add(new THREE.AmbientLight(0xfff8f0, 0.18));

const key = new THREE.DirectionalLight(0xfff4e0, 2.8);
key.position.set(3.5, 3, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left:-3,right:3,top:3,bottom:-3,near:0.1,far:20});
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d8ff, 0.45);
fill.position.set(-3, 1.5, 1);
scene.add(fill);

const back = new THREE.DirectionalLight(0xffe0c0, 0.25);
back.position.set(0.5, -2, -2);
scene.add(back);

// ── Materials ─────────────────────────────────────────────────────────────
const paperBase = new THREE.MeshPhongMaterial({
  color: 0xf0e8d8, specular: 0x1a1a1a, shininess: 6, side: THREE.DoubleSide
});

// ── Geometry helpers ──────────────────────────────────────────────────────

// Flat base square with radial slit holes cut out
function buildBase(halfSz, nSlits, rIn, rOut, slitW) {
  const shape = new THREE.Shape();
  shape.moveTo(-halfSz,-halfSz); shape.lineTo(halfSz,-halfSz);
  shape.lineTo(halfSz,halfSz);   shape.lineTo(-halfSz,halfSz);
  shape.closePath();

  for (let i = 0; i < nSlits; i++) {
    const a  = (i / nSlits) * Math.PI * 2;
    const ax = Math.cos(a), ay = Math.sin(a);
    const px = -ay * slitW * 0.5, py = ax * slitW * 0.5;
    const h  = new THREE.Path();
    h.moveTo(ax*rIn+px, ay*rIn+py);   h.lineTo(ax*rIn-px,  ay*rIn-py);
    h.lineTo(ax*rOut-px, ay*rOut-py); h.lineTo(ax*rOut+px, ay*rOut+py);
    h.closePath();
    shape.holes.push(h);
  }
  return shape;
}

// Arc-bent rectangular panel
// Local frame: hinge at origin, +Y = outward along radial, +Z = up from paper
function bentPanel(width, len, bendAng, segs=36) {
  const R = len / Math.max(bendAng, 1e-5);
  const pos=[], nor=[], uv=[], idx=[];
  for (let j=0; j<=segs; j++) {
    const t=j/segs, a=t*bendAng;
    const y=R*Math.sin(a), z=R*(1-Math.cos(a));
    const ny=Math.cos(a), nz=-Math.sin(a); // outward normal of arc surface
    for (let s=0; s<2; s++) {
      pos.push((s-0.5)*width, y, z);
      nor.push(0, ny, nz);
      uv.push(s, t);
    }
    if (j<segs) {
      const o=j*2;
      idx.push(o,o+2,o+1, o+1,o+2,o+3);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',  new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',      new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  return g;
}

// ── Parameters ────────────────────────────────────────────────────────────
const N      = 6;
const R_IN   = 0.21;
const R_OUT  = 0.87;
const HALF   = 1.06;
const SLIT_W = 0.052;
const PETAL_W = (2*Math.PI*(R_IN+R_OUT)*0.5/N) * 0.70;
const PETAL_L = R_OUT - R_IN;

// Each petal's rest bend angle (radians) — varied for visual interest
const REST_BENDS = [0.72, 0.94, 0.62, 0.88, 0.75, 0.58].map(b=>b*Math.PI);

// ── Build scene ───────────────────────────────────────────────────────────

// Flat base with cuts
const baseShape = buildBase(HALF, N, R_IN, R_OUT, SLIT_W);
const baseMesh  = new THREE.Mesh(new THREE.ShapeGeometry(baseShape,52), paperBase);
baseMesh.receiveShadow = true;
scene.add(baseMesh);

// Thin paper edge (extrude 0.005 for physicality)
const edgeMat = paperBase.clone(); edgeMat.color.set(0xddd4c0);
const edgeMesh = new THREE.Mesh(
  new THREE.ExtrudeGeometry(baseShape,{depth:0.007,bevelEnabled:false}), edgeMat);
edgeMesh.position.z = -0.007;
scene.add(edgeMesh);

// Petals
const petals = [];
for (let i=0; i<N; i++) {
  const mid    = ((i+0.5)/N)*Math.PI*2;
  const bend   = REST_BENDS[i];
  const mat    = paperBase.clone();
  // Subtle warm-cool variation across petals
  mat.color.lerpColors(new THREE.Color(0xf4ede0), new THREE.Color(0xe8f0f4), i/N*0.5);

  const mesh  = new THREE.Mesh(bentPanel(PETAL_W, PETAL_L, bend), mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Pivot: origin at hinge circle, rotate so local +Y faces radially outward
  const pivot = new THREE.Group();
  pivot.position.set(Math.cos(mid)*R_IN, Math.sin(mid)*R_IN, 0);
  pivot.rotation.z = mid - Math.PI*0.5;   // local +Y → radial outward ✓
  pivot.add(mesh);
  scene.add(pivot);
  petals.push({mesh, bend, phase:(i/N)*Math.PI*2});
}

// ── Click to toggle unfold ────────────────────────────────────────────────
let unfolded = false, animTarget = 0, animCurrent = 0;
renderer.domElement.addEventListener('click', ()=>{
  unfolded = !unfolded;
  animTarget = unfolded ? 1 : 0;
});

// ── Animate ───────────────────────────────────────────────────────────────
function rebuild(p, factor) {
  // Rebuild petal geometry with scaled bend angle
  const bend = p.bend * (1 - factor * 0.88); // 0 = rest, 1 = almost flat
  const newGeo = bentPanel(PETAL_W, PETAL_L, Math.max(bend, 0.04));
  p.mesh.geometry.dispose();
  p.mesh.geometry = newGeo;
}

let lastFactor = -1;
function animate(ms) {
  requestAnimationFrame(animate);
  const t = ms * 0.001;

  // Smooth unfold / refold
  animCurrent += (animTarget - animCurrent) * 0.025;
  if (Math.abs(animCurrent-lastFactor) > 0.005) {
    petals.forEach(p => rebuild(p, animCurrent));
    lastFactor = animCurrent;
  }

  // Gentle breathing when at rest
  if (!unfolded) {
    petals.forEach((p,i) => {
      const breath = 1 + 0.04*Math.sin(t*0.55+p.phase);
      p.mesh.scale.z = breath;
    });
  }

  // Very slow drift rotation
  scene.rotation.z = Math.sin(t*0.06)*0.05;

  ctrl.update();
  renderer.render(scene,camera);
}
animate(0);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
