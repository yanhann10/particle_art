<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: settle, intensity: calm -->
<title>21i · tender light strings (disrupted)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }

<body>
<div class="id">21i</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Felix Gonzalez-Torres · disrupted light strings · pulled threads in a weave</div>
<div class="stat" id="stat">N=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Disrupted light strings — FGT string drape with 4 intentional
   breaks in regularity: a burnt-out gap, a tangled cluster,
   an extra-deep sag, and a cool-temperature replaced bulb zone.
   Each disruption reads as someone's hand having been there —
   fiddling, neglecting, replacing. Domestic imperfection. */

const BG = 0x0a0807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 2, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, -1, 0);

/* ---------- disruption zones ----------
   Each zone is a sphere in world space with a type:
   0 = burnt-out (particles go dark / vanish)
   1 = tangled cluster (extra density, tighter spread)
   2 = deep sag (wire droops extra, gravity multiplied)
   3 = cool bulb (color shifts cooler — replaced LED) */
const disruptions = [
  { cx: -3.2, cy: -2.0, cz: 0.2, r: 1.4, type: 0 },  // burnt-out gap, left-of-center
  { cx:  2.8, cy: -1.5, cz:-0.3, r: 1.0, type: 1 },  // tangled cluster, right
  { cx: -0.8, cy: -3.5, cz: 0.5, r: 1.8, type: 2 },  // deep sag, center-left low
  { cx:  4.5, cy: -0.6, cz: 0.0, r: 1.2, type: 3 },  // cool replacement bulb, far right
];

function getDisruption(x, y, z) {
  for (const d of disruptions) {
    const dx = x - d.cx, dy = y - d.cy, dz = z - d.cz;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist < d.r) return { type: d.type, strength: 1.0 - dist / d.r };
  }
  return null;
}

// --- curve parameters ---
const MAX_VERTS = 3200;
const ATTRACT   = 0.05;
const REPEL_R   = 0.48;
const REPEL_STR = 0.10;
const NOISE     = 0.002;
const PRESSURE  = 0.002;
const GRAVITY   = 0.008;
const MAX_D     = 0.36;
const ANCHOR_N  = 6;

// initialize: horizontal line, slight wave
const verts = [];
const NV0 = 40;
for (let i = 0; i < NV0; i++) {
  const t = (i / (NV0 - 1)) * 2 - 1;
  const x = t * 6;
  const y = -Math.abs(t) * 1.2 + Math.sin(t * Math.PI * 2) * 0.3;
  verts.push({ x, z: 0, y, age: 0, pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N });
}

// spatial hash
const CELL = REPEL_R;
const grid = new Map();
function gridKey(x, z) { return Math.floor(x / CELL) + ',' + Math.floor(z / CELL); }
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i], k = gridKey(v.x, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function nearby(v) {
  const cx = Math.floor(v.x / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function step() {
  if (paused) return;
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  // repulsion
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of nearby(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      // in tangled-cluster zone, reduce repulsion → tighter packing
      let str = REPEL_STR;
      const dis = getDisruption(v.x, v.y, v.z);
      if (dis && dis.type === 1) str *= (1.0 - dis.strength * 0.7);
      const f = str * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  // attraction toward neighbors
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? verts[i - 1] : null;
    const next = i < n - 1 ? verts[i + 1] : null;
    const v = verts[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  // pressure
  let ccx = 0, ccz = 0;
  for (let i = 0; i < n; i++) { ccx += verts[i].x; ccz += verts[i].z; }
  ccx /= n; ccz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - ccx, oz = verts[i].z - ccz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }

  // apply + gravity + noise + disruption-specific gravity
  for (let i = 0; i < n; i++) {
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;

    let grav = verts[i].pinY ? GRAVITY * 0.05 : GRAVITY;
    // deep-sag zone: multiply gravity
    const dis = getDisruption(verts[i].x, verts[i].y, verts[i].z);
    if (dis && dis.type === 2 && !verts[i].pinY) {
      grav *= (1.0 + dis.strength * 3.5);
    }
    verts[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.5;
    verts[i].age += 0.0004;
  }

  // subdivide
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.7,
        pinY: false
      });
    }
  }
  grown.push(verts[n - 1]);
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// --- rendering ---
const N_RENDER = 40000;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rAge   = new Float32Array(N_RENDER);
const rZone  = new Float32Array(N_RENDER); // encodes disruption zone type (-1 = none)
for (let i = 0; i < N_RENDER; i++) { rSeeds[i] = Math.random(); rZone[i] = -1.0; }

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('age',      new THREE.BufferAttribute(rAge, 1));
geom.setAttribute('zone',     new THREE.BufferAttribute(rZone, 1));

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.035 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float age;
    attribute float zone;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform float uFogDensity;

    void main() {
      vec3 p = position;

      float t = uTime * 0.3 + seed * 6.28;
      float sway = sin(t) * 0.008 * (1.0 + seed);
      p.x += sway;
      p.z += cos(t * 0.7) * 0.005;

      float pulse = 0.85 + 0.15 * sin(uTime * 1.2 + seed * 40.0);

      // palette: warm filament amber → soft white
      vec3 amber  = vec3(1.0, 0.72, 0.32);
      vec3 warm   = vec3(1.0, 0.88, 0.72);
      vec3 white  = vec3(1.0, 0.96, 0.92);
      // cool replacement zone: slight blue-white LED tone
      vec3 coolLed = vec3(0.82, 0.90, 1.0);

      float k = clamp(age * 1.2, 0.0, 1.0);
      vCol = mix(amber, warm, k);
      vCol = mix(vCol, white, smoothstep(0.7, 1.0, k) * 0.3);

      // zone == 0: burnt out — very dim
      // zone == 1: tangled cluster — slightly brighter, tighter
      // zone == 3: cool LED replacement — shift hue
      if (zone > -0.5 && zone < 0.5) {
        // burnt-out: flicker to near-dark
        float flicker = step(0.92, fract(sin(seed * 4321.0 + uTime * 0.1) * 43758.5453));
        vCol *= 0.04 + flicker * 0.15;
        pulse *= 0.1;
      } else if (zone > 0.5 && zone < 1.5) {
        // tangled cluster: slightly over-bright, crowded
        vCol *= 1.15;
        pulse *= 1.1;
      } else if (zone > 2.5 && zone < 3.5) {
        // cool LED: mix toward blue-white
        vCol = mix(vCol, coolLed, 0.55);
      }

      vCol *= pulse;
      vAlpha = 0.55 + 0.2 * pulse;

      // burnt-out zone: near-invisible
      if (zone > -0.5 && zone < 0.5) {
        vAlpha *= 0.12;
      }

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // tangled cluster: smaller, denser points
      float sizeMult = 1.0;
      if (zone > 0.5 && zone < 1.5) sizeMult = 0.7;

      gl_PointSize = 1.8 * sizeMult * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      float core = exp(-r * 24.0);
      float halo = exp(-r * 8.0) * 0.35;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.8);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// wire
const wireGeom = new THREE.BufferGeometry();
const wirePositions = new Float32Array(MAX_VERTS * 3);
wireGeom.setAttribute('position', new THREE.BufferAttribute(wirePositions, 3));
const wireMat = new THREE.LineBasicMaterial({
  color: 0x2a2420, transparent: true, opacity: 0.3
});
const wireLine = new THREE.Line(wireGeom, wireMat);
scene.add(wireLine);

// faint second wire for tangled-cluster zone — a short doubled segment
const wire2Geom = new THREE.BufferGeometry();
const wire2Pos = new Float32Array(200 * 3);
wire2Geom.setAttribute('position', new THREE.BufferAttribute(wire2Pos, 3));
const wire2Mat = new THREE.LineBasicMaterial({
  color: 0x2a2420, transparent: true, opacity: 0.18
});
const wire2Line = new THREE.Line(wire2Geom, wire2Mat);
scene.add(wire2Line);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow
for (let s = 0; s < 500; s++) step();

const statEl = document.getElementById('stat');
const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  for (let s = 0; s < 3; s++) step();

  const n = verts.length;

  // update wire
  for (let i = 0; i < n; i++) {
    wirePositions[i * 3]     = verts[i].x;
    wirePositions[i * 3 + 1] = verts[i].y;
    wirePositions[i * 3 + 2] = verts[i].z;
  }
  wireGeom.setDrawRange(0, n);
  wireGeom.attributes.position.needsUpdate = true;

  // doubled wire in tangled zone — offset copy
  let w2count = 0;
  const td = disruptions[1]; // tangled cluster zone
  for (let i = 0; i < n && w2count < 199; i++) {
    const v = verts[i];
    const ddx = v.x - td.cx, ddy = v.y - td.cy, ddz = v.z - td.cz;
    if (ddx*ddx + ddy*ddy + ddz*ddz < td.r * td.r * 1.2) {
      wire2Pos[w2count * 3]     = v.x + 0.06;
      wire2Pos[w2count * 3 + 1] = v.y - 0.08;
      wire2Pos[w2count * 3 + 2] = v.z + 0.04;
      w2count++;
    }
  }
  wire2Geom.setDrawRange(0, w2count);
  wire2Geom.attributes.position.needsUpdate = true;

  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) {
    cx += verts[i].x; cy += verts[i].y; cz += verts[i].z;
  }
  cx /= n; cy /= n; cz /= n;
  controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.02);

  // distribute particles along curve with disruption-aware density
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = verts[i], b = verts[i + 1];
    const L = Math.sqrt((b.x-a.x)**2 + (b.z-a.z)**2 + (b.y-a.y)**2);
    lengths.push(L);
    total += L;
  }

  if (total > 0) {
    let written = 0;
    for (let i = 0; i < n - 1; i++) {
      const a = verts[i], b = verts[i + 1];
      const mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5, mz = (a.z + b.z) * 0.5;
      const dis = getDisruption(mx, my, mz);

      // density modulation per disruption
      let densityMult = 1.0;
      if (dis) {
        if (dis.type === 0) densityMult = 0.15; // burnt-out: sparse
        if (dis.type === 1) densityMult = 2.2;  // tangled: dense
        if (dis.type === 2) densityMult = 0.85;
        if (dis.type === 3) densityMult = 1.0;
      }

      let share = (i === n - 2)
        ? N_RENDER - written
        : Math.max(1, Math.floor(N_RENDER * lengths[i] / total * densityMult));
      share = Math.min(share, N_RENDER - written);

      const zoneType = dis ? dis.type : -1;

      for (let k = 0; k < share && written < N_RENDER; k++) {
        const u = Math.random();
        const cu = u < 0.5 ? u * u * 2 : 1 - (1 - u) * (1 - u) * 2;

        // spread: tighter in tangled zone, normal elsewhere
        let spread = 0.015;
        if (dis && dis.type === 1) spread = 0.006;

        rPos[written * 3]     = a.x + (b.x - a.x) * cu + (Math.random() - 0.5) * spread;
        rPos[written * 3 + 1] = a.y + (b.y - a.y) * cu + (Math.random() - 0.5) * spread * 0.5;
        rPos[written * 3 + 2] = a.z + (b.z - a.z) * cu + (Math.random() - 0.5) * spread;
        rAge[written] = Math.max(a.age, b.age);
        rZone[written] = zoneType;
        written++;
      }
    }
    // fill remaining with last position (edge case)
    for (let i = written; i < N_RENDER; i++) {
      rPos[i * 3]     = verts[n-1].x;
      rPos[i * 3 + 1] = verts[n-1].y;
      rPos[i * 3 + 2] = verts[n-1].z;
      rAge[i] = verts[n-1].age;
      rZone[i] = -1;
    }
    geom.attributes.position.needsUpdate = true;
    geom.attributes.age.needsUpdate = true;
    geom.attributes.zone.needsUpdate = true;
  }

  statEl.textContent = `vertices=${n}${paused ? ' · paused' : ''}`;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
