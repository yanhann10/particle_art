<!-- MOTION: drift, intensity: gentle -->

<div class="id">x0l · physarum slime-mold · agent trail network</div>
<div class="hint">click to pause/resume</div>
<div class="src">descended from 2iy · physarum agent steering + pheromone feedback</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// Sage Jenson (mxsage) physarum slime-mold agent-based system.
// Each agent deposits pheromone into a 2D texture, senses ahead-left/ahead/ahead-right,
// steers toward strongest signal. Pheromone texture has diffusion + decay.
// Render the accumulated trail as the visual — organic web structure.

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0e, 1);
document.body.appendChild(renderer.domElement);

// ─────────── physarum parameters
const AGENT_COUNT = 12000;
const SENSOR_ANGLE = 0.42;      // ±22.5° sensor offset
const SENSOR_DIST = 9.0;        // how far ahead to sense
const TURN_SPEED = 0.48;        // radians per step when turning
const MOVE_SPEED = 1.8;         // pixels per step
const DEPOSIT = 5.0;            // pheromone strength per deposit
const DECAY = 0.92;             // per-frame trail decay
const DIFFUSE = 0.14;           // diffusion blur weight

// ─────────── texture setup (ping-pong render targets for pheromone field)
const W = 1024, H = 1024;
const rtA = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType,
});
const rtB = new THREE.WebGLRenderTarget(W, H, {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType,
});
let readRT = rtA, writeRT = rtB;

// ─────────── agents (x, y, angle)
const agents = new Float32Array(AGENT_COUNT * 3);
for (let i = 0; i < AGENT_COUNT; i++){
  const angle = Math.random() * Math.PI * 2;
  const r = 80 + Math.random() * 60;
  const x = W * 0.5 + Math.cos(angle) * r;
  const y = H * 0.5 + Math.sin(angle) * r;
  agents[i * 3]     = x;
  agents[i * 3 + 1] = y;
  agents[i * 3 + 2] = angle + (Math.random() - 0.5) * 0.4;
}

// ─────────── shader: deposit agents as white dots onto pheromone field
const depositGeo = new THREE.BufferGeometry();
const depositPos = new Float32Array(AGENT_COUNT * 3);
const depositUV = new Float32Array(AGENT_COUNT * 2);
for (let i = 0; i < AGENT_COUNT; i++){
  depositPos[i * 3] = depositPos[i * 3 + 1] = depositPos[i * 3 + 2] = 0;
  depositUV[i * 2] = depositUV[i * 2 + 1] = 0;
}
depositGeo.setAttribute('position', new THREE.BufferAttribute(depositPos, 3));
depositGeo.setAttribute('uv', new THREE.BufferAttribute(depositUV, 2));

const depositMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
      gl_PointSize = 3.0;
    }
  `,
  fragmentShader: `
    uniform float uDeposit;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      gl_FragColor = vec4(uDeposit, 0.0, 0.0, 1.0);
    }
  `,
  uniforms: { uDeposit: { value: DEPOSIT } },
  blending: THREE.AdditiveBlending,
  depthTest: false,
  depthWrite: false,
  transparent: true,
});
const depositPoints = new THREE.Points(depositGeo, depositMat);
const depositScene = new THREE.Scene();
depositScene.add(depositPoints);

// ─────────── shader: diffuse + decay pass
const diffuseGeo = new THREE.PlaneGeometry(2, 2);
const diffuseMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    uniform vec2 uRes;
    uniform float uDecay;
    uniform float uDiffuse;
    varying vec2 vUv;
    void main(){
      vec2 px = 1.0 / uRes;
      float c = texture2D(tTrail, vUv).r;
      float blur = 0.0;
      blur += texture2D(tTrail, vUv + vec2(-px.x, 0.0)).r;
      blur += texture2D(tTrail, vUv + vec2( px.x, 0.0)).r;
      blur += texture2D(tTrail, vUv + vec2(0.0, -px.y)).r;
      blur += texture2D(tTrail, vUv + vec2(0.0,  px.y)).r;
      blur *= 0.25;
      float val = mix(c, blur, uDiffuse) * uDecay;
      gl_FragColor = vec4(val, 0.0, 0.0, 1.0);
    }
  `,
  uniforms: {
    tTrail: { value: null },
    uRes: { value: new THREE.Vector2(W, H) },
    uDecay: { value: DECAY },
    uDiffuse: { value: DIFFUSE },
  },
  depthTest: false,
  depthWrite: false,
});
const diffuseMesh = new THREE.Mesh(diffuseGeo, diffuseMat);
const diffuseScene = new THREE.Scene();
diffuseScene.add(diffuseMesh);

// ─────────── shader: display pass (color-map the pheromone field)
const displayGeo = new THREE.PlaneGeometry(2, 2);
const displayMat = new THREE.ShaderMaterial({
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tTrail;
    varying vec2 vUv;
    void main(){
      float val = texture2D(tTrail, vUv).r;
      float brightness = smoothstep(0.0, 1.2, val);
      // warm organic palette: amber to pale yellow on dark
      vec3 col = mix(vec3(0.04, 0.04, 0.06), vec3(0.92, 0.86, 0.68), brightness);
      col = mix(col, vec3(0.98, 0.94, 0.82), smoothstep(0.8, 1.0, brightness));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  uniforms: { tTrail: { value: null } },
  depthTest: false,
  depthWrite: false,
});
const displayMesh = new THREE.Mesh(displayGeo, displayMat);
const displayScene = new THREE.Scene();
displayScene.add(displayMesh);

// ─────────── read pheromone field from GPU (we sample the texture CPU-side)
const pheromonePixels = new Float32Array(W * H * 4);
function samplePheromone(x, y){
  const ix = Math.floor(x), iy = Math.floor(y);
  if (ix < 0 || ix >= W || iy < 0 || iy >= H) return 0;
  return pheromonePixels[(iy * W + ix) * 4];
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
});

function loop(){
  if (!paused){
    // read current pheromone field into CPU buffer
    renderer.readRenderTargetPixels(readRT, 0, 0, W, H, pheromonePixels);

    // agent motor + sensor stage
    for (let i = 0; i < AGENT_COUNT; i++){
      let x = agents[i * 3];
      let y = agents[i * 3 + 1];
      let angle = agents[i * 3 + 2];

      // sense ahead-left, ahead, ahead-right
      const sL = samplePheromone(
        x + Math.cos(angle - SENSOR_ANGLE) * SENSOR_DIST,
        y + Math.sin(angle - SENSOR_ANGLE) * SENSOR_DIST
      );
      const sC = samplePheromone(
        x + Math.cos(angle) * SENSOR_DIST,
        y + Math.sin(angle) * SENSOR_DIST
      );
      const sR = samplePheromone(
        x + Math.cos(angle + SENSOR_ANGLE) * SENSOR_DIST,
        y + Math.sin(angle + SENSOR_ANGLE) * SENSOR_DIST
      );

      // steering: turn toward strongest signal
      if (sC > sL && sC > sR){
        // continue straight
      } else if (sC < sL && sC < sR){
        // center is weakest: random turn
        angle += (Math.random() - 0.5) * TURN_SPEED * 2;
      } else if (sR > sL){
        angle += TURN_SPEED;
      } else if (sL > sR){
        angle -= TURN_SPEED;
      } else {
        // tie: small random
        angle += (Math.random() - 0.5) * TURN_SPEED * 0.5;
      }

      // move forward
      x += Math.cos(angle) * MOVE_SPEED;
      y += Math.sin(angle) * MOVE_SPEED;

      // bounce at boundaries
      if (x < 0 || x >= W){
        x = Math.max(0, Math.min(W - 1, x));
        angle = Math.PI - angle + (Math.random() - 0.5) * 0.3;
      }
      if (y < 0 || y >= H){
        y = Math.max(0, Math.min(H - 1, y));
        angle = -angle + (Math.random() - 0.5) * 0.3;
      }

      agents[i * 3] = x;
      agents[i * 3 + 1] = y;
      agents[i * 3 + 2] = angle;
    }

    // deposit: update point positions in NDC
    for (let i = 0; i < AGENT_COUNT; i++){
      const x = agents[i * 3];
      const y = agents[i * 3 + 1];
      depositPos[i * 3]     = (x / W) * 2 - 1;
      depositPos[i * 3 + 1] = (y / H) * 2 - 1;
      depositPos[i * 3 + 2] = 0;
    }
    depositGeo.attributes.position.needsUpdate = true;

    // render deposit onto writeRT (additive)
    renderer.setRenderTarget(writeRT);
    renderer.render(depositScene, camera);

    // diffuse + decay: read from writeRT, write to readRT
    diffuseMat.uniforms.tTrail.value = writeRT.texture;
    renderer.setRenderTarget(readRT);
    renderer.render(diffuseScene, camera);

    // swap
    [readRT, writeRT] = [writeRT, readRT];
  }

  // display the trail texture to screen
  displayMat.uniforms.tTrail.value = readRT.texture;
  renderer.setRenderTarget(null);
  renderer.render(displayScene, camera);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
