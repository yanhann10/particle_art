<script type="module">
import * as THREE from 'three';

// --- HELPERS ---
function qp(n){ return new URL(location.href).searchParams.get(n); }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }
function lerp(a,b,t){ return a + (b-a)*t; }

// --- STATE ---
let TT = { enabled: false, signals: null, current: null };
let currentParams = null, targetParams = null;
const N = 90000;
let geom, points, mat;

// --- RENDERER & CAMERA ---
const scene = new THREE.Scene();
const aspect = innerWidth / innerHeight;
const frustumSize = 28;
const camera = new THREE.OrthographicCamera(frustumSize*aspect/-2, frustumSize*aspect/2, frustumSize/2, frustumSize/-2, 0.1, 2000);
camera.position.set(0, 0, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "high-performance",
  precision: "highp"
});
const resMult = parseFloat(qp('res')) || 2.2; // supersample: larger backing store → hi-res SAVE PNG / screenshot
// Retina MBP sweet spot: avoid excessive supersampling blur.
// Slightly under native DPR keeps particles crisp/fullscreen.
const DPR = Math.min(devicePixelRatio, 1.6);
renderer.setPixelRatio(DPR * resMult);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

// --- UNIFORMS ---
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: Math.min(devicePixelRatio, 1.6) * resMult }, // scale points with supersample so look is unchanged
  uFlowScale: { value: 1.0 },
  uFluidThreshold: { value: 0.5 },
  uComplexity: { value: 1.5 },
  uViscosity: { value: 0.1 },
  uJitter: { value: 0.0 },
  uDepth: { value: 0.0 },
  uVortex: { value: 0.0 },
  uShatter: { value: 0.0 },
  uTension: { value: 0.0 },
  uCohesion: { value: 0.0 },
  uMirror: { value: 0.0 },
  uGeometric: { value: 0.0 },
  uViewport: { value: new THREE.Vector4(0, 0, 1, 1) },
  uGridMode: { value: 0.0 },
  uTraceNeighborhoods: { value: 1.0 },

  // Z-axis sonar suction cycle
  uZCycle: { value: 0.0 },
  uCameraPush: { value: 0.0 },
  uOpeningRestraint: { value: 1.0 },
  uYarnShow: { value: 0.72 },
};

// --- SHADER ---
mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime, uPixel, uFlowScale, uFluidThreshold, uComplexity, uViscosity, uJitter, uDepth, uVortex, uShatter, uTension, uCohesion, uMirror, uGeometric, uGridMode, uTraceNeighborhoods, uZCycle, uCameraPush, uOpeningRestraint, uYarnShow;
    uniform vec4 uViewport;
    attribute vec2 birthPos; attribute float seed, strokeId, birthZ;
    varying vec3 vColor; varying float vAlpha;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float stream(vec2 p, float t) {
      float n = noise(p * 0.8 + t * 0.15) * 2.0;
      float complexAmt = smoothstep(1.05, 1.45, uComplexity);
      n += noise(p * 1.6 - vec2(t * 0.2, 0.0)) * 0.5 * complexAmt;

      float geoAmt = smoothstep(0.05, 0.25, uGeometric);
      n = mix(n, sin(p.x * 2.0) * cos(p.y * 2.0) * 4.0, geoAmt * 0.8);
      return n + length(p) * uVortex * 0.5;
    }

    float pick6(float idx, float m0, float m1, float m2, float m3, float m4, float m5){
      if (idx < 0.5) return m0;
      if (idx < 1.5) return m1;
      if (idx < 2.5) return m2;
      if (idx < 3.5) return m3;
      if (idx < 4.5) return m4;
      return m5;
    }
    float softPulse(float phase, float center, float width){
      float d = (phase - center) / max(0.001, width);
      return exp(-d*d);
    }

    float smootherPulse(float x, float a, float b, float c, float d){
      return smoothstep(a, b, x) * (1.0 - smoothstep(c, d, x));
    }

    void main(){
      float t = uTime * 0.3;
      t += 0.18 * sin(uTime * 0.017) + 0.09 * sin(uTime * 0.041 + seed * 6.28318);
      vec2 p = birthPos;

      // Soft irregular neighborhoods, not visible pie slices.
      float rBase = length(p);
      float angBase = atan(p.y, p.x) + 3.14159265;
      float organicWarp = 0.55 * sin(rBase * 0.33 + uTime * 0.014)
                        + 0.22 * sin(p.x * 0.23 - p.y * 0.17 + uTime * 0.019)
                        + 0.10 * sin(seed * 6.28318);
      float nPos = (angBase + organicWarp) / 6.2831853 * 6.0;
      float nA = floor(nPos);
      float nB = mod(nA + 1.0, 6.0);
      float nBlend = smoothstep(0.10, 0.90, fract(nPos));

      // Neighborhood 0 uses the supplied intent/perception example.
      float sat = mix(
        pick6(nA, 0.5357, 0.9354, 0.2198, 0.8997, 0.9600, 0.5335),
        pick6(nB, 0.5357, 0.9354, 0.2198, 0.8997, 0.9600, 0.5335),
        nBlend);
      float expectation = mix(
        pick6(nA, 0.5833, 0.2463, 0.5668, 0.2173, 0.1162, 0.1203),
        pick6(nB, 0.5833, 0.2463, 0.5668, 0.2173, 0.1162, 0.1203),
        nBlend);
      float reasonIntensity = mix(
        pick6(nA, 1.0000, 0.5980, 0.3296, 0.6983, 0.6553, 0.5234),
        pick6(nB, 1.0000, 0.5980, 0.3296, 0.6983, 0.6553, 0.5234),
        nBlend);
      float valence = mix(
        pick6(nA, 0.0714, 0.9423, 0.2438, 0.9250, 0.9693, 0.6101),
        pick6(nB, 0.0714, 0.9423, 0.2438, 0.9250, 0.9693, 0.6101),
        nBlend);
      float reorientation = mix(
        pick6(nA, 0.0000, 0.0556, 0.3470, 0.0752, 0.0285, 0.0197),
        pick6(nB, 0.0000, 0.0556, 0.3470, 0.0752, 0.0285, 0.0197),
        nBlend);
      float affirmation = mix(
        pick6(nA, 0.0714, 0.9038, 0.1713, 0.7395, 0.9019, 0.1018),
        pick6(nB, 0.0714, 0.9038, 0.1713, 0.7395, 0.9019, 0.1018),
        nBlend);

      // Perception from agent turns/reactions.
      float explicitAff = mix(pick6(nA, 3.0/7.0, 0.90, 0.17, 0.74, 0.90, 0.10),
                              pick6(nB, 3.0/7.0, 0.90, 0.17, 0.74, 0.90, 0.10), nBlend);
      float scopeFit = mix(pick6(nA, 2.0/7.0, 0.04, 0.38, 0.06, 0.03, 0.08),
                           pick6(nB, 2.0/7.0, 0.04, 0.38, 0.06, 0.03, 0.08), nBlend);
      float contentRel = mix(pick6(nA, 2.0/7.0, 0.55, 0.20, 0.62, 0.70, 0.38),
                             pick6(nB, 2.0/7.0, 0.55, 0.20, 0.62, 0.70, 0.38), nBlend);

      // Different loop duration per neighborhood.
      float dur = mix(pick6(nA, 18.0, 14.5, 22.0, 39.0, 28.0, 24.0),
                      pick6(nB, 18.0, 14.5, 22.0, 39.0, 28.0, 24.0), nBlend);
      float phase = fract(uTime / dur);

      vec2 radialDir = normalize(p + vec2(0.0001));
      vec2 tangentDir = vec2(-radialDir.y, radialDir.x);

      // Dialogue motion grammar:
      // expectation       -> search tendrils, anticipatory leaning, branching paths
      // affirmation       -> phase-locking, damping, stable orbit formation
      // scope_fit friction-> shear, stalled flow, compression scars
      // content relevance -> connective bridges / information highways
      // reorientation     -> local coordinate redirection
      float early = softPulse(phase, 0.16, 0.20);
      float middle = softPulse(phase, 0.50, 0.24);
      float late = softPulse(phase, 0.82, 0.26);

      float expectationBurst = expectation * reasonIntensity * (0.38 + 0.62 * early);
      float affirmationSteady = (affirmation + explicitAff) * 0.5 * (0.50 + 0.50 * late);
      float friction = scopeFit + 0.45 * reorientation;
      float relevanceGlue = contentRel;

      // Space-warp experiment: localized inversion / domain reciprocation.
      // This is not damping. It changes the topology of the subspace:
      // p' = p / ||p||^2, around an off-center local origin.
      float invAng = atan(p.y, p.x);
      float invCenter = 0.62831853; // 36 degrees, upper-right neighborhood
      float invWidth = 0.72;        // about 41 degrees
      float invDiff = abs(atan(sin(invAng - invCenter), cos(invAng - invCenter)));
      float invRegion = 1.0 - smoothstep(invWidth * 0.55, invWidth, invDiff);

      // One loop only, after the original image has time to read.
      float invLoop = smoothstep(0.44, 0.56, uZCycle) * (1.0 - smoothstep(0.78, 0.92, uZCycle));

      vec2 invOrigin = vec2(2.3, 1.4);
      vec2 qInv = p - invOrigin;
      float r2Inv = dot(qInv, qInv) + 0.55;

      // Inversion map, rescaled into artwork coordinates.
      vec2 pInv = invOrigin + qInv / r2Inv * 18.0;

      // Neighboring bands alternate between normal space and inverted space.
      // This creates genuine opposite topology rather than weaker same-direction flow.
      float invBand = 0.5 + 0.5 * sin(dot(qInv, normalize(vec2(0.82, 0.57))) * 2.2 + seed * 6.28318);
      float invBandMask = smoothstep(0.36, 0.64, invBand);

      float invSemantic = 0.18 + 0.44 * reorientation + 0.32 * friction + 0.20 * expectation;
      float invAmt = invRegion * invLoop * invBandMask * invSemantic;

      p = mix(p, pInv, invAmt);

      // Counter-space nudge for adjacent bands, so inversion reads as reciprocation.
      vec2 invDir = normalize(pInv - p + vec2(0.0001));
      vec2 normalDir = normalize(qInv + vec2(0.0001));
      p += (invDir - normalDir) * invRegion * invLoop * (1.0 - invBandMask) * (0.32 + 0.08 * length(qInv));

      // Third-loop magic mirror: stronger inversion combination.
      // Instead of repeating the same expand/withdraw, the subspace becomes a double-sided mirror.
      float mirrorLoop = smoothstep(0.66, 0.76, uZCycle) * (1.0 - smoothstep(0.90, 0.99, uZCycle));

      vec2 mirrorOriginA = invOrigin;
      vec2 mirrorOriginB = vec2(-2.4, -1.6);

      vec2 qA = p - mirrorOriginA;
      vec2 qB = p - mirrorOriginB;

      float r2A = dot(qA, qA) + 0.42;
      float r2B = dot(qB, qB) + 0.58;

      vec2 invA = mirrorOriginA + qA / r2A * 20.0;
      vec2 invB = mirrorOriginB + qB / r2B * 16.0;

      // Magic mirror fold: reflect one inverted field through the other.
      vec2 mirrorAxis = normalize(vec2(0.74, -0.67));
      vec2 mirrorPerp = vec2(-mirrorAxis.y, mirrorAxis.x);

      float sideA = dot(invA - mirrorOriginA, mirrorAxis);
      float sideB = dot(invB - mirrorOriginB, mirrorPerp);

      vec2 reflectedA = invA - 2.0 * mirrorAxis * sideA;
      vec2 reflectedB = invB - 2.0 * mirrorPerp * sideB;

      // Localized third-loop regions:
      // upper-right uses mirror A, lower-left uses mirror B.
      float aP = atan(p.y, p.x);
      float upperRight = 1.0 - smoothstep(0.52, 0.92, abs(atan(sin(aP - 0.62831853), cos(aP - 0.62831853))));
      float lowerLeft = 1.0 - smoothstep(0.62, 1.05, abs(atan(sin(aP - 3.9269908), cos(aP - 3.9269908))));

      float magicRegion = mirrorLoop * max(invRegion, max(upperRight, lowerLeft));
      float semanticMirror = 0.20 + 0.42 * reorientation + 0.30 * expectation + 0.18 * friction;

      // Soft micro tessellation only inside mirror space, to make the 3rd loop less repetitive.
      vec2 cell = fract((p - mirrorOriginA) * (0.24 + 0.10 * mirrorLoop)) - 0.5;
      vec2 microMirror = mirrorOriginA + cell * 7.5;

      vec2 mirrorMixA = mix(invA, reflectedA, 0.45 + 0.30 * invBandMask);
      vec2 mirrorMixB = mix(invB, reflectedB, 0.55 - 0.24 * invBandMask);
      vec2 magicTarget = mix(mirrorMixA, mirrorMixB, lowerLeft);
      magicTarget = mix(magicTarget, microMirror, 0.16 * mirrorLoop * upperRight);

      float magicAmt = magicRegion * semanticMirror;
      p = mix(p, magicTarget, magicAmt);

      // Entire structure expands slightly in the third loop.
      float globalMirrorExpand = mirrorLoop * (1.0 - smoothstep(0.84, 0.99, uZCycle));
      p *= 1.0 + 0.060 * globalMirrorExpand;

      // Inner particles spiral toward negative z during the magic mirror loop.
      float innerMirror = (1.0 - smoothstep(2.8, 5.9, length(p))) * mirrorLoop;
      vec2 innerRad = normalize(p + vec2(0.001));
      vec2 innerTan = vec2(-innerRad.y, innerRad.x);
      p += innerTan * innerMirror * (0.42 + 0.18 * sin(uTime * 0.68 + seed * 6.28318));
      p -= innerRad * innerMirror * 0.14;

      // Variables for z/alpha after position construction.
      float mirrorDepth = magicAmt * (dot(normalize(qA + vec2(0.001)), mirrorAxis)) * 11.0;
      float innerNegativeZ = -20.0 * innerMirror;
      float outerFade = mirrorLoop * smoothstep(7.0, 12.2, length(p));

      // Third contraction finality:
      // around ~43s in the default 52s cycle, do not return to the original frame.
      // Instead, contract into a warped, higher-contrast final form.
      float finality = smoothstep(0.78, 0.90, uZCycle) * (1.0 - smoothstep(0.992, 1.0, uZCycle));

      vec2 finalOrigin = vec2(0.15, -0.10);
      vec2 qFinal = p - finalOrigin;
      float rFinal = length(qFinal) + 0.001;
      vec2 dirFinal = qFinal / rFinal;
      vec2 tanFinal = vec2(-dirFinal.y, dirFinal.x);

      // Not the same original contraction:
      // compress to an off-center warped seal, then shear into a final spatial fold.
      float seal = smoothstep(0.805, 0.890, uZCycle);
      float sealRelease = 1.0 - smoothstep(0.925, 0.985, uZCycle);
      float sealAmt = finality * seal * sealRelease;

      // Inversion-flavored final contraction. The center becomes boundary-like,
      // while the outer field folds inward and partially disappears.
      vec2 pSealInv = finalOrigin + qFinal / (dot(qFinal, qFinal) + 0.80) * 13.0;
      vec2 finalFold = finalOrigin
                     + dirFinal * (2.8 + 0.20 * rFinal)
                     + tanFinal * sin(rFinal * 1.1 + uTime * 0.42 + seed * 6.28318) * (0.55 + 0.18 * rFinal);

      vec2 finalTarget = mix(pSealInv, finalFold, 0.46 + 0.24 * affirmationSteady);
      p = mix(p, finalTarget, sealAmt * (0.42 + 0.22 * reorientation + 0.18 * expectation));

      // Strong final contraction in z: inner structure recedes, outer structure darkens.
      float finalInner = (1.0 - smoothstep(2.8, 6.0, rFinal)) * finality;
      float finalOuter = smoothstep(7.0, 12.4, rFinal) * finality;
      p += tanFinal * finalInner * 0.28 * sin(uTime * 0.70 + seed * 6.28318);
      p *= 1.0 - finalInner * 0.035;

      float finalDepth = -22.0 * finalInner + 8.0 * sealAmt * sin(rFinal * 0.7 + seed * 2.0);
      float finalOuterFade = finalOuter;

      // End-state: everything folds into one shrinking globular relic.
      // Not an explosion/dispersal, but progressive coherence and collapse.
      float orbPhase = smoothstep(0.965, 0.995, uZCycle);

      vec2 orbCenter = vec2(
        0.12 * sin(uTime * 0.06),
       -0.08 * cos(uTime * 0.05)
      );

      vec2 qOrb = p - orbCenter;
      float rOrb = length(qOrb) + 0.0001;
      vec2 dOrb = qOrb / rOrb;
      vec2 tOrb = vec2(-dOrb.y, dOrb.x);

      // Angular complexity decays over time.
      float complexityDecay = 1.0 - orbPhase;

      // Residual swirl collapses into breathing spherical coherence.
      // Delayed fold: preserve the seashell memory longer before contraction.
      float shellHold = smoothstep(0.86, 0.94, uZCycle) * (1.0 - smoothstep(0.985, 1.0, uZCycle));
      float shellTwist = shellHold * (1.0 - orbPhase) * sin(rOrb * 1.35 + uTime * 0.42 + seed * 6.28318);
      p += tOrb * shellTwist * 0.18;
      p += dOrb * shellHold * (1.0 - orbPhase) * 0.08 * sin(rOrb * 0.9 + seed * 3.1);

      float orbBreath = 1.0 + 0.06 * sin(uTime * 0.9 + seed * 6.28318) * (1.0 - orbPhase * 0.7);

      // Fold all trajectories toward one globular attractor.
      vec2 orbTarget =
          orbCenter
        + dOrb * (0.55 + 0.22 * complexityDecay) * orbBreath
        + tOrb * sin(rOrb * (0.8 + complexityDecay) + seed * 6.28318)
          * 0.08 * complexityDecay;

      // Global shrinking over the ending phase.
      float orbShrink = mix(1.0, 0.22, orbPhase);

      p = mix(p, orbTarget, orbPhase * 0.72);
      p = orbCenter + (p - orbCenter) * orbShrink;

      // Sink into negative z as the orb contracts.
      float orbDepth = -24.0 * orbPhase - 3.5 * rOrb * orbPhase;

      // Outer structure disappears first, leaving only the globular core.
      float orbOuterFade = smoothstep(0.965, 1.0, uZCycle) * smoothstep(2.6, 9.8, rOrb);

      // Slight density boost at the surviving core.
      float orbCoreGlow = orbPhase * (1.0 - smoothstep(0.0, 1.8, rOrb));

      // Two interacting systems: user-intent field and agent-response field.
      // Their phase difference produces negotiation instead of one-way expansion.
      float userWave = sin(phase * 6.2831853 + rBase * (0.28 + 0.45 * expectation));
      float agentWave = sin(phase * 6.2831853 * (0.72 + 0.35 * affirmationSteady) - rBase * (0.18 + 0.35 * relevanceGlue) + 1.7);
      float phaseAgreement = 1.0 - abs(userWave - agentWave) * 0.5;
      phaseAgreement = clamp(phaseAgreement, 0.0, 1.0);

      // Expectation as search, not just bloom.
      float branchCount = 3.0 + floor(expectation * 7.0);
      float branchSignal = sin(angBase * branchCount + phase * 6.2831853 + noise(p * 0.18) * 2.8);
      float branchMask = pow(abs(branchSignal), 5.5);
      float searching = branchMask * expectationBurst;

      // Anticipatory leaning: the body moves slightly before the branch arrives.
      vec2 anticipation = normalize(vec2(
        sin(phase * 6.2831853 + nA * 1.37),
        cos(phase * 6.2831853 * 0.81 + nA * 0.91)
      ));

      p += anticipation * expectationBurst * (0.20 + 0.20 * early);
      p += radialDir * rBase * expectationBurst * (0.035 + 0.065 * userWave);
      p += tangentDir * searching * 0.34;

      // Content relevance as bridges: persistent corridors that stitch neighborhoods together.
      float bridge = pow(abs(sin(angBase * 2.0 - phase * 6.2831853 * 0.55 + rBase * 0.22)), 10.0);
      p += tangentDir * bridge * relevanceGlue * 0.16;
      p += radialDir * bridge * relevanceGlue * 0.12;

      // Affirmation as phase-locking and stable orbit.

function build(seed){

  // thinned by a Perlin-density mask (organic clumps). Each strand grows by walking
  // the curl field, so directions vary with the flow instead of one uniform rotation.

  // whole circle fills), with only light Perlin thinning so it stays cellular/organic
  // without collapsing into one off-centre clump.

function regenerate(){
  const { pos, bpos, seeds, ids, bz } = build(Math.floor(Math.random()*1e9));

    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geom.setAttribute('birthPos', new THREE.BufferAttribute(bpos, 2));

  return {
    uFlowScale: lerp(0.55, 1.45, clamp01(0.6*e + 0.4*ri)),
    uFluidThreshold: lerp(0.60, 0.34, s),
    uComplexity: lerp(1.0, 3.0, e),
    uViscosity: lerp(0.05, 0.25, s),
    uJitter: lerp(0.0, 1.2, ro*0.4),
    uDepth: lerp(0.0, 10.0, a),
    uVortex: lerp(0.0, 8.0, s),
    uShatter: lerp(0.0, 1.2, ro),
    uTension: lerp(0.0, 4.0, e),
    uCohesion: lerp(0.0, 6.0, ri),
    uGeometric: lerp(0.0, 1.0, e),
    uMirror: lerp(0.0, 2.0, a),
    strokeBias: (ri - 0.5) * 1.6,
    grade: {
      hue: lerp(-28, 24, (rv+1)/2),
      sat: lerp(0.85, 1.55, clamp01(0.6*e+0.4*(1-ro))),
      bri: lerp(0.92, 1.22, clamp01(0.7*a+0.3*s)),
      con: lerp(0.92, 1.45, clamp01(0.7*ro+0.3*(1-s)))
    }
  };
}

function mapSignalIndex(sig){
  // If sig is null, return the "Original 2gl" baseline
  const isBaseline = !sig;
  const s = clamp01(sig?.satisfaction ?? 0.5),
        e = clamp01(sig?.expectation ?? 0.0),
        ri = clamp01(sig?.reasonIntensity ?? 0.3),
        ro = clamp01(sig?.reorientation ?? 0.0),
        a = clamp01(sig?.affirmation ?? 0.0),
        rv = Math.max(-1, Math.min(1, sig?.reactionValence ?? 0));

  let mode = 'LAMINAR (ORIGINAL)';
  if (isBaseline) mode = 'ORIGINAL 2GL';
  else if (e > 0.6 && e > s && e > a) mode = 'CRYSTALLINE GRID';
  else if (s > 0.6 && s > e && s > a) mode = 'RADIAL VORTEX';
  else if (a > 0.6 && a > e && a > s) mode = 'KALEIDOSCOPIC SYMMETRY';

  return {
    uFlowScale: isBaseline ? 1.0 : lerp(0.55, 1.45, clamp01(0.6*e + 0.4*ri)),
    uFluidThreshold: isBaseline ? 0.5 : lerp(0.60, 0.34, s),
    uComplexity: isBaseline ? 2.0 : lerp(1.0, 3.5, e),
    uViscosity: 0.1 + (s - 0.5) * 0.1,
    uJitter: isBaseline ? 0.0 : lerp(0.0, 1.2, ro*0.4),
    uDepth: isBaseline ? 0.0 : lerp(0.0, 12.0, a),
    uVortex: isBaseline ? 0.0 : lerp(0.0, 10.0, s),
    uShatter: isBaseline ? 0.0 : lerp(0.0, 1.2, ro),
    uTension: isBaseline ? 0.0 : lerp(0.0, 4.0, e),
    uCohesion: isBaseline ? 0.0 : lerp(0.0, 6.0, ri),
    uGeometric: isBaseline ? 0.0 : lerp(0.0, 1.0, e),
    uMirror: isBaseline ? 0.0 : lerp(0.0, 2.0, a),
    strokeBias: isBaseline ? 0.0 : (ri - 0.5) * 1.6,
    neuralMode: mode,
    grade: {
      hue: isBaseline ? 0 : lerp(-28, 24, (rv+1)/2),
      sat: isBaseline ? 1.0 : lerp(0.85, 1.55, clamp01(0.6*e+0.4*(1-ro))),
      bri: isBaseline ? 1.0 : lerp(0.92, 1.22, clamp01(0.7*a+0.3*s)),
      con: isBaseline ? 1.0 : lerp(0.92, 1.45, clamp01(0.7*ro+0.3*(1-s)))
    }
  };
}

function updateHUD(sig, p){
  if(qp('mode') !== 'hud') return;
  document.getElementById('hud').classList.add('active');
  document.getElementById('hud-id').innerHTML = `ID: ${sig?.id || 'LOCAL'}${p?.neuralMode ? `<br>MODE: ${p.neuralMode}` : ''}`;
  const vitalsEl = document.getElementById('hud-vitals');
  vitalsEl.innerHTML = ['satisfaction', 'expectation', 'reorientation', 'affirmation'].map(v => {
    const val = sig?.[v] ?? 0;
    return `<div>${v.slice(0,4)} <div class="hud-bar-bg"><div class="hud-bar-val" style="width:${val*100}%"></div></div> <span>${val.toFixed(2)}</span></div>`;
  }).join('');
}

function lerpParams(cur, tar, t) {
  const next = {};
  for (const k in tar) {
    if (typeof tar[k] === 'number') next[k] = lerp(cur?.[k] ?? tar[k], tar[k], t);
    else if (typeof tar[k] === 'object') { next[k] = {}; for (const s in tar[k]) next[k][s] = lerp(cur?.[k]?.[s] ?? tar[k][s], tar[k][s], t); }
  }
  return next;
}

function dampAlpha(dtStep, tau){
  // dtStep: seconds; tau: "time to settle" seconds
  const t = Math.max(1e-4, tau);
  const d = Math.max(0, dtStep);
  return 1 - Math.exp(-d / t);
}

function breathe(v, amt, speed, phase){
  // amt is a fractional modulation (0.05 = ±5%)
  const t = uniforms.uTime.value * speed + (phase || 0);
  return v * (1 + amt * Math.sin(t));
}

function mixParams(a, b, t){
  const out = {};
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const av = a?.[k];
    const bv = b?.[k];
    if (typeof av === 'number' && typeof bv === 'number') out[k] = lerp(av, bv, t);
    else if (av && bv && typeof av === 'object' && typeof bv === 'object' && !Array.isArray(av) && !Array.isArray(bv)) out[k] = mixParams(av, bv, t);
    else out[k] = (t < 0.5 ? (av ?? bv) : (bv ?? av));
  }
  return out;
}

function getMix(dt){
  const q = qp('mix');
  if (q !== null) return clamp01(parseFloat(q));
  // poetic default: asymmetric inhale/exhale with small holds
  const speed = parseFloat(qp('mixSpeed')) || 0.055; // cycles/sec
  const inhale = clamp01(parseFloat(qp('inhale')) || 0.55); // fraction of cycle
  const holdTop = clamp01(parseFloat(qp('holdTop')) || 0.08);
  const holdBottom = clamp01(parseFloat(qp('holdBottom')) || 0.06);

  const cyc = (dt * speed) % 1;
  const a = holdBottom;
  const b = a + inhale;
  const c = b + holdTop;
  const d = 1.0;

  const easeInOutSine = (t) => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(t));
  const easeOutCubic = (t) => 1 - Math.pow(1 - clamp01(t), 3);
  const easeInCubic = (t) => Math.pow(clamp01(t), 3);

  // bottom hold -> inhale (slow breath expanding chest) -> top hold -> exhale (reflection)
  if (cyc < a) return 0.0;
  if (cyc < b) return easeInOutSine((cyc - a) / Math.max(1e-6, (b - a)));
  if (cyc < c) return 1.0;
  // exhale: start gently, settle slowly
  const t = (cyc - c) / Math.max(1e-6, (d - c));
  return 1.0 - (0.65 * easeOutCubic(t) + 0.35 * easeInCubic(t));
}

function mapSignalMixed(sig, mix){
  // Some params (symmetry/geometric switches) can "pop" visually; ease them slower.
  const a = mapSignalMaster(sig);
  const b = mapSignalIndex(sig);
  const t = clamp01(mix);
  const ts = t * t * (3 - 2 * t); // smoothstep easing
  const slow = Math.pow(ts, 1.6);

  const out = mixParams(a, b, ts);
  // slow-blend the more discontinuous knobs
  out.uMirror = lerp(a.uMirror, b.uMirror, slow);
  out.uGeometric = lerp(a.uGeometric, b.uGeometric, slow);
  out.uTension = lerp(a.uTension, b.uTension, slow);
  out.uCohesion = lerp(a.uCohesion, b.uCohesion, slow);
  out.uShatter = lerp(a.uShatter, b.uShatter, slow);
  return out;
}

function applySignal(sig){
  TT.current = sig || null; if(!sig) return;
  const mix = getMix((performance.now() - start) / 1000);
  targetParams = mapSignalMixed(sig, mix);
  if (!currentParams) currentParams = JSON.parse(JSON.stringify(targetParams));
  window.__strokeBias = targetParams.strokeBias;
  updateHUD(sig, targetParams);
}

const start = performance.now();
let __lastT = start;
let __mix = 0.0;

// Loop variation state: each breath cycle gets a slightly different visual temperament.
// This avoids the "same inhale/exhale forever" feeling while keeping the morph smooth.
let __cycleIndex = -1;
let __loopVariant = {
  flow: 1.0,
  threshold: 0.0,
  complexity: 1.0,
  viscosity: 1.0,
  jitter: 1.0,
  depth: 1.0,
  vortex: 1.0,
  tension: 1.0,
  cohesion: 1.0,
  hue: 0.0,
  sat: 1.0,
  bri: 1.0,
  con: 1.0
};

function seededRand(n){
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
  return x - Math.floor(x);
}

function updateLoopVariant(dt){
  const speed = parseFloat(qp('mixSpeed')) || 0.055;
  const cycle = Math.floor(dt * speed);
  if (cycle === __cycleIndex) return;

  __cycleIndex = cycle;
  const r = (k) => seededRand(cycle * 17.0 + k);

  __loopVariant = {
    flow: lerp(0.88, 1.14, r(1)),
    threshold: lerp(-0.035, 0.035, r(2)),
    complexity: lerp(0.90, 1.18, r(3)),
    viscosity: lerp(0.82, 1.22, r(4)),
    jitter: lerp(0.80, 1.35, r(5)),
    depth: lerp(0.78, 1.30, r(6)),
    vortex: lerp(0.78, 1.26, r(7)),
    tension: lerp(0.86, 1.18, r(8)),
    cohesion: lerp(0.86, 1.18, r(9)),
    hue: lerp(-10.0, 10.0, r(10)),
    sat: lerp(0.94, 1.10, r(11)),
    bri: lerp(0.96, 1.08, r(12)),
    con: lerp(0.94, 1.12, r(13))
  };
}

function applyLoopVariant(p){
  if (!p) return p;
  const v = __loopVariant;
  const out = JSON.parse(JSON.stringify(p));

  out.uFlowScale = Math.max(0.2, out.uFlowScale * v.flow);
  out.uFluidThreshold = clamp01(out.uFluidThreshold + v.threshold);
  out.uComplexity = Math.max(0.2, out.uComplexity * v.complexity);
  out.uViscosity = Math.max(0.005, out.uViscosity * v.viscosity);
  out.uJitter = Math.max(0.0, out.uJitter * v.jitter);
  out.uDepth = Math.max(0.0, out.uDepth * v.depth);
  out.uVortex = Math.max(0.0, out.uVortex * v.vortex);
  out.uTension = Math.max(0.0, out.uTension * v.tension);
  out.uCohesion = Math.max(0.0, out.uCohesion * v.cohesion);

  if (out.grade) {
    out.grade.hue = out.grade.hue + v.hue;
    out.grade.sat = out.grade.sat * v.sat;
    out.grade.bri = out.grade.bri * v.bri;
    out.grade.con = out.grade.con * v.con;
  }

  return out;
}

function loop(){
  const now = performance.now();
  const dt = (now - start) / 1000;
  const dtStep = Math.min(0.1, (now - __lastT) / 1000);
  __lastT = now;
  uniforms.uTime.value = dt;

  // Cinematic cycle:
  // 0.00-0.25 original/restraint
  // 0.28-0.70 inner sonar suction through z
  // 0.56-0.96 outer sonar suction through z
  // 0.96-1.00 return to first frame
  // Self-looping nautilus: a seamless cosine breath that dwells in the opening
  // nautilus band — no burst/collapse, so the wrap has zero velocity and is
  // perfectly continuous. ?full=1 restores the original monotonic epic cycle.
  const zDur = parseFloat(qp('zDur')) || 48.0;
  let zCycle;
  if (qp('full') !== null) {
    zCycle = (dt % zDur) / zDur;
  } else {
    const breath = 0.5 - 0.5 * Math.cos(2 * Math.PI * ((dt % zDur) / zDur)); // 0..1..0
    zCycle = 0.243 + 0.017 * breath; // lock onto the clean open-ring nautilus, micro-breathe
  }
  uniforms.uZCycle.value = zCycle;
  const camPush = Math.sin(Math.PI * Math.min(1, Math.max(0, (zCycle - 0.24) / 0.72)));
  uniforms.uCameraPush.value = Math.max(0, camPush);
  uniforms.uOpeningRestraint.value = Math.min(1, Math.max(0, (zCycle - 0.10) / 0.32));
  updateLoopVariant(dt);
  // Smooth mix itself (prevents tiny pixel pops during rapid parameter landscape changes)
  const targetMix = getMix(dt);
  const mixTau = parseFloat(qp('mixTau')) || 2.4;
  __mix = __mix + (targetMix - __mix) * dampAlpha(dtStep, mixTau);
  const mix = __mix;
  // continuously re-evaluate target mapping so interpolation works live
  targetParams = applyLoopVariant(mapSignalMixed(TT.current, mix));
  if (!currentParams) currentParams = JSON.parse(JSON.stringify(targetParams));
  const tau = parseFloat(qp('morphTau')) || 1.35;
  const a = dampAlpha(dtStep, tau);
  if (qp('mode') === 'grid' && TT.signals) {
    renderer.autoClear = true; renderer.clear(); renderer.autoClear = false;
    uniforms.uGridMode.value = 1.0;
    for (let i = 0; i < 16; i++) {
      const sig = TT.signals[i % TT.signals.length], p = applyLoopVariant(mapSignalMixed(sig, mix));
      uniforms.uViewport.value.set((i%4)/4, Math.floor(i/4)/4, 0.25, 0.25);
      const b = (v, amt, spd) => breathe(v + 0.0001, amt, spd, i * 0.7);
      Object.keys(p).forEach(k => { if(uniforms[k]) uniforms[k].value = p[k]; });
      uniforms.uDepth.value = b(p.uDepth, 0.06, 0.35);
      uniforms.uVortex.value = b(p.uVortex, 0.08, 0.22);
      renderer.render(scene, camera);
    }
  } else {
    uniforms.uGridMode.value = 0.0; uniforms.uViewport.value.set(0,0,1,1); renderer.autoClear = true;
    currentParams = lerpParams(currentParams, targetParams, a);
    const p = currentParams, b = (v, amt, spd) => breathe(v + 0.0001, amt, spd, 0.0);
    Object.keys(p).forEach(k => { if(k.startsWith('u') && uniforms[k]) uniforms[k].value = p[k]; });
    uniforms.uDepth.value = b(p.uDepth, 0.06, 0.35);
    uniforms.uVortex.value = b(p.uVortex, 0.08, 0.22);
    if (window.__setGrade) window.__setGrade(p); updateHUD(TT.current, p); renderer.render(scene, camera);
  }
  requestAnimationFrame(loop);
}

// --- BOOT ---
if (qp('yarn') !== null) uniforms.uYarnShow.value = clamp01(parseFloat(qp('yarn'))); // 1=pure built layout, 0=pure flow
regenerate();
loop();

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>

<!-- gp: universal grade panel -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
</style>
<div id="gp-panel">
  <div class="gp-h">morphology</div>
  <label>complexity<span id="gp-v-complexity">1.50</span></label><input id="gp-complexity" type="range" min="1" max="4" step="0.01" value="1.5">
  <label>viscosity<span id="gp-v-viscosity">0.10</span></label><input id="gp-viscosity" type="range" min="0.01" max="0.5" step="0.001" value="0.1">
  <label>jitter<span id="gp-v-jitter">0.00</span></label><input id="gp-jitter" type="range" min="0" max="2" step="0.01" value="0">
  <label>depth<span id="gp-v-depth">0.00</span></label><input id="gp-depth" type="range" min="0" max="15" step="0.1" value="0">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label><input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>sat<span id="gp-v-sat">1.00</span></label><input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>bri<span id="gp-v-bri">1.00</span></label><input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>con<span id="gp-v-con">1.00</span></label><input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
</div>

<script>
(function(){
  var G={hue:0,sat:1,bri:1,con:1}, pid='2gl';
  function fmt(k,v){ return k==='hue'?Math.round(v)+'°':(+v).toFixed(2); }
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    document.querySelectorAll('canvas').forEach(c => c.style.filter=f);
  }
  window.__setGrade = function(cfg){
    const g = cfg.grade || {};
    if(g.hue!==undefined) G.hue=g.hue; if(g.sat!==undefined) G.sat=g.sat; if(g.bri!==undefined) G.bri=g.bri; if(g.con!==undefined) G.con=g.con;
    ['hue','sat','bri','con'].forEach(k => { 
      const el=document.getElementById('gp-'+k); if(el){el.value=G[k]; document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]);} 
    });
    applyFilter();
  };
  ['hue','sat','bri','con'].forEach(k => {
    document.getElementById('gp-'+k).addEventListener('input', e => { G[k]=+e.target.value; document.getElementById('gp-v-'+k).textContent=fmt(k,G[k]); applyFilter(); });
  });
})();
</script>
</body>
