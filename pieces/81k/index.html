<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>81k · monumental void · Kapoor pigment vessel</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#050508; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">81k</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*
  Anish Kapoor — monumental.
  The parent's calligraphic ink ribbon is opened, swelled, turned inside-out
  into a massive concave vessel of raw blood-red pigment. Differential growth
  forms the organic surface; the interior darkens to absolute black — the void
  that Kapoor keeps returning to. Scale overwhelms the frame.

  Technique: concentric differential-growth rings arranged on a paraboloid
  surface. Each ring grows independently, splitting edges, repelling neighbors.
  Rendered as pigment-dust point particles. Color: cadmium-blood red at the
  rim, descending into total absorption at the nadir.
*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 14, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 1, 0);

/* ─── Bowl profile ─── */
// Paraboloid: y = -depth + k·r², open at top, deep void center
const NUM_RINGS = 28;
const DEPTH = 5;
const RIM_R = 9;
const rings = [];

for (let ri = 0; ri < NUM_RINGS; ri++) {
  const t = ri / (NUM_RINGS - 1);           // 0 = nadir, 1 = rim
  const y = -DEPTH + t * t * (DEPTH + 4);   // parabolic rise
  const radius = 0.4 + t * t * (RIM_R - 0.4);
  const nv = Math.floor(14 + t * 40);
  const verts = [];
  for (let i = 0; i < nv; i++) {
    const th = (i / nv) * Math.PI * 2;
    verts.push({
      x: Math.cos(th) * radius + (Math.random() - 0.5) * 0.08,
      y: y + (Math.random() - 0.5) * 0.12,
      z: Math.sin(th) * radius + (Math.random() - 0.5) * 0.08,
      age: 0
    });
  }
  rings.push({ verts, maxVerts: Math.floor(nv * 5), t });
}

/* ─── Differential growth per ring ─── */
const ATTRACT  = 0.035;
const REPEL_R  = 0.48;
const REPEL_S  = 0.09;
const MAX_EDGE = 0.38;

function stepRing(ring) {
  const v = ring.verts, n = v.length;
  if (n < 3) return;
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    for (let j = i + 1; j < n; j++) {
      const ex = v[i].x - v[j].x, ey = v[i].y - v[j].y, ez = v[i].z - v[j].z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_S * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
      dx[j] -= ex * f; dy[j] -= ey * f; dz[j] -= ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = v[(i - 1 + n) % n], b = v[(i + 1) % n], c = v[i];
    dx[i] += (a.x + b.x - 2 * c.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * c.y) * ATTRACT * 0.25;
    dz[i] += (a.z + b.z - 2 * c.z) * ATTRACT;
  }
  for (let i = 0; i < n; i++) {
    v[i].x += dx[i] + (Math.random() - 0.5) * 0.0015;
    v[i].y += dy[i] + (Math.random() - 0.5) * 0.0008;
    v[i].z += dz[i] + (Math.random() - 0.5) * 0.0015;
    v[i].age += 0.001;
  }
  if (n >= ring.maxVerts) return;
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = v[i], b = v[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_EDGE * MAX_EDGE && grown.length + (n - i) < ring.maxVerts) {
      grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5, z: (a.z + b.z) * 0.5, age: 0 });
    }
  }
  ring.verts = grown;
}

// Warm up — let the growth fill out
for (let s = 0; s < 500; s++) {
  for (const r of rings) stepRing(r);
}

/* ─── Point-cloud pigment renderer ─── */
const MAX_PTS = 80000;
const pos  = new Float32Array(MAX_PTS * 3);
const col  = new Float32Array(MAX_PTS * 3);
const sz   = new Float32Array(MAX_PTS);

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3));
geo.setAttribute('aSize',    new THREE.BufferAttribute(sz, 1));

const mat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    attribute vec3 aColor;
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      vCol = aColor;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = aSize * (280.0 / dist);
      gl_Position = projectionMatrix * mv;
      // fade distant particles slightly
      vAlpha = smoothstep(120.0, 10.0, dist);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      // soft pigment grain edge
      float a = smoothstep(0.5, 0.12, d) * vAlpha;
      // slight warmth bloom at center
      vec3 c = vCol + 0.06 * smoothstep(0.3, 0.0, d);
      gl_FragColor = vec4(c, a * 0.92);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending
});

const pointCloud = new THREE.Points(geo, mat);
scene.add(pointCloud);

/* ─── Fill particles between rings for surface solidity ─── */
function fillParticles() {
  let idx = 0;
  for (let ri = 0; ri < rings.length; ri++) {
    const ring = rings[ri];
    const t = ring.t;                       // 0 nadir → 1 rim
    for (const v of ring.verts) {
      if (idx >= MAX_PTS) break;

      pos[idx * 3]     = v.x;
      pos[idx * 3 + 1] = v.y;
      pos[idx * 3 + 2] = v.z;

      // Kapoor blood-red at rim, descending through deep crimson to pure void black
      // Uses cube of t to make most of the interior very dark
      const bright = t * t;                 // 0 → 1 quadratic
      const r = 0.08 + bright * 0.74;      // 0.08 → 0.82
      const g = 0.005 + bright * 0.035;    // near-0 → 0.04
      const b = 0.01 + bright * 0.025;     // near-0 → 0.035
      col[idx * 3]     = r;
      col[idx * 3 + 1] = g;
      col[idx * 3 + 2] = b;

      sz[idx] = 2.0 + t * 3.5;
      idx++;
    }

    // Interpolated particles between this ring and the next
    if (ri < rings.length - 1) {
      const next = rings[ri + 1];
      const nA = ring.verts.length, nB = next.verts.length;
      const count = Math.min(nA, nB, 30);
      for (let i = 0; i < count; i++) {
        if (idx >= MAX_PTS) break;
        const a = ring.verts[Math.floor(i / count * nA)];
        const bv = next.verts[Math.floor(i / count * nB)];
        const mix = 0.3 + Math.random() * 0.4;
        pos[idx * 3]     = a.x + (bv.x - a.x) * mix;
        pos[idx * 3 + 1] = a.y + (bv.y - a.y) * mix;
        pos[idx * 3 + 2] = a.z + (bv.z - a.z) * mix;
        const tMid = t + (next.t - t) * mix;
        const bri = tMid * tMid;
        col[idx * 3]     = 0.08 + bri * 0.74;
        col[idx * 3 + 1] = 0.005 + bri * 0.035;
        col[idx * 3 + 2] = 0.01 + bri * 0.025;
        sz[idx] = 1.8 + tMid * 2.5;
        idx++;
      }
    }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.aColor.needsUpdate = true;
  geo.attributes.aSize.needsUpdate = true;
  geo.setDrawRange(0, idx);
}

/* ─── Ambient light pulse — subtle brightness shift ─── */
let time = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ─── Render loop ─── */
function loop() {
  time += 0.004;

  // Grow 2 steps per frame
  for (let s = 0; s < 2; s++) {
    for (const r of rings) stepRing(r);
  }

  fillParticles();

  // Camera: gentle auto-orbit, looking into the void
  const orbitR = 24 + Math.sin(time * 0.3) * 2;
  const baseAngle = time * 0.08;

  // Only auto-orbit if user isn't dragging
  if (!controls.enabled || !controls._isDragging) {
    camera.position.x += (Math.sin(baseAngle) * orbitR - camera.position.x) * 0.008;
    camera.position.z += (Math.cos(baseAngle) * orbitR - camera.position.z) * 0.008;
    camera.position.y += (12 + Math.sin(time * 0.2) * 2 - camera.position.y) * 0.008;
  }

  // Track centroid
  let cx = 0, cy = 0, cz = 0, cnt = 0;
  for (const r of rings) {
    for (const v of r.verts) { cx += v.x; cy += v.y; cz += v.z; cnt++; }
  }
  if (cnt > 0) { cx /= cnt; cy /= cnt; cz /= cnt; }
  controls.target.x += (cx - controls.target.x) * 0.02;
  controls.target.y += (cy - controls.target.y) * 0.02;
  controls.target.z += (cz - controls.target.z) * 0.02;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
