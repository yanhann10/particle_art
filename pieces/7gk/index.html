<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Chiharu Shiota thread installation ──
   Differential-growth ring generates organic anchor points in space.
   Thousands of crimson threads radiate from each anchor to 4 architectural
   foci — suspended in dark void like a memory palace of tension and return.
   Each thread is a single straight segment. Additive blending builds
   gauzy luminous density where threads overlap. */

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 7, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0608, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 5, 0);

// ── differential growth (inherited from ajo/5gm lineage) ──
const MAX_VERTS = 900;
const ATTRACT = 0.06, REPEL_R = 0.55, REPEL_STR = 0.14;
const NOISE = 0.003, PRESSURE = 0.003, RISE = 0.0045, MAX_D = 0.42;

const verts = [];
for (let i = 0; i < 14; i++) {
  const th = i / 14 * Math.PI * 2;
  const r = 1.6 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th) * r, y: 0, z: Math.sin(th) * r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid() {
  grid.clear();
  for (let i = 0; i < verts.length; i++) {
    const v = verts[i];
    const k = Math.floor(v.x / CELL) + ',' + Math.floor(v.y / CELL) + ',' + Math.floor(v.z / CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function getNeighbors(v) {
  const cx = Math.floor(v.x / CELL), cy = Math.floor(v.y / CELL), cz = Math.floor(v.z / CELL);
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
    const arr = grid.get((cx + dx) + ',' + (cy + dy) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step() {
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    for (const j of getNeighbors(v)) {
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex * ex + ey * ey + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f; dy[i] += ey * f; dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const a = verts[(i - 1 + n) % n], b = verts[(i + 1) % n], v = verts[i];
    dx[i] += (a.x + b.x - 2 * v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2 * v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2 * v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dy[i] += (oy / d) * PRESSURE * 0.4;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random() - 0.5) * NOISE;
    verts[i].y += dy[i] + (Math.random() - 0.5) * NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    verts[i].age += 0.0014;
  }
  const grown = [];
  for (let i = 0; i < n; i++) {
    const a = verts[i], b = verts[(i + 1) % n];
    grown.push(a);
    const ex = b.x - a.x, ey = b.y - a.y, ez = b.z - a.z;
    if (ex * ex + ey * ey + ez * ez > MAX_D * MAX_D && verts.length + grown.length < MAX_VERTS) {
      grown.push({ x: (a.x + b.x) * 0.5, y: (a.y + b.y) * 0.5 - 0.05, z: (a.z + b.z) * 0.5, age: Math.max(a.age, b.age) * 0.5 });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-grow the form
for (let s = 0; s < 1200; s++) step();

let paused = false;
addEventListener('click', () => { paused = !paused; });

// ── architectural foci — 4 anchor points threads converge upon ──
// Suspended in vertical column: a dress-like silhouette of convergence
const foci = [
  new THREE.Vector3(0, 8.5, 0),     // crown — top of the form
  new THREE.Vector3(-1.2, 3.5, 0.8), // left shoulder
  new THREE.Vector3(1.2, 3.5, -0.8), // right shoulder
  new THREE.Vector3(0, 0.3, 0),      // floor anchor — grounding
];

// visualize foci as tiny dim spheres
const fociGeo = new THREE.SphereGeometry(0.06, 8, 8);
const fociMat = new THREE.MeshBasicMaterial({ color: 0x9c1f1f, transparent: true, opacity: 0.3 });
for (const f of foci) {
  const m = new THREE.Mesh(fociGeo, fociMat);
  m.position.copy(f);
  scene.add(m);
}

// ── thread system ──
// Each growth vertex connects to 1-3 foci (chosen by proximity + randomness)
// Plus vertex-to-vertex threads for nearby anchors (local filaments)
// Total target: ~12000 segments

const threadMat = new THREE.LineBasicMaterial({
  color: 0x9c1f1f,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

// secondary thread color — slightly lighter for depth variation
const threadMat2 = new THREE.LineBasicMaterial({
  color: 0x7a1818,
  transparent: true,
  opacity: 0.05,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});

let threadGroup = new THREE.Group();
scene.add(threadGroup);

// pointer for subtle sway
const pointer = new THREE.Vector2(0, 0);
addEventListener('pointermove', e => {
  pointer.x = (e.clientX / innerWidth - 0.5) * 2;
  pointer.y = (e.clientY / innerHeight - 0.5) * 2;
});

// ── suspension threads from ceiling ──
const ceilY = 16;
const suspGeo = new THREE.BufferGeometry();
const suspPos = new Float32Array(foci.length * 2 * 3);
for (let i = 0; i < foci.length; i++) {
  const f = foci[i];
  suspPos[i * 6] = f.x + (Math.random() - 0.5) * 0.3;
  suspPos[i * 6 + 1] = ceilY;
  suspPos[i * 6 + 2] = f.z + (Math.random() - 0.5) * 0.3;
  suspPos[i * 6 + 3] = f.x;
  suspPos[i * 6 + 4] = f.y;
  suspPos[i * 6 + 5] = f.z;
}
suspGeo.setAttribute('position', new THREE.BufferAttribute(suspPos, 3));
const suspMat = new THREE.LineBasicMaterial({
  color: 0x9c1f1f, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.LineSegments(suspGeo, suspMat));

function buildThreads(time) {
  // clear old
  while (threadGroup.children.length > 0) {
    const c = threadGroup.children[0];
    c.geometry.dispose();
    threadGroup.remove(c);
  }

  const n = verts.length;
  if (n < 10) return;

  // sway offset from pointer + time
  const swayX = Math.sin(time * 0.3) * 0.04 + pointer.x * 0.06;
  const swayZ = Math.cos(time * 0.25) * 0.03 + pointer.y * 0.04;

  // ── converging threads: each vertex → 2 foci ──
  const convSegments = [];
  for (let i = 0; i < n; i++) {
    const v = verts[i];
    // per-vertex sway varies with height
    const hFrac = Math.max(0, v.y) / 12;
    const sx = swayX * hFrac * (0.8 + 0.4 * Math.sin(i * 0.7));
    const sz = swayZ * hFrac * (0.8 + 0.4 * Math.cos(i * 0.5));
    const vx = v.x + sx, vy = v.y, vz = v.z + sz;

    // pick 2 foci: nearest + one random
    let bestD = Infinity, bestIdx = 0;
    for (let f = 0; f < foci.length; f++) {
      const d = Math.hypot(vx - foci[f].x, vy - foci[f].y, vz - foci[f].z);
      if (d < bestD) { bestD = d; bestIdx = f; }
    }
    const secondIdx = (bestIdx + 1 + Math.floor(Math.random() * (foci.length - 1))) % foci.length;

    for (const fi of [bestIdx, secondIdx]) {
      const fc = foci[fi];
      // slight jitter at the focus end so threads don't perfectly converge
      const jit = 0.08;
      convSegments.push(
        vx, vy, vz,
        fc.x + (Math.random() - 0.5) * jit + sx * 0.2,
        fc.y + (Math.random() - 0.5) * jit,
        fc.z + (Math.random() - 0.5) * jit + sz * 0.2
      );
    }
  }

  // ── local filament threads: vertex-to-nearby-vertex ──
  const localSegments = [];
  const localThresh = 1.8;
  const localThresh2 = localThresh * localThresh;
  // sample pairs to keep count manageable
  const maxLocal = 4000;
  let localCount = 0;
  for (let i = 0; i < n && localCount < maxLocal; i += 2) {
    const v = verts[i];
    for (let j = i + 1; j < n && localCount < maxLocal; j += 3) {
      const u = verts[j];
      const dx = v.x - u.x, dy = v.y - u.y, dz = v.z - u.z;
      if (dx * dx + dy * dy + dz * dz < localThresh2) {
        const hFracA = Math.max(0, v.y) / 12;
        const hFracB = Math.max(0, u.y) / 12;
        localSegments.push(
          v.x + swayX * hFracA, v.y, v.z + swayZ * hFracA,
          u.x + swayX * hFracB, u.y, u.z + swayZ * hFracB
        );
        localCount++;
      }
    }
  }

  // ── ceiling drape threads: some vertices to ceiling ──
  const drapeSegments = [];
  for (let i = 0; i < n; i += 5) {
    const v = verts[i];
    if (v.y > 4 && Math.random() < 0.6) {
      const hFrac = v.y / 12;
      drapeSegments.push(
        v.x + swayX * hFrac, v.y, v.z + swayZ * hFrac,
        v.x + (Math.random() - 0.5) * 1.5 + swayX * 1.2,
        ceilY,
        v.z + (Math.random() - 0.5) * 1.5 + swayZ * 1.2
      );
    }
  }

  // build geometries
  if (convSegments.length > 0) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(convSegments, 3));
    threadGroup.add(new THREE.LineSegments(g, threadMat));
  }
  if (localSegments.length > 0) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(localSegments, 3));
    threadGroup.add(new THREE.LineSegments(g, threadMat2));
  }
  if (drapeSegments.length > 0) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(drapeSegments, 3));
    threadGroup.add(new THREE.LineSegments(g, threadMat));
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastBuild = 0;
function loop() {
  const t = (performance.now() - start) / 1000;

  if (!paused) {
    for (let s = 0; s < 3; s++) step();
  }

  // rebuild threads every 3 frames for performance
  if (t - lastBuild > 0.05) {
    buildThreads(t);
    lastBuild = t;
  }

  // camera tracks centroid
  let yMean = 0, xMean = 0, zMean = 0;
  for (const v of verts) { xMean += v.x; yMean += v.y; zMean += v.z; }
  const nn = Math.max(verts.length, 1);
  xMean /= nn; yMean /= nn; zMean /= nn;
  const targetY = Math.max(yMean, 3.0);
  controls.target.x += (xMean - controls.target.x) * 0.02;
  controls.target.y += (targetY - controls.target.y) * 0.03;
  controls.target.z += (zMean - controls.target.z) * 0.02;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
