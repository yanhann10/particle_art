<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>cinerary · Anselm Kiefer ash vessel</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        letter-spacing:0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
</style>

<body>
<div class="id">zge</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Chain from f4c (Boltanski umbra) through CINERARY:
   Anselm Kiefer's ash-and-lead installations — the vascular
   tower calcifies into a cinerary vessel, an urn holding its
   own remains. The shadow field becomes scattered cremains
   settling on an invisible floor. Palette shifts from umbral
   brown to bone-white and charcoal. The penumbral amber glow
   becomes the last ember heat fading in ash. Threads become
   smoke wisps rising from the vessel's mouth. ── */

const BG = new THREE.Color(0x0a0908);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.014);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(10, 9, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const keyLight = new THREE.DirectionalLight(0xd0ccc4, 0.2);
keyLight.position.set(4, 14, 6);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0x0e0c0a, 0.45));

const emberLight = new THREE.PointLight(0xb07040, 0.35, 30);
emberLight.position.set(-2, 1, -5);
scene.add(emberLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.03;
controls.target.set(0, 5, 0);

// ─── differential growth core (inherited) ───
const MAX_VERTS = 1200;
const ATTRACT = 0.05, REPEL_R = 0.50, REPEL_STR = 0.11;
const NOISE_S = 0.002, PRESSURE = 0.0022, RISE = 0.004, MAX_D = 0.40;

const verts = [];
for (let i = 0; i < 16; i++){
  const th = i/16 * Math.PI*2;
  const r = 1.3 + (Math.random()-0.5)*0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i];
    const k = Math.floor(v.x/CELL)+','+Math.floor(v.y/CELL)+','+Math.floor(v.z/CELL);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr) for(const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if(paused) return;
  const n=verts.length;
  if(n>=MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of gridNeighbors(v)){
      if(j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx_=0,cy_=0,cz_=0;
  for(let i=0;i<n;i++){cx_+=verts[i].x;cy_+=verts[i].y;cz_+=verts[i].z;}
  cx_/=n; cy_/=n; cz_/=n;
  // cinerary morph: constrict horizontally at top to form urn neck
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx_, oy=verts[i].y-cy_, oz=verts[i].z-cz_;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    const hFrac = Math.max(0, verts[i].y / 12.0);
    // urn shape: belly expands, neck constricts
    const urnConstrict = hFrac > 0.6 ? -0.003 * (hFrac - 0.6) : 0.001;
    dx[i]+=(ox/d)*(PRESSURE + urnConstrict);
    dy[i]+=(oy/d)*PRESSURE*0.4;
    dz[i]+=(oz/d)*(PRESSURE + urnConstrict);
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE_S*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE_S;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D && verts.length+grown.length<MAX_VERTS){
      grown.push({ x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5-0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age,b.age)*0.5 });
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}
for(let s=0;s<600;s++) step();
addEventListener('click', ()=>{ paused=!paused; });

function absenceAt(tt, time){
  const v1 = Math.sin(tt*5.3 + time*0.04)*0.5+0.5;
  const v2 = Math.sin(tt*8.7 + time*0.025+1.7)*0.5+0.5;
  const v3 = Math.sin(tt*3.1 + time*0.06+3.1)*0.5+0.5;
  return Math.pow(v1*v2*0.7 + v3*0.3, 0.8);
}

// ─── form particles: ashen bone-white, charcoal — calcified vessel ───
const FORM_P = 16000;
const fGeo = new THREE.BufferGeometry();
const fPos = new Float32Array(FORM_P*3);
const fAlpha = new Float32Array(FORM_P);
const fSize = new Float32Array(FORM_P);
const fEdge = new Float32Array(FORM_P);
fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
fGeo.setAttribute('alpha', new THREE.BufferAttribute(fAlpha, 1));
fGeo.setAttribute('size', new THREE.BufferAttribute(fSize, 1));
fGeo.setAttribute('edge', new THREE.BufferAttribute(fEdge, 1));

const fMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uBone: { value: new THREE.Color(0x9e958a) },
    uChar: { value: new THREE.Color(0x3a3632) },
    uEmber: { value: new THREE.Color(0x8a5030) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    attribute float size;
    attribute float edge;
    varying float vAlpha, vFog, vEdge;
    void main(){
      vAlpha = alpha;
      vEdge = edge;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.014*0.014*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, size * (10.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uBone, uChar, uEmber, uFogColor;
    varying float vAlpha, vFog, vEdge;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float soft = smoothstep(0.5, 0.12, d);
      vec3 col = mix(uChar, uBone, vEdge*0.6 + 0.2);
      col = mix(col, uEmber, max(0.0, vEdge - 0.5) * 0.5);
      col = mix(col, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `
});
scene.add(new THREE.Points(fGeo, fMat));

// ─── cremains: falling ash particles that settle on invisible ground plane ───
const CREMAINS = 8000;
const cGeo = new THREE.BufferGeometry();
const cPos = new Float32Array(CREMAINS*3);
const cAlpha = new Float32Array(CREMAINS);
const cSize = new Float32Array(CREMAINS);
const cVel = new Float32Array(CREMAINS*3);
const cSettled = new Uint8Array(CREMAINS);
cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
cGeo.setAttribute('alpha', new THREE.BufferAttribute(cAlpha, 1));
cGeo.setAttribute('size', new THREE.BufferAttribute(cSize, 1));

for(let i=0;i<CREMAINS;i++){
  const ang = Math.random()*Math.PI*2;
  const rad = 0.5 + Math.random()*3.0;
  cPos[i*3]   = Math.cos(ang)*rad + (Math.random()-0.5)*0.5;
  cPos[i*3+1] = Math.random()*14;
  cPos[i*3+2] = Math.sin(ang)*rad + (Math.random()-0.5)*0.5;
  cVel[i*3]   = (Math.random()-0.5)*0.003;
  cVel[i*3+1] = -0.004 - Math.random()*0.008;
  cVel[i*3+2] = (Math.random()-0.5)*0.003;
  cAlpha[i] = 0.06 + Math.random()*0.12;
  cSize[i] = 1.5 + Math.random()*2.5;
  cSettled[i] = 0;
}

const cMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uAsh: { value: new THREE.Color(0x8a8278) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    attribute float size;
    varying float vAlpha, vFog;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.014*0.014*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, size * (9.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uAsh, uFogColor;
    varying float vAlpha, vFog;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      float soft = smoothstep(0.5, 0.08, d);
      vec3 col = mix(uAsh, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * soft);
    }
  `
});
scene.add(new THREE.Points(cGeo, cMat));

// ─── ambient ash (inherited, now heavier) ───
const ASH = 2500;
const aGeo = new THREE.BufferGeometry();
const aPos = new Float32Array(ASH*3);
const aAlpha = new Float32Array(ASH);
const aDrift = new Float32Array(ASH*3);
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('alpha', new THREE.BufferAttribute(aAlpha, 1));
for(let i=0;i<ASH;i++){
  aPos[i*3]=(Math.random()-0.5)*18;
  aPos[i*3+1]=Math.random()*22;
  aPos[i*3+2]=(Math.random()-0.5)*18;
  aDrift[i*3]=(Math.random()-0.5)*0.0008;
  aDrift[i*3+1]=-0.002-Math.random()*0.003;
  aDrift[i*3+2]=(Math.random()-0.5)*0.0008;
  aAlpha[i]=Math.random()*0.07;
}
const aMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uColor: { value: new THREE.Color(0x7a7268) },
    uFogColor: { value: BG.clone() }
  },
  vertexShader: `
    attribute float alpha;
    varying float vAlpha, vFog;
    void main(){
      vAlpha = alpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float fd = length(mv.xyz);
      vFog = 1.0 - exp(-0.014*0.014*fd*fd);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, 2.0 * (8.0 / -mv.z));
    }
  `,
  fragmentShader: `
    uniform vec3 uColor, uFogColor;
    varying float vAlpha, vFog;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if(d > 0.5) discard;
      vec3 col = mix(uColor, uFogColor, vFog);
      gl_FragColor = vec4(col, vAlpha * smoothstep(0.5, 0.1, d));
    }
  `
});
scene.add(new THREE.Points(aGeo, aMat));

// ─── smoke wisps: threads become rising smoke from vessel mouth ───
const THREAD_N = 24, THREAD_SEG = 18;
const threadGroup = new THREE.Group();
scene.add(threadGroup);
const threadMat = new THREE.LineBasicMaterial({
  color: 0x605850, transparent: true, opacity: 0.12
});
let threadsBuilt = false;
const threadSeeds = [];
for(let i=0;i<THREAD_N;i++){
  threadSeeds.push({
    t: (i+0.5)/THREAD_N,
    len: 1.2+Math.random()*3.5,
    sway: (Math.random()-0.5)*0.4,
    phase: Math.random()*Math.PI*2
  });
}

function buildThreads(curve, yMin, yMax){
  while(threadGroup.children.length){
    const c=threadGroup.children[0]; c.geometry.dispose(); threadGroup.remove(c);
  }
  for(const s of threadSeeds){
    const p = curve.getPointAt(s.t);
    if(p.y < yMin+(yMax-yMin)*0.6) continue; // only from upper part — smoke rises
    const pts=[];
    for(let j=0;j<=THREAD_SEG;j++){
      const f=j/THREAD_SEG;
      pts.push(new THREE.Vector3(
        p.x + s.sway*f*f + Math.sin(f*5+s.phase)*0.06*f,
        p.y + s.len*f, // rise upward (smoke)
        p.z + Math.cos(f*4+s.phase)*0.05*f
      ));
    }
    threadGroup.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts), threadMat
    ));
  }
  threadsBuilt = true;
}

const innerLight = new THREE.PointLight(0x704828, 0.12, 10);
innerLight.position.set(0, 5, 0);
scene.add(innerLight);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastThreadT = -99;
const up = new THREE.Vector3(0,1,0);

function loop(){
  const now = performance.now();
  const t = (now-start)/1000;

  step();

  // ember light pulses like dying coals
  emberLight.position.set(
    -2 + Math.sin(t*0.04)*1.5,
    1 + Math.sin(t*0.03)*0.3,
    -5 + Math.cos(t*0.035)*1.0
  );
  emberLight.intensity = 0.25 + 0.12*Math.sin(t*2.1)*Math.sin(t*3.7);

  if(verts.length > 8){
    let yMin=Infinity, yMax=-Infinity, cxV=0, cyV=0, czV=0;
    for(const v of verts){
      if(v.y<yMin) yMin=v.y; if(v.y>yMax) yMax=v.y;
      cxV+=v.x; cyV+=v.y; czV+=v.z;
    }
    cxV/=verts.length; cyV/=verts.length; czV/=verts.length;
    const yRange = Math.max(yMax-yMin, 0.1);

    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    if(t-lastThreadT > 5){ buildThreads(curve, yMin, yMax); lastThreadT=t; }

    // populate form particles — ashen calcified vessel
    const SAMPLES = Math.min(600, verts.length*2);
    const RING = Math.max(2, Math.floor(FORM_P / SAMPLES));
    let pi = 0;

    for(let i=0; i<SAMPLES && pi<FORM_P; i++){
      const tt = i/SAMPLES;
      const p = curve.getPointAt(tt);
      const hFrac = Math.max(0, Math.min(1, (p.y-yMin)/yRange));

      // urn profile: wider at belly (hFrac~0.4), narrower at base and top
      const urnProfile = 1.0 + 0.25*Math.sin(hFrac*Math.PI) - 0.15*hFrac*hFrac;
      let r = 0.32 * urnProfile * (1.0 - hFrac*0.45);
      const node = Math.sin(tt*22.0)*0.5+0.5;
      r *= 1.0 + 0.08*Math.pow(node, 6);

      const tangent = curve.getTangentAt(tt).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if(normal.lengthSq()<0.001) normal.set(1,0,0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      const absence = absenceAt(tt, t);
      // cinerary: absence becomes calcification — cracks revealing bone beneath char
      const calcify = Math.pow(absence, 1.3);
      const crackEdge = absence > 0.25 && absence < 0.65 ?
        1.0 - Math.abs(absence - 0.45) * 5.0 : 0.0;

      for(let j=0; j<RING && pi<FORM_P; j++){
        const ang = (j/RING)*Math.PI*2 + (Math.random()-0.5)*0.4;
        const rr = r * (0.6 + Math.random()*0.65);
        const scatter = 0.015*(1.0 + calcify*2.0);

        const px = p.x + normal.x*Math.cos(ang)*rr + binormal.x*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;
        const py = p.y + normal.y*Math.cos(ang)*rr + binormal.y*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;
        const pz = p.z + normal.z*Math.cos(ang)*rr + binormal.z*Math.sin(ang)*rr + (Math.random()-0.5)*scatter;

        fPos[pi*3]=px; fPos[pi*3+1]=py; fPos[pi*3+2]=pz;

        const baseA = 0.22 + 0.38*(1.0 - calcify*0.6);
        const topFade = hFrac > 0.85 ? 1.0-(hFrac-0.85)/0.15 : 1.0;
        fAlpha[pi] = baseA * topFade;
        fEdge[pi] = Math.max(0, crackEdge + calcify*0.3);
        fSize[pi] = 2.0 + Math.random()*2.2;
        pi++;
      }
    }
    for(;pi<FORM_P;pi++){ fAlpha[pi]=0; fEdge[pi]=0; }
    fGeo.attributes.position.needsUpdate = true;
    fGeo.attributes.alpha.needsUpdate = true;
    fGeo.attributes.size.needsUpdate = true;
    fGeo.attributes.edge.needsUpdate = true;

    // ─── cremains: shed from the form, settle on ground ───
    for(let i=0;i<CREMAINS;i++){
      if(cSettled[i]) continue;
      cPos[i*3]   += cVel[i*3] + Math.sin(t*0.2+i*0.31)*0.0003;
      cPos[i*3+1] += cVel[i*3+1];
      cPos[i*3+2] += cVel[i*3+2] + Math.cos(t*0.18+i*0.47)*0.0003;
      // settle on ground
      if(cPos[i*3+1] < -0.5){
        cPos[i*3+1] = -0.5 + Math.random()*0.1;
        cSettled[i] = 1;
        cAlpha[i] *= 0.6;
        cVel[i*3+1] = 0;
      }
      // respawn from form top occasionally
      if(cPos[i*3+1] < -1 || (cSettled[i] && Math.random()<0.0001)){
        const spawnT = Math.random();
        const sp = curve.getPointAt(spawnT);
        cPos[i*3]   = sp.x + (Math.random()-0.5)*0.5;
        cPos[i*3+1] = sp.y + (Math.random()-0.5)*0.3;
        cPos[i*3+2] = sp.z + (Math.random()-0.5)*0.5;
        cVel[i*3]   = (Math.random()-0.5)*0.004;
        cVel[i*3+1] = -0.003 - Math.random()*0.006;
        cVel[i*3+2] = (Math.random()-0.5)*0.004;
        cAlpha[i] = 0.05 + Math.random()*0.1;
        cSettled[i] = 0;
      }
    }
    cGeo.attributes.position.needsUpdate = true;
    cGeo.attributes.alpha.needsUpdate = true;

    innerLight.position.set(cxV, cyV, czV);
    innerLight.intensity = 0.08 + 0.04*Math.sin(t*0.15);

    // camera tracks centroid
    const tgtY = Math.max(cyV, 2.0);
    controls.target.x += (cxV - controls.target.x)*0.015;
    controls.target.y += (tgtY - controls.target.y)*0.025;
    controls.target.z += (czV - controls.target.z)*0.015;
    camera.position.y += (tgtY+3.0 - camera.position.y)*0.018;
  }

  // ambient ash drift
  for(let i=0;i<ASH;i++){
    aPos[i*3]   += aDrift[i*3] + Math.sin(t*0.3+i*0.37)*0.00015;
    aPos[i*3+1] += aDrift[i*3+1];
    aPos[i*3+2] += aDrift[i*3+2] + Math.cos(t*0.25+i*0.53)*0.00015;
    if(aPos[i*3+1]<-1){
      aPos[i*3]=(Math.random()-0.5)*18;
      aPos[i*3+1]=20+Math.random()*4;
      aPos[i*3+2]=(Math.random()-0.5)*18;
    }
    aAlpha[i] = Math.min(0.07, Math.max(0, aPos[i*3+1]*0.004));
  }
  aGeo.attributes.position.needsUpdate = true;
  aGeo.attributes.alpha.needsUpdate = true;

  // smoke wisps sway and rise
  if(threadsBuilt){
    for(const child of threadGroup.children){
      const arr = child.geometry.attributes.position.array;
      for(let j=3; j<arr.length; j+=3){
        const frac = j / arr.length;
        arr[j]   += Math.sin(t*0.12 + frac*5)*0.00015;
        arr[j+1] += 0.00003; // slow rise
        arr[j+2] += Math.cos(t*0.1 + frac*4)*0.0001;
      }
      child.geometry.attributes.position.needsUpdate = true;
    }
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
