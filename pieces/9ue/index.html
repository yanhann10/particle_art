<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9ue · cumulus · border drift</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1612; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">9ue · cumulus · border drift</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// 65k particles advected by curl-noise eastward drift. A hard invisible latitude
// (representing the Mexico-US border) tints particles red as they cross.
// Cloud-field opacity varies with altitude; camera slowly tracks the mass centroid.

const W = 256, H = 256;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x1a1612, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

function makeInitTexture(){
  const init = new Float32Array(N * 4);
  for (let i = 0; i < N; i++){
    // spawn in western hemisphere, distributed vertically and in depth
    const x = -8.0 + Math.random() * 4.0;
    const y = -1.5 + Math.random() * 3.0;
    const z = -3.0 + Math.random() * 6.0;
    init[i*4]   = x;
    init[i*4+1] = y;
    init[i*4+2] = z;
    init[i*4+3] = Math.random(); // age
  }
  const t = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
  t.needsUpdate = true;
  return t;
}

const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: makeInitTexture() } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));

renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(rtB); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// simulation: curl-noise advection + eastward wind
const simUniforms = {
  prev: { value: rtA.texture },
  uTime: { value: 0.0 },
  uDt:   { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uTime;
    uniform float uDt;
    varying vec2 vUv;

    // simplex noise derivative for curl
    vec3 permute(vec3 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
    vec4 permute4(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
    vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v){
      const vec2 C = vec2(1.0/6.0, 1.0/3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0);
      vec4 p = permute4( permute4( permute4(
                 i.z + vec4(0.0, i1.z, i2.z, 1.0))
               + i.y + vec4(0.0, i1.y, i2.y, 1.0))
               + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 1.0/7.0;
      vec3  ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    vec3 curlNoise(vec3 p){
      const float e = 0.1;
      float n1 = snoise(vec3(p.x, p.y + e, p.z));
      float n2 = snoise(vec3(p.x, p.y - e, p.z));
      float n3 = snoise(vec3(p.x, p.y, p.z + e));
      float n4 = snoise(vec3(p.x, p.y, p.z - e));
      float n5 = snoise(vec3(p.x + e, p.y, p.z));
      float n6 = snoise(vec3(p.x - e, p.y, p.z));
      float x = (n1 - n2) - (n5 - n6);
      float y = (n3 - n4) - (n5 - n6);
      float z = (n5 - n6) - (n1 - n2);
      return normalize(vec3(x, y, z)) * 0.5;
    }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      // curl-noise advection
      vec3 offset = vec3(uTime * 0.05, uTime * 0.03, 0.0);
      vec3 curl = curlNoise(p * 0.4 + offset);
      
      // eastward wind (positive x direction)
      vec3 wind = vec3(0.8, 0.0, 0.0);
      
      // combined drift
      vec3 vel = curl * 0.6 + wind;
      p += vel * uDt;

      // wrap x when drifting too far east
      if (p.x > 8.0) p.x -= 16.0;

      age = mod(age + uDt * 0.08, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ─────────────────────────── render scene ───────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 12);
camera.lookAt(0, 0, 0);

// points geometry
const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:     { value: rtA.texture },
    uPixel:    { value: renderer.getPixelRatio() },
    uBorderY:  { value: 0.3 }  // latitude of border line
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uBorderY;
    attribute vec2 uvIdx;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float age = s.w;

      // base palette: bone-white to dust-gray
      vec3 baseCol = mix(vec3(0.92, 0.90, 0.88), vec3(0.68, 0.62, 0.58), age);
      
      // crossing detection: particles above border line get red tint
      float crossAmt = smoothstep(uBorderY - 0.1, uBorderY + 0.1, p.y);
      vec3 redTint = vec3(0.78, 0.32, 0.22);
      vCol = mix(baseCol, redTint, crossAmt * 0.65);

      // opacity varies with altitude (higher = more transparent, like atmosphere)
      float altitudeFade = exp(-abs(p.y) * 0.4);
      vAlpha = altitudeFade * (0.35 + 0.25 * age);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float depth = -mv.z;
      gl_PointSize = (3.5 + age * 2.0) * uPixel * (8.0 / depth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = length(d);
      if (r > 0.5) discard;
      // soft sprite falloff
      float a = exp(-r * r * 8.0);
      gl_FragColor = vec4(vCol * a * vAlpha, a * vAlpha);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

// subtle ambient light to reduce harshness
const ambient = new THREE.AmbientLight(0x2a2622, 0.4);
scene.add(ambient);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
let centroidX = 0, centroidY = 0, centroidZ = 0;

function loop(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  
  simUniforms.uTime.value = now / 1000;
  simUniforms.uDt.value = dt;

  // sim 3 substeps
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // compute approximate centroid for camera tracking (sample subset)
  const gl = renderer.getContext();
  const pixels = new Float32Array(64 * 4);
  renderer.setRenderTarget(rtA);
  gl.readPixels(0, 0, 8, 8, gl.RGBA, gl.FLOAT, pixels);
  renderer.setRenderTarget(null);
  
  let sumX = 0, sumY = 0, sumZ = 0, count = 0;
  for (let i = 0; i < 64; i++){
    sumX += pixels[i*4];
    sumY += pixels[i*4+1];
    sumZ += pixels[i*4+2];
    count++;
  }
  if (count > 0){
    centroidX += (sumX/count - centroidX) * 0.02;
    centroidY += (sumY/count - centroidY) * 0.02;
    centroidZ += (sumZ/count - centroidZ) * 0.02;
  }

  // camera slowly tracks centroid with offset
  camera.position.x = centroidX * 0.3 + Math.sin(now * 0.0001) * 1.5;
  camera.position.y = centroidY + 2.0 + Math.sin(now * 0.00008) * 0.6;
  camera.position.z = 12 + Math.cos(now * 0.00012) * 2.0;
  camera.lookAt(centroidX * 0.5, centroidY, centroidZ * 0.3);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
