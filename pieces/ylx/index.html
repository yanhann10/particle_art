<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: unfurl, intensity: gentle -->
<title>ylx · golden spiral leaves · Andy Goldsworthy</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color:#cdd2dc; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">ylx</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 18, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* ── lighting: warm key, cool fill, amber rim ── */
scene.add(new THREE.AmbientLight(0x1a1410, 0.5));
const key = new THREE.PointLight(0xffe0a0, 85, 100);
key.position.set(14, 22, 10);
scene.add(key);
const fill = new THREE.PointLight(0x7888a8, 18, 80);
fill.position.set(-16, 6, -12);
scene.add(fill);
const rim = new THREE.PointLight(0xd08040, 28, 55);
rim.position.set(-6, -6, -14);
scene.add(rim);

/* ── leaf geometry: parametric curved sheet with midrib ── */
function createLeaf(len, wid, sL, sW) {
  const verts = [], uvs = [], idx = [];
  const cols = sW * 2 + 1;
  for (let i = 0; i <= sL; i++) {
    const t = i / sL;
    const taper = Math.sin(t * Math.PI) * (1 - t * 0.12);
    const y = (t - 0.5) * len;
    for (let j = 0; j <= sW * 2; j++) {
      const s = (j / (sW * 2)) * 2 - 1;
      const x = s * wid * taper;
      const curl = s * s * 0.28 * wid * (0.4 + 0.6 * t);
      const ridge = Math.pow(1 - Math.abs(s), 3) * 0.06 * wid * (1 - t * 0.4);
      verts.push(x, y, curl + ridge);
      uvs.push((s + 1) / 2, t);
    }
  }
  for (let i = 0; i < sL; i++)
    for (let j = 0; j < sW * 2; j++) {
      const a = i * cols + j, b = a + 1, c = a + cols, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const leafGeo = createLeaf(1.6, 0.48, 10, 4);

/* ── palette: hand-picked autumn-amber set ── */
const pal = [
  [0xd4a055, 3], // amber
  [0xe8b44a, 3], // sodium
  [0xf0dbb0, 2], // cream
  [0xa04828, 2], // oxide red
  [0xc88030, 3], // ochre
  [0x8b5e2a, 2], // umber
  [0x3a5a2a, 1], // rare moss
];
const wPal = [];
pal.forEach(([hex, w]) => { for (let i = 0; i < w; i++) wPal.push(new THREE.Color(hex)); });
const pickCol = () => wPal[Math.floor(Math.random() * wPal.length)].clone();

/* ── material ── */
const leafMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  side: THREE.DoubleSide,
  roughness: 0.7,
  metalness: 0.02,
  transparent: true,
  opacity: 0.91,
  emissive: 0x201008,
  emissiveIntensity: 0.25,
});

/* ── golden-angle spiral placement ── */
const N = 210;
const GA = Math.PI * (3 - Math.sqrt(5));
const mesh = new THREE.InstancedMesh(leafGeo, leafMat, N);
const dummy = new THREE.Object3D();
const state = [];

for (let i = 0; i < N; i++) {
  const n = i + 1;
  const angle = i * GA;
  const r = 0.62 * Math.sqrt(n);
  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  const y = Math.sin(r * 0.35) * 0.25 + (Math.random() - 0.5) * 0.12;

  const radialT = Math.sqrt(n) / Math.sqrt(N);
  const baseScale = 0.3 + radialT * 1.15;
  const scaleVar = 0.82 + Math.random() * 0.36;
  const scale = baseScale * scaleVar;
  const phase = Math.random() * Math.PI * 2;
  const breathRate = 0.25 + Math.random() * 0.2;
  const pitchBase = -0.32 + Math.random() * 0.12;
  const yawJitter = (Math.random() - 0.5) * 0.22;
  const rollJitter = (Math.random() - 0.5) * 0.18;

  state.push({ x, y, z, angle, r, scale, phase, breathRate, pitchBase, yawJitter, rollJitter, radialT });

  dummy.position.set(x, y, z);
  dummy.rotation.set(pitchBase, angle + Math.PI * 0.5 + yawJitter, rollJitter);
  dummy.scale.setScalar(scale);
  dummy.updateMatrix();
  mesh.setMatrixAt(i, dummy.matrix);

  const col = pickCol();
  col.lerp(new THREE.Color(0x1a1008), (1 - radialT) * 0.35);
  mesh.setColorAt(i, col);
}
mesh.instanceMatrix.needsUpdate = true;
mesh.instanceColor.needsUpdate = true;
scene.add(mesh);

/* ── midrib accent lines (subtle dark veins) ── */
const ribMat = new THREE.LineBasicMaterial({ color: 0x1a1208, transparent: true, opacity: 0.3 });
const ribGroup = new THREE.Group();
for (let i = 0; i < N; i += 3) {
  const s = state[i];
  const pts = [];
  for (let t = 0; t <= 1; t += 0.25) {
    pts.push(new THREE.Vector3(0, (t - 0.5) * 1.6, Math.pow(1, 3) * 0.03));
  }
  const ribGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.Line(ribGeo, ribMat);
  line.position.set(s.x, s.y, s.z);
  line.rotation.set(s.pitchBase, s.angle + Math.PI * 0.5 + s.yawJitter, s.rollJitter);
  line.scale.setScalar(s.scale);
  line.userData = { idx: i };
  ribGroup.add(line);
}
scene.add(ribGroup);

/* ── dust motes ── */
const DUST = 350;
const dGeo = new THREE.BufferGeometry();
const dPos = new Float32Array(DUST * 3);
const dSeed = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dPos[i*3]   = (Math.random() - 0.5) * 35;
  dPos[i*3+1] = (Math.random() - 0.5) * 22;
  dPos[i*3+2] = (Math.random() - 0.5) * 35;
  dSeed[i] = Math.random();
}
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
dGeo.setAttribute('seed', new THREE.BufferAttribute(dSeed, 1));

const dMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    uniform float uTime;
    attribute float seed;
    varying float vA;
    void main() {
      vec3 p = position;
      float ph = uTime * 0.12 + seed * 6.28;
      p.y += sin(ph) * 0.6;
      p.x += sin(ph * 0.7 + seed * 3.14) * 0.35;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (0.8 + seed * 1.2) * (28.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vA = 0.12 + 0.08 * sin(ph * 1.8);
    }
  `,
  fragmentShader: `
    varying float vA;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vA;
      gl_FragColor = vec4(vec3(0.92, 0.82, 0.58) * a, a);
    }
  `
});
scene.add(new THREE.Points(dGeo, dMat));

/* ── film grain overlay ── */
const grainMat = new THREE.ShaderMaterial({
  transparent: true, depthTest: false, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform float uTime;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() {
      float g = hash(gl_FragCoord.xy + uTime * 137.0) * 0.045;
      gl_FragColor = vec4(vec3(g), g * 0.4);
    }
  `
});
const grainScene = new THREE.Scene();
const grainCam = new THREE.Camera();
grainScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), grainMat));
grainScene.children[0].frustumCulled = false;

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── animate ── */
const t0 = performance.now();

function loop() {
  const t = (performance.now() - t0) / 1000;

  /* breathe + gentle unfurl */
  for (let i = 0; i < N; i++) {
    const s = state[i];
    const breath = 1 + Math.sin(t * s.breathRate + s.phase) * 0.055;
    const yOff = Math.sin(t * 0.18 + s.phase) * 0.07;
    const unfurl = Math.min(t * 0.008, 0.12) * (s.r / 10);

    dummy.position.set(s.x, s.y + yOff, s.z);
    dummy.rotation.set(
      s.pitchBase + Math.sin(t * 0.13 + s.phase) * 0.04,
      s.angle + Math.PI * 0.5 + s.yawJitter + unfurl,
      s.rollJitter + Math.sin(t * 0.09 + s.phase * 2) * 0.035
    );
    dummy.scale.setScalar(s.scale * breath);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;

  /* sync rib lines every 4 frames */
  if (Math.floor(t * 60) % 4 === 0) {
    for (const line of ribGroup.children) {
      const i = line.userData.idx;
      const s = state[i];
      const breath = 1 + Math.sin(t * s.breathRate + s.phase) * 0.055;
      const yOff = Math.sin(t * 0.18 + s.phase) * 0.07;
      const unfurl = Math.min(t * 0.008, 0.12) * (s.r / 10);
      line.position.set(s.x, s.y + yOff, s.z);
      line.rotation.set(
        s.pitchBase + Math.sin(t * 0.13 + s.phase) * 0.04,
        s.angle + Math.PI * 0.5 + s.yawJitter + unfurl,
        s.rollJitter + Math.sin(t * 0.09 + s.phase * 2) * 0.035
      );
      line.scale.setScalar(s.scale * breath);
    }
  }

  /* camera: slow contemplative orbit */
  const cA = t * 0.028;
  const cR = 25 + Math.sin(t * 0.02) * 2;
  const cY = 13.5 + Math.sin(t * 0.04) * 2.5;
  camera.position.set(Math.cos(cA) * cR, cY, Math.sin(cA) * cR);
  camera.lookAt(0, -0.5, 0);

  dMat.uniforms.uTime.value = t;
  grainMat.uniforms.uTime.value = t;

  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.render(grainScene, grainCam);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
