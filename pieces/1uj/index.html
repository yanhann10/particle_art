<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1uj · Shiota — Rosary of Absence</title>
<!-- MOTION: ascend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">1uj</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0022);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050101, 0.004));
const warmL = new THREE.PointLight(0xff5830, 0.016, 50, 2.0);
warmL.position.set(1.5, 12, -2);
scene.add(warmL);

let seed = 7391562;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:28, h:28, d:24 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── THE ROSARY — six pale stones on an invisible vertical thread
// Each bead a memory held in place, counted like prayers
const stones = [
  { pos: new THREE.Vector3( 0.30, -6.2,  0.10), r: 0.62 },
  { pos: new THREE.Vector3(-0.12, -2.8, -0.18), r: 0.72 },
  { pos: new THREE.Vector3( 0.08,  0.8,  0.22), r: 0.80 },
  { pos: new THREE.Vector3(-0.22,  4.2, -0.12), r: 0.68 },
  { pos: new THREE.Vector3( 0.18,  7.5,  0.08), r: 0.58 },
  { pos: new THREE.Vector3(-0.08, 10.2, -0.05), r: 0.52 }
];

const chainCenter = new THREE.Vector3(0, 2.0, 0);

const stoneMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8da,
  emissive: 0xf0e8da,
  emissiveIntensity: 0.60,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.30,
  fog: true,
  side: THREE.DoubleSide
});

const stoneMeshes = [];
for(const s of stones){
  const geo = new THREE.SphereGeometry(s.r, 24, 16);
  const mesh = new THREE.Mesh(geo, stoneMat);
  mesh.position.copy(s.pos);
  scene.add(mesh);
  stoneMeshes.push(mesh);
}

function stoneSurfPt(si){
  const s = stones[si];
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  const r = s.r * (0.97 + rng()*0.06);
  return new THREE.Vector3(
    s.pos.x + Math.sin(v)*Math.cos(u)*r,
    s.pos.y + Math.sin(v)*Math.sin(u)*r,
    s.pos.z + Math.cos(v)*r
  );
}

function randomStoneSurf(){
  return stoneSurfPt(Math.floor(rng()*stones.length));
}

// ── DARK FRAGMENTS — 14 charred scraps
const fragments = [];
for(let i = 0; i < 14; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3 + Math.floor(rng()*3);
  const fSize = 0.04 + rng()*0.10;
  for(let j = 0; j < nPts; j++){
    verts.push(
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.3,
      (rng()-0.5)*fSize, (rng()-0.5)*fSize, (rng()-0.5)*fSize*0.3
    );
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color: 0x0a0806, transparent: true, opacity: 0.40
  }));
  const si = Math.floor(rng()*stones.length);
  const sPos = stones[si].pos;
  const u = rng()*Math.PI*2;
  const v = Math.acos(2*rng()-1);
  const r = 2.5 + rng()*6.0;
  fMesh.position.set(
    sPos.x + Math.sin(v)*Math.cos(u)*r,
    sPos.y + Math.sin(v)*Math.sin(u)*r*0.6,
    sPos.z + Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — deliberate negative space
const voids = [];
for(let i = 0; i < 3; i++){
  const a = (i/3)*Math.PI*2 + rng()*0.8;
  const vr = 5.0 + rng()*3.0;
  voids.push({
    x: Math.cos(a)*vr,
    z: Math.sin(a)*vr,
    r: 1.5 + rng()*0.8
  });
}
function inVoid(p){
  for(const v of voids){
    const dx = p.x - v.x, dz = p.z - v.z;
    if(dx*dx + dz*dz < v.r*v.r) return true;
  }
  return false;
}

// ── ANCHOR FIELD — shells around each stone + wall anchors
const anchors = [];
const aShells = [3.0, 5.0, 7.5, 10.0];
for(const sr of aShells){
  const count = Math.floor(12 + sr*0.8);
  for(let i = 0; i < count; i++){
    const u = rng()*Math.PI*2;
    const v = Math.acos(2*rng()-1);
    const r = sr*(0.85+rng()*0.3);
    const si = Math.floor(rng()*stones.length);
    const sPos = stones[si].pos;
    const pt = new THREE.Vector3(
      sPos.x + Math.sin(v)*Math.cos(u)*r,
      sPos.y + Math.sin(v)*Math.sin(u)*r*0.7,
      sPos.z + Math.cos(v)*r
    );
    pt.y = Math.max(-hh+0.5, Math.min(hh-0.5, pt.y));
    if(!inVoid(pt)) anchors.push(pt);
  }
}
for(let i = 0; i < 50; i++){
  const wp = wallPt();
  if(!inVoid(wp)) anchors.push(wp);
}
for(const f of fragments) anchors.push(f.position.clone());

// ── SUSPENSION THREADS — from ceiling to topmost stone, floor to lowest
const suspPts = [];
for(let i = 0; i < 6; i++){
  const a = (i/6)*Math.PI*2 + (rng()-0.5)*0.2;
  const topS = stones[stones.length-1];
  const topR = 0.08 + rng()*0.25;
  suspPts.push(
    topS.pos.x + Math.cos(a)*topR, hh, topS.pos.z + Math.sin(a)*topR,
    topS.pos.x + Math.cos(a)*0.04, topS.pos.y + topS.r, topS.pos.z + Math.sin(a)*0.04
  );
}
for(let i = 0; i < 4; i++){
  const a = (i/4)*Math.PI*2 + (rng()-0.5)*0.3;
  const botS = stones[0];
  const botR = 0.06 + rng()*0.2;
  suspPts.push(
    botS.pos.x + Math.cos(a)*botR, -hh, botS.pos.z + Math.sin(a)*botR,
    botS.pos.x + Math.cos(a)*0.03, botS.pos.y - botS.r, botS.pos.z + Math.sin(a)*0.03
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspPts), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x0d0404, transparent: true, opacity: 0.22
})));

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function nearestStone(p){
  let best = 0, bestD = Infinity;
  for(let i = 0; i < stones.length; i++){
    const d = p.distanceTo(stones[i].pos);
    if(d < bestD){ bestD = d; best = i; }
  }
  return best;
}

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  if(inVoid(a) || inVoid(b)) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const ns = nearestStone(new THREE.Vector3((a.x+b.x)*0.5,(a.y+b.y)*0.5,(a.z+b.z)*0.5));
  lineDist[li] = new THREE.Vector3((a.x+b.x)*0.5,(a.y+b.y)*0.5,(a.z+b.z)*0.5).distanceTo(stones[ns].pos);
  lineCat[li] = cat;
  li++;
}

// RULE 1: CONVERGENCE — threads from volume toward stone surfaces
// Each stone draws threads from the surrounding web — six hearts beating
for(let i = 0; i < 8000 && li < NUM_LINES; i++){
  const si = Math.floor(rng()*stones.length);
  let origin;
  if(rng() < 0.3){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  const target = stoneSurfPt(si);
  // 10% yearning threads — stop short
  if(rng() < 0.10){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.25 + rng()*1.2;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)), 0);
  } else {
    setLine(origin, target, 0);
  }
}

// RULE 2: INTER-STONE BUNDLES — the rosary string itself
// Bundles of threads between adjacent stones — the prayer counted
for(let si = 0; si < stones.length - 1; si++){
  const sA = stones[si], sB = stones[si+1];
  const bundleCount = 90 + Math.floor(rng()*40);
  for(let j = 0; j < bundleCount && li < NUM_LINES; j++){
    const uA = rng()*Math.PI*2, vA = Math.acos(2*rng()-1);
    const ptA = new THREE.Vector3(
      sA.pos.x + Math.sin(vA)*Math.cos(uA)*sA.r*0.95,
      sA.pos.y + Math.cos(vA)*sA.r*0.95,
      sA.pos.z + Math.sin(vA)*Math.sin(uA)*sA.r*0.95
    );
    const uB = rng()*Math.PI*2, vB = Math.acos(2*rng()-1);
    const ptB = new THREE.Vector3(
      sB.pos.x + Math.sin(vB)*Math.cos(uB)*sB.r*0.95,
      sB.pos.y + Math.cos(vB)*sB.r*0.95,
      sB.pos.z + Math.sin(vB)*Math.sin(uB)*sB.r*0.95
    );
    setLine(ptA, ptB, 3);
  }
}

// RULE 3: LATERAL WEB — anchor-to-nearest-anchor (Casey Reas proximity)
const THRESH = 6.5;
let catBcount = 0, attempts = 0;
while(catBcount < 3000 && li < NUM_LINES && attempts < 40000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j = 0; j < 8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.5 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 1);
  catBcount++;
}

// RULE 4: VERTICAL CATHEDRAL — floor-to-ceiling threads
// Columns of red creating the cathedral nave
for(let i = 0; i < 2500 && li < NUM_LINES; i++){
  const a = rng()*Math.PI*2;
  const r = 1.5 + rng()*10.0;
  const drift = (rng()-0.5)*0.6;
  const x = Math.cos(a)*r;
  const z = Math.sin(a)*r;
  const yBot = -hh + rng()*2.0;
  const yTop = hh - rng()*2.0;
  const floorPt = new THREE.Vector3(x + drift*0.3, yBot, z + drift*0.2);
  const ceilPt = new THREE.Vector3(x + drift, yTop, z + drift*0.5);
  if(!inVoid(floorPt) && !inVoid(ceilPt)){
    setLine(floorPt, ceilPt, 1);
  }
}

// RULE 5: EMANATION — short threads radiating from each stone
for(let si = 0; si < stones.length; si++){
  const count = 280 + Math.floor(rng()*100);
  for(let i = 0; i < count && li < NUM_LINES; i++){
    const surfPt = stoneSurfPt(si);
    const radial = surfPt.clone().sub(stones[si].pos).normalize();
    const len = 0.6 + rng()*3.5;
    const dev = new THREE.Vector3(
      (rng()-0.5)*0.10, (rng()-0.5)*0.10, (rng()-0.5)*0.10
    );
    const dir = radial.clone().add(dev).normalize();
    setLine(surfPt, surfPt.clone().add(dir.multiplyScalar(len)), 2);
  }
}

// RULE 6: GRAVITY THREADS — hanging from lower stones
for(let si = 0; si < 3; si++){
  for(let i = 0; i < 180 && li < NUM_LINES; i++){
    const u = rng()*Math.PI*2;
    const v = Math.PI*0.5 + rng()*Math.PI*0.5;
    const s = stones[si];
    const surfPt = new THREE.Vector3(
      s.pos.x + Math.sin(v)*Math.cos(u)*s.r,
      s.pos.y + Math.cos(v)*s.r,
      s.pos.z + Math.sin(v)*Math.sin(u)*s.r
    );
    const dropLen = 1.2 + rng()*4.0;
    const endPt = new THREE.Vector3(
      surfPt.x + (rng()-0.5)*0.4,
      surfPt.y - dropLen,
      surfPt.z + (rng()-0.5)*0.3
    );
    setLine(surfPt, endPt, 2);
  }
}

// Fill remainder with wall-to-stone spans
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng()<0.4 ? randomStoneSurf() :
            (rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt());
  setLine(a, b, 1);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── THREAD COLOR — blood-red #c20018
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catOpacity = [0.08, 0.038, 0.055, 0.065];

for(let i = 0; i < li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.18, 1.0 - d*0.05);
  const cat = lineCat[i];
  const baseOp = catOpacity[cat] * distFade;
  const warmShift = d < 3.0 ? 0.012 : 0.0;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = (bR + warmShift) * baseOp;
    colors[i*6+v*3+1] = bG * baseOp;
    colors[i*6+v*3+2] = bB * baseOp * 0.6;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — ascend through the rosary, then descend
// Narrative: rise past each stone, witness each absence, return
const pathLen = 3200;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i/pathLen;
  const p = t * Math.PI * 2;

  let rH, y;
  if(t < 0.08){
    // Begin below the lowest stone, looking up through gravity threads
    const lt = t/0.08;
    rH = 5.0 + lt*1.5;
    y = -9.0 + lt*2.0;
  } else if(t < 0.20){
    // Rise past first stone
    const lt = (t-0.08)/0.12;
    rH = 6.5 - lt*1.5;
    y = -7.0 + lt*5.5;
  } else if(t < 0.32){
    // Intimate passage between stones 2-3
    const lt = (t-0.20)/0.12;
    rH = 5.0 + lt*1.0;
    y = -1.5 + lt*4.0;
  } else if(t < 0.44){
    // Level with central stone — the heart of the rosary
    const lt = (t-0.32)/0.12;
    rH = 6.0 - lt*2.2;
    y = 2.5 + lt*2.5;
  } else if(t < 0.56){
    // Continue ascending, widening view
    const lt = (t-0.44)/0.12;
    rH = 3.8 + lt*3.5;
    y = 5.0 + lt*4.0;
  } else if(t < 0.66){
    // Near the topmost stone — the last prayer
    const lt = (t-0.56)/0.10;
    rH = 7.3 - lt*3.0;
    y = 9.0 + lt*2.0;
  } else if(t < 0.78){
    // Begin descent — the return
    const lt = (t-0.66)/0.12;
    rH = 4.3 + lt*3.0;
    y = 11.0 - lt*8.0;
  } else if(t < 0.90){
    // Sweep through mid-section laterally
    const lt = (t-0.78)/0.12;
    rH = 7.3 - lt*1.5;
    y = 3.0 - lt*6.0;
  } else {
    // Return to start
    const lt = (t-0.90)/0.10;
    rH = 5.8 - lt*0.8;
    y = -3.0 - lt*6.0;
  }

  // Gentle lateral sway — pendular, not orbital
  const swayAmp = 0.12;
  const sway = Math.sin(p*2.3)*swayAmp;
  const x = Math.sin(p*0.55 + sway)*rH;
  const z = Math.cos(p*0.55 + sway)*rH*1.05;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i*6;
    const dist = lineDist[i];
    const amp = 0.00003 * Math.max(0, 1.0-dist/16.0);
    const phase = basePositions[idx]*0.03 + basePositions[idx+1]*0.04 + i*0.00012;
    const breath = Math.sin(elapsed*0.0018+phase)*amp;
    for(let v = 0; v < 2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.10;
      arr[vi+1] = basePositions[vi+1] + breath*0.07;
      arr[vi+2] = basePositions[vi+2] + breath*0.09;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Stone luminance pulse — staggered like a slow heartbeat counting
  for(let si = 0; si < stoneMeshes.length; si++){
    const phaseOff = si * 0.45;
    stoneMeshes[si].material.emissiveIntensity = 0.58 + Math.sin(elapsed*0.0005 + phaseOff)*0.06;
  }

  // Camera dolly
  const speed = 0.000055;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward nearest stone with subtle sway
  const camY = camera.position.y;
  let lookTarget = stones[0].pos;
  let bestYDist = Infinity;
  for(const s of stones){
    const yd = Math.abs(s.pos.y - camY);
    if(yd < bestYDist){ bestYDist = yd; lookTarget = s.pos; }
  }
  const look = lookTarget.clone();
  look.x += Math.sin(elapsed*0.0003)*0.04;
  look.y += Math.cos(elapsed*0.00025)*0.12;
  look.z += Math.sin(elapsed*0.00045+0.3)*0.03;
  camera.lookAt(look);

  // Light micro-drift
  warmL.position.x = 1.5 + Math.sin(elapsed*0.00012)*0.03;
  warmL.position.y = 12 + Math.cos(elapsed*0.00008)*0.02;
  warmL.intensity = 0.016 + Math.sin(elapsed*0.00018)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
