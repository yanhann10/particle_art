<title>pqc · Shiota — In Silence (The Burned Piano)</title>
<!-- MOTION: suspend, intensity: calm -->
<style>

<body>
<div class="id">pqc</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0808, 0.003));
const keyL = new THREE.PointLight(0x181818, 0.008, 32, 2.4);
keyL.position.set(-4, 8, 5);
scene.add(keyL);

let seed = 902847;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// SUSPENDED OBJECT — burned piano (simplified form: rectangular body + vertical strings)
const pianoPos = new THREE.Vector3(0, 0.6, 0);
const pianoW = 3.8, pianoH = 1.2, pianoD = 2.4;

// Piano body — charred black
const pianoBodyGeo = new THREE.BoxGeometry(pianoW, pianoH, pianoD);
const pianoBodyMat = new THREE.MeshStandardMaterial({
  color: 0x0a0808, emissive: 0x000000, emissiveIntensity: 0,
  roughness: 0.98, metalness: 0.02
});
const pianoBody = new THREE.Mesh(pianoBodyGeo, pianoBodyMat);
pianoBody.position.copy(pianoPos);
scene.add(pianoBody);

// Piano strings — thin vertical white lines embedded in the body
const stringCount = 18;
const stringGeo = new THREE.BufferGeometry();
const stringPositions = [];
for(let i=0; i<stringCount; i++){
  const t = i/(stringCount-1);
  const x = pianoPos.x + (t-0.5)*pianoW*0.8;
  const y1 = pianoPos.y - pianoH/2 + 0.1;
  const y2 = pianoPos.y + pianoH/2 - 0.1;
  const z = pianoPos.z + (rng()-0.5)*pianoD*0.4;
  stringPositions.push(x, y1, z, x, y2, z);
}
stringGeo.setAttribute('position', new THREE.Float32BufferAttribute(stringPositions, 3));
const strings = new THREE.LineSegments(stringGeo, new THREE.LineBasicMaterial({
  color: 0x888888, transparent: true, opacity: 0.4
}));
scene.add(strings);

// Subtle glow near piano
const pianoGlow = new THREE.PointLight(0x181818, 0.004, 8, 3.0);
pianoGlow.position.copy(pianoPos);
scene.add(pianoGlow);

// ROOM VOLUME
const ROOM = { w: 24, h: 18, d: 22 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHORS — wall grid
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.9; z=(rng()-0.5)*ROOM.d*0.9; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.9; y=(rng()-0.5)*ROOM.h*0.9; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.9; y=(rng()-0.5)*ROOM.h*0.9; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<85; i++) anchors.push(wallPt());

// PIANO PERIMETER POINTS — attachment points around piano edges
const pianoPts = [];
const edgeSteps = 8;

// Top edge loop
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  pianoPts.push(new THREE.Vector3(
    pianoPos.x + (t-0.5)*pianoW,
    pianoPos.y + pianoH/2,
    pianoPos.z - pianoD/2
  ));
  pianoPts.push(new THREE.Vector3(
    pianoPos.x + (t-0.5)*pianoW,
    pianoPos.y + pianoH/2,
    pianoPos.z + pianoD/2
  ));
}

// Side edges
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  pianoPts.push(new THREE.Vector3(
    pianoPos.x - pianoW/2,
    pianoPos.y + (t-0.5)*pianoH,
    pianoPos.z - pianoD/2
  ));
  pianoPts.push(new THREE.Vector3(
    pianoPos.x + pianoW/2,
    pianoPos.y + (t-0.5)*pianoH,
    pianoPos.z + pianoD/2
  ));
}

// Front/back edges
for(let i=0; i<edgeSteps; i++){
  const t = i/edgeSteps;
  pianoPts.push(new THREE.Vector3(
    pianoPos.x + (t-0.5)*pianoW,
    pianoPos.y - pianoH/2,
    pianoPos.z + pianoD/2
  ));
  pianoPts.push(new THREE.Vector3(
    pianoPos.x + (t-0.5)*pianoW,
    pianoPos.y - pianoH/2,
    pianoPos.z - pianoD/2
  ));
}

// BLACK THREAD NETWORK — 20,000 line segments (hard limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to piano top
const ceilingAnchors = [];
for(let i=0; i<14; i++){
  const t = i/14;
  const cx = pianoPos.x + (t-0.5)*pianoW*1.4 + (rng()-0.5)*0.6;
  const cz = pianoPos.z + (rng()-0.5)*pianoD*1.2;
  ceilingAnchors.push(new THREE.Vector3(cx, hh, cz));
}

for(const ca of ceilingAnchors){
  let closest = pianoPts[0];
  let closestD = ca.distanceTo(closest);
  for(const pp of pianoPts){
    const d = ca.distanceTo(pp);
    if(d < closestD && pp.y > pianoPos.y){ closestD=d; closest=pp; }
  }
  setLine(ca, closest);
}

// CONVERGENCE — anchors to piano perimeter (heavier density near piano)
for(let i=0; i<anchors.length*0.72 && li<NUM_LINES-16000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dPiano = a.distanceTo(pianoPos);
  if(dPiano < 3.0) continue;
  
  let closest = pianoPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<8; k++){
    const candidate = pianoPts[Math.floor(rng()*pianoPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 12% of piano-converging threads stop short (fail to reach)
  if(rng()<0.12){
    const shortDir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.4 + rng()*0.5);
    const shortEnd = a.clone().add(shortDir.multiplyScalar(shortLen));
    setLine(a, shortEnd);
  } else {
    setLine(a, closest);
  }
}

// RADIAL THREADS FROM PIANO — threads radiating outward
for(let i=0; i<450 && li<NUM_LINES-13000; i++){
  const pp = pianoPts[Math.floor(rng()*pianoPts.length)];
  const dir = pp.clone().sub(pianoPos).normalize();
  dir.x += (rng()-0.5)*0.4;
  dir.y += (rng()-0.5)*0.3;
  dir.z += (rng()-0.5)*0.4;
  dir.normalize();
  const len = 2.2 + rng()*5.0;
  const end = pp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(pp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 5.4;
let webCount = 0, attempts = 0;
while(webCount<3600 && li<NUM_LINES-9000 && attempts<24000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<7; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.8 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans (architectural cage)
let wallSpans = 0;
while(wallSpans<1500 && li<NUM_LINES-6000){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>3.5 && d<18.0){
    setLine(a, b);
    wallSpans++;
  }
}

// Y-FORKING DENDRITIC CHAINS near piano (Entangled Others influence)
for(let i=0; i<220 && li<NUM_LINES-4000; i++){
  const startDist = 3.0 + rng()*5.5;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.7;
  const start = pianoPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.2,
    (rng()-0.5)*1.8,
    (rng()-0.5)*2.2
  ).normalize();
  
  const segLen = 0.9 + rng()*0.7;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-10 && rng()<0.65){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.6 + rng()*0.5
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.75));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-8 && rng()<0.45){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.6 - rng()*0.5
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.7));
      setLine(p1, p2b);
      
      if(li<NUM_LINES-6 && rng()<0.25){
        const fork3 = fork1.clone().applyAxisAngle(
          new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
          0.4 + rng()*0.3
        ).normalize();
        const p3 = p2a.clone().add(fork3.multiplyScalar(segLen*0.6));
        setLine(p2a, p3);
      }
    }
  }
}

// HORIZONTAL CROSSING THREADS — architectural spans at multiple heights
for(let i=0; i<280 && li<NUM_LINES-2000; i++){
  const y = pianoPos.y + (rng()-0.5)*4.5;
  const x1 = -hw + rng()*2.5;
  const z1 = (rng()-0.5)*ROOM.d*0.9;
  const x2 = hw - rng()*2.5;
  const z2 = (rng()-0.5)*ROOM.d*0.9;
  const a = new THREE.Vector3(x1, y, z1);
  const b = new THREE.Vector3(x2, y, z2);
  setLine(a, b);
}

// FILL remaining capacity with sparse long spans
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>4.0 && d<15.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0x0a0a0a, transparent: true, opacity: 0.095,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, orbiting piano slowly
const pathLen = 2800;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.18){
    // Approach from front-left, descending
    const lt = t/0.18;
    const angle = -Math.PI*0.6 + lt*Math.PI*0.25;
    const r = 8.5 - lt*1.8;
    x = pianoPos.x + Math.cos(angle)*r;
    y = pianoPos.y + 5.0 - lt*3.5;
    z = pianoPos.z + Math.sin(angle)*r;
  } else if(t<0.40){
    // Descend below piano, looking up through thread canopy
    const lt = (t-0.18)/0.22;
    const angle = -Math.PI*0.35 + lt*Math.PI*0.6;
    const r = 7.0 + Math.sin(lt*Math.PI)*1.2;
    x = pianoPos.x + Math.cos(angle)*r;
    y = pianoPos.y - lt*5.5;
    z = pianoPos.z + Math.sin(angle)*r;
  } else if(t<0.64){
    // Orbit close on right side, mid-height
    const lt = (t-0.40)/0.24;
    const angle = Math.PI*0.25 + lt*Math.PI*0.7;
    const r = 5.2 + Math.cos(lt*Math.PI*1.8)*0.9;
    x = pianoPos.x + Math.cos(angle)*r;
    y = pianoPos.y + 0.8 + Math.sin(lt*Math.PI*1.2)*0.6;
    z = pianoPos.z + Math.sin(angle)*r;
  } else {
    // Rise and pull back, piano centered and silhouetted
    const lt = (t-0.64)/0.36;
    const angle = Math.PI*0.95 + lt*Math.PI*0.5;
    const r = 5.5 + lt*4.5;
    x = pianoPos.x + Math.cos(angle)*r;
    y = pianoPos.y + 2.0 + lt*2.5;
    z = pianoPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.4%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.018 + basePositions[idx+1]*0.027 + i*0.00006;
    const breath = Math.sin(elapsed*0.00038 + phase)*0.000012;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.014;
      arr[vi+1] = basePositions[vi+1] + breath*0.009;
      arr[vi+2] = basePositions[vi+2] + breath*0.016;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000020;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward piano with subtle drift
  camera.lookAt(
    pianoPos.x + Math.sin(elapsed*0.00009)*0.10,
    pianoPos.y + Math.cos(elapsed*0.00007)*0.08,
    pianoPos.z + Math.sin(elapsed*0.00005)*0.07
  );

  keyL.intensity = 0.008 + Math.sin(elapsed*0.00006)*0.0025;
  pianoGlow.intensity = 0.004 + Math.sin(elapsed*0.00008)*0.0018;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
