<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ony · paired leaf hands (Felix Gonzalez-Torres)</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0a09; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">ony</div>
<div class="hint">drag to orbit · paired hands reaching</div>
<div class="src">Felix Gonzalez-Torres · leaf-hand diptych · absence and presence</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Paired leaf hands — tender diptych
   Two hands composed of curled leaf-scales reach toward each other
   across empty space. Left hand: warm amber autumn leaves.
   Right hand: pale translucent leaves fading toward absence.
   Felix Gonzalez-Torres signature: the paired form, the absent lover,
   the gesture of reaching that cannot close the gap. */

const BG = 0x0d0a09;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.022);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);
controls.dampingFactor = 0.05;

// Hand geometry: simplified palm + 5 fingers as skeletal curves
// Each finger is a sequence of joint positions
function fingerCurve(baseX, baseY, length, spread) {
  const joints = [];
  const segments = 4;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = baseX + spread * t * t;
    const y = baseY + length * t - length * 0.15 * Math.sin(t * Math.PI);
    const z = -0.3 * Math.sin(t * Math.PI * 0.8);
    joints.push(new THREE.Vector3(x, y, z));
  }
  return joints;
}

function buildHandSkeleton(mirrorX = 1) {
  const palmY = -1.5;
  const fingers = [
    fingerCurve(-0.9 * mirrorX, palmY, 1.2, -0.3 * mirrorX),  // thumb
    fingerCurve(-0.4 * mirrorX, palmY, 1.6, 0.05 * mirrorX),  // index
    fingerCurve(0.0 * mirrorX, palmY, 1.7, 0.1 * mirrorX),    // middle
    fingerCurve(0.4 * mirrorX, palmY, 1.5, 0.08 * mirrorX),   // ring
    fingerCurve(0.75 * mirrorX, palmY, 1.2, 0.05 * mirrorX)   // pinky
  ];
  const palm = [
    new THREE.Vector3(-1.0 * mirrorX, palmY - 0.3, 0),
    new THREE.Vector3(-0.6 * mirrorX, palmY - 0.6, 0.2),
    new THREE.Vector3(0.0 * mirrorX, palmY - 0.7, 0.3),
    new THREE.Vector3(0.6 * mirrorX, palmY - 0.6, 0.2),
    new THREE.Vector3(1.0 * mirrorX, palmY - 0.3, 0)
  ];
  return { fingers, palm };
}

// Build leaf mesh: curled teardrop with midrib
function createLeafGeometry(width, height) {
  const segments = 12;
  const verts = [];
  const indices = [];
  
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const y = t * height;
    const w = width * Math.sin(t * Math.PI) * (1 - t * 0.3);
    
    // curl factor: leaf curls more at tip
    const curl = t * t * 0.5;
    
    const xL = -w * 0.5;
    const xR = w * 0.5;
    const zL = -curl * w * 0.3;
    const zR = curl * w * 0.3;
    
    verts.push(xL, y, zL);
    verts.push(0, y, 0);
    verts.push(xR, y, zR);
    
    if (i < segments) {
      const base = i * 3;
      indices.push(base, base + 3, base + 1);
      indices.push(base + 1, base + 3, base + 4);
      indices.push(base + 1, base + 4, base + 2);
      indices.push(base + 2, base + 4, base + 5);
    }
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

const leafGeom = createLeafGeometry(0.15, 0.35);

// Leaf material: double-sided, warm or pale
function createLeafMaterial(palette) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Color(palette[0]) },
      uColor2: { value: new THREE.Color(palette[1]) },
      uOpacity: { value: palette[2] },
      fogColor: { value: scene.fog.color },
      fogDensity: { value: scene.fog.density }
    },
    vertexShader: `
      uniform float uTime;
      varying vec3 vPos;
      varying vec3 vNormal;
      varying float vFogDepth;
      
      void main() {
        vPos = position;
        vNormal = normalize(normalMatrix * normal);
        
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vFogDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform float uOpacity;
      uniform vec3 fogColor;
      uniform float fogDensity;
      varying vec3 vPos;
      varying vec3 vNormal;
      varying float vFogDepth;
      
      void main() {
        float t = clamp(vPos.y / 0.35, 0.0, 1.0);
        vec3 col = mix(uColor1, uColor2, t * t);
        
        float nl = abs(dot(vNormal, vec3(0.2, 0.8, 0.3)));
        col *= 0.6 + 0.4 * nl;
        
        float fogFactor = 1.0 - exp(-fogDensity * fogDensity * vFogDepth * vFogDepth);
        col = mix(col, fogColor, fogFactor);
        
        float alpha = uOpacity * (1.0 - fogFactor * 0.6);
        gl_FragColor = vec4(col, alpha);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false
  });
}

// Warm autumn palette for left hand
const warmMat = createLeafMaterial([0xd4722e, 0xf4a860, 0.85]);
// Pale translucent palette for right hand (fading presence)
const paleMat = createLeafMaterial([0xe8dcd0, 0xf8f4ee, 0.35]);

// Place leaves along hand skeleton
function populateHandWithLeaves(skeleton, material, offsetX) {
  const group = new THREE.Group();
  const { fingers, palm } = skeleton;
  
  // Place leaves on palm
  for (let i = 0; i < palm.length - 1; i++) {
    const a = palm[i];
    const b = palm[i + 1];
    const mid = new THREE.Vector3().lerpVectors(a, b, 0.5);
    
    const count = 6 + Math.floor(Math.random() * 3);
    for (let k = 0; k < count; k++) {
      const u = (k + Math.random() * 0.3) / count;
      const pos = new THREE.Vector3().lerpVectors(a, b, u);
      
      const leaf = new THREE.Mesh(leafGeom, material);
      leaf.position.copy(pos);
      leaf.position.x += offsetX;
      
      const dir = new THREE.Vector3().subVectors(b, a).normalize();
      const angle = Math.atan2(dir.x, dir.y);
      leaf.rotation.z = angle + (Math.random() - 0.5) * 0.6;
      leaf.rotation.y = (Math.random() - 0.5) * 0.8;
      
      const scaleVar = 0.7 + Math.random() * 0.5;
      leaf.scale.set(scaleVar, scaleVar, scaleVar);
      
      leaf.userData.phase = Math.random() * Math.PI * 2;
      leaf.userData.speed = 0.3 + Math.random() * 0.3;
      leaf.userData.breatheAmt = 0.02 + Math.random() * 0.02;
      
      group.add(leaf);
    }
  }
  
  // Place leaves on each finger
  fingers.forEach(joints => {
    for (let i = 0; i < joints.length - 1; i++) {
      const a = joints[i];
      const b = joints[i + 1];
      
      const count = 4 + Math.floor(Math.random() * 2);
      for (let k = 0; k < count; k++) {
        const u = (k + Math.random() * 0.3) / count;
        const pos = new THREE.Vector3().lerpVectors(a, b, u);
        
        const leaf = new THREE.Mesh(leafGeom, material);
        leaf.position.copy(pos);
        leaf.position.x += offsetX;
        
        const dir = new THREE.Vector3().subVectors(b, a).normalize();
        const angle = Math.atan2(dir.x, dir.y);
        leaf.rotation.z = angle + (Math.random() - 0.5) * 0.5;
        leaf.rotation.y = (Math.random() - 0.5) * 0.7;
        
        const scaleVar = 0.6 + Math.random() * 0.4;
        leaf.scale.set(scaleVar, scaleVar, scaleVar);
        
        leaf.userData.phase = Math.random() * Math.PI * 2;
        leaf.userData.speed = 0.3 + Math.random() * 0.3;
        leaf.userData.breatheAmt = 0.015 + Math.random() * 0.015;
        
        group.add(leaf);
      }
    }
  });
  
  return group;
}

// Build two hands reaching toward center
const leftHand = populateHandWithLeaves(buildHandSkeleton(-1), warmMat, -4.5);
const rightHand = populateHandWithLeaves(buildHandSkeleton(1), paleMat, 4.5);

scene.add(leftHand);
scene.add(rightHand);

// Subtle warm light from above-left (warmth of presence)
const light1 = new THREE.PointLight(0xf4a860, 0.8, 30);
light1.position.set(-6, 5, 4);
scene.add(light1);

// Cool dim light from right (absence, distance)
const light2 = new THREE.PointLight(0xb0c4d8, 0.3, 30);
light2.position.set(6, 3, 4);
scene.add(light2);

// Ambient base
const ambient = new THREE.AmbientLight(0x4a3a30, 0.4);
scene.add(ambient);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop() {
  const t = (performance.now() - start) / 1000;
  
  warmMat.uniforms.uTime.value = t;
  paleMat.uniforms.uTime.value = t;
  
  // Breathe: each leaf gently scales and rotates
  [leftHand, rightHand].forEach(hand => {
    hand.children.forEach(leaf => {
      const phase = leaf.userData.phase;
      const speed = leaf.userData.speed;
      const breathe = Math.sin(t * speed + phase) * leaf.userData.breatheAmt;
      
      leaf.scale.setScalar(leaf.scale.x * (1 + breathe * 0.5));
      leaf.rotation.y += breathe * 0.3;
    });
  });
  
  // Hands drift subtly closer and apart (the gap that remains)
  const drift = Math.sin(t * 0.15) * 0.08;
  leftHand.position.x = drift;
  rightHand.position.x = -drift;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
