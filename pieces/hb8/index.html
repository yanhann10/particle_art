<!doctype html>
<html lang="eng">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8bj → bistre · Judd stacks as sepia wash on paper</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#f4f1e8; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">hb8</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1e8); // aged paper substrate

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Lighting — soft ambient for ink wash feel
const ambLight = new THREE.AmbientLight(0x8a7d6f, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xa89f8e, 0.5);
dirLight.position.set(-8, 12, 6);
scene.add(dirLight);

// ── Deterministic RNG
let rngState = 41827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── JUDD STACKS → BISTRE WASH
// Preserve geometric intervals, translate aluminum to sepia ink
// Bistre = brown pigment from soot, used in ink wash drawing
// Strategy: bias particles to edges (pooling), restrained brown palette, fiber noise texture

const STACK_COUNT = 12;
const BOX_WIDTH = 6.5;
const BOX_HEIGHT = 0.65;
const BOX_DEPTH = 3.8;
const VERTICAL_INTERVAL = 1.45;

const PARTICLES_PER_BOX = 6500;
const totalParticles = STACK_COUNT * PARTICLES_PER_BOX;

const positions = new Float32Array(totalParticles * 3);
const colors = new Float32Array(totalParticles * 3);
const sizes = new Float32Array(totalParticles);
const edgeBias = new Float32Array(totalParticles); // for shader fiber noise

let pi = 0;

// Bistre palette: warm sepia browns, desaturated like aged ink
const baseHue = 0.08; // warm brown
const hueShift = 0.04;

for (let stackIdx = 0; stackIdx < STACK_COUNT; stackIdx++){
  const yBase = stackIdx * VERTICAL_INTERVAL - (STACK_COUNT * VERTICAL_INTERVAL) / 2 + 3.5;
  
  // Color per unit — subtle darkening down the stack (ink wash layers)
  const hue = baseHue + (stackIdx / STACK_COUNT) * hueShift;
  const sat = 0.25 - (stackIdx / STACK_COUNT) * 0.08;
  const light = 0.28 + Math.sin(stackIdx * 0.3) * 0.05;
  const col = new THREE.Color().setHSL(hue, sat, light);

  for (let i = 0; i < PARTICLES_PER_BOX; i++){
    const face = Math.floor(rng() * 6);
    let x, y, z;
    const hw = BOX_WIDTH / 2, hh = BOX_HEIGHT / 2, hd = BOX_DEPTH / 2;
    
    // BISTRE MORPH: bias particles toward edges (ink pooling at boundaries)
    const edgeProb = rng();
    const useEdge = edgeProb > 0.35; // 65% of particles near edges
    
    switch(face){
      case 0: // front
        x = useEdge ? (rng() < 0.5 ? -hw + rng()*0.4 : hw - rng()*0.4) : (rng() - 0.5) * BOX_WIDTH;
        y = yBase + (rng() - 0.5) * BOX_HEIGHT;
        z = hd;
        break;
      case 1: // back
        x = useEdge ? (rng() < 0.5 ? -hw + rng()*0.4 : hw - rng()*0.4) : (rng() - 0.5) * BOX_WIDTH;
        y = yBase + (rng() - 0.5) * BOX_HEIGHT;
        z = -hd;
        break;
      case 2: // top
        x = (rng() - 0.5) * BOX_WIDTH;
        y = yBase + hh;
        z = useEdge ? (rng() < 0.5 ? -hd + rng()*0.4 : hd - rng()*0.4) : (rng() - 0.5) * BOX_DEPTH;
        break;
      case 3: // bottom
        x = (rng() - 0.5) * BOX_WIDTH;
        y = yBase - hh;
        z = useEdge ? (rng() < 0.5 ? -hd + rng()*0.4 : hd - rng()*0.4) : (rng() - 0.5) * BOX_DEPTH;
        break;
      case 4: // left
        x = -hw;
        y = yBase + (useEdge ? (rng() < 0.5 ? -hh + rng()*0.3 : hh - rng()*0.3) : (rng() - 0.5) * BOX_HEIGHT);
        z = (rng() - 0.5) * BOX_DEPTH;
        break;
      case 5: // right
        x = hw;
        y = yBase + (useEdge ? (rng() < 0.5 ? -hh + rng()*0.3 : hh - rng()*0.3) : (rng() - 0.5) * BOX_HEIGHT);
        z = (rng() - 0.5) * BOX_DEPTH;
        break;
    }

    positions[pi * 3] = x;
    positions[pi * 3 + 1] = y;
    positions[pi * 3 + 2] = z;

    // Color variation — paper fiber absorbency variance
    const variance = 0.88 + rng() * 0.24;
    colors[pi * 3] = col.r * variance;
    colors[pi * 3 + 1] = col.g * variance;
    colors[pi * 3 + 2] = col.b * variance;

    // Edge distance for fiber noise modulation
    const edgeDist = Math.min(
      Math.abs(x - hw), Math.abs(x + hw),
      Math.abs(z - hd), Math.abs(z + hd)
    );
    edgeBias[pi] = 1.0 - Math.min(edgeDist / 0.8, 1.0);

    // Size variation — smaller particles, denser coverage for wash texture
    sizes[pi] = 0.014 + rng() * 0.008 + edgeBias[pi] * 0.004;

    pi++;
  }
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('edgeBias', new THREE.BufferAttribute(edgeBias, 1));

// Shader: ink wash on paper — soft edges, fiber noise texture
const vertexShader = `
attribute float size;
attribute float edgeBias;
varying vec3 vColor;
varying float vEdgeBias;

void main() {
  vColor = color;
  vEdgeBias = edgeBias;
  vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = size * 320.0 / -mvPosition.z;
  gl_Position = projectionMatrix * mvPosition;
}
`;

const fragmentShader = `
varying vec3 vColor;
varying float vEdgeBias;

// Simple hash for fiber noise
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main() {
  vec2 center = gl_PointCoord - vec2(0.5);
  float dist = length(center);
  if (dist > 0.5) discard;
  
  // Soft wash edge — no hard boundaries
  float alpha = smoothstep(0.5, 0.25, dist);
  
  // Paper fiber texture — more pronounced at edges where ink pools
  vec2 noiseCoord = gl_PointCoord * 8.0;
  float fiber = hash(floor(noiseCoord)) * 0.5 + hash(floor(noiseCoord * 2.3)) * 0.3;
  fiber = fiber * 0.2 + 0.8; // subtle texture
  
  // Edge pooling darkens and adds texture
  float pooling = vEdgeBias * 0.3;
  vec3 finalColor = vColor * fiber * (1.0 + pooling);
  
  // Reduce opacity to prevent hotspots, let paper show through
  float finalAlpha = alpha * (0.35 + vEdgeBias * 0.15);
  
  gl_FragColor = vec4(finalColor, finalAlpha);
}
`;

const material = new THREE.ShaderMaterial({
  vertexShader,
  fragmentShader,
  transparent: true,
  vertexColors: true,
  depthWrite: true,
  blending: THREE.NormalBlending
});

const points = new THREE.Points(geometry, material);
scene.add(points);

// ── Edge lines now rendered as subtle sepia ink strokes
const edgeGroup = new THREE.Group();
for (let stackIdx = 0; stackIdx < STACK_COUNT; stackIdx++){
  const yBase = stackIdx * VERTICAL_INTERVAL - (STACK_COUNT * VERTICAL_INTERVAL) / 2 + 3.5;
  const hw = BOX_WIDTH / 2, hh = BOX_HEIGHT / 2, hd = BOX_DEPTH / 2;
  
  const edgeGeo = new THREE.BufferGeometry();
  const edgeVerts = new Float32Array([
    // bottom rectangle
    -hw, yBase - hh, -hd,  hw, yBase - hh, -hd,
    hw, yBase - hh, -hd,  hw, yBase - hh, hd,
    hw, yBase - hh, hd,  -hw, yBase - hh, hd,
    -hw, yBase - hh, hd,  -hw, yBase - hh, -hd,
    // top rectangle
    -hw, yBase + hh, -hd,  hw, yBase + hh, -hd,
    hw, yBase + hh, -hd,  hw, yBase + hh, hd,
    hw, yBase + hh, hd,  -hw, yBase + hh, hd,
    -hw, yBase + hh, hd,  -hw, yBase + hh, -hd,
    // verticals
    -hw, yBase - hh, -hd,  -hw, yBase + hh, -hd,
    hw, yBase - hh, -hd,  hw, yBase + hh, -hd,
    hw, yBase - hh, hd,  hw, yBase + hh, hd,
    -hw, yBase - hh, hd,  -hw, yBase + hh, hd
  ]);
  edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgeVerts, 3));
  
  const edgeMat = new THREE.LineBasicMaterial({
    color: 0x4a3f32,
    transparent: true,
    opacity: 0.18
  });
  const edges = new THREE.LineSegments(edgeGeo, edgeMat);
  edgeGroup.add(edges);
}
scene.add(edgeGroup);

// ── Camera animation — slow vertical pan
const cameraStart = { y: -4, z: 28 };
const cameraEnd = { y: 12, z: 28 };
const panDuration = 18;

function updateCameraTarget(t){
  const progress = (t % panDuration) / panDuration;
  const ease = progress < 0.5 
    ? 2 * progress * progress 
    : 1 - Math.pow(-2 * progress + 2, 2) / 2;
  
  camera.position.y = cameraStart.y + (cameraEnd.y - cameraStart.y) * ease;
  camera.position.z = cameraStart.z + Math.sin(progress * Math.PI) * 2;
  
  const lookY = cameraStart.y + (cameraEnd.y - cameraStart.y) * ease;
  camera.lookAt(0, lookY, 0);
}

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  points.rotation.y = elapsed * 0.045;
  edgeGroup.rotation.y = elapsed * 0.045;

  updateCameraTarget(elapsed);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
