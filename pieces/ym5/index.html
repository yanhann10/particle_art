<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slow ink migration · differential growth with glacial color drift</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .breath { position:fixed; right:16px; bottom:12px; opacity:0.35; font-size: 10px; letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="id">ym5 · slow ink migration · differential growth with glacial color drift</div>
<div class="breath" id="breathCounter">breath 0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// SLOW ART mutation of 2iy: the differential growth occurs at 1/8th speed,
// making the form's expansion barely perceptible. The ink ribbon undergoes
// glacial color migration — five discrete ink tones (charcoal, sepia, indigo,
// rust, bone) that drift through the geometry over 90-120 seconds. Each vertex
// carries a hue-phase that advances imperceptibly. The viewer who stays sees
// the ink change from cold charcoal to warm rust and back. No camera motion.
// No sudden events. Pure material transformation in deep time.
//
// Breath counter increments every 4 seconds (resting breath rate ~15/min).

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.011);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 6, 16);
camera.lookAt(0, 5, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
document.body.appendChild(renderer.domElement);

// ─────────── differential growth (1/8th speed of 2iy)
const MAX_VERTS = 1600;
const ATTRACT   = 0.0075;   // 0.06 → 0.0075
const REPEL_R   = 0.46;
const REPEL_STR = 0.016;    // 0.13 → 0.016
const NOISE     = 0.0004;   // 0.003 → 0.0004
const PRESSURE  = 0.00035;  // 0.0028 → 0.00035
const RISE      = 0.00052;  // 0.0042 → 0.00052
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.5 + (Math.random() - 0.5) * 0.08;
  verts.push({ 
    x: Math.cos(th)*r, 
    y: 0, 
    z: Math.sin(th)*r, 
    age: 0,
    huePhase: Math.random() * Math.PI * 2  // each vert has independent color phase
  });
}

const CELL = REPEL_R, grid = new Map();
function key3(x, y, z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x, v.y, v.z);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  }
}
function neighbors(v){
  const cx = Math.floor(v.x/CELL), cy = Math.floor(v.y/CELL), cz = Math.floor(v.z/CELL);
  const out = [];
  for (let dx=-1; dx<=1; dx++) for (let dy=-1; dy<=1; dy++) for (let dz=-1; dz<=1; dz++){
    const arr = grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

function step(){
  const n = verts.length;
  if (n >= MAX_VERTS) return;
  rebuildGrid();
  const dx = new Float32Array(n), dy = new Float32Array(n), dz = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const v = verts[i];
    for (const j of neighbors(v)){
      if (j === i) continue;
      const u = verts[j];
      const ex = v.x - u.x, ey = v.y - u.y, ez = v.z - u.z;
      const d2 = ex*ex + ey*ey + ez*ez;
      if (d2 > REPEL_R*REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d/REPEL_R) / d;
      dx[i] += ex*f; dy[i] += ey*f; dz[i] += ez*f;
    }
  }
  for (let i = 0; i < n; i++){
    const a = verts[(i-1+n)%n], b = verts[(i+1)%n], v = verts[i];
    dx[i] += (a.x + b.x - 2*v.x) * ATTRACT;
    dy[i] += (a.y + b.y - 2*v.y) * ATTRACT;
    dz[i] += (a.z + b.z - 2*v.z) * ATTRACT;
  }
  let cx = 0, cy = 0, cz = 0;
  for (let i = 0; i < n; i++){ cx += verts[i].x; cy += verts[i].y; cz += verts[i].z; }
  cx /= n; cy /= n; cz /= n;
  for (let i = 0; i < n; i++){
    const ox = verts[i].x - cx, oy = verts[i].y - cy, oz = verts[i].z - cz;
    const d = Math.hypot(ox, oy, oz) + 1e-6;
    dx[i] += (ox/d) * PRESSURE;
    dy[i] += (oy/d) * PRESSURE * 0.4;
    dz[i] += (oz/d) * PRESSURE;
  }
  for (let i = 0; i < n; i++){
    const a = verts[i].age;
    const upward = RISE * (0.3 + 1.2 * Math.min(a * 1.5, 1.0));
    verts[i].x += dx[i] + (Math.random()-0.5)*NOISE;
    verts[i].y += dy[i] + (Math.random()-0.5)*NOISE * 0.5 + upward;
    verts[i].z += dz[i] + (Math.random()-0.5)*NOISE;
    verts[i].age += 0.00018;  // 0.0014 → 0.00018
    verts[i].huePhase += 0.00007;  // glacial color drift
  }
  const grown = [];
  for (let i = 0; i < n; i++){
    const a = verts[i], b = verts[(i+1)%n];
    grown.push(a);
    const ex = b.x-a.x, ey = b.y-a.y, ez = b.z-a.z;
    if (ex*ex + ey*ey + ez*ez > MAX_D*MAX_D && verts.length + grown.length < MAX_VERTS){
      grown.push({
        x:(a.x+b.x)*0.5, y:(a.y+b.y)*0.5 - 0.05, z:(a.z+b.z)*0.5,
        age: Math.max(a.age, b.age) * 0.5,
        huePhase: (a.huePhase + b.huePhase) * 0.5
      });
    }
  }
  verts.length = 0;
  for (const v of grown) verts.push(v);
}

// pre-grow to initial form
for (let s = 0; s < 850; s++) step();

// ─────────── five-ink palette (charcoal, sepia, indigo, rust, bone)
const INK_PALETTE = [
  new THREE.Color(0x1a1a1e),  // charcoal
  new THREE.Color(0x3d2817),  // sepia
  new THREE.Color(0x1a2333),  // indigo
  new THREE.Color(0x4a2c1a),  // rust
  new THREE.Color(0xd4cdb8)   // bone
];

function inkColor(phase){
  const normalized = (Math.sin(phase) + 1) * 0.5;  // 0..1
  const idx = normalized * (INK_PALETTE.length - 1);
  const i0 = Math.floor(idx), i1 = Math.ceil(idx);
  const t = idx - i0;
  return new THREE.Color().lerpColors(INK_PALETTE[i0], INK_PALETTE[i1 % INK_PALETTE.length], t);
}

let tubeMesh = null;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let breathCount = 0;
const breathCounter = document.getElementById('breathCounter');

function loop(){
  const elapsed = (performance.now() - start) * 0.001;
  
  // breath counter: increment every 4 seconds
  const newBreathCount = Math.floor(elapsed / 4);
  if (newBreathCount > breathCount){
    breathCount = newBreathCount;
    breathCounter.textContent = `breath ${breathCount}`;
  }

  step();

  if (verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x, v.y, v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const radiiList = new Array(N_SAMPLES);
    const colorList = new Array(N_SAMPLES);
    
    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const dt = 1 / N_SAMPLES;
      const t1 = curve.getTangent((t - dt + 1) % 1);
      const t2 = curve.getTangent(t);
      const t3 = curve.getTangent((t + dt) % 1);
      const cosAB = t1.dot(t2);
      const cosBC = t2.dot(t3);
      const curvature = (2 - cosAB - cosBC) * 0.5;
      const pressure = Math.min(1.0, curvature * 8);
      const r = 0.020 + 0.11 * pressure;
      radiiList[i] = r;

      // interpolate hue from nearest verts
      const nearestIdx = Math.floor(t * verts.length);
      const phase = verts[nearestIdx % verts.length].huePhase;
      colorList[i] = inkColor(phase);
    }

    const RADIAL = 6;
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const colors = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0, 1, 0);
    
    for (let i = 0; i < N_SAMPLES; i++){
      const t = i / N_SAMPLES;
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if (normal.lengthSq() < 0.001) normal.set(1, 0, 0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
      const r = radiiList[i];
      const col = colorList[i];
      
      for (let j = 0; j < RADIAL; j++){
        const ang = (j / RADIAL) * Math.PI * 2;
        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang) * r)
          .add(binormal.clone().multiplyScalar(Math.sin(ang) * r))
          .add(p);
        const idx = (i * RADIAL + j) * 3;
        positions[idx] = v.x;
        positions[idx + 1] = v.y;
        positions[idx + 2] = v.z;
        colors[idx] = col.r;
        colors[idx + 1] = col.g;
        colors[idx + 2] = col.b;
      }
    }
    
    for (let i = 0; i < N_SAMPLES; i++){
      const ni = (i + 1) % N_SAMPLES;
      for (let j = 0; j < RADIAL; j++){
        const nj = (j + 1) % RADIAL;
        const a = i * RADIAL + j, b = i * RADIAL + nj;
        const c = ni * RADIAL + j, d = ni * RADIAL + nj;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
    
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if (tubeMesh){ 
      scene.remove(tubeMesh); 
      tubeMesh.geometry.dispose();
      tubeMesh.material.dispose();
    }
    
    const mat = new THREE.MeshBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.92,
    });
    
    tubeMesh = new THREE.Mesh(g, mat);
    scene.add(tubeMesh);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
