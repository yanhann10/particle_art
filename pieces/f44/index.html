<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: calm -->
<title>f44 · woven absence — catenary threads</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#040404; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">f44</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);
scene.fog = new THREE.FogExp2(0x040404, 0.038);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x1a0808, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.4);
dirLight.position.set(-3, 5, 2);
scene.add(dirLight);

// ── RNG
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Sphere — luminous core
const sphereRadius = 1.8;
const sphereCenter = new THREE.Vector3(2.8, 0.6, -3.0);
const sphereGeo = new THREE.SphereGeometry(sphereRadius, 24, 16);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e8dc, emissive: 0xf0e8dc, emissiveIntensity: 0.75,
  roughness: 0.9, transparent: true, opacity: 0.3
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.copy(sphereCenter);
scene.add(sphere);

// ── Room + anchors
const ROOM = { w: 18, h: 12, d: 28 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPoint(){
  const face = Math.floor(rng()*6);
  let x,y,z;
  switch(face){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    case 5: z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

const NUM_ANCHORS = 700;
const anchors = [];
for (let i = 0; i < NUM_ANCHORS; i++){
  if (rng() < 0.35){
    const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
    const dist = sphereRadius + 0.1 + rng()*2.5;
    anchors.push(sphereCenter.clone().add(dir.multiplyScalar(dist)));
  } else {
    anchors.push(wallPoint());
  }
}

// ── Void zones (Tyler Hobbs) — cylindrical negative space
const voids = [];
for (let i = 0; i < 3; i++){
  voids.push({
    center: new THREE.Vector3(
      sphereCenter.x + (rng()-0.5)*8,
      sphereCenter.y + (rng()-0.5)*4,
      sphereCenter.z + (rng()-0.5)*8
    ),
    radius: 1.5 + rng()*1.2
  });
}
function inVoid(p){
  for (const v of voids){
    const dx = p.x - v.center.x, dz = p.z - v.center.z;
    if (dx*dx + dz*dz < v.radius*v.radius) return true;
  }
  return false;
}

// ── Build multi-segment catenary paths instead of straight lines
// Each "thread" is now 4-8 connected segments forming a sagging curve
function catenary(a, b, sag, segs){
  const pts = [];
  for (let i = 0; i <= segs; i++){
    const t = i / segs;
    const x = a.x*(1-t) + b.x*t;
    const y = a.y*(1-t) + b.y*t - sag * Math.sin(Math.PI * t);
    const z = a.z*(1-t) + b.z*t;
    pts.push(x, y, z);
  }
  return pts;
}

const allPositions = [];
const allColors = [];
let totalSegs = 0;

// Palette: deep crimson core, cooling to grey-violet at distance
const colWarm = new THREE.Color(0xc20018);
const colCool = new THREE.Color(0x8a7090);
const colPale = new THREE.Color(0xd4c8c0);
const tmpCol = new THREE.Color();

function threadColor(p){
  const d = p.distanceTo(sphereCenter);
  const t = Math.min(d / 14, 1);
  tmpCol.copy(colWarm).lerp(colCool, t * 0.6);
  // slight height tint — warmer above, cooler below
  if (p.y > sphereCenter.y) tmpCol.lerp(colPale, 0.15);
  return { r: tmpCol.r, g: tmpCol.g, b: tmpCol.b };
}

function addCatenaryThread(a, b, sag, segs){
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (inVoid(mid)) return false;
  const pts = catenary(a, b, sag, segs);
  for (let i = 0; i < segs; i++){
    const si = i * 3;
    const p = new THREE.Vector3(pts[si], pts[si+1], pts[si+2]);
    const c = threadColor(p);
    allPositions.push(pts[si], pts[si+1], pts[si+2]);
    allPositions.push(pts[si+3], pts[si+4], pts[si+5]);
    allColors.push(c.r, c.g, c.b, c.r, c.g, c.b);
    totalSegs++;
  }
  return true;
}

function sphereSurfacePoint(from, shortStop){
  const dir = sphereCenter.clone().sub(from).normalize();
  const r = shortStop
    ? sphereRadius * (1.08 + rng()*0.6)  // stop short (Quayola)
    : sphereRadius * (0.98 + rng()*0.04);
  return sphereCenter.clone().add(dir.multiplyScalar(-r));
}

// Cat A: wall-to-wall catenary threads (~35%)
const TARGET = 16000;
const catAn = Math.floor(TARGET * 0.35);
for (let i = 0, tries = 0; i < catAn && tries < catAn*3; tries++){
  const a = wallPoint(), b = wallPoint();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if (mid.distanceTo(sphereCenter) > 12 && rng() > 0.3) continue;
  const segs = 4 + Math.floor(rng()*4);
  const sag = 0.3 + rng()*0.8;
  if (addCatenaryThread(a, b, sag, segs)) i++;
}

// Cat B: anchor-to-sphere catenary threads (~35%), 8% stop short
const catBn = Math.floor(TARGET * 0.35);
for (let i = 0, tries = 0; i < catBn && tries < catBn*3; tries++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const shortStop = rng() < 0.08;
  const b = sphereSurfacePoint(a, shortStop);
  b.x += (rng()-0.5)*0.4; b.y += (rng()-0.5)*0.4; b.z += (rng()-0.5)*0.4;
  const segs = 3 + Math.floor(rng()*3);
  const sag = 0.15 + rng()*0.4;
  if (addCatenaryThread(a, b, sag, segs)) i++;
}

// Cat C: short local weave between nearby anchors (~22%)
const catCn = Math.floor(TARGET * 0.22);
for (let i = 0, tries = 0; i < catCn && tries < catCn*3; tries++){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if (bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if (d < bestDist && d > 0.2){ bestDist = d; best = anchors[bi]; }
  }
  if (!best) continue;
  const segs = 3 + Math.floor(rng()*2);
  const sag = 0.08 + rng()*0.25;
  if (addCatenaryThread(a, best, sag, segs)) i++;
}

// Cat D: suspension threads from ceiling (Saraceno) (~8%)
const catDn = Math.floor(TARGET * 0.08);
for (let i = 0; i < catDn; i++){
  const top = new THREE.Vector3(
    sphereCenter.x + (rng()-0.5)*6,
    hh,
    sphereCenter.z + (rng()-0.5)*6
  );
  const bottom = new THREE.Vector3(
    top.x + (rng()-0.5)*1.5,
    sphereCenter.y - 1 - rng()*3,
    top.z + (rng()-0.5)*1.5
  );
  addCatenaryThread(top, bottom, 0.05 + rng()*0.15, 5);
}

// Store base positions for breathing
const posArray = new Float32Array(allPositions);
const basePositions = new Float32Array(posArray);
const colArray = new Float32Array(allColors);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));

const lineMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.1,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Dark fragments caught in the web
const fragments = [];
for (let i = 0; i < 22; i++){
  const size = 0.04 + rng()*0.13;
  const geo = rng() > 0.5
    ? new THREE.BoxGeometry(size, size*(0.3+rng()*1.4), size*(0.3+rng()))
    : new THREE.TetrahedronGeometry(size, 0);
  const v = 0.03 + rng()*0.04;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(v, v*0.6, v*0.5),
    transparent: true, opacity: 0.5 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  const segI = Math.floor(rng()*totalSegs)*6;
  const t = rng();
  mesh.position.set(
    basePositions[segI]*(1-t) + basePositions[segI+3]*t,
    basePositions[segI+1]*(1-t) + basePositions[segI+4]*t,
    basePositions[segI+2]*(1-t) + basePositions[segI+5]*t
  );
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  scene.add(mesh);
  fragments.push(mesh);
}

// ── Camera path
const camPath = { radius: 6.5, height: 0.8, speed: 0.018, lookBias: new THREE.Vector3(0.5, 0.3, 0) };

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Breathing — subtle vertex drift
  const bAmp = 0.012, bFreq = 0.25;
  const arr = lineGeo.attributes.position.array;
  for (let i = 0; i < totalSegs * 6; i += 3){
    const bx = basePositions[i], by = basePositions[i+1], bz = basePositions[i+2];
    const phase = bx*0.7 + by*1.1 + bz*0.5;
    const b = Math.sin(elapsed*bFreq + phase) * bAmp;
    arr[i]   = bx + b;
    arr[i+1] = by + b*0.7;
    arr[i+2] = bz + b*0.5;
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Opacity pulse — the web breathes
  lineMat.opacity = 0.09 + Math.sin(elapsed * 0.15) * 0.03;

  // Camera drift inside the web
  const angle = elapsed * camPath.speed;
  camera.position.set(
    sphereCenter.x + Math.cos(angle) * camPath.radius,
    sphereCenter.y + camPath.height + Math.sin(elapsed*0.012)*1.5,
    sphereCenter.z + Math.sin(angle) * camPath.radius
  );
  const lookTarget = sphereCenter.clone();
  lookTarget.x += Math.sin(elapsed*0.04) * camPath.lookBias.x;
  lookTarget.y += Math.cos(elapsed*0.03) * camPath.lookBias.y;
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
