<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i4y · Chladni resonance plate</title>
<!-- MOTION: converge, intensity: vigorous -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0a; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">i4y</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 22, 0);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ── Lighting — single warm rim light from above-left
const ambLight = new THREE.AmbientLight(0x1a1412, 0.3);
scene.add(ambLight);
const rimLight = new THREE.DirectionalLight(0xffeacc, 1.2);
rimLight.position.set(-8, 12, 5);
scene.add(rimLight);

// ── The plate — dark metal square
const PLATE_SIZE = 16;
const plateGeo = new THREE.PlaneGeometry(PLATE_SIZE, PLATE_SIZE, 1, 1);
const plateMat = new THREE.MeshStandardMaterial({
  color: 0x1a1a1c,
  roughness: 0.7,
  metalness: 0.9,
  side: THREE.DoubleSide
});
const plate = new THREE.Mesh(plateGeo, plateMat);
plate.rotation.x = -Math.PI / 2;
scene.add(plate);

// ── Chladni eigenmode function
// u(x,y) = cos(m*pi*x/L)*cos(n*pi*y/L) - cos(n*pi*x/L)*cos(m*pi*y/L)
function chladniU(x, y, m, n, L){
  const px = Math.PI * x / L;
  const py = Math.PI * y / L;
  return Math.cos(m * px) * Math.cos(n * py) - Math.cos(n * px) * Math.cos(m * py);
}

// Gradient of |u| for particle migration
function chladniGrad(x, y, m, n, L, eps = 0.05){
  const u0 = Math.abs(chladniU(x, y, m, n, L));
  const ux = Math.abs(chladniU(x + eps, y, m, n, L));
  const uy = Math.abs(chladniU(x, y + eps, m, n, L));
  return {
    dx: (ux - u0) / eps,
    dy: (uy - u0) / eps
  };
}

// ── Particle system — sand grains
const NUM_PARTICLES = 50000;
const particles = [];
const particlePositions = new Float32Array(NUM_PARTICLES * 3);

// Initialize particles scattered uniformly on plate
let rngState = 81237465;
function rng(){
  rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

for (let i = 0; i < NUM_PARTICLES; i++){
  const x = (rng() - 0.5) * PLATE_SIZE * 0.96;
  const y = (rng() - 0.5) * PLATE_SIZE * 0.96;
  particles.push({
    x: x,
    y: y,
    vx: 0,
    vy: 0
  });
  const idx = i * 3;
  particlePositions[idx] = x;
  particlePositions[idx+1] = 0.02;
  particlePositions[idx+2] = y;
}

const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

const particleMat = new THREE.PointsMaterial({
  color: 0xe8dcc8,
  size: 0.08,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});
const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// ── Mode sequence — cycle through resonant frequencies
const modeSequence = [
  {m:2, n:2, duration:6},
  {m:3, n:2, duration:6},
  {m:3, n:3, duration:6},
  {m:4, n:2, duration:6},
  {m:4, n:3, duration:6},
  {m:5, n:2, duration:6},
  {m:4, n:4, duration:6},
  {m:5, n:3, duration:6},
  {m:6, n:2, duration:6},
  {m:5, n:4, duration:6}
];

let currentModeIndex = 0;
let modeStartTime = 0;
let currentMode = modeSequence[0];
let nextMode = modeSequence[1];
let modeTransition = 0; // 0=current, 1=next

// ── Physics simulation step
const DAMPING = 0.85;
const BROWNIAN_AMP = 0.015;
const MIGRATION_FORCE = 0.12;

function updateParticles(dt, m, n){
  const L = PLATE_SIZE;
  const halfL = L / 2;
  
  for (let i = 0; i < NUM_PARTICLES; i++){
    const p = particles[i];
    
    // Compute gradient — particles migrate downhill toward nodes
    const grad = chladniGrad(p.x, p.y, m, n, L);
    
    // Force toward nodal lines
    p.vx += -grad.dx * MIGRATION_FORCE * dt;
    p.vy += -grad.dy * MIGRATION_FORCE * dt;
    
    // Brownian jitter so particles don't perfectly collapse
    p.vx += (rng() - 0.5) * BROWNIAN_AMP;
    p.vy += (rng() - 0.5) * BROWNIAN_AMP;
    
    // Damping
    p.vx *= DAMPING;
    p.vy *= DAMPING;
    
    // Update position
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    
    // Boundary — reflect off plate edges
    const margin = halfL * 0.95;
    if (p.x < -margin) { p.x = -margin; p.vx *= -0.5; }
    if (p.x > margin) { p.x = margin; p.vx *= -0.5; }
    if (p.y < -margin) { p.y = -margin; p.vy *= -0.5; }
    if (p.y > margin) { p.y = margin; p.vy *= -0.5; }
    
    // Write to buffer
    const idx = i * 3;
    particlePositions[idx] = p.x;
    particlePositions[idx+1] = 0.02;
    particlePositions[idx+2] = p.y;
  }
  
  particleGeo.attributes.position.needsUpdate = true;
}

// ── Camera orbit
const CAM_RADIUS = 24;
const CAM_HEIGHT = 22;
const CAM_SPEED = 0.025;

// ── Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animate
const startTime = performance.now();
let lastTime = startTime;

function loop(now){
  const elapsed = (now - startTime) / 1000;
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  // Mode transition logic
  const modeElapsed = elapsed - modeStartTime;
  if (modeElapsed > currentMode.duration){
    currentModeIndex = (currentModeIndex + 1) % modeSequence.length;
    currentMode = modeSequence[currentModeIndex];
    nextMode = modeSequence[(currentModeIndex + 1) % modeSequence.length];
    modeStartTime = elapsed;
    modeTransition = 0;
  } else {
    // Smooth transition in last 1.5s of current mode
    const transitionStart = currentMode.duration - 1.5;
    if (modeElapsed > transitionStart){
      modeTransition = (modeElapsed - transitionStart) / 1.5;
    } else {
      modeTransition = 0;
    }
  }
  
  // Interpolate mode parameters
  const m = currentMode.m + (nextMode.m - currentMode.m) * modeTransition;
  const n = currentMode.n + (nextMode.n - currentMode.n) * modeTransition;
  
  // Update particle physics
  for (let step = 0; step < 3; step++){
    updateParticles(dt / 3, m, n);
  }
  
  // Camera orbit — slow, high, looking down at plate
  const angle = elapsed * CAM_SPEED;
  camera.position.set(
    Math.cos(angle) * CAM_RADIUS,
    CAM_HEIGHT + Math.sin(elapsed * 0.08) * 1.5,
    Math.sin(angle) * CAM_RADIUS
  );
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(startTime);
</script>
</body>
</html>
