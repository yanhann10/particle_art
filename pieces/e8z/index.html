<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e8z · Shiota — After the Dream</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }

<body>
<div class="id">e8z</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.003);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.02));
const pL = new THREE.PointLight(0xffd0a0, 0.035, 50, 1.8);
pL.position.set(-4, 18, 3);
scene.add(pL);

let seed = 73920164;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

const ROOM = { w: 40, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED DRESS — the absent body, presence-in-absence
// Shiota's signature: the garment remembers the person who wore it
const dressCenter = new THREE.Vector3(0, 1.0, 0);
const BODICE_H = 1.4, BODICE_R = 0.32;
const SKIRT_H = 2.6, SKIRT_R_TOP = 0.32, SKIRT_R_BOT = 1.35;
const DRESS_TOP = dressCenter.y + BODICE_H;
const DRESS_BOT = dressCenter.y - SKIRT_H;

// Bodice — narrow cylinder
const bodiceMat = new THREE.MeshStandardMaterial({
  color: 0xf0e6d8, emissive: 0xeadcc8, emissiveIntensity: 0.55,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide
});
const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(BODICE_R * 0.7, BODICE_R, BODICE_H, 12, 1, true),
  bodiceMat
);
bodice.position.set(dressCenter.x, dressCenter.y + BODICE_H * 0.5, dressCenter.z);
scene.add(bodice);

// Skirt — flared cone
const skirtMat = new THREE.MeshStandardMaterial({
  color: 0xede0d0, emissive: 0xe8d8c4, emissiveIntensity: 0.5,
  roughness: 0.96, metalness: 0.0, transparent: true, opacity: 0.18,
  side: THREE.DoubleSide
});
const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(SKIRT_R_TOP, SKIRT_R_BOT, SKIRT_H, 16, 1, true),
  skirtMat
);
skirt.position.set(dressCenter.x, dressCenter.y - SKIRT_H * 0.5, dressCenter.z);
scene.add(skirt);

// Inner luminance
const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xfcf0e0, transparent: true, opacity: 0.03 })
);
innerGlow.position.copy(dressCenter);
scene.add(innerGlow);

// Hanger — thin dark lines from ceiling
const hangerPts = [];
const hangerW = 0.55;
// Two shoulder lines + center hook
hangerPts.push(
  dressCenter.x, DRESS_TOP + 0.15, dressCenter.z,
  dressCenter.x, hh, dressCenter.z,
  dressCenter.x - hangerW, DRESS_TOP, dressCenter.z,
  dressCenter.x, DRESS_TOP + 0.15, dressCenter.z,
  dressCenter.x + hangerW, DRESS_TOP, dressCenter.z,
  dressCenter.x, DRESS_TOP + 0.15, dressCenter.z
);
const hangerGeo = new THREE.BufferGeometry();
hangerGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(hangerPts), 3));
scene.add(new THREE.LineSegments(hangerGeo, new THREE.LineBasicMaterial({
  color: 0x100606, transparent: true, opacity: 0.5
})));

// ── DRESS SURFACE SAMPLER
function dressSurf(){
  const t = rng();
  let y, r;
  if(t < 0.35){
    // Bodice
    y = dressCenter.y + rng() * BODICE_H;
    const bt = (y - dressCenter.y) / BODICE_H;
    r = BODICE_R * (1.0 - bt * 0.3);
  } else {
    // Skirt
    y = dressCenter.y - rng() * SKIRT_H;
    const st = (dressCenter.y - y) / SKIRT_H;
    r = SKIRT_R_TOP + (SKIRT_R_BOT - SKIRT_R_TOP) * st;
  }
  const a = rng() * Math.PI * 2;
  return new THREE.Vector3(
    dressCenter.x + Math.cos(a) * r,
    y,
    dressCenter.z + Math.sin(a) * r
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — truncated icosahedron vertices projected into room volume
// (Manfred Mohr: let geometry generate the topology)
const anchors = [];

// Golden ratio icosahedron base vertices, scaled to shells
const phi = (1 + Math.sqrt(5)) / 2;
const icoBase = [
  [-1, phi, 0],[1, phi, 0],[-1,-phi, 0],[1,-phi, 0],
  [0,-1, phi],[0, 1, phi],[0,-1,-phi],[0, 1,-phi],
  [phi, 0,-1],[phi, 0, 1],[-phi, 0,-1],[-phi, 0, 1]
];

const shellRadii = [3.0, 5.5, 8.5, 12, 16];
for(const sr of shellRadii){
  for(const v of icoBase){
    const len = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
    const r = sr * (0.88 + rng()*0.24);
    anchors.push(new THREE.Vector3(
      dressCenter.x + v[0]/len * r + (rng()-0.5)*0.8,
      dressCenter.y + v[1]/len * r * 0.82 + (rng()-0.5)*0.5,
      dressCenter.z + v[2]/len * r + (rng()-0.5)*0.8
    ));
  }
  // Extra scatter per shell
  const extra = Math.floor(6 + sr * 1.5);
  for(let i = 0; i < extra; i++){
    const u = rng() * Math.PI * 2;
    const v = Math.acos(2*rng()-1);
    const r = sr * (0.85 + rng()*0.3);
    anchors.push(new THREE.Vector3(
      dressCenter.x + Math.sin(v)*Math.cos(u) * r,
      dressCenter.y + Math.sin(v)*Math.sin(u) * r * 0.82,
      dressCenter.z + Math.cos(v) * r
    ));
  }
}

// Wall-biased architectural anchors
while(anchors.length < 480){
  const p = rng() < 0.25 ? wallPt() : wallPt().lerp(dressCenter, 0.02 + rng()*0.15);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [
  { pos: new THREE.Vector3(dressCenter.x - 4, dressCenter.y - 6, dressCenter.z + 5), r: 2.5 },
  { pos: new THREE.Vector3(dressCenter.x + 5, dressCenter.y + 4, dressCenter.z - 4), r: 2.0 },
  { pos: new THREE.Vector3(dressCenter.x + 2, dressCenter.y - 7, dressCenter.z - 5), r: 2.8 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// ── BUILD THREADS — two rules only (Casey Reas simplification)
// Rule 1: anchor-to-nearest-dress-surface
// Rule 2: anchor-to-anchor if within threshold
// Density emerges from proximity alone.
const NUM_LINES = 16000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-dressCenter.x)**2+(my-dressCenter.y)**2+(mz-dressCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// Rule 1: CONVERGENCE — every thread remembers the absent body
// Threads reach for the dress the way memory reaches for a person
const catA = Math.floor(NUM_LINES * 0.52);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let origin;
  if(rng() < 0.5){
    origin = anchors[Math.floor(rng()*anchors.length)];
  } else {
    origin = wallPt();
  }
  if(inVoid(origin)){ i--; continue; }
  const target = dressSurf();

  // 12% stop short — threads that almost reach the body but can't
  // the distance between remembering and touching
  if(rng() < 0.12){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.2 + rng() * 1.0;
    const stopped = target.clone().add(dir.multiplyScalar(gap));
    setLine(origin, stopped, 0);
  } else {
    setLine(origin, target, 0);
  }
}

// Rule 2: PROXIMITY — anchor-to-anchor within threshold
// Connective tissue: the web is not just about the center, it's about relation
const THRESH = 5.5;
const catBtarget = Math.floor(NUM_LINES * 0.34);
let catBcount = 0, attempts = 0;
while(catBcount < catBtarget && li < NUM_LINES && attempts < 80000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.5 && d < THRESH){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;
  setLine(a, best, 1);
  catBcount++;
}

// Fill remainder: architectural wall-to-dress or wall-to-wall
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.35 ? dressSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b, 2);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Per-vertex color — opacity layering by category
// convergence: brightest red, proximity: mid, architectural: faintest
const catOpacity = [0.075, 0.045, 0.025];
const colors = new Float32Array(li * 6);
const bR = 0xc2/255, bG = 0x00/255, bB = 0x18/255;
for(let i = 0; i < li; i++){
  const cat = lineCat[i];
  const op = catOpacity[cat] || 0.025;
  const bright = op / 0.075;
  for(let v = 0; v < 2; v++){
    colors[i*6+v*3]   = bR * bright;
    colors[i*6+v*3+1] = bG * bright;
    colors[i*6+v*3+2] = bB * bright;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, stones, caught memories
const NUM_FRAGMENTS = 22;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.06;
  const fGeo = new THREE.BufferGeometry();
  const w = sz * (0.4 + rng()*0.6);
  const h = sz * (0.5 + rng()*0.8);
  const verts = new Float32Array([
    w*(-0.3+rng()*0.15), h*0.5, 0,
    -w*0.5, h*(-0.1+rng()*0.06), 0,
    w*(0.12-rng()*0.2), -h*0.5, 0,
    w*(-0.3+rng()*0.15), h*0.5, 0,
    w*(0.2+rng()*0.25), h*(rng()*0.04), 0,
    w*(0.12-rng()*0.2), -h*0.5, 0
  ]);
  fGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.005 + rng()*0.012;
  const fMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.03, d*0.01),
    transparent: true,
    opacity: 0.12 + rng()*0.18,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(fGeo, fMat);

  if(rng() < 0.55){
    const si = Math.floor(rng()*li)*6;
    const t = 0.2 + rng()*0.6;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(dressCenter).add(dir.multiplyScalar(2.0 + rng()*5.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — narrative: begin below the hem looking up through the web,
// rise slowly past the skirt, the bodice, the hanger — the absent body
// revealed from feet to shoulders — then pull back to see the whole web
// as a nervous system around an empty silhouette.
const pathLen = 1800;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = dressCenter.x, cy = dressCenter.y, cz = dressCenter.z;

  let rH, y;
  if(t < 0.3){
    // Phase 1: below the hem, looking up into the skirt's red halo
    const lt = t / 0.3;
    rH = 6.0 + Math.sin(lt * Math.PI * 0.5) * 0.5;
    y = DRESS_BOT - 2.0 + lt * 3.5;
  } else if(t < 0.55){
    // Phase 2: rising past the dress — intimate, close
    const lt = (t - 0.3) / 0.25;
    rH = 5.5 - lt * 1.0;
    y = cy - 1.0 + lt * 3.5;
  } else if(t < 0.78){
    // Phase 3: at shoulder height, slow orbit — seeing the web converge
    const lt = (t - 0.55) / 0.23;
    rH = 4.5 + Math.sin(lt * Math.PI) * 0.6;
    y = cy + 2.5 + Math.sin(lt * Math.PI) * 1.0;
  } else {
    // Phase 4: pulling back — the whole circulatory cosmos revealed
    const lt = (t - 0.78) / 0.22;
    rH = 5.5 + lt * 4.5;
    y = cy + 3.0 + lt * 3.5 + Math.sin(lt * Math.PI) * 1.5;
  }

  const x = cx + Math.sin(p * 1.08) * rH + Math.cos(p * 0.35 + 1.1) * 0.3;
  const z = cz + Math.cos(p * 1.08) * (rH * 1.03) + Math.sin(p * 0.4 + 0.5) * 0.25;

  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible sway, the web inhales
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0001 * Math.max(0, 1.0 - dist / 20.0);
    const phase = basePositions[idx]*0.12 + basePositions[idx+1]*0.1 + i*0.00025;
    const breath = Math.sin(t*0.007 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.18;
      arr[vi+1] = basePositions[vi+1] + breath*0.08;
      arr[vi+2] = basePositions[vi+2] + breath*0.15;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera along path
  const speed = 0.0003;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward the dress center — the absent body
  const look = dressCenter.clone();
  look.x += Math.sin(t*0.0008)*0.025;
  look.y += Math.cos(t*0.0006)*0.018 + 0.1;
  look.z += Math.sin(t*0.001)*0.02;
  camera.lookAt(look);

  // Subtle light drift
  pL.position.x = -4 + Math.sin(t*0.0004)*0.08;
  pL.position.y = 18 + Math.cos(t*0.00025)*0.04;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
