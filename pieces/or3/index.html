<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>or3 · audio-reactive shells</title>
<!-- MOTION: pulsation, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0410; overflow:hidden;
               color:#e5d6f0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.7; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #150a25; color:#e5d6f0; border:1px solid #4a2a6a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; z-index: 10; }
  button.start:hover { background:#22113a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · clap, sing, hum</button>
<div class="id">or3</div>
<div class="hint" id="hint"></div>
<script type="importmap">
{ "imports": { 
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1.2, 4.5);
camera.lookAt(0, 1, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0410, 1);
document.body.appendChild(renderer.domElement);

// 5 concentric "shells" of particles, each shell tuned to a frequency band
const SHELLS = 5;
const PER_SHELL = 4000;
const N = SHELLS * PER_SHELL;
const positions = new Float32Array(N * 3);
const shellIdx  = new Float32Array(N);
const seeds     = new Float32Array(N);
for (let s = 0; s < SHELLS; s++) {
  for (let i = 0; i < PER_SHELL; i++) {
    const idx = s * PER_SHELL + i;
    const r = 1.8 + s * 0.7;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2*Math.random()-1);
    positions[idx*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[idx*3+1] = r * Math.sin(phi) * Math.sin(theta) + 1.0;
    positions[idx*3+2] = r * Math.cos(phi);
    shellIdx[idx] = s;
    seeds[idx]    = Math.random();
  }
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('shellIdx', new THREE.BufferAttribute(shellIdx, 1));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const uBands = new THREE.Vector4(0,0,0,0);
const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBands: { value: uBands },
  uTreble: { value: 0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec4  uBands;
    uniform float uTreble;
    attribute float shellIdx;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      float e;
      if (shellIdx < 0.5)      e = uBands.x;
      else if (shellIdx < 1.5) e = uBands.y;
      else if (shellIdx < 2.5) e = uBands.z;
      else if (shellIdx < 3.5) e = uBands.w;
      else                     e = uTreble;
      vEnergy = e;

      vec3 p = position;
      float r = length(p - vec3(0, 1, 0));
      vec3 dir = (p - vec3(0, 1, 0)) / max(r, 0.001);
      float pulse = 1.0 + e * 0.9;
      p = vec3(0, 1, 0) + dir * r * pulse;

      float t = uTime * 0.4 + seed * 6.28 + shellIdx * 0.7;
      vec3 perp = normalize(cross(dir, vec3(0,1,0) + 0.1*sin(seed*9.0)));
      p += perp * sin(t) * (0.4 + e * 1.2);

      vec3 amber = vec3(0.98, 0.68, 0.22);
      vec3 cyan = vec3(0.25, 0.85, 0.95);
      float k = clamp(shellIdx / 4.0 + e * 0.4, 0.0, 1.0);
      vCol = mix(amber, cyan, k);
      vCol *= (0.6 + e * 1.4);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 2.4 * e) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// Load CesiumMan model
let model = null;
const loader = new GLTFLoader();
loader.load(
  'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb',
  (gltf) => {
    model = gltf.scene;
    model.position.set(0, 0, 0);
    
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.0 / maxDim;
    model.scale.setScalar(scale);
    model.position.sub(center.multiplyScalar(scale));
    model.position.y += 0.05;
    
    model.traverse(child => {
      if (child.isMesh) {
        child.material = new THREE.MeshBasicMaterial({
          color: 0x150520,
          transparent: true,
          opacity: 0.85
        });
      }
    });
    scene.add(model);
  },
  undefined,
  (error) => {
    console.warn('GLTF load failed, creating fallback geometry');
    const fallbackGeom = new THREE.CapsuleGeometry(0.3, 1.2, 8, 16);
    const fallbackMat = new THREE.MeshBasicMaterial({
      color: 0x150520,
      transparent: true,
      opacity: 0.85
    });
    model = new THREE.Mesh(fallbackGeom, fallbackMat);
    model.position.set(0, 1, 0);
    scene.add(model);
  }
);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hint = document.getElementById('hint');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null;
async function startAudio(){
  startBtn.style.display = 'none';
  hint.textContent = 'requesting mic…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hint.textContent = 'live · 5 frequency shells';
  } catch (e) {
    hint.textContent = 'mic denied — passive synthetic mode';
  }
}
startBtn.addEventListener('click', startAudio);

function bandEnergy(arr, lo, hi){
  let s = 0;
  for (let i = lo; i < hi; i++) s += arr[i];
  return (s / (hi-lo)) / 255;
}

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (analyser){
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    uBands.x = bandEnergy(freqData, 0, Math.floor(n*0.04));
    uBands.y = bandEnergy(freqData, Math.floor(n*0.04), Math.floor(n*0.12));
    uBands.z = bandEnergy(freqData, Math.floor(n*0.12), Math.floor(n*0.30));
    uBands.w = bandEnergy(freqData, Math.floor(n*0.30), Math.floor(n*0.55));
    uniforms.uTreble.value = bandEnergy(freqData, Math.floor(n*0.55), n);
  } else {
    uBands.x = 0.35 + 0.35 * Math.sin(t*1.3);
    uBands.y = 0.30 + 0.30 * Math.sin(t*2.1 + 1.1);
    uBands.z = 0.25 + 0.25 * Math.sin(t*3.0 + 2.0);
    uBands.w = 0.20 + 0.20 * Math.sin(t*4.7 + 0.4);
    uniforms.uTreble.value = 0.18 + 0.18 * Math.sin(t*7.0);
  }

  if (model) {
    const avgEnergy = (uBands.x + uBands.y + uBands.z + uBands.w + uniforms.uTreble.value) / 5;
    model.rotation.y = t * 0.3;
    const breathScale = 1.0 + avgEnergy * 0.15;
    model.scale.setScalar(2.0 * breathScale / 1.8);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
