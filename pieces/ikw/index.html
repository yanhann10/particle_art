<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ikw · lorenz attractor (hand-drawn)</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">ikw</div>
<div class="hint">σ ρ β · move pointer to nudge parameters</div>
<div class="src">naïve attractor · hand-tremor imperfection</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0b0e, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  const jit = (Math.random() * 2 - 1) * 1.8;
  init[i*4]   = (Math.random()*2-1) * 7.5 + jit;
  init[i*4+1] = (Math.random()*2-1) * 7.5 + jit * 0.7;
  init[i*4+2] = (Math.random()*2-1) * 7.5 + 25.0 + jit * 1.2;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev: { value: rtA.texture },
  uDt:    { value: 0.005 },
  uSigma: { value: 10.0 },
  uRho:   { value: 28.0 },
  uBeta:  { value: 8.0/3.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt;
    uniform float uSigma;
    uniform float uRho;
    uniform float uBeta;
    varying vec2 vUv;
    
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      
      float h = hash(vUv * 1000.0 + age);
      float jitterScale = 0.09;
      
      vec3 dp = vec3(
        uSigma * (p.y - p.x),
        p.x * (uRho - p.z) - p.y,
        p.x * p.y - uBeta * p.z
      );
      
      vec3 jitter = vec3(
        (h - 0.5) * jitterScale,
        (fract(h * 7.919) - 0.5) * jitterScale,
        (fract(h * 13.457) - 0.5) * jitterScale
      );
      
      p += dp * uDt + jitter;
      age = mod(age + uDt * 0.05, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 82);
camera.lookAt(0, 0, 25);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
const sizeVariance = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
  
  const r = Math.random();
  if (r < 0.003) {
    sizeVariance[i] = 5.5 + Math.random() * 4.5;
  } else if (r < 0.02) {
    sizeVariance[i] = 2.2 + Math.random() * 2.0;
  } else {
    sizeVariance[i] = 0.7 + Math.random() * 0.6;
  }
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));
pointsGeom.setAttribute('aSize',    new THREE.BufferAttribute(sizeVariance, 1));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:  { value: rtB.texture },
    uPixel: { value: renderer.getPixelRatio() },
    uTime:  { value: 0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    uniform float uTime;
    attribute vec2 uvIdx;
    attribute float aSize;
    varying float vAge;
    varying float vSpeed;
    varying float vSize;
    
    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      
      float h = hash(uvIdx * 1000.0);
      float jit = (h - 0.5) * 0.35;
      
      float speed = length(vec3(
        10.0 * (p.y - p.x),
        p.x * 28.0 - p.y - p.x*p.z,
        p.x * p.y - (8.0/3.0) * p.z
      )) * 0.005;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vSize = aSize;

      p.z -= 25.0;
      p.x += jit * 2.5;
      p.y += jit * 2.2;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = aSize * (1.0 + 1.4 * vSpeed) * uPixel * (55.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    varying float vSize;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      
      float edge = vSize > 3.0 ? 0.18 : 0.25;
      if (r > edge) discard;
      
      float a = vSize > 3.0 ? exp(-r * 8.0) : exp(-r * 16.0);
      
      vec3 a_col = vec3(0.18, 0.30, 0.82);
      vec3 b_col = vec3(0.88, 0.28, 0.58);
      vec3 c_col = vec3(0.96, 0.84, 0.46);
      
      float k = mod(vAge + vSpeed * 0.5, 1.0);
      vec3 col = mix(a_col, b_col, smoothstep(0.0, 0.5, k));
      col = mix(col, c_col, smoothstep(0.5, 1.0, k));
      
      float brightness = vSize > 3.0 ? 0.8 : (0.35 + vSpeed * 0.85);
      gl_FragColor = vec4(col * a * brightness, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const target = { sigma: 10.0, rho: 28.0, beta: 8.0/3.0 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.rho   = 28.0 + ny * 6.5;
  target.sigma = 10.0 + nx * 2.8;
});

let lastTime = performance.now();
function loop(){
  const now = performance.now();
  const t = (now - lastTime) / 1000; lastTime = now;
  
  simUniforms.uSigma.value += (target.sigma - simUniforms.uSigma.value) * 0.05;
  simUniforms.uRho.value   += (target.rho   - simUniforms.uRho.value)   * 0.05;

  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;
  pointsMat.uniforms.uTime.value = now / 1000;
  
  const ang = now * 0.00011;
  const wobble = Math.sin(now * 0.0007) * 3.5;
  camera.position.x = Math.sin(ang) * 82 + wobble;
  camera.position.z = Math.cos(ang) * 82;
  camera.position.y = Math.sin(now * 0.00023) * 4.5;
  camera.lookAt(0, wobble * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
