<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8aa · substrate maze · algorithmic growth</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#09090e; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">8aa</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────────────────────────────────────────────────────────
   Jared Tarbell's Substrate (2003)
   Lines spawn from edges & occupied cells, grow forward,
   die at intersections, spawn perpendicular children.
   Rendered as warm particle clusters per crack generation.
   ─────────────────────────────────────────────────────────── */

const GW = 520, GH = 520;
const grid = new Int16Array(GW * GH).fill(-1);     // angle or -1
const MAX_CRACKS   = 220;
const MAX_PTS      = 180000;
const SCALE        = 0.038;
const OX = -GW * SCALE * 0.5, OZ = -GH * SCALE * 0.5;

// ── Crack class ──
const cracks = [];
let globalGen = 0;

class Crack {
  constructor(x, y, angle, gen) {
    this.x = x; this.y = y;
    this.angle = angle;
    this.gen = gen;
    this.alive = true;
    this.age = 0;
  }
  move() {
    if (!this.alive) return false;
    this.age++;
    const rad = this.angle * Math.PI / 180;
    this.x += Math.cos(rad) * 0.42;
    this.y += Math.sin(rad) * 0.42;
    const ix = Math.round(this.x), iy = Math.round(this.y);
    if (ix < 1 || ix >= GW - 1 || iy < 1 || iy >= GH - 1) {
      this.alive = false; return false;
    }
    const idx = iy * GW + ix;
    if (grid[idx] >= 0) {
      if (Math.abs(grid[idx] - (this.angle % 360)) > 5) {
        this.alive = false;
        trySpawn(ix, iy, this.angle + 90, this.gen + 1);
        if (Math.random() < 0.55)
          trySpawn(ix, iy, this.angle - 90, this.gen + 1);
        return false;
      }
    }
    grid[idx] = ((this.angle % 360) + 360) % 360;
    return true;   // grew
  }
}

function trySpawn(x, y, angle, gen) {
  const alive = cracks.reduce((s, c) => s + (c.alive ? 1 : 0), 0);
  if (alive >= MAX_CRACKS) return;
  const base = Math.round(angle / 90) * 90;
  const a = base + (Math.random() - 0.5) * 3.6;
  cracks.push(new Crack(x, y, a, gen));
  globalGen = Math.max(globalGen, gen);
}

// ── Seed from edges ──
for (let i = 0; i < 10; i++) {
  const side = i % 4;
  let x, y, a;
  if (side === 0)      { x = 0;      y = Math.random() * GH; a = 0;   }
  else if (side === 1) { x = GW - 1; y = Math.random() * GH; a = 180; }
  else if (side === 2) { x = Math.random() * GW; y = 0;      a = 90;  }
  else                 { x = Math.random() * GW; y = GH - 1; a = 270; }
  trySpawn(x, y, a, 0);
}
// A few interior seeds
for (let i = 0; i < 4; i++) {
  trySpawn(GW * 0.25 + Math.random() * GW * 0.5,
           GH * 0.25 + Math.random() * GH * 0.5,
           Math.floor(Math.random() * 4) * 90, 0);
}

// ── Three.js setup ──
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 18, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x09090e, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0.4, 0);

// ── Palette: sand → terracotta → dusty slate ──
const palA = new THREE.Color(0xd9b27a);  // warm sand
const palB = new THREE.Color(0xc48a5c);  // amber
const palC = new THREE.Color(0x9b5e42);  // terracotta
const palD = new THREE.Color(0x6e7f8d);  // cool slate

function genColor(gen, jitter) {
  const t = Math.min(gen / Math.max(globalGen, 4), 1);
  const c = new THREE.Color();
  if (t < 0.33)      c.lerpColors(palA, palB, t * 3);
  else if (t < 0.66) c.lerpColors(palB, palC, (t - 0.33) * 3);
  else                c.lerpColors(palC, palD, (t - 0.66) * 3);
  c.r += (Math.random() - 0.5) * 0.07 * jitter;
  c.g += (Math.random() - 0.5) * 0.05 * jitter;
  c.b += (Math.random() - 0.5) * 0.05 * jitter;
  return c;
}

// ── Particle buffers (pre-allocated) ──
const posArr  = new Float32Array(MAX_PTS * 3);
const colArr  = new Float32Array(MAX_PTS * 3);
const sizeArr = new Float32Array(MAX_PTS);
let ptCount = 0;

function emitParticle(wx, wy, wz, gen) {
  if (ptCount >= MAX_PTS) return;
  const i = ptCount++;
  posArr[i * 3]     = wx;
  posArr[i * 3 + 1] = wy;
  posArr[i * 3 + 2] = wz;
  const c = genColor(gen, 1);
  colArr[i * 3]     = c.r;
  colArr[i * 3 + 1] = c.g;
  colArr[i * 3 + 2] = c.b;
  sizeArr[i] = 1.2 + Math.random() * 1.6;
}

function emitCluster(gx, gy, gen) {
  const wx = gx * SCALE + OX;
  const wz = gy * SCALE + OZ;
  const wy = gen * 0.06 + (Math.random() - 0.5) * 0.04;
  emitParticle(wx, wy, wz, gen);
  const extras = 1 + Math.floor(Math.random() * 2);
  for (let e = 0; e < extras; e++) {
    emitParticle(
      wx + (Math.random() - 0.5) * 0.1,
      wy + (Math.random() - 0.5) * 0.06,
      wz + (Math.random() - 0.5) * 0.1,
      gen
    );
  }
}

// ── Particle shader ──
const ptMat = new THREE.ShaderMaterial({
  vertexShader: `
    attribute float aSize;
    varying vec3 vColor;
    varying float vFog;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = aSize * (220.0 / -mv.z);
      gl_PointSize = max(gl_PointSize, 1.0);
      gl_Position = projectionMatrix * mv;
      vFog = smoothstep(5.0, 40.0, -mv.z);
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vFog;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      if (d > 1.0) discard;
      float alpha = smoothstep(1.0, 0.2, d) * 0.82;
      vec3 fogCol = vec3(0.035, 0.035, 0.055);
      vec3 c = mix(vColor, fogCol, vFog * 0.85);
      alpha *= (1.0 - vFog * 0.7);
      gl_FragColor = vec4(c, alpha);
    }
  `,
  transparent: true,
  vertexColors: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const ptGeo = new THREE.BufferGeometry();
ptGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3).setUsage(THREE.DynamicDrawUsage));
ptGeo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3).setUsage(THREE.DynamicDrawUsage));
ptGeo.setAttribute('aSize',    new THREE.BufferAttribute(sizeArr, 1).setUsage(THREE.DynamicDrawUsage));
ptGeo.setDrawRange(0, 0);
const ptsMesh = new THREE.Points(ptGeo, ptMat);
scene.add(ptsMesh);

// ── Dust motes ──
const DUST = 600;
const dustPos = new Float32Array(DUST * 3);
const dustCol = new Float32Array(DUST * 3);
const dustSz  = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) {
  dustPos[i * 3]     = (Math.random() - 0.5) * 22;
  dustPos[i * 3 + 1] = Math.random() * 8 - 0.5;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 22;
  const b = 0.22 + Math.random() * 0.15;
  dustCol[i * 3] = b * 1.15; dustCol[i * 3 + 1] = b; dustCol[i * 3 + 2] = b * 0.9;
  dustSz[i] = 0.3 + Math.random() * 0.5;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute('color',    new THREE.BufferAttribute(dustCol, 3));
dustGeo.setAttribute('aSize',    new THREE.BufferAttribute(dustSz, 1));
scene.add(new THREE.Points(dustGeo, ptMat));

// ── Ground horizon gradient (fullscreen quad behind everything) ──
const bgMat = new THREE.ShaderMaterial({
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float t = vUv.y;
      vec3 lo = vec3(0.06, 0.045, 0.04);
      vec3 hi = vec3(0.035, 0.035, 0.055);
      vec3 c = mix(lo, hi, smoothstep(0.15, 0.7, t));
      gl_FragColor = vec4(c, 1.0);
    }
  `,
  depthWrite: false, depthTest: false,
});
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bgQuad.frustumCulled = false;
bgQuad.renderOrder = -1;
scene.add(bgQuad);

// ── Ground plane for subtle reflection ──
const floorMat = new THREE.MeshBasicMaterial({
  color: 0x0f0f16, transparent: true, opacity: 0.35,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(28, 28), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
scene.add(floor);

// ── Pre-run substrate so there's something on screen at t=0 ──
let preSteps = 0;
const PRE = 6000;
function substrateBatch(n) {
  for (let s = 0; s < n; s++) {
    for (const c of cracks) {
      if (c.alive && c.move()) {
        emitCluster(c.x, c.y, c.gen);
      }
    }
    // Respawn if needed
    const alive = cracks.reduce((a, c) => a + (c.alive ? 1 : 0), 0);
    if (alive < 3 && cracks.length > 2) {
      for (let at = 0; at < 40; at++) {
        const rx = Math.floor(Math.random() * GW);
        const ry = Math.floor(Math.random() * GH);
        if (grid[ry * GW + rx] >= 0) {
          trySpawn(rx, ry, grid[ry * GW + rx] + 90, Math.min(globalGen + 1, 12));
          break;
        }
      }
    }
    preSteps++;
  }
}
substrateBatch(PRE);
ptGeo.setDrawRange(0, ptCount);
ptGeo.attributes.position.needsUpdate = true;
ptGeo.attributes.color.needsUpdate = true;
ptGeo.attributes.aSize.needsUpdate = true;

// ── Resize ──
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation ──
const t0 = performance.now();
let done = false;
let frameN = 0;

function animate() {
  const t = (performance.now() - t0) * 0.001;
  frameN++;

  // Continue growing substrate live
  if (!done && ptCount < MAX_PTS - 500) {
    const prevCount = ptCount;
    substrateBatch(12);
    if (ptCount > prevCount) {
      ptGeo.setDrawRange(0, ptCount);
      ptGeo.attributes.position.needsUpdate = true;
      ptGeo.attributes.color.needsUpdate = true;
      ptGeo.attributes.aSize.needsUpdate = true;
    }
    const alive = cracks.reduce((a, c) => a + (c.alive ? 1 : 0), 0);
    if (alive === 0 && preSteps > PRE + 2000) done = true;
  }

  // Dust drift
  const dP = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    dP[i * 3]     += Math.sin(t * 0.17 + i * 0.7) * 0.001;
    dP[i * 3 + 1] += 0.0015;
    if (dP[i * 3 + 1] > 8) dP[i * 3 + 1] = -0.5;
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
