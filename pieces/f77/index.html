<!-- MOTION: pulse, intensity: gentle -->
<!-- Surprise-turn: "bonk" — the serene calyx sits in Turrell-lit composure,
     then every ~11 seconds an invisible mallet strikes from above.
     The cup compresses via damped harmonic oscillation, ripples radially,
     and slowly recovers its poise. Zimoun's patient kinetics meets
     botanical resilience. Comic timing: long stillness, brief wobble,
     dignified recovery. -->
<title>f77 · calyx bonk · Zimoun patience</title>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

/* ── background: warm gallery wall ── */
const bgScene = new THREE.Scene();
const bgCam   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const bgMat   = new THREE.ShaderMaterial({
  depthWrite: false,
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      vec2 uv = vUv;
      vec3 top = vec3(0.19, 0.16, 0.14);
      vec3 mid = vec3(0.16, 0.13, 0.11);
      vec3 bot = vec3(0.11, 0.09, 0.08);
      vec3 col = mix(bot, mid, smoothstep(0.0, 0.5, uv.y));
      col = mix(col, top, smoothstep(0.5, 1.0, uv.y));
      float vig = 1.0 - 0.35 * pow(length((uv - 0.5) * vec2(1.0, 0.8)), 2.0);
      col *= vig;
      float grain = fract(sin(dot(uv * 512.0, vec2(12.9898, 78.233))) * 43758.5453);
      col += (grain - 0.5) * 0.012;
      gl_FragColor = vec4(col, 1.0);
    }`
});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

/* ── particle system ── */
const N = 80000;
let geom, points;

const uniforms = {
  uTime:      { value: 0 },
  uPhase:     { value: 0 },
  uPixel:     { value: renderer.getPixelRatio() },
  uRowFreq:   { value: 1.2 },
  uColFreq:   { value: 1.0 },
  uWaveAmp:   { value: 0.5 },
  uTwist:     { value: 0.0 },
  uMorph:     { value: 0.0 },
  uPetals:    { value: 5.0 },
  uCupDepth:  { value: 4.0 },
  uBonk:      { value: 0.0 },   // bonk displacement: 0 = calm, negative = compressed
  uBonkRipple:{ value: 0.0 },   // radial ripple amplitude during bonk
  uLight1:    { value: new THREE.Vector3(1, 0.5, 0.3) },
  uLight2:    { value: new THREE.Vector3(-0.5, 0.3, 1) },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: `
    uniform float uTime, uPixel, uPhase;
    uniform float uRowFreq, uColFreq, uWaveAmp;
    uniform float uTwist, uMorph, uPetals, uCupDepth;
    uniform float uBonk, uBonkRipple;

    attribute vec2 gridPos;
    attribute float seed;

    varying float vDensity, vHeight, vNR;
    varying vec3 vPos, vNorm;

    void main(){
      float t  = uTime;
      float m  = uMorph;
      vec2  gp = gridPos;

      float r0   = length(gp);
      float maxR = 12.0;
      float nr0  = clamp(r0 / maxR, 0.0, 1.0);
      float th0  = atan(gp.y, gp.x);

      /* ── Lorenz-inspired flow ── */
      float flowA = sin(th0 * 3.0 + t * 0.45) * 0.28
                  + cos(r0 * 0.5  - t * 0.32) * 0.18;
      float flowR = sin(r0 * 0.8 + t * 0.28 + th0 * 2.0) * 0.12;
      vec2 drift  = vec2(
        sin((th0 + flowA * seed) * 10.0 + t * 0.55) * nr0 * 0.35 * m,
        cos((th0 + flowA * seed) *  7.0 + t * 0.38) * nr0 * 0.35 * m
      );
      vec2 fgp = gp + drift;

      /* ── Riley wave interference ── */
      float rowW = sin(fgp.y * uRowFreq + t * 1.2 + uPhase) * uWaveAmp;
      float colW = sin(fgp.x * uColFreq + t * 0.70)          * uWaveAmp;

      float tw = uTwist * length(fgp) * 0.04;
      float ct = cos(tw), st = sin(tw);
      vec2 tw2 = vec2(fgp.x * ct - fgp.y * st,
                      fgp.x * st + fgp.y * ct);

      /* ── calyx morph ── */
      float r2  = length(fgp);
      float nr2 = clamp(r2 / maxR, 0.0, 1.0);
      float th2 = atan(fgp.y, fgp.x);

      float petal   = 0.5 + 0.5 * cos(th2 * uPetals);
      float cup     = uCupDepth * nr2 * nr2 * (0.6 + 0.4 * petal);

      /* ── BONK deformation ──
         uBonk compresses the cup height (negative = squash)
         uBonkRipple adds a radial wave that propagates outward */
      float bonkSquash = 1.0 + uBonk * (0.6 + 0.4 * nr2);
      cup *= max(0.1, bonkSquash);

      /* radial ripple: travels outward from center during bonk */
      float ripplePhase = nr2 * 8.0 - uTime * 3.0;
      float ripple = sin(ripplePhase) * uBonkRipple * nr2 * 0.8;
      cup += ripple;

      float flare = 1.0 + 0.15 * nr2 * nr2 * m;

      vec3 flatP = vec3(tw2.x + rowW, tw2.y + colW, 0.0);
      float cx = tw2.x * flare + rowW * (1.0 - 0.5 * m);
      float cy = tw2.y * flare + colW * (1.0 - 0.5 * m);
      float cz = cup * m;
      vec3 p = mix(flatP, vec3(cx, cy, cz), m);

      /* ── surface normal ── */
      float dzdr = uCupDepth * 2.0 * nr2 / maxR * (0.6 + 0.4 * petal) * m * max(0.1, bonkSquash);
      float dzdt = uCupDepth * nr2 * nr2 * 0.4
                 * (-sin(th2 * uPetals) * uPetals) * m;
      float rSafe = r2 + 0.01;
      vNorm = normalize(vec3(
        -dzdr * cos(th2) + dzdt * sin(th2) / rSafe,
        -dzdr * sin(th2) - dzdt * cos(th2) / rSafe,
        1.0));

      /* ── density / veining ── */
      float interf = sin(fgp.y * uRowFreq * 2.0 + t * 1.2)
                   * sin(fgp.x * uColFreq * 2.0 + t * 0.7);
      float vein   = sin(th2 * uPetals * 3.0 + r2 * 1.5 + t * 0.4);
      vDensity = mix(interf, interf * 0.6 + vein * 0.4, m);
      vHeight  = cz;
      vPos     = p;
      vNR      = nr2;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * max(1.8, 3.6 - dist * 0.05);
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime, uBonk;
    uniform vec3  uLight1, uLight2;

    varying float vDensity, vHeight, vNR;
    varying vec3  vPos, vNorm;

    /* clamp color to prevent oversaturation */
    vec3 desaturate(vec3 c, float maxSat){
      float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
      vec3 grey = vec3(lum);
      /* approximate: blend toward grey to reduce saturation */
      float sat = length(c - grey) / (lum + 0.001);
      if(sat > maxSat){
        float blend = maxSat / sat;
        return mix(grey, c, blend);
      }
      return c;
    }

    void main(){
      vec2 dc = gl_PointCoord - 0.5;
      float rr = dot(dc, dc);
      if (rr > 0.25) discard;

      vec3 n = normalize(vNorm);

      /* ── Turrell drifting coloured light ── */
      float d1 = max(0.0, dot(n, normalize(uLight1)));
      float d2 = max(0.0, dot(n, normalize(uLight2)));
      vec3 c1  = vec3(0.82, 0.48, 0.28);   // muted amber
      vec3 c2  = vec3(0.30, 0.36, 0.62);   // dusty indigo

      vec3 ambient = vec3(0.13, 0.10, 0.08);
      vec3 lit = ambient + c1 * d1 * 0.58 + c2 * d2 * 0.35;

      /* ── bonk flash: brief warm flush at moment of impact ── */
      float bonkAbs = abs(uBonk);
      vec3 bonkFlush = vec3(0.22, 0.10, 0.06) * smoothstep(0.0, 0.4, bonkAbs);

      /* ── Lorenz flow glow (toned down) ── */
      float flowGlow = smoothstep(-0.3, 0.6, vDensity) * 0.25;
      float phase    = sin(uTime * 0.12) * 0.5 + 0.5;
      vec3 trailCol  = mix(c1, c2, phase) * flowGlow * 0.25;

      /* ── base: warm parchment ── */
      vec3 base = vec3(0.88, 0.82, 0.74);
      vec3 col  = base * lit + trailCol + bonkFlush;

      /* rim catch-light */
      float rim = smoothstep(0.35, 1.0, vNR) * 0.18;
      col += rim * mix(c1, c2, 0.4) * 0.35;

      /* interior shadow */
      float inner = smoothstep(0.45, 0.0, vNR);
      col *= 0.72 + 0.28 * (1.0 - inner * 0.45);

      /* height luminosity */
      col += smoothstep(0.0, 5.0, vHeight) * vec3(0.05, 0.03, 0.02);

      /* enforce palette restraint: desaturate to keep below HSL sat ~45% */
      col = desaturate(col, 0.42);

      float alpha = (0.72 + flowGlow * 0.28)
                  * (1.0 - smoothstep(0.17, 0.25, rr));
      gl_FragColor = vec4(col, alpha);
    }`
});

/* ── grid builder ── */
function buildGrid(rows, cols, seed){
  const pos  = new Float32Array(N * 3);
  const gpos = new Float32Array(N * 2);
  const sds  = new Float32Array(N);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const W = 24, H = 24;
  const cW = W / cols, cH = H / rows;
  let idx = 0;
  const ppc = Math.floor(N / (rows * cols));
  for (let i = 0; i < rows && idx < N; i++){
    for (let j = 0; j < cols && idx < N; j++){
      for (let k = 0; k < ppc && idx < N; k++){
        const x = (j + rng() - 0.5) * cW - W * 0.5;
        const y = (i + rng() - 0.5) * cH - H * 0.5;
        pos[idx*3]=x; pos[idx*3+1]=y; pos[idx*3+2]=0;
        gpos[idx*2]=x; gpos[idx*2+1]=y;
        sds[idx] = rng(); idx++;
      }
    }
  }
  while (idx < N){
    const x = (rng()-0.5)*W, y = (rng()-0.5)*H;
    pos[idx*3]=x; pos[idx*3+1]=y; pos[idx*3+2]=0;
    gpos[idx*2]=x; gpos[idx*2+1]=y;
    sds[idx]=rng(); idx++;
  }
  return { positions: pos, gridPositions: gpos, seeds: sds };
}

function regenerate(){
  const seed = Math.floor(Math.random() * 1e9);
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rows = 80 + Math.floor(rng() * 60);
  const cols = 80 + Math.floor(rng() * 60);

  uniforms.uRowFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uColFreq.value  = 0.8 + rng() * 1.0;
  uniforms.uWaveAmp.value  = 0.3 + rng() * 0.5;
  uniforms.uTwist.value    = rng() * 4.0;
  uniforms.uPhase.value    = rng() * 6.28;
  uniforms.uPetals.value   = 4 + Math.floor(rng() * 4);
  uniforms.uCupDepth.value = 3.0 + rng() * 3.0;
  uniforms.uMorph.value    = 0.0;

  const { positions, gridPositions, seeds } = buildGrid(rows, cols, seed);

  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('gridPos',  new THREE.BufferAttribute(gridPositions, 2));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions);
    geom.attributes.position.needsUpdate = true;
    geom.attributes.gridPos.array.set(gridPositions);
    geom.attributes.gridPos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);
    geom.attributes.seed.needsUpdate = true;
  }
  geom.computeBoundingSphere();
}

regenerate();
addEventListener('click', e => { if (e.target.tagName === 'CANVAS') regenerate(); });

/* ── BONK physics: damped harmonic oscillator ──
   Every ~11s an invisible mallet compresses the calyx.
   Spring: x'' = -k*x - c*x'
   k = stiffness, c = damping. Critically underdamped for visible wobble. */
const BONK_INTERVAL = 11.0;  // seconds between bonks
const BONK_K = 14.0;         // spring stiffness
const BONK_C = 3.2;          // damping coefficient
const BONK_IMPULSE = -0.55;  // initial velocity (negative = compress)
let bonkX = 0, bonkV = 0;    // displacement & velocity
let lastBonkTime = -6;       // first bonk comes after ~5s of calm
let prevT = 0;

function updateBonk(t, dt){
  // trigger bonk at interval
  if (t - lastBonkTime > BONK_INTERVAL && uniforms.uMorph.value > 0.8){
    bonkV = BONK_IMPULSE;
    lastBonkTime = t;
  }
  // damped spring integration (semi-implicit Euler)
  const accel = -BONK_K * bonkX - BONK_C * bonkV;
  bonkV += accel * dt;
  bonkX += bonkV * dt;
  // clamp tiny residuals to zero
  if (Math.abs(bonkX) < 0.001 && Math.abs(bonkV) < 0.002){
    bonkX = 0; bonkV = 0;
  }
  uniforms.uBonk.value = bonkX;
  uniforms.uBonkRipple.value = Math.abs(bonkV) * 1.2;
}

/* ── orbit (manual only — no Y-axis autorotate) ── */
let isDrag = false, pX = 0, pY = 0;
let orbTh = 0.35, orbPh = 0.55;  // slight angle to show cup depth
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { isDrag = true; pX = e.clientX; pY = e.clientY; e.preventDefault(); });
addEventListener('pointermove', e => {
  if (!isDrag) return;
  orbTh -= (e.clientX - pX) * 0.005;
  orbPh  = Math.max(0.1, Math.min(1.4, orbPh - (e.clientY - pY) * 0.005));
  pX = e.clientX; pY = e.clientY;
});
addEventListener('pointerup', () => { isDrag = false; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  uniforms.uPixel.value = renderer.getPixelRatio();
});

/* ── animate ── */
const t0 = performance.now();
function loop(){
  const now = performance.now();
  const t   = (now - t0) / 1000;
  const dt  = Math.min(t - prevT, 0.05); // cap dt
  prevT = t;
  uniforms.uTime.value = t;

  /* morph: flat → calyx */
  uniforms.uMorph.value += (1.0 - uniforms.uMorph.value) * 0.015;

  /* bonk physics */
  updateBonk(t, dt);

  /* Turrell drifting lights — slow orbits */
  const la1 = t * 0.13, la2 = t * 0.09 + 2.1;
  uniforms.uLight1.value.set(
    Math.sin(la1) * 0.8, 0.5 + 0.3 * Math.sin(la1 * 0.7), Math.cos(la1) * 0.6);
  uniforms.uLight2.value.set(
    Math.cos(la2) * 0.6, 0.3 + 0.2 * Math.cos(la2 * 0.5), Math.sin(la2) * 0.8);

  /* camera: fixed contemplative position + manual orbit, centroid tracking */
  const theta  = orbTh;
  const phi    = orbPh;
  const radius = 22;
  const cY     = 1.5 * uniforms.uMorph.value;
  camera.position.set(
    radius * Math.sin(theta) * Math.sin(phi),
    cY + radius * Math.cos(phi),
    radius * Math.cos(theta) * Math.sin(phi));
  camera.lookAt(0, cY, 0);

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
