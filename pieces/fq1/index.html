<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fq1 · Shiota — Suspended Memory (The Letter)</title>
<!-- MOTION: suspend, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">fq1</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0000, 0.004));
const keyL = new THREE.PointLight(0xff0800, 0.014, 28, 2.1);
keyL.position.set(-3, 6, 4);
scene.add(keyL);

let seed = 719402;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

// SUSPENDED OBJECT — a folded letter (thin rectangular plane)
const letterW = 1.8;
const letterH = 2.4;
const letterThick = 0.015;
const letterPos = new THREE.Vector3(0.6, 1.2, -0.4);

const letterGeo = new THREE.BoxGeometry(letterW, letterH, letterThick);
const letterMat = new THREE.MeshStandardMaterial({
  color: 0xf2ebe0, emissive: 0xfff5ed, emissiveIntensity: 0.65,
  roughness: 0.92, transparent: true, opacity: 0.48
});
const letter = new THREE.Mesh(letterGeo, letterMat);
letter.position.copy(letterPos);
letter.rotation.set(0.12, 0.25, -0.08);
scene.add(letter);

const letterGlow = new THREE.PointLight(0xfff0e8, 0.007, 5, 2.6);
letterGlow.position.copy(letterPos);
scene.add(letterGlow);

// ROOM VOLUME
const ROOM = { w: 20, h: 16, d: 18 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ANCHORS — wall grid
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<75; i++) anchors.push(wallPt());

// LETTER PERIMETER POINTS — 28 points around the letter edges
const letterPts = [];
const steps = 7;
for(let i=0; i<steps; i++){
  const t = i/(steps-1);
  const hw2 = letterW/2, hh2 = letterH/2;
  
  // top edge
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*letterW,
    letterPos.y + hh2,
    letterPos.z
  ));
  
  // bottom edge
  letterPts.push(new THREE.Vector3(
    letterPos.x + (t-0.5)*letterW,
    letterPos.y - hh2,
    letterPos.z
  ));
  
  // left edge
  letterPts.push(new THREE.Vector3(
    letterPos.x - hw2,
    letterPos.y + (t-0.5)*letterH,
    letterPos.z
  ));
  
  // right edge
  letterPts.push(new THREE.Vector3(
    letterPos.x + hw2,
    letterPos.y + (t-0.5)*letterH,
    letterPos.z
  ));
}

// THREAD NETWORK — 20,000 line segments (hard limit)
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — ceiling to letter top edge
const ceilingAnchors = [];
for(let i=0; i<12; i++){
  const t = i/12;
  const cx = letterPos.x + (t-0.5)*letterW*1.2 + (rng()-0.5)*0.4;
  const cz = letterPos.z + (rng()-0.5)*0.6;
  ceilingAnchors.push(new THREE.Vector3(cx, hh, cz));
}

for(const ca of ceilingAnchors){
  let closest = letterPts[0];
  let closestD = ca.distanceTo(closest);
  for(const lp of letterPts){
    const d = ca.distanceTo(lp);
    if(d < closestD && lp.y > letterPos.y){ closestD=d; closest=lp; }
  }
  setLine(ca, closest);
}

// CONVERGENCE — anchors to nearest letter perimeter point
for(let i=0; i<anchors.length*0.62 && li<NUM_LINES-16000; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dLetter = a.distanceTo(letterPos);
  if(dLetter < 2.5) continue;
  
  let closest = letterPts[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<6; k++){
    const candidate = letterPts[Math.floor(rng()*letterPts.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  setLine(a, closest);
}

// RADIAL THREADS FROM LETTER — threads that stop short
for(let i=0; i<380 && li<NUM_LINES-14000; i++){
  const lp = letterPts[Math.floor(rng()*letterPts.length)];
  const dir = lp.clone().sub(letterPos).normalize();
  dir.x += (rng()-0.5)*0.35;
  dir.y += (rng()-0.5)*0.28;
  dir.z += (rng()-0.5)*0.35;
  dir.normalize();
  const len = 1.5 + rng()*3.8;
  const end = lp.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(lp, end);
  }
}

// PROXIMITY WEB — anchor-to-anchor within threshold
const THRESH = 4.8;
let webCount = 0, attempts = 0;
while(webCount<3200 && li<NUM_LINES-10000 && attempts<22000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<7; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.7 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// WALL-TO-WALL spans
let wallSpans = 0;
while(wallSpans<1300 && li<NUM_LINES-7000){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>2.8 && d<16.0){
    setLine(a, b);
    wallSpans++;
  }
}

// LOCAL FILAMENTS — short Y-forking chains near letter
for(let i=0; i<180 && li<NUM_LINES-5000; i++){
  const startDist = 2.5 + rng()*4.0;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.6;
  const start = letterPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*2.0,
    (rng()-0.5)*1.5,
    (rng()-0.5)*2.0
  ).normalize();
  
  const segLen = 0.8 + rng()*0.6;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-10 && rng()<0.6){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.5 + rng()*0.4
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.7));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-8 && rng()<0.4){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.5 - rng()*0.4
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.65));
      setLine(p1, p2b);
    }
  }
}

// HORIZONTAL CROSSING THREADS — architectural spans at mid-height
for(let i=0; i<220 && li<NUM_LINES-3000; i++){
  const y = letterPos.y + (rng()-0.5)*3.0;
  const x1 = -hw + rng()*2.0;
  const z1 = (rng()-0.5)*ROOM.d*0.85;
  const x2 = hw - rng()*2.0;
  const z2 = (rng()-0.5)*ROOM.d*0.85;
  const a = new THREE.Vector3(x1, y, z1);
  const b = new THREE.Vector3(x2, y, z2);
  setLine(a, b);
}

// FILL remaining capacity with sparse long spans
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>3.0 && d<13.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018, transparent: true, opacity: 0.075,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — inside the web, orbiting the letter slowly
const pathLen = 2400;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.22){
    // Approach from left side, letter right of frame
    const lt = t/0.22;
    const angle = -Math.PI*0.4 + lt*Math.PI*0.3;
    const r = 6.5 - lt*1.2;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 0.8 + Math.sin(lt*Math.PI)*0.5;
    z = letterPos.z + Math.sin(angle)*r;
  } else if(t<0.46){
    // Descend below letter, looking up through threads
    const lt = (t-0.22)/0.24;
    const angle = -Math.PI*0.1 + lt*Math.PI*0.5;
    const r = 5.5 + Math.sin(lt*Math.PI)*0.8;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y - lt*4.5;
    z = letterPos.z + Math.sin(angle)*r;
  } else if(t<0.70){
    // Orbit close on right side
    const lt = (t-0.46)/0.24;
    const angle = Math.PI*0.4 + lt*Math.PI*0.6;
    const r = 4.2 + Math.cos(lt*Math.PI*1.5)*0.6;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 0.3 + Math.sin(lt*Math.PI*0.8)*0.4;
    z = letterPos.z + Math.sin(angle)*r;
  } else {
    // Rise and recede, letter centered in frame
    const lt = (t-0.70)/0.30;
    const angle = Math.PI + lt*Math.PI*0.4;
    const r = 4.5 + lt*3.2;
    x = letterPos.x + Math.cos(angle)*r;
    y = letterPos.y + 1.2 + lt*1.5;
    z = letterPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — anchor jitter <0.35%
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.022 + basePositions[idx+1]*0.032 + i*0.00007;
    const breath = Math.sin(elapsed*0.00048 + phase)*0.000015;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.016;
      arr[vi+1] = basePositions[vi+1] + breath*0.010;
      arr[vi+2] = basePositions[vi+2] + breath*0.018;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera dolly
  const speed = 0.000024;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward letter with subtle drift
  camera.lookAt(
    letterPos.x + Math.sin(elapsed*0.00011)*0.08,
    letterPos.y + Math.cos(elapsed*0.00008)*0.06,
    letterPos.z + Math.sin(elapsed*0.00006)*0.05
  );

  keyL.intensity = 0.014 + Math.sin(elapsed*0.00007)*0.0035;
  letterGlow.intensity = 0.007 + Math.sin(elapsed*0.00009)*0.0022;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
