<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n7i · Shiota — the key in the hand</title>
<!-- MOTION: sway, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">n7i</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.014);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.3));
const pL = new THREE.PointLight(0xffc8a0, 0.45, 50, 1.8);
pL.position.set(0, 10, -2);
scene.add(pL);

let seed = 77413829;
function rng(){ seed ^= seed<<13; seed ^= seed>>17; seed ^= seed<<5; return (seed>>>0)/4294967296; }

// ── ROOM
const ROOM = { w: 38, h: 26, d: 46 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── SUSPENDED DRESS — the remembered form (After the Dream / Over the Continents)
const dressPos = new THREE.Vector3(1.8, 2.0, -1.0);
const dressVerts = [];
const dressEdges = [];

// Dress silhouette: hanger → shoulders → waist → hem flare
// Built as connected wireframe rings at different heights
const rings = [
  { y: 4.8, rx: 0.15, rz: 0.08, n: 6 },   // hanger hook
  { y: 4.2, rx: 0.7, rz: 0.25, n: 10 },    // shoulders
  { y: 3.4, rx: 0.55, rz: 0.22, n: 10 },   // chest
  { y: 2.2, rx: 0.35, rz: 0.18, n: 10 },   // waist
  { y: 1.0, rx: 0.8, rz: 0.5, n: 12 },     // hip
  { y: -0.5, rx: 1.4, rz: 0.9, n: 14 },    // mid-skirt
  { y: -2.2, rx: 2.0, rz: 1.3, n: 16 },    // hem
  { y: -2.6, rx: 2.2, rz: 1.5, n: 16 },    // hem edge
];

let vi = 0;
const ringStarts = [];
for(const ring of rings){
  ringStarts.push(vi);
  for(let i=0; i<ring.n; i++){
    const a = (i/ring.n)*Math.PI*2;
    const jx = (rng()-0.5)*0.06, jz = (rng()-0.5)*0.06;
    dressVerts.push(new THREE.Vector3(
      dressPos.x + Math.cos(a)*ring.rx + jx,
      dressPos.y + ring.y,
      dressPos.z + Math.sin(a)*ring.rz + jz
    ));
    // Ring edge
    if(i>0) dressEdges.push([vi-1, vi]);
    vi++;
  }
  dressEdges.push([vi-1, ringStarts[ringStarts.length-1]]); // close ring
}
// Vertical struts between adjacent rings
for(let r=0; r<rings.length-1; r++){
  const n0 = rings[r].n, n1 = rings[r+1].n;
  const s0 = ringStarts[r], s1 = ringStarts[r+1];
  for(let i=0; i<Math.min(n0,n1); i++){
    const i0 = s0 + i;
    const i1 = s1 + Math.floor(i * n1/n0);
    dressEdges.push([i0, i1]);
  }
}

// Build dress mesh as LineSegments
const dressPositions = new Float32Array(dressEdges.length * 6);
for(let i=0; i<dressEdges.length; i++){
  const [a,b] = dressEdges[i];
  dressPositions[i*6]   = dressVerts[a].x;
  dressPositions[i*6+1] = dressVerts[a].y;
  dressPositions[i*6+2] = dressVerts[a].z;
  dressPositions[i*6+3] = dressVerts[b].x;
  dressPositions[i*6+4] = dressVerts[b].y;
  dressPositions[i*6+5] = dressVerts[b].z;
}
const dressGeo = new THREE.BufferGeometry();
dressGeo.setAttribute('position', new THREE.BufferAttribute(dressPositions, 3));
const dress = new THREE.LineSegments(dressGeo, new THREE.LineBasicMaterial({
  color: 0xf0e4d4, transparent: true, opacity: 0.55
}));
scene.add(dress);

// ── SUSPENDED KEYS — The Key in the Hand (Venice 2015)
// 50,000 keys in the real piece; we place ~60 tiny key-shaped crosses in the upper web
const keys = [];
const keyGeo = new THREE.BufferGeometry();
// Each key: a cross shape (4 segments = 8 vertices × 3)
const NUM_KEYS = 55;
const keyPositions = new Float32Array(NUM_KEYS * 4 * 6);
for(let i=0; i<NUM_KEYS; i++){
  const kp = new THREE.Vector3(
    dressPos.x + (rng()-0.5)*12,
    dressPos.y + 2.0 + rng()*7.0,
    dressPos.z + (rng()-0.5)*12
  );
  keys.push(kp);
  const sz = 0.06 + rng()*0.1;
  const rot = rng()*Math.PI;
  const cx = Math.cos(rot), sz2 = Math.sin(rot);
  const off = i * 24;
  // Vertical bar
  keyPositions[off]   = kp.x; keyPositions[off+1] = kp.y - sz; keyPositions[off+2] = kp.z;
  keyPositions[off+3] = kp.x; keyPositions[off+4] = kp.y + sz*1.5; keyPositions[off+5] = kp.z;
  // Horizontal bar
  keyPositions[off+6] = kp.x - sz*0.5*cx; keyPositions[off+7] = kp.y + sz*0.3; keyPositions[off+8] = kp.z - sz*0.5*sz2;
  keyPositions[off+9] = kp.x + sz*0.5*cx; keyPositions[off+10]= kp.y + sz*0.3; keyPositions[off+11]= kp.z + sz*0.5*sz2;
  // Ring at top (two short segments making a diamond)
  keyPositions[off+12]= kp.x - sz*0.15; keyPositions[off+13]= kp.y + sz*1.5; keyPositions[off+14]= kp.z;
  keyPositions[off+15]= kp.x; keyPositions[off+16]= kp.y + sz*1.9; keyPositions[off+17]= kp.z;
  keyPositions[off+18]= kp.x; keyPositions[off+19]= kp.y + sz*1.9; keyPositions[off+20]= kp.z;
  keyPositions[off+21]= kp.x + sz*0.15; keyPositions[off+22]= kp.y + sz*1.5; keyPositions[off+23]= kp.z;
}
keyGeo.setAttribute('position', new THREE.BufferAttribute(keyPositions, 3));
const keyMesh = new THREE.LineSegments(keyGeo, new THREE.LineBasicMaterial({
  color: 0x1a1412, transparent: true, opacity: 0.6
}));
scene.add(keyMesh);

// ── TWO BOATS — skeletal hulls beneath the key cloud (Venice reference)
function makeBoat(pos, scale){
  const bv = new Float32Array([
    0,0,-2.8, 0,0,2.8,
    -1.1,0.7,-1.6, 1.1,0.7,-1.6,
    -1.4,0.8,0, 1.4,0.8,0,
    -1.1,0.7,1.6, 1.1,0.7,1.6,
    -0.5,0.9,-2.2, 0.5,0.9,-2.2
  ]);
  const bi = [0,2, 0,3, 0,8, 0,9, 2,4, 3,5, 4,6, 5,7, 6,1, 7,1, 2,3, 4,5, 6,7, 8,9, 8,2, 9,3, 0,4, 0,5, 1,6, 1,7];
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(bv, 3));
  bg.setIndex(bi);
  const b = new THREE.LineSegments(bg, new THREE.LineBasicMaterial({ color:0x120808, transparent:true, opacity:0.65 }));
  b.position.copy(pos);
  b.scale.setScalar(scale);
  return b;
}
const boat1Pos = new THREE.Vector3(-1.5, -4.5, -2.0);
const boat2Pos = new THREE.Vector3(4.0, -4.0, 1.5);
const boat1 = makeBoat(boat1Pos, 1.4);
const boat2 = makeBoat(boat2Pos, 1.2);
boat2.rotation.y = 0.35;
scene.add(boat1);
scene.add(boat2);

// ── ANCHORS
const NUM_ANCHORS = 1100;
const anchors = [];
const centroid = new THREE.Vector3(
  (dressPos.x + boat1Pos.x + boat2Pos.x)/3,
  (dressPos.y + boat1Pos.y + boat2Pos.y)/3,
  (dressPos.z + boat1Pos.z + boat2Pos.z)/3
);

// Icosahedral scaffold
const phi = (1+Math.sqrt(5))/2;
const icoV = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoV){
  anchors.push(new THREE.Vector3(v[0]*7.5+centroid.x, v[1]*6.0+centroid.y, v[2]*7.5+centroid.z));
}

// Suspension anchors from ceiling
const suspAnchors = [];
for(let i=0; i<10; i++){
  const p = new THREE.Vector3(
    centroid.x + (rng()-0.5)*8,
    hh,
    centroid.z + (rng()-0.5)*8
  );
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones — deliberate negative space
const voids = [
  { pos: new THREE.Vector3(centroid.x-5, centroid.y+1, centroid.z+4), r: 2.5 },
  { pos: new THREE.Vector3(centroid.x+6, centroid.y-2, centroid.z-3), r: 2.0 },
  { pos: new THREE.Vector3(centroid.x-2, centroid.y+5, centroid.z-5), r: 2.8 }
];
function inVoid(p){ for(const v of voids) if(p.distanceTo(v.pos)<v.r) return true; return false; }

// Dense shell near dress and boats
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.30){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = dressPos.clone().add(dir.multiplyScalar(1.5 + rng()*6));
  } else if(r < 0.42){
    const target = rng()<0.5 ? boat1Pos : boat2Pos;
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = target.clone().add(dir.multiplyScalar(1.5 + rng()*5));
  } else if(r < 0.65){
    p = wallPt(); p.lerp(centroid, 0.2+rng()*0.45);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// Surface sample helpers
function dressSurf(){
  const ri = Math.floor(rng()*rings.length);
  const ring = rings[ri];
  const a = rng()*Math.PI*2;
  return new THREE.Vector3(
    dressPos.x + Math.cos(a)*ring.rx + (rng()-0.5)*0.08,
    dressPos.y + ring.y,
    dressPos.z + Math.sin(a)*ring.rz + (rng()-0.5)*0.08
  );
}
function boatSurf(pos){
  const bvRef = [0,0,-2.8, 0,0,2.8, -1.1,0.7,-1.6, 1.1,0.7,-1.6, -1.4,0.8,0, 1.4,0.8,0, -1.1,0.7,1.6, 1.1,0.7,1.6];
  const vi2 = Math.floor(rng()*8)*3;
  return new THREE.Vector3(pos.x+bvRef[vi2]*1.4, pos.y+bvRef[vi2+1]*1.4, pos.z+bvRef[vi2+2]*1.4);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
const swayPhase = new Float32Array(NUM_LINES); // per-thread sway seed
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  swayPhase[li] = rng()*6.28;
  li++;
}

// Suspension threads — dress to ceiling
for(const sa of suspAnchors.slice(0,6)){
  for(let j=0; j<4; j++){
    const ds = dressSurf();
    ds.y = Math.max(ds.y, dressPos.y + 3.5);
    setLine(sa, ds);
  }
}

// Suspension threads — boats to ceiling
for(const sa of suspAnchors.slice(6)){
  for(let j=0; j<3; j++){
    setLine(sa, boatSurf(rng()<0.5 ? boat1Pos : boat2Pos));
  }
}

// Key suspension threads — each key hangs from 1-2 threads to ceiling area
for(const kp of keys){
  const ceiling = new THREE.Vector3(kp.x + (rng()-0.5)*0.5, hh, kp.z + (rng()-0.5)*0.5);
  setLine(ceiling, kp);
  if(rng() < 0.4){
    const c2 = new THREE.Vector3(kp.x + (rng()-0.5)*1.5, hh, kp.z + (rng()-0.5)*1.5);
    setLine(c2, kp);
  }
}

// Dress-to-boat linking threads — narrative connection
for(let i=0; i<50; i++){
  const ds = dressSurf();
  ds.y = Math.min(ds.y, dressPos.y);
  const bs = boatSurf(rng()<0.5 ? boat1Pos : boat2Pos);
  setLine(ds, bs);
}

// Boat-to-boat threads
for(let i=0; i<25; i++){
  setLine(boatSurf(boat1Pos), boatSurf(boat2Pos));
}

// Cat A: threads converging on dress (38%)
const catA = Math.floor(NUM_LINES * 0.38);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  // 10% threads stop short — almost reaching but failing (Quayola directive)
  if(rng() < 0.10){
    const target = dressSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.2));
    setLine(a, target);
  } else {
    setLine(a, dressSurf());
  }
}

// Cat B: threads converging on boats (14%)
const catB = Math.floor(NUM_LINES * 0.14);
for(let i=0; i<catB && li<NUM_LINES; i++){
  let a = rng()<0.45 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  const bp = rng()<0.5 ? boat1Pos : boat2Pos;
  setLine(a, boatSurf(bp));
}

// Cat C: wall-to-wall atmosphere (18%)
const catC = Math.floor(NUM_LINES * 0.18);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt(), b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(centroid) > 17 && rng() > 0.04){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat D: key-to-key connecting threads — web of memory between keys
for(let i=0; i<keys.length && li<NUM_LINES-200; i++){
  for(let j=i+1; j<keys.length; j++){
    if(keys[i].distanceTo(keys[j]) < 4.0 && rng() < 0.35){
      setLine(keys[i], keys[j]);
    }
  }
}

// Cat E: dendritic branching near anchors
while(li < NUM_LINES - 80){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<12; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.5){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  // Y-fork branching (Entangled Others directive)
  if(rng() < 0.25 && li < NUM_LINES){
    const mid = a.clone().lerp(best, 0.3 + rng()*0.3);
    const bd = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const be = mid.clone().add(bd.multiplyScalar(0.8+rng()*2.0));
    if(!inVoid(be)){
      setLine(mid, be);
      // Second generation branch
      if(rng() < 0.15 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(be, 0.5);
        const bd2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const be2 = mid2.clone().add(bd2.multiplyScalar(0.5+rng()*1.0));
        if(!inVoid(be2)) setLine(mid2, be2);
      }
    }
  }
}

// Fill remaining toward dress
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)) setLine(a, dressSurf());
}

const basePositions = new Float32Array(positions);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / memory shards, clustered between dress and boats
const NUM_FRAGS = 28;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.12;
  const geo = rng()>0.5
    ? new THREE.BoxGeometry(sz*(1.6+rng()*2), sz*0.015, sz*(0.6+rng()*1))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.02;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.2),
    transparent: true, opacity: 0.2 + rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  const t = 0.2 + rng()*0.6;
  const target = rng()<0.5 ? boat1Pos : boat2Pos;
  mesh.position.lerpVectors(dressPos, target, t);
  mesh.position.x += (rng()-0.5)*4;
  mesh.position.y += (rng()-0.5)*3;
  mesh.position.z += (rng()-0.5)*4;
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — inside the web, weaving between dress and boats
const pathLen = 400;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const p = t*Math.PI*2;
  const x = centroid.x + Math.sin(p)*7.0 + Math.sin(p*1.3+0.8)*3.0;
  const y = centroid.y + 1.5 + Math.sin(p*0.5+1.0)*4.5 + Math.cos(p*0.35)*1.5;
  const z = centroid.z + Math.cos(p)*9.0 + Math.cos(p*0.7+2.0)*2.5;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── LATERAL SWAY — wind through the installation, not pulse
  const arr = lineGeo.attributes.position.array;
  const swayT = t * 0.04;
  for(let i=0; i<li; i++){
    const idx = i*6;
    const phase = swayPhase[i];
    // Gentle lateral displacement, amplitude < 0.3% of typical thread length
    const sx = Math.sin(swayT + phase) * 0.008;
    const sy = Math.cos(swayT*0.7 + phase*1.3) * 0.004;
    const sz = Math.sin(swayT*0.5 + phase*0.8) * 0.006;
    for(let v=0; v<2; v++){
      const vi2 = idx + v*3;
      arr[vi2]   = basePositions[vi2]   + sx;
      arr[vi2+1] = basePositions[vi2+1] + sy;
      arr[vi2+2] = basePositions[vi2+2] + sz;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Camera drift
  const speed = 0.002;
  const pathT = (t * speed) % 1.0;
  const idx2 = pathT * (pathLen-1);
  const i0 = Math.floor(idx2) % pathLen;
  const i1 = (i0+1) % pathLen;
  const frac = idx2 - Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  const look = centroid.clone();
  look.x += Math.sin(t*0.008)*0.8;
  look.y += Math.cos(t*0.006)*0.5;
  camera.lookAt(look);

  // Light wander
  pL.position.x = Math.sin(t*0.005)*1.5;
  pL.position.y = 10 + Math.cos(t*0.004)*0.6;
  pL.position.z = -2 + Math.cos(t*0.007)*1.0;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
