<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7x5 · chladni cymatics</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0d0d; overflow:hidden;
               color:#e8e8e8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .mode { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  button.start { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 background: #1a1a1a; color:#e8e8e8; border:1px solid #3a3a3a;
                 padding: 12px 22px; border-radius: 4px; cursor: pointer;
                 font-family: inherit; font-size: 13px; letter-spacing: 0.06em; }
  button.start:hover { background:#2a2a2a; }
</style>
</head>
<body>
<button class="start" id="startBtn">grant mic · hum a tone</button>
<div class="id">7x5</div>
<div class="mode" id="modeLabel">mode (1,1)</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 42);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0d0d, 1);
document.body.appendChild(renderer.domElement);

// dark metal plate
const plateGeom = new THREE.PlaneGeometry(24, 24);
const plateMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide });
const plate = new THREE.Mesh(plateGeom, plateMat);
scene.add(plate);

// subtle edge frame
const edgeGeom = new THREE.EdgesGeometry(plateGeom);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x2a2a2a, linewidth: 1 });
const edges = new THREE.LineSegments(edgeGeom, edgeMat);
scene.add(edges);

// sand particles
const N = 50000;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const trails = new Float32Array(N * 3);
const L = 24;
for (let i = 0; i < N; i++) {
  positions[i*3]   = (Math.random() - 0.5) * L;
  positions[i*3+1] = (Math.random() - 0.5) * L;
  positions[i*3+2] = 0.02 * (Math.random() - 0.5);
  velocities[i*3] = velocities[i*3+1] = velocities[i*3+2] = 0;
  trails[i*3] = positions[i*3];
  trails[i*3+1] = positions[i*3+1];
  trails[i*3+2] = positions[i*3+2];
}
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('trail', new THREE.BufferAttribute(trails, 3));

const uniforms = {
  uPixel: { value: renderer.getPixelRatio() }
};
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uPixel;
    attribute vec3 trail;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float dist = length(trail - p);
      vAlpha = exp(-dist * 2.0) * 0.8;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = 1.8 * uPixel;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = (1.0 - r*4.0) * vAlpha;
      gl_FragColor = vec4(0.95, 0.94, 0.90, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// chladni eigenmode
let m = 1, n = 1;
function chladniU(x, y, m, n, L) {
  const mx = m * Math.PI * x / L;
  const nx = n * Math.PI * x / L;
  const my = m * Math.PI * y / L;
  const ny = n * Math.PI * y / L;
  return Math.cos(mx) * Math.cos(my) - Math.cos(nx) * Math.cos(ny);
}
function gradU(x, y, m, n, L, eps = 0.05) {
  const u0 = chladniU(x, y, m, n, L);
  const ux = chladniU(x + eps, y, m, n, L);
  const uy = chladniU(x, y + eps, m, n, L);
  return [(ux - u0) / eps, (uy - u0) / eps];
}

// audio
const modeLabel = document.getElementById('modeLabel');
const startBtn = document.getElementById('startBtn');
let analyser = null, freqData = null, hasMic = false;
async function startAudio(){
  startBtn.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.75;
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    hasMic = true;
  } catch (e) {
    hasMic = false;
  }
}
startBtn.addEventListener('click', startAudio);

function dominantFreq(arr) {
  let maxVal = 0, maxIdx = 0;
  for (let i = 1; i < arr.length; i++) {
    if (arr[i] > maxVal) { maxVal = arr[i]; maxIdx = i; }
  }
  return maxIdx;
}

const modes = [
  [1,1], [2,1], [1,2], [2,2], [3,1], [1,3], [3,2], [2,3],
  [3,3], [4,1], [1,4], [4,2], [2,4], [4,3], [3,4], [4,4],
  [5,1], [1,5], [5,2], [2,5], [5,3], [3,5]
];
let targetMode = 0;
let modeTransition = 0;

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;

  // mode selection from mic or time
  if (analyser && hasMic) {
    analyser.getByteFrequencyData(freqData);
    const peak = dominantFreq(freqData);
    const ratio = peak / freqData.length;
    targetMode = Math.floor(ratio * modes.length);
    targetMode = Math.max(0, Math.min(modes.length - 1, targetMode));
  } else {
    targetMode = Math.floor((t * 0.18) % modes.length);
  }

  // smooth mode transition
  modeTransition += (targetMode - modeTransition) * 0.015;
  const modeIdx = Math.floor(modeTransition);
  const modeFrac = modeTransition - modeIdx;
  const [m0, n0] = modes[Math.min(modeIdx, modes.length - 1)];
  const [m1, n1] = modes[Math.min(modeIdx + 1, modes.length - 1)];
  m = m0 + (m1 - m0) * modeFrac;
  n = n0 + (n1 - n0) * modeFrac;
  modeLabel.textContent = `mode (${m0},${n0})`;

  // particle physics
  for (let i = 0; i < N; i++) {
    let x = positions[i*3];
    let y = positions[i*3+1];
    let z = positions[i*3+2];

    // keep on plate
    const halfL = L / 2;
    if (Math.abs(x) > halfL) x = Math.sign(x) * halfL;
    if (Math.abs(y) > halfL) y = Math.sign(y) * halfL;

    // gradient descent toward nodal lines
    const [gx, gy] = gradU(x, y, m, n, L);
    const force = 0.08;
    velocities[i*3]   -= gx * force;
    velocities[i*3+1] -= gy * force;

    // brownian jitter
    velocities[i*3]   += (Math.random() - 0.5) * 0.02;
    velocities[i*3+1] += (Math.random() - 0.5) * 0.02;
    velocities[i*3+2] += (Math.random() - 0.5) * 0.001;

    // damping
    velocities[i*3]   *= 0.92;
    velocities[i*3+1] *= 0.92;
    velocities[i*3+2] *= 0.85;

    x += velocities[i*3];
    y += velocities[i*3+1];
    z += velocities[i*3+2];

    // clamp z near plate
    z = Math.max(-0.1, Math.min(0.1, z));

    positions[i*3] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;

    // trail decay
    trails[i*3]   += (x - trails[i*3])   * 0.08;
    trails[i*3+1] += (y - trails[i*3+1]) * 0.08;
    trails[i*3+2] += (z - trails[i*3+2]) * 0.08;
  }
  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;

  // gentle camera drift
  camera.position.x = Math.sin(t * 0.05) * 2;
  camera.position.y = Math.cos(t * 0.07) * 2;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
