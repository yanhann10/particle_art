<meta charset="utf-8">

<title>4k3 · semantic Klein inscription</title>
<!-- MOTION: breathe, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0c0f; overflow:hidden;
               color:#4dd4d8; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }

<div class="id">4k3</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 0, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0c0f, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Klein bottle parametric
function kleinBottlePoint(u, v) {
  const a = 2.5, n = 1.8;
  const r = a * (1.0 + 0.4 * Math.sin(v));
  const x = r * Math.cos(u) * (1.0 + 0.3 * Math.sin(v));
  const y = r * Math.sin(u) * (1.0 + 0.3 * Math.sin(v));
  const z = n * Math.sin(v) * (1.0 + 0.4 * Math.cos(2*u));
  return new THREE.Vector3(x, y, z);
}

// Passage text — Ursula K. Le Guin, "The Ones Who Walk Away from Omelas"
const PASSAGE = "WITH A CLAMOR OF BELLS THAT SET THE SWALLOWS SOARING THE FESTIVAL OF SUMMER CAME TO THE CITY OMELAS BRIGHT TOWERED BY THE SEA";
const words = PASSAGE.split(' ');
let charIndex = 0;

// Letter texture factory
const letterCache = {};
function makeLetterTexture(char) {
  if (letterCache[char]) return letterCache[char];
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 256);
  ctx.font = 'bold 190px ui-monospace, "SF Mono", Menlo, monospace';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, 128, 128);
  const tex = new THREE.CanvasTexture(canvas);
  letterCache[char] = tex;
  return tex;
}

// Color palette: teal (instrument panel) vs steel (oxidized metal)
const TEAL = [0x4dd4d8, 0x20a0a8, 0x1080a0, 0x6ae8ec];
const STEEL = [0xc8b090, 0xb0b4bc, 0x808488, 0xd8c4a4];

// Spawn letters as geodesic paths on Klein surface
// Letters follow the TOPOLOGY: they walk geodesics, constrained by the surface curvature
const sprites = [];
const N_LETTERS = PASSAGE.replace(/\s/g, '').length;

for (let i = 0; i < N_LETTERS; i++) {
  const char = PASSAGE.replace(/\s/g, '')[i];
  if (char === ' ') continue;
  
  // Initial position: letters start clustered near the neck (v ≈ π)
  // They'll spread along geodesics as they animate
  const u = (i / N_LETTERS) * Math.PI * 2;
  const v = Math.PI + (Math.random() - 0.5) * 0.4; // tight band near neck
  
  const tex = makeLetterTexture(char);
  const col = (u < Math.PI) ? TEAL[i % TEAL.length] : STEEL[i % STEEL.length];
  
  const mat = new THREE.SpriteMaterial({
    map: tex,
    color: col,
    transparent: true,
    opacity: 0.0, // fade in
    depthWrite: false,
    blending: THREE.NormalBlending,
  });
  
  const sprite = new THREE.Sprite(mat);
  const p = kleinBottlePoint(u, v);
  sprite.position.copy(p);
  sprite.scale.set(0.8, 0.8, 1.0);
  
  sprite.userData = {
    char,
    u,
    v,
    targetV: Math.PI + Math.sin(u * 3.0) * 0.8, // geodesic target along surface
    speed: 0.008 + Math.random() * 0.004,
    age: 0,
    fadeInDuration: 60 + i * 3, // stagger fade-in
  };
  
  scene.add(sprite);
  sprites.push(sprite);
}

// Wireframe cage — structural scaffold
const CAGE_U = 32, CAGE_V = 32;
const cagePos = [];
for (let iu = 0; iu < CAGE_U; iu++) {
  const u = (iu / CAGE_U) * Math.PI * 2;
  for (let iv = 0; iv < CAGE_V; iv++) {
    const v0 = (iv / CAGE_V) * Math.PI * 2;
    const v1 = ((iv + 1) / CAGE_V) * Math.PI * 2;
    const p0 = kleinBottlePoint(u, v0);
    const p1 = kleinBottlePoint(u, v1);
    cagePos.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);
  }
}
const cageGeom = new THREE.BufferGeometry();
cageGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cagePos), 3));
const cageMat = new THREE.LineBasicMaterial({ color: 0x1a2838, transparent: true, opacity: 0.14 });
const cage = new THREE.LineSegments(cageGeom, cageMat);
scene.add(cage);

// Ambient light for depth
const ambient = new THREE.AmbientLight(0x4a5560, 0.3);
scene.add(ambient);

const start = performance.now();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  const elapsed = (window.AR ? window.AR.t : performance.now() - start) / 1000;
  const t = elapsed;
  
  // Breathing scale
  const breathScale = 1.0 + 0.06 * Math.sin(t * 0.5);
  
  sprites.forEach(sp => {
    const ud = sp.userData;
    ud.age++;
    
    // Fade in over first N frames
    if (ud.age < ud.fadeInDuration) {
      sp.material.opacity = (ud.age / ud.fadeInDuration) * 0.88;
    } else {
      sp.material.opacity = 0.88 + 0.12 * Math.sin(t * 1.2 + ud.u * 4.0);
    }
    
    // Letters walk geodesics: v moves toward targetV, constrained by surface
    const vDelta = ud.targetV - ud.v;
    ud.v += Math.sign(vDelta) * Math.min(Math.abs(vDelta), ud.speed);
    
    // Wrap v
    if (ud.v > Math.PI * 2) ud.v -= Math.PI * 2;
    if (ud.v < 0) ud.v += Math.PI * 2;
    
    // Recompute position on Klein surface
    const p = kleinBottlePoint(ud.u, ud.v);
    p.multiplyScalar(breathScale);
    sp.position.copy(p);
    
    // Size varies by proximity to neck (v ≈ π) — letters compress/expand
    const distFromNeck = Math.abs(ud.v - Math.PI);
    const sizeScale = 0.7 + 0.4 * Math.exp(-distFromNeck * 1.5);
    sp.scale.set(sizeScale * 0.8, sizeScale * 0.8, 1.0);
  });
  
  // Camera: slow contemplative drift
  const orbitSpeed = 0.05;
  const radius = 20;
  camera.position.x = Math.sin(t * orbitSpeed) * radius;
  camera.position.z = Math.cos(t * orbitSpeed) * radius;
  camera.position.y = Math.sin(t * orbitSpeed * 0.25) * 3.5;
  camera.lookAt(0, 0, 0);
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button><button id="pc-close" title="close / go back" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 10px;color:rgba(255,255,255,0.45);cursor:pointer;font-size:11px;line-height:1">×</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    font-family:ui-monospace,'SF Mono',Menlo,monospace;color:#cfe1d4;}
  #gp-panel .gp-h{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;
    color:rgba(205,210,220,0.45);margin-bottom:8px;}
  #gp-panel label{display:flex;justify-content:space-between;font-size:9px;
    letter-spacing:0.04em;color:rgba(205,210,220,0.6);margin-bottom:2px;}
  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;
    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
