<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>folded leaves · organic bouquet</title>
<!-- MOTION: twist, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0f0a08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">h7d</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(6, 4, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0f0a08, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;

// Palette: warm amber on near-black — ochre, sienna, burnt umber, copper
const PALETTE = [
  new THREE.Color(0xc59356), // ochre
  new THREE.Color(0x8b5a3c), // sienna
  new THREE.Color(0xa67c52), // copper
  new THREE.Color(0x6b4423), // burnt umber
  new THREE.Color(0xd4a574), // lighter amber
];

const N = 80000;

// Build 7 distinct folded-leaf elements arranged in a clustered bouquet
function buildLeafTwirl(index, totalLeaves) {
  const positions = [];
  const colors = [];
  const seeds = [];
  
  // Each leaf is a strip geometry with calligraphic mid-vein + curling edge
  const segments = 40;
  const width = 1.2 + Math.random() * 0.8;
  const length = 3.5 + Math.random() * 2.5;
  
  // Curl parameters — varying per leaf
  const curlIntensity = 0.6 + Math.random() * 1.2;
  const twistRate = 0.3 + Math.random() * 0.5;
  const bendAngle = (Math.random() - 0.5) * Math.PI * 0.6;
  
  // Base color for this leaf
  const baseColor = PALETTE[index % PALETTE.length].clone();
  
  for (let i = 0; i < segments; i++) {
    const t = i / (segments - 1);
    
    // Mid-vein curve — fern uncurling gesture
    const y = t * length;
    const bend = Math.sin(t * Math.PI * 0.5) * bendAngle;
    
    // Curl: edges pull inward as we go up, then flare at tip
    const curlPhase = t * Math.PI * twistRate;
    const edgeCurl = Math.sin(curlPhase) * curlIntensity * (1 - t * 0.3);
    
    // Width taper — narrower at base and tip
    const widthMult = Math.sin(t * Math.PI) * (0.4 + 0.6 * Math.pow(1 - Math.abs(t - 0.5) * 2, 0.6));
    const w = width * widthMult;
    
    // Generate strip cross-section
    const crossSegments = 12;
    for (let j = 0; j < crossSegments; j++) {
      const s = (j / (crossSegments - 1) - 0.5) * 2; // -1 to 1
      
      // Leaf surface: parabolic cross-section + edge curl
      const x = s * w + edgeCurl * s * Math.abs(s);
      const z = -Math.pow(Math.abs(s), 1.8) * 0.3; // slight dish
      
      // Apply bend
      const xb = x * Math.cos(bend) - y * Math.sin(bend);
      const yb = x * Math.sin(bend) + y * Math.cos(bend);
      
      positions.push(xb, yb, z);
      
      // Color variation: darker at edges and base, lighter mid-vein and tip
      const edgeDist = Math.abs(s);
      const tipness = Math.pow(t, 1.5);
      const veinProximity = 1 - edgeDist;
      
      const col = baseColor.clone();
      col.multiplyScalar(0.5 + 0.4 * veinProximity + 0.3 * tipness);
      colors.push(col.r, col.g, col.b);
      
      seeds.push(Math.random());
    }
  }
  
  return { positions, colors, seeds };
}

// Arrange 7 leaves in a clustered bouquet
const leafConfigs = [
  { scale: 1.0, rotX: 0.2, rotY: 0, rotZ: 0, offsetX: -0.8, offsetY: 0, offsetZ: 0.3 },
  { scale: 0.85, rotX: -0.3, rotY: Math.PI * 0.4, rotZ: 0.2, offsetX: 0.9, offsetY: 0.5, offsetZ: -0.4 },
  { scale: 1.15, rotX: 0.1, rotY: Math.PI * 0.7, rotZ: -0.15, offsetX: 0.3, offsetY: 1.2, offsetZ: 0.6 },
  { scale: 0.95, rotX: -0.4, rotY: Math.PI * 1.1, rotZ: 0.3, offsetX: -1.2, offsetY: 1.8, offsetZ: -0.3 },
  { scale: 1.05, rotX: 0.25, rotY: Math.PI * 1.5, rotZ: -0.2, offsetX: 0.6, offsetY: 2.4, offsetZ: 0.2 },
  { scale: 0.75, rotX: -0.15, rotY: Math.PI * 0.25, rotZ: 0.4, offsetX: -0.5, offsetY: 3.0, offsetZ: 0.5 },
  { scale: 0.9, rotX: 0.35, rotY: Math.PI * 1.8, rotZ: -0.25, offsetX: 0.2, offsetY: 3.5, offsetZ: -0.2 },
];

const allPositions = [];
const allColors = [];
const allSeeds = [];

for (let i = 0; i < leafConfigs.length; i++) {
  const leafData = buildLeafTwirl(i, leafConfigs.length);
  const cfg = leafConfigs[i];
  
  // Transform each vertex by leaf config
  const mat = new THREE.Matrix4();
  mat.makeRotationFromEuler(new THREE.Euler(cfg.rotX, cfg.rotY, cfg.rotZ, 'XYZ'));
  mat.scale(new THREE.Vector3(cfg.scale, cfg.scale, cfg.scale));
  
  const offset = new THREE.Vector3(cfg.offsetX, cfg.offsetY, cfg.offsetZ);
  
  for (let j = 0; j < leafData.positions.length; j += 3) {
    const v = new THREE.Vector3(
      leafData.positions[j],
      leafData.positions[j + 1],
      leafData.positions[j + 2]
    );
    v.applyMatrix4(mat);
    v.add(offset);
    
    allPositions.push(v.x, v.y, v.z);
    allColors.push(leafData.colors[j], leafData.colors[j + 1], leafData.colors[j + 2]);
    allSeeds.push(leafData.seeds[j / 3]);
  }
}

// Pad/trim to exactly N particles
while (allPositions.length / 3 < N) {
  const idx = Math.floor(Math.random() * (allPositions.length / 3)) * 3;
  allPositions.push(allPositions[idx], allPositions[idx + 1], allPositions[idx + 2]);
  allColors.push(allColors[idx], allColors[idx + 1], allColors[idx + 2]);
  allSeeds.push(Math.random());
}

const positions = new Float32Array(allPositions.slice(0, N * 3));
const colors = new Float32Array(allColors.slice(0, N * 3));
const seeds = new Float32Array(allSeeds.slice(0, N));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec3 p = position;
      
      // Gentle breathing motion — leaves inhale/exhale
      float breathPhase = uTime * 0.4 + seed * 6.28;
      float breath = sin(breathPhase) * 0.08;
      p *= (1.0 + breath);
      
      // Subtle drift — leaves trembling in still air
      float drift = seed * 6.28;
      p.x += sin(uTime * 0.3 + drift) * 0.04;
      p.z += cos(uTime * 0.25 + drift + 1.5) * 0.04;
      
      // Very slow rotation of entire bouquet (handled by OrbitControls autoRotate)
      
      vCol = color;
      
      // Shimmer: alpha pulses gently per particle
      float shimmer = 0.5 + 0.5 * sin(uTime * 1.5 + seed * 12.56);
      vAlpha = 0.6 + 0.3 * shimmer;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (50.0 / dist) * (0.8 + 0.4 * shimmer);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// Ambient light to soften the scene
const ambient = new THREE.AmbientLight(0xffffff, 0.15);
scene.add(ambient);

// Warm directional light from above-right
const dirLight = new THREE.DirectionalLight(0xffddaa, 0.3);
dirLight.position.set(5, 8, 3);
scene.add(dirLight);

// Track centroid for camera
const bbox = new THREE.Box3().setFromBufferAttribute(geom.attributes.position);
const centroid = bbox.getCenter(new THREE.Vector3());
controls.target.copy(centroid);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const now = performance.now();
  uniforms.uTime.value = (now - start) / 1000;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
