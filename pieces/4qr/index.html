<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4qr · cumulus crossing</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1a1611;}
canvas{display:block;}
.id{position:fixed;left:14px;bottom:12px;opacity:0.55;font-size:11px;
    letter-spacing:0.06em;color:#cdd2dc;font-family:ui-monospace,"SF Mono",Menlo,monospace;}
</style>
</head>
<body>
<div class="id">4qr</div>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ── scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,300);
camera.position.set(0,5,48);
camera.lookAt(0,3,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x13100c,1);
document.body.appendChild(renderer.domElement);

/* ── helpers ── */
function gaussRand(){
  let u=0,v=0;
  while(!u)u=Math.random();
  while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);
}

/* ── particles ── */
const N = 20000;
const CLUSTERS = 16;
const BX = 52;          // x half-extent
const BORDER = 0.0;     // the invisible line

const cCenters = [];
for(let i=0;i<CLUSTERS;i++){
  cCenters.push({
    x:(Math.random()-0.5)*BX*1.7,
    y:1.5+Math.random()*7,
    z:(Math.random()-0.5)*22,
    sx:2.5+Math.random()*5,
    sy:0.6+Math.random()*1.4,
    sz:1.2+Math.random()*3
  });
}

const posArr  = new Float32Array(N*3);
const homeY   = new Float32Array(N);
const homeZ   = new Float32Array(N);
const seedA   = new Float32Array(N);
const seedB   = new Float32Array(N);
const sizeArr = new Float32Array(N);
const angArr  = new Float32Array(N);

for(let i=0;i<N;i++){
  const c=cCenters[i%CLUSTERS];
  posArr[i*3]  =c.x+gaussRand()*c.sx;
  posArr[i*3+1]=c.y+gaussRand()*c.sy;
  posArr[i*3+2]=c.z+gaussRand()*c.sz;
  homeY[i]=posArr[i*3+1];
  homeZ[i]=posArr[i*3+2];
  seedA[i]=Math.random()*100;
  seedB[i]=Math.random()*100;
  sizeArr[i]=0.35+Math.random()*0.75;
  angArr[i]=Math.random()*6.2832;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position',new THREE.BufferAttribute(posArr,3));
geom.setAttribute('seed',    new THREE.BufferAttribute(seedA,1));
geom.setAttribute('seedB',   new THREE.BufferAttribute(seedB,1));
geom.setAttribute('aSize',   new THREE.BufferAttribute(sizeArr,1));
geom.setAttribute('aAngle',  new THREE.BufferAttribute(angArr,1));

/* ── border: faint dashed cartographic line ── */
const bVerts=[];
const dash=0.7,gap=0.55;
for(let y=-1;y<18;y+=dash+gap){
  for(let z=-16;z<16;z+=4){
    bVerts.push(BORDER,y,z, BORDER,y+dash,z);
  }
}
const bGeom=new THREE.BufferGeometry();
bGeom.setAttribute('position',new THREE.Float32BufferAttribute(bVerts,3));
const bMat=new THREE.LineBasicMaterial({color:0x7a3030,opacity:0.12,transparent:true});
scene.add(new THREE.LineSegments(bGeom,bMat));

/* ── ground whisper: faint horizon line ── */
const hVerts=[-BX,-0.5,0, BX,-0.5,0];
const hGeom=new THREE.BufferGeometry();
hGeom.setAttribute('position',new THREE.Float32BufferAttribute(hVerts,3));
scene.add(new THREE.LineSegments(hGeom,
  new THREE.LineBasicMaterial({color:0x5a4a38,opacity:0.08,transparent:true})));

/* ── particle shader ── */
const mat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uPR:{value:renderer.getPixelRatio()},
    uBorder:{value:BORDER}
  },
  transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uTime;
    uniform float uPR;
    uniform float uBorder;
    attribute float seed;
    attribute float seedB;
    attribute float aSize;
    attribute float aAngle;
    varying vec3  vCol;
    varying float vA;
    varying float vAng;

    void main(){
      vec3 p = position;

      /* border proximity → color */
      float dx = (p.x - uBorder)/28.0;
      float cross_ = smoothstep(-0.01,0.12,dx);

      /* palette — Morakana bone/dust ↔ oxidized red */
      vec3 bone   = vec3(0.92,0.88,0.81);
      vec3 dust   = vec3(0.78,0.67,0.52);
      vec3 oxRed  = vec3(0.60,0.14,0.04);
      vec3 dkRed  = vec3(0.38,0.10,0.05);

      vec3 left  = mix(bone, dust, 0.25+seed*0.35);
      vec3 right = mix(oxRed, dkRed, seedB*0.5);
      vCol = mix(left, right, cross_);

      /* border glow — friction shimmer */
      float bProx = 1.0 - smoothstep(0.0,4.0,abs(p.x-uBorder));
      vCol += vec3(0.14,0.05,0.02)*bProx;

      /* alpha: dense centre, fade edges */
      vA = 0.32 + 0.22*(1.0-abs(dx));
      vA *= smoothstep(52.0,36.0,abs(p.x));
      /* altitude fade top/bottom */
      vA *= smoothstep(-1.0,1.0,p.y)*smoothstep(18.0,14.0,p.y);

      vAng = aAngle + uTime*0.25*(seed-0.5);

      vec4 mv = modelViewMatrix * vec4(p,1.0);
      float dist = -mv.z;
      gl_PointSize = aSize * uPR * (75.0/max(dist,1.0));
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader:`
    varying vec3  vCol;
    varying float vA;
    varying float vAng;

    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float c = cos(vAng), s = sin(vAng);
      vec2 q = vec2(c*uv.x-s*uv.y, s*uv.x+c*uv.y);

      /* leaf: vesica piscis (two overlapping circles) */
      float r1 = length(q - vec2(0.0, 0.13))-0.38;
      float r2 = length(q + vec2(0.0, 0.13))-0.38;
      float leaf = max(r1,r2);
      if(leaf > 0.0) discard;

      float a = smoothstep(0.0,-0.12,leaf)*vA;

      /* central vein darkening */
      float vein = smoothstep(0.008,0.04,abs(q.x));
      vec3 col = vCol*(0.72+0.28*vein);

      /* lateral veins hint */
      float lv = abs(sin(q.y*28.0+q.x*6.0));
      col *= 0.92+0.08*smoothstep(0.3,0.6,lv);

      gl_FragColor = vec4(col*a, a);
    }
  `
});
const cloud = new THREE.Points(geom,mat);
scene.add(cloud);

/* ── background gradient + grain ── */
const bgGeom = new THREE.PlaneGeometry(2,2);
const bgMat = new THREE.ShaderMaterial({
  depthWrite:false, depthTest:false,
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy,0.9999,1.0);
    }`,
  fragmentShader:`
    varying vec2 vUv;
    uniform float uTime;

    float hash(vec2 p){
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }

    void main(){
      float y = vUv.y;
      vec3 ground  = vec3(0.065,0.052,0.040);
      vec3 horizon = vec3(0.19,0.15,0.11);
      vec3 sky     = vec3(0.10,0.08,0.065);

      vec3 col = mix(ground, horizon, smoothstep(0.0,0.42,y));
      col = mix(col, sky, smoothstep(0.55,1.0,y));

      /* warm glow near horizon centre */
      float glow = exp(-pow((vUv.x-0.48)*2.2,2.0)*2.0 - pow((y-0.38)*3.0,2.0));
      col += vec3(0.055,0.035,0.018)*glow;

      /* film grain (Lia Halloran) */
      float grain = hash(vUv*800.0 + fract(uTime*1.3))*0.04 - 0.02;
      col += grain;

      gl_FragColor = vec4(col,1.0);
    }`
  ,uniforms:{uTime:{value:0}}
});
bgMat.uniforms.uTime = mat.uniforms.uTime;   // share clock
const bg = new THREE.Mesh(bgGeom,bgMat);
bg.renderOrder = -1;
bg.frustumCulled = false;
scene.add(bg);

/* ── resize ── */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ── advection loop ── */
const WIND = 1.15;                 // eastward m/s
const t0 = performance.now();
let prevT = 0;

function loop(){
  const t = (performance.now()-t0)/1000;
  const dt = Math.min(t-prevT,0.05);
  prevT = t;
  mat.uniforms.uTime.value = t;

  const arr = geom.getAttribute('position').array;

  for(let i=0;i<N;i++){
    const i3=i*3;
    const sa=seedA[i], sb=seedB[i];

    /* eastward wind with per-particle variation */
    let wx = WIND*(0.65+0.35*Math.sin(sb*0.7+t*0.25));

    /* organic turbulence (multi-freq sin, not curl-noise) */
    let wy = Math.sin(t*0.45+sa*0.5)*0.18
           + Math.cos(t*0.28+sb*1.1)*0.12;
    let wz = Math.sin(t*0.38+sa*0.9)*0.22
           + Math.cos(t*0.55+sb*0.6)*0.10;

    /* near-border agitation */
    const bd = Math.abs(arr[i3]-BORDER);
    if(bd<5){
      const turb=(1-bd/5)*0.35;
      wy+=Math.sin(t*2.2+sa*3.0)*turb;
      wz+=Math.cos(t*1.8+sb*2.5)*turb;
      wx*=0.85+0.15*Math.sin(t*1.4+sa); // slight hesitation at border
    }

    arr[i3]  +=wx*dt;
    arr[i3+1]+=wy*dt;
    arr[i3+2]+=wz*dt;

    /* wrap east→west */
    if(arr[i3]>BX){
      arr[i3]=-BX+Math.random()*4;
      arr[i3+1]=homeY[i]+gaussRand()*0.6;
      arr[i3+2]=homeZ[i]+gaussRand()*0.8;
    }

    /* gentle Y/Z mean-reversion (keeps cloud coherence) */
    arr[i3+1]+=(homeY[i]-arr[i3+1])*0.003;
    arr[i3+2]+=(homeZ[i]-arr[i3+2])*0.004;
  }
  geom.getAttribute('position').needsUpdate=true;

  /* camera: slow contemplative drift */
  const cx = Math.sin(t*0.04)*10;
  const cy = 5.2+Math.sin(t*0.065)*1.8;
  camera.position.x+=(cx-camera.position.x)*0.008;
  camera.position.y+=(cy-camera.position.y)*0.008;
  camera.lookAt(cx*0.25,3.5,0);

  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
