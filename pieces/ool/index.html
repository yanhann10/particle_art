<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ool · gentle-explosion</title>
<!-- MOTION: breathe, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#07090b; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ool</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07090b, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.5;
  init[i*4+1] = (Math.random()*2-1) * 0.5;
  init[i*4+2] = (Math.random()*2-1) * 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

// Simulation: Aizawa + periodic radial bloom ("gentle explosion")
// uBloom ramps 0→1 during exhale, particles get a radial push outward
// then relax back as uBloom fades — like the attractor breathing
const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.011 },
  uA:     { value: 0.95 },
  uB:     { value: 0.70 },
  uC:     { value: 0.60 },
  uD:     { value: 3.50 },
  uE:     { value: 0.25 },
  uF:     { value: 0.10 },
  uBloom: { value: 0.0 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uBloom;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;
      // Aizawa field
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        uC + uA * p.z - (p.z*p.z*p.z)/3.0
          - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
          + uF * p.z * p.x*p.x*p.x
      );
      // radial bloom push — gentle outward breath
      vec3 center = vec3(0.0, 0.0, 0.9);
      vec3 radial = p - center;
      float rLen = length(radial);
      vec3 radDir = rLen > 0.001 ? radial / rLen : vec3(0.0);
      // bloom push scaled by distance — closer particles push more
      float push = uBloom * 1.8 * exp(-rLen * 0.6);
      dp += radDir * push;
      p += dp * uDt;
      age = mod(age + uDt * 0.06, 1.0);
      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// Points rendering
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 50);
camera.position.set(0.0, 0.6, 4.2);
camera.lookAt(0, 0, 0.9);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:   { value: rtB.texture },
    uPixel:  { value: renderer.getPixelRatio() },
    uBloom:  { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vSpeed;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      float speed = length(p) * 0.5;
      vSpeed = clamp(speed, 0.0, 1.0);
      vAge = s.w;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.0 + 1.4 * vSpeed) * uPixel * (8.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vSpeed;
    uniform float uBloom;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0);
      // smoky sage — bone — warm amber (bloom flush)
      vec3 sage  = vec3(0.25, 0.44, 0.38);
      vec3 bone  = vec3(0.82, 0.78, 0.72);
      vec3 amber = vec3(0.78, 0.52, 0.28);
      float k = mod(vAge + vSpeed * 0.35, 1.0);
      vec3 col = mix(sage, bone, smoothstep(0.0, 0.55, k));
      // during bloom: warm amber flush creeps in
      col = mix(col, amber, uBloom * smoothstep(0.2, 0.8, k) * 0.7);
      // slight brightness lift during bloom
      float lum = 0.40 + vSpeed * 0.7 + uBloom * 0.15;
      gl_FragColor = vec4(col * a * lum, a);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer perturbations (subtle)
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.06;
  target.c = 0.60 + ny * 0.08;
});

// Bloom cycle: long inhale, brief gentle exhale, long rest
// ~28s cycle: 20s still → 4s bloom rise → 4s bloom fade
const CYCLE = 28.0;
const BLOOM_START = 20.0;
const BLOOM_PEAK  = 22.0;
const BLOOM_END   = 26.0;

const t0 = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.03;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.03;

  // bloom envelope
  const phase = elapsed % CYCLE;
  let bloom = 0.0;
  if (phase >= BLOOM_START && phase < BLOOM_PEAK) {
    // rise: smooth ease-in
    const t = (phase - BLOOM_START) / (BLOOM_PEAK - BLOOM_START);
    bloom = t * t * (3.0 - 2.0 * t); // smoothstep
  } else if (phase >= BLOOM_PEAK && phase < BLOOM_END) {
    // fall: smooth ease-out
    const t = 1.0 - (phase - BLOOM_PEAK) / (BLOOM_END - BLOOM_PEAK);
    bloom = t * t * (3.0 - 2.0 * t);
  }
  simUniforms.uBloom.value = bloom;
  pointsMat.uniforms.uBloom.value = bloom;

  // simulation substeps
  for (let i = 0; i < 4; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pointsMat.uniforms.state.value = rtA.texture;

  // slow single-pass drift on Z — reveals depth over ~90s
  const drift = elapsed * 0.0002;
  camera.position.set(
    0.0 + Math.sin(drift * 0.7) * 0.3,
    0.6 + Math.sin(drift * 0.4) * 0.15,
    4.2 - drift * 0.8
  );
  // clamp so we don't drift too close
  camera.position.z = Math.max(camera.position.z, 2.8);
  camera.lookAt(0, 0, 0.9);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
