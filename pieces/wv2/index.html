<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wv2 · rebound</title>
<!-- MOTION: pulse, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background:
      radial-gradient(ellipse at 32% 38%, #faf2dd 0%, #ecdcb6 38%, #c5a571 78%, #6e4926 100%),
      #6e4926;
    background-blend-mode: normal;
    color: #2a1a08; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.10  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
    mix-blend-mode: multiply; opacity: 0.50;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse 90% 80% at 18% 20%, rgba(255,238,195,0.32), rgba(255,238,195,0) 55%);
    mix-blend-mode: screen;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>
<div class="id">wv2</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Intent: the Riley wave-interference calyx sits quietly on its parchment desk,
// then every ~14 seconds the whole form "rebounds" — particles spring upward as
// if the desk was struck from below, hang weightless for a beat, then elastically
// settle back into their interference bands. A drumhead surprise: orderly →
// briefly airborne → self-recovers. Evokes Zimoun's prepared-motor installations
// (hundreds of small mechanisms on surfaces that periodically activate).
// Named technique: elastic collision / spring-mass damping.
// Creative constraint: particles must stay recognizable as wave-bands even at
// maximum displacement — they stretch vertically but preserve their x/z topology.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const N = 80000;
const positions = new Float32Array(N * 3);
const restY     = new Float32Array(N);       // rest height for each particle
const seeds     = new Float32Array(N);
const radii     = new Float32Array(N);       // distance from center (for ripple delay)

let regrowSeed = Math.random() * 1e9;
function buildField(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const w1 = { ang: rng()*Math.PI*2, k: 1.6+rng()*1.2, phase: rng()*Math.PI*2 };
  const w2 = { ang: rng()*Math.PI*2, k: 2.1+rng()*1.4, phase: rng()*Math.PI*2 };
  const w3 = { ang: rng()*Math.PI*2, k: 0.8+rng()*0.6, phase: rng()*Math.PI*2 };
  const radK = 1.3 + rng() * 0.6;

  let written = 0, attempts = 0;
  while (written < N && attempts < N * 16){
    attempts++;
    const r = Math.sqrt(rng()) * 4;
    const th = rng() * Math.PI * 2;
    const x = r * Math.cos(th);
    const z = r * Math.sin(th);
    const v1 = Math.sin(x*Math.cos(w1.ang)*w1.k + z*Math.sin(w1.ang)*w1.k + w1.phase);
    const v2 = Math.sin(x*Math.cos(w2.ang)*w2.k + z*Math.sin(w2.ang)*w2.k + w2.phase);
    const v3 = Math.sin(x*Math.cos(w3.ang)*w3.k + z*Math.sin(w3.ang)*w3.k + w3.phase);
    const vR = Math.sin(r * radK);
    const f  = (v1 + v2 + v3 + vR) * 0.25;
    const fall = Math.exp(-r*r*0.10);
    const accept = (f > 0) && (rng() < fall * (0.4 + 0.6*f));
    if (!accept) continue;
    const petals = 6;
    const scallop = Math.cos(th * petals) * 0.18 * (r / 4);
    const y = -0.15 * r * r + scallop;
    positions[written*3]     = x;
    positions[written*3 + 1] = y;
    positions[written*3 + 2] = z;
    restY[written]           = y;
    radii[written]           = r;
    seeds[written]           = rng();
    written++;
  }
  for (let i = written; i < N; i++){
    positions[i*3] = 0; positions[i*3+1] = -2; positions[i*3+2] = 0;
    restY[i] = -2; radii[i] = 0; seeds[i] = 0;
  }
}
buildField(Math.floor(regrowSeed));

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('aRestY',   new THREE.BufferAttribute(restY, 1));
geom.setAttribute('aRadius',  new THREE.BufferAttribute(radii, 1));

const uniforms = {
  uTime:    { value: 0 },
  uPixel:   { value: renderer.getPixelRatio() },
  uPointer: { value: new THREE.Vector2(0, 0) },
  uRebound: { value: 0 },  // 0→1 rebound phase
  uSettle:  { value: 0 }   // 0→1 settling phase after rebound
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec2  uPointer;
    uniform float uRebound;
    uniform float uSettle;
    attribute float seed;
    attribute float aRestY;
    attribute float aRadius;
    varying float vDepth;
    varying float vSeed;
    varying float vLift;
    void main(){
      vec3 p = position;

      // --- REBOUND displacement ---
      // Ripple propagates outward from center: inner particles launch first
      float maxR = 4.0;
      float rippleDelay = aRadius / maxR * 0.35;  // 0..0.35 delay
      float phase = uRebound - rippleDelay;

      float lift = 0.0;
      if(phase > 0.0 && phase < 1.0){
        // spring-up: fast rise, elastic overshoot, damped settle
        // Using a damped sine: A * sin(omega*t) * exp(-decay*t)
        float t = phase;
        float amplitude = 2.2 * (1.0 - aRadius / maxR * 0.4); // center launches higher
        lift = amplitude * sin(t * 8.0) * exp(-t * 4.5);
        // add slight random per-particle jitter to prevent uniformity
        lift += seed * 0.15 * sin(t * 12.0 + seed * 6.28) * exp(-t * 5.0);
      }
      // during settle phase, gentle wobble back to rest
      if(uSettle > 0.0 && uSettle < 1.0){
        float st = uSettle;
        lift += 0.08 * sin(st * 6.0 + aRadius * 2.0) * exp(-st * 6.0);
      }
      p.y = aRestY + lift;
      vLift = abs(lift);

      // pointer tilt
      float tiltX = uPointer.y * 0.22;
      float tiltZ = -uPointer.x * 0.22;
      float ca = cos(tiltX), sa = sin(tiltX);
      float cb = cos(tiltZ), sb = sin(tiltZ);
      vec3 q = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
      q = vec3(q.x*cb - q.y*sb, q.x*sb + q.y*cb, q.z);

      // gentle breath
      float t2 = uTime * 0.22 + seed * 6.28;
      q.y += 0.03 * sin(t2);

      vec4 mv = modelViewMatrix * vec4(q, 1.0);
      vDepth = -mv.z;
      vSeed = seed;

      // particles grow slightly when airborne — they catch more light
      float sizeBoost = 1.0 + vLift * 0.3;
      gl_PointSize = (1.4 + 0.8*sin(t2*0.7)) * sizeBoost * uPixel * (5.0 / vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vDepth;
    varying float vSeed;
    varying float vLift;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 19.0);

      // ink color — when airborne, particles warm slightly (as if catching window light)
      vec3 inkDeep = vec3(0.10, 0.06, 0.04);
      vec3 inkWarm = vec3(0.30, 0.18, 0.08);
      vec3 inkAir  = vec3(0.42, 0.28, 0.14);  // warmer when lifted
      vec3 base = mix(inkDeep, inkWarm, smoothstep(0.0, 1.0, vSeed));
      vec3 col = mix(base, inkAir, clamp(vLift * 0.6, 0.0, 0.5));

      // depth haze
      float haze = clamp((vDepth - 8.0) / 6.0, 0.0, 0.55);
      col = mix(col, vec3(0.85, 0.78, 0.62), haze);

      // airborne particles become slightly translucent — ink lifting off paper
      float liftFade = clamp(vLift * 0.15, 0.0, 0.25);
      gl_FragColor = vec4(col, a * (0.78 - liftFade) * (1.0 - haze*0.6));
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── RIPPLE RING — a faint expanding circle on the "desk surface"
// appears at the moment of impact, like a water ring
const ringGeo = new THREE.RingGeometry(0.05, 0.15, 64);
const ringMat = new THREE.ShaderMaterial({
  uniforms: {
    uRing: { value: 0 },  // 0→1 expansion
    uAlpha: { value: 0 }
  },
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uRing;
    void main(){
      vec3 p = position;
      // expand outward
      float scale = 0.5 + uRing * 5.0;
      p.xy *= scale;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uAlpha;
    void main(){
      gl_FragColor = vec4(0.30, 0.20, 0.10, uAlpha * 0.25);
    }
  `
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI * 0.5;
ring.position.y = -0.6;
scene.add(ring);

// ────────────── DUST MOTES
const N_DUST = 250;
const dustGeom = new THREE.BufferGeometry();
const dustPos  = new Float32Array(N_DUST * 3);
const dustSeed = new Float32Array(N_DUST);
for (let i = 0; i < N_DUST; i++){
  dustPos[i*3]     = (Math.random()-0.5)*14;
  dustPos[i*3+1]   = (Math.random()-0.5)*8;
  dustPos[i*3+2]   = (Math.random()-0.5)*8;
  dustSeed[i]      = Math.random();
}
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeom.setAttribute('seed',     new THREE.BufferAttribute(dustSeed, 1));
const dustMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uPixel: uniforms.uPixel, uRebound: uniforms.uRebound },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uRebound;
    attribute float seed;
    varying float vGlow;
    void main(){
      vec3 p = position;
      float t = uTime * 0.10 + seed * 6.28;
      p.x += sin(t*1.3 + seed*30.0) * 0.4;
      p.y -= mod(uTime*0.08 + seed*7.0, 4.0) - 2.0;
      p.z += cos(t*1.1 + seed*22.0) * 0.3;
      // during rebound, dust gets a little kick — disturbed air
      float kick = uRebound > 0.0 && uRebound < 0.6 ? sin(uRebound*5.0)*exp(-uRebound*3.0)*0.5 : 0.0;
      p.y += kick * (0.5 + seed);
      float sx = -p.x / 7.0;
      float sy =  p.y / 4.0;
      vGlow = clamp(0.30 + 0.55*smoothstep(-0.2, 0.6, sx+sy), 0.0, 1.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.0 + 1.4*vGlow) * uPixel * (4.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vGlow;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 24.0);
      vec3 col = vec3(1.00, 0.94, 0.78) * vGlow;
      gl_FragColor = vec4(col, a * 0.70 * vGlow);
    }
  `
});
const dust = new THREE.Points(dustGeom, dustMat);
scene.add(dust);

// ────────────── interaction
addEventListener('pointermove', (e) => {
  uniforms.uPointer.value.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  regrowSeed = Math.random() * 1e9;
  buildField(Math.floor(regrowSeed));
  geom.attributes.position.needsUpdate = true;
  geom.attributes.seed.needsUpdate = true;
  geom.attributes.aRestY.needsUpdate = true;
  geom.attributes.aRadius.needsUpdate = true;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ────────────── REBOUND TIMING
// Every ~14 seconds, trigger the rebound event.
// The event has 3 phases:
//   0.0–1.2s : rebound (uRebound 0→1) — particles spring up and return
//   1.2–2.5s : settle (uSettle 0→1)   — gentle residual wobble
//   rest     : quiet contemplation
const REBOUND_INTERVAL = 14.0;  // seconds between rebounds
const REBOUND_DURATION = 1.4;   // how long the spring phase lasts
const SETTLE_DURATION  = 1.8;   // how long the settle wobble lasts
const TOTAL_EVENT      = REBOUND_DURATION + SETTLE_DURATION;

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // rebound cycle
  const cycleT = t % REBOUND_INTERVAL;
  if (cycleT < TOTAL_EVENT) {
    if (cycleT < REBOUND_DURATION) {
      uniforms.uRebound.value = cycleT / REBOUND_DURATION;
      uniforms.uSettle.value = 0;
      // ring expands during rebound
      ringMat.uniforms.uRing.value = cycleT / REBOUND_DURATION;
      ringMat.uniforms.uAlpha.value = 1.0 - cycleT / REBOUND_DURATION;
    } else {
      uniforms.uRebound.value = 0;
      uniforms.uSettle.value = (cycleT - REBOUND_DURATION) / SETTLE_DURATION;
      ringMat.uniforms.uAlpha.value = 0;
    }
  } else {
    uniforms.uRebound.value = 0;
    uniforms.uSettle.value = 0;
    ringMat.uniforms.uAlpha.value = 0;
  }

  // slow camera drift
  camera.position.x = Math.sin(t * 0.05) * 0.4;
  camera.position.y = 0.2 + Math.sin(t * 0.04 + 1.0) * 0.25;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
