<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0ks · Iki — Restrained Breath</title>
<!-- MOTION: drift, intensity: whisper -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0a0a; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">0ks</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.0032);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x1a1410, 0.008));
const key1 = new THREE.PointLight(0x2a1814, 0.012, 28, 2.2);
key1.position.set(-8, 10, 6);
scene.add(key1);

const key2 = new THREE.PointLight(0x1a1008, 0.007, 22, 2.4);
key2.position.set(6, -5, -8);
scene.add(key2);

let seed = 893472;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 32, h: 20, d: 28 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED OBJECT — single smooth vessel/stone, refined
const objectPos = new THREE.Vector3(0.6, 0.1, -0.8);
const objectGeo = new THREE.BoxGeometry(1.0, 0.22, 0.34);
const objectMat = new THREE.MeshStandardMaterial({
  color: 0xd8caba,
  emissive: 0xb8a898,
  emissiveIntensity: 0.42,
  roughness: 0.94,
  metalness: 0.02
});
const suspendedObject = new THREE.Mesh(objectGeo, objectMat);
suspendedObject.position.copy(objectPos);
suspendedObject.rotation.set(0.08, 0.52, -0.05);
scene.add(suspendedObject);

const objectGlow = new THREE.PointLight(0x1a1008, 0.005, 10, 2.8);
objectGlow.position.copy(objectPos);
scene.add(objectGlow);

// OBJECT ANCHOR POINTS
const objAnchors = [];
const objBox = new THREE.Box3().setFromObject(suspendedObject);
const corners = [
  new THREE.Vector3(objBox.min.x, objBox.min.y, objBox.min.z),
  new THREE.Vector3(objBox.max.x, objBox.min.y, objBox.min.z),
  new THREE.Vector3(objBox.min.x, objBox.max.y, objBox.min.z),
  new THREE.Vector3(objBox.max.x, objBox.max.y, objBox.min.z),
  new THREE.Vector3(objBox.min.x, objBox.min.y, objBox.max.z),
  new THREE.Vector3(objBox.max.x, objBox.min.y, objBox.max.z),
  new THREE.Vector3(objBox.min.x, objBox.max.y, objBox.max.z),
  new THREE.Vector3(objBox.max.x, objBox.max.y, objBox.max.z)
];
objAnchors.push(...corners);

for(let i=0; i<18; i++){
  const t = i/18;
  const angle = t * Math.PI * 2;
  const r = 0.6;
  const pt = objectPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*r,
    (rng()-0.5)*0.24,
    Math.sin(angle)*r
  ));
  objAnchors.push(pt);
}

// WALL ANCHORS — fewer, more intentional
const anchors = [];

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w*0.88; z=(rng()-0.5)*ROOM.d*0.88; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w*0.88; y=(rng()-0.5)*ROOM.h*0.88; break;
  }
  return new THREE.Vector3(x,y,z);
}

for(let i=0; i<110; i++) anchors.push(wallPt());

// THREADS — restrained, essential only
const NUM_LINES = 12000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// SUSPENSION THREADS — minimal, elegant
const suspCount = 6;
for(let i=0; i<suspCount; i++){
  const angle = (i/suspCount)*Math.PI*2 + 0.10;
  const r = 0.32 + (i%2)*0.12;
  const x = objectPos.x + Math.cos(angle)*r;
  const z = objectPos.z + Math.sin(angle)*r*0.58;
  const objTop = new THREE.Vector3(x, objectPos.y + 0.26, z);
  
  const ceilX = objTop.x + (rng()-0.5)*1.4;
  const ceilZ = objTop.z + (rng()-0.5)*1.2;
  const ceilPt = new THREE.Vector3(ceilX, hh, ceilZ);
  setLine(ceilPt, objTop);
}

// CONVERGENCE THREADS — refined, fewer
const convergeBudget = 4800;
for(let i=0; i<convergeBudget && li<NUM_LINES-6800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dObj = a.distanceTo(objectPos);
  if(dObj < 2.2) continue;
  
  let closest = objAnchors[0];
  let closestD = a.distanceTo(closest);
  for(let k=0; k<6; k++){
    const candidate = objAnchors[Math.floor(rng()*objAnchors.length)];
    const cd = a.distanceTo(candidate);
    if(cd < closestD){ closestD = cd; closest = candidate; }
  }
  
  // 32% stop short — restraint, incompletion
  if(rng()<0.32){
    const dir = closest.clone().sub(a).normalize();
    const shortLen = a.distanceTo(closest) * (0.38 + rng()*0.48);
    const end = a.clone().add(dir.multiplyScalar(shortLen));
    setLine(a, end);
  } else {
    setLine(a, closest);
  }
}

// RADIATING THREADS — subtle emanation
for(let i=0; i<420 && li<NUM_LINES-6200; i++){
  const oa = objAnchors[Math.floor(rng()*objAnchors.length)];
  const dir = oa.clone().sub(objectPos).normalize();
  dir.x += (rng()-0.5)*0.52;
  dir.y += (rng()-0.5)*0.58;
  dir.z += (rng()-0.5)*0.52;
  dir.normalize();
  const len = 2.8 + rng()*9.4;
  const end = oa.clone().add(dir.multiplyScalar(len));
  if(Math.abs(end.x)<hw && Math.abs(end.y)<hh && Math.abs(end.z)<hd){
    setLine(oa, end);
  }
}

// PROXIMITY WEB — restrained density
const THRESH = 7.8;
let webCount = 0, attempts = 0;
while(webCount<2400 && li<NUM_LINES-3400 && attempts<14000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<6; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>2.4 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// DENDRITIC BRANCHES — simplified, essential form
for(let i=0; i<180 && li<NUM_LINES-2800; i++){
  const startDist = 3.8 + rng()*7.2;
  const angle = rng()*Math.PI*2;
  const elev = (rng()-0.5)*Math.PI*0.68;
  const start = objectPos.clone().add(new THREE.Vector3(
    Math.cos(angle)*Math.cos(elev)*startDist,
    Math.sin(elev)*startDist,
    Math.sin(angle)*Math.cos(elev)*startDist
  ));
  
  const dir = new THREE.Vector3(
    (rng()-0.5)*1.2,
    (rng()-0.5)*1.4,
    (rng()-0.5)*1.2
  ).normalize();
  
  const segLen = 1.1 + rng()*1.1;
  const p1 = start.clone().add(dir.clone().multiplyScalar(segLen));
  setLine(start, p1);
  
  if(li<NUM_LINES-18 && rng()<0.52){
    const fork1 = dir.clone().applyAxisAngle(
      new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
      0.58 + rng()*0.64
    ).normalize();
    const p2a = p1.clone().add(fork1.multiplyScalar(segLen*0.68));
    setLine(p1, p2a);
    
    if(li<NUM_LINES-16 && rng()<0.38){
      const fork2 = dir.clone().applyAxisAngle(
        new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize(),
        -0.58 - rng()*0.64
      ).normalize();
      const p2b = p1.clone().add(fork2.multiplyScalar(segLen*0.64));
      setLine(p1, p2b);
    }
  }
}

// HORIZONTAL THREADS — reduced
for(let i=0; i<320 && li<NUM_LINES-2200; i++){
  const y = objectPos.y + (rng()-0.5)*6.8;
  const x1 = -hw + rng()*3.8;
  const z1 = (rng()-0.5)*ROOM.d*0.86;
  const x2 = hw - rng()*3.8;
  const z2 = (rng()-0.5)*ROOM.d*0.86;
  setLine(new THREE.Vector3(x1, y, z1), new THREE.Vector3(x2, y, z2));
}

// VERTICAL THREADS — sparse
for(let i=0; i<240 && li<NUM_LINES-1800; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  const a = new THREE.Vector3(x, -hh, z);
  const b = new THREE.Vector3(x + (rng()-0.5)*1.0, hh, z + (rng()-0.5)*1.0);
  setLine(a, b);
}

// DIAGONAL CROSS-THREADS — minimal
for(let i=0; i<180 && li<NUM_LINES-1400; i++){
  const x1 = (rng()-0.5)*ROOM.w*0.82;
  const z1 = (rng()-0.5)*ROOM.d*0.82;
  const a = new THREE.Vector3(x1, -hh, z1);
  
  const x2 = x1 + (rng()-0.5)*6.4;
  const z2 = z1 + (rng()-0.5)*6.4;
  const b = new THREE.Vector3(x2, hh, z2);
  setLine(a, b);
}

// WALL-TO-WALL SPANS — essential structure
let wallSpans = 0;
while(wallSpans<1000 && li<NUM_LINES-400){
  const a = wallPt();
  const b = wallPt();
  const d = a.distanceTo(b);
  if(d>7.0 && d<18.0){
    setLine(a, b);
    wallSpans++;
  }
}

// FILL remaining
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>5.5 && d<13.0){
    setLine(a, b);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xa88860, transparent: true, opacity: 0.068,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: true
}));
scene.add(threads);

// CAMERA PATH — slower, contemplative
const pathLen = 2200;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.38){
    const lt = t/0.38;
    const angle = Math.PI*0.06 + lt*Math.PI*0.82;
    const r = 16.4 - lt*5.2;
    x = objectPos.x + Math.cos(angle)*r;
    y = objectPos.y + 7.2 - lt*4.8;
    z = objectPos.z + Math.sin(angle)*r;
  } else if(t<0.64){
    const lt = (t-0.38)/0.26;
    const angle = Math.PI*0.88 + lt*Math.PI*1.12;
    const r = 11.2 + Math.sin(lt*Math.PI*1.2)*1.4;
    x = objectPos.x + Math.cos(angle)*r;
    y = objectPos.y + 1.8 + Math.cos(lt*Math.PI*1.4)*1.2;
    z = objectPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.64)/0.36;
    const angle = Math.PI*2.00 + lt*Math.PI*0.88;
    const r = 10.8 + lt*6.8;
    x = objectPos.x + Math.cos(angle)*r;
    y = objectPos.y + 2.4 + lt*4.8;
    z = objectPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Micro breath — more restrained
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<Math.min(li, 4000); i++){
    const idx=i*6;
    const phase = basePositions[idx]*0.012 + basePositions[idx+1]*0.018 + i*0.000032;
    const breath = Math.sin(elapsed*0.00020 + phase)*0.000005;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.006;
      arr[vi+1] = basePositions[vi+1] + breath*0.005;
      arr[vi+2] = basePositions[vi+2] + breath*0.007;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Object subtle rotation
  suspendedObject.rotation.y = 0.52 + Math.sin(elapsed*0.000028)*0.028;
  suspendedObject.rotation.x = 0.08 + Math.cos(elapsed*0.000032)*0.022;

  // Camera dolly — slower
  const speed = 0.000008;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    objectPos.x + Math.sin(elapsed*0.000042)*0.10,
    objectPos.y + Math.cos(elapsed*0.000036)*0.08,
    objectPos.z + Math.sin(elapsed*0.000028)*0.06
  );

  key1.intensity = 0.012 + Math.sin(elapsed*0.000032)*0.0028;
  objectGlow.intensity = 0.005 + Math.sin(elapsed*0.000038)*0.0018;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
