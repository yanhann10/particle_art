<div class="id">s31</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* Intent: "Infinite Garden" — a Poincaré-disk hyperbolic tiling where every cell
   is a leaf-shaped particle cluster. Cells shrink toward the rim, evoking
   Escher's Circle Limit III reimagined as a pressed herbarium. Breathing wave
   ripples outward from center. Palette: bone / sage / ash. Technique: hyperbolic
   tiling. Reference: Escher Circle Limit × Agnes Martin's graphite grids. */

const W = 512, H = 512, N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x080b10, 1);
document.body.appendChild(renderer.domElement);

// ---- Hyperbolic tiling: concentric rings with increasing cell count ----
const tiles = [];
tiles.push({ cx: 0, cy: 0, size: 0.16 });

for (let k = 1; k <= 16; k++) {
  const eucR  = Math.tanh(k * 0.22);
  const prevR = Math.tanh((k - 1) * 0.22);
  const cellH = (eucR - prevR) * 0.48;
  const nC    = Math.max(6, Math.round(2 * Math.PI * eucR / (cellH * 2.2)));
  const off   = (k & 1) * Math.PI / nC;
  for (let j = 0; j < nC; j++) {
    const a = (j / nC) * Math.PI * 2 + off;
    tiles.push({ cx: Math.cos(a) * eucR, cy: Math.sin(a) * eucR, size: cellH });
  }
}

// ---- Distribute particles: leaf shapes within each tile ----
const totalArea = tiles.reduce((s, t) => s + t.size * t.size, 0);
const init = new Float32Array(N * 4);
let idx = 0;

for (const tile of tiles) {
  const count = Math.round((tile.size * tile.size / totalArea) * N * 0.93);
  const isCenter = tile.cx === 0 && tile.cy === 0;
  const baseA = isCenter ? 0 : Math.atan2(tile.cy, tile.cx);

  for (let i = 0; i < count && idx < N; i++, idx++) {
    const t = Math.random();
    const leafLen = tile.size * 0.80;
    const maxHW   = tile.size * 0.26;
    const hw = maxHW * Math.pow(Math.sin(t * Math.PI), 0.6) * (0.45 + Math.random() * 0.55);
    const lx = (t - 0.5) * leafLen;
    const ly = (Math.random() * 2 - 1) * hw;
    const a  = isCenter ? Math.random() * Math.PI * 2 : baseA + (Math.random() - 0.5) * 0.22;
    const ca = Math.cos(a), sa = Math.sin(a);
    init[idx * 4]     = tile.cx + lx * ca - ly * sa;
    init[idx * 4 + 1] = tile.cy + lx * sa + ly * ca;
    init[idx * 4 + 2] = tile.cx;
    init[idx * 4 + 3] = tile.cy;
  }
}
// remainder: faint dust near rim
while (idx < N) {
  const r = 0.86 + Math.random() * 0.12;
  const a = Math.random() * Math.PI * 2;
  init[idx * 4]     = Math.cos(a) * r;
  init[idx * 4 + 1] = Math.sin(a) * r;
  init[idx * 4 + 2] = Math.cos(a) * r;
  init[idx * 4 + 3] = Math.sin(a) * r;
  idx++;
}

// ---- GPGPU ping-pong ----
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
              minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
              wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
              depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader:   `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camO = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitS = new THREE.Scene();
blitS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitS, camO);
renderer.setRenderTarget(null);

// ---- Sim: radial breathing wave ----
const simU = { prev: { value: rtA.texture }, uTime: { value: 0 } };
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec2 pos = s.xy, tc = s.zw;
      vec2 toTC = tc - pos;
      float d = length(toTC);
      float phase = length(tc) * 9.0 + uTime * 0.35;
      float breath = sin(phase) * 0.005;
      if(d > 0.0004) pos += normalize(toTC) * breath * d;
      float r = length(pos);
      if(r > 0.995) pos *= 0.995 / r;
      gl_FragColor = vec4(pos, tc);
    }`
});
const simS = new THREE.Scene();
simS.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// ---- Render pass ----
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 0, 58);
camera.lookAt(0, 0, 0);

const geom  = new THREE.BufferGeometry();
const uvArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvArr[i * 2]     = (x + 0.5) / W;
  uvArr[i * 2 + 1] = (y + 0.5) / H;
}
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geom.setAttribute('uvIdx',    new THREE.BufferAttribute(uvArr, 2));

const ptMat = new THREE.ShaderMaterial({
  uniforms: {
    state: { value: rtA.texture },
    uPx:   { value: renderer.getPixelRatio() }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPx;
    attribute vec2 uvIdx;
    varying float vAngle;
    varying float vDiskR;
    varying float vAlpha;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec2 pos = s.xy, tc = s.zw;
      float diskR = length(pos);
      vDiskR  = diskR;
      vAngle  = length(tc) > 0.004 ? atan(tc.y, tc.x) : 0.0;
      vAlpha  = smoothstep(0.98, 0.80, diskR);
      float SC = 26.0;
      vec3 p = vec3(pos.x * SC, pos.y * SC, (1.0 - diskR * diskR) * 3.2);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      float tS = 1.0 - smoothstep(0.0, 0.88, length(tc));
      gl_PointSize = (1.0 + tS * 5.8) * uPx * (52.0 / max(dist, 1.0));
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying float vAngle;
    varying float vDiskR;
    varying float vAlpha;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float co = cos(vAngle), si = sin(vAngle);
      vec2 r = vec2(co*uv.x + si*uv.y, -si*uv.x + co*uv.y);
      float along  = r.x + 0.5;
      float across = abs(r.y);
      float edge   = 0.35 * pow(sin(clamp(along, 0.0, 1.0) * 3.14159), 0.55);
      if(across > edge || along < 0.03 || along > 0.97) discard;
      float ef  = 1.0 - smoothstep(edge * 0.4, edge, across);
      float mid = smoothstep(0.016, 0.003, across);
      // veins: diagonal pairs from midrib
      float vein = 0.0;
      for(float v = 0.18; v < 0.85; v += 0.14){
        float dx = r.x - (v - 0.5);
        if(abs(dx) < 0.12){
          float vy = abs(r.y) - abs(dx) * 0.55;
          vein += smoothstep(0.012, 0.003, abs(vy)) * smoothstep(0.12, 0.0, abs(dx)) * 0.35;
        }
      }
      vec3 bone = vec3(0.74, 0.68, 0.54);
      vec3 sage = vec3(0.40, 0.46, 0.34);
      vec3 ash  = vec3(0.26, 0.24, 0.20);
      vec3 col  = mix(bone, sage, smoothstep(0.0, 0.5, vDiskR));
      col = mix(col, ash, smoothstep(0.55, 0.94, vDiskR));
      col += col * (mid + vein) * 0.18;
      float a = ef * vAlpha * 0.42;
      gl_FragColor = vec4(col * a, a);
    }`
});
scene.add(new THREE.Points(geom, ptMat));

// ---- Boundary glow: the infinite edge ----
const ringG = new THREE.RingGeometry(25.2, 28.8, 96);
const ringM = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec2 vUv; void main(){
    float f = smoothstep(0.0,0.4,vUv.x)*smoothstep(1.0,0.6,vUv.x);
    vec3 c = vec3(0.52,0.46,0.30);
    gl_FragColor = vec4(c*f*0.055, f*0.055);
  }`
});
scene.add(new THREE.Mesh(ringG, ringM));

// ---- Faint center warmth (backside hemisphere) ----
const glG = new THREE.SphereGeometry(14, 32, 32);
const glM = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.BackSide,
  vertexShader: `varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal);
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `varying vec3 vN; void main(){
    float f = pow(1.0 - abs(dot(vN, vec3(0,0,1))), 2.8);
    vec3 c = vec3(0.60,0.52,0.36);
    gl_FragColor = vec4(c*f*0.07, f*0.07);
  }`
});
scene.add(new THREE.Mesh(glG, glM));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---- Loop ----
function loop() {
  const t = performance.now() / 1000;
  simU.uTime.value = t;
  simU.prev.value  = rtA.texture;
  renderer.setRenderTarget(rtB);
  renderer.render(simS, camO);
  const tmp = rtA; rtA = rtB; rtB = tmp;
  renderer.setRenderTarget(null);

  ptMat.uniforms.state.value = rtA.texture;

  // ultra-slow lateral drift — parallax reveals dome depth
  camera.position.x = Math.sin(t * 0.022) * 1.6;
  camera.position.y = Math.cos(t * 0.016) * 1.1;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
