<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<title>fmh · L-system tree with feedback trails</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#070908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">fmh</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>
<div class="src">procedural · L-system + feedback trails · 80k particles</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'           },
    { p: 0.15, s: 'F[/F][\\F]F'          },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'      },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES) {
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str, depthFactor){
  const H = new THREE.Vector3(0, 1, 0);
  const L = new THREE.Vector3(-1, 0, 0);
  const U = new THREE.Vector3(0, 0, 1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, -7, 0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': {
        const step = STEP_BASE * Math.pow(depthFactor, gen);
        const nextPos = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: nextPos.clone(), gen });
        pos = nextPos;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen;
        break;
      }
    }
  }
  return segments;
}

function buildParticles(segments, totalN){
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a,b)=>a+b, 0);
  const positions = new Float32Array(totalN * 3);
  const seeds     = new Float32Array(totalN);
  const gens      = new Float32Array(totalN);
  const lengths   = new Float32Array(totalN);
  const v = new THREE.Vector3();
  let written = 0;
  for (let i = 0; i < segments.length; i++){
    const share = i === segments.length - 1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));
    for (let k = 0; k < share && written < totalN; k++){
      const t = Math.random();
      v.lerpVectors(segments[i].from, segments[i].to, t);
      const jitter = 0.04 * Math.pow(0.85, segments[i].gen);
      v.x += (Math.random()-0.5) * jitter;
      v.y += (Math.random()-0.5) * jitter;
      v.z += (Math.random()-0.5) * jitter;
      positions[written*3]   = v.x;
      positions[written*3+1] = v.y;
      positions[written*3+2] = v.z;
      seeds[written]   = Math.random();
      gens[written]    = segments[i].gen;
      lengths[written] = t;
      written++;
    }
  }
  return { positions, seeds, gens, lengths };
}

/* ── renderer + scene ── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070908, 1);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 4, 22);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 2, 0);

/* ── feedback ping-pong render targets ── */
function makeRT(w, h){
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: THREE.HalfFloatType,
  });
}
let rtW = Math.floor(innerWidth * Math.min(devicePixelRatio, 2));
let rtH = Math.floor(innerHeight * Math.min(devicePixelRatio, 2));
let rtA = makeRT(rtW, rtH);
let rtB = makeRT(rtW, rtH);

/* ── fullscreen quad for feedback composite ── */
const feedbackScene = new THREE.Scene();
const feedbackCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const feedbackMat = new THREE.ShaderMaterial({
  uniforms: {
    uPrev: { value: null },
    uFade: { value: 0.92 },
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D uPrev;
    uniform float uFade;
    varying vec2 vUv;
    void main(){
      vec4 prev = texture2D(uPrev, vUv);
      /* slight warm color shift on trail decay — trails age from green toward amber */
      prev.r *= (uFade + 0.006);
      prev.g *= uFade;
      prev.b *= (uFade - 0.004);
      /* clamp to prevent accumulation drift */
      prev = clamp(prev, 0.0, 1.0);
      gl_FragColor = prev;
    }
  `,
  depthTest: false, depthWrite: false,
});
const feedbackQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2), feedbackMat
);
feedbackScene.add(feedbackQuad);

/* ── final composite to screen ── */
const compositeScene = new THREE.Scene();
const compositeMat = new THREE.ShaderMaterial({
  uniforms: { uTex: { value: null } },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D uTex;
    varying vec2 vUv;
    void main(){
      vec4 c = texture2D(uTex, vUv);
      /* subtle film grain */
      float grain = fract(sin(dot(vUv * 431.7, vec2(12.9898, 78.233))) * 43758.5453) * 0.025;
      gl_FragColor = vec4(c.rgb + grain * 0.15, 1.0);
    }
  `,
  depthTest: false, depthWrite: false,
});
compositeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compositeMat));

/* ── particles ── */
const N = 80000;
let geom, points;

const particleUniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
};
const particleMat = new THREE.ShaderMaterial({
  uniforms: particleUniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    attribute float seed;
    attribute float gen;
    attribute float lengthT;
    varying vec3 vCol;
    varying float vGen;
    varying float vEnergy;
    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;
      /* sway — stronger at tips, wind-like drift */
      float sway = 0.09 * gen * (0.5 + 0.5*sin(t * 0.55));
      float windPhase = t * 0.7 + p.y * 0.25;
      p.x += sway * sin(windPhase);
      p.z += sway * 0.6 * cos(windPhase * 0.9 + 1.3);
      /* secondary micro-tremor at leaf tips */
      float tremor = step(3.0, gen) * 0.03 * sin(t * 3.7 + seed * 12.0);
      p.x += tremor;
      p.y += tremor * 0.5;

      /* reveal: particles drift in from above */
      vec3 entry = vec3(seed*4.0 - 2.0, 25.0 + seed*8.0, seed*4.0 - 2.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      vGen = gen;
      vEnergy = 0.5 + 0.5 * sin(t * 0.5);
      /* palette: warm bark → mossy green → bright lime tips
         hand-picked: trunk=#73503A, mid=#6B9E57, tips=#D9F280 */
      vec3 bark = vec3(0.45, 0.31, 0.23);
      vec3 moss = vec3(0.42, 0.62, 0.34);
      vec3 lime = vec3(0.85, 0.95, 0.50);
      float k = clamp(gen * 0.18, 0.0, 1.0);
      vCol = mix(bark, moss, k);
      vCol = mix(vCol, lime, smoothstep(0.6, 1.0, k));

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* tips slightly larger for leaf read */
      float tipBoost = 1.0 + 0.4 * smoothstep(3.0, 5.0, gen);
      gl_PointSize = tipBoost * (1.0 + 0.5*vEnergy) * uPixel * (38.0/dist) * (0.4 + 0.6*uReady);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vGen;
    varying float vEnergy;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      /* leaf-shaped falloff for tips: elongate along one axis */
      float leafShape = vGen > 3.0
        ? exp(-(d.x*d.x*22.0 + d.y*d.y*12.0))
        : exp(-r * 17.0);
      float a = leafShape * (0.6 + 0.4*vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;

function regrow(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('F', 5, rng);
  const segs = turtle(str, 0.78);
  const bb = new THREE.Box3();
  for (const s of segs) { bb.expandByPoint(s.from); bb.expandByPoint(s.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn = bb.min;
  for (const s of segs){
    s.from.x -= ctr.x; s.from.z -= ctr.z; s.from.y -= mn.y - (-7);
    s.to.x   -= ctr.x; s.to.z   -= ctr.z; s.to.y   -= mn.y - (-7);
  }
  const { positions, seeds, gens, lengths } = buildParticles(segs, N);
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    geom.setAttribute('lengthT',  new THREE.BufferAttribute(lengths, 1));
    points = new THREE.Points(geom, particleMat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
    geom.attributes.lengthT.array.set(lengths);     geom.attributes.lengthT.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  /* clear feedback buffers on regrow so old tree doesn't ghost */
  renderer.setRenderTarget(rtA); renderer.clear();
  renderer.setRenderTarget(rtB); renderer.clear();
  renderer.setRenderTarget(null);
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rtW = Math.floor(innerWidth * Math.min(devicePixelRatio, 2));
  rtH = Math.floor(innerHeight * Math.min(devicePixelRatio, 2));
  rtA.setSize(rtW, rtH);
  rtB.setSize(rtW, rtH);
});

/* ── ambient atmosphere: faint ground fog plane ── */
const fogGeo = new THREE.PlaneGeometry(60, 60);
const fogMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  uniforms: { uTime: particleUniforms.uTime },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float d = length(vUv - 0.5);
      float fog = exp(-d * 3.5) * 0.08;
      float drift = sin(vUv.x * 4.0 + uTime * 0.15) * cos(vUv.y * 3.0 + uTime * 0.1) * 0.03;
      vec3 col = vec3(0.35, 0.45, 0.3);
      gl_FragColor = vec4(col, fog + drift);
    }
  `
});
const fogPlane = new THREE.Mesh(fogGeo, fogMat);
fogPlane.rotation.x = -Math.PI / 2;
fogPlane.position.y = -6.8;
scene.add(fogPlane);

/* ── render loop with feedback ── */
const start = performance.now();
function loop(){
  const now = performance.now();
  particleUniforms.uTime.value = (now - start) / 1000;
  if (revealStart > 0) {
    particleUniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2200);
  }
  controls.update();

  /* 1. Draw faded previous frame into rtB */
  feedbackMat.uniforms.uPrev.value = rtA.texture;
  renderer.setRenderTarget(rtB);
  renderer.clear();
  renderer.render(feedbackScene, feedbackCam);

  /* 2. Render current particles on top of rtB */
  renderer.render(scene, camera);

  /* 3. Swap */
  const tmp = rtA; rtA = rtB; rtB = tmp;

  /* 4. Draw final composite to screen */
  compositeMat.uniforms.uTex.value = rtB.texture;
  renderer.setRenderTarget(null);
  renderer.clear();
  renderer.render(compositeScene, feedbackCam);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
