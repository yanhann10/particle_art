<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9mg · chalice — vessel of suspended light</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a0608; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">9mg</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0608);
scene.fog = new THREE.FogExp2(0x0a0608, 0.038);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 120);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x2a1a15, 0.6);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffd9b3, 0.8);
dirLight.position.set(-2, 6, 3);
scene.add(dirLight);

// ── Deterministic RNG
let rngState = 91827364;
function rng(){ rngState |= 0; rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// ── Chalice structure
const chaliceCenter = new THREE.Vector3(0, -1.2, -8);

// Cup bowl — upper hemisphere
const cupRadius = 2.4;
const cupGeo = new THREE.SphereGeometry(cupRadius, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
const cupMat = new THREE.MeshStandardMaterial({
  color: 0xf5e8d0,
  emissive: 0xf5e8d0,
  emissiveIntensity: 0.5,
  roughness: 0.85,
  metalness: 0.1,
  transparent: true,
  opacity: 0.22,
  side: THREE.DoubleSide
});
const cup = new THREE.Mesh(cupGeo, cupMat);
cup.position.copy(chaliceCenter);
cup.position.y += 1.8;
scene.add(cup);

// Stem — narrow cylinder
const stemGeo = new THREE.CylinderGeometry(0.18, 0.24, 3.2, 16);
const stemMat = new THREE.MeshStandardMaterial({
  color: 0xe8dcc0,
  emissive: 0xe8dcc0,
  emissiveIntensity: 0.35,
  roughness: 0.9,
  metalness: 0.05,
  transparent: true,
  opacity: 0.28
});
const stem = new THREE.Mesh(stemGeo, stemMat);
stem.position.copy(chaliceCenter);
stem.position.y += 0.2;
scene.add(stem);

// Base — flat disc
const baseGeo = new THREE.CylinderGeometry(1.1, 1.3, 0.3, 24);
const baseMat = new THREE.MeshStandardMaterial({
  color: 0xe0d0b0,
  emissive: 0xe0d0b0,
  emissiveIntensity: 0.3,
  roughness: 0.88,
  metalness: 0.08,
  transparent: true,
  opacity: 0.25
});
const base = new THREE.Mesh(baseGeo, baseMat);
base.position.copy(chaliceCenter);
base.position.y -= 1.4;
scene.add(base);

// ── Thread anchors on chalice surface
const anchors = [];

// Anchors on cup rim (circular edge)
const RIM_ANCHORS = 80;
for (let i = 0; i < RIM_ANCHORS; i++){
  const angle = (i / RIM_ANCHORS) * Math.PI * 2;
  const p = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * cupRadius,
    chaliceCenter.y + 1.8,
    chaliceCenter.z + Math.sin(angle) * cupRadius
  );
  anchors.push(p);
}

// Anchors on cup bowl surface
const BOWL_ANCHORS = 200;
for (let i = 0; i < BOWL_ANCHORS; i++){
  const angle = rng() * Math.PI * 2;
  const elevation = rng() * Math.PI * 0.5; // hemisphere
  const r = cupRadius * (0.95 + rng() * 0.05);
  const p = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * Math.sin(elevation) * r,
    chaliceCenter.y + 1.8 - Math.cos(elevation) * r,
    chaliceCenter.z + Math.sin(angle) * Math.sin(elevation) * r
  );
  anchors.push(p);
}

// Anchors on stem
const STEM_ANCHORS = 60;
for (let i = 0; i < STEM_ANCHORS; i++){
  const angle = rng() * Math.PI * 2;
  const h = (rng() - 0.5) * 3.0;
  const sr = 0.2 + (Math.abs(h) / 1.6) * 0.04;
  const p = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * sr,
    chaliceCenter.y + 0.2 + h,
    chaliceCenter.z + Math.sin(angle) * sr
  );
  anchors.push(p);
}

// Anchors on base edge
const BASE_ANCHORS = 50;
for (let i = 0; i < BASE_ANCHORS; i++){
  const angle = rng() * Math.PI * 2;
  const br = 1.15 + rng() * 0.1;
  const p = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * br,
    chaliceCenter.y - 1.3 + (rng() - 0.5) * 0.25,
    chaliceCenter.z + Math.sin(angle) * br
  );
  anchors.push(p);
}

// Ambient space anchors (farther from chalice)
const SPACE_ANCHORS = 150;
for (let i = 0; i < SPACE_ANCHORS; i++){
  const angle = rng() * Math.PI * 2;
  const elevation = (rng() - 0.5) * Math.PI * 0.7;
  const dist = 5 + rng() * 8;
  const p = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * Math.cos(elevation) * dist,
    chaliceCenter.y + Math.sin(elevation) * dist,
    chaliceCenter.z + Math.sin(angle) * Math.cos(elevation) * dist
  );
  anchors.push(p);
}

// ── Build thread network
const NUM_LINES = 20000;
const linePositions = new Float32Array(NUM_LINES * 6);
let li = 0;

// Category 1: Threads converging into cup (40%)
const catA = Math.floor(NUM_LINES * 0.40);
for (let i = 0; i < catA && li < NUM_LINES; i++){
  const aIdx = Math.floor(rng() * anchors.length);
  const a = anchors[aIdx];
  
  // Pick target inside cup bowl
  const angle = rng() * Math.PI * 2;
  const elevation = rng() * Math.PI * 0.5;
  const r = rng() * cupRadius * 0.85;
  const b = new THREE.Vector3(
    chaliceCenter.x + Math.cos(angle) * Math.sin(elevation) * r,
    chaliceCenter.y + 1.8 - Math.cos(elevation) * r,
    chaliceCenter.z + Math.sin(angle) * Math.sin(elevation) * r
  );
  
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  li++;
}

// Category 2: Rim to stem threads (25%)
const catB = Math.floor(NUM_LINES * 0.25);
for (let i = 0; i < catB && li < NUM_LINES; i++){
  const rimIdx = Math.floor(rng() * RIM_ANCHORS);
  const a = anchors[rimIdx];
  
  const stemIdx = RIM_ANCHORS + BOWL_ANCHORS + Math.floor(rng() * STEM_ANCHORS);
  const b = anchors[stemIdx];
  
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  li++;
}

// Category 3: Local surface connections (20%)
const catC = Math.floor(NUM_LINES * 0.20);
for (let i = 0; i < catC && li < NUM_LINES; i++){
  const aIdx = Math.floor(rng() * (RIM_ANCHORS + BOWL_ANCHORS + STEM_ANCHORS + BASE_ANCHORS));
  const a = anchors[aIdx];
  
  let best = null, bestDist = Infinity;
  for (let j = 0; j < 6; j++){
    const bIdx = Math.floor(rng() * (RIM_ANCHORS + BOWL_ANCHORS + STEM_ANCHORS + BASE_ANCHORS));
    if (bIdx === aIdx) continue;
    const d = a.distanceTo(anchors[bIdx]);
    if (d < bestDist && d > 0.15 && d < 3.5){ bestDist = d; best = anchors[bIdx]; }
  }
  
  if (!best) continue;
  
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = best.x; linePositions[idx+4] = best.y; linePositions[idx+5] = best.z;
  li++;
}

// Category 4: Space to chalice threads (15%)
const remaining = NUM_LINES - li;
for (let i = 0; i < remaining && li < NUM_LINES; i++){
  const spaceIdx = RIM_ANCHORS + BOWL_ANCHORS + STEM_ANCHORS + BASE_ANCHORS + Math.floor(rng() * SPACE_ANCHORS);
  const a = anchors[spaceIdx];
  
  const targetIdx = Math.floor(rng() * (RIM_ANCHORS + BOWL_ANCHORS + STEM_ANCHORS));
  const b = anchors[targetIdx];
  
  const idx = li * 6;
  linePositions[idx]   = a.x; linePositions[idx+1] = a.y; linePositions[idx+2] = a.z;
  linePositions[idx+3] = b.x; linePositions[idx+4] = b.y; linePositions[idx+5] = b.z;
  li++;
}

const basePositions = new Float32Array(linePositions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));

const lineMat = new THREE.LineBasicMaterial({
  color: 0xd4a574,
  transparent: true,
  opacity: 0.08,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
});
const threads = new THREE.LineSegments(lineGeo, lineMat);
scene.add(threads);

// ── Floating fragments (light motes)
const NUM_FRAGMENTS = 28;
const fragments = [];
const TRAIL_LENGTH = 60;
const trailFragments = [];

for (let i = 0; i < NUM_FRAGMENTS; i++){
  const size = 0.04 + rng() * 0.12;
  const geo = new THREE.OctahedronGeometry(size, 0);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.95, 0.88 + rng()*0.08, 0.75 + rng()*0.15),
    transparent: true,
    opacity: 0.5 + rng() * 0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  
  // Start near cup rim or inside bowl
  const angle = rng() * Math.PI * 2;
  const inBowl = rng() > 0.3;
  if (inBowl){
    const elevation = rng() * Math.PI * 0.5;
    const r = rng() * cupRadius * 0.8;
    mesh.position.set(
      chaliceCenter.x + Math.cos(angle) * Math.sin(elevation) * r,
      chaliceCenter.y + 1.8 - Math.cos(elevation) * r,
      chaliceCenter.z + Math.sin(angle) * Math.sin(elevation) * r
    );
  } else {
    mesh.position.set(
      chaliceCenter.x + Math.cos(angle) * cupRadius * (0.9 + rng()*0.1),
      chaliceCenter.y + 1.8,
      chaliceCenter.z + Math.sin(angle) * cupRadius * (0.9 + rng()*0.1)
    );
  }
  
  mesh.rotation.set(rng()*Math.PI, rng()*Math.PI, rng()*Math.PI);
  
  mesh.userData.vel = new THREE.Vector3(
    (rng()-0.5) * 0.006,
    0.003 + rng() * 0.006,
    (rng()-0.5) * 0.006
  );
  mesh.userData.orbitPhase = rng() * Math.PI * 2;
  mesh.userData.orbitSpeed = 0.015 + rng() * 0.01;
  
  scene.add(mesh);
  fragments.push(mesh);
  
  // Trail system for subset
  if (i < 18){
    const history = [];
    for (let h = 0; h < TRAIL_LENGTH; h++){
      history.push(mesh.position.clone());
    }
    
    const trailPositions = new Float32Array((TRAIL_LENGTH - 1) * 6);
    const trailGeo = new THREE.BufferGeometry();
    trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
    
    const trailMat = new THREE.LineBasicMaterial({
      color: 0xc89060,
      transparent: true,
      opacity: 0.1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: true
    });
    
    const trailMesh = new THREE.LineSegments(trailGeo, trailMat);
    scene.add(trailMesh);
    
    trailFragments.push({
      fragment: mesh,
      history: history,
      trailMesh: trailMesh,
      writeIdx: 0
    });
  }
}

// ── Camera orbit
const cameraPath = {
  radius: 8.5,
  height: 1.5,
  speed: 0.022,
  lookOffset: new THREE.Vector3(0, 0.8, 0)
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;

  // Gentle breathing web
  const breathAmp = 0.012;
  const breathFreq = 0.25;
  const posAttr = lineGeo.attributes.position;
  const arr = posAttr.array;
  for (let i = 0; i < li * 6; i += 3){
    const bx = basePositions[i];
    const by = basePositions[i+1];
    const bz = basePositions[i+2];
    const phase = bx * 0.6 + by * 0.9 + bz * 0.4;
    const b = Math.sin(elapsed * breathFreq + phase) * breathAmp;
    arr[i]   = bx + b * 0.8;
    arr[i+1] = by + b;
    arr[i+2] = bz + b * 0.8;
  }
  posAttr.needsUpdate = true;

  // Float fragments upward and outward from cup
  fragments.forEach(frag => {
    const ud = frag.userData;
    const toCup = chaliceCenter.clone();
    toCup.y += 1.8;
    const distToCup = frag.position.distanceTo(toCup);
    
    // Rising force
    ud.vel.y += 0.0002;
    
    // Gentle spiral outward if above rim
    if (frag.position.y > chaliceCenter.y + 1.5){
      const angle = elapsed * ud.orbitSpeed + ud.orbitPhase;
      const spiral = new THREE.Vector3(
        Math.cos(angle) * 0.001,
        0,
        Math.sin(angle) * 0.001
      );
      ud.vel.add(spiral);
    }
    
    // Containment — keep motes near chalice
    if (distToCup > 6){
      const pullBack = toCup.clone().sub(frag.position).normalize().multiplyScalar(0.003);
      ud.vel.add(pullBack);
    }
    
    ud.vel.multiplyScalar(0.992);
    frag.position.add(ud.vel);
    
    frag.rotation.x += 0.004;
    frag.rotation.y += 0.005;
  });

  // Update trails
  trailFragments.forEach(tf => {
    const currentPos = tf.fragment.position.clone();
    tf.history[tf.writeIdx] = currentPos;
    tf.writeIdx = (tf.writeIdx + 1) % TRAIL_LENGTH;
    
    const trailArr = tf.trailMesh.geometry.attributes.position.array;
    let ti = 0;
    for (let i = 0; i < TRAIL_LENGTH - 1; i++){
      const idx = (tf.writeIdx + i) % TRAIL_LENGTH;
      const nextIdx = (idx + 1) % TRAIL_LENGTH;
      const p1 = tf.history[idx];
      const p2 = tf.history[nextIdx];
      trailArr[ti++] = p1.x;
      trailArr[ti++] = p1.y;
      trailArr[ti++] = p1.z;
      trailArr[ti++] = p2.x;
      trailArr[ti++] = p2.y;
      trailArr[ti++] = p2.z;
    }
    tf.trailMesh.geometry.attributes.position.needsUpdate = true;
  });

  // Camera rotation around chalice
  const angle = elapsed * cameraPath.speed;
  const cr = cameraPath.radius;
  const lookTarget = chaliceCenter.clone().add(cameraPath.lookOffset);
  camera.position.set(
    chaliceCenter.x + Math.cos(angle) * cr,
    chaliceCenter.y + cameraPath.height + Math.sin(elapsed * 0.015) * 0.8,
    chaliceCenter.z + Math.sin(angle) * cr
  );
  camera.lookAt(lookTarget);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
