<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────────────────────────────────────────────
// CONCEPT: Gravitational sculpture — Cor-Ten rust steel palette (#b5541a / #7a3a10 / #2a1a0d)
// ONE dominant tilted ring (R=80, tube=6, leaning 55°) commands the scene.
// Four satellites: 2 tall leaning plates, 1 bent arc, 1 smaller ring.
// Shapes nearly touch — proximity IS the tension. All share one material family.
// Slow physical wobble on each form (sin micro-oscillation, different phases).
// Warm hard shadow from high directional light — shadow movement IS composition.
// Ground plane dark — shadow visible as lighter marks.
// ─────────────────────────────────────────────────────────────────────────────

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100a05);
scene.fog = new THREE.Fog(0x100a05, 600, 1200);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 2000);
camera.position.set(180, 140, 320);
camera.lookAt(0, 30, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.2;
document.body.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.05;
ctrl.target.set(0, 30, 0);
ctrl.minDistance = 80;
ctrl.maxDistance = 800;

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTING — single warm key light (high angle), cool fill, no rim clutter
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a100a, 0.15));

const sun = new THREE.DirectionalLight(0xffe8b0, 9.0);
sun.position.set(280, 420, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 1400;
sun.shadow.camera.left   = -400;
sun.shadow.camera.right  =  400;
sun.shadow.camera.top    =  400;
sun.shadow.camera.bottom = -400;
sun.shadow.bias = -0.0002;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x2040a0, 0.5);
fill.position.set(-300, 60, -200);
scene.add(fill);

// ─────────────────────────────────────────────────────────────────────────────
// MATERIALS — mono-material: Cor-Ten rust orange family
// ─────────────────────────────────────────────────────────────────────────────
const matMain = new THREE.MeshStandardMaterial({
  color: 0xd06020,    // brighter Cor-Ten for more range
  roughness: 0.82,
  metalness: 0.25,
  side: THREE.DoubleSide,
  envMapIntensity: 0.3,
});
const matDark = new THREE.MeshStandardMaterial({
  color: 0x9a4818,
  roughness: 0.90,
  metalness: 0.15,
  side: THREE.DoubleSide,
  envMapIntensity: 0.2,
});
const matDeep = new THREE.MeshStandardMaterial({
  color: 0x5a2810,
  roughness: 0.94,
  metalness: 0.10,
  side: THREE.DoubleSide,
});

// ─────────────────────────────────────────────────────────────────────────────
// GROUND — receives shadow, very dark
// ─────────────────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x181008, roughness: 1.0, metalness: 0.0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -50;
ground.receiveShadow = true;
scene.add(ground);

// ─────────────────────────────────────────────────────────────────────────────
// HELPER: make a mesh that both casts and receives shadow
// ─────────────────────────────────────────────────────────────────────────────
function shadowMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ─────────────────────────────────────────────────────────────────────────────
// FORM 1: DOMINANT RING — TorusGeometry, R=80, tube=6, leaning 55° from vertical
// Center at origin, raised so bottom clears ground slightly
// ─────────────────────────────────────────────────────────────────────────────
const ringGeo = new THREE.TorusGeometry(80, 6, 24, 96);
const ring = shadowMesh(ringGeo, matMain);
// Lean: tilt the ring's axis. Ring plane starts XY, so rotation.x tilts toward viewer.
// 55° lean: the ring's center plane tilts so it faces a mix of up and sideways
ring.rotation.x = Math.PI / 2 - THREE.MathUtils.degToRad(55); // ring axis 55° from vertical
ring.rotation.z = THREE.MathUtils.degToRad(12);  // slight twist — less frontal, more dynamic
ring.position.set(0, 42, 0);
scene.add(ring);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 2: TALL PLATE A — BoxGeometry 8×130×4, leaning toward ring
// Far left, leans right at 18° — as if pulled by ring's gravity
// ─────────────────────────────────────────────────────────────────────────────
const plateAGeo = new THREE.BoxGeometry(8, 130, 4);
const plateA = shadowMesh(plateAGeo, matDark);
plateA.position.set(-110, 15, -20);
plateA.rotation.z = THREE.MathUtils.degToRad(-18);  // leans toward ring
plateA.rotation.y = THREE.MathUtils.degToRad(25);   // turned slightly
scene.add(plateA);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 3: TALL PLATE B — BoxGeometry 6×100×4, leaning OTHER direction
// Right side, close to ring — nearly touches. Lean 14° away, creating tension.
// ─────────────────────────────────────────────────────────────────────────────
const plateBGeo = new THREE.BoxGeometry(6, 100, 4);
const plateB = shadowMesh(plateBGeo, matDark);
plateB.position.set(75, 3, 60);  // note: close to ring edge
plateB.rotation.z = THREE.MathUtils.degToRad(14);   // leans away
plateB.rotation.y = THREE.MathUtils.degToRad(-30);  // angled toward viewer
scene.add(plateB);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 4: ARC — partial torus (150° sweep), smaller radius, different tilt
// Quotes the ring shape at 40% scale. Sits close to ring's lower hemisphere.
// Built as full torus, masked by clipping planes (cleaner than custom geo).
// Actually: build a proper arc mesh from vertices.
// ─────────────────────────────────────────────────────────────────────────────
function buildArc(R, tube, arcAngle, radialSeg=16, tubeSeg=64) {
  const positions = [];
  const normals   = [];
  const uvs       = [];
  const indices   = [];

  const sweep = arcAngle; // radians
  for (let j = 0; j <= tubeSeg; j++) {
    const u = j / tubeSeg;
    const theta = u * sweep - sweep * 0.5; // center the arc
    const cx = R * Math.cos(theta);
    const cz = R * Math.sin(theta);
    for (let i = 0; i <= radialSeg; i++) {
      const v = i / radialSeg;
      const phi = v * Math.PI * 2;
      const nx = Math.cos(theta) * Math.cos(phi);
      const ny = Math.sin(phi);
      const nz = Math.sin(theta) * Math.cos(phi);
      positions.push(cx + tube * nx, tube * ny, cz + tube * nz);
      normals.push(nx, ny, nz);
      uvs.push(u, v);
    }
  }
  for (let j = 0; j < tubeSeg; j++) {
    for (let i = 0; i < radialSeg; i++) {
      const a = j * (radialSeg + 1) + i;
      const b = a + radialSeg + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

const arcGeo = buildArc(34, 5, THREE.MathUtils.degToRad(150));
const arc = shadowMesh(arcGeo, matMain);
arc.position.set(20, -30, 40);        // below ring center — near bottom edge
arc.rotation.x = THREE.MathUtils.degToRad(80);  // nearly vertical
arc.rotation.y = THREE.MathUtils.degToRad(-40); // rotated to angle at ring
arc.rotation.z = THREE.MathUtils.degToRad(20);
scene.add(arc);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 5: SMALL RING — TorusGeometry R=22, tube=4, tilted differently
// Sits behind and slightly above dominant ring, interlocking visually
// ─────────────────────────────────────────────────────────────────────────────
const ring2Geo = new THREE.TorusGeometry(22, 4, 16, 64);
const ring2 = shadowMesh(ring2Geo, matDeep);
ring2.position.set(-30, 88, -18);   // elevated, behind main ring
ring2.rotation.x = THREE.MathUtils.degToRad(70);
ring2.rotation.z = THREE.MathUtils.degToRad(-35);
scene.add(ring2);

// ─────────────────────────────────────────────────────────────────────────────
// ANIMATION: physical wobble — each form has its own phase and axis
// rotation.z micro-oscillation → feels like wind on heavy steel
// Shadows move with the wobble — that's the art.
// ─────────────────────────────────────────────────────────────────────────────

// Base rotations stored so wobble is additive
const ringBase   = { z: ring.rotation.z,   y: ring.rotation.y,   x: ring.rotation.x   };
const plateABase = { z: plateA.rotation.z, y: plateA.rotation.y                         };
const plateBBase = { z: plateB.rotation.z, y: plateB.rotation.y                         };
const arcBase    = { x: arc.rotation.x,    y: arc.rotation.y,    z: arc.rotation.z     };
const ring2Base  = { x: ring2.rotation.x,  z: ring2.rotation.z                          };

// Click-to-push: when user clicks, give the nearest form a momentum kick
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
const allForms  = [ring, plateA, plateB, arc, ring2];
const kicks     = new Array(allForms.length).fill(0);

renderer.domElement.addEventListener('click', (e) => {
  pointer.set(
    (e.clientX / innerWidth)  * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(allForms);
  if (hits.length > 0) {
    const idx = allForms.indexOf(hits[0].object);
    if (idx >= 0) kicks[idx] = 0.12;
    // label
    const lbl = document.getElementById('label');
    const names = ['ring', 'plate A', 'plate B', 'arc', 'ring 2'];
    if (lbl) { lbl.textContent = names[idx]; lbl.style.color = 'rgba(181,84,26,0.75)'; setTimeout(() => lbl.style.color = 'rgba(181,84,26,0)', 1200); }
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // Kicks decay
  for (let i = 0; i < kicks.length; i++) kicks[i] *= 0.92;

  // RING wobble — slow, massive, authoritative
  ring.rotation.z = ringBase.z + Math.sin(t * 0.28) * 0.014 + kicks[0] * Math.sin(t * 3.5);
  ring.rotation.y = ringBase.y + Math.cos(t * 0.19) * 0.008;
  ring.rotation.x = ringBase.x + Math.sin(t * 0.22 + 0.8) * 0.006;

  // PLATE A wobble — thinner, oscillates faster
  plateA.rotation.z = plateABase.z + Math.sin(t * 0.41 + 1.2) * 0.018 + kicks[1] * Math.sin(t * 4.0);
  plateA.rotation.y = plateABase.y + Math.cos(t * 0.33 + 0.5) * 0.010;

  // PLATE B wobble — offset phase, leans toward and away from ring
  plateB.rotation.z = plateBBase.z + Math.sin(t * 0.36 + 2.4) * 0.016 + kicks[2] * Math.sin(t * 3.8);
  plateB.rotation.y = plateBBase.y + Math.cos(t * 0.28 + 1.8) * 0.012;

  // ARC wobble — small, hanging-like
  arc.rotation.x = arcBase.x + Math.sin(t * 0.52 + 0.3) * 0.020 + kicks[3] * Math.sin(t * 4.2);
  arc.rotation.y = arcBase.y + Math.cos(t * 0.38 + 1.0) * 0.014;
  arc.rotation.z = arcBase.z + Math.sin(t * 0.45 + 2.0) * 0.010;

  // RING 2 wobble — orbiting feel
  ring2.rotation.x = ring2Base.x + Math.sin(t * 0.35 + 3.1) * 0.015 + kicks[4] * Math.sin(t * 4.5);
  ring2.rotation.z = ring2Base.z + Math.cos(t * 0.27 + 0.7) * 0.020;

  ctrl.update();
  renderer.render(scene, camera);
}
animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
