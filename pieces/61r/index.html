<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>61r — leaning weight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a0f08; overflow: hidden; }
    #info {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(181,84,26,0.45); font: 11px/1.6 'SF Mono', monospace;
      letter-spacing: 0.08em; text-align: center; pointer-events: none;
    }
    #label {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(181,84,26,0.0); font: 12px/1 'SF Mono', monospace;
      letter-spacing: 0.12em; text-align: center; pointer-events: none;
      transition: color 0.6s;
    }
  </style>
</head>
<body>
<div id="info">61r · leaning weight · click to push</div>
<div id="label" id="label"></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─────────────────────────────────────────────────────────────────────────────
// CONCEPT: Gravitational sculpture — Cor-Ten rust steel palette (#b5541a / #7a3a10 / #2a1a0d)
// ONE dominant tilted ring (R=80, tube=6, leaning 55°) commands the scene.
// Four satellites: 2 tall leaning plates, 1 bent arc, 1 smaller ring.
// Shapes nearly touch — proximity IS the tension. All share one material family.
// Slow physical wobble on each form (sin micro-oscillation, different phases).
// Warm hard shadow from high directional light — shadow movement IS composition.
// Ground plane dark — shadow visible as lighter marks.
// ─────────────────────────────────────────────────────────────────────────────

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100a05);
scene.fog = new THREE.Fog(0x100a05, 600, 1200);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 1, 2000);
camera.position.set(180, 140, 320);
camera.lookAt(0, 30, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 2.2;
document.body.appendChild(renderer.domElement);

const ctrl = new OrbitControls(camera, renderer.domElement);
ctrl.enableDamping = true;
ctrl.dampingFactor = 0.05;
ctrl.target.set(0, 30, 0);
ctrl.minDistance = 80;
ctrl.maxDistance = 800;

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTING — single warm key light (high angle), cool fill, no rim clutter
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x1a100a, 0.15));

const sun = new THREE.DirectionalLight(0xffe8b0, 9.0);
sun.position.set(280, 420, 200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 1400;
sun.shadow.camera.left   = -400;
sun.shadow.camera.right  =  400;
sun.shadow.camera.top    =  400;
sun.shadow.camera.bottom = -400;
sun.shadow.bias = -0.0002;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x2040a0, 0.5);
fill.position.set(-300, 60, -200);
scene.add(fill);

// ─────────────────────────────────────────────────────────────────────────────
// MATERIALS — mono-material: Cor-Ten rust orange family
// ─────────────────────────────────────────────────────────────────────────────
const matMain = new THREE.MeshStandardMaterial({
  color: 0xd06020,    // brighter Cor-Ten for more range
  roughness: 0.82,
  metalness: 0.25,
  side: THREE.DoubleSide,
  envMapIntensity: 0.3,
});
const matDark = new THREE.MeshStandardMaterial({
  color: 0x9a4818,
  roughness: 0.90,
  metalness: 0.15,
  side: THREE.DoubleSide,
  envMapIntensity: 0.2,
});
const matDeep = new THREE.MeshStandardMaterial({
  color: 0x5a2810,
  roughness: 0.94,
  metalness: 0.10,
  side: THREE.DoubleSide,
});

// ─────────────────────────────────────────────────────────────────────────────
// GROUND — receives shadow, very dark
// ─────────────────────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(2000, 2000);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x181008, roughness: 1.0, metalness: 0.0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -50;
ground.receiveShadow = true;
scene.add(ground);

// ─────────────────────────────────────────────────────────────────────────────
// HELPER: make a mesh that both casts and receives shadow
// ─────────────────────────────────────────────────────────────────────────────
function shadowMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ─────────────────────────────────────────────────────────────────────────────
// FORM 1: DOMINANT RING — TorusGeometry, R=80, tube=6, leaning 55° from vertical
// Center at origin, raised so bottom clears ground slightly
// ─────────────────────────────────────────────────────────────────────────────
const ringGeo = new THREE.TorusGeometry(80, 6, 24, 96);
const ring = shadowMesh(ringGeo, matMain);
// Lean: tilt the ring's axis. Ring plane starts XY, so rotation.x tilts toward viewer.
// 55° lean: the ring's center plane tilts so it faces a mix of up and sideways
ring.rotation.x = Math.PI / 2 - THREE.MathUtils.degToRad(55); // ring axis 55° from vertical
ring.rotation.z = THREE.MathUtils.degToRad(12);  // slight twist — less frontal, more dynamic
ring.position.set(0, 42, 0);
scene.add(ring);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 2: TALL PLATE A — BoxGeometry 8×130×4, leaning toward ring
// Far left, leans right at 18° — as if pulled by ring's gravity
// ─────────────────────────────────────────────────────────────────────────────
const plateAGeo = new THREE.BoxGeometry(8, 130, 4);
const plateA = shadowMesh(plateAGeo, matDark);
plateA.position.set(-110, 15, -20);
plateA.rotation.z = THREE.MathUtils.degToRad(-18);  // leans toward ring
plateA.rotation.y = THREE.MathUtils.degToRad(25);   // turned slightly
scene.add(plateA);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 3: TALL PLATE B — BoxGeometry 6×100×4, leaning OTHER direction
// Right side, close to ring — nearly touches. Lean 14° away, creating tension.
// ─────────────────────────────────────────────────────────────────────────────
const plateBGeo = new THREE.BoxGeometry(6, 100, 4);
const plateB = shadowMesh(plateBGeo, matDark);
plateB.position.set(75, 3, 60);  // note: close to ring edge
plateB.rotation.z = THREE.MathUtils.degToRad(14);   // leans away
plateB.rotation.y = THREE.MathUtils.degToRad(-30);  // angled toward viewer
scene.add(plateB);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 4: ARC — partial torus (150° sweep), smaller radius, different tilt
// Quotes the ring shape at 40% scale. Sits close to ring's lower hemisphere.
// Built as full torus, masked by clipping planes (cleaner than custom geo).
// Actually: build a proper arc mesh from vertices.
// ─────────────────────────────────────────────────────────────────────────────
function buildArc(R, tube, arcAngle, radialSeg=16, tubeSeg=64) {
  const positions = [];
  const normals   = [];
  const uvs       = [];
  const indices   = [];

  const sweep = arcAngle; // radians
  for (let j = 0; j <= tubeSeg; j++) {
    const u = j / tubeSeg;
    const theta = u * sweep - sweep * 0.5; // center the arc
    const cx = R * Math.cos(theta);
    const cz = R * Math.sin(theta);
    for (let i = 0; i <= radialSeg; i++) {
      const v = i / radialSeg;
      const phi = v * Math.PI * 2;
      const nx = Math.cos(theta) * Math.cos(phi);
      const ny = Math.sin(phi);
      const nz = Math.sin(theta) * Math.cos(phi);
      positions.push(cx + tube * nx, tube * ny, cz + tube * nz);
      normals.push(nx, ny, nz);
      uvs.push(u, v);
    }
  }
  for (let j = 0; j < tubeSeg; j++) {
    for (let i = 0; i < radialSeg; i++) {
      const a = j * (radialSeg + 1) + i;
      const b = a + radialSeg + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

const arcGeo = buildArc(34, 5, THREE.MathUtils.degToRad(150));
const arc = shadowMesh(arcGeo, matMain);
arc.position.set(20, -30, 40);        // below ring center — near bottom edge
arc.rotation.x = THREE.MathUtils.degToRad(80);  // nearly vertical
arc.rotation.y = THREE.MathUtils.degToRad(-40); // rotated to angle at ring
arc.rotation.z = THREE.MathUtils.degToRad(20);
scene.add(arc);

// ─────────────────────────────────────────────────────────────────────────────
// FORM 5: SMALL RING — TorusGeometry R=22, tube=4, tilted differently
// Sits behind and slightly above dominant ring, interlocking visually
// ─────────────────────────────────────────────────────────────────────────────
const ring2Geo = new THREE.TorusGeometry(22, 4, 16, 64);
const ring2 = shadowMesh(ring2Geo, matDeep);
ring2.position.set(-30, 88, -18);   // elevated, behind main ring
ring2.rotation.x = THREE.MathUtils.degToRad(70);
ring2.rotation.z = THREE.MathUtils.degToRad(-35);
scene.add(ring2);

// ─────────────────────────────────────────────────────────────────────────────
// ANIMATION: physical wobble — each form has its own phase and axis
// rotation.z micro-oscillation → feels like wind on heavy steel
// Shadows move with the wobble — that's the art.
// ─────────────────────────────────────────────────────────────────────────────

// Base rotations stored so wobble is additive
const ringBase   = { z: ring.rotation.z,   y: ring.rotation.y,   x: ring.rotation.x   };
const plateABase = { z: plateA.rotation.z, y: plateA.rotation.y                         };
const plateBBase = { z: plateB.rotation.z, y: plateB.rotation.y                         };
const arcBase    = { x: arc.rotation.x,    y: arc.rotation.y,    z: arc.rotation.z     };
const ring2Base  = { x: ring2.rotation.x,  z: ring2.rotation.z                          };

// Click-to-push: when user clicks, give the nearest form a momentum kick
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
const allForms  = [ring, plateA, plateB, arc, ring2];
const kicks     = new Array(allForms.length).fill(0);

renderer.domElement.addEventListener('click', (e) => {
  pointer.set(
    (e.clientX / innerWidth)  * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(allForms);
  if (hits.length > 0) {
    const idx = allForms.indexOf(hits[0].object);
    if (idx >= 0) kicks[idx] = 0.12;
    // label
    const lbl = document.getElementById('label');
    const names = ['ring', 'plate A', 'plate B', 'arc', 'ring 2'];
    if (lbl) { lbl.textContent = names[idx]; lbl.style.color = 'rgba(181,84,26,0.75)'; setTimeout(() => lbl.style.color = 'rgba(181,84,26,0)', 1200); }
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // Kicks decay
  for (let i = 0; i < kicks.length; i++) kicks[i] *= 0.92;

  // RING wobble — slow, massive, authoritative
  ring.rotation.z = ringBase.z + Math.sin(t * 0.28) * 0.014 + kicks[0] * Math.sin(t * 3.5);
  ring.rotation.y = ringBase.y + Math.cos(t * 0.19) * 0.008;
  ring.rotation.x = ringBase.x + Math.sin(t * 0.22 + 0.8) * 0.006;

  // PLATE A wobble — thinner, oscillates faster
  plateA.rotation.z = plateABase.z + Math.sin(t * 0.41 + 1.2) * 0.018 + kicks[1] * Math.sin(t * 4.0);
  plateA.rotation.y = plateABase.y + Math.cos(t * 0.33 + 0.5) * 0.010;

  // PLATE B wobble — offset phase, leans toward and away from ring
  plateB.rotation.z = plateBBase.z + Math.sin(t * 0.36 + 2.4) * 0.016 + kicks[2] * Math.sin(t * 3.8);
  plateB.rotation.y = plateBBase.y + Math.cos(t * 0.28 + 1.8) * 0.012;

  // ARC wobble — small, hanging-like
  arc.rotation.x = arcBase.x + Math.sin(t * 0.52 + 0.3) * 0.020 + kicks[3] * Math.sin(t * 4.2);
  arc.rotation.y = arcBase.y + Math.cos(t * 0.38 + 1.0) * 0.014;
  arc.rotation.z = arcBase.z + Math.sin(t * 0.45 + 2.0) * 0.010;

  // RING 2 wobble — orbiting feel
  ring2.rotation.x = ring2Base.x + Math.sin(t * 0.35 + 3.1) * 0.015 + kicks[4] * Math.sin(t * 4.5);
  ring2.rotation.z = ring2Base.z + Math.cos(t * 0.27 + 0.7) * 0.020;

  ctrl.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
