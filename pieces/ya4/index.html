<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ya4 · geometric tower construction</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0b0e; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">ya4</div>
<div class="hint">drag to orbit · click to step build sequence</div>
<div class="src">manolo gamboa naon · 50k particles · 5-stage construction</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b0e);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(18, 12, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// COLOR PALETTE — manolo's flat color-blocks (no gradients)
const PALETTE = [
  new THREE.Color(0xd4a574),  // warm sand
  new THREE.Color(0x2d5a7b),  // prussian blue
  new THREE.Color(0xe8e5d9),  // cream
  new THREE.Color(0x8b6f47),  // ochre
  new THREE.Color(0x1a1d26),  // deep charcoal
];

// GEOMETRIC PRIMITIVES — each shape is a hard-edged form, no organic curves
function ringVertices(r, n, y){
  const out = [];
  for (let i = 0; i < n; i++){
    const th = (i / n) * Math.PI * 2;
    out.push(new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r));
  }
  return out;
}

function triangleGrid(w, h, yBase, rows, cols){
  // stacked equilateral triangles in a grid pattern
  const out = [];
  const dx = w / cols;
  const dy = h / rows;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const x = -w/2 + c * dx;
      const y = yBase + r * dy;
      const z = -w/2 + c * dx * 0.5;
      // triangle vertices
      const h_tri = dx * 0.866;
      out.push(new THREE.Vector3(x, y, z));
      out.push(new THREE.Vector3(x + dx/2, y + h_tri, z));
      out.push(new THREE.Vector3(x + dx, y, z));
    }
  }
  return out;
}

function hexagonRing(r, y, segments){
  const out = [];
  for (let i = 0; i < 6; i++){
    const th0 = (i / 6) * Math.PI * 2;
    const th1 = ((i+1) / 6) * Math.PI * 2;
    for (let s = 0; s < segments; s++){
      const t = s / segments;
      const th = th0 + (th1 - th0) * t;
      out.push(new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r));
    }
  }
  return out;
}

function verticalLine(x, z, y0, y1, steps){
  const out = [];
  for (let i = 0; i < steps; i++){
    const t = i / (steps - 1);
    out.push(new THREE.Vector3(x, y0 + (y1 - y0) * t, z));
  }
  return out;
}

function halfCircleArc(r, y, steps, flip){
  const out = [];
  const startAng = flip ? Math.PI : 0;
  for (let i = 0; i < steps; i++){
    const t = i / (steps - 1);
    const th = startAng + t * Math.PI;
    out.push(new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r));
  }
  return out;
}

// CONSTRUCTION STAGES — each stage is one geometric layer
// Stage 0: base foundation — large hexagon ring + radial lines
// Stage 1: triangular grid floor
// Stage 2: vertical pillars (8 corners)
// Stage 3: mid-tier rings + half-circle arcs
// Stage 4: crown — concentric hexagons + vertical spire lines

const STAGES = [];

// Stage 0: base
{
  const verts = [];
  verts.push(...hexagonRing(6.0, 0.0, 80));
  verts.push(...hexagonRing(5.2, 0.1, 70));
  // radial lines from center to hexagon
  for (let i = 0; i < 12; i++){
    const th = (i / 12) * Math.PI * 2;
    const steps = 20;
    for (let s = 0; s < steps; s++){
      const t = s / (steps - 1);
      const r = t * 6.0;
      verts.push(new THREE.Vector3(Math.cos(th) * r, 0.05, Math.sin(th) * r));
    }
  }
  STAGES.push({ verts, color: PALETTE[4] });
}

// Stage 1: triangle grid floor
{
  const verts = triangleGrid(10, 10, 0.2, 6, 6);
  STAGES.push({ verts, color: PALETTE[0] });
}

// Stage 2: vertical pillars
{
  const verts = [];
  const corners = [
    [-4.5, -4.5], [4.5, -4.5], [-4.5, 4.5], [4.5, 4.5],
    [-3.0, 0], [3.0, 0], [0, -3.0], [0, 3.0]
  ];
  for (const [x, z] of corners){
    verts.push(...verticalLine(x, z, 0.3, 8.0, 60));
  }
  STAGES.push({ verts, color: PALETTE[1] });
}

// Stage 3: mid-tier rings + half-circle arcs
{
  const verts = [];
  verts.push(...ringVertices(4.0, 80, 8.0));
  verts.push(...ringVertices(3.5, 70, 8.5));
  verts.push(...ringVertices(3.0, 60, 9.0));
  // half-circle arcs connecting pillars
  for (let i = 0; i < 4; i++){
    const th = (i / 4) * Math.PI * 2;
    const cx = Math.cos(th) * 3.5;
    const cz = Math.sin(th) * 3.5;
    for (let j = 0; j < 30; j++){
      const t = j / 29;
      const y = 8.0 + t * 3.0;
      const r = 0.6 * (1 - t);
      const arc_th = th + Math.PI/2 + t * Math.PI;
      verts.push(new THREE.Vector3(cx + Math.cos(arc_th) * r, y, cz + Math.sin(arc_th) * r));
    }
  }
  STAGES.push({ verts, color: PALETTE[3] });
}

// Stage 4: crown — concentric hexagons + spire
{
  const verts = [];
  verts.push(...hexagonRing(2.4, 11.0, 50));
  verts.push(...hexagonRing(2.0, 11.5, 45));
  verts.push(...hexagonRing(1.6, 12.0, 40));
  verts.push(...hexagonRing(1.2, 12.5, 35));
  // central spire — 6 vertical lines converging
  for (let i = 0; i < 6; i++){
    const th = (i / 6) * Math.PI * 2;
    const r0 = 0.8;
    for (let s = 0; s < 50; s++){
      const t = s / 49;
      const y = 12.5 + t * 5.5;
      const r = r0 * (1 - t);
      verts.push(new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r));
    }
  }
  STAGES.push({ verts, color: PALETTE[2] });
}

// BUILD PARTICLE BUFFERS
const N = 50000;
const positions = new Float32Array(N * 3);
const colors = new Float32Array(N * 3);
const stages = new Float32Array(N);

// distribute particles across stages proportional to vertex count
const stageCounts = STAGES.map(s => s.verts.length);
const totalVerts = stageCounts.reduce((a,b) => a+b, 0);
let idx = 0;
for (let si = 0; si < STAGES.length; si++){
  const stage = STAGES[si];
  const count = Math.floor((stage.verts.length / totalVerts) * N);
  for (let i = 0; i < count && idx < N; i++){
    const v = stage.verts[i % stage.verts.length];
    positions[idx*3] = v.x;
    positions[idx*3+1] = v.y;
    positions[idx*3+2] = v.z;
    colors[idx*3] = stage.color.r;
    colors[idx*3+1] = stage.color.g;
    colors[idx*3+2] = stage.color.b;
    stages[idx] = si;
    idx++;
  }
}
// fill remainder
while (idx < N){
  positions[idx*3] = 0;
  positions[idx*3+1] = 0;
  positions[idx*3+2] = 0;
  colors[idx*3] = PALETTE[0].r;
  colors[idx*3+1] = PALETTE[0].g;
  colors[idx*3+2] = PALETTE[0].b;
  stages[idx] = 0;
  idx++;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uBuildStage: { value: 0 }  // [0..5] controls which stages are visible
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geom.setAttribute('stage', new THREE.BufferAttribute(stages, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.NormalBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBuildStage;
    attribute vec3 color;
    attribute float stage;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vCol = color;
      // stage visibility: smooth fade-in as uBuildStage crosses stage index
      float reveal = smoothstep(stage - 0.3, stage + 0.3, uBuildStage);
      vAlpha = reveal;

      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = 2.2 * uPixel * (60.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // hard-edged square points (manolo aesthetic)
      float a = vAlpha;
      gl_FragColor = vec4(vCol, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// INTERACTION — click steps through build stages
let buildTarget = 0;
let buildCurrent = 0;
addEventListener('click', () => {
  buildTarget = (buildTarget + 1) % 6;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // smooth interpolate build stage
  buildCurrent += (buildTarget - buildCurrent) * 0.04;
  uniforms.uBuildStage.value = buildCurrent;

  // camera orbit — slow, linear rotation (no easing, no organic motion)
  const angle = t * 0.08;
  camera.position.x = Math.cos(angle) * 18;
  camera.position.z = Math.sin(angle) * 18;
  camera.position.y = 12 + Math.sin(t * 0.12) * 2;
  camera.lookAt(0, 8, 0);

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
