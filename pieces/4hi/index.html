<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- MOTION: drift, intensity: gentle -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4hi · cursive binary</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">4hi</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Sasha Stiles · Cursive Binary ──────────────────────────────
   Aizawa attractor particles rendered as typographic glyphs.
   A slow breathing wave dissolves letters into binary streams
   (0 / 1) then re-coalesces — language collapsing into code
   and back. Warm cream ink on warm void.
   Ref: WORDS BEYOND WORDS (Lumen 2025), Technelegy (2021).
   ───────────────────────────────────────────────────────────── */

const W = 160, H = 160;
const N = W * H; // 25 600 glyphs

/* ── Glyph atlas (canvas) ── */
const ACOLS = 10, AROWS = 6, CELL = 64;
const aC = document.createElement('canvas');
aC.width = ACOLS * CELL; aC.height = AROWS * CELL;
const ax = aC.getContext('2d');

const glyphs = [
  'W','O','R','D','S','B','E','Y','O','N',
  'T','E','C','H','N','E','L','E','G','Y',
  'C','U','R','S','I','V','E','B','I','N',
  'M','E','M','O','R','Y','C','O','D','E',
  'L','A','N','G','U','A','G','E','0','1',
  'P','O','E','M','S','D','R','E','A','M'
];

ax.fillStyle = '#000';
ax.fillRect(0, 0, aC.width, aC.height);
ax.textAlign = 'center';
ax.textBaseline = 'middle';
ax.font = `bold ${CELL * 0.72}px ui-monospace,"SF Mono",Menlo,monospace`;

for (let r = 0; r < AROWS; r++) for (let c = 0; c < ACOLS; c++) {
  const i = r * ACOLS + c;
  /* slight per-glyph weight variation — wabi-sabi */
  const w = 0.82 + Math.sin(i * 7.3) * 0.18;
  ax.fillStyle = `rgba(255,255,255,${w})`;
  ax.fillText(glyphs[i] || '0', c * CELL + CELL / 2, r * CELL + CELL / 2);
}

const glyphTex = new THREE.CanvasTexture(aC);
glyphTex.minFilter = THREE.LinearFilter;
glyphTex.magFilter = THREE.LinearFilter;

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);

/* ── GPGPU ── */
const rtP = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
  minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
  wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtP);
let rtB = new THREE.WebGLRenderTarget(W, H, rtP);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  init[i * 4]     = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 1] = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 2] = (Math.random() * 2 - 1) * 0.5;
  init[i * 4 + 3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const camO = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

/* blit init */
const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv;
    void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const blitS = new THREE.Scene();
blitS.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitS, camO);
renderer.setRenderTarget(null);

/* sim shader — Aizawa system, slowed for readable drift */
const simU = {
  prev: { value: rtA.texture },
  uDt: { value: 0.007 },
  uA: { value: 0.95 }, uB: { value: 0.70 },
  uC: { value: 0.60 }, uD: { value: 3.50 },
  uE: { value: 0.25 }, uF: { value: 0.10 }
};
const simMat = new THREE.ShaderMaterial({
  uniforms: simU,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF;
    varying vec2 vUv;
    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz; float age = s.w;
      vec3 dp = vec3(
        (p.z - uB)*p.x - uD*p.y,
        uD*p.x + (p.z - uB)*p.y,
        uC + uA*p.z - p.z*p.z*p.z/3.
          - (p.x*p.x + p.y*p.y)*(1. + uE*p.z)
          + uF*p.z*p.x*p.x*p.x
      );
      p += dp * uDt;
      age = mod(age + uDt * 0.035, 1.);
      gl_FragColor = vec4(p, age);
    }`
});
const simS = new THREE.Scene();
simS.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

/* ── Point rendering ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 60);
camera.position.set(0, 0, 5.5);

const geom = new THREE.BufferGeometry();
const uvIdx = new Float32Array(N * 2);
const aGlyph = new Float32Array(N);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const i = y * W + x;
  uvIdx[i * 2]     = (x + 0.5) / W;
  uvIdx[i * 2 + 1] = (y + 0.5) / H;
  aGlyph[i] = Math.floor(Math.random() * ACOLS * AROWS);
}
geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
geom.setAttribute('uvIdx', new THREE.BufferAttribute(uvIdx, 2));
geom.setAttribute('aGlyph', new THREE.BufferAttribute(aGlyph, 1));

/* binary glyph indices: '0' at 48, '1' at 49 in the atlas */
const IDX_ZERO = 48.0, IDX_ONE = 49.0;

const pMat = new THREE.ShaderMaterial({
  uniforms: {
    state:     { value: rtB.texture },
    uGlyphs:   { value: glyphTex },
    uTime:     { value: 0 },
    uPx:       { value: renderer.getPixelRatio() },
    uACols:    { value: ACOLS },
    uARows:    { value: AROWS },
    uIdxZero:  { value: IDX_ZERO },
    uIdxOne:   { value: IDX_ONE }
  },
  transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPx, uTime;
    attribute vec2 uvIdx;
    attribute float aGlyph;
    varying float vAge;
    varying float vGlyphIdx;
    varying float vBinary;
    varying float vDepth;

    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vGlyphIdx = aGlyph;

      /* binary collapse: a slow breathing wave through the form */
      float spatial = sin(p.x*1.8 + p.z*1.2) * cos(p.y*2.1 - p.x*0.7);
      float breath  = sin(uTime * 0.18) * 0.5 + 0.5;
      float wave    = spatial * 0.5 + 0.5;
      vBinary = smoothstep(0.52, 0.58, wave * breath);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      gl_PointSize = 5.0 * uPx * (11.0 / max(vDepth, 0.6));
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform sampler2D uGlyphs;
    uniform float uACols, uARows, uTime, uIdxZero, uIdxOne;
    varying float vAge, vGlyphIdx, vBinary, vDepth;

    void main(){
      vec2 pc = gl_PointCoord;

      /* pick glyph: letter or binary digit */
      float idx = vGlyphIdx;
      if (vBinary > 0.5) {
        idx = vAge > 0.5 ? uIdxZero : uIdxOne;
      }

      float c = mod(idx, uACols);
      float r = floor(idx / uACols);
      vec2 atlasUV = vec2((c + pc.x) / uACols, (r + pc.y) / uARows);
      float g = texture2D(uGlyphs, atlasUV).r;

      /* palette: warm cream for letters, cooler steel for binary */
      vec3 cream  = vec3(0.95, 0.89, 0.78);
      vec3 amber  = vec3(0.92, 0.76, 0.55);
      vec3 steel  = vec3(0.68, 0.78, 0.90);

      /* slight per-glyph hue shift using glyph index */
      float hueShift = fract(vGlyphIdx * 0.0173);
      vec3 letterCol = mix(cream, amber, hueShift * 0.4);
      vec3 col = mix(letterCol, steel, vBinary);

      /* depth attenuation */
      float depthFade = smoothstep(14.0, 1.5, vDepth);

      /* age shimmer — glyphs breathe in and out */
      float shimmer = 0.65 + 0.35 * sin(vAge * 6.2832 + uTime * 0.25 + vGlyphIdx * 0.1);

      float a = g * depthFade * shimmer * 0.82;
      if (a < 0.015) discard;

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const pts = new THREE.Points(geom, pMat);
scene.add(pts);

/* ── subtle atmosphere: a dim warm gradient plane behind the form ── */
const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.); }`,
  fragmentShader: `
    varying vec2 vUv;
    uniform float uTime;
    void main(){
      vec2 c = vUv - 0.5;
      float d = length(c);
      /* warm core glow */
      float glow = exp(-d * d * 3.5) * 0.035;
      /* very subtle vertical gradient — warmer above, cooler below */
      vec3 warm = vec3(0.14, 0.10, 0.07);
      vec3 cool = vec3(0.06, 0.07, 0.10);
      vec3 col = mix(cool, warm, vUv.y) * glow * 8.0 + vec3(glow * 0.6, glow * 0.45, glow * 0.3);
      gl_FragColor = vec4(col, glow);
    }
  `
});
const bgScene = new THREE.Scene();
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat));

/* ── resize ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── pointer nudge (inherited) ── */
const tgt = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  tgt.a = 0.95 + ((e.clientX / innerWidth) - 0.5) * 0.06;
  tgt.c = 0.60 + ((e.clientY / innerHeight) - 0.5) * 0.08;
});

/* ── loop ── */
const t0 = performance.now();
(function loop() {
  const now = performance.now();
  const t = (now - t0) * 0.001;

  simU.uA.value += (tgt.a - simU.uA.value) * 0.03;
  simU.uC.value += (tgt.c - simU.uC.value) * 0.03;

  for (let i = 0; i < 3; i++) {
    simU.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simS, camO);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);

  pMat.uniforms.state.value = rtA.texture;
  pMat.uniforms.uTime.value = t;
  bgMat.uniforms.uTime.value = t;

  /* slow meditative orbit */
  const ang = t * 0.065;
  camera.position.x = Math.sin(ang) * 4.8;
  camera.position.z = Math.cos(ang) * 4.8;
  camera.position.y = Math.sin(ang * 0.55) * 0.7;
  camera.lookAt(0, 0, 0.85);

  /* background atmosphere first (no depth) */
  renderer.render(bgScene, camO);
  /* then particles */
  renderer.autoClear = false;
  renderer.render(scene, camera);
  renderer.autoClear = true;

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
