<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nrp · the signal that finds the lost one</title>
<!-- MOTION: propagate, intensity: gentle -->
<!-- parent: sav (murmur) → propagate. Wavefront ripples through the flock
     when the straggler separates or returns, traveling at finite speed like
     a neural action potential. Nearest birds notice first; awareness spreads
     outward. The narrative arc TOGETHER→LOSS→SEEKING→RETURN is preserved,
     but now each transition is a visible WAVE, not a simultaneous state change.
     Background: muted dusk gradient + starfield specks + grain overlay per
     user feedback ("dawn-sky gradient too LOUD/BLANK"). -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
               color:#a8b8d0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  body {
    background:
      linear-gradient(to bottom,
        #141420 0%,
        #1a1825 22%,
        #221c28 45%,
        #2a2225 68%,
        #302a26 88%,
        #363028 100%);
  }
  canvas { display:block; }
  /* grain overlay — photochemical texture via CSS */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.035'/%3E%3C/svg%3E");
    background-size: 256px 256px;
    pointer-events: none;
    opacity: 0.7;
    mix-blend-mode: overlay;
    z-index: 10;
  }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:20; }
  .arc  { position:fixed; right:14px; bottom:12px; opacity:0.6; font-size:10px; letter-spacing:0.06em;
          color:#8a7560; z-index:20; }
</style>
</head>
<body>
<div class="id">nrp</div>
<div class="arc" id="arc">together · 100%</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// PROPAGATE mutation of sav: the flock's awareness of loss/return travels
// as a wavefront, not an instant state change. Each bird carries a "wave
// phase" — when an event fires (straggler separates or reunites), a ripple
// starts at the event source and propagates outward at ~3 units/sec.
// Birds hit by the wave briefly flare in brightness and shift heading.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 2, 26);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ── starfield specks (background atmosphere)
const STARS = 220;
const starPos = new Float32Array(STARS * 3);
for (let i = 0; i < STARS; i++){
  starPos[i*3]   = (Math.random() - 0.5) * 80;
  starPos[i*3+1] = (Math.random() - 0.5) * 60 + 10; // bias upward
  starPos[i*3+2] = -20 - Math.random() * 40;         // behind the flock
}
const starGeom = new THREE.BufferGeometry();
starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  color: 0x8899aa, size: 1.2, transparent: true, opacity: 0.25,
  sizeAttenuation: false, depthWrite: false
});
scene.add(new THREE.Points(starGeom, starMat));

// ── low horizon haze plane
const horizGeo = new THREE.PlaneGeometry(120, 20);
const horizMat = new THREE.MeshBasicMaterial({
  color: 0x3a3028, transparent: true, opacity: 0.12, depthWrite: false
});
const horizPlane = new THREE.Mesh(horizGeo, horizMat);
horizPlane.position.set(0, -12, -15);
scene.add(horizPlane);

// ── boids with propagation waves
const N = 481;
const STRAGGLER = 0;
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
const wavePhase = new Float32Array(N);  // 0 = untouched, >0 = wave intensity (decays)
const waveSeed  = new Float32Array(N);  // per-bird random for variation

for (let i = 0; i < N; i++){
  const r = Math.random() * 1.6 + 0.4;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.random() * Math.PI - Math.PI * 0.5;
  pos[i*3]     = Math.cos(th) * Math.cos(ph) * r;
  pos[i*3+1]   = Math.sin(ph) * r;
  pos[i*3+2]   = Math.sin(th) * Math.cos(ph) * r;
  vel[i*3]     = 0.3 + (Math.random() - 0.5) * 0.4;
  vel[i*3+1]   = (Math.random() - 0.5) * 0.3;
  vel[i*3+2]   = (Math.random() - 0.5) * 0.4;
  waveSeed[i]  = Math.random();
}
pos[0] = -1.2; pos[1] = 0.6; pos[2] = 0.0;

const PERCEPTION_R = 4.0;
const SEPARATION_R = 0.9;
const W_COH = 0.018, W_ALI = 0.060, W_SEP = 0.080;
const MAX_SPEED = 1.4, MAX_FORCE = 0.030;

let cohesion = 1.0;
let arcStage = 'together';
const arcEl = document.getElementById('arc');

// wave state
let waveOrigin = [0, 0, 0];
let waveRadius = -1;            // -1 = no active wave
const WAVE_SPEED = 4.5;         // units/sec
const WAVE_WIDTH = 2.5;         // ring thickness
let lastArcStage = 'together';

function fireWave(ox, oy, oz){
  waveOrigin[0] = ox; waveOrigin[1] = oy; waveOrigin[2] = oz;
  waveRadius = 0;
}

function step(dt){
  // flock centroid (exclude straggler)
  let cx = 0, cy = 0, cz = 0;
  for (let i = 1; i < N; i++){
    cx += pos[i*3]; cy += pos[i*3+1]; cz += pos[i*3+2];
  }
  cx /= (N-1); cy /= (N-1); cz /= (N-1);

  // straggler distance
  const sx = pos[0] - cx, sy = pos[1] - cy, sz = pos[2] - cz;
  const stragDist = Math.sqrt(sx*sx + sy*sy + sz*sz);
  const targetCoh = Math.max(0, Math.min(1, 1 - stragDist / 8));
  cohesion += (targetCoh - cohesion) * dt * 0.45;

  if      (cohesion > 0.85)                           arcStage = 'together';
  else if (cohesion > 0.5 && stragDist > 4.5)         arcStage = 'loss';
  else if (cohesion < 0.5)                             arcStage = 'seeking';
  else if (arcStage === 'seeking' && cohesion > 0.65)  arcStage = 'return';

  // fire wave on arc transition
  if (arcStage !== lastArcStage){
    if (arcStage === 'loss' || arcStage === 'seeking')
      fireWave(pos[0], pos[1], pos[2]);             // wave from straggler
    else if (arcStage === 'return' || arcStage === 'together')
      fireWave(cx, cy, cz);                          // wave from flock center
    lastArcStage = arcStage;
  }

  arcEl.textContent = `${arcStage} · ${Math.round(cohesion * 100)}%`;

  // expand wave ring
  if (waveRadius >= 0){
    waveRadius += WAVE_SPEED * dt;
    if (waveRadius > 30) waveRadius = -1; // done
  }

  // update wave phase per bird
  for (let i = 0; i < N; i++){
    if (waveRadius >= 0){
      const dx = pos[i*3] - waveOrigin[0];
      const dy = pos[i*3+1] - waveOrigin[1];
      const dz = pos[i*3+2] - waveOrigin[2];
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      // bird is inside the ring?
      const ringDist = Math.abs(d - waveRadius);
      if (ringDist < WAVE_WIDTH){
        const intensity = 1.0 - ringDist / WAVE_WIDTH;
        wavePhase[i] = Math.max(wavePhase[i], intensity);
      }
    }
    // decay
    wavePhase[i] *= (1.0 - dt * 1.8);
    if (wavePhase[i] < 0.01) wavePhase[i] = 0;
  }

  // boid forces
  const acc = new Float32Array(N * 3);
  for (let i = 0; i < N; i++){
    let cohX=0,cohY=0,cohZ=0,cohN=0;
    let aliX=0,aliY=0,aliZ=0,aliN=0;
    let sepX=0,sepY=0,sepZ=0;
    const px=pos[i*3], py=pos[i*3+1], pz=pos[i*3+2];
    const isStrag = (i === STRAGGLER);
    const pR = isStrag ? PERCEPTION_R * 0.55 : PERCEPTION_R;

    for (let j = 0; j < N; j++){
      if (i === j) continue;
      const dx=pos[j*3]-px, dy=pos[j*3+1]-py, dz=pos[j*3+2]-pz;
      const d2 = dx*dx+dy*dy+dz*dz;
      if (d2 > pR*pR || d2 < 1e-6) continue;
      cohX+=pos[j*3]; cohY+=pos[j*3+1]; cohZ+=pos[j*3+2]; cohN++;
      aliX+=vel[j*3]; aliY+=vel[j*3+1]; aliZ+=vel[j*3+2]; aliN++;
      if (d2 < SEPARATION_R*SEPARATION_R){
        const inv = 1.0/Math.sqrt(d2);
        sepX -= dx*inv; sepY -= dy*inv; sepZ -= dz*inv;
      }
    }

    // straggler drift
    if (isStrag){
      const t = performance.now() * 0.0003;
      acc[0] += Math.sin(t) * 0.4;
      acc[1] += -0.25 + Math.cos(t * 0.67) * 0.2;
      acc[2] += Math.sin(t) * 0.24;
    }

    // wave-triggered seeking: birds hit by the wave turn toward straggler
    // This is the PROPAGATE mechanic — awareness travels at finite speed
    if (!isStrag && wavePhase[i] > 0.05){
      const tx=pos[0]-px, ty=pos[1]-py, tz=pos[0+2]-pz;
      const td = Math.sqrt(tx*tx+ty*ty+tz*tz)+1e-3;
      const waveSeek = wavePhase[i] * 0.025;
      acc[i*3]   += (tx/td) * waveSeek;
      acc[i*3+1] += (ty/td) * waveSeek;
      acc[i*3+2] += (tz/td) * waveSeek;
    }

    // baseline seeking when arc demands it (slower than parent — wave does more)
    if (!isStrag && (arcStage==='seeking'||arcStage==='return')){
      const tx=pos[0]-px, ty=pos[1]-py, tz=pos[2]-pz;
      const td = Math.sqrt(tx*tx+ty*ty+tz*tz)+1e-3;
      const sk = arcStage==='seeking' ? 0.010 : 0.006;
      acc[i*3]   += (tx/td)*sk;
      acc[i*3+1] += (ty/td)*sk;
      acc[i*3+2] += (tz/td)*sk;
    }

    if (cohN>0){ cohX=cohX/cohN-px; cohY=cohY/cohN-py; cohZ=cohZ/cohN-pz;
      acc[i*3]+=cohX*W_COH; acc[i*3+1]+=cohY*W_COH; acc[i*3+2]+=cohZ*W_COH; }
    if (aliN>0){ aliX=aliX/aliN-vel[i*3]; aliY=aliY/aliN-vel[i*3+1]; aliZ=aliZ/aliN-vel[i*3+2];
      acc[i*3]+=aliX*W_ALI; acc[i*3+1]+=aliY*W_ALI; acc[i*3+2]+=aliZ*W_ALI; }
    acc[i*3]+=sepX*W_SEP; acc[i*3+1]+=sepY*W_SEP; acc[i*3+2]+=sepZ*W_SEP;

    // soft world bounds
    const d2c=px*px+py*py+pz*pz;
    if (d2c>90){ const inv=0.012/Math.sqrt(d2c);
      acc[i*3]+=-px*inv; acc[i*3+1]+=-py*inv; acc[i*3+2]+=-pz*inv; }
  }

  // integrate
  const speedMul = (arcStage==='loss'||arcStage==='seeking') ? 0.55
                  : arcStage==='return' ? 0.85 : 1.0;
  for (let i = 0; i < N; i++){
    let ax=acc[i*3],ay=acc[i*3+1],az=acc[i*3+2];
    const af=Math.sqrt(ax*ax+ay*ay+az*az);
    if (af>MAX_FORCE){ax*=MAX_FORCE/af;ay*=MAX_FORCE/af;az*=MAX_FORCE/af;}
    vel[i*3]+=ax; vel[i*3+1]+=ay; vel[i*3+2]+=az;
    let vx=vel[i*3],vy=vel[i*3+1],vz=vel[i*3+2];
    const sp=Math.sqrt(vx*vx+vy*vy+vz*vz);
    if(sp>MAX_SPEED){vx*=MAX_SPEED/sp;vy*=MAX_SPEED/sp;vz*=MAX_SPEED/sp;
      vel[i*3]=vx;vel[i*3+1]=vy;vel[i*3+2]=vz;}
    pos[i*3]   += vx*dt*speedMul;
    pos[i*3+1] += vy*dt*speedMul;
    pos[i*3+2] += vz*dt*speedMul;
  }
}

// ── render setup
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const seedAttr = new Float32Array(N);
for (let i = 0; i < N; i++) seedAttr[i] = Math.random();
geom.setAttribute('seed', new THREE.BufferAttribute(seedAttr, 1));
const stragAttr = new Float32Array(N);
stragAttr[STRAGGLER] = 1.0;
geom.setAttribute('strag', new THREE.BufferAttribute(stragAttr, 1));
geom.setAttribute('wave', new THREE.BufferAttribute(wavePhase, 1));

const uniforms = {
  uTime:     { value: 0 },
  uPixel:    { value: renderer.getPixelRatio() },
  uCohesion: { value: 1.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, fog: false,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uCohesion;
    attribute float seed;
    attribute float strag;
    attribute float wave;
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float t = uTime * 0.6 + seed * 6.28;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // size: base + straggler boost + wave pulse (propagation flare)
      float baseSize = 1.4 + 0.6 * sin(t);
      float waveBoost = wave * 2.8;    // wave-hit birds flare larger
      float stragSize = strag * 2.6;
      gl_PointSize = (baseSize + stragSize + waveBoost) * uPixel * (16.0 / max(dist, 1.0));

      // palette — 5 specific colors, hand-picked:
      // #c49a6c — tarnished brass (together-warm)
      // #e8d4b8 — parchment cream (highlight)
      // #5a6a82 — slate blue (lost-cool)
      // #7a5a70 — dried mauve (lonely)
      // #d4a870 — amber signal (wave pulse)
      vec3 brass     = vec3(0.769, 0.604, 0.424);
      vec3 parchment = vec3(0.910, 0.831, 0.722);
      vec3 slate     = vec3(0.353, 0.416, 0.510);
      vec3 mauve     = vec3(0.478, 0.353, 0.439);
      vec3 amber     = vec3(0.831, 0.659, 0.439);

      vec3 cohCol  = mix(slate, brass, smoothstep(0.0, 1.0, uCohesion));
      vec3 highCol = mix(mauve, parchment, smoothstep(0.0, 1.0, uCohesion));
      // per-bird accent
      vCol = mix(cohCol, highCol, strag * 0.7 + smoothstep(0.6, 1.0, sin(t * 0.4)) * 0.15);
      // wave pulse: birds in the wavefront shift toward amber signal color
      vCol = mix(vCol, amber, wave * 0.7);
      vCol *= (1.0 + strag * 0.35 + wave * 0.4);

      vAlpha = clamp(1.0 - (dist - 24.0) / 28.0, 0.0, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a * 0.9, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ── wave ring visualizer (faint expanding ring in the scene)
const ringGeo = new THREE.RingGeometry(0.95, 1.0, 64);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0xd4a870, transparent: true, opacity: 0.0,
  side: THREE.DoubleSide, depthWrite: false
});
const ringMesh = new THREE.Mesh(ringGeo, ringMat);
ringMesh.rotation.x = Math.PI * 0.5; // horizontal ring
scene.add(ringMesh);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-warm
for (let s = 0; s < 250; s++) step(0.05);

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  uniforms.uTime.value = now / 1000;
  uniforms.uCohesion.value = cohesion;
  step(dt);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.wave.needsUpdate = true;

  // update wave ring mesh
  if (waveRadius >= 0 && waveRadius < 25){
    ringMesh.position.set(waveOrigin[0], waveOrigin[1], waveOrigin[2]);
    ringMesh.scale.setScalar(waveRadius);
    ringMat.opacity = Math.max(0, 0.08 * (1.0 - waveRadius / 25));
    ringMesh.visible = true;
  } else {
    ringMesh.visible = false;
  }

  // camera: slow orbit tracking flock centroid
  let fcx = 0, fcy = 0, fcz = 0;
  for (let i = 0; i < N; i++){
    fcx += pos[i*3]; fcy += pos[i*3+1]; fcz += pos[i*3+2];
  }
  fcx /= N; fcy /= N; fcz /= N;

  const ang = now * 0.00008;
  camera.position.x = fcx + Math.sin(ang) * 24;
  camera.position.y = fcy + 3;
  camera.position.z = fcz + Math.cos(ang) * 24;
  camera.lookAt(fcx, fcy, fcz);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

    background:rgba(205,210,220,0.12);border-radius:2px;outline:none;cursor:pointer;margin:0 0 9px;}
  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;
    background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);
    border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:5px 6px;
    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}
  #gp-save:hover{border-color:rgba(201,168,106,0.7);}
  #gp-panel button.gp-cfg{display:block;width:100%;margin-top:5px;background:rgba(0,0,0,0.4);
    border:1px solid rgba(205,210,220,0.15);border-radius:3px;padding:4px 6px;
    color:rgba(205,210,220,0.75);cursor:pointer;font-family:inherit;font-size:10px;text-align:left;}
  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
</html>
