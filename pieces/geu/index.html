<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ww9 · calligraphic ink · fanfare bells</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#08080d; overflow:hidden;
               color:#d8c895; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">ww9</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Calligraphic ink differential-growth tube (from 2iy / 5gm lineage).
// SURPRISE: periodic trumpet-bell flares bloom along the tube — asymmetric
// brass bells that swell outward like a Wynton Marsalis fanfare, then
// gracefully retract. Lit with MeshStandardMaterial for real depth cues.
// First fanfare at ~3s; subsequent at random 7–13s. Technique reference:
// Alexander Calder's kinetic surprise timing + Isamu Noguchi brass forms.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08080d, 0.012);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(8, 8, 14);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x08080d, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);

// Lighting — warm key + cool fill for sculptural depth
const keyLight = new THREE.DirectionalLight(0xffeedd, 1.6);
keyLight.position.set(5, 10, 8);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x8899bb, 0.5);
fillLight.position.set(-4, 3, -6);
scene.add(fillLight);
scene.add(new THREE.AmbientLight(0x222233, 0.3));

// ─────────── differential growth (3D, inherited from 5gm/2iy)
const MAX_VERTS = 1800;
const ATTRACT   = 0.06;
const REPEL_R   = 0.46;
const REPEL_STR = 0.13;
const NOISE     = 0.003;
const PRESSURE  = 0.0028;
const RISE      = 0.0042;
const MAX_D     = 0.36;

const verts = [];
for (let i = 0; i < 18; i++){
  const th = i / 18 * Math.PI * 2;
  const r = 1.4 + (Math.random() - 0.5) * 0.1;
  verts.push({ x: Math.cos(th)*r, y: 0, z: Math.sin(th)*r, age: 0 });
}

const CELL = REPEL_R, grid = new Map();
function key3(x,y,z){ return Math.floor(x/CELL)+','+Math.floor(y/CELL)+','+Math.floor(z/CELL); }
function rebuildGrid(){
  grid.clear();
  for (let i = 0; i < verts.length; i++){
    const v = verts[i]; const k = key3(v.x,v.y,v.z);
    if (!grid.has(k)) grid.set(k,[]);
    grid.get(k).push(i);
  }
}
function gridNeighbors(v){
  const cx=Math.floor(v.x/CELL), cy=Math.floor(v.y/CELL), cz=Math.floor(v.z/CELL);
  const out=[];
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) for(let dz=-1;dz<=1;dz++){
    const arr=grid.get((cx+dx)+','+(cy+dy)+','+(cz+dz));
    if(arr) for(const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
function step(){
  if(paused) return;
  const n = verts.length;
  if(n >= MAX_VERTS) return;
  rebuildGrid();
  const dx=new Float32Array(n), dy=new Float32Array(n), dz=new Float32Array(n);
  for(let i=0;i<n;i++){
    const v=verts[i];
    for(const j of gridNeighbors(v)){
      if(j===i) continue;
      const u=verts[j];
      const ex=v.x-u.x, ey=v.y-u.y, ez=v.z-u.z;
      const d2=ex*ex+ey*ey+ez*ez;
      if(d2>REPEL_R*REPEL_R||d2<1e-6) continue;
      const d=Math.sqrt(d2);
      const f=REPEL_STR*(1-d/REPEL_R)/d;
      dx[i]+=ex*f; dy[i]+=ey*f; dz[i]+=ez*f;
    }
  }
  for(let i=0;i<n;i++){
    const a=verts[(i-1+n)%n], b=verts[(i+1)%n], v=verts[i];
    dx[i]+=(a.x+b.x-2*v.x)*ATTRACT;
    dy[i]+=(a.y+b.y-2*v.y)*ATTRACT;
    dz[i]+=(a.z+b.z-2*v.z)*ATTRACT;
  }
  let cx2=0,cy2=0,cz2=0;
  for(let i=0;i<n;i++){cx2+=verts[i].x;cy2+=verts[i].y;cz2+=verts[i].z;}
  cx2/=n; cy2/=n; cz2/=n;
  for(let i=0;i<n;i++){
    const ox=verts[i].x-cx2, oy=verts[i].y-cy2, oz=verts[i].z-cz2;
    const d=Math.hypot(ox,oy,oz)+1e-6;
    dx[i]+=(ox/d)*PRESSURE; dy[i]+=(oy/d)*PRESSURE*0.4; dz[i]+=(oz/d)*PRESSURE;
  }
  for(let i=0;i<n;i++){
    const a=verts[i].age;
    const upward=RISE*(0.3+1.2*Math.min(a*1.5,1.0));
    verts[i].x+=dx[i]+(Math.random()-0.5)*NOISE;
    verts[i].y+=dy[i]+(Math.random()-0.5)*NOISE*0.5+upward;
    verts[i].z+=dz[i]+(Math.random()-0.5)*NOISE;
    verts[i].age+=0.0014;
  }
  const grown=[];
  for(let i=0;i<n;i++){
    const a=verts[i], b=verts[(i+1)%n];
    grown.push(a);
    const ex=b.x-a.x, ey=b.y-a.y, ez=b.z-a.z;
    if(ex*ex+ey*ey+ez*ez>MAX_D*MAX_D&&verts.length+grown.length<MAX_VERTS){
      grown.push({x:(a.x+b.x)*0.5,y:(a.y+b.y)*0.5-0.05,z:(a.z+b.z)*0.5,
        age:Math.max(a.age,b.age)*0.5});
    }
  }
  verts.length=0;
  for(const v of grown) verts.push(v);
}
for(let s=0;s<700;s++) step();
addEventListener('click',()=>{paused=!paused;});

// ─────────── fanfare system
// Each fanfare: pick 2-4 locations along tube, bloom asymmetric bell flares
// over ~1.2s, hold ~0.4s, retract over ~1.6s. Bell is wider on the outward
// (centroid-away) lip and narrower on the inward side — trumpet silhouette.

const INK_COLOR  = new THREE.Color(0xe8dcc0);
const BRASS_COLOR = new THREE.Color(0xd4a84b);
const DARK_BRASS  = new THREE.Color(0xb8872e);

const fanfares = []; // active fanfare bells
let nextFanfareTime = 3.0; // first at ~3s

function scheduleFanfare(){
  nextFanfareTime += 7 + Math.random() * 6; // 7–13s intervals
}

function spawnFanfare(time){
  const count = 2 + Math.floor(Math.random() * 3); // 2-4 bells
  for(let i = 0; i < count; i++){
    const t = Math.random(); // position along tube [0,1]
    fanfares.push({
      t,
      startTime: time,
      duration: 3.2, // total lifecycle
      peakAt: 0.35,  // fraction of duration to peak
      holdAt: 0.48,  // fraction where hold ends
      maxFlare: 3.5 + Math.random() * 2.5, // radius multiplier at peak
      asymmetry: 0.5 + Math.random() * 0.3, // how asymmetric (0=symmetric,1=fully one-sided)
      width: 0.03 + Math.random() * 0.025,  // how wide along the tube the bell extends
    });
  }
}

// ─────────── tube material — MeshStandardMaterial for depth
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xe8dcc0,
  roughness: 0.55,
  metalness: 0.05,
  transparent: true,
  opacity: 0.92,
});

let tubeMesh = null;

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const startTime = performance.now();

function loop(){
  const elapsed = (performance.now() - startTime) * 0.001;

  for(let s=0;s<2;s++) step();

  // check fanfare spawn
  if(elapsed >= nextFanfareTime){
    spawnFanfare(elapsed);
    scheduleFanfare();
  }

  // remove expired fanfares
  for(let i = fanfares.length - 1; i >= 0; i--){
    if(elapsed - fanfares[i].startTime > fanfares[i].duration) fanfares.splice(i,1);
  }

  if(verts.length > 8){
    const pts = verts.map(v => new THREE.Vector3(v.x,v.y,v.z));
    const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);

    // compute centroid for asymmetry direction
    let centX=0,centY=0,centZ=0;
    for(const v of verts){centX+=v.x;centY+=v.y;centZ+=v.z;}
    centX/=verts.length; centY/=verts.length; centZ/=verts.length;
    const centroid = new THREE.Vector3(centX,centY,centZ);

    const N_SAMPLES = Math.min(800, verts.length * 2);
    const RADIAL = 8;

    // Precompute base radii from curvature (ink pressure)
    const baseRadii = new Float32Array(N_SAMPLES);
    for(let i=0;i<N_SAMPLES;i++){
      const t = i/N_SAMPLES;
      const dt = 1/N_SAMPLES;
      const t1 = curve.getTangent((t-dt+1)%1);
      const t2 = curve.getTangent(t);
      const t3 = curve.getTangent((t+dt)%1);
      const curvature = (2 - t1.dot(t2) - t2.dot(t3)) * 0.5;
      const pressure = Math.min(1.0, curvature * 8);
      baseRadii[i] = 0.018 + 0.10 * pressure;
    }

    // Compute fanfare flare envelopes per sample
    const flareMultiplier = new Float32Array(N_SAMPLES);
    const flareAsymDir = []; // per-sample outward direction for asymmetric flare
    const flareBrass = new Float32Array(N_SAMPLES); // brass color blend factor
    for(let i=0;i<N_SAMPLES;i++){
      flareMultiplier[i] = 1.0;
      flareAsymDir.push(null);
    }

    for(const f of fanfares){
      const age = (elapsed - f.startTime) / f.duration;
      // envelope: ramp up to peakAt, hold to holdAt, ramp down
      let env;
      if(age < f.peakAt){
        env = age / f.peakAt;
        env = env * env * (3 - 2 * env); // smoothstep
      } else if(age < f.holdAt){
        env = 1.0;
      } else {
        const decay = (age - f.holdAt) / (1.0 - f.holdAt);
        env = 1.0 - decay * decay;
      }

      const bellCenter = Math.floor(f.t * N_SAMPLES) % N_SAMPLES;
      const bellHalf = Math.floor(f.width * N_SAMPLES);
      for(let di = -bellHalf; di <= bellHalf; di++){
        const si = (bellCenter + di + N_SAMPLES) % N_SAMPLES;
        // bell profile: wider at edges, like a trumpet flare (exponential)
        const x = Math.abs(di) / Math.max(bellHalf, 1);
        const bellShape = Math.exp(2.0 * x) - 0.6; // exponential flare
        const contribution = 1.0 + (f.maxFlare - 1.0) * env * Math.max(0, bellShape);
        if(contribution > flareMultiplier[si]){
          flareMultiplier[si] = contribution;
          flareBrass[si] = env;
          // outward direction: away from centroid at this point
          const p = curve.getPointAt(si / N_SAMPLES);
          const outDir = new THREE.Vector3().subVectors(p, centroid).normalize();
          flareAsymDir[si] = { dir: outDir, asymmetry: f.asymmetry * env };
        }
      }
    }

    // Build swept tube with asymmetric flare
    const positions = new Float32Array(N_SAMPLES * RADIAL * 3);
    const colors = new Float32Array(N_SAMPLES * RADIAL * 3);
    const indices = [];
    const up = new THREE.Vector3(0,1,0);

    for(let i=0;i<N_SAMPLES;i++){
      const t = i/N_SAMPLES;
      const p = curve.getPointAt(t);
      const tangent = curve.getTangentAt(t).normalize();
      const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
      if(normal.lengthSq() < 0.001) normal.set(1,0,0);
      const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

      const r = baseRadii[i] * flareMultiplier[i];
      const brass = flareBrass[i];
      const asym = flareAsymDir[i];

      // color blend: ink → brass during fanfare
      const col = new THREE.Color().copy(INK_COLOR).lerp(BRASS_COLOR, brass * 0.7);

      for(let j=0;j<RADIAL;j++){
        const ang = (j/RADIAL) * Math.PI * 2;
        let localR = r;

        // Asymmetric flare: radius bigger on the outward-facing side
        if(asym && asym.asymmetry > 0.01){
          const radialDir = new THREE.Vector3()
            .copy(normal).multiplyScalar(Math.cos(ang))
            .add(binormal.clone().multiplyScalar(Math.sin(ang)))
            .normalize();
          const alignment = radialDir.dot(asym.dir); // -1 to 1
          // Outward lip is wider, inward is narrower
          const asymFactor = 1.0 + asym.asymmetry * alignment * 0.6;
          localR *= Math.max(0.3, asymFactor);
        }

        const v = new THREE.Vector3()
          .copy(normal).multiplyScalar(Math.cos(ang)*localR)
          .add(binormal.clone().multiplyScalar(Math.sin(ang)*localR))
          .add(p);
        const idx = (i*RADIAL+j)*3;
        positions[idx]=v.x; positions[idx+1]=v.y; positions[idx+2]=v.z;
        colors[idx]=col.r; colors[idx+1]=col.g; colors[idx+2]=col.b;
      }
    }

    for(let i=0;i<N_SAMPLES;i++){
      const ni=(i+1)%N_SAMPLES;
      for(let j=0;j<RADIAL;j++){
        const nj=(j+1)%RADIAL;
        const a=i*RADIAL+j, b=i*RADIAL+nj;
        const c=ni*RADIAL+j, d=ni*RADIAL+nj;
        indices.push(a,b,c); indices.push(b,d,c);
      }
    }

    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions,3));
    g.setAttribute('color', new THREE.BufferAttribute(colors,3));
    g.setIndex(indices);
    g.computeVertexNormals();

    if(tubeMesh){ scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
    tubeMat.vertexColors = true;
    tubeMesh = new THREE.Mesh(g, tubeMat);
    scene.add(tubeMesh);
  }

  // camera follow
  let yMean=0; for(const v of verts) yMean+=v.y; yMean/=Math.max(verts.length,1);
  const targetY = Math.max(yMean, 2.0);
  controls.target.y += (targetY - controls.target.y) * 0.04;
  camera.position.y += (targetY + 4 - camera.position.y) * 0.04;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
