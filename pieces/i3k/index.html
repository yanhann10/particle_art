<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i3k · Shiota — systole/diastole</title>
<!-- MOTION: pulse, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">i3k</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x040202, 0.016);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0303, 0.35));

const pL = new THREE.PointLight(0xffd0b0, 0.5, 45, 1.8);
pL.position.set(2.5, 8.0, -1.5);
scene.add(pL);

let seed = 29417583;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── SUSPENDED SPHERE — pale moon, the heart
const sphereRadius = 2.4;
const spherePos = new THREE.Vector3(2.2, 1.0, -1.8);

const sphere = new THREE.Mesh(
  new THREE.SphereGeometry(sphereRadius, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf0e8dc,
    emissive: 0xf0e8dc,
    emissiveIntensity: 0.6,
    roughness: 0.95,
    metalness: 0.0,
    transparent: true,
    opacity: 0.78
  })
);
sphere.position.copy(spherePos);
scene.add(sphere);

// ── SUSPENDED BOAT — Uncertain Journey: dark skeletal hull beneath the heart
const boatPos = new THREE.Vector3(spherePos.x - 0.8, spherePos.y - 5.2, spherePos.z + 0.4);
const boatVerts = new Float32Array([
  // Simple hull: 10 vertices forming a boat cross-section
  0,0,-2.8,  0,0,2.8,  // keel line (bow to stern)
  -1.1,0.7,-1.6,  1.1,0.7,-1.6,  // port/starboard fore
  -1.4,0.8,0,  1.4,0.8,0,        // port/starboard mid (widest)
  -1.1,0.7,1.6,  1.1,0.7,1.6,    // port/starboard aft
  -0.5,0.9,-2.2,  0.5,0.9,-2.2   // bow gunwale
]);
const boatIdx = [
  0,2, 0,3, 0,8, 0,9, 2,4, 3,5, 4,6, 5,7, 6,1, 7,1,
  2,3, 4,5, 6,7, 8,9, 8,2, 9,3, 0,4, 0,5, 1,6, 1,7
];
const boatGeo = new THREE.BufferGeometry();
boatGeo.setAttribute('position', new THREE.BufferAttribute(boatVerts, 3));
boatGeo.setIndex(boatIdx);
const boat = new THREE.LineSegments(boatGeo, new THREE.LineBasicMaterial({
  color: 0x1a0a08,
  transparent: true,
  opacity: 0.7
}));
boat.position.copy(boatPos);
boat.scale.set(1.3, 1.3, 1.3);
scene.add(boat);

// ── ROOM — architectural volume
const ROOM = { w: 36, h: 24, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS
const NUM_ANCHORS = 1200;
const anchors = [];

// Icosahedral base (Mohr)
const phi = (1 + Math.sqrt(5)) / 2;
const icoVerts = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoVerts){
  anchors.push(new THREE.Vector3(
    v[0]*8.0 + spherePos.x,
    v[1]*6.5 + spherePos.y,
    v[2]*8.0 + spherePos.z
  ));
}

// Suspension anchors — ceiling
const suspAnchors = [];
for(let i=0; i<8; i++){
  const p = new THREE.Vector3(
    spherePos.x + (rng()-0.5)*4.0,
    hh,
    spherePos.z + (rng()-0.5)*4.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}

// Boat suspension anchors
for(let i=0; i<4; i++){
  const p = new THREE.Vector3(
    boatPos.x + (rng()-0.5)*2.0,
    hh,
    boatPos.z + (rng()-0.5)*2.0
  );
  suspAnchors.push(p);
  anchors.push(p);
}

// Void zones
const voids = [];
for(let i=0; i<3; i++){
  voids.push({
    pos: new THREE.Vector3(
      spherePos.x + (rng()-0.5)*14,
      spherePos.y + (rng()-0.5)*9,
      spherePos.z + (rng()-0.5)*14
    ),
    r: 2.2 + rng()*1.6
  });
}

function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Dense shell around sphere + boat
const centroid = spherePos.clone().add(boatPos).multiplyScalar(0.5);
for(let i=anchors.length; i<NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.35){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = spherePos.clone().add(dir.multiplyScalar(sphereRadius + 0.5 + rng()*6.5));
  } else if(r < 0.50){
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = boatPos.clone().add(dir.multiplyScalar(1.5 + rng()*5.0));
  } else if(r < 0.72){
    p = wallPt();
    p.lerp(centroid, 0.15 + rng()*0.5);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

function sphereSurf(){
  const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
  return spherePos.clone().add(dir.multiplyScalar(sphereRadius));
}

function boatSurf(){
  const bv = boatVerts;
  const vi = Math.floor(rng() * 10) * 3;
  return new THREE.Vector3(
    boatPos.x + bv[vi] * 1.3,
    boatPos.y + bv[vi+1] * 1.3,
    boatPos.z + bv[vi+2] * 1.3
  );
}

// Radial quantization (Molnar) — near sphere
function quantizeAngle(p){
  const d = p.distanceTo(spherePos);
  if(d > 10) return p;
  const strength = Math.max(0, 1 - d/10);
  const dir = p.clone().sub(spherePos);
  const theta = Math.atan2(dir.z, dir.x);
  const snapAngle = 15 * Math.PI / 180;
  const snapped = Math.round(theta / snapAngle) * snapAngle;
  const blended = theta + (snapped - theta) * strength * 0.55;
  const horiz = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended) * horiz;
  dir.z = Math.sin(blended) * horiz;
  return spherePos.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES * 6);
// Per-line radial distance to sphere (for pulse amplitude)
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx = (a.x+b.x)*0.5, my = (a.y+b.y)*0.5, mz = (a.z+b.z)*0.5;
  const dx = mx-spherePos.x, dy = my-spherePos.y, dz = mz-spherePos.z;
  lineDist[li] = Math.sqrt(dx*dx + dy*dy + dz*dz);
  li++;
}

// Suspension threads — sphere
for(const sa of suspAnchors.slice(0, 8)){
  for(let j=0; j<3; j++){
    const target = sphereSurf();
    target.y = Math.max(target.y, spherePos.y + sphereRadius*0.5);
    setLine(sa, target);
  }
}

// Suspension threads — boat
for(const sa of suspAnchors.slice(8)){
  for(let j=0; j<4; j++){
    setLine(sa, boatSurf());
  }
}

// Sphere-to-boat linking threads — umbilical connection
for(let i=0; i<60; i++){
  const a = sphereSurf();
  a.y = Math.min(a.y, spherePos.y - sphereRadius*0.3);
  const b = boatSurf();
  setLine(a, b);
}

// Cat A: threads converging on sphere (42%)
const catA = Math.floor(NUM_LINES * 0.42);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantizeAngle(a);
  if(rng() < 0.12){
    const target = sphereSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3 + rng()*1.6));
    setLine(a, target);
  } else {
    setLine(a, sphereSurf());
  }
}

// Cat B: threads converging on boat (12%)
const catB = Math.floor(NUM_LINES * 0.12);
for(let i=0; i<catB && li<NUM_LINES; i++){
  let a = rng()<0.4 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  if(rng() < 0.08){
    const target = boatSurf();
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.0));
    setLine(a, target);
  } else {
    setLine(a, boatSurf());
  }
}

// Cat C: wall-to-wall (20%)
const catC = Math.floor(NUM_LINES * 0.20);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const a = wallPt();
  const b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(centroid) > 16 && rng() > 0.05){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat D: dendritic branching filaments
while(li < NUM_LINES - 120){
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 5.0){ bestD = d; best = anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  if(rng() < 0.28 && li < NUM_LINES){
    const mid = a.clone().lerp(best, 0.35 + rng()*0.3);
    const branchDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const branchEnd = mid.clone().add(branchDir.multiplyScalar(1.0 + rng()*2.2));
    if(!inVoid(branchEnd)) setLine(mid, branchEnd);
  }
}

// Fill remaining
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(!inVoid(a)){
    if(rng() < 0.6) setLine(a, sphereSurf());
    else setLine(a, boatSurf());
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper caught in the web, clustered near boat
const NUM_FRAGS = 32;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.04 + rng()*0.14;
  const geo = rng()>0.55
    ? new THREE.BoxGeometry(sz*(1.8+rng()*2.0), sz*0.015, sz*(0.7+rng()*1.0))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01 + rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.2),
    transparent: true,
    opacity: 0.25 + rng()*0.4
  });
  const mesh = new THREE.Mesh(geo, mat);
  // Cluster fragments between sphere and boat
  if(rng() < 0.6){
    const t = 0.2 + rng()*0.6;
    mesh.position.lerpVectors(spherePos, boatPos, t);
    mesh.position.x += (rng()-0.5)*4;
    mesh.position.y += (rng()-0.5)*2;
    mesh.position.z += (rng()-0.5)*4;
  } else {
    const si = Math.floor(rng()*NUM_LINES)*6;
    const t = 0.2 + rng()*0.6;
    mesh.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  }
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — intimate interior path, close passes near sphere and boat
const pathLen = 360;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;

  // Asymmetric figure-8 weaving between sphere and boat
  const cx = centroid.x, cy = centroid.y, cz = centroid.z;
  const x = cx + Math.sin(p)*6.5 + Math.sin(p*1.4+0.6)*2.8 + Math.cos(p*0.3)*1.5;
  const y = cy + 0.8 + Math.sin(p*0.55+1.2)*4.2 + Math.cos(p*0.4)*1.2;
  const z = cz + Math.cos(p)*8.5 + Math.cos(p*0.8+1.8)*2.2;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();
function loop(){
  const t = (performance.now() - t0) / 1000;

  // ── SYSTOLIC/DIASTOLIC PULSE — radial breathing centered on sphere
  // Threads closer to the sphere pulse more; distant threads barely move
  const arr = lineGeo.attributes.position.array;
  const pulsePhase = t * 0.07; // very slow heartbeat (~90s full cycle)
  const systole = Math.sin(pulsePhase) * 0.5 + 0.5; // 0..1

  for(let i=0; i<li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    // Amplitude falls off with distance — close threads pulse more
    const amp = 0.003 * Math.max(0, 1.0 - dist / 18.0);
    // Radial displacement: systole contracts toward sphere, diastole releases
    const pulse = (systole - 0.5) * amp;
    const breathPhase = basePositions[idx]*0.25 + basePositions[idx+1]*0.6 + i*0.004;
    const microBreath = Math.sin(t*0.08 + breathPhase) * 0.002;

    for(let v=0; v<2; v++){
      const vi = idx + v*3;
      const bx = basePositions[vi], by = basePositions[vi+1], bz = basePositions[vi+2];
      // Direction toward sphere
      const dx = spherePos.x - bx, dy = spherePos.y - by, dz = spherePos.z - bz;
      const len = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.001;
      arr[vi]   = bx + (dx/len)*pulse + microBreath*0.7;
      arr[vi+1] = by + (dy/len)*pulse + microBreath*0.4;
      arr[vi+2] = bz + (dz/len)*pulse + microBreath*0.3;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.0025;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look between sphere and boat with slow wander
  const look = centroid.clone();
  look.x += Math.sin(t*0.009)*0.7;
  look.y += Math.cos(t*0.007)*0.4;
  camera.lookAt(look);

  // Sphere imperceptible pulse — slightly larger during systole
  const sPulse = 1.0 + systole * 0.008;
  sphere.scale.setScalar(sPulse);
  sphere.position.y = spherePos.y + Math.sin(t*0.012)*0.01;

  // Light slow wander
  pL.position.x = 2.5 + Math.sin(t*0.006)*1.2;
  pL.position.y = 8.0 + Math.cos(t*0.005)*0.8;
  pL.position.z = -1.5 + Math.cos(t*0.008)*1.0;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
