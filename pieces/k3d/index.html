<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k3d · Shiota — Two Home Countries</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">k3d</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.012);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0404, 0.2));

const pL = new THREE.PointLight(0xffe0c0, 0.4, 50, 1.6);
pL.position.set(0, 12, -2);
scene.add(pL);

let seed = 82947163;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — architectural volume
const ROOM = { w: 38, h: 22, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── TWO SUSPENDED SPHERES — two home countries, two still centers
// Sphere A: larger, Osaka — warm bone-white, the origin
const posA = new THREE.Vector3(4.2, 0.6, -1.0);
const RA = 2.4;
const sphereA = new THREE.Mesh(
  new THREE.SphereGeometry(RA, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xf2ece4, emissive: 0xf2ece4, emissiveIntensity: 0.65,
    roughness: 0.95, metalness: 0, transparent: true, opacity: 0.5, side: THREE.DoubleSide
  })
);
sphereA.position.copy(posA);
scene.add(sphereA);

// Sphere B: smaller, Berlin — cooler off-white, the adopted home
const posB = new THREE.Vector3(-4.5, 1.2, 1.5);
const RB = 1.5;
const sphereB = new THREE.Mesh(
  new THREE.SphereGeometry(RB, 24, 16),
  new THREE.MeshStandardMaterial({
    color: 0xe8e4e0, emissive: 0xe8e4e0, emissiveIntensity: 0.55,
    roughness: 0.92, metalness: 0, transparent: true, opacity: 0.45, side: THREE.DoubleSide
  })
);
sphereB.position.copy(posB);
scene.add(sphereB);

// Midpoint between the two countries
const midAB = posA.clone().lerp(posB, 0.5);
const distAB = posA.distanceTo(posB);

// ── SUSPENSION WIRES — ceiling to both spheres
function addSuspWires(pos, r, count){
  const pts = [];
  for(let i=0; i<count; i++){
    const ox = (rng()-0.5)*2.5;
    const oz = (rng()-0.5)*2.5;
    pts.push(pos.x+ox, hh, pos.z+oz, pos.x+ox*0.15, pos.y+r, pos.z+oz*0.15);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  const idx = []; for(let i=0; i<count; i++) idx.push(i*2, i*2+1);
  geo.setIndex(idx);
  scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0x1a0a06, transparent: true, opacity: 0.45
  })));
}
addSuspWires(posA, RA, 5);
addSuspWires(posB, RB, 4);

// ── SPHERE SURFACE SAMPLERS
function surfPt(center, r){
  const u = rng()*Math.PI*2, v = Math.acos(2*rng()-1);
  return new THREE.Vector3(
    center.x + Math.sin(v)*Math.cos(u)*r,
    center.y + Math.sin(v)*Math.sin(u)*r,
    center.z + Math.cos(v)*r
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ANCHORS — structured around both spheres + bridge corridor
const anchors = [];

// Icosahedral skeleton centered on midpoint
const phi = (1+Math.sqrt(5))/2;
const icoV = [
  [0,1,phi],[0,-1,phi],[0,1,-phi],[0,-1,-phi],
  [1,phi,0],[-1,phi,0],[1,-phi,0],[-1,-phi,0],
  [phi,0,1],[-phi,0,1],[phi,0,-1],[-phi,0,-1]
];
for(const v of icoV){
  anchors.push(new THREE.Vector3(v[0]*7+midAB.x, v[1]*5.5+midAB.y, v[2]*7+midAB.z));
}

// Shell anchors around sphere A
for(let i=0; i<300; i++){
  const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
  anchors.push(posA.clone().add(dir.multiplyScalar(RA + 0.5 + rng()*6)));
}
// Shell anchors around sphere B
for(let i=0; i<200; i++){
  const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
  anchors.push(posB.clone().add(dir.multiplyScalar(RB + 0.5 + rng()*5)));
}
// Bridge corridor anchors — dense spine between the two homes
for(let i=0; i<180; i++){
  const t = rng();
  const p = posA.clone().lerp(posB, t);
  const spread = 1.0 + t*(1-t)*5.0; // thicker in the middle
  p.x += (rng()-0.5)*spread;
  p.y += (rng()-0.5)*spread*0.7;
  p.z += (rng()-0.5)*spread;
  anchors.push(p);
}
// Wall anchors
for(let i=anchors.length; i<900; i++){
  const w = wallPt();
  if(rng()<0.4) w.lerp(midAB, 0.1+rng()*0.4);
  anchors.push(w);
}

// ── VOID ZONES — deliberate negative space for the camera to breathe through
const voids = [];
for(let i=0; i<3; i++){
  const p = midAB.clone();
  p.x += (rng()-0.5)*16;
  p.y += (rng()-0.5)*8;
  p.z += (rng()-0.5)*16;
  // Don't void near spheres
  if(p.distanceTo(posA) < 5 || p.distanceTo(posB) < 4){ i--; continue; }
  voids.push({ pos: p, r: 2.0+rng()*2.2 });
}
function inVoid(p){ for(const v of voids) if(p.distanceTo(v.pos)<v.r) return true; return false; }

// ── Radial quantization near spheres — angular snap (Molnár order-to-chaos gradient)
function quantize(p, center, radius){
  const d = p.distanceTo(center);
  if(d > 10) return p;
  const s = Math.max(0, 1-d/10);
  const dir = p.clone().sub(center);
  const th = Math.atan2(dir.z, dir.x);
  const snap = 15*Math.PI/180;
  const snapped = Math.round(th/snap)*snap;
  const blended = th + (snapped-th)*s*0.4;
  const h = Math.sqrt(dir.x*dir.x + dir.z*dir.z);
  dir.x = Math.cos(blended)*h;
  dir.z = Math.sin(blended)*h;
  return center.clone().add(dir);
}

// ── BUILD 20,000 TAUT RED THREADS
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const linePhase = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  linePhase[li] = a.x*0.25 + a.y*0.4 + li*0.002;
  li++;
}

// Cat A: threads converging on Sphere A — origin/blood/family (38%)
const catA = Math.floor(NUM_LINES * 0.38);
for(let i=0; i<catA && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantize(a, posA, RA);
  if(rng() < 0.07){
    const target = surfPt(posA, RA);
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.3+rng()*1.2));
    setLine(a, target);
  } else {
    setLine(a, surfPt(posA, RA));
  }
}

// Cat B: threads converging on Sphere B — adopted home/longing (22%)
const catB = Math.floor(NUM_LINES * 0.22);
for(let i=0; i<catB && li<NUM_LINES; i++){
  let a = rng()<0.5 ? anchors[Math.floor(rng()*anchors.length)] : wallPt();
  if(inVoid(a)){ i--; continue; }
  a = quantize(a, posB, RB);
  if(rng() < 0.07){
    const target = surfPt(posB, RB);
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2+rng()*1.0));
    setLine(a, target);
  } else {
    setLine(a, surfPt(posB, RB));
  }
}

// Cat C: BRIDGE — dense threads connecting sphere A surface to sphere B surface (18%)
// The ties that bind two home countries — the most emotionally loaded threads
const catC = Math.floor(NUM_LINES * 0.18);
for(let i=0; i<catC && li<NUM_LINES; i++){
  const sa = surfPt(posA, RA);
  const sb = surfPt(posB, RB);
  // Some bridge threads sag slightly through midpoint anchors
  if(rng() < 0.3){
    const bridgeAnchor = anchors[Math.floor(rng()*anchors.length)];
    const dMid = bridgeAnchor.distanceTo(midAB);
    if(dMid < 6){
      setLine(sa, bridgeAnchor);
      if(li < NUM_LINES) setLine(bridgeAnchor, sb);
      i++; // counts as two
      continue;
    }
  }
  setLine(sa, sb);
}

// Cat D: wall-to-wall structural web (10%)
const catD = Math.floor(NUM_LINES * 0.10);
for(let i=0; i<catD && li<NUM_LINES; i++){
  const a = wallPt(), b = wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(mid.distanceTo(midAB)>18 && rng()>0.08){ i--; continue; }
  if(inVoid(mid)){ i--; continue; }
  setLine(a, b);
}

// Cat E: dendritic branching — morphogenetic local filaments
let dendro = 0;
while(li < NUM_LINES - 40 && dendro < 50000){
  dendro++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;
  let best = null, bestD = Infinity;
  for(let j=0; j<8; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.3 && d < 4.5){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  if(rng()<0.25 && li<NUM_LINES-2){
    const mid = a.clone().lerp(best, 0.3+rng()*0.35);
    const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
    const end = mid.clone().add(dir.multiplyScalar(0.5+rng()*1.4));
    if(!inVoid(end)){
      setLine(mid, end);
      if(rng()<0.2 && li<NUM_LINES){
        const m2 = mid.clone().lerp(end, 0.5);
        const d2 = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
        setLine(m2, m2.clone().add(d2.multiplyScalar(0.3+rng()*0.7)));
      }
    }
  }
}

// Fill remaining toward whichever sphere is closer
while(li < NUM_LINES){
  const a = anchors[Math.floor(rng()*anchors.length)];
  if(inVoid(a)){
    setLine(wallPt(), surfPt(posA, RA));
  } else {
    const target = a.distanceTo(posA) < a.distanceTo(posB) ? surfPt(posA, RA) : surfPt(posB, RB);
    setLine(a, target);
  }
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.06,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper, stones, memory debris
const NUM_FRAGS = 36;
for(let i=0; i<NUM_FRAGS; i++){
  const sz = 0.03+rng()*0.13;
  const geo = rng()>0.4
    ? new THREE.BoxGeometry(sz*(1.5+rng()*2.2), sz*0.015, sz*(0.5+rng()*1.2))
    : new THREE.TetrahedronGeometry(sz, 0);
  const d = 0.01+rng()*0.025;
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.3, d*0.15),
    transparent: true, opacity: 0.2+rng()*0.35
  });
  const mesh = new THREE.Mesh(geo, mat);
  const r = rng();
  if(r < 0.35){
    // Near sphere A
    const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
    mesh.position.copy(posA).add(dir.multiplyScalar(RA+0.4+rng()*4));
  } else if(r < 0.55){
    // Near sphere B
    const dir = new THREE.Vector3(rng()-0.5,rng()-0.5,rng()-0.5).normalize();
    mesh.position.copy(posB).add(dir.multiplyScalar(RB+0.3+rng()*3.5));
  } else if(r < 0.75){
    // Along bridge corridor
    const t = rng();
    mesh.position.lerpVectors(posA, posB, t);
    mesh.position.x += (rng()-0.5)*2;
    mesh.position.y += (rng()-0.5)*1.5;
    mesh.position.z += (rng()-0.5)*2;
  } else {
    // Along a random thread
    const si = Math.floor(rng()*li)*6;
    const t = 0.2+rng()*0.6;
    mesh.position.set(
      basePositions[si]*(1-t)+basePositions[si+3]*t,
      basePositions[si+1]*(1-t)+basePositions[si+4]*t,
      basePositions[si+2]*(1-t)+basePositions[si+5]*t
    );
  }
  mesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(mesh);
}

// ── CAMERA — slow figure-eight drift between the two spheres, inside the web
const pathLen = 600;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const p = t*Math.PI*2;
  // Lemniscate (figure-8) in XZ centered on midpoint, Y gently wanders
  const scale = 5.5;
  const denom = 1+Math.sin(p)*Math.sin(p);
  const lx = scale*Math.cos(p)/denom;
  const lz = scale*Math.sin(p)*Math.cos(p)/denom;
  const x = midAB.x + lx + Math.sin(p*1.3+0.7)*1.2;
  const y = midAB.y + 0.5 + Math.sin(p*0.4+0.5)*3.5 + Math.cos(p*0.3)*0.6;
  const z = midAB.z + lz*1.4 + Math.cos(p*0.65+1.2)*2.0;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now()-t0)/1000;

  // ── THREAD MICRO-BREATHING — imperceptible anchor jitter
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx = i*6;
    const amp = 0.0015;
    const breath = Math.sin(t*0.04 + linePhase[i]) * amp;
    for(let v=0; v<2; v++){
      const vi = idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.5;
      arr[vi+1] = basePositions[vi+1] + breath*0.3;
      arr[vi+2] = basePositions[vi+2] + breath*0.4;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift — figure-eight between the two homes
  const speed = 0.0014;
  const pathT = (t*speed) % 1.0;
  const idx = pathT*(pathLen-1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0+1) % pathLen;
  const frac = idx-Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward whichever sphere is further — always longing for the other home
  const dA = camera.position.distanceTo(posA);
  const dB = camera.position.distanceTo(posB);
  const lookBlend = Math.min(1, Math.max(0, (dA-dB)/(distAB*0.5)*0.5+0.5));
  const look = posA.clone().lerp(posB, lookBlend);
  look.x += Math.sin(t*0.006)*0.35;
  look.y += Math.cos(t*0.004)*0.25;
  camera.lookAt(look);

  // Light slow wander
  pL.position.x = midAB.x + Math.sin(t*0.004)*2.0;
  pL.position.y = 12 + Math.cos(t*0.003)*0.5;
  pL.position.z = midAB.z + Math.cos(t*0.005)*1.5;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
