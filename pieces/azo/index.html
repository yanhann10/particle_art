<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azo · helix branch · galactic river</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e0b08; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">azo</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system ── */
const RULES = {
  'F': [
    { p: 0.45, s: 'FF[+F-F][-F+F][/F\\F]' },
    { p: 0.30, s: 'F[+F][-F]F'            },
    { p: 0.15, s: 'F[/F][\\F]F'           },
    { p: 0.10, s: 'F[+F-F]F[\\F/F]'       },
  ],
};
const ANGLE = THREE.MathUtils.degToRad(22.5);
const STEP_BASE = 1.0;

function expand(axiom, depth, rng) {
  let s = axiom;
  for (let d = 0; d < depth; d++) {
    let out = '';
    for (const ch of s) {
      if (ch in RULES) {
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]) {
          acc += opt.p;
          if (r <= acc) { out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str) {
  const H = new THREE.Vector3(0, 1, 0);
  const L = new THREE.Vector3(-1, 0, 0);
  const U = new THREE.Vector3(0, 0, 1);
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str) {
    switch (ch) {
      case 'F': {
        const step = STEP_BASE * Math.pow(0.78, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next;
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen;
        break;
      }
    }
  }
  return segments;
}

/* ── Build particles: store un-wound treePos, pass to GPU ── */
function buildParticles(segments, totalN, yMin, yMax) {
  const lens = segments.map(s => s.from.distanceTo(s.to));
  const total = lens.reduce((a, b) => a + b, 0);

  // un-wound L-system positions (treePos attributes for GPU helix winding)
  const treePosArr = new Float32Array(totalN * 3);
  const seeds      = new Float32Array(totalN);
  const gens       = new Float32Array(totalN);

  const v = new THREE.Vector3();
  let written = 0;

  for (let i = 0; i < segments.length; i++) {
    const share = i === segments.length - 1
      ? totalN - written
      : Math.max(1, Math.floor(totalN * lens[i] / total));

    const seg = segments[i];

    for (let k = 0; k < share && written < totalN; k++) {
      const t = Math.random();
      v.lerpVectors(seg.from, seg.to, t);

      // jitter: smaller for inner segments, bigger for tips
      const jitter = 0.06 * Math.pow(0.85, seg.gen);
      v.x += (Math.random() - 0.5) * jitter;
      v.y += (Math.random() - 0.5) * jitter;
      v.z += (Math.random() - 0.5) * jitter;

      // store raw L-system position (un-wound)
      treePosArr[written * 3]     = v.x;
      treePosArr[written * 3 + 1] = v.y;
      treePosArr[written * 3 + 2] = v.z;
      seeds[written] = Math.random();
      gens[written]  = seg.gen;
      written++;
    }
  }
  return { treePosArr, seeds, gens };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(12, 6, 24);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0e0b08, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 5, 0);
controls.update();

const N = 80000;
let geom, points;

const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uReady:  { value: 0 },
  uGust:   { value: 0 },
  uFlow:   { value: 0 },
  uYMin:   { value: 0 },
  uYRange: { value: 1 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uGust;
    uniform float uFlow;
    uniform float uYMin;
    uniform float uYRange;

    attribute vec3  treePos;   /* raw L-system position (pre-helix-winding) */
    attribute float seed;
    attribute float gen;

    varying vec3  vCol;
    varying float vAlpha;

    /* Helix constants (must match CPU-side) */
    const float HELIX_A      = 6.0;
    const float HELIX_W      = 1.2;
    const float HELIX_TSCALE = 0.8;
    const float HELIX_RANGE  = 12.0;

    void main() {
      /* ── GPU helix winding with flow offset ── */
      float hRaw = ((treePos.y - uYMin) / uYRange) * HELIX_RANGE + uFlow;
      float h    = mod(hRaw, HELIX_RANGE);

      /* helix spine center */
      float cx = HELIX_A * sin(h * HELIX_W);
      float cy = h * HELIX_TSCALE;
      float cz = HELIX_A * cos(h * HELIX_W);

      /* tangent T = dC/dh, normalized */
      float tx = HELIX_A * HELIX_W * cos(h * HELIX_W);
      float ty = HELIX_TSCALE;
      float tz = -HELIX_A * HELIX_W * sin(h * HELIX_W);
      float tLen = length(vec3(tx, ty, tz));
      vec3 T_ = vec3(tx / tLen, ty / tLen, tz / tLen);

      /* centripetal normal N = d²C/dh² direction */
      float nx_ = -sin(h * HELIX_W);
      float nz_ = -cos(h * HELIX_W);
      float nLen = length(vec2(nx_, nz_));
      vec3 N_ = vec3(nx_ / nLen, 0.0, nz_ / nLen);

      /* binormal B = T × N */
      vec3 B_ = normalize(cross(T_, N_));

      /* wound position: lateral offsets via N (x) and B (z) */
      vec3 p = vec3(cx, cy, cz) + treePos.x * N_ + treePos.z * B_;

      /* reveal animation: particles rain in from above */
      vec3 entry = vec3(seed * 6.0 - 3.0, 30.0 + seed * 12.0, seed * 6.0 - 3.0);
      p = mix(entry, p, smoothstep(0.0, 1.0, uReady));

      /* ── harmattan wind: peel tangentially around the helix ── */
      float distFromAxis = length(vec2(p.x, p.z));
      float edgeDist = smoothstep(3.0, 9.0, distFromAxis);

      /* tangential wind direction (eddies in the river current) */
      vec2 radial  = normalize(vec2(p.x, p.z) + 0.001);
      vec3 windDir = vec3(-radial.y, 0.08, radial.x);

      float gustPhase = uTime * 0.38 + seed * 6.28;
      float localGust = uGust * (0.5 + 0.5 * sin(gustPhase * 0.65 + h * 1.2));

      float surfaceShift = localGust * 0.5 * edgeDist;
      p += windDir * surfaceShift;

      /* detach: edge particles peel away tangentially */
      float detach = smoothstep(0.5, 0.9, edgeDist) * smoothstep(0.4, 0.85, seed);
      float peel   = detach * uGust * 3.2;
      p += windDir * peel;
      p.y -= peel * 0.3;

      /* high-freq tremor */
      float tremor = edgeDist * localGust * 0.14;
      p.x += tremor * sin(uTime * 8.5 + seed * 38.0);
      p.z += tremor * cos(uTime * 7.2 + seed * 33.0);

      /* ── desaturated earth-tone palette ── */
      float t      = uTime * 0.5 + seed * 6.28;
      float energy = 0.5 + 0.5 * sin(t * 0.5);

      vec3 amber = vec3(0.52, 0.40, 0.26);   /* dark tobacco brown */
      vec3 ochre = vec3(0.42, 0.32, 0.20);   /* warm dark umber    */
      vec3 cream = vec3(0.68, 0.62, 0.50);   /* aged parchment     */
      vec3 cyan  = vec3(0.22, 0.42, 0.40);   /* muted teal-grey    */

      float genN   = clamp(gen / 5.0, 0.0, 1.0);
      vec3 baseCol = mix(amber, ochre, smoothstep(0.0, 0.5, genN));
      baseCol      = mix(baseCol, cream, smoothstep(0.4, 1.0, genN));

      /* helix-edge peeled particles shift to muted teal */
      baseCol = mix(baseCol, cyan, detach * uGust * 0.85);

      /* gentle shimmer along helix arc */
      float arc = h / HELIX_RANGE;
      baseCol += 0.04 * vec3(
        sin(arc * 8.0) * 0.5 + 0.5,
        sin(arc * 5.0 + 1.2) * 0.35,
        cos(arc * 6.0) * 0.3
      );
      baseCol += 0.03 * energy * vec3(0.7, 0.55, 0.3);

      vCol = clamp(baseCol, 0.0, 1.0);

      /* alpha: trunk=strong, tips=lighter, peeled=fading */
      float baseAlpha = 0.95 - 0.35 * genN;
      vAlpha = baseAlpha * (1.0 - detach * uGust * 0.5);

      /* size: gen-adaptive + distance-adaptive; boosted base for darker palette */
      float sizeBase = mix(4.5, 2.5, genN);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(0.1, -mv.z);
      gl_PointSize = uPixel * (55.0 / dist) * sizeBase * (0.3 + 0.7 * uReady);
      gl_Position  = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3  vCol;
    varying float vAlpha;

    vec3 quantize(vec3 c, float steps) {
      return floor(c * steps + 0.5) / steps;
    }

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      /* hard disc — NO soft gaussian, for sharpness gate */
      if (r > 0.2025) discard;  /* 0.45^2 = 0.2025 */

      /* risograph posterization: 6 levels per channel */
      vec3 qCol = quantize(vCol, 6.0);

      /* quantize alpha to 4 levels */
      float qAlpha = floor(vAlpha * 4.0 + 0.5) / 4.0;

      gl_FragColor = vec4(qCol, qAlpha);
    }
  `
});

let revealStart = 0;

function regrow(seedVal) {
  let s = seedVal >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str  = expand('F', 5, rng);
  const segs = turtle(str);

  /* compute bounding box */
  const bb = new THREE.Box3();
  for (const sg of segs) { bb.expandByPoint(sg.from); bb.expandByPoint(sg.to); }
  const ctr = bb.getCenter(new THREE.Vector3());
  const mn  = bb.min;

  /* center XZ, anchor Y at base=0 */
  for (const sg of segs) {
    sg.from.x -= ctr.x; sg.from.z -= ctr.z; sg.from.y -= mn.y;
    sg.to.x   -= ctr.x; sg.to.z   -= ctr.z; sg.to.y   -= mn.y;
  }

  /* recompute BB after centering */
  const bb2 = new THREE.Box3();
  for (const sg of segs) { bb2.expandByPoint(sg.from); bb2.expandByPoint(sg.to); }
  const yMin = bb2.min.y;  // ~0
  const yMax = bb2.max.y;

  const { treePosArr, seeds, gens } = buildParticles(segs, N, yMin, yMax);

  /* update helix normalization uniforms */
  uniforms.uYMin.value   = yMin;
  uniforms.uYRange.value = Math.max(0.001, yMax - yMin);

  if (!geom) {
    geom = new THREE.BufferGeometry();
    // Use dummy positions (GPU will compute wound positions from treePos)
    geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
    geom.setAttribute('treePos',  new THREE.BufferAttribute(treePosArr, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('gen',      new THREE.BufferAttribute(gens, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.treePos.array.set(treePosArr); geom.attributes.treePos.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.gen.array.set(gens);            geom.attributes.gen.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const startTime = performance.now();

function loop() {
  const now     = performance.now();
  const elapsed = (now - startTime) / 1000;
  uniforms.uTime.value = elapsed;
  /* liquid galactic river: particles scroll along helix spine, ~30s per full loop */
  uniforms.uFlow.value = (elapsed * 0.4) % 12.0;

  if (revealStart > 0) {
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2000);
  }

  /* harmattan gusts */
  const gustSlow = Math.pow(Math.sin(elapsed * 0.22) * 0.5 + 0.5, 1.8);
  const gustMed  = 0.18 * Math.sin(elapsed * 0.73 + 1.0);
  const gustFast = 0.08 * Math.sin(elapsed * 1.9 + 2.5);
  uniforms.uGust.value = Math.max(0, Math.min(1, gustSlow + gustMed + gustFast));

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>

<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…" style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none" onfocus="this.style.borderColor='rgba(201,168,106,0.6)'" onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};
  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){var jobId=d.job_id||'';var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);location.href='/compare'+qs;})
    .catch(function(){location.href='/compare?a='+pid+'&directive='+encodeURIComponent(txt);});
  };
})();
</script>
