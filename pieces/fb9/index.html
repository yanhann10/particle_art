<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fb9 · cypress ↔ art-deco tower morph</title>
<!-- MOTION: sway, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0704; overflow:hidden;
               color:#d6cab2; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
  .label { position:fixed; right:14px; bottom:12px; opacity:0.65; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">fb9</div>
<div class="hint">drag to orbit · click to flip · auto-morphs every ~12s</div>
<div class="src">sodium street-light · 70k particles · two poses</div>
<div class="label" id="phaseLabel">cypress 100%</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ────────────── scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0704, 0.018);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14, 6, 22);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0704, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 8, 0);

// ────────────── geometry pose A: cypress (vertical L-system)
const RULES = {
  'F': [
    { p: 0.55, s: 'F[+f][-f]F'         },
    { p: 0.25, s: 'FF[/f]\\F'          },
    { p: 0.20, s: 'F[+f-f][/f\\f]F'    },
  ],
  'f': [
    { p: 0.6, s: 'f[+f][-f]'          },
    { p: 0.4, s: 'f'                   },
  ]
};
const ANGLE = THREE.MathUtils.degToRad(13);
const STEP_BASE = 0.55;

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){ acc += opt.p; if (r <= acc){ out += opt.s; break; } }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function turtle(str){
  const stack = [];
  const segments = [];
  let pos = new THREE.Vector3(0, 0, 0);
  let h = new THREE.Vector3(0, 1, 0);
  let l = new THREE.Vector3(-1, 0, 0);
  let u = new THREE.Vector3(0, 0, 1);
  let gen = 0;
  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };
  for (const ch of str){
    switch(ch){
      case 'F': case 'f': {
        const step = STEP_BASE * Math.pow(0.85, gen);
        const next = pos.clone().addScaledVector(h, step);
        segments.push({ from: pos.clone(), to: next.clone(), gen });
        pos = next; break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE * 1.5); break;
      case '\\': rotate(h, -ANGLE * 1.5); break;
      case '[': stack.push({ pos: pos.clone(), h: h.clone(), l: l.clone(), u: u.clone(), gen }); gen++; break;
      case ']': { const f = stack.pop(); pos = f.pos; h = f.h; l = f.l; u = f.u; gen = f.gen; break; }
    }
  }
  return segments;
}

const rng = (() => { let s = 0xC0FFEE; return () => { s = (s + 0x6D2B79F5) | 0;
  let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();

const cypressSegs = turtle(expand('F', 6, rng));

// ────────────── geometry pose B: art-deco tower
function sampleArtDeco(N){
  const out = new Float32Array(N * 3);
  const pos = new THREE.Vector3();

  const tiers = [
    { hw: 4.5, y0: 0.0,  y1: 4.0,  ridges: 14 },
    { hw: 3.4, y0: 4.0,  y1: 7.5,  ridges: 12 },
    { hw: 2.4, y0: 7.5,  y1: 10.5, ridges: 10 },
    { hw: 1.5, y0: 10.5, y1: 13.0, ridges: 8  },
    { hw: 0.85,y0: 13.0, y1: 15.0, ridges: 6  },
  ];
  const spireBase = 0.6, spireTop = 18.5, spireApex = 20.5;

  const W = Math.floor(N * 0.55);
  const B = Math.floor(N * 0.25);
  const S = Math.floor(N * 0.12);
  const C = N - W - B - S;
  let i = 0;

  const tierWeights = tiers.map(t => 8 * t.hw * (t.y1 - t.y0));
  const tw_total = tierWeights.reduce((a,b)=>a+b, 0);
  for (let ti = 0; ti < tiers.length; ti++){
    const t = tiers[ti];
    const count = (ti === tiers.length - 1)
      ? (W - tierWeights.slice(0, ti).reduce((a,b)=>a+(b/tw_total*W),0))
      : Math.floor(tierWeights[ti] / tw_total * W);
    for (let k = 0; k < count; k++){
      const face = Math.floor(Math.random() * 4);
      const r = Math.floor(Math.random() * t.ridges);
      const ridgeFrac = (r + 0.5) / t.ridges;
      const along = (ridgeFrac * 2 - 1) * t.hw;
      const y = t.y0 + Math.random() * (t.y1 - t.y0);
      const jitter = 0.04;
      switch(face){
        case 0: pos.set( t.hw + (Math.random()-0.5)*jitter, y, along); break;
        case 1: pos.set(-t.hw + (Math.random()-0.5)*jitter, y, along); break;
        case 2: pos.set(along, y,  t.hw + (Math.random()-0.5)*jitter); break;
        case 3: pos.set(along, y, -t.hw + (Math.random()-0.5)*jitter); break;
      }
      out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
    }
  }

  for (let k = 0; k < B; k++){
    const ti = Math.floor(Math.random() * tiers.length);
    const t = tiers[ti];
    const edge = Math.random() < 0.6 ? t.y1 : t.y0;
    const face = Math.floor(Math.random() * 4);
    const f = Math.random() * 2 - 1;
    const along = f * t.hw;
    const j = 0.02;
    switch(face){
      case 0: pos.set( t.hw, edge + (Math.random()-0.5)*j, along); break;
      case 1: pos.set(-t.hw, edge + (Math.random()-0.5)*j, along); break;
      case 2: pos.set(along, edge + (Math.random()-0.5)*j,  t.hw); break;
      case 3: pos.set(along, edge + (Math.random()-0.5)*j, -t.hw); break;
    }
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  for (let k = 0; k < S; k++){
    const t = Math.random();
    const y = spireTop + t * (spireApex - spireTop);
    const r = spireBase * (1 - t);
    const th = Math.random() * Math.PI * 2;
    pos.set(Math.cos(th) * r, y, Math.sin(th) * r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }

  const chevrons = 16;
  for (let k = 0; k < C; k++){
    const ch = Math.floor(Math.random() * chevrons);
    const th = (ch + 0.5) / chevrons * Math.PI * 2;
    const along = Math.random();
    const inner = 0.7, outer = 2.0;
    const r = inner + along * (outer - inner);
    const y = spireTop - 0.4 + along * 0.8 + (Math.random()-0.5) * 0.05;
    pos.set(Math.cos(th) * r, y, Math.sin(th) * r);
    out[i*3]=pos.x; out[i*3+1]=pos.y; out[i*3+2]=pos.z; i++;
  }
  return out;
}

// ────────────── build correspondence
const N = 70000;
const treePos  = new Float32Array(N * 3);
const towerPos = sampleArtDeco(N);
const seeds = new Float32Array(N);

const lens = cypressSegs.map(s => s.from.distanceTo(s.to));
const totalLen = lens.reduce((a,b)=>a+b, 0);
const SKELETON_FRAC = 0.55;
const N_SKEL = Math.floor(N * SKELETON_FRAC);
const N_FOLIAGE = N - N_SKEL;

let written = 0;
const v = new THREE.Vector3();
for (let i = 0; i < cypressSegs.length; i++){
  const share = i === cypressSegs.length - 1
    ? (N_SKEL - written)
    : Math.max(1, Math.floor(N_SKEL * lens[i] / totalLen));
  for (let k = 0; k < share && written < N_SKEL; k++){
    const t = Math.random();
    v.lerpVectors(cypressSegs[i].from, cypressSegs[i].to, t);
    const jitter = 0.05 * Math.pow(0.85, cypressSegs[i].gen);
    treePos[written*3]   = v.x + (Math.random()-0.5)*jitter;
    treePos[written*3+1] = v.y + (Math.random()-0.5)*jitter;
    treePos[written*3+2] = v.z + (Math.random()-0.5)*jitter;
    seeds[written] = Math.random();
    written++;
  }
}
{
  let yMin = Infinity, yMax = -Infinity;
  for (const s of cypressSegs){ yMin = Math.min(yMin, s.from.y, s.to.y); yMax = Math.max(yMax, s.from.y, s.to.y); }
  const trunkH = yMax - yMin;
  const haloYStart = yMin + trunkH * 0.16;
  const RIDGES = 8;
  const SPIRAL = 0.9;
  const TUFT_COUNT = 24;
  const tuftYs = [];
  const tuftThetas = [];
  for (let i = 0; i < TUFT_COUNT; i++){
    const yt = (i + 0.5) / TUFT_COUNT;
    tuftYs.push(haloYStart + yt * (yMax - haloYStart));
    tuftThetas.push(Math.random() * Math.PI * 2);
  }

  const N_RIDGE = Math.floor(N_FOLIAGE * 0.60);
  const N_TUFT  = N_FOLIAGE - N_RIDGE;

  for (let k = 0; k < N_RIDGE && written < N; k++){
    const yt = Math.random();
    const y = haloYStart + yt * (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const ridge = Math.floor(Math.random() * RIDGES);
    const ridgeTh = (ridge / RIDGES) * Math.PI * 2 + y * SPIRAL;
    const th = ridgeTh + (Math.random() - 0.5) * 0.30;
    const r = baseR * (0.55 + 0.45 * Math.random());
    treePos[written*3]   = Math.cos(th) * r;
    treePos[written*3+1] = y + (Math.random() - 0.5) * 0.05;
    treePos[written*3+2] = Math.sin(th) * r;
    seeds[written] = Math.random();
    written++;
  }
  for (let k = 0; k < N_TUFT && written < N; k++){
    const t = Math.floor(Math.random() * TUFT_COUNT);
    const tuftY = tuftYs[t];
    const tuftTh = tuftThetas[t];
    const yt = (tuftY - haloYStart) / (yMax - haloYStart);
    const taper = Math.max(0.18, 1.0 - 1.5 * Math.pow(yt - 0.45, 2));
    const baseR = 0.05 + 0.95 * taper;
    const reach = baseR + 0.1 + Math.random() * 0.35;
    const tuftSize = 0.18;
    const localY = tuftY + (Math.random() - 0.5) * 0.4;
    const localTh = tuftTh + (Math.random() - 0.5) * 0.4;
    const localR = reach + (Math.random() - 0.5) * tuftSize;
    treePos[written*3]   = Math.cos(localTh) * localR;
    treePos[written*3+1] = localY;
    treePos[written*3+2] = Math.sin(localTh) * localR;
    seeds[written] = Math.random();
    written++;
  }
}
while (written < N){
  treePos[written*3] = 0; treePos[written*3+1] = 0; treePos[written*3+2] = 0;
  seeds[written] = Math.random(); written++;
}

function fitToHeight(arr, targetH){
  let minY = Infinity, maxY = -Infinity;
  let cx = 0, cz = 0;
  for (let i = 0; i < arr.length / 3; i++){
    minY = Math.min(minY, arr[i*3+1]);
    maxY = Math.max(maxY, arr[i*3+1]);
    cx += arr[i*3]; cz += arr[i*3+2];
  }
  cx /= arr.length / 3; cz /= arr.length / 3;
  const h = maxY - minY;
  const s = targetH / h;
  for (let i = 0; i < arr.length / 3; i++){
    arr[i*3]   = (arr[i*3]   - cx) * s;
    arr[i*3+1] = (arr[i*3+1] - minY) * s;
    arr[i*3+2] = (arr[i*3+2] - cz) * s;
  }
}
fitToHeight(treePos, 16);
fitToHeight(towerPos, 16);

// ────────────── shader — sodium street-light palette
// Sodium vapor lamps emit a narrow-band amber-orange (~589nm).
// Palette: deep umber shadows, monochromatic amber core, hot white-amber peak.
// Reference: Dan Flavin's fluorescent light installations — color as atmosphere.
const uniforms = {
  uTime:   { value: 0 },
  uPixel:  { value: renderer.getPixelRatio() },
  uMix:    { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(treePos.slice(), 3));
geom.setAttribute('treePos',  new THREE.BufferAttribute(treePos, 3));
geom.setAttribute('towerPos', new THREE.BufferAttribute(towerPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uMix;
    attribute vec3 treePos;
    attribute vec3 towerPos;
    attribute float seed;
    varying vec3 vCol;
    varying float vEnergy;
    varying float vMix;
    void main(){
      float m = smoothstep(0.0, 1.0, uMix);
      vec3 p = mix(treePos, towerPos, m);

      float t = uTime * 0.55 + seed * 6.28;
      float swayAmt = (1.0 - m) * 0.06 * (p.y / 16.0);
      p.x += swayAmt * sin(t);
      p.z += swayAmt * cos(t * 0.9);

      vMix = m;
      vEnergy = 0.5 + 0.5 * sin(t * 0.8);

      // sodium street-light: narrow amber band
      // cypress pose — dark umber base to warm sodium amber
      vec3 treeA = vec3(0.28, 0.14, 0.05);   // deep umber shadow
      vec3 treeB = vec3(0.72, 0.42, 0.08);   // sodium amber mid
      vec3 treeC = vec3(0.95, 0.68, 0.15);   // hot sodium peak at crown

      // tower pose — cooler amber base to incandescent white-amber
      vec3 deco_a = vec3(0.35, 0.18, 0.04);  // oxidized bronze shadow
      vec3 deco_b = vec3(0.88, 0.58, 0.10);  // sodium lamp core
      vec3 deco_c = vec3(1.00, 0.88, 0.55);  // overdriven sodium — near white-amber

      float hk = clamp(p.y / 16.0, 0.0, 1.0);
      vec3 treeCol  = mix(treeA, treeB, hk);
      treeCol = mix(treeCol, treeC, smoothstep(0.7, 1.0, hk) * 0.6);
      vec3 decoCol  = mix(deco_a, deco_b, hk);
      decoCol = mix(decoCol, deco_c, smoothstep(0.85, 1.0, hk) * 0.7);
      vCol = mix(treeCol, decoCol, m);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (0.9 + 0.7 * vEnergy) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vEnergy;
    varying float vMix;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 18.0) * (0.45 + 0.55 * vEnergy);
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});
const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── interaction
let target = 0;
let phase = 0;
addEventListener('click', () => { target = 1 - target; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const phaseLabel = document.getElementById('phaseLabel');
const start = performance.now();
function loop(){
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  const auto = (Math.floor(t / 12) % 2 === 1) ? 1 : 0;
  const desired = target ^ auto;
  phase += (desired - phase) * 0.02;
  uniforms.uMix.value = phase;

  const pct = Math.round((1 - phase) * 100);
  phaseLabel.textContent = phase < 0.5 ? `cypress ${pct}%` : `art-deco ${100 - pct}%`;

  const ang = t * 0.05;
  camera.position.x = Math.sin(ang) * 22;
  camera.position.z = Math.cos(ang) * 22;
  camera.lookAt(0, 8, 0);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
