<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p8t · cursive binary ribbon</title>
<!-- MOTION: streaming, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
        color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">p8t</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 2, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0a0c, 1);
document.body.appendChild(renderer.domElement);

// ─── glyph texture atlas ───
const ATLAS_SIZE = 512;
const GRID = 16; // 16x16 grid = 256 slots
const CELL = ATLAS_SIZE / GRID;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = atlasCanvas.height = ATLAS_SIZE;
const ctx = atlasCanvas.getContext('2d');
ctx.fillStyle = '#0a0a0c';
ctx.fillRect(0, 0, ATLAS_SIZE, ATLAS_SIZE);

// glyph set: English letters dissolving into binary, leaf-like chars, punctuation
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0101010101010101🍃🌿☘♣♠✧·:.;,—–…∞∅∂∫∑αβγδεζηθλμνπρσφψω';
const glyphArr = [...GLYPHS];
// fill remaining slots with binary
while (glyphArr.length < GRID * GRID) glyphArr.push(Math.random() < 0.5 ? '0' : '1');

ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
for (let i = 0; i < GRID * GRID; i++) {
  const col = i % GRID, row = Math.floor(i / GRID);
  const x = col * CELL + CELL / 2, y = row * CELL + CELL / 2;
  // vary size slightly for hand-placed feel
  const sz = CELL * (0.6 + Math.random() * 0.2);
  ctx.font = `${sz}px "Georgia", serif`;
  ctx.fillStyle = `rgba(240,235,220,${0.7 + Math.random() * 0.3})`;
  ctx.fillText(glyphArr[i], x, y);
}

const atlasTexture = new THREE.CanvasTexture(atlasCanvas);
atlasTexture.minFilter = THREE.LinearMipmapLinearFilter;
atlasTexture.magFilter = THREE.LinearFilter;

// ─── ribbon curves (multiple 3D Bezier paths) ───
const RIBBON_COUNT = 7;
const PTS_PER_RIBBON = 80;
const N = 45000;

function makeRibbonCurve(idx) {
  const yOff = (idx - RIBBON_COUNT / 2) * 2.8;
  const xAmp = 6 + Math.sin(idx * 1.7) * 3;
  const zAmp = 4 + Math.cos(idx * 2.3) * 2;
  const phase = idx * 0.9;
  const pts = [];
  for (let i = 0; i <= PTS_PER_RIBBON; i++) {
    const t = i / PTS_PER_RIBBON;
    const angle = t * Math.PI * 3 + phase;
    pts.push(new THREE.Vector3(
      Math.sin(angle) * xAmp * (0.4 + 0.6 * t),
      yOff + t * 14 - 7 + Math.sin(t * 5 + idx) * 0.8,
      Math.cos(angle) * zAmp * (0.3 + 0.7 * (1 - t))
    ));
  }
  return new THREE.CatmullRomCurve3(pts);
}

const ribbons = [];
for (let i = 0; i < RIBBON_COUNT; i++) ribbons.push(makeRibbonCurve(i));

// ─── particle attributes ───
const positions = new Float32Array(N * 3);
const uvOffsets = new Float32Array(N * 2); // atlas UV offset per glyph
const ribbonIdx = new Float32Array(N);     // which ribbon
const ribbonT   = new Float32Array(N);     // position along ribbon [0,1]
const seeds     = new Float32Array(N);
const binaryFlag = new Float32Array(N);    // 1 = binary glyph, 0 = letter/leaf

const binaryStart = 52 + 26; // index where binary chars start in atlas
const leafStart = 52 + 16;   // leaf emojis start

for (let i = 0; i < N; i++) {
  const ri = Math.floor(Math.random() * RIBBON_COUNT);
  const t = Math.random();
  ribbonIdx[i] = ri;
  ribbonT[i] = t;
  seeds[i] = Math.random();

  const pt = ribbons[ri].getPointAt(t);
  // slight lateral scatter for ribbon width
  const scatter = (Math.random() - 0.5) * 0.6;
  const tangent = ribbons[ri].getTangentAt(t);
  const up = new THREE.Vector3(0, 1, 0);
  const lateral = new THREE.Vector3().crossVectors(tangent, up).normalize();
  positions[i * 3]     = pt.x + lateral.x * scatter;
  positions[i * 3 + 1] = pt.y + lateral.y * scatter + (Math.random() - 0.5) * 0.3;
  positions[i * 3 + 2] = pt.z + lateral.z * scatter;

  // assign glyph from atlas
  let glyphIdx;
  const r = Math.random();
  if (r < 0.35) {
    // letter
    glyphIdx = Math.floor(Math.random() * 52);
    binaryFlag[i] = 0;
  } else if (r < 0.6) {
    // binary
    glyphIdx = 52 + Math.floor(Math.random() * 16);
    binaryFlag[i] = 1;
  } else if (r < 0.75) {
    // leaf symbols
    glyphIdx = leafStart + Math.floor(Math.random() * 5);
    binaryFlag[i] = 0;
  } else {
    // greek / math symbols
    glyphIdx = 80 + Math.floor(Math.random() * 40);
    binaryFlag[i] = 0;
  }
  const col = glyphIdx % GRID, row = Math.floor(glyphIdx / GRID);
  uvOffsets[i * 2]     = col / GRID;
  uvOffsets[i * 2 + 1] = row / GRID;
}

// ─── shader material ───
const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('uvOffset', new THREE.BufferAttribute(uvOffsets, 2));
geom.setAttribute('aRibbonIdx', new THREE.BufferAttribute(ribbonIdx, 1));
geom.setAttribute('aRibbonT', new THREE.BufferAttribute(ribbonT, 1));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('binaryFlag', new THREE.BufferAttribute(binaryFlag, 1));

const uniforms = {
  uTime: { value: 0 },
  uAtlas: { value: atlasTexture },
  uGrid: { value: GRID },
  uPixel: { value: renderer.getPixelRatio() }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uGrid;
    attribute vec2 uvOffset;
    attribute float aRibbonIdx;
    attribute float aRibbonT;
    attribute float seed;
    attribute float binaryFlag;
    varying vec2 vUvOffset;
    varying float vAlpha;
    varying float vCollapse;

    void main() {
      // streaming: offset T by time so glyphs flow along ribbon
      float speed = 0.04 + seed * 0.02;
      float flowT = fract(aRibbonT + uTime * speed);

      // collapse wave: periodic binary dissolution
      float wave = sin(uTime * 0.3 + aRibbonIdx * 1.1) * 0.5 + 0.5;
      float collapseZone = smoothstep(wave - 0.15, wave, flowT) *
                           (1.0 - smoothstep(wave, wave + 0.15, flowT));
      vCollapse = collapseZone;

      // position from stored attribute (initial placement on ribbon)
      vec3 p = position;

      // add streaming displacement along Y (vertical flow feel)
      float drift = fract(seed + uTime * speed) * 14.0 - 7.0;
      p.y += drift - (position.y - 0.0) * 0.3;

      // gentle breath
      float breathe = sin(uTime * 0.7 + seed * 6.28) * 0.15;
      p.x += breathe * (1.0 - binaryFlag);
      p.z += breathe * 0.5 * binaryFlag;

      // during collapse, glyphs tighten into a line (x,z → 0)
      p.x = mix(p.x, p.x * 0.1, collapseZone * 0.6);
      p.z = mix(p.z, p.z * 0.1, collapseZone * 0.6);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // size: letters slightly larger, binary smaller
      float baseSize = mix(3.2, 2.0, binaryFlag);
      // collapsed glyphs shrink into tight binary stream
      baseSize = mix(baseSize, 1.8, collapseZone);
      gl_PointSize = baseSize * uPixel * (45.0 / dist);
      gl_Position = projectionMatrix * mv;

      // fade edges
      float edgeFade = smoothstep(0.0, 0.08, flowT) * smoothstep(1.0, 0.92, flowT);
      vAlpha = edgeFade * (0.55 + 0.45 * sin(uTime * 0.4 + seed * 3.14));

      vUvOffset = uvOffset;
      // during collapse, shift UV to binary glyphs
      if (collapseZone > 0.5 && binaryFlag < 0.5) {
        float bIdx = floor(seed * 16.0);
        float bCol = mod(bIdx + 52.0, uGrid);
        float bRow = floor((bIdx + 52.0) / uGrid);
        vUvOffset = vec2(bCol / uGrid, bRow / uGrid);
      }
    }
  `,
  fragmentShader: `
    uniform sampler2D uAtlas;
    uniform float uGrid;
    uniform float uTime;
    varying vec2 vUvOffset;
    varying float vAlpha;
    varying float vCollapse;

    void main() {
      vec2 uv = gl_PointCoord;
      // flip Y for correct glyph orientation
      uv.y = 1.0 - uv.y;
      // map to atlas cell
      vec2 atlasUV = vUvOffset + uv / uGrid;
      vec4 tex = texture2D(uAtlas, atlasUV);

      // soft circular mask
      vec2 d = gl_PointCoord - 0.5;
      float circle = 1.0 - smoothstep(0.3, 0.5, length(d));

      float alpha = tex.a * vAlpha * circle;
      if (alpha < 0.01) discard;

      // color: cream/warm white for letters, cold blue-white for binary during collapse
      vec3 creamInk = vec3(0.94, 0.92, 0.85);   // warm cream
      vec3 binaryBlue = vec3(0.7, 0.82, 0.95);  // cold digital
      vec3 ghostGreen = vec3(0.75, 0.88, 0.72); // leaf hint

      // mix based on collapse
      vec3 col = mix(creamInk, binaryBlue, vCollapse * 0.7);
      // slight green tint for variety
      col = mix(col, ghostGreen, sin(uTime * 0.2 + vUvOffset.x * 20.0) * 0.15 + 0.05);

      gl_FragColor = vec4(col * alpha, alpha);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ─── subtle background atmosphere: faint vertical gradient plane ───
const bgGeom = new THREE.PlaneGeometry(80, 60);
const bgMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vUv;
    void main(){
      float g = smoothstep(0.0, 1.0, vUv.y);
      vec3 deep = vec3(0.02, 0.02, 0.04);
      vec3 top = vec3(0.06, 0.05, 0.03);
      vec3 col = mix(deep, top, g);
      gl_FragColor = vec4(col, 0.4);
    }
  `
});
const bgPlane = new THREE.Mesh(bgGeom, bgMat);
bgPlane.position.z = -20;
scene.add(bgPlane);

// ─── dust motes for atmosphere ───
const dustN = 800;
const dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) {
  dustPos[i*3]   = (Math.random()-0.5) * 40;
  dustPos[i*3+1] = (Math.random()-0.5) * 30;
  dustPos[i*3+2] = (Math.random()-0.5) * 30;
}
const dustGeom = new THREE.BufferGeometry();
dustGeom.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({
  size: 0.08, color: 0xd8d0c0, transparent: true, opacity: 0.15,
  blending: THREE.AdditiveBlending, depthWrite: false
});
scene.add(new THREE.Points(dustGeom, dustMat));

// ─── animation ───
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  // camera: gentle vertical drift + slow lateral sway (not rotation!)
  const camY = 2 + Math.sin(t * 0.12) * 3;
  const camX = Math.sin(t * 0.07) * 8;
  const camZ = 26 + Math.cos(t * 0.09) * 4;
  camera.position.set(camX, camY, camZ);
  camera.lookAt(0, camY * 0.3, 0);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
