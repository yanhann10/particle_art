<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Web · MillenniumTNG filament structure</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">u0f</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// MillenniumTNG cosmic web: Voronoi-edge filaments + cluster nodes
// at hundreds-of-Mpc scale. Particles drift along edges toward vertices (infall).
// Sparse foam topology — the voids are the primary material.

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.004);

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 1, 800);
camera.position.set(80, 60, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 0, 0);

// ─────────── Voronoi cell generation (Poisson sphere distribution)
const CUBE_SIZE = 160;
const N_CELLS = 200;
const cells = [];

function poissonDist(n, minDist, bounds) {
  const points = [];
  const k = 30;
  const active = [];
  const grid = new Map();
  const cellSize = minDist / Math.sqrt(3);
  
  function gridKey(p) {
    return Math.floor(p.x/cellSize)+','+Math.floor(p.y/cellSize)+','+Math.floor(p.z/cellSize);
  }
  function nearGrid(p) {
    const out = [];
    const cx = Math.floor(p.x/cellSize), cy = Math.floor(p.y/cellSize), cz = Math.floor(p.z/cellSize);
    for (let dx=-2; dx<=2; dx++) for (let dy=-2; dy<=2; dy++) for (let dz=-2; dz<=2; dz++) {
      const k = (cx+dx)+','+(cy+dy)+','+(cz+dz);
      if (grid.has(k)) out.push(...grid.get(k));
    }
    return out;
  }
  
  const first = { x: (Math.random()-0.5)*bounds, y: (Math.random()-0.5)*bounds, z: (Math.random()-0.5)*bounds };
  points.push(first);
  active.push(first);
  const k1 = gridKey(first);
  grid.set(k1, [first]);
  
  while (active.length > 0 && points.length < n) {
    const idx = Math.floor(Math.random() * active.length);
    const p = active[idx];
    let found = false;
    for (let i=0; i<k; i++) {
      const angle1 = Math.random() * Math.PI * 2;
      const angle2 = Math.acos(2*Math.random()-1);
      const r = minDist * (1 + Math.random());
      const candidate = {
        x: p.x + r * Math.sin(angle2) * Math.cos(angle1),
        y: p.y + r * Math.sin(angle2) * Math.sin(angle1),
        z: p.z + r * Math.cos(angle2)
      };
      if (Math.abs(candidate.x) > bounds/2 || Math.abs(candidate.y) > bounds/2 || Math.abs(candidate.z) > bounds/2) continue;
      const near = nearGrid(candidate);
      let valid = true;
      for (const np of near) {
        const dx = candidate.x - np.x, dy = candidate.y - np.y, dz = candidate.z - np.z;
        if (dx*dx + dy*dy + dz*dz < minDist*minDist) { valid = false; break; }
      }
      if (valid) {
        points.push(candidate);
        active.push(candidate);
        const ck = gridKey(candidate);
        if (!grid.has(ck)) grid.set(ck, []);
        grid.get(ck).push(candidate);
        found = true;
        break;
      }
    }
    if (!found) active.splice(idx, 1);
  }
  return points;
}

const rawCells = poissonDist(N_CELLS, 20, CUBE_SIZE);
for (const c of rawCells) cells.push(new THREE.Vector3(c.x, c.y, c.z));

// ─────────── Voronoi edge connectivity (Delaunay dual ~ nearest 6-10 neighbors)
const edges = [];
const edgeSet = new Set();
for (let i=0; i<cells.length; i++) {
  const distances = [];
  for (let j=0; j<cells.length; j++) {
    if (i === j) continue;
    distances.push({ idx: j, d: cells[i].distanceTo(cells[j]) });
  }
  distances.sort((a,b) => a.d - b.d);
  const nConnect = 6 + Math.floor(Math.random()*4);
  for (let k=0; k<Math.min(nConnect, distances.length); k++) {
    const j = distances[k].idx;
    const key = i < j ? i+','+j : j+','+i;
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      edges.push({ a: i, b: j });
    }
  }
}

// ─────────── Particle placement along Voronoi edges
const N_PARTICLES = 50000;
const positions = new Float32Array(N_PARTICLES * 3);
const colors = new Float32Array(N_PARTICLES * 3);
const velocities = new Float32Array(N_PARTICLES * 3);
const edgeAssignment = new Uint16Array(N_PARTICLES);

for (let i=0; i<N_PARTICLES; i++) {
  const edge = edges[Math.floor(Math.random() * edges.length)];
  const a = cells[edge.a], b = cells[edge.b];
  
  // position along edge with Gaussian falloff perpendicular
  const t = Math.random();
  const base = new THREE.Vector3().lerpVectors(a, b, t);
  const tangent = new THREE.Vector3().subVectors(b, a).normalize();
  const perp1 = new THREE.Vector3(tangent.y, -tangent.x, 0).normalize();
  if (perp1.lengthSq() < 0.01) perp1.set(0, tangent.z, -tangent.y).normalize();
  const perp2 = new THREE.Vector3().crossVectors(tangent, perp1).normalize();
  
  const sigma = 0.8;
  const r = Math.abs(Math.random() + Math.random() - 1) * sigma;
  const theta = Math.random() * Math.PI * 2;
  
  positions[i*3]   = base.x + perp1.x * r * Math.cos(theta) + perp2.x * r * Math.sin(theta);
  positions[i*3+1] = base.y + perp1.y * r * Math.cos(theta) + perp2.y * r * Math.sin(theta);
  positions[i*3+2] = base.z + perp1.z * r * Math.cos(theta) + perp2.z * r * Math.sin(theta);
  
  // distance to nearest vertex
  const distA = Math.hypot(positions[i*3]-a.x, positions[i*3+1]-a.y, positions[i*3+2]-a.z);
  const distB = Math.hypot(positions[i*3]-b.x, positions[i*3+1]-b.y, positions[i*3+2]-b.z);
  const minDist = Math.min(distA, distB);
  
  // color: hot near vertices (clusters), cool mid-filament
  const edgeLen = a.distanceTo(b);
  const normDist = minDist / edgeLen;
  let hue, sat, val;
  if (normDist < 0.15) {
    // cluster node — magenta/pink
    hue = 320 + Math.random()*20;
    sat = 0.7 + Math.random()*0.2;
    val = 0.9 + Math.random()*0.1;
  } else {
    // filament — golden-orange fading to blue
    const u = Math.min(normDist / 0.5, 1);
    hue = 35 * (1-u) + 200 * u;
    sat = 0.6;
    val = 0.4 + 0.3 * (1-u);
  }
  const c = new THREE.Color().setHSL(hue/360, sat, val);
  colors[i*3]   = c.r;
  colors[i*3+1] = c.g;
  colors[i*3+2] = c.b;
  
  edgeAssignment[i] = edges.indexOf(edge);
  
  // initial velocity: drift toward nearest vertex (infall)
  const target = distA < distB ? a : b;
  const dx = target.x - positions[i*3];
  const dy = target.y - positions[i*3+1];
  const dz = target.z - positions[i*3+2];
  const d = Math.hypot(dx, dy, dz) + 0.01;
  const speed = 0.012;
  velocities[i*3]   = (dx/d) * speed;
  velocities[i*3+1] = (dy/d) * speed;
  velocities[i*3+2] = (dz/d) * speed;
}

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.3,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 0.85,
  depthWrite: false,
  sizeAttenuation: true
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ─────────── Cluster nodes (bright spheres at vertices)
const clusterGeo = new THREE.SphereGeometry(1.2, 8, 6);
const clusterMat = new THREE.MeshBasicMaterial({
  color: 0xff88cc,
  transparent: true,
  opacity: 0.7,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const clusterMesh = new THREE.InstancedMesh(clusterGeo, clusterMat, cells.length);
const dummy = new THREE.Object3D();
for (let i=0; i<cells.length; i++) {
  dummy.position.copy(cells[i]);
  dummy.updateMatrix();
  clusterMesh.setMatrixAt(i, dummy.matrix);
}
scene.add(clusterMesh);

// ─────────── Animation: drift along edges toward nearest vertex
function animate() {
  for (let i=0; i<N_PARTICLES; i++) {
    positions[i*3]   += velocities[i*3];
    positions[i*3+1] += velocities[i*3+1];
    positions[i*3+2] += velocities[i*3+2];
    
    // if particle reaches vertex, respawn at random point on same edge
    const eIdx = edgeAssignment[i];
    if (eIdx >= edges.length) continue;
    const edge = edges[eIdx];
    const a = cells[edge.a], b = cells[edge.b];
    const distA = Math.hypot(positions[i*3]-a.x, positions[i*3+1]-a.y, positions[i*3+2]-a.z);
    const distB = Math.hypot(positions[i*3]-b.x, positions[i*3+1]-b.y, positions[i*3+2]-b.z);
    
    if (distA < 2.5 || distB < 2.5) {
      const t = 0.2 + Math.random()*0.6;
      const base = new THREE.Vector3().lerpVectors(a, b, t);
      const tangent = new THREE.Vector3().subVectors(b, a).normalize();
      const perp1 = new THREE.Vector3(tangent.y, -tangent.x, 0).normalize();
      if (perp1.lengthSq() < 0.01) perp1.set(0, tangent.z, -tangent.y).normalize();
      const perp2 = new THREE.Vector3().crossVectors(tangent, perp1).normalize();
      const sigma = 0.8;
      const r = Math.abs(Math.random() + Math.random() - 1) * sigma;
      const theta = Math.random() * Math.PI * 2;
      positions[i*3]   = base.x + perp1.x * r * Math.cos(theta) + perp2.x * r * Math.sin(theta);
      positions[i*3+1] = base.y + perp1.y * r * Math.cos(theta) + perp2.y * r * Math.sin(theta);
      positions[i*3+2] = base.z + perp1.z * r * Math.cos(theta) + perp2.z * r * Math.sin(theta);
      
      const distA2 = Math.hypot(positions[i*3]-a.x, positions[i*3+1]-a.y, positions[i*3+2]-a.z);
      const distB2 = Math.hypot(positions[i*3]-b.x, positions[i*3+1]-b.y, positions[i*3+2]-b.z);
      const target = distA2 < distB2 ? a : b;
      const dx = target.x - positions[i*3];
      const dy = target.y - positions[i*3+1];
      const dz = target.z - positions[i*3+2];
      const d = Math.hypot(dx, dy, dz) + 0.01;
      const speed = 0.012;
      velocities[i*3]   = (dx/d) * speed;
      velocities[i*3+1] = (dy/d) * speed;
      velocities[i*3+2] = (dz/d) * speed;
    }
  }
  geom.attributes.position.needsUpdate = true;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function loop() {
  animate();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
