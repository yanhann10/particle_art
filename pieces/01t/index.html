<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01t · tender scaffold</title>
<!-- MOTION: assembly, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#1a1614; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; }
  .stat { position:fixed; right:14px; bottom:12px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">01t</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">CNDSD & Ivan Abreu · tender scaffold assembly · leaf-as-cube</div>
<div class="stat" id="stat">blocks=0</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Tender scaffold — informal housing as differential growth.
   CNDSD/Abreu AUTO{}Construccion meets Gonzalez-Torres intimacy:
   cube-leaves assembling a paired dwelling, gentle rhythmic collapse + rebuild.
   Each cube is a leaf in a domestic architecture grammar. */

const BG = 0x1a1614;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(BG, 0.018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(18, 12, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 3, 0);

// palette: Gonzalez-Torres warm pastels meet construction site
const CINDER    = new THREE.Color(0x8c8882); // warm concrete
const REBAR     = new THREE.Color(0xa68f7a); // oxidized steel
const SOFT_PINK = new THREE.Color(0xd4b5a6); // faded brick
const AMBER     = new THREE.Color(0xe8c4a0); // incandescent warmth

// L-system grammar for paired dwelling (two adjacent rooms)
// axiom: F (foundation)
// rules: F → F[+R][-R]W  (fork two rooms, add wall)
//        R → RR[+W]      (room grows, sprouts wall)
//        W → W           (wall stays)
// interpretation: F/R = build vertically, +/- = branch left/right, W = horizontal infill

class Block {
  constructor(x, y, z, type, age = 0) {
    this.x = x; this.y = y; this.z = z;
    this.type = type; // 'foundation', 'room', 'wall'
    this.age = age;
    this.falling = false;
    this.vy = 0;
    this.birthTime = 0;
  }
}

const GRID_SIZE = 0.8;
const blocks = [];
const occupied = new Set();

function key(x, y, z) {
  return `${Math.round(x / GRID_SIZE)},${Math.round(y / GRID_SIZE)},${Math.round(z / GRID_SIZE)}`;
}

function canPlace(x, y, z) {
  return !occupied.has(key(x, y, z));
}

function place(b) {
  blocks.push(b);
  occupied.add(key(b.x, b.y, b.z));
}

// seed: two foundation blocks side by side (paired dwelling)
place(new Block(-GRID_SIZE * 2, 0, 0, 'foundation'));
place(new Block(GRID_SIZE * 2, 0, 0, 'foundation'));

// growth state machine
let growthStack = [
  { x: -GRID_SIZE * 2, y: 0, z: 0, dir: 0, symbol: 'F', depth: 0 },
  { x: GRID_SIZE * 2, y: 0, z: 0, dir: 0, symbol: 'F', depth: 0 }
];

const MAX_DEPTH = 6;
const GROWTH_RATE = 2; // steps per frame when growing

function growStep() {
  if (growthStack.length === 0) return false;
  
  const frame = growthStack.shift();
  const { x, y, z, dir, symbol, depth } = frame;
  
  if (depth >= MAX_DEPTH) return true;
  
  // L-system expansion
  if (symbol === 'F') {
    // F → F[+R][-R]W
    // main stem up
    const ny = y + GRID_SIZE;
    if (canPlace(x, ny, z)) {
      place(new Block(x, ny, z, 'foundation', depth * 0.15));
      growthStack.push({ x, y: ny, z, dir, symbol: 'F', depth: depth + 1 });
    }
    // branch left
    const lx = x - GRID_SIZE * 1.5;
    if (canPlace(lx, y, z)) {
      place(new Block(lx, y, z, 'room', depth * 0.15));
      growthStack.push({ x: lx, y, z, dir: -1, symbol: 'R', depth: depth + 1 });
    }
    // branch right
    const rx = x + GRID_SIZE * 1.5;
    if (canPlace(rx, y, z)) {
      place(new Block(rx, y, z, 'room', depth * 0.15));
      growthStack.push({ x: rx, y, z, dir: 1, symbol: 'R', depth: depth + 1 });
    }
    // wall infill
    const wz = z + GRID_SIZE * (Math.random() < 0.5 ? 1 : -1);
    if (canPlace(x, y, wz)) {
      place(new Block(x, y, wz, 'wall', depth * 0.15));
    }
  } else if (symbol === 'R') {
    // R → RR[+W]
    const ny = y + GRID_SIZE;
    if (canPlace(x, ny, z)) {
      place(new Block(x, ny, z, 'room', depth * 0.15));
      growthStack.push({ x, y: ny, z, dir, symbol: 'R', depth: depth + 1 });
    }
    const ny2 = y + GRID_SIZE * 2;
    if (canPlace(x, ny2, z)) {
      place(new Block(x, ny2, z, 'room', depth * 0.15));
    }
    // wall
    const wx = x + dir * GRID_SIZE;
    if (canPlace(wx, y, z)) {
      place(new Block(wx, y, z, 'wall', depth * 0.15));
    }
  }
  
  return true;
}

// collapse rhythm: gentle downbeat every 8 seconds
let lastCollapseTime = 0;
const COLLAPSE_INTERVAL = 8000;

function triggerCollapse() {
  // select 20% of upper blocks to fall
  const candidates = blocks.filter(b => b.y > GRID_SIZE * 3 && !b.falling);
  const toFall = Math.floor(candidates.length * 0.2);
  for (let i = 0; i < toFall; i++) {
    const idx = Math.floor(Math.random() * candidates.length);
    candidates[idx].falling = true;
    candidates[idx].vy = 0;
    candidates.splice(idx, 1);
  }
}

// instanced cube rendering — 40k particles as cube-leaves
const N_PARTICLES = 40000;
const cubeGeo = new THREE.BoxGeometry(GRID_SIZE * 0.88, GRID_SIZE * 0.88, GRID_SIZE * 0.88);
const instancedMesh = new THREE.InstancedMesh(
  cubeGeo,
  new THREE.MeshStandardMaterial({
    roughness: 0.85,
    metalness: 0.15,
    transparent: true
  }),
  N_PARTICLES
);
instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(instancedMesh);

const dummy = new THREE.Object3D();
const matrix = new THREE.Matrix4();

// lighting: soft warm fill + directional for depth
const ambientLight = new THREE.AmbientLight(0xfff8f0, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 0.6);
dirLight.position.set(5, 12, 8);
scene.add(dirLight);
const fillLight = new THREE.PointLight(AMBER.getHex(), 0.3, 50);
fillLight.position.set(-8, 4, 6);
scene.add(fillLight);

// ground plane — faint grid
const gridHelper = new THREE.GridHelper(40, 40, 0x3a3430, 0x2a2420);
gridHelper.material.transparent = true;
gridHelper.material.opacity = 0.15;
scene.add(gridHelper);

let paused = false;
addEventListener('click', () => { paused = !paused; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const statEl = document.getElementById('stat');
const startTime = performance.now();

function loop(now) {
  const elapsed = now - startTime;
  
  if (!paused) {
    // growth phase
    for (let g = 0; g < GROWTH_RATE; g++) {
      if (!growStep()) break;
    }
    
    // collapse rhythm
    if (elapsed - lastCollapseTime > COLLAPSE_INTERVAL) {
      triggerCollapse();
      lastCollapseTime = elapsed;
      // rebuild: re-seed growth stack from foundation blocks
      const foundations = blocks.filter(b => b.type === 'foundation' && b.y === 0);
      if (foundations.length > 0) {
        growthStack = foundations.map(f => ({
          x: f.x, y: f.y, z: f.z, dir: 0, symbol: 'F', depth: 0
        }));
      }
    }
    
    // physics: falling blocks
    for (const b of blocks) {
      if (b.falling) {
        b.vy -= 0.012; // gentle gravity
        b.y += b.vy;
        if (b.y < -10) {
          // remove fallen block
          occupied.delete(key(b.x, b.y, b.z));
          blocks.splice(blocks.indexOf(b), 1);
        }
      }
    }
  }
  
  // camera tracks centroid
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (const b of blocks) {
    if (!b.falling) {
      cx += b.x; cy += b.y; cz += b.z; count++;
    }
  }
  if (count > 0) {
    cx /= count; cy /= count; cz /= count;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
  }
  
  // render blocks as instanced cubes
  let idx = 0;
  for (const b of blocks) {
    if (idx >= N_PARTICLES) break;
    
    dummy.position.set(b.x, b.y, b.z);
    
    // gentle pulse per block
    const pulse = 0.96 + 0.04 * Math.sin(elapsed * 0.002 + b.x + b.y);
    dummy.scale.setScalar(pulse);
    
    // slight rotation for variation
    dummy.rotation.y = b.age * 0.3 + b.x * 0.1;
    
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(idx, dummy.matrix);
    
    // color by type + age
    let col = CINDER;
    if (b.type === 'room') col = SOFT_PINK;
    else if (b.type === 'wall') col = REBAR;
    col = col.clone().lerp(AMBER, b.age * 0.3);
    
    // falling blocks fade
    const alpha = b.falling ? Math.max(0, 1 - (-b.y / 10)) : 1;
    instancedMesh.setColorAt(idx, col);
    
    idx++;
  }
  
  instancedMesh.count = idx;
  instancedMesh.instanceMatrix.needsUpdate = true;
  if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
  
  const nextCollapse = Math.max(0, COLLAPSE_INTERVAL - (elapsed - lastCollapseTime));
  statEl.textContent = `blocks=${blocks.length} · next collapse: ${(nextCollapse / 1000).toFixed(1)}s${paused ? ' · paused' : ''}`;
  
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// pre-grow
for (let i = 0; i < 120; i++) {
  for (let g = 0; g < GROWTH_RATE; g++) {
    if (!growStep()) break;
  }
}

loop(performance.now());
</script>
</body>
</html>
