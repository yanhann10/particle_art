<!-- MOTION: drift, intensity: gentle -->
<title>xn7 · cumulus tenderness</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#090807; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; z-index:10; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; z-index:10; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size:10px; letter-spacing:0.04em; z-index:10; }
</style>

<body>
<div class="id">xn7</div>
<div class="hint">drag to orbit · click to pause/resume</div>
<div class="src">Gonzalez-Torres × MORAKANA · paired clouds · invisible border</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*  Two paired differential-growth curves — Felix Gonzalez-Torres'
    absent lovers as drifting cloud-masses. They drape and fold like
    light strings but read as cumulus weather. An invisible vertical
    boundary bisects the space (MORAKANA's geopolitical line); particles
    that cross it shift from bone-warm to oxidized rose. Slowness,
    intimacy, atmosphere. Data-as-weather, not data-as-chart. */

const BG = 0x090807;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 250);
camera.position.set(0, 1, 24);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(BG, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.target.set(0, -0.5, 0);

// --- two paired curves ---
const MAX_VERTS = 1800;
const ATTRACT   = 0.045;
const REPEL_R   = 0.52;
const REPEL_STR = 0.09;
const NOISE     = 0.0018;
const PRESSURE  = 0.0015;
const GRAVITY   = 0.006;
const MAX_D     = 0.38;
const ANCHOR_N  = 5;
const DRIFT_SPD = 0.0003; // slow eastward drift

function makeCurve(offsetX, offsetY) {
  const vs = [];
  const NV0 = 36;
  for (let i = 0; i < NV0; i++) {
    const t = (i / (NV0 - 1)) * 2 - 1;
    const x = t * 5 + offsetX;
    const y = -Math.abs(t) * 0.9 + Math.sin(t * Math.PI * 1.8) * 0.25 + offsetY;
    vs.push({
      x, z: 0, y, age: 0,
      pinY: i < ANCHOR_N || i >= NV0 - ANCHOR_N
    });
  }
  return vs;
}

const curveA = makeCurve(-1.5, 0.8);   // left/upper — "you"
const curveB = makeCurve(1.5, -0.4);   // right/lower — "me"
const curves = [curveA, curveB];

// spatial hash per curve
const CELL = REPEL_R;
function gridKey(x, z) { return ((x / CELL) | 0) + ',' + ((z / CELL) | 0); }

function rebuildGrid(vs) {
  const g = new Map();
  for (let i = 0; i < vs.length; i++) {
    const k = gridKey(vs[i].x, vs[i].z);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(i);
  }
  return g;
}
function nearby(g, v) {
  const cx = (v.x / CELL) | 0, cz = (v.z / CELL) | 0;
  const out = [];
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
    const arr = g.get((cx + dx) + ',' + (cz + dz));
    if (arr) for (const idx of arr) out.push(idx);
  }
  return out;
}

let paused = false;
addEventListener('click', () => { paused = !paused; });

function stepCurve(vs) {
  const n = vs.length;
  if (n >= MAX_VERTS) return;
  const g = rebuildGrid(vs);
  const dx = new Float32Array(n);
  const dz = new Float32Array(n);
  const dy = new Float32Array(n);

  for (let i = 0; i < n; i++) {
    const v = vs[i];
    for (const j of nearby(g, v)) {
      if (j === i) continue;
      const u = vs[j];
      const ex = v.x - u.x, ez = v.z - u.z;
      const d2 = ex * ex + ez * ez;
      if (d2 > REPEL_R * REPEL_R || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const f = REPEL_STR * (1 - d / REPEL_R) / d;
      dx[i] += ex * f;
      dz[i] += ez * f;
    }
  }
  for (let i = 0; i < n; i++) {
    const prev = i > 0 ? vs[i - 1] : null;
    const next = i < n - 1 ? vs[i + 1] : null;
    const v = vs[i];
    if (prev) {
      dx[i] += (prev.x - v.x) * ATTRACT;
      dz[i] += (prev.z - v.z) * ATTRACT;
      dy[i] += (prev.y - v.y) * ATTRACT;
    }
    if (next) {
      dx[i] += (next.x - v.x) * ATTRACT;
      dz[i] += (next.z - v.z) * ATTRACT;
      dy[i] += (next.y - v.y) * ATTRACT;
    }
  }
  let cx = 0, cz = 0;
  for (let i = 0; i < n; i++) { cx += vs[i].x; cz += vs[i].z; }
  cx /= n; cz /= n;
  for (let i = 0; i < n; i++) {
    const ox = vs[i].x - cx, oz = vs[i].z - cz;
    const d = Math.hypot(ox, oz) + 1e-6;
    dx[i] += (ox / d) * PRESSURE;
    dz[i] += (oz / d) * PRESSURE;
  }
  for (let i = 0; i < n; i++) {
    vs[i].x += dx[i] + (Math.random() - 0.5) * NOISE + DRIFT_SPD;
    vs[i].z += dz[i] + (Math.random() - 0.5) * NOISE;
    const grav = vs[i].pinY ? GRAVITY * 0.04 : GRAVITY;
    vs[i].y += dy[i] - grav + (Math.random() - 0.5) * NOISE * 0.4;
    vs[i].age += 0.0003;
  }
  // subdivide
  const grown = [];
  for (let i = 0; i < n - 1; i++) {
    const a = vs[i], b = vs[i + 1];
    grown.push(a);
    const ex = b.x - a.x, ez = b.z - a.z, ey = b.y - a.y;
    if (ex * ex + ez * ez + ey * ey > MAX_D * MAX_D && vs.length + grown.length < MAX_VERTS) {
      grown.push({
        x: (a.x + b.x) * 0.5 + (Math.random() - 0.5) * 0.02,
        z: (a.z + b.z) * 0.5 + (Math.random() - 0.5) * 0.02,
        y: (a.y + b.y) * 0.5,
        age: Math.max(a.age, b.age) * 0.65,
        pinY: false
      });
    }
  }
  grown.push(vs[n - 1]);
  vs.length = 0;
  for (const v of grown) vs.push(v);
}

// --- particles: 40k as soft cloud sprites ---
const N_RENDER = 40000;
const N_PER_CURVE = N_RENDER / 2;
const rPos   = new Float32Array(N_RENDER * 3);
const rSeeds = new Float32Array(N_RENDER);
const rCross = new Float32Array(N_RENDER); // how far across the border

for (let i = 0; i < N_RENDER; i++) rSeeds[i] = Math.random();

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
geom.setAttribute('seed',     new THREE.BufferAttribute(rSeeds, 1));
geom.setAttribute('cross',    new THREE.BufferAttribute(rCross, 1));

const BORDER_X = 0.0; // the invisible line

const uniforms = {
  uTime:       { value: 0 },
  uPixel:      { value: renderer.getPixelRatio() },
  uBorderX:    { value: BORDER_X },
  uFogColor:   { value: new THREE.Color(BG) },
  uFogDensity: { value: 0.028 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uBorderX;
    uniform float uFogDensity;
    attribute float seed;
    attribute float cross;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;

    void main() {
      vec3 p = position;

      // slow atmospheric sway
      float t = uTime * 0.15 + seed * 6.28;
      p.x += sin(t) * 0.012 * (0.5 + seed);
      p.y += cos(t * 0.6 + seed * 3.0) * 0.006;
      p.z += sin(t * 0.4 + seed * 5.0) * 0.008;

      // soft pulse
      float pulse = 0.88 + 0.12 * sin(uTime * 0.6 + seed * 30.0);

      // palette: bone-warm → oxidized rose at border crossing
      // bone/dust side (FGT warmth)
      vec3 bone    = vec3(0.95, 0.88, 0.78);
      vec3 dust    = vec3(0.82, 0.74, 0.64);
      vec3 warmW   = vec3(1.0, 0.93, 0.84);
      // oxidized rose (MORAKANA border tint) — kept soft, not aggressive
      vec3 rose    = vec3(0.78, 0.42, 0.36);
      vec3 deepR   = vec3(0.62, 0.28, 0.24);

      float k = clamp(cross, 0.0, 1.0);
      // bone side
      vec3 baseCol = mix(bone, dust, seed);
      baseCol = mix(baseCol, warmW, smoothstep(0.6, 1.0, seed) * 0.25);
      // border crossing tint
      vec3 crossCol = mix(rose, deepR, seed * 0.5);
      vCol = mix(baseCol, crossCol, k * k);
      vCol *= pulse;

      vAlpha = mix(0.32, 0.18, k) + 0.08 * pulse;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;

      // larger softer sprites for cloud feel
      gl_PointSize = (2.2 + seed * 0.8) * uPixel * (50.0 / dist);
      gl_Position = projectionMatrix * mv;

      float fogDepth = length(mv.xyz);
      vFogFactor = 1.0 - exp(-uFogDensity * uFogDensity * fogDepth * fogDepth);
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vFogFactor;
    uniform vec3 uFogColor;

    void main() {
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;

      // very soft cloud falloff
      float core = exp(-r * 16.0);
      float halo = exp(-r * 5.0) * 0.4;
      float a = (core + halo) * vAlpha;

      vec3 col = vCol;
      col = mix(col, uFogColor, vFogFactor);
      a *= (1.0 - vFogFactor * 0.85);

      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// faint wire for each curve — almost invisible, like a contrail
const wires = curves.map(() => {
  const wg = new THREE.BufferGeometry();
  const wp = new Float32Array(MAX_VERTS * 3);
  wg.setAttribute('position', new THREE.BufferAttribute(wp, 3));
  const wm = new THREE.LineBasicMaterial({
    color: 0x1e1a17, transparent: true, opacity: 0.18
  });
  const wl = new THREE.Line(wg, wm);
  scene.add(wl);
  return { geom: wg, pos: wp, line: wl };
});

// the invisible border — just a faint vertical line
const borderGeo = new THREE.BufferGeometry();
const bVerts = new Float32Array([
  BORDER_X, -15, -0.01,
  BORDER_X,  10, -0.01
]);
borderGeo.setAttribute('position', new THREE.BufferAttribute(bVerts, 3));
const borderMat = new THREE.LineBasicMaterial({
  color: 0x4a2020, transparent: true, opacity: 0.06
});
scene.add(new THREE.Line(borderGeo, borderMat));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pre-grow both curves
for (let s = 0; s < 400; s++) {
  stepCurve(curveA);
  stepCurve(curveB);
}

const start = performance.now();

function distributeParticles(vs, offset, count, t) {
  const n = vs.length;
  if (n < 2) return;
  const lengths = [];
  let total = 0;
  for (let i = 0; i < n - 1; i++) {
    const a = vs[i], b = vs[i + 1];
    const L = Math.sqrt((b.x-a.x)**2 + (b.z-a.z)**2 + (b.y-a.y)**2);
    lengths.push(L);
    total += L;
  }
  if (total === 0) return;
  let written = 0;
  for (let i = 0; i < n - 1; i++) {
    const share = (i === n - 2)
      ? count - written
      : Math.max(1, Math.floor(count * lengths[i] / total));
    const a = vs[i], b = vs[i + 1];
    for (let k = 0; k < share && written < count; k++) {
      const u = Math.random();
      const idx = offset + written;
      // cloud-like spread — wider than light strings
      const spread = 0.09 + rSeeds[idx] * 0.06;
      const spreadY = 0.06;
      rPos[idx * 3]     = a.x + (b.x - a.x) * u + (Math.random() - 0.5) * spread;
      rPos[idx * 3 + 1] = a.y + (b.y - a.y) * u + (Math.random() - 0.5) * spreadY;
      rPos[idx * 3 + 2] = a.z + (b.z - a.z) * u + (Math.random() - 0.5) * spread;

      // border crossing amount: how far past BORDER_X
      const px = rPos[idx * 3];
      // curveA crosses rightward, curveB crosses leftward — both register crossing
      const crossDist = Math.abs(px - BORDER_X);
      const side = px > BORDER_X ? 1.0 : -1.0;
      // smooth ramp: particles within 1.5 units of border start tinting
      rCross[idx] = smoothClamp((crossDist - 0.3) / 2.5);
      written++;
    }
  }
}

function smoothClamp(x) {
  return Math.max(0, Math.min(1, x * x));
}

function loop() {
  const t = (performance.now() - start) / 1000;
  uniforms.uTime.value = t;

  if (!paused) {
    for (let s = 0; s < 2; s++) {
      stepCurve(curveA);
      stepCurve(curveB);
    }
  }

  // update wires
  curves.forEach((vs, ci) => {
    const w = wires[ci];
    for (let i = 0; i < vs.length; i++) {
      w.pos[i * 3]     = vs[i].x;
      w.pos[i * 3 + 1] = vs[i].y;
      w.pos[i * 3 + 2] = vs[i].z;
    }
    w.geom.setDrawRange(0, vs.length);
    w.geom.attributes.position.needsUpdate = true;
  });

  // camera tracks combined centroid
  let cx = 0, cy = 0, cz = 0, total = 0;
  for (const vs of curves) {
    for (const v of vs) {
      cx += v.x; cy += v.y; cz += v.z; total++;
    }
  }
  if (total > 0) {
    cx /= total; cy /= total; cz /= total;
    controls.target.lerp(new THREE.Vector3(cx, cy, cz), 0.015);
  }

  // distribute particles
  distributeParticles(curveA, 0, N_PER_CURVE, t);
  distributeParticles(curveB, N_PER_CURVE, N_PER_CURVE, t);
  geom.attributes.position.needsUpdate = true;
  geom.attributes.cross.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

<div id="gp-panel">

<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>
