<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>h4f · Shiota — Diary</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">h4f</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.0012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x050101, 0.003));
const warmL = new THREE.PointLight(0xff3818, 0.015, 50, 2.0);
warmL.position.set(0.5, 8, -1.5);
scene.add(warmL);

let seed = 4827193;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w:28, h:22, d:24 };
const hw=ROOM.w/2, hh=ROOM.h/2, hd=ROOM.d/2;

function wallPt(){
  const f=Math.floor(rng()*6);
  let x,y,z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x,y,z);
}

// ── ONE SPHERE — the diary, the remembered self, the still center
const sphereCenter = new THREE.Vector3(0.4, 0.8, 0.0);
const sphereR = 1.9;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf0e4d2, emissive: 0xf0e4d2, emissiveIntensity: 0.75,
  roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.32, fog: true
});
const sphereGeo = new THREE.SphereGeometry(sphereR, 24, 16);
const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

function surfPt(){
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=sphereR*(0.97+rng()*0.06);
  return new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r,
    sphereCenter.z+Math.cos(v)*r
  );
}

// ── DARK FRAGMENTS — charred diary pages, scraps of memory caught in thread
const fragments = [];
for(let i=0; i<18; i++){
  const fGeo = new THREE.BufferGeometry();
  const verts = [];
  const nPts = 3+Math.floor(rng()*4);
  const fSize = 0.04+rng()*0.12;
  for(let j=0; j<nPts; j++){
    verts.push((rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.2,
               (rng()-0.5)*fSize,(rng()-0.5)*fSize,(rng()-0.5)*fSize*0.2);
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts),3));
  const fMesh = new THREE.LineSegments(fGeo, new THREE.LineBasicMaterial({
    color:0x0a0806, transparent:true, opacity:0.35
  }));
  const u=rng()*Math.PI*2, v=Math.acos(2*rng()-1);
  const r=3.0+rng()*8.0;
  fMesh.position.set(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*r,
    sphereCenter.y+Math.sin(v)*Math.sin(u)*r*0.85,
    sphereCenter.z+Math.cos(v)*r
  );
  fMesh.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  fragments.push(fMesh);
  scene.add(fMesh);
}

// ── VOID ZONES — cylindrical negative space for the camera to breathe
const voids = [];
for(let i=0; i<3; i++){
  const a=(i/3)*Math.PI*2+rng()*0.9;
  const vr=4.5+rng()*3.0;
  voids.push({x:sphereCenter.x+Math.cos(a)*vr, z:sphereCenter.z+Math.sin(a)*vr, r:1.3+rng()*1.0});
}
function inVoid(p){
  for(const v of voids){ const dx=p.x-v.x, dz=p.z-v.z; if(dx*dx+dz*dz<v.r*v.r) return true; }
  return false;
}

// ── ANCHORS — icosahedral topology projected onto concentric shells
// Manfred Mohr: let geometry generate the topology, not random scatter
const anchors = [];
const icoGeo = new THREE.IcosahedronGeometry(1, 1);
const icoVerts = icoGeo.attributes.position;
const icoPoints = [];
for(let i=0; i<icoVerts.count; i++){
  const v = new THREE.Vector3(icoVerts.getX(i), icoVerts.getY(i), icoVerts.getZ(i)).normalize();
  let dup = false;
  for(const p of icoPoints){ if(p.distanceTo(v)<0.01){ dup=true; break; } }
  if(!dup) icoPoints.push(v);
}

const shells = [3.2, 5.0, 7.0, 9.5, 12.0];
for(const sr of shells){
  for(const ip of icoPoints){
    const jitter = 0.15+rng()*0.25;
    const pt = new THREE.Vector3(
      sphereCenter.x+ip.x*sr*(1+((rng()-0.5)*jitter)),
      sphereCenter.y+ip.y*sr*0.9*(1+((rng()-0.5)*jitter)),
      sphereCenter.z+ip.z*sr*(1+((rng()-0.5)*jitter))
    );
    if(!inVoid(pt) && Math.abs(pt.x)<hw && Math.abs(pt.y)<hh && Math.abs(pt.z)<hd){
      anchors.push(pt);
    }
  }
}
// Wall anchors
for(let i=0; i<60; i++){ const wp=wallPt(); if(!inVoid(wp)) anchors.push(wp); }
// Fragment positions as anchors
for(const f of fragments) anchors.push(f.position.clone());

// ── Angular quantization — Vera Molnar: order near the sphere, chaos at the walls
function quantAngle(pt){
  const d = pt.distanceTo(sphereCenter);
  if(d > 6.5) return pt;
  const strength = Math.max(0, 1.0-d/6.5);
  const quant = Math.PI/12;
  const dx=pt.x-sphereCenter.x, dy=pt.y-sphereCenter.y, dz=pt.z-sphereCenter.z;
  const theta = Math.atan2(dy, dx);
  const phi = Math.atan2(dz, Math.sqrt(dx*dx+dy*dy));
  const qTheta = Math.round(theta/quant)*quant;
  const qPhi = Math.round(phi/quant)*quant;
  const thetaF = theta*(1-strength*0.55)+qTheta*strength*0.55;
  const phiF = phi*(1-strength*0.55)+qPhi*strength*0.55;
  const r2d = Math.sqrt(dx*dx+dy*dy+dz*dz);
  return new THREE.Vector3(
    sphereCenter.x+Math.cos(thetaF)*Math.cos(phiF)*r2d,
    sphereCenter.y+Math.sin(thetaF)*Math.cos(phiF)*r2d,
    sphereCenter.z+Math.sin(phiF)*r2d
  );
}

// ── BUILD THREAD NETWORK — 20,000 segments
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
const lineDist = new Float32Array(NUM_LINES);
const lineCat = new Uint8Array(NUM_LINES);
let li = 0;

function setLine(a, b, cat){
  if(li>=NUM_LINES) return;
  if(inVoid(a)||inVoid(b)) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  lineDist[li] = Math.sqrt((mx-sphereCenter.x)**2+(my-sphereCenter.y)**2+(mz-sphereCenter.z)**2);
  lineCat[li] = cat;
  li++;
}

// ── SUSPENSION THREADS — ceiling to sphere top, making the hanging visible
for(let i=0; i<8; i++){
  const a=(i/8)*Math.PI*2+(rng()-0.5)*0.15;
  const topR=0.06+rng()*0.2;
  const top = new THREE.Vector3(sphereCenter.x+Math.cos(a)*topR, hh, sphereCenter.z+Math.sin(a)*topR);
  const bot = new THREE.Vector3(
    sphereCenter.x+Math.cos(a+rng()*0.03)*0.04,
    sphereCenter.y+sphereR+0.03,
    sphereCenter.z+Math.sin(a+rng()*0.03)*0.04
  );
  setLine(top, bot, 0);
}

// ── RULE 1: CONVERGENCE — 7,500 threads from volume toward the sphere
// The primary gesture: everything reaches toward the remembered center
for(let i=0; i<7500 && li<NUM_LINES; i++){
  const target = surfPt();
  let origin;
  if(rng()<0.35){ origin = anchors[Math.floor(rng()*anchors.length)]; }
  else { origin = wallPt(); }
  origin = quantAngle(origin);

  // 8% yearning threads — reach but don't arrive
  if(rng()<0.08){
    const dir = origin.clone().sub(target).normalize();
    const gap = 0.3+rng()*1.5;
    setLine(origin, target.clone().add(dir.multiplyScalar(gap)), 1);
  } else {
    setLine(origin, target, 0);
  }
}

// ── RULE 2: LATERAL WEB — anchor-to-nearest-anchor, proximity rule
// Casey Reas: let density emerge from proximity alone
const THRESH = 6.0;
let lateralCount=0, attempts=0;
while(lateralCount<5000 && li<NUM_LINES && attempts<50000){
  attempts++;
  const ai=Math.floor(rng()*anchors.length);
  const a=anchors[ai];
  let best=null, bestD=Infinity;
  for(let j=0; j<14; j++){
    const bi=Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d=a.distanceTo(anchors[bi]);
    if(d<bestD && d>0.3 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best, 2);
  lateralCount++;
}

// ── RADIAL CORONA — emanation outward from the sphere surface
for(let i=0; i<2000 && li<NUM_LINES; i++){
  const sp = surfPt();
  const radial = sp.clone().sub(sphereCenter).normalize();
  const len = 0.6+rng()*4.0;
  const dev = new THREE.Vector3((rng()-0.5)*0.08,(rng()-0.5)*0.08,(rng()-0.5)*0.08);
  const dir = radial.clone().add(dev).normalize();
  setLine(sp, sp.clone().add(dir.multiplyScalar(len)), 1);
}

// ── DENDRITIC CHAINS — branching growth from sphere, morphogenetic
// Andy Lomas: filaments propagate iteratively, 3 generations
for(let i=0; i<150 && li<NUM_LINES; i++){
  let pt = surfPt();
  const radial = pt.clone().sub(sphereCenter).normalize();
  const chainLen = 3+Math.floor(rng()*5);
  let prevDir = radial.clone();
  for(let c=0; c<chainLen && li<NUM_LINES; c++){
    const len = 0.25+rng()*0.6;
    const dev = new THREE.Vector3((rng()-0.5)*0.35,(rng()-0.5)*0.35,(rng()-0.5)*0.35);
    const dir = prevDir.clone().add(dev).normalize();
    const next = pt.clone().add(dir.multiplyScalar(len));
    setLine(pt, next, 1);
    // Y-fork at generation 1 or 2
    if((c===1||c===2) && rng()<0.4 && li<NUM_LINES){
      const fDev = new THREE.Vector3((rng()-0.5)*0.6,(rng()-0.5)*0.6,(rng()-0.5)*0.6);
      const fDir = prevDir.clone().add(fDev).normalize();
      const forkEnd = pt.clone().add(fDir.multiplyScalar(0.2+rng()*0.45));
      setLine(pt, forkEnd, 1);
    }
    pt=next; prevDir=dir;
  }
}

// ── GRAVITY THREADS — hanging from lower hemisphere
for(let i=0; i<700 && li<NUM_LINES; i++){
  const u=rng()*Math.PI*2;
  const v=Math.PI*0.5+rng()*Math.PI*0.5;
  const sp = new THREE.Vector3(
    sphereCenter.x+Math.sin(v)*Math.cos(u)*sphereR,
    sphereCenter.y+Math.cos(v)*sphereR,
    sphereCenter.z+Math.sin(v)*Math.sin(u)*sphereR
  );
  const dropLen = 1.0+rng()*4.5;
  const drift = (rng()-0.5)*0.35;
  setLine(sp, new THREE.Vector3(sp.x+drift, sp.y-dropLen, sp.z+(rng()-0.5)*0.25), 3);
}

// ── ASCENDING — floor threads rising into the web
for(let i=0; i<600 && li<NUM_LINES; i++){
  const a=rng()*Math.PI*2;
  const floorR = 1.0+rng()*9.0;
  const floorPt = new THREE.Vector3(sphereCenter.x+Math.cos(a)*floorR, -hh+rng()*0.15, sphereCenter.z+Math.sin(a)*floorR);
  let target;
  if(rng()<0.3){ target = surfPt(); }
  else {
    const midA=rng()*Math.PI*2, midR=2.0+rng()*5.0;
    target = new THREE.Vector3(sphereCenter.x+Math.cos(midA)*midR, sphereCenter.y+(rng()-0.5)*5.0, sphereCenter.z+Math.sin(midA)*midR);
  }
  setLine(floorPt, target, 3);
}

// ── FILL — wall-to-sphere/anchor spans for remaining budget
while(li<NUM_LINES){
  const a = wallPt();
  const b = rng()<0.4 ? surfPt() : anchors[Math.floor(rng()*anchors.length)];
  setLine(a, b, 3);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// ── COLOR — blood-red #c20018, single hue, depth through opacity
// Cat 0 convergence: strongest, cat 1 corona/yearning/dendritic: medium,
// cat 2 lateral: moderate, cat 3 gravity/ascending/fill: subtle
const colors = new Float32Array(li*6);
const bR=0xc2/255, bG=0x00/255, bB=0x18/255;
const catOpacity = [0.10, 0.07, 0.05, 0.035];

for(let i=0; i<li; i++){
  const d = lineDist[i];
  const distFade = Math.max(0.15, 1.0-d*0.035);
  const cat = lineCat[i];
  const baseOp = catOpacity[cat]*distFade;
  // Warm intensity near sphere
  const toCenter = Math.sqrt(
    (positions[i*6]-sphereCenter.x)**2+
    (positions[i*6+1]-sphereCenter.y)**2+
    (positions[i*6+2]-sphereCenter.z)**2
  );
  const warmShift = toCenter<5.0 ? 0.015*(1.0-toCenter/5.0) : 0.0;
  for(let v=0; v<2; v++){
    colors[i*6+v*3]   = (bR+warmShift)*baseOp;
    colors[i*6+v*3+1] = bG*baseOp;
    colors[i*6+v*3+2] = bB*baseOp*0.55;
  }
}
lineGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── CAMERA PATH — inside the web, intimate, drifting around the single center
// Narrative: begin below the sphere looking up through gravity threads,
// rise through convergence zone, orbit close, pull back to see the whole web,
// descend again — a cycle of approaching and retreating from memory
const pathLen = 2800;
const dollyPath = [];
for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  const cx=sphereCenter.x, cy=sphereCenter.y, cz=sphereCenter.z;
  let x, y, z, rH;

  if(t<0.12){
    // Below — looking up through gravity threads at the glowing sphere
    const lt=t/0.12;
    rH = 3.0+lt*1.0;
    x = cx+Math.sin(lt*Math.PI*0.3)*rH;
    y = cy-5.5+lt*4.0;
    z = cz+Math.cos(lt*Math.PI*0.3)*rH*0.8;
  } else if(t<0.28){
    // Rise through the convergence zone — threads streaming past
    const lt=(t-0.12)/0.16;
    rH = 4.0+Math.sin(lt*Math.PI)*1.5;
    x = cx+Math.sin(lt*Math.PI*0.9+0.5)*rH;
    y = cy-1.5+lt*5.5;
    z = cz+Math.cos(lt*Math.PI*0.9+0.5)*rH;
  } else if(t<0.42){
    // Close orbit — intimate distance, the sphere filling peripheral vision
    const lt=(t-0.28)/0.14;
    rH = 3.8;
    const angle = lt*Math.PI*1.3+1.8;
    x = cx+Math.sin(angle)*rH;
    y = cy+1.5+Math.sin(lt*Math.PI)*1.2;
    z = cz+Math.cos(angle)*rH;
  } else if(t<0.55){
    // Pull back and up — see the full web, architectural scale
    const lt=(t-0.42)/0.13;
    rH = 3.8+lt*4.5;
    x = cx+Math.sin(lt*Math.PI*0.7+3.5)*rH;
    y = cy+4.0+lt*3.5;
    z = cz+Math.cos(lt*Math.PI*0.7+3.5)*rH;
  } else if(t<0.68){
    // Drift through the lateral web zone — surrounded by thread
    const lt=(t-0.55)/0.13;
    rH = 7.5-lt*2.5;
    x = cx+Math.sin(lt*Math.PI*1.1+4.8)*rH;
    y = cy+7.5-lt*10.0;
    z = cz+Math.cos(lt*Math.PI*1.1+4.8)*rH;
  } else if(t<0.80){
    // Below again — the floor, ascending threads above
    const lt=(t-0.68)/0.12;
    rH = 5.5+lt*2.0;
    x = cx+Math.sin(lt*Math.PI*0.8+6.0)*rH;
    y = cy-4.5+lt*2.0;
    z = cz+Math.cos(lt*Math.PI*0.8+6.0)*rH;
  } else if(t<0.92){
    // Return close — approaching the sphere from the other side
    const lt=(t-0.80)/0.12;
    rH = 7.5-lt*4.0;
    x = cx+Math.sin(lt*Math.PI*0.6+7.2)*rH;
    y = cy-2.5+lt*3.5;
    z = cz+Math.cos(lt*Math.PI*0.6+7.2)*rH;
  } else {
    // Settle below — back where we started, the cycle repeats
    const lt=(t-0.92)/0.08;
    rH = 3.5-lt*0.5;
    x = cx+Math.sin(lt*Math.PI*0.2+0.2)*rH;
    y = cy-0.5-lt*5.0;
    z = cz+Math.cos(lt*Math.PI*0.2+0.2)*rH*0.9;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Thread micro-breathing — glacial, <0.5% length variation
  const arr = lineGeo.attributes.position.array;
  for(let i=0; i<li; i++){
    const idx=i*6;
    const dist = lineDist[i];
    const amp = 0.000025*Math.max(0, 1.0-dist/18.0);
    const phase = basePositions[idx]*0.03+basePositions[idx+1]*0.04+i*0.0001;
    const breath = Math.sin(elapsed*0.0015+phase)*amp;
    for(let v=0; v<2; v++){
      const vi=idx+v*3;
      arr[vi]   = basePositions[vi]   + breath*0.08;
      arr[vi+1] = basePositions[vi+1] + breath*0.06;
      arr[vi+2] = basePositions[vi+2] + breath*0.07;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Sphere glow — slow pulse, a heart beating in the dark
  sphereMat.emissiveIntensity = 0.75+Math.sin(elapsed*0.0004)*0.05;

  // Camera dolly
  const speed = 0.00005;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere with gentle sway
  const look = sphereCenter.clone();
  look.x += Math.sin(elapsed*0.00025)*0.06;
  look.y += Math.cos(elapsed*0.0002)*0.12;
  look.z += Math.sin(elapsed*0.0004+0.3)*0.05;
  camera.lookAt(look);

  warmL.intensity = 0.015+Math.sin(elapsed*0.00015)*0.002;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
