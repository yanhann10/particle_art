<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pn4 · boids murmuration depth-fog · Reynolds + DOF</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0b0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">pn4</div>
<div class="hint" id="hint">Reynolds 1986 · volumetric depth fog · atmospheric DOF</div>
<div class="src">Craig Reynolds · emergent behavior + depth cuing</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0b0f, 0.012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b0f, 1);
document.body.appendChild(renderer.domElement);

const N = 3200;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const trails = new Float32Array(N);

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 12;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);
  
  const vtheta = Math.random() * Math.PI * 2;
  const vphi = Math.acos(2 * Math.random() - 1);
  const speed = 0.8 + Math.random() * 0.4;
  velocities[i*3]   = speed * Math.sin(vphi) * Math.cos(vtheta);
  velocities[i*3+1] = speed * Math.sin(vphi) * Math.sin(vtheta);
  velocities[i*3+2] = speed * Math.cos(vphi);
  
  seeds[i] = Math.random();
  trails[i] = Math.random() * 0.3;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uCameraPos: { value: camera.position },
  uFogDensity: { value: 0.012 },
  uFogColor: { value: new THREE.Color(0x0d0b0f) },
  uDOFDistance: { value: 45.0 },
  uDOFRange: { value: 25.0 }
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform vec3 uCameraPos;
    uniform float uDOFDistance;
    uniform float uDOFRange;
    attribute float seed;
    attribute float trail;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vDepth;
    varying float vDOFBlur;
    
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.3;
      float pulse = 0.5 + 0.5 * sin(phase);
      
      // dawn murmurations palette
      vec3 c0 = vec3(0.22, 0.18, 0.38); // indigo
      vec3 c1 = vec3(0.78, 0.45, 0.52); // rose
      vec3 c2 = vec3(0.92, 0.76, 0.48); // gold
      float blend = smoothstep(0.3, 0.7, pulse);
      vCol = mix(c0, c1, blend);
      vCol = mix(vCol, c2, smoothstep(0.7, 1.0, pulse) * 0.6);
      
      vAlpha = 0.5 + 0.5 * pulse + trail * 0.4;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDepth = -mv.z;
      
      // DOF blur: particles far from focal distance get larger/softer
      float dofDelta = abs(vDepth - uDOFDistance);
      vDOFBlur = smoothstep(0.0, uDOFRange, dofDelta);
      
      float baseSize = 1.8 + 1.2*pulse + trail*2.0;
      float dofSize = baseSize * (1.0 + vDOFBlur * 2.5);
      gl_PointSize = dofSize * uPixel * (60.0/vDepth);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vDepth;
    varying float vDOFBlur;
    
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      
      // Softer falloff for DOF-blurred particles
      float falloff = mix(16.0, 6.0, vDOFBlur);
      float core = exp(-r * falloff);
      
      // Exponential fog based on depth
      float fogFactor = exp(-uFogDensity * vDepth);
      fogFactor = clamp(fogFactor, 0.0, 1.0);
      
      // DOF reduces alpha for out-of-focus particles
      float dofAlpha = mix(1.0, 0.3, vDOFBlur);
      
      float a = core * vAlpha * fogFactor * dofAlpha;
      vec3 finalCol = mix(uFogColor, vCol, fogFactor);
      
      gl_FragColor = vec4(finalCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('trail', new THREE.BufferAttribute(trails, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const PERCEPTION = 3.5;
const SEPARATION_DIST = 1.2;
const COHESION_FORCE = 0.02;
const ALIGNMENT_FORCE = 0.08;
const SEPARATION_FORCE = 0.15;
const BOUNDARY_FORCE = 0.25;
const MAX_SPEED = 1.8;
const MIN_SPEED = 0.6;
const BOUNDARY = 25;

const CELL_SIZE = PERCEPTION * 1.5;
let spatialGrid = new Map();

function getSpatialKey(x, y, z){
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  return `${cx},${cy},${cz}`;
}

function rebuildSpatialGrid(){
  spatialGrid.clear();
  for (let i = 0; i < N; i++){
    const key = getSpatialKey(positions[i*3], positions[i*3+1], positions[i*3+2]);
    if (!spatialGrid.has(key)) spatialGrid.set(key, []);
    spatialGrid.get(key).push(i);
  }
}

function getNeighborCells(x, y, z){
  const cells = [];
  const cx = Math.floor(x / CELL_SIZE);
  const cy = Math.floor(y / CELL_SIZE);
  const cz = Math.floor(z / CELL_SIZE);
  for (let dx = -1; dx <= 1; dx++){
    for (let dy = -1; dy <= 1; dy++){
      for (let dz = -1; dz <= 1; dz++){
        const key = `${cx+dx},${cy+dy},${cz+dz}`;
        if (spatialGrid.has(key)) cells.push(...spatialGrid.get(key));
      }
    }
  }
  return cells;
}

const tmpVec = new THREE.Vector3();
const avgVel = new THREE.Vector3();
const avgPos = new THREE.Vector3();
const steering = new THREE.Vector3();

let frameCount = 0;
const hintEl = document.getElementById('hint');

function updateBoids(dt){
  rebuildSpatialGrid();
  
  for (let i = 0; i < N; i++){
    const px = positions[i*3];
    const py = positions[i*3+1];
    const pz = positions[i*3+2];
    const vx = velocities[i*3];
    const vy = velocities[i*3+1];
    const vz = velocities[i*3+2];
    
    avgPos.set(0,0,0);
    avgVel.set(0,0,0);
    steering.set(0,0,0);
    let cohesionCount = 0;
    let alignmentCount = 0;
    
    const neighbors = getNeighborCells(px, py, pz);
    
    for (const j of neighbors){
      if (i === j) continue;
      const dx = positions[j*3] - px;
      const dy = positions[j*3+1] - py;
      const dz = positions[j*3+2] - pz;
      const distSq = dx*dx + dy*dy + dz*dz;
      
      if (distSq < PERCEPTION * PERCEPTION && distSq > 0.01){
        const dist = Math.sqrt(distSq);
        
        avgPos.x += positions[j*3];
        avgPos.y += positions[j*3+1];
        avgPos.z += positions[j*3+2];
        cohesionCount++;
        
        avgVel.x += velocities[j*3];
        avgVel.y += velocities[j*3+1];
        avgVel.z += velocities[j*3+2];
        alignmentCount++;
        
        if (dist < SEPARATION_DIST){
          const force = (SEPARATION_DIST - dist) / SEPARATION_DIST;
          steering.x -= (dx / dist) * force * SEPARATION_FORCE;
          steering.y -= (dy / dist) * force * SEPARATION_FORCE;
          steering.z -= (dz / dist) * force * SEPARATION_FORCE;
        }
      }
    }
    
    if (cohesionCount > 0){
      avgPos.multiplyScalar(1 / cohesionCount);
      const dx = avgPos.x - px;
      const dy = avgPos.y - py;
      const dz = avgPos.z - pz;
      steering.x += dx * COHESION_FORCE;
      steering.y += dy * COHESION_FORCE;
      steering.z += dz * COHESION_FORCE;
    }
    
    if (alignmentCount > 0){
      avgVel.multiplyScalar(1 / alignmentCount);
      steering.x += (avgVel.x - vx) * ALIGNMENT_FORCE;
      steering.y += (avgVel.y - vy) * ALIGNMENT_FORCE;
      steering.z += (avgVel.z - vz) * ALIGNMENT_FORCE;
    }
    
    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > BOUNDARY * 0.7){
      const force = Math.pow((distFromCenter - BOUNDARY * 0.7) / (BOUNDARY * 0.3), 2);
      steering.x -= (px / distFromCenter) * force * BOUNDARY_FORCE;
      steering.y -= (py / distFromCenter) * force * BOUNDARY_FORCE;
      steering.z -= (pz / distFromCenter) * force * BOUNDARY_FORCE;
    }
    
    velocities[i*3]   += steering.x * dt;
    velocities[i*3+1] += steering.y * dt;
    velocities[i*3+2] += steering.z * dt;
    
    const speed = Math.sqrt(
      velocities[i*3]*velocities[i*3] + 
      velocities[i*3+1]*velocities[i*3+1] + 
      velocities[i*3+2]*velocities[i*3+2]
    );
    if (speed > MAX_SPEED){
      velocities[i*3]   *= MAX_SPEED / speed;
      velocities[i*3+1] *= MAX_SPEED / speed;
      velocities[i*3+2] *= MAX_SPEED / speed;
    } else if (speed < MIN_SPEED && speed > 0.01){
      velocities[i*3]   *= MIN_SPEED / speed;
      velocities[i*3+1] *= MIN_SPEED / speed;
      velocities[i*3+2] *= MIN_SPEED / speed;
    }
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
    positions[i*3+2] += velocities[i*3+2] * dt;
    
    trails[i] = THREE.MathUtils.lerp(trails[i], speed / MAX_SPEED, 0.1);
  }
  
  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;
  geom.computeBoundingSphere();
}

const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1 / N);
  
  const orbitRadius = 45;
  const orbitSpeed = 0.08;
  const angle = performance.now() * 0.00008 * orbitSpeed;
  camera.position.x = centroid.x + Math.cos(angle) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(angle) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(angle * 0.5) * 12;
  camera.lookAt(centroid);
  
  uniforms.uCameraPos.value.copy(camera.position);
  
  const distToCentroid = camera.position.distanceTo(centroid);
  uniforms.uDOFDistance.value = distToCentroid * 0.95;
}

let lastTime = performance.now();
const start = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;
  
  frameCount++;
  if (frameCount % 60 === 0){
    let avgSpeed = 0;
    for (let i = 0; i < N; i++){
      const vx = velocities[i*3];
      const vy = velocities[i*3+1];
      const vz = velocities[i*3+2];
      avgSpeed += Math.sqrt(vx*vx + vy*vy + vz*vz);
    }
    avgSpeed /= N;
    const coherence = (avgSpeed / MAX_SPEED * 100).toFixed(0);
    hintEl.textContent = `murmuration coherence: ${coherence}% · depth fog + DOF · ${N} boids`;
  }
  
  uniforms.uTime.value = t;
  updateBoids(dt * 60);
  updateCamera();
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
