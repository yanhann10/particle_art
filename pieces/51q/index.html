<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>51q · Chladni plate resonance</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.48; font-size: 10px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.38; font-size: 10px; letter-spacing: 0.04em; }
  .mode { position:fixed; right:14px; bottom:12px; opacity:0.62; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">51q · Chladni plate</div>
<div class="hint">click to toggle audio · modes cycle automatically · Ernst Chladni 1787</div>
<div class="src">cymatics · 50k sand particles · eigenmode self-organization</div>
<div class="mode" id="modeLabel">(1,1) 35 Hz</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

// ────────────── scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 18, 0);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ────────────── audio context (fallback hum if user doesn't grant mic)
let audioCtx = null;
let analyser = null;
let dataArray = null;
let micGranted = false;
let humOsc = null;

function initAudio(){
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  
  // try to get mic
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        micGranted = true;
      })
      .catch(() => {
        // fallback: synthetic hum oscillator
        humOsc = audioCtx.createOscillator();
        humOsc.type = 'sine';
        humOsc.frequency.value = 120;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.15;
        humOsc.connect(gain);
        gain.connect(analyser);
        humOsc.start();
      });
  } else {
    // no getUserMedia — silent fallback
  }
}

addEventListener('click', initAudio);

// ────────────── Chladni plate geometry
// square plate: L = 10 units, centered at origin, in xy plane
const L = 10;
const N = 50000;

// particle positions (x,y on the plate, z=0 initially)
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);

for (let i = 0; i < N; i++){
  positions[i*3]   = (Math.random() - 0.5) * L;
  positions[i*3+1] = (Math.random() - 0.5) * L;
  positions[i*3+2] = 0;
  velocities[i*3] = 0; velocities[i*3+1] = 0; velocities[i*3+2] = 0;
  seeds[i] = Math.random();
}

// ────────────── mode sequence
// classic Chladni modes (m,n) — each produces distinct nodal patterns
// frequency proportional to (m² + n²)
const modes = [
  { m: 1, n: 1, freq: 35  },
  { m: 2, n: 1, freq: 55  },
  { m: 2, n: 2, freq: 78  },
  { m: 3, n: 1, freq: 95  },
  { m: 3, n: 2, freq: 125 },
  { m: 3, n: 3, freq: 156 },
  { m: 4, n: 1, freq: 135 },
  { m: 4, n: 2, freq: 175 },
  { m: 4, n: 3, freq: 218 },
  { m: 5, n: 1, freq: 185 },
  { m: 5, n: 2, freq: 232 },
  { m: 4, n: 4, freq: 252 },
];

let currentModeIdx = 0;
let modePhase = 0;           // [0..1] within current mode duration
const modeDuration = 8;      // seconds per mode

// ────────────── eigenfunctions
// Chladni eigenmode for a square plate (clamped/free boundary approx):
// u(x,y) = cos(mπx/L)cos(nπy/L) − cos(nπx/L)cos(mπy/L)
// particles seek nodal lines where |u| ≈ 0 by moving downhill along −∇|u|
function eigenU(x, y, m, n){
  const kx = m * Math.PI / L;
  const ky = n * Math.PI / L;
  return Math.cos(kx * x) * Math.cos(ky * y) - Math.cos(ky * x) * Math.cos(kx * y);
}

function gradU(x, y, m, n){
  const kx = m * Math.PI / L;
  const ky = n * Math.PI / L;
  const dx = -kx * Math.sin(kx * x) * Math.cos(ky * y) + ky * Math.sin(ky * x) * Math.cos(kx * y);
  const dy = -ky * Math.cos(kx * x) * Math.sin(ky * y) + kx * Math.cos(ky * x) * Math.sin(kx * y);
  return { dx, dy };
}

// ────────────── particle system shader
const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uModePhase: { value: 0 }
};

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uModePhase;
    attribute float seed;
    varying float vBright;
    void main(){
      vec3 p = position;
      // slight Z-jitter so particles don't coplanar-fight
      p.z = (seed - 0.5) * 0.02;
      
      // brightness: particles near nodal lines (low velocity) glow brighter
      // fade during mode transition
      float transitionFade = smoothstep(0.0, 0.15, uModePhase) * smoothstep(1.0, 0.85, uModePhase);
      vBright = 0.5 + 0.5 * sin(uTime * 3.0 + seed * 6.28);
      vBright *= transitionFade;
      
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (1.2 + 0.4 * vBright) * uPixel * (30.0 / dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vBright;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * (0.35 + 0.65 * vBright);
      // sand grains on dark metal: warm off-white
      vec3 col = vec3(0.92, 0.88, 0.82);
      gl_FragColor = vec4(col * a, a);
    }
  `
});

const points = new THREE.Points(geom, mat);
scene.add(points);

// ────────────── plate mesh (dark metal square)
const plateMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1c, side: THREE.DoubleSide });
const plateGeom = new THREE.PlaneGeometry(L, L);
const plate = new THREE.Mesh(plateGeom, plateMat);
plate.position.z = -0.05;
scene.add(plate);

// edge frame (four thin rectangles)
const frameMat = new THREE.MeshBasicMaterial({ color: 0x2a2a2c });
const frameThick = 0.15;
const edgeL = new THREE.Mesh(new THREE.PlaneGeometry(frameThick, L), frameMat);
edgeL.position.set(-L/2 - frameThick/2, 0, -0.04);
scene.add(edgeL);
const edgeR = new THREE.Mesh(new THREE.PlaneGeometry(frameThick, L), frameMat);
edgeR.position.set(L/2 + frameThick/2, 0, -0.04);
scene.add(edgeR);
const edgeT = new THREE.Mesh(new THREE.PlaneGeometry(L + 2*frameThick, frameThick), frameMat);
edgeT.position.set(0, L/2 + frameThick/2, -0.04);
scene.add(edgeT);
const edgeB = new THREE.Mesh(new THREE.PlaneGeometry(L + 2*frameThick, frameThick), frameMat);
edgeB.position.set(0, -L/2 - frameThick/2, -0.04);
scene.add(edgeB);

// ────────────── simulation update
function updateParticles(dt, mode){
  const m = mode.m, n = mode.n;
  const damping = 0.92;
  const brownian = 0.008;
  const attractStrength = 0.15;
  
  for (let i = 0; i < N; i++){
    let x = positions[i*3];
    let y = positions[i*3+1];
    
    // clamp to plate bounds
    if (Math.abs(x) > L/2 - 0.05 || Math.abs(y) > L/2 - 0.05){
      x = Math.max(-L/2 + 0.05, Math.min(L/2 - 0.05, x));
      y = Math.max(-L/2 + 0.05, Math.min(L/2 - 0.05, y));
      velocities[i*3] *= 0.5;
      velocities[i*3+1] *= 0.5;
    }
    
    // compute gradient of |u(x,y)| — particles move downhill toward nodal lines
    const u = eigenU(x, y, m, n);
    const grad = gradU(x, y, m, n);
    const sign = u > 0 ? 1 : -1;
    const forceX = -sign * grad.dx * attractStrength;
    const forceY = -sign * grad.dy * attractStrength;
    
    velocities[i*3]   = (velocities[i*3]   + forceX * dt) * damping;
    velocities[i*3+1] = (velocities[i*3+1] + forceY * dt) * damping;
    
    // Brownian jitter so particles don't collapse perfectly
    velocities[i*3]   += (Math.random() - 0.5) * brownian;
    velocities[i*3+1] += (Math.random() - 0.5) * brownian;
    
    positions[i*3]   += velocities[i*3] * dt;
    positions[i*3+1] += velocities[i*3+1] * dt;
  }
  
  geom.attributes.position.needsUpdate = true;
}

// ────────────── main loop
const modeLabel = document.getElementById('modeLabel');
let lastTime = performance.now();

function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = now / 1000;
  uniforms.uTime.value = t;
  
  // mode cycling
  modePhase += dt / modeDuration;
  if (modePhase >= 1){
    modePhase = 0;
    currentModeIdx = (currentModeIdx + 1) % modes.length;
  }
  uniforms.uModePhase.value = modePhase;
  
  const mode = modes[currentModeIdx];
  modeLabel.textContent = `(${mode.m},${mode.n}) ${mode.freq} Hz`;
  
  // audio modulation (if available)
  let audioMod = 1.0;
  if (analyser && dataArray){
    analyser.getByteFrequencyData(dataArray);
    const sum = dataArray.reduce((a,b) => a+b, 0);
    audioMod = 0.7 + 0.3 * (sum / (dataArray.length * 255));
  }
  
  // update particle positions toward current mode's nodal lines
  updateParticles(dt * audioMod, mode);
  
  // gentle camera orbit
  const ang = t * 0.08;
  camera.position.x = Math.sin(ang) * 2.5;
  camera.position.z = Math.cos(ang) * 2.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop(performance.now());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
