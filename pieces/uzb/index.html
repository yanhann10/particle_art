<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<!-- Accretion disk + singularity.
     - Central singularity: dark sphere (light-eating void)
     - 60k Keplerian orbit particles: inner hot white-blue, outer warm amber
     - Gravitational lensing: vertex shader radial stretch near center
     Viewer should read ACCRETION DISK within 2 seconds. -->
<title>bhs · accretion disk</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">bhs · accretion disk</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.01, 200);
camera.position.set(0, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.05;
controls.autoRotate      = false;
controls.target.set(0, 0, 0);

// ── 1. Central singularity: dark sphere ───────────────────────────────────────
const singularity = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(singularity);

// Faint event-horizon glow ring
const glowGeo = new THREE.RingGeometry(0.30, 0.42, 64);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x4060ff,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
scene.add(new THREE.Mesh(glowGeo, glowMat));

// ── 2. Accretion disk: 60k Keplerian particles ────────────────────────────────
const DISK_N   = 60000;
const diskPos  = new Float32Array(DISK_N * 3);
const diskCol  = new Float32Array(DISK_N * 3);
const diskAngle= new Float32Array(DISK_N);   // current angle per particle
const diskR    = new Float32Array(DISK_N);   // orbital radius
const diskOmega= new Float32Array(DISK_N);   // angular velocity ∝ 1/sqrt(r)

const R_INNER = 0.42;
const R_OUTER = 6.0;

for (let i=0; i<DISK_N; i++) {
  const r  = R_INNER + Math.pow(Math.random(), 1.4) * (R_OUTER - R_INNER);
  const th = Math.random() * Math.PI * 2;
  const yOff = (Math.random() - 0.5) * 0.30 * Math.exp(-r * 0.4); // thinner near center

  diskR[i]     = r;
  diskAngle[i] = th;
  diskOmega[i] = 1.0 / Math.sqrt(r);   // Keplerian: ω ∝ r^(-3/2) → here ∝ 1/sqrt(r) for visual clarity

  diskPos[i*3]   = r * Math.cos(th);
  diskPos[i*3+1] = yOff;
  diskPos[i*3+2] = r * Math.sin(th);

  // Color: inner hot white-blue (#d0e0ff) → outer warm amber (#e08020)
  const t = (r - R_INNER) / (R_OUTER - R_INNER); // 0=inner, 1=outer
  // inner: (0.816, 0.878, 1.0)   outer: (0.878, 0.502, 0.125)
  diskCol[i*3]   = 0.816 + (0.878 - 0.816) * t;
  diskCol[i*3+1] = 0.878 + (0.502 - 0.878) * t;
  diskCol[i*3+2] = 1.000 + (0.125 - 1.000) * t;
}

// Vertex shader with gravitational lensing stretch
const diskVS = `
  attribute float lensR; // we pass r as w-component via workaround — use position.w trick
  varying vec3 vColor;
  attribute vec3 color;
  void main() {
    vColor = color;
    vec3 pos = position;

    // Gravitational lensing: radially stretch positions toward center when r < 1.5
    float r = length(pos.xz);
    if (r > 0.001 && r < 1.5) {
      float lens = 1.0 + 0.18 * exp(-r * 2.0) / (r + 0.1);
      pos.xz *= lens;
    }

    gl_Position  = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = mix(2.5, 1.0, (r - ${R_INNER.toFixed(2)}) / ${(R_OUTER - R_INNER).toFixed(2)});
  }
`;
const diskFS = `
  varying vec3 vColor;
  void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    if (d > 1.0) discard;
    float a = 1.0 - smoothstep(0.5, 1.0, d);
    gl_FragColor = vec4(vColor, a);
  }
`;

const diskGeo = new THREE.BufferGeometry();
const diskPosBuf = new THREE.BufferAttribute(diskPos, 3);
const diskColBuf = new THREE.BufferAttribute(diskCol, 3);
diskPosBuf.setUsage(THREE.DynamicDrawUsage);
diskGeo.setAttribute('position', diskPosBuf);
diskGeo.setAttribute('color',    diskColBuf);

const diskMat = new THREE.ShaderMaterial({
  vertexShader:   diskVS,
  fragmentShader: diskFS,
  blending:       THREE.AdditiveBlending,
  transparent:    true,
  depthWrite:     false
});
scene.add(new THREE.Points(diskGeo, diskMat));

// Jets removed — accretion disk + singularity is the complete composition.

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation ─────────────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.016;

  // Update disk particle positions (Keplerian orbit)
  for (let i=0; i<DISK_N; i++) {
    diskAngle[i] += diskOmega[i] * 0.008;
    const r   = diskR[i];
    const th  = diskAngle[i];
    const yOff= diskPos[i*3+1]; // keep same y-offset
    diskPos[i*3]   = r * Math.cos(th);
    diskPos[i*3+2] = r * Math.sin(th);
    // small warp: slight y wobble
    diskPos[i*3+1] = yOff * (0.98 + 0.02 * Math.sin(t * diskOmega[i] * 2.3 + i * 0.001));
  }
  diskPosBuf.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
