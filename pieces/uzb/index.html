<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: drift, intensity: gentle -->
<!-- Accretion disk + singularity, reimagined as a sieve.
     - Central singularity: dark globe (light-eating void) + faint event-horizon glow
     - 60k Keplerian orbit particles: inner hot white-blue, outer warm amber
     - Gravitational lensing: vertex shader radial stretch near center
     - A waterfall of grains sieves from the centre and falls from the inner circle;
       it fades into darkness, so its bottom is never seen.
     Surroundings are pure darkness; the round disk is a point cloud (no solid plane). -->
<title>uzb · the sieve</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; }
</style>
</head>
<body>
<div class="id">uzb · the sieve</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.167.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.01, 200);
camera.position.set(0, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.05;
controls.autoRotate      = false;
controls.target.set(0, 0, 0);

// ── 1. Central singularity: dark globe ─────────────────────────────────────────
const GLOBE_Y = -0.62;   // nestled in the hole — top half emerges, bottom half submerged
const singularity = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 40, 40),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
singularity.position.y = GLOBE_Y;
scene.add(singularity);   // opaque → the vortex drains around it

// Faint event-horizon glow ring, laid flat at the globe's waterline
const glowGeo = new THREE.RingGeometry(0.36, 0.52, 80);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x4060ff,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const glow = new THREE.Mesh(glowGeo, glowMat);
glow.rotation.x = -Math.PI / 2;
glow.position.y = GLOBE_Y + 0.02;
scene.add(glow);

// ── 2. Accretion disk: 60k Keplerian particles ────────────────────────────────
const DISK_N   = 60000;
const diskPos  = new Float32Array(DISK_N * 3);
const diskCol  = new Float32Array(DISK_N * 3);
const diskAngle= new Float32Array(DISK_N);   // current angle per particle
const diskR    = new Float32Array(DISK_N);   // orbital radius (shrinks: the sand caves in)
const diskYBase= new Float32Array(DISK_N);   // per-particle vertical seed

const R_INNER = 0.42;
const R_OUTER = 6.0;
const R_HOLE  = 0.5;     // sand caves in to here, then pours down the centre as the waterfall
const CONCAVE = 0.7;     // a very mild downward bowl toward the centre

// the disk is a shallow bowl — flat at the rim, dipping gently toward the centre
function surfaceY(r) {
  const u = 1.0 - Math.min(r / R_OUTER, 1.0);   // 0 at rim → 1 at centre
  return -CONCAVE * u * u;
}

function diskColorAt(i, r) {
  // inner hot white-blue (#d0e0ff) → outer warm amber (#e08020), by CURRENT radius
  const t = Math.max(0, Math.min(1, (r - R_INNER) / (R_OUTER - R_INNER)));
  diskCol[i*3]   = 0.816 + (0.878 - 0.816) * t;
  diskCol[i*3+1] = 0.878 + (0.502 - 0.878) * t;
  diskCol[i*3+2] = 1.000 + (0.125 - 1.000) * t;
}
function seedDisk(i, r) {
  diskR[i]     = r;
  diskAngle[i] = Math.random() * Math.PI * 2;
  diskYBase[i] = Math.random() - 0.5;
  diskColorAt(i, r);
}
for (let i=0; i<DISK_N; i++) {
  const r = R_INNER + Math.pow(Math.random(), 1.4) * (R_OUTER - R_INNER);
  seedDisk(i, r);
  const yOff = diskYBase[i] * 0.30 * Math.exp(-r * 0.4); // thinner near center
  diskPos[i*3]   = r * Math.cos(diskAngle[i]);
  diskPos[i*3+1] = surfaceY(r) + yOff;
  diskPos[i*3+2] = r * Math.sin(diskAngle[i]);
}

// Vertex shader with gravitational lensing stretch
const diskVS = `
  attribute float lensR; // we pass r as w-component via workaround — use position.w trick
  varying vec3 vColor;
  attribute vec3 color;
  void main() {
    vColor = color;
    vec3 pos = position;

    // Gravitational lensing: radially stretch positions toward center when r < 1.5
    float r = length(pos.xz);
    if (r > 0.001 && r < 1.5) {
      float lens = 1.0 + 0.18 * exp(-r * 2.0) / (r + 0.1);
      pos.xz *= lens;
    }

    gl_Position  = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = mix(2.5, 1.0, (r - ${R_INNER.toFixed(2)}) / ${(R_OUTER - R_INNER).toFixed(2)});
  }
`;
const diskFS = `
  varying vec3 vColor;
  void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    if (d > 1.0) discard;
    float a = 1.0 - smoothstep(0.5, 1.0, d);
    gl_FragColor = vec4(vColor, a);
  }
`;

const diskGeo = new THREE.BufferGeometry();
const diskPosBuf = new THREE.BufferAttribute(diskPos, 3);
const diskColBuf = new THREE.BufferAttribute(diskCol, 3);
diskPosBuf.setUsage(THREE.DynamicDrawUsage);
diskColBuf.setUsage(THREE.DynamicDrawUsage);
diskGeo.setAttribute('position', diskPosBuf);
diskGeo.setAttribute('color',    diskColBuf);

const diskMat = new THREE.ShaderMaterial({
  vertexShader:   diskVS,
  fragmentShader: diskFS,
  blending:       THREE.AdditiveBlending,
  transparent:    true,
  depthWrite:     false
});
scene.add(new THREE.Points(diskGeo, diskMat));

// ── 2b. Invisible depth-occluder along the disk surface ─────────────────────────
//     Writes depth only (colorWrite off, so no visible solid disk). It makes the
//     near disk surface OCCLUDE the waterfall below it — the fall is seen only
//     spilling through the central hole, never as a column hanging in open space.
const occGeo = new THREE.CircleGeometry(R_OUTER, 96);
const occMat = new THREE.MeshBasicMaterial({ colorWrite: false });
const occluder = new THREE.Mesh(occGeo, occMat);
occluder.rotation.x = -Math.PI / 2;
occluder.position.y = -1.35;   // below the bowl → hides the fall under the disk; only its top shows
scene.add(occluder);

// ── 3. Waterfall: grains sieve from the centre and fall from the inner circle ───
//      The column fades to black as it descends — the bottom is never seen.
const WF_N    = 4200;
const WF_FADE = 3.4;      // fully invisible by this depth → no visible bottom
const wfPos   = new Float32Array(WF_N * 3);
const wfAlpha = new Float32Array(WF_N);   // per-grain opacity (the depth fade)
const wfRad   = new Float32Array(WF_N);   // vortex radius (shrinks as it drains)
const wfAng   = new Float32Array(WF_N);   // vortex angle
const wfVy    = new Float32Array(WF_N);   // descent speed
const wfSeed  = new Float32Array(WF_N);

// The waterfall is a draining vortex: grains spiral inward AND down into the hole,
// continuous with the disk's inflow — not a straight column dropping from the sky.
function spawnFall(i) {
  wfRad[i]   = 0.34 + Math.random() * (R_HOLE - 0.30);   // enters at the hole rim, by the globe
  wfAng[i]   = Math.random() * Math.PI * 2;
  wfVy[i]    = 0.25 + Math.random() * 0.25;
  wfSeed[i]  = Math.random() * 1000;
  const y    = surfaceY(wfRad[i]) - Math.random() * 0.1;
  wfPos[i*3]   = wfRad[i] * Math.cos(wfAng[i]);
  wfPos[i*3+1] = y;
  wfPos[i*3+2] = wfRad[i] * Math.sin(wfAng[i]);
}
for (let i=0; i<WF_N; i++) {
  spawnFall(i);
  // distribute initial depths across the drain so the vortex reads immediately
  const y = surfaceY(R_HOLE) - Math.random() * WF_FADE;
  wfRad[i] = Math.max(0.05, R_HOLE * (1 - 0.22 * (surfaceY(R_HOLE) - y)));
  wfPos[i*3]   = wfRad[i] * Math.cos(wfAng[i]);
  wfPos[i*3+1] = y;
  wfPos[i*3+2] = wfRad[i] * Math.sin(wfAng[i]);
}

// Normal-blended white grains (not additive) so they never sum into a glowing bar —
// each grain is a discrete white speck whose opacity fades to zero as it descends.
const wfVS = `
  attribute float aAlpha;
  varying float vA;
  void main() {
    vA = aAlpha;
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    gl_PointSize = 2.2;   // fine speck, on the disk's scale (NOT distance-scaled — that made giant blobs)
  }
`;
const wfFS = `
  varying float vA;
  void main() {
    float d = length(gl_PointCoord - 0.5) * 2.0;
    if (d > 1.0) discard;
    float s = 1.0 - smoothstep(0.82, 1.0, d);   // crisp grain, not a soft smoky blob
    gl_FragColor = vec4(0.95, 0.97, 1.0, vA * s);
  }
`;
const wfGeo = new THREE.BufferGeometry();
const wfPosBuf   = new THREE.BufferAttribute(wfPos, 3);   wfPosBuf.setUsage(THREE.DynamicDrawUsage);
const wfAlphaBuf = new THREE.BufferAttribute(wfAlpha, 1); wfAlphaBuf.setUsage(THREE.DynamicDrawUsage);
wfGeo.setAttribute('position', wfPosBuf);
wfGeo.setAttribute('aAlpha',   wfAlphaBuf);
const wfMat = new THREE.ShaderMaterial({
  vertexShader:   wfVS,
  fragmentShader: wfFS,
  blending:       THREE.NormalBlending,
  transparent:    true,
  depthWrite:     false   // depthTest stays on → the globe occludes the far side
});
scene.add(new THREE.Points(wfGeo, wfMat));

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Animation ─────────────────────────────────────────────────────────────────
const dt = 0.016;
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += dt;

  // Disk: Keplerian orbit + slow inward drift — the sand caves toward the centre.
  for (let i=0; i<DISK_N; i++) {
    let r = diskR[i];
    const omega = 1.0 / Math.sqrt(r);     // inner orbits faster → a tightening spiral
    diskAngle[i] += omega * 0.008;
    r -= (0.45 / r) * dt;   // inflow ∝ 1/r → areal density stays UNIFORM across the disk
    if (r <= R_HOLE) { seedDisk(i, R_OUTER * (0.99 - Math.random() * 0.02)); r = diskR[i]; }
    else diskR[i] = r;
    const th = diskAngle[i];
    diskPos[i*3]   = r * Math.cos(th);
    diskPos[i*3+2] = r * Math.sin(th);
    diskPos[i*3+1] = surfaceY(r) + diskYBase[i] * 0.12 * (0.9 + 0.1 * Math.sin(t * omega * 2.3 + i * 0.001));
    diskColorAt(i, r);
  }
  diskPosBuf.needsUpdate = true;
  diskColBuf.needsUpdate = true;

  // Waterfall: a draining vortex — grains spiral inward and down into the hole.
  for (let i=0; i<WF_N; i++) {
    wfVy[i] = Math.min(wfVy[i] + 0.9 * dt, 1.6);
    let rr  = Math.max(0.04, wfRad[i] - 0.16 * dt);   // spirals inward (drains)
    wfRad[i] = rr;
    wfAng[i] += (1.1 / Math.max(rr, 0.07)) * dt;        // swirl quickens toward the axis
    let y = wfPos[i*3+1] - wfVy[i] * dt;
    if (y < -WF_FADE || rr <= 0.045) { spawnFall(i); rr = wfRad[i]; y = wfPos[i*3+1]; }
    wfPos[i*3]   = rr * Math.cos(wfAng[i]);
    wfPos[i*3+1] = y;
    wfPos[i*3+2] = rr * Math.sin(wfAng[i]);
    // stays opaque through the visible top, then winks out → no visible bottom
    wfAlpha[i] = Math.max(0, Math.min(1, (y + WF_FADE) / 1.3));
  }
  wfPosBuf.needsUpdate = true;
  wfAlphaBuf.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
<!-- gp: universal grade panel + save/config (injected by scripts/inject_grade_panel.py) -->
<style>
  #gp-panel{position:fixed;right:10px;top:52px;width:172px;z-index:998;
    background:rgba(8,12,18,0.82);border:1px solid rgba(205,210,220,0.12);border-radius:6px;
    padding:10px 12px 8px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);

  #gp-panel label span{color:rgba(205,210,220,0.85);font-variant-numeric:tabular-nums;}
  #gp-panel input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;

  #gp-panel input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;
    border-radius:50%;background:rgba(205,210,220,0.55);border:none;cursor:pointer;}
  #gp-panel input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;

  #gp-save{width:100%;margin-top:2px;background:rgba(0,0,0,0.5);

    color:rgba(201,168,106,0.9);cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:0.04em;}

  #gp-panel button.gp-cfg:hover{border-color:rgba(205,210,220,0.4);}
</style>
<div id="gp-panel">
  <div class="gp-h">grade</div>
  <label>hue<span id="gp-v-hue">0&deg;</span></label>
  <input id="gp-hue" type="range" min="0" max="360" step="1" value="0">
  <label>saturation<span id="gp-v-sat">1.00</span></label>
  <input id="gp-sat" type="range" min="0" max="2" step="0.01" value="1">
  <label>brightness<span id="gp-v-bri">1.00</span></label>
  <input id="gp-bri" type="range" min="0.3" max="2" step="0.01" value="1">
  <label>contrast<span id="gp-v-con">1.00</span></label>
  <input id="gp-con" type="range" min="0.5" max="2" step="0.01" value="1">
  <button id="gp-save">save config</button>
  <div id="gp-saved"></div>
</div>
<script>
(function(){
  function pieceId(){
    var parts=location.pathname.split('/').filter(Boolean);
    var i=parts.indexOf('pieces');
    if(i>=0&&parts[i+1]&&parts[i+1]!=='index.html')return parts[i+1];
    var last=parts.pop();
    if((last==='index.html'||!last)&&parts.length)last=parts.pop();
    if(last)return last;
    var el=document.querySelector('.id');
    return el?el.textContent.trim().split(/[\s·]/)[0]:'unknown';
  }
  var pid=pieceId();
  var KEY='pa_cfg_'+pid;
  var G={hue:0,sat:1,bri:1,con:1};
  function fmt(k,v){return k==='hue'?Math.round(v)+'°':(+v).toFixed(2);}
  function applyFilter(){
    var f='hue-rotate('+G.hue+'deg) saturate('+G.sat+') brightness('+G.bri+') contrast('+G.con+')';
    var cs=document.querySelectorAll('canvas');
    for(var i=0;i<cs.length;i++){cs[i].style.filter=f;}
  }
  var tries=0;
  (function waitCanvas(){
    if(document.querySelector('canvas')||tries++>80){applyFilter();return;}
    setTimeout(waitCanvas,100);
  })();
  function bind(key,id){
    var el=document.getElementById('gp-'+id),vl=document.getElementById('gp-v-'+id);
    el.addEventListener('input',function(){G[key]=parseFloat(el.value);vl.textContent=fmt(key,G[key]);applyFilter();});
  }
  bind('hue','hue');bind('sat','sat');bind('bri','bri');bind('con','con');
  function setSliders(c){
    G={hue:+c.hue,sat:+c.sat,bri:+c.bri,con:+c.con};
    var map={hue:'hue',sat:'sat',bri:'bri',con:'con'};
    for(var k in map){
      document.getElementById('gp-'+map[k]).value=G[k];
      document.getElementById('gp-v-'+map[k]).textContent=fmt(k,G[k]);
    }
    applyFilter();
  }
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch(e){return [];}}
  function store(arr){try{localStorage.setItem(KEY,JSON.stringify(arr));}catch(e){}}
  function renderSaved(){
    var wrap=document.getElementById('gp-saved');wrap.innerHTML='';
    var arr=load();
    arr.forEach(function(c,i){
      var b=document.createElement('button');
      b.className='gp-cfg';b.textContent='config '+(i+1);
      try{b.title=new Date(c.id).toLocaleString()+' · right-click to delete';}catch(e){}
      b.onclick=function(){setSliders(c);};
      b.oncontextmenu=function(e){e.preventDefault();var a=load();a.splice(i,1);store(a);renderSaved();};
      wrap.appendChild(b);
    });
  }
  document.getElementById('gp-save').onclick=function(){
    var arr=load();
    var cfg={id:Date.now(),hue:G.hue,sat:G.sat,bri:G.bri,con:G.con};
    arr.push(cfg);store(arr);renderSaved();
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({piece_id:pid,config:cfg})}).catch(function(){});
  };
  renderSaved();
  function reposition(){
    var gp=document.getElementById('gp-panel'),maxB=0;
    ['piece-ctrl','panel'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){var r=el.getBoundingClientRect();
        if(r.right>window.innerWidth-80&&r.bottom>maxB)maxB=r.bottom;}
    });
    gp.style.top=(maxB>0?maxB+8:52)+'px';
  }
  reposition();addEventListener('resize',reposition);
})();
</script>

</body>
