<div class="src">Tomás Saraceno · 3D laser-scanned arachnid structure · descended from sav</div>
<script type="importmap">

<script type="module">
import * as THREE from 'three';

// Saraceno's spider-web scans: sparse, irregular 3D graph architecture suspended
// in darkness. Not a grid, not a uniform scatter — a real organism's construction
// topology. The web breathes with soft spring physics + wind perturbation.
// Faintly pearlescent filaments on pitch black — scientific precision meets
// astronomical scale.

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.008);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(12, 8, 20);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

// ────────────── sparse anchor graph (web nodes)
const N = 280;
const anchors = [];
const anchorVel = [];
for (let i = 0; i < N; i++){
  // non-uniform cluster distribution: 3 major hubs + sparse periphery
  const hub = Math.floor(Math.random() * 3);
  const hubCenters = [
    new THREE.Vector3(-6, 2, -3),
    new THREE.Vector3(4, -1, 2),
    new THREE.Vector3(0, 5, -5)
  ];
  const basePos = hubCenters[hub];
  const r = Math.pow(Math.random(), 1.6) * (hub === 1 ? 8.0 : 6.0);
  const th = Math.random() * Math.PI * 2;
  const ph = (Math.random() - 0.5) * Math.PI * 0.9;
  const pos = new THREE.Vector3(
    basePos.x + Math.cos(th) * Math.cos(ph) * r,
    basePos.y + Math.sin(ph) * r,
    basePos.z + Math.sin(th) * Math.cos(ph) * r
  );
  anchors.push(pos);
  anchorVel.push(new THREE.Vector3(0, 0, 0));
}

// ────────────── connectivity: nearest-neighbor + long-range guy-lines
const edges = [];
const distThresh = 4.8;
for (let i = 0; i < N; i++){
  const neighbors = [];
  for (let j = 0; j < N; j++){
    if (i === j) continue;
    const d = anchors[i].distanceTo(anchors[j]);
    if (d < distThresh) neighbors.push({ idx: j, d });
  }
  neighbors.sort((a, b) => a.d - b.d);
  const nConnect = Math.min(4, neighbors.length);
  for (let k = 0; k < nConnect; k++){
    const j = neighbors[k].idx;
    if (i < j) edges.push([i, j]);
  }
}
// add 18 long-range guy-lines (structural tension cables)
for (let k = 0; k < 18; k++){
  const i = Math.floor(Math.random() * N);
  let j = Math.floor(Math.random() * N);
  while (j === i) j = Math.floor(Math.random() * N);
  edges.push([i, j]);
}

// ────────────── render edges as thin luminous filaments
const edgePositions = new Float32Array(edges.length * 6);
const edgeOpacity = new Float32Array(edges.length * 2);
for (let e = 0; e < edges.length; e++){
  const [i, j] = edges[e];
  edgePositions[e*6]   = anchors[i].x;
  edgePositions[e*6+1] = anchors[i].y;
  edgePositions[e*6+2] = anchors[i].z;
  edgePositions[e*6+3] = anchors[j].x;
  edgePositions[e*6+4] = anchors[j].y;
  edgePositions[e*6+5] = anchors[j].z;
  const d = anchors[i].distanceTo(anchors[j]);
  const alpha = Math.min(1.0, Math.exp(-d * 0.12) * 0.9 + 0.08);
  edgeOpacity[e*2]   = alpha;
  edgeOpacity[e*2+1] = alpha;
}
const lineGeom = new THREE.BufferGeometry();
lineGeom.setAttribute('position', new THREE.BufferAttribute(edgePositions, 3));
lineGeom.setAttribute('opacity', new THREE.BufferAttribute(edgeOpacity, 1));
const lineMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float opacity;
    varying float vOp;
    void main(){
      vOp = opacity;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    varying float vOp;
    void main(){
      // pearlescent metallic thread — faint warm white with hint of silver
      vec3 col = vec3(0.92, 0.94, 0.96);
      gl_FragColor = vec4(col * vOp * 0.32, vOp * 0.28);
    }
  `
});
const lineSegments = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lineSegments);

// ────────────── anchor nodes as tiny sprites
const nodeGeom = new THREE.BufferGeometry();
const nodePos = new Float32Array(N * 3);
for (let i = 0; i < N; i++){
  nodePos[i*3]   = anchors[i].x;
  nodePos[i*3+1] = anchors[i].y;
  nodePos[i*3+2] = anchors[i].z;
}
nodeGeom.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
const nodeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
  uniforms: { uTime: { value: 0 }, uPixel: { value: renderer.getPixelRatio() } },
  vertexShader: `
    uniform float uPixel;
    varying float vFade;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float dist = -mv.z;
      gl_PointSize = uPixel * (6.0 / dist);
      vFade = clamp(1.0 - (dist - 22.0) / 35.0, 0.0, 1.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vFade;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d, d);
      if (r > 0.25) discard;
      float a = exp(-r * 16.0) * vFade * 0.55;
      // slightly warmer node color than filaments — anchor points glow faintly
      vec3 col = vec3(0.98, 0.96, 0.92);
      gl_FragColor = vec4(col * a, a);
    }
  `
});
const nodePoints = new THREE.Points(nodeGeom, nodeMat);
scene.add(nodePoints);

// ────────────── soft spring + wind physics (web breathes)
const restPos = anchors.map(p => p.clone());
const windFreq = new Float32Array(N);
const windPhase = new Float32Array(N);
for (let i = 0; i < N; i++){
  windFreq[i] = 0.3 + Math.random() * 0.4;
  windPhase[i] = Math.random() * Math.PI * 2;
}

function updateWeb(t, dt){
  const windStrength = 0.08;
  const springK = 0.15;
  const damping = 0.88;
  for (let i = 0; i < N; i++){
    const wind = new THREE.Vector3(
      Math.sin(t * windFreq[i] + windPhase[i]) * windStrength,
      Math.cos(t * windFreq[i] * 0.7 + windPhase[i] * 1.3) * windStrength * 0.6,
      Math.sin(t * windFreq[i] * 1.1 + windPhase[i] * 0.9) * windStrength * 0.8
    );
    const spring = restPos[i].clone().sub(anchors[i]).multiplyScalar(springK);
    anchorVel[i].add(wind).add(spring).multiplyScalar(damping);
    anchors[i].add(anchorVel[i].clone().multiplyScalar(dt));
  }
  // update geometry
  for (let i = 0; i < N; i++){
    nodePos[i*3]   = anchors[i].x;
    nodePos[i*3+1] = anchors[i].y;
    nodePos[i*3+2] = anchors[i].z;
  }
  nodeGeom.attributes.position.needsUpdate = true;
  for (let e = 0; e < edges.length; e++){
    const [i, j] = edges[e];
    edgePositions[e*6]   = anchors[i].x;
    edgePositions[e*6+1] = anchors[i].y;
    edgePositions[e*6+2] = anchors[i].z;
    edgePositions[e*6+3] = anchors[j].x;
    edgePositions[e*6+4] = anchors[j].y;
    edgePositions[e*6+5] = anchors[j].z;
  }
  lineGeom.attributes.position.needsUpdate = true;
}

// ────────────── stereoscopic camera dolly (walk through the web)
const camPath = [
  new THREE.Vector3(12, 8, 20),
  new THREE.Vector3(5, 3, 12),
  new THREE.Vector3(-2, 1, 6),
  new THREE.Vector3(-6, 4, -2),
  new THREE.Vector3(-3, 6, -8),
  new THREE.Vector3(4, 2, -5),
  new THREE.Vector3(10, -2, 2),
  new THREE.Vector3(12, 8, 20)
];
function getCameraPos(t){
  const cycleDuration = 90.0;
  const phase = (t % cycleDuration) / cycleDuration;
  const segCount = camPath.length - 1;
  const seg = phase * segCount;
  const i0 = Math.floor(seg) % camPath.length;
  const i1 = (i0 + 1) % camPath.length;
  const localT = seg - Math.floor(seg);
  return camPath[i0].clone().lerp(camPath[i1], localT);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let lastT = performance.now();
function loop(){
  const now = performance.now();
  const dt = Math.min(0.06, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;
  lineMat.uniforms.uTime.value = t;
  nodeMat.uniforms.uTime.value = t;
  updateWeb(t, dt);

  const camPos = getCameraPos(t);
  camera.position.copy(camPos);
  // look toward web centroid
  const centroid = new THREE.Vector3(0, 2, -1);
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
