<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sx3 · Reas process — agents leaving traces</title>
<!-- MOTION: drift, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; }
  body {
    background: #e8e6e2;
    color: #3a3a3a; font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.90' numOctaves='1' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.22  0 0 0 0 0.22  0 0 0 0 0.22  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.40'/></svg>");
    mix-blend-mode: multiply; opacity: 0.35;
  }
  canvas { display:block; position: relative; z-index: 0; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; z-index:5; color: #3a3a3a; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.45; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.35; font-size: 10px; letter-spacing: 0.04em; z-index:5; }
</style>
</head>
<body>
<div class="id">sx3</div>
<div class="hint">click to restart process · drag to nudge field</div>
<div class="src">Reas process compendium · agent traces · deterministic emergence · 2010 restraint</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Casey Reas principle: simple local rules → complex emergent form.
// Agents move in a vector field, leave permanent traces, slow biomorphic drift.
// Near-monochrome charcoal with ONE small accent (cadmium red, used <2% of marks).
// No glow, no additive blending, no sparkle. Stillness and restraint.

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 11);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// ────────────── VECTOR FIELD — deterministic radial + curl structure
// (no noise — field is sum of analytic basis functions)
function vectorField(x, z, t){
  const r = Math.sqrt(x*x + z*z);
  const th = Math.atan2(z, x);
  // radial attraction toward origin, strength falls off
  const radial_str = -0.08 * Math.tanh(r * 0.4);
  // tangential curl component — rotates around origin
  const curl_str = 0.12 * Math.exp(-r*r * 0.05);
  // modulation by angle — 5-fold symmetry breaks isotropy
  const sym = Math.sin(th * 5 + t * 0.15);
  const vr = radial_str * (1.0 + 0.3 * sym);
  const vt = curl_str   * (1.0 + 0.4 * Math.cos(th * 3 - t * 0.10));
  return {
    x: vr * Math.cos(th) - vt * Math.sin(th),
    z: vr * Math.sin(th) + vt * Math.cos(th)
  };
}

// ────────────── AGENTS — each agent leaves a permanent trace line as it moves
const N_AGENTS = 320;
const agents = [];
const MAX_TRACE_LENGTH = 180;
let processSeed = Math.random() * 1e9;

function initAgents(seed){
  let s = seed >>> 0;
  const rng = () => { s |= 0; s = s + 0x6d2b79f5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  agents.length = 0;
  for (let i = 0; i < N_AGENTS; i++){
    const r = Math.sqrt(rng()) * 4.5;
    const th = rng() * Math.PI * 2;
    agents.push({
      x: r * Math.cos(th),
      z: r * Math.sin(th),
      vx: 0,
      vz: 0,
      trace: [],
      isAccent: (rng() < 0.018) // 1.8% get the accent color
    });
  }
}
initAgents(Math.floor(processSeed));

// ────────────── TRACE RENDERING — each agent has a BufferGeometry line
const traceMeshes = [];
for (let i = 0; i < N_AGENTS; i++){
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(MAX_TRACE_LENGTH * 3);
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setDrawRange(0, 0);
  const mat = new THREE.LineBasicMaterial({
    color: agents[i].isAccent ? 0xa83232 : 0x2a2a2a,
    transparent: true,
    opacity: agents[i].isAccent ? 0.75 : 0.48,
    linewidth: 1
  });
  const mesh = new THREE.Line(geom, mat);
  scene.add(mesh);
  traceMeshes.push(mesh);
}

// ────────────── AGENT UPDATE — steering + trace appending
const pointerInfluence = new THREE.Vector2(0, 0);
function updateAgents(dt, t){
  for (let i = 0; i < agents.length; i++){
    const a = agents[i];
    // read vector field at agent position
    let field = vectorField(a.x, a.z, t);
    // add small pointer influence — pointer pushes agents away
    const dx = a.x - pointerInfluence.x * 5.0;
    const dz = a.z - pointerInfluence.y * 5.0;
    const dr = Math.sqrt(dx*dx + dz*dz) + 0.01;
    const repel_str = 0.35 / (dr*dr + 0.5);
    field.x += (dx / dr) * repel_str;
    field.z += (dz / dr) * repel_str;
    // steer velocity toward field (Casey's process: inertia + damping)
    const alpha = 0.08;
    a.vx = a.vx * 0.92 + field.x * alpha;
    a.vz = a.vz * 0.92 + field.z * alpha;
    // move
    a.x += a.vx * dt * 60;
    a.z += a.vz * dt * 60;
    // boundary reflection — agents bounce off invisible circle
    const r = Math.sqrt(a.x*a.x + a.z*a.z);
    if (r > 5.5){
      const nx = a.x / r, nz = a.z / r;
      const dot = a.vx * nx + a.vz * nz;
      a.vx -= 2 * dot * nx;
      a.vz -= 2 * dot * nz;
      a.x = nx * 5.5;
      a.z = nz * 5.5;
    }
    // append trace point (only every 3rd frame to keep geometry light)
    if (Math.floor(t * 60) % 3 === 0){
      if (a.trace.length >= MAX_TRACE_LENGTH) a.trace.shift();
      a.trace.push({ x: a.x, y: 0, z: a.z });
      // update geometry
      const geom = traceMeshes[i].geometry;
      const pos = geom.attributes.position.array;
      for (let j = 0; j < a.trace.length; j++){
        pos[j*3]     = a.trace[j].x;
        pos[j*3 + 1] = a.trace[j].y;
        pos[j*3 + 2] = a.trace[j].z;
      }
      geom.attributes.position.needsUpdate = true;
      geom.setDrawRange(0, a.trace.length);
    }
  }
}

// ────────────── INTERACTION
addEventListener('pointermove', (e) => {
  pointerInfluence.set(
    (e.clientX / innerWidth)  * 2 - 1,
    (e.clientY / innerHeight) * 2 - 1
  );
});
addEventListener('click', () => {
  processSeed = Math.random() * 1e9;
  initAgents(Math.floor(processSeed));
  // clear all traces
  for (let i = 0; i < agents.length; i++){
    agents[i].trace = [];
    traceMeshes[i].geometry.setDrawRange(0, 0);
    traceMeshes[i].material.color.set(agents[i].isAccent ? 0xa83232 : 0x2a2a2a);
    traceMeshes[i].material.opacity = agents[i].isAccent ? 0.75 : 0.48;
  }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
let lastT = 0;
function loop(){
  const t = (performance.now() - start) / 1000;
  const dt = t - lastT;
  lastT = t;
  updateAgents(Math.min(dt, 0.05), t);
  // very slow camera drift — breathing observation
  camera.position.x = Math.sin(t * 0.04) * 0.3;
  camera.position.y = 0.15 + Math.cos(t * 0.035) * 0.2;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
