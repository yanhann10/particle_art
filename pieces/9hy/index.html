<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>leaf nautilus · logarithmic spiral · golden ratio</title>
<!-- MOTION: spiral, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#09080a; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="id">9hy</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x09080a, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x09080a, 0.018);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 8, 22);
camera.lookAt(0, 0, 0);

// ambient + warm directional
scene.add(new THREE.AmbientLight(0x1a1512, 0.4));
const dirLight = new THREE.DirectionalLight(0xffd9b3, 1.8);
dirLight.position.set(-4, 6, 3);
scene.add(dirLight);

// back fill cool
const backLight = new THREE.DirectionalLight(0x4a5a6a, 0.3);
backLight.position.set(2, -1, -4);
scene.add(backLight);

// golden ratio
const PHI = (1 + Math.sqrt(5)) / 2;
const GOLDEN_ANGLE = 2 * Math.PI / (PHI * PHI);

// leaf sheet geometry — curved midrib with bilateral symmetry
function makeLeafGeometry(length = 1.0, width = 0.4, segments = 16){
  const positions = [];
  const indices = [];
  const normals = [];
  
  // two strips along the midrib, curved upward slightly
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const x = (t - 0.5) * length;
    
    // taper width toward tip and base
    const widthMult = Math.sin(t * Math.PI) * 1.2;
    const w = width * widthMult;
    
    // slight upward curl along length
    const curl = Math.sin(t * Math.PI) * 0.15;
    
    // left edge
    positions.push(-w, curl, x);
    normals.push(-0.3, 1, 0);
    
    // right edge
    positions.push(w, curl, x);
    normals.push(0.3, 1, 0);
  }
  
  // indices for triangle strip
  for (let i = 0; i < segments; i++){
    const base = i * 2;
    indices.push(base, base + 1, base + 2);
    indices.push(base + 1, base + 3, base + 2);
  }
  
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geom.setIndex(indices);
  return geom;
}

const leafGeom = makeLeafGeometry(1.4, 0.52, 20);

// palette: warm amber, sodium, ochre, rust, rare desaturated green
const palette = [
  new THREE.Color(0xd4a574), // warm sand
  new THREE.Color(0xe8c7a0), // cream
  new THREE.Color(0xb8956a), // ochre
  new THREE.Color(0xa86842), // rust
  new THREE.Color(0xffd9a8), // pale amber
  new THREE.Color(0x8a7a5a), // umber
  new THREE.Color(0x6a7254), // muted olive (rare)
];

const leaves = [];
const NUM_LEAVES = 180;

// logarithmic spiral: r = a * e^(b*theta)
// scale increases as we spiral outward
const a = 0.4;
const b = 0.12;

for (let i = 0; i < NUM_LEAVES; i++){
  const theta = i * GOLDEN_ANGLE;
  const r = a * Math.exp(b * theta);
  
  const x = r * Math.cos(theta);
  const z = r * Math.sin(theta);
  
  // slight vertical offset based on radius (inner leaves lower)
  const y = -r * 0.3;
  
  // scale grows with radius
  const scale = 0.3 + r * 0.25;
  
  // color from palette, with slight variation per leaf
  const colorIdx = Math.floor((i / NUM_LEAVES) * palette.length);
  const baseColor = palette[colorIdx % palette.length].clone();
  
  // slight hue shift per leaf for variation
  const hsl = {};
  baseColor.getHSL(hsl);
  hsl.l *= 0.85 + Math.random() * 0.3;
  hsl.s *= 0.9 + Math.random() * 0.2;
  baseColor.setHSL(hsl.h, hsl.s, hsl.l);
  
  const mat = new THREE.MeshStandardMaterial({
    color: baseColor,
    side: THREE.DoubleSide,
    roughness: 0.85 + Math.random() * 0.1,
    metalness: 0.05,
    emissive: baseColor.clone().multiplyScalar(0.08),
  });
  
  const mesh = new THREE.Mesh(leafGeom, mat);
  mesh.position.set(x, y, z);
  mesh.scale.setScalar(scale);
  
  // rotation: face tangent to spiral + golden-ratio twist + per-leaf variation
  const tangentAngle = theta + Math.PI / 2;
  mesh.rotation.y = tangentAngle;
  
  // slight tilt variation
  mesh.rotation.x = (Math.random() - 0.5) * 0.3;
  mesh.rotation.z = (Math.random() - 0.5) * 0.25;
  
  // store for animation
  mesh.userData.baseY = y;
  mesh.userData.baseRotY = tangentAngle;
  mesh.userData.phaseOffset = Math.random() * Math.PI * 2;
  mesh.userData.breathRate = 0.8 + Math.random() * 0.4;
  
  scene.add(mesh);
  leaves.push(mesh);
}

// slow camera orbit
let time = 0;
function animate(){
  requestAnimationFrame(animate);
  time += 0.008;
  
  // gentle breathing motion on leaves
  leaves.forEach(leaf => {
    const t = time * leaf.userData.breathRate + leaf.userData.phaseOffset;
    const breathe = Math.sin(t) * 0.08;
    leaf.position.y = leaf.userData.baseY + breathe;
    
    // subtle rotation oscillation
    leaf.rotation.y = leaf.userData.baseRotY + Math.sin(t * 0.7) * 0.05;
  });
  
  // camera slow orbit around spiral center
  const camRadius = 22;
  const camAngle = time * 0.08;
  camera.position.x = Math.sin(camAngle) * camRadius;
  camera.position.z = Math.cos(camAngle) * camRadius;
  camera.position.y = 8 + Math.sin(time * 0.15) * 1.5;
  camera.lookAt(0, 0, 0);
  
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
