<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dw9 · Shiota — Leaf Archive</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">dw9</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x000000, 0.0028);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 140);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x0a0202, 0.012));
const key1 = new THREE.PointLight(0x320a0a, 0.024, 32, 1.8);
key1.position.set(-16, 18, 12);
scene.add(key1);

let seed = 928374;
function rng(){ seed^=seed<<13; seed^=seed>>17; seed^=seed<<5; return(seed>>>0)/4294967296; }

const ROOM = { w: 48, h: 32, d: 44 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// SUSPENDED LEAF — single pale gingko leaf at center, the remembered form
const leafPos = new THREE.Vector3(0, 1.2, 0);

const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0);
leafShape.quadraticCurveTo(-0.6, 0.4, -0.8, 1.2);
leafShape.quadraticCurveTo(-0.5, 1.8, 0, 2.2);
leafShape.quadraticCurveTo(0.5, 1.8, 0.8, 1.2);
leafShape.quadraticCurveTo(0.6, 0.4, 0, 0);

const leafGeo = new THREE.ExtrudeGeometry(leafShape, {
  depth: 0.04,
  bevelEnabled: true,
  bevelThickness: 0.02,
  bevelSize: 0.02,
  bevelSegments: 3
});

const leafMesh = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({
  color: 0xf4ede0,
  emissive: 0xc8b8a0,
  emissiveIntensity: 0.62,
  metalness: 0.0,
  roughness: 0.88,
  side: THREE.DoubleSide
}));

leafMesh.position.copy(leafPos);
leafMesh.rotation.x = -Math.PI/2;
leafMesh.rotation.z = Math.PI/6;
scene.add(leafMesh);

const leafGlow = new THREE.PointLight(0x1a0808, 0.016, 18, 2.2);
leafGlow.position.copy(leafPos);
scene.add(leafGlow);

// ANCHORS — distributed across room volume with density zones

const anchors = [];

// Dense sphere around leaf — converging lines will target this
const innerCount = 160;
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
for(let i=0; i<innerCount; i++){
  const y = 1 - (i / (innerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 4.8 + rng()*2.4;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(leafPos));
}

// Mid shell — threads that orbit the leaf
const midCount = 200;
for(let i=0; i<midCount; i++){
  const y = 1 - (i / (midCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 9.6 + rng()*5.2;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(leafPos));
}

// Outer shell — long spanning threads
const outerCount = 140;
for(let i=0; i<outerCount; i++){
  const y = 1 - (i / (outerCount-1)) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  const r = 16.0 + rng()*6.0;
  anchors.push(new THREE.Vector3(x*r, y*r, z*r).add(leafPos));
}

// Wall anchors — sparse, hand-placed feeling
function wallGrid(axis, val, uRange, vRange, steps){
  const pts = [];
  for(let i=0; i<=steps; i++){
    for(let j=0; j<=steps; j++){
      const u = (i/steps - 0.5) * uRange + (rng()-0.5)*1.2;
      const v = (j/steps - 0.5) * vRange + (rng()-0.5)*1.2;
      let p;
      if(axis==='x') p = new THREE.Vector3(val, u, v);
      else if(axis==='y') p = new THREE.Vector3(u, val, v);
      else p = new THREE.Vector3(u, v, val);
      pts.push(p);
    }
  }
  return pts;
}

anchors.push(...wallGrid('x', -hw, ROOM.h*0.88, ROOM.d*0.88, 4));
anchors.push(...wallGrid('x', hw, ROOM.h*0.88, ROOM.d*0.88, 4));
anchors.push(...wallGrid('y', -hh, ROOM.w*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('y', hh, ROOM.w*0.88, ROOM.d*0.88, 5));
anchors.push(...wallGrid('z', -hd, ROOM.w*0.88, ROOM.h*0.88, 4));
anchors.push(...wallGrid('z', hd, ROOM.w*0.88, ROOM.h*0.88, 4));

// Volume scatter — random cloud of anchors
for(let i=0; i<280; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const y = (rng()-0.5)*ROOM.h*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  anchors.push(new THREE.Vector3(x, y, z));
}

// RED THREAD NETWORK — 20,000 segments HARD LIMIT
const NUM_LINES = 20000;
const positions = new Float32Array(NUM_LINES*6);
let li = 0;

function setLine(a, b){
  if(li>=NUM_LINES) return;
  const idx=li*6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  li++;
}

// CATEGORY A: Converging threads — all paths drawn to the leaf
const convergeCount = 7200;
for(let i=0; i<convergeCount && li<NUM_LINES-12800; i++){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const dLeaf = a.distanceTo(leafPos);
  if(dLeaf < 3.2) continue;
  
  const dir = leafPos.clone().sub(a).normalize();
  const targetDist = Math.max(0.82, dLeaf * (0.72 + rng()*0.22));
  const target = a.clone().add(dir.multiplyScalar(targetDist));
  
  setLine(a, target);
}

// CATEGORY B: Leaf surface radiants — threads extending from leaf center
const leafRadials = 3200;
for(let i=0; i<leafRadials && li<NUM_LINES-9600; i++){
  const y = 1 - (i / leafRadials) * 2;
  const radius = Math.sqrt(1 - y*y);
  const theta = goldenAngle * i;
  const x = Math.cos(theta) * radius;
  const z = Math.sin(theta) * radius;
  
  const surfPt = new THREE.Vector3(x*0.72, y*0.72, z*0.72).add(leafPos);
  const dir = new THREE.Vector3(x, y, z);
  const len = 7.2 + rng()*9.6;
  const end = surfPt.clone().add(dir.multiplyScalar(len));
  
  setLine(surfPt, end);
}

// CATEGORY C: Circumferential web — horizontal rings orbiting the leaf
const circumLevels = 9;
const threadsPerLevel = 120;
for(let l=0; l<circumLevels && li<NUM_LINES-6920; l++){
  const r = 6.0 + l*2.2;
  const yBase = leafPos.y + (l-circumLevels/2)*2.8;
  
  for(let i=0; i<threadsPerLevel && li<NUM_LINES-6920; i++){
    const t0 = (i/threadsPerLevel) * Math.PI*2;
    const t1 = t0 + Math.PI*2/threadsPerLevel;
    
    const x0 = leafPos.x + Math.cos(t0)*r;
    const z0 = leafPos.z + Math.sin(t0)*r;
    const x1 = leafPos.x + Math.cos(t1)*r;
    const z1 = leafPos.z + Math.sin(t1)*r;
    
    const y0 = yBase + Math.sin(t0*4)*0.8;
    const y1 = yBase + Math.sin(t1*4)*0.8;
    
    setLine(
      new THREE.Vector3(x0, y0, z0),
      new THREE.Vector3(x1, y1, z1)
    );
  }
}

// CATEGORY D: Meridian threads — vertical arcs through leaf
const meridians = 36;
const ptsPerMeridian = 16;
for(let m=0; m<meridians && li<NUM_LINES-6380; m++){
  const theta = (m/meridians)*Math.PI*2;
  const r = 10.8 + (m%4)*1.8;
  
  for(let j=0; j<ptsPerMeridian-1 && li<NUM_LINES-6380; j++){
    const phi0 = -Math.PI/2 + (j/ptsPerMeridian)*Math.PI;
    const phi1 = -Math.PI/2 + ((j+1)/ptsPerMeridian)*Math.PI;
    
    const p0 = new THREE.Vector3(
      leafPos.x + Math.cos(theta)*Math.cos(phi0)*r,
      leafPos.y + Math.sin(phi0)*r,
      leafPos.z + Math.sin(theta)*Math.cos(phi0)*r
    );
    const p1 = new THREE.Vector3(
      leafPos.x + Math.cos(theta)*Math.cos(phi1)*r,
      leafPos.y + Math.sin(phi1)*r,
      leafPos.z + Math.sin(theta)*Math.cos(phi1)*r
    );
    
    setLine(p0, p1);
  }
}

// CATEGORY E: Wall-to-wall spans — long threads across the room
let wallSpans = 0;
while(wallSpans<2600 && li<NUM_LINES-3780){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>14.0 && d<38.0){
    setLine(a, b);
    wallSpans++;
  }
}

// CATEGORY F: Horizontal crossing threads
for(let i=0; i<900 && li<NUM_LINES-2880; i++){
  const y = leafPos.y + (rng()-0.5)*18.0;
  const x0 = -hw + rng()*6.0;
  const z0 = (rng()-0.5)*ROOM.d*0.86;
  const x1 = hw - rng()*6.0;
  const z1 = (rng()-0.5)*ROOM.d*0.86;
  setLine(new THREE.Vector3(x0, y, z0), new THREE.Vector3(x1, y, z1));
}

// CATEGORY G: Vertical suspension threads
for(let i=0; i<420 && li<NUM_LINES-2460; i++){
  const x = (rng()-0.5)*ROOM.w*0.84;
  const z = (rng()-0.5)*ROOM.d*0.84;
  const y0 = -hh;
  const y1 = hh;
  setLine(new THREE.Vector3(x, y0, z), new THREE.Vector3(x, y1, z));
}

// CATEGORY H: Proximity web — local neighborhood connections
const THRESH = 9.2;
let webCount = 0, attempts = 0;
while(webCount<1600 && li<NUM_LINES-860 && attempts<12000){
  attempts++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  let best = null, bestD = Infinity;
  for(let j=0; j<4; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi===ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d<bestD && d>3.2 && d<THRESH){ bestD=d; best=anchors[bi]; }
  }
  if(!best) continue;
  setLine(a, best);
  webCount++;
}

// CATEGORY I: Fill remaining budget with medium-range threads
while(li<NUM_LINES-1){
  const a = anchors[Math.floor(rng()*anchors.length)];
  const b = anchors[Math.floor(rng()*anchors.length)];
  const d = a.distanceTo(b);
  if(d>7.0 && d<20.0){
    setLine(a, b);
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.072,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// CAMERA PATH — slow meditative drift inside the archive
const pathLen = 3000;
const dollyPath = [];

for(let i=0; i<pathLen; i++){
  const t = i/pathLen;
  let x, y, z;

  if(t<0.26){
    const lt = t/0.26;
    const angle = Math.PI*0.18 + lt*Math.PI*1.12;
    const r = 20.0 - lt*7.2;
    x = leafPos.x + Math.cos(angle)*r;
    y = leafPos.y + 10.2 - lt*6.4;
    z = leafPos.z + Math.sin(angle)*r;
  } else if(t<0.52){
    const lt = (t-0.26)/0.26;
    const angle = Math.PI*1.30 + lt*Math.PI*1.46;
    const r = 12.8 + Math.sin(lt*Math.PI*1.8)*2.6;
    x = leafPos.x + Math.cos(angle)*r;
    y = leafPos.y + 3.8 + Math.cos(lt*Math.PI*1.6)*2.2;
    z = leafPos.z + Math.sin(angle)*r;
  } else if(t<0.76){
    const lt = (t-0.52)/0.24;
    const angle = Math.PI*2.76 + lt*Math.PI*0.98;
    const r = 10.6 + Math.cos(lt*Math.PI)*2.4;
    x = leafPos.x + Math.cos(angle)*r;
    y = leafPos.y - 2.2 - lt*7.2;
    z = leafPos.z + Math.sin(angle)*r;
  } else {
    const lt = (t-0.76)/0.24;
    const angle = Math.PI*3.74 + lt*Math.PI*0.72;
    const r = 9.0 + lt*10.8;
    x = leafPos.x + Math.cos(angle)*r;
    y = leafPos.y + 4.6 + lt*6.2;
    z = leafPos.z + Math.sin(angle)*r;
  }
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const elapsed = (performance.now()-t0)/1000;

  // Leaf subtle rotation — remembering turns
  leafMesh.rotation.z = Math.PI/6 + elapsed*0.00016;
  leafMesh.rotation.y = Math.sin(elapsed*0.00022)*0.032;
  
  const breathScale = 1.0 + Math.sin(elapsed*0.00028)*0.008;
  leafMesh.scale.setScalar(breathScale);

  // Camera dolly
  const speed = 0.0000058;
  const pathT = (elapsed*speed)%1.0;
  const idx2 = pathT*(pathLen-1);
  const i0 = Math.floor(idx2)%pathLen;
  const i1 = (i0+1)%pathLen;
  const frac = idx2-Math.floor(idx2);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  camera.lookAt(
    leafPos.x + Math.sin(elapsed*0.000032)*0.14,
    leafPos.y + Math.cos(elapsed*0.000038)*0.12,
    leafPos.z + Math.sin(elapsed*0.000028)*0.10
  );

  key1.intensity = 0.024 + Math.sin(elapsed*0.000044)*0.0064;
  leafGlow.intensity = 0.016 + Math.sin(elapsed*0.000052)*0.0042;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
</html>
