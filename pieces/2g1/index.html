<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2g1 · folded leaves · harmattan</title>
<!-- MOTION: drift, intensity: gentle -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.55; font-size:10px; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="id">2g1</div>
<div class="hint">drag to orbit · scroll to zoom · click to regrow</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Folded Leaf Geometry Builder ── */
function buildLeafTwirl(seed, width, length, curvature, foldDepth, segments){
  const rng = mulberry32(seed);
  const positions = [];
  const colors = [];
  
  // calligraphic mid-vein with curling edges
  for (let i = 0; i <= segments; i++){
    const t = i / segments;
    const s = t * length;
    
    // parametric curve: helical twist + fold
    const twist = curvature * Math.sin(t * Math.PI * 2.5);
    const fold = foldDepth * Math.sin(t * Math.PI);
    
    // left edge
    const xL = -width * 0.5 * (1.0 - t * 0.3) + twist;
    const yL = s;
    const zL = fold * Math.cos(t * Math.PI - Math.PI * 0.5);
    
    // mid-vein
    const xM = twist * 0.3;
    const yM = s;
    const zM = fold * 0.5;
    
    // right edge
    const xR = width * 0.5 * (1.0 - t * 0.3) + twist;
    const yR = s;
    const zR = fold * Math.cos(t * Math.PI - Math.PI * 0.5);
    
    // jitter for organic feel
    const jitter = 0.02 * (rng() - 0.5);
    
    positions.push(xL + jitter, yL, zL);
    positions.push(xM, yM, zM);
    positions.push(xR + jitter, yR, zR);
    
    // color varies along length
    const warmth = 0.6 + 0.4 * t;
    for (let j = 0; j < 3; j++){
      colors.push(warmth, warmth * 0.7, warmth * 0.4);
    }
  }
  
  return { positions: new Float32Array(positions), colors: new Float32Array(colors) };
}

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

/* ── Build Leaf Arrangement ── */
function buildLeafArrangement(baseSeed, particleCount){
  const rng = mulberry32(baseSeed);
  const leafCount = 7;
  const allPositions = [];
  const allSeeds = [];
  const allLeafIds = [];
  
  for (let leafIdx = 0; leafIdx < leafCount; leafIdx++){
    const leafSeed = (baseSeed + leafIdx * 1e6) >>> 0;
    const leafRng = mulberry32(leafSeed);
    
    // each leaf has unique size and curve
    const width = 1.2 + leafRng() * 1.8;
    const length = 3.5 + leafRng() * 3.0;
    const curvature = 0.8 + leafRng() * 1.4;
    const foldDepth = 0.6 + leafRng() * 0.9;
    const segments = 28 + Math.floor(leafRng() * 12);
    
    const { positions } = buildLeafTwirl(leafSeed, width, length, curvature, foldDepth, segments);
    
    // arrange leaves in a bouquet formation
    const angle = (leafIdx / leafCount) * Math.PI * 2;
    const radius = 1.2 + leafRng() * 0.8;
    const offsetX = Math.cos(angle) * radius;
    const offsetZ = Math.sin(angle) * radius;
    const offsetY = -length * 0.5 + leafRng() * 0.8;
    
    // rotation around stem
    const rotY = angle + (leafRng() - 0.5) * 0.6;
    const rotZ = (leafRng() - 0.5) * 0.4;
    
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosZ = Math.cos(rotZ), sinZ = Math.sin(rotZ);
    
    // distribute particles along leaf strip
    const ptsPerLeaf = Math.floor(particleCount / leafCount);
    for (let i = 0; i < ptsPerLeaf; i++){
      const idx = Math.floor(leafRng() * (positions.length / 3));
      let x = positions[idx * 3];
      let y = positions[idx * 3 + 1];
      let z = positions[idx * 3 + 2];
      
      // surface jitter
      x += (leafRng() - 0.5) * 0.08;
      y += (leafRng() - 0.5) * 0.08;
      z += (leafRng() - 0.5) * 0.15;
      
      // rotate
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;
      const y1 = y * cosZ - z1 * sinZ;
      const z2 = y * sinZ + z1 * cosZ;
      
      // translate
      allPositions.push(x1 + offsetX, y1 + offsetY, z2 + offsetZ);
      allSeeds.push(leafRng());
      allLeafIds.push(leafIdx / leafCount);
    }
  }
  
  return {
    positions: new Float32Array(allPositions),
    seeds: new Float32Array(allSeeds),
    leafIds: new Float32Array(allLeafIds)
  };
}

/* ── Scene ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 200);
camera.position.set(7, 3, 12);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

const N = 120000;
let geom, points;

const uniforms = {
  uTime:  { value: 0 },
  uPixel: { value: renderer.getPixelRatio() },
  uReady: { value: 0 },
  uGust:  { value: 0 },
};

const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    uniform float uReady;
    uniform float uGust;
    attribute float seed;
    attribute float leafId;
    varying vec3 vCol;
    varying float vAlpha;

    void main(){
      vec3 p = position;
      float t = uTime * 0.5 + seed * 6.28;

      /* reveal animation: leaves uncurl from center */
      vec3 entry = vec3(0.0, -2.0, 0.0);
      float uncurl = smoothstep(0.0, 1.0, uReady);
      p = mix(entry, p, uncurl);

      /* gentle leaf tremor in wind */
      float leafPhase = leafId * 6.28 + uTime * 0.4;
      float leafSway = uGust * 0.08 * sin(leafPhase);
      p.x += leafSway * sin(t * 0.9);
      p.z += leafSway * cos(t * 0.7);
      
      /* subtle drift with gusts */
      vec3 windDir = normalize(vec3(0.7, 0.15, 0.5));
      float drift = uGust * 0.15 * smoothstep(0.3, 1.0, seed);
      p += windDir * drift;

      /* El Anatsui palette: ochre, sienna, copper, dust */
      vec3 ochre  = vec3(0.82, 0.61, 0.34);
      vec3 sienna = vec3(0.56, 0.38, 0.24);
      vec3 dust   = vec3(0.91, 0.82, 0.64);
      vec3 copper = vec3(0.76, 0.48, 0.30);
      
      /* color varies by leaf and position within leaf */
      float leafBlend = fract(leafId * 7.13);
      vec3 baseCol = mix(sienna, ochre, leafBlend);
      baseCol = mix(baseCol, copper, seed * 0.3);
      
      /* gusts lighten to dust */
      baseCol = mix(baseCol, dust, uGust * seed * 0.4);
      
      /* warm shimmer along edges */
      float shimmer = 0.03 * sin(seed * 40.0 + uTime * 1.2) * (0.5 + 0.5 * sin(t));
      baseCol += vec3(shimmer * 1.2, shimmer * 0.8, shimmer * 0.3);
      
      vCol = baseCol;

      /* alpha: gentle energy pulse */
      float energy = 0.5 + 0.5 * sin(t * 0.6);
      vAlpha = (0.42 + 0.38 * energy) * uncurl;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      /* reduced size for 120k particles */
      gl_PointSize = (0.85 + 0.5 * energy) * uPixel * (36.0/dist) * (0.35 + 0.65*uncurl);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      float a = exp(-r * 14.0) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

let revealStart = 0;

function regrow(seed){
  const { positions, seeds, leafIds } = buildLeafArrangement(seed, N);
  
  if (!geom){
    geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));
    geom.setAttribute('leafId',   new THREE.BufferAttribute(leafIds, 1));
    points = new THREE.Points(geom, mat);
    scene.add(points);
  } else {
    geom.attributes.position.array.set(positions); geom.attributes.position.needsUpdate = true;
    geom.attributes.seed.array.set(seeds);          geom.attributes.seed.needsUpdate = true;
    geom.attributes.leafId.array.set(leafIds);      geom.attributes.leafId.needsUpdate = true;
  }
  geom.computeBoundingSphere();
  revealStart = performance.now();
}

regrow(Math.floor(Math.random() * 1e9));
addEventListener('click', () => regrow(Math.floor(Math.random() * 1e9)));

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function smoothstep(a, b, x){
  const t = Math.max(0, Math.min(1, (x-a)/(b-a)));
  return t*t*(3-2*t);
}

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  uniforms.uTime.value = elapsed;

  if (revealStart > 0){
    uniforms.uReady.value = Math.min(1.0, (now - revealStart) / 2400);
  }

  /* harmattan gusts: swelling waves */
  const gustSlow = Math.pow(Math.sin(elapsed * 0.24) * 0.5 + 0.5, 1.6);
  const gustMed  = 0.16 * Math.sin(elapsed * 0.68 + 1.0);
  const gustFast = 0.07 * Math.sin(elapsed * 1.8 + 2.5);
  uniforms.uGust.value = Math.max(0, Math.min(1, gustSlow + gustMed + gustFast));

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
