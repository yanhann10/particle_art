<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>xoi · Shiota — Two Home Countries (Circulatory Moon)</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000000; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
</style>
</head>
<body>
<div class="id">xoi</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.fog = new THREE.FogExp2(0x030101, 0.012);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x080303, 0.12));

const pL = new THREE.PointLight(0xffe0c0, 0.3, 45, 1.6);
pL.position.set(-3.0, 12.0, 2.0);
scene.add(pL);

let seed = 83917264;
function rng(){ seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; }

// ── ROOM — tall architectural void
const ROOM = { w: 36, h: 28, d: 42 };
const hw = ROOM.w/2, hh = ROOM.h/2, hd = ROOM.d/2;

// ── SUSPENDED SPHERE — the still center, a pale moon caught in a circulatory cosmos
const sphereCenter = new THREE.Vector3(0.0, 1.8, 0.0);
const SPHERE_R = 2.2;

const sphereMat = new THREE.MeshStandardMaterial({
  color: 0xf2ece4,
  emissive: 0xf2ece4,
  emissiveIntensity: 0.6,
  roughness: 0.92,
  metalness: 0.0,
  transparent: true,
  opacity: 0.42
});
const sphereMesh = new THREE.Mesh(
  new THREE.SphereGeometry(SPHERE_R, 24, 16),
  sphereMat
);
sphereMesh.position.copy(sphereCenter);
scene.add(sphereMesh);

// Suspension wires — 4 thin dark lines from ceiling to sphere top
const suspArr = [];
for(let i = 0; i < 4; i++){
  const ox = (rng()-0.5)*0.6, oz = (rng()-0.5)*0.6;
  suspArr.push(
    sphereCenter.x + ox, hh, sphereCenter.z + oz,
    sphereCenter.x + ox*0.15, sphereCenter.y + SPHERE_R + 0.05, sphereCenter.z + oz*0.15
  );
}
const suspGeo = new THREE.BufferGeometry();
suspGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(suspArr), 3));
scene.add(new THREE.LineSegments(suspGeo, new THREE.LineBasicMaterial({
  color: 0x100604, transparent: true, opacity: 0.45
})));

// ── SPHERE SURFACE SAMPLER
function sphereSurf(){
  const u = rng()*2-1, theta = rng()*Math.PI*2;
  const r = Math.sqrt(1-u*u);
  return new THREE.Vector3(
    sphereCenter.x + r*Math.cos(theta)*SPHERE_R,
    sphereCenter.y + u*SPHERE_R,
    sphereCenter.z + r*Math.sin(theta)*SPHERE_R
  );
}

function wallPt(){
  const f = Math.floor(rng()*6);
  let x, y, z;
  switch(f){
    case 0: x=-hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 1: x= hw; y=(rng()-0.5)*ROOM.h; z=(rng()-0.5)*ROOM.d; break;
    case 2: y=-hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 3: y= hh; x=(rng()-0.5)*ROOM.w; z=(rng()-0.5)*ROOM.d; break;
    case 4: z=-hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
    default:z= hd; x=(rng()-0.5)*ROOM.w; y=(rng()-0.5)*ROOM.h; break;
  }
  return new THREE.Vector3(x, y, z);
}

// ── ANCHORS — radial shells at fibonacci-distributed angles
const NUM_ANCHORS = 800;
const anchors = [];

// Fibonacci sphere distribution at 3 shell radii
const goldenAngle = Math.PI * (3 - Math.sqrt(5));
const shells = [3.8, 7.5, 13.0];
const ptsPerShell = 60;
for(const sr of shells){
  for(let i = 0; i < ptsPerShell; i++){
    const y = 1 - (i / (ptsPerShell-1)) * 2;
    const radius = Math.sqrt(1 - y*y);
    const theta = goldenAngle * i;
    anchors.push(new THREE.Vector3(
      sphereCenter.x + Math.cos(theta)*radius*sr,
      sphereCenter.y + y*sr,
      sphereCenter.z + Math.sin(theta)*radius*sr
    ));
  }
}

// Void zones — deliberate windows of negative space
const voids = [
  { pos: new THREE.Vector3(sphereCenter.x + 7, sphereCenter.y + 3, sphereCenter.z - 6), r: 3.2 },
  { pos: new THREE.Vector3(sphereCenter.x - 6, sphereCenter.y - 4, sphereCenter.z + 5), r: 2.6 },
  { pos: new THREE.Vector3(sphereCenter.x + 4, sphereCenter.y + 8, sphereCenter.z + 7), r: 2.8 }
];
function inVoid(p){
  for(const v of voids) if(p.distanceTo(v.pos) < v.r) return true;
  return false;
}

// Fill remaining anchors with scattered field points
for(let i = anchors.length; i < NUM_ANCHORS; i++){
  let p;
  const r = rng();
  if(r < 0.5){
    // Near-sphere orbit points
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    p = sphereCenter.clone().add(dir.multiplyScalar(SPHERE_R + 0.8 + rng()*9.0));
  } else if(r < 0.7){
    p = wallPt().lerp(sphereCenter, 0.12 + rng()*0.4);
  } else {
    p = wallPt();
  }
  if(!inVoid(p)) anchors.push(p);
}

// ── BUILD 19,000 TAUT RED THREADS
const NUM_LINES = 19000;
const positions = new Float32Array(NUM_LINES * 6);
const lineDist = new Float32Array(NUM_LINES);
let li = 0;

function setLine(a, b){
  if(li >= NUM_LINES) return;
  const idx = li * 6;
  positions[idx]=a.x; positions[idx+1]=a.y; positions[idx+2]=a.z;
  positions[idx+3]=b.x; positions[idx+4]=b.y; positions[idx+5]=b.z;
  const mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5, mz=(a.z+b.z)*0.5;
  const dx=mx-sphereCenter.x, dy=my-sphereCenter.y, dz=mz-sphereCenter.z;
  lineDist[li] = Math.sqrt(dx*dx+dy*dy+dz*dz);
  li++;
}

// Ceiling suspension threads
for(let i = 0; i < 14 && li < NUM_LINES; i++){
  const cx = sphereCenter.x + (rng()-0.5)*4;
  const cz = sphereCenter.z + (rng()-0.5)*4;
  setLine(new THREE.Vector3(cx, hh, cz), sphereSurf());
}

// Rule 1: convergence — threads from anchors/walls to sphere surface (~55%)
// Blood vessels converging on the heart
const catA = Math.floor(NUM_LINES * 0.55);
for(let i = 0; i < catA && li < NUM_LINES; i++){
  let a;
  if(rng() < 0.45){
    a = anchors[Math.floor(rng()*anchors.length)];
  } else {
    a = wallPt();
  }
  if(inVoid(a)){ i--; continue; }

  const target = sphereSurf();
  // 10% stop short — yearning threads that never arrive
  if(rng() < 0.10){
    const dir = a.clone().sub(target).normalize();
    target.add(dir.multiplyScalar(0.2 + rng()*1.8));
    setLine(a, target);
  } else {
    setLine(a, target);
  }
}

// Rule 2: anchor-to-anchor structural web (~25%)
const THRESHOLD = 7.0;
let r2 = 0;
const r2target = Math.floor(NUM_LINES * 0.25);
let r2att = 0;
while(r2 < r2target && li < NUM_LINES && r2att < 80000){
  r2att++;
  const ai = Math.floor(rng()*anchors.length);
  const a = anchors[ai];
  if(inVoid(a)) continue;

  let best = null, bestD = Infinity;
  for(let j = 0; j < 10; j++){
    const bi = Math.floor(rng()*anchors.length);
    if(bi === ai) continue;
    const d = a.distanceTo(anchors[bi]);
    if(d < bestD && d > 0.4 && d < THRESHOLD){ bestD = d; best = anchors[bi]; }
  }
  if(!best || inVoid(best)) continue;

  setLine(a, best);
  r2++;

  // Dendritic branching — capillary forks
  if(rng() < 0.18 && li < NUM_LINES - 2){
    const mid = a.clone().lerp(best, 0.25 + rng()*0.5);
    const bDir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    const bEnd = mid.clone().add(bDir.multiplyScalar(0.3 + rng()*1.0));
    if(!inVoid(bEnd)){
      setLine(mid, bEnd);
      r2++;
      if(rng() < 0.25 && li < NUM_LINES){
        const mid2 = mid.clone().lerp(bEnd, 0.5 + rng()*0.3);
        const bDir2 = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
        const bEnd2 = mid2.clone().add(bDir2.multiplyScalar(0.15 + rng()*0.5));
        if(!inVoid(bEnd2)){ setLine(mid2, bEnd2); r2++; }
      }
    }
  }
}

// Radial spokes — threads that pass THROUGH the sphere's volume vicinity
// Creating an aura of convergence
const spokeCount = Math.floor(NUM_LINES * 0.08);
for(let i = 0; i < spokeCount && li < NUM_LINES; i++){
  const theta = rng()*Math.PI*2;
  const phi2 = rng()*Math.PI;
  const dir = new THREE.Vector3(
    Math.sin(phi2)*Math.cos(theta),
    Math.cos(phi2),
    Math.sin(phi2)*Math.sin(theta)
  );
  const r1 = SPHERE_R + 1.5 + rng()*4.0;
  const r2v = SPHERE_R + 1.5 + rng()*8.0;
  const a = sphereCenter.clone().add(dir.clone().multiplyScalar(r1));
  const b = sphereCenter.clone().add(dir.clone().multiplyScalar(-r2v));
  if(!inVoid(a) && !inVoid(b)) setLine(a, b);
}

// Fill remainder with wall-spanning structural threads
while(li < NUM_LINES){
  const a = wallPt();
  const b = rng() < 0.5 ? sphereSurf() : wallPt();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  if(!inVoid(mid)) setLine(a, b);
}

const basePositions = new Float32Array(positions);

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const threads = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
  color: 0xc20018,
  transparent: true,
  opacity: 0.065,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  fog: true
}));
scene.add(threads);

// ── DARK FRAGMENTS — charred paper / diary shreds caught in the mesh
const NUM_FRAGMENTS = 40;
for(let i = 0; i < NUM_FRAGMENTS; i++){
  const sz = 0.025 + rng()*0.09;
  const fw = sz * (0.3 + rng()*0.5);
  const fh = sz * (0.7 + rng()*0.9);
  const leafGeo = new THREE.BufferGeometry();
  const verts = new Float32Array([
    fw*(-0.3+rng()*0.2), fh*0.5, 0,
    -fw*0.5, fh*(-0.1+rng()*0.2), 0,
    fw*(0.1-rng()*0.3), -fh*0.5, 0,
    fw*(-0.3+rng()*0.2), fh*0.5, 0,
    fw*(0.4+rng()*0.2), fh*(rng()*0.15), 0,
    fw*(0.1-rng()*0.3), -fh*0.5, 0
  ]);
  leafGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));

  const d = 0.006 + rng()*0.02;
  const leafMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(d, d*0.15, d*0.06),
    transparent: true,
    opacity: 0.12 + rng()*0.3,
    side: THREE.DoubleSide
  });
  const frag = new THREE.Mesh(leafGeo, leafMat);

  if(rng() < 0.65){
    const si = Math.floor(rng()*li)*6;
    const t = 0.1 + rng()*0.8;
    frag.position.set(
      basePositions[si]*(1-t) + basePositions[si+3]*t,
      basePositions[si+1]*(1-t) + basePositions[si+4]*t,
      basePositions[si+2]*(1-t) + basePositions[si+5]*t
    );
  } else {
    const dir = new THREE.Vector3(rng()-0.5, rng()-0.5, rng()-0.5).normalize();
    frag.position.copy(sphereCenter).add(dir.multiplyScalar(SPHERE_R + 0.5 + rng()*8.0));
  }
  frag.rotation.set(rng()*6.28, rng()*6.28, rng()*6.28);
  scene.add(frag);
}

// ── CAMERA PATH — intimate slow drift inside the web
const pathLen = 700;
const dollyPath = [];
for(let i = 0; i < pathLen; i++){
  const t = i / pathLen;
  const p = t * Math.PI * 2;
  const cx = sphereCenter.x, cy = sphereCenter.y, cz = sphereCenter.z;
  // Asymmetric orbit — closer approach on one side, wider on the other
  const rX = 5.0 + Math.sin(p*0.5)*2.0;
  const rZ = 7.0 + Math.cos(p*0.7)*2.5;
  const x = cx + Math.sin(p) * rX + Math.sin(p*1.3+0.8)*1.0;
  // Vertical drift — slow rise, linger at sphere level, descend
  const yBase = cy + 0.5;
  const yWave = Math.sin(p*0.35+0.3)*5.0 + Math.cos(p*0.8)*1.2;
  const y = yBase + yWave;
  const z = cz + Math.cos(p) * rZ + Math.cos(p*0.5+1.5)*1.8;
  dollyPath.push(new THREE.Vector3(x, y, z));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const t0 = performance.now();

function loop(){
  const t = (performance.now() - t0) / 1000;

  // Thread micro-breathing — imperceptible anchor jitter (<0.5%)
  const arr = lineGeo.attributes.position.array;
  for(let i = 0; i < li; i++){
    const idx = i * 6;
    const dist = lineDist[i];
    const amp = 0.0008 * Math.max(0, 1.0 - dist / 25.0);
    const phase = basePositions[idx]*0.3 + basePositions[idx+1]*0.28 + i*0.0015;
    const breath = Math.sin(t*0.03 + phase) * amp;
    for(let v = 0; v < 2; v++){
      const vi = idx + v*3;
      arr[vi]   = basePositions[vi]   + breath*0.35;
      arr[vi+1] = basePositions[vi+1] + breath*0.28;
      arr[vi+2] = basePositions[vi+2] + breath*0.32;
    }
  }
  lineGeo.attributes.position.needsUpdate = true;

  // Glacial camera drift
  const speed = 0.001;
  const pathT = (t * speed) % 1.0;
  const idx = pathT * (pathLen - 1);
  const i0 = Math.floor(idx) % pathLen;
  const i1 = (i0 + 1) % pathLen;
  const frac = idx - Math.floor(idx);
  camera.position.lerpVectors(dollyPath[i0], dollyPath[i1], frac);

  // Look toward sphere — the still center
  const look = sphereCenter.clone();
  look.x += Math.sin(t*0.004)*0.2;
  look.y += Math.cos(t*0.003)*0.15;
  look.z += Math.sin(t*0.0035)*0.12;
  camera.lookAt(look);

  // Gentle light drift
  pL.position.x = -3.0 + Math.sin(t*0.002)*0.6;
  pL.position.y = 12.0 + Math.cos(t*0.0018)*0.4;
  pL.position.z = 2.0 + Math.cos(t*0.003)*0.5;

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>

</body>
