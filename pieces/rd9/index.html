<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- MOTION: swarm, intensity: gentle -->
<title>rd9 · posterized murmuration · Reynolds flocking × risograph</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0d0b0f; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size: 11px; letter-spacing: 0.06em; color:#cdd2dc; }
  .hint { position:fixed; left:14px; top:14px; opacity:0.6; font-size: 11px; letter-spacing: 0.04em; }
  .src  { position:fixed; right:14px; top:14px; opacity:0.4; font-size: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="id">rd9</div>
<div class="hint" id="hint">Reynolds 1986 · risograph posterization · 8-step quantize</div>
<div class="src">Craig Reynolds · Tadanori Yokoo screen-print palette</div>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0, 50);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0d0b0f, 1);
document.body.appendChild(renderer.domElement);

/* ── Post-processing: fullscreen quad for posterization + grain ── */
const postScene = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const rt = new THREE.WebGLRenderTarget(innerWidth * Math.min(devicePixelRatio,2),
  innerHeight * Math.min(devicePixelRatio,2));

const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: { value: rt.texture },
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;

    // simple hash for grain
    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }

    void main(){
      vec4 col = texture2D(tDiffuse, vUv);

      // posterize to 8 discrete steps per channel
      float steps = 8.0;
      col.rgb = floor(col.rgb * steps + 0.5) / steps;

      // risograph grain — subtle paper texture
      float grain = hash(vUv * uRes + fract(uTime * 0.7) * 100.0);
      grain = (grain - 0.5) * 0.06;
      col.rgb += grain;

      // slight warm tint to the darkest values (ink-on-paper feel)
      float lum = dot(col.rgb, vec3(0.299, 0.587, 0.114));
      col.rgb += vec3(0.012, 0.006, 0.0) * (1.0 - lum);

      gl_FragColor = vec4(col.rgb, 1.0);
    }
  `
});

const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postScene.add(postQuad);

/* ── Boids ── */
const N = 3200;
const positions = new Float32Array(N * 3);
const velocities = new Float32Array(N * 3);
const seeds = new Float32Array(N);
const trails = new Float32Array(N);

for (let i = 0; i < N; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 8 + Math.random() * 12;
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);

  const vtheta = Math.random() * Math.PI * 2;
  const vphi = Math.acos(2 * Math.random() - 1);
  const speed = 0.8 + Math.random() * 0.4;
  velocities[i*3]   = speed * Math.sin(vphi) * Math.cos(vtheta);
  velocities[i*3+1] = speed * Math.sin(vphi) * Math.sin(vtheta);
  velocities[i*3+2] = speed * Math.cos(vphi);

  seeds[i] = Math.random();
  trails[i] = Math.random() * 0.3;
}

const uniforms = {
  uTime: { value: 0 },
  uPixel: { value: renderer.getPixelRatio() }
};

/* Palette: Tadanori Yokoo risograph inks — fluorescent pink, deep teal, warm marigold
   These saturated hues posterize into distinct, readable bands */
const mat = new THREE.ShaderMaterial({
  uniforms,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform float uTime;
    uniform float uPixel;
    attribute float seed;
    attribute float trail;
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec3 p = position;
      float phase = seed * 6.28 + uTime * 0.3;
      float pulse = 0.5 + 0.5 * sin(phase);

      // risograph ink palette: fluorescent pink → deep teal → marigold
      vec3 c0 = vec3(0.85, 0.20, 0.42); // fluorescent pink
      vec3 c1 = vec3(0.12, 0.48, 0.52); // deep teal
      vec3 c2 = vec3(0.94, 0.72, 0.28); // marigold

      float blend = smoothstep(0.25, 0.65, pulse);
      vCol = mix(c0, c1, blend);
      vCol = mix(vCol, c2, smoothstep(0.65, 1.0, pulse) * 0.7);

      // boost saturation so quantized steps read clearly
      vCol *= 1.15;

      vAlpha = 0.55 + 0.45 * pulse + trail * 0.35;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = -mv.z;
      gl_PointSize = (2.0 + 1.4*pulse + trail*2.0) * uPixel * (60.0/dist);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;
      // harder edge for screen-print feel (less gaussian, more disc)
      float a = smoothstep(0.25, 0.08, r) * vAlpha;
      gl_FragColor = vec4(vCol * a, a);
    }
  `
});

const geom = new THREE.BufferGeometry();
geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geom.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
geom.setAttribute('trail', new THREE.BufferAttribute(trails, 1));
const points = new THREE.Points(geom, mat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rt.setSize(innerWidth * Math.min(devicePixelRatio,2),
             innerHeight * Math.min(devicePixelRatio,2));
  postMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

/* ── Reynolds boids ── */
const PERCEPTION = 3.5;
const SEPARATION_DIST = 1.2;
const COHESION_FORCE = 0.02;
const ALIGNMENT_FORCE = 0.08;
const SEPARATION_FORCE = 0.15;
const BOUNDARY_FORCE = 0.25;
const MAX_SPEED = 1.8;
const MIN_SPEED = 0.6;
const BOUNDARY = 25;

const avgVel = new THREE.Vector3();
const avgPos = new THREE.Vector3();
const steering = new THREE.Vector3();

const CELL_SIZE = PERCEPTION * 1.5;
let spatialGrid = new Map();

function getSpatialKey(x, y, z){
  return `${Math.floor(x/CELL_SIZE)},${Math.floor(y/CELL_SIZE)},${Math.floor(z/CELL_SIZE)}`;
}

function rebuildSpatialGrid(){
  spatialGrid.clear();
  for (let i = 0; i < N; i++){
    const key = getSpatialKey(positions[i*3], positions[i*3+1], positions[i*3+2]);
    if (!spatialGrid.has(key)) spatialGrid.set(key, []);
    spatialGrid.get(key).push(i);
  }
}

function getNeighborCells(x, y, z){
  const cells = [];
  const cx = Math.floor(x/CELL_SIZE);
  const cy = Math.floor(y/CELL_SIZE);
  const cz = Math.floor(z/CELL_SIZE);
  for (let dx = -1; dx <= 1; dx++)
    for (let dy = -1; dy <= 1; dy++)
      for (let dz = -1; dz <= 1; dz++){
        const key = `${cx+dx},${cy+dy},${cz+dz}`;
        if (spatialGrid.has(key)) cells.push(...spatialGrid.get(key));
      }
  return cells;
}

let frameCount = 0;
const hintEl = document.getElementById('hint');

function updateBoids(dt){
  rebuildSpatialGrid();

  for (let i = 0; i < N; i++){
    const px = positions[i*3], py = positions[i*3+1], pz = positions[i*3+2];
    const vx = velocities[i*3], vy = velocities[i*3+1], vz = velocities[i*3+2];

    avgPos.set(0,0,0); avgVel.set(0,0,0); steering.set(0,0,0);
    let cohesionCount = 0, alignmentCount = 0;

    const neighbors = getNeighborCells(px, py, pz);

    for (const j of neighbors){
      if (i === j) continue;
      const dx = positions[j*3]-px, dy = positions[j*3+1]-py, dz = positions[j*3+2]-pz;
      const distSq = dx*dx + dy*dy + dz*dz;

      if (distSq < PERCEPTION*PERCEPTION && distSq > 0.01){
        const dist = Math.sqrt(distSq);

        avgPos.x += positions[j*3]; avgPos.y += positions[j*3+1]; avgPos.z += positions[j*3+2];
        cohesionCount++;

        avgVel.x += velocities[j*3]; avgVel.y += velocities[j*3+1]; avgVel.z += velocities[j*3+2];
        alignmentCount++;

        if (dist < SEPARATION_DIST){
          const force = (SEPARATION_DIST - dist) / SEPARATION_DIST;
          steering.x -= (dx/dist)*force*SEPARATION_FORCE;
          steering.y -= (dy/dist)*force*SEPARATION_FORCE;
          steering.z -= (dz/dist)*force*SEPARATION_FORCE;
        }
      }
    }

    if (cohesionCount > 0){
      avgPos.multiplyScalar(1/cohesionCount);
      steering.x += (avgPos.x-px)*COHESION_FORCE;
      steering.y += (avgPos.y-py)*COHESION_FORCE;
      steering.z += (avgPos.z-pz)*COHESION_FORCE;
    }

    if (alignmentCount > 0){
      avgVel.multiplyScalar(1/alignmentCount);
      steering.x += (avgVel.x-vx)*ALIGNMENT_FORCE;
      steering.y += (avgVel.y-vy)*ALIGNMENT_FORCE;
      steering.z += (avgVel.z-vz)*ALIGNMENT_FORCE;
    }

    const distFromCenter = Math.sqrt(px*px + py*py + pz*pz);
    if (distFromCenter > BOUNDARY*0.7){
      const force = Math.pow((distFromCenter - BOUNDARY*0.7) / (BOUNDARY*0.3), 2);
      steering.x -= (px/distFromCenter)*force*BOUNDARY_FORCE;
      steering.y -= (py/distFromCenter)*force*BOUNDARY_FORCE;
      steering.z -= (pz/distFromCenter)*force*BOUNDARY_FORCE;
    }

    velocities[i*3]   += steering.x*dt;
    velocities[i*3+1] += steering.y*dt;
    velocities[i*3+2] += steering.z*dt;

    const speed = Math.sqrt(velocities[i*3]**2 + velocities[i*3+1]**2 + velocities[i*3+2]**2);
    if (speed > MAX_SPEED){
      velocities[i*3]   *= MAX_SPEED/speed;
      velocities[i*3+1] *= MAX_SPEED/speed;
      velocities[i*3+2] *= MAX_SPEED/speed;
    } else if (speed < MIN_SPEED && speed > 0.01){
      velocities[i*3]   *= MIN_SPEED/speed;
      velocities[i*3+1] *= MIN_SPEED/speed;
      velocities[i*3+2] *= MIN_SPEED/speed;
    }

    positions[i*3]   += velocities[i*3]*dt;
    positions[i*3+1] += velocities[i*3+1]*dt;
    positions[i*3+2] += velocities[i*3+2]*dt;

    trails[i] = THREE.MathUtils.lerp(trails[i], speed/MAX_SPEED, 0.1);
  }

  geom.attributes.position.needsUpdate = true;
  geom.attributes.trail.needsUpdate = true;
  geom.computeBoundingSphere();
}

const centroid = new THREE.Vector3();
function updateCamera(){
  centroid.set(0,0,0);
  for (let i = 0; i < N; i++){
    centroid.x += positions[i*3];
    centroid.y += positions[i*3+1];
    centroid.z += positions[i*3+2];
  }
  centroid.multiplyScalar(1/N);

  const orbitRadius = 45;
  const angle = performance.now() * 0.0000064;
  camera.position.x = centroid.x + Math.cos(angle) * orbitRadius;
  camera.position.z = centroid.z + Math.sin(angle) * orbitRadius;
  camera.position.y = centroid.y + Math.sin(angle * 0.5) * 12;
  camera.lookAt(centroid);
}

let lastTime = performance.now();
const start = performance.now();

function loop(){
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  const t = (now - start) / 1000;

  frameCount++;
  if (frameCount % 60 === 0){
    let avgSpeed = 0;
    for (let i = 0; i < N; i++){
      avgSpeed += Math.sqrt(velocities[i*3]**2 + velocities[i*3+1]**2 + velocities[i*3+2]**2);
    }
    avgSpeed /= N;
    const coherence = (avgSpeed / MAX_SPEED * 100).toFixed(0);
    hintEl.textContent = `murmuration coherence: ${coherence}% · ${N} boids · risograph 8-step`;
  }

  uniforms.uTime.value = t;
  postMat.uniforms.uTime.value = t;
  updateBoids(dt * 60);
  updateCamera();

  // render scene to offscreen target, then posterize to screen
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCamera);

  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  function _react(action){fetch('/api/react',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({piece_id:pid,action:action})}).catch(function(){});}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';_react('favorite');};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';_react('dismiss');goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
