<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nne · Dark Ecology — 540 million years</title>
<!-- MOTION: drift, intensity: calm -->
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1a1612; }
canvas { display:block; }
.id { position:fixed; left:14px; bottom:12px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#cdd2dc; opacity:0.55; font-size:11px; letter-spacing:0.06em; z-index:5; }
.counter { position:fixed; right:18px; top:18px; font-family:ui-monospace,"SF Mono",Menlo,monospace; color:#5a524a; opacity:0.72; font-size:10px; line-height:1.5; text-align:right; z-index:5; letter-spacing:0.03em; }
</style>
</head>
<body>
<div class="id">nne</div>
<div class="counter" id="counter">
  <div id="mya">540.0 Mya</div>
  <div id="remain">80000 remain</div>
  <div id="temp">+0.0°C</div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1612);
scene.fog = new THREE.FogExp2(0x1a1612, 0.028);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 22);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambLight = new THREE.AmbientLight(0x3a3228, 0.4);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0x6a5d48, 0.6);
dirLight.position.set(-8, 12, 5);
scene.add(dirLight);

let rngState = 540183926;
function rng(){ 
  rngState |= 0; 
  rngState = rngState + 0x6d2b79f5 | 0;
  let t = Math.imul(rngState ^ rngState >>> 15, 1 | rngState);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

// Geological timeline: Cambrian Explosion (540 Mya) → present
// Real-time 1 sec = 1 million years
// Mass extinction events as particle culls
const EXTINCTIONS = [
  { mya: 444, name: 'Ordovician–Silurian', cull: 0.86 },
  { mya: 375, name: 'Late Devonian', cull: 0.75 },
  { mya: 252, name: 'Permian–Triassic', cull: 0.96 },
  { mya: 201, name: 'Triassic–Jurassic', cull: 0.80 },
  { mya: 66, name: 'Cretaceous–Paleogene', cull: 0.76 }
];

// Particle system representing species-lineages
const PARTICLE_COUNT = 80000;
const positions = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);
const alive = new Uint8Array(PARTICLE_COUNT);
const birthTime = new Float32Array(PARTICLE_COUNT);

// Initialize particles in a shallow horizontal field (seabed)
for (let i = 0; i < PARTICLE_COUNT; i++){
  const i3 = i * 3;
  positions[i3]     = (rng() - 0.5) * 80;
  positions[i3 + 1] = (rng() - 0.5) * 2 + 0.5;
  positions[i3 + 2] = (rng() - 0.5) * 80;
  
  // Very slow drift velocities — geological pacing
  velocities[i3]     = (rng() - 0.5) * 0.002;
  velocities[i3 + 1] = (rng() - 0.5) * 0.0005;
  velocities[i3 + 2] = (rng() - 0.5) * 0.002;
  
  // Muted earth palette: ochre, burnt sienna, dead grey
  const paletteChoice = Math.floor(rng() * 5);
  let r, g, b;
  switch(paletteChoice){
    case 0: r=0.52; g=0.42; b=0.31; break; // ochre
    case 1: r=0.38; g=0.28; b=0.22; break; // burnt umber
    case 2: r=0.44; g=0.36; b=0.28; break; // tan
    case 3: r=0.32; g=0.30; b=0.28; break; // stone grey
    case 4: r=0.28; g=0.24; b=0.20; break; // dark earth
  }
  colors[i3]     = r + (rng() - 0.5) * 0.1;
  colors[i3 + 1] = g + (rng() - 0.5) * 0.1;
  colors[i3 + 2] = b + (rng() - 0.5) * 0.1;
  
  alive[i] = 1;
  birthTime[i] = 0;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.12,
  vertexColors: true,
  transparent: true,
  opacity: 0.65,
  blending: THREE.NormalBlending,
  depthWrite: false,
  fog: true
});

const particles = new THREE.Points(geo, mat);
scene.add(particles);

// Deformation field — simulate exponential warming as hyperobject
// CO₂ ppm: pre-industrial 280 → 2024 ~420 → projected 2100 ~700+
// Map geological time to temperature anomaly
function tempAnomaly(mya){
  if (mya > 200) return 0;
  if (mya > 100) return (200 - mya) / 100 * 0.5;
  if (mya > 10) return 0.5 + (100 - mya) / 90 * 0.3;
  // Anthropocene spike
  return 0.8 + Math.pow((10 - mya) / 10, 2.5) * 1.8;
}

// Counter DOM update
const myaEl = document.getElementById('mya');
const remainEl = document.getElementById('remain');
const tempEl = document.getElementById('temp');

let lastExtinctionIndex = -1;
let aliveCount = PARTICLE_COUNT;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();

function loop(){
  const elapsed = (performance.now() - start) / 1000;
  
  // Timeline: 540 Mya → 0 (present)
  // 1 real second = 1 million years
  const mya = Math.max(0, 540 - elapsed);
  const temp = tempAnomaly(mya);
  
  // Check for extinction events
  for (let ei = lastExtinctionIndex + 1; ei < EXTINCTIONS.length; ei++){
    if (mya <= EXTINCTIONS[ei].mya){
      const event = EXTINCTIONS[ei];
      const cullCount = Math.floor(aliveCount * event.cull);
      let culled = 0;
      for (let i = 0; i < PARTICLE_COUNT && culled < cullCount; i++){
        if (alive[i] === 1 && rng() < event.cull){
          alive[i] = 0;
          culled++;
        }
      }
      aliveCount -= culled;
      lastExtinctionIndex = ei;
      break;
    }
  }
  
  // Update counter
  myaEl.textContent = mya.toFixed(1) + ' Mya';
  remainEl.textContent = aliveCount + ' remain';
  tempEl.textContent = (temp > 0 ? '+' : '') + temp.toFixed(1) + '°C';
  
  // Particle drift with temperature-induced turbulence
  const turbulence = temp * 0.0008;
  const posAttr = geo.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++){
    if (alive[i] === 0) continue;
    
    const i3 = i * 3;
    
    // Apply velocity
    positions[i3]     += velocities[i3];
    positions[i3 + 1] += velocities[i3 + 1];
    positions[i3 + 2] += velocities[i3 + 2];
    
    // Temperature-driven turbulence
    positions[i3]     += (rng() - 0.5) * turbulence;
    positions[i3 + 1] += (rng() - 0.5) * turbulence * 0.5;
    positions[i3 + 2] += (rng() - 0.5) * turbulence;
    
    // Gentle vertical stratification — older particles settle
    const age = elapsed - birthTime[i];
    positions[i3 + 1] -= age * 0.00001;
    
    // Wrap bounds
    if (Math.abs(positions[i3]) > 50){
      positions[i3] = (rng() - 0.5) * 80;
    }
    if (Math.abs(positions[i3 + 2]) > 50){
      positions[i3 + 2] = (rng() - 0.5) * 80;
    }
    if (positions[i3 + 1] < -5){
      positions[i3 + 1] = 3;
    }
    if (positions[i3 + 1] > 8){
      positions[i3 + 1] = -2;
    }
  }
  posAttr.needsUpdate = true;
  
  // Fade dead particles
  const colAttr = geo.attributes.color;
  for (let i = 0; i < PARTICLE_COUNT; i++){
    if (alive[i] === 0){
      const i3 = i * 3;
      colors[i3]     *= 0.996;
      colors[i3 + 1] *= 0.996;
      colors[i3 + 2] *= 0.996;
    }
  }
  colAttr.needsUpdate = true;
  
  // Camera slow orbit rise — viewing the field from above as time compresses
  const orbitSpeed = 0.008;
  const orbitRadius = 28 + Math.sin(elapsed * 0.003) * 4;
  const heightRise = 8 + (540 - mya) / 540 * 15;
  camera.position.set(
    Math.cos(elapsed * orbitSpeed) * orbitRadius,
    heightRise,
    Math.sin(elapsed * orbitSpeed) * orbitRadius
  );
  
  // Look at centroid of alive particles
  let cx = 0, cy = 0, cz = 0, count = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++){
    if (alive[i] === 1){
      const i3 = i * 3;
      cx += positions[i3];
      cy += positions[i3 + 1];
      cz += positions[i3 + 2];
      count++;
    }
  }
  if (count > 0){
    cx /= count; cy /= count; cz /= count;
    camera.lookAt(cx, cy, cz);
  } else {
    camera.lookAt(0, 0, 0);
  }
  
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
