<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a2p · AUTO{}Construccion descendant</title>
<!-- MOTION: assembly, intensity: vigorous -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0908; overflow:hidden;
               color:#cad6c0; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }

<body>
<div class="id">a2p</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── L-system grammar for speculative housing ── */
const RULES = {
  'R': [ // room
    { p: 0.4, s: 'R[+W]R[-W]' },
    { p: 0.3, s: 'RW[/R]' },
    { p: 0.2, s: 'R[^W][&W]' },
    { p: 0.1, s: 'WRW' }
  ],
  'W': [ // wall
    { p: 0.6, s: 'WW' },
    { p: 0.3, s: 'W[+W]' },
    { p: 0.1, s: 'W' }
  ]
};

const ANGLE = THREE.MathUtils.degToRad(90);
const UNIT = 2.4; // one voxel unit

function expand(axiom, depth, rng){
  let s = axiom;
  for (let d = 0; d < depth; d++){
    let out = '';
    for (const ch of s){
      if (ch in RULES){
        const r = rng();
        let acc = 0;
        for (const opt of RULES[ch]){
          acc += opt.p;
          if (r <= acc){ out += opt.s; break; }
        }
      } else out += ch;
    }
    s = out;
  }
  return s;
}

function voxelTurtle(str){
  const H = new THREE.Vector3(1,0,0);
  const L = new THREE.Vector3(0,0,-1);
  const U = new THREE.Vector3(0,1,0);
  const stack = [];
  const voxels = [];
  let pos = new THREE.Vector3(0,0,0);
  let h = H.clone(), l = L.clone(), u = U.clone();
  let gen = 0;

  const rotate = (axis, ang) => {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, ang);
    h.applyQuaternion(q); l.applyQuaternion(q); u.applyQuaternion(q);
  };

  for (const ch of str){
    switch(ch){
      case 'R': { // room = 3x3x3 voxel cluster
        for (let dx = -1; dx <= 1; dx++){
          for (let dy = -1; dy <= 1; dy++){
            for (let dz = -1; dz <= 1; dz++){
              const vp = pos.clone().addScaledVector(h, dx*UNIT)
                                     .addScaledVector(u, dy*UNIT)
                                     .addScaledVector(l, dz*UNIT);
              voxels.push({ pos: vp.clone(), type: 'room', gen, seed: Math.random() });
            }
          }
        }
        pos.addScaledVector(h, UNIT*3);
        break;
      }
      case 'W': { // wall = 1x3x1 stack
        for (let dy = 0; dy < 3; dy++){
          const vp = pos.clone().addScaledVector(u, dy*UNIT);
          voxels.push({ pos: vp.clone(), type: 'wall', gen, seed: Math.random() });
        }
        pos.addScaledVector(h, UNIT);
        break;
      }
      case '+': rotate(u, +ANGLE); break;
      case '-': rotate(u, -ANGLE); break;
      case '&': rotate(l, +ANGLE); break;
      case '^': rotate(l, -ANGLE); break;
      case '/': rotate(h, +ANGLE); break;
      case '\\': rotate(h, -ANGLE); break;
      case '[':
        stack.push({ pos:pos.clone(), h:h.clone(), l:l.clone(), u:u.clone(), gen });
        gen += 1;
        break;
      case ']': {
        const f = stack.pop();
        pos=f.pos; h=f.h; l=f.l; u=f.u; gen=f.gen;
        break;
      }
    }
  }
  return voxels;
}

/* ── Scene ── */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0908, 0.015);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(28, 18, 28);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0908, 1);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 6, 0);

/* ── Instanced cubes ── */
const cubeGeo = new THREE.BoxGeometry(UNIT*0.92, UNIT*0.92, UNIT*0.92);
const N = 12000;
const mesh = new THREE.InstancedMesh(cubeGeo, new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uBeat: { value: 0 },
    uGlitchPhase: { value: 0 }
  },
  vertexShader: `
    uniform float uTime;
    uniform float uBeat;
    uniform float uGlitchPhase;
    attribute vec3 iOffset;
    attribute float iSeed;
    attribute float iType;
    attribute float iBirthTime;
    attribute float iGen;
    attribute vec3 iVelocity;
    attribute float iState;
    varying vec3 vCol;
    varying float vAlpha;
    varying float vGlitch;
    varying vec3 vNormal;
    varying vec3 vViewDir;

    void main(){
      float elapsed = uTime - iBirthTime;
      vec3 p = iOffset;

      float assemblyDur = 2.5;
      float assembleProg = clamp(elapsed / assemblyDur, 0.0, 1.0);
      assembleProg = assembleProg * assembleProg * (3.0 - 2.0 * assembleProg);

      // assembly: cubes snap into grid from randomized entry
      vec3 entry = vec3(
        iSeed * 60.0 - 30.0,
        40.0 + iSeed * 20.0,
        (iSeed * 0.7 - 0.35) * 60.0
      );
      p = mix(entry, iOffset, assembleProg);

      // collapse: when beat pulses, walls dissolve into falling cubes
      float collapseT = iState; // 0=stable, 1=falling
      float fallDist = collapseT * 25.0;
      p.y -= fallDist;
      p += iVelocity * collapseT * 8.0;

      // glitch: high-beat moments snap cubes off grid
      float glitchAmp = uBeat * uGlitchPhase * (0.3 + 0.7 * iSeed);
      float gx = sin(uTime * 12.0 + iSeed * 62.83) * glitchAmp;
      float gy = cos(uTime * 9.0 + iSeed * 43.2) * glitchAmp;
      float gz = sin(uTime * 15.0 + iSeed * 51.3) * glitchAmp;
      p += vec3(gx, gy, gz) * 1.8;

      vGlitch = glitchAmp;

      // palette: rebar gray (room), cinder block (wall), neon code-flash (glitch)
      vec3 rebarGray = vec3(0.38, 0.50, 0.72);
      vec3 cinderBlock = vec3(0.18, 0.26, 0.44);
      vec3 neonFlash = vec3(0.08, 0.95, 0.75);

      vec3 baseCol = iType < 0.5 ? rebarGray : cinderBlock;
      baseCol = mix(baseCol, neonFlash, uBeat * uGlitchPhase * 0.8);

      // falling cubes fade to dark
      baseCol *= (1.0 - collapseT * 0.6);

      vCol = baseCol;
      vAlpha = 0.72 * (1.0 - assembleProg * 0.08) * (1.0 - collapseT * 0.7);

      vec4 mvPos = modelViewMatrix * vec4(p + position, 1.0);
      vNormal = normalize(normalMatrix * normal);
      vViewDir = normalize(-mvPos.xyz);
      gl_Position = projectionMatrix * mvPos;
    }
  `,
  fragmentShader: `
    varying vec3 vCol;
    varying float vAlpha;
    varying float vGlitch;
    varying vec3 vNormal;
    varying vec3 vViewDir;
    void main(){
      vec3 col = vCol;

      // Specular highlight (Phong) — luster
      vec3 L = normalize(vec3(0.5, 1.2, 0.6));
      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewDir);
      vec3 R = reflect(-L, N);
      float spec = pow(max(dot(V, R), 0.0), 48.0);

      // Fresnel rim — glassy edge glow
      float rim = pow(1.0 - max(dot(N, V), 0.0), 3.5);

      col += vec3(0.85, 0.92, 1.0) * spec * 0.65;
      col += vec3(0.4, 0.6, 1.0) * rim * 0.35;

      // Glitch flash stays
      col += vec3(0.1, 0.9, 0.7) * vGlitch * 0.5;

      gl_FragColor = vec4(col * vAlpha, vAlpha);
    }
  `,
  transparent: true,
  depthWrite: false
}), N);
scene.add(mesh);

const iOffset = new Float32Array(N * 3);
const iSeed = new Float32Array(N);
const iType = new Float32Array(N);
const iBirthTime = new Float32Array(N);
const iGen = new Float32Array(N);
const iVelocity = new Float32Array(N * 3);
const iState = new Float32Array(N); // 0=stable, 1=falling
mesh.geometry.setAttribute('iOffset', new THREE.InstancedBufferAttribute(iOffset, 3));
mesh.geometry.setAttribute('iSeed', new THREE.InstancedBufferAttribute(iSeed, 1));
mesh.geometry.setAttribute('iType', new THREE.InstancedBufferAttribute(iType, 1));
mesh.geometry.setAttribute('iBirthTime', new THREE.InstancedBufferAttribute(iBirthTime, 1));
mesh.geometry.setAttribute('iGen', new THREE.InstancedBufferAttribute(iGen, 1));
mesh.geometry.setAttribute('iVelocity', new THREE.InstancedBufferAttribute(iVelocity, 3));
mesh.geometry.setAttribute('iState', new THREE.InstancedBufferAttribute(iState, 1));

let voxelPool = [];
let activeCount = 0;

function regenerate(seed){
  let s = seed >>> 0;
  const rng = () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const str = expand('R', 4, rng);
  voxelPool = voxelTurtle(str);
  
  // center
  const bb = new THREE.Box3();
  for (const v of voxelPool) bb.expandByPoint(v.pos);
  const ctr = bb.getCenter(new THREE.Vector3());
  for (const v of voxelPool){
    v.pos.x -= ctr.x;
    v.pos.z -= ctr.z;
  }

  // limit to N
  if (voxelPool.length > N) voxelPool.length = N;
  activeCount = voxelPool.length;
  mesh.count = activeCount;

  const now = performance.now() / 1000;
  for (let i = 0; i < activeCount; i++){
    const v = voxelPool[i];
    iOffset[i*3]   = v.pos.x;
    iOffset[i*3+1] = v.pos.y;
    iOffset[i*3+2] = v.pos.z;
    iSeed[i] = v.seed;
    iType[i] = v.type === 'room' ? 0 : 1;
    iBirthTime[i] = now + i * 0.0008; // staggered assembly
    iGen[i] = v.gen;
    iVelocity[i*3]   = (v.seed - 0.5) * 0.4;
    iVelocity[i*3+1] = 0;
    iVelocity[i*3+2] = (v.seed * 0.7 - 0.35) * 0.4;
    iState[i] = 0;
  }
  mesh.geometry.attributes.iOffset.needsUpdate = true;
  mesh.geometry.attributes.iSeed.needsUpdate = true;
  mesh.geometry.attributes.iType.needsUpdate = true;
  mesh.geometry.attributes.iBirthTime.needsUpdate = true;
  mesh.geometry.attributes.iGen.needsUpdate = true;
  mesh.geometry.attributes.iVelocity.needsUpdate = true;
  mesh.geometry.attributes.iState.needsUpdate = true;
}

regenerate(Math.floor(Math.random() * 1e9));

// beat-driven collapse
let lastBeatTime = 0;
const BEAT_INTERVAL = 4.2; // seconds between collapse waves

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const now = performance.now();
  const elapsed = (now - start) / 1000;
  mesh.material.uniforms.uTime.value = elapsed;

  // beat pulse
  const timeSinceBeat = elapsed - lastBeatTime;
  if (timeSinceBeat > BEAT_INTERVAL){
    lastBeatTime = elapsed;
    // trigger collapse for 30% of walls
    for (let i = 0; i < activeCount; i++){
      if (iType[i] > 0.5 && iSeed[i] < 0.3){
        iState[i] = 0; // reset to trigger new fall
      }
    }
  }

  const beatPhase = timeSinceBeat / BEAT_INTERVAL;
  const beatPulse = Math.pow(Math.max(0, 1 - beatPhase), 2.5);
  mesh.material.uniforms.uBeat.value = beatPulse;

  // glitch phase: high-frequency bursts
  const glitchCycle = Math.sin(elapsed * 2.3) * 0.5 + 0.5;
  const glitchBurst = Math.pow(glitchCycle, 4);
  mesh.material.uniforms.uGlitchPhase.value = glitchBurst;

  // advance collapse state
  for (let i = 0; i < activeCount; i++){
    if (iType[i] > 0.5 && timeSinceBeat < 2.0){
      iState[i] = Math.min(1, iState[i] + 0.016);
    }
  }
  mesh.geometry.attributes.iState.needsUpdate = true;

  // camera orbit
  const orbitAngle = elapsed * 0.08;
  const radius = 32;
  camera.position.x = Math.cos(orbitAngle) * radius;
  camera.position.z = Math.sin(orbitAngle) * radius;
  camera.position.y = 18 + Math.sin(elapsed * 0.15) * 3;
  controls.target.y = 6 + Math.cos(elapsed * 0.12) * 2;
  controls.update();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
