<title>no9 · Mohr hypercube projection</title>
<!-- MOTION: rotation, intensity: calm -->
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>

<body>
<div class="id">no9</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── MANFRED MOHR: 8D hypercube projected to 3D ── */
/* P-411 'space.color' series vocabulary: selective edge rendering,
   saturated primaries, slow n-dimensional rotation, plotter-precise lines */

const DIM = 8;
const N_VERTICES = Math.pow(2, DIM);

/* Generate 8D hypercube vertices: each vertex is a corner (0 or 1)^8 */
function generateHypercubeVertices(){
  const verts = [];
  for (let i = 0; i < N_VERTICES; i++){
    const v = [];
    for (let d = 0; d < DIM; d++){
      v.push((i >> d) & 1 ? 1 : -1);
    }
    verts.push(v);
  }
  return verts;
}

/* Generate edges: connect vertices that differ in exactly one dimension */
function generateEdges(vertices){
  const edges = [];
  for (let i = 0; i < vertices.length; i++){
    for (let j = i+1; j < vertices.length; j++){
      let diff = 0;
      for (let d = 0; d < DIM; d++){
        if (vertices[i][d] !== vertices[j][d]) diff++;
      }
      if (diff === 1){
        edges.push([i, j]);
      }
    }
  }
  return edges;
}

/* Random orthonormal projection from R^8 → R^3 via Gram-Schmidt */
function randomProjection(rng){
  const basis = [];
  for (let i = 0; i < 3; i++){
    let v = [];
    for (let d = 0; d < DIM; d++) v.push(rng() * 2 - 1);
    /* Gram-Schmidt orthogonalize against previous basis vectors */
    for (let j = 0; j < i; j++){
      let dot = 0;
      for (let d = 0; d < DIM; d++) dot += v[d] * basis[j][d];
      for (let d = 0; d < DIM; d++) v[d] -= dot * basis[j][d];
    }
    /* Normalize */
    let len = Math.sqrt(v.reduce((a,b)=>a+b*b,0));
    if (len < 1e-6) len = 1;
    v = v.map(x => x/len);
    basis.push(v);
  }
  return basis;
}

function projectVertex(v, basis){
  const out = [0, 0, 0];
  for (let i = 0; i < 3; i++){
    for (let d = 0; d < DIM; d++){
      out[i] += v[d] * basis[i][d];
    }
  }
  return out;
}

/* Givens rotation in a random 2-plane of R^8 */
function givensRotation(angle, plane, dim){
  const [p, q] = plane;
  const c = Math.cos(angle), s = Math.sin(angle);
  return (v) => {
    const u = [...v];
    const vp = v[p], vq = v[q];
    u[p] = c * vp - s * vq;
    u[q] = s * vp + c * vq;
    return u;
  };
}

/* Mohr P-411 edge selection rule: keep ~40% of edges, chosen by vertex-index parity/sum rules */
function edgeSelectionRule(i, j, rng){
  const sum = i + j;
  const xor = i ^ j;
  /* Rule: keep if (sum % 7 < 3) OR (xor % 5 === 0) */
  /* This creates asymmetric clusters reminiscent of Mohr's selective projections */
  return (sum % 7 < 3) || (xor % 5 === 0);
}

/* ── Scene setup ── */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 18);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

/* ── RNG seeded deterministic ── */
let seed = 0x5A7E;
function rng(){
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}

/* ── Build hypercube ── */
const hypercubeVertices = generateHypercubeVertices();
const allEdges = generateEdges(hypercubeVertices);
const selectedEdges = allEdges.filter(([i,j]) => edgeSelectionRule(i, j, rng));

const projectionBasis = randomProjection(rng);

/* Pick a random 2-plane for rotation in R^8 */
const rotPlaneA = Math.floor(rng() * DIM);
let rotPlaneB = Math.floor(rng() * (DIM - 1));
if (rotPlaneB >= rotPlaneA) rotPlaneB++;
const rotPlane = [rotPlaneA, rotPlaneB];

/* Mohr P-411 palette: saturated primaries + white */
const PALETTE = [
  new THREE.Color(0xff0000), // red
  new THREE.Color(0x0000ff), // blue
  new THREE.Color(0xffff00), // yellow
  new THREE.Color(0xffffff), // white
];

/* Assign colors per edge based on vertex-index arithmetic (Mohr's procedural color logic) */
function edgeColor(i, j){
  const idx = (i * 7 + j * 11) % PALETTE.length;
  return PALETTE[idx];
}

/* ── Build line geometry ── */
const lineMat = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 1 });
const lineGeom = new THREE.BufferGeometry();
const posArray = new Float32Array(selectedEdges.length * 2 * 3);
const colArray = new Float32Array(selectedEdges.length * 2 * 3);

function updateProjection(angle){
  const rot = givensRotation(angle, rotPlane, DIM);
  const rotatedVerts = hypercubeVertices.map(rot);
  const projectedVerts = rotatedVerts.map(v => projectVertex(v, projectionBasis));

  for (let e = 0; e < selectedEdges.length; e++){
    const [i, j] = selectedEdges[e];
    const a = projectedVerts[i];
    const b = projectedVerts[j];
    const base = e * 6;
    posArray[base]     = a[0] * 3.5;
    posArray[base + 1] = a[1] * 3.5;
    posArray[base + 2] = a[2] * 3.5;
    posArray[base + 3] = b[0] * 3.5;
    posArray[base + 4] = b[1] * 3.5;
    posArray[base + 5] = b[2] * 3.5;

    const col = edgeColor(i, j);
    colArray[base]     = col.r;
    colArray[base + 1] = col.g;
    colArray[base + 2] = col.b;
    colArray[base + 3] = col.r;
    colArray[base + 4] = col.g;
    colArray[base + 5] = col.b;
  }
  lineGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  lineGeom.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
  lineGeom.attributes.position.needsUpdate = true;
}

updateProjection(0);
const lines = new THREE.LineSegments(lineGeom, lineMat);
scene.add(lines);

/* ── Vertex dots (optional, minimal, white) ── */
const dotGeom = new THREE.BufferGeometry();
const dotPos = new Float32Array(N_VERTICES * 3);
const dotMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, sizeAttenuation: false });

function updateDots(angle){
  const rot = givensRotation(angle, rotPlane, DIM);
  const rotatedVerts = hypercubeVertices.map(rot);
  const projectedVerts = rotatedVerts.map(v => projectVertex(v, projectionBasis));
  for (let i = 0; i < N_VERTICES; i++){
    const p = projectedVerts[i];
    dotPos[i*3]   = p[0] * 3.5;
    dotPos[i*3+1] = p[1] * 3.5;
    dotPos[i*3+2] = p[2] * 3.5;
  }
  dotGeom.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
  dotGeom.attributes.position.needsUpdate = true;
}

updateDots(0);
const dots = new THREE.Points(dotGeom, dotMat);
scene.add(dots);

/* ── Animation: slow rotation in the chosen 2-plane ── */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const start = performance.now();
function loop(){
  const elapsed = (performance.now() - start) / 1000;
  const angle = elapsed * 0.15; // slow hypercube tumble
  updateProjection(angle);
  updateDots(angle);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
<div id="piece-ctrl" style="position:fixed;top:10px;right:10px;z-index:999;display:flex;align-items:center;gap:6px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;"><button id="pc-like" title="keep this direction" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(201,168,106,0.7);cursor:pointer;font-size:13px;line-height:1">♥</button><button id="pc-dismiss" title="drop from pool" style="background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;color:rgba(215,107,90,0.7);cursor:pointer;font-size:13px;line-height:1">✕</button><input id="pc-input" type="text" maxlength="200" placeholder="What to change…"style="width:160px;background:rgba(0,0,0,0.6);color:rgba(255,255,255,0.8);border:1px solid rgba(255,255,255,0.13);border-radius:3px;padding:4px 8px;font-family:inherit;font-size:11px;outline:none"onfocus="this.style.borderColor='rgba(201,168,106,0.6)'"onblur="this.style.borderColor='rgba(255,255,255,0.13)'"><button id="pc-submit" title="Generate iteration" style="background:rgba(0,0,0,0.55);border:1px solid rgba(201,168,106,0.4);border-radius:3px;padding:4px 10px;color:rgba(201,168,106,0.9);cursor:pointer;font-size:11px;line-height:1">→</button></div>
<script>
(function(){
  var _pid=document.querySelector('.id')||{textContent:''};
  var pid=_pid.textContent.trim()||location.pathname.split('/').filter(Boolean).pop();
  var FKEY='particle_art_favorites',DKEY='particle_art_dismissed';
  function _set(key,id){try{var s=new Set(JSON.parse(localStorage.getItem(key)||'[]'));s.add(id);localStorage.setItem(key,JSON.stringify([...s]));return true;}catch(e){return false;}}
  document.getElementById('pc-like').onclick=function(){_set(FKEY,pid);this.style.color='#c9a86a';};
  document.getElementById('pc-dismiss').onclick=function(){_set(DKEY,pid);this.style.color='#d76b5a';this.style.borderColor='rgba(215,107,90,0.5)';goNext();};  function goNext(){fetch('/lineage.json?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(data){var dismissed=new Set(JSON.parse(localStorage.getItem(DKEY)||'[]'));var pieces=(data.pieces||[]).filter(function(p){return !dismissed.has(p.id);});var idx=pieces.findIndex(function(p){return p.id===pid;});var next=idx>=0&&idx+1<pieces.length?pieces[idx+1]:null;if(next)location.href='/pieces/'+next.id+'/';else location.href='/index.html';}).catch(function(){location.href='/index.html';});}
  document.getElementById('pc-close').onclick=function(){window.parent!==window?window.parent.postMessage({type:"dismiss-and-next"},"*"):history.back();};
  document.getElementById('pc-input').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pc-submit').click();});
  document.getElementById('pc-submit').onclick=function(){
    var txt=document.getElementById('pc-input').value.trim();
    if(!txt)return;
    var btn=this;btn.textContent='…';btn.disabled=true;
    var since=new Date();
    fetch('/api/mutate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({parent_id:pid,directive:txt})})
    .then(function(r){return r.json();})
    .then(function(d){
      var jobId=d.job_id||'';
      var qs='?a='+pid+(jobId?'&job='+jobId:'')+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    })
    .catch(function(){
      var qs='?a='+pid+'&directive='+encodeURIComponent(txt);
      location.href='/compare'+qs;
    });
  };
})();
</script>
