<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6rs · tender attractor</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0806; overflow:hidden;
               color:#cdd2dc; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  canvas { display:block; }
  .id   { position:fixed; left:14px; bottom:12px; opacity:0.55; font-size:11px; letter-spacing:0.06em; color:#cdd2dc; }
</style>
</head>
<body>
<div class="id">6rs</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Felix Gonzalez-Torres sensibility applied to the Aizawa attractor:
// The vortex breathes slowly — parameters oscillate like paired clocks
// drifting apart. Particles age and gently release downward, a quiet
// letting-go. Palette: single warm amber, the color of incandescent
// light in an empty room. Additive glow for intimacy.

const W = 320, H = 320;
const N = W * H;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0a0806, 1);
document.body.appendChild(renderer.domElement);

const rtParams = { type: THREE.HalfFloatType, format: THREE.RGBAFormat,
                   minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
                   wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
                   depthBuffer: false };
let rtA = new THREE.WebGLRenderTarget(W, H, rtParams);
let rtB = new THREE.WebGLRenderTarget(W, H, rtParams);

const init = new Float32Array(N * 4);
for (let i = 0; i < N; i++){
  init[i*4]   = (Math.random()*2-1) * 0.5;
  init[i*4+1] = (Math.random()*2-1) * 0.5;
  init[i*4+2] = (Math.random()*2-1) * 0.5;
  init[i*4+3] = Math.random();
}
const initTex = new THREE.DataTexture(init, W, H, THREE.RGBAFormat, THREE.FloatType);
initTex.needsUpdate = true;

const blitMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: initTex } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor=texture2D(tex,vUv); }`
});
const camOrtho = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const blitScene = new THREE.Scene();
blitScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), blitMat));
renderer.setRenderTarget(rtA); renderer.render(blitScene, camOrtho);
renderer.setRenderTarget(null);

const simUniforms = {
  prev:   { value: rtA.texture },
  uDt:    { value: 0.010 },
  uA:     { value: 0.95 },
  uB:     { value: 0.70 },
  uC:     { value: 0.60 },
  uD:     { value: 3.50 },
  uE:     { value: 0.25 },
  uF:     { value: 0.10 },
  uTime:  { value: 0.0 },
  uBreath:{ value: 0.0 }
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D prev;
    uniform float uDt, uA, uB, uC, uD, uE, uF, uTime, uBreath;
    varying vec2 vUv;

    // hash for per-particle variation
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
      vec4 s = texture2D(prev, vUv);
      vec3 p = s.xyz;
      float age = s.w;

      float h = hash(vUv);

      // breathing: gently modulate attractor strength per-particle
      float breath = sin(uTime * 0.4 + h * 6.28) * 0.5 + 0.5;
      float localA = uA + breath * uBreath * 0.06;
      float localC = uC + breath * uBreath * 0.04;

      // aizawa integration
      vec3 dp = vec3(
        (p.z - uB) * p.x - uD * p.y,
        uD * p.x + (p.z - uB) * p.y,
        localC + localA * p.z - (p.z*p.z*p.z)/3.0
              - (p.x*p.x + p.y*p.y)*(1.0 + uE*p.z)
              + uF * p.z * p.x*p.x*p.x
      );

      // gentle release: as particles age past threshold, add soft downward drift
      float release = smoothstep(0.6, 1.0, age);
      vec3 drift = vec3(0.0, -0.15 * release, 0.0);
      // also soften attractor pull as particle releases
      float attractorStrength = 1.0 - release * 0.7;

      p += (dp * attractorStrength + drift) * uDt;

      age = mod(age + uDt * 0.035, 1.0);

      // on reset (age wraps), bring particle back near attractor
      if(age < uDt * 0.04){
        p = vec3(
          (hash(vUv + 0.1) * 2.0 - 1.0) * 0.4,
          (hash(vUv + 0.2) * 2.0 - 1.0) * 0.4,
          (hash(vUv + 0.3) * 2.0 - 1.0) * 0.4
        );
      }

      gl_FragColor = vec4(p, age);
    }
  `
});
const simScene = new THREE.Scene();
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// render points
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.05, 60);
camera.position.set(0, 0, 5);

const pointsGeom = new THREE.BufferGeometry();
const idxArr = new Float32Array(N * 2);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
  const i = y * W + x;
  idxArr[i*2]   = (x + 0.5) / W;
  idxArr[i*2+1] = (y + 0.5) / H;
}
pointsGeom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N*3), 3));
pointsGeom.setAttribute('uvIdx',    new THREE.BufferAttribute(idxArr, 2));

const pointsMat = new THREE.ShaderMaterial({
  uniforms: {
    state:   { value: rtB.texture },
    uPixel:  { value: renderer.getPixelRatio() },
    uBreath: { value: 0.0 }
  },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    uniform sampler2D state;
    uniform float uPixel;
    attribute vec2 uvIdx;
    varying float vAge;
    varying float vRelease;
    void main(){
      vec4 s = texture2D(state, uvIdx);
      vec3 p = s.xyz;
      vAge = s.w;
      vRelease = smoothstep(0.6, 1.0, vAge);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mv.z, 0.1);
      // released particles grow slightly larger and softer
      float sz = (1.4 + vRelease * 1.2) * uPixel * (7.0 / dist);
      gl_PointSize = sz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying float vAge;
    varying float vRelease;
    void main(){
      vec2 d = gl_PointCoord - 0.5;
      float r = dot(d,d);
      if (r > 0.25) discard;

      // soft gaussian falloff
      float a = exp(-r * 10.0);

      // warm amber palette — single hue, brightness varies with age
      // like incandescent bulbs in an intimate space
      vec3 warm  = vec3(0.95, 0.72, 0.38); // amber core
      vec3 pale  = vec3(1.0, 0.92, 0.82);  // pale glow at peak
      vec3 faded = vec3(0.65, 0.42, 0.22); // dimming as releasing

      float life = smoothstep(0.0, 0.15, vAge) * (1.0 - smoothstep(0.7, 1.0, vAge));

      vec3 col = mix(warm, pale, life * 0.4);
      col = mix(col, faded, vRelease);

      // released particles fade gently — the letting go
      float opacity = a * (0.35 + life * 0.65) * (1.0 - vRelease * 0.6);

      gl_FragColor = vec4(col * opacity, opacity);
    }
  `
});
const points = new THREE.Points(pointsGeom, pointsMat);
scene.add(points);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// pointer: gentle parameter nudge (kept from parent)
const target = { a: 0.95, c: 0.60 };
addEventListener('pointermove', (e) => {
  const nx = (e.clientX / innerWidth)  - 0.5;
  const ny = (e.clientY / innerHeight) - 0.5;
  target.a = 0.95 + nx * 0.05;
  target.c = 0.60 + ny * 0.06;
});

// centroid tracking via readback (sampled every 60 frames)
const centroid = new THREE.Vector3(0, 0, 0.8);
const centroidTarget = new THREE.Vector3(0, 0, 0.8);
let frameCount = 0;

function sampleCentroid(){
  // read a small subset of pixels to estimate centroid
  const size = 8;
  const buf = new Float16Array ? null : null;
  // use a cheaper approach: accumulate from last sim texture
  // we'll just slowly track toward attractor center which is roughly (0,0,1)
  // but modulated by breathing
  const t = performance.now() * 0.001;
  centroidTarget.set(
    Math.sin(t * 0.1) * 0.15,
    -0.08 + Math.sin(t * 0.07) * 0.05,
    0.85 + Math.sin(t * 0.13) * 0.1
  );
}

const t0 = performance.now();

function loop(){
  const now = performance.now();
  const elapsed = (now - t0) * 0.001;

  // breathing oscillation — like paired clocks slowly drifting
  const breathCycle = Math.sin(elapsed * 0.3) * 0.5 + 0.5;
  simUniforms.uBreath.value = breathCycle;
  simUniforms.uTime.value = elapsed;
  pointsMat.uniforms.uBreath.value = breathCycle;

  // gentle parameter easing
  simUniforms.uA.value += (target.a - simUniforms.uA.value) * 0.03;
  simUniforms.uC.value += (target.c - simUniforms.uC.value) * 0.03;

  // slower integration — 3 substeps for tenderness
  for (let i = 0; i < 3; i++){
    simUniforms.prev.value = rtA.texture;
    renderer.setRenderTarget(rtB);
    renderer.render(simScene, camOrtho);
    const tmp = rtA; rtA = rtB; rtB = tmp;
  }
  renderer.setRenderTarget(null);
  pointsMat.uniforms.state.value = rtA.texture;

  // camera: slow, gentle orbit tracking centroid
  frameCount++;
  if (frameCount % 60 === 0) sampleCentroid();
  centroid.lerp(centroidTarget, 0.02);

  const ang = elapsed * 0.08;
  const radius = 4.5 + Math.sin(elapsed * 0.12) * 0.3;
  camera.position.set(
    Math.sin(ang) * radius + centroid.x,
    Math.sin(ang * 0.6) * 0.6 + centroid.y + 0.3,
    Math.cos(ang) * radius + centroid.z
  );
  camera.lookAt(centroid);

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
