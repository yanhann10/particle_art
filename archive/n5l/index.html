<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>n5l</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#06050a; overflow:hidden; }
canvas { display:block; }
#id { position:fixed; bottom:12px; left:14px; font-family:ui-monospace,monospace;
      font-size:11px; color:#cdd2dc; opacity:0.55; pointer-events:none; }
</style>
<script type="importmap">{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}</script>
</head>
<body>
<div id="id">n5l</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/*
  INTENTION: two translucent nested houses — the remembered home living inside the new one
  ARC: 0s → lavender outer shell and warm-cream inner co-exist quietly, two architectures
       in the same space; 30s → inner house breathes, its windows and door more specific
       and vivid than anything in the outer; 60s → memory dust drifts upward out of the
       inner shell, dissolving at the outer boundary — presence outlasting presence
  HOOK: the inner house has windows and a door ajar; the outer has none —
        what we remember of home is always the detail, never the envelope.
  After Do Ho Suh "Home Within Home" (2009–ongoing).
*/

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
camera.position.set(2.4, 2.2, 4.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x06050a);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minPolarAngle = Math.PI * 0.12;
controls.maxPolarAngle = Math.PI * 0.82;
controls.update();

// ── geometry helpers ──────────────────────────────────────────────────────────

function segs(pairs, color, opacity) {
  // pairs: flat array of [x,y,z, x,y,z, ...] — consecutive pairs = one segment
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pairs, 3));
  return new THREE.LineSegments(geo,
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
}

function boxEdges(w, h, d, color, opacity) {
  return new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false })
  );
}

// translucent fabric volume — Do Ho Suh uses sheer fabric, not just wireframe
function boxFabric(w, h, d, color, opacity) {
  return new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshBasicMaterial({
      color, transparent: true, opacity,
      side: THREE.DoubleSide, depthWrite: false,
    })
  );
}

// ── outer house — lavender, sparse, uncertain ─────────────────────────────────
// the new envelope: just walls and roofline, no interior knowledge
const outer = new THREE.Group();
const OC = 0xc0aee0, OA = 0.68;

outer.add(boxFabric(2.4, 2.1, 2.4, OC, 0.07));
outer.add(boxEdges(2.4, 2.1, 2.4, OC, OA));

{
  const ty = 1.05, rh = 1.05, hw = 1.22;
  outer.add(segs([
    -hw,ty,0,   hw,ty,0,
    -hw,ty,0,  -hw,ty-rh,-hw,
    -hw,ty,0,  -hw,ty-rh, hw,
     hw,ty,0,   hw,ty-rh,-hw,
     hw,ty,0,   hw,ty-rh, hw,
    -hw,ty-rh,-hw,  hw,ty-rh,-hw,
    -hw,ty-rh, hw,  hw,ty-rh, hw,
  ], OC, OA));
}

scene.add(outer);

// ── inner house — warm cream, dense, remembered ───────────────────────────────
// the home you carry: lower, wider, with windows and a door ajar
const inner = new THREE.Group();
const IC = 0xfff6e0, IA = 1.0;

inner.add(boxFabric(1.7, 1.55, 1.7, IC, 0.11));
inner.add(boxEdges(1.7, 1.55, 1.7, IC, IA));

// roof — gentler pitch, more settled
{
  const ty = 0.775, rh = 0.68, hw = 0.88;
  inner.add(segs([
    -hw,ty,0,   hw,ty,0,
    -hw,ty,0,  -hw,ty-rh,-hw,
    -hw,ty,0,  -hw,ty-rh, hw,
     hw,ty,0,   hw,ty-rh,-hw,
     hw,ty,0,   hw,ty-rh, hw,
    -hw,ty-rh,-hw,  hw,ty-rh,-hw,
    -hw,ty-rh, hw,  hw,ty-rh, hw,
  ], IC, IA));
}

// two windows, front face (z = -0.86) — cross-pane, specific
{
  const fz = -0.861, WA = 0.72;
  inner.add(segs([
    // left window
    -0.52,0.18,fz,  -0.12,0.18,fz,
    -0.12,0.18,fz,  -0.12,0.52,fz,
    -0.12,0.52,fz,  -0.52,0.52,fz,
    -0.52,0.52,fz,  -0.52,0.18,fz,
    -0.52,0.35,fz,  -0.12,0.35,fz,  // horizontal cross
    -0.32,0.18,fz,  -0.32,0.52,fz,  // vertical cross
    // right window
     0.12,0.18,fz,   0.52,0.18,fz,
     0.52,0.18,fz,   0.52,0.52,fz,
     0.52,0.52,fz,   0.12,0.52,fz,
     0.12,0.52,fz,   0.12,0.18,fz,
     0.12,0.35,fz,   0.52,0.35,fz,
     0.32,0.18,fz,   0.32,0.52,fz,
  ], IC, WA));
}

// door — front face, slightly ajar (the way a remembered door always is)
{
  const fz = -0.861, DA = 0.82;
  const dj = 0.22; // ajar depth
  inner.add(segs([
    // door frame
    -0.20,-0.775,fz,  -0.20, 0.10,fz,
    -0.20, 0.10,fz,    0.20, 0.10,fz,
     0.20, 0.10,fz,    0.20,-0.775,fz,
    // door panel, ajar — hinged left, open inward right
     0.20, 0.10,fz,    0.20-dj, 0.10,fz-dj,
     0.20,-0.775,fz,   0.20-dj,-0.775,fz-dj,
     0.20-dj, 0.10,fz-dj,  0.20-dj,-0.775,fz-dj,
    // door knob hint — small horizontal tick
     0.16,-0.24,fz,    0.20-dj+0.02,-0.24,fz-dj*0.9,
  ], IC, DA));
}

inner.position.y = -0.14;
scene.add(inner);

// ── floor grid — faint horizon, grounds the two houses in shared space ────────
{
  const gSize = 3.5, gDiv = 10, step = gSize / gDiv, pts = [];
  for (let i = 0; i <= gDiv; i++) {
    const v = -gSize/2 + i * step;
    pts.push(-gSize/2,-1.055,v,  gSize/2,-1.055,v);
    pts.push(v,-1.055,-gSize/2,  v,-1.055, gSize/2);
  }
  scene.add(segs(pts, 0x6858a0, 0.18));
}

// ── memory dust — spawns from inner surface, drifts upward, dissolves ─────────
const DUST = 2800;
const dPos = new Float32Array(DUST * 3);
const dVel = new Float32Array(DUST * 3);
const dAge = new Float32Array(DUST);    // 0=young 1=old
const dMaxAge = new Float32Array(DUST);

function spawnDust(i) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  const r  = 0.52 + Math.random() * 0.18;
  dPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
  dPos[i*3+1] = r * Math.sin(ph) * Math.sin(th) - 0.14;
  dPos[i*3+2] = r * Math.cos(ph);
  dVel[i*3]   = (Math.random() - 0.5) * 0.0025;
  dVel[i*3+1] = 0.004 + Math.random() * 0.005;
  dVel[i*3+2] = (Math.random() - 0.5) * 0.0025;
  dAge[i]     = 0;
  dMaxAge[i]  = 180 + Math.random() * 220;
}
for (let i = 0; i < DUST; i++) { spawnDust(i); dAge[i] = Math.random() * dMaxAge[i]; }

const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dustMat = new THREE.PointsMaterial({
  color: 0xd4c8b0, size: 0.038,
  transparent: true, opacity: 0.65, depthWrite: false,
});
scene.add(new THREE.Points(dustGeo, dustMat));

// ── animation loop ────────────────────────────────────────────────────────────
let t = 0;
(function tick() {
  requestAnimationFrame(tick);
  t += 0.007;

  // inner house breathes — the remembered home is still alive
  const breath = 1.0 + 0.038 * Math.sin(t * 0.62);
  inner.scale.setScalar(breath);
  inner.rotation.y = Math.sin(t * 0.19) * 0.022;

  // dust rises and fades
  const pa = dustGeo.attributes.position.array;
  for (let i = 0; i < DUST; i++) {
    dAge[i]++;
    pa[i*3]   += dVel[i*3];
    pa[i*3+1] += dVel[i*3+1];
    pa[i*3+2] += dVel[i*3+2];
    if (dAge[i] >= dMaxAge[i]) spawnDust(i);
  }
  dustGeo.attributes.position.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
