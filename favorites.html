<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particle_art · favorites ♥</title>
<style>
  :root {
    --bg: #0a0a0d;
    --panel: #111116;
    --ink: #e8e6df;
    --muted: #8a8a93;
    --line: #1f1f26;
    --accent: #c9a86a;
    --hot: #d76b5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    line-height: 1.45;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 1.2rem 1.8rem 0.9rem;
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 0.8rem;
  }
  h1 {
    margin: 0; font-size: 1.05rem; font-weight: 600;
    letter-spacing: 0.04em;
  }
  header .meta {
    color: var(--muted); font-size: 0.84rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  header .meta b { color: var(--accent); font-weight: 500; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.2rem;
    padding: 1.4rem 1.8rem 3rem;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, border-color 0.2s ease,
                box-shadow 0.2s ease;
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 8px 22px rgba(0,0,0,0.4);
  }
  .thumb-wrap {
    width: 100%; aspect-ratio: 16/10;
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1a1a25 0%, #0e0e14 100%);
  }
  .thumb-wrap img {
    width: 100%; height: 100%;
    display: block; object-fit: cover;
  }
  .thumb-wrap .placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 0.4rem;
    background: linear-gradient(135deg, #18182a 0%, #0a0a14 60%, #1f0d1f 100%);
  }
  .thumb-wrap .placeholder .glyph {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 2.4rem; font-weight: 300; color: var(--accent);
    letter-spacing: 0.08em;
    opacity: 0.6;
  }
  .thumb-wrap .placeholder .sub {
    font-size: 0.7rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .meta-row {
    padding: 0.65rem 0.9rem 0.75rem;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .meta-row .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1.05rem; font-weight: 600;
    color: var(--accent); letter-spacing: 0.06em;
  }
  .meta-row .dir {
    font-size: 0.74rem; color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .gen-pill {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.55); color: var(--muted);
    font-size: 0.62rem; padding: 2px 6px; border-radius: 3px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.04em;
  }
  .star-btn {
    position: absolute; top: 8px; left: 8px;
    width: 20px; height: 20px;
    background: rgba(10,10,13,0.7); color: var(--muted);
    border: 1px solid var(--line); border-radius: 3px;
    cursor: pointer; font-size: 0.7rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
    z-index: 3; padding: 0;
  }
  .card:hover .star-btn { opacity: 1; }
  .star-btn:hover { border-color: #d4a84b; color: #d4a84b; background: rgba(212,168,75,0.15); }
  .star-btn.active { opacity: 1; color: #d4a84b; border-color: #d4a84b; background: rgba(212,168,75,0.2); }
  /* in-place modal */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none; z-index: 100;
  }
  .modal.show { display: block; }
  .modal iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: 0; background: #000;
  }
  .modal .top {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.8rem 1.2rem;
    background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    z-index: 2; pointer-events: none;
  }
  .modal .top .label {
    color: var(--ink); font-size: 0.85rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  .modal .top .label .code {
    color: var(--accent); font-weight: 600; margin-right: 0.6rem;
    font-size: 1rem;
  }
  .modal .close, .modal .nav {
    pointer-events: auto;
    background: rgba(0,0,0,0.6); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 14px; cursor: pointer;
    font-family: inherit; font-size: 0.82rem;
  }
  .modal .close:hover, .modal .nav:hover { border-color: var(--accent); color: var(--accent); }
  .modal .nav { padding: 6px 12px; min-width: 36px; }
  .modal .nav:disabled { opacity: 0.35; cursor: default; }
  .modal .nav:disabled:hover { border-color: var(--line); color: var(--ink); }
  .modal .top-actions { display: flex; gap: 0.4rem; align-items: center; pointer-events: none; }
  .modal .top-actions > * { pointer-events: auto; }
  .next-section {
    border-top: 1px solid var(--line);
    padding: 1.2rem 1.8rem 1.6rem;
  }
  .next-heading {
    color: var(--muted); font-size: 0.78rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    margin-bottom: 0.9rem; letter-spacing: 0.06em;
  }
  .next-heading b { color: var(--accent); font-weight: 500; }
  footer {
    padding: 1rem 1.8rem 2rem;
    color: var(--muted); font-size: 0.75rem;
    border-top: 1px solid var(--line);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.1rem 0;
  }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
  .empty-state {
    grid-column: 1 / -1;
    padding: 3rem 0;
    color: var(--muted);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.82rem;
  }
  @media (max-width: 540px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
      padding: 1rem 1rem 2rem;
    }
    header { padding: 0.9rem 1rem 0.7rem; }
    .modal .top { flex-wrap: wrap; gap: 0.4rem; }
    .modal .top .label { flex: 0 0 100%; }
    .modal .close { font-size: 0.75rem; padding: 5px 10px; }
    .next-section { padding: 1rem 1rem 1.4rem; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>particle_art · favorites ♥</h1>
    <div class="meta"><span id="count">0</span> favorited · click ★ to promote to best</div>
  </div>
  <div class="meta">
    <a href="index.html" style="color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);">← front</a>
  </div>
</header>

<div class="grid" id="grid"></div>

<div class="modal" id="modal">
  <div class="top">
    <div class="label"><span class="code" id="modalCode"></span><span id="modalTitle"></span></div>
    <div class="top-actions">
      <button class="nav" id="modalPrev" title="previous · ←">‹</button>
      <button class="nav" id="modalNext" title="next · →">›</button>
      <button class="close" id="modalClose">close · esc</button>
    </div>
  </div>
  <iframe id="modalFrame" allow="camera; microphone; autoplay"></iframe>
</div>

<section class="next-section">
  <div class="next-heading">best ★ · <b id="starred-count">0</b> starred · promoted from favorites</div>
  <div>
    <a href="best.html" style="color:var(--accent);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:0.82rem;text-decoration:none;border-bottom:1px dotted var(--accent);">view best →</a>
  </div>
</section>

<footer>
  <a href="index.html">← front</a>
  <span style="margin:0 0.3rem">·</span><a href="best.html">best ★</a>
  <span style="margin:0 0.3rem">·</span><a href="https://github.com/yanhann10/particle_art" target="_blank">github · yanhann10/particle_art</a>
</footer>

<script>
let PIECES = [];
let CURRENT_IDX = -1;

const FAVORITES_KEY = 'particle_art_favorites';
const STARRED_KEY   = 'particle_art_starred';

function getFavorites() {
  try { return new Set(JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]')); }
  catch { return new Set(); }
}
function getStarred() {
  try { return new Set(JSON.parse(localStorage.getItem(STARRED_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveStarred(set) {
  localStorage.setItem(STARRED_KEY, JSON.stringify([...set]));
}
function toggleStarred(id, btn) {
  const stars = getStarred();
  if (stars.has(id)) {
    stars.delete(id);
    btn.classList.remove('active');
    btn.title = 'promote to best ★';
  } else {
    stars.add(id);
    btn.classList.add('active');
    btn.title = 'starred · in best ★';
  }
  saveStarred(stars);
  updateStarredCount();
}
function updateStarredCount() {
  const stars = getStarred();
  document.getElementById('starred-count').textContent = stars.size;
}

async function load() {
  const [res, prefsRes] = await Promise.all([
    fetch('lineage.json', { cache: 'no-cache' }),
    fetch('scripts/preferences.json', { cache: 'no-cache' }).catch(() => null),
  ]);
  if (!res.ok) { console.error('lineage.json fetch failed', res.status); return; }
  const lineage = await res.json();
  const prefs = (prefsRes && prefsRes.ok) ? await prefsRes.json() : {};
  const marks = prefs.marks || {};
  /* seed localStorage favorites from preferences.json */
  const prefsFavIds = Object.keys(marks).filter(id => marks[id].favorite === true);
  if (prefsFavIds.length) {
    const favSet = getFavorites();
    let changed = false;
    prefsFavIds.forEach(id => { if (!favSet.has(id)) { favSet.add(id); changed = true; } });
    if (changed) saveFavorites(favSet);
  }
  const favs = getFavorites();
  const stars = getStarred();
  PIECES = lineage.pieces.filter(p => favs.has(p.id));

  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = PIECES.length;
  updateStarredCount();

  if (!PIECES.length) {
    grid.innerHTML = '<div class="empty-state">nothing favorited yet — go to <a href="index.html" style="color:var(--accent);border-bottom:1px dotted var(--accent);">front</a> and click ♥ on pieces you like</div>';
    return;
  }

  for (const p of PIECES) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="thumbs/${p.id}.png" alt="${p.id}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="placeholder" style="display:none">
          <div class="glyph">${p.id}</div>
          <div class="sub">${p.direction || ''}</div>
        </div>
        ${p.generation > 0 ? `<div class="gen-pill">g${p.generation}</div>` : ''}
      </div>
      <div class="meta-row">
        <span class="code">${p.id}</span>
        <span class="dir">${p.title || p.direction || ''}</span>
      </div>
      <button class="star-btn${stars.has(p.id) ? ' active' : ''}"
        title="${stars.has(p.id) ? 'starred · in best ★' : 'promote to best ★'}"
        aria-label="star ${p.id}">★</button>
    `;
    card.querySelector('.star-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleStarred(p.id, e.currentTarget);
    });
    card.addEventListener('click', () => openPiece(p));
    grid.appendChild(card);
  }
}

function openPiece(p) {
  const modal = document.getElementById('modal');
  const frame = document.getElementById('modalFrame');
  const code  = document.getElementById('modalCode');
  const title = document.getElementById('modalTitle');
  code.textContent  = p.id;
  title.textContent = p.title || p.direction || '';
  frame.src = `pieces/${p.id}/index.html`;
  modal.classList.add('show');
  history.replaceState(null, '', `#${p.id}`);
  CURRENT_IDX = PIECES.findIndex(x => x.id === p.id);
  updateNavButtons();
}
function updateNavButtons() {
  const prev = document.getElementById('modalPrev');
  const next = document.getElementById('modalNext');
  prev.disabled = CURRENT_IDX <= 0;
  next.disabled = CURRENT_IDX < 0 || CURRENT_IDX >= PIECES.length - 1;
}
function navStep(delta) {
  if (CURRENT_IDX < 0 || !PIECES.length) return;
  const next = CURRENT_IDX + delta;
  if (next < 0 || next >= PIECES.length) return;
  openPiece(PIECES[next]);
}
function closeModal() {
  const modal = document.getElementById('modal');
  document.getElementById('modalFrame').src = 'about:blank';
  modal.classList.remove('show');
  history.replaceState(null, '', location.pathname);
  CURRENT_IDX = -1;
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalPrev').addEventListener('click', (e) => { e.stopPropagation(); navStep(-1); });
document.getElementById('modalNext').addEventListener('click', (e) => { e.stopPropagation(); navStep(1); });
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target.id === 'modal') closeModal();
});
addEventListener('keydown', (e) => {
  const open = document.getElementById('modal').classList.contains('show');
  if (e.key === 'Escape') closeModal();
  else if (open && e.key === 'ArrowLeft')  { e.preventDefault(); navStep(-1); }
  else if (open && e.key === 'ArrowRight') { e.preventDefault(); navStep(1); }
});

load().then(() => {
  const id = location.hash.replace('#', '');
  if (id) {
    const p = PIECES.find(x => x.id === id);
    if (p) openPiece(p);
  }
});
</script>
</body>
</html>
